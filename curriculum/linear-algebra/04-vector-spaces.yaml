unit: vector-spaces
course: linear-algebra
module: "Vector Spaces & Transformations"
topics:
  - id: span-linear-combinations
    name: Linear Combinations and Span
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
      - id: matrix-vector-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing linear combinations
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Compute $2(1, 3) + 3(2, -1)$.'
            answer: "(8, 3)"
            solution_sketch: '$(2 + 6, 6 - 3)$.'
          - problem: 'Compute $-(2, 0, 1) + 2(1, 1, 1)$.'
            answer: "(0, 2, 1)"
          - problem: "Compute $3(1, -2) + 2(2, 3)$. Give the answer as (x, y)."
            answer: "(7, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Scale each vector by its coefficient: $3(1, -2) = (3, -6)$ and $2(2, 3) = (4, 6)$. Add the two results component by component: $(3 + 4, -6 + 6)$. The answer is (7, 0)."
          - problem: "Compute $-2(1, 0, 3) + 3(2, -1, 1)$. Give the answer as (x, y, z)."
            answer: "(4, -3, -3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Scale each vector first: $-2(1, 0, 3) = (-2, 0, -6)$ and $3(2, -1, 1) = (6, -3, 3)$. Then add component by component: $(-2 + 6, 0 - 3, -6 + 3)$. The answer is (4, -3, -3)."
          - problem: "Suppose $a(1, 2) + 4(1, -1) = (7, 2)$. Find the value of $a$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Scale the known vector: $4(1, -1) = (4, -4)$. Subtract it from the target on the right: $(7, 2) - (4, -4) = (3, 6)$. So $a(1, 2) = (3, 6)$, and both components force $a = 3$."
          - problem: "Find scalars $a$ and $b$ with $a(1, 2) + b(3, 1) = (5, 5)$. Give $a$ and $b$."
            answer: "a = 2; b = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The combination $a(1, 2) + b(3, 1)$ equals $(a + 3b, 2a + b)$, so matching the target gives the two equations $a + 3b = 5$ and $2a + b = 5$. From the first equation $a = 5 - 3b$; substituting into the second gives $10 - 5b = 5$, so $b = 1$ and then $a = 5 - 3 = 2$. The answer is a = 2; b = 1."
        constraints: "2-3 vectors in R^2 or R^3; coefficients in -3..3"
      - id: kp2
        name: Membership in simple spans
        key_prerequisites: [vectors-in-rn, matrix-vector-equations]
        exemplars:
          - problem: 'Is $(6, -2)$ in $\mathrm{span}\{(3, -1)\}$?'
            answer: "Yes: (6, -2) = 2(3, -1)"
            answer_contract: {kind: none}
            solution_sketch: '$(6,-2) = 2(3,-1)$, so it is a scalar multiple of the spanning vector and lies in the span.'
          - problem: 'Is $(2, 3)$ in $\mathrm{span}\{(1, 1)\}$?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'A multiple of $(1, 1)$ has equal components, but $2 \neq 3$.'
          - problem: 'Write $(5, 4)$ as a combination of $(1, 2)$ and $(3, 0)$.'
            answer: "(5, 4) = 2(1, 2) + 1(3, 0)"
            answer_contract: {kind: none}
            solution_sketch: 'Second components force $2c_1 = 4$, so $c_1 = 2$; then $3c_2 = 5 - 2 = 3$.'
        constraints: "single-vector spans decided by proportionality; two-vector cases have one coefficient forced immediately"
      - id: kp3
        name: Span as a geometric object
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Describe $\mathrm{span}\{(2, 4)\}$ geometrically.'
            answer: "The line y = 2x through the origin"
            answer_contract: {kind: none}
            solution_sketch: 'All multiples $t(2, 4)$ trace the line with direction $(2, 4)$, i.e. slope $2$.'
          - problem: 'What is $\mathrm{span}\{(1, 0), (0, 1)\}$?'
            answer: "All of R^2"
            answer_contract: {kind: none}
            solution_sketch: 'Every $(x, y)$ equals $x(1,0) + y(0,1)$.'
        constraints: "spans of 1-2 vectors in R^2; answers are geometric descriptions"
    diagnostic_exemplar:
      problem: 'Write $(4, 7)$ as a combination of $(1, 1)$ and $(1, 2)$.'
      answer: "(4, 7) = 1(1, 1) + 3(1, 2)"
      answer_contract: {kind: none}
      solution_sketch: '$c_1 + c_2 = 4$, $c_1 + 2c_2 = 7$: subtract to get $c_2 = 3$, then $c_1 = 1$.'
    anki_seeds:
      - front: '$\mathrm{span}\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$ is the set of all...'
        back: 'linear combinations $c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k$.'
        type: basic
      - front: 'Geometrically, the span of one nonzero vector is...'
        back: 'the line through the origin in that direction.'
        type: basic

  - id: subspace-test
    name: The Subspace Test
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: The zero-vector check
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: "Let $W = \\{(x, y) : 2x + 3y = 6\\}$ be a subset of $\\mathbb{R}^2$. Give the value of the left side $2x + 3y$ at the zero vector, and give the verdict of the zero-vector check for $W$."
            answer: "value = 0; verdict = fails"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "value"}, {"contract": {"kind": "label", "options": [["passes"], ["fails"]]}, "name": "verdict"}]}
            solution_sketch: "The zero vector of $\\mathbb{R}^2$ is $(0, 0)$. Step 1 (substitute the zero vector): $2(0) + 3(0) = 0$, so the left side takes the value 0. Step 2 (compare with the constant): the condition $2x + 3y = 6$ requires 6, and 0 is not 6, so the zero vector is not in $W$; a failed zero check settles that $W$ is not a subspace. The wrong verdict passes would wrongly treat 0 as equal to 6. The key is value = 0; verdict = fails."
          - problem: "Let $W = \\{(x, y) : y = 5x\\}$ be a subset of $\\mathbb{R}^2$. Give the value of the left side $y - 5x$ at the zero vector, and give the verdict of the zero-vector check for $W$."
            answer: "value = 0; verdict = passes"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "value"}, {"contract": {"kind": "label", "options": [["passes"], ["fails"]]}, "name": "verdict"}]}
            solution_sketch: "The zero vector of $\\mathbb{R}^2$ is $(0, 0)$. Step 1 (substitute the zero vector): $y - 5x = 0 - 5(0) = 0$, so the left side takes the value 0. Step 2 (compare with the constant): the condition $y = 5x$ rewritten as $y - 5x = 0$ requires 0, and 0 = 0 holds, so the zero vector is in $W$; a passed zero check only begins the subspace argument. The wrong verdict fails would need 0 and 0 to differ, which is impossible. The key is value = 0; verdict = passes."
          - problem: "Let $W = \\{(x, y) : 5x - y = c\\}$ be a subset of $\\mathbb{R}^2$, where $c$ is a constant. Find the value of $c$ for which $W$ contains the zero vector."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero vector of $\\mathbb{R}^2$ is $(0, 0)$. Step 1 (substitute the zero vector): the left side gives $5(0) - 0 = 0$. Step 2 (solve for the constant): the zero vector lies in $W$ exactly when $0 = c$, so $c = 0$. The key is 0."
          - problem: "Let $W = \\{(x, y) : x = 4y + 2\\}$ be a subset of $\\mathbb{R}^2$. The zero-vector check compares the two sides of the condition at the zero vector. Find the value that the right side $4y + 2$ takes at the zero vector."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero vector of $\\mathbb{R}^2$ is $(0, 0)$. Step 1 (substitute the zero vector into the right side): $4(0) + 2 = 2$. Step 2 (compare the sides): the left side $x$ gives 0, and $0 = 2$ is false, so the zero vector is not in $W$ and the zero check fails. The key is 2."
          - problem: "Let $W = \\{(x, y, z) : z = 2x - y + 5\\}$ be a subset of $\\mathbb{R}^3$. At the zero vector the two sides of the condition take values 0 and the value of $2x - y + 5$. Find the positive gap between the two sides at the zero vector."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero vector of $\\mathbb{R}^3$ is $(0, 0, 0)$. Step 1 (substitute the zero vector into the right side): $2(0) - 0 + 5 = 5$, while the left side $z$ gives 0. Step 2 (take the gap): the sides differ by $|5 - 0| = 5$, so the zero vector is not in $W$ and the zero check fails. The key is 5."
          - problem: "Let $W = \\{(x, y, z) : x + y + z = 4\\}$ be a subset of $\\mathbb{R}^3$. Give the zero vector of $\\mathbb{R}^3$ as (a, b, c), and give the verdict of the zero-vector check for $W$."
            answer: "zero = (0,0,0); verdict = fails"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "zero"}, {"contract": {"kind": "label", "options": [["passes"], ["fails"]]}, "name": "verdict"}]}
            solution_sketch: "Step 1 (identify the zero vector): in $\\mathbb{R}^3$ every coordinate is 0, so the zero vector is $(0, 0, 0)$. Step 2 (check membership): $x + y + z = 0 + 0 + 0 = 0$, and the condition $x + y + z = 4$ requires 4, so $W$ does not contain the zero vector and the zero check fails, settling that $W$ is not a subspace. The wrong verdict passes would wrongly treat 0 as equal to 4. The key is zero = (0,0,0); verdict = fails."
        constraints: "sets defined by one linear condition; the zero check settles or begins the argument"
      - id: kp2
        name: Closure checks and counterexamples
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: "Let $W = \\{(x, y) : x = 2y\\}$ be a subset of $\\mathbb{R}^2$. Test closure under addition with $u = (4, 2)$ and $v = (6, 3)$. State whether $W$ is a subspace of $\\mathbb{R}^2$, and give the sum $u + v$ as $(x, y)$."
            answer: "verdict = yes; sum = (10, 5)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "sum"}]}
            solution_sketch: "Zero-vector check: $(0,0)$ satisfies $x = 2y$, so $(0,0)$ lies in $W$. Addition closure: $u = (4,2)$ and $v = (6,3)$ satisfy the condition, and $u + v = (10,5)$ satisfies $10 = 2 \\cdot 5$. Scalar closure holds since $c \\cdot 2y = 2(cy)$. All three checks pass, so the answer is verdict = yes; sum = (10, 5)."
          - problem: "Let $W = \\{(x, y) : xy \\leq 0\\}$ be a subset of $\\mathbb{R}^2$. Test closure under addition with $u = (2, 0)$ and $v = (0, 3)$. State whether $W$ is a subspace of $\\mathbb{R}^2$, and give the sum $u + v$ as $(x, y)$."
            answer: "verdict = no; sum = (2, 3)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "sum"}]}
            solution_sketch: "Zero-vector check: $(0,0)$ has $xy = 0 \\leq 0$, so it lies in $W$. Addition closure: $u = (2,0)$ and $v = (0,3)$ lie in $W$, but $u + v = (2,3)$ has $xy = 6 > 0$, so addition fails and $(2,3)$ is the explicit counterexample. Hence $W$ is not a subspace, and the answer is verdict = no; sum = (2, 3)."
          - problem: "Let $W = \\{(x, y) : x^2 + y^2 \\leq 1\\}$ be a subset of $\\mathbb{R}^2$. Test closure under addition with $u = (1, 0)$ and $v = (0, 1)$. State whether $W$ is a subspace of $\\mathbb{R}^2$, and give the value of $x^2 + y^2$ at $u + v$."
            answer: "verdict = no; val = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "val"}]}
            solution_sketch: "Zero-vector check: $(0,0)$ gives $x^2 + y^2 = 0 \\leq 1$, so it lies in $W$. Addition closure: $u = (1,0)$ and $v = (0,1)$ lie in $W$, but $u + v = (1,1)$ gives $1 + 1 = 2 > 1$, a counterexample to closure. Hence the answer is verdict = no; val = 2."
          - problem: "Let $W = \\{(x, y) : y \\leq 0\\}$ be a subset of $\\mathbb{R}^2$. Test closure under scalar multiplication with $u = (1, -5)$ and $c = -2$. State whether $W$ is a subspace of $\\mathbb{R}^2$, and give $cu$ as $(x, y)$."
            answer: "verdict = no; p = (-2, 10)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "p"}]}
            solution_sketch: "Zero-vector check: $(0,0)$ has $y = 0 \\leq 0$, so it lies in $W$. Scalar closure: $u = (1,-5)$ lies in $W$, but $cu = -2 \\cdot (1,-5) = (-2,10)$ has $y = 10 > 0$, so scalar multiplication fails and $(-2,10)$ is the counterexample. Hence the answer is verdict = no; p = (-2, 10)."
          - problem: "Let $W = \\{(x, y) : x + y \\geq 2\\}$ be a subset of $\\mathbb{R}^2$. Check the three subspace conditions: containing the zero vector, closure under addition, and closure under scalar multiplication. Determine how many of the three conditions $W$ satisfies."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Zero-vector check: $(0,0)$ gives $x + y = 0 < 2$, so the zero-vector condition fails. Addition closure: if $u$ and $v$ each have coordinate sum at least 2, then $u + v$ has sum at least 4, so addition is closed and this condition holds. Scalar closure: $u = (2,1)$ lies in $W$ but $0.5u = (1, 0.5)$ has sum $1.5 < 2$, so it fails and only one condition holds. Therefore the answer is 1."
          - problem: "Let $W = \\{(x, y) : y = 2x + b\\}$, where $b$ is a real constant. Apply the subspace test, starting with the zero-vector condition. Determine the value of $b$ that makes $W$ a subspace of $\\mathbb{R}^2$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Zero-vector condition: $(0,0)$ lies in $W$ only if $0 = 2 \\cdot 0 + b$, which forces $b = 0$. With $b = 0$ the set is the line $y = 2x$ through the origin, and sums and scalar multiples of solutions again satisfy $y = 2x$. The required value is $b = 0$, so the answer is 0."
        constraints: "one linear or mildly nonlinear condition; failures shown by an explicit counterexample"
      - id: kp3
        name: Lines and planes through the origin
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Is the line $y = x + 1$ a subspace of $\mathbb{R}^2$?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'It misses the origin.'
          - problem: 'Is the plane $x + y + z = 0$ a subspace of $\mathbb{R}^3$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Contains $\mathbf{0}$, and sums and scalar multiples of solutions of a homogeneous equation are solutions.'
        constraints: "lines/planes; subspace iff the equation is homogeneous (passes through the origin)"
    diagnostic_exemplar:
      problem: 'Is $W = \{(x, y) : x \ge 0\}$ a subspace of $\mathbb{R}^2$? Name the property that fails and give a counterexample.'
      answer: 'No: closure under scalar multiplication fails, since (1, 0) is in W but (-1)(1, 0) = (-1, 0) is not'
      answer_contract: {kind: none}
      solution_sketch: '$W$ contains $\mathbf{0}$ and is closed under addition, but a negative scalar pushes a point out of the half-plane.'
    anki_seeds:
      - front: 'The three conditions of the subspace test?'
        back: 'Contains $\mathbf{0}$; closed under addition; closed under scalar multiplication.'
        type: basic
      - front: 'Quickest way to show a set is NOT a subspace?'
        back: 'Exhibit one failure: the zero vector missing, or one sum/scalar multiple that leaves the set.'
        type: basic

  - id: subspaces-span
    name: Subspaces and Span
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: span-linear-combinations
        weight: 0.7
        key: true
      - id: subspace-test
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.4
      - id: solution-sets-free-variables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Spans are subspaces
        key_prerequisites: [span-linear-combinations, subspace-test]
        exemplars:
          - problem: 'Explain why $\mathrm{span}\{(1, 2), (0, 1)\}$ is a subspace of $\mathbb{R}^2$.'
            answer: "It contains 0 (the zero combination), and sums and scalar multiples of combinations are again combinations"
            answer_contract: {kind: none}
            solution_sketch: '$0\mathbf{v}_1 + 0\mathbf{v}_2 = \mathbf{0}$; adding two combinations adds coefficients; scaling scales them.'
          - problem: 'Is the set of all scalar multiples of $(3, -1)$ a subspace of $\mathbb{R}^2$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'It is $\mathrm{span}\{(3, -1)\}$, and every span is a subspace.'
        constraints: "1-2 spanning vectors; justify via the subspace test or the span-is-a-subspace theorem"
      - id: kp2
        name: Membership in a span
        key_prerequisites: [matrix-vector-equations, solution-sets-free-variables]
        exemplars:
          - problem: "Is $(2, 7, 9)$ in $\\mathrm{span}\\{(1, 2, 0), (0, 1, 3)\\}$? Write $(2, 7, 9) = c_1(1, 2, 0) + c_2(0, 1, 3)$, solve for $c_1$ and $c_2$ using the first two components, and check the third component. Give the verdict together with the values of $c_1$ and $c_2$."
            answer: "verdict = yes; c1 = 2; c2 = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Set up the full vector equation (2, 7, 9) = c1(1, 2, 0) + c2(0, 1, 3) and read off the component equations (span membership). The first two components give the 2x2 system c1 = 2 and 2c1 + c2 = 7, so c1 = 2 and c2 = 3 (matrix-vector equation). Check the third component: 0*2 + 3*3 = 9, which matches the target (consistency check). The answer is verdict = yes; c1 = 2; c2 = 3."
          - problem: "Is $(4, 3, 5)$ in $\\mathrm{span}\\{(1, 2, 0), (0, 1, 2)\\}$? Write $(4, 3, 5) = c_1(1, 2, 0) + c_2(0, 1, 2)$, solve for $c_1$ and $c_2$ using the first two components, and check the third component. Give the verdict together with the values of $c_1$ and $c_2$."
            answer: "verdict = no; c1 = 4; c2 = -5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Set up the full vector equation (4, 3, 5) = c1(1, 2, 0) + c2(0, 1, 2) and read off the component equations (span membership). The first two components give c1 = 4 and 2c1 + c2 = 3, so c2 = 3 - 8 = -5 (matrix-vector equation). Check the third component: 0*4 + 2*(-5) = -10, but the target has 5, so the check fails (consistency check). The answer is verdict = no; c1 = 4; c2 = -5."
          - problem: "Is $(4, 7, 4)$ in $\\mathrm{span}\\{(2, 4, 2), (1, 1, 1)\\}$? Write $(4, 7, 4) = c_1(2, 4, 2) + c_2(1, 1, 1)$ and solve the equations coming from the first two components. Give the verdict and the value of $c_1$."
            answer: "verdict = yes; c1 = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}]}
            solution_sketch: "Write (4, 7, 4) = c1(2, 4, 2) + c2(1, 1, 1); the first two components give 2c1 + c2 = 4 and 4c1 + c2 = 7 (span membership, matrix-vector equation). Subtracting the equations gives 2c1 = 3, so c1 = 3/2 and c2 = 4 - 3 = 1. Check the third component: 2*(3/2) + 1 = 4, which matches (consistency check). The answer is verdict = yes; c1 = 3/2."
          - problem: "The vector $(5, k, 4)$ lies in $\\mathrm{span}\\{(1, 0, 2), (0, 3, 1)\\}$: write $(5, k, 4) = c_1(1, 0, 2) + c_2(0, 3, 1)$. Find the value of $k$."
            answer: "-18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up (5, k, 4) = c1(1, 0, 2) + c2(0, 3, 1) and read the component equations (span membership). The first component gives c1 = 5, and the third gives 2c1 + c2 = 4, so c2 = 4 - 10 = -6 (matrix-vector equation). The second component then forces k = 3c2 = 3*(-6). The answer is -18."
          - problem: "The vector $(3, 6, t)$ is in $\\mathrm{span}\\{(2, 1, 0), (1, 0, 3)\\}$: write $(3, 6, t) = c_1(2, 1, 0) + c_2(1, 0, 3)$. Find the value of $t$."
            answer: "-27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write (3, 6, t) = c1(2, 1, 0) + c2(1, 0, 3); the second component gives c1 = 6 and the first gives 2*6 + c2 = 3, so c2 = -9 (span membership, matrix-vector equation). The third component of the combination is 0*6 + 3*(-9), and this must equal t. The answer is -27."
          - problem: "Is $(3, 6, 2)$ in $\\mathrm{span}\\{(1, 2, 0), (2, 4, 1)\\}$? The second component equation is twice the first, so use the third component to find one coefficient and then check the second equation. Give the verdict and the values of $c_1$ and $c_2$."
            answer: "verdict = yes; c1 = -1; c2 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Write (3, 6, 2) = c1(1, 2, 0) + c2(2, 4, 1); the second spanning vector is twice the first in the first two coordinates, so the 2x2 part is dependent (span membership, solution sets and free variables). The third component gives c2 = 2, and the first component gives c1 + 4 = 3, so c1 = -1. Check the second component: 2*(-1) + 4*2 = 6, which matches, so the system is consistent (consistency check). The answer is verdict = yes; c1 = -1; c2 = 2."
        constraints: "2 spanning vectors; membership decided by a 2x2 solve plus one check"
      - id: kp3
        name: Geometry of spans
        key_prerequisites: [span-linear-combinations]
        exemplars:
          - problem: 'Describe $\mathrm{span}\{(2, 3)\}$ geometrically.'
            answer: "The line through the origin with direction (2, 3)"
            answer_contract: {kind: none}
            solution_sketch: 'The span is all scalar multiples of $(2,3)$, the line through the origin with direction $(2,3)$.'
          - problem: 'Describe $\mathrm{span}\{(1, 0, 0), (0, 1, 0)\}$ geometrically.'
            answer: "The xy-plane in R^3 (all vectors with third component 0)"
            answer_contract: {kind: none}
            solution_sketch: 'The span is all vectors $(a, b, 0)$, the $xy$-plane in $\mathbb{R}^3$.'
          - problem: 'Do $(1, 2)$ and $(2, 1)$ span all of $\mathbb{R}^2$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'They are not multiples of each other, so their span is $2$-dimensional: all of $\mathbb{R}^2$.'
        constraints: "spans of 1-2 vectors in R^2 or R^3; answers are geometric descriptions"
    diagnostic_exemplar:
      problem: 'Is $(1, 3, 1)$ in $\mathrm{span}\{(1, 1, 0), (0, 1, 1)\}$? Describe that span geometrically.'
      answer: 'No: matching components forces a = 1 and b = 1, but then the middle entry is 2, not 3; the span itself is a plane through the origin in R^3'
      answer_contract: {kind: none}
      solution_sketch: '$a(1,1,0) + b(0,1,1) = (a, a + b, b)$, so $a = 1$, $b = 1$ and $a + b = 2 \ne 3$. Two independent vectors span a plane through the origin.'
    anki_seeds:
      - front: 'Why is every span automatically a subspace?'
        back: 'It contains the zero combination, and sums/scalar multiples of linear combinations are linear combinations.'
        type: basic
      - front: 'Two non-proportional vectors in $\mathbb{R}^2$ span...'
        back: 'all of $\mathbb{R}^2$.'
        type: basic

  - id: linear-independence
    name: Linear Independence
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: subspaces-span
        weight: 0.6
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.5
        key: true
      - id: solution-sets-free-variables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Independence of two vectors
        key_prerequisites: [subspaces-span]
        exemplars:
          - problem: "Let $u = (2, 6)$ and $v = (8, 24)$ be vectors in $\\mathbb{R}^2$. Determine whether the pair $\\{u, v\\}$ is linearly independent or linearly dependent; if dependent, find the scalar $c$ such that $v = cu$. Give the verdict and the value of $c$."
            answer: "verdict = dependent; c = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Test whether one vector is a scalar multiple of the other (the multiple test for two vectors). Component check: $8 = 4 \\cdot 2$ and $24 = 4 \\cdot 6$, so $v = 4u$ and the relation $v - 4u = 0$ is nontrivial. The pair is dependent with $c = 4$, so the answer is verdict = dependent; c = 4."
          - problem: "Let $u = (3, 5)$ and $v = (4, 7)$ be vectors in $\\mathbb{R}^2$. Compute the determinant $d$ of the matrix whose rows are $u$ and $v$, and state whether the pair is linearly independent or dependent. Give the verdict and the value of $d$."
            answer: "verdict = independent; d = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Build the matrix with rows $u$ and $v$ and compute its determinant (the determinant test for two vectors in $\\mathbb{R}^2$). The determinant is $d = 3 \\cdot 7 - 5 \\cdot 4 = 1$. Since $d$ is not zero, the only solution of $c_1 u + c_2 v = 0$ is the trivial one. The pair is independent, so the answer is verdict = independent; d = 1."
          - problem: "The vectors $(3, 6)$ and $(k, 10)$ in $\\mathbb{R}^2$ are linearly dependent. Find $k$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Two vectors are dependent exactly when one is a scalar multiple of the other (the multiple test). From the second components the ratio is $10/6 = 5/3$, so the first components must satisfy $k/3 = 5/3$. Solving gives $k = 5$, so the answer is k = 5."
          - problem: "The vectors $(2, -1, 3)$ and $(-4, 2, k)$ in $\\mathbb{R}^3$ are linearly dependent. Find $k$."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Two vectors in $\\mathbb{R}^3$ are dependent only if one is a scalar multiple of the other (the multiple test). Write $(-4, 2, k) = c(2, -1, 3)$; the first components give $c = -2$, and the second components agree since $2 = -2 \\cdot (-1)$. The third component then forces $k = -2 \\cdot 3$, so the answer is k = -6."
          - problem: "In $\\mathbb{R}^3$, the vector $w = (6, k, -9)$ is a scalar multiple of $u = (2, -1, 3)$. Find the scalar $c$ and the value of $k$."
            answer: "c = 3; k = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Write the scalar multiple relation $w = cu$ componentwise (definition of a scalar multiple). The first components give $6 = 2c$, hence $c = 3$. The second component gives $k = 3 \\cdot (-1) = -3$, and the third confirms $-9 = 3 \\cdot 3$. The answer is c = 3; k = -3."
          - problem: "Let $u = (1, 2, 1)$ and $v = (2, 4, t)$ in $\\mathbb{R}^3$. State whether the pair is linearly independent when $t = 6$, and find the value of $t$ that makes the pair linearly dependent. Give the verdict and the value of $t$."
            answer: "verdict = independent; t = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "The pair is dependent only if $v = cu$ for some scalar $c$ (the multiple test). The first components force $c = 2$, and the second components agree since $4 = 2 \\cdot 2$, so dependence requires the third component $t = 2 \\cdot 1 = 2$. With $t = 6$ the third components disagree, so the pair is independent, and the answer is verdict = independent; t = 2."
        constraints: "pairs in R^2 or R^3 with small integer entries"
      - id: kp2
        name: Independence via row reduction
        key_prerequisites: [row-reduction-echelon-forms, solution-sets-free-variables]
        exemplars:
          - problem: "Consider the vectors v1 = (2, 1, 1), v2 = (1, 2, 3), and v3 = (3, 3, 4). Decide the linear independence status of these vectors and give the number of pivot positions in the matrix with these vectors as columns. State the verdict and the pivot count."
            answer: "verdict = dependent; p = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Form the matrix A with columns v1, v2, v3: [[2,1,3],[1,2,3],[1,3,4]]. Row reduce A to echelon form. The third column is the sum of the first two, so the echelon form has pivots only in the first two columns. Thus the vectors are dependent and the pivot count is 2. The verdict independent is wrong because a nontrivial relation v1 + v2 - v3 = 0 exists. The final answer is verdict = dependent; p = 2."
          - problem: "Consider the vectors u = (1, 0, 2), v = (0, 1, 3), and w = (1, 1, 0). Decide the linear independence status of these vectors and give the number of pivot positions in the matrix with these vectors as columns. State the verdict and the pivot count."
            answer: "verdict = independent; p = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Form the matrix A with columns u, v, w: [[1,0,1],[0,1,1],[2,3,0]]. Row reduce A to echelon form. The echelon form has a pivot in every column, so the only solution of Ax = 0 is x = 0. Therefore the vectors are independent and p = 3. The verdict dependent is wrong because no nontrivial relation exists. The final answer is verdict = independent; p = 3."
          - problem: "Find the rank of the matrix whose columns are the vectors (1, 2, 3), (2, 4, 6), and (3, 6, 9)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the matrix A with the three given vectors as columns: [[1,2,3],[2,4,6],[3,6,9]]. Row reduce A to echelon form. The second and third columns are multiples of the first, so only one pivot remains. The rank is the number of pivots, which is 1. The final answer is 1."
          - problem: "How many pivot positions does the matrix with columns (2, 1, 0), (1, 3, 1), and (1, 0, 2) have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the matrix A with columns (2,1,0), (1,3,1), (1,0,2): [[2,1,1],[1,3,0],[0,1,2]]. Row reduce A to echelon form. The determinant is nonzero, so the echelon form has a pivot in each of the three columns. The number of pivot positions is 3. The final answer is 3."
          - problem: "How many nonzero rows does the row echelon form of the matrix with columns (1, 0, 2), (0, 1, 1), and (1, 1, 3) have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the matrix A with columns (1,0,2), (0,1,1), (1,1,3): [[1,0,1],[0,1,1],[2,1,3]]. Row reduce A to echelon form. The third column is the sum of the first two, so one row becomes zero and only two nonzero rows remain. The number of nonzero rows is 2. The final answer is 2."
          - problem: "Consider the vectors a = (1, 1, 2), b = (2, 2, 4), and c = (3, 3, 6). Decide the linear independence status of these vectors and give the number of pivot positions in the matrix with these vectors as columns. State the verdict and the pivot count."
            answer: "verdict = dependent; p = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["independent"], ["dependent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Form the matrix A with columns a, b, c: [[1,2,3],[1,2,3],[2,4,6]]. Row reduce A to echelon form. All columns are multiples of the first column, so only one pivot remains. Thus the vectors are dependent and p = 1. The verdict independent is wrong because b = 2a and c = 3a give nontrivial relations. The final answer is verdict = dependent; p = 1."
        constraints: "3 vectors in R^3; dependent cases have an easily spotted relation like v3 = v1 + v2"
      - id: kp3
        name: Dependence relations and parameters
        key_prerequisites: [subspaces-span, solution-sets-free-variables]
        exemplars:
          - problem: 'For which $h$ is $\{(1, 2), (h, 4)\}$ linearly dependent?'
            answer: "h = 2"
            solution_sketch: 'Dependent iff $(h, 4)$ is a multiple of $(1, 2)$: the multiplier must be $2$, so $h = 2$.'
          - problem: 'Find a nontrivial dependence relation for $\{(1, 2, 3), (2, 1, 0), (3, 3, 3)\}$.'
            answer: "v1 + v2 - v3 = 0"
            answer_contract: {kind: none}
            solution_sketch: 'From $(1,2,3) + (2,1,0) = (3,3,3)$.'
        constraints: "solve-for-h with integer h; relations with coefficients in -2..2"
    diagnostic_exemplar:
      problem: 'Is $\{(1, 1, 2), (2, 0, 1), (3, 1, 3)\}$ linearly independent? If not, give a nontrivial dependence relation.'
      answer: 'No: v1 + v2 - v3 = 0'
      answer_contract: {kind: none}
      solution_sketch: 'Row reduction produces a zero row; concretely $(1,1,2) + (2,0,1) = (3,1,3)$, so the third vector is a combination of the first two.'
    anki_seeds:
      - front: 'Definition: $\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$ is linearly independent when $c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k = \mathbf{0}$ implies...'
        back: '$c_1 = \cdots = c_k = 0$ (only the trivial combination).'
        type: basic
      - front: 'Quick test for two vectors to be linearly dependent?'
        back: 'One is a scalar multiple of the other.'
        type: basic

  - id: basis-dimension
    name: Basis and Dimension
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: linear-independence
        weight: 0.7
        key: true
      - id: subspaces-span
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Verifying a basis
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'Is $\{(1, 1), (1, -1)\}$ a basis of $\mathbb{R}^2$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Two independent vectors (not multiples) in a $2$-dimensional space span it, so they form a basis.'
          - problem: 'Is $\{(1, 2), (2, 4)\}$ a basis of $\mathbb{R}^2$?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The vectors are dependent, so they span only a line.'
        constraints: "2 candidate vectors for R^2, 3 for R^3; small integer entries"
      - id: kp2
        name: Coordinates relative to a basis
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'Find the coordinates of $\mathbf{x} = (3, 1)$ in the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: "(2, 1)"
            solution_sketch: 'Solve $c_1 + c_2 = 3$, $c_1 - c_2 = 1$: adding gives $c_1 = 2$, so $c_2 = 1$.'
          - problem: 'Find the coordinates of $\mathbf{x} = (5, 4)$ in the basis $B = \{(1, 0), (1, 2)\}$.'
            answer: "(3, 2)"
            solution_sketch: 'Second component forces $c_2 = 2$; then $c_1 = 5 - 2 = 3$.'
          - problem: "Let B = {(1,1), (2,-1)}. For x = (7,-2), find c1 and c2 with x = c1(1,1) + c2(2,-1). Give the answer as (c1, c2)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: B = {(1,1), (2,-1)} and x = (7,-2), with x = c1(1,1) + c2(2,-1). The vector equation gives the linear system c1 + 2c2 = 7 and c1 - c2 = -2. Subtract the second equation from the first to get 3c2 = 9, so c2 = 3, and then c1 = 1. The coordinates are (1, 3)."
          - problem: "A basis of R^2 is B = {(2,1), (1,2)}. The vector x = (0,3) is written x = a(2,1) + b(1,2). Determine a and b. Give the answer as (a, b)."
            answer: "(-1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: B = {(2,1), (1,2)} and x = (0,3), with x = a(2,1) + b(1,2). The vector equation gives 2a + b = 0 and a + 2b = 3. From b = -2a, substitute into the second equation to get a - 4a = 3, so a = -1 and b = 2. The coordinates are (-1, 2)."
          - problem: "Use the ordered basis B = {(1,2), (3,1)} for R^2. The coordinate vector of x is (2,-1). Find the standard coordinates of x. Give the answer as (x1, x2)."
            answer: "(-1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: basis B = {(1,2), (3,1)} and coordinate vector (2,-1), so x = 2(1,2) + (-1)(3,1). Compute 2(1,2) = (2,4) and (-1)(3,1) = (-3,-1). Add the two vectors: (2 - 3, 4 - 1) = (-1, 3). The standard coordinates are (-1, 3)."
          - problem: "The polynomials 1+x and 1-x form a basis of the degree-at-most-1 polynomials. Find the coordinates of 1+3x in this basis. Give the answer as (c1, c2)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: basis {1+x, 1-x} and polynomial 1+3x, with 1+3x = c1(1+x) + c2(1-x). Equating constants and x-coefficients gives c1 + c2 = 1 and c1 - c2 = 3. Add the equations to get 2c1 = 4, so c1 = 2 and c2 = -1. The coordinates are (2, -1)."
        constraints: "2x2 solves with integer coordinates in -4..4"
      - id: kp3
        name: Dimension of subspaces
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'What is $\dim\ \mathrm{span}\{(1, 0, 1), (2, 0, 2), (0, 1, 0)\}$?'
            answer: "2"
            solution_sketch: 'The second vector is twice the first; the remaining two are independent.'
          - problem: "Consider the subspace $W = \\mathrm{span}\\{(2, 1, 3), (4, 2, 6), (0, 1, 1)\\}$ of $\\mathbb{R}^3$. Determine $\\dim W$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The vector (4, 2, 6) equals 2 times (2, 1, 3), so it is redundant and can be removed from the spanning set. The remaining vectors (2, 1, 3) and (0, 1, 1) are not scalar multiples of each other, so they are independent and form a basis of W. The dimension of W is 2."
          - problem: "Let $W$ be the span of the two vectors $(3, 6)$ and $(1, 2)$ in $\\mathbb{R}^2$. Find the dimension of $W$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The vector (3, 6) equals 3 times (1, 2), so the two vectors are dependent and span the same line through the origin. A line through the origin has exactly one independent direction vector. The dimension of W is 1."
          - problem: "What is the dimension of $\\mathrm{span}\\{(1, 1, 0), (0, 1, 1), (1, 0, 1)\\}$ in $\\mathbb{R}^3$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Suppose a(1, 1, 0) + b(0, 1, 1) + c(1, 0, 1) = (0, 0, 0). The equations a + c = 0, a + b = 0, b + c = 0 have only the solution a = b = c = 0, so the three vectors are independent. Three independent vectors in R^3 span all of R^3, so the dimension is 3."
          - problem: "The set $W$ of all $(x, y, z)$ in $\\mathbb{R}^3$ with $x + y + z = 0$ and $y - z = 0$ is a subspace. Give the dimension of $W$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "From y - z = 0 we get y = z; substituting into x + y + z = 0 gives x = -2z. Every solution has the form (-2t, t, t) with one free parameter t, so a basis is {(-2, 1, 1)}. The dimension of W is 1."
          - problem: "Let $da = \\dim\\ \\mathrm{span}\\{(1, 2, 0), (3, 6, 0), (0, 0, 1)\\}$ and $db = \\dim\\ \\mathrm{span}\\{(1, 0, 1), (0, 1, 0), (0, 0, 1)\\}$. Find $da$ and $db$."
            answer: "da = 2; db = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "da"}, {"contract": {"kind": "exact"}, "name": "db"}]}
            solution_sketch: "In the first span, (3, 6, 0) = 3(1, 2, 0) is redundant, and the remaining vectors (1, 2, 0) and (0, 0, 1) are independent, so da = 2. In the second span, the three vectors are not scalar multiples of one another, so they are independent and db = 3. The answers are da = 2; db = 3."
        constraints: "dimensions 1-3; redundant vectors are obvious multiples or sums"
    diagnostic_exemplar:
      problem: 'Find a basis for the subspace $W = \{(x, y, z) : x + 2y - z = 0\}$ of $\mathbb{R}^3$, give $\dim W$, and give the coordinates of $(0, 1, 2)$ relative to your basis.'
      answer: 'Basis {(-2, 1, 0), (1, 0, 1)} (any valid basis); dim W = 2; coordinates of (0, 1, 2) are (1, 2)'
      answer_contract: {kind: none}
      solution_sketch: 'Solving $x = -2y + z$ with $y = s$, $z = t$ gives $(-2, 1, 0)s + (1, 0, 1)t$; and $(0, 1, 2) = 1(-2, 1, 0) + 2(1, 0, 1)$.'
    anki_seeds:
      - front: 'A basis of a vector space is a set that is both...'
        back: 'linearly independent and spanning.'
        type: basic
      - front: 'The dimension of a vector space is the number of vectors in...'
        back: 'any basis (all bases have the same size).'
        type: basic

  - id: coordinates-relative-basis
    name: Coordinates Relative to a Basis
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: basis-dimension
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: From coordinates back to the vector
        key_prerequisites: [basis-dimension]
        exemplars:
          - problem: '$[\mathbf{x}]_B = (2, 3)$ in the basis $B = \{(1, 1), (1, -1)\}$. Find $\mathbf{x}$.'
            answer: "(5, -1)"
            solution_sketch: '$2(1, 1) + 3(1, -1) = (5, -1)$.'
          - problem: '$[\mathbf{x}]_B = (1, -2)$ in the basis $B = \{(2, 0), (1, 3)\}$. Find $\mathbf{x}$.'
            answer: "(0, -6)"
            solution_sketch: '$(2, 0) - 2(1, 3) = (0, -6)$.'
          - problem: "$[\\mathbf{x}]_B = (2, -3)$ in the basis $B = \\{(1, 2), (2, 1)\\}$. Find $\\mathbf{x}$ as (x, y)."
            answer: "(-4, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the coordinate definition: $\\mathbf{x} = c_1 b_1 + c_2 b_2$, the linear-combination rule. The full combination is $2(1, 2) + (-3)(2, 1) = (2 - 6, 4 - 3)$. The vector is (-4, 1)."
          - problem: "$[\\mathbf{x}]_B = (-1, 3)$ in the basis $B = \\{(2, -1), (0, 1)\\}$. Find $\\mathbf{x}$ as (x, y)."
            answer: "(-2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The coordinate rule gives $\\mathbf{x} = (-1)(2, -1) + 3(0, 1)$. The full combination is $(-2, 1) + (0, 3)$. The vector is (-2, 4)."
          - problem: "A robot's velocity is recorded in coordinates $[\\mathbf{v}]_B = (3, -2)$ relative to the basis $B = \\{(1, 0), (1, 1)\\}$. Find $\\mathbf{v}$ as (v_x, v_y)."
            answer: "(1, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Convert coordinates to the vector by the linear-combination rule: $\\mathbf{v} = 3(1, 0) + (-2)(1, 1)$. The full combination is $(3, 0) + (-2, -2)$. The velocity is (1, -2)."
          - problem: "$[\\mathbf{x}]_B = (1, 2, -1)$ in the basis $B = \\{(1, 0, 1), (0, 1, 1), (1, 1, 0)\\}$. Find $\\mathbf{x}$ as (x, y, z)."
            answer: "(0, 1, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The coordinate rule in R^3 gives $\\mathbf{x} = 1(1, 0, 1) + 2(0, 1, 1) + (-1)(1, 1, 0)$. The full combination is $(1, 0, 1) + (0, 2, 2) + (-1, -1, 0)$. The vector is (0, 1, 3)."
        constraints: "direct evaluation of the combination; entries in -6..6"
      - id: kp2
        name: Coordinates in R^2 bases
        key_prerequisites: [basis-dimension]
        exemplars:
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (1, 5)$ and $B = \{(1, 1), (1, -1)\}$.'
            answer: "(3, -2)"
            solution_sketch: '$c_1 + c_2 = 1$, $c_1 - c_2 = 5$: adding gives $c_1 = 3$, so $c_2 = -2$. Check: $3(1,1) - 2(1,-1) = (1, 5)$.'
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (7, 4)$ and $B = \{(2, 1), (1, 1)\}$.'
            answer: "(3, 1)"
            solution_sketch: '$2c_1 + c_2 = 7$, $c_1 + c_2 = 4$: subtract to get $c_1 = 3$, then $c_2 = 1$.'
          - problem: "The basis B = {(2, 0), (0, 3)} and the vector x = (4, -9) are given. Find [x]_B and give the answer as (c1, c2)."
            answer: "(2, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The vector is x = (4, -9) and the basis is B = {(2, 0), (0, 3)}. Step 1 (coordinate equation): write c1(2, 0) + c2(0, 3) = (4, -9). Step 2 (solve components): 2c1 = 4 gives c1 = 2, and 3c2 = -9 gives c2 = -3. Thus [x]_B = (2, -3)."
          - problem: "For x = (5, 0) in the basis B = {(1, 2), (3, 1)}, compute the coordinate vector [x]_B. Give the answer as (c1, c2)."
            answer: "(-1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The vector is x = (5, 0) and the basis is B = {(1, 2), (3, 1)}. Step 1 (coordinate equation): set c1(1, 2) + c2(3, 1) = (5, 0). Step 2 (solve system): c1 + 3c2 = 5 and 2c1 + c2 = 0; substituting c2 = -2c1 gives c1 = -1 and c2 = 2. Thus [x]_B = (-1, 2)."
          - problem: "The basis B = {(1, 1), (2, -1)} and the coordinate vector [x]_B = (2, -2) are given. Find x and give the answer as (x1, x2)."
            answer: "(-2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The basis is B = {(1, 1), (2, -1)} and the coordinate vector is [x]_B = (2, -2). Step 1 (reconstruction formula): x = c1 b1 + c2 b2. Step 2 (substitute coordinates): x = 2(1, 1) + (-2)(2, -1) = (2, 2) + (-4, 2) = (-2, 4). Thus x = (-2, 4)."
          - problem: "The vector x = (-15, 10) is in the span of B = {(-1, 2), (3, -1)}. Find [x]_B and give the answer as (c1, c2)."
            answer: "(3, -4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The vector is x = (-15, 10) and the basis is B = {(-1, 2), (3, -1)}. Step 1 (coordinate equation): write c1(-1, 2) + c2(3, -1) = (-15, 10). Step 2 (solve system): -c1 + 3c2 = -15 and 2c1 - c2 = 10; solving gives c1 = 3 and c2 = -4. Thus [x]_B = (3, -4)."
        constraints: "2x2 solves; coordinates are integers in -4..4, including negative coordinates"
      - id: kp3
        name: Coordinates in R^3 bases
        key_prerequisites: [basis-dimension, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (3, 1, 4)$ and $B = \{(1, 0, 0), (1, 1, 0), (1, 1, 1)\}$.'
            answer: "(2, -3, 4)"
            solution_sketch: 'Back-substitute from the last component: $c_3 = 4$; then $c_2 + c_3 = 1$ gives $c_2 = -3$; then $c_1 = 3 - c_2 - c_3 = 2$. Check: $2(1,0,0) - 3(1,1,0) + 4(1,1,1) = (3, 1, 4)$.'
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (2, 3, 6)$ and $B = \{(1, 0, 1), (0, 1, 0), (0, 0, 2)\}$.'
            answer: "(2, 3, 2)"
            solution_sketch: '$c_1 = 2$ and $c_2 = 3$ are forced; the third component gives $c_1 + 2c_3 = 6$, so $c_3 = 2$.'
          - problem: "The set $B = \\{(1, 0, 0), (2, 1, 0), (0, 0, 3)\\}$ is a basis of $\\mathbb{R}^3$. For $\\mathbf{x} = (7, 3, 9)$, find the coordinate vector of $\\mathbf{x}$ relative to $B$ and give it as (c1, c2, c3)."
            answer: "(1, 3, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Set $c_1(1,0,0) + c_2(2,1,0) + c_3(0,0,3) = (7,3,9)$. Back-substitution: the third component gives $3c_3 = 9$, so $c_3 = 3$; the second component gives $c_2 = 3$; the first gives $c_1 + 2c_2 = 7$, so $c_1 = 1$. The coordinate vector is (1, 3, 3)."
          - problem: "Let $B = \\{(1, 0, 0), (0, 1, 0), (2, 3, 1)\\}$ and $\\mathbf{x} = (5, 7, 4)$. Determine the coordinates of $\\mathbf{x}$ relative to $B$ and give the answer as (c1, c2, c3)."
            answer: "(-3, -5, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Solve $c_1(1,0,0) + c_2(0,1,0) + c_3(2,3,1) = (5,7,4)$ by back-substitution. The third component gives $c_3 = 4$; the second gives $c_2 + 3c_3 = 7$, so $c_2 = -5$; the first gives $c_1 + 2c_3 = 5$, so $c_1 = -3$. The coordinate vector is (-3, -5, 4)."
          - problem: "The coordinate vector of $\\mathbf{x}$ relative to $B = \\{(2, 0, 0), (1, 3, 0), (0, 1, 1)\\}$ is $[\\mathbf{x}]_B = (2, -1, 3)$. Find $\\mathbf{x}$ and give it as (x1, x2, x3)."
            answer: "(3, 0, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Reconstruct $\\mathbf{x}$ from its coordinates: $\\mathbf{x} = 2(2,0,0) - (1,3,0) + 3(0,1,1)$. Add the scaled basis vectors: the first component is $4 - 1 + 0 = 3$, the second is $-3 + 3 = 0$, and the third is $3$. Thus $\\mathbf{x} = (3, 0, 3)$."
          - problem: "A basis of $\\mathbb{R}^3$ is $B = \\{(2, 0, 0), (1, 3, 0), (0, 4, 5)\\}$ and $\\mathbf{x} = (8, 10, 5)$. Compute the coordinates of $\\mathbf{x}$ relative to $B$ and give them as (c1, c2, c3)."
            answer: "(3, 2, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Solve $c_1(2,0,0) + c_2(1,3,0) + c_3(0,4,5) = (8,10,5)$ by back-substitution. The third component gives $5c_3 = 5$, so $c_3 = 1$; the second gives $3c_2 + 4c_3 = 10$, so $c_2 = 2$; the first gives $2c_1 + c_2 = 8$, so $c_1 = 3$. The coordinates are (3, 2, 1)."
        constraints: "triangular-friendly bases so back-substitution works; integer coordinates"
    diagnostic_exemplar:
      problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (4, 3, 5)$ and $B = \{(1, 0, 0), (1, 1, 0), (1, 1, 1)\}$.'
      answer: '(1, -2, 5)'
      solution_sketch: 'Reading from the last coordinate up: $c_3 = 5$, then $c_2 + c_3 = 3$ gives $c_2 = -2$, then $c_1 - 2 + 5 = 4$ gives $c_1 = 1$.'
    anki_seeds:
      - front: '$[\mathbf{x}]_B = (c_1, \dots, c_n)$ means...'
        back: '$\mathbf{x} = c_1\mathbf{b}_1 + \cdots + c_n\mathbf{b}_n$ for the basis vectors $\mathbf{b}_i$.'
        type: basic
      - front: 'Why are coordinates relative to a basis unique?'
        back: 'The basis is linearly independent, so two different coefficient lists cannot produce the same vector.'
        type: basic

  - id: change-of-basis
    name: Change of Basis
    core: true                 # re-audit R-38: the W8 "terminal technique" rationale dissolved — matrix-representation-in-basis (core, and through it similar-matrices) now builds on P_B / P_C^{-1}P_B
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: coordinates-relative-basis
        weight: 0.7
        key: true
      - id: matrix-inverses
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: The basis-to-standard matrix
        key_prerequisites: [coordinates-relative-basis]
        exemplars:
          - problem: 'For $B = \{(2, 1), (1, 1)\}$, find $\mathbf{x}$ when $[\mathbf{x}]_B = (1, 1)$.'
            answer: "(3, 2)"
            solution_sketch: '$\begin{pmatrix}2&1\\1&1\end{pmatrix}\begin{pmatrix}1\\1\end{pmatrix} = (3, 2)$.'
          - problem: "For the basis $B = \\{(3, 1), (2, -1)\\}$ of $\\mathbb{R}^2$, form the matrix $P_B$ that satisfies $\\mathbf{x} = P_B[\\mathbf{x}]_B$, with the basis vectors as its columns. Give the matrix as [a,b;c,d]."
            answer: "[3,2;1,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (definition of the basis-to-standard matrix): the columns of $P_B$ are the basis vectors in order, so column 1 is $(3, 1)$ and column 2 is $(2, -1)$. Step 2 (read the columns row by row): row 1 collects the first entries $(3, 2)$ and row 2 the second entries $(1, -1)$. The matrix is [3,2;1,-1]."
          - problem: "For the basis $B = \\{(4, 1), (1, 2)\\}$, find $\\mathbf{x}$ when $[\\mathbf{x}]_B = (2, 1)$. Give the answer as (x, y)."
            answer: "(9, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (build $P_B$): the columns are the basis vectors, so $P_B$ has columns $(4, 1)$ and $(1, 2)$. Step 2 (one matrix-vector product by the column rule): $P_B(2, 1) = 2 \\cdot (4, 1) + 1 \\cdot (1, 2)$. Step 3 (combine): $(8 + 1,\\ 2 + 2) = (9, 4)$. The answer is (9, 4)."
          - problem: "For the basis $B = \\{(1, 0, 1), (0, 1, 1), (1, 1, 0)\\}$ of $\\mathbb{R}^3$, find $\\mathbf{x}$ when $[\\mathbf{x}]_B = (1, 2, 3)$. Give the answer as (x, y, z)."
            answer: "(4, 5, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (build $P_B$): the columns are the basis vectors $(1, 0, 1)$, $(0, 1, 1)$ and $(1, 1, 0)$. Step 2 (one matrix-vector product by the column rule): $\\mathbf{x} = 1 \\cdot (1, 0, 1) + 2 \\cdot (0, 1, 1) + 3 \\cdot (1, 1, 0)$. Step 3 (combine componentwise): $(1 + 0 + 3,\\ 0 + 2 + 3,\\ 1 + 2 + 0) = (4, 5, 3)$. The answer is (4, 5, 3)."
          - problem: "With respect to the basis $B = \\{(2, 0), (c, 1)\\}$, a vector satisfies $\\mathbf{x} = (8, 3)$ and $[\\mathbf{x}]_B = (1, 3)$. Find the value of $c$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (set up the basis-to-standard product): $\\mathbf{x} = P_B[\\mathbf{x}]_B$, so $(8, 3) = 1 \\cdot (2, 0) + 3 \\cdot (c, 1)$. Step 2 (use the first component): $2 + 3c = 8$, so $3c = 6$. Step 3 (solve and check): $c = 2$, and the second component gives $0 + 3 = 3$, which matches. The answer is 2."
          - problem: "For the basis $B = \\{(1, 1, 0), (0, 1, 1), (1, 0, 1)\\}$ of $\\mathbb{R}^3$, form the matrix $P_B$ whose columns are the basis vectors, so that $\\mathbf{x} = P_B[\\mathbf{x}]_B$. Give the matrix in the [a,b;c,d] style extended to three columns, as [a,b,c;d,e,f;g,h,i]."
            answer: "[1,0,1;1,1,0;0,1,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "Step 1 (definition of the basis-to-standard matrix): the columns of $P_B$ are the basis vectors in the given order: $(1, 1, 0)$, $(0, 1, 1)$, $(1, 0, 1)$. Step 2 (read the columns row by row): row 1 collects the first entries $(1, 0, 1)$, row 2 the second entries $(1, 1, 0)$, row 3 the third entries $(0, 1, 1)$. The matrix is [1,0,1;1,1,0;0,1,1]."
        constraints: "columns of P_B are the basis vectors; one matrix-vector product"
      - id: kp2
        name: Standard-to-basis via the inverse
        key_prerequisites: [coordinates-relative-basis, matrix-inverses]
        exemplars:
          - problem: 'For $B = \{(1, 0), (1, 2)\}$, use $[\mathbf{x}]_B = P_B^{-1}\mathbf{x}$ to find the coordinates of $\mathbf{x} = (5, 4)$.'
            answer: "(3, 2)"
            solution_sketch: '$P_B = \begin{pmatrix}1&1\\0&2\end{pmatrix}$, $P_B^{-1} = \begin{pmatrix}1&-1/2\\0&1/2\end{pmatrix}$; $P_B^{-1}(5, 4) = (5 - 2, 2) = (3, 2)$.'
          - problem: "For $B = \\{(1, 1), (1, -1)\\}$, use $[\\mathbf{x}]_B = P_B^{-1}\\mathbf{x}$ to find the coordinates of $\\mathbf{x} = (7, 3)$ relative to B as (a, b)."
            answer: "(5, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Form P_B with the basis vectors as columns: P_B = [[1,1],[1,-1]]. Its determinant is 1 times -1 minus 1 times 1 = -2, so by the 2x2 inverse formula P_B inverse = (-1/2)[[-1,-1],[-1,1]] = [[1/2,1/2],[1/2,-1/2]]. Multiply: P_B inverse (7,3) = ((7+3)/2, (7-3)/2) = (5,2). The coordinate vector is (5, 2)."
          - problem: "A vector $\\mathbf{x} = (11, 19)$ is expressed in the basis $B = \\{(1, 2), (3, 5)\\}$. Compute its B-coordinates $[\\mathbf{x}]_B$ via $P_B^{-1}$, and give them as (a, b)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The columns of P_B are the basis vectors, so P_B = [[1,3],[2,5]] with determinant 1 times 5 minus 3 times 2 = -1. The 2x2 inverse formula gives P_B inverse = [[-5,3],[2,-1]]. Multiply: P_B inverse (11,19) = (-55 + 57, 22 - 19) = (2,3). The B-coordinates are (2, 3)."
          - problem: "Let $B = \\{(1, 2), (2, 5)\\}$ and $\\mathbf{x} = (11, 26)$, so $[\\mathbf{x}]_B = (a, b)$. Using $P_B^{-1}$, find the second coordinate $b$ only."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "P_B = [[1,2],[2,5]] has determinant 1 times 5 minus 2 times 2 = 1. By the 2x2 inverse formula, P_B inverse = [[5,-2],[-2,1]]. Multiply: P_B inverse (11,26) = (55 - 52, -22 + 26) = (3,4). The second coordinate b is 4."
          - problem: "The columns of $P_B$ are the basis vectors $B = \\{(1, 3), (2, 4)\\}$, and $P_B^{-1}$ converts standard coordinates to B-coordinates. Give the matrix $P_B^{-1}$ as [a,b;c,d]."
            answer: "[-2,1;3/2,-1/2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The basis vectors (1,3) and (2,4) form P_B = [[1,2],[3,4]], with determinant 1 times 4 minus 2 times 3 = -2. The 2x2 inverse formula gives P_B inverse = (1/-2)[[4,-2],[-3,1]] = [[-2,1],[3/2,-1/2]]. This is the matrix that maps standard coordinates to B-coordinates. P_B inverse = [-2,1;3/2,-1/2]."
          - problem: "For $B = \\{(2, 1), (1, 1)\\}$ and $\\mathbf{x} = (9, 5)$, a student claims $[\\mathbf{x}]_B = (3, 2)$. Check the claim with $P_B^{-1}$. State whether the claim is correct, and give the correct coordinates as (a, b)."
            answer: "verdict = incorrect; coords = (4, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["correct"], ["incorrect"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "coords"}]}
            solution_sketch: "Test the claim directly: 3 times (2,1) plus 2 times (1,1) equals (8,5), which is not x = (9,5), so the verdict is incorrect. To correct it, form P_B = [[2,1],[1,1]] with determinant 1, so P_B inverse = [[1,-1],[-1,2]] by the 2x2 inverse formula. Multiply: P_B inverse (9,5) = (9 - 5, -9 + 9 + 5) = wait, compute row-wise: (9 - 5, -9 + 5) is wrong; correctly (1*9 + (-1)*5, (-1)*9 + 1*5) = (4, -4)? Recheck: P_B = [[2,1],[1,1]] means columns (2,1) and (1,1), so the rows of P_B are (2,1) and (1,1), and P_B inverse = [[1,-1],[-1,2]]. Then P_B inverse (9,5) = (9 - 5, -9 + 10) = (4,1). Verdict = incorrect; coords = (4, 1)."
        constraints: "2x2 bases with determinant +-1 or +-2 so the inverse is clean"
      - id: kp3
        name: Converting between two bases
        key_prerequisites: [coordinates-relative-basis, matrix-inverses]
        exemplars:
          - problem: '$B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 0), (1, 1)\}$. If $[\mathbf{x}]_B = (1, 2)$, find $[\mathbf{x}]_C$.'
            answer: "(4, -1)"
            solution_sketch: 'First $\mathbf{x} = 1(1,1) + 2(1,-1) = (3, -1)$; then in $C$: $c_2 = -1$ (second component) and $c_1 = 3 - (-1) = 4$. Check: $4(1,0) - (1,1) = (3, -1)$.'
          - problem: "Let B = {(1, 1), (1, -1)} and C = {(1, 2), (1, 3)}. If [x]_B = (2, 1), find [x]_C. Give the answer as (x, y)."
            answer: "(8, -5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: route through standard coordinates. Compute x = P_B [x]_B = 2(1, 1) + 1(1, -1) = (3, 1). Step 2: solve in basis C. Write x = a(1, 2) + b(1, 3), so a + b = 3 and 2a + 3b = 1. Step 3: subtract twice the first equation from the second to get b = -5, then a = 8. The answer is (8, -5)."
          - problem: "Let B = {(1, 1), (1, -1)} and C = {(1, 2), (1, 3)}. If [x]_C = (2, 1), find [x]_B. Give the answer as (x, y)."
            answer: "(5, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: route through standard coordinates. Compute x = 2(1, 2) + 1(1, 3) = (3, 7). Step 2: solve in basis B. Write x = a(1, 1) + b(1, -1), so a + b = 3 and a - b = 7. Step 3: add the equations to get 2a = 10, so a = 5, and then b = -2. The answer is (5, -2)."
          - problem: "Let B = {(1, 1), (1, -1)} and C = {(1, 2), (1, 3)}. Give the matrix P that converts [x]_B to [x]_C as [a,b;c,d]."
            answer: "[2,4;-1,-3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: the change-of-basis matrix is P = P_C^{-1} P_B. Step 2: P_B has columns (1, 1) and (1, -1), so P_B = [1,1;1,-1]. P_C has columns (1, 2) and (1, 3), so P_C = [1,1;2,3] and P_C^{-1} = [3,-1;-2,1]. Step 3: multiply P_C^{-1} P_B = [3,-1;-2,1] [1,1;1,-1] = [2,4;-1,-3]. The answer is [2,4;-1,-3]."
          - problem: "Let B = {(1, 1, 0), (0, 1, 1), (1, 0, 0)} and C = {(1, 0, 0), (1, 1, 0), (1, 1, 1)}. If [x]_B = (1, 2, 3), find [x]_C. Give the answer as (x, y, z)."
            answer: "(1, 1, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: route through standard coordinates. Compute x = P_B [x]_B = 1(1, 1, 0) + 2(0, 1, 1) + 3(1, 0, 0) = (4, 3, 2). Step 2: solve in basis C. Write x = a(1, 0, 0) + b(1, 1, 0) + c(1, 1, 1) = (a+b+c, b+c, c). Step 3: match components: c = 2, b + c = 3 so b = 1, and a + b + c = 4 so a = 1. The answer is (1, 1, 2)."
          - problem: "Let B = {(1, 0), (2, 1)} and C = {(1, 1), (1, 2)}. If [x]_B = (2, 1), find [x]_C. Give the answer as (x, y)."
            answer: "(7, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: route through standard coordinates. Compute x = P_B [x]_B = 2(1, 0) + 1(2, 1) = (4, 1). Step 2: solve in basis C. Write x = a(1, 1) + b(1, 2), so a + b = 4 and a + 2b = 1. Step 3: subtract the first equation from the second to get b = -3, then a = 7. The answer is (7, -3)."
        constraints: "route through standard coordinates; all coordinates small integers"
    diagnostic_exemplar:
      problem: '$B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 0), (1, 1)\}$. If $[\mathbf{x}]_B = (3, 1)$, find $[\mathbf{x}]_C$.'
      answer: '(2, 2)'
      solution_sketch: '$\mathbf{x} = P_B(3, 1) = 3(1,1) + (1,-1) = (4, 2)$; then $[\mathbf{x}]_C = P_C^{-1}\mathbf{x}$ solves $a(1,0) + b(1,1) = (4,2)$, giving $b = 2$, $a = 2$.'
    anki_seeds:
      - front: 'The change-of-coordinates matrix $P_B$ (basis $B$ to standard) has which columns?'
        back: 'The basis vectors of $B$ themselves.'
        type: basic
      - front: 'To convert coordinates from basis $B$ to basis $C$, multiply by...'
        back: '$P_C^{-1}P_B$ (through standard coordinates).'
        type: basic

  - id: null-column-space-rank
    name: Null Space, Column Space, and Rank
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: basis-dimension
        weight: 0.6
        key: true
      - id: solution-sets-free-variables
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Null space
        key_prerequisites: [solution-sets-free-variables]
        exemplars:
          - problem: 'Find a basis for the null space of $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$.'
            answer: "{(-2, 1)}"
            solution_sketch: 'Row reduce to $x + 2y = 0$; with $y = t$, solutions are $t(-2, 1)$.'
          - problem: "Find a basis for the null space of $A = \\begin{pmatrix}3&-6\\\\-1&2\\end{pmatrix}$, given as (x, y)."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Row reduce $A$: the second row $(-1, 2)$ is $-1/3$ times the first row $(3, -6)$, so row reduction leaves one equation $3x - 6y = 0$. Set $y = t$ as the free variable: then $x = 2t$, so every solution is $t(2, 1)$ by the free-variable parametrization. The null space is one-dimensional, and a basis for the null space is (2, 1)."
          - problem: "Find a basis for the null space of $A = \\begin{pmatrix}1&4&3\\\\3&12&7\\end{pmatrix}$. Give the answer as (x, y, z)."
            answer: "(-4, 1, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Start with the full matrix $A = [1, 4, 3; 3, 12, 7]$ and row reduce: replacing row 2 by row 2 minus 3 times row 1 gives the row $(0, 0, -2)$, so $z = 0$ and the pivot columns are columns 1 and 3. The remaining pivot equation is $x + 4y = 0$, so choosing the free variable $y = 1$ gives $x = -4$ by the free-variable parametrization. Every null vector is a multiple of $(-4, 1, 0)$, so a basis for the null space is (-4, 1, 0)."
          - problem: "Let $A = \\begin{pmatrix}1&-1\\\\2&-2\\end{pmatrix}$ and $v = (2, 3)$. State whether $v$ is in the null space of $A$, and give the first entry of $Av$."
            answer: "verdict = outside; entry = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["inside"], ["outside"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "entry"}]}
            solution_sketch: "Test membership by the definition of the null space: compute the product $Av$ by the row-column rule. The first entry is $1 \\cdot 2 + (-1) \\cdot 3 = -1$ and the second entry is $2 \\cdot 2 + (-2) \\cdot 3 = -2$, so $Av = (-1, -2)$, not the zero vector. The wrong option inside would come from checking only that the columns are proportional instead of computing the product $Av$. Since $Av$ is not zero, the verdict is outside and the first entry of $Av$ is -1."
          - problem: "Let $A = \\begin{pmatrix}1&4&2\\\\3&12&5\\end{pmatrix}$. Find the dimension of the null space of $A$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row reduce $A = [1,4,2; 3,12,5]$: replacing row 2 by row 2 minus 3 times row 1 gives the row $(0, 0, -1)$, so columns 1 and 3 hold pivots. There are 3 columns and 2 pivots, hence 1 free variable in the system $Ax = 0$ by the free-variable rule. Each free variable contributes one basis vector to the null space, so the dimension of the null space is 1."
          - problem: "Let $A = \\begin{pmatrix}1&3&2\\\\2&6&5\\end{pmatrix}$. Find the value of $t$ such that the vector $(t, 1, 0)$ lies in the null space of $A$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of the null space, $(t, 1, 0)$ qualifies exactly when $A(t, 1, 0) = (0, 0)$. Row 1 of the product gives $t + 3 + 0 = 0$, so $t = -3$; row 2 gives $2t + 6 + 0 = 0$, the same equation scaled by 2. Both rows agree, so the system is consistent and the value of $t$ is -3."
        constraints: "matrices 2x2 or 2x3 with 1-dimensional null spaces; integer basis vectors"
      - id: kp2
        name: Column space and pivot columns
        key_prerequisites: [basis-dimension, matrix-vector-equations]
        exemplars:
          - problem: 'Find a basis for the column space of $A = \begin{pmatrix}1&2&3\\2&4&8\end{pmatrix}$.'
            answer: "{(1, 2), (3, 8)}"
            solution_sketch: '$R_2 - 2R_1$ gives $(0, 0, 2)$: pivots in columns 1 and 3, so those original columns form a basis.'
          - problem: 'What is the rank of $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$?'
            answer: "1"
            solution_sketch: 'One pivot after row reduction; rank = dimension of the column space.'
          - problem: "Compute the rank of A = [[2,4,6],[1,2,5]]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Row-reduce A = [[2,4,6],[1,2,5]] by dividing row 1 by 2 to get [1,2,3] and replacing row 2 with row 2 minus row 1, giving [0,0,2]. Step 2: The pivots lie in columns 1 and 3, so there are two pivot columns. The rank is the number of pivot columns. The rank is 2."
          - problem: "Find the pivot columns of A = [[1,3,2],[2,6,5]] as a comma-separated list of column numbers."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1: Row-reduce A = [[1,3,2],[2,6,5]] by replacing row 2 with row 2 minus twice row 1, obtaining [0,0,1]. Step 2: The pivot positions are in column 1 of the first row and column 3 of the second row. The pivot columns are 1, 3."
          - problem: "Find a basis for the column space of A = [[1,2,4],[2,5,7]] using the original pivot columns, and give the answer as [a,b;c,d]."
            answer: "[1,2;2,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Row-reduce A = [[1,2,4],[2,5,7]] by replacing row 2 with row 2 minus twice row 1, obtaining [0,1,-1]. Step 2: The pivot columns are 1 and 2, so the original columns (1,2) and (2,5) form a basis. Step 3: Put these original columns side by side as the matrix [1,2;2,5]. The matrix is [1,2;2,5]."
          - problem: "Let A = [[1,2,3],[2,4,7]] and b = (5,9). Decide whether b is in the column space of A, and give the rank of A."
            answer: "verdict = in; rank = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "rank"}]}
            solution_sketch: "Step 1: For A = [[1,2,3],[2,4,7]] and b = (5,9), the columns (1,2) and (3,7) are independent and form a basis for the column space. Step 2: Write b as 8(1,2) - 1(3,7), so b is in the column space. Step 3: The rank is the number of the two basis columns, so rank = 2. The wrong option out would mean b is not in the column space, but the explicit combination shows it is. The answer is verdict = in; rank = 2."
        constraints: "use original columns (not reduced ones) for the basis; rank at most 2"
      - id: kp3
        name: The rank-nullity theorem
        key_prerequisites: [basis-dimension, solution-sets-free-variables]
        exemplars:
          - problem: '$A$ is $3 \times 5$ with rank $2$. What is the dimension of its null space?'
            answer: "3"
            solution_sketch: 'Rank-nullity: $\mathrm{rank} + \mathrm{nullity} = 5$ (the number of columns).'
          - problem: '$A$ is $4 \times 4$ and $A\mathbf{x} = \mathbf{0}$ has only the trivial solution. What is the rank of $A$?'
            answer: "4"
            solution_sketch: 'Nullity $0$, so rank $= 4 - 0 = 4$.'
          - problem: "$A$ is a $2 \\times 5$ matrix with nullity $4$. Find $\\operatorname{rank}(A)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rank-nullity theorem states that $\\operatorname{rank}(A) + \\operatorname{nullity}(A)$ equals the number of columns of $A$, which is $5$ here. Substituting the given nullity gives $\\operatorname{rank}(A) + 4 = 5$. Therefore the rank of A is 1."
          - problem: "A linear transformation $T: \\mathbb{R}^5 \\to \\mathbb{R}^3$ has a kernel of dimension $3$. Find the rank of $T$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the matrix of $T$, the domain is $\\mathbb{R}^5$, so the rank-nullity theorem gives rank plus nullity equal to $5$. The kernel has dimension $3$, so $\\operatorname{rank}(T) = 5 - 3 = 2$. The rank of T is 2."
          - problem: "A homogeneous system of linear equations in $5$ unknowns has a coefficient matrix of rank $3$. How many free variables are in the general solution?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the rank-nullity theorem, the nullity equals the number of unknowns minus the rank: $5 - 3 = 2$. The nullity of the coefficient matrix counts the free variables in the general solution. The general solution has 2 free variables."
          - problem: "The null space of a $5 \\times 5$ matrix $A$ is a line through the origin. Find $\\operatorname{rank}(A)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A line through the origin is a one-dimensional subspace, so the nullity of $A$ is $1$. The rank-nullity theorem gives $\\operatorname{rank}(A) + 1 = 5$, since $A$ has $5$ columns. Therefore rank(A) = 4."
        constraints: "sizes up to 5 columns; ask for rank or nullity, given the other"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2&3\\2&4&8\end{pmatrix}$, find the rank, a basis for the null space, and check the rank-nullity theorem.'
      answer: 'Rank 2; null space basis {(-2, 1, 0)}; rank + nullity = 2 + 1 = 3, the number of columns'
      answer_contract: {kind: none}
      solution_sketch: 'Row reduction gives pivots in columns $1$ and $3$, so the rank is $2$ and $x_2$ is free with $x_3 = 0$ and $x_1 = -2x_2$.'
    anki_seeds:
      - front: 'Rank-nullity theorem for an $m \times n$ matrix $A$?'
        back: '$\mathrm{rank}(A) + \dim \mathrm{Nul}(A) = n$ (the number of columns).'
        type: basic
      - front: 'A basis for $\mathrm{Col}(A)$ is given by which columns?'
        back: 'The pivot columns of the ORIGINAL matrix $A$.'
        type: basic

  - id: rank-nullity-applications
    name: Applying Rank and Nullity
    core: false                # applications leaf topic
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: null-column-space-rank
        weight: 0.8
        key: true
      - id: determinants-2x2
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Reading rank and nullity from pivots
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: "A is a 3 x 4 matrix and its echelon form has 2 pivots. Find the nullity of A."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix has 3 rows and 4 columns, so the number of columns is 4. The rank equals the number of pivots, so rank A = 2. Rank-nullity gives nullity = 4 - 2 = 2, so the nullity is 2."
          - problem: "A is a 5 x 3 matrix and its echelon form has a pivot in every column. Find the rank of A."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix has 5 rows and 3 columns, so every column having a pivot means 3 pivots. The rank equals the number of pivots, so rank A = 3. Therefore the rank is 3."
          - problem: "A is a 4 x 5 matrix with rank 3. Find the nullity of A."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix has 4 rows and 5 columns, so the number of columns is 5. Rank-nullity states nullity = columns - rank, and the rank is given as 3. Thus nullity = 5 - 3 = 2, so the nullity is 2."
          - problem: "A is a 5 x 5 matrix whose null space has dimension 4. Find the rank of A."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is 5 x 5, so the number of columns is 5. The null space has dimension 4, so the nullity is 4. Rank-nullity gives rank = 5 - 4 = 1, so the rank is 1."
          - problem: "A is a 4 x 4 matrix and its echelon form has 3 pivots. Find the rank of A."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is 4 x 4, so the number of columns is 4. The echelon form has 3 pivots, and the rank equals the pivot count. Thus rank A = 3, so the rank is 3."
          - problem: "A is a 5 x 2 matrix and its echelon form has a pivot in every column. Find the nullity of A."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix has 5 rows and 2 columns, so every column having a pivot means 2 pivots. The rank equals the number of pivots, so rank A = 2. Rank-nullity gives nullity = 2 - 2 = 0, so the nullity is 0."
        constraints: "sizes up to 5x5; one of rank/nullity/pivot count given"
      - id: kp2
        name: What the shape forces
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: "A is a $2 \\times 4$ matrix, so it has more columns than rows. Find the minimum possible nullity of $A$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rank of $A$ is at most $2$ by the rank bound $\\operatorname{rank}(A) \\leq \\min(m,n) = \\min(2,4)$. By the rank-nullity identity, $\\operatorname{nullity}(A) = 4 - \\operatorname{rank}(A) \\geq 4 - 2$. Free variables are therefore unavoidable for this wide shape. The minimum possible nullity of $A$ is 2."
          - problem: "A is a $4 \\times 3$ matrix with real entries, so it has fewer columns than rows. Give the largest possible dimension of the column space of $A$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The column space is spanned by the $3$ columns, so by the rank bound $\\operatorname{rank}(A) \\leq \\min(4,3) = 3$. A matrix with three pivot columns attains this bound, so the columns can never span all of $\\mathbb{R}^4$. The largest possible dimension of the column space of $A$ is 3."
          - problem: "A is a $3 \\times 7$ matrix with $\\operatorname{rank}(A) = 3$. Find the nullity of $A$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the rank-nullity identity, $\\operatorname{rank}(A) + \\operatorname{nullity}(A)$ equals the number of columns, which is $7$. Substituting $\\operatorname{rank}(A) = 3$ gives $\\operatorname{nullity}(A) = 7 - 3$. The nullity of $A$ is 4."
          - problem: "A is a $6 \\times 2$ matrix and its two columns are linearly independent. Find the nullity of $A$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Linearly independent columns give $\\operatorname{rank}(A) = 2$. By the rank-nullity identity, $\\operatorname{nullity}(A) = 2 - \\operatorname{rank}(A) = 2 - 2$, so $A\\mathbf{x} = \\mathbf{0}$ has only the trivial solution; a tall matrix can avoid free variables. The nullity of $A$ is 0."
          - problem: "A is a $3 \\times 3$ matrix whose columns are linearly dependent. Give all possible values of the nullity of $A$ as a set."
            answer: "{1, 2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Dependent columns force $\\operatorname{rank}(A) \\leq 2$ by the dependence bound, and always $\\operatorname{rank}(A) \\geq 0$. The rank-nullity identity gives $\\operatorname{nullity}(A) = 3 - \\operatorname{rank}(A)$, so the nullity is $3$, $2$, or $1$, and each value occurs for a suitable $A$. The set of possible nullities is {1, 2, 3}."
          - problem: "A is a $4 \\times 4$ matrix with $\\operatorname{nullity}(A) = 1$. Find the rank of $A$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the rank-nullity identity, $\\operatorname{rank}(A) + \\operatorname{nullity}(A) = 4$ for a square $4 \\times 4$ matrix. Substituting $\\operatorname{nullity}(A) = 1$ gives $\\operatorname{rank}(A) = 4 - 1$. The rank of $A$ is 3."
        constraints: "wide vs tall matrices; conclusions forced by rank <= min(m, n)"
      - id: kp3
        name: Rank and invertibility
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: '$A$ is $3 \times 3$ with rank $2$. What is $\det A$?'
            answer: "0"
            solution_sketch: 'Rank below $n$ means $A$ is singular, and singular matrices have determinant $0$.'
          - problem: "$A$ is a $4 \\times 4$ matrix with rank $4$. Give a verdict, invertible or singular, and the nullity of $A$."
            answer: "verdict = invertible; nullity = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "nullity"}]}
            solution_sketch: "Rank-nullity theorem: for the 4x4 matrix $A$, nullity = n - rank = 4 - 4 = 0. Invertible matrix theorem: rank $n$ in an $n \\times n$ matrix means a pivot in every row and column, so $A$ is invertible. Thus verdict = invertible; nullity = 0."
          - problem: "$A$ is a $5 \\times 5$ matrix and $\\det A = 7$. Give the rank of $A$ and the nullity of $A$."
            answer: "rank = 5; nullity = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rank"}, {"contract": {"kind": "exact"}, "name": "nullity"}]}
            solution_sketch: "Invertible matrix theorem: $\\det A = 7 \\neq 0$, so the 5x5 matrix $A$ is invertible and has rank $5$. Rank-nullity theorem: nullity = 5 - rank = 5 - 5 = 0. Thus rank = 5; nullity = 0."
          - problem: "$A$ is a $3 \\times 3$ matrix with nullity $1$. Give a verdict, invertible or singular, and the rank of $A$."
            answer: "verdict = singular; rank = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "rank"}]}
            solution_sketch: "Invertible matrix theorem: nullity $1$ means $\\mathrm{Nul}(A)$ is nontrivial, so the 3x3 matrix $A$ is singular. Rank-nullity theorem: rank = n - nullity = 3 - 1 = 2. Thus verdict = singular; rank = 2."
          - problem: "Let $A = [2,4; 1,2]$. Give a verdict, invertible or singular, and $\\det A$."
            answer: "verdict = singular; det = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Apply the 2x2 determinant formula to $A = [2,4; 1,2]$: $\\det A = 2 \\cdot 2 - 4 \\cdot 1 = 0$. Invertible matrix theorem: determinant $0$ means $A$ is singular. Thus verdict = singular; det = 0."
          - problem: "Let $A = [1,0,2; 0,1,3; 1,1,5]$. Give $\\det A$ and the nullity of $A$."
            answer: "det = 0; nullity = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "det"}, {"contract": {"kind": "exact"}, "name": "nullity"}]}
            solution_sketch: "Expand $\\det A$ of $A = [1,0,2; 0,1,3; 1,1,5]$ along the first row: $1(5-3) - 0 + 2(0-1) = 2 - 2 = 0$. Determinant $0$ means rank below $3$; rows one and two are independent, so rank = 2. Rank-nullity theorem: nullity = 3 - 2 = 1. Thus det = 0; nullity = 1."
          - problem: "$A$ is a $4 \\times 4$ matrix with rank $3$. Give a verdict, invertible or singular, and the nullity of $A$."
            answer: "verdict = singular; nullity = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "nullity"}]}
            solution_sketch: "Invertible matrix theorem: rank $3 < n = 4$ for the 4x4 matrix $A$, so $A$ is singular and $\\det A = 0$. Rank-nullity theorem: nullity = 4 - 3 = 1. Thus verdict = singular; nullity = 1."
        constraints: "square matrices; connect rank n to invertible/det nonzero/trivial null space"
    diagnostic_exemplar:
      problem: '$A$ is $3 \times 3$ and its echelon form has $2$ pivots. Give the rank and nullity of $A$, say whether $A$ is invertible, and give $\det A$.'
      answer: 'Rank 2, nullity 1; not invertible; det A = 0'
      answer_contract: {kind: none}
      solution_sketch: 'Rank equals the pivot count and nullity is $3 - 2 = 1$; a nontrivial null space rules out invertibility, which forces $\det A = 0$.'
    anki_seeds:
      - front: 'For an $m \times n$ matrix, the rank is at most...'
        back: '$\min(m, n)$.'
        type: basic
      - front: 'A square $n \times n$ matrix is invertible iff its rank is...'
        back: '$n$ (equivalently, nullity $0$, determinant nonzero).'
        type: basic

  - id: linear-transformations
    name: Linear Transformations
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: matrix-operations
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.6
        key: true
      - id: vectors-in-rn
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluating and recognizing linear maps
        key_prerequisites: [matrix-vector-equations]
        exemplars:
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&-1\\2&0\end{pmatrix}$. Compute $T(3, 1)$.'
            answer: "(2, 6)"
            solution_sketch: '$(3 - 1, 6 + 0)$.'
          - problem: 'If $T$ is linear with $T(\mathbf{u}) = (1, 2)$ and $T(\mathbf{v}) = (3, 0)$, compute $T(2\mathbf{u} + \mathbf{v})$.'
            answer: "(5, 4)"
            solution_sketch: '$2T(\mathbf{u}) + T(\mathbf{v}) = (2, 4) + (3, 0)$.'
          - problem: "Let $T(x, y) = (x + 2, y - 1)$. State whether $T$ is linear, and give $T(0, 0)$ as (a, b)."
            answer: "verdict = no; t0 = (2,-1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "t0"}]}
            solution_sketch: "Step 1, origin test: every linear map sends the zero vector to the zero vector, so evaluate T at (0, 0). Step 2, evaluate the full map: T(0, 0) = (0 + 2, 0 - 1) = (2, -1), which is not the zero vector. Step 3, conclude: T fails the origin test, so it is not linear. The key is verdict = no; t0 = (2,-1)."
          - problem: "Let $T$ be a linear map with $T(\\mathbf{u}) = (2, -1)$ and $T(\\mathbf{v}) = (4, 3)$. Compute $T(\\mathbf{u} + \\mathbf{v})$ as (a, b) and $T(\\mathbf{u} - 2\\mathbf{v})$ as (c, d)."
            answer: "sum = (6,2); diff = (-6,-7)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "sum"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "diff"}]}
            solution_sketch: "Step 1, linearity rule: a linear map satisfies T(u + v) = T(u) + T(v) and T(u - 2v) = T(u) - 2T(v). Step 2, compute the sum: (2, -1) + (4, 3) = (6, 2). Step 3, compute the difference: (2, -1) - 2(4, 3) = (2 - 8, -1 - 6) = (-6, -7). The key is sum = (6,2); diff = (-6,-7)."
          - problem: "A map $T$ is linear and $T(2\\mathbf{u}) = (10, 4)$. Find $T(\\mathbf{u})$ as (a, b)."
            answer: "(5,2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, scalar rule: linearity gives T(2u) = 2T(u) for every scalar. Step 2, divide the full vector (10, 4) by the scalar 2, component by component: (10/2, 4/2). The key is (5,2)."
          - problem: "Let $T$ be linear with $T(\\mathbf{u}) = (1, 2)$, $T(\\mathbf{v}) = (3, 0)$, and $T(\\mathbf{w}) = (-1, 4)$. Compute $T(\\mathbf{u} + 2\\mathbf{v} - \\mathbf{w})$ as (a, b)."
            answer: "(8,-2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, linearity rule: T(u + 2v - w) = T(u) + 2T(v) - T(w). Step 2, substitute the full values: (1, 2) + 2(3, 0) - (-1, 4) = (1 + 6 + 1, 2 + 0 - 4). Step 3, simplify each component. The key is (8,-2)."
        constraints: "2x2 matrices; linearity checks via T(0) or additivity"
      - id: kp2
        name: The standard matrix
        key_prerequisites: [matrix-vector-equations, vectors-in-rn]
        exemplars:
          - problem: '$T$ is linear with $T(\mathbf{e}_1) = (2, 1)$ and $T(\mathbf{e}_2) = (-1, 3)$. Find the standard matrix of $T$.'
            answer: "[2,-1;1,3]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'The columns are the images of the standard basis vectors.'
          - problem: 'Find the standard matrix of the rotation of $\mathbb{R}^2$ by $90^\circ$ counterclockwise.'
            answer: "[0,-1;1,0]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$\mathbf{e}_1 \mapsto (0, 1)$ and $\mathbf{e}_2 \mapsto (-1, 0)$.'
          - problem: 'Find the standard matrix of the reflection of $\mathbb{R}^2$ across the $x$-axis.'
            answer: "[1,0;0,-1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: "Find the standard matrix of the rotation of $\\mathbb{R}^2$ by $180^\\circ$ counterclockwise. Give the matrix as [a,b;c,d]."
            answer: "[-1,0;0,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "A rotation by $180^\\circ$ sends $\\mathbf{e}_1 = (1,0)$ to $(-1,0)$ and $\\mathbf{e}_2 = (0,1)$ to $(0,-1)$, so these images are the columns. The first column is $(-1,0)$ and the second is $(0,-1)$. The standard matrix is [-1,0;0,-1]."
          - problem: "Find the standard matrix of the reflection of $\\mathbb{R}^2$ across the $y$-axis. Give the matrix as [a,b;c,d]."
            answer: "[-1,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Reflecting across the $y$-axis flips the sign of the $x$-coordinate and keeps the $y$-coordinate. So $\\mathbf{e}_1 = (1,0)$ maps to $(-1,0)$ and $\\mathbf{e}_2 = (0,1)$ maps to $(0,1)$; these are the columns. The standard matrix is [-1,0;0,1]."
          - problem: "$T: \\mathbb{R}^2 \\to \\mathbb{R}^3$ is linear with $T(\\mathbf{e}_1) = (1, 2, 3)$ and $T(\\mathbf{e}_2) = (-2, 0, 5)$. Find the standard matrix of $T$. Give the matrix as [a,b;c,d]."
            answer: "[1,-2;2,0;3,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 3}
            solution_sketch: "The standard matrix has the images of the standard basis vectors as its columns. Column 1 is $T(\\mathbf{e}_1) = (1, 2, 3)$ and column 2 is $T(\\mathbf{e}_2) = (-2, 0, 5)$, giving a 3 by 2 matrix. The standard matrix is [1,-2;2,0;3,5]."
        constraints: "images of e1, e2 given, or standard geometric maps (rotations by multiples of 90 degrees, axis reflections, scalings)"
      - id: kp3
        name: Composition as matrix multiplication
        key_prerequisites: [matrix-operations, matrix-vector-equations]
        exemplars:
          - problem: '$S$ has matrix $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ (reflect across the $x$-axis) and $T$ has matrix $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ (rotate $90^\circ$). Find the matrix of $S \circ T$.'
            answer: "[0,-1;-1,0]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Matrix of $S \circ T$ is (matrix of $S$)(matrix of $T$): $\begin{pmatrix}1&0\\0&-1\end{pmatrix}\begin{pmatrix}0&-1\\1&0\end{pmatrix}$.'
          - problem: 'What single matrix performs "rotate by $90^\circ$" twice?'
            answer: "[-1,0;0,-1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$\begin{pmatrix}0&-1\\1&0\end{pmatrix}^2 = -I$: rotation by $180^\circ$.'
          - problem: "$S$ has matrix $\\begin{pmatrix}-1&0\\\\0&1\\end{pmatrix}$ (reflect across the $y$-axis) and $T$ has matrix $\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$ (rotate $90^\\circ$). Find the matrix of $S \\circ T$. Give the matrix as [a,b;c,d]."
            answer: "[0,1;1,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix of $S \\circ T$ is (matrix of $S$)(matrix of $T$). Multiply $\\begin{pmatrix}-1&0\\\\0&1\\end{pmatrix}\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$: row 1 is $(-1)(0)+0(1)=0$ and $(-1)(-1)+0(0)=1$; row 2 is $0(0)+1(1)=1$ and $0(-1)+1(0)=0$. The matrix of $S \\circ T$ is [0,1;1,0]."
          - problem: "$S$ has matrix $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$ (scale the $x$-axis by $2$ and the $y$-axis by $3$) and $T$ has matrix $\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$ (rotate $90^\\circ$). Find the matrix of $S \\circ T$. Give the matrix as [a,b;c,d]."
            answer: "[0,-2;3,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix of $S \\circ T$ is (matrix of $S$)(matrix of $T$). Multiply $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$: row 1 is $2(0)+0(1)=0$ and $2(-1)+0(0)=-2$; row 2 is $0(0)+3(1)=3$ and $0(-1)+3(0)=0$. The matrix of $S \\circ T$ is [0,-2;3,0]."
          - problem: "$S$ has matrix $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$ (scale the $x$-axis by $2$ and the $y$-axis by $3$) and $R$ has matrix $\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ (reflect across the $x$-axis). Find the matrix of $R \\circ S$. Give the matrix as [a,b;c,d]."
            answer: "[2,0;0,-3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix of $R \\circ S$ is (matrix of $R$)(matrix of $S$). Multiply $\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$: row 1 is $1(2)+0(0)=2$ and $1(0)+0(3)=0$; row 2 is $0(2)+(-1)(0)=0$ and $0(0)+(-1)(3)=-3$. The matrix of $R \\circ S$ is [2,0;0,-3]."
          - problem: "$T$ rotates the plane by $90^\\circ$ counterclockwise and has matrix $\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$. What single matrix performs this rotation three times in a row? Give the matrix as [a,b;c,d]."
            answer: "[0,1;-1,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Three rotations give $T^3 = T \\cdot T \\cdot T$. First $T^2 = \\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix} = \\begin{pmatrix}-1&0\\\\0&-1\\end{pmatrix}$. Then $T^3 = T^2 T = \\begin{pmatrix}-1&0\\\\0&-1\\end{pmatrix}\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$, which has row 1 $(-1)(0)+0(1)=0$, $(-1)(-1)+0(0)=1$ and row 2 $0(0)+(-1)(1)=-1$, $0(-1)+(-1)(0)=0$. The single matrix is [0,1;-1,0]."
        constraints: "compose two of: 90-degree rotations, axis reflections, integer scalings"
    diagnostic_exemplar:
      problem: '$S$ reflects $\mathbb{R}^2$ across the $x$-axis and $T$ rotates it by $90^\circ$ counterclockwise. Find the standard matrix of $S \circ T$ and compute $(S \circ T)(1, 2)$.'
      answer: '$\begin{pmatrix}0&-1\\-1&0\end{pmatrix}$; $(S \circ T)(1, 2) = (-2, -1)$'
      answer_contract: {kind: none}
      solution_sketch: '$S = \begin{pmatrix}1&0\\0&-1\end{pmatrix}$ and $T = \begin{pmatrix}0&-1\\1&0\end{pmatrix}$, so the composition has matrix $ST$; applying it to $(1,2)$ gives $(-2, -1)$.'
    anki_seeds:
      - front: 'The two defining properties of a linear transformation?'
        back: '$T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ and $T(c\mathbf{u}) = cT(\mathbf{u})$.'
        type: basic
      - front: 'Column $j$ of the standard matrix of a linear map $T$ is...'
        back: '$T(\mathbf{e}_j)$, the image of the $j$-th standard basis vector.'
        type: basic
      - front: 'Standard matrix of a $90^\circ$ counterclockwise rotation of $\mathbb{R}^2$?'
        back: '$\begin{pmatrix}0&-1\\1&0\end{pmatrix}$'
        type: basic

  - id: kernel-image-linear-maps
    name: Kernel and Image of a Linear Map
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: linear-transformations
        weight: 0.7
        key: true
      - id: null-column-space-rank
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Computing kernels
        key_prerequisites: [linear-transformations, null-column-space-rank]
        exemplars:
          - problem: "Let $T(\\mathbf{x}) = A\\mathbf{x}$ with $A = \\begin{pmatrix}2&-4\\\\-1&2\\end{pmatrix}$. The kernel of $T$ is the solution set of $A\\mathbf{x} = \\mathbf{0}$. Find a nonzero vector that spans the kernel, and give it as (x, y) with x > 0."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the system $A\\mathbf{x}=\\mathbf{0}$: the rows give $2x-4y=0$ and $-x+2y=0$, which are the same equation. Solving gives $x=2y$, so the null space is one-dimensional and spanned by $(2,1)$ (take $y=1$). Check: $A(2,1)=(0,0)$. The kernel generator is (2, 1)."
          - problem: "A linear map $T: \\mathbb{R}^2 \\to \\mathbb{R}^2$ acts by $T(x, y) = (x + y,\\ 3x + 3y)$. The kernel consists of all inputs that $T$ sends to $(0, 0)$. Give a nonzero kernel generator as (x, y) with x > 0."
            answer: "(1, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set $T(x,y)=(0,0)$: both components give the single equation $x+y=0$. The null space is the line $y=-x$, which is one-dimensional and spanned by $(1,-1)$ (take $x=1$). Check: $T(1,-1)=(0,0)$. The kernel generator is (1, -1)."
          - problem: "For the map $T(x, y) = (2x - 3y,\\ -4x + 6y)$, the kernel is the line of inputs sent to $(0, 0)$. Find a nonzero vector spanning the kernel, and give it as (x, y) with x > 0."
            answer: "(3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set up the kernel equations $2x-3y=0$ and $-4x+6y=0$; the second row is $-2$ times the first, so one equation remains. Solving $2x=3y$ gives the spanning vector $(3,2)$ (take $y=2$). Check: $T(3,2)=(0,0)$. The kernel generator is (3, 2)."
          - problem: "A linear map $T$ satisfies $T(1, 0) = (-3, -6)$ and $T(0, 1) = (1, 2)$. Every input on the kernel line maps to $(0, 0)$. Give a nonzero kernel generator as (x, y) with x > 0."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The standard matrix has columns $T(1,0)=(-3,-6)$ and $T(0,1)=(1,2)$, so the kernel solves $-3x+y=0$ and $-6x+2y=0$. Both rows reduce to $y=3x$, so $(1,3)$ spans the kernel (take $x=1$). Check: $1\\cdot(-3,-6)+3\\cdot(1,2)=(0,0)$. The kernel generator is (1, 3)."
          - problem: "Let $T(\\mathbf{x}) = A\\mathbf{x}$ with $A = \\begin{pmatrix}2&5\\\\4&10\\end{pmatrix}$. Vectors in the kernel satisfy both rows of the equation $A\\mathbf{x} = \\mathbf{0}$. Determine a nonzero vector that spans the kernel, and give it as (x, y) with x > 0."
            answer: "(5, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Row reduce $A\\mathbf{x}=\\mathbf{0}$: the second row $[4,10]$ is $2$ times $[2,5]$, so the rank is $1$ and the kernel is one-dimensional. The equation $2x+5y=0$ gives the spanning vector $(5,-2)$ (take $y=-2$). Check: $A(5,-2)=(0,0)$. The kernel generator is (5, -2)."
          - problem: "The map $T(x, y) = (x + 2y,\\ 3x + 6y)$ sends a whole line of inputs to $(0, 0)$. Determine a nonzero vector spanning that kernel line, and give it as (x, y) with x > 0."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Setting $x+2y=0$ and $3x+6y=0$ leaves one independent equation, so the kernel is a line. Solving gives $x=-2y$, and the spanning vector with positive first entry is $(2,-1)$ (take $y=-1$). Check: $T(2,-1)=(2-2,6-6)=(0,0)$. The kernel generator is (2, -1)."
        constraints: "2x2 matrices with 1-dimensional kernels; integer kernel generators"
      - id: kp2
        name: Computing images
        key_prerequisites: [linear-transformations, null-column-space-rank]
        exemplars:
          - problem: 'Describe the image of $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$.'
            answer: "The line span{(1, 2)}"
            answer_contract: {kind: none}
            solution_sketch: 'The image is $\mathrm{Col}(A)$; both columns are multiples of $(1, 2)$.'
          - problem: 'Is $(3, 6)$ in the image of the same $T$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$(3, 6) = 3(1, 2)$, e.g. $T(3, 0) = (3, 6)$.'
        constraints: "images are lines or all of R^2; membership by proportionality"
      - id: kp3
        name: Rank-nullity for maps
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: '$T: \mathbb{R}^5 \to \mathbb{R}^3$ is linear with $\dim \ker T = 3$. Find $\dim \mathrm{im}\, T$.'
            answer: "2"
            solution_sketch: '$\dim \ker + \dim \mathrm{im} = 5$ (the domain dimension).'
          - problem: '$T: \mathbb{R}^4 \to \mathbb{R}^4$ has image all of $\mathbb{R}^4$. Find $\ker T$.'
            answer: "{0}"
            solution_sketch: '$\dim \ker = 4 - 4 = 0$.'
          - problem: "$T: \\mathbb{R}^5 \\to \\mathbb{R}^2$ is a linear map with $\\dim \\ker T = 4$. Find $\\dim \\mathrm{im}\\, T$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rank-nullity for maps: dim ker T + dim im T equals the domain dimension 5. Substitute dim ker T = 4 to get 4 + dim im T = 5. Solve: dim im T = 1. The answer is 1."
          - problem: "$T: \\mathbb{R}^2 \\to \\mathbb{R}^4$ is a linear map with $\\dim \\mathrm{im}\\, T = 2$. Find $\\dim \\ker T$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rank-nullity for maps: dim ker T + dim im T equals the domain dimension 2. Substitute dim im T = 2 to get dim ker T + 2 = 2. Solve: dim ker T = 0. The kernel has dimension 0."
          - problem: "Let $T(\\mathbf{x}) = A\\mathbf{x}$ where $A$ is a $3 \\times 5$ matrix with rank $2$. Find the dimension of the null space of $A$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For T(x) = Ax the rank-nullity theorem gives rank(A) + dim null(A) = number of columns = 5. Substitute rank(A) = 2 to get 2 + dim null(A) = 5. Solve: dim null(A) = 3. The dimension of the null space is 3."
          - problem: "Let $T(\\mathbf{x}) = A\\mathbf{x}$ where $A$ is a $4 \\times 3$ matrix and the null space of $A$ has dimension $1$. Find the rank of $A$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By rank-nullity, rank(A) + dim null(A) equals the number of columns of A, which is 3. Substitute dim null(A) = 1 to get rank(A) + 1 = 3. Solve: rank(A) = 2. The rank of A is 2."
        constraints: "domain dimension up to 5; ask for kernel or image dimension, given the other"
    diagnostic_exemplar:
      problem: 'For $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&3\\2&6\end{pmatrix}$, find $\ker T$, describe $\mathrm{im}\,T$, and check that the two dimensions add to $2$.'
      answer: 'ker T = span{(-3, 1)}; im T = span{(1, 2)}, the line through the origin with direction (1, 2); 1 + 1 = 2'
      answer_contract: {kind: none}
      solution_sketch: '$x + 3y = 0$ gives the kernel; both columns are multiples of $(1, 2)$, so the image is that line; rank $1$ plus nullity $1$ equals the $2$ columns.'
    anki_seeds:
      - front: 'For $T(\mathbf{x}) = A\mathbf{x}$: kernel and image in matrix language?'
        back: '$\ker T = \mathrm{Nul}(A)$; $\mathrm{im}\, T = \mathrm{Col}(A)$.'
        type: basic
      - front: 'Rank-nullity for a linear map $T: \mathbb{R}^n \to \mathbb{R}^m$?'
        back: '$\dim \ker T + \dim \mathrm{im}\, T = n$ (the domain dimension).'
        type: basic

  - id: one-to-one-onto-linear-transformations
    name: One-to-One and Onto Linear Maps
    core: false                # classification of linear maps; terminal
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: kernel-image-linear-maps
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.4
      - id: determinants-2x2
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One-to-one means trivial kernel
        key_prerequisites: [kernel-image-linear-maps]
        exemplars:
          - problem: 'Is $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$ one-to-one?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The kernel contains $(-2, 1) \neq \mathbf{0}$, so two different inputs share an output.'
          - problem: '$A = \begin{pmatrix}1&0\\0&2\\3&1\end{pmatrix}$ defines $T: \mathbb{R}^2 \to \mathbb{R}^3$. Is $T$ one-to-one?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The columns are independent (a pivot in every column), so the kernel is trivial.'
        constraints: "decide via kernel or pivot-in-every-column; sizes up to 3x3"
      - id: kp2
        name: Onto means full column space
        key_prerequisites: [kernel-image-linear-maps, row-reduction-echelon-forms]
        exemplars:
          - problem: '$A = \begin{pmatrix}1&2&0\\0&0&3\end{pmatrix}$ defines $T: \mathbb{R}^3 \to \mathbb{R}^2$. Is $T$ onto? Is it one-to-one?'
            answer: "Onto yes; one-to-one no"
            answer_contract: {kind: none}
            solution_sketch: 'Rank $2$ equals the number of rows, so a pivot in every row: onto. But $3$ columns with rank $2$ leaves a free variable: not one-to-one.'
          - problem: 'Can a linear map $T: \mathbb{R}^2 \to \mathbb{R}^3$ be onto?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The image has dimension at most $2 < 3$.'
        constraints: "wide vs tall matrices; onto iff pivot in every row"
      - id: kp3
        name: The square case
        key_prerequisites: [kernel-image-linear-maps, determinants-2x2]
        exemplars:
          - problem: '$A = \begin{pmatrix}2&1\\1&1\end{pmatrix}$. Is $T(\mathbf{x}) = A\mathbf{x}$ one-to-one? Onto?'
            answer: "Both"
            answer_contract: {kind: none}
            solution_sketch: '$\det A = 1 \neq 0$: for square matrices, invertible $\iff$ one-to-one $\iff$ onto.'
          - problem: '$A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$. Is $T$ one-to-one or onto?'
            answer: "Neither"
            answer_contract: {kind: none}
            solution_sketch: '$\det A = 0$: singular square matrices fail both at once.'
        constraints: "square 2x2 decided by the determinant; emphasize both-or-neither"
    diagnostic_exemplar:
      problem: '$A = \begin{pmatrix}2&4&1\\0&0&3\end{pmatrix}$ defines $T : \mathbb{R}^3 \to \mathbb{R}^2$. Is $T$ one-to-one? Is it onto? Justify from the pivots.'
      answer: 'Not one-to-one (3 columns but only 2 pivots, so the kernel is nontrivial); onto (2 pivots = the number of rows, so the columns span R^2)'
      answer_contract: {kind: none}
      solution_sketch: 'Pivots sit in columns $1$ and $3$; the free variable $x_2$ gives a nonzero kernel vector, while a pivot in every row makes the column space all of $\mathbb{R}^2$.'
    anki_seeds:
      - front: 'A linear map is one-to-one iff its kernel is...'
        back: '$\{\mathbf{0}\}$ (equivalently, a pivot in every column).'
        type: basic
      - front: '$T(\mathbf{x}) = A\mathbf{x}$ is onto $\mathbb{R}^m$ iff $A$ has...'
        back: 'a pivot in every row ($\mathrm{Col}(A) = \mathbb{R}^m$).'
        type: basic
      - front: 'For a SQUARE matrix, one-to-one and onto are...'
        back: 'equivalent (both hold iff the matrix is invertible).'
        type: basic

  - id: orthogonal-orthonormal-sets
    name: Orthogonal and Orthonormal Sets
    core: false                # head of the terminal orthogonality -> least-squares branch
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: dot-product
        weight: 0.7
        key: true
      - id: basis-dimension
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Checking orthogonality and normalizing
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Normalize the orthogonal set $\{(3, 4), (-4, 3)\}$ into an orthonormal set.'
            answer: "{(3/5, 4/5), (-4/5, 3/5)}"
            solution_sketch: 'Both vectors have norm $5$; divide each by $5$.'
          - problem: "The set S = {(4, 3), (-3, 4)} is proposed as a basis for the plane. Is S orthogonal, and what is the norm of each vector in S? Give verdict = yes or no, and norm."
            answer: "verdict = yes; norm = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "norm"}]}
            solution_sketch: "Step 1 (orthogonality check by the dot product): the dot product of (4, 3) and (-3, 4) is 4*(-3) + 3*4 = -12 + 12 = 0, so S is an orthogonal set. Step 2 (norm check for orthonormality): the norm of (4, 3) is sqrt(4^2 + 3^2) = sqrt(25) = 5, and (-3, 4) has the same norm, so the vectors are not unit and S is not orthonormal. The answer is verdict = yes; norm = 5."
          - problem: "Consider the pair of vectors (2, 3) and (3, 2). Are they orthogonal, and what is their dot product? Give verdict = yes or no, and dot."
            answer: "verdict = no; dot = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "dot"}]}
            solution_sketch: "Step 1 (dot product rule): (2, 3) . (3, 2) = 2*3 + 3*2 = 6 + 6 = 12. Step 2 (orthogonality condition): a pair is orthogonal only when its dot product is 0, and 12 is not 0, so the pair fails the test. The wrong verdict yes comes from forgetting the sign rule or adding wrong. The answer is verdict = no; dot = 12."
          - problem: "A vector v = (-3, 4) belongs to an orthogonal set that must become orthonormal. Find the unit vector in the direction of v. Give the answer as (x, y)."
            answer: "(-3/5, 4/5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (norm from the dot product): the norm of (-3, 4) is sqrt((-3)^2 + 4^2) = sqrt(9 + 16) = sqrt(25) = 5. Step 2 (normalize by dividing by the norm): (-3, 4)/5 = (-3/5, 4/5), whose norm is sqrt(9/25 + 16/25) = 1. The answer is (-3/5, 4/5)."
          - problem: "The vectors (k, 4) and (3, -6) form an orthogonal set. Find the value of k."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (orthogonality condition): the dot product (k, 4) . (3, -6) = 3k - 24 must equal 0. Step 2 (solve the linear equation): 3k = 24, so k = 24/3 = 8. The answer is 8."
          - problem: "The set {(1, 1), (-1, 1)} is orthogonal but not orthonormal. Normalize it into an orthonormal set. Give u1 = the normalized form of (1, 1) and u2 = the normalized form of (-1, 1), each as (x, y)."
            answer: "u1 = (1/sqrt(2), 1/sqrt(2)); u2 = (-1/sqrt(2), 1/sqrt(2))"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "u1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "u2"}]}
            solution_sketch: "Step 1 (norm of each vector): (1, 1) and (-1, 1) both have norm sqrt(1^2 + 1^2) = sqrt(2), so the common divisor is sqrt(2). Step 2 (normalize by dividing each vector by its norm): (1, 1)/sqrt(2) = (1/sqrt(2), 1/sqrt(2)) and (-1, 1)/sqrt(2) = (-1/sqrt(2), 1/sqrt(2)); their dot product is still 0 and each norm is 1. The answer is u1 = (1/sqrt(2), 1/sqrt(2)); u2 = (-1/sqrt(2), 1/sqrt(2))."
        constraints: "pairs with dot product 0 for yes-cases; norms 5, sqrt(2), or 3 for clean normalization"
      - id: kp2
        name: Orthogonal sets in R^3 and independence
        key_prerequisites: [dot-product, basis-dimension]
        exemplars:
          - problem: "Let $u = (1, 2, 2)$, $v = (2, 1, -2)$, and $w = (2, -2, 1)$ be vectors in $\\mathbb{R}^3$. How many of the three pairwise dot products $u \\cdot v$, $u \\cdot w$, and $v \\cdot w$ equal 0?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute each pair with the dot product rule: $u \\cdot v = 2 + 2 - 4 = 0$, $u \\cdot w = 2 - 4 + 2 = 0$, and $v \\cdot w = 4 - 2 - 2 = 0$. All three pairwise dot products vanish, so $\\{u, v, w\\}$ is an orthogonal set. The number of pairwise dot products equal to 0 is 3."
          - problem: "Let $S = \\{(2, 1, 2), (1, 0, -2), (0, 5, 0)\\}$ be a set of three nonzero vectors in $\\mathbb{R}^3$. Is $S$ a basis of $\\mathbb{R}^3$? Give verdict = yes or no, and give $d$, the dimension of the span of $S$."
            answer: "verdict = yes; d = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Check the set $S = \\{(2, 1, 2), (1, 0, -2), (0, 5, 0)\\}$ pairwise by the dot product rule: $u \\cdot v = 2 + 0 - 4 = 0$, $u \\cdot w = 0$, and $v \\cdot w = 0$, so $S$ is orthogonal. By the orthogonal-set rule, nonzero orthogonal vectors are linearly independent, and three independent vectors in $\\mathbb{R}^3$ form a basis, so the span has dimension 3. The wrong option no would forget that an orthogonal set of nonzero vectors must be independent. So verdict = yes; d = 3."
          - problem: "The vectors $a = (1, 3, 2)$, $b = (3, -1, 0)$, and $c = (1, 3, t)$ lie in $\\mathbb{R}^3$, and $b$ is orthogonal to both $a$ and $c$ for every value of $t$. Find the value of $t$ that makes the set $\\{a, b, c\\}$ orthogonal."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First $a \\cdot b = 3 - 3 + 0 = 0$ by the dot product rule, and this holds for every $t$. Next $a \\cdot c = 1 + 9 + 2t = 10 + 2t$ by the dot product rule. The orthogonality condition gives $10 + 2t = 0$, so $t = -5$. The required value is $t = -5$."
          - problem: "Consider the set $S = \\{(1, 0, 2), (0, 3, 0), (0, 0, 0)\\}$ in $\\mathbb{R}^3$. Compute the three pairwise dot products of $S$, and give $k$, the number of them that equal 0, and $d$, the dimension of the span of $S$."
            answer: "k = 3; d = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "k"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "The pairwise dot products of $S = \\{(1, 0, 2), (0, 3, 0), (0, 0, 0)\\}$ each have a zero factor, so all three equal 0 by the dot product rule and $k = 3$. The zero vector makes the set linearly dependent, and the two nonzero orthogonal vectors span only a plane, so basis-dimension reasoning gives $d = 2$. So k = 3; d = 2."
          - problem: "Three nonzero vectors $u$, $v$, and $w$ in $\\mathbb{R}^3$ are pairwise orthogonal, and their lengths are 3, 4, and 12. Find the length of $u + v + w$."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the squared length by dot product algebra: $\\|u + v + w\\|^2 = \\|u\\|^2 + \\|v\\|^2 + \\|w\\|^2 + 2(u \\cdot v + u \\cdot w + v \\cdot w)$. Pairwise orthogonality makes every cross term 0, leaving $9 + 16 + 144 = 169$. The length is $\\sqrt{169} = 13$. The length of $u + v + w$ is 13."
          - problem: "Let $u$, $v$, and $z$ be nonzero pairwise orthogonal vectors in $\\mathbb{R}^3$ with $\\|u\\|^2 = 4$, $\\|v\\|^2 = 9$, and $\\|z\\|^2 = 16$, and let $w = 3u - 2v + z$. Give $a = w \\cdot u$, $b = w \\cdot v$, and $c = w \\cdot z$."
            answer: "a = 12; b = -18; c = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Distribute the dot product over $w = 3u - 2v + z$: $w \\cdot u = 3(u \\cdot u) - 2(v \\cdot u) + z \\cdot u$. Orthogonality gives $v \\cdot u = 0$ and $z \\cdot u = 0$, so $a = 3 \\cdot 4 = 12$. Similarly $b = w \\cdot v = 0 - 2 \\cdot 9 + 0 = -18$ and $c = w \\cdot z = 0 - 0 + 16 = 16$. So a = 12; b = -18; c = 16."
        constraints: "3 vectors in R^3 with all pairwise dot products checkable mentally"
      - id: kp3
        name: Coordinates in an orthogonal basis
        key_prerequisites: [dot-product, basis-dimension]
        exemplars:
          - problem: 'Find the coefficient of $(1, 0, 1)$ when $\mathbf{x} = (3, 5, 1)$ is expanded in an orthogonal basis containing it.'
            answer: "2"
            solution_sketch: '$c = \frac{(3,5,1)\cdot(1,0,1)}{(1,0,1)\cdot(1,0,1)} = \frac{4}{2} = 2$.'
          - problem: "The vector $\\mathbf{x} = (6, 2)$ is written in the orthogonal basis $\\{(1, 1), (1, -1)\\}$. Compute both coefficients with dot products and give them as (c1, c2)."
            answer: "(4, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "In an orthogonal basis each coefficient is $c_i = (\\mathbf{x} \\cdot \\mathbf{v}_i)/(\\mathbf{v}_i \\cdot \\mathbf{v}_i)$ by the dot-product formula. For $\\mathbf{v}_1 = (1,1)$: $(6,2)\\cdot(1,1) = 8$ and $(1,1)\\cdot(1,1) = 2$, so $c_1 = 8/2 = 4$. For $\\mathbf{v}_2 = (1,-1)$: $(6,2)\\cdot(1,-1) = 4$ and the norm squared is $2$, so $c_2 = 4/2 = 2$. The coefficients are (4, 2)."
          - problem: "The vector $\\mathbf{x} = (5, 3, 6)$ is written in the orthogonal basis $\\{(1, 1, 0), (1, -1, 0), (0, 0, 1)\\}$. Find the three coefficients with dot products and give them as (c1, c2, c3)."
            answer: "(4, 1, 6)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Use $c_i = (\\mathbf{x} \\cdot \\mathbf{v}_i)/(\\mathbf{v}_i \\cdot \\mathbf{v}_i)$ for each basis vector. $c_1 = \\frac{(5,3,6)\\cdot(1,1,0)}{(1,1,0)\\cdot(1,1,0)} = \\frac{8}{2} = 4$. $c_2 = \\frac{(5,3,6)\\cdot(1,-1,0)}{2} = \\frac{2}{2} = 1$. $c_3 = \\frac{(5,3,6)\\cdot(0,0,1)}{1} = 6$. The coefficients are (4, 1, 6)."
          - problem: "The vector $\\mathbf{x} = (3, 10, 2)$ is expanded in an orthogonal basis that contains $(1, 2, 2)$. Compute the coefficient of $(1, 2, 2)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coefficient of one vector of an orthogonal basis is the ratio of two dot products: $c = \\frac{\\mathbf{x} \\cdot \\mathbf{v}}{\\mathbf{v} \\cdot \\mathbf{v}}$. Here $(3,10,2)\\cdot(1,2,2) = 3 + 20 + 4 = 27$ and $(1,2,2)\\cdot(1,2,2) = 1 + 4 + 4 = 9$. So $c = 27/9 = 3$. The coefficient is 3."
          - problem: "The vector $\\mathbf{x} = (9, 7)$ is expanded in the orthogonal basis $\\{(2, 1), (-1, 2)\\}$, and the coefficient of $(2, 1)$ is $5$. Find the coefficient of $(-1, 2)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The dot-product formula gives $c_2 = \\frac{(9,7)\\cdot(-1,2)}{(-1,2)\\cdot(-1,2)}$. The numerator is $-9 + 14 = 5$ and the denominator is $1 + 4 = 5$. As a check, $\\mathbf{x} - 5(2,1) = (9,7) - (10,5) = (-1,2)$, which is exactly $1$ times the second basis vector. The coefficient is 1."
          - problem: "In the orthogonal basis $\\{(1, 0, 1), (0, 1, 0), (1, 0, -1)\\}$ the coordinates of $\\mathbf{x}$ are $(2, 3, 4)$. Find the vector $\\mathbf{x}$ and give it as (x1, x2, x3)."
            answer: "(6, 3, -2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Reconstruct by multiplying each basis vector by its coordinate and adding: $\\mathbf{x} = 2(1,0,1) + 3(0,1,0) + 4(1,0,-1)$. The first components give $2 + 4 = 6$, the second gives $3$, and the third gives $2 - 4 = -2$. The vector is (6, 3, -2)."
        constraints: "orthogonal bases only; coefficients are integers"
    diagnostic_exemplar:
      problem: 'Verify that $B = \{(2, 1), (-1, 2)\}$ is an orthogonal basis of $\mathbb{R}^2$, then use dot products to write $\mathbf{x} = (3, 4)$ in that basis.'
      answer: 'Orthogonal (dot product -2 + 2 = 0), hence a basis of R^2; x = 2(2, 1) + 1(-1, 2)'
      answer_contract: {kind: none}
      solution_sketch: 'Each coefficient is $\mathbf{x}\cdot\mathbf{b}_i / \|\mathbf{b}_i\|^2$: $10/5 = 2$ and $5/5 = 1$.'
    anki_seeds:
      - front: 'An orthonormal set is an orthogonal set whose vectors all have...'
        back: 'norm $1$.'
        type: basic
      - front: 'Coefficient of $\mathbf{v}_i$ when expanding $\mathbf{x}$ in an ORTHOGONAL basis?'
        back: '$c_i = \dfrac{\mathbf{x} \cdot \mathbf{v}_i}{\mathbf{v}_i \cdot \mathbf{v}_i}$ — no system solving needed.'
        type: basic
      - front: 'Orthogonal sets of nonzero vectors are automatically...'
        back: 'linearly independent.'
        type: basic

  - id: orthogonal-complements
    name: Orthogonal Complements
    core: false                # orthogonality branch; feeds only orthogonal projection
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.6
        key: true
      - id: null-column-space-rank
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Complements of lines
        key_prerequisites: [orthogonal-orthonormal-sets]
        exemplars:
          - problem: "A line in $\\mathbb{R}^2$ has direction $(3, 4)$. Its orthogonal complement is the line through the origin perpendicular to $(3, 4)$. Find the unit vector in this orthogonal complement whose second component is positive, giving exact values as (x, y)."
            answer: "(-4/5, 3/5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The orthogonal complement of span{(3, 4)} is the set of vectors w with w dot (3, 4) = 0 (orthogonality condition). Solving 3x + 4y = 0 gives the direction (-4, 3) of the complement line, since 3(-4) + 4(3) = 0. Its length is sqrt(16 + 9) = 5 by the Pythagorean theorem. Dividing each component by 5 gives the unit vector with positive second component, which is (-4/5, 3/5)."
          - problem: "A vector lies in the orthogonal complement of $\\mathrm{span}\\{(2, 1, 2)\\}$ in $\\mathbb{R}^3$ exactly when its dot product with $(2, 1, 2)$ is zero. Find the vector with first component 1 and third component 0 in this orthogonal complement, giving it as (x, y, z)."
            answer: "(1, -2, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Membership uses the dot product rule: w dot (2, 1, 2) = 0 for the full object w = (1, y, 0). Compute 2(1) + 1(y) + 2(0) = 2 + y. Setting 2 + y = 0 gives y = -2. The required vector is (1, -2, 0)."
          - problem: "In $\\mathbb{R}^3$, the orthogonal complement of a line through the origin is the plane $3x - y + 2z = 0$. Find a direction vector of that line whose entries have no common factor greater than 1 and whose first component is positive, as (x, y, z)."
            answer: "(3, -1, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Two subspaces that are mutual orthogonal complements satisfy the double-complement relation, so the line is the orthogonal complement of the plane. The orthogonal complement of a plane through the origin is the line spanned by its normal vector (normal-vector rule). For the plane 3x - y + 2z = 0 the normal is (3, -1, 2); its entries have no common factor and the first component is positive. The direction vector of the line is (3, -1, 2)."
          - problem: "Decide whether the vector $(1, 4, 1)$ lies in the orthogonal complement of $\\mathrm{span}\\{(3, -2, 5)\\}$ in $\\mathbb{R}^3$. Give the verdict and the dot product of $(3, -2, 5)$ with $(1, 4, 1)$."
            answer: "verdict = yes; dot = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "dot"}]}
            solution_sketch: "Compute the full dot product (3, -2, 5) dot (1, 4, 1) = 3 - 8 + 5 = 0 by the orthogonality test. Because the dot product is 0, the test vector is orthogonal to the spanning direction and lies in the complement. The option no would follow from an arithmetic slip such as dropping the minus sign and getting 3 + 8 + 5 = 16. Thus verdict = yes; dot = 0."
          - problem: "A vector lies in the orthogonal complement of $\\mathrm{span}\\{(2, -3, 4)\\}$ in $\\mathbb{R}^3$ exactly when its dot product with $(2, -3, 4)$ is zero. Find the vector of the form (x, 2, 1) in this orthogonal complement, giving it as (x, y, z)."
            answer: "(1, 2, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Membership uses the dot product rule: w dot (2, -3, 4) = 0 for the full object w = (x, 2, 1). The dot product is 2x - 6 + 4 = 2x - 2. Setting 2x - 2 = 0 gives x = 1. The vector is (1, 2, 1)."
          - problem: "Find the value of $t$ for which the vector $(t, 1, -4)$ lies in the orthogonal complement of $\\mathrm{span}\\{(2, 3, 1)\\}$ in $\\mathbb{R}^3$, as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The vector (t, 1, -4) lies in the orthogonal complement exactly when its dot product with the spanning direction (2, 3, 1) is 0. Compute the full dot product: 2t + 3(1) + 1(-4) = 2t - 1. Setting 2t - 1 = 0 and solving gives t = 1/2."
        constraints: "lines with small integer directions; complements described by one homogeneous equation"
      - id: kp2
        name: Complements of planes and dimensions
        key_prerequisites: [orthogonal-orthonormal-sets, null-column-space-rank]
        exemplars:
          - problem: '$W$ is a $2$-dimensional subspace of $\mathbb{R}^3$. What is $\dim W^\perp$?'
            answer: "1"
            solution_sketch: '$\dim W + \dim W^\perp = 3$.'
          - problem: "The plane x + y + 2z = 0 in R^3 has an orthogonal complement that is a line. Give a direction vector for the complement as (a, b, c)."
            answer: "(1, 1, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full result: the orthogonal complement is the line spanned by (1, 1, 2). Step 1 (normal vector): the coefficients of x, y, and z in x + y + 2z = 0 give the normal vector (1, 1, 2). Step 2 (complement of a plane in R^3): the orthogonal complement of the plane is its normal line. The direction is (1, 1, 2)."
          - problem: "In R^7, W has dimension 3. Use dim W + dim W^perp = n. Find dim W^perp."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full result: dim W^perp = 4. Step 1 (dimension relation): in R^7, dim W + dim W^perp = 7. Step 2 (solve): 3 + dim W^perp = 7, so dim W^perp = 4."
          - problem: "The plane 3x - y + 2z = 0 in R^3 has an orthogonal complement that is a line. Give a direction vector for the complement as (a, b, c)."
            answer: "(3, -1, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full result: the orthogonal complement is the line spanned by (3, -1, 2). Step 1 (normal vector): the coefficients in 3x - y + 2z = 0 give the normal vector (3, -1, 2). Step 2 (complement of a plane in R^3): the complement is the normal line. The direction is (3, -1, 2)."
          - problem: "A plane through the origin in R^4 is a 2-dimensional subspace W. Find dim W^perp."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full result: dim W^perp = 2. Step 1 (dimension relation): a plane through the origin in R^4 is 2-dimensional, so dim W = 2 and dim W + dim W^perp = 4. Step 2 (solve): 2 + dim W^perp = 4, so dim W^perp = 2."
          - problem: "A plane through the origin in R^5 is a 2-dimensional subspace W. Find dim W^perp."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full result: dim W^perp = 3. Step 1 (dimension relation): a plane through the origin in R^5 is 2-dimensional, so dim W = 2 and dim W + dim W^perp = 5. Step 2 (solve): 2 + dim W^perp = 5, so dim W^perp = 3."
        constraints: "planes given by one equation; dimension questions via dim W + dim W-perp = n"
      - id: kp3
        name: Null space and row space are perpendicular
        key_prerequisites: [null-column-space-rank, orthogonal-orthonormal-sets]
        exemplars:
          - problem: "For the 1 by 2 matrix $A = \\begin{pmatrix}4&-7\\end{pmatrix}$, find the vector in Nul(A) whose first entry is 7. Give it as (x, y)."
            answer: "(7, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The null space of a 1 by 2 matrix consists of vectors orthogonal to its single row, so 4x - 7y = 0. Fixing the first entry x = 7 gives 28 - 7y = 0, so y = 4. Verify with one dot product: (7, 4) · (4, -7) = 28 - 28 = 0. The vector is (7, 4)."
          - problem: "For the 2 by 3 matrix $A = \\begin{pmatrix}1&2&0\\\\0&1&1\\end{pmatrix}$, solve $A\\mathbf{x} = \\mathbf{0}$ and give a nonzero solution vector as (x, y, z)."
            answer: "(2, -1, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The row conditions are x + 2y = 0 and y + z = 0, so Nul(A) is one-dimensional. Set y = -1: then x = 2 and z = 1. Verify with two dot products: (2, -1, 1) · (1, 2, 0) = 0 and (2, -1, 1) · (0, 1, 1) = 0. A nonzero solution is (2, -1, 1)."
          - problem: "Let $A = \\begin{pmatrix}2&4\\end{pmatrix}$ and $\\mathbf{v} = (3, -2)$. Compute the dot product of $\\mathbf{v}$ with the row of $A$, and give dot = that number and verdict = in if $\\mathbf{v}$ lies in Nul(A) or out if it does not."
            answer: "dot = -2; verdict = out"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "dot"}, {"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}]}
            solution_sketch: "A vector lies in Nul(A) exactly when its dot product with every row is 0, since Ax = 0 says x is orthogonal to each row. Compute (3)(2) + (-2)(4) = 6 - 8 = -2. Since -2 is not 0, v does not lie in Nul(A); the wrong verdict in comes from the sign error of reading the dot product 6 - 8 as 0. The result is dot = -2; verdict = out."
          - problem: "Let $A = \\begin{pmatrix}2&3\\end{pmatrix}$ and $\\mathbf{v} = (3, y)$. Find $y$ so that $\\mathbf{v}$ lies in Nul(A)."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Membership in Nul(A) means the dot product with the row is 0: (2)(3) + (3)(y) = 6 + 3y = 0. Solving gives 3y = -6, so y = -2. Verify with one dot product: (3, -2) · (2, 3) = 6 - 6 = 0. The value is y = -2."
          - problem: "Let $A = \\begin{pmatrix}a&2&0\\\\1&1&1\\end{pmatrix}$ and $\\mathbf{v} = (1, -2, 1)$. Find $a$ so that $\\mathbf{v}$ lies in Nul(A)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "v lies in Nul(A) when it is orthogonal to both rows of A. Check row 2 first: (1)(1) + (1)(-2) + (1)(1) = 0 already holds. For row 1: a(1) + 2(-2) + 0(1) = a - 4, so a = 4. Verify with two dot products: (1, -2, 1) · (4, 2, 0) = 0 and (1, -2, 1) · (1, 1, 1) = 0. The value is a = 4."
          - problem: "A 2 by 3 matrix $A$ has rank 2, so its row space is a plane through the origin in $\\mathbb{R}^3$. What is the dimension of $(\\mathrm{Row}\\,A)^\\perp$?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The orthogonal complement of the row space is the null space: (Row A)^perp = Nul(A). By rank-nullity, dim Nul(A) = number of columns - rank(A) = 3 - 2 = 1. The dimension of (Row A)^perp is 1."
        constraints: "1x2 or 2x3 matrices; verification by one or two dot products"
    diagnostic_exemplar:
      problem: 'Find a basis for the orthogonal complement of the plane $x + 2y - z = 0$ in $\mathbb{R}^3$, give its dimension, and say how it is related to $A = \begin{pmatrix}1&2&-1\end{pmatrix}$.'
      answer: 'Basis {(1, 2, -1)} (any nonzero multiple); dimension 1; the plane is Nul(A) and its complement is Row(A)'
      answer_contract: {kind: none}
      solution_sketch: 'A plane through the origin is the null space of its coefficient row, and $(\mathrm{Nul}\,A)^\perp = \mathrm{Row}\,A$; the dimensions $2$ and $1$ sum to $3$.'
    anki_seeds:
      - front: '$W^\perp$ is defined as the set of vectors that are...'
        back: 'orthogonal to every vector of $W$.'
        type: basic
      - front: 'For a subspace $W \subseteq \mathbb{R}^n$: $\dim W + \dim W^\perp = $ ?'
        back: '$n$.'
        type: basic
      - front: '$(\mathrm{Row}\, A)^\perp = $ ?'
        back: '$\mathrm{Nul}(A)$.'
        type: basic

  - id: orthogonal-projection-subspace
    name: Orthogonal Projection onto a Subspace
    core: false                # orthogonality branch; feeds only least squares
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: vector-projections
        weight: 0.6
        key: true
      - id: orthogonal-complements
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Projecting with an orthogonal basis
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        exemplars:
          - problem: 'Project $\mathbf{x} = (1, 2, 3)$ onto $W = \mathrm{span}\{(1, 0, 0), (0, 1, 0)\}$.'
            answer: "(1, 2, 0)"
            solution_sketch: 'Sum the projections onto each orthogonal basis vector: $1(1,0,0) + 2(0,1,0)$.'
          - problem: 'Project $\mathbf{x} = (3, 1, 2)$ onto $W = \mathrm{span}\{(1, 1, 0), (0, 0, 1)\}$.'
            answer: "(2, 2, 2)"
            solution_sketch: '$c_1 = \frac{4}{2} = 2$, $c_2 = \frac{2}{1} = 2$: $\hat{\mathbf{x}} = 2(1,1,0) + 2(0,0,1)$. Check: $\mathbf{x} - \hat{\mathbf{x}} = (1, -1, 0)$ is orthogonal to both basis vectors.'
          - problem: "Let $W = \\mathrm{span}\\{(2, 0, 0), (0, 1, 1)\\}$ and $\\mathbf{x} = (6, 5, 3)$. Project $\\mathbf{x}$ onto $W$ and give the answer as (a, b, c)."
            answer: "(6, 4, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The basis is orthogonal, so use $c_i = \\frac{\\mathbf{x}\\cdot\\mathbf{v}_i}{\\mathbf{v}_i\\cdot\\mathbf{v}_i}$. Here $c_1 = \\frac{12}{4} = 3$ and $c_2 = \\frac{8}{2} = 4$. The projection is $\\hat{\\mathbf{x}} = 3(2,0,0) + 4(0,1,1) = (6,4,4)$. Residual check: $(0,1,-1)$ dots to $0$ with both basis vectors. The projection is (6, 4, 4)."
          - problem: "Let $\\mathbf{x} = (11, -2, 1)$ and $W = \\mathrm{span}\\{(1, 2, 2), (2, 1, -2)\\}$. Find the orthogonal projection of $\\mathbf{x}$ onto $W$; give the answer as (a, b, c)."
            answer: "(5, 4, -2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Both basis vectors have norm squared $9$, and they are orthogonal since $(1,2,2)\\cdot(2,1,-2) = 0$. Coefficients: $c_1 = \\frac{9}{9} = 1$ and $c_2 = \\frac{18}{9} = 2$. So $\\hat{\\mathbf{x}} = 1(1,2,2) + 2(2,1,-2) = (5,4,-2)$. Check: the residual $(6,-6,3)$ dots to $0$ with both basis vectors. The projection is (5, 4, -2)."
          - problem: "A plane through the origin is $W = \\mathrm{span}\\{(1, -1, 0), (1, 1, -2)\\}$. For $\\mathbf{x} = (6, 0, -3)$, compute the orthogonal projection of $\\mathbf{x}$ onto $W$ and give it as (a, b, c)."
            answer: "(5, -1, -4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The plane vectors are orthogonal since $(1,-1,0)\\cdot(1,1,-2) = 0$, with norm squared $2$ and $6$. Dot products: $\\mathbf{x}\\cdot\\mathbf{v}_1 = 6$ and $\\mathbf{x}\\cdot\\mathbf{v}_2 = 12$, so $c_1 = 3$ and $c_2 = 2$. Then $\\hat{\\mathbf{x}} = 3(1,-1,0) + 2(1,1,-2) = (5,-1,-4)$. Residual check: $(1,1,1)$ dots to $0$ with both plane vectors. The projection is (5, -1, -4)."
          - problem: "Let $W = \\mathrm{span}\\{(1, 0, 1), (1, 0, -1)\\}$ and $\\mathbf{x} = (4, 3, 8)$. First project $\\mathbf{x}$ onto $W$, then find the residual $\\mathbf{z} = \\mathbf{x} - \\hat{\\mathbf{x}}$; give $\\mathbf{z}$ as (a, b, c)."
            answer: "(0, 3, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Both basis vectors have norm squared $2$ and are orthogonal. Coefficients: $c_1 = \\frac{12}{2} = 6$ and $c_2 = \\frac{-4}{2} = -2$, so $\\hat{\\mathbf{x}} = 6(1,0,1) - 2(1,0,-1) = (4,0,8)$. Subtracting gives $\\mathbf{z} = (4,3,8) - (4,0,8) = (0,3,0)$. Check: $(0,3,0)$ dots to $0$ with both basis vectors, so $\\mathbf{z}\\perp W$. The residual is (0, 3, 0)."
        constraints: "orthogonal bases with 2 vectors in R^3; projection coefficients are integers; always check the residual"
      - id: kp2
        name: The orthogonal decomposition
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections, orthogonal-complements]
        exemplars:
          - problem: "Write $\\mathbf{x} = (15, 3)$ as $\\hat{\\mathbf{x}} + \\mathbf{z}$ with $\\hat{\\mathbf{x}} \\in W = \\mathrm{span}\\{(2, 3)\\}$ and $\\mathbf{z} \\perp W$. Give $\\hat{\\mathbf{x}}$ and $\\mathbf{z}$ as (a, b) pairs."
            answer: "xhat = (6, 9); z = (9, -6)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "xhat"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "z"}]}
            solution_sketch: "Decompose $\\mathbf{x} = (15, 3)$ relative to $W = \\mathrm{span}\\{(2, 3)\\}$: $\\mathbf{x} = \\hat{\\mathbf{x}} + \\mathbf{z}$. Step 1 (vector-projection rule): $(15,3)\\cdot(2,3) = 39$ and $(2,3)\\cdot(2,3) = 13$, so $\\hat{\\mathbf{x}} = 3(2,3) = (6, 9)$. Step 2 (orthogonal decomposition): $\\mathbf{z} = (15,3) - (6,9) = (9, -6)$. Step 3 (dot-product check): $(9,-6)\\cdot(2,3) = 18 - 18 = 0$, so $\\mathbf{z} \\perp W$. The answer is xhat = (6, 9); z = (9, -6)."
          - problem: "Express $\\mathbf{x} = (13, 1, 4)$ as $\\hat{\\mathbf{x}} + \\mathbf{z}$ where $\\hat{\\mathbf{x}}$ lies in $W = \\mathrm{span}\\{(1, 1, 1)\\}$ and $\\mathbf{z}$ is orthogonal to $W$. Give $\\hat{\\mathbf{x}}$ and $\\mathbf{z}$ as (a, b, c) triples."
            answer: "xhat = (6, 6, 6); z = (7, -5, -2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "xhat"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "z"}]}
            solution_sketch: "Decompose $\\mathbf{x} = (13, 1, 4)$ relative to $W = \\mathrm{span}\\{(1,1,1)\\}$: $\\mathbf{x} = \\hat{\\mathbf{x}} + \\mathbf{z}$. Step 1 (vector-projection rule): $(13,1,4)\\cdot(1,1,1) = 18$ and $(1,1,1)\\cdot(1,1,1) = 3$, so $\\hat{\\mathbf{x}} = 6(1,1,1) = (6, 6, 6)$. Step 2 (orthogonal decomposition): $\\mathbf{z} = (13,1,4) - (6,6,6) = (7, -5, -2)$. Step 3 (dot-product check): $(7,-5,-2)\\cdot(1,1,1) = 7 - 5 - 2 = 0$, so $\\mathbf{z} \\perp W$. The answer is xhat = (6, 6, 6); z = (7, -5, -2)."
          - problem: "Decompose the vector $\\mathbf{x} = (7, -9)$ into $\\hat{\\mathbf{x}} + \\mathbf{z}$, where $\\hat{\\mathbf{x}}$ is in $W = \\mathrm{span}\\{(3, -1)\\}$ and $\\mathbf{z} \\perp W$. Give $\\hat{\\mathbf{x}}$ and $\\mathbf{z}$ as (a, b) pairs."
            answer: "xhat = (9, -3); z = (-2, -6)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "xhat"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "z"}]}
            solution_sketch: "Decompose $\\mathbf{x} = (7, -9)$ relative to $W = \\mathrm{span}\\{(3,-1)\\}$: $\\mathbf{x} = \\hat{\\mathbf{x}} + \\mathbf{z}$. Step 1 (vector-projection rule): $(7,-9)\\cdot(3,-1) = 30$ and $(3,-1)\\cdot(3,-1) = 10$, so $\\hat{\\mathbf{x}} = 3(3,-1) = (9, -3)$. Step 2 (orthogonal decomposition): $\\mathbf{z} = (7,-9) - (9,-3) = (-2, -6)$. Step 3 (dot-product check): $(-2,-6)\\cdot(3,-1) = -6 + 6 = 0$, so $\\mathbf{z} \\perp W$. The answer is xhat = (9, -3); z = (-2, -6)."
          - problem: "Let $W = \\mathrm{span}\\{(1, 2)\\}$ and $\\mathbf{x} = (8, 6)$. Compute the part $\\mathbf{z}$ of the orthogonal decomposition of $\\mathbf{x}$ relative to $W$, so that $\\mathbf{x} = \\hat{\\mathbf{x}} + \\mathbf{z}$ with $\\hat{\\mathbf{x}} \\in W$ and $\\mathbf{z} \\perp W$. Give $\\mathbf{z}$ as (a, b)."
            answer: "(4, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Find the complement part $\\mathbf{z}$ of $\\mathbf{x} = (8, 6)$ relative to $W = \\mathrm{span}\\{(1,2)\\}$. Step 1 (vector-projection rule): $(8,6)\\cdot(1,2) = 20$ and $(1,2)\\cdot(1,2) = 5$, so $\\hat{\\mathbf{x}} = 4(1,2) = (4, 8)$. Step 2 (orthogonal decomposition): $\\mathbf{z} = \\mathbf{x} - \\hat{\\mathbf{x}} = (4, -2)$. Step 3 (dot-product check): $(4,-2)\\cdot(1,2) = 4 - 4 = 0$, so $\\mathbf{z} \\perp W$. The answer is (4, -2)."
          - problem: "Let $W$ be the line spanned by $(2, 2, 1)$ and let $\\mathbf{x} = (7, 9, 4)$. Find the orthogonal projection $\\hat{\\mathbf{x}}$ of $\\mathbf{x}$ onto $W$. Give $\\hat{\\mathbf{x}}$ as (a, b, c)."
            answer: "(8, 8, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Project $\\mathbf{x} = (7, 9, 4)$ onto $W = \\mathrm{span}\\{(2,2,1)\\}$. Step 1 (vector-projection rule): $(7,9,4)\\cdot(2,2,1) = 36$ and $(2,2,1)\\cdot(2,2,1) = 9$, so the scalar is $4$. Step 2 (vector-projection rule): $\\hat{\\mathbf{x}} = 4(2,2,1) = (8, 8, 4)$. Step 3 (orthogonal decomposition): $\\mathbf{z} = (-1, 1, 0)$ and $(-1,1,0)\\cdot(2,2,1) = 0$, confirming $\\mathbf{z} \\perp W$. The answer is (8, 8, 4)."
          - problem: "The line $W$ is spanned by $(2, -1, 2)$. Write the vector $\\mathbf{x} = (6, 12, 9)$ in the form $\\hat{\\mathbf{x}} + \\mathbf{z}$ with $\\hat{\\mathbf{x}} \\in W$ and $\\mathbf{z}$ orthogonal to every vector of $W$. State $\\hat{\\mathbf{x}}$ and $\\mathbf{z}$ as (a, b, c) triples."
            answer: "xhat = (4, -2, 4); z = (2, 14, 5)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "xhat"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "z"}]}
            solution_sketch: "Decompose $\\mathbf{x} = (6, 12, 9)$ relative to $W = \\mathrm{span}\\{(2,-1,2)\\}$: $\\mathbf{x} = \\hat{\\mathbf{x}} + \\mathbf{z}$. Step 1 (vector-projection rule): $(6,12,9)\\cdot(2,-1,2) = 18$ and $(2,-1,2)\\cdot(2,-1,2) = 9$, so $\\hat{\\mathbf{x}} = 2(2,-1,2) = (4, -2, 4)$. Step 2 (orthogonal decomposition): $\\mathbf{z} = (6,12,9) - (4,-2,4) = (2, 14, 5)$. Step 3 (dot-product check): $(2,14,5)\\cdot(2,-1,2) = 4 - 14 + 10 = 0$, so $\\mathbf{z} \\perp W$. The answer is xhat = (4, -2, 4); z = (2, 14, 5)."
        constraints: "W is a line with an integer direction; both parts have integer entries; verify z is orthogonal"
      - id: kp3
        name: Distance to a subspace
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        exemplars:
          - problem: 'Find the distance from $(3, 1)$ to the line $\mathrm{span}\{(1, 1)\}$.'
            answer: '$\sqrt{2}$'
            solution_sketch: 'The distance is $\|\mathbf{x} - \hat{\mathbf{x}}\| = \|(1, -1)\| = \sqrt{2}$.'
          - problem: 'Find the distance from $(1, 2, 2)$ to the plane $\mathrm{span}\{(1, 0, 0), (0, 1, 0)\}$.'
            answer: "2"
            solution_sketch: 'The projection is $(1, 2, 0)$; the residual $(0, 0, 2)$ has norm $2$.'
          - problem: "Find the distance from the point $(1, 3, 2)$ to the subspace $\\mathrm{span}\\{(1, 1, 0)\\}$ of $\\mathbb{R}^3$."
            answer: "sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (projection formula): the scalar coefficient of $(1, 3, 2)$ on $(1, 1, 0)$ is $\\frac{x \\cdot v}{v \\cdot v} = \\frac{4}{2} = 2$, so the projection is $(2, 2, 0)$. Step 2 (distance as residual norm): the residual is $(1, 3, 2) - (2, 2, 0) = (-1, 1, 2)$, which is orthogonal to the line, and its norm is $\\sqrt{1 + 1 + 4}$. The distance is sqrt(6)."
          - problem: "The plane $W = \\mathrm{span}\\{(1, 2, 0), (2, -1, 0)\\}$ has an orthogonal basis. Find the distance from the point $(1, 1, 3)$ to $W$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (projection onto each basis vector): $(1, 1, 3) \\cdot (1, 2, 0) = 3$ and $\\|(1, 2, 0)\\|^2 = 5$, giving the component $(3/5)(1, 2, 0)$; likewise $(1, 1, 3) \\cdot (2, -1, 0) = 1$ gives $(1/5)(2, -1, 0)$. Step 2 (sum the components): the projection is $(0.6 + 0.4, 1.2 - 0.2, 0) = (1, 1, 0)$. Step 3 (residual norm): $(1, 1, 3) - (1, 1, 0) = (0, 0, 3)$, which is orthogonal to $W$, and its norm is $3$. The distance is 3."
          - problem: "A line through the origin of $\\mathbb{R}^2$ has direction $(2, -1)$. Find the distance from the point $(5, 0)$ to this line."
            answer: "sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (projection formula): the coefficient of $(5, 0)$ on $(2, -1)$ is $\\frac{10}{5} = 2$, so the closest point on the line is $(4, -2)$. Step 2 (residual norm): the residual is $(5, 0) - (4, -2) = (1, 2)$, which is orthogonal to the direction $(2, -1)$, and its norm is $\\sqrt{1 + 4}$. The distance is sqrt(5)."
          - problem: "For $c > 0$, the distance from the point $(2, 4, c)$ to the line $\\mathrm{span}\\{(1, 1, 0)\\}$ equals $\\sqrt{3}$. Find $c$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (projection formula): the coefficient of $(2, 4, c)$ on $(1, 1, 0)$ is $\\frac{2 + 4}{2} = 3$, so the projection is $(3, 3, 0)$. Step 2 (residual norm): the residual is $(-1, 1, c)$ with squared norm $1 + 1 + c^2 = 2 + c^2$. Step 3 (solve the distance equation): setting $\\sqrt{2 + c^2} = \\sqrt{3}$ gives $c^2 = 1$, and $c > 0$ selects the positive root. The coordinate is c = 1."
        constraints: "distances are integers or single square roots"
    diagnostic_exemplar:
      problem: 'Write $\mathbf{x} = (5, 1)$ as $\hat{\mathbf{x}} + \mathbf{z}$ with $\hat{\mathbf{x}}$ in $W = \mathrm{span}\{(1, 1)\}$ and $\mathbf{z} \perp W$, and give the distance from $\mathbf{x}$ to $W$.'
      answer: '$\hat{\mathbf{x}} = (3, 3)$, $\mathbf{z} = (2, -2)$; the distance is $2\sqrt{2}$'
      answer_contract: {kind: none}
      solution_sketch: '$\hat{\mathbf{x}} = \frac{5 + 1}{2}(1, 1) = (3, 3)$, so $\mathbf{z} = (2, -2)$ and the distance is $\|\mathbf{z}\| = 2\sqrt2$.'
    anki_seeds:
      - front: 'Projection of $\mathbf{x}$ onto a subspace with ORTHOGONAL basis $\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$?'
        back: '$\hat{\mathbf{x}} = \sum_i \dfrac{\mathbf{x} \cdot \mathbf{v}_i}{\mathbf{v}_i \cdot \mathbf{v}_i}\mathbf{v}_i$.'
        type: basic
      - front: 'In the orthogonal decomposition $\mathbf{x} = \hat{\mathbf{x}} + \mathbf{z}$, the two parts satisfy...'
        back: '$\hat{\mathbf{x}} \in W$ and $\mathbf{z} \in W^\perp$; $\hat{\mathbf{x}}$ is the closest point of $W$ to $\mathbf{x}$.'
        type: basic
      - front: 'Distance from $\mathbf{x}$ to a subspace $W$?'
        back: '$\|\mathbf{x} - \hat{\mathbf{x}}\|$, the norm of the residual after projecting onto $W$.'
        type: basic

  - id: orthogonality-gram-schmidt
    name: Orthogonality and Gram-Schmidt
    core: false                # orthogonality branch; terminal
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: vector-projections
        weight: 0.7
        key: true
      - id: basis-dimension
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The Gram-Schmidt step
        key_prerequisites: [vector-projections, orthogonal-orthonormal-sets]
        exemplars:
          - problem: "Run the Gram-Schmidt step on the two input vectors x1 = (2, 1) and x2 = (1, 3), with v1 = x1. Form v2 by subtracting from x2 its projection onto v1. Give v2 as (a, b)."
            answer: "(-1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: v2 = (-1, 2). Step 1 (projection coefficient formula of Gram-Schmidt): x2 dot v1 = 2 + 3 = 5 and v1 dot v1 = 4 + 1 = 5, so the coefficient is 5/5 = 1, an allowed integer. Step 2 (Gram-Schmidt subtraction): v2 = (1, 3) - 1(2, 1) = (-1, 2). Step 3 (orthogonality verification by dot product): v1 dot v2 = -2 + 2 = 0, so v2 is orthogonal to v1. The answer is (-1, 2)."
          - problem: "Run the Gram-Schmidt step on x1 = (1, 1, 2) and x2 = (3, 1, 1), taking v1 = x1 and forming v2 by the projection subtraction. Give v2 as (a, b, c)."
            answer: "(2, 0, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: v2 = (2, 0, -1). Step 1 (projection coefficient formula): x2 dot v1 = 3 + 1 + 2 = 6 and v1 dot v1 = 1 + 1 + 4 = 6, so the coefficient is 6/6 = 1, an allowed integer. Step 2 (Gram-Schmidt subtraction): v2 = (3, 1, 1) - (1, 1, 2) = (2, 0, -1). Step 3 (orthogonality verification by dot product): v1 dot v2 = 2 + 0 - 2 = 0, so the pair is orthogonal. The answer is (2, 0, -1)."
          - problem: "Apply the Gram-Schmidt step to x1 = (1, 2) and x2 = (4, 3), with v1 = x1. Subtract the projection of x2 onto v1 to get v2. Give v2 as (a, b)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: v2 = (2, -1). Step 1 (projection coefficient formula): x2 dot v1 = 4 + 6 = 10 and v1 dot v1 = 1 + 4 = 5, so the coefficient is 10/5 = 2. Step 2 (Gram-Schmidt subtraction): v2 = (4, 3) - 2(1, 2) = (2, -1). Step 3 (orthogonality verification by dot product): v1 dot v2 = 2 - 2 = 0, so v2 is orthogonal to v1. The answer is (2, -1)."
          - problem: "Apply the Gram-Schmidt step to x1 = (4, 2) and x2 = (0, 5), with v1 = x1 and v2 formed by subtracting the projection of x2 onto v1. Give v2 as (a, b)."
            answer: "(-2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: v2 = (-2, 4). Step 1 (projection coefficient formula): x2 dot v1 = 0 + 10 = 10 and v1 dot v1 = 16 + 4 = 20, so the coefficient is 10/20 = 1/2, the allowed half value. Step 2 (Gram-Schmidt subtraction): v2 = (0, 5) - (1/2)(4, 2) = (-2, 4). Step 3 (orthogonality verification by dot product): v1 dot v2 = -8 + 8 = 0, so the pair is orthogonal. The answer is (-2, 4)."
          - problem: "A Gram-Schmidt step starts with x1 = (2, 3) and an unknown input x2, with v1 = x1. The step returns v2 = (3, -2), and the projection coefficient (x2 dot v1)/(v1 dot v1) equals 2. Find the input x2 as (a, b)."
            answer: "(7, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: x2 = (7, 4). Step 1 (rearranged Gram-Schmidt subtraction formula): x2 = v2 + 2 v1, since the projection term was the only part removed. Step 2 (scalar multiplication and vector addition): 2(2, 3) = (4, 6), so x2 = (3, -2) + (4, 6) = (7, 4). Step 3 (orthogonality and coefficient verification): v1 dot v2 = 6 - 6 = 0 and x2 dot v1 = 14 + 12 = 26 = 2(13), so the coefficient is 26/13 = 2. The answer is (7, 4)."
          - problem: "Apply the Gram-Schmidt step to x1 = (4, 2, 2) and x2 = (1, 2, 2), with v1 = x1 and v2 = x2 minus the projection of x2 onto v1. Give v2 as (a, b, c)."
            answer: "(-1, 1, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: v2 = (-1, 1, 1). Step 1 (projection coefficient formula): x2 dot v1 = 4 + 4 + 4 = 12 and v1 dot v1 = 16 + 4 + 4 = 24, so the coefficient is 12/24 = 1/2, the allowed half value. Step 2 (Gram-Schmidt subtraction): v2 = (1, 2, 2) - (1/2)(4, 2, 2) = (-1, 1, 1). Step 3 (orthogonality verification by dot product): v1 dot v2 = -4 + 2 + 2 = 0, so v1 and v2 are orthogonal. The answer is (-1, 1, 1)."
        constraints: "two input vectors; rig x2 . v1 / v1 . v1 to be an integer or 1/2; always verify orthogonality"
      - id: kp2
        name: Gram-Schmidt with three vectors
        key_prerequisites: [vector-projections, orthogonal-orthonormal-sets, basis-dimension]
        exemplars:
          - problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (1, 0, 0)$, $\mathbf{x}_2 = (1, 1, 0)$, $\mathbf{x}_3 = (1, 1, 1)$.'
            answer: "v1 = (1, 0, 0), v2 = (0, 1, 0), v3 = (0, 0, 1)"
            answer_contract: {kind: none}
            solution_sketch: '$\mathbf{v}_2 = \mathbf{x}_2 - 1\cdot\mathbf{v}_1$; $\mathbf{v}_3 = \mathbf{x}_3 - 1\cdot\mathbf{v}_1 - 1\cdot\mathbf{v}_2$. Each subtraction strips the components already covered.'
          - problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (1, 1, 0)$, $\mathbf{x}_2 = (1, 0, 1)$, $\mathbf{x}_3 = (0, 1, 1)$.'
            answer: "v1 = (1, 1, 0), v2 = (1/2, -1/2, 1), v3 = (-2/3, 2/3, 2/3)"
            answer_contract: {kind: none}
            solution_sketch: '$\mathbf{v}_2 = \mathbf{x}_2 - \frac{1}{2}\mathbf{v}_1$; then $\mathbf{x}_3 \cdot \mathbf{v}_1 = 1$, $\mathbf{x}_3 \cdot \mathbf{v}_2 = \frac{1}{2}$, $\mathbf{v}_2 \cdot \mathbf{v}_2 = \frac{3}{2}$, so $\mathbf{v}_3 = \mathbf{x}_3 - \frac{1}{2}\mathbf{v}_1 - \frac{1}{3}\mathbf{v}_2 = (-\frac{2}{3}, \frac{2}{3}, \frac{2}{3})$. Check: $\mathbf{v}_3 \cdot \mathbf{v}_1 = \mathbf{v}_3 \cdot \mathbf{v}_2 = 0$.'
        constraints: "three vectors in R^3 with 0/1 entries; fractions limited to halves and thirds; verify all pairwise dot products"
      - id: kp3
        name: Producing an orthonormal basis
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        exemplars:
          - problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (3, 4)$, $\mathbf{x}_2 = (1, 0)$, then normalize to an orthonormal basis.'
            answer: "{(3/5, 4/5), (4/5, -3/5)}"
            solution_sketch: '$\mathbf{v}_2 = (1, 0) - \frac{3}{25}(3, 4) = (\frac{16}{25}, -\frac{12}{25})$, proportional to $(4, -3)$; normalize $(3,4)$ and $(4,-3)$ by their norm $5$.'
          - problem: 'Normalize the Gram-Schmidt output $\{(1, 1), (-1, 1)\}$.'
            answer: '$\{(1/\sqrt{2}, 1/\sqrt{2}), (-1/\sqrt{2}, 1/\sqrt{2})\}$'
            solution_sketch: 'Both vectors have norm $\sqrt{2}$.'
          - problem: "Apply Gram-Schmidt to x1 = (4, 3) and x2 = (5, 0), then normalize. Give the orthonormal basis as q1 = (a, b); q2 = (c, d)."
            answer: "q1 = (4/5, 3/5); q2 = (3/5, -4/5)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "q1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "q2"}]}
            solution_sketch: "Step 1 (Gram-Schmidt): v1 = (4, 3). Step 2 (projection): v2 = (5, 0) - (20/25)(4, 3) = (5, 0) - (4/5)(4, 3) = (9/5, -12/5), proportional to (3, -4). Step 3 (normalize): v1 has norm 5, so q1 = (4/5, 3/5); v2 has direction (3, -4) with norm 5, so q2 = (3/5, -4/5)."
          - problem: "Apply Gram-Schmidt to x1 = (1, 1) and x2 = (4, 3), then normalize. Give the orthonormal basis as q1 = (a, b); q2 = (c, d)."
            answer: "q1 = (1/sqrt(2), 1/sqrt(2)); q2 = (1/sqrt(2), -1/sqrt(2))"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "q1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "q2"}]}
            solution_sketch: "Step 1 (Gram-Schmidt): v1 = (1, 1). Step 2 (projection): v2 = (4, 3) - (7/2)(1, 1) = (1/2, -1/2), proportional to (1, -1). Step 3 (normalize): v1 has norm sqrt(2), so q1 = (1/sqrt(2), 1/sqrt(2)); v2 has direction (1, -1) with norm sqrt(2), so q2 = (1/sqrt(2), -1/sqrt(2))."
          - problem: "Apply Gram-Schmidt to x1 = (4, 3) and x2 = (0, 5), then normalize. Give the second vector of the orthonormal basis as (a, b)."
            answer: "(-3/5, 4/5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (Gram-Schmidt): v1 = (4, 3). Step 2 (projection): v2 = (0, 5) - (15/25)(4, 3) = (-12/5, 16/5), proportional to (-3, 4). Step 3 (normalize): the second unit vector is (-3/5, 4/5)."
          - problem: "Apply Gram-Schmidt to x1 = (3, 4, 0), x2 = (0, 5, 0), and x3 = (0, 0, 5), then normalize. Give the orthonormal basis as q1 = (a, b, c); q2 = (d, e, f); q3 = (g, h, i)."
            answer: "q1 = (3/5, 4/5, 0); q2 = (-4/5, 3/5, 0); q3 = (0, 0, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "q1"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "q2"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "q3"}]}
            solution_sketch: "Step 1 (Gram-Schmidt): v1 = (3, 4, 0). Step 2 (projection): v2 = (0, 5, 0) - (20/25)(3, 4, 0) = (-12/5, 9/5, 0), proportional to (-4, 3, 0). Step 3 (projection): v3 = (0, 0, 5) since it is orthogonal to v1 and v2. Step 4 (normalize): q1 = (3/5, 4/5, 0); q2 = (-4/5, 3/5, 0); q3 = (0, 0, 1)."
        constraints: "norms are 5 or sqrt(2); rescale fraction vectors to integer directions before normalizing"
    diagnostic_exemplar:
      problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (3, 4)$, $\mathbf{x}_2 = (1, 2)$, then normalize to an orthonormal basis of $\mathbb{R}^2$.'
      answer: '{(3/5, 4/5), (-4/5, 3/5)}'
      solution_sketch: '$\mathbf{v}_1 = (3,4)$ and $\mathbf{v}_2 = (1,2) - \frac{11}{25}(3,4) = \frac{2}{25}(-4, 3)$; dividing each by its norm gives the orthonormal pair.'
    anki_seeds:
      - front: 'Gram-Schmidt step: $\mathbf{v}_2 = \mathbf{x}_2 - {}$?'
        back: '$\dfrac{\mathbf{x}_2 \cdot \mathbf{v}_1}{\mathbf{v}_1 \cdot \mathbf{v}_1}\,\mathbf{v}_1$ (subtract the projection onto what is already built).'
        type: basic
      - front: 'General Gram-Schmidt step for $\mathbf{v}_k$?'
        back: '$\mathbf{x}_k$ minus its projections onto ALL previously built $\mathbf{v}_1, \dots, \mathbf{v}_{k-1}$.'
        type: basic
      - front: 'Gram-Schmidt turns any basis of a subspace into...'
        back: 'an orthogonal basis of the same subspace (orthonormal after normalizing).'
        type: basic

  - id: least-squares-approximation
    name: Least-Squares Approximation
