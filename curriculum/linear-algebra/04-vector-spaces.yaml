        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The normal equations
        key_prerequisites: [orthogonal-projection-subspace, transpose-symmetric-matrices]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}1&0\\\\1&1\\\\0&1\\end{pmatrix}$ and $\\mathbf{b} = (3, 3, 3)$. Form $A^TA$ and $A^T\\mathbf{b}$, then solve the normal equations $A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$. Give the least-squares solution $\\hat{\\mathbf{x}}$ as (x1, x2)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Transpose: $A^T = \\begin{pmatrix}1&1&0\\\\0&1&1\\end{pmatrix}$, so $A^TA = \\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $A^T\\mathbf{b} = (6, 6)$. Invert: $(A^TA)^{-1} = \\frac{1}{3}\\begin{pmatrix}2&-1\\\\-1&2\\end{pmatrix}$. Multiply: $\\hat{\\mathbf{x}} = \\frac{1}{3}(2\\cdot 6 - 6, -6 + 12) = (2, 2)$. The least-squares solution is (2, 2)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\1&0\\\\0&1\\end{pmatrix}$ and $\\mathbf{b} = (0, 2, 1)$. Set up the normal equations $A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$ and solve them. Determine whether $A\\mathbf{x} = \\mathbf{b}$ has an exact solution, and give the least-squares solution $\\hat{\\mathbf{x}}$ as (x1, x2)."
            answer: "verdict = inconsistent; xhat = (1, 0)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["consistent"], ["inconsistent"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "xhat"}]}
            solution_sketch: "Form the normal equations: $A^TA = \\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $A^T\\mathbf{b} = (2, 1)$. Solve by the inverse: $\\hat{\\mathbf{x}} = \\frac{1}{3}(2\\cdot 2 - 1, -2 + 2) = (1, 0)$. Check $A\\hat{\\mathbf{x}} = (1, 1, 0) \\ne \\mathbf{b}$, so the system is inconsistent; the option consistent would be the error of skipping the comparison of $A\\hat{\\mathbf{x}}$ with $\\mathbf{b}$. The full answer is verdict = inconsistent; xhat = (1, 0)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\0&1\\\\1&0\\end{pmatrix}$ and $\\mathbf{b} = (4, 4, 3)$. Solve the normal equations $A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$ for $\\hat{\\mathbf{x}}$, then compute the projection $\\mathbf{p} = A\\hat{\\mathbf{x}}$, the vector in the column space of $A$ closest to $\\mathbf{b}$. Give xhat as (x1, x2) and p as (p1, p2, p3)."
            answer: "xhat = (2, 3); p = (5, 3, 2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "xhat"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "p"}]}
            solution_sketch: "The full result is xhat = (2, 3) and p = (5, 3, 2). Transpose: $A^TA = \\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $A^T\\mathbf{b} = (7, 8)$. Solve with the inverse of the 2x2 matrix: $\\hat{\\mathbf{x}} = \\frac{1}{3}(2\\cdot 7 - 8, -7 + 2\\cdot 8) = (2, 3)$ by the normal-equations method. Then multiply: $\\mathbf{p} = A\\hat{\\mathbf{x}} = 2(1,0,1) + 3(1,1,0) = (5, 3, 2)$ by matrix-vector multiplication. The full answer is xhat = (2, 3); p = (5, 3, 2)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\1&1\\\\0&1\\end{pmatrix}$ and $\\mathbf{b} = (0, 2, 2)$. The columns of $A$ overlap in two rows, so $A^TA$ has equal off-diagonal entries. Form the normal equations $A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$ and solve them. Give the least-squares solution $\\hat{\\mathbf{x}}$ as (x1, x2)."
            answer: "(-1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Transpose: $A^TA = \\begin{pmatrix}2&2\\\\2&3\\end{pmatrix}$ and $A^T\\mathbf{b} = (2, 4)$. The determinant is $2\\cdot 3 - 2\\cdot 2 = 2$, so $(A^TA)^{-1} = \\frac{1}{2}\\begin{pmatrix}3&-2\\\\-2&2\\end{pmatrix}$. Multiply: $\\hat{\\mathbf{x}} = \\frac{1}{2}(3\\cdot 2 - 2\\cdot 4, -2\\cdot 2 + 2\\cdot 4) = (-1, 2)$. The least-squares solution is (-1, 2)."
          - problem: "The overdetermined system $x_1 = 2$, $x_2 = 2$, $x_1 + x_2 = 1$ has three equations in two unknowns. Write it in the form $A\\mathbf{x} = \\mathbf{b}$, form the normal equations $A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$, and solve them. Give the least-squares solution $\\hat{\\mathbf{x}}$ as (x1, x2)."
            answer: "(1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The coefficient matrix is $A = \\begin{pmatrix}1&0\\\\0&1\\\\1&1\\end{pmatrix}$ with $\\mathbf{b} = (2, 2, 1)$. The normal equations have $A^TA = \\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $A^T\\mathbf{b} = (3, 3)$. Solve with the inverse: $\\hat{\\mathbf{x}} = \\frac{1}{3}(2\\cdot 3 - 3, -3 + 2\\cdot 3) = (1, 1)$. The least-squares solution is (1, 1)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\1&1\\\\1&0\\end{pmatrix}$ and $\\mathbf{b} = (4, t, 3)$, where $t$ is an unknown real number. The vector $\\hat{\\mathbf{x}} = (3, 2)$ is the least-squares solution of $A\\mathbf{x} = \\mathbf{b}$. Find $t$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute $A^TA = \\begin{pmatrix}3&2\\\\2&2\\end{pmatrix}$ and $A^T\\mathbf{b} = (7 + t, 4 + t)$ by transposing and multiplying. Since $\\hat{\\mathbf{x}} = (3, 2)$ solves the normal equations, $A^TA\\hat{\\mathbf{x}} = (3\\cdot 3 + 2\\cdot 2, 2\\cdot 3 + 2\\cdot 2) = (13, 10)$. Equate: $7 + t = 13$ and $4 + t = 10$, and both equations give the same value. The answer is 6."
        constraints: "3x2 matrices with 0/1 entries; A^T A is 2x2 with integer solution"
      - id: kp2
        name: Least-squares lines
        key_prerequisites: [orthogonal-projection-subspace, transpose-symmetric-matrices]
        exemplars:
          - problem: 'Find the least-squares line $y = a + bx$ through $(-1, 0)$, $(0, 4)$, $(1, 2)$.'
            answer: "y = 2 + x"
            solution_sketch: 'With $x$-values symmetric about $0$, $A^TA = \mathrm{diag}(3, 2)$: $a = \frac{0 + 4 + 2}{3} = 2$, $b = \frac{(-1)(0) + (0)(4) + (1)(2)}{2} = 1$.'
          - problem: 'Find the least-squares line $y = a + bx$ through $(-1, 2)$, $(0, 0)$, $(1, 4)$.'
            answer: "y = 2 + x"
            solution_sketch: '$a = \frac{2 + 0 + 4}{3} = 2$; $b = \frac{-2 + 0 + 4}{2} = 1$. Residuals $(1, -2, 1)$ are orthogonal to both columns of $A$.'
          - problem: "Find the least-squares line $y = a + bx$ through $(-1, 3)$, $(0, 1)$ and $(1, 5)$. Give the line in the form $a + bx$ as a function of $x$."
            answer: "x + 3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The design matrix has columns (1, 1, 1) and (-1, 0, 1); since the x-values are symmetric about 0, the columns are orthogonal and the normal equations decouple with A^T A = diag(3, 2). Intercept step: a = (3 + 1 + 5)/3 = 3. Slope step: b = ((-1)(3) + (0)(1) + (1)(5))/2 = 1. The least-squares line is y = 3 + x, written as a function of x: x + 3."
          - problem: "A tank holds 3, 0 and 6 liters at times $t = -1$, $0$ and $1$. Fit a least-squares line $h = a + bt$ to these three measurements. Give the line in the form $a + bt$ as a function of $t$."
            answer: "3 + 3t/2"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The times -1, 0, 1 are symmetric about 0, so the normal equations decouple and A^T A = diag(3, 2). Intercept step: a = (3 + 0 + 6)/3 = 3. Slope step: b = ((-1)(3) + (0)(0) + (1)(6))/2 = 3/2. The fitted line is h = 3 + (3/2)t, that is, 3 + 3t/2."
          - problem: "The least-squares line through the points $(-1, 2)$, $(0, 2)$ and $(1, c)$ has slope $b = 3$. Find the value of $c$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With x-values -1, 0, 1 the columns of the design matrix are orthogonal, so the slope equation decouples: b = ((-1)(2) + (0)(2) + (1)c)/2 = (c - 2)/2. Set (c - 2)/2 = 3 and solve: c = 8. Check the intercept: a = (2 + 2 + 8)/3 = 4, an integer as required. The missing value is c = 8."
          - problem: "Find the slope $b$ of the least-squares line through $(-1, 0)$, $(0, 1)$ and $(1, 5)$. Give the answer as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The columns of the design matrix are (1, 1, 1) and (-1, 0, 1); they are orthogonal because the x-values are -1, 0, 1, so the slope equation decouples: b = ((-1)(0) + (0)(1) + (1)(5))/2. Compute b = 5/2. The intercept a = (0 + 1 + 5)/3 = 2 is not asked for. The slope of the least-squares line is 5/2."
        constraints: "3 points with x-values -1, 0, 1 so the normal equations decouple; a and b integers or halves"
      - id: kp3
        name: The residual and its size
        key_prerequisites: [orthogonal-projection-subspace, matrix-inverses]
        exemplars:
          - problem: 'For $A = \begin{pmatrix}1&0\\0&1\\1&1\end{pmatrix}$, $\mathbf{b} = (0, 0, 3)$, $\hat{\mathbf{x}} = (1, 1)$: find the residual $\mathbf{b} - A\hat{\mathbf{x}}$ and the least-squares error.'
            answer: 'Residual $(-1, -1, 1)$; error $\sqrt{3}$'
            answer_contract: {kind: none}
            solution_sketch: '$A\hat{\mathbf{x}} = (1, 1, 2)$; the residual has norm $\sqrt{1 + 1 + 1}$. Check: $A^T$ times the residual is $\mathbf{0}$.'
          - problem: 'Geometrically, the least-squares error $\|\mathbf{b} - A\hat{\mathbf{x}}\|$ equals the distance from $\mathbf{b}$ to...'
            answer: "Col(A), the column space of A"
            answer_contract: {kind: none}
            solution_sketch: 'The residual $\mathbf{b} - A\hat{\mathbf{x}}$ is orthogonal to the column space, so its length is the distance from $\mathbf{b}$ to $\mathrm{Col}(A)$.'
        constraints: "residual entries small integers; error a single square root"
    diagnostic_exemplar:
      problem: 'Find the least-squares line $y = a + bx$ through $(-1, 0)$, $(0, 2)$, $(1, 1)$, and the least-squares error $\|\mathbf{b} - A\hat{\mathbf{x}}\|$.'
      answer: '$y = 1 + \frac{x}{2}$; the residual is $(-\frac{1}{2}, 1, -\frac{1}{2})$ and the error is $\frac{\sqrt{6}}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The normal equations give $a = \bar y = 1$ and $b = \sum x_iy_i / \sum x_i^2 = 1/2$; the residuals $-\frac12, 1, -\frac12$ have norm $\sqrt{3/2} = \sqrt6/2$.'
    anki_seeds:
      - front: 'The least-squares solution of $A\mathbf{x} = \mathbf{b}$ solves which system?'
        back: 'The normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$.'
        type: basic
      - front: 'Geometric meaning of the least-squares solution: $A\hat{\mathbf{x}}$ is...'
        back: 'the orthogonal projection of $\mathbf{b}$ onto $\mathrm{Col}(A)$.'
        type: basic
      - front: 'The least-squares residual $\mathbf{b} - A\hat{\mathbf{x}}$ is orthogonal to...'
        back: 'every column of $A$ (it lies in $\mathrm{Col}(A)^\perp$).'
        type: basic
