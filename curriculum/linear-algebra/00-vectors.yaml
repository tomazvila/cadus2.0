unit: vectors
course: linear-algebra
module: "Vectors"
topics:
  - id: component-form-of-vectors
    name: Component Form of Vectors
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
      - id: plotting-points
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vector between two points
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Find the component form of the vector from $P(1, 2)$ to $Q(4, 6)$.'
            answer: '(3, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector from $P$ to $Q$ is the terminal point minus the initial point. So the components are $(4 - 1, 6 - 2) = (3, 4)$.'
          - problem: 'Find the component form of the vector from $P(-2, 5)$ to $Q(3, 1)$.'
            answer: '(5, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Subtract the initial point from the terminal point in each coordinate. This gives $(3 - (-2), 1 - 5) = (5, -4)$.'
          - problem: 'A drone flies from the launch point $A(-3, 2)$ to the landing point $B(4, -5)$ on a map grid. Find the component form of its displacement vector.'
            answer: '(7, -7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The displacement is the landing point minus the launch point. So the components are $(4 - (-3), -5 - 2) = (7, -7)$.'
          - problem: 'Find the component form of the vector from $P(2, -1, 3)$ to $Q(0, 2, 5)$.'
            answer: '(-2, 3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'In three dimensions the rule is the same, with one more coordinate. The components are $(0 - 2, 2 - (-1), 5 - 3) = (-2, 3, 2)$.'
          - problem: 'A hiker walks from a camp at $(5, 0)$ to a lookout at $(-4, 3)$, with coordinates in kilometres east and north of the base. What is the displacement of the hike?'
            answer: '(-9, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The displacement is the lookout position minus the camp position. So the components are $(-4 - 5, 3 - 0) = (-9, 3)$, which means $9$ km west and $3$ km north.'
          - problem: 'Sam finds the vector from $P(-7, -2)$ to $Q(-1, -8)$ and writes $(-8, -10)$. What is the correct vector?'
            answer: '(6, -6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Sam added the coordinates, but the vector is the terminal point minus the initial point. So the correct components are $(-1 - (-7), -8 - (-2)) = (6, -6)$.'
          - problem: 'The vector from $P(1, 2)$ to $Q(4, 6)$ is called $\vec{PQ}$. Find the component form of $\vec{QP}$, the vector from $Q$ back to $P$.'
            answer: '(-3, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Now $Q$ is the initial point and $P$ is the terminal point. So the components are $(1 - 4, 2 - 6) = (-3, -4)$, the opposite of $\vec{PQ}$.'
          - problem: 'A bird flies from the treetop $(-3, 2, -5)$ to a ridge at $(1, -4, 2)$, with all coordinates in metres. Find the component form of its displacement.'
            answer: '(4, -6, 7)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The displacement is the end position minus the start position in each of the three coordinates. This gives $(1 - (-3), -4 - 2, 2 - (-5)) = (4, -6, 7)$.'
        constraints: 'integer coordinates in -9..9; dimensions 2 or 3'
      - id: kp2
        name: Equal vectors and endpoints
        key_prerequisites: [coordinate-plane]
        try_first:
          problem: 'A vector is drawn from $(0, 0)$ to $(2, 3)$. The same vector is redrawn so that it starts at $(5, 5)$. What is the $x$-coordinate of its new endpoint?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'The new endpoint is $(5 + 2, 5 + 3) = (7, 8)$. Moving a vector keeps its components and shifts only its start and end points.'
        exemplars:
          - problem: 'The vector $(3, -2)$ starts at $P(1, 4)$. Where does it end?'
            answer: '(4, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The terminal point is the initial point plus the vector. So it is $(1 + 3, 4 + (-2)) = (4, 2)$.'
          - problem: 'The vector $(-1, 5)$ ends at $Q(2, 3)$. Where does it start?'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The initial point is the terminal point minus the vector. So it is $(2 - (-1), 3 - 5) = (3, -2)$.'
          - problem: 'The vector from $A(-3, 2)$ to $B(4, -5)$ is equal to the vector from $C(2, 0)$ to $D$. Find the point $D$.'
            answer: '(9, -7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First find the components of $\vec{AB}$, which are $(4 - (-3), -5 - 2) = (7, -7)$. Equal vectors have equal components, so $D = C + (7, -7) = (9, -7)$.'
          - problem: 'A ferry sails from a port at $(-5, -3)$ to an island at $(4, 1)$. A second ferry makes exactly the same trip from a harbour at $(-2, 5)$. Where does the second ferry arrive?'
            answer: '(7, 9)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first trip has components $(4 - (-5), 1 - (-3)) = (9, 4)$. The second ferry moves by the same components, so it arrives at $(-2 + 9, 5 + 4) = (7, 9)$.'
          - problem: 'A delivery drone lands at $T(2, -6)$ after a flight with displacement $(5, -7)$. Where did it take off?'
            answer: '(-3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The take-off point is the landing point minus the displacement. So it is $(2 - 5, -6 - (-7)) = (-3, 1)$.'
          - problem: 'The points $A(0, 0)$, $B(4, 1)$ and $C(5, 4)$ are three vertices of the parallelogram $ABCD$. Find the fourth vertex $D$.'
            answer: '(1, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Opposite sides of a parallelogram are equal vectors, so $\vec{DC} = \vec{AB} = (4, 1)$. Then $D = C - (4, 1) = (5 - 4, 4 - 1) = (1, 3)$.'
          - problem: 'The vector from $P(2, -6)$ to $Q(-3, 4)$ is equal to the vector from $R(1, -2)$ to $S$. Find the point $S$.'
            answer: '(-4, 8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector $\vec{PQ}$ has components $(-3 - 2, 4 - (-6)) = (-5, 10)$. So $S = R + (-5, 10) = (1 - 5, -2 + 10) = (-4, 8)$.'
        constraints: 'integer coordinates in -9..9; dimension 2'
      - id: kp3
        name: Standard basis notation
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Write the vector $(3, -2)$ in $\mathbf{i}, \mathbf{j}$ notation.'
            answer: '3i - 2j'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first component multiplies $\mathbf{i}$ and the second multiplies $\mathbf{j}$. So $(3, -2) = 3\mathbf{i} - 2\mathbf{j}$.'
          - problem: 'Write $4\mathbf{i} - \mathbf{j} + 2\mathbf{k}$ in component form.'
            answer: '(4, -1, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The coefficients of $\mathbf{i}$, $\mathbf{j}$ and $\mathbf{k}$ are the components in order. The coefficient of $\mathbf{j}$ is $-1$, so the vector is $(4, -1, 2)$.'
          - problem: 'A boat travels $6$ km east and $4$ km south of its start. Take $\mathbf{i}$ to point east and $\mathbf{j}$ to point north. Write the displacement of the boat in terms of $\mathbf{i}$ and $\mathbf{j}$.'
            answer: '6i - 4j'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Going east is the positive $\mathbf{i}$ direction, so the first component is $6$. Going south is the negative $\mathbf{j}$ direction, so the displacement is $6\mathbf{i} - 4\mathbf{j}$.'
          - problem: 'Write the vector from $P(1, 1)$ to $Q(4, 0)$ in $\mathbf{i}, \mathbf{j}$ notation.'
            answer: '3i - j'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The component form is $(4 - 1, 0 - 1) = (3, -1)$. A coefficient of $-1$ is written as a minus sign, so the vector is $3\mathbf{i} - \mathbf{j}$.'
          - problem: 'A velocity vector has component form $(-3, 5)$ in metres per second. Write this velocity in $\mathbf{i}, \mathbf{j}$ notation.'
            answer: '-3i + 5j'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The horizontal component $-3$ is the coefficient of $\mathbf{i}$. The vertical component $5$ is the coefficient of $\mathbf{j}$, so the velocity is $-3\mathbf{i} + 5\mathbf{j}$.'
          - problem: 'Let $A(1, -2, 4)$ and $B(-3, 0, -2)$ be points. Write the vector from $A$ to $B$ in $\mathbf{i}, \mathbf{j}, \mathbf{k}$ notation.'
            answer: '-4i + 2j - 6k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First subtract: $B - A = (-3 - 1, 0 - (-2), -2 - 4) = (-4, 2, -6)$. The three components are the coefficients of $\mathbf{i}$, $\mathbf{j}$, $\mathbf{k}$ in order, so the vector is $-4\mathbf{i} + 2\mathbf{j} - 6\mathbf{k}$.'
          - problem: 'The vector $\mathbf{v} = -2\mathbf{k} + \mathbf{i} + 4\mathbf{j}$ has its terms written out of the usual order. What is the component form of $\mathbf{v}$?'
            answer: '(1, 4, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Component form lists the coefficient of $\mathbf{i}$ first, then of $\mathbf{j}$, then of $\mathbf{k}$. A lone $\mathbf{i}$ has coefficient $1$, so the vector is $(1, 4, -2)$.'
          - problem: 'Write $-\mathbf{j} + 5\mathbf{k}$ in component form.'
            answer: '(0, -1, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'There is no $\mathbf{i}$ term, so the first component is $0$. The coefficient of $\mathbf{j}$ is $-1$ and the coefficient of $\mathbf{k}$ is $5$, so the vector is $(0, -1, 5)$.'
        constraints: 'integer components in -9..9; dimensions 2 or 3'
    diagnostic_exemplar:
      problem: 'The vector from $P(-1, 3)$ to $Q(2, -2)$ is redrawn so that it starts at $R(1, 0)$. Write the vector from the origin to its new endpoint in $\mathbf{i}, \mathbf{j}$ notation.'
      answer: '$4i - 5j$'
      solution_sketch: 'The vector is $(2 - (-1), -2 - 3) = (3, -5)$; from $R(1, 0)$ it ends at $(1 + 3, 0 - 5) = (4, -5)$, i.e. $4i - 5j$.'
    anki_seeds:
      - front: 'Component form of the vector from point $P$ to point $Q$?'
        back: '$Q - P$ (terminal point minus initial point, componentwise).'
        type: basic
      - front: 'What are $\mathbf{i}, \mathbf{j}, \mathbf{k}$?'
        back: 'The standard unit vectors along the $x$-, $y$-, and $z$-axes.'
        type: basic

  - id: vector-arithmetic
    name: Vector Addition and Scalar Multiplication
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: component-form-of-vectors
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vector addition and subtraction
        key_prerequisites: [component-form-of-vectors]
        exemplars:
          - problem: 'Let $\mathbf{u} = (3, 1)$ and $\mathbf{v} = (-1, 4)$. Compute $\mathbf{u} + \mathbf{v}$.'
            answer: '(2, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Add the vectors one component at a time. The sum is $(3 + (-1), 1 + 4) = (2, 5)$.'
          - problem: 'Compute $(2, -3, 1) + (4, 0, -5)$.'
            answer: '(6, -3, -4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Both vectors have three components, so add the first, second and third components in turn. The sum is $(2 + 4, -3 + 0, 1 + (-5)) = (6, -3, -4)$.'
          - problem: 'A plane flies with velocity $(240, 30)$ km/h relative to the air, and the wind has velocity $(-40, 20)$ km/h. What is the velocity of the plane relative to the ground?'
            answer: '(200, 50)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The ground velocity is the air velocity plus the wind velocity. So it is $(240 + (-40), 30 + 20) = (200, 50)$ km/h.'
          - problem: 'Let $\mathbf{u} = (5, 2)$ and $\mathbf{v} = (3, 7)$. Compute $\mathbf{u} - \mathbf{v}$.'
            answer: '(2, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Subtract the vectors one component at a time. The difference is $(5 - 3, 2 - 7) = (2, -5)$.'
          - problem: 'Two ships are at $(12, -5)$ and $(7, 3)$ in kilometres from a lighthouse. What is the displacement from the second ship to the first ship?'
            answer: '(5, -8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The displacement from the second ship to the first is the first position minus the second position. So it is $(12 - 7, -5 - 3) = (5, -8)$.'
          - problem: 'Let $\mathbf{u} = (4, -3, -2)$. Find the vector $\mathbf{w}$ such that $\mathbf{u} + \mathbf{w} = (3, 1, 5)$.'
            answer: '(-1, 4, 7)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Subtract $\mathbf{u}$ from the sum, so $\mathbf{w} = (3, 1, 5) - (4, -3, -2)$. This gives $(3 - 4, 1 - (-3), 5 - (-2)) = (-1, 4, 7)$.'
          - problem: 'Let $\mathbf{u} = (k, k + 2)$ and $\mathbf{v} = (4, -9)$. Given that $\mathbf{u} + \mathbf{v} = (-1, -12)$, find $k$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first components give $k + 4 = -1$, so $k = -5$. The second components agree, since $(k + 2) + (-9) = -3 - 9 = -12$.'
          - problem: 'Let $\mathbf{p} = (2, -5, 1)$ and $\mathbf{q} = (k, 0, -3)$. Given that $\mathbf{p} - \mathbf{q} = (6, -5, 4)$, find $k$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first components give $2 - k = 6$, so $k = -4$. The other two components agree: $-5 - 0 = -5$ and $1 - (-3) = 4$.'
          - problem: 'Let $\mathbf{u} = (4, a, -2)$ and $\mathbf{v} = (-1, 5, b)$. Given that $\mathbf{u} + \mathbf{v} = (3, 1, 5)$, find the ordered pair $(a, b)$.'
            answer: '(-4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second components give $a + 5 = 1$, so $a = -4$. The third components give $-2 + b = 5$, so $b = 7$, and the first components agree since $4 + (-1) = 3$.'
          - problem: 'Mia computes $(6, -1) - (2, -4)$ and gets $(4, -5)$. What is the correct difference?'
            answer: '(4, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Mia made a sign error in the second component. It should be $-1 - (-4) = -1 + 4 = 3$, so the difference is $(6 - 2, 3) = (4, 3)$.'
        constraints: 'components are integers in -9..9; dimensions 2 or 3'
      - id: kp2
        name: Scalar multiplication
        key_prerequisites: [component-form-of-vectors]
        exemplars:
          - problem: 'Compute $3(2, -1)$.'
            answer: '(6, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply each component by the scalar $3$. The result is $(3 \cdot 2, 3 \cdot (-1)) = (6, -3)$.'
          - problem: 'Compute $-2(3, 0, -1)$.'
            answer: '(-6, 0, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Multiply every component by $-2$, including the zero. The result is $(-6, 0, 2)$.'
          - problem: 'A hiker walks with a displacement of $(2, 3)$ kilometres each hour. Walking at the same pace in the same direction, what is the displacement after $4$ hours?'
            answer: '(8, 12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Four hours of the same displacement is $4$ times the vector. So the displacement is $4(2, 3) = (8, 12)$ kilometres.'
          - problem: 'Compute $\frac{1}{2}(6, -4)$.'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiplying by $\frac{1}{2}$ halves each component. The result is $(3, -2)$.'
          - problem: 'A rover covers the displacement $(12, -18)$ metres in $6$ equal steps. What is the displacement of one step?'
            answer: '(2, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'One step is one sixth of the total displacement, so divide each component by $6$. The step is $\frac{1}{6}(12, -18) = (2, -3)$ metres.'
          - problem: 'Multiplying a vector by $-3$ gives $(6, -9, 3)$. What is the original vector?'
            answer: '(-2, 3, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Undo the multiplication by dividing each component by $-3$. The original vector is $\frac{1}{-3}(6, -9, 3) = (-2, 3, -1)$.'
          - problem: 'A drone covers the displacement $(15, -9, 6)$ metres in three equal legs. What is the displacement of one leg?'
            answer: '(5, -3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each leg is one third of the total, so divide every component by $3$. One leg is $(15 \div 3, -9 \div 3, 6 \div 3) = (5, -3, 2)$ metres.'
          - problem: 'The vector $\mathbf{w}$ points in the opposite direction to $(4, -2)$ and is three times as long. Find $\mathbf{w}$.'
            answer: '(-12, 6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Opposite direction means a negative scalar, and three times as long means the scalar has size $3$. So $\mathbf{w} = -3(4, -2) = (-12, 6)$.'
        constraints: 'integer scalars in -3..3 or halves that keep components integer; integer components'
      - id: kp3
        name: Parallel vectors as scalar multiples
        key_prerequisites: [component-form-of-vectors]
        try_first:
          problem: 'By what number must $(2, 3)$ be multiplied to give $(6, 9)$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Every component is multiplied by $3$: $3(2, 3) = (6, 9)$. Vectors that are scalar multiples of each other are parallel.'
        exemplars:
          - problem: 'Find $k$ so that $(6, k)$ is parallel to $(2, 3)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parallel means $(6, k) = c(2, 3)$ for some number $c$. The first components give $6 = 2c$, so $c = 3$ and $k = 3 \cdot 3 = 9$.'
          - problem: 'Find the scalar $c$ such that $(6, -4) = c(-3, 2)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the first components: $6 = c(-3)$, so $c = -2$. The second components agree, since $-2 \cdot 2 = -4$.'
          - problem: 'The vector $(4, k)$ is a multiple of $(2, 5)$. Find $k$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $(4, k) = c(2, 5)$. The first components give $4 = 2c$, so $c = 2$ and $k = 2 \cdot 5 = 10$.'
          - problem: 'Are the vectors $(6, -9)$ and $(-4, 6)$ parallel?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are parallel","parallel"],["no","they are not parallel","not parallel"]]}
            solution_sketch: 'Compare ratios of components: $6 \div (-4) = -\frac{3}{2}$ and $-9 \div 6 = -\frac{3}{2}$. The ratios agree, so $(6, -9) = -\frac{3}{2}(-4, 6)$ and the vectors are parallel.'
          - problem: 'The vector $(k, 12)$ is parallel to $(5, 4)$. Find $k$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $(k, 12) = c(5, 4)$. The second components give $12 = 4c$, so $c = 3$ and $k = 3 \cdot 5 = 15$.'
          - problem: 'A vector is parallel to $(2, -5)$ and its first component is $8$. Find the vector.'
            answer: '(8, -20)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector has the form $c(2, -5)$. The first component gives $8 = 2c$, so $c = 4$ and the vector is $(8, -20)$.'
          - problem: 'Two support cables have direction vectors $(10, 15)$ and $(4, k)$. For which value of $k$ are the cables parallel?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parallel cables need $(4, k) = c(10, 15)$. The first components give $4 = 10c$, so $c = \frac{2}{5}$ and $k = \frac{2}{5} \cdot 15 = 6$.'
          - problem: 'A ramp rises $3$ m over a horizontal run of $8$ m. A second ramp is parallel to it and has a horizontal run of $20$ m. How high does the second ramp rise?'
            answer: '7.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The direction vectors are $(8, 3)$ and $(20, h)$, which must be parallel. Since $20 = 2.5 \cdot 8$, the rise is $h = 2.5 \cdot 3 = 7.5$ m.'
          - problem: 'Are the vectors $(3, 5)$ and $(6, 9)$ parallel?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","they are parallel","parallel"],["no","they are not parallel","not parallel"]]}
            solution_sketch: 'Compare ratios: $6 \div 3 = 2$ but $9 \div 5 = \frac{9}{5}$. The ratios differ, so $(6, 9)$ is not a scalar multiple of $(3, 5)$ and the vectors are not parallel.'
        constraints: 'scalar multiples with integer ratio; solve-for-k problems must have integer k'
    diagnostic_exemplar:
      problem: 'Compute $(5, -1) + 2(-1, 3)$, then find $k$ so that the result is parallel to $(6, k)$.'
      answer: '10'
      solution_sketch: '$(5, -1) + (-2, 6) = (3, 5)$; $(6, k) = 2(3, 5)$ forces $k = 10$.'
    anki_seeds:
      - front: 'How do vectors add?'
        back: 'Componentwise: $(u_1 + v_1, \dots, u_n + v_n)$.'
        type: basic
      - front: 'Nonzero vectors $\mathbf{u}$ and $\mathbf{v}$ are parallel exactly when...'
        back: '$\mathbf{u} = c\mathbf{v}$ for some nonzero scalar $c$.'
        type: basic

  - id: linear-combinations-of-vectors
    name: Linear Combinations of Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.8
        key: true
      - id: systems-elimination
        weight: 0.3
      - id: order-of-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluating linear combinations
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (1, 2)$ and $\mathbf{v} = (2, -1)$. Compute $2\mathbf{u} - 3\mathbf{v}$.'
            answer: '(-4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First scale each vector: $2\mathbf{u} = (2, 4)$ and $3\mathbf{v} = (6, -3)$. Then subtract componentwise to get $(2 - 6, 4 - (-3)) = (-4, 7)$.'
          - problem: 'Let $\mathbf{u} = (0, 3)$ and $\mathbf{v} = (4, 1)$. Compute $\mathbf{u} + 2\mathbf{v}$.'
            answer: '(8, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Scale $\mathbf{v}$ first: $2\mathbf{v} = (8, 2)$. Then add componentwise: $(0 + 8, 3 + 2) = (8, 5)$.'
          - problem: 'A shop sells fruit packs. Pack A holds $(4, 2, 0)$ and pack B holds $(1, 3, 2)$ pieces of (apples, pears, plums). How many pieces of each fruit are in $3$ packs of A and $2$ packs of B together?'
            answer: '(14, 12, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The totals are the linear combination $3(4, 2, 0) + 2(1, 3, 2)$. This is $(12, 6, 0) + (2, 6, 4) = (14, 12, 4)$, so there are $14$ apples, $12$ pears and $4$ plums.'
          - problem: 'Compute $3(1, 0, 2) - (2, 2, 1)$.'
            answer: '(1, -2, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Scale the first vector: $3(1, 0, 2) = (3, 0, 6)$. Then subtract componentwise: $(3 - 2, 0 - 2, 6 - 1) = (1, -2, 5)$.'
          - problem: 'Two buoys are at the positions $\mathbf{p} = (8, -2)$ and $\mathbf{q} = (2, 6)$ in kilometres. A boat stays at the average position $\frac{1}{2}(\mathbf{p} + \mathbf{q})$ of the two buoys. Where is the boat?'
            answer: '(5, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First add the positions: $\mathbf{p} + \mathbf{q} = (10, 4)$. Then halve each component to get the average position $(5, 2)$.'
          - problem: 'Tom computes $2(3, -1) - 3(1, 4)$ and gets $(3, 10)$. What is the correct result?'
            answer: '(3, -14)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Tom did not subtract the whole second vector. The correct scaled vectors are $(6, -2)$ and $(3, 12)$, and $(6 - 3, -2 - 12) = (3, -14)$.'
          - problem: 'Let $\mathbf{u} = (1, -2, 3)$ and $\mathbf{v} = (-2, 1, 4)$. Compute $-\mathbf{u} + 3\mathbf{v}$.'
            answer: '(-7, 5, 9)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Scale each vector: $-\mathbf{u} = (-1, 2, -3)$ and $3\mathbf{v} = (-6, 3, 12)$. Then add componentwise to get $(-7, 5, 9)$.'
        constraints: 'integer scalars in -3..3; integer components in -9..9; at most two terms'
      - id: kp2
        name: Combinations of three vectors
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (1, 1)$, $\mathbf{v} = (0, 2)$ and $\mathbf{w} = (2, 0)$. Compute $\mathbf{u} - 2\mathbf{v} + 3\mathbf{w}$.'
            answer: '(7, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Scale each vector: $2\mathbf{v} = (0, 4)$ and $3\mathbf{w} = (6, 0)$. Then $(1, 1) - (0, 4) + (6, 0) = (7, -3)$.'
          - problem: 'Compute the linear combination $2(1, 0, 1) - (2, 1, 0) + 3(0, 1, -1)$.'
            answer: '(0, 2, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Scale the vectors: $(2, 0, 2)$, $-(2, 1, 0) = (-2, -1, 0)$ and $(0, 3, -3)$. Adding the three components in order gives $(0, 2, -1)$.'
          - problem: 'A hiker walks $3$ times the vector $\mathbf{a} = (6, -4)$ kilometres, then walks the reverse of $\mathbf{b} = (-2, 6)$, then walks half of $\mathbf{c} = (0, 8)$. Find the total displacement.'
            answer: '(20, -14)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The total is $3\mathbf{a} - \mathbf{b} + \frac{1}{2}\mathbf{c} = (18, -12) + (2, -6) + (0, 4)$. Adding the components gives $(20, -14)$ kilometres.'
          - problem: 'Compute $\frac{1}{2}(\mathbf{u} + \mathbf{v})$ for $\mathbf{u} = (2, 4)$ and $\mathbf{v} = (6, 0)$.'
            answer: '(4, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First $\mathbf{u} + \mathbf{v} = (8, 4)$. Then halve each component to get $(4, 2)$.'
          - problem: 'Three sensors measure the positions $(6, 3)$, $(0, 9)$ and $(3, 0)$ in metres. The sensors are averaged to give one mean position. What is the mean position?'
            answer: '(3, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The mean position is $\frac{1}{3}$ of the sum of the three positions. The sum is $(9, 12)$, so the mean is $(3, 4)$ metres.'
          - problem: 'Let $\mathbf{u} = (-1, 2)$, $\mathbf{v} = (3, -1)$ and $\mathbf{w} = (0, 4)$. Compute $-2\mathbf{u} + \mathbf{v} - 3\mathbf{w}$.'
            answer: '(5, -17)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Scale each vector: $-2\mathbf{u} = (2, -4)$, $\mathbf{v} = (3, -1)$ and $-3\mathbf{w} = (0, -12)$. Adding the components gives $(2 + 3 + 0, -4 - 1 - 12) = (5, -17)$.'
          - problem: 'A bakery makes loaf A from $(3, 1, 2)$, loaf B from $(1, 2, 0)$ and loaf C from $(0, 1, 4)$ units of (flour, sugar, butter). How many units of each ingredient does a day need when it bakes $2$ loaves of A, $3$ of B and $1$ of C?'
            answer: '(9, 9, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The total is $2(3, 1, 2) + 3(1, 2, 0) + (0, 1, 4) = (6, 2, 4) + (3, 6, 0) + (0, 1, 4)$. Adding the components gives $(9, 9, 8)$.'
          - problem: 'Let $\mathbf{u} = (4, -2, 6)$, $\mathbf{v} = (1, 3, -1)$ and $\mathbf{w} = (-2, 0, 4)$. Compute $\frac{1}{2}\mathbf{u} - 2\mathbf{v} + \mathbf{w}$.'
            answer: '(-2, -7, 9)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Scale each vector: $\frac{1}{2}\mathbf{u} = (2, -1, 3)$ and $-2\mathbf{v} = (-2, -6, 2)$. Adding $\mathbf{w} = (-2, 0, 4)$ gives $(-2, -7, 9)$.'
        constraints: 'up to three terms; integer results; scalars in -3..3 plus the scalar 1/2'
      - id: kp3
        name: Solving for combination coefficients
        key_prerequisites: [vector-arithmetic, systems-elimination]
        exemplars:
          - problem: 'Find the ordered pair $(a, b)$ of scalars such that $a(1, 0) + b(0, 1) = (4, -7)$.'
            answer: '(4, -7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector $a(1, 0) + b(0, 1)$ equals $(a, b)$. Comparing with $(4, -7)$ gives $a = 4$ and $b = -7$.'
          - problem: 'Find the scalar $c$ such that $c(2, 3) + (1, 1) = (5, 7)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first components give $2c + 1 = 5$, so $c = 2$. The second components agree, since $3 \cdot 2 + 1 = 7$.'
          - problem: 'Find the ordered pair $(a, b)$ of scalars such that $a(1, 1) + b(1, -1) = (4, 2)$.'
            answer: '(3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The components give $a + b = 4$ and $a - b = 2$. Adding the equations gives $2a = 6$, so $a = 3$ and $b = 1$.'
          - problem: 'One bag of mix X holds $2$ kg of oats and $1$ kg of nuts. One bag of mix Y holds $1$ kg of oats and $3$ kg of nuts. Find the numbers of bags $(a, b)$ of mix X and mix Y that together hold exactly $13$ kg of oats and $14$ kg of nuts.'
            answer: '(5, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'With $a$ bags of X and $b$ bags of Y, oats give $2a + b = 13$ and nuts give $a + 3b = 14$. Substituting $a = 14 - 3b$ gives $28 - 5b = 13$, so $b = 3$ and $a = 5$.'
          - problem: 'Find the ordered pair $(a, b)$ of scalars such that $a(1, 2) + b(2, 1) = (5, 4)$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The components give $a + 2b = 5$ and $2a + b = 4$. Doubling the first equation and subtracting the second gives $3b = 6$, so $b = 2$ and $a = 1$.'
          - problem: 'A rescue boat has two thrusters. Thruster 1 pushes with $(1, 1)$ per unit of power and thruster 2 pushes with $(2, -1)$ per unit of power. Find the powers $(a, b)$ of thruster 1 and thruster 2 that give the total thrust $(8, -1)$.'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The components give $a + 2b = 8$ and $a - b = -1$. Subtracting the second equation from the first gives $3b = 9$, so $b = 3$ and $a = 2$.'
          - problem: 'Find the ordered pair $(a, b)$ of scalars such that $a(3, 1) + b(1, 2) = (11, 7)$.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The components give $3a + b = 11$ and $a + 2b = 7$. Substituting $b = 11 - 3a$ into the second equation gives $-5a + 22 = 7$, so $a = 3$ and $b = 2$.'
          - problem: 'Find the scalar $c$ such that $c(2, 5) + (3, -1) = (9, 14)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first components give $2c + 3 = 9$, so $c = 3$. The second components agree, since $5 \cdot 3 - 1 = 14$.'
        constraints: 'coefficients are small integers in -9..9; systems solvable by inspection or one elimination'
    diagnostic_exemplar:
      problem: 'Find the ordered pair $(a, b)$ of scalars such that $a(1, 2) + b(3, -1) = (5, 3)$.'
      answer: '(2, 1)'
      solution_sketch: '$a + 3b = 5$ and $2a - b = 3$ give $a = 2$, $b = 1$; check $2(1, 2) + (3, -1) = (5, 3)$.'
    anki_seeds:
      - front: 'A linear combination of vectors $\mathbf{v}_1, \dots, \mathbf{v}_k$ is...'
        back: '$c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k$ for scalars $c_1, \dots, c_k$.'
        type: basic

  - id: vector-norms-unit-vectors
    name: Vector Norms and Unit Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Computing norms
        key_prerequisites: [pythagorean-theorem, square-roots]
        exemplars:
          - problem: 'Compute $\|(3, 4)\|$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm is the square root of the sum of the squares of the components. So $\|(3, 4)\| = \sqrt{9 + 16} = \sqrt{25} = 5$.'
          - problem: 'Compute $\|(1, 2, 2)\|$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square each component and add: $1 + 4 + 4 = 9$. The norm is $\sqrt{9} = 3$.'
          - problem: 'A drone has velocity $(8, -15)$ metres per second. What is its speed?'
            answer: '17'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The speed is the norm of the velocity vector. So the speed is $\sqrt{8^2 + (-15)^2} = \sqrt{64 + 225} = \sqrt{289} = 17$ m/s.'
          - problem: 'Compute $\|(-5, 12)\|$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Squaring removes the minus sign, so $(-5)^2 = 25$. The norm is $\sqrt{25 + 144} = \sqrt{169} = 13$.'
          - problem: 'Two radio towers stand at the map points $(2, 1)$ and $(8, 9)$, with coordinates in kilometres. How far apart are the towers?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The distance is the norm of the displacement vector $(8 - 2, 9 - 1) = (6, 8)$. So the distance is $\sqrt{36 + 64} = \sqrt{100} = 10$ km.'
          - problem: 'Compute the norm of the vector $(2, 3, 6)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In three dimensions the norm is $\sqrt{2^2 + 3^2 + 6^2} = \sqrt{4 + 9 + 36} = \sqrt{49}$. This equals $7$.'
          - problem: 'A force on a bolt has components $(2, -6, 9)$ newtons. What is the magnitude of the force in newtons?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The magnitude is the norm of the force vector. So it is $\sqrt{4 + 36 + 81} = \sqrt{121} = 11$ newtons.'
          - problem: 'The vector $(-12, y)$ has norm $13$, where $y > 0$. Find $y$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm condition gives $\sqrt{144 + y^2} = 13$, so $144 + y^2 = 169$ and $y^2 = 25$. Since $y > 0$, $y = 5$.'
          - problem: 'Eli computes $\|(-6, 8)\|$ by adding the components and gets $2$. What is the correct norm?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm squares the components before adding. So $\|(-6, 8)\| = \sqrt{36 + 64} = \sqrt{100} = 10$.'
        constraints: 'prefer Pythagorean-friendly components (3-4-5, 5-12-13, 1-2-2, 2-3-6 families)'
      - id: kp2
        name: Norms with radicals and scaling
        key_prerequisites: [square-roots, vector-arithmetic]
        exemplars:
          - problem: 'Compute $\|(1, 1)\|$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm is $\sqrt{1^2 + 1^2} = \sqrt{2}$. This is not a whole number, so the answer stays as a radical.'
          - problem: 'Compute $\|(2, -1)\|$.'
            answer: 'sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm is $\sqrt{2^2 + (-1)^2} = \sqrt{4 + 1} = \sqrt{5}$. The result is not a whole number.'
          - problem: 'If $\|\mathbf{v}\| = 4$, what is $\|-2\mathbf{v}\|$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A scalar multiple has norm $|c|\,\|\mathbf{v}\|$. So $\|-2\mathbf{v}\| = 2 \cdot 4 = 8$.'
          - problem: 'Compute $\|(2, 6)\|$ and simplify.'
            answer: '2sqrt(10)'
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The norm is $\sqrt{4 + 36} = \sqrt{40}$. Since $40 = 4 \cdot 10$, this simplifies to $2\sqrt{10}$.'
          - problem: 'A rectangular room is $4$ m wide and $6$ m long. How long is its diagonal, to one decimal place?'
            answer: '7.2'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The diagonal is the norm of $(4, 6)$, which is $\sqrt{16 + 36} = \sqrt{52}$. This is about $7.2$ metres.'
          - problem: 'A vector $\mathbf{v}$ has norm $\sqrt{5}$. Find the norm of $-3\mathbf{v}$.'
            answer: '3sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A scalar multiple has norm $|c|\,\|\mathbf{v}\|$, so $\|-3\mathbf{v}\| = |-3|\sqrt{5}$. This equals $3\sqrt{5}$.'
          - problem: 'A velocity vector $\mathbf{v}$ has speed $20$ m/s. A second vector points the same way and has speed $5$ m/s. What number multiplied by $\mathbf{v}$ gives the second vector?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The scalar $c$ must satisfy $|c| \cdot 20 = 5$, and it is positive because the direction is the same. So $c = 5 \div 20 = \frac{1}{4}$.'
          - problem: 'A drone has velocity $\mathbf{v}$ and speed $7$ m/s. It doubles its velocity vector and reverses direction, so its velocity is $-2\mathbf{v}$. What is its new speed?'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The new speed is the norm of $-2\mathbf{v}$, which is $|-2| \cdot 7$. So the new speed is $14$ m/s.'
          - problem: 'Zoe says that $\|(2, 2)\| = 4$ because $2 + 2 = 4$. What is the correct norm?'
            answer: '2sqrt(2)'
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Zoe added the components, but the norm squares them first. So $\|(2, 2)\| = \sqrt{4 + 4} = \sqrt{8} = 2\sqrt{2}$.'
        constraints: 'exact radical answers; scaling questions use integer scalars in -3..3'
      - id: kp3
        name: Unit vectors and prescribed lengths
        key_prerequisites: [vector-arithmetic, square-roots]
        try_first:
          problem: 'The vector $(9, 12)$ has length $15$. By what number must you divide it to get a vector of length $1$?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'Dividing by $15$ gives $(9/15, 12/15) = (3/5, 4/5)$, which has length $1$. Dividing a vector by its norm gives the unit vector in its direction.'
        exemplars:
          - problem: 'Find the unit vector in the direction of $(6, 8)$.'
            answer: '(3/5, 4/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm is $\|(6, 8)\| = \sqrt{36 + 64} = 10$. Dividing each component by $10$ gives $(3/5, 4/5)$.'
          - problem: 'Find the unit vector in the direction of $(2, 3, 6)$.'
            answer: '(2/7, 3/7, 6/7)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The norm is $\sqrt{4 + 9 + 36} = 7$. Dividing each component by $7$ gives $(2/7, 3/7, 6/7)$.'
          - problem: 'Find the vector of length $10$ in the direction of $(3, -4)$.'
            answer: '(6, -8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm of $(3, -4)$ is $5$, so the unit vector is $(3/5, -4/5)$. Multiplying by $10$ gives $(6, -8)$, which is the same as doubling $(3, -4)$.'
          - problem: 'A ship must head in the direction $(5, 12)$ at a speed of $26$ km/h. Write its velocity vector.'
            answer: '(10, 24)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm of $(5, 12)$ is $13$, so the unit vector is $(5/13, 12/13)$. Multiplying by the speed $26$ gives the velocity $(10, 24)$ km/h.'
          - problem: 'Find the unit vector in the direction of $(1, -4, 8)$.'
            answer: '(1/9, -4/9, 8/9)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The norm is $\sqrt{1 + 16 + 64} = \sqrt{81} = 9$. Dividing each component by $9$ gives $(1/9, -4/9, 8/9)$.'
          - problem: 'A force of $15$ N acts in the direction $(8, -6)$. Find the force vector in newtons.'
            answer: '(12, -9)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm of $(8, -6)$ is $10$, so the force vector is $\frac{15}{10}(8, -6)$. The scale factor is $\frac{3}{2}$, which gives $(12, -9)$.'
          - problem: 'Is $\left(\frac{1}{2}, \frac{1}{2}\right)$ a unit vector?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a unit vector","unit vector"],["no","it is not a unit vector","not a unit vector"]]}
            solution_sketch: 'Its norm is $\sqrt{\frac{1}{4} + \frac{1}{4}} = \sqrt{\frac{1}{2}}$, which is not $1$. So it is not a unit vector.'
          - problem: 'Find the unit vector in the direction of $(10, 24)$.'
            answer: '(5/13, 12/13)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm is $\sqrt{100 + 576} = \sqrt{676} = 26$. Dividing each component by $26$ gives $(5/13, 12/13)$.'
          - problem: 'Find the vector of length $26$ in the direction of $(3, 4, 12)$.'
            answer: '(6, 8, 24)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The norm of $(3, 4, 12)$ is $13$. The scale factor is $26 \div 13 = 2$, so the vector is $(6, 8, 24)$.'
          - problem: 'Find the unit vector in the direction of $(1, 1)$.'
            answer: '(sqrt(2)/2, sqrt(2)/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The norm of $(1, 1)$ is $\sqrt{2}$. Dividing each component by $\sqrt{2}$ gives $(1/\sqrt{2}, 1/\sqrt{2})$, which equals $(\sqrt{2}/2, \sqrt{2}/2)$.'
        constraints: 'vectors with integer norms (3-4-5, 5-12-13, 2-3-6 families); prescribed lengths are integer multiples of the norm'
    diagnostic_exemplar:
      problem: 'Find the unit vector in the direction of $(5, 12)$.'
      answer: "(5/13, 12/13)"
      solution_sketch: '$\|(5, 12)\| = 13$; divide each component by $13$.'
    anki_seeds:
      - front: 'Formula for the norm of $\mathbf{v} = (v_1, \dots, v_n)$?'
        back: '$\|\mathbf{v}\| = \sqrt{v_1^2 + \cdots + v_n^2}$.'
        type: basic
      - front: 'How do you turn a nonzero vector $\mathbf{v}$ into a unit vector?'
        back: 'Divide by its norm: $\mathbf{v} / \|\mathbf{v}\|$.'
        type: basic
      - front: '$\|c\mathbf{v}\| = $ ?'
        back: '$|c|\,\|\mathbf{v}\|$.'
        type: basic

  - id: vector-distance
    name: Distance Between Points via Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-norms-unit-vectors
        weight: 0.7
        key: true
      - id: component-form-of-vectors
        weight: 0.5
        key: true
      - id: distance-midpoint-formulas
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Distance in the plane
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        try_first:
          problem: 'A walker goes $3$ km east and then $4$ km north. How many kilometres is she from her starting point, in a straight line?'
          answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
          answer: '5'
          reveal: 'The east and north legs are the two sides of a right triangle, so the straight-line distance is $\sqrt{3^2+4^2}=5$ km. The distance between two points is the length of the vector that joins them.'
        exemplars:
          - problem: 'Find the distance between $P(1, 2)$ and $Q(4, 6)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract the coordinates of $P$ from those of $Q$ to get $Q-P=(3, 4)$. The distance is the norm $\sqrt{3^2+4^2}=\sqrt{25}=5$.'
          - problem: 'On a map one grid square is $1$ km wide. A lighthouse stands at $L(2, 1)$ and a harbour at $H(14, 6)$. How far is the lighthouse from the harbour in a straight line?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The harbour is $12$ km east and $5$ km north of the lighthouse, so the displacement is $(12, 5)$. The straight-line distance is $\sqrt{12^2+5^2}=\sqrt{169}=13$ km.'
          - problem: 'Find the distance between $P(-2, 1)$ and $Q(4, 9)$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement is $Q-P=(4-(-2),\ 9-1)=(6, 8)$. Its norm is $\sqrt{36+64}=\sqrt{100}=10$.'
          - problem: 'Find the distance between $P(0, 0)$ and $Q(1, 2)$.'
            answer: 'sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $Q-P=(1, 2)$, so the distance is $\sqrt{1^2+2^2}=\sqrt{5}$. This is not a whole number, so the root stays in the answer.'
          - problem: 'A robot on a warehouse floor drives in a straight line from $A(0, 0)$ to $B(9, 12)$, with coordinates in metres, and the drive takes $5$ s. What is its speed?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The distance driven is $\|(9, 12)\|=\sqrt{81+144}=15$ m. Speed is distance divided by time, so the speed is $15\div 5=3$ m/s.'
          - problem: 'Find the distance between $P(2, 3)$ and $Q(6, 5)$ in simplest radical form.'
            answer: '2*sqrt(5)'
            answer_contract: {"kind": "required_simplest_radical"}
            solution_sketch: 'The displacement is $Q-P=(4, 2)$, so the distance is $\sqrt{16+4}=\sqrt{20}$. Since $20=4\cdot 5$, the distance is $2\sqrt{5}$.'
          - problem: 'The point $Q(5, y)$ is $13$ units from the origin and lies above the $x$-axis. Find $y$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement from the origin is $(5, y)$, so $13=\sqrt{5^2+y^2}$. Squaring gives $169=25+y^2$, so $y^2=144$, and $y=12$ because $y>0$.'
          - problem: 'Sam finds the distance between $P(-2, 1)$ and $Q(2, 4)$ as $\sqrt{(2-2)^2+(4-1)^2}=3$. What is the correct distance?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted $2$ instead of $-2$ in the first component. The correct displacement is $Q-P=(4, 3)$, so the distance is $\sqrt{16+9}=5$.'
        constraints: 'mostly Pythagorean-friendly differences; occasionally an exact radical answer; word problems on a map or grid; one speed item'
      - id: kp2
        name: Distance in space
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Find the distance between $P(1, 0, 2)$ and $Q(2, 2, 4)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement is $Q-P=(1, 2, 2)$. Its norm is $\sqrt{1+4+4}=\sqrt{9}=3$.'
          - problem: 'Find the distance between $P(3, -1, 2)$ and $Q(5, 2, 8)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement is $Q-P=(2, 3, 6)$. Its norm is $\sqrt{4+9+36}=\sqrt{49}=7$.'
          - problem: 'A drone flies in a straight line from $A(1, 1, 1)$ to $B(7, 10, 19)$, with coordinates in metres. How far does it fly?'
            answer: '21'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The displacement is $B-A=(6, 9, 18)$. The distance is $\sqrt{36+81+324}=\sqrt{441}=21$ m.'
          - problem: 'Starting from $P(-1, 2, 0)$, a point moves $4$ units in the $x$-direction, $6$ in the $y$-direction and $12$ in the $z$-direction to reach $Q$. Find the distance $PQ$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement from $P$ to $Q$ is $(4, 6, 12)$. The distance is $\sqrt{16+36+144}=\sqrt{196}=14$.'
          - problem: 'The distance between $P(1, 2, 3)$ and $Q(2, 4, z)$ is $3$. Find the larger possible value of $z$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement is $Q-P=(1, 2, z-3)$, so $9=1+4+(z-3)^2$ and $(z-3)^2=4$. Then $z=5$ or $z=1$, and the larger value is $5$.'
          - problem: 'A rectangular box measures $4$ cm by $4$ cm by $7$ cm. How long is the longest straight rod that fits inside it, from one corner to the opposite corner?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Place one corner at $(0, 0, 0)$; the opposite corner is $(4, 4, 7)$. The rod has length $\sqrt{16+16+49}=\sqrt{81}=9$ cm.'
          - problem: 'Find the distance between $P(2, -1, 4)$ and $Q(6, 7, 12)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The displacement is $Q-P=(4, 8, 8)$. The distance is $\sqrt{16+64+64}=\sqrt{144}=12$.'
          - problem: 'A survey drone flies in a straight line from $A(0, 0, 0)$ to $B(2, 3, 6)$, with coordinates in kilometres, at a constant speed of $3.5$ km/h. How long does the flight take?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The distance is $\sqrt{4+9+36}=\sqrt{49}=7$ km. Time is distance divided by speed, so the flight takes $7\div 3.5=2$ hours.'
        constraints: 'differences from the 1-2-2, 2-3-6 or 4-4-7 families for integer answers; word problems with a drone, a box or a flight time'
      - id: kp3
        name: Comparing distances
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Which of $Q(4, 5)$ and $R(5, 1)$ is closer to $P(1, 1)$?'
            answer: 'R'
            answer_contract: {"kind": "label", "options": [["R", "point R", "R is closer", "it is R", "R is closer to P", "point R is closer", "R is nearer"], ["Q", "point Q", "Q is closer", "it is Q", "Q is closer to P", "point Q is closer", "Q is nearer"]]}
            solution_sketch: 'The vector $PQ=(3, 4)$ has norm $5$. The vector $PR=(4, 0)$ has norm $4$, which is smaller, so $R$ is closer.'
          - problem: 'A delivery van is at $V(2, 3)$ on a map with $1$ km grid squares. Depot $A$ is at $(5, 7)$ and depot $B$ is at $(10, 3)$. Which depot is nearer to the van?'
            answer: 'A'
            answer_contract: {"kind": "label", "options": [["A", "depot A", "A is nearer", "it is A", "depot A is nearer", "depot A is closer", "A is closer"], ["B", "depot B", "B is nearer", "it is B", "depot B is nearer", "depot B is closer", "B is closer"]]}
            solution_sketch: 'The distance to depot $A$ is $\|(3, 4)\|=5$ km. The distance to depot $B$ is $\|(8, 0)\|=8$ km, so depot $A$ is nearer.'
          - problem: 'A hiker stands at the origin $P$ of a map in kilometres. A lake is at $Q(3, 4)$ and a peak is at $R(6, 8)$. How much farther from the hiker is the peak than the lake?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The lake is $\|(3, 4)\|=5$ km away. The peak is $\|(6, 8)\|=10$ km away, so it is $10-5=5$ km farther.'
          - problem: 'For the points $A(1, 2)$, $B(4, 6)$ and $C(1, 8)$, find $|AB|-|AC|$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vector $AB=(3, 4)$ has norm $5$ and the vector $AC=(0, 6)$ has norm $6$. So $|AB|-|AC|=5-6=-1$.'
          - problem: 'Ana at $A(1, 2)$ and Ben at $B(10, 14)$ live on a map with $1$ km grid squares. They walk straight toward each other at the same constant speed and meet. How far does each of them walk?'
            answer: '7.5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The distance between them is $\|(9, 12)\|=\sqrt{81+144}=15$ km. They walk equal distances, so each walks $15\div 2=7.5$ km.'
          - problem: 'Find the perimeter of the triangle with vertices $A(0, 0)$, $B(3, 4)$ and $C(6, 0)$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sides are $|AB|=\|(3, 4)\|=5$, $|CB|=\|(-3, 4)\|=5$ and $|AC|=6$. The perimeter is $5+5+6=16$.'
          - problem: 'How far from the origin is the farther of the points $Q(5, 12)$ and $R(9, 12)$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The distances are $\|(5, 12)\|=13$ and $\|(9, 12)\|=15$. The larger distance is $15$.'
          - problem: 'Find $x$ so that the point $(x, 0)$ is the same distance from $A(0, 3)$ as from $B(4, 1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set the squared distances equal: $x^2+9=(x-4)^2+1$. This gives $x^2+9=x^2-8x+17$, so $8x=8$ and $x=1$.'
        constraints: 'distances chosen to be integers so comparisons are clean; verdict items name both candidates in the question; word problems on a map'
    diagnostic_exemplar:
      problem: 'Which of $Q(4, 2, 4)$ and $R(-1, 0, 2)$ is farther from $P(1, 2, 0)$? Give that distance.'
      answer: '5'
      solution_sketch: '$|PQ| = \|(3, 0, 4)\| = 5$ and $|PR| = \|(-2, -2, 2)\| = 2\sqrt3 \approx 3.46$, so $Q$ is farther, at distance $5$.'
    anki_seeds:
      - front: 'Distance between points $P$ and $Q$ in terms of vectors?'
        back: '$\|Q - P\|$, the norm of the vector from $P$ to $Q$.'
        type: basic

  - id: vectors-in-rn
    name: Vectors in R^n
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.7
        key: true
      - id: vector-norms-unit-vectors
        weight: 0.7
        key: true
      - id: linear-combinations-of-vectors
        weight: 0.5
      - id: vector-distance
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Norms of linear combinations
        key_prerequisites: [vector-arithmetic, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Let $\mathbf{u} = (2, 1)$ and $\mathbf{v} = (1, -2)$. Compute $\|2\mathbf{u} - \mathbf{v}\|$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $2\mathbf{u}-\mathbf{v}=(4-1,\ 2-(-2))=(3, 4)$. Then $\|(3, 4)\|=\sqrt{9+16}=5$.'
          - problem: 'Let $\mathbf{u} = (1, 0, 2)$ and $\mathbf{v} = (0, 2, 0)$. Compute $\|\mathbf{u} + \mathbf{v}\|$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $\mathbf{u}+\mathbf{v}=(1, 2, 2)$. Its norm is $\sqrt{1+4+4}=3$.'
          - problem: 'Let $\mathbf{u} = (1, 2, 2)$. Compute $\|3\mathbf{u}\|$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The norm of $\mathbf{u}$ is $\sqrt{1+4+4}=3$. Scaling by $3$ multiplies the norm by $3$, so $\|3\mathbf{u}\|=9$.'
          - problem: 'Let $\mathbf{u} = (1, 2)$ and $\mathbf{v} = (-1, -3)$. Compute $\|3\mathbf{u} - 2\mathbf{v}\|$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $3\mathbf{u}=(3, 6)$ and $2\mathbf{v}=(-2, -6)$, so $3\mathbf{u}-2\mathbf{v}=(5, 12)$. Then $\|(5, 12)\|=\sqrt{25+144}=13$.'
          - problem: 'A plane flies with velocity $(130, 200)$ km/h relative to the air, and the wind adds a velocity of $(20, 0)$ km/h. What is the plane''s ground speed?'
            answer: '250'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The velocity over the ground is the sum $(130, 200)+(20, 0)=(150, 200)$ km/h. The ground speed is its norm, $\sqrt{150^2+200^2}=\sqrt{62500}=250$ km/h.'
          - problem: 'In $4$ s a drone makes two moves, first $(7, 10)$ m and then $(5, 6)$ m. What is the magnitude of its average velocity?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The total displacement is $(7, 10)+(5, 6)=(12, 16)$ m, with norm $\sqrt{144+256}=20$ m. Dividing by the time gives $20\div 4=5$ m/s.'
          - problem: 'Let $\mathbf{u} = (1, 2, 2)$ and $\mathbf{v} = (1, 1, 4)$. Compute $\|\mathbf{u} + \mathbf{v}\|$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $\mathbf{u}+\mathbf{v}=(2, 3, 6)$. Its norm is $\sqrt{4+9+36}=\sqrt{49}=7$.'
          - problem: 'Dan computes $\|\mathbf{u}+\mathbf{v}\|$ for $\mathbf{u}=(5, 2)$ and $\mathbf{v}=(3, 4)$ as $\|\mathbf{u}\|+\|\mathbf{v}\|=\sqrt{29}+5$. What is the correct value?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dan added the norms, but the norm of a sum needs the sum vector. Here $\mathbf{u}+\mathbf{v}=(8, 6)$, so the norm is $\sqrt{64+36}=10$.'
        constraints: 'combinations designed to land on Pythagorean-friendly vectors; scalars in -3..3; velocity and displacement word problems; one error-analysis item'
      - id: kp2
        name: Geometric reasoning with vectors
        key_prerequisites: [vector-arithmetic, vector-distance]
        exemplars:
          - problem: 'Find the midpoint of the segment from $P(2, 3)$ to $Q(6, 7)$.'
            answer: '(4, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The midpoint is the average $\frac{1}{2}(P+Q)$. Here $P+Q=(8, 10)$, so the midpoint is $(4, 5)$.'
          - problem: 'A ship at $S(3, -2)$ sails for $3$ hours with velocity $(2, 4)$ km/h, with the map in kilometres. Where is it at the end?'
            answer: '(9, 10)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The displacement is $3\cdot(2, 4)=(6, 12)$. The final position is $(3, -2)+(6, 12)=(9, 10)$.'
          - problem: 'Do the points $A(1, 1)$, $B(3, 4)$ and $C(5, 7)$ lie on one straight line?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are", "yes they are", "they are collinear", "collinear", "on one line", "they lie on one line", "yes, they lie on one line"], ["no", "no, they are not", "no they are not", "no, they do not", "they are not collinear", "not collinear", "not on one line", "they do not lie on one line"]]}
            solution_sketch: 'The vector $B-A=(2, 3)$ and the vector $C-B=(2, 3)$ are equal. They are parallel and share the point $B$, so the three points lie on one line.'
          - problem: 'The midpoint of $P(-2, 5)$ and $Q(8, -1)$ is $M$. Find the coordinates of $M$.'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Add the points: $P+Q=(6, 4)$. Half of that is $M=(3, 2)$.'
          - problem: 'A fence runs from the entrance $A(0, 3)$ to the corner $B(9, 9)$ of a field, and a post stands one third of the way from the entrance to the corner. Where is the post?'
            answer: '(3, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vector from $A$ to $B$ is $(9, 6)$. One third of it is $(3, 2)$, so the post is at $(0, 3)+(3, 2)=(3, 5)$.'
          - problem: 'The point $Q$ is the reflection of $P(1, 2)$ in the point $M(4, 5)$. Find $Q$.'
            answer: '(7, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point $M$ is the midpoint of $P$ and $Q$, so $P+Q=2M$. Then $Q=2M-P=(8, 10)-(1, 2)=(7, 8)$.'
          - problem: 'The points $A(1, 2)$, $B(3, 5)$ and $C(7, k)$ lie on one line. Find $k$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vector $B-A=(2, 3)$, and $C-B=(4, k-5)$ must be a multiple of it. Since $(4, 6)=2(2, 3)$, we get $k-5=6$ and $k=11$.'
          - problem: 'Do the points $D(0, 0)$, $E(2, 1)$ and $F(5, 3)$ lie on one straight line?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are", "yes they are", "they are collinear", "collinear", "on one line", "they lie on one line", "yes, they lie on one line"], ["no", "no, they are not", "no they are not", "no, they do not", "they are not collinear", "not collinear", "not on one line", "they do not lie on one line"]]}
            solution_sketch: 'The vector $E-D=(2, 1)$ and the vector $F-E=(3, 2)$ are not multiples of each other, because $3/2\ne 2/1$. So the three points do not lie on one line.'
          - problem: 'The points $A(3, -1)$, $B(5, 2)$ and $C(7, 5)$ lie on one line and are equally spaced. Find the vector that takes each point to the next.'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vector from $A$ to $B$ is $B-A=(5-3,\ 2-(-1))=(2, 3)$. The vector from $B$ to $C$ is $C-B=(2, 3)$ as well, so $(2, 3)$ is the common step.'
        constraints: 'integer coordinates; midpoints, translations, reflections in a point and points a fraction of the way along a segment; collinearity via equal or proportional difference vectors; at most two verdict items'
      - id: kp3
        name: Norm identities and comparisons
        key_prerequisites: [vector-norms-unit-vectors]
        exemplars:
          - problem: 'A vector $\mathbf{v}$ has norm $5$. What is $\|\mathbf{v}/5\|$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing by $5$ scales the norm by $1/5$. So $\|\mathbf{v}/5\|=5\cdot\frac{1}{5}=1$.'
          - problem: 'Find all $k$ with $\|(k, 0)\|=3$.'
            answer: '-3, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The norm is $\sqrt{k^2+0}=|k|$, so $|k|=3$. Both $k=3$ and $k=-3$ work.'
          - problem: 'Let $\mathbf{u} = (3, 0)$ and $\mathbf{v} = (0, 4)$. By how much does $\|\mathbf{u}\|+\|\mathbf{v}\|$ exceed $\|\mathbf{u}+\mathbf{v}\|$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The norms are $\|\mathbf{u}\|=3$ and $\|\mathbf{v}\|=4$, and $\mathbf{u}+\mathbf{v}=(3, 4)$ has norm $5$. The difference is $3+4-5=2$.'
          - problem: 'Let $\mathbf{v} = (1, 2)$. Compute $\|3\mathbf{v}\|$.'
            answer: '3*sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The norm of $\mathbf{v}$ is $\sqrt{1+4}=\sqrt{5}$. Scaling by $3$ multiplies the norm by $|3|$, so $\|3\mathbf{v}\|=3\sqrt{5}$.'
          - problem: 'A cart moves with velocity $\mathbf{v}=(5, 12)$ m/s. What is its speed when its velocity is tripled?'
            answer: '39'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The speed is the norm of the velocity. Now $\|\mathbf{v}\|=13$ m/s and tripling multiplies it by $3$, so the new speed is $39$ m/s.'
          - problem: 'A robot has velocity $\mathbf{v}=(3, 4)$ m/s. By what positive factor must the velocity be multiplied so that the speed is $6$ m/s?'
            answer: '6/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The present speed is $\|\mathbf{v}\|=5$ m/s. A factor $c>0$ gives speed $5c$, so $5c=6$ and $c=6/5$.'
          - problem: 'Let $\mathbf{u} = (8, 15)$ and $\mathbf{v} = (-16, -30)$. By how much does $\|\mathbf{u}\|+\|\mathbf{v}\|$ exceed $\|\mathbf{u}+\mathbf{v}\|$?'
            answer: '34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The norms are $\|\mathbf{u}\|=17$ and $\|\mathbf{v}\|=34$, and $\mathbf{u}+\mathbf{v}=(-8, -15)$ has norm $17$. The difference is $17+34-17=34$.'
          - problem: 'Lena says that for $\mathbf{u}=(5, 0)$ and $\mathbf{v}=(0, 12)$ the norm $\|\mathbf{u}+\mathbf{v}\|$ equals $\|\mathbf{u}\|+\|\mathbf{v}\|=17$. What is the correct value of $\|\mathbf{u}+\mathbf{v}\|$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Lena added the norms, but the vectors are at a right angle. The sum is $(5, 12)$, so its norm is $\sqrt{25+144}=13$.'
        constraints: 'clean integer norms; answers exact; scaling and triangle-inequality items, with speed and velocity word problems; one error-analysis item'
    diagnostic_exemplar:
      problem: 'Let $\mathbf{u} = (1, 1)$ and $\mathbf{v} = (5, 7)$. Using $\|c\mathbf{w}\| = |c|\,\|\mathbf{w}\|$, compute $\|\frac{1}{2}(\mathbf{u} + \mathbf{v})\|$, the distance from the origin to the midpoint of $\mathbf{u}$ and $\mathbf{v}$.'
      answer: '5'
      solution_sketch: '$\mathbf{u} + \mathbf{v} = (6, 8)$ has norm $10$, so half of it has norm $5$ (the midpoint is $(3, 4)$).'
    anki_seeds:
      - front: 'Triangle inequality for vectors?'
        back: '$\|\mathbf{u} + \mathbf{v}\| \leq \|\mathbf{u}\| + \|\mathbf{v}\|$.'
        type: basic
      - front: 'Midpoint of points $P$ and $Q$ via vectors?'
        back: '$\frac{1}{2}(P + Q)$.'
        type: basic

  - id: computing-dot-products
    name: Computing Dot Products
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-arithmetic
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Dot product of a vector with itself
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (3, 4)$. Compute $\mathbf{u} \cdot \mathbf{u}$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components and add: $3\cdot 3+4\cdot 4=9+16=25$. This equals $\|\mathbf{u}\|^2=5^2$.'
          - problem: 'A vector $\mathbf{u}$ satisfies $\mathbf{u} \cdot \mathbf{u} = 49$. What is $\|\mathbf{u}\|$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\mathbf{u}\cdot\mathbf{u}=\|\mathbf{u}\|^2$, we have $\|\mathbf{u}\|^2=49$. A norm is not negative, so $\|\mathbf{u}\|=7$.'
          - problem: 'Compute $(1, 2, 2) \cdot (1, 2, 2)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components and add: $1+4+4=9$. This is the square of the norm $3$.'
          - problem: 'Let $\mathbf{u} = (6, 8)$. Compute $\mathbf{u} \cdot \mathbf{u}$.'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product of a vector with itself is the sum of the squares of its components. So $\mathbf{u}\cdot\mathbf{u}=36+64=100$.'
          - problem: 'The displacement vector $\mathbf{d}$ of a cable, in metres, satisfies $\mathbf{d}\cdot\mathbf{d}=144$. How long is the cable?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The length of the cable is $\|\mathbf{d}\|$, and $\|\mathbf{d}\|^2=\mathbf{d}\cdot\mathbf{d}=144$. So the length is $\sqrt{144}=12$ m.'
          - problem: 'A drone hovers at the position $\mathbf{p} = (-4, 3, 12)$ m relative to its base station. How far is the drone from the station?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The squared distance is $\mathbf{p}\cdot\mathbf{p}=16+9+144=169$. The distance is $\sqrt{169}=13$ m.'
          - problem: 'Let $\mathbf{v} = (2, 6, 9)$. Compute $\mathbf{v} \cdot \mathbf{v}$.'
            answer: '121'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In space the self-product adds the squares of the three components. So $\mathbf{v}\cdot\mathbf{v}=4+36+81=121$.'
          - problem: 'A vector $\mathbf{w}$ has $\|\mathbf{w}\| = 13$. Find $\mathbf{w} \cdot \mathbf{w}$.'
            answer: '169'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the identity $\mathbf{w}\cdot\mathbf{w}=\|\mathbf{w}\|^2$. So $\mathbf{w}\cdot\mathbf{w}=13^2=169$.'
        constraints: 'perfect-square self-products; the link u.u = norm squared used both ways; distance and length word problems'
      - id: kp2
        name: Dot products in the plane
        key_prerequisites: [vector-arithmetic]
        try_first:
          problem: 'A cafe sells muffins for $3$ dollars each and coffees for $4$ dollars each. Tom buys $5$ muffins and $2$ coffees. How many dollars does he pay?'
          answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollars", "allow_omitted": true}
          answer: '23'
          reveal: 'Tom pays $5\cdot 3+2\cdot 4=15+8=23$ dollars. Multiplying matching entries of the quantities $(5, 2)$ and the prices $(3, 4)$ and adding the results is exactly the dot product.'
        exemplars:
          - problem: 'Compute $(2, 3) \cdot (4, -1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components and add: $2\cdot 4+3\cdot(-1)=8-3=5$. The result is a number, not a vector.'
          - problem: 'A shop sells pens for $2$ dollars each and notebooks for $5$ dollars each. Maya buys $3$ pens and $4$ notebooks. How much does she pay in total?'
            answer: '26'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollars", "allow_omitted": true}
            solution_sketch: 'The quantities are $(3, 4)$ and the prices are $(2, 5)$. The total is the dot product $3\cdot 2+4\cdot 5=6+20=26$ dollars.'
          - problem: 'Compute $(3, 4) \cdot (-2, 5)$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components and add: $3\cdot(-2)+4\cdot 5=-6+20=14$.'
          - problem: 'Find the dot product of $(5, -2)$ and $(-3, 4)$.'
            answer: '-23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components: $5\cdot(-3)=-15$ and $(-2)\cdot 4=-8$. Add them: $-15+(-8)=-23$.'
          - problem: 'Find the dot product of $(-7, 2)$ and $(3, 8)$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components: $(-7)\cdot 3=-21$ and $2\cdot 8=16$. Add them: $-21+16=-5$.'
          - problem: 'The dot product of $(2, k)$ and $(5, 3)$ is $19$. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $2\cdot 5+k\cdot 3=10+3k$. Set $10+3k=19$, so $3k=9$ and $k=3$.'
          - problem: 'A force of $(6, -2)$ N moves an object through the displacement $(3, 5)$ m. The work done is the dot product of the force and the displacement. How many joules of work does the force do?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $6\cdot 3+(-2)\cdot 5=18-10=8$. So the force does $8$ joules of work.'
          - problem: 'A bakery sells rolls for $2$ dollars each and loaves for $5$ dollars each. Jo buys $4$ loaves and some rolls, and pays $28$ dollars in total. How many rolls does she buy?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $r$ rolls the total is the dot product $(r, 4)\cdot(2, 5)=2r+20$. Setting $2r+20=28$ gives $2r=8$, so $r=4$.'
        constraints: 'integer components in -9..9; price-and-quantity and work word problems; solve-for-a-component items'
      - id: kp3
        name: Dot products in space
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $(1, -2, 3) \cdot (2, 0, 1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply matching components and add: $1\cdot 2+(-2)\cdot 0+3\cdot 1=2+0+3=5$.'
          - problem: 'Compute $(2, 1, -1) \cdot (3, -2, 4)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $2\cdot 3=6$, $1\cdot(-2)=-2$ and $(-1)\cdot 4=-4$. Their sum is $6-2-4=0$.'
          - problem: 'Compute $(2, 1, 3) \cdot (1, -4, 2)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $2$, $-4$ and $6$. Their sum is $2-4+6=4$.'
          - problem: 'Compute $(3, -4, 2) \cdot (1, 5, -3)$.'
            answer: '-23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three products are $3$, $-20$ and $-6$. Their sum is $3-20-6=-23$.'
          - problem: 'Compute $(-2, 6, 1) \cdot (4, -1, 3)$.'
            answer: '-11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $-8$, $-6$ and $3$. Their sum is $-8-6+3=-11$.'
          - problem: 'The dot product of $(2, k, -3)$ and $(4, 1, 2)$ is $9$. Find $k$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $2\cdot 4+k\cdot 1+(-3)\cdot 2=8+k-6=k+2$. Setting $k+2=9$ gives $k=7$.'
          - problem: 'A school buys $10$ pencils at $2$ dollars each, $4$ rulers at $3$ dollars each and $5$ pens at $4$ dollars each. How much does it pay in total?'
            answer: '52'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollars", "allow_omitted": true}
            solution_sketch: 'The quantities are $(10, 4, 5)$ and the prices are $(2, 3, 4)$. The total is $10\cdot 2+4\cdot 3+5\cdot 4=20+12+20=52$ dollars.'
          - problem: 'A fruit stall sells apples for $2$ dollars, pears for $3$ dollars and plums for $p$ dollars each. A bag of $5$ apples, $4$ pears and $6$ plums costs $40$ dollars. Find $p$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cost is the dot product $(5, 4, 6)\cdot(2, 3, p)=10+12+6p=22+6p$. Setting $22+6p=40$ gives $6p=18$, so $p=3$.'
        constraints: 'integer components in -9..9; dimension 3; solve-for-a-component and price-and-quantity word problems'
    diagnostic_exemplar:
      problem: 'Compute $\mathbf{u} \cdot \mathbf{u}$ for $\mathbf{u} = (2, -3, 6)$.'
      answer: '49'
      solution_sketch: '$4 + 9 + 36 = 49$, which is $\|\mathbf{u}\|^2$ with $\|\mathbf{u}\| = 7$.'
    anki_seeds:
      - front: 'Formula for $\mathbf{u} \cdot \mathbf{v}$ in components?'
        back: '$u_1 v_1 + u_2 v_2 + \cdots + u_n v_n$.'
        type: basic
      - front: '$\mathbf{u} \cdot \mathbf{u} = $ ?'
        back: '$\|\mathbf{u}\|^2$.'
        type: basic

  - id: dot-product
    name: Dot Product, Angles, and Orthogonality
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: computing-dot-products
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.6
        key: true
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Orthogonality
        key_prerequisites: [computing-dot-products]
        try_first:
          problem: 'Two arrows start at the origin, one along $(2, 1)$ and one along $(-1, 2)$, and they meet at a right angle. What is $(2, 1)\cdot(-1, 2)$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'The dot product is $2\cdot(-1)+1\cdot 2=0$. Vectors at a right angle always have dot product $0$, and that gives a test for orthogonality.'
        exemplars:
          - problem: 'Are the vectors $(4, -2)$ and $(1, 2)$ orthogonal?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are", "yes they are", "yes, they are orthogonal", "they are orthogonal", "orthogonal", "they are perpendicular", "perpendicular"], ["no", "no, they are not", "no they are not", "no, they are not orthogonal", "they are not orthogonal", "not orthogonal", "not perpendicular", "they are not perpendicular"]]}
            solution_sketch: 'The dot product is $4\cdot 1+(-2)\cdot 2=4-4=0$. A dot product of $0$ means the vectors are orthogonal.'
          - problem: 'Are the vectors $(1, 2, 3)$ and $(2, 1, -1)$ perpendicular?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are", "yes they are", "yes, they are orthogonal", "they are orthogonal", "orthogonal", "they are perpendicular", "perpendicular"], ["no", "no, they are not", "no they are not", "no, they are not orthogonal", "they are not orthogonal", "not orthogonal", "not perpendicular", "they are not perpendicular"]]}
            solution_sketch: 'The dot product is $1\cdot 2+2\cdot 1+3\cdot(-1)=2+2-3=1$. Since $1\ne 0$, the vectors are not perpendicular.'
          - problem: 'Find $k$ so that $(2, k)$ is orthogonal to $(3, -6)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $2\cdot 3+k\cdot(-6)=6-6k$. Setting it equal to $0$ gives $k=1$.'
          - problem: 'Find $k$ so that $(k, 2, 1)$ is orthogonal to $(2, -1, 4)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $2k-2+4=2k+2$. Setting $2k+2=0$ gives $k=-1$.'
          - problem: 'Find $k$ so that $(6, k)$ is orthogonal to $(2, -3)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $12-3k$. Setting $12-3k=0$ gives $k=4$.'
          - problem: 'Find $k$ so that $(2, k, 5)$ is orthogonal to $(k, -1, 3)$.'
            answer: '-15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $2k-k+15=k+15$. Setting $k+15=0$ gives $k=-15$.'
          - problem: 'The triangle $ABC$ has $A(0, 0)$, $B(4, 1)$ and $C(x, 4)$, and the angle at $A$ is a right angle. Find $x$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $A$ the sides are $\vec{AB}=(4, 1)$ and $\vec{AC}=(x, 4)$, and they must be orthogonal. So $4x+4=0$ and $x=-1$.'
          - problem: 'A force $\mathbf{F}=(6, k)$ N moves an object along the displacement $\mathbf{d}=(3, -2)$ m. The work done is $\mathbf{F}\cdot\mathbf{d}$, and the force does no work. Find $k$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $6\cdot 3+k\cdot(-2)=18-2k$. If it equals $0$, then $2k=18$ and $k=9$.'
          - problem: 'Ben says that $(k, 4)$ is orthogonal to $(6, -3)$ when $6k=4\cdot(-3)$, so $k=-2$. What is the correct value of $k$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ben set two products equal, but orthogonality needs the sum of the products to be $0$. The dot product is $6k-12$, and $6k-12=0$ gives $k=2$.'
        constraints: 'integer components; solve-for-k problems must have integer k; verdict items name yes or no; triangle, work and error-analysis items'
      - id: kp2
        name: Acute, right, or obtuse from the sign
        key_prerequisites: [computing-dot-products, right-triangle-trig]
        exemplars:
          - problem: 'Is the angle between $(2, 1)$ and $(1, -3)$ acute, right or obtuse?'
            answer: 'obtuse'
            answer_contract: {"kind": "label", "options": [["acute", "acute angle", "an acute angle", "it is acute", "it's acute", "the angle is acute", "the roads make an acute angle"], ["right", "right angle", "a right angle", "it is right", "it's right", "the angle is right", "the roads make a right angle"], ["obtuse", "obtuse angle", "an obtuse angle", "it is obtuse", "it's obtuse", "the angle is obtuse", "the roads make an obtuse angle"]]}
            solution_sketch: 'The dot product is $2\cdot 1+1\cdot(-3)=2-3=-1$. It is negative, so the angle is obtuse.'
          - problem: 'Two roads leave a junction in the directions $(4, 3)$ and $(-2, 5)$. Do the roads make an acute, a right or an obtuse angle?'
            answer: 'acute'
            answer_contract: {"kind": "label", "options": [["acute", "acute angle", "an acute angle", "it is acute", "it's acute", "the angle is acute", "the roads make an acute angle"], ["right", "right angle", "a right angle", "it is right", "it's right", "the angle is right", "the roads make a right angle"], ["obtuse", "obtuse angle", "an obtuse angle", "it is obtuse", "it's obtuse", "the angle is obtuse", "the roads make an obtuse angle"]]}
            solution_sketch: 'The dot product of the directions is $4\cdot(-2)+3\cdot 5=-8+15=7$. It is positive, so the angle is acute.'
          - problem: 'Find the positive value of $k$ for which the angle between $(1, 0)$ and $(1, k)$ is $60^\circ$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $1$ and the norms are $1$ and $\sqrt{1+k^2}$, so $\cos 60^\circ=\frac{1}{\sqrt{1+k^2}}=\frac12$. Then $1+k^2=4$ and $k=\sqrt{3}$.'
          - problem: 'Find the value of $k$ for which the angle between $(1, 1)$ and $(1, k)$ is a right angle.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A right angle means the dot product is $0$. The dot product is $1+k$, so $k=-1$.'
          - problem: 'Find the positive value of $k$ for which the angle between $(1, 0)$ and $(k, 1)$ is $45^\circ$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $k$ and the norms are $1$ and $\sqrt{k^2+1}$, so $\frac{k}{\sqrt{k^2+1}}=\frac{1}{\sqrt2}$. Squaring gives $2k^2=k^2+1$, so $k=1$.'
          - problem: 'A hiker walks along the direction $(2, k)$ and a river flows along $(1, -3)$. For which values of $k$ is the angle between the hiker''s path and the river''s flow obtuse?'
            answer: 'k > 2/3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The angle is obtuse when the dot product is negative. The dot product is $2\cdot 1+k\cdot(-3)=2-3k$, and $2-3k<0$ gives $k>\frac{2}{3}$.'
          - problem: 'Find the value of $k$ for which the angle between $(k, 6)$ and $(3, -1)$ is a right angle.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $3k-6$. A right angle needs $3k-6=0$, so $k=2$.'
        constraints: 'sign questions use small integers; exact-angle questions target 45 and 60 degrees; one inequality item; road and hiker word problems'
      - id: kp3
        name: Angle between vectors
        key_prerequisites: [computing-dot-products, right-triangle-trig]
        exemplars:
          - problem: 'Find the angle between $(2, 2)$ and $(-3, 0)$.'
            answer: '135'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $2\cdot(-3)+2\cdot 0=-6$, and the norms are $2\sqrt2$ and $3$. So $\cos\theta=\frac{-6}{6\sqrt2}=-\frac{1}{\sqrt2}$, and $\theta=135^\circ$.'
          - problem: 'Find the angle between $(1, 0)$ and $(0, 1)$.'
            answer: '90'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $1\cdot 0+0\cdot 1=0$ and both norms are $1$, so $\cos\theta=0$. The angle between $0^\circ$ and $180^\circ$ with cosine $0$ is $90^\circ$.'
          - problem: 'Find $\cos\theta$ for the angle $\theta$ between $(1, 2)$ and $(2, 1)$.'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $1\cdot 2+2\cdot 1=4$ and each norm is $\sqrt5$. So $\cos\theta=\frac{4}{\sqrt5\cdot\sqrt5}=\frac45$.'
          - problem: 'Find the angle between $(1, 1, 0)$ and $(1, 0, 1)$.'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $1$ and both norms are $\sqrt2$, so $\cos\theta=\frac{1}{2}$. The angle with cosine $\frac12$ is $60^\circ$.'
          - problem: 'Two straight rods meet at a joint. Their directions are $(3, 0)$ and $(2, 2)$. What angle do the rods make at the joint?'
            answer: '45'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $3\cdot 2+0\cdot 2=6$, and the norms are $3$ and $2\sqrt2$. So $\cos\theta=\frac{6}{6\sqrt2}=\frac{1}{\sqrt2}$, and $\theta=45^\circ$.'
          - problem: 'Find the angle between $(1, 1, 0)$ and $(-1, 0, 1)$.'
            answer: '120'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $-1$ and both norms are $\sqrt2$, so $\cos\theta=-\frac12$. The angle with cosine $-\frac12$ is $120^\circ$.'
          - problem: 'A ship heads in the direction $(3, 4)$ and the wind blows toward $(4, 3)$. Find the cosine of the angle between the heading and the wind direction.'
            answer: '24/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $3\cdot 4+4\cdot 3=24$, and both norms are $5$. So the cosine is $\frac{24}{5\cdot 5}=\frac{24}{25}$.'
          - problem: 'Find the angle between $(1, 2)$ and $(-3, -6)$.'
            answer: '180'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'The dot product is $-15$, and the norms are $\sqrt5$ and $3\sqrt5$. So $\cos\theta=\frac{-15}{15}=-1$, and $\theta=180^\circ$.'
        constraints: 'rig the numbers so cos(theta) is one of 0, +-1/2, +-1/sqrt(2), +-sqrt(3)/2, +-1, or a clean rational; angles in degrees; rod and ship word problems'
    diagnostic_exemplar:
      problem: 'Find the angle between $\mathbf{u} = (3, 3)$ and $\mathbf{v} = (0, -5)$.'
      answer: '135 degrees'
      answer_contract: {kind: none}
      solution_sketch: '$\mathbf{u} \cdot \mathbf{v} = -15 < 0$ (obtuse); $\cos\theta = -15/(3\sqrt2 \cdot 5) = -1/\sqrt2$, so $\theta = 135^\circ$.'
    anki_seeds:
      - front: 'Angle formula linking the dot product and the norms of $\mathbf{u}, \mathbf{v}$?'
        back: '$\cos\theta = \dfrac{\mathbf{u} \cdot \mathbf{v}}{\|\mathbf{u}\|\,\|\mathbf{v}\|}$.'
        type: basic
      - front: 'Two nonzero vectors are orthogonal exactly when their dot product is...'
        back: 'zero'
        type: basic

  - id: dot-product-properties
    name: Algebraic Properties of the Dot Product
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: dot-product
        weight: 0.7
        key: true
      - id: computing-dot-products
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Symmetry, distributivity, and scalars
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: 'Suppose $\mathbf{u}\cdot\mathbf{v}=2$ and $\mathbf{u}\cdot\mathbf{w}=-5$. Compute $\mathbf{u}\cdot(\mathbf{v}+\mathbf{w})$.'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The dot product distributes over addition, so $\mathbf{u}\cdot(\mathbf{v}+\mathbf{w})=\mathbf{u}\cdot\mathbf{v}+\mathbf{u}\cdot\mathbf{w}$. Substitute the known values: $2+(-5)=-3$.'
          - problem: 'Given $\mathbf{u}\cdot\mathbf{v}=4$, compute $(2\mathbf{u})\cdot\mathbf{v}$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A scalar factor comes out of a dot product, so $(2\mathbf{u})\cdot\mathbf{v}=2(\mathbf{u}\cdot\mathbf{v})$. With $\mathbf{u}\cdot\mathbf{v}=4$ this is $2\cdot 4=8$.'
          - problem: 'Suppose $\mathbf{u}\cdot\mathbf{v}=5$. Compute $\mathbf{v}\cdot(3\mathbf{u})$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By symmetry $\mathbf{v}\cdot(3\mathbf{u})=(3\mathbf{u})\cdot\mathbf{v}$, and the scalar $3$ comes out: $3(\mathbf{u}\cdot\mathbf{v})$. Substitute $5$ to get $3\cdot 5=15$.'
          - problem: 'Let $\mathbf{u}\cdot(\mathbf{v}+\mathbf{w})=9$ and $\mathbf{u}\cdot\mathbf{v}=4$. Find $\mathbf{u}\cdot\mathbf{w}$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By distributivity $\mathbf{u}\cdot(\mathbf{v}+\mathbf{w})=\mathbf{u}\cdot\mathbf{v}+\mathbf{u}\cdot\mathbf{w}$, so $9=4+\mathbf{u}\cdot\mathbf{w}$. Subtract $4$ from both sides: $\mathbf{u}\cdot\mathbf{w}=5$.'
          - problem: 'Suppose $\mathbf{u}\cdot\mathbf{v}=-2$. Compute $(3\mathbf{u})\cdot(-2\mathbf{v})$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both scalars come out of the dot product: $(3\mathbf{u})\cdot(-2\mathbf{v})=3(-2)(\mathbf{u}\cdot\mathbf{v})=-6(\mathbf{u}\cdot\mathbf{v})$. Substitute $-2$ to get $-6\cdot(-2)=12$.'
          - problem: 'Given that $(4\mathbf{u})\cdot\mathbf{v}=28$, find $\mathbf{u}\cdot\mathbf{v}$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The scalar comes out of the dot product, so $(4\mathbf{u})\cdot\mathbf{v}=4(\mathbf{u}\cdot\mathbf{v})=28$. Divide both sides by $4$ to get $\mathbf{u}\cdot\mathbf{v}=7$.'
          - problem: 'A force $\mathbf{F}_1$ does $18$ J of work along a displacement $\mathbf{d}$, and a force $\mathbf{F}_2$ does $-5$ J of work along the same displacement. How many joules of work does the combined force $\mathbf{F}_1+\mathbf{F}_2$ do along $\mathbf{d}$?'
            answer: "13"
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'Work is a dot product, and the dot product distributes: $(\mathbf{F}_1+\mathbf{F}_2)\cdot\mathbf{d}=\mathbf{F}_1\cdot\mathbf{d}+\mathbf{F}_2\cdot\mathbf{d}$. So the combined force does $18+(-5)=13$ J of work.'
          - problem: 'Along a displacement $\mathbf{d}$, a force $4\mathbf{F}$ does $36$ J of work. How many joules of work does the force $\mathbf{F}$ do along $\mathbf{d}$?'
            answer: "9"
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'The scalar $4$ comes out of the dot product, so $(4\mathbf{F})\cdot\mathbf{d}=4(\mathbf{F}\cdot\mathbf{d})=36$. Divide by $4$: the force $\mathbf{F}$ does $9$ J of work.'
          - problem: 'A force $\mathbf{F}$ does $14$ J of work along a displacement $\mathbf{d}$. How many joules of work does the force $3\mathbf{F}$ do along the displacement $2\mathbf{d}$?'
            answer: "84"
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'Both scalars come out of the dot product: $(3\mathbf{F})\cdot(2\mathbf{d})=3\cdot 2\,(\mathbf{F}\cdot\mathbf{d})$. Substitute $14$ to get $6\cdot 14=84$ J.'
          - problem: 'Sam is told that $\mathbf{u}\cdot\mathbf{v}=4$ and writes $(2\mathbf{u})\cdot(3\mathbf{v})=5(\mathbf{u}\cdot\mathbf{v})=20$. What is the correct value of $(2\mathbf{u})\cdot(3\mathbf{v})$?'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scalars multiply when they come out of a dot product, they do not add. So $(2\mathbf{u})\cdot(3\mathbf{v})=2\cdot 3\,(\mathbf{u}\cdot\mathbf{v})=6\cdot 4=24$.'
        constraints: "symbolic data with small integer dot products"
      - id: kp2
        name: Expanding norms of sums
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Given $\|\mathbf{u}\|=3$, $\|\mathbf{v}\|=5$ and $\mathbf{u}\cdot\mathbf{v}=1$, find $\|\mathbf{u}+\mathbf{v}\|$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand the squared norm: $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2=9+2+25=36$. The norm is the square root of that value, so $\|\mathbf{u}+\mathbf{v}\|=\sqrt{36}=6$.'
          - problem: 'Given $\|\mathbf{u}\|=2$, $\|\mathbf{v}\|=1$ and $\mathbf{u}\cdot\mathbf{v}=1$, compute $\|\mathbf{u}+\mathbf{v}\|^2$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2$. Substitute the data: $4+2\cdot 1+1=7$.'
          - problem: 'Given $\|\mathbf{u}\|=\|\mathbf{v}\|=2$, compute $(\mathbf{u}+\mathbf{v})\cdot(\mathbf{u}-\mathbf{v})$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand: $(\mathbf{u}+\mathbf{v})\cdot(\mathbf{u}-\mathbf{v})=\mathbf{u}\cdot\mathbf{u}-\mathbf{u}\cdot\mathbf{v}+\mathbf{v}\cdot\mathbf{u}-\mathbf{v}\cdot\mathbf{v}$. The two middle terms cancel by symmetry, leaving $\|\mathbf{u}\|^2-\|\mathbf{v}\|^2=4-4=0$.'
          - problem: 'Given $\|\mathbf{u}\|=2$, $\|\mathbf{v}\|=5$ and $\mathbf{u}\cdot\mathbf{v}=-3$, compute $\|\mathbf{u}+\mathbf{v}\|^2$.'
            answer: "23"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2$. Substitute the data: $4+2(-3)+25=4-6+25=23$.'
          - problem: 'Given $\|\mathbf{u}\|=6$, $\|\mathbf{v}\|=3$ and $\mathbf{u}\cdot\mathbf{v}=4$, compute $\|\mathbf{u}-\mathbf{v}\|^2$.'
            answer: "37"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For a difference the middle term changes sign: $\|\mathbf{u}-\mathbf{v}\|^2=\|\mathbf{u}\|^2-2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2$. Substitute the data: $36-2(4)+9=36-8+9=37$.'
          - problem: 'Given $\|\mathbf{u}\|^2=16$, $\|\mathbf{v}\|^2=25$ and $\|\mathbf{u}+\mathbf{v}\|^2=49$, find $\mathbf{u}\cdot\mathbf{v}$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2$ to get $49=16+2\,\mathbf{u}\cdot\mathbf{v}+25$. Then $2\,\mathbf{u}\cdot\mathbf{v}=49-41=8$, so $\mathbf{u}\cdot\mathbf{v}=4$.'
          - problem: 'A hiker walks along a displacement $\mathbf{u}$ of length $3$ km and then along a displacement $\mathbf{v}$ of length $4$ km. Here $\mathbf{u}\cdot\mathbf{v}=6$ km$^2$. How far from the start is the hiker, to one decimal place?'
            answer: "6.1"
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The final position is $\mathbf{u}+\mathbf{v}$, and $\|\mathbf{u}+\mathbf{v}\|^2=9+2\cdot 6+16=37$. So the hiker is $\sqrt{37}\approx 6.1$ km from the start.'
          - problem: 'Two forces of magnitude $6$ N and $5$ N act at one point, and their resultant has magnitude $9$ N. Find $\mathbf{F}_1\cdot\mathbf{F}_2$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The resultant is $\mathbf{F}_1+\mathbf{F}_2$, so $81=\|\mathbf{F}_1+\mathbf{F}_2\|^2=36+2\,\mathbf{F}_1\cdot\mathbf{F}_2+25$. Then $2\,\mathbf{F}_1\cdot\mathbf{F}_2=81-61=20$ and $\mathbf{F}_1\cdot\mathbf{F}_2=10$.'
          - problem: 'Two perpendicular forces of $9$ N and $12$ N act at one point. How many newtons is the magnitude of their resultant?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Perpendicular forces have dot product $0$, so $\|\mathbf{F}_1+\mathbf{F}_2\|^2=81+0+144=225$. The resultant has magnitude $\sqrt{225}=15$ N.'
          - problem: 'Given $\|\mathbf{u}\|=4$, $\|\mathbf{v}\|=3$ and $\mathbf{u}\cdot\mathbf{v}=-2$, Sam writes $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+\|\mathbf{v}\|^2=25$. What is the correct value of $\|\mathbf{u}+\mathbf{v}\|^2$?'
            answer: "21"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam left out the middle term $2\,\mathbf{u}\cdot\mathbf{v}$. The correct value is $16+2(-2)+9=16-4+9=21$.'
        constraints: "use the identity ||u+v||^2 = ||u||^2 + 2 u.v + ||v||^2 with small integer data"
      - id: kp3
        name: Verifying identities numerically
        key_prerequisites: [computing-dot-products, dot-product]
        exemplars:
          - problem: 'Let $\mathbf{u}=(2, 1)$, $\mathbf{v}=(1, 3)$ and $\mathbf{w}=(4, -2)$. Evaluate both sides of $\mathbf{u}\cdot(\mathbf{v}+\mathbf{w})=\mathbf{u}\cdot\mathbf{v}+\mathbf{u}\cdot\mathbf{w}$. What value do the two sides share?'
            answer: "11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left side: $\mathbf{v}+\mathbf{w}=(5, 1)$, so $\mathbf{u}\cdot(5, 1)=2\cdot 5+1\cdot 1=11$. Right side: $\mathbf{u}\cdot\mathbf{v}=5$ and $\mathbf{u}\cdot\mathbf{w}=6$, and $5+6=11$, so both sides equal $11$.'
          - problem: 'Let $\mathbf{u}=(1, 1)$ and $\mathbf{v}=(3, 0)$. Evaluate both sides of $\|\mathbf{u}+\mathbf{v}\|^2=\|\mathbf{u}\|^2+2\,\mathbf{u}\cdot\mathbf{v}+\|\mathbf{v}\|^2$. What value do the two sides share?'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left side: $\mathbf{u}+\mathbf{v}=(4, 1)$, so $\|\mathbf{u}+\mathbf{v}\|^2=16+1=17$. Right side: $2+2\cdot 3+9=17$, so both sides equal $17$.'
          - problem: 'Let $\mathbf{u}=(3, 1)$ and $\mathbf{v}=(1, 2)$. Evaluate both sides of $(\mathbf{u}+\mathbf{v})\cdot(\mathbf{u}-\mathbf{v})=\|\mathbf{u}\|^2-\|\mathbf{v}\|^2$. What value do the two sides share?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left side: $\mathbf{u}+\mathbf{v}=(4, 3)$ and $\mathbf{u}-\mathbf{v}=(2, -1)$, so the dot product is $8-3=5$. Right side: $\|\mathbf{u}\|^2-\|\mathbf{v}\|^2=10-5=5$, so both sides equal $5$.'
          - problem: 'Let $c=3$, $\mathbf{u}=(1, 2)$ and $\mathbf{v}=(2, -1)$. Evaluate both sides of $(c\mathbf{u})\cdot\mathbf{v}=c\,(\mathbf{u}\cdot\mathbf{v})$. What value do the two sides share?'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left side: $c\mathbf{u}=(3, 6)$, so $(3, 6)\cdot(2, -1)=6-6=0$. Right side: $\mathbf{u}\cdot\mathbf{v}=2-2=0$, so $3\cdot 0=0$ and both sides equal $0$.'
          - problem: 'Let $\mathbf{u}=(2, 1)$, $\mathbf{v}=(1, 3)$ and $\mathbf{w}=(1, -1)$. Evaluate both sides of $(\mathbf{u}+\mathbf{v})\cdot\mathbf{w}=\mathbf{u}\cdot\mathbf{w}+\mathbf{v}\cdot\mathbf{w}$. What value do the two sides share?'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left side: $\mathbf{u}+\mathbf{v}=(3, 4)$, so $(3, 4)\cdot(1, -1)=3-4=-1$. Right side: $\mathbf{u}\cdot\mathbf{w}=1$ and $\mathbf{v}\cdot\mathbf{w}=-2$, and $1+(-2)=-1$, so both sides equal $-1$.'
          - problem: 'Sam claims that $(\mathbf{u}+\mathbf{v})\cdot(\mathbf{u}+\mathbf{v})=\mathbf{u}\cdot\mathbf{u}+\mathbf{v}\cdot\mathbf{v}$. Is the claim true for $\mathbf{u}=(1, 2)$ and $\mathbf{v}=(3, -1)$?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not","it isn't","no, it isn't","false","not correct","incorrect"],["yes","yes, it is","it is","it is true","it is correct","true","correct"]]}
            solution_sketch: 'Left side: $\mathbf{u}+\mathbf{v}=(4, 1)$, so $(4, 1)\cdot(4, 1)=17$. Right side: $\mathbf{u}\cdot\mathbf{u}+\mathbf{v}\cdot\mathbf{v}=5+10=15$. The two values differ, so the claim is false.'
          - problem: 'Is $(2\mathbf{u})\cdot\mathbf{v}=\mathbf{u}\cdot(2\mathbf{v})$ true for $\mathbf{u}=(1, 3)$ and $\mathbf{v}=(4, -2)$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","it is true","it is correct","true","correct"],["no","no, it is not","it is not","it isn't","no, it isn't","false","not correct","incorrect"]]}
            solution_sketch: 'Left side: $2\mathbf{u}=(2, 6)$, so $(2, 6)\cdot(4, -2)=8-12=-4$. Right side: $2\mathbf{v}=(8, -4)$, so $(1, 3)\cdot(8, -4)=8-12=-4$. The two sides are equal, so the statement is true.'
          - problem: 'A cart is pushed by the force $\mathbf{F}=(2, 3)$ N. It moves first by $\mathbf{d}_1=(4, 1)$ m and then by $\mathbf{d}_2=(1, -2)$ m. The work done by a force is $\mathbf{F}\cdot\mathbf{d}$. How many joules of work does the force do over the whole motion?'
            answer: "7"
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'The work for each displacement is $\mathbf{F}\cdot\mathbf{d}_1=8+3=11$ and $\mathbf{F}\cdot\mathbf{d}_2=2-6=-4$. By distributivity the total work is $11+(-4)=7$ J, which equals $\mathbf{F}\cdot(\mathbf{d}_1+\mathbf{d}_2)=\mathbf{F}\cdot(5, -1)=10-3=7$.'
          - problem: 'The forces $\mathbf{F}_1=(2, 1)$ N and $\mathbf{F}_2=(1, 3)$ N together do $20$ J of work along the displacement $\mathbf{d}=(4, k)$ m. Find $k$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The work of the combined force is $(\mathbf{F}_1+\mathbf{F}_2)\cdot\mathbf{d}=(3, 4)\cdot(4, k)=12+4k$. Set $12+4k=20$, so $4k=8$ and $k=2$.'
        constraints: "small integer vectors; both sides must evaluate to the same clean number"
    diagnostic_exemplar:
      problem: 'Given $\|\mathbf{u}\| = 5$, $\|\mathbf{v}\| = 2$, and $\mathbf{u} \cdot \mathbf{v} = 3$, compute $\|\mathbf{u} + \mathbf{v}\|^2$.'
      answer: "35"
      solution_sketch: '$25 + 2 \cdot 3 + 4 = 35$.'
    anki_seeds:
      - front: '$\|\mathbf{u} + \mathbf{v}\|^2$ expanded via dot products?'
        back: '$\|\mathbf{u}\|^2 + 2\,\mathbf{u} \cdot \mathbf{v} + \|\mathbf{v}\|^2$.'
        type: basic
      - front: 'Cauchy-Schwarz inequality?'
        back: '$|\mathbf{u} \cdot \mathbf{v}| \leq \|\mathbf{u}\|\,\|\mathbf{v}\|$.'
        type: basic

  - id: cross-product
    name: Cross Product
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
      - id: dot-product
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Computing cross products
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Compute $(1, 2, 3)\times(4, 5, 6)$.'
            answer: "(-3, 6, -3)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Apply the component formula: $(2\cdot 6-3\cdot 5,\; 3\cdot 4-1\cdot 6,\; 1\cdot 5-2\cdot 4)$. The components are $12-15=-3$, $12-6=6$ and $5-8=-3$, so the product is (-3, 6, -3).'
          - problem: 'Compute $(1, 0, 0)\times(0, 1, 0)$.'
            answer: "(0, 0, 1)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'These are the standard basis vectors $\mathbf{i}$ and $\mathbf{j}$, and $\mathbf{i}\times\mathbf{j}=\mathbf{k}$. The formula agrees: the components are $0$, $0$ and $1\cdot 1-0\cdot 0=1$, giving (0, 0, 1).'
          - problem: 'Compute $(2, 1, -1)\times(0, 3, 2)$.'
            answer: "(5, -4, 6)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The components are $1\cdot 2-(-1)\cdot 3=5$, $(-1)\cdot 0-2\cdot 2=-4$ and $2\cdot 3-1\cdot 0=6$. So the cross product is (5, -4, 6).'
          - problem: 'Compute $(2, -1, 1)\times(1, 2, -2)$.'
            answer: "(0, 5, 5)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The components are $(-1)(-2)-1\cdot 2=0$, $1\cdot 1-2\cdot(-2)=5$ and $2\cdot 2-(-1)\cdot 1=5$. So the cross product is (0, 5, 5).'
          - problem: 'Find the cross product of $(2, -2, 1)$ and $(1, 1, -1)$.'
            answer: "(1, 3, 4)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The components are $(-2)(-1)-1\cdot 1=1$, $1\cdot 1-2\cdot(-1)=3$ and $2\cdot 1-(-2)\cdot 1=4$. So the cross product is (1, 3, 4).'
          - problem: 'The cross product $(a, 2, -1)\times(3, -2, 1)$ equals $(0, -4, -8)$. Find $a$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second component of the product is $(-1)\cdot 3-a\cdot 1=-3-a$. Setting $-3-a=-4$ gives $a=1$, and then the other components $0$ and $-8$ also match.'
          - problem: 'A wrench is pushed at the position $\mathbf{r}=(2, 0, 0)$ m from the pivot by the force $\mathbf{F}=(0, 3, 4)$ N. Find the torque vector $\mathbf{r}\times\mathbf{F}$.'
            answer: "(0, -8, 6)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The components are $0\cdot 4-0\cdot 3=0$, $0\cdot 0-2\cdot 4=-8$ and $2\cdot 3-0\cdot 0=6$. So the torque is (0, -8, 6) N$\cdot$m.'
          - problem: 'The points $A=(1, 0, 0)$, $B=(0, 2, 0)$ and $C=(0, 0, 3)$ lie in one plane. Find $\overrightarrow{AB}\times\overrightarrow{AC}$, a vector perpendicular to the plane.'
            answer: "(6, 3, 2)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The edge vectors are $\overrightarrow{AB}=(-1, 2, 0)$ and $\overrightarrow{AC}=(-1, 0, 3)$. Their cross product is (6, 3, 2), and it is perpendicular to both edges, so it is perpendicular to the plane.'
          - problem: 'Sam computes $(1, 2, 0)\times(0, 1, 3)$ and gets $(6, 3, 1)$. What is the correct cross product?'
            answer: "(6, -3, 1)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The second component is $a_3b_1-a_1b_3=0\cdot 0-1\cdot 3=-3$, not $3$, so Sam made a sign error. The first and third components are $2\cdot 3-0\cdot 1=6$ and $1\cdot 1-2\cdot 0=1$, so the product is (6, -3, 1).'
        constraints: "integer components in -6..6; only 3-dimensional vectors"
      - id: kp2
        name: Algebraic properties
        key_prerequisites: [vectors-in-rn, dot-product]
        exemplars:
          - problem: 'If $\mathbf{u}\times\mathbf{v}=(5, -4, 6)$, what is $\mathbf{v}\times\mathbf{u}$?'
            answer: "(-5, 4, -6)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The cross product is anticommutative: $\mathbf{v}\times\mathbf{u}=-(\mathbf{u}\times\mathbf{v})$. Negate every component of $(5, -4, 6)$ to get (-5, 4, -6).'
          - problem: 'Compute $(3, -2, 7)\times(3, -2, 7)$.'
            answer: "(0, 0, 0)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'A vector crossed with itself gives the zero vector, because every component has the form $a_2a_3-a_3a_2=0$. So the product is (0, 0, 0).'
          - problem: 'For $\mathbf{u}=(2, -1, 3)$ and $\mathbf{v}=(1, 4, -2)$ the cross product is $\mathbf{u}\times\mathbf{v}=(-10, 7, 9)$. Compute $(\mathbf{u}\times\mathbf{v})\cdot\mathbf{v}$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is perpendicular to both of its factors, so the answer must be $0$. Direct computation agrees: $(-10)(1)+7\cdot 4+9\cdot(-2)=-10+28-18=0$.'
          - problem: 'Sam says that $(1, 0, 2)\times(2, 1, 0)=(1, 1, 1)$. Is this correct?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not","it isn't","no, it isn't","false","not correct","incorrect"],["yes","yes, it is","it is","it is true","it is correct","true","correct"]]}
            solution_sketch: 'A cross product is perpendicular to both factors, but $(1, 1, 1)\cdot(1, 0, 2)=1+0+2=3$, which is not $0$. So the result cannot be correct; the actual product is (-2, 4, 1).'
          - problem: 'Given $\mathbf{u}\times\mathbf{v}=(2, -1, 3)$, compute $(2\mathbf{v})\times\mathbf{u}$.'
            answer: "(-4, 2, -6)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Pull out the scalar and swap the factors: $(2\mathbf{v})\times\mathbf{u}=2(\mathbf{v}\times\mathbf{u})=-2(\mathbf{u}\times\mathbf{v})$. Multiply $(2, -1, 3)$ by $-2$ to get (-4, 2, -6).'
          - problem: 'A force $\mathbf{F}$ applied at the position $\mathbf{r}$ produces the torque $\mathbf{r}\times\mathbf{F}=(0, -8, 6)$ N$\cdot$m. What is the torque $\mathbf{r}\times(-\mathbf{F})$ when the force is reversed?'
            answer: "(0, 8, -6)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'A scalar factor comes out of the cross product, so $\mathbf{r}\times(-\mathbf{F})=-(\mathbf{r}\times\mathbf{F})$. Negate each component of $(0, -8, 6)$ to get (0, 8, -6).'
          - problem: 'For three points $A$, $B$, $C$ the normal vector $\overrightarrow{AB}\times\overrightarrow{AC}$ is $(6, 3, 2)$. Mia lists the points in the order $A$, $C$, $B$ and computes $\overrightarrow{AC}\times\overrightarrow{AB}$. What does she get?'
            answer: "(-6, -3, -2)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Swapping the two factors reverses the cross product: $\overrightarrow{AC}\times\overrightarrow{AB}=-(\overrightarrow{AB}\times\overrightarrow{AC})$. So Mia gets (-6, -3, -2), a normal vector that points the opposite way.'
          - problem: 'Ana computes $(2, 1, -1)\times(0, 3, 2)=(5, -4, 6)$. Is this vector perpendicular to $(0, 3, 2)$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","it is true","it is correct","true","correct"],["no","no, it is not","it is not","it isn't","no, it isn't","false","not correct","incorrect"]]}
            solution_sketch: 'Perpendicular vectors have dot product $0$: $(5, -4, 6)\cdot(0, 3, 2)=0-12+12=0$. So the vector is perpendicular to $(0, 3, 2)$, as every cross product is to its factors.'
        constraints: "test anticommutativity, scalar multiples, u x u = 0, and orthogonality of the result to both factors"
      - id: kp3
        name: Areas via cross products
        key_prerequisites: [vectors-in-rn]
        try_first:
          problem: 'A rectangle has sides $(3, 0, 0)$ and $(0, 4, 0)$. What is its area?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'The area is $3\cdot 4=12$, and the cross product of the sides is $(0, 0, 12)$ with norm $12$. For any two vectors, the norm of the cross product is the area they span.'
        exemplars:
          - problem: 'Find the area of the parallelogram spanned by $(1, 2, 2)$ and $(2, 1, -2)$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is (-6, 6, -3), and its norm is the area of the parallelogram. So the area is $\sqrt{36+36+9}=\sqrt{81}=9$.'
          - problem: 'Find the area of the triangle with edge vectors $(2, 1, 0)$ and $(1, 3, 0)$.'
            answer: "5/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is (0, 0, 5), so the parallelogram has area $5$. The triangle is half of the parallelogram, so its area is $5/2$.'
          - problem: 'A triangle has edge vectors $(2, 2, 1)$ and $(2, -1, -2)$. Find its area.'
            answer: "9/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is (-3, 6, -6), with norm $\sqrt{9+36+36}=9$. The triangle has half the parallelogram area, so its area is $9/2$.'
          - problem: 'A parallelogram has adjacent sides $(1, 0, 0)$ and $(0, 3, 4)$. Find its area.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product of the sides is (0, -4, 3). Its norm is $\sqrt{0+16+9}=5$, and this norm is the area.'
          - problem: 'Find the area of the parallelogram spanned by $(1, 1, 0)$ and $(0, 1, 1)$.'
            answer: "sqrt(3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is (1, -1, 1). Its norm is $\sqrt{1+1+1}=\sqrt{3}$, and this irrational number is the area.'
          - problem: 'A triangular steel plate has its corners at $A=(1, 1, 1)$, $B=(4, 1, 3)$ and $C=(1, 0, -1)$, with coordinates in metres. What is the area of the plate?'
            answer: "7/2"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The edge vectors are $\overrightarrow{AB}=(3, 0, 2)$ and $\overrightarrow{AC}=(0, -1, -2)$, and their cross product is (2, 6, -3). Its norm is $\sqrt{4+36+9}=7$, so the plate has area $\frac{7}{2}=7/2$ m$^2$.'
          - problem: 'A tile is the parallelogram spanned by the edge vectors $(2, -1, 0)$ m and $(-2, 0, -3)$ m. How many tiles are needed to cover $154$ m$^2$ of roof?'
            answer: "22"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product of the edge vectors is (3, 6, -2), so one tile has area $\sqrt{9+36+4}=7$ m$^2$. The number of tiles is the roof area divided by the tile area: $154\div 7=22$.'
          - problem: 'A parallelogram has adjacent sides $(3, 0, 0)$ and $(0, 4, k)$ with $k>0$, and its area is $15$. Find $k$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product of the sides is $(0, -3k, 12)$, so the area is $\sqrt{9k^2+144}$. Set $\sqrt{9k^2+144}=15$, then $9k^2=225-144=81$, so $k^2=9$ and $k=3$.'
          - problem: 'Sam finds the area of the triangle with edge vectors $(4, 0, 0)$ and $(0, 3, 0)$ and gets $12$. What is the correct area?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cross product is (0, 0, 12), with norm $12$, and $12$ is the area of the parallelogram. A triangle has half of that area, so the correct area is $6$.'
        constraints: "choose vectors so the cross product has a clean integer norm (e.g. norm-9 or norm-5 patterns), with at most one exact radical; halve for triangles"
    diagnostic_exemplar:
      problem: 'Find the area of the parallelogram spanned by $(3, 0, 4)$ and $(0, 5, 0)$.'
      answer: '25'
      solution_sketch: 'The cross product is $(0\cdot0 - 4\cdot5,\ 4\cdot0 - 3\cdot0,\ 3\cdot5 - 0\cdot0) = (-20, 0, 15)$, whose norm is $25$.'
    anki_seeds:
      - front: 'Direction of $\mathbf{u} \times \mathbf{v}$ relative to $\mathbf{u}$ and $\mathbf{v}$?'
        back: 'Orthogonal to both, oriented by the right-hand rule.'
        type: basic
      - front: 'Geometric meaning of $\|\mathbf{u} \times \mathbf{v}\|$?'
        back: 'The area of the parallelogram spanned by $\mathbf{u}$ and $\mathbf{v}$.'
        type: basic
      - front: '$\mathbf{v} \times \mathbf{u} = $ {{c1::$-(\mathbf{u} \times \mathbf{v})$}} (anticommutativity).'
        back: '$-(\mathbf{u} \times \mathbf{v})$'
        type: cloze

  - id: vector-projections
    name: Vector Projections
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: dot-product
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.6
    knowledge_points:
      - id: kp1
        name: Scalar projection (component along a vector)
        key_prerequisites: [dot-product]
        try_first:
          problem: 'A rod runs from the origin to the point $(5, 12)$ and is lit from directly above, so its shadow falls on the $x$-axis. How long is the shadow?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The shadow is the horizontal part of the rod, which is $5$. In general, the signed length of the shadow of $\mathbf{u}$ on the line of $\mathbf{v}$ is $\frac{\mathbf{u}\cdot\mathbf{v}}{\|\mathbf{v}\|}$.'
        exemplars:
          - problem: 'Find the scalar projection of $\mathbf{u}=(4, 2)$ onto $\mathbf{v}=(3, 4)$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=12+8=20$ and $\|\mathbf{v}\|=\sqrt{9+16}=5$. The scalar projection is $\frac{20}{5}=4$.'
          - problem: 'Find the scalar projection of $\mathbf{u}=(3, 4)$ onto $\mathbf{v}=(1, 0)$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{u}\cdot\mathbf{v}=3$ and $\|\mathbf{v}\|=1$. So the scalar projection is $\frac{3}{1}=3$, the horizontal part of $\mathbf{u}$.'
          - problem: 'Find the scalar projection of $\mathbf{u}=(6, 8)$ onto $\mathbf{v}=(3, 4)$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=18+32=50$ and $\|\mathbf{v}\|=5$. The scalar projection is $\frac{50}{5}=10$.'
          - problem: 'Find the scalar projection of $\mathbf{u}=(1, 1, 1)$ onto $\mathbf{v}=(1, 2, 2)$.'
            answer: "5/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=1+2+2=5$ and $\|\mathbf{v}\|=\sqrt{1+4+4}=3$. The scalar projection is $\frac{5}{3}$.'
          - problem: 'Find the scalar projection of $\mathbf{u}=(4, -2)$ onto $\mathbf{v}=(0, 1)$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{u}\cdot\mathbf{v}=0-2=-2$ and $\|\mathbf{v}\|=1$. The scalar projection is $-2$; it is negative because the second entry of $\mathbf{u}$ is negative while $\mathbf{v}$ points up the second axis.'
          - problem: 'The scalar projection of $\mathbf{u}=(x, 1)$ onto $\mathbf{v}=(3, 4)$ is $1$. Find $x$.'
            answer: "1/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The scalar projection is $\frac{3x+4}{5}$, because $\|\mathbf{v}\|=5$. Set $\frac{3x+4}{5}=1$, so $3x+4=5$, $3x=1$ and $x=1/3$.'
          - problem: 'A sled is pulled by the force $(4, 6)$ N up a ramp that rises in the direction $(12, 5)$. How many newtons of the force act along the ramp?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The part of the force along the ramp is the scalar projection onto $(12, 5)$. Here $(4, 6)\cdot(12, 5)=48+30=78$ and $\|(12, 5)\|=13$, so the force along the ramp is $\frac{78}{13}=6$ N.'
          - problem: 'A road runs in the direction $(4, 3)$, and the wind velocity is $(-5, -5)$ km/h. What is the component of the wind along the road?'
            answer: "-7"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The component is the scalar projection of the wind onto $(4, 3)$. Here $(-5, -5)\cdot(4, 3)=-20-15=-35$ and $\|(4, 3)\|=5$, so the component is $\frac{-35}{5}=-7$ km/h; the negative sign means the wind blows against the road direction.'
          - problem: 'The dot product of $\mathbf{u}$ and $\mathbf{v}$ is $24$, and $\|\mathbf{v}\|=8$. What is the scalar projection of $\mathbf{u}$ onto $\mathbf{v}$?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The scalar projection is $\frac{\mathbf{u}\cdot\mathbf{v}}{\|\mathbf{v}\|}$. So it is $\frac{24}{8}=3$.'
          - problem: 'Sam finds the scalar projection of $(7, 1)$ onto $(3, 4)$ by computing $\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}$ and gets $1$. What is the correct scalar projection?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The scalar projection divides by the length $\|\mathbf{v}\|$, not by $\mathbf{v}\cdot\mathbf{v}$. Here $\mathbf{u}\cdot\mathbf{v}=21+4=25$ and $\|\mathbf{v}\|=5$, so the correct value is $\frac{25}{5}=5$.'
        constraints: "pick v with integer norm (multiples of (3,4), (1,0), (0,1), (1,2,2), (12,5)); integer or simple fraction answers"
      - id: kp2
        name: Vector projection
        key_prerequisites: [dot-product, vectors-in-rn]
        exemplars:
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(3, 4)$ and $\mathbf{v}=(2, 1)$.'
            answer: "(4, 2)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=6+4=10$ and $\mathbf{v}\cdot\mathbf{v}=4+1=5$, so the scalar is $\frac{10}{5}=2$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=2(2, 1)=(4, 2)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(3, 1)$ and $\mathbf{v}=(2, 0)$.'
            answer: "(3, 0)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=6$ and $\mathbf{v}\cdot\mathbf{v}=4$, so the scalar is $\frac{6}{4}=\frac{3}{2}$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=\frac{3}{2}(2, 0)=(3, 0)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(2, 6)$ and $\mathbf{v}=(1, 1)$.'
            answer: "(4, 4)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=2+6=8$ and $\mathbf{v}\cdot\mathbf{v}=1+1=2$, so the scalar is $\frac{8}{2}=4$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=4(1, 1)=(4, 4)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(1, 2, 2)$ and $\mathbf{v}=(1, 1, 0)$.'
            answer: "(3/2, 3/2, 0)"
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=1+2+0=3$ and $\mathbf{v}\cdot\mathbf{v}=1+1+0=2$, so the scalar is $\frac{3}{2}$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=\frac{3}{2}(1, 1, 0)=(3/2, 3/2, 0)$.'
          - problem: 'The projection of $\mathbf{u}=(1, 2)$ onto $\mathbf{v}=(1, 1)$ is a multiple $k\mathbf{v}$ of $\mathbf{v}$. Find $k$.'
            answer: "3/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use $k=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}$. Here $\mathbf{u}\cdot\mathbf{v}=1+2=3$ and $\mathbf{v}\cdot\mathbf{v}=1+1=2$, so $k=\frac{3}{2}$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(1, 1, 1, 1)$ and $\mathbf{v}=(2, 0, 0, 0)$.'
            answer: "(1, 0, 0, 0)"
            answer_contract: {"kind":"coordinates","arity":4}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=2$ and $\mathbf{v}\cdot\mathbf{v}=4$, so the scalar is $\frac{2}{4}=\frac{1}{2}$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=\frac{1}{2}(2, 0, 0, 0)=(1, 0, 0, 0)$.'
          - problem: 'A cart on a straight track in the direction $(1, 1)$ is pulled by the force $(7, 3)$ N. Find the force vector that acts along the track.'
            answer: "(5, 5)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The force along the track is the projection of $(7, 3)$ onto $(1, 1)$. The scalar is $\frac{7+3}{1+1}=5$, so the force along the track is $5(1, 1)=(5, 5)$ N.'
          - problem: 'A ball moves with velocity $(6, -2)$ m/s near a wall that runs in the direction $(3, 1)$. Find the part of the velocity that is parallel to the wall.'
            answer: "(24/5, 8/5)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'This is the projection of $(6, -2)$ onto $(3, 1)$. Here $\mathbf{u}\cdot\mathbf{v}=18-2=16$ and $\mathbf{v}\cdot\mathbf{v}=9+1=10$, so the scalar is $\frac{16}{10}=\frac{8}{5}$ and the parallel part is $\frac{8}{5}(3, 1)=(24/5, 8/5)$ m/s.'
          - problem: 'Sam computes the projection of $(5, 5)$ onto $(2, 1)$, finds the scalar $3$ and writes $3$ as the answer. What is the projection?'
            answer: "(6, 3)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The scalar $\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}=\frac{15}{5}=3$ is only the factor. The projection is a vector, so multiply: $3(2, 1)=(6, 3)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u}=(1, 3)$ and $\mathbf{v}=(2, -1)$.'
            answer: "(-2/5, 1/5)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compute $\mathbf{u}\cdot\mathbf{v}=2-3=-1$ and $\mathbf{v}\cdot\mathbf{v}=4+1=5$, so the scalar is $-\frac{1}{5}$. Then $\mathrm{proj}_{\mathbf{v}}\mathbf{u}=-\frac{1}{5}(2, -1)=(-2/5, 1/5)$.'
        constraints: "rig u . v / v . v to be an integer or half-integer; never let u be a multiple of v"
      - id: kp3
        name: Orthogonal decomposition
        key_prerequisites: [dot-product, vectors-in-rn]
        exemplars:
          - problem: 'Write $\mathbf{u}=(3, 1)$ as $\mathbf{p}+\mathbf{w}$, where $\mathbf{p}$ is parallel to $\mathbf{v}=(1, 1)$ and $\mathbf{w}$ is orthogonal to $\mathbf{v}$. Find $\mathbf{p}$ and $\mathbf{w}$.'
            answer: "p = (2, 2); w = (1, -1)"
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"coordinates","arity":2},"name":"p"},{"contract":{"kind":"coordinates","arity":2},"name":"w"}]}
            solution_sketch: 'The parallel part is $\mathbf{p}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{4}{2}(1, 1)=(2, 2)$. The remainder is $\mathbf{w}=\mathbf{u}-\mathbf{p}=(1, -1)$, and $\mathbf{w}\cdot\mathbf{v}=1-1=0$ confirms that it is orthogonal to $\mathbf{v}$.'
          - problem: 'Find the component of $\mathbf{u}=(5, 5)$ that is parallel to $\mathbf{v}=(1, 2)$.'
            answer: "(3, 6)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The parallel component is the projection: $\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{15}{5}(1, 2)=(3, 6)$. The remainder $(2, -1)$ is orthogonal to $\mathbf{v}$, since $2\cdot 1-1\cdot 2=0$.'
          - problem: 'Write $\mathbf{u}=(4, 7)$ as $\mathbf{p}+\mathbf{w}$, where $\mathbf{p}$ is parallel to $\mathbf{v}=(2, 1)$ and $\mathbf{w}$ is orthogonal to $\mathbf{v}$. Find $\mathbf{w}$.'
            answer: "(-2, 4)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First $\mathbf{p}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{15}{5}(2, 1)=(6, 3)$. Then $\mathbf{w}=\mathbf{u}-\mathbf{p}=(4-6, 7-3)=(-2, 4)$, and $\mathbf{w}\cdot\mathbf{v}=-4+4=0$.'
          - problem: 'Decompose $\mathbf{u}=(7, 4)$ into a part parallel to $\mathbf{v}=(2, 3)$ and a part orthogonal to $\mathbf{v}$. What is the parallel part?'
            answer: "(4, 6)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The parallel part is $\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{26}{13}(2, 3)=(4, 6)$. The orthogonal part is $\mathbf{u}-(4, 6)=(3, -2)$, and $3\cdot 2+(-2)\cdot 3=0$.'
          - problem: 'Write $\mathbf{u}=(5, -5)$ as $\mathbf{p}+\mathbf{w}$, where $\mathbf{p}$ is parallel to $\mathbf{v}=(1, -2)$ and $\mathbf{w}$ is orthogonal to $\mathbf{v}$. Find $\mathbf{w}$.'
            answer: "(2, 1)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First $\mathbf{p}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{15}{5}(1, -2)=(3, -6)$. Then $\mathbf{w}=\mathbf{u}-\mathbf{p}=(5-3, -5+6)=(2, 1)$, and $\mathbf{w}\cdot\mathbf{v}=2-2=0$.'
          - problem: 'Write $\mathbf{u}=(3, 1, 2)$ as $\mathbf{p}+\mathbf{w}$, where $\mathbf{p}$ is parallel to $\mathbf{v}=(1, 1, 1)$ and $\mathbf{w}$ is orthogonal to $\mathbf{v}$. Find $\mathbf{p}$ and $\mathbf{w}$.'
            answer: "p = (2, 2, 2); w = (1, -1, 0)"
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"coordinates","arity":3},"name":"p"},{"contract":{"kind":"coordinates","arity":3},"name":"w"}]}
            solution_sketch: 'The parallel part is $\mathbf{p}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}=\frac{6}{3}(1, 1, 1)=(2, 2, 2)$. The remainder is $\mathbf{w}=\mathbf{u}-\mathbf{p}=(1, -1, 0)$, and $\mathbf{w}\cdot\mathbf{v}=1-1+0=0$.'
          - problem: 'A hiker stands at the point $(10, 5)$ km, measured from the origin. A straight road leads from the origin in the direction $(3, 4)$. Which point of the road is closest to the hiker?'
            answer: "(6, 8)"
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The closest point of the road is the projection of $(10, 5)$ onto $(3, 4)$. Here $\mathbf{u}\cdot\mathbf{v}=30+20=50$ and $\mathbf{v}\cdot\mathbf{v}=25$, so the point is $2(3, 4)=(6, 8)$.'
          - problem: 'A hiker stands at the point $(10, 5)$ km, measured from the origin. A straight road leads from the origin in the direction $(3, 4)$. How far is the hiker from the road?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The closest point of the road is $(6, 8)$, so the distance is the length of the orthogonal part $\mathbf{w}=(10, 5)-(6, 8)=(4, -3)$. Its length is $\sqrt{16+9}=5$ km.'
          - problem: 'The vector $\mathbf{u}=(a, 2)$ is written as $\mathbf{p}+\mathbf{w}$, where $\mathbf{p}$ is parallel to $(1, 1)$ and $\mathbf{w}$ is orthogonal to $(1, 1)$. Given that $\mathbf{p}=(4, 4)$, find $a$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parallel part is $\frac{a+2}{2}(1, 1)$, because $\mathbf{u}\cdot(1, 1)=a+2$ and $(1, 1)\cdot(1, 1)=2$. Setting $\frac{a+2}{2}=4$ gives $a+2=8$, so $a=6$.'
        constraints: "choose data so both components have integer or simple fraction entries; ask for p, for w, or for both"
    diagnostic_exemplar:
      problem: 'Write $\mathbf{u} = (4, 8)$ as $\mathbf{u} = \mathbf{p} + \mathbf{w}$, where $\mathbf{p}$ is parallel to $\mathbf{v} = (1, 1)$ and $\mathbf{w}$ is orthogonal to $\mathbf{v}$. Find $\mathbf{p}$.'
      answer: '(6, 6)'
      solution_sketch: '$\mathbf{p} = \frac{(4 + 8)}{2}(1, 1) = (6, 6)$ and $\mathbf{w} = (4, 8) - (6, 6) = (-2, 2)$, which satisfies $\mathbf{w} \cdot \mathbf{v} = 0$.'
    anki_seeds:
      - front: 'Formula for the vector projection of $\mathbf{u}$ onto $\mathbf{v}$?'
        back: '$\mathrm{proj}_{\mathbf{v}}\mathbf{u} = \dfrac{\mathbf{u} \cdot \mathbf{v}}{\mathbf{v} \cdot \mathbf{v}}\,\mathbf{v}$.'
        type: basic
      - front: 'In the decomposition $\mathbf{u} = \mathrm{proj}_{\mathbf{v}}\mathbf{u} + \mathbf{w}$, the vector $\mathbf{w}$ is...'
        back: 'orthogonal to $\mathbf{v}$'
        type: basic
