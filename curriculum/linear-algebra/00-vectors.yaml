unit: vectors
course: linear-algebra
module: "Vectors"
topics:
  - id: component-form-of-vectors
    name: Component Form of Vectors
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
      - id: plotting-points
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vector between two points
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Find the component form of the vector from $P(1, 2)$ to $Q(4, 6)$.'
            answer: "(3, 4)"
            solution_sketch: 'Terminal minus initial: $(4 - 1, 6 - 2)$.'
          - problem: 'Find the component form of the vector from $P(-2, 5)$ to $Q(3, 1)$.'
            answer: "(5, -4)"
          - problem: 'Find the component form of the vector from $P(2, -1, 3)$ to $Q(0, 2, 5)$.'
            answer: "(-2, 3, 2)"
          - problem: "Find the component form of the vector from $P(-3, 2, -5)$ to $Q(1, -4, 2)$. Give the answer as (x, y, z)."
            answer: "(4, -6, 7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1, terminal minus initial: $Q - P = (1 - (-3), -4 - 2, 2 - (-5))$. Step 2, simplify each component: the differences are $4$, $-6$, and $7$. The component form is (4, -6, 7)."
          - problem: "Determine the component form of the vector from $P(-7, -2)$ to $Q(-1, -8)$. Give the answer as (x, y)."
            answer: "(6, -6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, terminal minus initial: $Q - P = (-1 - (-7), -8 - (-2))$. Step 2, simplify each component: the differences are $6$ and $-6$. The component form is (6, -6)."
          - problem: "Compute the component form of the vector from $P(5, 0)$ to $Q(-4, 3)$. Give the answer as (x, y)."
            answer: "(-9, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, terminal minus initial: $Q - P = (-4 - 5, 3 - 0)$. Step 2, simplify each component: the differences are $-9$ and $3$. The component form is (-9, 3)."
        constraints: "integer coordinates in -9..9; dimensions 2 or 3"
      - id: kp2
        name: Equal vectors and endpoints
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'The vector $(3, -2)$ starts at $P(1, 4)$. Where does it end?'
            answer: "(4, 2)"
            solution_sketch: 'Add the vector to the initial point: $(1 + 3, 4 + (-2))$.'
          - problem: "The vector from $A(-3, 2)$ to $B(4, -5)$ is equal to the vector from $C(2, 0)$ to $D$. Find $D$ as (x, y)."
            answer: "(9, -7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (component form): the vector $AB$ is $(4 - (-3), -5 - 2) = (7, -7)$. Step 2 (equal vectors): the vector $CD$ is $D - C$ and must equal $(7, -7)$. Step 3 (solve for the endpoint): $D = C + (7, -7) = (2 + 7, 0 - 7)$. Thus $D$ is (9, -7)."
          - problem: 'The vector $(-1, 5)$ ends at $Q(2, 3)$. Where does it start?'
            answer: "(3, -2)"
            solution_sketch: 'Initial point is terminal minus vector: $(2 - (-1), 3 - 5)$.'
          - problem: "The vector from $P(-2, 6)$ to $Q(3, -1)$ is equal to the vector from $R$ to $T(2, -6)$. Find $R$ as (x, y)."
            answer: "(-3, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (component form): the vector $PQ$ is $(3 - (-2), -1 - 6) = (5, -7)$. Step 2 (equal vectors): the vector $RT$ is $T - R$ and must equal $(5, -7)$. Step 3 (solve for the start): $R = T - (5, -7) = (2 - 5, -6 - (-7))$. Thus $R$ is (-3, 1)."
          - problem: "The vector from $M(-5, -3)$ to $N(4, 1)$ is redrawn so that it starts at $R(-2, 5)$. Find the new endpoint as (x, y)."
            answer: "(7, 9)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (component form): the vector $MN$ is $(4 - (-5), 1 - (-3)) = (9, 4)$. Step 2 (translation): redrawing a vector keeps its components, so the new endpoint is $R + (9, 4)$. Step 3 (add the components): $(-2 + 9, 5 + 4) = (7, 9)$. Thus the new endpoint is (7, 9)."
          - problem: "The vector from $P(2, -6)$ to $Q(-3, 4)$ is equal to the vector from $R(1, -2)$ to $S(x, y)$. Find $x - y$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (component form): the vector $PQ$ is $(-3 - 2, 4 - (-6)) = (-5, 10)$. Step 2 (equal vectors): $S = R + (-5, 10) = (1 - 5, -2 + 10) = (-4, 8)$. Step 3 (combine the coordinates): $x - y = -4 - 8$. Thus $x - y$ is -12."
        constraints: "integer coordinates in -9..9; dimension 2"
      - id: kp3
        name: Standard basis notation
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Write $(3, -2)$ in $\mathbf{i}, \mathbf{j}$ notation.'
            answer: '$3i - 2j$'
          - problem: 'Write $4\mathbf{i} - \mathbf{j} + 2\mathbf{k}$ in component form.'
            answer: "(4, -1, 2)"
          - problem: 'Write the vector from $P(1, 1)$ to $Q(4, 0)$ in $\mathbf{i}, \mathbf{j}$ notation.'
            answer: '$3i - j$'
            solution_sketch: 'Component form is $(3, -1)$, so $3i - j$.'
          - problem: "A velocity vector has component form $(-3, 5)$. Which expression writes this velocity in $\\mathbf{i}, \\mathbf{j}$ notation?"
            answer: "-3i + 5j"
            answer_contract: {"kind": "label", "options": [["-3i + 5j"], ["-3i - 5j"], ["5i - 3j"], ["-5i + 3j"]]}
            solution_sketch: "The full object is the velocity vector with component form (-3, 5), where the first entry is the horizontal component and the second entry is the vertical component. Step 1 (read components): the horizontal component is -3 and the vertical component is 5. Step 2 (standard basis rule): the horizontal component becomes the coefficient of i and the vertical component becomes the coefficient of j, so the vector is -3i + 5j. The option -3i - 5j flips the sign of the vertical component; the option 5i - 3j swaps the two components; the option -5i + 3j swaps the components and flips both signs. The answer is -3i + 5j."
          - problem: "Let $A(1, -2, 4)$ and $B(-3, 0, -2)$ be points. Which expression gives the vector from $A$ to $B$ in $\\mathbf{i}, \\mathbf{j}, \\mathbf{k}$ notation?"
            answer: "-4i + 2j - 6k"
            answer_contract: {"kind": "label", "options": [["-4i + 2j - 6k"], ["4i - 2j + 6k"], ["-4i - 2j - 6k"], ["-4i + 2j + 6k"]]}
            solution_sketch: "The full object is the vector from A(1, -2, 4) to B(-3, 0, -2), which is B minus A taken component by component. Step 1 (subtraction rule): -3 - 1 = -4, 0 - (-2) = 2, and -2 - 4 = -6, so the component form is (-4, 2, -6). Step 2 (standard basis rule): the three components are the coefficients of i, j, k in order, giving -4i + 2j - 6k. The option 4i - 2j + 6k subtracts in the reverse order A - B; the option -4i - 2j - 6k flips the sign of the j coefficient; the option -4i + 2j + 6k flips the sign of the k coefficient. The answer is -4i + 2j - 6k."
          - problem: "The vector $\\mathbf{v} = -2\\mathbf{k} + \\mathbf{i} + 4\\mathbf{j}$ has its terms written out of the usual order. Give the component form of $\\mathbf{v}$ as (a, b, c)."
            answer: "(1, 4, -2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is the vector v = -2k + i + 4j, whose terms are listed out of the usual order. Step 1 (standard basis rule): the component form lists the coefficient of i first, then the coefficient of j, then the coefficient of k, and a unit vector written alone has coefficient 1. Step 2 (match coefficients): the coefficient of i is 1 because i appears alone, the coefficient of j is 4, and the coefficient of k is -2. The component form of v is (1, 4, -2)."
        constraints: "integer components in -9..9; dimensions 2 or 3"
    diagnostic_exemplar:
      problem: 'The vector from $P(-1, 3)$ to $Q(2, -2)$ is redrawn so that it starts at $R(1, 0)$. Write the vector from the origin to its new endpoint in $\mathbf{i}, \mathbf{j}$ notation.'
      answer: '$4i - 5j$'
      solution_sketch: 'The vector is $(2 - (-1), -2 - 3) = (3, -5)$; from $R(1, 0)$ it ends at $(1 + 3, 0 - 5) = (4, -5)$, i.e. $4i - 5j$.'
    anki_seeds:
      - front: 'Component form of the vector from point $P$ to point $Q$?'
        back: '$Q - P$ (terminal point minus initial point, componentwise).'
        type: basic
      - front: 'What are $\mathbf{i}, \mathbf{j}, \mathbf{k}$?'
        back: 'The standard unit vectors along the $x$-, $y$-, and $z$-axes.'
        type: basic

  - id: vector-arithmetic
    name: Vector Addition and Scalar Multiplication
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: component-form-of-vectors
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vector addition and subtraction
        key_prerequisites: [component-form-of-vectors]
        exemplars:
          - problem: 'Let $\mathbf{u} = (3, 1)$ and $\mathbf{v} = (-1, 4)$. Compute $\mathbf{u} + \mathbf{v}$.'
            answer: "(2, 5)"
            solution_sketch: 'Add componentwise: $(3 + (-1), 1 + 4)$.'
          - problem: 'Compute $(2, -3, 1) + (4, 0, -5)$.'
            answer: "(6, -3, -4)"
          - problem: 'Let $\mathbf{u} = (5, 2)$ and $\mathbf{v} = (3, 7)$. Compute $\mathbf{u} - \mathbf{v}$.'
            answer: "(2, -5)"
          - problem: "Let $\\mathbf{u} = (4, a, -2)$ and $\\mathbf{v} = (-1, 5, b)$. Given that $\\mathbf{u} + \\mathbf{v} = (3, 1, 5)$, find $a$ and $b$."
            answer: "a = -4; b = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "Step 1. Write the full objects: u = (4, a, -2), v = (-1, 5, b), and u + v = (3, 1, 5). Step 2. Use the rule for vector addition: add matching components. Step 3. First component: 4 + (-1) = 3, which checks. Step 4. Second component: a + 5 = 1, so a = 1 - 5 = -4. Step 5. Third component: -2 + b = 5, so b = 5 + 2 = 7. The solution is a = -4; b = 7."
          - problem: "Let $\\mathbf{u} = (k, k+2)$ and $\\mathbf{v} = (4, -9)$. Given that $\\mathbf{u} + \\mathbf{v} = (-1, -12)$, find $k$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1. Write the full objects: u = (k, k+2), v = (4, -9), and u + v = (-1, -12). Step 2. Use the rule for vector addition: add matching components. Step 3. First component: k + 4 = -1, so k = -1 - 4 = -5. Step 4. Check with the second component: (k + 2) + (-9) = -5 + 2 - 9 = -12, which matches. The value is k = -5."
          - problem: "Let $\\mathbf{p} = (2, -5, 1)$ and $\\mathbf{q} = (k, 0, -3)$. Given that $\\mathbf{p} - \\mathbf{q} = (6, -5, 4)$, find $k$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1. Write the full objects: p = (2, -5, 1), q = (k, 0, -3), and p - q = (6, -5, 4). Step 2. Use the rule for vector subtraction: subtract matching components. Step 3. Second component: -5 - 0 = -5, which checks. Step 4. Third component: 1 - (-3) = 4, which checks. Step 5. First component: 2 - k = 6, so k = 2 - 6 = -4. The value is k = -4."
        constraints: "components are integers in -9..9; dimensions 2 or 3"
      - id: kp2
        name: Scalar multiplication
        key_prerequisites: [component-form-of-vectors]
        exemplars:
          - problem: 'Compute $3(2, -1)$.'
            answer: "(6, -3)"
          - problem: 'Compute $-2(3, 0, -1)$.'
            answer: "(-6, 0, 2)"
          - problem: 'Compute $\frac{1}{2}(6, -4)$.'
            answer: "(3, -2)"
        constraints: "integer scalars in -3..3 or halves that keep components integer; integer components"
      - id: kp3
        name: Parallel vectors as scalar multiples
        key_prerequisites: [component-form-of-vectors]
        exemplars:
          - problem: 'Is $(6, -4)$ parallel to $(-3, 2)$?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$(6, -4) = -2(-3, 2)$, a scalar multiple.'
          - problem: 'Find $k$ so that $(6, k)$ is parallel to $(2, 3)$.'
            answer: "9"
            solution_sketch: '$(6, k) = 3(2, 3)$ forces $k = 9$.'
          - problem: 'Is $(4, 6)$ parallel to $(2, 5)$?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$4 = 2c$ gives $c = 2$, but $6 \neq 2 \cdot 5$.'
        constraints: "scalar multiples with integer ratio; solve-for-k problems must have integer k"
    diagnostic_exemplar:
      problem: 'Compute $(5, -1) + 2(-1, 3)$, then find $k$ so that the result is parallel to $(6, k)$.'
      answer: '10'
      solution_sketch: '$(5, -1) + (-2, 6) = (3, 5)$; $(6, k) = 2(3, 5)$ forces $k = 10$.'
    anki_seeds:
      - front: 'How do vectors add?'
        back: 'Componentwise: $(u_1 + v_1, \dots, u_n + v_n)$.'
        type: basic
      - front: 'Nonzero vectors $\mathbf{u}$ and $\mathbf{v}$ are parallel exactly when...'
        back: '$\mathbf{u} = c\mathbf{v}$ for some nonzero scalar $c$.'
        type: basic

  - id: linear-combinations-of-vectors
    name: Linear Combinations of Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.8
        key: true
      - id: systems-elimination
        weight: 0.3
      - id: order-of-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluating linear combinations
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (1, 2)$ and $\mathbf{v} = (2, -1)$. Compute $2\mathbf{u} - 3\mathbf{v}$.'
            answer: "(-4, 7)"
            solution_sketch: '$2\mathbf{u} = (2, 4)$, $3\mathbf{v} = (6, -3)$; subtract componentwise: $(2-6, 4-(-3))$.'
          - problem: 'Let $\mathbf{u} = (0, 3)$ and $\mathbf{v} = (4, 1)$. Compute $\mathbf{u} + 2\mathbf{v}$.'
            answer: "(8, 5)"
          - problem: 'Compute $3(1, 0, 2) - (2, 2, 1)$.'
            answer: "(1, -2, 5)"
          - problem: "Let u = (3, 1) and v = (2, -2). Compute 2u - 3v. Give the answer as (x, y)."
            answer: "(0, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the combination 2u - 3v with u = (3, 1) and v = (2, -2). By scalar multiplication, 2u = (6, 2) and 3v = (6, -6). By vector subtraction, (6, 2) - (6, -6) = (0, 8). The result is (0, 8)."
          - problem: "Let u = (1, -2, 3) and v = (-2, 1, 4). Compute -u + 3v. Give the answer as (x, y, z)."
            answer: "(-7, 5, 9)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Write the combination -u + 3v with u = (1, -2, 3) and v = (-2, 1, 4). By scalar multiplication, -u = (-1, 2, -3) and 3v = (-6, 3, 12). By vector addition, (-1, 2, -3) + (-6, 3, 12) = (-7, 5, 9). The result is (-7, 5, 9)."
          - problem: "A boat has velocity u = (2, 1) and current v = (1, -3). A trip uses velocity 3u - 2v. Compute the resulting velocity. Give the answer as (x, y)."
            answer: "(4, 9)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the resulting velocity 3u - 2v with u = (2, 1) and v = (1, -3). By scalar multiplication, 3u = (6, 3) and 2v = (2, -6). By vector subtraction, (6, 3) - (2, -6) = (4, 9). The resulting velocity is (4, 9)."
        constraints: "integer scalars in -3..3; integer components in -9..9; at most two terms"
      - id: kp2
        name: Combinations of three vectors
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (1, 1)$, $\mathbf{v} = (0, 2)$, $\mathbf{w} = (2, 0)$. Compute $\mathbf{u} - 2\mathbf{v} + 3\mathbf{w}$.'
            answer: "(7, -3)"
            solution_sketch: '$(1, 1) - (0, 4) + (6, 0) = (7, -3)$.'
          - problem: 'Compute the linear combination $2(1, 0, 1) - (2, 1, 0)$.'
            answer: "(0, -1, 2)"
          - problem: 'Compute $\frac{1}{2}(\mathbf{u} + \mathbf{v})$ for $\mathbf{u} = (2, 4)$ and $\mathbf{v} = (6, 0)$.'
            answer: "(4, 2)"
            solution_sketch: '$\mathbf{u} + \mathbf{v} = (8, 4)$; halve each component.'
          - problem: "Let u = (-1, 2), v = (3, -1), w = (0, 4). Compute -2u + v - 3w. Give the answer as (x, y)."
            answer: "(5, -17)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with -2u + v - 3w, where u = (-1, 2), v = (3, -1), w = (0, 4). By scalar multiplication, -2u = (2, -4), v = (3, -1), and -3w = (0, -12). By vector addition, add the components: (2 + 3 + 0, -4 + -1 + -12). Thus the result is (5, -17)."
          - problem: "Let u = (4, -2, 6), v = (1, 3, -1), w = (-2, 0, 4). Compute 1/2 u - 2v + w. Give the answer as (x, y, z)."
            answer: "(-2, -7, 9)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Start with 1/2 u - 2v + w, where u = (4, -2, 6), v = (1, 3, -1), w = (-2, 0, 4). By scalar multiplication, 1/2 u = (2, -1, 3), -2v = (-2, -6, 2), and w = (-2, 0, 4). By vector addition, add components: (2 - 2 - 2, -1 - 6 + 0, 3 + 2 + 4). Thus the combination is (-2, -7, 9)."
          - problem: "A boat's displacement is 3a - b + 1/2 c, where a = (6, -4), b = (-2, 6), c = (0, 8). Find the total displacement as (x, y)."
            answer: "(20, -14)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The displacement expression is 3a - b + 1/2 c, where a = (6, -4), b = (-2, 6), c = (0, 8). By scalar multiplication, 3a = (18, -12), -b = (2, -6), and 1/2 c = (0, 4). By vector addition, add the components: (18 + 2 + 0, -12 - 6 + 4). Thus the displacement is (20, -14)."
        constraints: "up to three terms; integer results; scalars in -3..3 plus the scalar 1/2"
      - id: kp3
        name: Solving for combination coefficients
        key_prerequisites: [vector-arithmetic, systems-elimination]
        exemplars:
          - problem: 'Find scalars $a, b$ with $a(1, 0) + b(0, 1) = (4, -7)$; state the pair $(a, b)$.'
            answer: "(4, -7)"
            solution_sketch: 'The standard basis picks off the components directly.'
          - problem: 'Find $c$ so that $c(2, 3) + (1, 1) = (5, 7)$.'
            answer: "2"
            solution_sketch: 'First components: $2c + 1 = 5$, so $c = 2$; check $3 \cdot 2 + 1 = 7$.'
          - problem: 'Find scalars $a, b$ with $a(1, 1) + b(1, -1) = (4, 2)$; state the pair $(a, b)$.'
            answer: "(3, 1)"
            solution_sketch: '$a + b = 4$ and $a - b = 2$; adding gives $2a = 6$.'
          - problem: "Find scalars a, b with a(1, 2) + b(2, 1) = (5, 4); state the pair as (a, b)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the components equal: a + 2b = 5 and 2a + b = 4. Elimination: multiply the first equation by 2 to get 2a + 4b = 10, subtract the second to get 3b = 6, so b = 2. Then a = 5 - 2b = 1. The pair is (1, 2)."
          - problem: "Find scalars a, b with a(3, 1) + b(1, 2) = (11, 7); state the pair as (a, b)."
            answer: "(3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Equate components: 3a + b = 11 and a + 2b = 7. Solve the first equation for b: b = 11 - 3a. Substitute into the second: a + 2(11 - 3a) = 7, so -5a + 22 = 7 and a = 3. Then b = 11 - 9 = 2. The pair is (3, 2)."
          - problem: "Find c so that c(2, 5) + (3, -1) = (9, 14)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the vector equation componentwise: 2c + 3 = 9 and 5c - 1 = 14. The first equation gives 2c = 6, so c = 3; the second gives 5c = 15, so c = 3. The value is 3."
        constraints: "coefficients are small integers in -9..9; systems solvable by inspection or one elimination"
    diagnostic_exemplar:
      problem: 'Find scalars $a, b$ with $a(1, 2) + b(3, -1) = (5, 3)$; state the pair $(a, b)$.'
      answer: '(2, 1)'
      solution_sketch: '$a + 3b = 5$ and $2a - b = 3$ give $a = 2$, $b = 1$; check $2(1, 2) + (3, -1) = (5, 3)$.'
    anki_seeds:
      - front: 'A linear combination of vectors $\mathbf{v}_1, \dots, \mathbf{v}_k$ is...'
        back: '$c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k$ for scalars $c_1, \dots, c_k$.'
        type: basic

  - id: vector-norms-unit-vectors
    name: Vector Norms and Unit Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Computing norms
        key_prerequisites: [pythagorean-theorem, square-roots]
        exemplars:
          - problem: 'Compute $\|(3, 4)\|$.'
            answer: "5"
            solution_sketch: '$\sqrt{3^2 + 4^2} = \sqrt{25} = 5$.'
          - problem: 'Compute $\|(1, 2, 2)\|$.'
            answer: "3"
            solution_sketch: '$\sqrt{1 + 4 + 4} = \sqrt{9} = 3$.'
          - problem: 'Compute $\|(-5, 12)\|$.'
            answer: "13"
          - problem: "Compute the norm of the vector (2, 3, 6)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full vector is (2, 3, 6). By the Pythagorean theorem in three dimensions, the norm is sqrt(2^2 + 3^2 + 6^2) = sqrt(4 + 9 + 36) = sqrt(49). By the square-root rule, sqrt(49) = 7, so the answer is 7."
          - problem: "Find the distance between the points (1, 2) and (4, 6)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The displacement vector is (4, 6) - (1, 2) = (3, 4). The distance is the norm of this displacement, so by the Pythagorean theorem it is sqrt(3^2 + 4^2) = sqrt(9 + 16) = sqrt(25). By the square-root rule, sqrt(25) = 5, so the answer is 5."
          - problem: "The vector (-12, y) has norm 13, where y > 0. Find y."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full vector is (-12, y). By the Pythagorean theorem, sqrt((-12)^2 + y^2) = 13, so 144 + y^2 = 169. Subtracting gives y^2 = 25, and since y > 0 the square-root rule gives y = 5, so the answer is 5."
        constraints: "prefer Pythagorean-friendly components (3-4-5, 5-12-13, 1-2-2, 2-3-6 families)"
      - id: kp2
        name: Norms with radicals and scaling
        key_prerequisites: [square-roots, vector-arithmetic]
        exemplars:
          - problem: 'Compute $\|(1, 1)\|$.'
            answer: '$\sqrt 2$'
          - problem: 'Compute $\|(2, -1)\|$.'
            answer: '$\sqrt 5$'
          - problem: 'If $\|\mathbf{v}\| = 4$, what is $\|-2\mathbf{v}\|$?'
            answer: "8"
            solution_sketch: '$\|c\mathbf{v}\| = |c|\,\|\mathbf{v}\| = 2 \cdot 4$.'
          - problem: "Compute the norm of the vector (3, 4)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, use the Euclidean norm rule: ||(3, 4)|| = sqrt(3^2 + 4^2). Step 2, sum the squares: 9 + 16 = 25. Step 3, take the square root: sqrt(25) = 5. The norm is 5."
          - problem: "Compute the norm of the vector (1, 2, 2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, use the Euclidean norm rule: ||(1, 2, 2)|| = sqrt(1^2 + 2^2 + 2^2). Step 2, sum the squares: 1 + 4 + 4 = 9. Step 3, take the square root: sqrt(9) = 3. The norm is 3."
          - problem: "Suppose a vector v has norm sqrt(5). Find the norm of -3v."
            answer: "3sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, use the scaling rule for norms: ||-3v|| = |-3| ||v||. Step 2, substitute ||v|| = sqrt(5) and simplify the absolute value: 3 sqrt(5). The norm is 3sqrt(5)."
        constraints: "exact radical answers; scaling questions use integer scalars in -3..3"
      - id: kp3
        name: Unit vectors and prescribed lengths
        key_prerequisites: [vector-arithmetic, square-roots]
        exemplars:
          - problem: 'Find the unit vector in the direction of $(6, 8)$.'
            answer: "(3/5, 4/5)"
            solution_sketch: '$\|(6, 8)\| = 10$; divide each component by $10$.'
          - problem: 'Find the unit vector in the direction of $(2, 3, 6)$.'
            answer: "(2/7, 3/7, 6/7)"
            solution_sketch: '$\sqrt{4 + 9 + 36} = 7$; divide by $7$.'
          - problem: 'Find the vector of length $10$ in the direction of $(3, -4)$.'
            answer: "(6, -8)"
            solution_sketch: '$\|(3, -4)\| = 5$; scale the unit vector by $10$, i.e. multiply the vector by $2$.'
          - problem: "Find the unit vector in the direction of $(10, 24)$ and give the answer as (x, y)."
            answer: "(5/13, 12/13)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (norm rule): the norm of (10,24) is sqrt(10^2+24^2) = sqrt(676) = 26. Step 2 (unit vector rule): divide each component by 26 to get (10/26, 24/26) = (5/13, 12/13). The unit vector is (5/13, 12/13)."
          - problem: "Find the unit vector in the direction of $(2, -3, 6)$ and give the answer as (x, y, z)."
            answer: "(2/7, -3/7, 6/7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (norm rule): the norm of (2,-3,6) is sqrt(2^2+(-3)^2+6^2) = sqrt(49) = 7. Step 2 (unit vector rule): divide each component by 7 to get (2/7, -3/7, 6/7). The unit vector is (2/7, -3/7, 6/7)."
          - problem: "Find the vector of length $26$ in the direction of $(3, 4, 12)$ and give the answer as (x, y, z)."
            answer: "(6, 8, 24)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (norm rule): the norm of (3,4,12) is sqrt(3^2+4^2+12^2) = sqrt(169) = 13. Step 2 (scale rule): the prescribed length 26 divided by the norm 13 gives scale factor 2. Step 3 (scalar multiplication): multiply each component of (3,4,12) by 2 to get (6,8,24). The vector of length 26 is (6, 8, 24)."
        constraints: "vectors with integer norms (3-4-5, 5-12-13, 2-3-6 families); prescribed lengths are integer multiples of the norm"
    diagnostic_exemplar:
      problem: 'Find the unit vector in the direction of $(5, 12)$.'
      answer: "(5/13, 12/13)"
      solution_sketch: '$\|(5, 12)\| = 13$; divide each component by $13$.'
    anki_seeds:
      - front: 'Formula for the norm of $\mathbf{v} = (v_1, \dots, v_n)$?'
        back: '$\|\mathbf{v}\| = \sqrt{v_1^2 + \cdots + v_n^2}$.'
        type: basic
      - front: 'How do you turn a nonzero vector $\mathbf{v}$ into a unit vector?'
        back: 'Divide by its norm: $\mathbf{v} / \|\mathbf{v}\|$.'
        type: basic
      - front: '$\|c\mathbf{v}\| = $ ?'
        back: '$|c|\,\|\mathbf{v}\|$.'
        type: basic

  - id: vector-distance
    name: Distance Between Points via Vectors
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-norms-unit-vectors
        weight: 0.7
        key: true
      - id: component-form-of-vectors
        weight: 0.5
        key: true
      - id: distance-midpoint-formulas
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Distance in the plane
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Find the distance between $P(1, 2)$ and $Q(4, 6)$.'
            answer: "5"
            solution_sketch: 'The vector $Q - P = (3, 4)$ has norm $5$.'
          - problem: 'Find the distance between $P(-2, 1)$ and $Q(3, 13)$.'
            answer: "13"
            solution_sketch: '$Q - P = (5, 12)$; $\|(5, 12)\| = 13$.'
          - problem: 'Find the distance between $P(0, 0)$ and $Q(1, 2)$.'
            answer: '$\sqrt 5$'
            solution_sketch: '$Q - P = (1, 2)$; $\|(1, 2)\| = \sqrt{1 + 4}$.'
          - problem: "The displacement vector from $P$ to $Q$ is $(8, -6)$. Find the distance between $P$ and $Q$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, vector norm: the distance between two points is the norm of the displacement vector $(8, -6)$. Step 2, Pythagoras on the components: $\\|(8, -6)\\| = \\sqrt{8^2 + (-6)^2}$. Step 3, evaluate: $\\sqrt{64 + 36} = \\sqrt{100} = 10$. The distance between $P$ and $Q$ is 10."
          - problem: "Find the distance between $P(1, 2)$ and $Q(4, 7)$. Give the exact value."
            answer: "sqrt(34)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, component form: $Q - P = (4 - 1, 7 - 2) = (3, 5)$. Step 2, vector norm: the distance is $\\sqrt{3^2 + 5^2}$. Step 3, evaluate: $\\sqrt{9 + 25} = \\sqrt{34}$. The exact distance is sqrt(34)."
          - problem: "The point $Q(5, y)$ is 13 units from $P(0, 0)$, and $y > 0$. Find $y$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, component form: $Q - P = (5 - 0, y - 0) = (5, y)$. Step 2, distance formula: $13 = \\sqrt{5^2 + y^2}$. Step 3, square both sides: $169 = 25 + y^2$, so $y^2 = 144$. Since $y > 0$, $y = 12$. The value is 12."
        constraints: "mostly Pythagorean-friendly differences; occasionally an exact radical answer"
      - id: kp2
        name: Distance in space
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Find the distance between $P(1, 0, 2)$ and $Q(2, 2, 4)$.'
            answer: "3"
            solution_sketch: '$Q - P = (1, 2, 2)$; $\sqrt{1 + 4 + 4} = 3$.'
          - problem: 'Find the distance between $P(3, -1, 2)$ and $Q(5, 2, 8)$.'
            answer: "7"
            solution_sketch: '$Q - P = (2, 3, 6)$; $\sqrt{4 + 9 + 36} = 7$.'
          - problem: "Let $P(2, -1, 4)$ and $Q(6, 7, 12)$. Find the distance between $P$ and $Q$ as a whole number."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Form the displacement vector: $Q - P = (6 - 2,\\ 7 - (-1),\\ 12 - 4) = (4, 8, 8)$. By the vector norm rule, the distance is $\\sqrt{4^2 + 8^2 + 8^2} = \\sqrt{16 + 64 + 64} = \\sqrt{144}$. The distance between $P$ and $Q$ is 12."
          - problem: "A displacement vector $(4, 6, 12)$ takes the point $P(-1, 2, 0)$ to the point $Q$. Find the distance $PQ$."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The displacement from $P(-1, 2, 0)$ to $Q$ is the given vector $(4, 6, 12)$. By the vector norm rule, the distance is $\\sqrt{4^2 + 6^2 + 12^2} = \\sqrt{16 + 36 + 144} = \\sqrt{196}$. The distance $PQ$ is 14."
          - problem: "The distance between $P(1, 2, 3)$ and $Q(2, 4, z)$ is 3. Find the larger possible value of $z$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The displacement vector is $Q - P = (1, 2, z - 3)$. By the vector norm rule, $3 = \\sqrt{1^2 + 2^2 + (z - 3)^2}$. Square: $9 = 1 + 4 + (z - 3)^2$, so $(z - 3)^2 = 4$. Thus $z = 5$ or $z = 1$, and the larger value is 5."
          - problem: "A drone flies from point $A(1, 1, 1)$ to point $B(7, 10, 19)$. Find the distance it travels."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The displacement vector is $B - A = (6, 9, 18)$. By the vector norm rule, the distance is $\\sqrt{6^2 + 9^2 + 18^2} = \\sqrt{36 + 81 + 324} = \\sqrt{441}$. The distance is 21."
        constraints: "differences from the 1-2-2 or 2-3-6 families for integer answers"
      - id: kp3
        name: Comparing distances
        key_prerequisites: [component-form-of-vectors, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Which of $Q(4, 5)$ and $R(5, 1)$ is closer to $P(1, 1)$?'
            answer: "R"
            solution_sketch: '$|PQ| = \|(3, 4)\| = 5$; $|PR| = \|(4, 0)\| = 4 < 5$.'
          - problem: "For the triangle with A(0, 0), B(3, 4), and C(6, 0), find the distances |AB| and |CB|. Give the answer as (|AB|, |CB|)."
            answer: "(5, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: Use component form to find each side vector. B - A = (3, 4), and B - C = (-3, 4). Step 2: Apply the vector norm. |AB| = sqrt(3^2 + 4^2) = 5 and |CB| = sqrt((-3)^2 + 4^2) = 5. Step 3: State the pair. The distances are (5, 5)."
          - problem: "Point P is (0, 0). Point Q is (3, 4) and point R is (6, 8). Find the difference between the larger and the smaller distance from P to these two points."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Find vector PQ = (3, 4), with norm sqrt(3^2 + 4^2) = 5. Step 2: Find vector PR = (6, 8), with norm sqrt(6^2 + 8^2) = 10. Step 3: Compare the distances and subtract: 10 - 5 = 5. The difference is 5."
          - problem: "For the points A(1, 2), B(4, 6), and C(1, 8), find |AB| - |AC|."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use component form. B - A = (3, 4) and C - A = (0, 6). Step 2: Take vector norms. |AB| = sqrt(3^2 + 4^2) = 5 and |AC| = sqrt(0^2 + 6^2) = 6. Step 3: Subtract in the given order: 5 - 6 = -1. The value is -1."
          - problem: "The distances from P(0, 0) to Q(5, 12) and from P(0, 0) to R(9, 12) are compared. Find the larger of the two distances."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use component form. Q - P = (5, 12) and R - P = (9, 12). Step 2: Take vector norms. |PQ| = sqrt(5^2 + 12^2) = 13 and |PR| = sqrt(9^2 + 12^2) = 15. Step 3: Compare the values 13 and 15. The larger distance is 15."
          - problem: "For the points A(0, 0), B(6, 8), and C(6, 0), find |AB| - |CB|."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use component form. B - A = (6, 8) and B - C = (0, 8). Step 2: Take vector norms. |AB| = sqrt(6^2 + 8^2) = 10 and |CB| = sqrt(0^2 + 8^2) = 8. Step 3: Subtract: 10 - 8 = 2. The value is 2."
        constraints: "distances chosen to be integers so comparisons are clean"
    diagnostic_exemplar:
      problem: 'Which of $Q(4, 2, 4)$ and $R(-1, 0, 2)$ is farther from $P(1, 2, 0)$? Give that distance.'
      answer: '5'
      solution_sketch: '$|PQ| = \|(3, 0, 4)\| = 5$ and $|PR| = \|(-2, -2, 2)\| = 2\sqrt3 \approx 3.46$, so $Q$ is farther, at distance $5$.'
    anki_seeds:
      - front: 'Distance between points $P$ and $Q$ in terms of vectors?'
        back: '$\|Q - P\|$, the norm of the vector from $P$ to $Q$.'
        type: basic

  - id: vectors-in-rn
    name: Vectors in R^n
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: vector-arithmetic
        weight: 0.7
        key: true
      - id: vector-norms-unit-vectors
        weight: 0.7
        key: true
      - id: linear-combinations-of-vectors
        weight: 0.5
      - id: vector-distance
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Norms of linear combinations
        key_prerequisites: [vector-arithmetic, vector-norms-unit-vectors]
        exemplars:
          - problem: 'Let $\mathbf{u} = (2, 1)$ and $\mathbf{v} = (1, -2)$. Compute $\|2\mathbf{u} - \mathbf{v}\|$.'
            answer: "5"
            solution_sketch: '$2\mathbf{u} - \mathbf{v} = (4 - 1, 2 + 2) = (3, 4)$; $\|(3, 4)\| = 5$.'
          - problem: 'Let $\mathbf{u} = (1, 0, 2)$ and $\mathbf{v} = (0, 2, 0)$. Compute $\|\mathbf{u} + \mathbf{v}\|$.'
            answer: "3"
            solution_sketch: '$\mathbf{u} + \mathbf{v} = (1, 2, 2)$; norm $3$.'
          - problem: 'Let $\mathbf{u} = (1, 2, 2)$. Compute $\|3\mathbf{u}\|$.'
            answer: "9"
            solution_sketch: '$\|3\mathbf{u}\| = 3\|\mathbf{u}\| = 3 \cdot 3$.'
          - problem: "Let u = (1, 2) and v = (-1, -3). Compute the norm of 3u - 2v."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 3u - 2v. Step 1, scalar multiplication: 3u = (3, 6) and -2v = (2, 6). Step 2, vector addition: 3u - 2v = (5, 12). Step 3, norm formula: sqrt(5^2 + 12^2) = sqrt(169) = 13. The answer is 13."
          - problem: "Let u = (1, 2) and v = (2, 2). Compute the norm of 2u + 2v."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 2u + 2v. Step 1, scalar multiplication: 2u = (2, 4) and 2v = (4, 4). Step 2, vector addition: 2u + 2v = (6, 8). Step 3, norm formula: sqrt(6^2 + 8^2) = sqrt(100) = 10. The answer is 10."
          - problem: "Let u = (1, 2, 2) and v = (1, 1, 4). Compute the norm of u + v."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is u + v. Step 1, vector addition: u + v = (2, 3, 6). Step 2, norm formula: sqrt(2^2 + 3^2 + 6^2) = sqrt(49) = 7. The answer is 7."
        constraints: "combinations designed to land on Pythagorean-friendly vectors; scalars in -3..3"
      - id: kp2
        name: Geometric reasoning with vectors
        key_prerequisites: [vector-arithmetic, vector-distance]
        exemplars:
          - problem: 'Find the midpoint of $P(2, 3)$ and $Q(6, 7)$ using $\frac{1}{2}(P + Q)$.'
            answer: "(4, 5)"
          - problem: 'Starting at $P(1, 1)$, you translate by $2(2, -1)$. Where do you end?'
            answer: "(5, -1)"
            solution_sketch: '$P + (4, -2) = (5, -1)$.'
          - problem: "The midpoint of P(-2, 5) and Q(8, -1) is M. Find the coordinates of M as (x, y)."
            answer: "(3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the midpoint rule M = (P + Q)/2. Compute P + Q = (-2,5)+(8,-1) = (6,4). Divide by 2: M = (3, 2)."
          - problem: 'Show that $A(1, 1)$, $B(3, 4)$, $C(5, 7)$ are collinear by computing $B - A$ and $C - B$; state the common difference vector.'
            answer: "(2, 3)"
            solution_sketch: '$B - A = (2, 3)$ and $C - B = (2, 3)$ are parallel and share the point $B$.'
          - problem: "Point Q is the reflection of P(1, 2) across M(4, 5). Find Q as (x, y)."
            answer: "(7, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The midpoint M is the average of P and Q, so P + Q = 2M. Compute 2M - P = (8,10) - (1,2) = (7,8). The reflected point is (7, 8)."
          - problem: "The points A(1, 2), B(3, 5), and C(7, k) are collinear. Find k."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For collinearity, the difference vectors B - A and C - B must be proportional. Compute B - A = (3,5)-(1,2) = (2,3). Since C - B = (4, k-5) and (4,6) = 2(2,3), k - 5 = 6, so k = 11. The value is 11."
        constraints: "integer coordinates; collinearity via equal or proportional difference vectors"
      - id: kp3
        name: Norm identities and comparisons
        key_prerequisites: [vector-norms-unit-vectors]
        exemplars:
          - problem: 'If $\|\mathbf{v}\| = 5$, what is $\|\mathbf{v}/5\|$?'
            answer: "1"
          - problem: 'Find all $k$ with $\|(k, 0)\| = 3$; give the answer as a set.'
            answer: '$\{-3, 3\}$'
            solution_sketch: '$\|(k, 0)\| = |k|$.'
          - problem: "For $u = (3, 0)$ and $v = (0, 4)$, compute $\\|u\\| + \\|v\\| - \\|u + v\\|$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is $\\|u\\| + \\|v\\| - \\|u + v\\|$, the gap in the triangle inequality. Step 1, compute the norms by the norm definition: $\\|u\\| = 3$ and $\\|v\\| = 4$. Step 2, add the vectors: $u + v = (3, 4)$, so $\\|u + v\\| = 5$. Step 3, subtract: $3 + 4 - 5 = 2$. The difference is 2."
          - problem: "For $v = (1, 2)$, compute $\\|3v\\|$ using the identity $\\|cv\\| = |c| \\, \\|v\\|$."
            answer: "3sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is $\\|3v\\|$ for $v = (1, 2)$. Step 1, compute the norm by the norm definition: $\\|v\\| = \\sqrt{1^2 + 2^2} = \\sqrt{5}$. Step 2, apply the scaling identity $\\|cv\\| = |c| \\, \\|v\\|$ with $c = 3$: $\\|3v\\| = 3\\sqrt{5}$. So the norm of $3v$ is 3sqrt(5)."
          - problem: "For $u = (8, 15)$ and $v = (-16, -30)$, compute $\\|u\\| + \\|v\\| - \\|u + v\\|$."
            answer: "34"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is $\\|u\\| + \\|v\\| - \\|u + v\\|$ for $u = (8, 15)$ and $v = (-16, -30)$. Step 1, compute the norms by the norm definition: $\\|u\\| = \\sqrt{64 + 225} = 17$ and $\\|v\\| = \\sqrt{256 + 900} = 34$, which also follows from the scaling identity since $v = -2u$. Step 2, add the vectors: $u + v = (-8, -15)$, so $\\|u + v\\| = 17$. Step 3, subtract: $17 + 34 - 17 = 34$. The triangle-inequality gap is 34."
          - problem: "For $w = (3, 4)$, find the positive scalar $c$ with $\\|cw\\| = 6$; give the answer as a fraction."
            answer: "6/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the positive scalar $c$ with $\\|cw\\| = 6$ for $w = (3, 4)$. Step 1, compute the norm by the norm definition: $\\|w\\| = \\sqrt{9 + 16} = 5$. Step 2, apply the scaling identity $\\|cw\\| = c \\, \\|w\\|$ for positive $c$: $5c = 6$. Step 3, solve the equation: $c = 6/5$. The scalar is 6/5."
        constraints: "clean integer norms; answers exact"
    diagnostic_exemplar:
      problem: 'Let $\mathbf{u} = (1, 1)$ and $\mathbf{v} = (5, 7)$. Using $\|c\mathbf{w}\| = |c|\,\|\mathbf{w}\|$, compute $\|\frac{1}{2}(\mathbf{u} + \mathbf{v})\|$, the distance from the origin to the midpoint of $\mathbf{u}$ and $\mathbf{v}$.'
      answer: '5'
      solution_sketch: '$\mathbf{u} + \mathbf{v} = (6, 8)$ has norm $10$, so half of it has norm $5$ (the midpoint is $(3, 4)$).'
    anki_seeds:
      - front: 'Triangle inequality for vectors?'
        back: '$\|\mathbf{u} + \mathbf{v}\| \leq \|\mathbf{u}\| + \|\mathbf{v}\|$.'
        type: basic
      - front: 'Midpoint of points $P$ and $Q$ via vectors?'
        back: '$\frac{1}{2}(P + Q)$.'
        type: basic

  - id: computing-dot-products
    name: Computing Dot Products
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-arithmetic
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Dot product of a vector with itself
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Let $\mathbf{u} = (3, 4)$. Compute $\mathbf{u} \cdot \mathbf{u}$, then check that it equals $\|\mathbf{u}\|^2$.'
            answer: "25"
            solution_sketch: '$9 + 16 = 25 = 5^2$; in general $\mathbf{u} \cdot \mathbf{u} = \|\mathbf{u}\|^2$.'
          - problem: 'If $\mathbf{u} \cdot \mathbf{u} = 49$, what is $\|\mathbf{u}\|$?'
            answer: "7"
          - problem: 'Compute $(1, 2, 2) \cdot (1, 2, 2)$.'
            answer: "9"
          - problem: "Let $\\mathbf{u} = (6, 8)$. Compute $\\mathbf{u} \\cdot \\mathbf{u}$, then check that it equals $\\|\\mathbf{u}\\|^2$."
            answer: "100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full object: $\\mathbf{u} = (6, 8)$. Rule: the dot product of a vector with itself is the sum of the squares of its components. Compute $6^2 + 8^2 = 36 + 64 = 100$. The length is $\\sqrt{100} = 10$, so $\\|\\mathbf{u}\\|^2 = 100$ checks. The answer is 100."
          - problem: "Let $\\mathbf{v} = (2, 6, 9)$. Compute $\\mathbf{v} \\cdot \\mathbf{v}$."
            answer: "121"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full object: $\\mathbf{v} = (2, 6, 9)$. Rule: a self-dot product in space adds the squares of the three components. Compute $2^2 + 6^2 + 9^2 = 4 + 36 + 81 = 121$. The answer is 121."
          - problem: "If $\\|\\mathbf{w}\\| = 13$, find $\\mathbf{w} \\cdot \\mathbf{w}$."
            answer: "169"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the identity $\\mathbf{w} \\cdot \\mathbf{w} = \\|\\mathbf{w}\\|^2$. Square the given length: $13^2 = 169$. Therefore $\\mathbf{w} \\cdot \\mathbf{w} = 169$. The answer is 169."
        constraints: "perfect-square self-products"
      - id: kp2
        name: Dot products in the plane
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $(2, 3) \cdot (4, -1)$.'
            answer: "5"
            solution_sketch: '$2 \cdot 4 + 3 \cdot (-1) = 8 - 3$.'
          - problem: 'Compute $(3, 4) \cdot (2, 5)$.'
            answer: "26"
          - problem: 'Compute $(-1, 6) \cdot (2, 1)$.'
            answer: "4"
          - problem: "Compute the dot product of $(5, -2)$ and $(-3, 4)$."
            answer: "-23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot product rule: multiply matching components and add. The dot product is (5)(-3) + (-2)(4). Compute the products: -15 and -8. Add them: -15 + (-8) = -23. The dot product is -23."
          - problem: "Find the dot product of $(-7, 2)$ and $(3, 8)$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot product rule: multiply matching components and add. The dot product is (-7)(3) + (2)(8). Compute the products: -21 and 16. Add them: -21 + 16 = -5. The dot product is -5."
          - problem: "The vectors $(3, k)$ and $(4, -6)$ are perpendicular. Find $k$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Perpendicular vectors have dot product zero. The dot product is (3)(4) + (k)(-6) = 12 - 6k. Set 12 - 6k = 0 and solve: 6k = 12, so k = 2. The value of k is 2."
        constraints: "integer components in -9..9"
      - id: kp3
        name: Dot products in space
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $(1, -2, 3) \cdot (2, 0, 1)$.'
            answer: "5"
          - problem: 'Compute $(2, 1, -1) \cdot (3, -2, 4)$.'
            answer: "0"
            solution_sketch: '$6 - 2 - 4 = 0$.'
          - problem: 'Compute $(1, 1, 1) \cdot (4, -2, 5)$.'
            answer: "7"
          - problem: "Compute $(3, -4, 2) \\cdot (1, 5, -3)$."
            answer: "-23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the dot product rule, multiply matching components and add: $(3)(1) + (-4)(5) + (2)(-3)$. The three products are $3$, $-20$, and $-6$. Their sum is $3 - 20 - 6 = -23$. The dot product is -23."
          - problem: "Compute $(-2, 6, 1) \\cdot (4, -1, 3)$."
            answer: "-11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the dot product rule, multiply matching components and add: $(-2)(4) + (6)(-1) + (1)(3)$. The products are $-8$, $-6$, and $3$. Their sum is $-8 - 6 + 3 = -11$. The dot product is -11."
          - problem: "For the vectors $(2, k, -3)$ and $(4, 1, 2)$, the dot product is $5$. Find $k$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $k$ be the missing component. By the dot product rule, $(2)(4) + (k)(1) + (-3)(2) = 5$. Simplify: $8 + k - 6 = 5$, so $k + 2 = 5$. Solve: $k = 3$. The value is 3."
        constraints: "integer components in -9..9; dimension 3"
    diagnostic_exemplar:
      problem: 'Compute $\mathbf{u} \cdot \mathbf{u}$ for $\mathbf{u} = (2, -3, 6)$.'
      answer: '49'
      solution_sketch: '$4 + 9 + 36 = 49$, which is $\|\mathbf{u}\|^2$ with $\|\mathbf{u}\| = 7$.'
    anki_seeds:
      - front: 'Formula for $\mathbf{u} \cdot \mathbf{v}$ in components?'
        back: '$u_1 v_1 + u_2 v_2 + \cdots + u_n v_n$.'
        type: basic
      - front: '$\mathbf{u} \cdot \mathbf{u} = $ ?'
        back: '$\|\mathbf{u}\|^2$.'
        type: basic

  - id: dot-product
    name: Dot Product, Angles, and Orthogonality
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: computing-dot-products
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.6
        key: true
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Orthogonality
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: "For u = (4, -2) and v = (1, 2), compute the dot product and decide whether the vectors are perpendicular. Give verdict and d."
            answer: "verdict = orthogonal; d = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["orthogonal"], ["nonorthogonal"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Compute the dot product of (4, -2) and (1, 2) using the dot product rule: 4*1 + (-2)*2 = 0. A zero dot product makes the vectors orthogonal. The wrong option nonorthogonal would come from treating a zero dot product as a nonzero one. verdict = orthogonal; d = 0."
          - problem: "For u = (1, 2, 3) and v = (2, 1, -1), compute the dot product and decide whether the vectors are perpendicular. Give verdict and d."
            answer: "verdict = nonorthogonal; d = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["orthogonal"], ["nonorthogonal"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Compute the dot product of (1, 2, 3) and (2, 1, -1) using the dot product rule: 1*2 + 2*1 + 3*(-1) = 1. A nonzero dot product means the vectors are not orthogonal. The wrong option orthogonal would come from treating a nonzero dot product as zero. verdict = nonorthogonal; d = 1."
          - problem: 'Find $k$ so that $(2, k)$ is orthogonal to $(3, -6)$.'
            answer: "k = 1"
            solution_sketch: '$6 - 6k = 0$ forces $k = 1$.'
          - problem: "Find k so that (k, 2, 1) is orthogonal to (2, -1, 4)."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the dot product of (k, 2, 1) and (2, -1, 4) using the dot product rule: 2k - 2 + 4 = 2k + 2. Set the dot product to zero for orthogonality: 2k + 2 = 0. Solve to get k = -1. The value is -1."
          - problem: "Find k so that (6, k) is orthogonal to (2, -3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the dot product of (6, k) and (2, -3) using the dot product rule: 12 - 3k. Orthogonality needs a zero dot product, so set 12 - 3k = 0. Solve to get k = 4. The value is 4."
          - problem: "Find k so that (2, k, 5) is orthogonal to (k, -1, 3)."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the dot product of (2, k, 5) and (k, -1, 3) using the dot product rule: 2k - k + 15 = k + 15. Set the dot product to zero: k + 15 = 0. Solve to get k = -15. The value is -15."
        constraints: "integer components; solve-for-k problems must have integer k"
      - id: kp2
        name: Acute, right, or obtuse from the sign
        key_prerequisites: [computing-dot-products, right-triangle-trig]
        exemplars:
          - problem: "For u = (2, 1) and v = (1, -3), find the dot product and state whether the angle is acute or obtuse."
            answer: "type = obtuse; dot = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "type"}, {"contract": {"kind": "exact"}, "name": "dot"}]}
            solution_sketch: "Compute the dot product: u dot v = (2)(1) + (1)(-3) = 2 - 3 = -1. A negative dot product means the angle is obtuse. The label acute would come from ignoring the negative sign. The answer is type = obtuse; dot = -1."
          - problem: "For u = (3, 1) and v = (1, 2), find the dot product and state whether the angle is acute or obtuse."
            answer: "type = acute; dot = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "type"}, {"contract": {"kind": "exact"}, "name": "dot"}]}
            solution_sketch: "Compute the dot product: u dot v = (3)(1) + (1)(2) = 3 + 2 = 5. A positive dot product means the angle is acute. The label obtuse would come from ignoring the positive sign. The answer is type = acute; dot = 5."
          - problem: "Find the positive value of k so that the angle between u = (1, 0) and v = (1, k) is 60 degrees."
            answer: "sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cos 60 = 1/2. The dot product is (1)(1) + (0)(k) = 1. The norms are |u| = 1 and |v| = sqrt(1 + k^2), so cos theta = 1 / sqrt(1 + k^2). Set 1 / sqrt(1 + k^2) = 1/2. Then sqrt(1 + k^2) = 2, so 1 + k^2 = 4 and k^2 = 3. The positive value is k = sqrt(3). The answer is sqrt(3)."
          - problem: "Find the value of k so that the angle between u = (1, 1) and v = (1, k) is right."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A right angle means the dot product is zero. Compute u dot v = (1)(1) + (1)(k) = 1 + k. Set 1 + k = 0 and solve: k = -1. The answer is -1."
          - problem: "Find the positive value of k so that the angle between u = (1, 0) and v = (k, 1) is 45 degrees."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cos 45 = 1/sqrt(2). The dot product is (1)(k) + (0)(1) = k. The norms are |u| = 1 and |v| = sqrt(k^2 + 1), so cos theta = k / sqrt(k^2 + 1). Set k / sqrt(k^2 + 1) = 1/sqrt(2). Square both sides: k^2 / (k^2 + 1) = 1/2, so 2k^2 = k^2 + 1 and k^2 = 1. The positive value is k = 1. The answer is 1."
          - problem: "Find all values of k so that the angle between u = (2, k) and v = (1, -3) is obtuse. Give the answer as an inequality in k."
            answer: "k > 2/3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "An obtuse angle means the dot product is negative. Compute u dot v = (2)(1) + (k)(-3) = 2 - 3k. Set 2 - 3k < 0. Solve: 3k > 2, so k > 2/3. The answer is k > 2/3."
        constraints: "sign questions use small integers; exact-angle questions target 30/45/60 degrees"
      - id: kp3
        name: Angle between vectors
        key_prerequisites: [computing-dot-products, right-triangle-trig]
        exemplars:
          - problem: "Find the angle between (1, 0) and (0, 1) in degrees."
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot-product angle formula: cos(theta) = u.v / (|u| |v|). Vectors u = (1, 0) and v = (0, 1). Dot product: u.v = 1*0 + 0*1 = 0. Norms: |u| = 1 and |v| = 1. Cosine: cos(theta) = 0 / (1*1) = 0. The angle in 0 to 180 degrees with cosine 0 is 90. The angle is 90."
          - problem: "Find the angle between (2, 2) and (-3, 0) in degrees."
            answer: "135"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot-product angle formula: cos(theta) = u.v / (|u| |v|). Vectors u = (2, 2) and v = (-3, 0). Dot product: u.v = 2*(-3) + 2*0 = -6. Norms: |u| = sqrt(8) = 2sqrt(2) and |v| = 3. Cosine: cos(theta) = -6 / (2sqrt(2)*3) = -1/sqrt(2). The angle in 0 to 180 degrees with cosine -1/sqrt(2) is 135. The angle is 135."
          - problem: 'Find $\cos\theta$ for the angle $\theta$ between $(1, 2)$ and $(2, 1)$.'
            answer: "4/5"
            solution_sketch: '$\cos\theta = \frac{2 + 2}{\sqrt{5}\sqrt{5}} = \frac{4}{5}$.'
          - problem: "Find the angle between (1, 1, 0) and (1, 0, 1) in degrees."
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot-product angle formula: cos(theta) = u.v / (|u| |v|). Vectors u = (1, 1, 0) and v = (1, 0, 1). Dot product: u.v = 1*1 + 1*0 + 0*1 = 1. Norms: |u| = sqrt(2) and |v| = sqrt(2). Cosine: cos(theta) = 1 / (sqrt(2)*sqrt(2)) = 1/2. The angle in 0 to 180 degrees with cosine 1/2 is 60. The angle is 60."
          - problem: "Find the angle between (1, 1, 0) and (-1, 0, 1) in degrees."
            answer: "120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot-product angle formula: cos(theta) = u.v / (|u| |v|). Vectors u = (1, 1, 0) and v = (-1, 0, 1). Dot product: u.v = 1*(-1) + 1*0 + 0*1 = -1. Norms: |u| = sqrt(2) and |v| = sqrt(2). Cosine: cos(theta) = -1 / (sqrt(2)*sqrt(2)) = -1/2. The angle in 0 to 180 degrees with cosine -1/2 is 120. The angle is 120."
          - problem: "Find the angle between (1, 2) and (-3, -6) in degrees."
            answer: "180"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the dot-product angle formula: cos(theta) = u.v / (|u| |v|). Vectors u = (1, 2) and v = (-3, -6). Dot product: u.v = 1*(-3) + 2*(-6) = -3 - 12 = -15. Norms: |u| = sqrt(5) and |v| = sqrt(45) = 3sqrt(5). Cosine: cos(theta) = -15 / (sqrt(5)*3sqrt(5)) = -15/15 = -1. The angle in 0 to 180 degrees with cosine -1 is 180. The angle is 180."
        constraints: "rig the numbers so cos(theta) is one of 0, +-1/2, +-1/sqrt(2), +-sqrt(3)/2, +-1, or a clean rational; angles in degrees"
    diagnostic_exemplar:
      problem: 'Find the angle between $\mathbf{u} = (3, 3)$ and $\mathbf{v} = (0, -5)$.'
      answer: '135 degrees'
      answer_contract: {kind: none}
      solution_sketch: '$\mathbf{u} \cdot \mathbf{v} = -15 < 0$ (obtuse); $\cos\theta = -15/(3\sqrt2 \cdot 5) = -1/\sqrt2$, so $\theta = 135^\circ$.'
    anki_seeds:
      - front: 'Angle formula linking the dot product and the norms of $\mathbf{u}, \mathbf{v}$?'
        back: '$\cos\theta = \dfrac{\mathbf{u} \cdot \mathbf{v}}{\|\mathbf{u}\|\,\|\mathbf{v}\|}$.'
        type: basic
      - front: 'Two nonzero vectors are orthogonal exactly when their dot product is...'
        back: 'zero'
        type: basic

  - id: dot-product-properties
    name: Algebraic Properties of the Dot Product
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: dot-product
        weight: 0.7
        key: true
      - id: computing-dot-products
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Symmetry, distributivity, and scalars
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: 'If $\mathbf{u} \cdot \mathbf{v} = 3$, what is $\mathbf{v} \cdot \mathbf{u}$?'
            answer: "3"
            solution_sketch: 'The dot product is symmetric.'
          - problem: 'Given $\mathbf{u} \cdot \mathbf{v} = 2$ and $\mathbf{u} \cdot \mathbf{w} = -5$, compute $\mathbf{u} \cdot (\mathbf{v} + \mathbf{w})$.'
            answer: "-3"
            solution_sketch: 'Distributivity: $2 + (-5)$.'
          - problem: 'Given $\mathbf{u} \cdot \mathbf{v} = 4$, compute $(2\mathbf{u}) \cdot \mathbf{v}$.'
            answer: "8"
            solution_sketch: 'Scalars pull out: $2(\mathbf{u} \cdot \mathbf{v})$.'
          - problem: "Suppose $\\mathbf{u} \\cdot \\mathbf{v} = 5$. Compute $\\mathbf{v} \\cdot (3\\mathbf{u})$."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By symmetry, $\\mathbf{v} \\cdot (3\\mathbf{u}) = (3\\mathbf{u}) \\cdot \\mathbf{v}$. By the scalar rule, $(3\\mathbf{u}) \\cdot \\mathbf{v} = 3(\\mathbf{u} \\cdot \\mathbf{v})$. Substitute $5$: $3 \\cdot 5 = 15$. The answer is 15."
          - problem: "Let $\\mathbf{u} \\cdot (\\mathbf{v} + \\mathbf{w}) = 9$ and $\\mathbf{u} \\cdot \\mathbf{v} = 4$. Find $\\mathbf{u} \\cdot \\mathbf{w}$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By distributivity, $\\mathbf{u} \\cdot (\\mathbf{v} + \\mathbf{w}) = \\mathbf{u} \\cdot \\mathbf{v} + \\mathbf{u} \\cdot \\mathbf{w}$. Substitute the known values: $9 = 4 + \\mathbf{u} \\cdot \\mathbf{w}$. Subtract $4$: $\\mathbf{u} \\cdot \\mathbf{w} = 5$. The answer is 5."
          - problem: "Suppose $\\mathbf{u} \\cdot \\mathbf{v} = -2$. Compute $(3\\mathbf{u}) \\cdot (-2\\mathbf{v})$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Pull out both scalars: $(3\\mathbf{u}) \\cdot (-2\\mathbf{v}) = 3(-2)(\\mathbf{u} \\cdot \\mathbf{v})$. This equals $-6(\\mathbf{u} \\cdot \\mathbf{v})$ by the scalar rule. Substitute $-2$: $-6 \\cdot -2 = 12$. The answer is 12."
        constraints: "symbolic data with small integer dot products"
      - id: kp2
        name: Expanding norms of sums
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Given $\|\mathbf{u}\| = 3$, $\|\mathbf{v}\| = 4$, and $\mathbf{u} \cdot \mathbf{v} = 0$, find $\|\mathbf{u} + \mathbf{v}\|$.'
            answer: "5"
            solution_sketch: '$\|\mathbf{u} + \mathbf{v}\|^2 = 9 + 0 + 16 = 25$.'
          - problem: 'Given $\|\mathbf{u}\| = 2$, $\|\mathbf{v}\| = 1$, and $\mathbf{u} \cdot \mathbf{v} = 1$, compute $\|\mathbf{u} + \mathbf{v}\|^2$.'
            answer: "7"
            solution_sketch: '$4 + 2 \cdot 1 + 1 = 7$.'
          - problem: "Given $\\|\\mathbf{u}\\| = \\|\\mathbf{v}\\| = 2$, compute $(\\mathbf{u} + \\mathbf{v}) \\cdot (\\mathbf{u} - \\mathbf{v})$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: expand by bilinearity of the dot product: (u+v)·(u-v) = u·u - u·v + v·u - v·v. Step 2: use symmetry u·v = v·u and the definition of norm to get ||u||^2 - ||v||^2. Step 3: substitute ||u|| = ||v|| = 2, giving 4 - 4 = 0. The value is 0."
          - problem: "Given $\\|\\mathbf{u}\\| = 2$, $\\|\\mathbf{v}\\| = 5$, and $\\mathbf{u} \\cdot \\mathbf{v} = -3$, compute $\\|\\mathbf{u} + \\mathbf{v}\\|^2$."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the norm-sum identity ||u+v||^2 = ||u||^2 + 2u·v + ||v||^2. Step 2: substitute ||u|| = 2, ||v|| = 5, and u·v = -3 to get 4 + 2(-3) + 25. Step 3: simplify 4 - 6 + 25 = 23. The value is 23."
          - problem: "Given $\\|\\mathbf{u}\\| = 6$, $\\|\\mathbf{v}\\| = 3$, and $\\mathbf{u} \\cdot \\mathbf{v} = 4$, compute $\\|\\mathbf{u} - \\mathbf{v}\\|^2$."
            answer: "37"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the difference identity ||u-v||^2 = ||u||^2 - 2u·v + ||v||^2. Step 2: substitute ||u|| = 6, ||v|| = 3, and u·v = 4 to get 36 - 2(4) + 9. Step 3: simplify 36 - 8 + 9 = 37. The value is 37."
          - problem: "Given $\\|\\mathbf{u}\\|^2 = 16$, $\\|\\mathbf{v}\\|^2 = 25$, and $\\|\\mathbf{u} + \\mathbf{v}\\|^2 = 49$, find $\\mathbf{u} \\cdot \\mathbf{v}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the norm-sum identity ||u+v||^2 = ||u||^2 + 2u·v + ||v||^2. Step 2: substitute 49 = 16 + 2u·v + 25. Step 3: solve 49 - 41 = 2u·v, so u·v = 4. The value is 4."
        constraints: "use the identity ||u+v||^2 = ||u||^2 + 2 u.v + ||v||^2 with small integer data"
      - id: kp3
        name: Verifying identities numerically
        key_prerequisites: [computing-dot-products, dot-product]
        exemplars:
          - problem: "For u = (2, 1), v = (1, 3), w = (4, -2), evaluate both sides of u · (v + w) = u · v + u · w. Find the common value."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is u · (v + w) = u · v + u · w with u = (2, 1), v = (1, 3), w = (4, -2). First compute the left side by vector addition and the dot product rule: v + w = (5, 1), so u · (v + w) = 2*5 + 1*1 = 11. Next compute the right side by the distributive rule: u · v = 2*1 + 1*3 = 5 and u · w = 2*4 + 1*(-2) = 6, so the sum is 11. The common value is 11."
          - problem: "For u = (1, 1), v = (3, 0), evaluate both sides of ||u + v||^2 = ||u||^2 + 2 u · v + ||v||^2. Give the common value."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is ||u + v||^2 = ||u||^2 + 2 u · v + ||v||^2 with u = (1, 1), v = (3, 0). First compute the left side by vector addition and the norm-squared rule: u + v = (4, 1), so ||u + v||^2 = 4^2 + 1^2 = 17. Next compute the right side by the norm-squared rule and the dot product rule: ||u||^2 = 1^2 + 1^2 = 2, u · v = 1*3 + 1*0 = 3, ||v||^2 = 3^2 + 0^2 = 9, so 2 + 2*3 + 9 = 17. The common value is 17."
          - problem: "For u = (3, 1) and v = (1, 2), evaluate both sides of (u + v) · (u - v) = ||u||^2 - ||v||^2. Find the common value."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is (u + v) · (u - v) = ||u||^2 - ||v||^2 with u = (3, 1), v = (1, 2). First compute the left side by vector addition, subtraction, and the dot product rule: u + v = (4, 3) and u - v = (2, -1), so (u + v) · (u - v) = 4*2 + 3*(-1) = 5. Next compute the right side by the norm-squared rule: ||u||^2 = 3^2 + 1^2 = 10 and ||v||^2 = 1^2 + 2^2 = 5, so the difference is 5. The common value is 5."
          - problem: "For c = 3, u = (1, 2), v = (2, -1), evaluate both sides of (c u) · v = c (u · v). Find the common value."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is (c u) · v = c (u · v) with c = 3, u = (1, 2), v = (2, -1). First compute the left side by scalar multiplication and the dot product rule: c u = (3, 6), so (c u) · v = 3*2 + 6*(-1) = 0. Next compute the right side by the dot product rule and scalar multiplication: u · v = 1*2 + 2*(-1) = 0, so c (u · v) = 3*0 = 0. The common value is 0."
          - problem: "For u = (2, -1) and v = (3, 4), evaluate both sides of u · v = v · u. Give the common value."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is u · v = v · u with u = (2, -1), v = (3, 4). First compute the left side by the dot product rule: u · v = 2*3 + (-1)*4 = 2. Next compute the right side by the dot product rule: v · u = 3*2 + 4*(-1) = 2. The common value is 2."
          - problem: "For u = (2, 1), v = (1, 3), w = (1, -1), evaluate both sides of (u + v) · w = u · w + v · w. Find the common value."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity is (u + v) · w = u · w + v · w with u = (2, 1), v = (1, 3), w = (1, -1). First compute the left side by vector addition and the dot product rule: u + v = (3, 4), so (u + v) · w = 3*1 + 4*(-1) = -1. Next compute the right side by the distributive rule: u · w = 2*1 + 1*(-1) = 1 and v · w = 1*1 + 3*(-1) = -2, so the sum is -1. The common value is -1."
        constraints: "small integer vectors; both sides must evaluate to the same clean number"
    diagnostic_exemplar:
      problem: 'Given $\|\mathbf{u}\| = 5$, $\|\mathbf{v}\| = 2$, and $\mathbf{u} \cdot \mathbf{v} = 3$, compute $\|\mathbf{u} + \mathbf{v}\|^2$.'
      answer: "35"
      solution_sketch: '$25 + 2 \cdot 3 + 4 = 35$.'
    anki_seeds:
      - front: '$\|\mathbf{u} + \mathbf{v}\|^2$ expanded via dot products?'
        back: '$\|\mathbf{u}\|^2 + 2\,\mathbf{u} \cdot \mathbf{v} + \|\mathbf{v}\|^2$.'
        type: basic
      - front: 'Cauchy-Schwarz inequality?'
        back: '$|\mathbf{u} \cdot \mathbf{v}| \leq \|\mathbf{u}\|\,\|\mathbf{v}\|$.'
        type: basic

  - id: cross-product
    name: Cross Product
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
      - id: dot-product
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Computing cross products
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Compute $(1, 0, 0) \times (0, 1, 0)$.'
            answer: "(0, 0, 1)"
            solution_sketch: 'Standard basis: $\mathbf{i} \times \mathbf{j} = \mathbf{k}$.'
          - problem: 'Compute $(1, 2, 3) \times (4, 5, 6)$.'
            answer: "(-3, 6, -3)"
            solution_sketch: 'Components: $(2 \cdot 6 - 3 \cdot 5,\; 3 \cdot 4 - 1 \cdot 6,\; 1 \cdot 5 - 2 \cdot 4)$.'
          - problem: 'Compute $(2, 1, -1) \times (0, 3, 2)$.'
            answer: "(5, -4, 6)"
            solution_sketch: '$(1 \cdot 2 - (-1) \cdot 3,\; (-1) \cdot 0 - 2 \cdot 2,\; 2 \cdot 3 - 1 \cdot 0)$.'
          - problem: "Compute (2, -1, 1) x (1, 2, -2). Give the answer as (x, y, z)."
            answer: "(0, 5, 5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Cross product formula: (a1,a2,a3) x (b1,b2,b3) = (a2b3-a3b2, a3b1-a1b3, a1b2-a2b1). For a = (2,-1,1) and b = (1,2,-2), the components are (-1)(-2) - (1)(2) = 0, (1)(1) - (2)(-2) = 5, and (2)(2) - (-1)(1) = 5. The cross product is (0, 5, 5)."
          - problem: "Compute the cross product of u = (2, -2, 1) and v = (1, 1, -1). Give the answer as (x, y, z)."
            answer: "(1, 3, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Cross product formula: for u = (u1,u2,u3) and v = (v1,v2,v3), u x v = (u2v3-u3v2, u3v1-u1v3, u1v2-u2v1). With u = (2,-2,1) and v = (1,1,-1), the components are (-2)(-1) - (1)(1) = 1, (1)(1) - (2)(-1) = 3, and (2)(1) - (-2)(1) = 4. The cross product is (1, 3, 4)."
          - problem: "The cross product (a, 2, -1) x (3, -2, 1) is (0, -4, -8). Find a."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cross product formula: (a,2,-1) x (3,-2,1) = (2*1 - (-1)*(-2), (-1)*3 - a*1, a*(-2) - 2*3) = (0, -3 - a, -2a - 6). The given second component is -4, so -3 - a = -4, which gives a = 1. The value is 1."
        constraints: "integer components in -6..6; only 3-dimensional vectors"
      - id: kp2
        name: Algebraic properties
        key_prerequisites: [vectors-in-rn, dot-product]
        exemplars:
          - problem: 'If $\mathbf{u} \times \mathbf{v} = (5, -4, 6)$, what is $\mathbf{v} \times \mathbf{u}$?'
            answer: "(-5, 4, -6)"
            solution_sketch: 'The cross product is anticommutative: $\mathbf{v} \times \mathbf{u} = -(\mathbf{u} \times \mathbf{v})$.'
          - problem: 'Compute $(3, -2, 7) \times (3, -2, 7)$.'
            answer: "(0, 0, 0)"
            solution_sketch: '$\mathbf{u} \times \mathbf{u} = \mathbf{0}$ for every vector.'
          - problem: 'Verify that $(1, 2, 3) \times (4, 5, 6) = (-3, 6, -3)$ is orthogonal to $(1, 2, 3)$: compute $(-3, 6, -3) \cdot (1, 2, 3)$.'
            answer: "0"
            solution_sketch: '$-3 + 12 - 9 = 0$, so the cross product is orthogonal to the first factor.'
          - problem: "Let u cross v = (2, -7, 4). Find v cross u as (x, y, z)."
            answer: "(-2, 7, -4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Anticommutativity rule: v cross u = -(u cross v). The given u cross v is (2, -7, 4). Negating each component gives (-2, 7, -4). The answer is (-2, 7, -4)."
          - problem: "Compute (4, -1, 5) cross (4, -1, 5). Give the answer as (x, y, z)."
            answer: "(0, 0, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Self-cross rule: any vector crossed with itself gives the zero vector. The vector is (4, -1, 5), so (4, -1, 5) cross (4, -1, 5) = (0, 0, 0). The answer is (0, 0, 0)."
          - problem: "Let u = (2, -1, 3) and v = (1, 4, -2). It is known that u cross v = (-10, 7, 9). Compute (-10, 7, 9) dot v."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Orthogonality property: the cross product u cross v is orthogonal to v. Check by computing the dot product: (-10)(1) + (7)(4) + (9)(-2) = -10 + 28 - 18. The answer is 0."
        constraints: "test anticommutativity, u x u = 0, and orthogonality of the result to both factors"
      - id: kp3
        name: Areas via cross products
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Find the area of the parallelogram spanned by $(3, 0, 0)$ and $(0, 4, 0)$.'
            answer: "12"
            solution_sketch: 'Cross product is $(0, 0, 12)$; its norm is the area.'
          - problem: 'Find the area of the parallelogram spanned by $(1, 2, 2)$ and $(2, 1, -2)$.'
            answer: "9"
            solution_sketch: 'Cross product $(-6, 6, -3)$; $\sqrt{36 + 36 + 9} = \sqrt{81} = 9$.'
          - problem: 'Find the area of the triangle with edge vectors $(2, 1, 0)$ and $(1, 3, 0)$.'
            answer: "5/2"
            solution_sketch: 'Cross product $(0, 0, 5)$; triangle area is half the parallelogram: $\frac{5}{2}$.'
          - problem: "A triangle has edge vectors (2, 2, 1) and (2, -1, -2). Find its area."
            answer: "9/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The edge vectors are (2, 2, 1) and (2, -1, -2), and their cross product is (-3, 6, -6). By the cross product rule the norm is sqrt(9 + 36 + 36) = 9. By the triangle rule the area is half of the parallelogram area, so the area is 9/2."
          - problem: "A parallelogram has adjacent sides (1, 0, 0) and (0, 3, 4). Find its area."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjacent sides are (1, 0, 0) and (0, 3, 4), and their cross product is (0, -4, 3). By the cross product rule the norm is sqrt(0 + 16 + 9) = 5. By the parallelogram rule this norm is the area, so the area is 5."
          - problem: "A triangle has vertices A = (0, 0, 0), B = (1, 0, 0), C = (0, 3, 4). Find its area."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The vertices give edge vectors (1, 0, 0) and (0, 3, 4), and their cross product is (0, -4, 3). By the cross product rule the norm is sqrt(0 + 16 + 9) = 5. By the triangle rule the area is half of 5, so the area is 5/2."
        constraints: "choose vectors so the cross product has a clean integer norm (e.g. norm-9 or norm-5 patterns); halve for triangles"
    diagnostic_exemplar:
      problem: 'Find the area of the parallelogram spanned by $(3, 0, 4)$ and $(0, 5, 0)$.'
      answer: '25'
      solution_sketch: 'The cross product is $(0\cdot0 - 4\cdot5,\ 4\cdot0 - 3\cdot0,\ 3\cdot5 - 0\cdot0) = (-20, 0, 15)$, whose norm is $25$.'
    anki_seeds:
      - front: 'Direction of $\mathbf{u} \times \mathbf{v}$ relative to $\mathbf{u}$ and $\mathbf{v}$?'
        back: 'Orthogonal to both, oriented by the right-hand rule.'
        type: basic
      - front: 'Geometric meaning of $\|\mathbf{u} \times \mathbf{v}\|$?'
        back: 'The area of the parallelogram spanned by $\mathbf{u}$ and $\mathbf{v}$.'
        type: basic
      - front: '$\mathbf{v} \times \mathbf{u} = $ {{c1::$-(\mathbf{u} \times \mathbf{v})$}} (anticommutativity).'
        back: '$-(\mathbf{u} \times \mathbf{v})$'
        type: cloze

  - id: vector-projections
    name: Vector Projections
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: dot-product
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.6
    knowledge_points:
      - id: kp1
        name: Scalar projection (component along a vector)
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Find the scalar projection of $\mathbf{u} = (3, 4)$ onto $\mathbf{v} = (1, 0)$.'
            answer: "3"
            solution_sketch: '$\mathrm{comp}_{\mathbf{v}}\mathbf{u} = \frac{\mathbf{u} \cdot \mathbf{v}}{\|\mathbf{v}\|} = \frac{3}{1}$.'
          - problem: 'Find the scalar projection of $\mathbf{u} = (4, 2)$ onto $\mathbf{v} = (3, 4)$.'
            answer: "4"
            solution_sketch: '$\mathbf{u} \cdot \mathbf{v} = 12 + 8 = 20$; $\|\mathbf{v}\| = 5$; $20/5 = 4$.'
          - problem: "Find the scalar projection of u = (6, 8) onto v = (3, 4)."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the scalar projection formula: the scalar projection of u onto v is (u dot v) divided by the norm of v. Compute u dot v = 6*3 + 8*4 = 50 and the norm of v = sqrt(3^2 + 4^2) = 5. Divide 50 by 5 to get 10. The scalar projection is 10."
          - problem: "Find the scalar projection of u = (1, 1, 1) onto v = (1, 2, 2)."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the scalar projection formula: comp_v u = (u dot v) / norm of v. Compute u dot v = 1*1 + 1*2 + 1*2 = 5. The norm of v = sqrt(1 + 4 + 4) = 3. Divide 5 by 3. The scalar projection is 5/3."
          - problem: "Find the scalar projection of u = (4, -2) onto v = (0, 1)."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the scalar projection formula and note that the norm of v = 1. Compute u dot v = 4*0 + (-2)*1 = -2. Divide by the norm of v = 1. The scalar projection is -2."
          - problem: "The scalar projection of u = (x, 1) onto v = (3, 4) is 1. Find x."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the scalar projection formula to write (u dot v) / norm of v = (3x + 4)/5. The norm of v is 5, so set (3x + 4)/5 = 1. Multiply by 5 to get 3x + 4 = 5, so 3x = 1. The value of x is 1/3."
        constraints: "pick v with integer norm (multiples of (3,4), (1,0), (0,1), (1,2,2)); integer or simple fraction answers"
      - id: kp2
        name: Vector projection
        key_prerequisites: [dot-product, vectors-in-rn]
        exemplars:
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u} = (3, 1)$, $\mathbf{v} = (2, 0)$.'
            answer: "(3, 0)"
            solution_sketch: '$\frac{\mathbf{u} \cdot \mathbf{v}}{\mathbf{v} \cdot \mathbf{v}}\mathbf{v} = \frac{6}{4}(2, 0)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u} = (2, 6)$, $\mathbf{v} = (1, 1)$.'
            answer: "(4, 4)"
            solution_sketch: '$\frac{2 + 6}{1 + 1}(1, 1) = 4(1, 1)$.'
          - problem: 'Compute $\mathrm{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u} = (3, 4)$, $\mathbf{v} = (2, 1)$.'
            answer: "(4, 2)"
            solution_sketch: '$\frac{6 + 4}{4 + 1}(2, 1) = 2(2, 1)$.'
        constraints: "rig u . v / v . v to be an integer or half-integer; never let u be a multiple of v"
      - id: kp3
        name: Orthogonal decomposition
        key_prerequisites: [dot-product, vectors-in-rn]
        exemplars:
          - problem: 'Write $\mathbf{u} = (3, 1)$ as $\mathbf{u} = \mathbf{p} + \mathbf{w}$ with $\mathbf{p}$ parallel to $\mathbf{v} = (1, 1)$ and $\mathbf{w}$ orthogonal to $\mathbf{v}$; state the pair $(\mathbf{p}, \mathbf{w})$.'
            answer: "((2, 2), (1, -1))"
            solution_sketch: '$\mathbf{p} = \frac{4}{2}(1,1) = (2,2)$; $\mathbf{w} = \mathbf{u} - \mathbf{p} = (1, -1)$; check $\mathbf{w} \cdot \mathbf{v} = 0$.'
          - problem: 'Decompose $\mathbf{u} = (5, 0)$ into components parallel and orthogonal to $\mathbf{v} = (1, 2)$; state the pair $(\mathbf{p}, \mathbf{w})$.'
            answer: "((1, 2), (4, -2))"
            solution_sketch: '$\frac{5}{5}(1, 2) = (1, 2)$; remainder $(4, -2)$ satisfies $(4)(1) + (-2)(2) = 0$.'
          - problem: "Write u = (4, 7) as u = p + w, where p is parallel to v = (2, 1) and w is orthogonal to v. Give the answer as p = (x, y) and w = (x, y)."
            answer: "p = (6, 3); w = (-2, 4)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "p"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "w"}]}
            solution_sketch: "The decomposition is p = (6, 3); w = (-2, 4). Projection formula: p = (u dot v / v dot v) v. Here u dot v = 4(2) + 7(1) = 15 and v dot v = 2^2 + 1^2 = 5, so p = (15/5)(2, 1) = (6, 3). Subtract: w = u - p = (4, 7) - (6, 3) = (-2, 4), and the check w dot v = (-2)(2) + (4)(1) = 0 holds. Thus the answer is p = (6, 3); w = (-2, 4)."
          - problem: "Decompose u = (7, 4) into a component p parallel to v = (2, 3) and a component w orthogonal to v. Give the answer as p = (x, y) and w = (x, y)."
            answer: "p = (4, 6); w = (3, -2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "p"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "w"}]}
            solution_sketch: "The decomposition is p = (4, 6); w = (3, -2). Projection formula: p = (u dot v / v dot v) v. Compute u dot v = 7(2) + 4(3) = 26 and v dot v = 2^2 + 3^2 = 13, so p = (26/13)(2, 3) = (4, 6). Subtract: w = u - p = (7, 4) - (4, 6) = (3, -2). The orthogonality check is w dot v = 3(2) + (-2)(3) = 0, so the final answer is p = (4, 6); w = (3, -2)."
          - problem: "Write u = (5, -5) as u = p + w with p parallel to v = (1, -2) and w orthogonal to v. Give the answer as p = (x, y) and w = (x, y)."
            answer: "p = (3, -6); w = (2, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "p"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "w"}]}
            solution_sketch: "The decomposition is p = (3, -6); w = (2, 1). Use p = (u dot v / v dot v) v. Here u dot v = 5(1) + (-5)(-2) = 15 and v dot v = 1^2 + (-2)^2 = 5, so p = (15/5)(1, -2) = (3, -6). The remainder is w = u - p = (5, -5) - (3, -6) = (2, 1). Check w dot v = 2(1) + 1(-2) = 0, so the answer is p = (3, -6); w = (2, 1)."
          - problem: "Write u = (3, 1, 2) as u = p + w, where p is parallel to v = (1, 1, 1) and w is orthogonal to v. Give the answer as p = (x, y, z) and w = (x, y, z)."
            answer: "p = (2, 2, 2); w = (1, -1, 0)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "p"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "w"}]}
            solution_sketch: "The decomposition is p = (2, 2, 2); w = (1, -1, 0). Projection formula: p = (u dot v / v dot v) v. Compute u dot v = 3(1) + 1(1) + 2(1) = 6 and v dot v = 1^2 + 1^2 + 1^2 = 3, so p = (6/3)(1, 1, 1) = (2, 2, 2). Subtract: w = u - p = (3, 1, 2) - (2, 2, 2) = (1, -1, 0). Check w dot v = 1(1) + (-1)(1) + 0(1) = 0, so the answer is p = (2, 2, 2); w = (1, -1, 0)."
        constraints: "choose data so both components have integer entries; always verify w . v = 0"
    diagnostic_exemplar:
      problem: 'Write $\mathbf{u} = (4, 8)$ as $\mathbf{u} = \mathbf{p} + \mathbf{w}$ with $\mathbf{p}$ parallel to $\mathbf{v} = (1, 1)$ and $\mathbf{w}$ orthogonal to $\mathbf{v}$; state the pair $(\mathbf{p}, \mathbf{w})$.'
      answer: '((6, 6), (-2, 2))'
      solution_sketch: '$\mathbf{p} = \frac{(4 + 8)}{2}(1, 1) = (6, 6)$ and $\mathbf{w} = (4, 8) - (6, 6) = (-2, 2)$, which satisfies $\mathbf{w} \cdot \mathbf{v} = 0$.'
    anki_seeds:
      - front: 'Formula for the vector projection of $\mathbf{u}$ onto $\mathbf{v}$?'
        back: '$\mathrm{proj}_{\mathbf{v}}\mathbf{u} = \dfrac{\mathbf{u} \cdot \mathbf{v}}{\mathbf{v} \cdot \mathbf{v}}\,\mathbf{v}$.'
        type: basic
      - front: 'In the decomposition $\mathbf{u} = \mathrm{proj}_{\mathbf{v}}\mathbf{u} + \mathbf{w}$, the vector $\mathbf{w}$ is...'
        back: 'orthogonal to $\mathbf{v}$'
        type: basic
