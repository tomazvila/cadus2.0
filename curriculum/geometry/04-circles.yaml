        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Perpendicular from the center bisects a chord
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'A circle has radius $10$; a chord measures $16$. Find the distance from the center to the chord.'
            answer: "6"
            solution_sketch: 'The perpendicular from the center bisects the chord: $\sqrt{10^2 - 8^2} = 6$.'
          - problem: 'A chord lies $12$ units from the center of a circle with radius $13$. Find the chord''s length.'
            answer: "10"
            answer_contract: {kind: exact}
            solution_sketch: 'Half the chord is $\sqrt{169 - 144} = 5$. The chord is twice that, so its length is $10$.'
          - problem: 'A circle has radius $13$; a chord measures $24$. Find the distance from the center to the chord.'
            answer: "5"
            solution_sketch: 'Half-chord $12$; $\sqrt{13^2 - 12^2} = 5$.'
          - problem: 'A chord lies $3$ units from the center of a circle with radius $5$. Find the chord''s length.'
            answer: "8"
            solution_sketch: 'Half-chord $= \sqrt{25 - 9} = 4$, so the chord is $8$.'
        constraints: "half-chord, distance, radius form a Pythagorean triple"
      - id: kp2
        name: Congruent chords, arcs, and distances
        key_prerequisites: [central-angles-arcs]
        exemplars:
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ of a circle are congruent, and arc $AB$ measures $75^\circ$. Find arc $CD$, in degrees.'
            answer: "75"
            solution_sketch: 'Congruent chords cut off congruent arcs.'
          - problem: 'Two chords of a circle are both $9$ units long. The first lies $4$ units from the center. How far from the center is the second?'
            answer: "4"
            solution_sketch: 'Congruent chords are equidistant from the center.'
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ of a circle are congruent, and arc $CD$ measures $130^\circ$. Find arc $AB$, in degrees.'
            answer: "130"
            solution_sketch: 'Congruent chords cut off congruent arcs, so arc $AB = 130^\circ$.'
          - problem: 'Two congruent chords of a circle: the second lies $7$ units from the center. How far from the center is the first?'
            answer: "7"
            solution_sketch: 'Congruent chords are equidistant from the center.'
        constraints: "congruent chords <-> congruent arcs <-> equal distances"
      - id: kp3
        name: Find the radius from a chord
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'A chord of length $24$ lies $5$ units from the center of a circle. Find the radius.'
            answer: "13"
            solution_sketch: '$r = \sqrt{12^2 + 5^2} = 13$.'
          - problem: 'A chord of length $40$ lies $21$ units from the center. Find the radius.'
            answer: "29"
            solution_sketch: '$r = \sqrt{20^2 + 21^2} = 29$.'
          - problem: 'A chord of length $16$ lies $6$ units from the center of a circle. Find the radius.'
            answer: "10"
            solution_sketch: '$r = \sqrt{8^2 + 6^2} = 10$.'
