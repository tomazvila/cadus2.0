  - id: chords-tangents-arcs
    name: Chords, Tangents, and Arcs
    core: false                # terminal circle-theorem branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: tangent-properties
        weight: 0.7
        key: true
      - id: chord-properties
        weight: 0.7
        key: true
      - id: central-inscribed-angles
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Intersecting chords - segment products
        key_prerequisites: [chord-properties]
        exemplars:
          - problem: 'Two chords intersect inside a circle. One is split into segments $3$ and $8$; the other into $4$ and $x$. Find $x$.'
            answer: "6"
            solution_sketch: '$3 \cdot 8 = 4x \Rightarrow x = 6$.'
          - problem: 'Two chords intersect inside a circle. One is split into segments $2$ and $12$; the other into $6$ and $x$. Find $x$.'
            answer: "4"
            solution_sketch: '$2 \cdot 12 = 6x \Rightarrow x = 4$.'
          - problem: 'Two chords intersect inside a circle. One is split into segments $5$ and $6$; the other into $3$ and $x$. Find $x$.'
            answer: "10"
            solution_sketch: '$5 \cdot 6 = 3x \Rightarrow x = 10$.'
          - problem: 'Two chords intersect inside a circle. One is split into segments $9$ and $4$; the other into $12$ and $x$. Find $x$.'
            answer: "3"
            answer_contract: {kind: exact}
            solution_sketch: 'The products of the segments of the two chords are equal. So $9 \cdot 4 = 12x$, and $x = 3$.'
        constraints: "products equal; integer answers"
      - id: kp2
        name: Intersecting chords - angle measures
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two chords intersect inside a circle, forming an angle that intercepts arcs of $70^\circ$ and $110^\circ$. Find the angle, in degrees.'
            answer: "90"
            solution_sketch: 'The angle is half the sum of the intercepted arcs: $\frac{70 + 110}{2} = 90$.'
          - problem: 'Two chords intersect inside a circle, forming an angle that intercepts arcs of $55^\circ$ and $89^\circ$. Find the angle, in degrees.'
            answer: "72"
            solution_sketch: '$\frac{55 + 89}{2} = 72$.'
          - problem: 'Two chords intersect inside a circle, forming an angle that intercepts arcs of $100^\circ$ and $40^\circ$. Find the angle, in degrees.'
            answer: "70"
            solution_sketch: '$\frac{100 + 40}{2} = 70$.'
          - problem: 'Two chords intersect inside a circle, forming an angle of $80^\circ$ that intercepts an arc of $100^\circ$. Find the other intercepted arc, in degrees.'
            answer: "60"
            solution_sketch: '$\frac{100 + x}{2} = 80 \Rightarrow x = 60$.'
        constraints: "angle = half the arc sum; arc sums even"
      - id: kp3
        name: Combined chord and tangent computations
        key_prerequisites: [tangent-properties, chord-properties]
        exemplars:
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 4$, $PB = 9$, and $CP = 6$. Find the length of chord $\overline{CD}$.'
            answer: "12"
            solution_sketch: '$4 \cdot 9 = 6 \cdot PD \Rightarrow PD = 6$; $CD = 6 + 6 = 12$.'
          - problem: 'In a circle of radius $10$, a chord lies $6$ from the center, and a tangent is drawn from a point $P$ with $OP = 26$. Find (chord length) $+$ (tangent length).'
            answer: "40"
            solution_sketch: 'Chord $= 2\sqrt{100 - 36} = 16$; tangent $= \sqrt{26^2 - 10^2} = 24$; sum $= 40$.'
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 6$, $PB = 10$, and $CP = 5$. Find the length of chord $\overline{CD}$.'
            answer: "17"
            solution_sketch: '$6 \cdot 10 = 5 \cdot PD \Rightarrow PD = 12$; $CD = CP + PD = 5 + 12 = 17$.'
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 8$, $PB = 6$, and $CP = 4$. Find the length of chord $\overline{CD}$.'
            answer: "16"
            solution_sketch: '$8 \cdot 6 = 4 \cdot PD \Rightarrow PD = 12$; $CD = CP + PD = 4 + 12 = 16$.'
        constraints: "multi-step; Pythagorean triples and clean products"
    diagnostic_exemplar:
      problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 3$, $PB = 8$, and $CP = 4$. Find the length of chord $\overline{CD}$.'
      answer: "10"
      solution_sketch: '$3 \cdot 8 = 4 \cdot PD \Rightarrow PD = 6$; $CD = 4 + 6 = 10$.'
