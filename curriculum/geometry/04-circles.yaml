unit: circles
course: geometry
module: "Circles"
topics:
  - id: circle-circumference
    name: Circumference of a Circle
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Circumference from the radius
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A circle has radius $6$. Find its circumference (exact, in terms of $\pi$).'
            answer: '$12\pi$'
            solution_sketch: '$C = 2\pi r = 12\pi$.'
          - problem: 'A circle has radius $4$. Find its circumference (exact).'
            answer: '$8\pi$'
            solution_sketch: '$C = 2\pi r = 2 \cdot 4\pi = 8\pi$.'
          - problem: 'A circle has radius $5$. Find its circumference to the nearest tenth (use $3.14$ for $\pi$).'
            answer: "31.4"
            solution_sketch: '$C = 2(3.14)(5) = 31.4$.'
          - problem: 'A circle has radius $3$. Find its circumference to the nearest tenth (use $3.14$ for $\pi$).'
            answer: "18.8"
            solution_sketch: '$C = 2(3.14)(3) = 18.84 \approx 18.8$.'
          - problem: 'A circle has radius $10$. Find its circumference using $3.14$ for $\pi$.'
            answer: "62.8"
            solution_sketch: '$C = 2(3.14)(10) = 62.8$.'
          - problem: 'A circle has radius $7$. Find its circumference using $3.14$ for $\pi$.'
            answer: "43.96"
            solution_sketch: '$C = 2(3.14)(7) = 43.96$.'
        constraints: "integer radius; answers exact in terms of pi"
      - id: kp2
        name: Circumference from the diameter
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A circle has diameter $10$. Find its circumference (exact).'
            answer: '$10\pi$'
            solution_sketch: '$C = \pi d$.'
          - problem: 'A circular track has diameter $70$ meters. Find the length of one lap (exact, in meters).'
            answer: '$70\pi$'
            solution_sketch: '$C = \pi d = 70\pi$ meters.'
          - problem: 'A circular fountain has diameter $9$ meters. Find the distance around it to the nearest hundredth (use $3.14$ for $\pi$).'
            answer: "28.26"
            solution_sketch: '$C = 3.14 \cdot 9 = 28.26$ meters.'
          - problem: 'A circular pool has diameter $25$ meters. Find the distance around it using $3.14$ for $\pi$ (in meters).'
            answer: "78.5"
            solution_sketch: '$C = 3.14 \cdot 25 = 78.5$ meters.'
          - problem: 'A circular lid has diameter $6$ centimeters. Find its circumference to the nearest hundredth (use $3.14$ for $\pi$).'
            answer: "18.84"
            solution_sketch: '$C = 3.14 \cdot 6 = 18.84$ centimeters.'
          - problem: 'A bicycle wheel has diameter $15$ inches. Find the distance around it using $3.14$ for $\pi$ (in inches).'
            answer: "47.1"
            solution_sketch: '$C = 3.14 \cdot 15 = 47.1$ inches.'
        constraints: "integer diameter; C = pi d"
      - id: kp3
        name: Recover the radius or diameter
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A circle has circumference $20\pi$. Find its radius.'
            answer: "10"
            solution_sketch: '$2\pi r = 20\pi \Rightarrow r = 10$.'
          - problem: 'A circle has circumference $14\pi$. Find its diameter.'
            answer: "14"
            solution_sketch: '$\pi d = 14\pi \Rightarrow d = 14$.'
          - problem: 'A circle has circumference $31.4$. Find its radius (use $3.14$ for $\pi$).'
            answer: "5"
            solution_sketch: '$2(3.14)r = 31.4 \Rightarrow 6.28r = 31.4 \Rightarrow r = 5$.'
          - problem: 'A circle has circumference $22\pi$. Find its diameter.'
            answer: "22"
            solution_sketch: '$\pi d = 22\pi \Rightarrow d = 22$.'
        constraints: "circumference given as an integer multiple of pi"
    diagnostic_exemplar:
      problem: 'A circle has circumference $18\pi$. Find its radius.'
      answer: "9"
      solution_sketch: '$2\pi r = 18\pi \Rightarrow r = 9$.'
    anki_seeds:
      - front: "The ratio of any circle's circumference to its diameter:"
        back: "pi"
        type: basic

  - id: circle-area
    name: Area of a Circle
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: circle-circumference
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Area from the radius
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A circle has radius $5$. Find its area (exact, in terms of $\pi$).'
            answer: '$25\pi$'
            solution_sketch: '$A = \pi r^2 = 25\pi$.'
          - problem: 'A circle has radius $8$. Find its area (exact).'
            answer: '$64\pi$'
            solution_sketch: '$A = \pi r^2 = \pi \cdot 64 = 64\pi$.'
          - problem: 'A circle has radius $10$. Find its area using $3.14$ for $\pi$.'
            answer: "314"
            solution_sketch: '$A = 3.14 \cdot 10^2 = 3.14 \cdot 100 = 314$.'
          - problem: 'A circle has radius $4$. Find its area using $3.14$ for $\pi$.'
            answer: "50.24"
            solution_sketch: '$A = 3.14 \cdot 16 = 50.24$.'
          - problem: 'A circle has radius $6$. Find its area using $3.14$ for $\pi$.'
            answer: "113.04"
            solution_sketch: '$A = 3.14 \cdot 36 = 113.04$.'
          - problem: 'A circle has radius $9$. Find its area to the nearest tenth using $3.14$ for $\pi$.'
            answer: "254.3"
            solution_sketch: '$A = 3.14 \cdot 81 = 254.34 \approx 254.3$.'
        constraints: "integer radius; answers exact in terms of pi"
      - id: kp2
        name: Area from the diameter
        key_prerequisites: [evaluating-expressions, circle-circumference]
        exemplars:
          - problem: 'A circle has diameter $18$. Find its area (exact).'
            answer: '$81\pi$'
            solution_sketch: '$r = 9$, so $A = 81\pi$.'
          - problem: 'A circle has diameter $14$. Find its area (exact).'
            answer: '$49\pi$'
            solution_sketch: '$r = 7$, so $A = 49\pi$.'
          - problem: 'A circle has diameter $10$. Find its area using $3.14$ for $\pi$.'
            answer: "78.5"
            solution_sketch: '$r = 5$, so $A = 3.14 \cdot 25 = 78.5$.'
          - problem: 'A circle has diameter $30$. Find its area using $3.14$ for $\pi$.'
            answer: "706.5"
            solution_sketch: '$r = 15$, so $A = 3.14 \cdot 225 = 706.5$.'
          - problem: 'A circle has diameter $12$. Find its area using $3.14$ for $\pi$.'
            answer: "113.04"
            solution_sketch: '$r = 6$, so $A = 3.14 \cdot 36 = 113.04$.'
          - problem: 'A circle has diameter $4$. Find its area using $3.14$ for $\pi$.'
            answer: "12.56"
            solution_sketch: '$r = 2$, so $A = 3.14 \cdot 4 = 12.56$.'
        constraints: "even diameters; convert to radius first"
      - id: kp3
        name: Recover the radius from the area
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A circle has area $49\pi$. Find its radius.'
            answer: "7"
            solution_sketch: '$\pi r^2 = 49\pi \Rightarrow r = \sqrt{49} = 7$.'
          - problem: 'A circle has area $121\pi$. Find its diameter.'
            answer: "22"
            solution_sketch: '$r = 11$, so $d = 22$.'
          - problem: 'A circle has area $36\pi$. Find its radius.'
            answer: "6"
            solution_sketch: '$\pi r^2 = 36\pi \Rightarrow r = \sqrt{36} = 6$.'
          - problem: 'A circle has area $169\pi$. Find its diameter.'
            answer: "26"
            solution_sketch: '$r = \sqrt{169} = 13$, so $d = 26$.'
        constraints: "perfect-square areas so the radius is whole"
    diagnostic_exemplar:
      problem: 'A circle has area $81\pi$. Find its diameter.'
      answer: "18"
      solution_sketch: '$\pi r^2 = 81\pi \Rightarrow r = 9$, so $d = 18$.'
    anki_seeds:
      - front: "If a circle's radius doubles, its area is multiplied by..."
        back: "4"
        type: basic

  - id: circle-area-circumference
    name: Circle Area and Circumference
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: circle-circumference
        weight: 0.8
        key: true
      - id: circle-area
        weight: 0.8
        key: true
      - id: square-roots
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Circumference to area
        key_prerequisites: [circle-circumference, circle-area]
        exemplars:
          - problem: 'A circle has circumference $12\pi$. Find its area (exact).'
            answer: '$36\pi$'
            solution_sketch: '$r = 6$, so $A = 36\pi$.'
          - problem: 'A circle has circumference $8\pi$. Find its area (exact).'
            answer: '$16\pi$'
            solution_sketch: '$r = 4$, so $A = 16\pi$.'
          - problem: 'A circle has circumference $10\pi$. Using $3.14$ for $\pi$, find its area.'
            answer: "78.5"
            solution_sketch: '$r = 5$; $A = 3.14 \cdot 25 = 78.5$.'
          - problem: 'A circle has circumference $14\pi$. Using $3.14$ for $\pi$, find its area.'
            answer: "153.86"
            solution_sketch: '$r = 7$; $A = 3.14 \cdot 49 = 153.86$.'
          - problem: 'A circle has circumference $20\pi$. Using $3.14$ for $\pi$, find its area.'
            answer: "314"
            solution_sketch: '$r = 10$; $A = 3.14 \cdot 100 = 314$.'
          - problem: 'A circle has circumference $16\pi$. Using $3.14$ for $\pi$, find its area.'
            answer: "200.96"
            solution_sketch: '$r = 8$; $A = 3.14 \cdot 64 = 200.96$.'
        constraints: "circumference an even multiple of pi so the radius is whole"
      - id: kp2
        name: Area to circumference
        key_prerequisites: [circle-area, square-roots]
        exemplars:
          - problem: 'A circle has area $100\pi$. Find its circumference (exact).'
            answer: '$20\pi$'
            solution_sketch: '$r = 10$; $C = 20\pi$.'
          - problem: 'A circle has area $36\pi$. Find its circumference (exact).'
            answer: '$12\pi$'
            solution_sketch: '$r = 6$; $C = 12\pi$.'
          - problem: 'A circle has area $25\pi$. Using $3.14$ for $\pi$, find its circumference.'
            answer: "31.4"
            solution_sketch: '$r = 5$; $C = 2 \cdot 3.14 \cdot 5 = 31.4$.'
          - problem: 'A circle has area $49\pi$. Using $3.14$ for $\pi$, find its circumference.'
            answer: "43.96"
            solution_sketch: '$r = 7$; $C = 2 \cdot 3.14 \cdot 7 = 43.96$.'
          - problem: 'A circle has area $16\pi$. Using $3.14$ for $\pi$, find its circumference.'
            answer: "25.12"
            solution_sketch: '$r = 4$; $C = 2 \cdot 3.14 \cdot 4 = 25.12$.'
          - problem: 'A circle has area $144\pi$. Using $3.14$ for $\pi$, find its circumference.'
            answer: "75.36"
            solution_sketch: '$r = 12$; $C = 2 \cdot 3.14 \cdot 12 = 75.36$.'
        constraints: "perfect-square areas so the radius is whole"
      - id: kp3
        name: Semicircles and applications
        key_prerequisites: [circle-circumference, circle-area]
        exemplars:
          - problem: 'Find the area of a semicircle with radius $4$ (exact).'
            answer: '$8\pi$'
            solution_sketch: '$\frac{1}{2}\pi \cdot 16 = 8\pi$.'
          - problem: 'Find the perimeter of a semicircle with radius $6$ (exact; include the diameter).'
            answer: '$6\pi + 12$'
            solution_sketch: 'Half the circumference plus the diameter: $\frac{1}{2}(12\pi) + 12 = 6\pi + 12$.'
          - problem: 'Find the area of a semicircle with radius $10$. Use $3.14$ for $\pi$.'
            answer: "157"
            solution_sketch: '$A = \frac{1}{2} \cdot 3.14 \cdot 100 = 157$.'
          - problem: 'Find the perimeter of a semicircle with radius $7$. Use $3.14$ for $\pi$ and include the diameter.'
            answer: "35.98"
            solution_sketch: 'Half-circumference $= 3.14 \cdot 7 = 21.98$; add the diameter $14$: $35.98$.'
          - problem: 'Find the area of a semicircle with radius $20$. Use $3.14$ for $\pi$.'
            answer: "628"
            solution_sketch: '$A = \frac{1}{2} \cdot 3.14 \cdot 400 = 628$.'
          - problem: 'Find the perimeter of a semicircle with radius $10$. Use $3.14$ for $\pi$ and include the diameter.'
            answer: "51.4"
            solution_sketch: 'Half-circumference $= 3.14 \cdot 10 = 31.4$; add the diameter $20$: $51.4$.'
        constraints: "state whether the straight edge counts toward perimeter; exact answers"
    diagnostic_exemplar:
      problem: 'A semicircle has area $8\pi$. Find its perimeter (exact, in terms of $\pi$; include the diameter).'
      answer: '$4\pi + 8$'
      solution_sketch: '$\frac{1}{2}\pi r^2 = 8\pi$ gives $r = 4$; the perimeter is the half-circumference plus the diameter: $4\pi + 8$.'
    anki_seeds:
      - front: "Circumference of a circle with radius r:"
        back: "C = 2 pi r (equivalently pi d)"
        type: basic
      - front: "Area of a circle with radius r:"
        back: "A = pi r^2"
        type: basic

  - id: central-angles-arcs
    name: Central Angles and Arcs
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: angle-relationships
        weight: 0.6
        key: true
      - id: circle-circumference
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: A central angle equals its arc
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A central angle measures $80^\circ$. Find the measure of its intercepted arc, in degrees.'
            answer: "80"
            solution_sketch: 'A central angle equals its intercepted arc: $80^\circ$.'
          - problem: 'Arc $AB$ of a circle measures $65^\circ$. Find the central angle $\angle AOB$, in degrees.'
            answer: "65"
            solution_sketch: 'The central angle equals its arc: $65^\circ$.'
          - problem: 'A central angle in a circle measures $115^\circ$. Find the measure of its intercepted arc, in degrees.'
            answer: "115"
            solution_sketch: 'Arc measure equals central angle measure: $115$.'
          - problem: 'In a circle with center $O$, arc $XY$ measures $38^\circ$. Find $m\angle XOY$, in degrees.'
            answer: "38"
            solution_sketch: '$\angle XOY$ is the central angle of arc $XY$, so it measures $38^\circ$.'
        constraints: "arc measure equals central angle measure; whole degrees"
      - id: kp2
        name: Arc addition and major arcs
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A minor arc of a circle measures $140^\circ$. Find the corresponding major arc, in degrees.'
            answer: "220"
            solution_sketch: 'The arcs of a full circle sum to $360$: $360 - 140 = 220$.'
          - problem: 'On a circle, arc $AB = 110^\circ$ and arc $BC = 90^\circ$ (non-overlapping). Find the measure of arc $ABC$, in degrees.'
            answer: "200"
            solution_sketch: 'Adjacent arcs add: $110 + 90 = 200$.'
          - problem: 'A minor arc measures $95^\circ$. Find the corresponding major arc, in degrees.'
            answer: "265"
            solution_sketch: '$360 - 95 = 265$.'
          - problem: 'On a circle, arc $AB = 85^\circ$ and arc $BC = 120^\circ$ (non-overlapping). Find the measure of arc $ABC$, in degrees.'
            answer: "205"
            solution_sketch: 'Adjacent arcs add: $85 + 120 = 205$.'
        constraints: "arcs sum to 360; adjacent arcs add"
      - id: kp3
        name: Diameters and equally spaced points
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A diameter divides a circle into two arcs. What is the measure of each, in degrees?'
            answer: "180"
            solution_sketch: 'A diameter cuts the circle in half: $360 / 2 = 180$.'
          - problem: 'Five points are equally spaced around a circle. Find the measure of the arc between two adjacent points, in degrees.'
            answer: "72"
            solution_sketch: '$360 / 5 = 72$.'
          - problem: 'Six points are equally spaced around a circle. Find the measure of the arc between two adjacent points, in degrees.'
            answer: "60"
            solution_sketch: '$360 / 6 = 60$.'
          - problem: 'Eight points are equally spaced around a circle. Find the measure of the arc from the first point to the third, passing through the second, in degrees.'
            answer: "90"
            solution_sketch: 'Adjacent arcs measure $360 / 8 = 45$; two of them give $90$.'
        constraints: "equally spaced points divide 360 evenly"
    diagnostic_exemplar:
      problem: 'A minor arc measures $130^\circ$. Find the corresponding major arc, in degrees.'
      answer: "230"
      solution_sketch: '$360 - 130 = 230$.'
    anki_seeds:
      - front: "The measure of an arc equals the measure of its..."
        back: "central angle"
        type: basic
      - front: "The arc measures of a full circle sum to..."
        back: "360 degrees"
        type: basic

  - id: inscribed-angles
    name: Inscribed Angles
    core: false                # terminal circle-theorem branch
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: central-angles-arcs
        weight: 0.7
        key: true
      - id: triangle-angle-sum
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: The inscribed angle theorem
        key_prerequisites: [central-angles-arcs]
        exemplars:
          - problem: 'An inscribed angle intercepts an arc of $100^\circ$. Find the inscribed angle, in degrees.'
            answer: "50"
            solution_sketch: 'An inscribed angle is half its intercepted arc.'
          - problem: 'An inscribed angle measures $35^\circ$. Find the central angle that intercepts the same arc, in degrees.'
            answer: "70"
            solution_sketch: 'The central angle is twice the inscribed angle: $2 \cdot 35 = 70$.'
          - problem: 'An inscribed angle intercepts an arc of $84^\circ$. Find the inscribed angle, in degrees.'
            answer: "42"
            solution_sketch: 'An inscribed angle is half its intercepted arc: $84 / 2 = 42$.'
          - problem: 'An inscribed angle measures $46^\circ$. Find the central angle that intercepts the same arc, in degrees.'
            answer: "92"
            solution_sketch: 'The central angle is twice the inscribed angle: $2 \cdot 46 = 92$.'
        constraints: "even arc measures so inscribed angles are whole degrees"
      - id: kp2
        name: Angles in a semicircle
        key_prerequisites: [central-angles-arcs, triangle-angle-sum]
        exemplars:
          - problem: 'An angle is inscribed in a semicircle. What is its measure, in degrees?'
            answer: "90"
            solution_sketch: 'It intercepts a $180^\circ$ arc, so it measures $90^\circ$ (Thales).'
          - problem: 'Triangle $ABC$ is inscribed in a circle with $\overline{AB}$ a diameter, and $m\angle A = 32^\circ$. Find $m\angle B$, in degrees.'
            answer: "58"
            solution_sketch: '$\angle C = 90^\circ$ (semicircle), so $\angle B = 180 - 90 - 32 = 58^\circ$.'
          - problem: 'Triangle $ABC$ is inscribed in a circle with $\overline{AB}$ a diameter, and $m\angle B = 41^\circ$. Find $m\angle A$, in degrees.'
            answer: "49"
            solution_sketch: '$\angle C = 90^\circ$ (angle in a semicircle), so $\angle A = 180 - 90 - 41 = 49^\circ$.'
          - problem: 'Triangle $PQR$ is inscribed in a circle with $\overline{PQ}$ a diameter, and $m\angle P = 27^\circ$. Find $m\angle Q$, in degrees.'
            answer: "63"
            solution_sketch: '$\angle R = 90^\circ$ (angle in a semicircle), so $\angle Q = 180 - 90 - 27 = 63^\circ$.'
        constraints: "diameter identified explicitly; whole degrees"
      - id: kp3
        name: Inscribed angles on the same arc
        key_prerequisites: [central-angles-arcs]
        exemplars:
          - problem: 'Inscribed angles $\angle ADB$ and $\angle ACB$ intercept the same arc $AB$. If $m\angle ADB = 28^\circ$, find $m\angle ACB$, in degrees.'
            answer: "28"
            solution_sketch: 'Inscribed angles on the same arc are congruent.'
          - problem: 'Inscribed angle $\angle ACB$ measures $41^\circ$. Find the measure of arc $AB$, in degrees.'
            answer: "82"
            solution_sketch: 'The arc is twice the inscribed angle: $2 \cdot 41 = 82$.'
          - problem: 'Inscribed angles $\angle ADB$ and $\angle ACB$ intercept the same arc $AB$. If $m\angle ACB = 57^\circ$, find $m\angle ADB$, in degrees.'
            answer: "57"
            solution_sketch: 'Inscribed angles on the same arc are congruent, so $m\angle ADB = 57^\circ$.'
          - problem: 'An inscribed angle $\angle APB$ measures $33^\circ$. Find the measure of arc $AB$, in degrees.'
            answer: "66"
            solution_sketch: 'The arc is twice the inscribed angle: $2 \cdot 33 = 66$.'
        constraints: "same-arc pairs equal; arc = twice the inscribed angle"
    diagnostic_exemplar:
      problem: 'Triangle $ABC$ is inscribed in a circle with $\overline{AB}$ a diameter, and $m\angle A = 37^\circ$. Find the measure of arc $AC$, in degrees.'
      answer: '106'
      solution_sketch: '$\angle C = 90^\circ$ (angle in a semicircle), so $m\angle B = 53^\circ$; arc $AC$ is intercepted by the inscribed angle $\angle B$, hence measures $2 \cdot 53 = 106^\circ$.'
    anki_seeds:
      - front: "An inscribed angle equals ... of its intercepted arc."
        back: "half"
        type: basic
      - front: "An angle inscribed in a semicircle measures..."
        back: "90 degrees"
        type: basic

  - id: central-inscribed-angles
    name: Central and Inscribed Angles
    core: false                # terminal circle-theorem branch
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: inscribed-angles
        weight: 0.8
        key: true
      - id: central-angles-arcs
        weight: 0.5
        key: false
      - id: triangle-angle-sum
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Inscribed quadrilaterals
        key_prerequisites: [inscribed-angles]
        exemplars:
          - problem: 'Quadrilateral $ABCD$ is inscribed in a circle with $m\angle A = 95^\circ$. Find $m\angle C$, in degrees.'
            answer: "85"
            solution_sketch: 'Opposite angles of a cyclic quadrilateral are supplementary.'
          - problem: 'Cyclic quadrilateral $PQRS$ has $m\angle Q = (4x)^\circ$ and $m\angle S = (2x + 30)^\circ$. Find $m\angle Q$, in degrees.'
            answer: "100"
            solution_sketch: '$4x + 2x + 30 = 180 \Rightarrow x = 25$; $m\angle Q = 100^\circ$.'
          - problem: 'Quadrilateral $ABCD$ is inscribed in a circle with $m\angle B = 72^\circ$. Find $m\angle D$, in degrees.'
            answer: "108"
            solution_sketch: 'Opposite angles of a cyclic quadrilateral are supplementary: $180 - 72 = 108$.'
          - problem: 'Cyclic quadrilateral $PQRS$ has $m\angle P = (3x)^\circ$ and $m\angle R = (x + 40)^\circ$. Find $m\angle R$, in degrees.'
            answer: "75"
            solution_sketch: '$3x + x + 40 = 180 \Rightarrow x = 35$; $m\angle R = 35 + 40 = 75^\circ$.'
        constraints: "opposite angles supplementary; linear setups with integer solutions"
      - id: kp2
        name: Combining central and inscribed angles
        key_prerequisites: [inscribed-angles, central-angles-arcs, triangle-angle-sum]
        exemplars:
          - problem: 'In circle $O$, central angle $\angle AOB$ measures $100^\circ$, and $C$ lies on the major arc $AB$. Find $m\angle ACB$, in degrees.'
            answer: "50"
            solution_sketch: 'The inscribed angle is half the $100^\circ$ arc.'
          - problem: 'In circle $O$, central angle $\angle AOB = 100^\circ$. Find a base angle of isosceles triangle $OAB$, in degrees.'
            answer: "40"
            solution_sketch: '$OA = OB$ are radii: $(180 - 100)/2 = 40$.'
          - problem: 'In circle $O$, central angle $\angle AOB$ measures $140^\circ$, and $C$ lies on the major arc $AB$. Find $m\angle ACB$, in degrees.'
            answer: "70"
            solution_sketch: 'The central angle equals its arc, so arc $AB = 140^\circ$; the inscribed angle is half the arc: $140/2 = 70$.'
          - problem: 'In circle $O$, central angle $\angle COD$ measures $60^\circ$. Find a base angle of isosceles triangle $OCD$, in degrees.'
            answer: "60"
            solution_sketch: '$OC = OD$ are radii: $(180 - 60)/2 = 60$.'
        constraints: "radii form isosceles triangles; multi-step but whole degrees"
      - id: kp3
        name: Arcs of inscribed polygons
        key_prerequisites: [inscribed-angles, central-angles-arcs]
        exemplars:
          - problem: 'A triangle inscribed in a circle cuts off arcs in the ratio $2:3:4$ (measures $2x$, $3x$, $4x$). Find the triangle''s largest angle, in degrees.'
            answer: "80"
            solution_sketch: '$9x = 360 \Rightarrow x = 40$; arcs $80, 120, 160$; each angle is half the opposite arc, so the largest is $80^\circ$.'
          - problem: 'An equilateral triangle is inscribed in a circle. Find the measure of each arc it cuts off, in degrees.'
            answer: "120"
            solution_sketch: '$360 / 3 = 120$.'
          - problem: 'A triangle inscribed in a circle cuts off arcs in the ratio $1:2:3$ (measures $x$, $2x$, $3x$). Find the triangle''s smallest angle, in degrees.'
            answer: "30"
            solution_sketch: '$6x = 360 \Rightarrow x = 60$; arcs $60, 120, 180$; each angle is half its opposite arc, so the smallest is $30^\circ$.'
          - problem: 'A square is inscribed in a circle. Find the measure of each arc it cuts off, in degrees.'
            answer: "90"
            solution_sketch: 'The four equal arcs sum to $360^\circ$: $360 / 4 = 90$.'
        constraints: "arc ratios summing to 360; each inscribed angle is half its opposite arc"
    diagnostic_exemplar:
      problem: 'A triangle inscribed in a circle cuts off arcs in the ratio $3:4:5$ (measures $3x$, $4x$, $5x$). Find the triangle''s largest angle, in degrees.'
      answer: "75"
      solution_sketch: '$12x = 360 \Rightarrow x = 30$; arcs $90, 120, 150$; each angle is half the opposite arc, so the largest is $75^\circ$.'
    anki_seeds:
      - front: "Opposite angles of a cyclic (inscribed) quadrilateral are..."
        back: "supplementary"
        type: basic
      - front: "A central angle is ... the inscribed angle intercepting the same arc."
        back: "twice"
        type: basic

  - id: arc-length-sector-area
    name: Arc Length and Sector Area
    core: false                # application of the circle formulas; terminal
    difficulty: 0.46
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: circle-area-circumference
        weight: 0.8
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: false
      - id: central-angles-arcs
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Arc length as a fraction of circumference
        key_prerequisites: [circle-area-circumference, ratios-proportions]
        exemplars:
          - problem: 'Find the length of an arc with radius $9$ and central angle $60^\circ$ (exact, in terms of $\pi$).'
            answer: '$3\pi$'
            solution_sketch: '$\frac{60}{360} \cdot 2\pi \cdot 9 = \frac{1}{6} \cdot 18\pi = 3\pi$.'
          - problem: 'Find the length of an arc with radius $12$ and central angle $150^\circ$ (exact).'
            answer: '$10\pi$'
            solution_sketch: '$\frac{150}{360} \cdot 24\pi = \frac{5}{12} \cdot 24\pi = 10\pi$.'
          - problem: 'Find the length of an arc with radius $9$ and central angle $60^\circ$ to the nearest hundredth (use $3.14$ for $\pi$).'
            answer: "9.42"
            solution_sketch: '$\frac{60}{360} \cdot 2(3.14)(9) = \frac{1}{6} \cdot 56.52 = 9.42$.'
          - problem: 'Find the length of an arc with radius $10$ and central angle $90^\circ$ (use $3.14$ for $\pi$).'
            answer: "15.7"
            solution_sketch: '$\frac{90}{360} \cdot 2(3.14)(10) = \frac{1}{4} \cdot 62.8 = 15.7$.'
          - problem: 'Find the length of an arc with radius $6$ and central angle $120^\circ$ (use $3.14$ for $\pi$).'
            answer: "12.56"
            solution_sketch: '$\frac{120}{360} \cdot 2(3.14)(6) = \frac{1}{3} \cdot 37.68 = 12.56$.'
          - problem: 'Find the length of an arc with radius $15$ and central angle $72^\circ$ (use $3.14$ for $\pi$).'
            answer: "18.84"
            solution_sketch: '$\frac{72}{360} \cdot 2(3.14)(15) = 0.2 \cdot 94.2 = 18.84$.'
        constraints: "angles dividing 360 into clean fractions; exact pi answers"
      - id: kp2
        name: Sector area as a fraction of circle area
        key_prerequisites: [circle-area-circumference, ratios-proportions]
        exemplars:
          - problem: 'Find the area of a sector with radius $6$ and central angle $120^\circ$ (exact).'
            answer: '$12\pi$'
            solution_sketch: '$\frac{120}{360} \cdot 36\pi = 12\pi$.'
          - problem: 'Find the area of a sector with radius $10$ and central angle $45^\circ$ (exact).'
            answer: '$25\pi/2$'
            solution_sketch: '$\frac{45}{360} \cdot 100\pi = \frac{100\pi}{8} = \frac{25\pi}{2}$.'
          - problem: 'Find the area of a sector with radius $6$ and central angle $120^\circ$ (use $3.14$ for $\pi$).'
            answer: "37.68"
            solution_sketch: '$\frac{120}{360} \cdot 3.14 \cdot 36 = \frac{1}{3} \cdot 113.04 = 37.68$.'
          - problem: 'Find the area of a sector with radius $10$ and central angle $90^\circ$ (use $3.14$ for $\pi$).'
            answer: "78.5"
            solution_sketch: '$\frac{90}{360} \cdot 3.14 \cdot 100 = \frac{1}{4} \cdot 314 = 78.5$.'
          - problem: 'Find the area of a sector with radius $4$ and central angle $45^\circ$ (use $3.14$ for $\pi$).'
            answer: "6.28"
            solution_sketch: '$\frac{45}{360} \cdot 3.14 \cdot 16 = \frac{1}{8} \cdot 50.24 = 6.28$.'
          - problem: 'Find the area of a sector with radius $2$ and central angle $270^\circ$ (use $3.14$ for $\pi$).'
            answer: "9.42"
            solution_sketch: '$\frac{270}{360} \cdot 3.14 \cdot 4 = 0.75 \cdot 12.56 = 9.42$.'
        constraints: "answers exact; simple fractions of pi allowed, written inline as k*pi/m"
      - id: kp3
        name: Recover the central angle or radius
        key_prerequisites: [circle-area-circumference, ratios-proportions]
        exemplars:
          - problem: 'An arc of a circle with radius $8$ has length $4\pi$. Find the central angle, in degrees.'
            answer: "90"
            solution_sketch: '$C = 16\pi$; the arc is $\frac{4\pi}{16\pi} = \frac{1}{4}$ of the circle, so $90^\circ$.'
          - problem: 'A sector of a circle with radius $9$ has area $27\pi$. Find the central angle, in degrees.'
            answer: "120"
            solution_sketch: 'Circle area $= 81\pi$; fraction $= \frac{27}{81} = \frac{1}{3}$, so $120^\circ$.'
          - problem: 'An arc of a circle with radius $12$ has length $4\pi$. Find the central angle, in degrees.'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'The circumference is $C = 24\pi$. The arc is $\frac{4\pi}{24\pi} = \frac{1}{6}$ of the circle, so the central angle is $60^\circ$.'
          - problem: 'A sector of a circle with radius $6$ has area $3\pi$. Find the central angle, in degrees.'
            answer: "30"
            solution_sketch: 'Circle area $= 36\pi$; fraction $= \frac{3\pi}{36\pi} = \frac{1}{12}$, so $30^\circ$.'
        constraints: "fractions reduce cleanly to whole-degree angles"
    diagnostic_exemplar:
      problem: 'A sector of a circle with radius $6$ has area $9\pi$. Find the length of its arc (exact, in terms of $\pi$).'
      answer: '$3\pi$'
      solution_sketch: 'The whole circle has area $36\pi$, so the sector is $\frac{9\pi}{36\pi} = \frac{1}{4}$ of it (a $90^\circ$ angle); the arc is $\frac{1}{4}$ of the circumference $12\pi$, i.e. $3\pi$.'
    anki_seeds:
      - front: "Arc length for central angle theta (degrees) and radius r:"
        back: "(theta/360) x 2 pi r"
        type: basic
      - front: "Sector area for central angle theta (degrees) and radius r:"
        back: "(theta/360) x pi r^2"
        type: basic

  - id: circle-segment-area
    name: Area of a Circular Segment
    core: false                # terminal application (sector minus triangle); both anchors are supplemental and nothing downstream consumes it
    difficulty: 0.6            # L4 audit: was 0.52, below its own prereq triangle-area-sine (0.7)
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: arc-length-sector-area
        weight: 0.8
        key: true
      - id: triangle-area-sine
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Segments cut off by a right central angle
        key_prerequisites: [arc-length-sector-area]
        exemplars:
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $90^\circ$. Find the area of the minor segment (exact).'
            answer: "9*pi - 18"
            solution_sketch: 'Sector: $\frac{90}{360} \cdot 36\pi = 9\pi$. Triangle: right isosceles with legs $6$, area $\frac{1}{2} \cdot 6 \cdot 6 = 18$. Segment $= 9\pi - 18$.'
          - problem: 'A chord of a circle with radius $4$ subtends a central angle of $90^\circ$. Find the area of the minor segment (exact).'
            answer: "4*pi - 8"
            solution_sketch: 'Sector $4\pi$ minus triangle $\frac{1}{2} \cdot 4 \cdot 4 = 8$.'
          - problem: 'A chord of a circle with radius $4$ subtends a central angle of $90^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "4.56"
            solution_sketch: 'Sector: $\frac{90}{360} \cdot 3.14 \cdot 16 = 12.56$. Triangle: $\frac{1}{2} \cdot 4 \cdot 4 = 8$. Segment $= 12.56 - 8 = 4.56$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $90^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "10.26"
            solution_sketch: 'Sector: $\frac{90}{360} \cdot 3.14 \cdot 36 = 28.26$. Triangle: $\frac{1}{2} \cdot 6 \cdot 6 = 18$. Segment $= 28.26 - 18 = 10.26$.'
          - problem: 'A chord of a circle with radius $10$ subtends a central angle of $90^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "28.5"
            solution_sketch: 'Sector: $\frac{90}{360} \cdot 3.14 \cdot 100 = 78.5$. Triangle: $\frac{1}{2} \cdot 10 \cdot 10 = 50$. Segment $= 78.5 - 50 = 28.5$.'
          - problem: 'A chord of a circle with radius $2$ subtends a central angle of $90^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "1.14"
            solution_sketch: 'Sector: $\frac{90}{360} \cdot 3.14 \cdot 4 = 3.14$. Triangle: $\frac{1}{2} \cdot 2 \cdot 2 = 2$. Segment $= 3.14 - 2 = 1.14$.'
        constraints: "central angle 90 degrees so the triangle is right isosceles with legs r; exact answers written inline as k*pi - m"
      - id: kp2
        name: Segments with special central angles
        key_prerequisites: [arc-length-sector-area, triangle-area-sine]
        exemplars:
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $60^\circ$. Find the area of the minor segment (exact).'
            answer: "6*pi - 9*sqrt(3)"
            solution_sketch: 'Sector: $\frac{60}{360} \cdot 36\pi = 6\pi$. Triangle: $\frac{1}{2} \cdot 6 \cdot 6 \cdot \sin 60^\circ = 9\sqrt{3}$. Segment $= 6\pi - 9\sqrt{3}$.'
          - problem: 'A chord of a circle with radius $12$ subtends a central angle of $120^\circ$. Find the area of the minor segment (exact).'
            answer: "48*pi - 36*sqrt(3)"
            solution_sketch: 'Sector: $\frac{120}{360} \cdot 144\pi = 48\pi$. Triangle: $\frac{1}{2} \cdot 144 \cdot \sin 120^\circ = 36\sqrt{3}$.'
          - problem: 'A chord of a circle with radius $10$ subtends a central angle of $30^\circ$. Find the area of the minor segment (exact).'
            answer: "25*pi/3 - 25"
            solution_sketch: 'Sector: $\frac{30}{360} \cdot 100\pi = \frac{25\pi}{3}$. Triangle: $\frac{1}{2} \cdot 100 \cdot \sin 30^\circ = 25$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $30^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "0.42"
            solution_sketch: 'Sector: $\frac{30}{360} \cdot 3.14 \cdot 36 = 9.42$. Triangle: $\frac{1}{2} \cdot 36 \cdot \sin 30^\circ = 9$. Segment $= 9.42 - 9 = 0.42$.'
          - problem: 'A chord of a circle with radius $12$ subtends a central angle of $30^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "1.68"
            solution_sketch: 'Sector: $\frac{30}{360} \cdot 3.14 \cdot 144 = 37.68$. Triangle: $\frac{1}{2} \cdot 144 \cdot \sin 30^\circ = 36$. Segment $= 37.68 - 36 = 1.68$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $150^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$.'
            answer: "38.1"
            solution_sketch: 'Sector: $\frac{150}{360} \cdot 3.14 \cdot 36 = 47.1$. Triangle: $\frac{1}{2} \cdot 36 \cdot \sin 150^\circ = 9$. Segment $= 47.1 - 9 = 38.1$.'
          - problem: 'A chord of a circle with radius $12$ subtends a central angle of $60^\circ$. Find the area of the minor segment. Use $\pi \approx 3.14$ and $\sqrt{3} \approx 1.73$.'
            answer: "13.08"
            solution_sketch: 'Sector: $\frac{60}{360} \cdot 3.14 \cdot 144 = 75.36$. Triangle: $\frac{1}{2} \cdot 144 \cdot \sin 60^\circ = 72 \cdot 0.865 = 62.28$. Segment $= 75.36 - 62.28 = 13.08$.'
        constraints: "central angles 30, 60, 120, or 150 degrees so the isosceles triangle area (1/2)r^2 sin(theta) is exact; exact answers as k*pi/m - n or k*pi - n*sqrt(3)"
      - id: kp3
        name: Major segments
        key_prerequisites: [arc-length-sector-area, triangle-area-sine]
        exemplars:
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $90^\circ$. Find the area of the major segment (exact).'
            answer: "27*pi + 18"
            solution_sketch: 'Circle area $36\pi$ minus the minor segment $9\pi - 18$ gives $27\pi + 18$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $120^\circ$. Find the area of the major segment (exact).'
            answer: "24*pi + 9*sqrt(3)"
            solution_sketch: 'Minor segment: $12\pi - 9\sqrt{3}$. Major segment: $36\pi - (12\pi - 9\sqrt{3}) = 24\pi + 9\sqrt{3}$.'
          - problem: 'A chord of a circle with radius $4$ subtends a central angle of $90^\circ$. Find the area of the major segment. Use $\pi \approx 3.14$.'
            answer: "45.68"
            solution_sketch: 'Circle: $3.14 \cdot 16 = 50.24$. Minor segment: $12.56 - 8 = 4.56$. Major segment $= 50.24 - 4.56 = 45.68$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $90^\circ$. Find the area of the major segment. Use $\pi \approx 3.14$.'
            answer: "102.78"
            solution_sketch: 'Circle: $3.14 \cdot 36 = 113.04$. Minor segment: $28.26 - 18 = 10.26$. Major segment $= 113.04 - 10.26 = 102.78$.'
          - problem: 'A chord of a circle with radius $12$ subtends a central angle of $30^\circ$. Find the area of the major segment. Use $\pi \approx 3.14$.'
            answer: "450.48"
            solution_sketch: 'Circle: $3.14 \cdot 144 = 452.16$. Minor segment: $37.68 - 36 = 1.68$. Major segment $= 452.16 - 1.68 = 450.48$.'
          - problem: 'A chord of a circle with radius $6$ subtends a central angle of $150^\circ$. Find the area of the major segment. Use $\pi \approx 3.14$.'
            answer: "74.94"
            solution_sketch: 'Circle: $3.14 \cdot 36 = 113.04$. Minor segment: $47.1 - 9 = 38.1$. Major segment $= 113.04 - 38.1 = 74.94$.'
        constraints: "major segment = circle area minus minor segment; same angle menu as kp2 plus 90 degrees; exact answers"
    diagnostic_exemplar:
      problem: 'A chord of a circle with radius $8$ subtends a central angle of $60^\circ$. Find the area of the minor segment (exact).'
      answer: "32*pi/3 - 16*sqrt(3)"
      solution_sketch: 'Sector: $\frac{60}{360} \cdot 64\pi = \frac{32\pi}{3}$. Triangle: $\frac{1}{2} \cdot 64 \cdot \sin 60^\circ = 16\sqrt{3}$. Subtract.'
    anki_seeds:
      - front: "Area of a circular segment (radius r, central angle theta in degrees):"
        back: "(theta/360) x pi r^2 - (1/2) r^2 sin(theta)  (sector minus triangle)"
        type: basic
      - front: "A chord divides a circle's interior into..."
        back: "a minor segment and a major segment"
        type: basic
      - front: "Major segment area ="
        back: "circle area - minor segment area"
        type: basic

  - id: tangent-properties
    name: Tangent Properties
    core: false                # terminal circle-theorem branch
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.6
        key: true
      - id: central-angles-arcs
        weight: 0.3
        key: false
      - id: polygon-angle-sums
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Tangent perpendicular to the radius
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'A tangent from external point $P$ touches a circle of radius $5$ at $T$. If the center $O$ satisfies $OP = 13$, find the tangent length $PT$.'
            answer: "12"
            solution_sketch: '$\triangle OTP$ is right-angled at $T$: $PT = \sqrt{13^2 - 5^2} = 12$.'
          - problem: 'A tangent from $P$ touches a circle of radius $8$ at $T$, and $OP = 17$. Find $PT$.'
            answer: "15"
            solution_sketch: '$\sqrt{17^2 - 8^2} = 15$.'
          - problem: 'A tangent from $P$ touches a circle of radius $7$ at $T$, and $OP = 25$. Find $PT$.'
            answer: "24"
            solution_sketch: 'The radius meets the tangent at a right angle: $PT = \sqrt{25^2 - 7^2} = 24$.'
          - problem: 'A tangent from $P$ touches a circle of radius $9$ at $T$, and $OP = 41$. Find $PT$.'
            answer: "40"
            solution_sketch: '$PT = \sqrt{41^2 - 9^2} = 40$.'
        constraints: "Pythagorean triples; radius-tangent right angle is the key step"
      - id: kp2
        name: Two tangents from an external point
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Two tangent segments are drawn to a circle from the same external point. One measures $9$. Find the other.'
            answer: "9"
            solution_sketch: 'Tangent segments from a common external point are congruent.'
          - problem: 'Tangent segments from external point $P$ measure $2x + 3$ and $x + 10$. Find the tangent length.'
            answer: "17"
            solution_sketch: '$2x + 3 = x + 10 \Rightarrow x = 7$; length $= 17$.'
          - problem: 'Two tangent segments are drawn to a circle from the same external point. One measures $14$. Find the other.'
            answer: "14"
            solution_sketch: 'Tangent segments from a common external point are congruent.'
          - problem: 'Tangent segments from external point $P$ measure $3x - 4$ and $2x + 6$. Find the tangent length.'
            answer: "26"
            solution_sketch: '$3x - 4 = 2x + 6 \Rightarrow x = 10$; length $= 26$.'
        constraints: "congruent tangent pairs; linear setups with integer solutions"
      - id: kp3
        name: Angle between two tangents
        key_prerequisites: [polygon-angle-sums]
        exemplars:
          - problem: 'Tangents from $P$ touch circle $O$ at $A$ and $B$, and central angle $\angle AOB = 130^\circ$. Find $m\angle APB$, in degrees.'
            answer: "50"
            solution_sketch: 'Quadrilateral $PAOB$ has right angles at $A$ and $B$: $360 - 90 - 90 - 130 = 50$.'
          - problem: 'Tangents from $P$ meet a circle at $A$ and $B$ with $m\angle APB = 40^\circ$. Find central angle $\angle AOB$, in degrees.'
            answer: "140"
            solution_sketch: '$\angle APB + \angle AOB = 180$ in quadrilateral $PAOB$.'
          - problem: 'Tangents from $P$ touch circle $O$ at $A$ and $B$, and central angle $\angle AOB = 220^\circ$. Find $m\angle APB$, in degrees.'
            answer: "40"
            solution_sketch: '$360 - 90 - 90 - 220 = 40$.'
          - problem: 'Tangents from $P$ meet a circle at $A$ and $B$ with $m\angle APB = 65^\circ$. Find central angle $\angle AOB$, in degrees.'
            answer: "115"
            solution_sketch: 'Supplementary in quadrilateral $PAOB$: $180 - 65 = 115$.'
        constraints: "the tangent-tangent angle and the central angle are supplementary"
    diagnostic_exemplar:
      problem: 'Tangents from external point $P$ touch a circle of radius $6$ centered at $O$ at the points $A$ and $B$, with $OP = 10$. Find $PA + PB$.'
      answer: '16'
      solution_sketch: 'The radius is perpendicular to the tangent, so $PA = \sqrt{10^2 - 6^2} = 8$; the two tangent segments from $P$ are congruent, so $PA + PB = 16$.'
    anki_seeds:
      - front: "A tangent line meets the radius drawn to the point of tangency at..."
        back: "a right angle"
        type: basic
      - front: "Two tangent segments drawn from the same external point are..."
        back: "congruent"
        type: basic

  - id: chord-properties
