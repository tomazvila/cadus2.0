    knowledge_points:
      - id: kp1
        name: Perpendicular from the center bisects a chord
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'A circle has radius $10$; a chord measures $16$. Find the distance from the center to the chord.'
            answer: "6"
            solution_sketch: 'The perpendicular from the center bisects the chord: $\sqrt{10^2 - 8^2} = 6$.'
          - problem: 'A chord lies $4$ units from the center of a circle with radius $5$. Find the chord''s length.'
            answer: "6"
            solution_sketch: 'Half-chord $= \sqrt{25 - 16} = 3$, so the chord is $6$.'
        constraints: "half-chord, distance, radius form a Pythagorean triple"
      - id: kp2
        name: Congruent chords, arcs, and distances
        key_prerequisites: [central-angles-arcs]
        exemplars:
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ of a circle are congruent, and arc $AB$ measures $75^\circ$. Find arc $CD$, in degrees.'
            answer: "75"
            solution_sketch: 'Congruent chords cut off congruent arcs.'
          - problem: 'Two chords of a circle are both $9$ units long. The first lies $4$ units from the center. How far from the center is the second?'
            answer: "4"
            solution_sketch: 'Congruent chords are equidistant from the center.'
        constraints: "congruent chords <-> congruent arcs <-> equal distances"
      - id: kp3
        name: Find the radius from a chord
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'A chord of length $24$ lies $5$ units from the center of a circle. Find the radius.'
            answer: "13"
            solution_sketch: '$r = \sqrt{12^2 + 5^2} = 13$.'
          - problem: 'A chord of length $40$ lies $21$ units from the center. Find the radius.'
            answer: "29"
            solution_sketch: '$r = \sqrt{20^2 + 21^2} = 29$.'
        constraints: "half-chord and distance form a Pythagorean triple with the radius"
    diagnostic_exemplar:
      problem: 'A chord of length $24$ sits in a circle of radius $13$. How far is the chord from the center?'
      answer: "5"
      solution_sketch: '$\sqrt{13^2 - 12^2} = 5$.'
    anki_seeds:
      - front: "The perpendicular from the center of a circle to a chord..."
        back: "bisects the chord"
        type: basic
      - front: "Congruent chords of a circle are ... from the center."
        back: "equidistant"
        type: basic

  - id: chords-tangents-arcs
    name: Chords, Tangents, and Arcs
    core: false                # terminal circle-theorem branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: tangent-properties
        weight: 0.7
        key: true
      - id: chord-properties
        weight: 0.7
        key: true
      - id: central-inscribed-angles
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Intersecting chords - segment products
        key_prerequisites: [chord-properties]
        exemplars:
          - problem: 'Two chords intersect inside a circle. One is split into segments $3$ and $8$; the other into $4$ and $x$. Find $x$.'
            answer: "6"
            solution_sketch: '$3 \cdot 8 = 4x \Rightarrow x = 6$.'
          - problem: 'Two chords intersect inside a circle. One is split into segments $2$ and $12$; the other into $6$ and $x$. Find $x$.'
            answer: "4"
            solution_sketch: '$2 \cdot 12 = 6x \Rightarrow x = 4$.'
        constraints: "products equal; integer answers"
      - id: kp2
        name: Intersecting chords - angle measures
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two chords intersect inside a circle, forming an angle that intercepts arcs of $70^\circ$ and $110^\circ$. Find the angle, in degrees.'
            answer: "90"
            solution_sketch: 'The angle is half the sum of the intercepted arcs: $\frac{70 + 110}{2} = 90$.'
          - problem: 'Two chords intersect inside a circle, forming an angle that intercepts arcs of $55^\circ$ and $89^\circ$. Find the angle, in degrees.'
            answer: "72"
            solution_sketch: '$\frac{55 + 89}{2} = 72$.'
        constraints: "angle = half the arc sum; arc sums even"
      - id: kp3
        name: Combined chord and tangent computations
        key_prerequisites: [tangent-properties, chord-properties]
        exemplars:
          - problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 4$, $PB = 9$, and $CP = 6$. Find the length of chord $\overline{CD}$.'
            answer: "12"
            solution_sketch: '$4 \cdot 9 = 6 \cdot PD \Rightarrow PD = 6$; $CD = 6 + 6 = 12$.'
          - problem: 'In a circle of radius $10$, a chord lies $6$ from the center, and a tangent is drawn from a point $P$ with $OP = 26$. Find (chord length) $+$ (tangent length).'
            answer: "40"
            solution_sketch: 'Chord $= 2\sqrt{100 - 36} = 16$; tangent $= \sqrt{26^2 - 10^2} = 24$; sum $= 40$.'
        constraints: "multi-step; Pythagorean triples and clean products"
    diagnostic_exemplar:
      problem: 'Chords $\overline{AB}$ and $\overline{CD}$ intersect at $P$ with $AP = 3$, $PB = 8$, and $CP = 4$. Find the length of chord $\overline{CD}$.'
      answer: "10"
      solution_sketch: '$3 \cdot 8 = 4 \cdot PD \Rightarrow PD = 6$; $CD = 4 + 6 = 10$.'
    anki_seeds:
      - front: "When two chords intersect inside a circle, the products of their segments are..."
        back: "equal"
        type: basic
      - front: "The angle between two chords intersecting inside a circle equals..."
        back: "half the sum of the two intercepted arcs"
        type: basic

  - id: secant-tangent-angles
    name: Secant and Tangent Angles
    core: false                # terminal circle-theorem branch
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: central-inscribed-angles
        weight: 0.7
        key: true
      - id: tangent-properties
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Tangent-chord angles
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'A tangent and a chord meet at the point of tangency, and the chord cuts off an arc of $150^\circ$ on the angle''s side. Find the tangent-chord angle, in degrees.'
            answer: "75"
            solution_sketch: 'A tangent-chord angle is half its intercepted arc: $150/2 = 75$.'
          - problem: 'A tangent-chord angle measures $62^\circ$. Find its intercepted arc, in degrees.'
            answer: "124"
        constraints: "even arcs so angles are whole degrees"
      - id: kp2
        name: Angles formed by two secants
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two secants from an external point intercept arcs of $120^\circ$ (far) and $40^\circ$ (near). Find the angle at the external point, in degrees.'
            answer: "40"
            solution_sketch: 'External angle $= \frac{120 - 40}{2} = 40$.'
          - problem: 'Two secants from an external point form a $25^\circ$ angle, and the far intercepted arc measures $110^\circ$. Find the near arc, in degrees.'
            answer: "60"
            solution_sketch: '$\frac{110 - x}{2} = 25 \Rightarrow x = 60$.'
        constraints: "external angle = half the difference of intercepted arcs"
      - id: kp3
        name: Angles formed by two tangents
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two tangents from an external point intercept arcs of $210^\circ$ and $150^\circ$. Find the angle between the tangents, in degrees.'
            answer: "30"
            solution_sketch: '$\frac{210 - 150}{2} = 30$.'
          - problem: 'Two tangents from an external point form a $40^\circ$ angle. Find the major intercepted arc, in degrees.'
            answer: "220"
            solution_sketch: '$x + y = 360$ and $\frac{x - y}{2} = 40$, so $x = 220$.'
        constraints: "the two arcs sum to 360; half-difference formula"
    diagnostic_exemplar:
      problem: 'Two tangents from an external point form a $50^\circ$ angle. Find the major intercepted arc, in degrees.'
      answer: "230"
      solution_sketch: '$x + y = 360$ and $\frac{x - y}{2} = 50$, so $x - y = 100$ and $x = 230$.'
    anki_seeds:
      - front: "An angle formed outside a circle by two secants/tangents equals..."
        back: "half the difference of the intercepted arcs"
        type: basic
      - front: "A tangent-chord angle equals..."
        back: "half its intercepted arc"
        type: basic

  - id: secant-tangent-segment-lengths
    name: Secant and Tangent Segment Lengths
    core: false                # terminal circle-theorem branch
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: chords-tangents-arcs
        weight: 0.7
        key: true
      - id: quadratic-equations-factoring
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Two secants from an external point
        key_prerequisites: [chords-tangents-arcs]
        exemplars:
          - problem: 'From external point $P$, a secant meets a circle at $A$ then $B$ with $PA = 4$ and $PB = 12$. A second secant meets it at $C$ then $D$ with $PC = 6$. Find $PD$.'
            answer: "8"
            solution_sketch: '$PA \cdot PB = PC \cdot PD$: $4 \cdot 12 = 6 \cdot PD \Rightarrow PD = 8$.'
          - problem: 'From $P$, secants give $PA = 5$, $PB = 16$, $PC = 8$. Find $PD$.'
            answer: "10"
            solution_sketch: '$5 \cdot 16 = 8 \cdot PD \Rightarrow PD = 10$.'
        constraints: "use whole (external x whole) products; near point listed first; integer answers"
      - id: kp2
        name: Secant-tangent relationships
        key_prerequisites: [chords-tangents-arcs]
        exemplars:
          - problem: 'From external point $P$, a tangent touches the circle at $T$ and a secant meets it at $A$ then $B$, with $PA = 3$ and $PB = 12$. Find $PT$.'
            answer: "6"
            solution_sketch: '$PT^2 = PA \cdot PB = 36 \Rightarrow PT = 6$.'
          - problem: 'From $P$, the tangent length is $PT = 10$ and the secant''s near intersection gives $PA = 5$. Find the chord length $AB$.'
            answer: "15"
            solution_sketch: '$PT^2 = PA \cdot PB \Rightarrow PB = 100/5 = 20$; $AB = PB - PA = 15$.'
        constraints: "PT^2 = PA x PB; perfect squares for tangent answers"
      - id: kp3
        name: Solve with a variable segment
        key_prerequisites: [chords-tangents-arcs, quadratic-equations-factoring]
        exemplars:
          - problem: 'From external point $P$, a tangent has length $6$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 5$. Find $PA$.'
            answer: "4"
            solution_sketch: '$x(x + 5) = 36 \Rightarrow x^2 + 5x - 36 = 0 \Rightarrow (x + 9)(x - 4) = 0 \Rightarrow x = 4$.'
          - problem: 'From external point $P$, a tangent has length $8$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 12$. Find $PA$.'
            answer: "4"
            solution_sketch: '$x(x + 12) = 64 \Rightarrow x^2 + 12x - 64 = 0 \Rightarrow (x + 16)(x - 4) = 0 \Rightarrow x = 4$.'
        constraints: "quadratics that factor over the integers; reject the negative root"
    diagnostic_exemplar:
      problem: 'From external point $P$, a tangent has length $10$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 21$. Find $PA$.'
      answer: "4"
      solution_sketch: '$x(x + 21) = 100 \Rightarrow x^2 + 21x - 100 = 0 \Rightarrow (x + 25)(x - 4) = 0 \Rightarrow x = 4$.'
    anki_seeds:
      - front: "Tangent PT and secant PAB from the same external point P satisfy..."
        back: "PT^2 = PA x PB (tangent squared = external x whole)"
        type: basic
      - front: "Two secants PAB, PCD from the same external point satisfy..."
        back: "PA x PB = PC x PD"
        type: basic

  - id: equations-of-circles
    name: Equations of Circles
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.7
        key: true
      - id: completing-the-square
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form from center and radius
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'Write the equation of the circle with center $(2, -3)$ and radius $4$.'
            answer: '$(x - 2)^2 + (y + 3)^2 = 16$'
            solution_sketch: 'Standard form $(x - h)^2 + (y - k)^2 = r^2$.'
          - problem: 'Write the equation of the circle centered at the origin with radius $\sqrt{7}$.'
            answer: '$x^2 + y^2 = 7$'
        constraints: "integer centers; r^2 stays exact"
      - id: kp2
        name: Read off the center and radius; test points
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'State the center and radius of $(x + 1)^2 + (y - 5)^2 = 36$.'
            answer: 'center $(-1, 5)$, radius $6$'
            solution_sketch: '$h = -1$, $k = 5$, $r = \sqrt{36} = 6$.'
          - problem: 'Does the point $(3, 2)$ lie on the circle $x^2 + y^2 = 13$? Answer yes or no.'
            answer: 'yes'
            solution_sketch: '$3^2 + 2^2 = 13$.'
        constraints: "perfect-square r^2 when a numeric radius is requested; watch the sign flips"
      - id: kp3
        name: General form and completing the square
        key_prerequisites: [distance-midpoint-formulas, completing-the-square]
        exemplars:
          - problem: 'Find the center and radius of $x^2 + y^2 - 6x + 4y - 12 = 0$.'
            answer: 'center $(3, -2)$, radius $5$'
            solution_sketch: '$(x - 3)^2 + (y + 2)^2 = 12 + 9 + 4 = 25$.'
          - problem: 'Find the radius of $x^2 + y^2 + 2x - 8y + 8 = 0$.'
            answer: "3"
            solution_sketch: '$(x + 1)^2 + (y - 4)^2 = -8 + 1 + 16 = 9$, so $r = 3$.'
          - problem: 'Write the equation of the circle with center $(1, 2)$ passing through $(4, 6)$.'
            answer: '$(x - 1)^2 + (y - 2)^2 = 25$'
            solution_sketch: '$r = \sqrt{3^2 + 4^2} = 5$, so $r^2 = 25$.'
        constraints: "even linear coefficients so completing the square is clean; positive right side"
    diagnostic_exemplar:
      problem: 'Find the center and radius of $x^2 + y^2 - 4x + 6y - 3 = 0$.'
      answer: 'center $(2, -3)$, radius $4$'
      solution_sketch: '$(x - 2)^2 + (y + 3)^2 = 3 + 4 + 9 = 16$, so $r = 4$.'
    anki_seeds:
      - front: 'Standard form of a circle with center $(h, k)$ and radius $r$:'
        back: '$(x - h)^2 + (y - k)^2 = r^2$'
        type: basic
      - front: 'To find the center/radius of $x^2 + y^2 + Dx + Ey + F = 0$:'
        back: "complete the square in x and y"
        type: basic
