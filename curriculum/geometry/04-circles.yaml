        key: true
      - id: tangent-properties
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Tangent-chord angles
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'A tangent and a chord meet at the point of tangency, and the chord cuts off an arc of $150^\circ$ on the angle''s side. Find the tangent-chord angle, in degrees.'
            answer: "75"
            solution_sketch: 'A tangent-chord angle is half its intercepted arc: $150/2 = 75$.'
          - problem: 'A tangent-chord angle measures $62^\circ$. Find its intercepted arc, in degrees.'
            answer: "124"
            solution_sketch: 'The angle is half the arc, so the arc is $2 \cdot 62 = 124$.'
          - problem: 'A tangent and a chord meet at the point of tangency, and the chord cuts off an arc of $104^\circ$ on the angle''s side. Find the tangent-chord angle, in degrees.'
            answer: "52"
            solution_sketch: '$104/2 = 52$.'
          - problem: 'A tangent-chord angle measures $47^\circ$. Find its intercepted arc, in degrees.'
            answer: "94"
            solution_sketch: 'The intercepted arc is twice the angle: $2 \cdot 47 = 94$.'
        constraints: "even arcs so angles are whole degrees"
      - id: kp2
        name: Angles formed by two secants
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two secants from an external point intercept arcs of $120^\circ$ (far) and $40^\circ$ (near). Find the angle at the external point, in degrees.'
            answer: "40"
            solution_sketch: 'External angle $= \frac{120 - 40}{2} = 40$.'
          - problem: 'Two secants from an external point form a $25^\circ$ angle, and the far intercepted arc measures $110^\circ$. Find the near arc, in degrees.'
            answer: "60"
            solution_sketch: '$\frac{110 - x}{2} = 25 \Rightarrow x = 60$.'
          - problem: 'Two secants from an external point intercept arcs of $160^\circ$ (far) and $60^\circ$ (near). Find the angle at the external point, in degrees.'
            answer: "50"
            solution_sketch: '$\frac{160 - 60}{2} = 50$.'
          - problem: 'Two secants from an external point form a $30^\circ$ angle, and the near intercepted arc measures $45^\circ$. Find the far arc, in degrees.'
            answer: "105"
            solution_sketch: '$\frac{x - 45}{2} = 30 \Rightarrow x = 105$.'
        constraints: "external angle = half the difference of intercepted arcs"
      - id: kp3
        name: Angles formed by two tangents
        key_prerequisites: [central-inscribed-angles]
        exemplars:
          - problem: 'Two tangents from an external point intercept arcs of $210^\circ$ and $150^\circ$. Find the angle between the tangents, in degrees.'
            answer: "30"
            solution_sketch: '$\frac{210 - 150}{2} = 30$.'
          - problem: 'Two tangents from an external point form a $40^\circ$ angle. Find the major intercepted arc, in degrees.'
            answer: "220"
            solution_sketch: '$x + y = 360$ and $\frac{x - y}{2} = 40$, so $x = 220$.'
          - problem: 'Two tangents from an external point intercept arcs of $240^\circ$ and $120^\circ$. Find the angle between the tangents, in degrees.'
            answer: "60"
            solution_sketch: '$\frac{240 - 120}{2} = 60$.'
          - problem: 'Two tangents from an external point form a $70^\circ$ angle. Find the major intercepted arc, in degrees.'
            answer: "250"
            solution_sketch: '$x + y = 360$ and $x - y = 140$, so $x = 250$.'
        constraints: "the two arcs sum to 360; half-difference formula"
    diagnostic_exemplar:
      problem: 'Two tangents from an external point form a $50^\circ$ angle. Find the major intercepted arc, in degrees.'
      answer: "230"
      solution_sketch: '$x + y = 360$ and $\frac{x - y}{2} = 50$, so $x - y = 100$ and $x = 230$.'
    anki_seeds:
      - front: "An angle formed outside a circle by two secants/tangents equals..."
        back: "half the difference of the intercepted arcs"
        type: basic
      - front: "A tangent-chord angle equals..."
        back: "half its intercepted arc"
        type: basic

  - id: secant-tangent-segment-lengths
    name: Secant and Tangent Segment Lengths
    core: false                # terminal circle-theorem branch
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: chords-tangents-arcs
        weight: 0.7
        key: true
      - id: quadratic-equations-factoring
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Two secants from an external point
        key_prerequisites: [chords-tangents-arcs]
        exemplars:
          - problem: 'From external point $P$, a secant meets a circle at $A$ then $B$ with $PA = 4$ and $PB = 12$. A second secant meets it at $C$ then $D$ with $PC = 6$. Find $PD$.'
            answer: "8"
            solution_sketch: '$PA \cdot PB = PC \cdot PD$: $4 \cdot 12 = 6 \cdot PD \Rightarrow PD = 8$.'
          - problem: 'From $P$, secants give $PA = 5$, $PB = 16$, $PC = 8$. Find $PD$.'
            answer: "10"
            solution_sketch: '$5 \cdot 16 = 8 \cdot PD \Rightarrow PD = 10$.'
          - problem: 'From external point $P$, a secant meets a circle at $A$ then $B$ with $PA = 3$ and $PB = 20$. A second secant meets it at $C$ then $D$ with $PC = 4$. Find $PD$.'
            answer: "15"
            solution_sketch: '$3 \cdot 20 = 4 \cdot PD \Rightarrow PD = 15$.'
          - problem: 'From external point $P$, a secant meets a circle at $A$ then $B$ with $PA = 6$ and $PB = 14$. A second secant meets it at $C$ then $D$ with $PC = 7$. Find $PD$.'
            answer: "12"
            solution_sketch: '$6 \cdot 14 = 7 \cdot PD \Rightarrow PD = 12$.'
        constraints: "use whole (external x whole) products; near point listed first; integer answers"
      - id: kp2
        name: Secant-tangent relationships
        key_prerequisites: [chords-tangents-arcs]
        exemplars:
          - problem: 'From external point $P$, a tangent touches the circle at $T$ and a secant meets it at $A$ then $B$, with $PA = 3$ and $PB = 12$. Find $PT$.'
            answer: "6"
            solution_sketch: '$PT^2 = PA \cdot PB = 36 \Rightarrow PT = 6$.'
          - problem: 'From $P$, the tangent length is $PT = 10$ and the secant''s near intersection gives $PA = 5$. Find the chord length $AB$.'
            answer: "15"
            solution_sketch: '$PT^2 = PA \cdot PB \Rightarrow PB = 100/5 = 20$; $AB = PB - PA = 15$.'
          - problem: 'From external point $P$, a tangent touches the circle at $T$ and a secant meets it at $A$ then $B$, with $PA = 4$ and $PB = 25$. Find $PT$.'
            answer: "10"
            solution_sketch: '$PT^2 = 4 \cdot 25 = 100 \Rightarrow PT = 10$.'
          - problem: 'From external point $P$, a tangent touches the circle at $T$ and a secant meets it at $A$ then $B$, with $PA = 7$ and $PB = 28$. Find $PT$.'
            answer: "14"
            solution_sketch: '$PT^2 = 7 \cdot 28 = 196 \Rightarrow PT = 14$.'
        constraints: "PT^2 = PA x PB; perfect squares for tangent answers"
      - id: kp3
        name: Solve with a variable segment
        key_prerequisites: [chords-tangents-arcs, quadratic-equations-factoring]
        exemplars:
          - problem: 'From external point $P$, a tangent has length $6$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 5$. Find $PA$.'
            answer: "4"
            solution_sketch: '$x(x + 5) = 36 \Rightarrow x^2 + 5x - 36 = 0 \Rightarrow (x + 9)(x - 4) = 0 \Rightarrow x = 4$.'
          - problem: 'From external point $P$, a tangent has length $10$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 15$. Find $PA$.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: 'The tangent length squared equals the whole secant times its outer part, so $x(x + 15) = 100$. Then $x^2 + 15x - 100 = 0$, which factors as $(x + 20)(x - 5) = 0$, so $x = 5$.'
          - problem: 'From external point $P$, a tangent has length $12$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 7$. Find $PA$.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: 'The tangent length squared equals the whole secant times its outer part, so $x(x + 7) = 144$. Then $x^2 + 7x - 144 = 0$, which factors as $(x + 16)(x - 9) = 0$, so $x = 9$.'
          - problem: 'From external point $P$, a tangent has length $6$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 9$. Find $PA$.'
            answer: "3"
            solution_sketch: '$x(x + 9) = 36 \Rightarrow x^2 + 9x - 36 = 0 \Rightarrow (x + 12)(x - 3) = 0 \Rightarrow x = 3$.'
        constraints: "quadratics that factor over the integers; reject the negative root"
    diagnostic_exemplar:
      problem: 'From external point $P$, a tangent has length $10$ and a secant meets the circle at $A$ then $B$ with $PA = x$ and $AB = 21$. Find $PA$.'
      answer: "4"
      solution_sketch: '$x(x + 21) = 100 \Rightarrow x^2 + 21x - 100 = 0 \Rightarrow (x + 25)(x - 4) = 0 \Rightarrow x = 4$.'
    anki_seeds:
      - front: "Tangent PT and secant PAB from the same external point P satisfy..."
        back: "PT^2 = PA x PB (tangent squared = external x whole)"
        type: basic
      - front: "Two secants PAB, PCD from the same external point satisfy..."
        back: "PA x PB = PC x PD"
        type: basic

  - id: equations-of-circles
    name: Equations of Circles
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.7
        key: true
      - id: completing-the-square
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form from center and radius
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'Write the equation of the circle with center $(2, -3)$ and radius $4$.'
            answer: '(x - 2)^2 + (y + 3)^2 = 16'
            answer_contract: {kind: polynomial_relation}
            solution_sketch: 'Standard form $(x - h)^2 + (y - k)^2 = r^2$.'
          - problem: 'Write the equation of the circle centered at the origin with radius $\sqrt{7}$.'
            answer: 'x^2 + y^2 = 7'
            answer_contract: {kind: polynomial_relation}
            solution_sketch: 'A circle centered at the origin with radius $\sqrt{7}$ has $r^2 = 7$.'
          - problem: 'A circle has center $(3, -1)$ and radius $6$. Find $r^2$.'
            answer: "36"
            solution_sketch: 'In standard form $(x - h)^2 + (y - k)^2 = r^2$, the right side is $r^2 = 36$.'
          - problem: 'A circle centered at the origin has radius $\sqrt{10}$. Find $r^2$.'
            answer: "10"
            solution_sketch: 'The equation is $x^2 + y^2 = r^2$, and $r^2 = (\sqrt{10})^2 = 10$.'
          - problem: 'A circle has center $(-3, 5)$ and radius $4$. Find $r^2$.'
            answer: "16"
            solution_sketch: '$r^2 = 4^2 = 16$, regardless of the center.'
          - problem: 'A circle has center $(2, 7)$ and $r^2 = 25$. Find its radius.'
            answer: "5"
            solution_sketch: '$r = \sqrt{25} = 5$.'
        constraints: "integer centers; r^2 stays exact"
      - id: kp2
        name: Read off the center and radius; test points
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: "A circle has equation (x - 2)^2 + (y + 3)^2 = 49. State its center as (h, k) and its radius as a number."
            answer: "center = (2, -3); radius = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "exact"}, "name": "radius"}]}
            solution_sketch: "Compare the equation with the standard form (x - h)^2 + (y - k)^2 = r^2. The sign flip gives h = 2 from x - 2 and k = -3 from y + 3. Take the square root of the right side: sqrt(49) = 7. So center = (2, -3); radius = 7."
          - problem: "For the circle (x - 1)^2 + (y - 2)^2 = 25 and the point (5, 2), compute the value of (x - 1)^2 + (y - 2)^2 at the point, then state whether the point is inside the circle or outside it; give the value first and the verdict second."
            answer: "value = 16; verdict = in"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "value"}, {"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}]}
            solution_sketch: "Substitute the point into the left side of the circle equation. Compute (5 - 1)^2 + (2 - 2)^2 = 16 + 0 = 16. Compare 16 with the right side 25; since 16 is less than 25, the point lies inside the circle. So value = 16; verdict = in."
          - problem: 'What is the radius of the circle $(x - 3)^2 + (y + 4)^2 = 81$?'
            answer: "9"
            solution_sketch: '$r = \sqrt{81} = 9$.'
          - problem: "For the circle (x + 2)^2 + (y - 5)^2 = 16 and the point (2, 7), compute the value of (x + 2)^2 + (y - 5)^2 at the point, and give the answer as a number."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the point coordinates into the left side of the equation. Compute (2 + 2)^2 + (7 - 5)^2 = 16 + 4 = 20. The value of the left side at the point is 20."
          - problem: "Which of the listed points lies on the circle (x - 3)^2 + (y + 2)^2 = 25?"
            answer: "(6, 2)"
            answer_contract: {"kind": "label", "options": [["(6, 2)"], ["(1, 1)"], ["(7, -2)"], ["(3, 0)"]]}
            solution_sketch: "Substitute each listed point into the left side (x - 3)^2 + (y + 2)^2 and compare with 25. For (1, 1) the value is 4 + 9 = 13, not 25, the error being wrong signs on the x difference; for (7, -2) the value is 16 + 0 = 16, not 25, the error being a skipped y difference; for (3, 0) the value is 0 + 4 = 4, not 25, the error being a misread y term in y + 2. For (6, 2) the value is 9 + 16 = 25, which matches the right side. So the point is (6, 2)."
        constraints: "perfect-square r^2 when a numeric radius is requested; watch the sign flips"
      - id: kp3
        name: General form and completing the square
        key_prerequisites: [distance-midpoint-formulas, completing-the-square]
        exemplars:
          - problem: 'Find the radius of $x^2 + y^2 + 2x - 8y + 8 = 0$.'
            answer: "3"
            solution_sketch: '$(x + 1)^2 + (y - 4)^2 = -8 + 1 + 16 = 9$, so $r = 3$.'
          - problem: 'Write the equation of the circle with center $(1, 2)$ passing through $(4, 6)$.'
            answer: '(x - 1)^2 + (y - 2)^2 = 25'
            answer_contract: {kind: polynomial_relation}
            solution_sketch: '$r = \sqrt{3^2 + 4^2} = 5$, so $r^2 = 25$.'
          - problem: 'Find the radius of $x^2 + y^2 - 4x + 6y - 12 = 0$.'
            answer: "5"
            solution_sketch: '$(x - 2)^2 + (y + 3)^2 = 4 + 9 + 12 = 25$, so $r = 5$.'
          - problem: 'For the circle $x^2 + y^2 + 10x - 4y + 4 = 0$, find the $x$-coordinate of its center.'
            answer: "-5"
            solution_sketch: '$(x + 5)^2 + (y - 2)^2 = 25 + 4 - 4 = 25$; the center is $(-5, 2)$, so the $x$-coordinate is $-5$.'
          - problem: 'Find the radius of $x^2 + y^2 - 2x + 12y + 21 = 0$.'
            answer: "4"
            solution_sketch: '$(x - 1)^2 + (y + 6)^2 = 1 + 36 - 21 = 16$, so $r = 4$.'
          - problem: "A circle has equation $x^2 + y^2 - 10x + 6y + 30 = 0$. Complete the square to put it in standard form. Give the center as (x, y) and the radius as a number."
            answer: "center = (5,-3); radius = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "exact"}, "name": "radius"}]}
            solution_sketch: "Move the constant to the right: $x^2 - 10x + y^2 + 6y = -30$. Complete the square in each variable: $(x - 5)^2$ contributes 25 and $(y + 3)^2$ contributes 9, so the standard form is $(x - 5)^2 + (y + 3)^2 = 25 + 9 - 30 = 4$. Reading off the standard form $(x - h)^2 + (y - k)^2 = r^2$ gives center $(5, -3)$ and radius $\\sqrt{4} = 2$. The answer is center = (5,-3); radius = 2."
        constraints: "even linear coefficients so completing the square is clean; positive right side"
    diagnostic_exemplar:
      problem: 'Find the center and radius of $x^2 + y^2 - 4x + 6y - 3 = 0$.'
      answer: 'center $(2, -3)$, radius $4$'
      answer_contract: {kind: none}
      solution_sketch: '$(x - 2)^2 + (y + 3)^2 = 3 + 4 + 9 = 16$, so $r = 4$.'
    anki_seeds:
      - front: 'Standard form of a circle with center $(h, k)$ and radius $r$:'
        back: '$(x - h)^2 + (y - k)^2 = r^2$'
        type: basic
      - front: 'To find the center/radius of $x^2 + y^2 + Dx + Ey + F = 0$:'
        back: "complete the square in x and y"
        type: basic
