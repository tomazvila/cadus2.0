  - id: polygon-angle-sums
    name: Polygon Angle Sums
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: interior-angles-polygons
        weight: 0.8
        key: true
      - id: exterior-angles-polygons
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Solve for unknown angles algebraically
        key_prerequisites: [interior-angles-polygons, multi-step-equations]
        step_check:
          step: 'Recall the sum of interior angles for a hexagon'
          question: 'Why must the six angle expressions add to $720$?'
          options:
            - 'Each angle expression is equal to $720$ divided by six, so the expressions are equal to one another'
            - 'The six angles are the interior angles of a hexagon, which always sum to $720^\circ$'
            - 'The six angles lie along a straight line, so their expressions add to a full turn of $720^\circ$'
            - 'The value of $x$ is not known yet, so the total is taken from the exterior angle sum'
          answer: 'The six angles are the interior angles of a hexagon, which always sum to $720^\circ$'
          why: 'The interior angles of a hexagon sum to $(6 - 2) \cdot 180 = 720^\circ$ whatever their sizes, which gives $6x + 75 = 720$ for angles $x$, $x + 5$, up to $x + 25$. The six angles are not equal, they do not lie on a line, and the exterior angle sum is $360^\circ$, not $720^\circ$.'
        exemplars:
          - problem: 'The angles of a quadrilateral measure $x^\circ$, $(2x)^\circ$, $(3x)^\circ$ and $(4x)^\circ$. Find the largest angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '144'
            solution_sketch: 'The interior angles of a quadrilateral sum to $360^\circ$, so $10x = 360$ and $x = 36$. The largest angle is $4x = 144^\circ$.'
          - problem: 'A carpenter cuts a board into a quadrilateral whose corner angles measure $(2x + 10)^\circ$, $(3x)^\circ$, $(4x)^\circ$ and $(5x)^\circ$. Find the largest corner angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '125'
            solution_sketch: 'The corner angles sum to $360^\circ$, so $14x + 10 = 360$ and $x = 25$. The largest angle is $5x = 125^\circ$.'
          - problem: 'The angles of a pentagon measure $x^\circ$, $(x + 10)^\circ$, $(x + 20)^\circ$, $(x + 30)^\circ$ and $(x + 40)^\circ$. Find the largest angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '128'
            solution_sketch: 'The interior angles of a pentagon sum to $540^\circ$, so $5x + 100 = 540$ and $x = 88$. The largest angle is $x + 40 = 128^\circ$.'
          - problem: 'The cross-section of a steel beam is a hexagon with interior angles $(x + 5)^\circ$, $(x + 15)^\circ$, $(x + 25)^\circ$, $(x + 35)^\circ$, $(x + 45)^\circ$ and $(x + 55)^\circ$. Find the largest angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '145'
            solution_sketch: 'The interior angles of a hexagon sum to $720^\circ$, so $6x + 180 = 720$ and $x = 90$. The largest angle is $x + 55 = 145^\circ$.'
          - problem: 'In pentagon $ABCDE$, $m\angle A = (2x)^\circ$, $m\angle B = (x + 30)^\circ$, $m\angle C = 100^\circ$, and $\angle D$ and $\angle E$ each measure $(3x - 20)^\circ$. Find $m\angle D$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '130'
            solution_sketch: 'The interior angles sum to $540^\circ$, so $2x + (x + 30) + 100 + 2(3x - 20) = 540$. This simplifies to $9x + 90 = 540$, so $x = 50$ and $m\angle D = 3(50) - 20 = 130^\circ$.'
          - problem: 'A park is a quadrilateral whose corner angles measure $x^\circ$, $(2x)^\circ$, $(2x)^\circ$ and $(x + 60)^\circ$. Find its largest corner angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'The corner angles sum to $360^\circ$, so $6x + 60 = 360$ and $x = 50$. The angles are $50^\circ$, $100^\circ$, $100^\circ$ and $110^\circ$, so the largest is $110^\circ$.'
          - problem: 'The interior angles of a hexagon are in the ratio $2 : 3 : 3 : 4 : 4 : 4$. Find the smallest angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '72'
            solution_sketch: 'The interior angles of a hexagon sum to $720^\circ$, and the ratio has $2 + 3 + 3 + 4 + 4 + 4 = 20$ parts. One part is $720 / 20 = 36^\circ$, so the smallest angle is $2 \cdot 36 = 72^\circ$.'
        constraints: "linear angle expressions, ratios and two equal angles; the equation always comes from the angle sum; integer solutions; at least two real contexts"
      - id: kp2
        name: Count sides from an interior angle
        key_prerequisites: [exterior-angles-polygons]
        step_check:
          step: 'Divide the total exterior angle sum by one exterior angle'
          question: 'Why does dividing the exterior angle total by one exterior angle give the number of sides?'
          options:
            - 'The $n$ interior angles are equal and total $360^\circ$, so the quotient counts them'
            - 'The quotient is the length of each side, since the perimeter of a convex polygon is $360$'
            - 'The quotient counts how many exterior angles fit into a straight angle of $180^\circ$'
            - 'The $n$ exterior angles are equal and total $360^\circ$, so the quotient counts them'
          answer: 'The $n$ exterior angles are equal and total $360^\circ$, so the quotient counts them'
          why: 'In a regular polygon with interior angles of $150^\circ$ each exterior angle is $180 - 150 = 30^\circ$, and the $n$ exterior angles sum to $360^\circ$. The interior angles sum to $(n - 2) \cdot 180$, a side length is not an angle, and $180^\circ$ is not the total.'
        exemplars:
          - problem: 'Each interior angle of a regular polygon measures $144^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'Each exterior angle is $180 - 144 = 36^\circ$. The exterior angles sum to $360^\circ$, so $n = 360 / 36 = 10$.'
          - problem: 'A glass panel is made of regular polygons whose interior angles measure $140^\circ$ each. How many sides does each polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Each exterior angle is $180 - 140 = 40^\circ$. The number of sides is $360 / 40 = 9$.'
          - problem: 'Could a regular polygon have an interior angle of $100^\circ$ at every vertex?'
            answer_contract: {"kind":"label","options":[["no","no, it could not","it could not","not possible","it can't","it cannot","impossible"],["yes","yes, it could","it could","possible","it can","yes, it can"]]}
            answer: 'no'
            solution_sketch: 'Each exterior angle would be $180 - 100 = 80^\circ$. The number of sides would be $360 / 80 = 4.5$, which is not a whole number, so no regular polygon has this interior angle.'
          - problem: 'Each interior angle of a regular polygon measures $168^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'Each exterior angle is $180 - 168 = 12^\circ$. The number of sides is $360 / 12 = 30$.'
          - problem: 'A trail goes round a lake as a closed path of equal straight sections. At every bend the angle inside the path measures $150^\circ$. How many sections does the trail have?'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'At each bend the trail turns through $180 - 150 = 30^\circ$, which is an exterior angle of the path. The number of sections is $360 / 30 = 12$.'
          - problem: 'Each interior angle of a regular polygon measures $162^\circ$. Find the sum of all its interior angles.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '3240'
            solution_sketch: 'Each exterior angle is $180 - 162 = 18^\circ$, so the polygon has $360 / 18 = 20$ sides. The interior angles sum to $(20 - 2) \cdot 180 = 3240^\circ$.'
          - problem: 'Each interior angle of a regular polygon measures $175^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '72'
            solution_sketch: 'Each exterior angle is $180 - 175 = 5^\circ$. The number of sides is $360 / 5 = 72$.'
        constraints: "regular polygons; go through the exterior angle; integer side counts, one case with no such polygon, one follow-up asking for the interior sum"
      - id: kp3
        name: Combined interior-exterior reasoning
        key_prerequisites: [interior-angles-polygons, exterior-angles-polygons]
        step_check:
          step: 'Let the exterior angle be e; then 4e + e = 180, so 5e = 180 and e = 36'
          question: 'Why is the equation $4e + e = 180$ and not $4e + e = 360$?'
          options:
            - 'A regular polygon has equal angles, so the interior and exterior angles together fill a full turn of $360^\circ$'
            - 'The sum of all the interior angles of a regular polygon is $180^\circ$, and this is shared as $4e + e$'
            - 'The interior and exterior angles at one vertex lie on a straight line, so they make $180^\circ$'
            - 'The factor $4$ already stands for the four right angles of a full turn, so only a half remains'
          answer: 'The interior and exterior angles at one vertex lie on a straight line, so they make $180^\circ$'
          why: 'At one vertex the interior angle $4e$ and the exterior angle $e$ form a linear pair, so $5e = 180$ and $e = 36$. The turn of $360^\circ$ belongs to all the exterior angles together, not to one vertex, and the interior angle sum is $(n - 2) \cdot 180$.'
        exemplars:
          - problem: 'The interior angles of a polygon sum to $2160^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'The sum is $(n - 2) \cdot 180 = 2160$, so $n - 2 = 12$. This gives $n = 14$.'
          - problem: 'In a regular polygon each interior angle is four times each exterior angle. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'Let each exterior angle be $e$. Then $4e + e = 180$, so $e = 36$ and $n = 360 / 36 = 10$.'
          - problem: 'In a regular polygon each interior angle is three times each exterior angle. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Let each exterior angle be $e$. Then $3e + e = 180$, so $e = 45$ and $n = 360 / 45 = 8$.'
          - problem: 'A tile maker cuts regular polygonal tiles. The interior angles of one tile sum to $1080^\circ$. Find each exterior angle of the tile.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '45'
            solution_sketch: 'From $(n - 2) \cdot 180 = 1080$ we get $n - 2 = 6$, so the tile has $n = 8$ sides. Each exterior angle is $360 / 8 = 45^\circ$.'
          - problem: 'A designer wants a window in the shape of a polygon whose interior angles sum to $1260^\circ$. Is there such a polygon?'
            answer_contract: {"kind":"label","options":[["yes","yes, there is","there is","possible","there is such a polygon"],["no","no, there is not","there is not","not possible","there is no such polygon","none"]]}
            answer: 'yes'
            solution_sketch: 'A polygon with $n$ sides has interior angle sum $(n - 2) \cdot 180$. From $(n - 2) \cdot 180 = 1260$ we get $n - 2 = 7$, so $n = 9$ and a nine-sided polygon works.'
          - problem: 'In a regular polygon each interior angle is $132^\circ$ larger than each exterior angle. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'Let each exterior angle be $e$. Then $(e + 132) + e = 180$, so $e = 24$ and $n = 360 / 24 = 15$.'
          - problem: 'The interior angles of a convex polygon sum to five times its exterior angles, one taken at each vertex. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The exterior angles sum to $360^\circ$, so the interior angles sum to $5 \cdot 360 = 1800^\circ$. Then $(n - 2) \cdot 180 = 1800$ gives $n - 2 = 10$, so $n = 12$.'
          - problem: 'A path bends at the corners of a regular polygon. At each corner the angle inside the polygon is twice the angle through which a walker turns. How many corners does the path have?'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The turn is the exterior angle $e$ and the interior angle is $2e$. Then $2e + e = 180$, so $e = 60$ and $n = 360 / 60 = 6$.'
        constraints: "sums that are multiples of 180; ratio and difference setups with whole-degree exterior angles; one existence verdict"
    diagnostic_exemplar:
      problem: 'In a regular polygon each interior angle is five times each exterior angle. How many sides does the polygon have?'
      answer_contract: {"kind":"exact"}
      answer: '12'
      solution_sketch: 'Interior and exterior angles are supplementary: $5e + e = 180$ gives $e = 30^\circ$, so $n = 360/30 = 12$.'
