        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Midsegment equations
        key_prerequisites: [trapezoid-properties, multi-step-equations]
        exemplars:
          - problem: 'A trapezoid has bases $2x + 3$ and $4x - 1$, and its midsegment measures $16$. Find the longer base.'
            answer: "19"
            solution_sketch: '$\frac{(2x+3) + (4x-1)}{2} = 3x + 1 = 16 \Rightarrow x = 5$; bases are $13$ and $19$.'
          - problem: 'A trapezoid''s midsegment measures $2x + 1$ and its bases measure $10$ and $3x - 2$. Find $x$.'
            answer: "6"
            solution_sketch: '$2x + 1 = \frac{10 + (3x - 2)}{2} \Rightarrow 4x + 2 = 3x + 8 \Rightarrow x = 6$; midsegment $13$, bases $10$ and $16$.'
        constraints: "linear expressions; integer solutions; midsegment is the average of the bases"
      - id: kp2
        name: Angle equations in isosceles trapezoids
        key_prerequisites: [trapezoid-properties, multi-step-equations]
        exemplars:
          - problem: 'In an isosceles trapezoid a base angle measures $(3x + 15)^\circ$ and the angle adjacent to it along a leg measures $(2x + 5)^\circ$. Find the base angle, in degrees.'
            answer: "111"
            solution_sketch: 'Leg-adjacent angles are supplementary: $5x + 20 = 180 \Rightarrow x = 32$; base angle $= 111^\circ$.'
          - problem: 'The two angles on one base of an isosceles trapezoid measure $(4x - 6)^\circ$ and $(2x + 38)^\circ$. Find each, in degrees.'
            answer: "82"
            solution_sketch: 'Base angles are congruent: $4x - 6 = 2x + 38 \Rightarrow x = 22$; each is $82^\circ$.'
        constraints: "supplementary along a leg, congruent along a base; integer solutions with base angles strictly between 0 and 180 and not 90"
      - id: kp3
        name: Kite equations and diagonal computations
        key_prerequisites: [kite-properties, multi-step-equations]
        exemplars:
          - problem: 'A kite has vertex angles $(3x)^\circ$ and $(2x + 20)^\circ$ and non-vertex angles of $105^\circ$ each. Find the larger vertex angle, in degrees.'
            answer: "78"
            solution_sketch: '$3x + 2x + 20 + 210 = 360 \Rightarrow x = 26$; vertex angles $78^\circ$ and $72^\circ$.'
          - problem: 'In kite $ABCD$ the axis diagonal meets $\overline{BD}$ at $E$ with $BE = ED = 12$, and $AB = 13$, $BC = 20$. Find the length of the axis diagonal $\overline{AC}$.'
            answer: "21"
            solution_sketch: '$AE = \sqrt{13^2 - 12^2} = 5$; $EC = \sqrt{20^2 - 12^2} = 16$; $AC = 21$.'
        constraints: "kite angle sums to 360 with algebraic vertex angles; diagonal pieces from Pythagorean triples"
    diagnostic_exemplar:
      problem: 'In kite $ABCD$ the axis diagonal meets $\overline{BD}$ at $E$ with $BE = ED = 15$, and $AB = 17$, $BC = 25$. Find the length of the axis diagonal $\overline{AC}$.'
      answer: "28"
      solution_sketch: '$AE = \sqrt{17^2 - 15^2} = 8$; $EC = \sqrt{25^2 - 15^2} = 20$; $AC = 28$.'
    anki_seeds:
      - front: "In a kite, the axis-of-symmetry diagonal ... the other diagonal."
        back: "perpendicularly bisects"
        type: basic
