unit: polygons-quadrilaterals
course: geometry
module: "Polygons & Quadrilaterals"
topics:
  - id: interior-angles-polygons
    name: Interior Angles of Polygons
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: proof
    expected_time_secs: 60
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Interior angle sum via triangulation
        key_prerequisites: [triangle-angle-sum]
        step_check:
          step: 'It splits into n - 2 = 4 triangles from one vertex'
          question: 'Why does a hexagon split into $n - 2$ triangles and not into $n$ triangles?'
          options:
            - 'Each triangle uses three vertices, so the $n$ vertices are shared out among triangles in threes'
            - 'The two longest triangles are removed, because their angles would be counted twice in the sum'
            - 'The two sides at the chosen vertex need no diagonal, so $n - 3$ diagonals cut $n - 2$ triangles'
            - 'One triangle is left for every side, and then two are taken off for the base of the polygon'
          answer: 'The two sides at the chosen vertex need no diagonal, so $n - 3$ diagonals cut $n - 2$ triangles'
          why: 'Diagonals run from the chosen vertex to the $n - 3$ vertices that are not its neighbours, and $n - 3$ cuts make $n - 2$ pieces, here $4$ triangles in a hexagon. The other options count by vertices or sides, which would give $6$ triangles for a hexagon.'
        try_first:
          problem: 'A convex quadrilateral is cut along one of its diagonals into two triangles. What is the sum of the four interior angles of the quadrilateral, in degrees?'
          answer_contract: {"kind":"exact"}
          answer: '360'
          reveal: 'The angles of the quadrilateral are exactly the angles of the two triangles put together, so the sum is $2 \cdot 180 = 360$. In the same way a convex polygon with $n$ sides splits from one vertex into $n - 2$ triangles, so its interior angles sum to $(n - 2) \cdot 180$.'
        exemplars:
          - problem: 'Find the sum of the interior angles of a hexagon.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '720'
            solution_sketch: 'A hexagon splits from one vertex into $6 - 2 = 4$ triangles. Each triangle has angle sum $180^\circ$, so the sum is $4 \cdot 180 = 720^\circ$.'
          - problem: 'A surveyor walks the fence of a field with seven straight sides and no inward corner. What is the sum of the interior angles of the field?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '900'
            solution_sketch: 'The field is a convex heptagon, which splits into $7 - 2 = 5$ triangles. The angle sum is $5 \cdot 180 = 900^\circ$.'
          - problem: 'A convex polygon is cut into $9$ triangles by drawing every diagonal from one of its vertices. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '11'
            solution_sketch: 'A polygon with $n$ sides gives $n - 2$ triangles from one vertex. So $n - 2 = 9$, which gives $n = 11$.'
          - problem: 'A metal plate for a clock face is cut in the shape of a convex polygon with $12$ sides. What is the sum of its interior angles?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '1800'
            solution_sketch: 'A polygon with $12$ sides splits into $12 - 2 = 10$ triangles. The angle sum is $10 \cdot 180 = 1800^\circ$.'
          - problem: 'The interior angles of a convex polygon sum to $1980^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'The sum is $(n - 2) \cdot 180 = 1980$, so $n - 2 = 11$. Then $n = 13$.'
          - problem: 'A student splits a pentagon into three triangles with two diagonals from one vertex, adds up the angles of the three triangles, and gets the angle sum of the pentagon. Which theorem about the angles of each triangle makes this work?'
            answer_contract: {"kind":"label","options":[["triangle angle sum theorem","triangle angle sum","the triangle angle sum theorem","the angles of a triangle add up to 180","triangle sum theorem"],["exterior angle theorem","the exterior angle theorem","exterior angle"],["vertical angles theorem","the vertical angles theorem","vertical angles"],["alternate interior angles theorem","alternate interior angles","the alternate interior angles theorem"]]}
            answer: 'triangle angle sum theorem'
            solution_sketch: 'The three triangles fill the pentagon without overlap, so the angle sum of the pentagon is the total of their angles. Each triangle has angle sum $180^\circ$ by the triangle angle sum theorem, which gives $3 \cdot 180 = 540^\circ$.'
          - problem: 'Omar says the interior angles of a decagon sum to $10 \cdot 180 = 1800^\circ$. What is the correct sum?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '1440'
            solution_sketch: 'Omar used the number of sides instead of the number of triangles. A decagon splits into $10 - 2 = 8$ triangles, so the sum is $8 \cdot 180 = 1440^\circ$.'
          - problem: 'Write the full proof that the interior angles of a convex polygon with $n$ sides sum to $(n - 2) \cdot 180^\circ$.'
            answer_contract: {"kind":"none"}
            answer: 'sum = (n - 2) * 180 degrees'
            solution_sketch: '1. Name the vertices $V_1, V_2, \dots, V_n$ in order around the polygon. Draw the diagonals from $V_1$ to $V_3, V_4, \dots, V_{n-1}$; there are $n - 3$ of them. 2. The polygon is convex, so these diagonals lie inside it and cut it into the $n - 2$ triangles $V_1V_2V_3, V_1V_3V_4, \dots, V_1V_{n-1}V_n$. 3. These triangles fill the polygon without overlap, and their angles fill the interior angles of the polygon. At $V_1$ the angles of all the triangles together, and at each of $V_3, \dots, V_{n-1}$ the angles of two neighbouring triangles, add up to the polygon angle by the angle addition postulate; at $V_2$ and $V_n$ only one triangle meets the vertex. 4. Each triangle has angle sum $180^\circ$ by the triangle angle sum theorem. 5. So the interior angles of the polygon sum to $(n - 2) \cdot 180^\circ$.'
        constraints: "convex n-gons; n from 3 to 15; sum or side count from the sum; real contexts (plots, plates), one justification item (triangle angle sum theorem), one named-error item and the general written proof as the last exemplar"
      - id: kp2
        name: Each interior angle of a regular polygon
        key_prerequisites: [triangle-angle-sum]
        step_check:
          step: 'A regular octagon has 8 equal interior angles'
          question: 'Why is the angle sum $1080^\circ$ divided by $8$ to find one angle of a regular octagon?'
          options:
            - 'The eight exterior angles must be taken from the total first, and then eight is divided out'
            - 'The eight equal angles share the total equally, so each one is an eighth of it'
            - 'Dividing by $8$ removes the six triangles, which leaves the angles of one triangle'
            - 'The sides are equal, so the sum divided by $8$ gives the length of one side of it'
          answer: 'The eight equal angles share the total equally, so each one is an eighth of it'
          why: 'A regular octagon has eight equal interior angles that together make $1080^\circ$, so one angle is $1080/8 = 135^\circ$. Dividing does not remove triangles, does not involve the exterior angles, and gives an angle, not a side length.'
        exemplars:
          - problem: 'Find each interior angle of a regular pentagon.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '108'
            solution_sketch: 'The interior angles of a pentagon sum to $(5 - 2) \cdot 180 = 540^\circ$. All five angles are equal, so each is $540 / 5 = 108^\circ$.'
          - problem: 'The floor of a gazebo is a regular octagon. What is the measure of each interior angle of the floor?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '135'
            solution_sketch: 'The interior angles of an octagon sum to $(8 - 2) \cdot 180 = 1080^\circ$. The eight angles are equal, so each is $1080 / 8 = 135^\circ$.'
          - problem: 'The face of a hexagonal nut is a regular hexagon. At what angle do two neighbouring edges of the face meet?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Two neighbouring edges meet at an interior angle of the hexagon. Those angles sum to $(6 - 2) \cdot 180 = 720^\circ$, so each is $720 / 6 = 120^\circ$.'
          - problem: 'A floor designer puts two regular octagonal tiles and one square tile around a point, so that neighbouring tiles share an edge. Do the three tiles fill the whole angle around the point with no gap and no overlap?'
            answer_contract: {"kind":"label","options":[["yes","yes, they fit exactly","they fill it exactly","they fit together","they do","yes, they do"],["no","no, they leave a gap","there is a gap","there is an overlap","they do not","no, they do not"]]}
            answer: 'yes'
            solution_sketch: 'Each interior angle of a regular octagon is $(8 - 2) \cdot 180 / 8 = 135^\circ$, and each angle of a square is $90^\circ$. The three angles add up to $135 + 135 + 90 = 360^\circ$, which is the full angle around the point.'
          - problem: 'A pavilion has a floor in the shape of a regular heptagon. To one decimal place, what is each interior angle of the floor?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '128.6'
            solution_sketch: 'The interior angles of a heptagon sum to $(7 - 2) \cdot 180 = 900^\circ$. Each of the seven equal angles is $900 / 7 \approx 128.57$, which is $128.6^\circ$ to one decimal place.'
          - problem: 'In regular pentagon $ABCDE$, the diagonal $\overline{AC}$ is drawn. What is the measure of $\angle BAC$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '36'
            solution_sketch: 'Each interior angle of a regular pentagon is $540 / 5 = 108^\circ$, so $m\angle ABC = 108^\circ$. Triangle $ABC$ is isosceles with $AB = BC$, so its base angles are equal and $m\angle BAC = (180 - 108) / 2 = 36^\circ$.'
          - problem: 'A garden bed has the shape of a regular polygon with $15$ sides. Find each interior angle of the bed.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '156'
            solution_sketch: 'The interior angles of a polygon with $15$ sides sum to $(15 - 2) \cdot 180 = 2340^\circ$. Each of the $15$ equal angles is $2340 / 15 = 156^\circ$.'
        constraints: "regular polygons; whole or one-decimal answers; real contexts, a tiling verdict and a two-step isosceles item"
      - id: kp3
        name: Find a missing interior angle
        key_prerequisites: [triangle-angle-sum]
        step_check:
          step: 'Subtract: 360 - 280 = 80'
          question: 'Why is the sum of the three known angles subtracted from $360$?'
          options:
            - 'The known angles and the missing angle are supplementary, so the five numbers must make $180^\circ$ together'
            - 'The missing angle equals the difference between $360^\circ$ and the largest of the known angles'
            - 'Each known angle is subtracted from $360^\circ$ to give the exterior angle at its vertex'
            - 'The four angles of a quadrilateral make exactly $360^\circ$, so the missing angle is the part left over'
          answer: 'The four angles of a quadrilateral make exactly $360^\circ$, so the missing angle is the part left over'
          why: 'The interior angles of a quadrilateral sum to $(4 - 2) \cdot 180 = 360^\circ$, so the fourth angle is $360 - 280 = 80^\circ$. A total of $180^\circ$ is the sum for a triangle, and the largest angle alone does not account for the other two.'
        exemplars:
          - problem: 'Three interior angles of quadrilateral $ABCD$ measure $100^\circ$, $85^\circ$ and $95^\circ$. Find the fourth.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '80'
            solution_sketch: 'The interior angles of a quadrilateral sum to $(4 - 2) \cdot 180 = 360^\circ$. The three known angles sum to $280^\circ$, so the fourth is $360 - 280 = 80^\circ$.'
          - problem: 'A surveyor measures four interior angles of a five-sided field as $104^\circ$, $118^\circ$, $97^\circ$ and $121^\circ$. What is the fifth interior angle of the field?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '100'
            solution_sketch: 'The interior angles of a pentagon sum to $(5 - 2) \cdot 180 = 540^\circ$. The four known angles sum to $440^\circ$, so the fifth is $540 - 440 = 100^\circ$.'
          - problem: 'Five interior angles of a six-sided paving stone measure $110^\circ$, $125^\circ$, $130^\circ$, $105^\circ$ and $140^\circ$. Find the sixth angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'The interior angles of a hexagon sum to $(6 - 2) \cdot 180 = 720^\circ$. The five known angles sum to $610^\circ$, so the sixth is $720 - 610 = 110^\circ$.'
          - problem: 'A carpenter measures the corners of a quadrilateral frame as $95^\circ$, $100^\circ$, $70^\circ$ and $105^\circ$. Could these be the four interior angles of a quadrilateral?'
            answer_contract: {"kind":"label","options":[["no","no, they cannot","not possible","they cannot be","they can't","impossible"],["yes","yes, they could","possible","they can be","they can","yes, they can"]]}
            answer: 'no'
            solution_sketch: 'The interior angles of a quadrilateral sum to $360^\circ$. The four measured angles sum to $95 + 100 + 70 + 105 = 370^\circ$, which is $10^\circ$ too much.'
          - problem: 'In pentagon $ABCDE$, $m\angle A = 100^\circ$, $m\angle B = 110^\circ$ and $m\angle C = 120^\circ$, and the angles at $D$ and $E$ are equal. Find $m\angle D$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '105'
            solution_sketch: 'The interior angles of a pentagon sum to $540^\circ$, and the first three angles sum to $330^\circ$. The angles at $D$ and $E$ share the remaining $210^\circ$ equally, so $m\angle D = 210 / 2 = 105^\circ$.'
          - problem: 'Six of the seven interior angles of a heptagonal plot measure $130^\circ$ each. What is the seventh interior angle?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'The interior angles of a heptagon sum to $(7 - 2) \cdot 180 = 900^\circ$. Six angles of $130^\circ$ sum to $780^\circ$, so the seventh is $900 - 780 = 120^\circ$.'
          - problem: 'The cross-section of a barn is the pentagon $ABCDE$. The angles at $A$ and $E$ are both $90^\circ$, and the angles at $B$ and $D$ are both $135^\circ$. Find the angle at the roof peak $C$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The interior angles of a pentagon sum to $540^\circ$. The four known angles sum to $90 + 90 + 135 + 135 = 450^\circ$, so the angle at $C$ is $540 - 450 = 90^\circ$.'
        constraints: "convex polygons; given angles sum below the polygon total; whole-degree answers; one verdict item and one equal-angles item"
    diagnostic_exemplar:
      problem: 'Find each interior angle of a regular dodecagon.'
      answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
      answer: '150'
      solution_sketch: 'The interior angles of a dodecagon sum to $(12 - 2) \cdot 180 = 1800^\circ$. Each of the $12$ equal angles is $1800 / 12 = 150^\circ$.'
    anki_seeds:
      - front: "Interior angle sum of an n-gon:"
        back: "(n - 2) x 180 degrees"
        type: basic
      - front: "An n-gon triangulates (from one vertex) into ... triangles."
        back: "n - 2"
        type: basic

  - id: exterior-angles-polygons
    name: Exterior Angles of Polygons
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: proof
    expected_time_secs: 60
    prerequisites:
      - id: interior-angles-polygons
        weight: 0.6
        key: true
      - id: angle-relationships
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Exterior angles sum to 360
        key_prerequisites: [interior-angles-polygons]
        step_check:
          step: 'Exterior angles sum to 360 degrees for any convex polygon'
          question: 'Why do the exterior angles of a convex polygon always sum to $360^\circ$, however many sides it has?'
          options:
            - 'A walker who goes once round the polygon turns through every exterior angle and ends facing the way she started'
            - 'The interior angles always sum to $360^\circ$, and each exterior angle is equal to the interior angle beside it'
            - 'Extending the sides leaves a full circle of $360^\circ$ at each vertex, and the exterior angle is that circle'
            - 'Each exterior angle is $360^\circ$ divided by the number of sides, so the total is $360^\circ$ by definition'
          answer: 'A walker who goes once round the polygon turns through every exterior angle and ends facing the way she started'
          why: 'The walker finishes one circuit facing her starting direction, so her turns at the corners make one full turn of $360^\circ$. The interior angles sum to $(n - 2) \cdot 180$, which changes with $n$, and the exterior angle is not equal to its interior neighbour; division by $n$ applies only to regular polygons.'
        exemplars:
          - problem: 'Find each exterior angle of a regular octagon.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '45'
            solution_sketch: 'The exterior angles of a convex polygon sum to $360^\circ$. A regular octagon has $8$ equal exterior angles, so each is $360 / 8 = 45^\circ$.'
          - problem: 'A hiker walks once round a stone wall in the shape of a regular hexagon and turns through the same angle at each of its six corners. By how many degrees does she turn at each corner?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Her turn at a corner is an exterior angle of the hexagon. The six equal turns make one full turn of $360^\circ$, so each is $360 / 6 = 60^\circ$.'
          - problem: 'One exterior angle is drawn at each vertex of a convex pentagon. Four of them measure $80^\circ$, $70^\circ$, $65^\circ$ and $90^\circ$. Find the fifth.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'The five exterior angles sum to $360^\circ$. The four known angles sum to $305^\circ$, so the fifth is $360 - 305 = 55^\circ$.'
          - problem: 'In a triangular plot of land, the exterior angles at two of the corners measure $140^\circ$ and $125^\circ$. Find the exterior angle at the third corner.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '95'
            solution_sketch: 'The three exterior angles of a triangle sum to $360^\circ$, just as for any convex polygon. The third is $360 - (140 + 125) = 95^\circ$.'
          - problem: 'A surveyor measures one exterior angle at each corner of a five-cornered convex plot and gets $70^\circ$, $80^\circ$, $60^\circ$, $90^\circ$ and $50^\circ$. Are these measurements consistent with a convex pentagon?'
            answer_contract: {"kind":"label","options":[["no","no, they are not consistent","they are not consistent","not consistent","inconsistent","they are inconsistent"],["yes","yes, they are consistent","they are consistent","consistent"]]}
            answer: 'no'
            solution_sketch: 'The exterior angles of a convex pentagon must sum to $360^\circ$. These five sum to $70 + 80 + 60 + 90 + 50 = 350^\circ$, so at least one measurement is wrong.'
          - problem: 'A guard walks once round a building whose floor plan is a regular polygon with $12$ sides. She turns through the same angle at every corner and ends facing the way she started. By how many degrees does she turn at each corner?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '30'
            solution_sketch: 'The guard turns once through $360^\circ$ in all, in $12$ equal turns. Each turn is $360 / 12 = 30^\circ$.'
          - problem: 'Write the full proof that the exterior angles of a convex polygon with $n$ sides, one drawn at each vertex, sum to $360^\circ$.'
            answer_contract: {"kind":"none"}
            answer: 'exterior angles sum to 360 degrees'
            solution_sketch: '1. Let the interior angles of the polygon be $a_1, a_2, \dots, a_n$ and the exterior angles be $e_1, e_2, \dots, e_n$. 2. At each vertex the exterior angle is formed by extending a side, so $e_i$ and $a_i$ form a linear pair and $e_i = 180^\circ - a_i$. 3. Adding over all $n$ vertices gives $e_1 + \dots + e_n = 180n - (a_1 + \dots + a_n)$. 4. The interior angles of a convex polygon sum to $(n - 2) \cdot 180^\circ$, so $e_1 + \dots + e_n = 180n - (n - 2) \cdot 180 = 180n - 180n + 360 = 360^\circ$.'
        constraints: "convex polygons; regular or with one missing exterior angle; real contexts (walks, plots); one consistency verdict and the written proof as the last exemplar"
      - id: kp2
        name: Interior and exterior angles are supplementary
        key_prerequisites: [angle-relationships]
        step_check:
          step: 'Interior and exterior angles at a vertex form a linear pair'
          question: 'Why do the interior angle and the exterior angle at a vertex add to $180^\circ$?'
          options:
            - 'The interior angles of a polygon sum to $180^\circ$ at each vertex, and the exterior angle is half of that sum'
            - 'The two angles are vertical angles at the vertex, and vertical angles are always supplementary'
            - 'The exterior angle is made by extending a side, so the two angles lie together on one straight line'
            - 'Both angles sit inside one triangle at that vertex, and a triangle has an angle sum of $180^\circ$'
          answer: 'The exterior angle is made by extending a side, so the two angles lie together on one straight line'
          why: 'Extending a side beyond the vertex gives a straight angle of $180^\circ$ that the interior and exterior angle fill together; with an interior angle of $154^\circ$ the exterior angle is $26^\circ$. Vertical angles are equal, not supplementary, and the exterior angle is not inside any triangle of the polygon.'
        exemplars:
          - problem: 'An interior angle of a convex polygon measures $154^\circ$. Find the exterior angle at that vertex.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The interior and exterior angles at a vertex form a linear pair, so they sum to $180^\circ$. The exterior angle is $180 - 154 = 26^\circ$.'
          - problem: 'Walking round a field, a farmer turns through $52^\circ$ at one corner of the fence. What is the interior angle of the field at that corner?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '128'
            solution_sketch: 'The turn at a corner is the exterior angle, and the interior angle completes it to a straight angle. The interior angle is $180 - 52 = 128^\circ$.'
          - problem: 'At one vertex of a convex polygon, the interior angle is three times the exterior angle. Find the interior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '135'
            solution_sketch: 'Let the exterior angle be $e$. Then $3e + e = 180$, so $e = 45$ and the interior angle is $3 \cdot 45 = 135^\circ$.'
          - problem: 'The interior angles of a triangular flower bed measure $40^\circ$, $55^\circ$ and $85^\circ$. Find the exterior angle at the corner with the largest interior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '95'
            solution_sketch: 'The largest interior angle is $85^\circ$. The exterior angle at that corner is $180 - 85 = 95^\circ$.'
          - problem: 'The interior angle and the exterior angle at a vertex of a convex polygon add up to $180^\circ$. Which angle relationship explains this?'
            answer_contract: {"kind":"label","options":[["linear pair","a linear pair","linear pair postulate","they form a linear pair"],["vertical angles","vertical angles theorem","they are vertical angles"],["corresponding angles","corresponding angles postulate","they are corresponding angles"],["alternate interior angles","alternate interior angles theorem","they are alternate interior angles"]]}
            answer: 'linear pair'
            solution_sketch: 'The exterior angle is formed by extending a side, so the two angles share a side and together form a straight line. Angles that form a linear pair sum to $180^\circ$.'
          - problem: 'On the drawing of a roof truss, the interior angle between two beams at a joint is $142.5^\circ$. Find the exterior angle at that joint.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '37.5'
            solution_sketch: 'The interior and exterior angles at the joint sum to $180^\circ$. The exterior angle is $180 - 142.5 = 37.5^\circ$.'
          - problem: 'Each exterior angle of a regular pentagon is $72^\circ$. Find each interior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '108'
            solution_sketch: 'At each vertex the interior angle and the exterior angle sum to $180^\circ$. Each interior angle is $180 - 72 = 108^\circ$.'
        constraints: "linear-pair relationship; whole or half degrees; includes a ratio item, a justification item and contexts with turns"
      - id: kp3
        name: Count sides from an exterior angle
        key_prerequisites: [interior-angles-polygons]
        step_check:
          step: 'Use n = 360 / (exterior angle)'
          question: 'Why is $360$ divided by one exterior angle to count the sides of a regular polygon?'
          options:
            - 'The interior angles make $360^\circ$ in total, so dividing by one exterior angle counts the sides'
            - 'The $n$ equal exterior angles total $360^\circ$, so $360^\circ$ holds exactly $n$ of them'
            - 'Dividing $360$ by the angle counts the triangles, and the number of sides is two more than that'
            - 'Each exterior angle lies between two diagonals, so $360$ divided by it counts the diagonals'
          answer: 'The $n$ equal exterior angles total $360^\circ$, so $360^\circ$ holds exactly $n$ of them'
          why: 'The $n$ equal exterior angles sum to $360^\circ$, so $n \cdot e = 360$ and $n = 360 / e$, which is $8$ for $e = 45^\circ$. The interior angle sum is $(n - 2) \cdot 180$, not $360$, and the quotient counts sides directly, not triangles or diagonals.'
        exemplars:
          - problem: 'Each exterior angle of a regular polygon measures $45^\circ$. How many sides does the polygon have?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'The $n$ equal exterior angles sum to $360^\circ$, so $n \cdot 45 = 360$. This gives $n = 360 / 45 = 8$.'
          - problem: 'A jogging path goes round a pond in the shape of a regular polygon. A jogger turns through $24^\circ$ at each corner of the path. How many corners does the path have?'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'The turn at each corner is an exterior angle, and the exterior angles sum to $360^\circ$. The number of corners is $360 / 24 = 15$.'
          - problem: 'Could a regular polygon have an exterior angle of $25^\circ$ at each vertex?'
            answer_contract: {"kind":"label","options":[["no","no, it could not","it could not","not possible","it can't","it cannot","impossible"],["yes","yes, it could","it could","possible","it can","yes, it can"]]}
            answer: 'no'
            solution_sketch: 'The number of sides would have to be $360 / 25 = 14.4$. A polygon has a whole number of sides, so no regular polygon has an exterior angle of $25^\circ$.'
          - problem: 'A regular polygon has an exterior angle of $18^\circ$ at each vertex. Find the sum of its interior angles.'
