    knowledge_points:
      - id: kp1
        name: Isosceles trapezoid angles
        key_prerequisites: [parallel-lines-transversals]
        exemplars:
          - problem: 'In an isosceles trapezoid a base angle measures $74^\circ$. Find the measure of an angle adjacent to it along a leg, in degrees.'
            answer: "106"
            solution_sketch: 'The leg is a transversal between parallel bases, so the angles are supplementary: $180 - 74 = 106$.'
          - problem: 'In an isosceles trapezoid one base angle measures $63^\circ$. Find the other angle on the same base, in degrees.'
            answer: "63"
        constraints: "base angle pairs congruent; leg-adjacent pairs supplementary; whole degrees"
      - id: kp2
        name: Trapezoid midsegment
        key_prerequisites: [triangle-midsegments]
        exemplars:
          - problem: 'A trapezoid has bases $8$ and $14$. Find the length of its midsegment.'
            answer: "11"
            solution_sketch: 'Midsegment $= \frac{8 + 14}{2} = 11$.'
          - problem: 'A trapezoid''s midsegment measures $15$ and one base measures $9$. Find the other base.'
            answer: "21"
            solution_sketch: '$\frac{9 + b}{2} = 15 \Rightarrow b = 21$.'
        constraints: "bases with even sum so the midsegment is whole"
      - id: kp3
        name: Isosceles trapezoid legs and diagonals
        key_prerequisites: [parallel-lines-transversals]
        exemplars:
          - problem: 'In an isosceles trapezoid the diagonals measure $3x + 2$ and $5x - 8$. Find the length of a diagonal.'
            answer: "17"
            solution_sketch: 'Diagonals of an isosceles trapezoid are congruent: $3x + 2 = 5x - 8 \Rightarrow x = 5$; diagonal $= 17$.'
          - problem: 'An isosceles trapezoid has legs $2x - 3$ and $x + 6$. Find the length of a leg.'
            answer: "15"
            solution_sketch: 'Legs are congruent: $2x - 3 = x + 6 \Rightarrow x = 9$; leg $= 15$.'
        constraints: "linear expressions with integer solutions; congruent legs and congruent diagonals"
    diagnostic_exemplar:
      problem: 'In an isosceles trapezoid the diagonals measure $4x - 7$ and $2x + 9$, and the bases measure $x + 6$ and $3x - 4$. Find the length of the midsegment.'
      answer: '17'
      solution_sketch: 'Congruent diagonals give $4x - 7 = 2x + 9$, so $x = 8$; the bases are $14$ and $20$, and the midsegment is their average, $17$.'
    anki_seeds:
      - front: "The midsegment of a trapezoid equals..."
        back: "the average of the two bases"
        type: basic
      - front: "The diagonals of an isosceles trapezoid are..."
        back: "congruent"
        type: basic

  - id: kite-properties
    name: Kite Properties
    core: false                # special-quadrilateral classification branch; terminal
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: polygon-angle-sums
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Two pairs of consecutive congruent sides
        key_prerequisites: [polygon-angle-sums]
        exemplars:
          - problem: 'A kite has sides of lengths $5$, $5$, $8$, and $8$. Find its perimeter.'
            answer: "26"
          - problem: 'A kite has perimeter $42$, and one pair of congruent sides measures $8$ each. Find the length of each side in the other pair.'
            answer: "13"
            solution_sketch: '$2(8) + 2s = 42 \Rightarrow s = 13$.'
        constraints: "two distinct side lengths; whole numbers"
      - id: kp2
        name: Kite angles
        key_prerequisites: [polygon-angle-sums]
        exemplars:
          - problem: 'A kite has vertex angles $40^\circ$ and $100^\circ$ (the angles between the unequal sides are congruent). Find each of the other two angles, in degrees.'
            answer: "110"
            solution_sketch: '$40 + 100 + 2x = 360 \Rightarrow x = 110$.'
          - problem: 'A kite has non-vertex angles of $95^\circ$ each and one vertex angle of $60^\circ$. Find the other vertex angle, in degrees.'
            answer: "110"
            solution_sketch: '$60 + x + 2 \cdot 95 = 360 \Rightarrow x = 110$.'
        constraints: "angle sums use 360; the congruent pair is the non-vertex pair"
      - id: kp3
        name: Perpendicular diagonals and side lengths
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'The diagonals of a kite intersect at what angle, in degrees?'
            answer: "90"
          - problem: 'In kite $ABCD$, the axis of symmetry $\overline{AC}$ meets $\overline{BD}$ at $E$, with $BE = ED = 8$, $AE = 6$, and $EC = 15$. Find $AB$.'
            answer: "10"
            solution_sketch: 'Right triangle $ABE$: $AB = \sqrt{6^2 + 8^2} = 10$.'
          - problem: 'In kite $ABCD$, the axis of symmetry $\overline{AC}$ meets $\overline{BD}$ at $E$, with $BE = 8$ and $EC = 15$. Find $BC$.'
            answer: "17"
            solution_sketch: 'Right triangle $BEC$: $BC = \sqrt{8^2 + 15^2} = 17$.'
        constraints: "diagonal pieces form Pythagorean triples; the axis diagonal bisects the cross diagonal"
    diagnostic_exemplar:
      problem: 'In kite $ABCD$, the axis of symmetry $\overline{AC}$ meets $\overline{BD}$ at $E$, with $BE = ED = 12$ and $AE = 5$. Find $AB$.'
      answer: "13"
      solution_sketch: 'The diagonals are perpendicular, so right triangle $ABE$ gives $AB = \sqrt{5^2 + 12^2} = 13$.'
    anki_seeds:
      - front: "The diagonals of a kite are..."
        back: "perpendicular"
        type: basic
      - front: "In a kite, the non-vertex angles (between unequal sides) are..."
        back: "congruent"
        type: basic

