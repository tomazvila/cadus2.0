  - id: parallelogram-sides-angles
    name: Parallelogram Sides and Angles
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: parallel-lines-transversals
        weight: 0.6
        key: true
      - id: polygon-angle-sums
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Opposite sides are congruent
        key_prerequisites: [parallel-lines-transversals]
        step_check:
          step: 'Since opposite sides are equal, the other two sides are also $12$ and $7$'
          question: 'Why must the other two sides of parallelogram $EFGH$ be $12$ and $7$?'
          options:
            - 'Parallel sides have the same length, because lines that never meet stay the same distance apart along their whole length'
            - 'A diagonal cuts the parallelogram into two congruent triangles, and opposite sides are matching sides of them'
            - 'All four sides of a parallelogram are equal, so the other two sides must be $12$ and $12$'
            - 'The sides $EF$ and $FG$ meet at the vertex $F$, and sides that meet at a vertex have the same length'
          answer: 'A diagonal cuts the parallelogram into two congruent triangles, and opposite sides are matching sides of them'
          why: 'The diagonal $EG$ gives triangles $EFG$ and $GHE$ that are congruent by ASA, so the matching sides $EF$ and $GH$ are equal, and $FG = HE$. Equal distance between parallel lines does not make two segments equal in length, and $EF = 12$ differs from $FG = 7$, so not all sides are equal.'
        exemplars:
          - problem: 'In parallelogram $ABCD$, $AB = 13$ and $BC = 9$. Find the perimeter.'
            answer_contract: {"kind":"exact"}
            answer: '44'
            solution_sketch: 'Opposite sides of a parallelogram are congruent, so $CD = 13$ and $DA = 9$. The perimeter is $13 + 9 + 13 + 9 = 2(13 + 9) = 44$.'
          - problem: 'A garden bed is a parallelogram $PQRS$ with $PQ = 4.5$ m and $QR = 3$ m. How many metres of edging are needed to go once all the way round the bed?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '15'
            solution_sketch: 'Opposite sides are congruent, so $RS = 4.5$ m and $SP = 3$ m. The edging has length $2(4.5 + 3) = 15$ m.'
          - problem: 'A parallelogram has perimeter $50$ and one side of length $15$. Find the length of an adjacent side.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'Opposite sides are congruent, so the perimeter is $2(15 + s) = 50$. Then $15 + s = 25$, so $s = 10$.'
          - problem: 'In parallelogram $PQRS$, $PQ = 3x + 2$ and $RS = 5x - 6$. Find the length of $\overline{PQ}$.'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'Opposite sides $PQ$ and $RS$ are congruent, so $3x + 2 = 5x - 6$ and $x = 4$. Then $PQ = 3(4) + 2 = 14$.'
          - problem: 'A folding drying rack has a parallelogram frame whose longer sides are $120$ cm. The frame has a perimeter of $360$ cm. How long are its shorter sides?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The frame has two longer sides and two shorter sides, so $2(120 + s) = 360$. Then $120 + s = 180$, so the shorter sides are $60$ cm.'
          - problem: 'In parallelogram $ABCD$ the diagonal $\overline{AC}$ is drawn, and triangles $ABC$ and $CDA$ are shown to be congruent. Which statement then justifies $AB = CD$?'
            answer_contract: {"kind":"label","options":[["corresponding parts of congruent triangles are congruent","CPCTC","congruent parts of congruent triangles are congruent","corresponding parts of congruent triangles"],["the triangle angle sum theorem","triangle angle sum theorem","triangle angle sum"],["the isosceles triangle theorem","isosceles triangle theorem","base angles theorem"],["the vertical angles theorem","vertical angles theorem","vertical angles"]]}
            answer: 'CPCTC'
            solution_sketch: 'Sides $AB$ and $CD$ are corresponding sides of the congruent triangles $ABC$ and $CDA$. Corresponding parts of congruent triangles are congruent, so $AB = CD$.'
          - problem: 'The two different side lengths of a parallelogram differ by $3$, and its perimeter is $54$. Find the length of the shorter side.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'Let the shorter side be $s$, so the longer side is $s + 3$. Then $2(s + s + 3) = 54$, which gives $2s + 3 = 27$ and $s = 12$.'
          - problem: 'Write the full proof that the opposite sides of parallelogram $ABCD$ are congruent.'
            answer_contract: {"kind":"none"}
            answer: 'AB = CD and BC = DA'
            solution_sketch: '1. Draw the diagonal $\overline{AC}$. 2. $\overline{AB} \parallel \overline{DC}$ by the definition of a parallelogram, so $\angle BAC \cong \angle DCA$ (alternate interior angles). 3. $\overline{BC} \parallel \overline{AD}$, so $\angle BCA \cong \angle DAC$ (alternate interior angles). 4. $\overline{AC} \cong \overline{CA}$ (reflexive property). 5. $\triangle ABC \cong \triangle CDA$ (ASA, from steps 2, 4 and 3). 6. Therefore $AB = CD$ and $BC = DA$ (corresponding parts of congruent triangles are congruent).'
        constraints: "whole or one-decimal side lengths; perimeter and algebraic setups; contexts with units; one justification item and the written proof as the last exemplar"
      - id: kp2
        name: Opposite angles are congruent
        key_prerequisites: [parallel-lines-transversals]
        step_check:
          step: 'Opposite angles of a parallelogram are congruent'
          question: 'Why are the angles at two opposite vertices of a parallelogram congruent?'
          options:
            - 'The four angles of a parallelogram are all equal, so any two of them are congruent'
            - 'Opposite angles are vertical angles at the centre of the figure, and vertical angles are equal'
            - 'A diagonal cuts it into congruent triangles, and opposite angles are matching angles'
            - 'Opposite angles are alternate interior angles between one pair of parallel sides, so they are equal'
          answer: 'A diagonal cuts it into congruent triangles, and opposite angles are matching angles'
          why: 'The diagonal through the other two vertices gives two triangles that are congruent by ASA, and the angles at the opposite vertices are matching angles. A parallelogram with angles $64^\circ$ and $116^\circ$ shows that the four angles need not be equal, and vertical angles meet at the centre only for the angles between the diagonals.'
        exemplars:
          - problem: 'In parallelogram $WXYZ$, $m\angle W = 64^\circ$. Find $m\angle Y$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '64'
            solution_sketch: 'Vertices $W$ and $Y$ are opposite, and opposite angles of a parallelogram are congruent. So $m\angle Y = 64^\circ$.'
          - problem: 'A sail panel is the parallelogram $PQRS$, and its corner $R$ measures $118^\circ$. What is the angle at the opposite corner $P$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '118'
            solution_sketch: 'Corners $P$ and $R$ are opposite, and opposite angles of a parallelogram are congruent. So the angle at $P$ is $118^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle A = (3x + 12)^\circ$ and $m\angle C = (5x - 20)^\circ$. Find $m\angle A$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Angles $A$ and $C$ are opposite, so $3x + 12 = 5x - 20$ and $x = 16$. Then $m\angle A = 3(16) + 12 = 60^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle B = 110^\circ$. Find the sum $m\angle A + m\angle C$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '140'
            solution_sketch: 'Angles $A$ and $B$ are consecutive, so $m\angle A = 180 - 110 = 70^\circ$. Angle $C$ is opposite $A$, so $m\angle C = 70^\circ$ too, and the sum is $140^\circ$.'
          - problem: 'A surveyor finds that corner $E$ of a parallelogram-shaped plot $EFGH$ measures $71.5^\circ$. What is the angle at the opposite corner $G$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '71.5'
            solution_sketch: 'Corners $E$ and $G$ are opposite, and opposite angles of a parallelogram are congruent. So the angle at $G$ is $71.5^\circ$.'
          - problem: 'In parallelogram $PQRS$, the angles at $P$ and $R$ have the same measure. Which property of parallelograms explains this?'
            answer_contract: {"kind":"label","options":[["opposite angles of a parallelogram are congruent","opposite angles are congruent","opposite angles are equal","opposite angles"],["consecutive angles of a parallelogram are supplementary","consecutive angles are supplementary","consecutive angles"],["the diagonals of a parallelogram bisect each other","diagonals bisect each other","the diagonals bisect each other"],["opposite sides of a parallelogram are congruent","opposite sides are congruent","opposite sides"]]}
            answer: 'opposite angles are congruent'
            solution_sketch: 'Vertices $P$ and $R$ are opposite vertices of the parallelogram. The property that links their angles is that opposite angles of a parallelogram are congruent.'
          - problem: 'In parallelogram $ABCD$, the angle at $A$ is twice the angle at $B$. Find $m\angle C$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Angles $A$ and $B$ are consecutive, so $2b + b = 180$ and $m\angle B = 60^\circ$, which makes $m\angle A = 120^\circ$. Angle $C$ is opposite $A$, so $m\angle C = 120^\circ$.'
          - problem: 'Write the full proof that the opposite angles $\angle A$ and $\angle C$ of parallelogram $ABCD$ are congruent.'
            answer_contract: {"kind":"none"}
            answer: 'm∠A = m∠C'
            solution_sketch: '1. Draw the diagonal $\overline{BD}$. 2. $\overline{AB} \parallel \overline{DC}$ by the definition of a parallelogram, so $\angle ABD \cong \angle CDB$ (alternate interior angles). 3. $\overline{AD} \parallel \overline{BC}$, so $\angle ADB \cong \angle CBD$ (alternate interior angles). 4. $\overline{BD} \cong \overline{DB}$ (reflexive property). 5. $\triangle ABD \cong \triangle CDB$ (ASA, from steps 2, 4 and 3). 6. Therefore $\angle A \cong \angle C$ (corresponding parts of congruent triangles are congruent).'
        constraints: "opposite vertex pairs; whole or half degrees; one algebraic item, one two-step item with consecutive angles, one justification item and the written proof as the last exemplar"
      - id: kp3
        name: Consecutive angles are supplementary
        key_prerequisites: [parallel-lines-transversals]
        step_check:
          step: 'Use the property that consecutive angles in a parallelogram are supplementary'
          question: 'Why do two consecutive angles of a parallelogram sum to $180^\circ$?'
          options:
            - 'They are same-side interior angles between two parallel sides cut by a third side'
            - 'They are vertical angles at one corner, and vertical angles sum to $180^\circ$'
            - 'All four angles sum to $360^\circ$, so every pair of angles must share that total equally'
            - 'They are opposite angles of the parallelogram, and opposite angles always sum to $180^\circ$'
          answer: 'They are same-side interior angles between two parallel sides cut by a third side'
          why: 'Two consecutive angles lie between the parallel sides on the same side of the third side, and same-side interior angles between parallel lines are supplementary. Vertical angles are equal, opposite angles are equal rather than supplementary, and a parallelogram with a $68^\circ$ angle has angles $68^\circ$ and $112^\circ$, not $90^\circ$ and $90^\circ$.'
        exemplars:
          - problem: 'In parallelogram $ABCD$, $m\angle A = 68^\circ$. Find $m\angle B$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '112'
            solution_sketch: 'Angles $A$ and $B$ are consecutive, so they are supplementary. Then $m\angle B = 180 - 68 = 112^\circ$.'
          - problem: 'The arm of a drafting table is the parallelogram $ABCD$. When the arm is opened so that $m\angle A = 55^\circ$, what is the angle at the neighbouring corner $D$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '125'
            solution_sketch: 'Corners $A$ and $D$ are consecutive, so their angles are supplementary. The angle at $D$ is $180 - 55 = 125^\circ$.'
          - problem: 'In parallelogram $PQRS$, $m\angle P = (2x + 20)^\circ$ and $m\angle Q = (3x - 10)^\circ$. Find $m\angle Q$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '92'
            solution_sketch: 'Angles $P$ and $Q$ are consecutive, so $(2x + 20) + (3x - 10) = 180$. This gives $5x + 10 = 180$ and $x = 34$, so $m\angle Q = 3(34) - 10 = 92^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle D = 41^\circ$. Find the largest angle of the parallelogram.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '139'
            solution_sketch: 'The angles at $A$ and $C$ are consecutive to $D$, so each is $180 - 41 = 139^\circ$. The angle at $B$ is opposite $D$ and measures $41^\circ$, so the largest angle is $139^\circ$.'
          - problem: 'A bookshelf with a rectangular front is pushed sideways until its front is a parallelogram with one corner of $87^\circ$. What does the neighbouring corner measure?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '93'
            solution_sketch: 'Neighbouring corners of a parallelogram are consecutive angles, which are supplementary. The neighbouring corner measures $180 - 87 = 93^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle A + m\angle B = 180^\circ$. Which fact about the parallel sides justifies this?'
            answer_contract: {"kind":"label","options":[["same-side interior angles are supplementary","same side interior angles","consecutive interior angles are supplementary","co-interior angles"],["alternate interior angles are congruent","alternate interior angles","alternate interior angles theorem"],["corresponding angles are congruent","corresponding angles","corresponding angles postulate"],["vertical angles are congruent","vertical angles","vertical angles theorem"]]}
            answer: 'same side interior angles'
            solution_sketch: 'Sides $\overline{AD}$ and $\overline{BC}$ are parallel and $\overline{AB}$ is a transversal. Angles $A$ and $B$ lie on the same side of the transversal between the parallels, so they are supplementary.'
          - problem: 'In parallelogram $ABCD$, $m\angle A$ is $40^\circ$ more than $m\angle B$. Find $m\angle B$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'Angles $A$ and $B$ are consecutive, so $(b + 40) + b = 180$. This gives $2b = 140$, so $m\angle B = 70^\circ$.'
          - problem: 'Write the full proof that consecutive angles $\angle A$ and $\angle B$ of parallelogram $ABCD$ are supplementary.'
            answer_contract: {"kind":"none"}
            answer: 'm∠A + m∠B = 180'
            solution_sketch: '1. $\overline{AD} \parallel \overline{BC}$ by the definition of a parallelogram. 2. $\overline{AB}$ is a transversal of these two parallel lines. 3. $\angle DAB$ and $\angle ABC$ lie on the same side of $\overline{AB}$, between the parallel lines, so they are same-side interior angles. 4. Same-side interior angles between parallel lines are supplementary. 5. Therefore $m\angle A + m\angle B = 180^\circ$.'
        constraints: "consecutive vertex pairs; whole degrees; one algebraic item, one verbal difference item, one justification item and the written proof as the last exemplar"
    diagnostic_exemplar:
      problem: 'In parallelogram $ABCD$, $m\angle A = 104^\circ$. Find $m\angle D$.'
      answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
      answer: '76'
      solution_sketch: '$A$ and $D$ are consecutive: $180 - 104 = 76$.'
    anki_seeds:
      - front: "In a parallelogram, opposite sides and opposite angles are..."
        back: "congruent"
        type: basic
      - front: "In a parallelogram, consecutive angles are..."
        back: "supplementary"
        type: basic

  - id: parallelogram-diagonals
    name: Parallelogram Diagonals
    core: true
    difficulty: 0.34
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: parallelogram-sides-angles
        weight: 0.7
        key: true
      - id: triangle-congruence-criteria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Diagonals bisect each other
        key_prerequisites: [parallelogram-sides-angles]
        step_check:
          step: 'The diagonals of a parallelogram bisect each other, so M is the midpoint of diagonal XZ'
          question: 'Why is $M$ the midpoint of diagonal $XZ$ in a parallelogram?'
          options:
            - 'The diagonals of a parallelogram cut each other in two equal parts at their crossing point'
            - 'The diagonals of a parallelogram are equal in length, so each one is halved by the other'
            - 'The diagonals of a parallelogram meet at right angles, which puts the crossing point in the middle'
            - 'Opposite sides are parallel, so the crossing point is the same distance from all four corners'
          answer: 'The diagonals of a parallelogram cut each other in two equal parts at their crossing point'
          why: 'Bisecting each other is the property of every parallelogram, so $M$ halves $XZ$ and $XZ = 2 \cdot XM$. Equal diagonals belong to rectangles only, right angles to rhombuses only, and the crossing point is not equally far from all four corners in a general parallelogram.'
        try_first:
          problem: 'Parallelogram $ABCD$ has vertices $A(0, 0)$, $B(6, 0)$, $C(8, 4)$ and $D(2, 4)$. Do the midpoints of the diagonals $\overline{AC}$ and $\overline{BD}$ coincide?'
          answer_contract: {"kind":"label","options":[["yes","they coincide","the same point"],["no","they do not coincide","different points"]]}
          answer: 'yes'
          reveal: 'The midpoint of $\overline{AC}$ is $(4, 2)$ and the midpoint of $\overline{BD}$ is $\left(\frac{6 + 2}{2}, \frac{0 + 4}{2}\right) = (4, 2)$. The two midpoints are the same point, so each diagonal passes through the middle of the other. In every parallelogram the diagonals bisect each other.'
        exemplars:
          - problem: 'In parallelogram $PQRS$ the diagonals $\overline{PR}$ and $\overline{QS}$ meet at $T$, with $QT = 11$. Find $QS$.'
            answer_contract: {"kind":"exact"}
            answer: '22'
            solution_sketch: 'The diagonals of a parallelogram bisect each other, so $T$ is the midpoint of $\overline{QS}$. Then $QS = 2 \cdot QT = 2 \cdot 11 = 22$.'
          - problem: 'A picture frame is a parallelogram $ABCD$. Two cords are stretched along its diagonals and cross at $O$. The cord $AC$ is $84$ cm long. How far is $O$ from corner $A$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '42'
            solution_sketch: 'The diagonals of a parallelogram bisect each other, so $O$ is the midpoint of the cord $AC$. The distance $AO$ is $84 / 2 = 42$ cm.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $AC = 30$, $BD = 22$ and $AB = 17$. Find the perimeter of triangle $AEB$.'
            answer_contract: {"kind":"exact"}
            answer: '43'
            solution_sketch: 'Since the diagonals bisect each other, $AE = 30 / 2 = 15$ and $BE = 22 / 2 = 11$. The perimeter of triangle $AEB$ is $15 + 11 + 17 = 43$.'
          - problem: 'A surveyor marks a parallelogram-shaped plot $ABCD$ and stretches tapes along both diagonals, which cross at $E$. The tape $BD$ measures $58$ m and $AE$ measures $22.5$ m. How long is the other diagonal $AC$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '45'
            solution_sketch: 'The diagonals bisect each other, so $E$ is the midpoint of $AC$. Then $AC = 2 \cdot AE = 2 \cdot 22.5 = 45$ m, and the length $58$ m of $BD$ is not needed.'
          - problem: 'Parallelogram $ABCD$ has vertices $A(1, 2)$ and $C(9, 8)$. Where do its diagonals meet?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 5)'
            solution_sketch: 'The diagonals bisect each other, so they meet at the midpoint of $\overline{AC}$. The midpoint is $\left(\frac{1 + 9}{2}, \frac{2 + 8}{2}\right) = (5, 5)$.'
          - problem: 'In parallelogram $WXYZ$ the diagonal $WY$ has length $2\sqrt{5}$, and the diagonals meet at $M$. Find $WM$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(5)'
            solution_sketch: 'The point $M$ is the midpoint of $\overline{WY}$. So $WM = \frac{1}{2} \cdot 2\sqrt{5} = \sqrt{5}$.'
          - problem: 'The diagonals of parallelogram $ABCD$ meet at $E$, with $DB = 26$. Lena writes $DE = 52$. What is the correct length of $DE$?'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'Lena doubled the diagonal instead of halving it. The point $E$ is the midpoint of $\overline{DB}$, so $DE = 26 / 2 = 13$.'
        constraints: 'halving or doubling a diagonal; one diagonal piece given; measured and surveying contexts; midpoint of a diagonal in coordinates; perimeter of a triangle at the crossing point; one named-error item'
      - id: kp2
        name: Algebraic half-diagonal setups
        key_prerequisites: [parallelogram-sides-angles]
        step_check:
          step: 'The diagonals bisect each other, so the halves of AC are equal'
          question: 'Why are the two halves $AE$ and $EC$ of the diagonal $AC$ equal?'
          options:
            - 'The diagonal $AC$ is equal to the other diagonal $BD$, so every piece is the same'
            - 'The diagonals are perpendicular, so each piece equals the piece beside it'
            - 'The point $E$ is the midpoint of $AC$, so its two pieces are equal'
            - 'Opposite sides are equal, and $AE$ and $EC$ lie along opposite sides'
          answer: 'The point $E$ is the midpoint of $AC$, so its two pieces are equal'
          why: 'Bisecting diagonals split $AC$ into two equal pieces, so $AE = EC$ and the equation gives $x$. The two diagonals of a parallelogram are not equal in general, they need not be perpendicular, and $AE$ and $EC$ are not sides at all.'
        exemplars:
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $AE = 3x - 4$ and $EC = x + 8$. Find $AC$.'
            answer_contract: {"kind":"exact"}
            answer: '28'
            solution_sketch: 'The diagonals bisect each other, so $AE = EC$ and $3x - 4 = x + 8$. This gives $x = 6$, so $AE = 14$ and $AC = 2 \cdot 14 = 28$.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $AE = 2x + 3$, $EC = 4x - 9$ and $BE = 3x - 2$. Find $BD$.'
            answer_contract: {"kind":"exact"}
            answer: '32'
            solution_sketch: 'The point $E$ is the midpoint of $AC$, so $2x + 3 = 4x - 9$ and $x = 6$. Then $BE = 3 \cdot 6 - 2 = 16$, and $BD = 2 \cdot 16 = 32$.'
          - problem: 'A parallelogram-shaped solar panel $ABCD$ has support struts along both diagonals, which cross at $E$. The strut sections measure $BE = (4x - 3)$ cm and $ED = (2x + 11)$ cm. How long is the whole strut $BD$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '50'
            solution_sketch: 'The point $E$ is the midpoint of $BD$, so $4x - 3 = 2x + 11$ and $x = 7$. Then $BE = 25$ cm and $BD = 2 \cdot 25 = 50$ cm.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $AE = 7x - 12$ and $EC = 3x + 8$. Find $EC$.'
            answer_contract: {"kind":"exact"}
            answer: '23'
            solution_sketch: 'Since $AE = EC$, we get $7x - 12 = 3x + 8$ and $x = 5$. Then $EC = 3 \cdot 5 + 8 = 23$.'
          - problem: 'In a parallelogram-shaped field $ABCD$ the diagonals cross at $E$. The diagonal $AC$ measures $(8x - 6)$ m and the part $AE$ measures $(2x + 9)$ m. How long is $AC$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '42'
            solution_sketch: 'The point $E$ is the midpoint of $AC$, so $AC = 2 \cdot AE$ and $8x - 6 = 2(2x + 9)$. This gives $4x = 24$, so $x = 6$ and $AC = 8 \cdot 6 - 6 = 42$ m.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$. The pieces of $AC$ measure $AE = 4x - 7$ and $EC = x + 5$, and the pieces of $BD$ measure $BE = 2y + 1$ and $ED = y + 9$. Find $AC + BD$.'
            answer_contract: {"kind":"exact"}
            answer: '52'
            solution_sketch: 'The equation $4x - 7 = x + 5$ gives $x = 4$, so $AE = 9$ and $AC = 18$. The equation $2y + 1 = y + 9$ gives $y = 8$, so $BE = 17$ and $BD = 34$. Then $AC + BD = 18 + 34 = 52$.'
          - problem: 'Three vertices of parallelogram $ABCD$ are $A(0, 0)$, $B(6, 1)$ and $C(8, 7)$. Find the fourth vertex $D$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 6)'
            solution_sketch: 'The diagonals bisect each other, so the midpoint of $\overline{BD}$ equals the midpoint of $\overline{AC}$, which is $(4, 3.5)$. If $D = (p, q)$, then $\frac{6 + p}{2} = 4$ and $\frac{1 + q}{2} = 3.5$, so $D = (2, 6)$.'
        constraints: 'linear half-diagonal expressions with integer solutions; ask for a whole diagonal, a half, a sum of both diagonals or a vertex in coordinates; pieces of both diagonals in one item; field and panel contexts'
      - id: kp3
        name: Why the diagonals bisect each other
        key_prerequisites: [triangle-congruence-criteria]
        step_check:
          step: 'A congruence of triangles makes every pair of corresponding parts congruent'
          question: 'Why does $\triangle ABE \cong \triangle CDE$ give $BE = DE$?'
          options:
            - 'Both segments are halves of the same diagonal $AC$, so they must be equal'
            - 'The segments $BE$ and $DE$ are opposite sides of the parallelogram, so they are equal'
            - 'Congruent triangles have equal angles, and equal angles always force the opposite sides equal'
            - 'The vertices match, so $BE$ and $DE$ are corresponding sides of the two triangles'
          answer: 'The vertices match, so $BE$ and $DE$ are corresponding sides of the two triangles'
          why: 'In $\triangle ABE \cong \triangle CDE$ the vertex $B$ matches $D$ and $E$ matches $E$, so the side $BE$ matches the side $DE$ and they are congruent. The segments $BE$ and $DE$ lie on a diagonal, not on opposite sides, and equal angles alone do not fix side lengths.'
        exemplars:
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$. In triangles $ABE$ and $CDE$, the angles $\angle BAE$ and $\angle DCE$ are congruent, the angles $\angle ABE$ and $\angle CDE$ are congruent (both pairs are alternate interior angles between the parallel sides $\overline{AB}$ and $\overline{DC}$), and $AB = CD$. Which congruence criterion shows $\triangle ABE \cong \triangle CDE$?'
            answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side"],["SAS","side-angle-side","side angle side"],["ASA","angle-side-angle","angle side angle"],["AAS","angle-angle-side","angle angle side"]]}
            answer: 'ASA'
            solution_sketch: 'Two pairs of angles are congruent, and the side $\overline{AB}$ between the angles at $A$ and $B$ is congruent to the side $\overline{CD}$ between the angles at $C$ and $D$. Two angles and the included side give the criterion ASA.'
          - problem: 'A parallelogram-shaped trapdoor $ABCD$ has braces along both diagonals, which cross at $E$. The brace section $AE$ is $45$ cm long and the section $BE$ is $38$ cm long. How long is the section $ED$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '38'
            solution_sketch: 'The triangles $ABE$ and $CDE$ are congruent, so $BE = DE$ by corresponding parts. Hence $ED = 38$ cm, and the length $45$ cm is not needed.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, and $\triangle ABE \cong \triangle CDE$ has been shown. Which principle delivers $AE = CE$ from this congruence?'
            answer_contract: {"kind":"label","options":[["corresponding parts theorem","CPCTC","corresponding parts","the CPCTC theorem","corresponding parts of congruent triangles","corresponding parts of congruent triangles are congruent"],["the reflexive property","reflexive property","reflexive"],["the alternate interior angles theorem","alternate interior angles theorem","alternate interior angles"],["the vertical angles theorem","vertical angles theorem","vertical angles"]]}
            answer: 'corresponding parts theorem'
            solution_sketch: 'In congruent triangles every pair of corresponding parts is congruent. The sides $AE$ and $CE$ correspond to each other, so $AE = CE$ by CPCTC.'
          - problem: 'In quadrilateral $KLMN$ the diagonals $\overline{KM}$ and $\overline{LN}$ cross at $P$, with $KP = 9$, $PM = 9$, $LP = 7$ and $PN = 8$. Is $KLMN$ a parallelogram?'
            answer_contract: {"kind":"label","options":[["yes","it is a parallelogram","a parallelogram"],["no","it is not a parallelogram","not a parallelogram"]]}
            answer: 'no'
            solution_sketch: 'In a parallelogram both diagonals are bisected at the crossing point. Here $KP = PM$, but $LP = 7$ differs from $PN = 8$, so the diagonal $\overline{LN}$ is not bisected and $KLMN$ is not a parallelogram.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$. In triangle $AEB$ we have $AE = 7$ cm, $BE = 9$ cm and $AB = 12$ cm. Find the perimeter of triangle $CED$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '28'
            solution_sketch: 'The triangles $AEB$ and $CED$ are congruent, so $CE = AE = 7$, $DE = BE = 9$ and $CD = AB = 12$. The perimeter of triangle $CED$ is $7 + 9 + 12 = 28$ cm.'
          - problem: 'A mirror frame $ABCD$ is a parallelogram with $AB = 40$ cm. Wires run along both diagonals and cross at $E$, with $AE = 25$ cm and $BE = 33$ cm. Find the perimeter of triangle $CED$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '98'
            solution_sketch: 'The diagonals bisect each other, so $CE = AE = 25$ cm and $DE = BE = 33$ cm. Also $CD = AB = 40$ cm, so the perimeter of triangle $CED$ is $25 + 33 + 40 = 98$ cm.'
          - problem: 'Write the full proof that the diagonals of a parallelogram bisect each other. In parallelogram $ABCD$ the diagonals $\overline{AC}$ and $\overline{BD}$ meet at $E$. Prove that $AE = CE$ and $BE = DE$.'
            answer_contract: {"kind":"none"}
            answer: 'AE = CE and BE = DE (ASA, CPCTC)'
            solution_sketch: '1. $ABCD$ is a parallelogram (given). 2. $\overline{AB} \parallel \overline{DC}$ (definition of a parallelogram). 3. $\angle BAE \cong \angle DCE$ (alternate interior angles, with transversal $\overline{AC}$ across the parallel lines). 4. $\angle ABE \cong \angle CDE$ (alternate interior angles, with transversal $\overline{BD}$). 5. $\overline{AB} \cong \overline{CD}$ (opposite sides of a parallelogram are congruent). 6. $\triangle ABE \cong \triangle CDE$ (ASA, from steps 3, 5 and 4). 7. $\overline{AE} \cong \overline{CE}$ and $\overline{BE} \cong \overline{DE}$ (CPCTC). 8. Therefore $E$ is the midpoint of both diagonals, so the diagonals bisect each other.'
        constraints: 'conceptual justification items with natural-word aliases (criterion and principle); lengths inferred from congruent triangles; a verdict item in which the diagonals are not bisected; trapdoor and mirror-frame contexts; one written proof'
    diagnostic_exemplar:
      problem: 'In parallelogram $PQRS$ the diagonals meet at $T$, with $PT = 4x - 6$ and $TR = 2x + 8$. Find $PR$.'
      answer_contract: {"kind":"exact"}
      answer: "44"
      solution_sketch: 'Diagonals bisect each other: $4x - 6 = 2x + 8 \Rightarrow x = 7$; $PT = 22$, so $PR = 44$.'
    anki_seeds:
      - front: "The diagonals of a parallelogram..."
        back: "bisect each other"
        type: basic

  - id: parallelogram-properties
    name: Parallelogram Properties
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: parallelogram-sides-angles
        weight: 0.8
        key: true
      - id: parallelogram-diagonals
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Angle equations in parallelograms
        key_prerequisites: [parallelogram-sides-angles, multi-step-equations]
        step_check:
          step: 'Consecutive angles of a parallelogram are supplementary, so (3x + 15) + (2x + 25) = 180'
          question: 'Why are the two consecutive angles added to give $180$ instead of being set equal?'
          options:
            - 'Consecutive angles lie between parallel lines, so they add to a straight angle'
            - 'The four angles add to $360^\circ$, so any two of them add to $180^\circ$'
            - 'Consecutive angles are complementary, so they add to $90^\circ$ and the rest is $180$'
            - 'Opposite angles are equal, so consecutive angles must be equal as well'
          answer: 'Consecutive angles lie between parallel lines, so they add to a straight angle'
          why: 'Two consecutive angles are co-interior angles between parallel sides, so they add to $180^\circ$. Only opposite angles are equal, any two angles do not add to $180^\circ$ (opposite angles can each be acute), and complementary angles add to $90^\circ$.'
        exemplars:
          - problem: 'Consecutive angles of a parallelogram measure $(3x + 20)^\circ$ and $(x + 40)^\circ$. Find the larger angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'Consecutive angles of a parallelogram are supplementary, so $(3x + 20) + (x + 40) = 180$. This gives $4x = 120$ and $x = 30$, so the angles are $110^\circ$ and $70^\circ$ and the larger is $110^\circ$.'
          - problem: 'In parallelogram $ABCD$ the angles at $A$ and $C$ measure $(5x - 12)^\circ$ and $(3x + 24)^\circ$. Find $m\angle B$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '102'
            solution_sketch: 'Opposite angles are equal, so $5x - 12 = 3x + 24$ and $x = 18$. Then $m\angle A = 78^\circ$, and $\angle B$ is consecutive to $\angle A$, so $m\angle B = 180 - 78 = 102^\circ$.'
          - problem: 'A parallelogram-shaped window frame has two neighbouring corners that measure $(2x + 30)^\circ$ and $(x + 30)^\circ$. Find the smaller corner angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'Neighbouring corners are consecutive angles, so they add to $180^\circ$: $3x + 60 = 180$ and $x = 40$. The corners measure $110^\circ$ and $70^\circ$, so the smaller is $70^\circ$.'
          - problem: 'In parallelogram $PQRS$, $m\angle P = (4x - 15)^\circ$ and $m\angle Q = (2x + 3)^\circ$. Find $m\angle Q$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '67'
            solution_sketch: 'The angles at $P$ and $Q$ share the side $\overline{PQ}$, so they are consecutive and supplementary. Then $6x - 12 = 180$ and $x = 32$, so $m\angle Q = 2 \cdot 32 + 3 = 67^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle A = (7x - 8)^\circ$ and $m\angle D = (3x + 28)^\circ$. Find $m\angle A$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '104'
            solution_sketch: 'The angles at $A$ and $D$ share the side $\overline{AD}$, so $(7x - 8) + (3x + 28) = 180$. This gives $10x = 160$ and $x = 16$, so $m\angle A = 7 \cdot 16 - 8 = 104^\circ$.'
          - problem: 'A plot of land $ABCD$ is a parallelogram. The corner angles at $A$ and $C$ measure $(6x - 10)^\circ$ and $(4x + 20)^\circ$. Find the corner angle at $D$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '100'
            solution_sketch: 'The corners at $A$ and $C$ are opposite, so $6x - 10 = 4x + 20$ and $x = 15$. Then $m\angle A = 80^\circ$, and the corner at $D$ is consecutive to it, so it measures $180 - 80 = 100^\circ$.'
          - problem: 'In a parallelogram-shaped roof panel one corner is $36^\circ$ larger than the corner next to it. Find the smaller corner angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '72'
            solution_sketch: 'The two corners are consecutive, so they add to $180^\circ$. With the smaller corner $s$, $s + (s + 36) = 180$ gives $s = 72$, so the smaller corner is $72^\circ$.'
          - problem: 'In parallelogram $ABCD$, $m\angle A = 65^\circ$. Lena writes $m\angle B = 65^\circ$, because the angles next to each other are equal. What is the correct measure of $\angle B$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '115'
            solution_sketch: 'Lena used the rule for opposite angles on neighbouring angles. The angles at $A$ and $B$ are consecutive, so they are supplementary and $m\angle B = 180 - 65 = 115^\circ$.'
        constraints: 'state whether the pair is opposite (equal) or consecutive (supplementary); linear expressions with integer solutions; a second angle asked after solving; window, plot and roof contexts; one named-error item'
      - id: kp2
        name: Side and diagonal equations
        key_prerequisites: [parallelogram-sides-angles, parallelogram-diagonals, multi-step-equations]
        step_check:
          step: 'Set opposite sides equal: since $AB$ and $CD$ are opposite sides'
          question: 'Why are $AB$ and $CD$ set equal, rather than $AB$ and $BC$?'
          options:
            - 'Every parallelogram has four equal sides, so any two expressions can be set equal'
            - 'Consecutive sides are supplementary, so $AB$ and $BC$ must add to $180$'
            - 'Side $AB$ is always longer than $BC$, so only $CD$ is left to compare with it'
            - 'Only opposite sides of a parallelogram must be congruent in every case'
          answer: 'Only opposite sides of a parallelogram must be congruent in every case'
          why: 'In a parallelogram only opposite sides are guaranteed equal, so $AB = CD$ gives the equation for $x$. Four equal sides belong to a rhombus only, sides are lengths and not angles so no sum of $180$ applies, and $AB$ may be shorter than $BC$.'
        exemplars:
          - problem: 'In parallelogram $ABCD$, $AB = 4x - 9$, $CD = 2x + 11$ and $BC = 3x$. Find the perimeter.'
            answer_contract: {"kind":"exact"}
            answer: '122'
            solution_sketch: 'Opposite sides are equal, so $4x - 9 = 2x + 11$ and $x = 10$. Then $AB = 31$ and $BC = 30$, and the perimeter is $2(31 + 30) = 122$.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $BE = 6x - 5$ and $ED = 2x + 15$. Find $BD$.'
            answer_contract: {"kind":"exact"}
            answer: '50'
            solution_sketch: 'The diagonals bisect each other, so $6x - 5 = 2x + 15$ and $x = 5$. Then $BE = 25$ and $BD = 2 \cdot 25 = 50$.'
          - problem: 'A parallelogram-shaped garden bed is edged with boards. Two opposite boards measure $(3x + 5)$ m and $(5x - 9)$ m, and a third board next to them measures $(2x + 4)$ m. How many metres of edging go round the whole bed?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '88'
            solution_sketch: 'Opposite boards are equal, so $3x + 5 = 5x - 9$ and $x = 7$. The boards measure $26$ m and $18$ m, so the edging is $2(26 + 18) = 88$ m.'
          - problem: 'In parallelogram $ABCD$, $AB = 2x + 3$, $CD = 3x - 4$ and $AD = x + 6$. Find $BC$.'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'From $AB = CD$ we get $2x + 3 = 3x - 4$ and $x = 7$. The side $BC$ is opposite $AD$, so $BC = AD = 7 + 6 = 13$.'
          - problem: 'In parallelogram $ABCD$ the diagonals meet at $E$, with $AB = 3x - 2$, $CD = x + 10$, $AE = 11$ and $BE = 9$. Find the perimeter of triangle $ABE$.'
            answer_contract: {"kind":"exact"}
            answer: '36'
            solution_sketch: 'Opposite sides are equal, so $3x - 2 = x + 10$ and $x = 6$, which gives $AB = 16$. The perimeter of triangle $ABE$ is $11 + 9 + 16 = 36$.'
          - problem: 'A carpenter builds a parallelogram-shaped frame $PQRS$ and checks it with a tape along the diagonals, which cross at $T$. The tape sections measure $PT = (4x + 3)$ cm and $TR = (7x - 24)$ cm. How long is the diagonal $PR$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '78'
            solution_sketch: 'The diagonals bisect each other, so $4x + 3 = 7x - 24$ and $x = 9$. Then $PT = 39$ cm and $PR = 2 \cdot 39 = 78$ cm.'
          - problem: 'In parallelogram $ABCD$, $AB = 5x - 4$, $CD = 3x + 8$ and $BC = 2x + 5$. Lena sets $AB = BC$ and finds $x = 3$. What is the correct perimeter?'
            answer_contract: {"kind":"exact"}
            answer: '86'
            solution_sketch: 'Lena compared two neighbouring sides, which need not be equal. The opposite sides give $5x - 4 = 3x + 8$ and $x = 6$, so $AB = 26$ and $BC = 17$, and the perimeter is $2(26 + 17) = 86$.'
        constraints: 'linear expressions with integer solutions; ask for a full side, perimeter, diagonal or a triangle perimeter; opposite sides and diagonal pieces in one item; garden and frame contexts; one named-error item'
      - id: kp3
        name: Recognizing parallelograms
        key_prerequisites: [parallelogram-diagonals]
        step_check:
          step: 'The diagonals of $PQRS$ bisect each other at $T$, so $PQRS$ is a parallelogram'
          question: 'Why does a quadrilateral whose diagonals bisect each other have to be a parallelogram?'
          options:
            - 'Bisected diagonals make all four sides equal, so the shape is a rhombus first'
            - 'The triangles at the crossing point are congruent, so opposite sides are parallel'
            - 'Bisected diagonals must be congruent, and congruent diagonals force parallel sides'
            - 'Any quadrilateral has diagonals that bisect each other at their crossing point'
          answer: 'The triangles at the crossing point are congruent, so opposite sides are parallel'
          why: 'Bisecting diagonals make triangles such as $PTQ$ and $RTS$ congruent (SAS, with vertical angles), and the equal alternate angles give parallel opposite sides. Equal sides are not forced, congruent diagonals belong to rectangles only, and a kite has diagonals that do not bisect each other.'
        exemplars:
          - problem: 'In quadrilateral $ABCD$ the diagonals meet at $E$, with $BE = ED$, $AE = 3x - 1$ and $EC = x + 5$. For what value of $x$ is $ABCD$ a parallelogram?'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'A quadrilateral whose diagonals bisect each other is a parallelogram. The diagonal $\overline{BD}$ is already bisected, so we need $AE = EC$, which gives $3x - 1 = x + 5$ and $x = 3$.'
          - problem: 'In quadrilateral $ABCD$, $\overline{AD}$ is parallel to $\overline{BC}$, with $AB = CD = 8$, $AD = 6$ and $BC = 9$. Is $ABCD$ a parallelogram?'
            answer_contract: {"kind":"label","options":[["yes","it is a parallelogram","a parallelogram"],["no","it is not a parallelogram","not a parallelogram"]]}
            answer: 'no'
            solution_sketch: 'A parallelogram has both pairs of opposite sides congruent, but here $AD = 6$ differs from $BC = 9$. The figure is a trapezoid with equal legs $AB = CD = 8$ and not a parallelogram.'
          - problem: 'A carpenter joins four boards into a frame $ABCD$ with $AB = CD = 120$ cm and $BC = DA = 85$ cm, and then measures the diagonal $BD$ as $118$ cm. How far is the crossing point of the two diagonals from corner $B$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '59'
            solution_sketch: 'Both pairs of opposite sides are congruent, so the frame is a parallelogram. Its diagonals bisect each other, so the crossing point is $118 / 2 = 59$ cm from $B$.'
          - problem: 'The quadrilateral $ABCD$ has vertices $A(0, 0)$, $B(5, 2)$, $C(8, 6)$ and $D(3, 4)$. Is it a parallelogram?'
            answer_contract: {"kind":"label","options":[["yes","it is a parallelogram","a parallelogram"],["no","it is not a parallelogram","not a parallelogram"]]}
            answer: 'yes'
            solution_sketch: 'The midpoint of $\overline{AC}$ is $(4, 3)$ and the midpoint of $\overline{BD}$ is $\left(\frac{5 + 3}{2}, \frac{2 + 4}{2}\right) = (4, 3)$. The diagonals bisect each other, so $ABCD$ is a parallelogram.'
          - problem: 'In quadrilateral $PQRS$, $\overline{PQ} \parallel \overline{RS}$, with $PQ = 2x + 3$ and $RS = 5x - 12$. For what value of $x$ is $PQRS$ a parallelogram?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'One pair of opposite sides is parallel, so $PQRS$ is a parallelogram when that pair is also congruent. Then $2x + 3 = 5x - 12$, which gives $3x = 15$ and $x = 5$.'
          - problem: 'Lena measures a quadrilateral $WXYZ$ and finds $WX = YZ = 5$ cm and $XY = ZW = 9$ cm. Which test lets her conclude that $WXYZ$ is a parallelogram?'
            answer_contract: {"kind":"label","options":[["both pairs of opposite sides congruent","both pairs of opposite sides are congruent","opposite sides congruent","opposite sides are equal","both pairs of opposite sides equal"],["the diagonals bisect each other","diagonals bisect each other","the diagonals cut each other in half"],["one pair of opposite sides is parallel and congruent","one pair parallel and congruent"],["the diagonals are congruent","congruent diagonals"]]}
            answer: 'both pairs of opposite sides congruent'
            solution_sketch: 'Lena knows both pairs of opposite sides, $WX = YZ$ and $XY = ZW$, are congruent. That is the test for a parallelogram, and she has measured nothing about diagonals or parallel sides.'
          - problem: 'A designer wants the frame $ABCD$ of a window to be a parallelogram. The sides measure $AB = (3y + 4)$ cm, $CD = (5y - 6)$ cm and $AD = (2y + 1)$ cm. How long must $BC$ be, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '11'
            solution_sketch: 'If $AB = CD$, the frame is a parallelogram. This gives $3y + 4 = 5y - 6$ and $y = 5$, and $BC$ must equal the opposite side $AD = 2 \cdot 5 + 1 = 11$ cm.'
          - problem: 'Write the full proof that a quadrilateral with both pairs of opposite sides congruent is a parallelogram. In quadrilateral $ABCD$, $AB = CD$ and $BC = DA$. Prove that $ABCD$ is a parallelogram.'
            answer_contract: {"kind":"none"}
            answer: 'ABCD is a parallelogram'
            solution_sketch: '1. $\overline{AB} \cong \overline{CD}$ and $\overline{BC} \cong \overline{DA}$ (given). 2. Draw the diagonal $\overline{AC}$. $\overline{AC} \cong \overline{AC}$ (reflexive property). 3. $\triangle ABC \cong \triangle CDA$ (SSS, from steps 1 and 2). 4. $\angle BAC \cong \angle DCA$ (CPCTC). 5. $\overline{AB} \parallel \overline{CD}$ (converse of the alternate interior angles theorem, from step 4). 6. $\angle BCA \cong \angle DAC$ (CPCTC). 7. $\overline{BC} \parallel \overline{AD}$ (converse of the alternate interior angles theorem, from step 6). 8. Both pairs of opposite sides are parallel, so $ABCD$ is a parallelogram (definition of a parallelogram).'
        constraints: 'tests: both pairs of opposite sides parallel or congruent, one pair both parallel and congruent, diagonals bisecting each other; verdicts in both directions (including a trapezoid with equal legs); values that make a quadrilateral a parallelogram; carpentry and design contexts; one test-naming item and one written proof'
    diagnostic_exemplar:
      problem: 'In parallelogram $ABCD$, $m\angle A = (2x + 30)^\circ$ and $m\angle C = (3x + 10)^\circ$, with $AB = x + 15$ and $BC = x - 5$. Find the perimeter of $ABCD$.'
      answer_contract: {"kind":"exact"}
      answer: '100'
      solution_sketch: 'Opposite angles are congruent: $2x + 30 = 3x + 10$ gives $x = 20$; then $AB = 35$ and $BC = 15$, and opposite sides are congruent, so the perimeter is $2(35 + 15) = 100$.'
    anki_seeds:
      - front: "If the diagonals of a quadrilateral bisect each other, it is a..."
        back: "parallelogram"
        type: basic
      - front: "One pair of opposite sides both parallel AND congruent makes a quadrilateral a..."
        back: "parallelogram"
        type: basic

  - id: rectangle-properties
    name: Rectangle Properties
    core: false
    difficulty: 0.38
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: parallelogram-properties
        weight: 0.7
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Diagonals are congruent and bisect each other
        key_prerequisites: [parallelogram-properties]
        step_check:
          step: 'Rectangle diagonals are congruent, so set the expressions equal'
          question: 'Why are the two diagonal expressions set equal in a rectangle?'
          options:
            - 'The diagonals of a rectangle are perpendicular, so they have equal length'
            - 'The four right angles make the diagonals matching sides of congruent triangles'
            - 'Every parallelogram has congruent diagonals, and a rectangle is a parallelogram'
            - 'The diagonals bisect each other, which already makes the two diagonals equal'
          answer: 'The four right angles make the diagonals matching sides of congruent triangles'
          why: 'The triangles $ABC$ and $DCB$ are congruent by SAS because of the right angles, so the diagonals $AC$ and $DB$ are congruent. Perpendicular diagonals belong to rhombuses, a general parallelogram has diagonals of different length, and bisecting says nothing about equal length.'
        try_first:
          problem: 'Rectangle $ABCD$ has vertices $A(0, 0)$, $B(12, 0)$, $C(12, 5)$ and $D(0, 5)$. Are its diagonals $\overline{AC}$ and $\overline{BD}$ equal in length?'
          answer_contract: {"kind":"label","options":[["yes","they are equal","equal"],["no","they are not equal","not equal"]]}
          answer: 'yes'
          reveal: 'The diagonal $AC$ has length $\sqrt{12^2 + 5^2} = 13$ and the diagonal $BD$ has length $\sqrt{(12 - 0)^2 + (0 - 5)^2} = 13$. The two diagonals are equal. This holds for every rectangle, because the right angles make the triangles $ABC$ and $DCB$ congruent.'
        exemplars:
          - problem: 'In a rectangle the diagonals measure $3x + 5$ and $5x - 9$. Find the length of a diagonal.'
            answer_contract: {"kind":"exact"}
            answer: '26'
            solution_sketch: 'The diagonals of a rectangle are congruent, so $3x + 5 = 5x - 9$ and $x = 7$. Each diagonal measures $3 \cdot 7 + 5 = 26$.'
          - problem: 'In rectangle $ABCD$ the diagonals meet at $E$, with $AE = 7$. Find $BD$.'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'The diagonals bisect each other, so $AC = 2 \cdot 7 = 14$. The diagonals of a rectangle are congruent, so $BD = AC = 14$.'
          - problem: 'A garden bed $ABCD$ has opposite sides of equal length, $AB = CD = 5.6$ m and $BC = DA = 3.1$ m. The gardener measures the diagonals and finds $AC = 6.5$ m and $BD = 6.3$ m. Is the bed a rectangle?'
            answer_contract: {"kind":"label","options":[["yes","it is a rectangle","a rectangle"],["no","it is not a rectangle","not a rectangle"]]}
            answer: 'no'
            solution_sketch: 'A parallelogram is a rectangle exactly when its diagonals are congruent. Here $AC = 6.5$ m and $BD = 6.3$ m are different, so the bed is not a rectangle.'
          - problem: 'Two wires are stretched along the diagonals of a rectangular window and cross at $E$. The wire section $AE$ is $31.5$ cm long. How long is the whole wire $BD$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '63'
            solution_sketch: 'The diagonals bisect each other, so the whole wire $AC$ is $2 \cdot 31.5 = 63$ cm. The diagonals of a rectangle are congruent, so $BD = AC = 63$ cm.'
          - problem: 'In rectangle $ABCD$ the diagonals meet at $E$, with $AE = 4x - 3$ and $BE = 2x + 9$. Find $AC$.'
            answer_contract: {"kind":"exact"}
            answer: '42'
            solution_sketch: 'The diagonals are congruent and bisect each other, so all four pieces $AE$, $BE$, $CE$ and $DE$ are equal. Then $4x - 3 = 2x + 9$ gives $x = 6$, so $AE = 21$ and $AC = 42$.'
          - problem: 'In rectangle $WXYZ$ the diagonal $WY$ measures $6x + 2$ and the diagonal $XZ$ measures $9x - 19$. The diagonals meet at $E$. Find $WE$.'
            answer_contract: {"kind":"exact"}
            answer: '22'
            solution_sketch: 'The diagonals of a rectangle are congruent, so $6x + 2 = 9x - 19$ and $x = 7$. Each diagonal measures $44$, and $E$ is its midpoint, so $WE = 22$.'
          - problem: 'In rectangle $ABCD$, the triangles $ABC$ and $DCB$ share the side $\overline{BC}$, have $AB = DC$ and have right angles at $B$ and $C$. Which congruence criterion shows $\triangle ABC \cong \triangle DCB$?'
            answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side"],["SAS","side-angle-side","side angle side"],["ASA","angle-side-angle","angle side angle"],["AAS","angle-angle-side","angle angle side"]]}
            answer: 'SAS'
            solution_sketch: 'Two sides are congruent, $AB = DC$ and the shared side $BC$. The right angles at $B$ and $C$ lie between those sides, so the criterion is SAS.'
          - problem: 'Write the full proof that the diagonals of a rectangle are congruent. In rectangle $ABCD$ the diagonals are $\overline{AC}$ and $\overline{BD}$. Prove that $AC = BD$.'
            answer_contract: {"kind":"none"}
            answer: 'AC = BD (SAS, CPCTC)'
            solution_sketch: '1. $ABCD$ is a rectangle (given). 2. $\overline{AB} \cong \overline{DC}$ (opposite sides of a parallelogram are congruent; a rectangle is a parallelogram). 3. $\angle ABC$ and $\angle DCB$ are right angles, so $\angle ABC \cong \angle DCB$ (definition of a rectangle). 4. $\overline{BC} \cong \overline{BC}$ (reflexive property). 5. $\triangle ABC \cong \triangle DCB$ (SAS, from steps 2, 3 and 4). 6. $\overline{AC} \cong \overline{DB}$ (CPCTC). 7. Therefore the diagonals $AC$ and $BD$ are congruent.'
        constraints: 'linear expressions for the congruence setups; half-diagonal equals half of either diagonal; a verdict item on measured diagonals; window and garden contexts; one justification item and one written proof'
      - id: kp2
        name: Diagonal length via the Pythagorean theorem
        key_prerequisites: [pythagorean-theorem]
        step_check:
          step: 'The two sides and the diagonal form a right triangle, so d² = 9² + 12²'
          question: 'Why does the Pythagorean theorem apply to the sides and the diagonal of a rectangle?'
          options:
            - 'The diagonal bisects the rectangle, so each half must be a right triangle'
            - 'Every triangle with two known sides obeys $a^2 + b^2 = c^2$ for its third side'
            - 'Opposite sides are equal, so the sum of their squares equals the diagonal squared'
            - 'The corner is a right angle, so the sides are the legs of a right triangle'
          answer: 'The corner is a right angle, so the sides are the legs of a right triangle'
          why: 'Each corner of a rectangle is $90^\circ$, so two adjacent sides meet at a right angle and the diagonal joins their ends as hypotenuse. The theorem holds only in right triangles, a diagonal always cuts a rectangle into two halves but the right corner makes them right triangles, and squares of opposite sides do not give the diagonal.'
        exemplars:
          - problem: 'A rectangle has sides $6$ and $8$. Find the length of a diagonal.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The two sides and the diagonal form a right triangle. The diagonal is $\sqrt{6^2 + 8^2} = \sqrt{100} = 10$.'
          - problem: 'A rectangular television screen is $96$ cm wide and $54$ cm high. To the nearest tenth of a centimetre, how long is its diagonal?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '110.1'
            solution_sketch: 'The diagonal is the hypotenuse of a right triangle with legs $96$ and $54$. Then $\sqrt{96^2 + 54^2} = \sqrt{12132} \approx 110.145$, so the diagonal is $110.1$ cm.'
          - problem: 'A rectangle has a width of $9$ and a diagonal of $15$. Find its length.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The width and the length are the legs and the diagonal is the hypotenuse. So the length is $\sqrt{15^2 - 9^2} = \sqrt{144} = 12$.'
          - problem: 'A football pitch is a rectangle $100$ m long and $64$ m wide. To the nearest tenth of a metre, how far does a player run from one corner flag straight to the opposite corner flag?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '118.7'
            solution_sketch: 'The straight path is the diagonal of the pitch. Its length is $\sqrt{100^2 + 64^2} = \sqrt{14096} \approx 118.7$ m.'
          - problem: 'A rectangular field is $40$ m long and $9$ m wide. A walker goes from one corner to the opposite corner along the diagonal instead of along two sides. How many metres does the walker save?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The diagonal is $\sqrt{40^2 + 9^2} = \sqrt{1681} = 41$ m. Along two sides the walk is $40 + 9 = 49$ m, so the diagonal saves $49 - 41 = 8$ m.'
          - problem: 'A rectangle has sides $4$ and $6$. Find the exact length of a diagonal.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '2*sqrt(13)'
            solution_sketch: 'The diagonal is $\sqrt{4^2 + 6^2} = \sqrt{52}$. Since $52 = 4 \cdot 13$, this equals $2\sqrt{13}$.'
          - problem: 'A rectangle has a diagonal of $26$ and a perimeter of $68$. Find its shorter side.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The two sides add to $68 / 2 = 34$, and their squares add to $26^2 = 676$. The sides $10$ and $24$ satisfy both conditions, so the shorter side is $10$.'
        constraints: 'sides or a side and the diagonal given; Pythagorean triples, rounded decimal lengths with units, an exact radical and a perimeter-and-diagonal setup; television, pitch and field contexts'
      - id: kp3
        name: Angles formed by the diagonals
        key_prerequisites: [parallelogram-properties]
        step_check:
          step: 'The two pieces of a right angle are complementary: 34 + x = 90'
          question: 'Why do the two angles that the diagonal makes with the sides add to $90^\circ$?'
          options:
            - 'The diagonal bisects the corner, so each piece is $45^\circ$ and the sum is $90^\circ$'
            - 'The diagonal and the two sides form a triangle, and its angles add to $90^\circ$'
            - 'The two pieces fill the corner of the rectangle, which is a right angle'
            - 'The diagonals cross at $90^\circ$, so every angle at the corner adds to $90^\circ$'
          answer: 'The two pieces fill the corner of the rectangle, which is a right angle'
          why: 'The diagonal runs inside the corner at $A$, so the two angles it makes with $AB$ and $AD$ fill the $90^\circ$ corner together. The diagonal bisects the corner only in a square, the angles of a triangle add to $180^\circ$, and the diagonals of a rectangle do not cross at right angles unless it is a square.'
        exemplars:
          - problem: 'In rectangle $ABCD$, diagonal $AC$ makes a $35^\circ$ angle with side $AB$. What angle does it make with side $AD$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'The sides $AB$ and $AD$ meet at the right angle $A$, and the diagonal $AC$ splits it into two parts. The second part is $90 - 35 = 55^\circ$.'
          - problem: 'The diagonals of rectangle $ABCD$ meet at $E$, and $m\angle BAC = 28^\circ$. Find $m\angle AEB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '124'
            solution_sketch: 'The diagonals are congruent and bisect each other, so $AE = BE$ and triangle $AEB$ is isosceles. Its base angles are $28^\circ$ each, so $m\angle AEB = 180 - 2 \cdot 28 = 124^\circ$.'
          - problem: 'A ball is struck from corner $A$ of a rectangular pool table $ABCD$ and rolls along the diagonal $AC$. The path makes a $32^\circ$ angle with the long side $AB$. What angle does the path make with the short side $AD$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '58'
            solution_sketch: 'The corner $A$ is a right angle, and the path splits it into $32^\circ$ and the rest. The angle with $AD$ is $90 - 32 = 58^\circ$.'
          - problem: 'The diagonals of rectangle $ABCD$ meet at $E$, and $m\angle AEB = 76^\circ$. Find $m\angle EAB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '52'
            solution_sketch: 'Since $AE = BE$, triangle $AEB$ is isosceles with equal base angles at $A$ and $B$. Then $m\angle EAB = (180 - 76) / 2 = 52^\circ$.'
          - problem: 'In rectangle $ABCD$ the diagonal $AC$ splits the angle at $A$ into parts measuring $(3x + 6)^\circ$ and $(2x + 4)^\circ$. Find the smaller part.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '36'
            solution_sketch: 'The two parts add to the right angle at $A$, so $(3x + 6) + (2x + 4) = 90$. This gives $5x = 80$ and $x = 16$, so the parts are $54^\circ$ and $36^\circ$, and the smaller is $36^\circ$.'
          - problem: 'The diagonals of rectangle $ABCD$ meet at $E$, and $m\angle BEC = 64^\circ$. Find $m\angle ACD$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '32'
            solution_sketch: 'Triangle $BEC$ is isosceles with $BE = CE$, so $m\angle ECB = (180 - 64) / 2 = 58^\circ$. The angle $\angle ACB$ is the same angle, and $\angle ACD$ is the rest of the right angle at $C$, so $m\angle ACD = 90 - 58 = 32^\circ$.'
          - problem: 'Two paths run along the diagonals $AC$ and $BD$ of a rectangular lawn $ABCD$ and cross at $E$. The angle $\angle AEB$ that faces the long side $AB$ measures $100^\circ$. What angle does the path $AC$ make with the long side $AB$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '40'
            solution_sketch: 'Since $AE = BE$, triangle $AEB$ is isosceles with equal base angles. The angle at $A$ is $(180 - 100) / 2 = 40^\circ$.'
        constraints: 'complementary splits of the right angle; isosceles triangles at the crossing point of the diagonals; linear setups; pool table and lawn contexts; whole degrees'
    diagnostic_exemplar:
      problem: 'A rectangle has sides $8$ and $15$. Find the length of a diagonal.'
      answer_contract: {"kind":"exact"}
      answer: "17"
      solution_sketch: '$\sqrt{8^2 + 15^2} = 17$.'
    anki_seeds:
      - front: "The diagonals of a rectangle are..."
        back: "congruent (and bisect each other)"
        type: basic

  - id: rhombus-properties
    name: Rhombus Properties
    core: false
    difficulty: 0.40
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: parallelogram-properties
        weight: 0.7
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: All four sides are congruent
        key_prerequisites: [parallelogram-properties]
        step_check:
          step: 'All four sides of a rhombus are congruent, so P = 4s'
          question: 'Why is the perimeter of a rhombus four times one side?'
          options:
            - 'A rhombus has four right angles, so its sides are all the same'
            - 'Four congruent sides add up to four times the length of one side'
            - 'Opposite sides are congruent, so the perimeter is twice the length of one side'
            - 'The diagonals are congruent, so every side matches the others'
          answer: 'Four congruent sides add up to four times the length of one side'
          why: 'Because all four sides equal $s$, the sum $s + s + s + s$ is $4s$, so $68 = 4s$ gives $s = 17$. Four right angles describe a rectangle, twice one side counts only two of the four sides, and equal diagonals describe a rectangle too.'
        exemplars:
          - problem: 'A rhombus has a side of length $7$. Find its perimeter.'
            answer_contract: {"kind":"exact"}
            answer: '28'
            solution_sketch: 'All four sides of a rhombus are congruent. The perimeter is $4 \cdot 7 = 28$.'
          - problem: 'A rhombus-shaped plaza has a perimeter of $148$ m. How long is each side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '37'
            solution_sketch: 'The four sides of the plaza are congruent, so each is a quarter of the perimeter. Then $148 / 4 = 37$ m.'
          - problem: 'In rhombus $ABCD$, $AB = 3x - 4$ and $BC = x + 10$. Find the perimeter.'
            answer_contract: {"kind":"exact"}
            answer: '68'
            solution_sketch: 'All sides of a rhombus are congruent, so $3x - 4 = x + 10$ and $x = 7$. Each side is $17$, so the perimeter is $4 \cdot 17 = 68$.'
          - problem: 'A parallelogram has two neighbouring sides of lengths $9$ cm and $9$ cm. Is the parallelogram a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'yes'
            solution_sketch: 'Opposite sides of a parallelogram are congruent, so two congruent neighbouring sides make all four sides congruent. A parallelogram with all four sides congruent is a rhombus.'
          - problem: 'A rhombus-shaped paddock has a side of $38.5$ m. How many metres of fencing go round it?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '154'
            solution_sketch: 'All four sides of the paddock are congruent. The fencing is $4 \cdot 38.5 = 154$ m.'
          - problem: 'The perimeter of a rhombus is $(8x + 12)$ cm and each side is $(x + 6)$ cm. Find the length of a side, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'The perimeter is four times a side, so $8x + 12 = 4(x + 6)$. This gives $4x = 12$ and $x = 3$, so a side is $3 + 6 = 9$ cm.'
          - problem: 'A parallelogram has two neighbouring sides of lengths $9$ cm and $12$ cm. Is the parallelogram a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'no'
            solution_sketch: 'A rhombus has all four sides congruent. Here two neighbouring sides differ, $9$ cm and $12$ cm, so the parallelogram is not a rhombus.'
          - problem: 'A rhombus has a side of $9$ cm. Lena writes that its perimeter is $9 \cdot 2 = 18$ cm. What is the correct perimeter, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '36'
            solution_sketch: 'Lena counted only two sides. A rhombus has four congruent sides, so the perimeter is $4 \cdot 9 = 36$ cm.'
        constraints: 'perimeter is 4 times a side; whole or decimal numbers and linear expressions; verdicts on whether a parallelogram is a rhombus in both directions; plaza and paddock contexts; one named-error item'
      - id: kp2
        name: Diagonals are perpendicular bisectors
        key_prerequisites: [pythagorean-theorem]
        step_check:
          step: 'The diagonals bisect each other, so the right-triangle legs are half of each diagonal'
          question: 'Why are the legs of the right triangle only half of each diagonal?'
          options:
            - 'The diagonals of a rhombus are congruent, so each leg is half of a full diagonal'
            - 'The side of the rhombus meets each diagonal in half of its length from the corner'
            - 'Each diagonal is cut at its midpoint, so a leg reaches only halfway along it'
            - 'The legs are half the sides, because the diagonals bisect the vertex angles'
          answer: 'Each diagonal is cut at its midpoint, so a leg reaches only halfway along it'
          why: 'The crossing point is the midpoint of each diagonal, so the leg from a corner to that point is half of a diagonal. The diagonals of a rhombus are not congruent unless it is a square, the sides are the hypotenuses and are not cut by the diagonals, and the legs measure half-diagonals, not half-sides.'
        exemplars:
          - problem: 'A rhombus has diagonals $12$ and $16$. Find its side length.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The diagonals bisect each other at right angles, so the half-diagonals $6$ and $8$ are the legs of a right triangle. The side is its hypotenuse $\sqrt{6^2 + 8^2} = 10$.'
          - problem: 'A rhombus has a side of length $17$ and one diagonal of length $16$. Find the other diagonal.'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'Half of the given diagonal is $8$, and it is a leg of a right triangle with hypotenuse $17$. The other leg is $\sqrt{17^2 - 8^2} = 15$, so the other diagonal is $2 \cdot 15 = 30$.'
          - problem: 'A rhombus-shaped window pane has diagonals of $1.2$ m and $0.9$ m. How long is each side of the pane, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '0.75'
            solution_sketch: 'The diagonals meet at right angles and bisect each other, so the half-diagonals are $0.6$ m and $0.45$ m. The side is $\sqrt{0.6^2 + 0.45^2} = \sqrt{0.5625} = 0.75$ m.'
          - problem: 'A rhombus-shaped tile has sides of $6.5$ cm and a short diagonal of $5$ cm. How long is the long diagonal, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'Half the short diagonal is $2.5$ cm. The half of the long diagonal is $\sqrt{6.5^2 - 2.5^2} = \sqrt{36} = 6$ cm, so the long diagonal is $12$ cm.'
          - problem: 'A rhombus has a side of length $13$ and one diagonal of length $24$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '120'
            solution_sketch: 'Half of the given diagonal is $12$, so the other half is $\sqrt{13^2 - 12^2} = 5$ and the other diagonal is $10$. The area is $\frac{1}{2} \cdot 24 \cdot 10 = 120$.'
          - problem: 'A rhombus has diagonals $8$ and $12$. Find the exact length of its side.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '2*sqrt(13)'
            solution_sketch: 'The half-diagonals $4$ and $6$ are the legs of a right triangle. The side is $\sqrt{4^2 + 6^2} = \sqrt{52} = 2\sqrt{13}$.'
          - problem: 'The diagonals of a parallelogram measure $10$ cm and $24$ cm, and one side measures $13$ cm. Is the parallelogram a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'yes'
            solution_sketch: 'The diagonals of a parallelogram bisect each other, so the half-diagonals are $5$ and $12$. Since $5^2 + 12^2 = 13^2$, they meet at a right angle, and a parallelogram with perpendicular diagonals is a rhombus.'
          - problem: 'The diagonals of a parallelogram measure $10$ cm and $24$ cm, and one side measures $12$ cm. Is the parallelogram a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'no'
            solution_sketch: 'The half-diagonals are $5$ and $12$, and a rhombus with those diagonals has side $\sqrt{5^2 + 12^2} = 13$. A side of $12$ cm does not match $13$, so the diagonals are not perpendicular and the parallelogram is not a rhombus.'
          - problem: 'Write the full proof that the diagonals of a rhombus are perpendicular. In rhombus $ABCD$ the diagonals $\overline{AC}$ and $\overline{BD}$ meet at $E$. Prove that $\overline{AC} \perp \overline{BD}$.'
            answer_contract: {"kind":"none"}
            answer: 'AC is perpendicular to BD'
            solution_sketch: '1. $ABCD$ is a rhombus, so $\overline{AB} \cong \overline{CB}$ (all sides of a rhombus are congruent). 2. A rhombus is a parallelogram, so its diagonals bisect each other and $\overline{AE} \cong \overline{CE}$ (diagonals of a parallelogram bisect each other). 3. $\overline{BE} \cong \overline{BE}$ (reflexive property). 4. $\triangle ABE \cong \triangle CBE$ (SSS, from steps 1, 2 and 3). 5. $\angle AEB \cong \angle CEB$ (CPCTC). 6. $\angle AEB$ and $\angle CEB$ form a linear pair, so $m\angle AEB + m\angle CEB = 180^\circ$ (linear pair postulate). 7. $2\,m\angle AEB = 180^\circ$, so $m\angle AEB = 90^\circ$ (substitution and division). 8. Therefore $\overline{AC} \perp \overline{BD}$ (definition of perpendicular lines).'
        constraints: 'half-diagonals form a right triangle with the side; Pythagorean triples, decimal lengths with units, an exact radical, an area, verdicts in both directions and one written proof; window and tile contexts'
      - id: kp3
        name: Diagonals bisect the vertex angles
        key_prerequisites: [parallelogram-properties]
        step_check:
          step: 'Diagonal AC connects vertices A and C, so it bisects ∠A'
          question: 'Why does the diagonal $AC$ bisect $\angle A$ in a rhombus?'
          options:
            - 'The diagonals of a rhombus are congruent, so each one halves the vertex angles'
            - 'Every parallelogram has diagonals that cut its vertex angles into two equal parts'
            - 'Opposite angles are equal, so the diagonal that joins them cuts each one in half'
            - 'Equal sides make the two triangles on either side of the diagonal congruent'
          answer: 'Equal sides make the two triangles on either side of the diagonal congruent'
          why: 'The four sides of a rhombus are congruent, so the triangles $ABC$ and $ADC$ are congruent by SSS and the diagonal $AC$ halves $\angle A$ and $\angle C$. Congruent diagonals belong to rectangles, a general parallelogram does not bisect its angles, and equal opposite angles alone do not fix where a diagonal cuts them.'
        exemplars:
          - problem: 'In rhombus $ABCD$, $m\angle A = 70^\circ$. Find the angle between diagonal $AC$ and side $AB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'A diagonal of a rhombus bisects the vertex angles it joins, so $AC$ bisects $\angle A$. The angle with $AB$ is $70 / 2 = 35^\circ$.'
          - problem: 'A diagonal of a rhombus runs from a vertex whose interior angle measures $120^\circ$. What angle does the diagonal make with each side at that vertex?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The diagonal bisects the vertex angle, so it makes equal angles with the two sides. Each is $120 / 2 = 60^\circ$.'
          - problem: 'A rhombus-shaped window has a brace along its long diagonal, which joins the two acute corners. Each acute corner measures $64^\circ$. What angle does the brace make with the frame at that corner?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '32'
            solution_sketch: 'The diagonal bisects the angle at each corner it joins. The brace makes $64 / 2 = 32^\circ$ with the frame.'
          - problem: 'In rhombus $ABCD$, $m\angle B = 110^\circ$. Find $m\angle BDA$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'Opposite angles of a parallelogram are equal, so $m\angle D = 110^\circ$. The diagonal $BD$ bisects $\angle D$, so $m\angle BDA = 110 / 2 = 55^\circ$.'
          - problem: 'In rhombus $ABCD$, $m\angle ABC = 100^\circ$. Find $m\angle BAC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '40'
            solution_sketch: 'Consecutive angles are supplementary, so $m\angle A = 180 - 100 = 80^\circ$. The diagonal $AC$ bisects $\angle A$, so $m\angle BAC = 80 / 2 = 40^\circ$.'
          - problem: 'In rhombus $ABCD$ the diagonal $AC$ makes angles of $(2x + 7)^\circ$ with $AB$ and $(4x - 19)^\circ$ with $AD$. Find $m\angle A$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The diagonal bisects $\angle A$, so the two angles are equal: $2x + 7 = 4x - 19$ and $x = 13$. Each angle is $33^\circ$, so $m\angle A = 2 \cdot 33 = 66^\circ$.'
          - problem: 'On a rhombus-shaped plot $ABCD$, a surveyor walks the diagonal path $AC$. At $A$ the path makes a $27^\circ$ angle with the fence $AB$. What is the interior angle of the plot at corner $B$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '126'
            solution_sketch: 'The path $AC$ bisects the corner at $A$, so $m\angle A = 2 \cdot 27 = 54^\circ$. Consecutive angles are supplementary, so the angle at $B$ is $180 - 54 = 126^\circ$.'
          - problem: 'In parallelogram $ABCD$ the diagonal $AC$ makes a $30^\circ$ angle with $AB$ and a $40^\circ$ angle with $AD$. Is $ABCD$ a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'no'
            solution_sketch: 'In a rhombus the diagonal bisects the vertex angle, so the two angles at $A$ would be equal. Here $30^\circ$ and $40^\circ$ differ, so the parallelogram is not a rhombus.'
          - problem: 'In parallelogram $PQRS$ the diagonal $PR$ makes a $28^\circ$ angle with $PQ$ and a $28^\circ$ angle with $PS$. Is $PQRS$ a rhombus?'
            answer_contract: {"kind":"label","options":[["yes","it is a rhombus","a rhombus"],["no","it is not a rhombus","not a rhombus"]]}
            answer: 'yes'
            solution_sketch: 'The diagonal $PR$ bisects the angle at $P$. A parallelogram whose diagonal bisects its vertex angle has $QR = PQ$ by isosceles triangle $PQR$, so all four sides are congruent and $PQRS$ is a rhombus.'
        constraints: 'diagonal halves a vertex angle; opposite and consecutive angles first when the angle is given at another vertex; a linear setup; window and plot contexts; verdicts on whether a parallelogram is a rhombus'
    diagnostic_exemplar:
      problem: 'A rhombus has diagonals of length $18$ and $24$. Find its side length.'
      answer_contract: {"kind":"exact"}
      answer: "15"
      solution_sketch: 'Side $= \sqrt{9^2 + 12^2} = 15$.'
    anki_seeds:
      - front: "The diagonals of a rhombus are..."
        back: "perpendicular bisectors of each other and bisect the vertex angles"
        type: basic
      - front: "A parallelogram with all four sides congruent is a..."
        back: "rhombus"
        type: basic

  - id: special-parallelograms
    name: Rectangles, Rhombi, and Squares
    core: false
    difficulty: 0.44
    drill: false
    answer_kind: proof
    expected_time_secs: 150
    prerequisites:
      - id: rectangle-properties
        weight: 0.7
        key: true
      - id: rhombus-properties
        weight: 0.7
        key: true
      - id: simplifying-radicals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Squares and their diagonals
        key_prerequisites: [rectangle-properties, rhombus-properties, simplifying-radicals]
        step_check:
          step: 'We know that the diagonal $d$ of a square is related to the side length $s$ by the formula $d = s\sqrt{2}$'
          question: 'Why does the diagonal of a square come out as $s\sqrt{2}$?'
          options:
            - 'The diagonal crosses two sides in turn, so its length is the sum $s + s = 2s$'
            - 'Two sides meet at a right angle, so $s^2 + s^2 = d^2$ by the Pythagorean theorem'
            - 'The diagonal cuts the square into a $30^\circ$-$60^\circ$-$90^\circ$ triangle, so $d = s\sqrt{3}$'
            - 'A hypotenuse is always $\sqrt{2}$ times the longer leg of a right triangle'
          answer: 'Two sides meet at a right angle, so $s^2 + s^2 = d^2$ by the Pythagorean theorem'
          why: 'The two sides are the legs of a right isosceles triangle, so $d^2 = 2s^2$ and $d = s\sqrt{2}$, while $2s$ ignores the straight path and a $30^\circ$-$60^\circ$-$90^\circ$ triangle needs unequal legs.'
        exemplars:
          - problem: 'A square has a diagonal of length $8$. Find its side length in simplest radical form.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '4*sqrt(2)'
            solution_sketch: 'A diagonal and two sides of a square form a right isosceles triangle, so $d = s\sqrt{2}$. Then $s = 8/\sqrt{2} = 4\sqrt{2}$.'
          - problem: 'A square patio is $5$ m on each side. A cable is stretched from one corner to the opposite corner. What is the exact length of the cable, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            answer: '5*sqrt(2)'
            solution_sketch: 'The cable is a diagonal of the square. Its length is $s\sqrt{2} = 5\sqrt{2}$ m.'
          - problem: 'A square has a diagonal of length $10$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '50'
            solution_sketch: 'The side satisfies $s\sqrt{2} = 10$, so $s^2 = 100/2$. The area is $s^2 = 50$.'
          - problem: 'A square ceramic tile has a diagonal of $30$ cm. What is the exact length of a side of the tile, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            answer: '15*sqrt(2)'
            solution_sketch: 'The diagonal of a square is $s\sqrt{2}$, so $s = 30/\sqrt{2}$. Rationalizing gives $s = 15\sqrt{2}$ cm.'
          - problem: 'A square has a side of length $7\sqrt{2}$. Find the length of its diagonal.'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'The diagonal is $s\sqrt{2}$. Here it is $7\sqrt{2}\cdot\sqrt{2} = 7 \cdot 2 = 14$.'
          - problem: 'A baseball diamond is a square, $90$ feet on each side. How far is it from home plate to second base, which is the opposite corner? Give the exact distance in feet.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"ft","allow_omitted":true,"form":"simplest_radical"}
            answer: '90*sqrt(2)'
            solution_sketch: 'The straight line from home plate to second base is a diagonal of the square. Its length is $90\sqrt{2}$ ft, about $127.3$ ft.'
          - problem: 'A square room has a diagonal of $12$ m. What is the floor area, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '72'
            solution_sketch: 'Because $d^2 = 2s^2$, the area is $s^2 = d^2/2$. This gives $144/2 = 72$ square metres.'
          - problem: 'In square $ABCD$, a student writes $AC^2 = AB^2 + BC^2$. Which theorem justifies this?'
            answer_contract: {"kind":"label","options":[["Pythagorean theorem","the Pythagorean theorem","Pythagoras","Pythagoras' theorem","Pythagoras theorem","Pythagorean","a^2 + b^2 = c^2"],["triangle inequality theorem","the triangle inequality","triangle inequality"],["triangle angle sum theorem","angle sum theorem","the triangle angle sum"],["exterior angle theorem","the exterior angle theorem"]]}
            answer: 'Pythagorean theorem'
            solution_sketch: 'Angle $B$ of the square is a right angle, so $\triangle ABC$ is a right triangle with hypotenuse $AC$. The Pythagorean theorem then gives $AC^2 = AB^2 + BC^2$.'
          - problem: 'Lena finds the diagonal of a square with side $6$ and writes $12$. What is the correct length of the diagonal, in simplest radical form?'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '6*sqrt(2)'
            solution_sketch: 'Lena added the two sides, but a diagonal is shorter than a path along two sides. The diagonal is $s\sqrt{2} = 6\sqrt{2}$.'
        constraints: 'exact radical answers in simplest form; diagonal and side of a square, area from a diagonal; real settings in metres and feet; one theorem justification and one named-error item'
      - id: kp2
        name: Classification by diagonal tests
        key_prerequisites: [rectangle-properties, rhombus-properties]
        step_check:
          step: 'The diagonals are perpendicular, so the parallelogram is a rhombus and its four sides are equal'
          question: 'Why do perpendicular diagonals make a parallelogram a rhombus?'
          options:
            - 'Perpendicular diagonals make all four angles equal, and equal angles force equal sides'
            - 'Perpendicular diagonals are always congruent, and congruent diagonals force equal sides'
            - 'Opposite sides are already parallel, and that fact is the definition of a rhombus'
            - 'Bisecting, perpendicular diagonals cut the figure into four congruent right triangles'
          answer: 'Bisecting, perpendicular diagonals cut the figure into four congruent right triangles'
          why: 'The diagonals of a parallelogram bisect each other, so perpendicular diagonals cut it into four congruent right triangles whose hypotenuses are the four sides; equal angles would make a rectangle, and parallel sides alone do not make a rhombus.'
        exemplars:
          - problem: 'A carpenter builds a frame in the shape of a parallelogram. Its two diagonals both measure $130$ cm, and they cross at right angles. What is the most specific name for the shape of the frame?'
            answer_contract: {"kind":"label","options":[["square","a square","it is a square","it's a square"],["rectangle","a rectangle","it is a rectangle","it's a rectangle"],["rhombus","a rhombus","it is a rhombus","it's a rhombus"],["parallelogram","a parallelogram","just a parallelogram","an ordinary parallelogram"]]}
            answer: 'square'
            solution_sketch: 'Congruent diagonals make a parallelogram a rectangle, and perpendicular diagonals make it a rhombus. A figure with both properties is a square.'
          - problem: 'The diagonals of parallelogram $PQRS$ are perpendicular and measure $18$ cm and $24$ cm. Find the perimeter of $PQRS$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Perpendicular diagonals make $PQRS$ a rhombus, so the half-diagonals $9$ and $12$ are the legs of a right triangle with a side as hypotenuse. A side is $\sqrt{81 + 144} = 15$, and the perimeter is $4 \cdot 15 = 60$ cm.'
          - problem: 'The diagonals of a parallelogram are $15$ cm and $15$ cm long and meet at an angle of $70^\circ$. What is the most specific name for the parallelogram?'
            answer_contract: {"kind":"label","options":[["square","a square","it is a square","it's a square"],["rectangle","a rectangle","it is a rectangle","it's a rectangle"],["rhombus","a rhombus","it is a rhombus","it's a rhombus"],["parallelogram","a parallelogram","just a parallelogram","an ordinary parallelogram"]]}
            answer: 'rectangle'
            solution_sketch: 'The diagonals are congruent, so the parallelogram is a rectangle. They are not perpendicular, because they meet at $70^\circ$, so it is not a rhombus or a square.'
          - problem: 'Each diagonal of a parallelogram is $14$ cm long, and the diagonals are perpendicular. What is the exact length of a side, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            answer: '7*sqrt(2)'
            solution_sketch: 'Congruent and perpendicular diagonals make the parallelogram a square. A side is $14/\sqrt{2} = 7\sqrt{2}$ cm.'
          - problem: 'A surveyor stakes out a plot with four straight sides. Opposite sides are parallel, and the two diagonals measure $14$ m and $48$ m and cross at right angles. How many metres of fencing go once around the plot?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '100'
            solution_sketch: 'A parallelogram with perpendicular diagonals is a rhombus. Each side is $\sqrt{7^2 + 24^2} = 25$ m, so the fence is $4 \cdot 25 = 100$ m.'
          - problem: 'A window frame is a parallelogram. Both of its diagonals measure $130$ cm, and one side measures $50$ cm. What is the area of the glass in the frame, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '6000'
            solution_sketch: 'Congruent diagonals make the frame a rectangle. The other side is $\sqrt{130^2 - 50^2} = 120$ cm, so the area is $50 \cdot 120 = 6000$ square centimetres.'
          - problem: 'Write the full proof that a parallelogram whose diagonals are congruent is a rectangle.'
            answer_contract: {"kind":"none"}
            answer: 'ABCD is a rectangle'
            solution_sketch: 'Let $ABCD$ be a parallelogram with $AC = BD$. 1. $AB = DC$ (opposite sides of a parallelogram are congruent). 2. $BC = CB$ (reflexive property). 3. $AC = DB$ (given). 4. $\triangle ABC \cong \triangle DCB$ (SSS). 5. $\angle ABC \cong \angle DCB$ (CPCTC). 6. $AB \parallel DC$, so $\angle ABC$ and $\angle DCB$ are consecutive interior angles of a transversal and $m\angle ABC + m\angle DCB = 180^\circ$. 7. Both angles are equal, so each measures $90^\circ$. 8. A parallelogram with one right angle is a rectangle, so $ABCD$ is a rectangle.'
        constraints: 'classification from the diagonal tests with the most specific name; perimeter or area after the classification; real settings; the closing item is the proof that congruent diagonals make a parallelogram a rectangle'
      - id: kp3
        name: Algebraic problems across special parallelograms
        key_prerequisites: [rectangle-properties, rhombus-properties]
        step_check:
          step: 'The diagonals of a rhombus bisect each other at right angles, so half-diagonals are $6$ and $8$'
          question: 'Why are the legs of the right triangle half of each diagonal, not the whole diagonals?'
          options:
            - 'The diagonals cross at their midpoints, so each one is cut into two equal halves'
            - 'A side is shorter than a diagonal, so the legs must be half as long as the diagonals'
            - 'The diagonals of a rhombus are congruent, so each leg is half of the common length'
            - 'The diagonals bisect the vertex angles, so each leg is half of a diagonal by symmetry'
          answer: 'The diagonals cross at their midpoints, so each one is cut into two equal halves'
          why: 'A rhombus is a parallelogram, so its diagonals bisect each other and the pieces from the crossing point are halves, while the two diagonals of a rhombus differ in length and the angle bisecting does not set the lengths.'
        exemplars:
          - problem: 'A rhombus has diagonals measuring $3x$ and $4x$ and a side of length $15$. Find the two diagonal lengths.'
            answer_contract: {"kind":"exact"}
            answer: '18, 24'
            solution_sketch: 'The half-diagonals $1.5x$ and $2x$ are the legs of a right triangle with hypotenuse $15$. So $6.25x^2 = 225$, giving $x = 6$ and diagonals $18$ and $24$.'
          - problem: 'A rectangular door frame is $0.7$ m wide and has a diagonal brace $2.5$ m long. How high is the frame, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '2.4'
            solution_sketch: 'The brace, the width and the height form a right triangle. The height is $\sqrt{2.5^2 - 0.7^2} = \sqrt{5.76} = 2.4$ m.'
          - problem: 'A square garden bed has a diagonal of $6\sqrt{2}$ m. How many metres of edging go around the bed?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '24'
            solution_sketch: 'A side of the square is $6\sqrt{2}/\sqrt{2} = 6$ m. The perimeter is $4 \cdot 6 = 24$ m.'
          - problem: 'A rhombus-shaped floor tile has diagonals of $10$ cm and $24$ cm. What is the perimeter of the tile, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '52'
            solution_sketch: 'The diagonals of a rhombus cross at right angles and bisect each other, so a side is $\sqrt{5^2 + 12^2} = 13$ cm. The perimeter is $4 \cdot 13 = 52$ cm.'
          - problem: 'In rectangle $ABCD$, the diagonals measure $AC = 4x - 5$ and $BD = 2x + 9$. Find the length of $\overline{AC}$.'
            answer_contract: {"kind":"exact"}
            answer: '23'
            solution_sketch: 'The diagonals of a rectangle are congruent, so $4x - 5 = 2x + 9$ and $x = 7$. Then $AC = 4(7) - 5 = 23$.'
          - problem: 'The diagonals of rhombus $PQRS$ meet at $T$, with $PT = 2x + 1$ and $TR = 5x - 8$. Find the length of $\overline{PR}$.'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'The diagonals of a rhombus bisect each other, so $2x + 1 = 5x - 8$ and $x = 3$. Then $PT = 7$ and $PR = 2 \cdot 7 = 14$.'
          - problem: 'A square courtyard has an area of $200$ square metres. How long is a diagonal path across it, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The side is $\sqrt{200} = 10\sqrt{2}$ m. The diagonal is $s\sqrt{2} = 10\sqrt{2}\cdot\sqrt{2} = 20$ m.'
          - problem: 'A square has an area of $81$. Find the length of its diagonal in simplest radical form.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '9*sqrt(2)'
            solution_sketch: 'The side of a square is the square root of its area, so $s = \sqrt{81} = 9$. The diagonal is $s\sqrt{2} = 9\sqrt{2}$.'
        constraints: 'combine diagonal facts with the Pythagorean theorem; clean integer, decimal or radical answers; linear setups from congruent or bisected diagonals; real settings in metres and centimetres'
    diagnostic_exemplar:
      problem: 'A rhombus has diagonals measuring $3x$ and $4x$ and a side of length $20$. Find the two diagonal lengths.'
      answer_contract: {"kind":"exact"}
      answer: '24, 32'
      solution_sketch: 'The half-diagonals $1.5x$ and $2x$ are the legs of a right triangle with hypotenuse $20$. So $6.25x^2 = 400$, giving $x = 8$ and diagonals $24$ and $32$.'
    anki_seeds:
      - front: "A square's diagonal in terms of its side s:"
        back: "s times sqrt(2)"
        type: basic
      - front: "A parallelogram whose diagonals are congruent and perpendicular is a..."
        back: "square"
        type: basic

  - id: trapezoid-properties
    name: Trapezoid Properties
    core: false
    difficulty: 0.36
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: parallel-lines-transversals
        weight: 0.6
        key: true
      - id: triangle-midsegments
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Isosceles trapezoid angles
        key_prerequisites: [parallel-lines-transversals]
        step_check:
          step: 'Consecutive interior angles along a transversal of parallel lines are supplementary'
          question: 'Why do the two angles along a leg add to $180^\circ$ instead of being equal?'
          options:
            - 'The legs are congruent, so the angles at their two ends have to be congruent as well'
            - 'Any two neighboring angles of a quadrilateral are supplementary, with or without parallel sides'
            - 'The leg crosses both parallel bases, so its two angles on one side add to a straight angle'
            - 'The angles at the ends of a leg are base angles, and base angles are always supplementary'
          answer: 'The leg crosses both parallel bases, so its two angles on one side add to a straight angle'
          why: 'The bases are parallel, so the leg is a transversal and the interior angles on one side of it add to $180^\circ$, whereas equal legs give equal base angles only along one base and a general quadrilateral has no such pairs.'
        exemplars:
          - problem: 'Isosceles trapezoid $ABCD$ has bases $\overline{AB}$ and $\overline{DC}$, and angle $A$ measures $74^\circ$. Find the measure of angle $D$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '106'
            solution_sketch: 'Leg $\overline{AD}$ is a transversal of the parallel bases, so angles $A$ and $D$ are supplementary. Then $m\angle D = 180 - 74 = 106^\circ$.'
          - problem: 'Isosceles trapezoid $ABCD$ has bases $\overline{AB}$ and $\overline{DC}$, and angle $A$ measures $63^\circ$. Find the measure of angle $B$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '63'
            solution_sketch: 'The two angles at the ends of one base of an isosceles trapezoid are congruent. So angle $B$ measures $63^\circ$, the same as angle $A$.'
          - problem: 'The cross-section of a drainage ditch is an isosceles trapezoid, wider at the top than at the floor. Each wall makes an angle of $52^\circ$ with the top edge, measured inside the ditch. What angle does a wall make with the floor of the ditch, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '128'
            solution_sketch: 'The top and the floor are parallel and the wall is a transversal, so the two angles along the wall are supplementary. The angle at the floor is $180 - 52 = 128^\circ$.'
          - problem: 'In an isosceles trapezoid, the two angles at the ends of one leg measure $(3x + 12)^\circ$ and $(2x + 28)^\circ$. Find the larger of the two angles, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '96'
            solution_sketch: 'Angles along a leg are supplementary, so $5x + 40 = 180$ and $x = 28$. The angles are $96^\circ$ and $84^\circ$, so the larger is $96^\circ$.'
          - problem: 'A flower bed is an isosceles trapezoid. The corner angle at each end of the longer edge is $71^\circ$. What is the angle at each of the two corners of the shorter edge, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '109'
            solution_sketch: 'The two straight edges of the bed are parallel, so each corner on the shorter edge is supplementary to the corner at the other end of the same slanted side. That angle is $180 - 71 = 109^\circ$.'
          - problem: 'Trapezoid $ABCD$ has bases $\overline{AB}$ and $\overline{DC}$. Angle $A$ measures $80^\circ$ and angle $B$ measures $100^\circ$. Is the trapezoid isosceles?'
            answer_contract: {"kind":"label","options":[["no","no, it is not","no it is not","it is not isosceles","not isosceles","it is not an isosceles trapezoid","not an isosceles trapezoid"],["yes","yes, it is","yes it is","it is isosceles","isosceles","it is an isosceles trapezoid","an isosceles trapezoid"]]}
            answer: 'no'
            solution_sketch: 'In an isosceles trapezoid the angles at the ends of one base are congruent. Here angles $A$ and $B$ are $80^\circ$ and $100^\circ$, which differ, so the trapezoid is not isosceles.'
          - problem: 'A stage platform is an isosceles trapezoid whose shorter edge faces the audience. Each corner on the longer edge measures $64^\circ$. What is the measure of each corner on the shorter edge, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '116'
            solution_sketch: 'The two straight edges are parallel, and each slanted side is a transversal. So a corner on the shorter edge is supplementary to a $64^\circ$ corner, and it measures $180 - 64 = 116^\circ$.'
        constraints: 'base angle pairs congruent; leg-adjacent pairs supplementary; whole degrees; real cross-sections and floor plans; one is-it-isosceles verdict'
      - id: kp2
        name: Trapezoid midsegment
        key_prerequisites: [triangle-midsegments]
        step_check:
          step: 'The midsegment equals the average of the bases'
          question: 'Why is the midsegment the average of the two bases, not the longer base or the sum?'
          options:
            - 'It is parallel to the bases and halfway between them, so it is as long as their mean'
            - 'It joins the midpoints of the legs, so it must be half as long as the longer base'
            - 'It is parallel to both bases, so it has to be exactly as long as the shorter base'
            - 'It runs across the trapezoid, so its length is the sum of the two bases divided by $4$'
          answer: 'It is parallel to the bases and halfway between them, so it is as long as their mean'
          why: 'The midsegment lies halfway between the bases and its length changes steadily from one base to the other, so it equals their average and is longer than the shorter base and shorter than the longer one.'
        exemplars:
          - problem: 'In trapezoid $ABCD$, the parallel sides measure $AB = 18$ cm and $DC = 26$ cm. Point $M$ is the midpoint of leg $\overline{AD}$ and $N$ is the midpoint of leg $\overline{BC}$. How long is $\overline{MN}$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '22'
            solution_sketch: 'Segment $\overline{MN}$ joins the midpoints of the legs, so it is the midsegment. Its length is $\frac{18 + 26}{2} = 22$ cm.'
          - problem: 'A trapezoid-shaped field has two parallel fences. One is $9$ m long. A path joining the midpoints of the two slanted sides is $15$ m long. How long is the other parallel fence, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The path is the midsegment, so $15 = \frac{9 + b}{2}$. Then $9 + b = 30$ and $b = 21$ m.'
          - problem: 'The end wall of a barn is a trapezoid with a bottom edge of $12.4$ m and a top edge of $7.6$ m. A horizontal beam joins the midpoints of the two slanted sides. How long is the beam, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The beam is the midsegment of the trapezoid. Its length is the average of the edges, $\frac{12.4 + 7.6}{2} = 10$ m.'
          - problem: 'The midsegment of a trapezoid measures $9$ and one base measures $7$. Find the other base.'
            answer_contract: {"kind":"exact"}
            answer: '11'
            solution_sketch: 'The midsegment is the average of the bases, so $\frac{7 + b}{2} = 9$. Then $b = 18 - 7 = 11$.'
          - problem: 'The midsegment of a trapezoid measures $20$ cm, and the two bases differ in length by $6$ cm. How long is the longer base, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '23'
            solution_sketch: 'The midsegment lies midway between the bases, so they are $20 - 3 = 17$ cm and $20 + 3 = 23$ cm. The longer base is $23$ cm.'
          - problem: 'In trapezoid $ABCD$ the bases are $AB = 8$ cm and $DC = 24$ cm. The midsegment $\overline{MN}$ cuts the trapezoid into a smaller trapezoid $ABNM$ and a larger one. How long is the midsegment of $ABNM$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The midsegment of $ABCD$ is $\frac{8 + 24}{2} = 16$ cm, and it is a base of $ABNM$. The midsegment of $ABNM$ is $\frac{8 + 16}{2} = 12$ cm.'
          - problem: 'The segment joining the midpoints of the legs of a trapezoid has length equal to half the sum of the bases. Which theorem states this?'
            answer_contract: {"kind":"label","options":[["trapezoid midsegment theorem","the trapezoid midsegment theorem","midsegment theorem for trapezoids","trapezoid midsegment","midsegment theorem"],["triangle midsegment theorem","the triangle midsegment theorem","triangle midsegment"],["Pythagorean theorem","the Pythagorean theorem","Pythagoras"],["base angles theorem","the base angles theorem","isosceles triangle theorem"]]}
            answer: 'trapezoid midsegment theorem'
            solution_sketch: 'The segment between the midpoints of the two non-parallel sides of a trapezoid is called its midsegment. The trapezoid midsegment theorem says it is parallel to the bases and equals half the sum of their lengths.'
        constraints: 'midsegment is the average of the bases; bases with even sum or decimals that average cleanly; unknown base, two-step midsegments and one theorem justification; fields and barn walls'
      - id: kp3
        name: Isosceles trapezoid legs and diagonals
        key_prerequisites: [parallel-lines-transversals]
        step_check:
          step: 'The diagonals of an isosceles trapezoid are congruent, so 3x + 2 = 5x - 8'
          question: 'Why can the two diagonal expressions be set equal to each other?'
          options:
            - 'The diagonals of every trapezoid bisect each other, so each diagonal splits into equal halves'
            - 'Two triangles with congruent legs and base angles match, so their diagonals are equal'
            - 'The diagonals meet at right angles, and perpendicular diagonals have the same length always'
            - 'Both diagonals end on the same two bases, so their lengths agree by the definition of a base'
          answer: 'Two triangles with congruent legs and base angles match, so their diagonals are equal'
          why: 'Triangles formed by the bases and the legs are congruent by SAS, so their matching sides, the diagonals, are congruent, while only the diagonals of an isosceles trapezoid are guaranteed to be equal and a trapezoid in general has neither bisecting nor perpendicular diagonals.'
        exemplars:
          - problem: 'In isosceles trapezoid $ABCD$ the diagonals measure $AC = 4x + 3$ and $BD = 6x - 7$. Find the length of $\overline{AC}$.'
            answer_contract: {"kind":"exact"}
            answer: '23'
            solution_sketch: 'The diagonals of an isosceles trapezoid are congruent, so $4x + 3 = 6x - 7$ and $x = 5$. Then $AC = 4(5) + 3 = 23$.'
          - problem: 'A flower bed is an isosceles trapezoid. Its two slanted sides measure $(2x - 3)$ m and $(x + 6)$ m. How long is one slanted side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The legs of an isosceles trapezoid are congruent, so $2x - 3 = x + 6$ and $x = 9$. A slanted side is $2(9) - 3 = 15$ m.'
          - problem: 'A carpenter builds a window frame in the shape of an isosceles trapezoid. The two diagonal braces are cut to $(6x - 14)$ cm and $(4x + 16)$ cm. How long is each brace, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '76'
            solution_sketch: 'The diagonals of an isosceles trapezoid are congruent, so $6x - 14 = 4x + 16$ and $x = 15$. Each brace is $6(15) - 14 = 76$ cm.'
          - problem: 'Isosceles trapezoid $ABCD$ has bases $AB = 12$ and $DC = 20$. Its legs measure $AD = 3x - 4$ and $BC = x + 10$. Find the perimeter of $ABCD$.'
            answer_contract: {"kind":"exact"}
            answer: '66'
            solution_sketch: 'The legs are congruent, so $3x - 4 = x + 10$ and $x = 7$, which makes each leg $17$. The perimeter is $12 + 20 + 17 + 17 = 66$.'
          - problem: 'A garden trellis is a trapezoid with a top bar and a bottom bar that are parallel. Its two diagonal braces both measure $1.85$ m. Are the two slanted sides of the trellis equal in length?'
            answer_contract: {"kind":"label","options":[["yes","yes, they are equal","yes they are","they are equal","the sides are equal","equal"],["no","no, they are not equal","no they are not","they are not equal","the sides are not equal","not equal"]]}
            answer: 'yes'
            solution_sketch: 'A trapezoid with congruent diagonals is an isosceles trapezoid. So its two slanted sides are congruent.'
          - problem: 'Trapezoid $ABCD$ has bases $\overline{AB}$ and $\overline{DC}$, and diagonals $AC = 41$ cm and $BD = 40$ cm. Is the trapezoid isosceles?'
            answer_contract: {"kind":"label","options":[["no","no, it is not","no it is not","it is not isosceles","not isosceles","it is not an isosceles trapezoid","not an isosceles trapezoid"],["yes","yes, it is","yes it is","it is isosceles","isosceles","it is an isosceles trapezoid","an isosceles trapezoid"]]}
            answer: 'no'
            solution_sketch: 'The diagonals of an isosceles trapezoid are congruent. Here $AC = 41$ cm and $BD = 40$ cm differ, so the trapezoid is not isosceles.'
          - problem: 'In isosceles trapezoid $ABCD$ with bases $\overline{AB}$ and $\overline{DC}$, triangles $ADC$ and $BCD$ share side $\overline{DC}$, have $AD = BC$, and have $\angle ADC \cong \angle BCD$. Which criterion proves $\triangle ADC \cong \triangle BCD$?'
            answer_contract: {"kind":"label","options":[["SAS congruence","SAS","side-angle-side","side angle side"],["SSS congruence","SSS","side-side-side"],["ASA congruence","ASA","angle-side-angle"],["HL congruence","HL","hypotenuse-leg"]]}
            answer: 'SAS'
            solution_sketch: 'The angle $\angle ADC$ lies between sides $AD$ and $DC$, and the angle $\angle BCD$ lies between sides $BC$ and $CD$. Two sides and the included angle are congruent, so the triangles are congruent by SAS.'
          - problem: 'Write the full proof that the diagonals of an isosceles trapezoid are congruent.'
            answer_contract: {"kind":"none"}
            answer: 'AC = BD by CPCTC'
            solution_sketch: 'Let $ABCD$ be an isosceles trapezoid with $\overline{AB} \parallel \overline{DC}$ and $AD = BC$. 1. $AD = BC$ (legs of an isosceles trapezoid). 2. $\angle ADC \cong \angle BCD$ (base angles of an isosceles trapezoid are congruent). 3. $DC = CD$ (reflexive property). 4. $\triangle ADC \cong \triangle BCD$ (SAS). 5. $AC = BD$ (CPCTC).'
        constraints: 'linear expressions with integer solutions; congruent legs and congruent diagonals; verdicts about whether a trapezoid is isosceles in both directions; the closing item is the proof that the diagonals are congruent'
    diagnostic_exemplar:
      problem: 'In an isosceles trapezoid the diagonals measure $4x - 7$ and $2x + 9$, and the bases measure $x + 6$ and $3x - 4$. Find the length of the midsegment.'
      answer_contract: {"kind":"exact"}
      answer: '17'
      solution_sketch: 'Congruent diagonals give $4x - 7 = 2x + 9$, so $x = 8$. The bases are $14$ and $20$, and the midsegment is their average, $17$.'
    anki_seeds:
      - front: "The midsegment of a trapezoid equals..."
        back: "the average of the two bases"
        type: basic
      - front: "The diagonals of an isosceles trapezoid are..."
        back: "congruent"
        type: basic

  - id: kite-properties
    name: Kite Properties
    core: false
    difficulty: 0.36
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: polygon-angle-sums
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Two pairs of consecutive congruent sides
        key_prerequisites: [polygon-angle-sums]
        step_check:
          step: 'Add the lengths together: $6 + 6 + 9 + 9$'
          question: 'Why is the perimeter of a kite $2a + 2b$ rather than $4a$ or $a + b$?'
          options:
            - 'A kite has four equal sides, so one side length is counted four times in the boundary'
            - 'Only the longer pair of sides forms the boundary, while the shorter pair lies inside'
            - 'Opposite sides of a kite are congruent, so one side from each pair is enough'
            - 'Each of the two side lengths occurs on two sides, so both lengths are counted twice'
          answer: 'Each of the two side lengths occurs on two sides, so both lengths are counted twice'
          why: 'The sides are two pairs of equal neighbors, so each length is used twice and the perimeter is $2a + 2b$, whereas four equal sides describe a rhombus and congruent opposite sides describe a parallelogram.'
        exemplars:
          - problem: 'Kite $ABCD$ has $AB = AD = 7$ cm and $CB = CD = 12$ cm. Find its perimeter, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '38'
            solution_sketch: 'The sides form two congruent pairs, so the perimeter is $2(7) + 2(12)$. That equals $14 + 24 = 38$ cm.'
          - problem: 'A kite is trimmed with a ribbon all around its edge, and $2.8$ m of ribbon is used. The two shorter sides measure $0.5$ m each. How long is each of the two longer sides, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '0.9'
            solution_sketch: 'The two shorter sides use $2(0.5) = 1$ m of ribbon. The two longer sides share the remaining $1.8$ m, so each is $0.9$ m.'
          - problem: 'A kite-shaped garden plot has two adjacent sides of $14$ m each and the other two sides of $20$ m each. Fencing costs $9$ euros per metre. What does the fencing for the whole boundary cost, in euros?'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            answer: '612'
            solution_sketch: 'The perimeter is $2(14) + 2(20) = 68$ m. At $9$ euros per metre the fence costs $68 \cdot 9 = 612$ euros.'
          - problem: 'Quadrilateral $ABCD$ has $AB = 5$ cm, $BC = 7$ cm, $CD = 5$ cm, and $DA = 7$ cm. Is $ABCD$ a kite?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is a kite","yes, it could be","it is a kite","it could be a kite","could be a kite","it could be","a kite"],["no","no, it is not a kite","no, it cannot be","it is not a kite","it cannot be a kite","cannot be a kite","it cannot be","not a kite"]]}
            answer: 'no'
            solution_sketch: 'A kite has two pairs of congruent sides that meet at a vertex, such as $AB = AD$ and $CB = CD$. Here no two neighboring sides are congruent, since $5 \neq 7$, so $ABCD$ is not a kite.'
          - problem: 'Kite $ABCD$ has a perimeter of $42$ cm, and $AB = AD = 8$ cm. Find the length of $\overline{CB}$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The sides $AB$ and $AD$ use $16$ cm of the perimeter. The remaining $26$ cm is shared by $CB$ and $CD$, so $CB = 13$ cm.'
          - problem: 'A kite frame is built from four sticks: two sticks of $45$ cm and two sticks of $70$ cm. The two $45$ cm sticks meet at the top corner. How many centimetres of cord run all around the frame?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '230'
            solution_sketch: 'The sticks come in two congruent pairs. The cord is $2(45) + 2(70) = 230$ cm long.'
          - problem: 'Kite $ABCD$ has sides $AB = AD = 4x - 3$ and $CB = CD = x + 9$, and its perimeter is $72$. Find the length of its longest side.'
            answer_contract: {"kind":"exact"}
            answer: '21'
            solution_sketch: 'The perimeter is $2(4x - 3) + 2(x + 9) = 10x + 12$, so $10x + 12 = 72$ and $x = 6$. The side lengths are $21$ and $15$, so the longest side is $21$.'
          - problem: 'Quadrilateral $ABCD$ has $AB = 4$ cm, $BC = 4$ cm, $CD = 9$ cm, and $DA = 9$ cm. Is $ABCD$ a kite?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is a kite","yes, it could be","it is a kite","it could be a kite","could be a kite","it could be","a kite"],["no","no, it is not a kite","no, it cannot be","it is not a kite","it cannot be a kite","cannot be a kite","it cannot be","not a kite"]]}
            answer: 'yes'
            solution_sketch: 'The two $4$ cm sides are neighbors and so are the two $9$ cm sides. That gives two pairs of consecutive congruent sides, so it is a kite.'
        constraints: 'two distinct side lengths; perimeter and missing side from the perimeter; algebraic side lengths; is-it-a-kite verdicts in both directions; ribbon, fencing and frame contexts'
      - id: kp2
        name: Kite angles
        key_prerequisites: [polygon-angle-sums]
        step_check:
          step: 'Let each non-vertex angle be x: 40 + 100 + 2x = 360'
          question: 'Why does the angle sum contain $2x$ for the two unknown angles?'
          options:
            - 'The two angles between unequal sides are congruent, so each equals $x$'
            - 'The two unknown angles lie on the axis of symmetry, so each is half of the angle sum'
            - 'The two unknown angles share a side, and neighboring angles of a kite are congruent'
            - 'The diagonals bisect the angles at every corner, so every angle appears twice in the sum'
          answer: 'The two angles between unequal sides are congruent, so each equals $x$'
          why: 'Reflection in the axis of symmetry swaps the two angles between unequal sides, so those angles are equal, while the angles on the axis are not matched and neighboring angles are not congruent in general.'
        exemplars:
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$. Angle $A$ measures $40^\circ$ and angle $C$ measures $100^\circ$. Find the measure of angle $B$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'Angles $B$ and $D$ lie between unequal sides, so they are congruent. The four angles add to $360^\circ$, so $2x = 360 - 140$ and $x = 110$.'
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$. Angle $B$ measures $95^\circ$ and angle $A$ measures $62^\circ$. Find the measure of angle $C$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '108'
            solution_sketch: 'Angle $D$ is congruent to angle $B$, so $D = 95^\circ$. Then $m\angle C = 360 - 62 - 95 - 95 = 108^\circ$.'
          - problem: 'A glass kite-shaped panel has a top angle of $80^\circ$, and its two side angles each measure $105^\circ$. What is the bottom angle of the panel, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The four angles of a quadrilateral add to $360^\circ$. The bottom angle is $360 - 80 - 105 - 105 = 70^\circ$.'
          - problem: 'A kite-shaped sail has a top angle of $50^\circ$ and a bottom angle of $130^\circ$. Its two side angles are equal. What does each side angle measure, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The two side angles lie between unequal sides, so they are congruent. Each one is $(360 - 50 - 130)/2 = 90^\circ$.'
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$. Angle $A$ measures $(3x)^\circ$, angle $C$ measures $(x + 20)^\circ$, and angles $B$ and $D$ each measure $(2x + 30)^\circ$. Find the measure of angle $B$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '100'
            solution_sketch: 'The four angles add to $360^\circ$, so $3x + x + 20 + 2(2x + 30) = 8x + 80 = 360$. Then $x = 35$ and angle $B$ measures $2(35) + 30 = 100^\circ$.'
          - problem: 'Quadrilateral $ABCD$ has angles $A = 80^\circ$, $B = 100^\circ$, $C = 110^\circ$, and $D = 70^\circ$. Could it be a kite?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is a kite","yes, it could be","it is a kite","it could be a kite","could be a kite","it could be","a kite"],["no","no, it is not a kite","no, it cannot be","it is not a kite","it cannot be a kite","cannot be a kite","it cannot be","not a kite"]]}
            answer: 'no'
            solution_sketch: 'The angles add to $360^\circ$, but a kite has one pair of opposite angles that are congruent. Neither $80^\circ$ and $110^\circ$ nor $100^\circ$ and $70^\circ$ are equal, so it cannot be a kite.'
          - problem: 'Quadrilateral $ABCD$ has angles $A = 115^\circ$, $B = 75^\circ$, $C = 95^\circ$, and $D = 75^\circ$. Could it be a kite?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is a kite","yes, it could be","it is a kite","it could be a kite","could be a kite","it could be","a kite"],["no","no, it is not a kite","no, it cannot be","it is not a kite","it cannot be a kite","cannot be a kite","it cannot be","not a kite"]]}
            answer: 'yes'
            solution_sketch: 'The angles add to $360^\circ$, and angles $B$ and $D$ are opposite angles that are both $75^\circ$. A kite with its axis along $\overline{AC}$ has exactly this shape, so it could be a kite.'
        constraints: 'angle sums use 360; the congruent pair is the pair between unequal sides; algebraic angles with integer solutions; could-it-be-a-kite verdicts in both directions; panel and sail contexts'
      - id: kp3
        name: Perpendicular diagonals and side lengths
        key_prerequisites: [pythagorean-theorem]
        step_check:
          step: 'The diagonals are perpendicular, so angle AEB is a right angle and triangle ABE is a right triangle'
          question: 'Why are the diagonals of a kite perpendicular?'
          options:
            - 'The opposite sides of a kite are parallel, and parallel sides force the diagonals to be perpendicular'
            - 'The diagonals of a kite are congruent, and congruent diagonals always cross at right angles'
            - 'Both A and C are equally far from B and from D, so line AC is the perpendicular bisector of BD'
            - 'A kite has two right angles, and the diagonals pass through the corners where they sit'
          answer: 'Both A and C are equally far from B and from D, so line AC is the perpendicular bisector of BD'
          why: 'A point that is equally far from two endpoints lies on the perpendicular bisector of the segment between them, so the line through $A$ and $C$ is that bisector; kites have no parallel sides, and congruent diagonals do not imply a right angle.'
        exemplars:
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$. The diagonals meet at $E$, with $AE = 6$ cm and $BE = 8$ cm. Find $AB$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The diagonals of a kite are perpendicular, so triangle $ABE$ is a right triangle with legs $6$ and $8$. Then $AB = \sqrt{6^2 + 8^2} = 10$ cm.'
          - problem: 'A kite is built from a vertical stick $\overline{AC}$ of $120$ cm and a crossbar $\overline{BD}$ of $60$ cm. The crossbar is fixed at its midpoint $E$, at a right angle to the stick, and $E$ is $40$ cm from end $A$. How long is the cord from $A$ to $B$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '50'
            solution_sketch: 'In right triangle $ABE$, $AE = 40$ cm and $BE = 30$ cm. The cord is $AB = \sqrt{40^2 + 30^2} = 50$ cm.'
          - problem: 'A kite-shaped garden $ABCD$ has $AB = AD$ and $CB = CD$. The paths $\overline{AC}$ and $\overline{BD}$ cross at $E$, with $AE = 5$ m, $EC = 16$ m, and $BD = 24$ m. How many metres of fencing run along the four sides of the garden?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The path $\overline{BD}$ is bisected at $E$, so $BE = 12$ m. Then $AB = \sqrt{5^2 + 12^2} = 13$ and $BC = \sqrt{12^2 + 16^2} = 20$, and the fence is $2(13 + 20) = 66$ m.'
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$, and the diagonals meet at $E$. Angle $EAB$ measures $35^\circ$. Find the measure of angle $ABE$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'The diagonals of a kite are perpendicular, so triangle $ABE$ has a right angle at $E$. Its acute angles add to $90^\circ$, so $m\angle ABE = 90 - 35 = 55^\circ$.'
          - problem: 'In kite $ABCD$, $AB = AD = 26$ cm and the diagonal $\overline{BD}$ is $20$ cm long. The diagonals meet at $E$. Find $AE$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '24'
            solution_sketch: 'The axis diagonal bisects $\overline{BD}$ at a right angle, so $BE = 10$ cm. Then $AE = \sqrt{26^2 - 10^2} = 24$ cm.'
          - problem: 'In kite $ABCD$ the diagonals meet at $E$, with $AE = x$ cm, $BE = (x + 7)$ cm, and $AB = 13$ cm. Find $BE$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'Triangle $ABE$ is right-angled at $E$, so $x^2 + (x + 7)^2 = 169$. This simplifies to $x^2 + 7x - 60 = 0$, so $x = 5$ and $BE = 12$ cm.'
          - problem: 'In kite $ABCD$, a student shows that $\overline{AC}$ is perpendicular to $\overline{BD}$ by noting that $A$ and $C$ are each the same distance from $B$ as from $D$. Which theorem justifies this?'
            answer_contract: {"kind":"label","options":[["perpendicular bisector converse","converse of the perpendicular bisector theorem","the converse of the perpendicular bisector theorem","equidistant points theorem","perpendicular bisector theorem","converse of perpendicular bisector"],["triangle midsegment theorem","the triangle midsegment theorem"],["Pythagorean theorem","the Pythagorean theorem","Pythagoras"],["angle bisector theorem","the angle bisector theorem"]]}
            answer: 'perpendicular bisector converse'
            solution_sketch: 'A point that is equally far from $B$ and $D$ lies on the perpendicular bisector of $\overline{BD}$. Both $A$ and $C$ do, so line $AC$ is the perpendicular bisector of $\overline{BD}$.'
          - problem: 'Write the full proof that the diagonals of a kite are perpendicular.'
            answer_contract: {"kind":"none"}
            answer: 'AC is perpendicular to BD'
            solution_sketch: 'Let $ABCD$ be a kite with $AB = AD$ and $CB = CD$, and let the diagonals meet at $E$. 1. $AC = AC$ (reflexive property). 2. $\triangle ABC \cong \triangle ADC$ (SSS). 3. $\angle BAC \cong \angle DAC$ (CPCTC). 4. $AE = AE$ (reflexive property). 5. $\triangle ABE \cong \triangle ADE$ (SAS, using $AB = AD$, $\angle BAE \cong \angle DAE$, $AE = AE$). 6. $\angle AEB \cong \angle AED$ (CPCTC). 7. $\angle AEB$ and $\angle AED$ form a linear pair, so $m\angle AEB + m\angle AED = 180^\circ$. 8. Each angle measures $90^\circ$, so $\overline{AC} \perp \overline{BD}$.'
        constraints: 'diagonal pieces form Pythagorean triples; the axis diagonal bisects the cross diagonal at a right angle; one algebraic setup, one theorem justification, kite frame and garden contexts; the closing item is the proof that the diagonals are perpendicular'
    diagnostic_exemplar:
      problem: 'In kite $ABCD$ the diagonals meet at $E$, with $AB = AD$, $BE = ED = 12$, and $AE = 5$. Find $AB$.'
      answer_contract: {"kind":"exact"}
      answer: '13'
      solution_sketch: 'The diagonals are perpendicular, so right triangle $ABE$ has legs $5$ and $12$. Then $AB = \sqrt{5^2 + 12^2} = 13$.'
    anki_seeds:
      - front: "The diagonals of a kite are..."
        back: "perpendicular"
        type: basic
      - front: "In a kite, the non-vertex angles (between unequal sides) are..."
        back: "congruent"
        type: basic

  - id: trapezoids-kites
    name: Trapezoids and Kites
    core: false
    difficulty: 0.44
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: trapezoid-properties
        weight: 0.7
        key: true
      - id: kite-properties
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Midsegment equations
        key_prerequisites: [trapezoid-properties, multi-step-equations]
        step_check:
          step: 'Set the average equal to the midsegment'
          question: 'Why is the sum of the two base expressions divided by $2$ in this equation?'
          options:
            - 'Dividing by $2$ cancels the $2$ in $2x$, which every trapezoid base expression contains'
            - 'The midsegment is half of the longer base, so the sum is halved to match it'
            - 'The midsegment is the average of the bases, so its length is their sum over $2$'
            - 'A midsegment is shorter than both bases, so their sum has to be cut in half first'
          answer: 'The midsegment is the average of the bases, so its length is their sum over $2$'
          why: 'The midsegment lies halfway between the two bases, so its length is the mean of their lengths; it is longer than the shorter base, it is not half of the longer base, and the base expressions need not contain a factor of 2.'
        exemplars:
          - problem: 'A trapezoid has bases $2x + 3$ and $4x - 1$, and its midsegment measures $16$. Find the length of the longer base.'
            answer_contract: {"kind":"exact"}
            answer: '19'
            solution_sketch: 'The midsegment is the average of the bases, so $\frac{(2x + 3) + (4x - 1)}{2} = 3x + 1 = 16$ and $x = 5$. The bases are $13$ and $19$, so the longer base is $19$.'
          - problem: 'A trapezoid has a midsegment of $2x + 1$ and bases of $10$ and $3x - 2$. Find the length of the midsegment.'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'The midsegment is the average of the bases, so $2x + 1 = \frac{10 + 3x - 2}{2}$ and $4x + 2 = 3x + 8$. Then $x = 6$ and the midsegment is $2(6) + 1 = 13$.'
          - problem: 'The top and bottom edges of a trapezoidal garden bed measure $2x$ m and $6x$ m. A path joining the midpoints of the two slanted sides is $16$ m long. How long is the bottom edge, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '24'
            solution_sketch: 'The path is the midsegment, so $\frac{2x + 6x}{2} = 4x = 16$ and $x = 4$. The bottom edge is $6(4) = 24$ m.'
          - problem: 'A trapezoid has a midsegment of $3x + 2$ and bases of $16$ and $2x$. Find the length of the shorter base.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The midsegment is the average of the bases, so $2(3x + 2) = 16 + 2x$ and $x = 3$. The bases are $16$ and $6$, so the shorter base is $6$.'
          - problem: 'A trapezoidal sail has a top edge of $(x + 5)$ m and a bottom edge of $(3x + 1)$ m. A rope joining the midpoints of the two slanted sides is $17$ m long. How long is the top edge, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The rope is the midsegment, so $\frac{(x + 5) + (3x + 1)}{2} = 2x + 3 = 17$ and $x = 7$. The top edge is $7 + 5 = 12$ m.'
          - problem: 'A trapezoid has bases $x + 4$ and $3x - 2$. Its midsegment is $5$ shorter than its longer base. Find the length of the longer base.'
            answer_contract: {"kind":"exact"}
            answer: '22'
            solution_sketch: 'The midsegment is $\frac{(x + 4) + (3x - 2)}{2} = 2x + 1$. The longer base is $3x - 2$, so $(3x - 2) - (2x + 1) = 5$ gives $x = 8$ and a longer base of $22$.'
        constraints: 'linear expressions; integer solutions; midsegment is the average of the bases; unknowns that are a base or the midsegment; garden and sail contexts'
      - id: kp2
        name: Angle equations in isosceles trapezoids
        key_prerequisites: [trapezoid-properties, multi-step-equations]
        step_check:
          step: 'The two angles sit at opposite ends of one leg, so they are supplementary'
          question: 'Why do the two angle expressions add up to $180$ here instead of being set equal?'
          options:
            - 'The legs of an isosceles trapezoid are congruent, so angles at its ends must be equal'
            - 'Angles at the two ends of a leg are consecutive interior angles of the parallel bases'
            - 'Every pair of angles in a trapezoid adds to $180$, whichever corners are chosen'
            - 'An isosceles trapezoid has two right angles, so the other pair must add to $180^\circ$'
          answer: 'Angles at the two ends of a leg are consecutive interior angles of the parallel bases'
          why: 'The bases are parallel, so a leg is a transversal and the interior angles along it add to $180$, whereas equal angles occur on one base and only the pairs along a leg are supplementary.'
        exemplars:
          - problem: 'Isosceles trapezoid $ABCD$ has bases $\overline{AB}$ and $\overline{DC}$. Angle $A$ measures $(3x + 15)^\circ$ and angle $D$ measures $(2x + 5)^\circ$. Find the measure of angle $A$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '111'
            solution_sketch: 'Angles $A$ and $D$ lie along one leg, so they are supplementary and $5x + 20 = 180$. Then $x = 32$ and angle $A$ measures $3(32) + 15 = 111^\circ$.'
          - problem: 'In isosceles trapezoid $ABCD$ with bases $\overline{AB}$ and $\overline{DC}$, angles $A$ and $B$ measure $(4x - 6)^\circ$ and $(2x + 38)^\circ$. Find the measure of angle $A$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '82'
            solution_sketch: 'Angles $A$ and $B$ are the two angles on base $\overline{AB}$, so they are congruent and $4x - 6 = 2x + 38$. Then $x = 22$ and each angle measures $82^\circ$.'
          - problem: 'A canal has a cross-section in the shape of an isosceles trapezoid, wider at the top. A wall meets the floor at $(5x - 10)^\circ$ and meets the water surface at $(3x + 6)^\circ$. What angle does the wall make with the floor, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '105'
            solution_sketch: 'The floor and the water surface are parallel, so the two angles along a wall are supplementary. Then $8x - 4 = 180$, $x = 23$, and the angle with the floor is $5(23) - 10 = 105^\circ$.'
          - problem: 'The two angles on one base of an isosceles trapezoid measure $(7x - 8)^\circ$ and $(3x + 32)^\circ$. Find the measure of each of these angles, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '62'
            solution_sketch: 'The angles on one base are congruent, so $7x - 8 = 3x + 32$ and $x = 10$. Each angle measures $7(10) - 8 = 62^\circ$.'
          - problem: 'In isosceles trapezoid $ABCD$ with bases $\overline{AB}$ and $\overline{DC}$, angle $A$ measures $(5x + 1)^\circ$ and angle $C$ measures $(3x + 19)^\circ$. Find the measure of angle $A$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '101'
            solution_sketch: 'Angle $C$ is congruent to angle $D$, and angles $A$ and $D$ are supplementary, so $m\angle A + m\angle C = 180$. Then $8x + 20 = 180$, $x = 20$, and angle $A$ measures $5(20) + 1 = 101^\circ$.'
          - problem: 'In trapezoid $ABCD$ with bases $\overline{AB}$ and $\overline{DC}$, angles $A$ and $B$ measure $(3x + 4)^\circ$ and $(5x - 18)^\circ$. If the trapezoid is isosceles, find the measure of angle $A$, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '37'
            solution_sketch: 'In an isosceles trapezoid the angles at the ends of one base are congruent, so $3x + 4 = 5x - 18$ and $x = 11$. Angle $A$ measures $3(11) + 4 = 37^\circ$.'
          - problem: 'A trapezoidal sign is an isosceles trapezoid whose longer edge is on top. The two corners along the top edge measure $(9x - 12)^\circ$ and $(5x + 16)^\circ$. What does each of these corners measure, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '51'
            solution_sketch: 'The corners along one edge of an isosceles trapezoid are congruent, so $9x - 12 = 5x + 16$ and $x = 7$. Each corner measures $9(7) - 12 = 51^\circ$.'
        constraints: 'supplementary along a leg, congruent along a base, opposite angles across the trapezoid; integer solutions with angles strictly between 0 and 180 and not 90; canal and sign contexts'
      - id: kp3
        name: Kite equations and diagonal computations
        key_prerequisites: [kite-properties, multi-step-equations]
        step_check:
          step: 'Triangle CBE is right at E with hypotenuse BC = 13'
          question: 'Why is $BC$ the hypotenuse of triangle $CBE$ and not a leg?'
          options:
            - 'The right angle is at $E$, so the side opposite it, $BC$, is the longest side'
            - 'It is the longest segment drawn from $B$, so it is the hypotenuse of any triangle containing it'
            - 'The sides of the kite meet at $B$, so the angle at $B$ has to be the right angle'
            - 'The axis diagonal $AC$ is the longest segment, so $BC$ along it is the hypotenuse'
          answer: 'The right angle is at $E$, so the side opposite it, $BC$, is the longest side'
          why: 'The diagonals of a kite are perpendicular, so the right angle is at $E$ and the hypotenuse is the side facing it; the angle at $B$ is not a right angle, and $BC$ does not lie along the axis diagonal.'
        exemplars:
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$, and the diagonals meet at $E$. The diagonal $\overline{BD}$ is $24$ cm long, $AB = 13$ cm and $BC = 20$ cm. Find $AC$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The axis diagonal bisects $\overline{BD}$ at a right angle, so $BE = 12$ cm. Then $AE = \sqrt{13^2 - 12^2} = 5$ and $EC = \sqrt{20^2 - 12^2} = 16$, so $AC = 21$ cm.'
          - problem: 'A stained-glass panel is a kite. Its top angle is $(3x)^\circ$, its bottom angle is $(2x + 20)^\circ$, and its two side angles each measure $105^\circ$. What is the larger of the top and bottom angles, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '78'
            solution_sketch: 'The four angles add to $360^\circ$, so $3x + 2x + 20 + 210 = 360$ and $x = 26$. The top and bottom angles are $78^\circ$ and $72^\circ$, so the larger is $78^\circ$.'
          - problem: 'A kite is made from a crossbar $\overline{BD}$ of $18$ cm and a spine $\overline{AC}$. The sticks cross at $E$, the midpoint of $\overline{BD}$, at a right angle. The cord from the top corner $A$ to $B$ is $15$ cm and the cord from the bottom corner $C$ to $B$ is $41$ cm. How long is the spine, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '52'
            solution_sketch: 'Here $BE = 9$ cm. Then $AE = \sqrt{15^2 - 9^2} = 12$ and $EC = \sqrt{41^2 - 9^2} = 40$, so the spine is $12 + 40 = 52$ cm.'
          - problem: 'A kite has a top angle of $(4x)^\circ$ and a bottom angle of $(x + 30)^\circ$. Its two side angles each measure $110^\circ$. Find the larger of the top and bottom angles, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '88'
            solution_sketch: 'The four angles add to $360^\circ$, so $4x + x + 30 + 220 = 360$ and $x = 22$. The top and bottom angles are $88^\circ$ and $52^\circ$, so the larger is $88^\circ$.'
          - problem: 'In kite $ABCD$, $AB = AD$ and $CB = CD$, and the diagonals meet at $E$. Here $AB = 17$ cm, $BC = 25$ cm and $AC = 28$ cm. Find the length of $\overline{BD}$, in centimetres.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '30'
            solution_sketch: 'Let $AE = a$, so $EC = 28 - a$. Both $17^2 - a^2$ and $25^2 - (28 - a)^2$ equal $BE^2$, which gives $a = 8$, $BE = 15$ and $BD = 2 \cdot 15 = 30$ cm.'
          - problem: 'A kite-shaped flower bed $ABCD$ has $AB = AD = 10$ m and $CB = CD = 17$ m, and its long axis $\overline{AC}$ is $21$ m. How long is the cross path $\overline{BD}$, in metres?'
