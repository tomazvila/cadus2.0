            answer: '16'
            solution_sketch: 'Let $AE = a$ where $E$ is where the paths cross, so $EC = 21 - a$. Then $100 - a^2 = 289 - (21 - a)^2$ gives $a = 6$ and $BE = 8$, so $BD = 2 \cdot 8 = 16$ m.'
          - problem: 'In kite $ABCD$ the diagonals meet at $E$, with $BE = ED = 12$ cm, $AE = 5$ cm and $AB = 14$ cm. Are these measurements consistent with a kite?'
