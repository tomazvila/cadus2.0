      - id: similar-solids-scaling
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Area and volume from a given angle or distance'
        key_prerequisites: [space-angles-distances, polyhedra-terms-sections]
        exemplars:
          - problem: 'A regular quadrilateral pyramid has base side $6$ cm. Its lateral faces make an angle of $60^\circ$ with the base. What is its volume, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true,"form":"simplest_radical"}
            answer: '36*sqrt(3)'
            solution_sketch: 'The height is $3\tan 60^\circ=3\sqrt{3}$ cm, because $3$ cm is half the base side. The volume is $\frac{1}{3}\cdot 36\cdot 3\sqrt{3}=36\sqrt{3}$ cm$^3$.'
          - problem: 'A cone has a generatrix of $10$ cm. The generatrix makes an angle of $30^\circ$ with the base plane. What is the volume of the cone, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '125*pi'
            solution_sketch: 'The height is $10\sin 30^\circ=5$ cm and the radius is $10\cos 30^\circ=5\sqrt{3}$ cm. The volume is $\frac{1}{3}\pi\cdot 75\cdot 5=125\pi$ cm$^3$.'
          - problem: 'A diagonal of the axial section of a cylinder is $20$ cm long. It makes an angle of $30^\circ$ with the base plane. What is the volume of the cylinder, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '750*pi'
            solution_sketch: 'The height is $20\sin 30^\circ=10$ cm. The diameter is $20\cos 30^\circ=10\sqrt{3}$ cm, so $r^2=75$. The volume is $\pi\cdot 75\cdot 10=750\pi$ cm$^3$.'
          - problem: 'A rectangular box has a base with sides $3$ cm and $4$ cm. Its space diagonal makes an angle of $45^\circ$ with the base. What is the volume of the box, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The diagonal of the base is $5$ cm. The angle of $45^\circ$ makes the height equal to $5$ cm. The volume is $3\cdot 4\cdot 5=60$ cm$^3$.'
          - problem: 'A regular quadrilateral pyramid has height $4$ cm. Its lateral faces make an angle of $45^\circ$ with the base. What is the area of its lateral surface, in square centimeters?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '64*sqrt(2)'
            solution_sketch: 'Half the base side equals the height, $4$ cm, so the base side is $8$ cm and the base area is $64$ cm$^2$. The lateral area is the base area over $\cos 45^\circ$, which is $64\sqrt{2}$ cm$^2$.'
          - problem: 'A plane cuts a ball at the distance $3$ cm from its center. The section circle has area $16\pi$ cm$^2$. What is the volume of the ball, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '500*pi/3'
            solution_sketch: 'The section radius is $4$ cm. The radius of the ball is $\sqrt{3^2+4^2}=5$ cm. The volume is $\frac{4}{3}\pi\cdot 125=\frac{500\pi}{3}$ cm$^3$.'
        constraints: 'a given angle or distance fixes the height and the radius; then use the volume or area formula from the sheet; answers in cubic or square centimeters, some with a root or with $\pi$'
      - id: kp2
        name: 'Volume as a function of one variable'
        key_prerequisites: [solids-of-revolution-sections, polyhedra-terms-sections]
        exemplars:
          - problem: 'A regular quadrilateral pyramid has lateral edge $\sqrt{43}$ cm and base side $x$ cm. Its volume is $V(x)=\frac{1}{3}x^2\sqrt{43-\frac{x^2}{2}}$ cm$^3$. Find $V(6)$.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Put $x=6$. Then $43-\frac{36}{2}=25$ and the root is $5$. So $V(6)=\frac{1}{3}\cdot 36\cdot 5=60$ cm$^3$.'
          - problem: 'A closed cylinder has total surface area $24\pi$ cm$^2$ and radius $r$ cm. Its height is $h=\frac{12-r^2}{r}$ cm. What is the volume of the cylinder for $r=2$, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '16*pi'
            solution_sketch: 'For $r=2$, the height is $\frac{12-4}{2}=4$ cm. The volume is $\pi r^2h=\pi\cdot 4\cdot 4=16\pi$ cm$^3$.'
          - problem: 'A cone has generatrix $10$ cm and base radius $r$ cm. Its volume is $V(r)=\frac{\pi}{3}r^2\sqrt{100-r^2}$ cm$^3$. Find $V(6)$.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '96*pi'
            solution_sketch: 'Put $r=6$. Then $\sqrt{100-36}=8$. So $V(6)=\frac{\pi}{3}\cdot 36\cdot 8=96\pi$ cm$^3$.'
          - problem: 'A rectangular box has a square base with side $x$ cm and total surface area $96$ cm$^2$. Its height is $h=\frac{48-x^2}{2x}$ cm. What is its volume for $x=4$, in cubic centimeters?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '64'
            solution_sketch: 'For $x=4$, the height is $\frac{48-16}{8}=4$ cm. The volume is $x^2h=16\cdot 4=64$ cm$^3$.'
          - problem: 'A box with a square base has volume $V(x)=x^2(12-x)$ cm$^3$, where $x$ cm is the side of the base and $0<x<12$. Which integer $x$ gives $V(x)=256$?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Test $x=8$: $V(8)=64\cdot 4=256$. The equation $x^3-12x^2+256=0$ factors as $(x-8)^2(x+4)=0$, so $x=8$ is the only value in the interval.'
          - problem: 'A segment of a ball with radius $6$ cm has height $x$ cm. Its volume is $V(x)=\frac{\pi}{3}x^2(18-x)$ cm$^3$. Find $V(6)$.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '144*pi'
            solution_sketch: 'Put $x=6$. Then $V(6)=\frac{\pi}{3}\cdot 36\cdot 12=144\pi$ cm$^3$. This is the volume of a half ball.'
        constraints: 'the volume is given as a formula in one variable; the item asks for a value, or for the value of the variable that gives a given volume; no derivative is needed; volumes in cubic centimeters'
      - id: kp3
        name: 'Area and perimeter of a section'
        key_prerequisites: [polyhedra-terms-sections, solids-of-revolution-sections]
        exemplars:
          - problem: 'A cone has base radius $13$ cm and height $12$ cm. A plane passes through the apex and a chord of the base that is $5$ cm from the center of the base. What is the area of the section, in square centimeters?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '156'
            solution_sketch: 'The half chord is $\sqrt{13^2-5^2}=12$ cm, so the chord is $24$ cm. The distance from the apex to the chord is $\sqrt{12^2+5^2}=13$ cm. The area is $\frac{1}{2}\cdot 24\cdot 13=156$ cm$^2$.'
          - problem: 'A cube $ABCDA_1B_1C_1D_1$ has edge $6$ cm. A plane passes through the midpoints of $AB$, $AD$ and $AA_1$. What is the perimeter of the section, in centimeters?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            answer: '9*sqrt(2)'
            solution_sketch: 'The section is an equilateral triangle. Each side joins two midpoints on one face, so it is half of a face diagonal: $3\sqrt{2}$ cm. The perimeter is $9\sqrt{2}$ cm.'
          - problem: 'A plane cuts a ball of radius $10$ cm at the distance $6$ cm from the center. What is the perimeter of the section circle, in centimeters?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '16*pi'
            solution_sketch: 'The radius of the section is $\sqrt{10^2-6^2}=8$ cm. The perimeter is $2\pi\cdot 8=16\pi$ cm.'
          - problem: 'A regular quadrilateral pyramid has base side $8$ cm and height $6$ cm. A plane parallel to the base passes through the midpoint of the height. What is the area of the section, in square centimeters?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '16'
            solution_sketch: 'The section is a square similar to the base with the ratio $\frac{1}{2}$. Its side is $4$ cm. Its area is $16$ cm$^2$.'
          - problem: 'A truncated cone has base radii $3$ cm and $7$ cm and height $6$ cm. What is the area of its axial section, in square centimeters?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The axial section is a trapezoid with bases $6$ cm and $14$ cm and height $6$ cm. Its area is $\frac{6+14}{2}\cdot 6=60$ cm$^2$.'
          - problem: 'A right prism has a square base with side $4$ cm and height $9$ cm. A plane passes through two opposite lateral edges. What is the area of the section, in square centimeters?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '36*sqrt(2)'
            solution_sketch: 'The section is a rectangle. One side is the base diagonal $4\sqrt{2}$ cm. The other side is the height $9$ cm. The area is $36\sqrt{2}$ cm$^2$.'
        constraints: 'sections of a cone, a cube, a ball, a pyramid, a truncated cone and a prism; the item asks for the area or the perimeter of the section; lengths in centimeters and areas in square centimeters'
    diagnostic_exemplar:
      problem: 'A cylinder has base radius $5$ cm. A diagonal of its axial section is $26$ cm long. Find the volume of the cylinder in cubic centimeters.'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '600*pi'
      solution_sketch: 'The diameter is $10$ cm. The height is $\sqrt{26^2-10^2}=24$ cm. The volume is $\pi\cdot 25\cdot 24=600\pi$ cm$^3$.'
    anki_seeds:
      - front: "A face of a regular pyramid makes the angle $\\varphi$ with the base. The area of the lateral surface equals the area of the base divided by ..."
        back: "$\\cos\\varphi$"
        type: basic
      - front: "A plane parallel to the base cuts a solid at the ratio $k$ of the height. The volumes have the ratio ..."
        back: "$k^3$"
        type: basic
