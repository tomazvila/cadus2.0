    knowledge_points:
      - id: kp1
        name: 'Complete a partially written two-column proof'
        key_prerequisites: [postulates-theorems-justifications]
        exemplars:
          - problem: 'A two-column proof reads. Statements: 1. $\angle ABC$ is a right angle; 2. $m\angle ABC = 90^\circ$. Reasons: 1. Given; 2. (blank). Which reason completes step 2?'
            answer_contract: {"kind":"label","options":[["definition of right angle","the definition of right angle","definition of a right angle","definition of an right angle","by the definition of right angle","right angle","right angle definition"],["definition of complementary angles","the definition of complementary angles","definition of a complementary angles","definition of an complementary angles","by the definition of complementary angles","complementary angles","complementary angles definition"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"],["linear pair postulate","the linear pair postulate","by the linear pair postulate","linear pair"]]}
            answer: 'definition of right angle'
            solution_sketch: 'Step 2 states the measure of a right angle. A right angle is defined as an angle that measures $90^\circ$, so the reason is the definition of right angle.'
          - problem: 'A two-column proof reads. Statements: 1. $\angle 1$ and $\angle 2$ form a linear pair, and $m\angle 2 = 117^\circ$; 2. $m\angle 1 + m\angle 2 = 180^\circ$; 3. $m\angle 1 + 117^\circ = 180^\circ$; 4. $m\angle 1 = $ (blank). Reasons: 1. Given; 2. Linear pair postulate; 3. Substitution property; 4. Subtraction property of equality. What measure completes statement 4, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '63'
            solution_sketch: 'Statement 3 is $m\angle 1 + 117 = 180$. The subtraction property of equality subtracts $117$ from both sides, so $m\angle 1 = 180 - 117 = 63$ degrees.'
          - problem: 'A two-column proof reads. Statements: 1. Ray $\overrightarrow{BD}$ bisects $\angle ABC$; 2. $\angle ABD \cong \angle DBC$. Reasons: 1. Given; 2. (blank). Which reason completes step 2?'
            answer_contract: {"kind":"label","options":[["definition of angle bisector","the definition of angle bisector","angle bisector definition","definition of a angle bisector","definition of an angle bisector","by the definition of angle bisector","angle bisector"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"],["definition of supplementary angles","the definition of supplementary angles","definition of a supplementary angles","definition of an supplementary angles","by the definition of supplementary angles","supplementary angles","supplementary angles definition"],["reflexive property","the reflexive property","by the reflexive property","reflexive"]]}
            answer: 'definition of angle bisector'
            solution_sketch: 'Step 2 says the two angles formed by the ray are congruent. An angle bisector is defined as a ray that splits an angle into two congruent angles, so the reason is the definition of angle bisector.'
          - problem: 'A surveyor writes a two-column proof about a boundary $\overline{AB}$. Statements: 1. $M$ is the midpoint of $\overline{AB}$, with $AM = (3x + 4)$ m and $MB = (5x - 12)$ m; 2. $AM = MB$; 3. $3x + 4 = 5x - 12$; 4. $x = 8$; 5. $AB = $ (blank). Reasons: 1. Given; 2. Definition of midpoint; 3. Substitution; 4. Properties of equality; 5. Segment addition postulate and substitution. What length completes statement 5, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '56'
            solution_sketch: 'Statement 4 gives $x = 8$, so $AM = 3(8) + 4 = 28$ m and $MB = 5(8) - 12 = 28$ m. The segment addition postulate gives $AB = AM + MB = 28 + 28 = 56$ m.'
          - problem: 'A two-column proof reads. Statements: 3. $m\angle 1 + m\angle 2 = m\angle 2 + m\angle 3$; 4. $m\angle 1 = m\angle 3$. Reasons: 3. Substitution property; 4. (blank). Which reason completes step 4?'
            answer_contract: {"kind":"label","options":[["subtraction property of equality","the subtraction property of equality","subtraction property","by the subtraction property of equality","subtraction"],["addition property of equality","the addition property of equality","addition property","by the addition property of equality","addition"],["substitution property of equality","the substitution property of equality","by the substitution property of equality","substitution","substitution property"],["reflexive property","the reflexive property","by the reflexive property","reflexive"]]}
            answer: 'subtraction property of equality'
            solution_sketch: 'Step 4 comes from step 3 by taking away the same quantity, $m\angle 2$, from both sides. Taking the same amount from both sides is the subtraction property of equality.'
          - problem: 'A door is hinged at $O$ and swings from the closed position along $\overrightarrow{OA}$ to the fully open position along $\overrightarrow{OC}$, with a stop along $\overrightarrow{OB}$ inside the angle. A two-column proof reads. Statements: 1. $m\angle AOC = 110^\circ$ and $m\angle AOB = 45^\circ$; 2. $m\angle AOB + m\angle BOC = m\angle AOC$; 3. $45^\circ + m\angle BOC = 110^\circ$; 4. $m\angle BOC = $ (blank). Reasons: 1. Given; 2. Angle addition postulate; 3. Substitution property; 4. Subtraction property of equality. What measure completes statement 4, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'Statement 3 is $45 + m\angle BOC = 110$. Subtracting $45$ from both sides gives $m\angle BOC = 110 - 45 = 65$ degrees.'
          - problem: 'A two-column proof reads. Statements: 1. $\angle 1$ and $\angle 2$ are complementary, and $m\angle 1 = 52^\circ$; 2. $m\angle 1 + m\angle 2 = 90^\circ$; 3. $52^\circ + m\angle 2 = 90^\circ$; 4. $m\angle 2 = $ (blank). Reasons: 1. Given; 2. Definition of complementary angles; 3. Substitution property; 4. Subtraction property of equality. What measure completes statement 4, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '38'
            solution_sketch: 'Subtract $52^\circ$ from both sides of $52^\circ + m\angle 2 = 90^\circ$. Then $m\angle 2 = 90^\circ - 52^\circ = 38^\circ$.'
          - problem: 'Write the full proof that $m\angle 1 = m\angle 3$, given that $\angle 1$ and $\angle 2$ form a linear pair and that $\angle 2$ and $\angle 3$ form a linear pair.'
            answer_contract: {"kind":"none"}
            answer: 'm angle 1 = m angle 3'
            solution_sketch: '1. $\angle 1$ and $\angle 2$ form a linear pair; $\angle 2$ and $\angle 3$ form a linear pair (given). 2. $m\angle 1 + m\angle 2 = 180^\circ$ and $m\angle 2 + m\angle 3 = 180^\circ$ (linear pair postulate). 3. $m\angle 1 + m\angle 2 = m\angle 2 + m\angle 3$ (substitution property, both sums equal $180^\circ$). 4. $m\angle 1 = m\angle 3$ (subtraction property of equality).'
        constraints: '3-5 line proofs about segments and angles; a blank is a reason chosen from named definitions, postulates and properties, or a measure that the next step produces; the last exemplar is a full written proof; reasons limited to given, definitions, addition postulates, linear pair postulate, properties of equality'
      - id: kp2
        name: 'Justify the steps of a short two-column proof'
        key_prerequisites: [postulates-theorems-justifications]
        exemplars:
          - problem: 'A two-column proof that $\angle 1 \cong \angle 3$ reads. Statements: 1. $\angle 1$ and $\angle 2$ are supplementary; $\angle 2$ and $\angle 3$ are supplementary; 2. $m\angle 1 + m\angle 2 = 180^\circ$ and $m\angle 2 + m\angle 3 = 180^\circ$. Reasons: 1. Given; 2. (blank). Which reason completes step 2?'
            answer_contract: {"kind":"label","options":[["definition of supplementary angles","the definition of supplementary angles","supplementary angles definition","definition of a supplementary angles","definition of an supplementary angles","by the definition of supplementary angles","supplementary angles"],["linear pair postulate","the linear pair postulate","by the linear pair postulate","linear pair"],["vertical angles theorem","the vertical angles theorem","by the vertical angles theorem","vertical angles"],["definition of a linear pair of angles","the definition of a linear pair of angles","definition of an linear pair of angles","by the definition of linear pair of angles","linear pair of angles","linear pair of angles definition"]]}
            answer: 'definition of supplementary angles'
            solution_sketch: 'Step 1 only says that the angles are supplementary, with no figure that shows a linear pair. Supplementary angles are defined as angles whose measures add up to $180^\circ$, so the reason is the definition of supplementary angles.'
          - problem: 'A two-column proof about complementary angles reads. Statements: 1. $\angle 1$ and $\angle 2$ are complementary, with $m\angle 1 = (4x)^\circ$ and $m\angle 2 = (x + 10)^\circ$; 2. $m\angle 1 + m\angle 2 = 90^\circ$; 3. $4x + x + 10 = 90$; 4. $x = 16$; 5. $m\angle 1 = $ (blank). Reasons: 1. Given; 2. Definition of complementary angles; 3. Substitution property; 4. Properties of equality; 5. Substitution property. What measure completes statement 5, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '64'
            solution_sketch: 'Statement 3 simplifies to $5x + 10 = 90$, so $x = 16$ as statement 4 says. Substituting into $m\angle 1 = 4x$ gives $4(16) = 64$ degrees, and $m\angle 2 = 16 + 10 = 26$ degrees completes $90^\circ$.'
          - problem: 'A road leaves a straight canal bank at $P$ and forms a linear pair, $\angle 1 = (2x + 20)^\circ$ and $\angle 2 = (x + 10)^\circ$. A two-column proof reads. Statements: 1. $\angle 1$ and $\angle 2$ form a linear pair; 2. $(2x + 20) + (x + 10) = 180$; 3. $3x + 30 = 180$; 4. $x = 50$; 5. $m\angle 1 = $ (blank). Reasons: 1. Given; 2. Linear pair postulate; 3. Simplifying; 4. Properties of equality; 5. Substitution property. What measure completes statement 5, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Statement 4 gives $x = 50$. Substituting into $m\angle 1 = 2x + 20$ gives $2(50) + 20 = 120$ degrees, and $m\angle 2 = 50 + 10 = 60$ degrees completes the linear pair.'
          - problem: 'A pipeline is laid in a straight line from $A$ through $B$ to $C$. A two-column proof reads. Statements: 1. $B$ lies between $A$ and $C$; 2. $AB + BC = AC$. Reasons: 1. Given; 2. (blank). Which reason completes step 2?'
            answer_contract: {"kind":"label","options":[["segment addition postulate","the segment addition postulate","by the segment addition postulate","segment addition"],["definition of midpoint","the definition of midpoint","definition of a midpoint","definition of an midpoint","by the definition of midpoint","midpoint","midpoint definition"],["substitution property","the substitution property","by the substitution property","substitution"],["addition property of equality","the addition property of equality","by the addition property of equality","addition","addition property"]]}
            answer: 'segment addition postulate'
            solution_sketch: 'Step 1 says that $B$ lies between $A$ and $C$, and step 2 adds the two parts to get the whole. The segment addition postulate states exactly this, and it does not need $B$ to be the midpoint.'
          - problem: 'A two-column proof reads. Statements: 1. $\angle 1 \cong \angle 2$, with $m\angle 1 = (5x + 3)^\circ$ and $m\angle 2 = (7x - 9)^\circ$; 2. $m\angle 1 = m\angle 2$; 3. $5x + 3 = 7x - 9$; 4. $x = 6$; 5. $m\angle 2 = $ (blank). Reasons: 1. Given; 2. Definition of congruent angles; 3. Substitution property; 4. Properties of equality; 5. Substitution property. What measure completes statement 5, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '33'
            solution_sketch: 'Statement 3 gives $12 = 2x$, so $x = 6$. Substituting into $m\angle 2 = 7x - 9$ gives $7(6) - 9 = 33$ degrees, and $m\angle 1 = 5(6) + 3 = 33$ degrees agrees.'
          - problem: 'A two-column proof reads. Statements: 1. $\angle 1$ and $\angle 2$ are vertical angles; 2. $\angle 1 \cong \angle 2$. Reasons: 1. Given; 2. (blank). Which reason completes step 2?'
            answer_contract: {"kind":"label","options":[["vertical angles theorem","the vertical angles theorem","vertical angles are congruent","by the vertical angles theorem","vertical angles"],["linear pair postulate","the linear pair postulate","by the linear pair postulate","linear pair"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"],["definition of supplementary angles","the definition of supplementary angles","definition of a supplementary angles","definition of an supplementary angles","by the definition of supplementary angles","supplementary angles","supplementary angles definition"]]}
            answer: 'vertical angles theorem'
            solution_sketch: 'Step 1 gives two angles that are opposite each other at the crossing of two lines. The vertical angles theorem says that such angles are congruent, so it is the reason for step 2.'
          - problem: 'A pipeline is laid in a straight line from $A$ through $B$ to $C$. A two-column proof reads. Statements: 1. $B$ lies between $A$ and $C$, with $AB = 17.5$ m and $BC = 9.5$ m; 2. $AB + BC = AC$; 3. $17.5 + 9.5 = AC$; 4. $AC = $ (blank). Reasons: 1. Given; 2. Segment addition postulate; 3. Substitution property; 4. Simplifying. What length completes statement 4, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '27'
            solution_sketch: 'Add the two lengths in statement 3. Then $AC = 17.5 + 9.5 = 27$ m.'
          - problem: 'Write the full proof that $AC = 2 \cdot AB$, given that $B$ is the midpoint of $\overline{AC}$.'
            answer_contract: {"kind":"none"}
            answer: 'AC = 2 AB'
            solution_sketch: '1. $B$ is the midpoint of $\overline{AC}$ (given). 2. $AB = BC$ (definition of midpoint). 3. $AB + BC = AC$ (segment addition postulate). 4. $AB + AB = AC$ (substitution property, statements 2 and 3). 5. $AC = 2 \cdot AB$ (statement 4, since $AB + AB = 2 \cdot AB$).'
