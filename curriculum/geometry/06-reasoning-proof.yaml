      answer: 'linear pair postulate'
      answer_contract: {"kind":"label","options":[["linear pair postulate","the linear pair postulate","linear pair","by the linear pair postulate"],["definition of vertical angles","the definition of vertical angles","definition of a vertical angles","definition of an vertical angles","by the definition of vertical angles","vertical angles","vertical angles definition"],["vertical angles theorem","the vertical angles theorem","by the vertical angles theorem"],["substitution property","the substitution property","by the substitution property","substitution"]]}
      solution_sketch: 'Step 2 says that each linear pair has measures that add up to $180^\circ$. The linear pair postulate states exactly this, so it is the reason for step 2.'
