unit: reasoning-proof
course: geometry
module: "Reasoning & Proof"
topics:
  - id: geometric-reasoning
    name: Inductive and Deductive Reasoning in Geometry
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: angle-relationships
        weight: 0.5
        key: true
      - id: triangle-angle-sum
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Conjectures from examples and counterexamples'
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A student measures the angles of three triangles drawn on paper and finds that the angles of each triangle add up to $180^\circ$. From this she concludes that the angles of every triangle add up to $180^\circ$. Is her reasoning inductive or deductive?'
            answer_contract: {"kind":"label","options":[["inductive","inductive reasoning","it is inductive","inductive logic"],["deductive reasoning","deductive","it is deductive","deductive logic"]]}
            answer: 'inductive reasoning'
            solution_sketch: 'She generalizes from three observed cases to every triangle. A conclusion drawn from examples, not from accepted facts, is inductive reasoning, and three measurements do not prove it.'
          - problem: 'The conjecture is: the sum of two acute angles is always acute. Angle $P$ measures $62^\circ$. What is the smallest whole-number measure of an acute angle $Q$ for which the pair $P$ and $Q$ is a counterexample?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '28'
            solution_sketch: 'A counterexample needs two acute angles whose sum is not acute, so the sum must be at least $90^\circ$. Then $62 + Q \ge 90$ gives $Q \ge 28$, and $28^\circ$ is acute, so $Q = 28$ with the sum exactly $90^\circ$.'
          - problem: 'A landscaper checks one crossing of two straight garden paths and finds that all four angles are $90^\circ$. She conjectures that the four angles at every crossing of two paths are equal. At another crossing one angle measures $70^\circ$. What is the measure of the angle next to it along the same path?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'Angles that form a straight line add up to $180^\circ$, so the neighbor of the $70^\circ$ angle measures $180 - 70 = 110$ degrees. Since $110 \ne 70$, the four angles are not equal at this crossing, so the conjecture is false.'
          - problem: 'A student conjectures that the hypotenuse of every right triangle is longer than each of its legs. She draws a right triangle with legs of $5$ cm and $12$ cm. Is this triangle a counterexample to her conjecture?'
            answer_contract: {"kind":"label","options":[["no","no, it is not a counterexample","it is not a counterexample","not a counterexample"],["yes","yes, it is a counterexample","it is a counterexample","counterexample"]]}
            answer: 'no'
            solution_sketch: 'The triangle is a right triangle, so the hypothesis holds. Its hypotenuse is $\sqrt{5^2 + 12^2} = 13$ cm, which is longer than both legs, so the conclusion holds too and the triangle supports the conjecture instead of refuting it.'
          - problem: 'A drafter knows that the angles of every triangle add up to $180^\circ$. A triangular roof plate has one angle of $90^\circ$ and another of $35^\circ$, so she concludes that the third angle is $55^\circ$. Is her reasoning inductive or deductive?'
            answer_contract: {"kind":"label","options":[["deductive","deductive reasoning","it is deductive","deductive logic"],["inductive reasoning","inductive","it is inductive","inductive logic"]]}
            answer: 'deductive reasoning'
            solution_sketch: 'She applies a fact that is already accepted, the angle sum of a triangle, to one particular plate. A conclusion that follows from accepted facts is deductive reasoning, and the third angle is $180 - 90 - 35 = 55$ degrees.'
          - problem: 'A fence builder conjectures that a triangular pen made with $30$ m of fencing always has all three sides shorter than $12$ m. She looks for a counterexample with sides of $13$ m and $9$ m along two walls. How long, in metres, must the third side be if she uses all the fencing?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The third side is $30 - 13 - 9 = 8$ m, and a triangle with sides $13$, $9$ and $8$ exists because $13 < 9 + 8$. The side of $13$ m is not shorter than $12$ m, so this pen is a counterexample.'
          - problem: 'A student notices that $n^2 + n + 41$ is prime for $n = 1, 2, 3, 4, 5$ and conjectures that it is prime for every positive integer $n$. What is the smallest positive integer $n$ that is a counterexample?'
            answer_contract: {"kind":"exact"}
            answer: '40'
            solution_sketch: 'Testing $n = 1, 2, \dots, 39$ gives a prime every time. For $n = 40$ the value is $1600 + 40 + 41 = 1681 = 41^2$, which is not prime, so $n = 40$ is the smallest counterexample.'
          - problem: 'Write the full proof that the conjecture "the sum of two acute angles is always an acute angle" is false.'
            answer_contract: {"kind":"none"}
            answer: '70 and 80 degrees: sum is 150'
            solution_sketch: 'A conjecture is false when one case meets its hypothesis and breaks its conclusion. 1. Take $\angle P$ with $m\angle P = 70^\circ$ and $\angle Q$ with $m\angle Q = 80^\circ$. 2. Each measure is less than $90^\circ$, so both angles are acute and the hypothesis holds. 3. The sum is $70 + 80 = 150$ degrees, which is greater than $90^\circ$, so the sum is obtuse and not acute. 4. The pair meets the hypothesis and breaks the conclusion, so it is a counterexample and the conjecture is false.'
        constraints: 'concrete geometric conjectures about angles, segments, or triangles; a counterexample must satisfy the hypothesis and violate the conclusion; the last exemplar is a written counterexample proof; no symbolic logic'
      - id: kp2
        name: 'Hypothesis and conclusion of an if-then statement'
        key_prerequisites: []
        exemplars:
          - problem: 'What is the hypothesis of the statement "All right angles are congruent"?'
            answer_contract: {"kind":"label","options":[["two angles are right angles","the angles are right angles","they are right angles","right angles"],["two angles are congruent","the angles are congruent","they are congruent","congruent angles"],["two angles are complementary","the angles are complementary","they are complementary","complementary angles"],["two angles are vertical angles","the angles are vertical angles","they are vertical angles","vertical angles"]]}
            answer: 'two angles are right angles'
            solution_sketch: 'In if-then form the statement reads: if two angles are right angles, then they are congruent. The hypothesis is the part after "if", so it is that two angles are right angles.'
          - problem: 'The statement "If two angles form a linear pair, then their measures add up to $180^\circ$" is true. Angles $\angle 1$ and $\angle 2$ form a linear pair, with $m\angle 1 = (2x + 10)^\circ$ and $m\angle 2 = (3x - 5)^\circ$. What is $x$?'
            answer_contract: {"kind":"exact"}
            answer: '35'
            solution_sketch: 'The hypothesis holds, so the conclusion gives $(2x + 10) + (3x - 5) = 180$. This simplifies to $5x + 5 = 180$, so $x = 35$, and the angles measure $80^\circ$ and $100^\circ$.'
          - problem: 'A carpenter uses the rule "If a quadrilateral is a rectangle, then its diagonals are congruent" to check a rectangular shed door frame. One diagonal measures $2.6$ m. How long is the other diagonal, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '2.6'
            solution_sketch: 'The frame is a rectangle, so the hypothesis is met. The conclusion then says that the diagonals are congruent, so the other diagonal also measures $2.6$ m.'
          - problem: 'What is the conclusion of the statement "If $M$ is the midpoint of $\overline{AB}$, then $AM = MB$"?'
            answer_contract: {"kind":"label","options":[["AM equals MB","AM = MB","AM and MB have equal lengths","AM and MB are equal","AM is congruent to MB"],["M is the midpoint of AB","M is the midpoint of segment AB"],["M lies between A and B","M is between A and B"],["AM is longer than MB","AM is greater than MB"]]}
            answer: 'AM = MB'
            solution_sketch: 'The conclusion is the part after "then", which is $AM = MB$. The part "$M$ is the midpoint of $\overline{AB}$" is the hypothesis, and it is the given fact.'
          - problem: 'The statement "If two angles are vertical angles, then they are congruent" is true. Two intersecting lines form vertical angles $\angle 1$ and $\angle 3$ with $m\angle 1 = (4x - 12)^\circ$ and $m\angle 3 = (x + 21)^\circ$. What is $m\angle 1$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '32'
            solution_sketch: 'The angles are vertical, so they are congruent and $4x - 12 = x + 21$. This gives $3x = 33$ and $x = 11$, so $m\angle 1 = 4(11) - 12 = 32$ degrees, and $m\angle 3 = 11 + 21 = 32$ degrees agrees.'
          - problem: 'A diagonal brace splits the $90^\circ$ corner of a shelf into two angles, and one of them measures $37^\circ$. By the rule "If two angles are complementary, then their measures add up to $90^\circ$", what is the measure of the other angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '53'
            solution_sketch: 'The two angles are complementary, so their measures add up to $90^\circ$. The other angle measures $90 - 37 = 53$ degrees.'
          - problem: 'Write the full proof that all right angles are congruent. Start by writing the statement in if-then form.'
            answer_contract: {"kind":"none"}
            answer: 'Both measure 90, so they are congruent'
            solution_sketch: 'If-then form: if two angles are right angles, then they are congruent. Given: $\angle A$ and $\angle B$ are right angles. Prove: $\angle A \cong \angle B$. 1. $m\angle A = 90^\circ$ (definition of a right angle). 2. $m\angle B = 90^\circ$ (definition of a right angle). 3. $m\angle A = m\angle B$ (both equal $90^\circ$, substitution). 4. $\angle A \cong \angle B$ (definition of congruent angles).'
        constraints: 'statements about angles, segments, triangles, or parallel lines; ask for the hypothesis or the conclusion of a statement and use the statement on given measures; the last exemplar is a written proof of a statement given in if-then form'
      - id: kp3
        name: 'Converses and deduction with geometric statements'
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Is the converse of "If two angles are vertical angles, then they are congruent" true?'
            answer_contract: {"kind":"label","options":[["no","no, it is false","it is false","false","not true"],["yes","yes, it is true","it is true","true"]]}
            answer: 'no'
            solution_sketch: 'The converse reads: if two angles are congruent, then they are vertical angles. It is false: the two $40^\circ$ base angles of an isosceles triangle are congruent, but they are not vertical angles.'
          - problem: 'The statement "If a ray bisects an angle, then it divides the angle into two congruent angles" is true. Ray $\overrightarrow{BD}$ bisects $\angle ABC$, with $m\angle ABD = (3x + 4)^\circ$ and $m\angle DBC = (5x - 16)^\circ$. What is $m\angle ABC$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '68'
            solution_sketch: 'The ray is a bisector, so the two angles are congruent and $3x + 4 = 5x - 16$. This gives $x = 10$, so each part measures $34^\circ$ and $m\angle ABC = 34 + 34 = 68$ degrees.'
          - problem: 'A side road meets a straight highway and forms two angles that make a linear pair, because the statement "If two angles form a linear pair, then they are supplementary" is true. The angles measure $(4x + 14)^\circ$ and $(2x + 16)^\circ$. What is the measure of the smaller angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The angles are supplementary, so $(4x + 14) + (2x + 16) = 180$ and $6x + 30 = 180$, which gives $x = 25$. The angles measure $4(25) + 14 = 114$ degrees and $2(25) + 16 = 66$ degrees, so the smaller one is $66$ degrees.'
          - problem: 'Is the converse of "If two segments have equal lengths, then they are congruent" true?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is true","it is true","true"],["no","no, it is false","it is false","false","not true"]]}
            answer: 'yes'
            solution_sketch: 'The converse reads: if two segments are congruent, then they have equal lengths. This is true, because congruent segments are defined as segments of equal length.'
          - problem: 'The statement "If a point is the midpoint of a segment, then it is equally far from the two endpoints" is true. Point $M$ is the midpoint of $\overline{AB}$, with $AM = 3x + 2$ and $MB = 5x - 10$. How long is $\overline{AB}$?'
            answer_contract: {"kind":"exact"}
            answer: '40'
            solution_sketch: 'The midpoint is equally far from both endpoints, so $3x + 2 = 5x - 10$ and $x = 6$. Then $AM = MB = 20$, and $AB = 20 + 20 = 40$.'
          - problem: 'Two braces on a fence make angles $\angle P$ and $\angle Q$. Each of them is supplementary to the $75^\circ$ angle $\angle R$ at a post. By the statement "If two angles are supplementary to the same angle, then they are congruent", what is the measure of $\angle Q$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '105'
            solution_sketch: 'The angle $\angle Q$ is supplementary to $\angle R$, so $m\angle Q = 180 - 75 = 105$ degrees. The angle $\angle P$ is also supplementary to $\angle R$, so it measures $105^\circ$ too, and the two braces are congruent.'
          - problem: 'Write the full proof that the converse of "If two angles are vertical angles, then they are congruent" is false.'
            answer_contract: {"kind":"none"}
            answer: 'Two 40 degree angles, not vertical'
            solution_sketch: 'The converse reads: if two angles are congruent, then they are vertical angles. A statement is false if one case meets its hypothesis and breaks its conclusion. 1. Draw isosceles triangle $ABC$ with base angles $m\angle B = m\angle C = 40^\circ$. 2. Then $\angle B \cong \angle C$, so the hypothesis holds. 3. Vertical angles are the opposite angles formed by two intersecting lines and share one vertex, but $\angle B$ and $\angle C$ have different vertices, so they are not vertical angles. 4. The conclusion fails, so this pair is a counterexample and the converse is false.'
        constraints: 'converse formed by swapping hypothesis and conclusion; a false converse needs a counterexample; deductions use stated geometric facts only, often with measures given as expressions; the last exemplar is a written counterexample proof; no truth tables'
    diagnostic_exemplar:
      problem: 'Write the converse of "if two angles are vertical angles, then they are congruent", state whether the converse is true, and give a counterexample if it is false.'
      answer: 'Converse: if two angles are congruent, then they are vertical angles. It is false: two $40^\circ$ base angles of an isosceles triangle are congruent but not vertical.'
      answer_contract: {kind: none}
      solution_sketch: 'Swap hypothesis and conclusion; then exhibit congruent angles that do not form a vertical pair.'
    anki_seeds:
      - front: "A single example showing a conjecture false is called a..."
        back: "counterexample"
        type: basic
      - front: "Generalizing from observed examples is ... reasoning; concluding from accepted facts by logical steps is ... reasoning"
        back: "inductive; deductive"
        type: basic

  - id: postulates-theorems-justifications
    name: Postulates, Theorems, and Justifications
    core: true
    difficulty: 0.34
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: geometric-reasoning
        weight: 0.7
        key: true
      - id: segment-angle-addition
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Definitions, postulates, and theorems'
        key_prerequisites: []
        exemplars:
          - problem: 'Is the statement "Through any two distinct points there is exactly one line" a definition, a postulate, or a theorem?'
            answer_contract: {"kind":"label","options":[["postulate","it is a postulate","axiom","an assumption"],["definition","it is a definition"],["theorem","it is a theorem"],["conjecture","it is a conjecture"]]}
            answer: 'postulate'
            solution_sketch: 'The statement is not the meaning of a term, so it is not a definition. Nothing earlier proves it: it is accepted as true without proof, so it is a postulate.'
          - problem: 'A surveyor places a stake $M$ on the boundary segment $\overline{AB}$ so that $M$ is the midpoint of the segment, which is defined as the point that splits the segment into two segments of equal length. Here $AM = (4x + 3)$ m and $MB = (6x - 9)$ m. How long is the boundary $\overline{AB}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '54'
            solution_sketch: 'The definition of midpoint gives $AM = MB$, so $4x + 3 = 6x - 9$ and $x = 6$. Then $AM = 27$ m and $MB = 27$ m, so the boundary is $AB = 27 + 27 = 54$ m.'
          - problem: 'A surveyor''s handbook states that the angles of a triangle add up to $180^\circ$, and it proves this from the parallel postulate. Is that statement a definition, a postulate, or a theorem?'
            answer_contract: {"kind":"label","options":[["theorem","it is a theorem","a proved statement"],["definition","it is a definition"],["postulate","it is a postulate","axiom"],["conjecture","it is a conjecture"]]}
            answer: 'theorem'
            solution_sketch: 'The statement is proved from a postulate and earlier results, so it is not accepted without proof. A statement that is proved from other statements is a theorem.'
          - problem: 'The statement "If two angles are supplementary to the same angle, then they are congruent" is a theorem. Angles $\angle PQR$ and $\angle STU$ are both supplementary to $\angle XYZ$, and $m\angle XYZ = 106^\circ$. What is $m\angle STU$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '74'
            solution_sketch: 'Each of the two angles is supplementary to $\angle XYZ$, so each measures $180 - 106 = 74$ degrees. The theorem agrees: $\angle PQR \cong \angle STU$, so $m\angle STU = 74$.'
          - problem: 'A roof truss has an apex angle of $78^\circ$. A vertical post bisects the apex angle, and a bisector is defined as the ray that splits an angle into two congruent angles. What angle does each rafter make with the post, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '39'
            solution_sketch: 'By the definition of angle bisector, the post splits the apex angle into two congruent angles. Each of them measures $78 / 2 = 39$ degrees.'
          - problem: 'Is the statement "A right angle is an angle that measures $90^\circ$" a definition, a postulate, or a theorem?'
            answer_contract: {"kind":"label","options":[["definition","it is a definition"],["postulate","it is a postulate","axiom"],["theorem","it is a theorem"],["a conjecture","conjecture","it is a conjecture"]]}
            answer: 'definition'
            solution_sketch: 'The statement tells what the term "right angle" means, and it reads the same in both directions. A statement that gives the meaning of a term is a definition.'
          - problem: 'In a roof frame, the ray $\overrightarrow{BD}$ bisects $\angle ABC$, which is defined as splitting the angle into two congruent angles. Here $m\angle ABD = (4x + 6)^\circ$ and $m\angle DBC = (6x - 14)^\circ$. How large is $\angle ABC$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '92'
            solution_sketch: 'The definition of an angle bisector gives $4x + 6 = 6x - 14$, so $x = 10$. Each part measures $46^\circ$, so $m\angle ABC = 2 \cdot 46 = 92^\circ$.'
          - problem: 'Write the full proof that if two angles are supplementary to the same angle, then they are congruent. Let $\angle 1$ and $\angle 3$ both be supplementary to $\angle 2$.'
            answer_contract: {"kind":"none"}
            answer: 'The angles have equal measures'
            solution_sketch: 'Given: $\angle 1$ and $\angle 2$ are supplementary, and $\angle 3$ and $\angle 2$ are supplementary. Prove: $\angle 1 \cong \angle 3$. 1. $m\angle 1 + m\angle 2 = 180^\circ$ and $m\angle 3 + m\angle 2 = 180^\circ$ (definition of supplementary angles). 2. $m\angle 1 + m\angle 2 = m\angle 3 + m\angle 2$ (substitution, both sums equal $180^\circ$). 3. $m\angle 1 = m\angle 3$ (subtraction property of equality). 4. $\angle 1 \cong \angle 3$ (definition of congruent angles). The statement is proved, so it is a theorem.'
        constraints: 'classify standard geometry statements as definition, postulate, or theorem; include one reversible definition (midpoint, bisector, right angle) per set; the last exemplar is a written proof that a statement is a theorem'
      - id: kp2
        name: 'Properties of equality and congruence as reasons'
        key_prerequisites: [segment-angle-addition]
        exemplars:
          - problem: 'In a proof, the statement $AB = XY$ is followed by the statement $XY = AB$. Which property of equality justifies the second statement?'
            answer_contract: {"kind":"label","options":[["symmetric property of equality","symmetric property","symmetric","by the symmetric property of equality","the symmetric property of equality"],["reflexive property of equality","reflexive property","reflexive","by the reflexive property of equality","the reflexive property of equality"],["transitive property of equality","transitive property","transitive","by the transitive property of equality","the transitive property of equality"],["substitution property of equality","substitution property","substitution","by the substitution property of equality","the substitution property of equality"]]}
            answer: 'symmetric property of equality'
            solution_sketch: 'The second statement is the first one with its two sides swapped. Swapping the two sides of an equation is allowed by the symmetric property of equality.'
          - problem: 'A proof states that $m\angle 1 + m\angle 2 = 150^\circ$ and that $m\angle 2 = 2(m\angle 1) - 30^\circ$. After the substitution property replaces $m\angle 2$ in the first statement, what is $m\angle 1$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Substituting gives $m\angle 1 + 2(m\angle 1) - 30 = 150$, which is $3(m\angle 1) = 180$. So $m\angle 1 = 60$ degrees, and then $m\angle 2 = 2(60) - 30 = 90$ degrees.'
          - problem: 'Posts $A$, $B$ and $C$ stand on a straight fence line with $B$ between $A$ and $C$. A surveyor writes $AC = AB + BC$ and measures $AB = 12.5$ m and $BC = 8.5$ m. By the substitution property, how long is the fence section $\overline{AC}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The segment addition postulate gives $AC = AB + BC$. Substituting the measured lengths gives $AC = 12.5 + 8.5 = 21$ m.'
          - problem: 'A step of a proof changes $AB + BC = AC$ into $AB + 7 = AC$ because $BC = 7$ is known. Which property justifies the change?'
            answer_contract: {"kind":"label","options":[["substitution property","substitution property of equality","substitution","by the substitution property","the substitution property"],["addition property of equality","addition property","addition","by the addition property of equality","the addition property of equality"],["subtraction property of equality","subtraction property","subtraction","by the subtraction property of equality","the subtraction property of equality"],["transitive property of equality","transitive property","transitive","by the transitive property of equality","the transitive property of equality"]]}
            answer: 'substitution property of equality'
            solution_sketch: 'The quantity $BC$ is replaced by the number $7$ that is known to be equal to it. Replacing a quantity with an equal quantity is the substitution property of equality.'
          - problem: 'Three braces of a bridge truss meet the deck at angles $\angle X$, $\angle Y$ and $\angle Z$. Here $\angle X \cong \angle Y$ and $\angle Y \cong \angle Z$, and $m\angle X = (3x - 7)^\circ$ while $m\angle Z = (2x + 5)^\circ$. What is $m\angle Y$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '29'
            solution_sketch: 'The transitive property gives $\angle X \cong \angle Z$, so $3x - 7 = 2x + 5$ and $x = 12$. Then $m\angle X = 3(12) - 7 = 29$ and $m\angle Z = 2(12) + 5 = 29$, so $m\angle Y = 29$ degrees.'
          - problem: 'A proof about $\angle P$ contains the statement $\angle P \cong \angle P$ with no earlier statement to support it. Which property justifies it?'
            answer_contract: {"kind":"label","options":[["reflexive property of congruence","reflexive property","reflexive","by the reflexive property of congruence","the reflexive property of congruence"],["symmetric property of congruence","symmetric property","symmetric","by the symmetric property of congruence","the symmetric property of congruence"],["transitive property of congruence","transitive property","transitive","by the transitive property of congruence","the transitive property of congruence"],["definition of congruent angles","definition of congruence","definition of a congruent angles","definition of an congruent angles","by the definition of congruent angles","congruent angles","congruent angles definition"]]}
            answer: 'reflexive property of congruence'
            solution_sketch: 'Every angle is congruent to itself, and this needs no earlier statement. That fact is the reflexive property of congruence.'
          - problem: 'In a proof about a rod $\overline{AB}$, a step states $\frac{1}{3}AB = 7$ cm. The next step, $AB = \,?$, follows from the multiplication property of equality. What length completes that step, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The multiplication property of equality allows both sides to be multiplied by $3$. Then $3 \cdot \frac{1}{3}AB = 3 \cdot 7$, so $AB = 21$ cm.'
          - problem: 'Write the full proof of this statement. Points $A$, $B$, $C$ and $D$ lie on a line, with $B$ between $A$ and $C$ and $C$ between $B$ and $D$. Given $AB = CD$, prove that $AC = BD$.'
            answer_contract: {"kind":"none"}
            answer: 'AC = BD'
            solution_sketch: '1. $AB = CD$ (given). 2. $BC = BC$ (reflexive property of equality). 3. $AB + BC = CD + BC$ (addition property of equality, statements 1 and 2). 4. $AB + BC = AC$ and $BC + CD = BD$ (segment addition postulate). 5. $AC = BD$ (substitution property, statements 3 and 4, with $CD + BC = BC + CD$).'
        constraints: 'reasons drawn from reflexive, symmetric, transitive, substitution, and addition/subtraction properties; a numeric item may need one or two algebraic steps; the last exemplar is a written proof that uses these properties'
      - id: kp3
        name: 'Choose the justification for a geometric step'
        key_prerequisites: [segment-angle-addition, angle-relationships]
        exemplars:
          - problem: 'Point $M$ is the midpoint of $\overline{AB}$. Which reason justifies the statement $AM = MB$?'
            answer_contract: {"kind":"label","options":[["definition of midpoint","the definition of midpoint","midpoint definition","definition of a midpoint","definition of an midpoint","by the definition of midpoint","midpoint"],["segment addition postulate","the segment addition postulate","by the segment addition postulate","segment addition"],["reflexive property","the reflexive property","by the reflexive property","reflexive"],["vertical angles theorem","the vertical angles theorem","by the vertical angles theorem","vertical angles"]]}
            answer: 'definition of midpoint'
            solution_sketch: 'A midpoint is defined as the point that splits a segment into two segments of equal length. So $AM = MB$ follows directly from the definition of midpoint.'
          - problem: 'Ray $\overrightarrow{OB}$ lies inside $\angle AOC$, with $m\angle AOB = (2x + 5)^\circ$, $m\angle BOC = (3x + 10)^\circ$ and $m\angle AOC = 85^\circ$. Which value of $x$ follows from the angle addition postulate?'
            answer_contract: {"kind":"exact"}
            answer: '14'
            solution_sketch: 'The angle addition postulate gives $m\angle AOB + m\angle BOC = m\angle AOC$, so $(2x + 5) + (3x + 10) = 85$. This simplifies to $5x + 15 = 85$, so $x = 14$.'
          - problem: 'A support strut meets a straight beam and forms a linear pair of angles, $(7x - 4)^\circ$ and $(3x + 14)^\circ$. By the linear pair postulate, how large is the larger of the two angles, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '115'
            solution_sketch: 'The linear pair postulate says the two angles add up to $180^\circ$, so $(7x - 4) + (3x + 14) = 180$ and $10x + 10 = 180$. Then $x = 17$, and the angles measure $7(17) - 4 = 115$ degrees and $3(17) + 14 = 65$ degrees, so the larger one is $115$ degrees.'
          - problem: 'Two straight roads cross at a junction. Which reason justifies the statement that the two angles opposite each other at the crossing are congruent?'
            answer_contract: {"kind":"label","options":[["vertical angles theorem","the vertical angles theorem","vertical angles are congruent","by the vertical angles theorem","vertical angles"],["linear pair postulate","the linear pair postulate","by the linear pair postulate","linear pair"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"],["definition of midpoint","the definition of midpoint","definition of a midpoint","definition of an midpoint","by the definition of midpoint","midpoint","midpoint definition"]]}
            answer: 'vertical angles theorem'
            solution_sketch: 'Angles that are opposite each other at the crossing of two lines are vertical angles. The vertical angles theorem says that vertical angles are congruent.'
          - problem: 'A water pipe runs from $A$ through $B$ to $C$ in a straight line, with $AB = (3x - 1)$ m, $BC = (2x + 6)$ m and $AC = 40$ m. By the segment addition postulate, how long is the section $\overline{AB}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The segment addition postulate gives $AB + BC = AC$, so $(3x - 1) + (2x + 6) = 40$ and $5x + 5 = 40$. Then $x = 7$, and $AB = 3(7) - 1 = 20$ m.'
          - problem: 'In a proof, ray $\overrightarrow{BD}$ bisects $\angle ABC$. Which reason justifies the statement $\angle ABD \cong \angle DBC$?'
            answer_contract: {"kind":"label","options":[["definition of angle bisector","the definition of angle bisector","angle bisector definition","definition of a angle bisector","definition of an angle bisector","by the definition of angle bisector","angle bisector"],["linear pair postulate","the linear pair postulate","by the linear pair postulate","linear pair"],["definition of complementary angles","the definition of complementary angles","definition of a complementary angles","definition of an complementary angles","by the definition of complementary angles","complementary angles","complementary angles definition"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"]]}
            answer: 'definition of angle bisector'
            solution_sketch: 'An angle bisector is defined as a ray that splits an angle into two congruent angles. So $\angle ABD \cong \angle DBC$ follows from the definition of angle bisector.'
          - problem: 'Two straight roads cross at a junction. One angle measures $(5x + 8)^\circ$ and the angle opposite it measures $(7x - 12)^\circ$. By the vertical angles theorem, how large is each of these angles, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '58'
            solution_sketch: 'Vertical angles are congruent, so $5x + 8 = 7x - 12$ and $x = 10$. Each angle measures $5(10) + 8 = 58^\circ$.'
          - problem: 'Write the full proof of the vertical angles theorem. Lines $m$ and $n$ cross at a point, and $\angle 1$ and $\angle 3$ are opposite each other, with $\angle 2$ between them on one side.'
            answer_contract: {"kind":"none"}
            answer: 'Vertical angles are congruent'
            solution_sketch: 'Given: lines $m$ and $n$ intersect, forming vertical angles $\angle 1$ and $\angle 3$, and $\angle 2$ lies between them on one side. Prove: $\angle 1 \cong \angle 3$. 1. $\angle 1$ and $\angle 2$ form a linear pair, and $\angle 2$ and $\angle 3$ form a linear pair (definition of a linear pair). 2. $m\angle 1 + m\angle 2 = 180^\circ$ and $m\angle 2 + m\angle 3 = 180^\circ$ (linear pair postulate). 3. $m\angle 1 + m\angle 2 = m\angle 2 + m\angle 3$ (substitution property). 4. $m\angle 1 = m\angle 3$ (subtraction property of equality). 5. $\angle 1 \cong \angle 3$ (definition of congruent angles).'
        constraints: 'each item is one proof step needing one named reason or one value that the named postulate gives: definitions of midpoint/bisector/right angle, segment and angle addition postulates, linear pair postulate, vertical angles theorem; the last exemplar is a written proof'
    diagnostic_exemplar:
      problem: 'Give the reason that justifies each step: (1) $\overrightarrow{BD}$ bisects $\angle ABC$, so $\angle ABD \cong \angle DBC$; (2) $m\angle ABD = m\angle DBC$ and $m\angle DBC = 32^\circ$, so $m\angle ABD = 32^\circ$.'
      answer: '(1) Definition of angle bisector; (2) the transitive property of equality (or substitution).'
      answer_contract: {kind: none}
      solution_sketch: 'Step (1) is exactly what a bisector is defined to do; step (2) chains two equalities through the shared middle term $m\angle DBC$, which is the transitive property.'
    anki_seeds:
      - front: "A statement accepted without proof is a ...; a statement proved from accepted statements is a ..."
        back: "postulate (axiom); theorem"
        type: basic
      - front: "In a proof, AB = AB is justified by the ... property"
        back: "reflexive"
        type: basic

  - id: writing-geometric-proofs
