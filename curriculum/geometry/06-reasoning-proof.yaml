      - id: kp3
        name: 'Justify the reasoning in a paragraph proof'
        key_prerequisites: [postulates-theorems-justifications]
        exemplars:
          - problem: 'A paragraph proof states: "Since $\overrightarrow{BD}$ bisects $\angle ABC$, we know that $\angle ABD \cong \angle DBC$." Which definition supports that sentence?'
            answer_contract: {"kind":"label","options":[["definition of angle bisector","the definition of angle bisector","angle bisector definition","definition of a angle bisector","definition of an angle bisector","by the definition of angle bisector","angle bisector"],["definition of congruent angles","the definition of congruent angles","definition of a congruent angles","definition of an congruent angles","by the definition of congruent angles","congruent angles","congruent angles definition"],["angle addition postulate","the angle addition postulate","by the angle addition postulate","angle addition"],["definition of adjacent angles","the definition of adjacent angles","definition of a adjacent angles","definition of an adjacent angles","by the definition of adjacent angles","adjacent angles","adjacent angles definition"]]}
            answer: 'definition of angle bisector'
            solution_sketch: 'The sentence moves from a bisecting ray to two congruent angles. An angle bisector is defined as a ray that splits an angle into two congruent angles, so that definition supports the sentence.'
          - problem: 'A paragraph proof reads: "Ray $\overrightarrow{BD}$ bisects $\angle ABC$, so $m\angle ABD = m\angle DBC$. Here $m\angle ABD = (4x + 2)^\circ$ and $m\angle DBC = (6x - 10)^\circ$, so $x = 6$. By the angle addition postulate, $m\angle ABC = m\angle ABD + m\angle DBC$." What measure does the proof find for $\angle ABC$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '52'
            solution_sketch: 'The equation $4x + 2 = 6x - 10$ gives $x = 6$. Each part measures $4(6) + 2 = 26$ degrees, so the angle addition postulate gives $m\angle ABC = 26 + 26 = 52$ degrees.'
          - problem: 'A paragraph proof about a pipeline reads: "Point $B$ lies between $A$ and $C$, so $AB + BC = AC$ by the segment addition postulate. With $AB = (4x + 3)$ m, $BC = (3x - 1)$ m and $AC = 51$ m, we solve for $x$." How long is the section $\overline{AB}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '31'
            solution_sketch: 'The equation $(4x + 3) + (3x - 1) = 51$ gives $7x + 2 = 51$, so $x = 7$. Then $AB = 4(7) + 3 = 31$ m, and $BC = 3(7) - 1 = 20$ m completes the $51$ m.'
          - problem: 'A paragraph proof continues: "...and congruent angles have equal measures, so $m\angle ABD = m\angle DBC$." Which definition supports replacing the congruence of the angles with the equality of their measures?'
            answer_contract: {"kind":"label","options":[["definition of congruent angles","the definition of congruent angles","congruent angles definition","definition of a congruent angles","definition of an congruent angles","by the definition of congruent angles","congruent angles"],["substitution property","the substitution property","by the substitution property","substitution"],["definition of angle bisector","the definition of angle bisector","definition of a angle bisector","definition of an angle bisector","by the definition of angle bisector","angle bisector","angle bisector definition"],["definition of supplementary angles","the definition of supplementary angles","definition of a supplementary angles","definition of an supplementary angles","by the definition of supplementary angles","supplementary angles","supplementary angles definition"]]}
            answer: 'definition of congruent angles'
            solution_sketch: 'Two angles are congruent exactly when their measures are equal, so a congruence statement can be replaced by an equation of measures. This is the definition of congruent angles.'
          - problem: 'A paragraph proof reads: "Both $\angle 1$ and $\angle 3$ are supplementary to $\angle 2$, so $\angle 1 \cong \angle 3$ and their measures are equal." Here $m\angle 1 = (5x + 8)^\circ$ and $m\angle 3 = (8x - 25)^\circ$. What is $m\angle 1$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '63'
            solution_sketch: 'Equal measures give $5x + 8 = 8x - 25$, so $3x = 33$ and $x = 11$. Then $m\angle 1 = 5(11) + 8 = 63$ degrees, and $m\angle 3 = 8(11) - 25 = 63$ degrees agrees.'
          - problem: 'A paragraph proof about a ladder reads: "The ladder meets the straight ground and forms a linear pair of angles. By the linear pair postulate their measures add up to $180^\circ$." The angle on one side of the ladder is $115^\circ$. What is the angle on the other side, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'The two angles form a linear pair, so their measures add up to $180^\circ$. The other angle measures $180 - 115 = 65$ degrees.'
          - problem: 'Write the full proof, as a paragraph, that $m\angle ABD = \frac{1}{2}\, m\angle ABC$, given that $\overrightarrow{BD}$ lies inside $\angle ABC$ and bisects it.'
            answer_contract: {"kind":"none"}
            answer: 'm angle ABD is half of m angle ABC'
            solution_sketch: 'Because $\overrightarrow{BD}$ bisects $\angle ABC$, the definition of angle bisector gives $\angle ABD \cong \angle DBC$, and the definition of congruent angles turns this into $m\angle ABD = m\angle DBC$. Because $\overrightarrow{BD}$ lies inside $\angle ABC$, the angle addition postulate gives $m\angle ABD + m\angle DBC = m\angle ABC$. Substituting $m\angle ABD$ for $m\angle DBC$ gives $2 \cdot m\angle ABD = m\angle ABC$, and dividing both sides by $2$ gives $m\angle ABD = \frac{1}{2}\, m\angle ABC$.'
        constraints: 'same content scope as kp2, with the proof written as sentences; one question names the definition or postulate behind a sentence, another asks for the value the paragraph reaches; the last exemplar is a full paragraph proof'
    diagnostic_exemplar:
