            answer_contract: {"kind": "exact"}
            answer: '26'
            solution_sketch: 'These are alternate exterior angles, so the rails are parallel exactly when they are congruent. Then $2x + 35 = 4x - 17$ gives $2x = 52$ and $x = 26$. Both angles measure $87^\circ$.'
          - problem: 'A fence rail and a second rail are crossed by a diagonal brace. The brace makes corresponding angles of $(9x - 7)^\circ$ and $(6x + 17)^\circ$ with the two rails. When the rails are parallel, how large is each of these angles?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '65'
            solution_sketch: 'For parallel rails the corresponding angles are congruent, so $9x - 7 = 6x + 17$. This gives $3x = 24$ and $x = 8$. Each angle measures $9(8) - 7 = 65^\circ$.'
          - problem: 'A transversal cuts lines $r$ and $s$. Angle $P$ lies above $r$ and to the left of the transversal. Angle $Q$ lies below $s$ and to the left of the transversal. They measure $(6x - 12)^\circ$ and $(4x + 2)^\circ$. For what value of $x$ are $r$ and $s$ parallel?'
            answer_contract: {"kind": "exact"}
            answer: '19'
            solution_sketch: 'Both angles lie outside the lines and on the same side of the transversal, so they are same-side exterior angles. They must add to $180^\circ$: $10x - 10 = 180$, so $x = 19$. The angles are $102^\circ$ and $78^\circ$.'
          - problem: 'Lines $p$ and $q$ are cut by a transversal, and same-side interior angles measure $(3x + 5)^\circ$ and $(2x + 15)^\circ$. For what value of $x$ are $p$ and $q$ parallel?'
            answer_contract: {"kind": "exact"}
            answer: '32'
            solution_sketch: 'Same-side interior angles must be supplementary for parallel lines, not equal. So $(3x + 5) + (2x + 15) = 180$ gives $5x + 20 = 180$ and $x = 32$. The angles are $101^\circ$ and $79^\circ$.'
        constraints: 'linear expressions; the pair must be equal or supplementary depending on its type, some pairs described by position; one named-error item; integer solutions'
      - id: kp3
        name: Decide from measures whether lines are parallel
        key_prerequisites: [transversal-angle-pairs]
        exemplars:
          - problem: 'A transversal cuts lines $a$ and $b$ and forms alternate interior angles of $64^\circ$ and $64^\circ$. Are $a$ and $b$ parallel?'
            answer_contract: {"kind": "label", "options": [["parallel", "yes", "yes, they are parallel", "they are parallel", "the lines are parallel"], ["not parallel", "no", "no, they are not parallel", "they are not parallel", "the lines are not parallel"]]}
            answer: 'parallel'
            solution_sketch: 'Alternate interior angles of $64^\circ$ and $64^\circ$ are congruent. By the converse of the Alternate Interior Angles Theorem, the lines $a$ and $b$ are parallel.'
          - problem: 'A surveyor lays a cord across two hedges. Between the hedges, on one side of the cord, the angles measure $105^\circ$ and $78^\circ$. Are the hedges parallel?'
            answer_contract: {"kind": "label", "options": [["parallel", "yes", "yes, they are parallel", "they are parallel", "the lines are parallel"], ["not parallel", "no", "no, they are not parallel", "they are not parallel", "the lines are not parallel"]]}
            answer: 'not parallel'
            solution_sketch: 'The angles are same-side interior angles, so the hedges are parallel only if the angles add to $180^\circ$. But $105 + 78 = 183$, which is not $180$. So the hedges are not parallel.'
          - problem: 'A transversal $t$ crosses three lines $a$, $b$ and $c$. At the three crossings, the corresponding angles on the same side of $t$ measure $72^\circ$, $108^\circ$ and $72^\circ$ respectively. Which two of the three lines are parallel?'
            answer_contract: {"kind": "label", "options": [["lines a and b", "a and b", "a and b are parallel"], ["lines a and c", "a and c", "a and c are parallel"], ["lines b and c", "b and c", "b and c are parallel"], ["none of the lines", "none", "no two lines are parallel"]]}
            answer: 'lines a and c'
            solution_sketch: 'Lines $a$ and $c$ make congruent corresponding angles of $72^\circ$ with $t$, so $a \parallel c$ by the converse of the Corresponding Angles Postulate. Line $b$ makes $108^\circ$, which differs from $72^\circ$, so $b$ is parallel to neither.'
          - problem: 'A carpenter''s brace crosses two rails and makes corresponding angles of $118^\circ$ and $115^\circ$. By how many degrees must the lower rail be rotated about the point where it meets the brace so that it is parallel to the upper rail?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '3'
            solution_sketch: 'The rails are parallel exactly when the corresponding angles are congruent. The angles differ by $118 - 115 = 3$ degrees, so the lower rail must be rotated by $3^\circ$.'
          - problem: 'Two straight roads $r$ and $s$ are crossed by a bypass. On a plan, the alternate exterior angles measure $137^\circ$ and $139^\circ$. By how many degrees must road $s$ be rotated about its crossing with the bypass so that it is parallel to road $r$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '2'
            solution_sketch: 'The roads are parallel exactly when the alternate exterior angles are congruent. The angles differ by $139 - 137 = 2$ degrees, so road $s$ must be rotated by $2^\circ$.'
          - problem: 'A plank is laid across two beams. Between the beams, on one side of the plank, the angles measure $97^\circ$ and $91^\circ$. By how many degrees must the second beam be rotated about the plank so that the beams are parallel?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '8'
            solution_sketch: 'The angles are same-side interior angles, and the beams are parallel exactly when the angles add to $180^\circ$. Here $97 + 91 = 188$, which is $8$ too many. So the second beam must be rotated by $8^\circ$.'
          - problem: 'A transversal cuts lines $a$ and $b$. The alternate interior angles measure $(3x + 10)^\circ$ and $(5x - 30)^\circ$. For $a \parallel b$, how large is each of these angles, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The lines are parallel only if the alternate interior angles are congruent, so $3x + 10 = 5x - 30$ and $x = 20$. Each angle measures $3(20) + 10 = 70^\circ$, and $5(20) - 30 = 70^\circ$ agrees.'
          - problem: 'Write the full proof. A transversal $t$ crosses line $\ell$ at $A$ and line $m$ at $B$. The angle $\angle 1$ lies below $\ell$ and to the left of $t$. The angle $\angle 2$ lies above $m$ and to the left of $t$. The angle $\angle 3$ lies above $m$ and to the right of $t$. Given $m\angle 1 + m\angle 2 = 180^\circ$, prove that $\ell \parallel m$.'
            answer_contract: {"kind": "none"}
            answer: 'lines l and m are parallel'
            solution_sketch: 'Statement 1: $m\angle 1 + m\angle 2 = 180^\circ$. Reason: given. Statement 2: $\angle 2$ and $\angle 3$ form a linear pair, so $m\angle 2 + m\angle 3 = 180^\circ$. Reason: linear pair postulate. Statement 3: $m\angle 1 + m\angle 2 = m\angle 2 + m\angle 3$. Reason: both sums equal $180^\circ$ (substitution). Statement 4: $m\angle 1 = m\angle 3$. Reason: subtract $m\angle 2$ from both sides. Statement 5: $\angle 1$ and $\angle 3$ are alternate interior angles. Reason: they lie between the lines on opposite sides of $t$. Statement 6: $\ell \parallel m$. Reason: converse of the Alternate Interior Angles Theorem.'
        constraints: 'decide parallelism from given measures through the matching converse, or find the rotation that would make the lines parallel; two parallel/not-parallel items, one choice among three lines; the last item is a written proof'
    diagnostic_exemplar:
      problem: 'Lines $r$ and $s$ are cut by a transversal. A pair of alternate exterior angles measure $(5x - 30)^\circ$ and $(3x + 40)^\circ$. For what value of $x$ are $r$ and $s$ parallel?'
      answer_contract: {"kind": "exact"}
      answer: '35'
      solution_sketch: 'The lines are parallel exactly when the alternate exterior angles are congruent: $5x - 30 = 3x + 40$ gives $2x = 70$ and $x = 35$.'
    anki_seeds:
      - front: "If a transversal makes congruent alternate interior angles with two lines, the lines are..."
        back: "parallel (converse of the alternate interior angles theorem)"
        type: basic
      - front: "To prove lines parallel from same-side interior angles, show the pair..."
        back: "sums to 180 degrees"
        type: basic

  - id: triangle-angle-sum
    name: Triangle Angle Sum
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: angle-relationships
        weight: 0.6
        key: true
      - id: parallel-lines-transversals
        weight: 0.5
        key: false
      - id: multi-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Find the third angle
        key_prerequisites: [angle-relationships]
        try_first:
          problem: 'A square sheet of paper is cut along one diagonal into two triangles. Each corner of the square is a right angle, and the diagonal cuts two of the corners exactly in half. What do the three angles of one of the triangles add up to?'
          answer_contract: {"kind": "exact"}
          answer: '180'
          reveal: 'One triangle has angles $90^\circ$, $45^\circ$ and $45^\circ$, which add to $180^\circ$. This is no accident. The three angles of every triangle add to $180^\circ$, whatever its shape, and that gives a way to find a missing angle.'
        exemplars:
          - problem: 'Two angles of a triangle measure $48^\circ$ and $63^\circ$. Find the third angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '69'
            solution_sketch: 'The three angles of a triangle add to $180^\circ$. The known angles add to $48 + 63 = 111$, so the third angle is $180 - 111 = 69^\circ$.'
          - problem: 'A triangular flower bed has corner angles of $85^\circ$ and $52^\circ$. How large is the third corner angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '43'
            solution_sketch: 'The corner angles of a triangle add to $180^\circ$. The two known angles add to $85 + 52 = 137$, so the third corner measures $180 - 137 = 43^\circ$.'
          - problem: 'A ladder leans against a vertical wall and makes an angle of $74^\circ$ with the level ground. What angle does the ladder make with the wall?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '16'
            solution_sketch: 'The ladder, the ground and the wall form a right triangle. Its acute angles add to $90^\circ$, so the angle with the wall is $90 - 74 = 16^\circ$.'
          - problem: 'A roof truss is an isosceles triangle whose apex angle measures $100^\circ$. How large is each base angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '40'
            solution_sketch: 'The three angles add to $180^\circ$, so the two base angles together measure $180 - 100 = 80^\circ$. The base angles of an isosceles triangle are equal, so each measures $80 / 2 = 40^\circ$.'
          - problem: 'A boat leaves harbour $A$ and sails straight to buoy $B$. A lighthouse $L$ is seen from $A$ at an angle of $38^\circ$ from the line $AB$, and from $B$ at an angle of $64^\circ$ from the line $BA$. What angle do the two lines of sight $AL$ and $BL$ make at the lighthouse?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '78'
            solution_sketch: 'The harbour, the buoy and the lighthouse form triangle $ABL$ with angles $38^\circ$ at $A$ and $64^\circ$ at $B$. The angle at $L$ is $180 - 38 - 64 = 78^\circ$.'
          - problem: 'Can a triangle have two angles of $118^\circ$ and $52^\circ$?'
            answer_contract: {"kind": "label", "options": [["a triangle can have them", "yes", "yes, it can", "it can", "such a triangle exists"], ["no such triangle exists", "no", "no, it cannot", "it cannot", "such a triangle cannot exist"]]}
            answer: 'yes'
            solution_sketch: 'The two angles add to $118 + 52 = 170$, which is less than $180$. The third angle would measure $180 - 170 = 10^\circ$, which is positive, so such a triangle exists.'
          - problem: 'A designer sketches a triangular sign with two angles of $92^\circ$ and $95^\circ$. Can such a triangle exist?'
            answer_contract: {"kind": "label", "options": [["a triangle can have them", "yes", "yes, it can", "it can", "such a triangle exists"], ["no such triangle exists", "no", "no, it cannot", "it cannot", "such a triangle cannot exist"]]}
            answer: 'no'
            solution_sketch: 'The two angles add to $92 + 95 = 187$, which is more than $180$. The third angle would have to measure $180 - 187 = -7^\circ$, which is impossible, so no such triangle exists.'
          - problem: 'Write the full proof that the angles of a triangle add up to $180^\circ$. In triangle $ABC$, the line $DE$ passes through $A$ and is parallel to $BC$, with $D$ on the same side of $A$ as $B$ and $E$ on the same side of $A$ as $C$.'
            answer_contract: {"kind": "none"}
            answer: 'the angles add up to 180 degrees'
            solution_sketch: 'Statement 1: $DE \parallel BC$. Reason: construction. Statement 2: $m\angle DAB = m\angle B$. Reason: alternate interior angles with transversal $AB$ are congruent, since $DE \parallel BC$. Statement 3: $m\angle EAC = m\angle C$. Reason: alternate interior angles with transversal $AC$ are congruent, since $DE \parallel BC$. Statement 4: $m\angle DAB + m\angle BAC + m\angle EAC = 180^\circ$. Reason: the three angles together form the straight angle $DAE$. Statement 5: $m\angle B + m\angle BAC + m\angle C = 180^\circ$. Reason: substitution from statements 2 and 3. So $m\angle A + m\angle B + m\angle C = 180^\circ$.'
        constraints: 'whole-degree angles summing to 180; right and isosceles triangles; measured contexts; two items asking whether a triangle with two given angles exists; the last item is a written proof'
      - id: kp2
        name: Algebraic angle sums
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'The angles of a triangle measure $x^\circ$, $(2x)^\circ$ and $(3x)^\circ$. Find the largest angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '90'
            solution_sketch: 'The angles add to $180^\circ$, so $x + 2x + 3x = 6x = 180$ and $x = 30$. The angles are $30^\circ$, $60^\circ$ and $90^\circ$, so the largest is $90^\circ$.'
          - problem: 'The angles of a triangle measure $(2x + 10)^\circ$, $(3x - 5)^\circ$ and $(x + 25)^\circ$. Find the largest angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '70'
            solution_sketch: 'The angles add to $180^\circ$, so $6x + 30 = 180$ and $x = 25$. The angles are $60^\circ$, $70^\circ$ and $50^\circ$, so the largest is $70^\circ$.'
          - problem: 'The three corners of a triangular gable measure $(x + 20)^\circ$, $(2x - 10)^\circ$ and $(x + 30)^\circ$. Find the smallest corner angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '55'
            solution_sketch: 'The corner angles add to $180^\circ$, so $4x + 40 = 180$ and $x = 35$. The corners measure $55^\circ$, $60^\circ$ and $65^\circ$, so the smallest is $55^\circ$.'
          - problem: 'The angles of a triangle measure $(x + 10)^\circ$, $(2x + 5)^\circ$ and $(3x - 15)^\circ$. Which theorem lets you set the sum of these three expressions equal to $180$?'
            answer_contract: {"kind": "label", "options": [["triangle angle sum theorem", "triangle sum theorem", "angle sum theorem", "triangle angle sum", "the angles of a triangle add up to 180"], ["exterior angle theorem", "exterior angle", "an exterior angle equals the remote interior sum"], ["isosceles triangle theorem", "base angles theorem", "base angles are congruent"], ["pythagorean theorem", "pythagoras", "a squared plus b squared"]]}
            answer: 'triangle angle sum theorem'
            solution_sketch: 'The Triangle Angle Sum Theorem says that the three interior angles of every triangle add to $180^\circ$. So $(x + 10) + (2x + 5) + (3x - 15) = 180$, which gives $6x = 180$ and $x = 30$.'
          - problem: 'A triangular building plot has corner angles of $(4x + 6)^\circ$, $(3x - 4)^\circ$ and $(2x + 52)^\circ$. Find the largest corner angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '80'
            solution_sketch: 'The corner angles add to $180^\circ$, so $9x + 54 = 180$ and $x = 14$. The corners measure $62^\circ$, $38^\circ$ and $80^\circ$, so the largest is $80^\circ$.'
          - problem: 'A roof truss is an isosceles triangle. Each of the two equal base angles measures $(2x + 8)^\circ$, and the apex angle measures $(6x + 4)^\circ$. Find the apex angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '100'
            solution_sketch: 'The three angles add to $180^\circ$, so $2(2x + 8) + (6x + 4) = 10x + 20 = 180$ and $x = 16$. Each base angle is $40^\circ$, and the apex angle is $6(16) + 4 = 100^\circ$.'
          - problem: 'The angles of a triangle measure $x^\circ$, $(x + 20)^\circ$ and $(x + 40)^\circ$. Find the smallest angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '40'
            solution_sketch: 'The angles add to $180^\circ$, so $3x + 60 = 180$ and $x = 40$. The angles are $40^\circ$, $60^\circ$ and $80^\circ$, so the smallest is $40^\circ$.'
        constraints: 'linear expressions with integer solutions; all angles positive; one theorem-naming item; measured contexts'
      - id: kp3
        name: Angle sums from verbal and combined conditions
        key_prerequisites: [multi-step-equations, angle-relationships]
        exemplars:
          - problem: 'In triangle $ABC$, $m\angle A = 2 \cdot m\angle B$ and $m\angle C = 60^\circ$. Find $m\angle B$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '40'
            solution_sketch: 'The angles at $A$ and $B$ add to $180 - 60 = 120^\circ$. With $m\angle A = 2\,m\angle B$ this gives $3\,m\angle B = 120$, so $m\angle B = 40^\circ$.'
          - problem: 'A triangular roof truss has an apex angle of $84^\circ$. One of its two base angles is twice the other. How large is the larger base angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '64'
            solution_sketch: 'The base angles add to $180 - 84 = 96^\circ$. If the smaller is $y$, then $y + 2y = 96$, so $y = 32$. The larger base angle is $2 \cdot 32 = 64^\circ$.'
          - problem: 'A support bracket is a right triangle whose acute angles measure $(3x + 10)^\circ$ and $(2x + 5)^\circ$. Find the larger acute angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '55'
            solution_sketch: 'The acute angles of a right triangle add to $90^\circ$, so $5x + 15 = 90$ and $x = 15$. The acute angles are $55^\circ$ and $35^\circ$, so the larger is $55^\circ$.'
          - problem: 'In triangle $ABC$, $m\angle A = 3 \cdot m\angle B$ and $m\angle C = 36^\circ$. Find $m\angle B$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '36'
            solution_sketch: 'The angles at $A$ and $B$ add to $180 - 36 = 144^\circ$. With $m\angle A = 3\,m\angle B$ this gives $4\,m\angle B = 144$, so $m\angle B = 36^\circ$.'
          - problem: 'The three angles of a triangular garden are in the ratio $2 : 3 : 4$. Find the largest angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '80'
            solution_sketch: 'Write the angles as $2k$, $3k$ and $4k$. They add to $9k = 180$, so $k = 20$. The largest angle is $4 \cdot 20 = 80^\circ$.'
          - problem: 'In a right-angled corner brace, one acute angle is $14^\circ$ larger than the other. How large is the larger acute angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '52'
            solution_sketch: 'The acute angles add to $90^\circ$. If the smaller is $y$, then $y + (y + 14) = 90$, so $y = 38$. The larger acute angle is $38 + 14 = 52^\circ$.'
          - problem: 'In triangle $ABC$, $m\angle B$ is $20^\circ$ more than $m\angle A$, and $m\angle C$ is $20^\circ$ less than three times $m\angle A$. Find $m\angle C$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '88'
            solution_sketch: 'Let $m\angle A = a$. Then $m\angle B = a + 20$ and $m\angle C = 3a - 20$. The sum is $5a = 180$, so $a = 36$, and $m\angle C = 3(36) - 20 = 88^\circ$.'
        constraints: 'verbal ratio or difference conditions or a right-angle condition; integer answers; measured contexts'
    diagnostic_exemplar:
      problem: 'In triangle $ABC$, $m\angle A$ is twice $m\angle B$, and $m\angle C = 48^\circ$. Find $m\angle A$.'
      answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
      answer: '88'
      solution_sketch: '$m\angle A + m\angle B = 180 - 48 = 132$; with $m\angle A = 2\,m\angle B$ this gives $3\,m\angle B = 132$, so $m\angle B = 44^\circ$ and $m\angle A = 88^\circ$.'
    anki_seeds:
      - front: "The interior angles of a triangle sum to..."
        back: "180 degrees"
        type: basic
      - front: "The two acute angles of a right triangle are..."
        back: "complementary (sum to 90 degrees)"
        type: basic

  - id: exterior-angle-theorem
    name: Exterior Angle Theorem
    core: false
    difficulty: 0.38
    drill: false
    answer_kind: proof
    expected_time_secs: 90
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.8
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Exterior angle equals the remote interior sum
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'The two remote interior angles of a triangle measure $38^\circ$ and $71^\circ$. Find the exterior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '109'
            solution_sketch: 'The Exterior Angle Theorem says that an exterior angle equals the sum of the two remote interior angles. So the exterior angle measures $38 + 71 = 109^\circ$.'
          - problem: 'An exterior angle of a triangle measures $130^\circ$, and one remote interior angle measures $55^\circ$. Find the other remote interior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '75'
            solution_sketch: 'The exterior angle equals the sum of the two remote interior angles. So the other remote angle is $130 - 55 = 75^\circ$.'
          - problem: 'A surveyor extends side $BC$ of a triangular plot $ABC$ beyond $C$ to a point $D$. The corners of the plot at $A$ and $B$ measure $52^\circ$ and $78^\circ$. What is the measure of angle $ACD$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '130'
            solution_sketch: 'Angle $ACD$ is the exterior angle at $C$, and the corners at $A$ and $B$ are its remote interior angles. So $m\angle ACD = 52 + 78 = 130^\circ$.'
          - problem: 'In triangle $ABC$, side $BC$ is extended beyond $C$ to a point $D$. A drawing shows $m\angle A = 50^\circ$, $m\angle B = 45^\circ$ and $m\angle ACD = 95^\circ$. Do these measurements agree with the Exterior Angle Theorem?'
            answer_contract: {"kind": "label", "options": [["yes, they agree", "yes", "they agree", "they are consistent", "they are correct"], ["no, they disagree", "no", "they disagree", "they are inconsistent", "they are not correct"]]}
            answer: 'yes'
            solution_sketch: 'Angle $ACD$ is the exterior angle at $C$, so it should equal $m\angle A + m\angle B = 50 + 45 = 95^\circ$. The drawing shows exactly $95^\circ$, so the measurements agree.'
          - problem: 'A boat sails due east along a straight line from point $A$ to point $B$ and carries on to point $C$. A lighthouse $L$ is seen from $A$ at $34^\circ$ north of east. From $B$ it is seen at $79^\circ$ north of east. What angle do the lines of sight $AL$ and $BL$ make at the lighthouse?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '45'
            solution_sketch: 'Angle $LBC$ measures $79^\circ$ and is the exterior angle of triangle $ABL$ at $B$. Its remote interior angles are the angle at $A$, which is $34^\circ$, and the angle at $L$. So $79 = 34 + m\angle L$, which gives $m\angle L = 45^\circ$.'
          - problem: 'In triangle $ABC$, side $BC$ is extended beyond $C$ to a point $D$. A student measures $m\angle A = 40^\circ$, $m\angle B = 50^\circ$ and $m\angle ACD = 85^\circ$. Do these measurements agree with the Exterior Angle Theorem?'
            answer_contract: {"kind": "label", "options": [["yes, they agree", "yes", "they agree", "they are consistent", "they are correct"], ["no, they disagree", "no", "they disagree", "they are inconsistent", "they are not correct"]]}
            answer: 'no'
            solution_sketch: 'Angle $ACD$ is the exterior angle at $C$, so it should equal $m\angle A + m\angle B = 40 + 50 = 90^\circ$. The student measured $85^\circ$, so the measurements disagree.'
          - problem: 'An exterior angle of a triangle measures $118^\circ$, and one remote interior angle measures $63^\circ$. Find the other remote interior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '55'
            solution_sketch: 'The exterior angle equals the sum of the remote interior angles, so the other remote angle is $118 - 63 = 55^\circ$.'
          - problem: 'Write the full proof. In triangle $ABC$, side $BC$ is extended beyond $C$ to a point $D$. Prove that $m\angle ACD = m\angle A + m\angle B$.'
            answer_contract: {"kind": "none"}
            answer: 'm angle ACD = m angle A + m angle B'
            solution_sketch: 'Statement 1: $m\angle A + m\angle B + m\angle ACB = 180^\circ$. Reason: Triangle Angle Sum Theorem. Statement 2: $\angle ACB$ and $\angle ACD$ form a linear pair, so $m\angle ACB + m\angle ACD = 180^\circ$. Reason: linear pair postulate, since $B$, $C$ and $D$ lie on one line. Statement 3: $m\angle A + m\angle B + m\angle ACB = m\angle ACB + m\angle ACD$. Reason: both sums equal $180^\circ$ (substitution). Statement 4: $m\angle ACD = m\angle A + m\angle B$. Reason: subtract $m\angle ACB$ from both sides.'
        constraints: 'exterior angle strictly between 91 and 179 degrees; find the exterior angle or a remote angle; two items asking whether given measures agree with the theorem; measured contexts; the last item is a written proof'
      - id: kp2
        name: Exterior angle equations
        key_prerequisites: [multi-step-equations, triangle-angle-sum]
        exemplars:
          - problem: 'An exterior angle of a triangle measures $(8x - 6)^\circ$. The remote interior angles measure $(3x + 14)^\circ$ and $(2x + 10)^\circ$. Find the exterior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '74'
            solution_sketch: 'The exterior angle equals the sum of the remote interior angles, so $8x - 6 = (3x + 14) + (2x + 10)$, which is $8x - 6 = 5x + 24$. Then $3x = 30$ and $x = 10$, so the exterior angle measures $8(10) - 6 = 74^\circ$.'
          - problem: 'An exterior angle of a triangle measures $(4x - 24)^\circ$. The remote interior angles measure $(x + 15)^\circ$ and $(2x - 9)^\circ$. Find the exterior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '96'
            solution_sketch: 'Setting the exterior angle equal to the remote sum gives $4x - 24 = 3x + 6$, so $x = 30$. The exterior angle is $4(30) - 24 = 96^\circ$, and the remote angles are $45^\circ$ and $51^\circ$.'
          - problem: 'In a roof frame $ABC$, the side $BC$ is extended beyond $C$. The exterior angle at $C$ measures $(6x + 4)^\circ$, and the interior angles at $A$ and $B$ measure $(3x + 10)^\circ$ and $(2x + 14)^\circ$. How large is the interior angle at $C$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '56'
            solution_sketch: 'The exterior angle equals the sum of the two remote angles, so $6x + 4 = 5x + 24$ and $x = 20$. The exterior angle is $124^\circ$, and the interior angle at $C$ forms a linear pair with it: $180 - 124 = 56^\circ$.'
          - problem: 'An exterior angle of a triangle measures $(5x - 10)^\circ$. The remote interior angles measure $(2x + 5)^\circ$ and $(x + 35)^\circ$. How large is the smaller remote interior angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '55'
            solution_sketch: 'The exterior angle equals the remote sum, so $5x - 10 = 3x + 40$ and $x = 25$. The remote angles are $55^\circ$ and $60^\circ$, so the smaller one is $55^\circ$.'
          - problem: 'A triangular flower bed $ABC$ has its side $AB$ extended past $B$ along an edging strip. The exterior angle at $B$ measures $(8x - 12)^\circ$, and the interior angles at $A$ and $C$ measure $(2x + 10)^\circ$ and $(3x + 5)^\circ$. Find the exterior angle at $B$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '60'
            solution_sketch: 'The exterior angle at $B$ equals the sum of the interior angles at $A$ and $C$, so $8x - 12 = 5x + 15$. Then $3x = 27$ and $x = 9$, so the exterior angle measures $8(9) - 12 = 60^\circ$.'
          - problem: 'An exterior angle of a triangle measures $117^\circ$. The remote interior angles are in the ratio $4 : 5$. Find the larger remote interior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '65'
            solution_sketch: 'The remote angles add to the exterior angle: $4k + 5k = 9k = 117$, so $k = 13$. The remote angles are $52^\circ$ and $65^\circ$, and the larger is $65^\circ$.'
          - problem: 'Triangle $PQR$ is isosceles with $PQ = PR$. Side $RP$ is extended beyond $P$, and the exterior angle at $P$ measures $124^\circ$. Find $m\angle Q$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '62'
            solution_sketch: 'The angles at $Q$ and $R$ are equal, because $PQ = PR$. They are the remote interior angles of the exterior angle at $P$, so $2\,m\angle Q = 124$ and $m\angle Q = 62^\circ$.'
        constraints: 'linear expressions, one ratio item and one isosceles item; integer solutions; remote interior angles positive; measured contexts'
      - id: kp3
        name: Exterior angles around a triangle
        key_prerequisites: [triangle-angle-sum]
        try_first:
          problem: 'A walker follows a path around a triangular park and turns at each corner. After the third turn, she is walking in the same direction as at the start. Through how many degrees did she turn in total?'
          answer_contract: {"kind": "exact"}
          answer: '360'
          reveal: 'She ends up facing the way she started, so her turns make one full turn. The three turns are the exterior angles of the triangle, so they add to $360^\circ$ for every triangle.'
        exemplars:
          - problem: 'Two exterior angles of a triangle, one at each of two vertices, measure $118^\circ$ and $131^\circ$. Find the exterior angle at the third vertex.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '111'
            solution_sketch: 'The exterior angles of a triangle, one at each vertex, add to $360^\circ$. So the third one measures $360 - 118 - 131 = 111^\circ$.'
          - problem: 'An exterior angle of a triangle measures $105^\circ$. Find the interior angle next to it.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '75'
            solution_sketch: 'An exterior angle and the interior angle next to it form a linear pair, so they add to $180^\circ$. The interior angle measures $180 - 105 = 75^\circ$.'
          - problem: 'A drone flies once around a triangular course and turns left at each corner. It turns $125^\circ$ at the first corner and $112^\circ$ at the second. How many degrees does it turn at the third corner?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '123'
            solution_sketch: 'The turns are the exterior angles of the course, one at each corner. Together they add to $360^\circ$, which is one full turn. So the third turn is $360 - 125 - 112 = 123^\circ$.'
          - problem: 'A triangular pennant has a side extended past one corner, and the angle outside the pennant at that corner measures $138^\circ$. How large is the corner angle of the pennant itself?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '42'
            solution_sketch: 'The outside angle and the corner angle of the pennant form a linear pair, so they add to $180^\circ$. The corner angle measures $180 - 138 = 42^\circ$.'
          - problem: 'The exterior angles of a triangle, one at each vertex, are in the ratio $3 : 4 : 5$. Find the smallest interior angle.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '30'
            solution_sketch: 'The exterior angles add to $360^\circ$, so $3k + 4k + 5k = 12k = 360$ and $k = 30$. The exterior angles are $90^\circ$, $120^\circ$ and $150^\circ$. Each interior angle is $180$ minus its exterior angle, so the interior angles are $90^\circ$, $60^\circ$ and $30^\circ$, and the smallest is $30^\circ$.'
          - problem: 'The exterior angles of a triangle, one at each vertex $A$, $B$ and $C$, measure $(3x + 10)^\circ$, $(4x - 6)^\circ$ and $(5x + 8)^\circ$. Find the interior angle at $C$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '27'
            solution_sketch: 'The exterior angles add to $360^\circ$, so $12x + 12 = 360$ and $x = 29$. The exterior angle at $C$ is $5(29) + 8 = 153^\circ$. The interior angle at $C$ forms a linear pair with it: $180 - 153 = 27^\circ$.'
          - problem: 'The exterior angle of a triangle at vertex $A$ measures $100^\circ$, and the interior angle at vertex $B$ measures $35^\circ$. Find the exterior angle at vertex $C$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '115'
            solution_sketch: 'The interior angle at $A$ is $180 - 100 = 80^\circ$. The interior angle at $C$ is $180 - 80 - 35 = 65^\circ$, so the exterior angle at $C$ is $180 - 65 = 115^\circ$. A shortcut agrees: the exterior angle at $C$ equals the sum of the interior angles at $A$ and $B$, which is $80 + 35 = 115^\circ$.'
        constraints: 'one exterior angle per vertex; totals 360; linear-pair steps, ratios and expressions; measured contexts'
