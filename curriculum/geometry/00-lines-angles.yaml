        key: false
    knowledge_points:
      - id: kp1
        name: Perpendicularity and the bisected segment
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Line $\ell$ is the perpendicular bisector of $\overline{XY}$ and meets it at $M$. If $XY = 26$ cm, how long is $XM$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The perpendicular bisector passes through the midpoint of $\overline{XY}$. So $XM$ is half of $XY$, and $26 / 2 = 13$.'
          - problem: 'A straight fence of length $42$ m runs between posts $C$ and $D$. A straight path crosses the fence at a right angle at its midpoint $N$. How far is $N$ from post $D$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The path is perpendicular to the fence and passes through its midpoint, so it is the perpendicular bisector of $\overline{CD}$. Then $ND = 42 / 2 = 21$ m.'
          - problem: 'Segment $\overline{PQ}$ has midpoint $M$, and the line through $M$ perpendicular to $\overline{PQ}$ is drawn. If $MQ = 9$ cm, how long is $\overline{PQ}$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '18'
            solution_sketch: 'The point $M$ is the midpoint, so $PQ$ is twice $MQ$. This gives $PQ = 2 \cdot 9 = 18$ cm.'
          - problem: 'Two perpendicular lines intersect. What is the measure of each angle they form?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'Perpendicular lines meet at right angles. So every angle formed at the crossing measures $90^\circ$.'
          - problem: 'A carpenter marks the midpoint $M$ of a $2.4$ m board $\overline{AB}$ and draws a line across the board through $M$ at a right angle to it. How far from end $B$ does the line cross the edge of the board, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.2'
            solution_sketch: 'The line is the perpendicular bisector of the board, so it crosses at the midpoint. The distance from $B$ is $2.4 / 2 = 1.2$ m.'
          - problem: 'Line $\ell$ crosses $\overline{AB}$ at a point $M$ and forms a $90^\circ$ angle with it. If $AM = 8$ cm and $MB = 9$ cm, is $\ell$ the perpendicular bisector of $\overline{AB}$?'
            answer_contract: {"kind":"label","options":[["no","it is not","no, it is not the perpendicular bisector","not a perpendicular bisector","no it is not","no, it is not","it is not the perpendicular bisector","not the perpendicular bisector"],["yes","it is","yes, it is the perpendicular bisector","a perpendicular bisector","yes it is","yes, it is","it is the perpendicular bisector"]]}
            answer: 'no'
            solution_sketch: 'The line is perpendicular to $\overline{AB}$, but a bisector must also pass through the midpoint. Since $AM = 8$ cm and $MB = 9$ cm differ, $M$ is not the midpoint, so $\ell$ is not the perpendicular bisector.'
          - problem: 'On a map, a lighthouse $A$ is at $(2, 1)$ and a harbour $B$ is at $(8, 5)$, with distances in kilometres. A boat route is to cross the segment $\overline{AB}$ at its midpoint, at a right angle. At which point does the route cross the segment?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 3)'
            solution_sketch: 'The route crosses at the midpoint of $\overline{AB}$. The midpoint is $\left(\frac{2 + 8}{2}, \frac{1 + 5}{2}\right) = (5, 3)$.'
        constraints: 'even segment lengths or decimals that halve exactly; right angles stated in whole degrees; one verdict on whether a line is the perpendicular bisector; one midpoint from coordinates'
      - id: kp2
        name: Equidistance from the endpoints
        key_prerequisites: [two-step-equations]
        try_first:
          problem: 'Fold a sheet of paper so that point $A$ lands exactly on point $B$, and press the crease flat. A point $P$ on the crease is $5$ cm from $A$. How far is $P$ from $B$, in centimetres?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'Folding sends $A$ onto $B$, and a point on the crease does not move, so its distance to $A$ equals its distance to $B$. The crease is the perpendicular bisector of $\overline{AB}$, and every point on it is equally far from both endpoints, so $PB = 5$ cm.'
        exemplars:
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$, and $PA = 17$ cm. How long is $PB$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '17'
            solution_sketch: 'Every point on the perpendicular bisector of a segment is equally far from the two endpoints. So $PB = PA = 17$ cm.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$, with $PA = 3x + 5$ and $PB = 5x - 9$. Find $PA$.'
            answer_contract: {"kind":"exact"}
            answer: '26'
            solution_sketch: 'The point is equidistant from $A$ and $B$, so $3x + 5 = 5x - 9$ and $x = 7$. Then $PA = 3(7) + 5 = 26$.'
          - problem: 'Two villages $A$ and $B$ are $10$ km apart, and a straight road is the perpendicular bisector of the segment joining them. A school $S$ stands on the road, $13$ km from $A$. How far is the school from $B$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '13'
            solution_sketch: 'A point on the perpendicular bisector is as far from $B$ as from $A$. So the school is $13$ km from $B$, and the $10$ km between the villages is not needed.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$, with $PA = 5x - 4$ and $PB = 2x + 11$. Find $PA$.'
            answer_contract: {"kind":"exact"}
            answer: '21'
            solution_sketch: 'Equal distances give $5x - 4 = 2x + 11$, so $3x = 15$ and $x = 5$. Then $PA = 5(5) - 4 = 21$.'
          - problem: 'A pipeline runs along the perpendicular bisector of the segment between pumping stations $A$ and $B$. A valve $V$ on the pipeline is $(6x - 5)$ m from $A$ and $(4x + 9)$ m from $B$. How far is the valve from $A$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '37'
            solution_sketch: 'The valve is on the perpendicular bisector, so $6x - 5 = 4x + 9$ and $x = 7$. The distance from $A$ is $6(7) - 5 = 37$ m, and the distance from $B$ is $4(7) + 9 = 37$ m.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$, where $AB = 16$ cm. The bisector meets $\overline{AB}$ at $M$, and $PM = 6$ cm. How long is $PA$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The point $M$ is the midpoint, so $AM = 8$ cm, and $PM \perp AB$ makes a right triangle $PMA$. By the Pythagorean theorem, $PA = \sqrt{8^2 + 6^2} = 10$ cm.'
          - problem: 'Two sensors stand at $A$ and $B$, and a ranger at $Q$ measures $QA = 9.2$ km and $QB = 9.2$ km. Does $Q$ lie on the perpendicular bisector of $\overline{AB}$?'
            answer_contract: {"kind":"label","options":[["yes","it does","yes, it lies on it","lies on it","yes it does","yes, it does","it lies on it"],["no","it does not","no, it does not lie on it","does not lie on it","no it does not","no, it does not","it does not lie on it"]]}
            answer: 'yes'
            solution_sketch: 'The ranger is the same distance from both sensors. A point equally far from both endpoints lies on the perpendicular bisector, so $Q$ is on it.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$. Which theorem justifies $PA = PB$?'
            answer_contract: {"kind":"label","options":[["perpendicular bisector theorem","the perpendicular bisector theorem","equidistance theorem","perpendicular bisector","points on a perpendicular bisector are equidistant"],["converse of the perpendicular bisector theorem","converse theorem","converse of the equidistance theorem"],["triangle midsegment theorem","midsegment theorem"]]}
            answer: 'perpendicular bisector theorem'
            solution_sketch: 'The theorem says that each point on the perpendicular bisector of a segment is equidistant from its endpoints. The converse is the reverse statement, and the midsegment theorem concerns triangles.'
          - problem: 'Write the full proof that a point $P$ on the perpendicular bisector of $\overline{AB}$ satisfies $PA = PB$. Let $M$ be the midpoint of $\overline{AB}$ and take $P$ different from $M$.'
            answer_contract: {"kind":"none"}
            answer: 'PA = PB'
            solution_sketch: '1. $AM = MB$ because $M$ is the midpoint of $\overline{AB}$. 2. $\angle PMA = \angle PMB = 90^\circ$ because $PM$ lies on the perpendicular bisector, which is perpendicular to $\overline{AB}$. 3. $PM = PM$ by the reflexive property. 4. Hence $\triangle PMA \cong \triangle PMB$ by SAS. 5. Corresponding parts of congruent triangles are congruent (CPCTC), so $PA = PB$.'
        constraints: 'equidistance theorem and its converse; linear expressions with integer solutions; one right-triangle length; one written proof of the theorem as the last exemplar'
      - id: kp3
        name: Equations through the midpoint or the right angle
        key_prerequisites: [two-step-equations, segment-angle-addition]
        exemplars:
          - problem: 'The perpendicular bisector of $\overline{AB}$ meets it at $M$. If $AB = 4x + 2$ and $AM = 15$, find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The point $M$ is the midpoint, so $AB = 2 \cdot AM = 30$. Then $4x + 2 = 30$ and $x = 7$.'
          - problem: 'Line $m$ is perpendicular to line $n$, and one of the angles they form measures $(2x + 16)^\circ$. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '37'
            solution_sketch: 'Perpendicular lines form right angles, so $2x + 16 = 90$. Then $2x = 74$ and $x = 37$.'
          - problem: 'A straight path crosses a fence at a right angle at the midpoint of the fence. The fence has length $(5x + 4)$ m, and the distance from one end of the fence to the path is $7$ m. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The path passes through the midpoint, so the fence is twice the distance $7$ m, which is $14$ m. Then $5x + 4 = 14$ gives $5x = 10$ and $x = 2$.'
          - problem: 'Line $m$ is perpendicular to line $n$, and one of the angles they form measures $(7x + 6)^\circ$. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'Perpendicular lines form right angles, so $7x + 6 = 90$. Then $7x = 84$ and $x = 12$.'
          - problem: 'A surveyor lays an offset line at a right angle to a straight baseline. The angle between the offset line and the baseline on one side is $(4x - 6)^\circ$. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '24'
            solution_sketch: 'The offset line is perpendicular to the baseline, so the angle is $90^\circ$. Then $4x - 6 = 90$, so $4x = 96$ and $x = 24$.'
          - problem: 'Ray $\overrightarrow{OB}$ is perpendicular to the line through $A$, $O$, and $C$, and a ray $\overrightarrow{OD}$ lies between $\overrightarrow{OA}$ and $\overrightarrow{OB}$. If $m\angle AOD = (2x + 10)^\circ$ and $m\angle DOB = (x + 20)^\circ$, find $m\angle AOD$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '50'
            solution_sketch: 'The ray $OB$ is perpendicular to the line $AC$, so $m\angle AOB = 90$. The two parts add up to it: $(2x + 10) + (x + 20) = 90$ gives $x = 20$, so $m\angle AOD = 2(20) + 10 = 50$.'
          - problem: 'The perpendicular bisector of $\overline{AB}$ meets it at $M$, with $AM = (3x - 2)$ cm and $MB = (x + 8)$ cm. How long is $\overline{AB}$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The point $M$ is the midpoint, so $3x - 2 = x + 8$ and $x = 5$. Then $AM = 13$ cm, and $AB = 2 \cdot 13 = 26$ cm.'
        constraints: 'one linear equation from the midpoint relation or the 90-degree condition; integer solutions'
    diagnostic_exemplar:
      problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$ with $PA = 2x + 9$ and $PB = 4x - 7$. Find $PA$.'
      answer: "25"
      solution_sketch: '$2x + 9 = 4x - 7 \Rightarrow x = 8$; $PA = 25$.'
    anki_seeds:
      - front: "Any point on the perpendicular bisector of a segment is equidistant from..."
        back: "the segment's endpoints"
        type: basic
      - front: "Perpendicular lines meet at angles of..."
        back: "90 degrees"
        type: basic

  - id: transversal-angle-pairs
    name: Transversal Angle Pairs
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: proof
    expected_time_secs: 75
    prerequisites:
      - id: angle-relationships
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Name the angle pair
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A transversal crosses two lines. Two angles lie between the lines on opposite sides of the transversal. What is this pair called?'
            answer_contract: {"kind":"label","options":[["corresponding angles","corresponding","a pair of corresponding angles"],["alternate interior angles","alternate interior","a pair of alternate interior angles","alternate interior pair"],["alternate exterior angles","alternate exterior","a pair of alternate exterior angles","alternate exterior pair"],["same-side interior angles","same-side (co-interior) interior angles","co-interior angles","same side interior angles","same-side interior","co-interior","consecutive interior angles","consecutive interior"]]}
            answer: 'alternate interior angles'
            solution_sketch: 'The two angles are between the lines, so they are interior angles. They lie on opposite sides of the transversal, so they are alternate interior angles.'
          - problem: 'A transversal $t$ crosses two lines $p$ and $q$. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle is the corresponding angle of angle $3$?'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'Angle $3$ is below the line and left of the transversal at the upper crossing. The angle in the same position at the lower crossing is angle $7$.'
          - problem: 'A straight road $t$ crosses two railway lines $p$ and $q$. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle forms an alternate interior pair with angle $4$?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'Angle $4$ is between the railway lines, on the right of the road. The angle between the lines on the opposite side of the road, at the other crossing, is angle $5$.'
          - problem: 'A transversal crosses two lines. Two angles lie outside the two lines, on opposite sides of the transversal. What is this pair called?'
            answer_contract: {"kind":"label","options":[["corresponding angles","corresponding","a pair of corresponding angles"],["alternate interior angles","alternate interior","a pair of alternate interior angles","alternate interior pair"],["alternate exterior angles","alternate exterior","a pair of alternate exterior angles","alternate exterior pair"],["same-side interior angles","same-side (co-interior) interior angles","co-interior angles","same side interior angles","same-side interior","co-interior","consecutive interior angles","consecutive interior"]]}
            answer: 'alternate exterior angles'
            solution_sketch: 'The two angles are outside the lines, so they are exterior angles. They lie on opposite sides of the transversal, so they are alternate exterior angles.'
          - problem: 'A transversal $t$ crosses two lines $p$ and $q$. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle forms a same-side interior pair with angle $4$?'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Angle $4$ is between the lines and right of the transversal. The angle between the lines on the same side at the other crossing is angle $6$.'
          - problem: 'A straight cable $t$ crosses two parallel shelf edges $p$ and $q$ on a wall. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle is the alternate exterior partner of angle $1$?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Angle $1$ is outside the edges, above the upper edge and left of the cable. The exterior angle on the opposite side of the cable, at the other edge, is angle $8$.'
          - problem: 'A transversal $t$ crosses two lines $p$ and $q$. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle is the vertical angle of angle $6$?'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'Angle $6$ is above the lower line and right of the transversal. The angle opposite it at the same crossing is below and left, which is angle $7$.'
          - problem: 'A footbridge $t$ crosses two straight streams $p$ and $q$. The angles at the upper crossing are numbered $1$ (above the line, left of the transversal), $2$ (above, right), $3$ (below, left), and $4$ (below, right), and the angles at the lower crossing are numbered $5$ (above, left), $6$ (above, right), $7$ (below, left), and $8$ (below, right). Which angle forms a corresponding pair with angle $2$?'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Angle $2$ is above the upper stream and right of the bridge. The angle in the same position at the lower stream is angle $6$.'
        constraints: 'pairs limited to corresponding, alternate interior, alternate exterior, same-side interior, and vertical; eight angles numbered at two crossings; two naming items, the rest ask for the partner angle number'
      - id: kp2
        name: Compute congruent pairs with parallel lines
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Parallel lines are cut by a transversal. One angle measures $65^\circ$. Find its alternate interior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'With parallel lines, alternate interior angles are congruent. So the alternate interior angle also measures $65^\circ$.'
          - problem: 'Parallel lines are cut by a transversal. Two corresponding angles measure $(4x + 7)^\circ$ and $(6x - 21)^\circ$. How large is each of them?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '63'
            solution_sketch: 'Corresponding angles are congruent for parallel lines, so $4x + 7 = 6x - 21$ and $x = 14$. Each angle measures $4(14) + 7 = 63$.'
          - problem: 'A straight road crosses two parallel railway tracks. At the northern crossing, the angle between the road and the track on the north-east corner is $132^\circ$. What is the angle between the road and the southern track at its north-east corner?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '132'
            solution_sketch: 'The angles at the two north-east corners occupy the same position at the two crossings, so they are corresponding angles. The tracks are parallel, so the angle is also $132^\circ$.'
          - problem: 'Parallel lines are cut by a transversal. One angle measures $47^\circ$. Find its alternate exterior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '47'
            solution_sketch: 'Alternate exterior angles are congruent when the lines are parallel. So the angle measures $47^\circ$.'
          - problem: 'Oak Street and Pine Street are parallel, Pine Street lies south of Oak Street, and Main Street crosses both. At Oak Street, the angle between Main Street and Oak Street on the south-east corner measures $76^\circ$. What angle do Main Street and Pine Street make on the north-west corner at Pine Street?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '76'
            solution_sketch: 'The south-east angle at Oak Street lies between the streets, and the north-west angle at Pine Street lies between them on the opposite side of Main Street. They are alternate interior angles, so the second angle also measures $76^\circ$.'
          - problem: 'Parallel lines are cut by a transversal. The alternate interior angles measure $(5x - 12)^\circ$ and $(3x + 28)^\circ$. How large is each of them?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '88'
            solution_sketch: 'Alternate interior angles are congruent, so $5x - 12 = 3x + 28$ and $x = 20$. Each angle measures $5(20) - 12 = 88$.'
          - problem: 'Parallel lines $p$ and $q$ are cut by a transversal $t$, and $\angle 3$ and $\angle 6$ lie between the lines on opposite sides of $t$. Which theorem justifies $m\angle 3 = m\angle 6$?'
            answer_contract: {"kind":"label","options":[["alternate interior angles theorem","alternate interior angles","alternate interior angle theorem","the alternate interior angles theorem","alternate interior theorem"],["corresponding angles postulate","corresponding angles","the corresponding angles postulate","corresponding angles theorem"],["vertical angles theorem","vertical angles","vertical angle theorem","the vertical angles theorem"]]}
            answer: 'alternate interior angles theorem'
            solution_sketch: 'The lines are parallel, and the two angles are between the lines on opposite sides of the transversal. The alternate interior angles theorem says such angles are congruent.'
          - problem: 'Write the full proof that alternate interior angles are congruent when two parallel lines $p$ and $q$ are cut by a transversal $t$. Let $\angle 3$ and $\angle 6$ be the alternate interior angles, let $\angle 7$ be the angle corresponding to $\angle 3$, and use the corresponding angles postulate.'
            answer_contract: {"kind":"none"}
            answer: 'angle 3 = angle 6'
            solution_sketch: '1. $\angle 3 \cong \angle 7$ because $p \parallel q$ and corresponding angles are congruent. 2. $\angle 7 \cong \angle 6$ because they are vertical angles. 3. Hence $\angle 3 \cong \angle 6$ by the transitive property of congruence. 4. So alternate interior angles are congruent when the lines are parallel.'
        constraints: 'whole-degree angles; congruent pairs: corresponding, alternate interior, alternate exterior; one justification; one written proof as the last exemplar'
      - id: kp3
        name: Compute supplementary pairs with parallel lines
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Parallel lines are cut by a transversal. One same-side interior angle measures $112^\circ$. Find the other same-side interior angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '68'
            solution_sketch: 'Same-side interior angles are supplementary when the lines are parallel. So the other angle measures $180 - 112 = 68$.'
