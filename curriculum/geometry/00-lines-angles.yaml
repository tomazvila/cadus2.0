            answer: '122'
            solution_sketch: 'The road meets both rails at the same angle, because corresponding angles between parallel lines are congruent. So the acute angle at the second crossing is also $58^\circ$. The obtuse angle forms a linear pair with it: $180 - 58 = 122^\circ$.'
          - problem: 'Parallel lines are cut by a transversal. An angle of $(3x)^\circ$ and its same-side interior partner of $(2x + 20)^\circ$ are formed. How large is the larger of the two angles?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '96'
            solution_sketch: 'Same-side interior angles are supplementary, so $3x + (2x + 20) = 180$, which gives $5x = 160$ and $x = 32$. The angles are $96^\circ$ and $84^\circ$, and the larger one is $96^\circ$.'
          - problem: 'A diagonal brace crosses two parallel fence rails. At the upper rail the angle between the brace and the rail measures $(5x - 8)^\circ$, and the alternate interior angle at the lower rail measures $(3x + 28)^\circ$. How large is the angle that forms a linear pair with the angle at the lower rail?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '98'
            solution_sketch: 'Alternate interior angles are congruent, so $5x - 8 = 3x + 28$ and $x = 18$. The angle at the lower rail is $82^\circ$. Its linear pair measures $180 - 82 = 98^\circ$.'
          - problem: 'A path crosses two parallel hedges. Between the hedges, on one side of the path, the two angles that the path makes with the hedges are same-side interior angles, and one of them is three times the other. How large is the smaller angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '45'
            solution_sketch: 'The angles are supplementary, so $y + 3y = 180$ for the smaller angle $y$. Then $4y = 180$ and $y = 45$. The angles are $45^\circ$ and $135^\circ$.'
          - problem: 'In trapezoid $ABCD$ the sides $AB$ and $DC$ are parallel. Angle $DAB$ measures $68^\circ$ and angle $ABC$ measures $75^\circ$. Find $m\angle BCD$.'
