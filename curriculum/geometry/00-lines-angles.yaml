          - problem: 'A builder measures a pair of same-side interior angles of $104^\circ$ and $78^\circ$ where a straight batten crosses two rails. Are the rails parallel?'
            answer_contract: {"kind":"label","options":[["no","they are not parallel","no, they are not parallel","not parallel","no they are not parallel","no, they are not","they are not"],["yes","they are parallel","yes, they are parallel","parallel","yes they are parallel","yes, they are"]]}
            answer: 'no'
