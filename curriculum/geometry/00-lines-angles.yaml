        exemplars:
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. Two corresponding angles measure $(5x - 10)^\circ$ and $(3x + 40)^\circ$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '25'
            solution_sketch: 'Corresponding angles between parallel lines are congruent, so $5x - 10 = 3x + 40$. Subtracting $3x$ and adding $10$ gives $2x = 50$, so $x = 25$, and each angle measures $115^\circ$.'
          - problem: 'Oak Street and Elm Street are parallel, and Main Street crosses both. Outside the strip between the two parallel streets, on opposite sides of Main Street, two angles measure $(7x - 4)^\circ$ and $(5x + 22)^\circ$. How large is each of these angles?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '87'
            solution_sketch: 'These are alternate exterior angles, and between parallel lines they are congruent. So $7x - 4 = 5x + 22$ gives $2x = 26$ and $x = 13$. Each angle measures $7(13) - 4 = 87^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel, and a transversal $t$ crosses $\ell$ at $A$ and $m$ at $B$. The angle above $\ell$ and to the left of $t$ is $\angle 1$, and the angle above $m$ and to the left of $t$ is $\angle 5$. Which postulate justifies $m\angle 1 = m\angle 5$?'
            answer_contract: {"kind": "label", "options": [["corresponding angles postulate", "corresponding angles", "corresponding angles are congruent", "the corresponding angles postulate", "corresponding angles theorem"], ["alternate interior angles theorem", "alternate interior angles", "alternate interior angles are congruent"], ["vertical angles theorem", "vertical angles", "vertical angles are congruent"], ["linear pair postulate", "linear pair", "a linear pair is supplementary"]]}
            answer: 'corresponding angles postulate'
            solution_sketch: 'The angles $\angle 1$ and $\angle 5$ sit in the same position at the two crossings: both are above their line and left of the transversal. Such angles are corresponding angles, and the Corresponding Angles Postulate says they are congruent when the lines are parallel.'
          - problem: 'A carpenter fixes a brace across two parallel rafters. The angles between the brace and the rafters, on opposite sides of the brace and between the rafters, measure $(6x + 2)^\circ$ and $(4x + 18)^\circ$. How large is each angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '50'
            solution_sketch: 'These are alternate interior angles, so they are congruent: $6x + 2 = 4x + 18$. This gives $2x = 16$ and $x = 8$, so each angle measures $6(8) + 2 = 50^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel, and $t$ is a transversal. Angle $P$ lies above $\ell$ and to the left of $t$. Angle $Q$ lies above $m$ and to the left of $t$. They measure $(4x + 9)^\circ$ and $(6x - 23)^\circ$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '16'
            solution_sketch: 'Both angles are above their line and left of $t$, so they are corresponding angles and are congruent. Then $4x + 9 = 6x - 23$ gives $2x = 32$, so $x = 16$ and both angles measure $73^\circ$.'
          - problem: 'A surveyor runs a straight cord across two parallel boundary hedges. Between the hedges, on opposite sides of the cord, the cord makes angles of $(8x - 6)^\circ$ and $(3x + 39)^\circ$ with the hedges. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '9'
            solution_sketch: 'The two angles are alternate interior angles between parallel hedges, so they are congruent. Then $8x - 6 = 3x + 39$ gives $5x = 45$ and $x = 9$. Each angle is $66^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. A pair of alternate exterior angles measure $(2x + 15)^\circ$ and $(4x - 33)^\circ$. How large is each angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '63'
            solution_sketch: 'Alternate exterior angles between parallel lines are congruent, so $2x + 15 = 4x - 33$. This gives $2x = 48$, so $x = 24$. Each angle measures $2(24) + 15 = 63^\circ$.'
