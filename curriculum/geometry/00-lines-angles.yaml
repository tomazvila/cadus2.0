            answer_contract: {"kind": "label", "options": [["linear pair postulate", "linear pair", "a linear pair is supplementary", "linear pairs are supplementary"], ["vertical angles theorem", "vertical angles", "vertical angles are congruent"], ["corresponding angles postulate", "corresponding angles", "corresponding angles are congruent"], ["alternate interior angles theorem", "alternate interior angles", "alternate interior angles are congruent"]]}
            answer: 'linear pair postulate'
            solution_sketch: 'Two adjacent angles whose outer sides form a straight line make a linear pair. The Linear Pair Postulate states that such angles are supplementary, so $m\angle 2 + m\angle 3 = 180^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. $m\angle 1 = (3x + 5)^\circ$, and $\angle 2$ is the alternate interior angle of $\angle 1$. $\angle 3$ forms a linear pair with $\angle 2$ and measures $133^\circ$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '14'
            solution_sketch: 'Since $\angle 3$ and $\angle 2$ form a linear pair, $m\angle 2 = 180 - 133 = 47^\circ$. Alternate interior angles are congruent, so $3x + 5 = 47$. Then $3x = 42$ and $x = 14$.'
          - problem: 'A straight road crosses two parallel railway lines. At the first crossing the acute angle between the road and the rails is $58^\circ$. What is the obtuse angle between the road and the rails at the second crossing?'
