            solution_sketch: 'Same-side exterior angles of parallel lines are supplementary. So the paired angle measures $180 - 48 = 132$.'
          - problem: 'A straight road crosses two parallel canals. On the east side of the road, between the canals, the angle between the road and the first canal is $145^\circ$. What is the angle between the road and the second canal on the east side, between the canals?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The two angles lie between the canals on the same side of the road, so they are same-side interior angles. The canals are parallel, so the angles add to $180^\circ$, and $180 - 145 = 35$.'
          - problem: 'Parallel lines are cut by a transversal. The same-side interior angles measure $(3x + 15)^\circ$ and $(2x + 25)^\circ$. What is the measure of the smaller angle?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '81'
            solution_sketch: 'Same-side interior angles add to $180^\circ$, so $(3x + 15) + (2x + 25) = 180$ and $x = 28$. The angles are $99$ and $2(28) + 25 = 81$, so the smaller angle is $81$.'
          - problem: 'Two parallel beams are joined by a diagonal brace. On the inside of the frame, the brace makes an angle of $97^\circ$ with the upper beam. What angle does the brace make with the lower beam on the same side of the brace?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
