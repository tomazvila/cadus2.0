      - id: kp2
        name: Solve supplementary-pair equations
        key_prerequisites: [transversal-angle-pairs]
        exemplars:
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. Two same-side interior angles measure $(2x + 30)^\circ$ and $(3x + 20)^\circ$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '26'
            solution_sketch: 'Same-side interior angles between parallel lines are supplementary, so $(2x + 30) + (3x + 20) = 180$. This simplifies to $5x + 50 = 180$, so $x = 26$. The angles are $82^\circ$ and $98^\circ$.'
          - problem: 'The two kerbs of a straight street are parallel, and a footpath crosses the street. On one side of the footpath, between the kerbs, the footpath makes angles of $(4x + 18)^\circ$ and $(2x + 30)^\circ$ with the kerbs. How large is the larger of these angles?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '106'
            solution_sketch: 'The two angles are same-side interior angles, so they add to $180^\circ$: $6x + 48 = 180$ and $x = 22$. The angles are $106^\circ$ and $74^\circ$, and the larger one is $106^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. Two same-side exterior angles measure $(5x - 20)^\circ$ and $(3x + 8)^\circ$. How large is the smaller angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '80'
            solution_sketch: 'Same-side exterior angles between parallel lines are supplementary: $(5x - 20) + (3x + 8) = 180$, which gives $8x - 12 = 180$ and $x = 24$. The angles are $100^\circ$ and $80^\circ$, so the smaller is $80^\circ$.'
          - problem: 'Two shelf boards are parallel, and a diagonal brace is nailed across both. On one side of the brace, between the boards, the brace makes angles of $(3x + 10)^\circ$ and $(2x + 30)^\circ$ with the boards. How large is the smaller angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '86'
            solution_sketch: 'These are same-side interior angles between parallel boards, so they add to $180^\circ$. Then $5x + 40 = 180$ and $x = 28$, which gives $94^\circ$ and $86^\circ$. The smaller angle is $86^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. $\angle 3$ and $\angle 4$ are same-side interior angles. Which theorem tells you that $m\angle 3 + m\angle 4 = 180^\circ$?'
            answer_contract: {"kind": "label", "options": [["same-side interior angles theorem", "same side interior angles theorem", "same-side interior angles", "consecutive interior angles theorem", "co-interior angles theorem", "same side interior angles"], ["alternate interior angles theorem", "alternate interior angles", "alternate interior angles are congruent"], ["corresponding angles postulate", "corresponding angles", "corresponding angles are congruent"], ["vertical angles theorem", "vertical angles", "vertical angles are congruent"]]}
            answer: 'same-side interior angles theorem'
            solution_sketch: 'Between parallel lines, interior angles on the same side of the transversal are supplementary. This is the Same-Side Interior Angles Theorem, so $m\angle 3 + m\angle 4 = 180^\circ$. The other three results say that angles are congruent, not that they add to $180^\circ$.'
          - problem: 'Lines $\ell$ and $m$ are parallel, and $t$ is a transversal. Angle $P$ lies below $\ell$ and to the right of $t$. Angle $Q$ lies above $m$ and to the right of $t$. They measure $(7x - 12)^\circ$ and $(3x + 22)^\circ$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '17'
            solution_sketch: 'Both angles lie between the lines and on the same side of $t$, so they are same-side interior angles and add to $180^\circ$. Then $10x + 10 = 180$ and $x = 17$, which gives $107^\circ$ and $73^\circ$.'
          - problem: 'Two same-side interior angles of $(3x + 10)^\circ$ and $(x + 50)^\circ$ lie between parallel lines. What is the value of $x$?'
            answer_contract: {"kind": "exact"}
            answer: '30'
            solution_sketch: 'Same-side interior angles between parallel lines are supplementary, not congruent. So $(3x + 10) + (x + 50) = 180$, which gives $4x + 60 = 180$ and $x = 30$. The angles are $100^\circ$ and $80^\circ$.'
        constraints: 'linear expressions; same-side interior and same-side exterior pairs sum to 180, some described by position; one theorem-naming item; one named-error item; integer solutions; both angles positive and distinct from 90'
      - id: kp3
