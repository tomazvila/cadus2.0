        key_prerequisites: [transversal-angle-pairs]
        exemplars:
          - problem: 'Lines $\ell$ and $m$ are parallel and are cut by a transversal. $\angle 1$ and $\angle 2$ are corresponding angles, and $\angle 2$ and $\angle 3$ form a linear pair. If $m\angle 1 = 64^\circ$, find $m\angle 3$.'
