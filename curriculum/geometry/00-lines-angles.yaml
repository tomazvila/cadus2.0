          - problem: 'Lines $p$ and $q$ are cut by a transversal, and two same-side interior angles measure $112^\circ$ and $68^\circ$. Which theorem shows that $p \parallel q$?'
            answer_contract: {"kind": "label", "options": [["converse of the corresponding angles postulate", "corresponding angles converse", "converse of corresponding angles", "corresponding angles postulate", "corresponding angles", "the converse of the corresponding angles postulate", "converse of the corresponding angles theorem", "converse of the corresponding angles"], ["converse of the alternate interior angles theorem", "alternate interior angles converse", "converse of alternate interior angles", "alternate interior angles theorem", "alternate interior angles", "the converse of the alternate interior angles theorem", "converse of the alternate interior angles", "alternate interior angles theorem converse"], ["converse of the alternate exterior angles theorem", "alternate exterior angles converse", "converse of alternate exterior angles", "alternate exterior angles theorem", "alternate exterior angles", "the converse of the alternate exterior angles theorem", "converse of the alternate exterior angles", "alternate exterior angles theorem converse"], ["converse of the same-side interior angles theorem", "same-side interior angles converse", "converse of same-side interior angles", "same-side interior angles theorem", "same-side interior angles", "the converse of the same-side interior angles theorem", "converse of the same side interior angles theorem", "same side interior angles converse"]]}
            answer: 'converse of same-side interior angles'
            solution_sketch: 'The sum is $112 + 68 = 180$, so the same-side interior angles are supplementary. By the converse of the Same-Side Interior Angles Theorem, $p \parallel q$.'
          - problem: 'A surveyor lays a cord across two fence lines $A$ and $B$. At line $A$ the angle above the line and to the east of the cord measures $54^\circ$. For the fences to be parallel, how large must the angle below line $B$ and to the west of the cord be?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '54'
            solution_sketch: 'The first angle is outside the two fences on the east side of the cord. The second is outside the fences on the west side, so the pair are alternate exterior angles. The fences are parallel exactly when alternate exterior angles are congruent, so the second angle must measure $54^\circ$.'
          - problem: 'A transversal $t$ crosses lines $\ell$ and $m$. The angle above $\ell$ and to the right of $t$ measures $63^\circ$. For $\ell \parallel m$, how large must the angle above $m$ and to the left of $t$ be?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '117'
            solution_sketch: 'The angle above $m$ and to the right of $t$ would have to be corresponding to the given angle, so it measures $63^\circ$. The angle above $m$ and to the left of $t$ forms a linear pair with it. So it measures $180 - 63 = 117^\circ$.'
          - problem: 'A road crew finds that a cross street makes equal alternate interior angles with two avenues. Which theorem tells the crew that the avenues are parallel?'
            answer_contract: {"kind": "label", "options": [["converse of the corresponding angles postulate", "corresponding angles converse", "converse of corresponding angles", "corresponding angles postulate", "corresponding angles", "the converse of the corresponding angles postulate", "converse of the corresponding angles theorem", "converse of the corresponding angles"], ["converse of the alternate interior angles theorem", "alternate interior angles converse", "converse of alternate interior angles", "alternate interior angles theorem", "alternate interior angles", "the converse of the alternate interior angles theorem", "converse of the alternate interior angles", "alternate interior angles theorem converse"], ["converse of the alternate exterior angles theorem", "alternate exterior angles converse", "converse of alternate exterior angles", "alternate exterior angles theorem", "alternate exterior angles", "the converse of the alternate exterior angles theorem", "converse of the alternate exterior angles", "alternate exterior angles theorem converse"], ["converse of the same-side interior angles theorem", "same-side interior angles converse", "converse of same-side interior angles", "same-side interior angles theorem", "same-side interior angles", "the converse of the same-side interior angles theorem", "converse of the same side interior angles theorem", "same side interior angles converse"]]}
            answer: 'converse of alternate interior angles'
            solution_sketch: 'The crew has congruent alternate interior angles. The converse of the Alternate Interior Angles Theorem says that two lines cut by a transversal are parallel when the alternate interior angles are congruent.'
          - problem: 'Two straight rails are crossed by a brace. At the upper rail, the angle below the rail and to the right of the brace measures $83^\circ$. For the rails to be parallel, how large must the angle above the lower rail and to the right of the brace be?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '97'
            solution_sketch: 'The two angles are same-side interior angles. The converse of the same-side interior angles theorem requires them to be supplementary, so the angle is $180^\circ - 83^\circ = 97^\circ$.'
          - problem: 'Write the full proof. A transversal $t$ crosses line $\ell$ at $A$ and line $m$ at $B$. The angle $\angle 1$ lies above $\ell$ and to the left of $t$. The angle $\angle 2$ lies below $m$ and to the right of $t$. The angle $\angle 3$ lies below $\ell$ and to the right of $t$. Given $m\angle 1 = m\angle 2$, prove that $\ell \parallel m$.'
            answer_contract: {"kind": "none"}
            answer: 'lines l and m are parallel'
            solution_sketch: 'Statement 1: $m\angle 1 = m\angle 2$. Reason: given. Statement 2: $\angle 1$ and $\angle 3$ are vertical angles, so $m\angle 1 = m\angle 3$. Reason: vertical angles are congruent. Statement 3: $m\angle 3 = m\angle 2$. Reason: both equal $m\angle 1$ (transitive property). Statement 4: $\angle 3$ and $\angle 2$ lie below their lines and to the right of $t$, so they are corresponding angles. Reason: definition of corresponding angles. Statement 5: $\ell \parallel m$. Reason: converse of the Corresponding Angles Postulate, since corresponding angles $\angle 3$ and $\angle 2$ are congruent.'
        constraints: 'name the converse matching the given angle pair, or find the angle that the pair needs; three theorem-naming label items; the last item is a written proof'
