        name: Identify the converse that applies
        key_prerequisites: [transversal-angle-pairs]
        exemplars:
          - problem: 'A transversal cuts lines $\ell$ and $m$, and a pair of corresponding angles is congruent. Which theorem lets you conclude $\ell \parallel m$?'
            answer_contract: {"kind": "label", "options": [["converse of the corresponding angles postulate", "corresponding angles converse", "converse of corresponding angles", "corresponding angles postulate", "corresponding angles", "the converse of the corresponding angles postulate", "converse of the corresponding angles theorem", "converse of the corresponding angles"], ["converse of the alternate interior angles theorem", "alternate interior angles converse", "converse of alternate interior angles", "alternate interior angles theorem", "alternate interior angles", "the converse of the alternate interior angles theorem", "converse of the alternate interior angles", "alternate interior angles theorem converse"], ["converse of the alternate exterior angles theorem", "alternate exterior angles converse", "converse of alternate exterior angles", "alternate exterior angles theorem", "alternate exterior angles", "the converse of the alternate exterior angles theorem", "converse of the alternate exterior angles", "alternate exterior angles theorem converse"], ["converse of the same-side interior angles theorem", "same-side interior angles converse", "converse of same-side interior angles", "same-side interior angles theorem", "same-side interior angles", "the converse of the same-side interior angles theorem", "converse of the same side interior angles theorem", "same side interior angles converse"]]}
            answer: 'converse of corresponding angles'
            solution_sketch: 'Congruent corresponding angles force the lines to be parallel. This is the converse of the Corresponding Angles Postulate, which turns the postulate around: the postulate goes from parallel lines to congruent angles, and the converse goes back.'
          - problem: 'A carpenter fixes a brace across two rails. At the upper rail, the angle below the rail and to the left of the brace measures $71^\circ$. For the rails to be parallel, how large must the angle above the lower rail and to the left of the brace be?'
