        exemplars:
          - problem: 'A transversal cuts lines $\ell$ and $m$, and a pair of corresponding angles is congruent. Which theorem lets you conclude $\ell \parallel m$: the converse of the corresponding angles postulate, the converse of the alternate interior angles theorem, the converse of the same-side interior angles theorem, or the definition of congruent angles?'
            answer: 'the converse of the corresponding angles postulate'
            answer_contract: {kind: label, options: [['the converse of the corresponding angles postulate'], ['the converse of the alternate interior angles theorem'], ['the converse of the same-side interior angles theorem'], ['the definition of congruent angles']]}
            solution_sketch: 'Congruent corresponding angles force the lines parallel by the converse of the corresponding angles postulate.'
          - problem: 'A transversal cuts lines $\ell$ and $m$, and a pair of same-side interior angles sums to $180^\circ$. Which theorem lets you conclude $\ell \parallel m$: the converse of the corresponding angles postulate, the converse of the alternate interior angles theorem, the converse of the same-side interior angles theorem, or the definition of supplementary angles?'
            answer: 'the converse of the same-side interior angles theorem'
            answer_contract: {kind: label, options: [['the converse of the corresponding angles postulate'], ['the converse of the alternate interior angles theorem'], ['the converse of the same-side interior angles theorem'], ['the definition of supplementary angles']]}
            solution_sketch: 'Same-side interior angles summing to $180^\circ$ force the lines parallel by the converse of the same-side interior angles theorem.'
          - problem: 'A transversal cuts lines $\ell$ and $m$, and a pair of alternate interior angles is congruent. Which theorem lets you conclude $\ell \parallel m$: the converse of the corresponding angles postulate, the converse of the alternate interior angles theorem, the converse of the same-side interior angles theorem, or the definition of congruent angles?'
            answer: 'the converse of the alternate interior angles theorem'
            answer_contract: {kind: label, options: [['the converse of the corresponding angles postulate'], ['the converse of the alternate interior angles theorem'], ['the converse of the same-side interior angles theorem'], ['the definition of congruent angles']]}
            solution_sketch: 'Congruent alternate interior angles force the lines parallel by the converse of the alternate interior angles theorem.'
          - problem: 'A transversal cuts lines $\ell$ and $m$, and a pair of alternate exterior angles is congruent. Which theorem lets you conclude $\ell \parallel m$: the converse of the alternate exterior angles theorem, the converse of the same-side interior angles theorem, the definition of congruent angles, or the Triangle Angle Sum Theorem?'
            answer: 'the converse of the alternate exterior angles theorem'
            answer_contract: {kind: label, options: [['the converse of the alternate exterior angles theorem'], ['the converse of the same-side interior angles theorem'], ['the definition of congruent angles'], ['the Triangle Angle Sum Theorem']]}
            solution_sketch: 'Congruent alternate exterior angles force the lines parallel by the converse of the alternate exterior angles theorem.'
        constraints: "name the converse matching the given angle pair; answers choose among named theorems via a label contract"
      - id: kp2
        name: Solve for the value that makes lines parallel
        key_prerequisites: [parallel-lines-transversals]
        exemplars:
          - problem: 'Lines $m$ and $n$ are cut by a transversal; alternate interior angles measure $(4x + 12)^\circ$ and $(6x - 20)^\circ$. For what value of $x$ are $m$ and $n$ parallel?'
            answer: "16"
            solution_sketch: 'Parallel iff the alternate interior angles are equal: $4x + 12 = 6x - 20 \Rightarrow x = 16$.'
          - problem: 'Lines $p$ and $q$ are cut by a transversal; same-side interior angles measure $(3x + 25)^\circ$ and $(5x - 45)^\circ$. For what value of $x$ are $p$ and $q$ parallel?'
            answer: "25"
            solution_sketch: 'Parallel iff the pair is supplementary: $8x - 20 = 180 \Rightarrow x = 25$.'
          - problem: 'Lines $m$ and $n$ are cut by a transversal; corresponding angles measure $(7x - 10)^\circ$ and $(5x + 14)^\circ$. For what value of $x$ are $m$ and $n$ parallel?'
            answer: "12"
            solution_sketch: 'Parallel iff the corresponding angles are equal: $7x - 10 = 5x + 14 \Rightarrow 2x = 24 \Rightarrow x = 12$.'
          - problem: 'Lines $p$ and $q$ are cut by a transversal; alternate exterior angles measure $(2x + 35)^\circ$ and $(4x - 15)^\circ$. For what value of $x$ are $p$ and $q$ parallel?'
            answer: "25"
            solution_sketch: 'Parallel iff the alternate exterior angles are equal: $2x + 35 = 4x - 15 \Rightarrow 2x = 50 \Rightarrow x = 25$.'
        constraints: "linear expressions; state whether the pair must be equal or supplementary; integer solutions"
      - id: kp3
        name: Decide from measures whether lines are parallel
        key_prerequisites: [transversal-angle-pairs]
        exemplars:
          - problem: "A transversal cuts lines $a$ and $b$ and forms alternate interior angles of $64^\\circ$ and $64^\\circ$. Determine whether $a$ and $b$ are parallel, and give the verdict together with the positive difference of the two angle measures."
            answer: "verdict = yes; diff = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "Step 1, the converse of the alternate interior angles theorem: lines cut by a transversal are parallel exactly when the alternate interior angles are congruent. Step 2, compare the measures of the angles at lines $a$ and $b$: they are $64^\\circ$ and $64^\\circ$, and $64 - 64 = 0$. Step 3, congruent alternate interior angles force the lines parallel, so the verdict is yes; the wrong verdict no would treat equal measures as insufficient, but the converse makes congruence sufficient. The full answer is verdict = yes; diff = 0."
          - problem: "A transversal cuts lines $p$ and $q$ and forms corresponding angles of $118^\\circ$ and $115^\\circ$. Determine whether $p$ and $q$ are parallel, and give the verdict together with the positive difference of the two angle measures."
            answer: "verdict = no; diff = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "Step 1, the converse of the corresponding angles postulate: the lines are parallel exactly when the corresponding angles are congruent. Step 2, compare the measures at lines $p$ and $q$: they are $118^\\circ$ and $115^\\circ$, and the positive difference is $118 - 115 = 3$. Step 3, the measures differ, so the angles are not congruent and the lines are not parallel; the wrong verdict yes would ignore the missing congruence that the converse requires. The full answer is verdict = no; diff = 3."
          - problem: "A transversal cuts lines $m$ and $n$ and forms same-side interior angles of $105^\\circ$ and $75^\\circ$. Determine whether $m$ and $n$ are parallel, and give the verdict together with the sum of the two angle measures."
            answer: "verdict = yes; sum = 180"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "sum"}]}
            solution_sketch: "Step 1, the converse of the same-side interior angles theorem: the lines are parallel exactly when the same-side interior angles are supplementary. Step 2, add the measures at lines $m$ and $n$: $105 + 75 = 180$, so the angles are supplementary. Step 3, the supplementary condition is exactly what the converse demands, so the lines are parallel; the wrong verdict no would apply the congruence test for alternate angles instead of the supplementary test for same-side angles. The full answer is verdict = yes; sum = 180."
          - problem: "A transversal cuts lines $r$ and $s$ and forms alternate exterior angles of $137^\\circ$ and $139^\\circ$. Determine whether $r$ and $s$ are parallel, and give the verdict together with the positive difference of the two angle measures."
            answer: "verdict = no; diff = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "Step 1, the converse of the alternate exterior angles theorem: the lines are parallel exactly when the alternate exterior angles are congruent. Step 2, compare the measures at lines $r$ and $s$: they are $137^\\circ$ and $139^\\circ$, and the positive difference is $139 - 137 = 2$. Step 3, the measures differ, so the angles are not congruent and the lines are not parallel; the wrong verdict yes would come from confusing the supplementary condition of same-side angles with the congruence condition required here. The full answer is verdict = no; diff = 2."
        constraints: "give the yes/no decision from the given measures via the matching converse; answered yes or no"
    diagnostic_exemplar:
      problem: 'Lines $r$ and $s$ are cut by a transversal; alternate exterior angles measure $(5x - 30)^\circ$ and $(3x + 40)^\circ$. For what value of $x$ are $r$ and $s$ parallel?'
      answer: "35"
      solution_sketch: 'Parallel iff the alternate exterior angles are equal: $5x - 30 = 3x + 40 \Rightarrow x = 35$.'
    anki_seeds:
      - front: "If a transversal makes congruent alternate interior angles with two lines, the lines are..."
        back: "parallel (converse of the alternate interior angles theorem)"
        type: basic
      - front: "To prove lines parallel from same-side interior angles, show the pair..."
