unit: lines-angles
course: geometry
module: "Lines & Angles"
topics:
  - id: points-lines-planes
    name: Points, Lines, and Planes
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.3
        key: true
    knowledge_points:
      - id: kp1
        name: Name points, lines, and planes
        key_prerequisites: []
        exemplars:
          - problem: 'How many distinct lines pass through two distinct points?'
            answer: "1"
            solution_sketch: 'Two distinct points determine exactly one line.'
          - problem: "Four points are given, with no three of them collinear and not all four in one plane. Using the three-point naming convention, how many distinct planes do these points determine?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Naming rule: a plane is named and determined by three non-collinear points. Since no three of the four points are collinear, every choice of three points names a plane, and the number of such choices from four points is 4 choose 3, which is 4. Because the four points do not all lie in one plane, these four triples give four distinct planes. Therefore the answer is 4."
          - problem: 'Three non-collinear points are given. How many distinct lines do they determine?'
            answer: "3"
            solution_sketch: 'Each pair of points determines its own line; with 3 points there are 3 pairs, so 3 lines.'
          - problem: 'Four points are given, with no three of them collinear. How many distinct lines do they determine?'
            answer: "6"
            solution_sketch: 'Every pair of the 4 points determines a distinct line, and there are 6 pairs.'
          - problem: 'How many non-collinear points are needed to name a plane?'
            answer: "3"
            solution_sketch: 'A plane is named by exactly three non-collinear points.'
          - problem: 'How many distinct planes contain a given line and a point not on the line?'
            answer: "1"
            solution_sketch: 'A line and a point not on it determine exactly one plane.'
        constraints: "naming conventions only; two-point line names, three-point plane names"
      - id: kp2
        name: Collinear and coplanar points
        key_prerequisites: []
        exemplars:
          - problem: "Four points are placed so that no three of them lie on one line. How many distinct lines contain at least two of these points?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List the pairs of four points: AB, AC, AD, BC, BD, CD. Because no three points are collinear, each pair gives a different line. By the point-pair rule, each pair determines exactly one line. The number of distinct lines is 6."
          - problem: "Four points are arranged so that no three are collinear and the four points do not all lie in one plane. How many distinct planes contain at least three of these points?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A plane is determined by any three noncollinear points. There are four ways to choose three points from four: ABC, ABD, ACD, BCD. Because the four points are not coplanar, these four planes are distinct. The number of distinct planes is 4."
          - problem: "Three points are given, not all on one line. How many distinct lines contain at least two of these points?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The pairs of three points are AB, AC, and BC. Since the three points are not all on one line, each pair determines a different line. By the point-pair rule, each pair gives exactly one line. The number of distinct lines is 3."
          - problem: 'What is the maximum number of points in which two distinct lines can intersect?'
            answer: "1"
            solution_sketch: 'Two distinct lines share at most one point; sharing two would force them to be the same line.'
          - problem: 'Points $A$, $B$, and $C$ all lie on one line, and point $D$ is not on that line. How many planes contain all four points?'
            answer: "1"
            solution_sketch: 'The line through $A$, $B$, $C$ together with the off-line point $D$ determines exactly one plane.'
          - problem: 'Two distinct lines both pass through the same two points $A$ and $B$. How many distinct lines pass through $A$ and $B$?'
            answer: "1"
            solution_sketch: 'Two points determine exactly one line, so the two lines must actually be the same line.'
          - problem: 'A line that is not contained in a plane intersects the plane. At most how many points do the line and the plane share?'
            answer: "1"
            solution_sketch: 'If a line shared two points with the plane, the whole line would lie in the plane; so at most one.'
          - problem: 'How many distinct planes contain two distinct intersecting lines?'
            answer: "1"
            solution_sketch: 'Two intersecting lines determine exactly one plane.'
          - problem: "Three points have coordinates A(1, 2), B(4, 8), and C(6, 12). State whether the three points are collinear, and if they are, give the slope m of the line through them."
            answer: "verdict = yes; m = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "Compute the slope between each pair of the given coordinate points: slope AB = (8 - 2)/(4 - 1) = 2 and slope BC = (12 - 8)/(6 - 4) = 2. Equal slopes mean all three points lie on one common line, so verdict = yes and the common slope is m = 2. The wrong option no would come from an arithmetic slip in one slope, for example using (12 - 2)/(6 - 1) = 2 for one pair but a different value for the other pair. The answer is verdict = yes; m = 2."
        constraints: "small configurations of 2-4 points/lines; ask collinear/coplanar or intersection counts"
      - id: kp3
        name: Intersections of lines and planes
        key_prerequisites: []
        exemplars:
          - problem: 'A line intersects a plane that does not contain it. In how many points can they meet?'
            answer: "1"
          - problem: 'Two distinct planes are parallel. How many points do they share?'
            answer: "0"
            solution_sketch: 'Parallel planes never meet, so they share no points.'
          - problem: "Three distinct planes are positioned so that every two of them intersect and no two of the pairwise intersection lines coincide. How many distinct lines arise from the pairwise intersections of the planes?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Label the three planes P, Q, and R. By the plane intersection postulate, each pair of distinct intersecting planes, so (P,Q), (P,R), and (Q,R), meets in exactly one line. The number of pairs is 3 x 2 / 2 = 3, so there are 3 pairwise intersection lines. Since no two of these lines coincide, all 3 are distinct. Therefore the answer is 3."
          - problem: 'A line not contained in a plane is parallel to the plane. How many points do the line and the plane share?'
            answer: "0"
            solution_sketch: 'A line parallel to a plane has no points in common with it.'
          - problem: "Planes P and Q are distinct and parallel. A third plane R cuts both P and Q. How many distinct intersection lines does plane R form with P and Q?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full setup is two distinct parallel planes P and Q, both cut by a third plane R. By the plane intersection postulate, R meets P in exactly one line m and R meets Q in exactly one line n. If m and n were the same line, that line would lie in both P and Q, so P and Q would intersect, which is impossible for distinct parallel planes. Hence m and n are distinct lines, and R forms exactly two intersection lines. Therefore the answer is 2."
          - problem: "Four distinct planes are positioned so that every two of them intersect and no two of the pairwise intersection lines coincide. How many distinct lines arise from the pairwise intersections of the planes?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Label the four planes P, Q, R, and S. By the plane intersection postulate, each pair of distinct intersecting planes meets in exactly one line. The number of pairs of planes is 4 x 3 / 2 = 6, so there are 6 pairwise intersection lines in total. Since no two of these lines coincide, all 6 are distinct. Therefore the answer is 6."
          - problem: 'Two distinct planes intersect. How many lines do they share?'
            answer: "1"
            solution_sketch: 'Intersecting planes meet in exactly one line.'
          - problem: "Three distinct planes pairwise intersect in three distinct lines, and these three lines are parallel. How many points do all three planes have in common?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Label the three planes P, Q, and R, with pairwise intersection lines from (P,Q), (P,R), and (Q,R). A point shared by all three planes would lie in every pair of planes, so it would lie on at least two of the three intersection lines. But distinct parallel lines never meet, so no point can lie on two of them. Hence no point lies in all three planes. Therefore the answer is 0."
          - problem: 'Three distinct planes all contain a common line. How many distinct lines are formed by all their pairwise intersections?'
            answer: "1"
            solution_sketch: 'Any two of the planes intersect in the same common line, so only one line arises.'
        constraints: "postulate-level facts; no coordinates required"
    diagnostic_exemplar:
      problem: 'State the number of distinct lines through two distinct points, and the figure in which two distinct intersecting planes meet.'
      answer: 'Exactly one line; the planes meet in a line.'
      answer_contract: {kind: none}
      solution_sketch: 'These are the incidence postulates: two distinct points determine exactly one line, and two distinct planes that meet intersect in a line — never in a single point.'
    anki_seeds:
      - front: "Through any two distinct points there is exactly..."
        back: "one line"
        type: basic
      - front: "Two distinct intersecting planes intersect in a..."
        back: "line"
        type: basic

  - id: measuring-segments-angles
    name: Measuring Segments and Angles
    core: true
    difficulty: 0.18
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: points-lines-planes
        weight: 0.5
        key: false
      - id: one-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Segment addition with numbers
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Point $B$ lies on $\overline{AC}$ with $AB = 7$ and $BC = 12$. Find $AC$.'
            answer: "19"
            solution_sketch: '$AC = AB + BC = 7 + 12 = 19$.'
          - problem: 'Point $M$ lies on $\overline{PQ}$ with $PQ = 30$ and $PM = 13$. Find $MQ$.'
            answer: "17"
            solution_sketch: '$MQ = PQ - PM = 30 - 13 = 17$.'
          - problem: 'On a number line, $A$ has coordinate $-3$ and $B$ has coordinate $8$. Find $AB$.'
            answer: "11"
            solution_sketch: '$AB = |8 - (-3)| = 11$.'
          - problem: 'On a number line, $C$ has coordinate $-7$ and $D$ has coordinate $9$. Find $CD$.'
            answer: "16"
            solution_sketch: '$CD = |9 - (-7)| = 16$.'
        constraints: "integer lengths 1-50; point always between the endpoints; ruler-postulate items use coordinates between -20 and 20"
      - id: kp2
        name: Angle addition with numbers
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. If $m\angle AOB = 34^\circ$ and $m\angle BOC = 51^\circ$, find $m\angle AOC$ in degrees.'
            answer: "85"
            solution_sketch: '$m\angle AOC = 34^\circ + 51^\circ = 85^\circ$.'
          - problem: 'Ray $\overrightarrow{QR}$ lies in the interior of $\angle PQS$. If $m\angle PQS = 110^\circ$ and $m\angle PQR = 45^\circ$, find $m\angle RQS$ in degrees.'
            answer: "65"
            solution_sketch: '$m\angle RQS = 110^\circ - 45^\circ = 65^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. If $m\angle AOB = 27^\circ$ and $m\angle BOC = 48^\circ$, find $m\angle AOC$ in degrees.'
            answer: "75"
            solution_sketch: '$m\angle AOC = 27^\circ + 48^\circ = 75^\circ$.'
          - problem: 'Ray $\overrightarrow{YM}$ lies in the interior of $\angle XYZ$. If $m\angle XYZ = 140^\circ$ and $m\angle XYM = 62^\circ$, find $m\angle MYZ$ in degrees.'
            answer: "78"
            solution_sketch: '$m\angle MYZ = 140^\circ - 62^\circ = 78^\circ$.'
        constraints: "whole-degree measures; totals stay below 180 degrees"
      - id: kp3
        name: Classify angles by measure
        key_prerequisites: []
        exemplars:
          - problem: 'Classify a $134^\circ$ angle as acute, right, obtuse, or straight.'
            answer: 'obtuse'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: '$90 < 134 < 180$, so the angle is obtuse.'
          - problem: 'Classify a $90^\circ$ angle as acute, right, obtuse, or straight.'
            answer: 'right'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'A right angle measures exactly $90^\circ$.'
          - problem: 'Is a $72^\circ$ angle acute? Answer yes or no.'
            answer: "yes"
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'An acute angle measures less than $90^\circ$, and $72 < 90$, so yes.'
          - problem: 'Is a $95^\circ$ angle acute? Answer yes or no.'
            answer: "no"
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: '$95 > 90$, so the angle is obtuse, not acute.'
          - problem: 'A straight angle has what measure in degrees?'
            answer: "180"
            solution_sketch: 'A straight angle measures exactly $180^\circ$.'
          - problem: 'An angle exceeds a right angle by $50^\circ$. Find its measure in degrees.'
            answer: "140"
            solution_sketch: '$90^\circ + 50^\circ = 140^\circ$ (an obtuse angle).'
        constraints: "measures between 1 and 180 degrees; the four standard classes"
    diagnostic_exemplar:
      problem: 'Point $X$ lies on $\overline{WY}$ with $WY = 41$ and $WX = 18$. Find $XY$.'
      answer: "23"
      solution_sketch: '$XY = WY - WX = 41 - 18 = 23$.'
    anki_seeds:
      - front: "An angle measuring more than 90 but less than 180 degrees is..."
        back: "obtuse"
        type: basic
      - front: "On a number line, the distance between coordinates a and b is..."
        back: "|a - b|"
        type: basic

  - id: segment-angle-addition
    name: Segment and Angle Addition
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: measuring-segments-angles
        weight: 0.7
        key: true
      - id: one-step-equations
        weight: 0.5
        key: false
      - id: evaluating-expressions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Set up an equation from a segment diagram
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: 'Point $B$ lies on $\overline{AC}$ with $AB = 2x + 3$, $BC = 3x - 1$, and $AC = 22$. Find $x$.'
            answer: "4"
            solution_sketch: '$(2x+3) + (3x-1) = 22 \Rightarrow 5x + 2 = 22 \Rightarrow x = 4$.'
          - problem: 'Point $N$ lies on $\overline{RS}$ with $RN = 4x - 3$, $NS = 2x + 9$, and $RS = 42$. Find $RN$.'
            answer: "21"
            solution_sketch: '$6x + 6 = 42 \Rightarrow x = 6$, so $RN = 4(6) - 3 = 21$.'
          - problem: 'Point $C$ lies on $\overline{AD}$ with $AC = 5x - 2$, $CD = x + 4$, and $AD = 26$. Find $CD$.'
            answer: "8"
            solution_sketch: '$(5x - 2) + (x + 4) = 26 \Rightarrow 6x + 2 = 26 \Rightarrow x = 4$, so $CD = 4 + 4 = 8$.'
          - problem: 'Point $B$ lies on $\overline{AC}$ with $AB = 3x + 1$ and $BC = 2x + 4$. If $AB = BC$, find $AC$.'
            answer: "20"
            solution_sketch: '$3x + 1 = 2x + 4 \Rightarrow x = 3$, so each part is $10$ and $AC = 20$.'
        constraints: "linear expressions with integer solutions; lengths come out positive"
      - id: kp2
        name: Midpoint and segment bisector equations
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: '$M$ is the midpoint of $\overline{AB}$, with $AM = 3x - 5$ and $MB = x + 9$. Find $AB$.'
            answer: "32"
            solution_sketch: '$3x - 5 = x + 9 \Rightarrow x = 7$, so $AM = 16$ and $AB = 2 \cdot 16 = 32$.'
          - problem: 'Segment $\overline{XY}$ is bisected at $T$, with $XT = 4x + 1$ and $XY = 10x - 6$. Find $XY$.'
            answer: "34"
            solution_sketch: '$2(4x + 1) = 10x - 6 \Rightarrow 8x + 2 = 10x - 6 \Rightarrow x = 4$; $XY = 10(4) - 6 = 34$.'
          - problem: '$M$ is the midpoint of $\overline{PQ}$, with $PM = 5x - 7$ and $MQ = 3x + 1$. Find $PQ$.'
            answer: "26"
            solution_sketch: '$5x - 7 = 3x + 1 \Rightarrow x = 4$, so $PM = 13$ and $PQ = 2 \cdot 13 = 26$.'
          - problem: 'Segment $\overline{AB}$ is bisected at $M$, with $AM = 3x + 2$ and $AB = 10x - 12$. Find $AM$.'
            answer: "14"
            solution_sketch: '$2(3x + 2) = 10x - 12 \Rightarrow 6x + 4 = 10x - 12 \Rightarrow x = 4$, so $AM = 14$.'
        constraints: "the relation 2(half) = whole; integer solutions; positive lengths"
      - id: kp3
        name: Angle addition equations
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. If $m\angle AOB = (2x + 5)^\circ$, $m\angle BOC = (3x - 10)^\circ$, and $m\angle AOC = 70^\circ$, find $m\angle AOB$ in degrees.'
            answer: "35"
            solution_sketch: '$5x - 5 = 70 \Rightarrow x = 15$; $m\angle AOB = 2(15) + 5 = 35^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$ with $m\angle AOB = (4x - 6)^\circ$ and $m\angle BOC = (2x + 18)^\circ$. Find $m\angle AOC$ in degrees.'
            answer: "84"
            solution_sketch: '$4x - 6 = 2x + 18 \Rightarrow x = 12$; each half is $42^\circ$, so $m\angle AOC = 84^\circ$.'
          - problem: 'Ray $\overrightarrow{OD}$ lies in the interior of $\angle COE$. If $m\angle COD = (3x + 7)^\circ$, $m\angle DOE = (2x - 2)^\circ$, and $m\angle COE = 85^\circ$, find $m\angle DOE$ in degrees.'
            answer: "30"
            solution_sketch: '$5x + 5 = 85 \Rightarrow x = 16$; $m\angle DOE = 2(16) - 2 = 30^\circ$.'
          - problem: 'Ray $\overrightarrow{OQ}$ bisects $\angle MON$ with $m\angle MOQ = (5x + 3)^\circ$ and $m\angle QON = (3x + 19)^\circ$. Find $m\angle MON$ in degrees.'
            answer: "86"
            solution_sketch: '$5x + 3 = 3x + 19 \Rightarrow x = 8$; each half is $43^\circ$, so $m\angle MON = 86^\circ$.'
        constraints: "linear expressions; whole-degree answers; totals below 180 degrees"
    diagnostic_exemplar:
      problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, with $m\angle AOB = (3x + 4)^\circ$ and $m\angle AOC = (8x - 12)^\circ$. Find $m\angle AOC$, in degrees.'
      answer: '68'
      solution_sketch: 'The bisector gives $2(3x + 4) = 8x - 12$, so $6x + 8 = 8x - 12$ and $x = 10$; then $m\angle AOB = 34^\circ$ and $m\angle AOC = 68^\circ$.'
    anki_seeds:
      - front: "Segment addition postulate: if B is between A and C, then AB + BC = ..."
        back: "AC"
        type: basic
      - front: "The midpoint of a segment divides it into two segments that are..."
        back: "congruent (each half the original length)"
        type: basic

  - id: complementary-supplementary-angles
    name: Complementary and Supplementary Angles
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: measuring-segments-angles
        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Complements
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'Find the complement of a $37^\circ$ angle (in degrees).'
            answer: "53"
            solution_sketch: '$90 - 37 = 53$.'
          - problem: 'Find the complement of a $62^\circ$ angle (in degrees).'
            answer: "28"
            solution_sketch: '$90 - 62 = 28$.'
          - problem: 'Two angles are complementary. One measures $18^\circ$. Find the other angle in degrees.'
            answer: "72"
            solution_sketch: '$90 - 18 = 72$.'
          - problem: 'Find the complement of an $81^\circ$ angle (in degrees).'
            answer: "9"
            solution_sketch: '$90 - 81 = 9$.'
        constraints: "whole-degree acute angles"
      - id: kp2
        name: Supplements
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'Find the supplement of a $104^\circ$ angle (in degrees).'
            answer: "76"
            solution_sketch: '$180 - 104 = 76$.'
          - problem: 'Find the supplement of a $45^\circ$ angle (in degrees).'
            answer: "135"
            solution_sketch: '$180 - 45 = 135$.'
          - problem: 'Two angles are supplementary. One measures $87^\circ$. Find the other angle in degrees.'
            answer: "93"
            solution_sketch: '$180 - 87 = 93$.'
          - problem: 'Find the supplement of a $148^\circ$ angle (in degrees).'
            answer: "32"
            solution_sketch: '$180 - 148 = 32$.'
        constraints: "whole-degree angles between 1 and 179 degrees"
      - id: kp3
        name: Self-referential complements and supplements
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'An angle equals its own complement. What is its measure in degrees?'
            answer: "45"
            solution_sketch: '$x = 90 - x \Rightarrow x = 45$.'
          - problem: 'An angle equals its own supplement. What is its measure in degrees?'
            answer: "90"
            solution_sketch: '$x = 180 - x \Rightarrow x = 90$.'
          - problem: 'An angle is $30^\circ$ more than its complement. Find the angle in degrees.'
            answer: "60"
            solution_sketch: '$x = (90 - x) + 30 \Rightarrow 2x = 120 \Rightarrow x = 60$.'
          - problem: 'An angle is twice its supplement. Find the angle in degrees.'
            answer: "120"
            solution_sketch: '$x = 2(180 - x) \Rightarrow 3x = 360 \Rightarrow x = 120$.'
        constraints: "short linear equation setups (collect x, then divide)"
    diagnostic_exemplar:
      problem: 'An angle is twice its complement. Find the supplement of that angle, in degrees.'
      answer: '120'
      solution_sketch: '$x = 2(90 - x)$ gives $3x = 180$, so the angle is $60^\circ$; its supplement is $180 - 60 = 120^\circ$.'
    anki_seeds:
      - front: "Complementary angles sum to..."
        back: "90 degrees"
        type: basic
      - front: "Supplementary angles sum to..."
        back: "180 degrees"
        type: basic

  - id: angle-relationships
    name: Angle Pair Relationships
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: complementary-supplementary-angles
        weight: 0.7
        key: true
      - id: segment-angle-addition
        weight: 0.5
        key: false
      - id: two-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Vertical angles and linear pairs
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Two lines intersect. One angle measures $118^\circ$. What is the measure of its vertical angle, in degrees?'
            answer: "118"
            solution_sketch: 'Vertical angles are congruent, so the vertical angle also measures $118^\circ$.'
          - problem: 'Two angles form a linear pair and measure $(3x + 10)^\circ$ and $(2x + 20)^\circ$. Find $x$.'
            answer: "30"
            solution_sketch: '$5x + 30 = 180 \Rightarrow x = 30$ (angles $100^\circ$ and $80^\circ$).'
          - problem: 'Two lines intersect. One angle measures $57^\circ$. What is the measure of the angle adjacent to it (its linear-pair partner), in degrees?'
            answer: "123"
            solution_sketch: 'A linear pair sums to $180^\circ$: $180 - 57 = 123$.'
          - problem: 'Two angles form a linear pair and measure $(4x + 15)^\circ$ and $(3x + 25)^\circ$. Find the larger of the two angles, in degrees.'
            answer: "95"
            solution_sketch: '$7x + 40 = 180 \Rightarrow x = 20$; the angles are $95^\circ$ and $85^\circ$, so the larger is $95^\circ$.'
        constraints: "vertical angles congruent; linear pairs sum to 180; integer solutions"
      - id: kp2
        name: Equations from complement and supplement conditions
        key_prerequisites: [two-step-equations, complementary-supplementary-angles]
        exemplars:
          - problem: 'An angle measures $24^\circ$ more than its complement. Find the angle, in degrees.'
            answer: "57"
            solution_sketch: '$x = (90 - x) + 24 \Rightarrow 2x = 114 \Rightarrow x = 57$.'
          - problem: 'An angle is twice its supplement. Find the angle, in degrees.'
            answer: "120"
            solution_sketch: '$x = 2(180 - x) \Rightarrow 3x = 360 \Rightarrow x = 120$.'
          - problem: 'An angle measures $18^\circ$ less than its supplement. Find the angle, in degrees.'
            answer: "81"
            solution_sketch: '$x = (180 - x) - 18 \Rightarrow 2x = 162 \Rightarrow x = 81$.'
          - problem: 'An angle is half its complement. Find the angle, in degrees.'
            answer: "30"
            solution_sketch: '$x = \frac{1}{2}(90 - x) \Rightarrow 2x = 90 - x \Rightarrow 3x = 90 \Rightarrow x = 30$.'
        constraints: "one linear condition relating an angle to its complement or supplement; integer answers"
      - id: kp3
        name: Vertical-angle equations and angles at a point
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Two vertical angles measure $(7x - 8)^\circ$ and $(5x + 16)^\circ$. Find the measure of each, in degrees.'
            answer: "76"
            solution_sketch: 'Vertical angles are equal: $7x - 8 = 5x + 16 \Rightarrow x = 12$; each is $76^\circ$.'
          - problem: 'Four angles around a point measure $x^\circ$, $(2x)^\circ$, $(3x)^\circ$, and $(4x)^\circ$. Find the largest, in degrees.'
            answer: "144"
            solution_sketch: '$10x = 360 \Rightarrow x = 36$; largest is $4x = 144^\circ$.'
          - problem: 'Two vertical angles measure $(9x - 5)^\circ$ and $(4x + 40)^\circ$. Find the measure of each, in degrees.'
            answer: "76"
            solution_sketch: 'Vertical angles are equal: $9x - 5 = 4x + 40 \Rightarrow 5x = 45 \Rightarrow x = 9$; each measures $76^\circ$.'
          - problem: 'Three angles around a point measure $(2x)^\circ$, $(3x)^\circ$, and $(3x)^\circ$. Find the largest, in degrees.'
            answer: "135"
            solution_sketch: '$8x = 360 \Rightarrow x = 45$; the largest is $3x = 135^\circ$.'
        constraints: "angles at a point sum to 360; vertical pairs equal; integer solutions"
    diagnostic_exemplar:
      problem: 'Two vertical angles measure $(5x - 12)^\circ$ and $(3x + 8)^\circ$. Find the measure of an angle that forms a linear pair with them, in degrees.'
      answer: '142'
      solution_sketch: 'Vertical angles are congruent: $5x - 12 = 3x + 8$ gives $x = 10$, so each measures $38^\circ$; the linear-pair partner is $180 - 38 = 142^\circ$.'
    anki_seeds:
      - front: "Vertical angles are always..."
        back: "congruent"
        type: basic
      - front: "A linear pair of angles is..."
        back: "supplementary (sums to 180 degrees)"
        type: basic
      - front: "The angles around a point sum to..."
        back: "360 degrees"
        type: basic

  - id: angle-bisectors
    name: Angle Bisectors
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: angle-relationships
        weight: 0.6
        key: true
      - id: segment-angle-addition
        weight: 0.5
        key: false
      - id: two-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: A bisector halves the angle
        key_prerequisites: [segment-angle-addition]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$ and $m\angle AOC = 84^\circ$. Find $m\angle AOB$, in degrees.'
            answer: "42"
            solution_sketch: 'The bisector halves the angle: $84 / 2 = 42$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$ and $m\angle AOB = 31^\circ$. Find $m\angle AOC$, in degrees.'
            answer: "62"
            solution_sketch: 'The bisector makes two equal halves: $m\angle AOC = 2 \cdot 31 = 62^\circ$.'
          - problem: 'Ray $\overrightarrow{OM}$ bisects $\angle BOD$ and $m\angle BOD = 126^\circ$. Find $m\angle BOM$, in degrees.'
            answer: "63"
            solution_sketch: 'Halve the whole angle: $126 / 2 = 63$.'
          - problem: 'Ray $\overrightarrow{KT}$ bisects $\angle JKL$ and $m\angle JKT = 44^\circ$. Find $m\angle JKL$, in degrees.'
            answer: "88"
            solution_sketch: 'The whole angle is twice a half: $2 \cdot 44 = 88$.'
        constraints: "even whole angles so halves are whole degrees"
      - id: kp2
        name: Bisector equations with variables
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$; $m\angle AOB = (3x + 4)^\circ$ and $m\angle BOC = (5x - 12)^\circ$. Find $m\angle AOC$, in degrees.'
            answer: "56"
            solution_sketch: '$3x + 4 = 5x - 12 \Rightarrow x = 8$; each half is $28^\circ$, so $m\angle AOC = 56^\circ$.'
          - problem: 'Ray $\overrightarrow{QS}$ bisects $\angle PQR$; $m\angle PQS = (2x + 7)^\circ$ and $m\angle PQR = (6x - 10)^\circ$. Find $m\angle PQR$, in degrees.'
            answer: "62"
            solution_sketch: '$2(2x + 7) = 6x - 10 \Rightarrow 4x + 14 = 6x - 10 \Rightarrow x = 12$; $m\angle PQR = 62^\circ$.'
          - problem: 'Ray $\overrightarrow{OQ}$ bisects $\angle MON$; $m\angle MOQ = (4x + 3)^\circ$ and $m\angle QON = (6x - 11)^\circ$. Find $m\angle MON$, in degrees.'
            answer: "62"
            solution_sketch: '$4x + 3 = 6x - 11 \Rightarrow x = 7$; each half is $31^\circ$, so $m\angle MON = 62^\circ$.'
          - problem: 'Ray $\overrightarrow{BD}$ bisects $\angle ABC$; $m\angle ABD = (3x + 1)^\circ$ and $m\angle ABC = (8x - 14)^\circ$. Find $m\angle ABC$, in degrees.'
            answer: "50"
            solution_sketch: '$2(3x + 1) = 8x - 14 \Rightarrow 6x + 2 = 8x - 14 \Rightarrow x = 8$; $m\angle ABC = 50^\circ$.'
        constraints: "set the halves equal, or 2(half) = whole; integer solutions"
      - id: kp3
        name: Bisectors combined with other angle relationships
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: '$\angle AOC$ and $\angle COD$ form a linear pair with $m\angle COD = 48^\circ$. Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Find $m\angle AOB$, in degrees.'
            answer: "66"
            solution_sketch: '$m\angle AOC = 180 - 48 = 132^\circ$; half of that is $66^\circ$.'
          - problem: '$m\angle AOB = 88^\circ$. Ray $\overrightarrow{OC}$ bisects $\angle AOB$, and ray $\overrightarrow{OD}$ bisects $\angle AOC$. Find $m\angle AOD$, in degrees.'
            answer: "22"
            solution_sketch: '$m\angle AOC = 44^\circ$; bisecting again gives $22^\circ$.'
          - problem: '$\angle PQR$ and $\angle RQS$ form a linear pair with $m\angle PQR = 112^\circ$. Ray $\overrightarrow{QT}$ bisects $\angle RQS$. Find $m\angle RQT$, in degrees.'
            answer: "34"
            solution_sketch: '$m\angle RQS = 180 - 112 = 68^\circ$; half of that is $34^\circ$.'
          - problem: '$m\angle AOB = 96^\circ$. Ray $\overrightarrow{OC}$ bisects $\angle AOB$, and ray $\overrightarrow{OD}$ bisects $\angle BOC$. Find $m\angle BOD$, in degrees.'
            answer: "24"
            solution_sketch: '$m\angle BOC = 48^\circ$; bisecting again gives $24^\circ$.'
        constraints: "at most two steps: one linear pair/supplement step plus one or two halvings"
    diagnostic_exemplar:
      problem: '$\angle AOC$ and $\angle COD$ form a linear pair, with $m\angle AOC = (6x + 20)^\circ$ and $m\angle COD = (4x)^\circ$. Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Find $m\angle AOB$, in degrees.'
      answer: '58'
      solution_sketch: '$(6x + 20) + 4x = 180$ gives $x = 16$, so $m\angle AOC = 116^\circ$ and the bisector halves it: $m\angle AOB = 58^\circ$.'
    anki_seeds:
      - front: "An angle bisector divides an angle into..."
        back: "two congruent angles"
        type: basic

  - id: perpendicular-bisectors
    name: Perpendicular Lines and Perpendicular Bisectors
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: segment-angle-addition
        weight: 0.5
        key: true
      - id: angle-relationships
        weight: 0.5
        key: false
      - id: two-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Perpendicularity and the bisected segment
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Two perpendicular lines intersect. What is the measure of each angle they form, in degrees?'
            answer: "90"
            solution_sketch: 'Perpendicular lines meet at right angles, so every angle formed is $90^\circ$.'
          - problem: 'Line $\ell$ is the perpendicular bisector of $\overline{XY}$, meeting it at $M$. If $XY = 26$, find $XM$.'
            answer: "13"
            solution_sketch: 'The bisector cuts the segment in half: $26/2 = 13$.'
          - problem: 'Line $\ell$ is the perpendicular bisector of $\overline{CD}$, meeting it at $N$. If $CD = 42$, find $ND$.'
            answer: "21"
            solution_sketch: 'The bisector cuts the segment in half: $42/2 = 21$.'
          - problem: '$\overline{PQ}$ has midpoint $M$, and the line through $M$ perpendicular to $\overline{PQ}$ is drawn. If $MQ = 9$, find $PQ$.'
            answer: "18"
            solution_sketch: '$M$ is the midpoint, so $PQ = 2 \cdot 9 = 18$.'
        constraints: "even segment lengths; right angles stated in whole degrees"
      - id: kp2
        name: Equidistance from the endpoints
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$ and $PA = 17$. Find $PB$.'
            answer: "17"
            solution_sketch: 'Every point on the perpendicular bisector is equidistant from the endpoints.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$ with $PA = 3x + 5$ and $PB = 5x - 9$. Find $PA$.'
            answer: "26"
            solution_sketch: '$3x + 5 = 5x - 9 \Rightarrow x = 7$; $PA = 3(7) + 5 = 26$.'
          - problem: 'Point $R$ lies on the perpendicular bisector of $\overline{ST}$ and $RT = 23$. Find $RS$.'
            answer: "23"
            solution_sketch: 'Every point on the perpendicular bisector is equidistant from the endpoints, so $RS = RT = 23$.'
          - problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$ with $PA = 4x + 1$ and $PB = 7x - 11$. Find $PB$.'
            answer: "17"
            solution_sketch: '$4x + 1 = 7x - 11 \Rightarrow x = 4$; $PB = 7(4) - 11 = 17$.'
        constraints: "equidistance theorem; linear expressions with integer solutions"
      - id: kp3
        name: Equations through the midpoint or the right angle
        key_prerequisites: [two-step-equations, segment-angle-addition]
        exemplars:
          - problem: 'The perpendicular bisector of $\overline{AB}$ meets it at $M$. If $AB = 4x + 2$ and $AM = 15$, find $x$.'
            answer: "7"
            solution_sketch: '$AB = 2 \cdot AM = 30$, so $4x + 2 = 30 \Rightarrow x = 7$.'
          - problem: 'Line $m \perp$ line $n$, and one of the angles they form measures $(3x + 18)^\circ$. Find $x$.'
            answer: "24"
            solution_sketch: 'Perpendicular lines form right angles: $3x + 18 = 90 \Rightarrow x = 24$.'
          - problem: 'The perpendicular bisector of $\overline{XY}$ meets it at $M$. If $XY = 5x + 4$ and $XM = 7$, find $x$.'
            answer: "2"
            solution_sketch: '$XY = 2 \cdot XM = 14$, so $5x + 4 = 14 \Rightarrow x = 2$.'
          - problem: 'Line $m \perp$ line $n$, and one of the angles they form measures $(7x + 6)^\circ$. Find $x$.'
            answer: "12"
            solution_sketch: 'Perpendicular lines form right angles: $7x + 6 = 90 \Rightarrow x = 12$.'
        constraints: "one linear equation from the midpoint relation or the 90-degree condition"
    diagnostic_exemplar:
      problem: 'Point $P$ lies on the perpendicular bisector of $\overline{AB}$ with $PA = 2x + 9$ and $PB = 4x - 7$. Find $PA$.'
      answer: "25"
      solution_sketch: '$2x + 9 = 4x - 7 \Rightarrow x = 8$; $PA = 25$.'
    anki_seeds:
      - front: "Any point on the perpendicular bisector of a segment is equidistant from..."
        back: "the segment's endpoints"
        type: basic
      - front: "Perpendicular lines meet at angles of..."
        back: "90 degrees"
        type: basic

  - id: transversal-angle-pairs
    name: Transversal Angle Pairs
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: angle-relationships
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Name the angle pair
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'A transversal crosses two lines. Two angles lie between the lines on opposite sides of the transversal. What is this pair called?'
            answer: 'alternate interior angles'
            answer_contract: {kind: label, options: [[corresponding angles], [alternate interior angles], [alternate exterior angles], [same-side (co-interior) interior angles]]}
            solution_sketch: 'Between the lines and on opposite sides is the definition of alternate interior angles.'
          - problem: 'A transversal crosses two lines. Two angles occupy the same corner position at each intersection (same side of the transversal, same side of each line). What is this pair called?'
            answer: 'corresponding angles'
            answer_contract: {kind: label, options: [[corresponding angles], [alternate interior angles], [alternate exterior angles], [same-side (co-interior) interior angles]]}
            solution_sketch: 'Matching corner positions at the two intersections are corresponding angles.'
          - problem: 'A transversal crosses two lines. Two angles lie between the lines on the same side of the transversal. What is this pair called?'
            answer: 'same-side (co-interior) interior angles'
            answer_contract: {kind: label, options: [[corresponding angles], [alternate interior angles], [alternate exterior angles], [same-side (co-interior) interior angles]]}
            solution_sketch: 'Between the lines and on the same side is the definition of same-side interior angles.'
          - problem: 'A transversal crosses two lines. Two angles lie outside the two lines on opposite sides of the transversal. What is this pair called?'
            answer: 'alternate exterior angles'
            answer_contract: {kind: label, options: [[corresponding angles], [alternate interior angles], [alternate exterior angles], [same-side (co-interior) interior angles]]}
            solution_sketch: 'Outside the lines and on opposite sides is the definition of alternate exterior angles.'
        constraints: "pairs limited to corresponding, alternate interior, alternate exterior, same-side interior"
      - id: kp2
        name: Compute congruent pairs with parallel lines
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Parallel lines are cut by a transversal. One angle measures $65^\circ$. Find its alternate interior angle, in degrees.'
            answer: "65"
            solution_sketch: 'With parallel lines, alternate interior angles are congruent, so the answer is $65$.'
          - problem: 'Parallel lines are cut by a transversal. One angle measures $132^\circ$. Find its corresponding angle, in degrees.'
            answer: "132"
            solution_sketch: 'With parallel lines, corresponding angles are congruent.'
          - problem: 'Parallel lines are cut by a transversal. One angle measures $47^\circ$. Find its alternate exterior angle, in degrees.'
            answer: "47"
            solution_sketch: 'Alternate exterior angles are congruent when the lines are parallel.'
          - problem: 'Parallel lines are cut by a transversal. One angle measures $154^\circ$. Find the corresponding angle at the other intersection, in degrees.'
            answer: "154"
            solution_sketch: 'With parallel lines, corresponding angles are congruent: $154$.'
        constraints: "whole-degree angles; congruent pairs: corresponding, alternate interior, alternate exterior"
      - id: kp3
        name: Compute supplementary pairs with parallel lines
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: 'Parallel lines are cut by a transversal. One same-side (co-interior) interior angle measures $112^\circ$. Find the other, in degrees.'
            answer: "68"
            solution_sketch: 'Same-side interior angles are supplementary: $180 - 112 = 68$.'
          - problem: 'Parallel lines are cut by a transversal, and one exterior angle measures $48^\circ$. Find the measure of the same-side exterior angle paired with it, in degrees.'
            answer: "132"
            solution_sketch: 'Same-side exterior angles are supplementary: $180 - 48 = 132$.'
          - problem: 'Parallel lines are cut by a transversal. One angle measures $145^\circ$. Find its same-side interior partner, in degrees.'
            answer: "35"
            solution_sketch: 'Same-side interior angles are supplementary: $180 - 145 = 35$.'
          - problem: 'Parallel lines are cut by a transversal. One interior angle measures $97^\circ$. Find the same-side interior angle paired with it, in degrees.'
            answer: "83"
            solution_sketch: 'Same-side interior angles sum to $180$: $180 - 97 = 83$.'
        constraints: "supplementary pairs: same-side interior, same-side exterior; whole-degree angles"
    diagnostic_exemplar:
      problem: 'Parallel lines are cut by a transversal. One interior angle measures $73^\circ$. Find its same-side interior partner, in degrees.'
      answer: "107"
      solution_sketch: 'Same-side interior angles are supplementary: $180 - 73 = 107$.'
    anki_seeds:
      - front: "With parallel lines, alternate interior angles are..."
        back: "congruent"
        type: basic
      - front: "With parallel lines, same-side (co-interior) interior angles are..."
        back: "supplementary (sum to 180 degrees)"
        type: basic
      - front: "With parallel lines, corresponding angles are..."
        back: "congruent"
        type: basic

  - id: parallel-lines-transversals
