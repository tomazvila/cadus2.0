unit: lines-angles
course: geometry
module: "Lines & Angles"
topics:
  - id: points-lines-planes
    name: Points, Lines, and Planes
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.3
        key: true
    knowledge_points:
      - id: kp1
        name: Name points, lines, and planes
        key_prerequisites: []
        exemplars:
          - problem: 'Points $A$, $B$, and $C$ do not lie on one line. The plane through them can be named by listing the three letters in any order. How many different names does the plane have?'
            answer_contract: {"kind": "exact"}
            answer: '6'
            solution_sketch: 'Any of the 3 letters can come first, then either of the 2 remaining letters, then the last one. That gives $3 \cdot 2 \cdot 1 = 6$ different names, such as plane $ABC$ and plane $CAB$.'
          - problem: 'The line through points $P$ and $Q$ is named by listing both letters. How many different two-letter names does the line have?'
            answer_contract: {"kind": "exact"}
            answer: '2'
            solution_sketch: 'The letters can be listed as $PQ$ or as $QP$, and both names label the same line. So the line has 2 different two-letter names.'
          - problem: 'A surveyor sets the three feet of a tripod at points $X$, $Y$, and $Z$ on uneven ground, not in one straight row. How many planes contain all three feet?'
            answer_contract: {"kind": "exact"}
            answer: '1'
            solution_sketch: 'Three points that are not in one row lie in exactly one plane. This is why a tripod stands firm on any ground, while a four-legged table may wobble. So there is 1 plane.'
          - problem: 'The four corners $A$, $B$, $C$, and $D$ of a flat rectangular garden bed lie in one plane, with no three of them in a row. How many different sets of three corner letters name the plane of the bed?'
            answer_contract: {"kind": "exact"}
            answer: '4'
            solution_sketch: 'Each set of three corners names the plane, and a set is fixed by the one corner left out. There are 4 corners, so there are 4 different sets of three letters.'
          - problem: 'Points $A$, $B$, $C$, and $D$ lie on one straight line. How many different lines do the names line $AB$, line $CD$, line $BD$, and line $AC$ label together?'
            answer_contract: {"kind": "exact"}
            answer: '1'
            solution_sketch: 'Two points determine exactly one line, and all four points lie on the same line. So every one of the four names labels that single line, and the answer is 1.'
          - problem: 'Three of the four points on a flat map are $A$, $B$, and $C$, and they do not lie on one line. Which fact justifies the claim that the name plane $ABC$ labels only one plane?'
            answer_contract: {"kind": "label", "options": [["two points determine a line", "a line through two points is unique", "two points determine exactly one line", "through two points there is exactly one line", "two points determine one line", "line postulate"], ["three points determine a plane", "three noncollinear points determine a plane", "three non-collinear points determine a plane", "three points fix one plane", "three points determine one plane", "three noncollinear points determine one plane", "plane postulate"], ["two planes meet in a line", "intersecting planes meet in a line", "two planes intersect in a line", "the intersection of two planes is a line", "plane intersection postulate"], ["the line lies in the plane", "a line through two points of a plane lies in it", "a line with two points in a plane lies in the plane", "if two points of a line are in a plane, the line is in the plane", "flat plane postulate", "line in a plane postulate"]]}
            answer: 'three points determine a plane'
            solution_sketch: 'Three points that are not on one line fix exactly one plane. Because of this, the name plane $ABC$ cannot label two different planes.'
          - problem: 'How many lines pass through the points $A$ and $B$, if line $AB$ and line $BA$ are counted as different lines?'
            answer_contract: {"kind": "exact"}
            answer: '1'
            solution_sketch: 'The names line $AB$ and line $BA$ list the same two points in a different order, so they label the same line. Two points determine exactly one line, so the answer is 1.'
        constraints: 'naming conventions, how many names or lines a figure has, and the fact behind plane names; two-point line names, three-point plane names'
      - id: kp2
        name: Collinear and coplanar points
        key_prerequisites: []
        exemplars:
          - problem: 'Four points $A$, $B$, $C$, and $D$ are placed so that no three of them lie on one line. How many different lines pass through at least two of the points?'
            answer_contract: {"kind": "exact"}
            answer: '6'
            solution_sketch: 'Each pair of points determines one line, and no line holds three points, so different pairs give different lines. The pairs are $AB$, $AC$, $AD$, $BC$, $BD$, and $CD$, so there are 6 lines.'
          - problem: 'Four points are placed so that no three of them lie on one line and the four do not all lie in one plane. How many different planes contain at least three of the points?'
            answer_contract: {"kind": "exact"}
            answer: '4'
            solution_sketch: 'Any three of the points are not in a row, so they fix one plane. The four choices of three points give four planes, and they are all different because the four points are not coplanar. So the answer is 4.'
          - problem: 'A surveyor drives five stakes into level ground so that no three stakes stand in one straight row. She stretches one string between each pair of stakes. How many strings does she need?'
            answer_contract: {"kind": "exact"}
            answer: '10'
            solution_sketch: 'Each pair of stakes needs one string, and the number of pairs of five stakes is $5 \cdot 4 / 2 = 10$. No three stakes are in a row, so no string can serve two pairs. She needs 10 strings.'
          - problem: 'On a coastal chart with a grid in kilometres, three lighthouses stand at $A(1, 2)$, $B(4, 8)$, and $C(6, 12)$. Do the three lighthouses lie on one straight line?'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are collinear", "yes, they lie on one line", "they are collinear"], ["no", "no, they are not collinear", "no, they do not lie on one line", "they are not collinear"]]}
            answer: 'yes'
            solution_sketch: 'The slope from $A$ to $B$ is $(8 - 2)/(4 - 1) = 2$, and the slope from $B$ to $C$ is $(12 - 8)/(6 - 4) = 2$. Equal slopes from the shared point $B$ mean that the three points lie on one line.'
          - problem: 'A four-legged table stands on a level floor, but one leg is a little short, so its foot $W$ hangs just above the floor. The other three feet $X$, $Y$, and $Z$ touch the floor and are not in one row. How many planes contain all four points $W$, $X$, $Y$, and $Z$?'
            answer_contract: {"kind": "exact"}
            answer: '0'
            solution_sketch: 'The only plane through $X$, $Y$, and $Z$ is the floor, because three points not in a row fix one plane. The foot $W$ is above the floor, so it is not in that plane. No plane contains all four points, and the answer is 0.'
          - problem: 'Two straight roads are modelled as two different lines. What is the greatest number of points at which they can cross?'
            answer_contract: {"kind": "exact"}
            answer: '1'
            solution_sketch: 'Two different lines that share two points would both be the line through those two points, so they would be the same line. So they share at most 1 point.'
          - problem: 'Three radio masts stand at $P(0, 1)$, $Q(2, 5)$, and $R(5, 10)$ on a map grid. Do the three masts lie on one straight line?'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are collinear", "yes, they lie on one line", "they are collinear"], ["no", "no, they are not collinear", "no, they do not lie on one line", "they are not collinear"]]}
            answer: 'no'
            solution_sketch: 'The slope from $P$ to $Q$ is $(5 - 1)/(2 - 0) = 2$, and the slope from $Q$ to $R$ is $(10 - 5)/(5 - 2) = 5/3$. The slopes differ, so the three points are not on one line.'
        constraints: 'small configurations of 2-5 points, or coordinate triples; ask for counts of lines or planes, or whether points are collinear or coplanar'
      - id: kp3
        name: Intersections of lines and planes
        key_prerequisites: []
        exemplars:
          - problem: 'A line is not contained in a plane, but it meets the plane. How many points do the line and the plane share?'
            answer_contract: {"kind": "exact"}
            answer: '1'
            solution_sketch: 'If the line shared two points with the plane, the whole line would lie in the plane. The line is not contained in the plane, so it shares exactly 1 point.'
          - problem: 'The ceiling and one wall of a room lie in two different planes, and the planes meet. What figure do the two planes share?'
            answer_contract: {"kind": "label", "options": [["a line", "line", "a straight line", "they meet in a line"], ["a single point", "a point", "one point", "they meet in a point"], ["a plane", "a flat surface", "the same plane"], ["no points", "nothing", "no figure"]]}
            answer: 'a line'
            solution_sketch: 'Two different planes that meet intersect in a line. This is the edge where the ceiling meets the wall, so they share a line.'
          - problem: 'The floor and two neighboring walls of a rectangular room lie in three planes that meet pairwise. Along how many different lines do pairs of these planes meet?'
            answer_contract: {"kind": "exact"}
            answer: '3'
            solution_sketch: 'The floor meets the first wall in one edge, the floor meets the second wall in another edge, and the two walls meet in the vertical corner edge. These 3 lines are different, so the answer is 3.'
          - problem: 'A tent has the shape of a pyramid with a triangular base, so it has four flat faces, each in its own plane. Along how many different lines do the planes of pairs of faces meet?'
            answer_contract: {"kind": "exact"}
            answer: '6'
            solution_sketch: 'Every pair of faces meets along one edge, and there are $4 \cdot 3 / 2 = 6$ pairs of faces. Different pairs give different edges, so the answer is 6.'
          - problem: 'Two floors of a building lie in parallel planes. A sloping glass roof lies in a third plane that cuts through both floor planes. In how many different lines does the third plane meet the two floor planes?'
            answer_contract: {"kind": "exact"}
            answer: '2'
            solution_sketch: 'The third plane meets each floor plane in one line. The two lines cannot be the same line, because that line would lie in both floor planes, and parallel planes share no points. So there are 2 lines.'
          - problem: 'A straight ruler edge touches a flat tabletop at two different points, and the whole edge lies on the tabletop. Which fact justifies this?'
            answer_contract: {"kind": "label", "options": [["two points determine a line", "a line through two points is unique", "two points determine exactly one line", "through two points there is exactly one line", "two points determine one line", "line postulate"], ["three points determine a plane", "three noncollinear points determine a plane", "three non-collinear points determine a plane", "three points fix one plane", "three points determine one plane", "three noncollinear points determine one plane", "plane postulate"], ["two planes meet in a line", "intersecting planes meet in a line", "two planes intersect in a line", "the intersection of two planes is a line", "plane intersection postulate"], ["the line lies in the plane", "a line through two points of a plane lies in it", "a line with two points in a plane lies in the plane", "if two points of a line are in a plane, the line is in the plane", "flat plane postulate", "line in a plane postulate"]]}
            answer: 'the line lies in the plane'
            solution_sketch: 'When a line has two points in a plane, the line through them lies in the plane. The ruler edge has two points on the tabletop, so the whole edge lies on it.'
          - problem: 'The three side faces of a triangular prism lie in three planes that meet pairwise in three parallel lines. How many points do all three planes share?'
            answer_contract: {"kind": "exact"}
            answer: '0'
            solution_sketch: 'A point shared by all three planes would lie on at least two of the three meeting lines. Different parallel lines never meet, so no point lies on two of them. The planes share 0 points.'
        constraints: 'postulate-level facts about how lines and planes meet; real objects such as walls, floors, and rods; no coordinates required'
    diagnostic_exemplar:
      problem: 'Two walls of a room lie in different planes, and the planes meet. What figure do the two planes have in common?'
      answer_contract: {"kind": "label", "options": [["a line", "line", "a straight line", "they meet in a line"], ["a single point", "a point", "one point", "they meet in a point"], ["a plane", "a flat surface", "the same plane"], ["no points", "nothing", "no figure"]]}
      answer: 'a line'
      solution_sketch: 'Two different planes that meet intersect in a line, never in a single point. For two walls, this line is the vertical edge in the corner of the room.'
    anki_seeds:
      - front: "Through any two distinct points there is exactly..."
        back: "one line"
        type: basic
      - front: "Two distinct intersecting planes intersect in a..."
        back: "line"
        type: basic

  - id: measuring-segments-angles
    name: Measuring Segments and Angles
    core: true
    difficulty: 0.18
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: points-lines-planes
        weight: 0.5
        key: false
      - id: one-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Segment addition with numbers
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Point $B$ lies on $\overline{AC}$, between $A$ and $C$, with $AB = 7$ cm and $BC = 12$ cm. How long is $\overline{AC}$?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            answer: '19'
            solution_sketch: 'Point $B$ is between $A$ and $C$, so the parts $AB$ and $BC$ lie end to end. Then $AC = AB + BC = 7 + 12 = 19$ cm.'
          - problem: 'A fence runs along a straight line from corner post $P$ to corner post $Q$, which are 30 m apart. A marker post $M$ stands on the fence between them, 13 m from $P$. How far is the marker post from $Q$?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            answer: '17'
            solution_sketch: 'The marker post is between the corner posts, so $PM + MQ = PQ$. Then $MQ = PQ - PM = 30 - 13 = 17$ m.'
          - problem: 'On a number line, point $A$ has coordinate $-3$ and point $B$ has coordinate $8$. How far apart are the two points?'
            answer_contract: {"kind": "exact"}
            answer: '11'
            solution_sketch: 'The distance on a number line is the absolute difference of the coordinates. Subtracting the smaller from the larger gives $AB = 8 - (-3) = 11$.'
          - problem: 'The towns $A$, $B$, and $C$ lie along a straight highway, with $B$ between $A$ and $C$. The distance from $A$ to $B$ is 47 km and the distance from $A$ to $C$ is 112 km. How far is it from $B$ to $C$?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            answer: '65'
            solution_sketch: 'Town $B$ is between the other two towns, so the distances add up along the highway and $AB + BC = AC$. This gives $BC = 112 - 47 = 65$ km.'
          - problem: 'A hiking trail runs straight from the trailhead $T$ to the lookout $L$, and a marker $K$ stands on the trail between them. The marker is 1.25 km from the trailhead and 2.4 km from the lookout. How long is the trail?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            answer: '3.65'
            solution_sketch: 'The marker is between the trailhead and the lookout, so the two parts of the trail add up to the whole. Then $TL = TK + KL = 1.25 + 2.4 = 3.65$ km.'
          - problem: 'On a number line, point $E$ has coordinate $-12$ and point $F$ has coordinate $5$. Point $G$ lies between them at coordinate $-4$. How far is $G$ from $F$?'
            answer_contract: {"kind": "exact"}
            answer: '9'
            solution_sketch: 'The distance from $G$ to $F$ is the absolute difference of their coordinates, $|5 - (-4)| = 9$. As a check, $EG = 8$ and $GF = 9$ add up to $EF = 17$.'
          - problem: 'A ruler lies along a steel rod, with one end of the rod at the 6.5 cm mark and the other end at the 21 cm mark. How long is the rod?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            answer: '14.5'
            solution_sketch: 'The rod starts at one mark and ends at the other, so its length is the difference of the two readings. That is $21 - 6.5 = 14.5$ cm.'
          - problem: 'What is the distance between the coordinates $-5$ and $9$ on a number line?'
            answer_contract: {"kind": "exact"}
            answer: '14'
            solution_sketch: 'The distance is $|9 - (-5)| = 9 + 5 = 14$. Subtracting $5$ instead of $-5$ drops the minus sign and gives the wrong value $4$.'
        constraints: 'lengths and coordinates in whole or one-decimal numbers; a point between the endpoints; ruler and number-line items with coordinates between -20 and 20; real units'
      - id: kp2
        name: Angle addition with numbers
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. If $m\angle AOB = 34^\circ$ and $m\angle BOC = 51^\circ$, what is $m\angle AOC$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '85'
            solution_sketch: 'The ray is in the interior, so the two parts add up to the whole angle. Then $m\angle AOC = 34^\circ + 51^\circ = 85^\circ$.'
          - problem: 'Ray $\overrightarrow{QR}$ lies in the interior of $\angle PQS$. If $m\angle PQS = 110^\circ$ and $m\angle PQR = 45^\circ$, what is $m\angle RQS$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '65'
            solution_sketch: 'The part $m\angle RQS$ is the whole minus the known part. So $m\angle RQS = 110^\circ - 45^\circ = 65^\circ$.'
          - problem: 'A casement window is opened $41^\circ$ from its closed position and then pushed $52^\circ$ further. Through what angle has the window turned from the closed position?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '93'
            solution_sketch: 'The second turn starts where the first turn stops, so the two turns add up. The total angle is $41^\circ + 52^\circ = 93^\circ$.'
          - problem: 'From a ship, the line of sight to lighthouse $L_1$ has bearing $25^\circ$ and the line of sight to lighthouse $L_2$ has bearing $80^\circ$, both measured clockwise from north. What angle lies between the two lines of sight?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '55'
            solution_sketch: 'Both bearings are measured from the same north line, so the angle between the lines of sight is the difference. That is $80^\circ - 25^\circ = 55^\circ$.'
          - problem: 'On a protractor, ray $\overrightarrow{OA}$ points to the $0^\circ$ mark, ray $\overrightarrow{OB}$ to the $62^\circ$ mark, and ray $\overrightarrow{OC}$ to the $140^\circ$ mark. What is $m\angle BOC$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '78'
            solution_sketch: 'Ray $\overrightarrow{OB}$ is inside $\angle AOC$, so $m\angle AOB + m\angle BOC = m\angle AOC$. Then $m\angle BOC = 140^\circ - 62^\circ = 78^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$, and ray $\overrightarrow{OC}$ lies in the interior of $\angle AOD$. If $m\angle AOB = 25^\circ$, $m\angle BOC = 33^\circ$, and $m\angle COD = 41^\circ$, what is $m\angle AOD$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '99'
            solution_sketch: 'Adding the three parts gives $m\angle AOD = 25^\circ + 33^\circ + 41^\circ = 99^\circ$. First $m\angle AOC = 25^\circ + 33^\circ = 58^\circ$, and then $58^\circ + 41^\circ = 99^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$ with $m\angle AOB = 30^\circ$ and $m\angle BOC = 45^\circ$. What is $m\angle AOC$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '75'
            solution_sketch: 'The parts must be added to get the whole angle, not subtracted. So $m\angle AOC = 30^\circ + 45^\circ = 75^\circ$.'
        constraints: 'whole-degree measures; totals stay below 180 degrees; an interior ray, protractor readings, turns, and bearings'
      - id: kp3
        name: Classify angles by measure
        key_prerequisites: []
        exemplars:
          - problem: 'A protractor shows that an angle measures $134^\circ$. What kind of angle is it?'
            answer_contract: {"kind": "label", "options": [["acute angle", "acute", "an acute angle", "it is acute"], ["right angle", "right", "a right angle", "it is right"], ["obtuse angle", "obtuse", "an obtuse angle", "it is obtuse"], ["straight angle", "straight", "a straight angle", "it is straight"]]}
            answer: 'obtuse angle'
            solution_sketch: 'An obtuse angle measures more than $90^\circ$ and less than $180^\circ$. Since $90 < 134 < 180$, the angle is obtuse.'
          - problem: 'An angle exceeds a right angle by $50^\circ$. What is its measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '140'
            solution_sketch: 'A right angle measures $90^\circ$, so the angle measures $90^\circ + 50^\circ = 140^\circ$. It is an obtuse angle.'
          - problem: 'At 4 o''clock the hour hand of a clock points at the 4 and the minute hand points at the 12. What angle do the two hands make?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '120'
            solution_sketch: 'The 12 marks on the clock face are equally spaced, so each mark is $360^\circ / 12 = 30^\circ$ from the next. The hands are 4 marks apart, so the angle is $4 \cdot 30^\circ = 120^\circ$.'
          - problem: 'A ladder leans against a wall so that it makes an angle of $76^\circ$ with the ground. What kind of angle is that?'
            answer_contract: {"kind": "label", "options": [["acute angle", "acute", "an acute angle", "it is acute"], ["right angle", "right", "a right angle", "it is right"], ["obtuse angle", "obtuse", "an obtuse angle", "it is obtuse"], ["straight angle", "straight", "a straight angle", "it is straight"]]}
            answer: 'acute angle'
            solution_sketch: 'An acute angle measures less than $90^\circ$. Since $76 < 90$, the angle is acute.'
          - problem: 'An angle is $25^\circ$ less than a right angle. What is its measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '65'
            solution_sketch: 'A right angle measures $90^\circ$, so the angle measures $90^\circ - 25^\circ = 65^\circ$. It is an acute angle.'
          - problem: 'At 5 o''clock the hour hand of a clock points at the 5 and the minute hand points at the 12. What angle do the two hands make?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '150'
            solution_sketch: 'Each mark on the clock face is $30^\circ$ from the next, and the hands are 5 marks apart. So the angle is $5 \cdot 30^\circ = 150^\circ$, which is an obtuse angle.'
          - problem: 'A door swings open through one quarter of a full turn. Through how many degrees does it turn?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '90'
            solution_sketch: 'A full turn is $360^\circ$, so one quarter of it is $360^\circ / 4 = 90^\circ$. The door makes a right angle.'
        constraints: 'measures between 1 and 180 degrees; the four standard classes; clock faces, corners, ladders, and doors'
    diagnostic_exemplar:
      problem: 'Point $X$ lies on $\overline{WY}$, between $W$ and $Y$, with $WY = 41$ cm and $WX = 18$ cm. How long is $\overline{XY}$?'
      answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
      answer: '23'
      solution_sketch: 'The parts add up to the whole, so $WX + XY = WY$. Then $XY = 41 - 18 = 23$ cm.'
    anki_seeds:
      - front: "An angle measuring more than 90 but less than 180 degrees is..."
        back: "obtuse"
        type: basic
      - front: "On a number line, the distance between coordinates a and b is..."
        back: "|a - b|"
        type: basic

  - id: segment-angle-addition
    name: Segment and Angle Addition
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: measuring-segments-angles
        weight: 0.7
        key: true
      - id: one-step-equations
        weight: 0.5
        key: false
      - id: evaluating-expressions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Set up an equation from a segment diagram
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: 'Point $B$ lies on $\overline{AC}$, between $A$ and $C$, with $AB = 2x + 3$, $BC = 3x - 1$, and $AC = 22$. Find $x$.'
            answer_contract: {"kind": "exact"}
            answer: '4'
            solution_sketch: 'The parts add up to the whole, so $(2x + 3) + (3x - 1) = 22$. This gives $5x + 2 = 22$, so $5x = 20$ and $x = 4$.'
          - problem: 'A pipeline runs straight from pumping station $R$ to pumping station $S$, which is 42 km away. A valve station $N$ lies on the pipeline between them, with $RN = (4x - 3)$ km and $NS = (2x + 9)$ km. How far is the valve station from $R$?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            answer: '21'
            solution_sketch: 'The two parts add up to the whole, so $(4x - 3) + (2x + 9) = 42$. This gives $6x + 6 = 42$ and $x = 6$, so $RN = 4(6) - 3 = 21$ km.'
          - problem: 'Point $C$ lies on $\overline{AD}$, between $A$ and $D$, with $AC = 5x - 2$, $CD = x + 4$, and $AD = 26$. Find $CD$.'
            answer_contract: {"kind": "exact"}
            answer: '8'
            solution_sketch: 'The parts add up to the whole, so $(5x - 2) + (x + 4) = 26$. This gives $6x + 2 = 26$ and $x = 4$, so $CD = 4 + 4 = 8$.'
          - problem: 'Point $B$ lies on $\overline{AC}$, between $A$ and $C$, with $AB = 2x - 1$, $BC = 3x + 14$, and $AC = 7x + 5$. Find $AC$.'
            answer_contract: {"kind": "exact"}
            answer: '33'
            solution_sketch: 'The parts add up to the whole, so $(2x - 1) + (3x + 14) = 7x + 5$. This gives $5x + 13 = 7x + 5$, so $2x = 8$ and $x = 4$. Then $AC = 7(4) + 5 = 33$.'
          - problem: 'Two fence posts $B$ and $C$ stand on a straight line segment $\overline{AD}$. Post $B$ is between $A$ and $C$, and post $C$ is between $B$ and $D$. The lengths are $AB = x + 4$, $BC = 2x - 1$, $CD = 3x$, and $AD = 51$, all in metres. How far apart are the two posts?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            answer: '15'
            solution_sketch: 'The three parts add up to the whole, so $(x + 4) + (2x - 1) + 3x = 51$. This gives $6x + 3 = 51$ and $x = 8$, so $BC = 2(8) - 1 = 15$ m.'
          - problem: 'A cable car line runs straight from the base station $A$ to the summit $C$, which is 36 km away. The middle station $B$ lies on the line between them, with $AB = (4x + 10)$ km and $BC = (3x + 5)$ km. How long is the section from the base station to the middle station?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            answer: '22'
            solution_sketch: 'The two sections add up to the whole line, so $(4x + 10) + (3x + 5) = 36$. This gives $7x + 15 = 36$ and $x = 3$, so $AB = 4(3) + 10 = 22$ km.'
          - problem: 'Point $B$ lies on $\overline{AC}$, between $A$ and $C$, so that $AB + BC = AC$. Which postulate justifies this equation?'
            answer_contract: {"kind": "label", "options": [["segment addition postulate", "segment addition", "the segment addition postulate", "segment addition property", "the segment addition"], ["angle addition postulate", "angle addition", "the angle addition postulate"], ["definition of a midpoint", "midpoint definition", "the midpoint theorem"]]}
            answer: 'segment addition postulate'
            solution_sketch: 'When a point lies between the endpoints of a segment, the two parts add up to the whole. This is the Segment Addition Postulate.'
          - problem: 'The points $A$, $B$, and $C$ lie on one straight line with $AB = 5$ cm, $AC = 2$ cm, and $BC = 7$ cm. Does $B$ lie between $A$ and $C$?'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "yes, B is between A and C"], ["no", "no, it does not", "no, B is not between A and C"]]}
            answer: 'no'
            solution_sketch: 'If $B$ were between $A$ and $C$, the lengths $AB + BC$ would equal $AC$, but $5 + 7 = 12$ is not $2$. Instead $BA + AC = 5 + 2 = 7 = BC$, so $A$ lies between $B$ and $C$.'
        constraints: 'linear expressions with integer solutions; lengths come out positive; a point between the ends, a chain of two points, or a betweenness question; real units in context items'
      - id: kp2
        name: Midpoint and segment bisector equations
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: 'Point $M$ is the midpoint of $\overline{AB}$, with $AM = 3x - 5$ and $MB = x + 9$. Find $AB$.'
            answer_contract: {"kind": "exact"}
            answer: '32'
            solution_sketch: 'A midpoint makes the two halves equal, so $3x - 5 = x + 9$. This gives $2x = 14$ and $x = 7$, so $AM = 16$ and $AB = 2 \cdot 16 = 32$.'
          - problem: 'Segment $\overline{XY}$ is bisected at $T$, with $XT = 4x + 1$ and $XY = 10x - 6$. Find $XY$.'
            answer_contract: {"kind": "exact"}
            answer: '34'
            solution_sketch: 'The whole is twice the half, so $2(4x + 1) = 10x - 6$. This gives $8x + 2 = 10x - 6$, so $x = 4$ and $XY = 10(4) - 6 = 34$.'
          - problem: 'A zip line cable is stretched straight from tower $P$ to tower $Q$, and the platform $M$ is at its midpoint. The distances are $PM = (5x - 7)$ m and $MQ = (3x + 1)$ m. How long is the cable?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            answer: '26'
            solution_sketch: 'The midpoint makes the halves equal, so $5x - 7 = 3x + 1$. This gives $x = 4$ and $PM = 13$ m, so the whole cable is $PQ = 2 \cdot 13 = 26$ m.'
          - problem: 'A carpenter marks the midpoint $M$ of a board $\overline{AB}$. The lengths are $AM = (3x + 2)$ cm and $AB = (10x - 12)$ cm. How long is $\overline{AM}$?'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            answer: '14'
            solution_sketch: 'The whole board is twice the half, so $2(3x + 2) = 10x - 12$. This gives $6x + 4 = 10x - 12$, so $x = 4$ and $AM = 3(4) + 2 = 14$ cm.'
          - problem: 'On a number line, $M$ is the midpoint of $\overline{AB}$. Point $A$ has coordinate $-3$ and point $M$ has coordinate $5$. What is the coordinate of $B$?'
            answer_contract: {"kind": "exact"}
            answer: '13'
            solution_sketch: 'The midpoint is as far from $B$ as from $A$. The step from $A$ to $M$ is $5 - (-3) = 8$, so $B$ is another $8$ further along, at $5 + 8 = 13$.'
          - problem: 'On a map grid in kilometres, two lookout towers stand at $(-4, 1)$ and $(8, 7)$. A rescue station is built exactly halfway between them on the straight path joining them. What are the coordinates of the station?'
            answer_contract: {"kind": "coordinates", "arity": 2}
            answer: '(2, 4)'
            solution_sketch: 'The midpoint has the average of each coordinate. The first coordinate is $(-4 + 8)/2 = 2$ and the second is $(1 + 7)/2 = 4$, so the station is at $(2, 4)$.'
          - problem: 'Point $M$ is the midpoint of $\overline{AB}$, so $AM = MB$. Which fact justifies this equation?'
            answer_contract: {"kind": "label", "options": [["definition of a midpoint", "midpoint definition", "the definition of a midpoint", "definition of midpoint", "the midpoint definition", "midpoint"], ["segment addition postulate", "segment addition", "the segment addition postulate", "segment addition property", "the segment addition"], ["definition of an angle bisector", "angle bisector definition", "the definition of a bisector"]]}
            answer: 'definition of a midpoint'
            solution_sketch: 'A midpoint is defined as the point that divides a segment into two parts of equal length. So $AM = MB$ follows from the definition of a midpoint.'
          - problem: 'A cable $\overline{AC}$ is 38 m long, and a clamp $B$ lies on it with $AB = (2x + 7)$ m and $BC = (4x - 5)$ m. Is the clamp at the midpoint of the cable?'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "yes, B is the midpoint"], ["no", "no, it is not", "no, B is not the midpoint"]]}
            answer: 'yes'
            solution_sketch: 'The parts add up to the whole, so $(2x + 7) + (4x - 5) = 38$. This gives $6x + 2 = 38$ and $x = 6$, so $AB = 19$ m and $BC = 19$ m. The two parts are equal, so the clamp is at the midpoint.'
        constraints: 'the relation 2(half) = whole or half = half; integer solutions; positive lengths; number-line and coordinate midpoints; real units in context items'
      - id: kp3
        name: Angle addition equations
        key_prerequisites: [one-step-equations, measuring-segments-angles]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. If $m\angle AOB = (2x + 5)^\circ$, $m\angle BOC = (3x - 10)^\circ$, and $m\angle AOC = 70^\circ$, find $m\angle AOB$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '35'
            solution_sketch: 'The parts add up to the whole, so $(2x + 5) + (3x - 10) = 70$. This gives $5x - 5 = 70$ and $x = 15$, so $m\angle AOB = 2(15) + 5 = 35^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, with $m\angle AOB = (4x - 6)^\circ$ and $m\angle BOC = (2x + 18)^\circ$. Find $m\angle AOC$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '84'
            solution_sketch: 'A bisector makes the two parts equal, so $4x - 6 = 2x + 18$ and $x = 12$. Each part is $42^\circ$, so $m\angle AOC = 2 \cdot 42^\circ = 84^\circ$.'
          - problem: 'A spotlight at $O$ points along ray $\overrightarrow{OA}$ and then turns to ray $\overrightarrow{OB}$ through $(3x + 7)^\circ$. It then turns on to ray $\overrightarrow{OC}$ through a further $(2x - 2)^\circ$. In total it has turned $85^\circ$ from $\overrightarrow{OA}$. How many degrees was the second turn?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '30'
            solution_sketch: 'The two turns add up to the total, so $(3x + 7) + (2x - 2) = 85$. This gives $5x + 5 = 85$ and $x = 16$, so the second turn is $2(16) - 2 = 30^\circ$.'
          - problem: 'A spar $\overrightarrow{OQ}$ of a kite bisects the corner angle $\angle MON$ at the top of the kite, with $m\angle MOQ = (5x + 3)^\circ$ and $m\angle QON = (3x + 19)^\circ$. What is the measure of the corner angle $\angle MON$?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '86'
            solution_sketch: 'The spar bisects the corner, so $5x + 3 = 3x + 19$ and $x = 8$. Each half is $5(8) + 3 = 43^\circ$, so $m\angle MON = 86^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$, with $m\angle AOB = (6x - 4)^\circ$, $m\angle BOC = (x + 9)^\circ$, and $m\angle AOC = (9x - 15)^\circ$. Find $m\angle BOC$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '19'
            solution_sketch: 'The parts add up to the whole, so $(6x - 4) + (x + 9) = 9x - 15$. This gives $7x + 5 = 9x - 15$, so $x = 10$ and $m\angle BOC = 10 + 9 = 19^\circ$.'
          - problem: 'Points $A$, $O$, and $C$ lie on one straight line, and a brace $\overrightarrow{OB}$ is fixed at $O$ on one side of the line, with $m\angle AOB = (5x + 10)^\circ$ and $m\angle BOC = (3x + 18)^\circ$. Find $m\angle AOB$.'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '105'
            solution_sketch: 'The line makes a straight angle of $180^\circ$, and the two parts fill it, so $(5x + 10) + (3x + 18) = 180$. This gives $8x + 28 = 180$ and $x = 19$, so $m\angle AOB = 5(19) + 10 = 105^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, so $m\angle AOB = m\angle BOC$. Which fact justifies this equation?'
            answer_contract: {"kind": "label", "options": [["definition of an angle bisector", "angle bisector definition", "the definition of a bisector", "definition of angle bisector", "the angle bisector definition", "definition of bisector", "bisector definition", "angle bisector"], ["angle addition postulate", "angle addition", "the angle addition postulate"], ["definition of a midpoint", "midpoint definition", "the midpoint theorem"], ["segment addition postulate", "segment addition", "the segment addition postulate", "segment addition property", "the segment addition"]]}
            answer: 'definition of an angle bisector'
            solution_sketch: 'An angle bisector is defined as the ray that divides an angle into two parts of equal measure. So $m\angle AOB = m\angle BOC$ follows from the definition of an angle bisector.'
          - problem: 'Ray $\overrightarrow{OB}$ lies in the interior of $\angle AOC$. Is it possible that $m\angle AOB = 48^\circ$, $m\angle BOC = 61^\circ$, and $m\angle AOC = 100^\circ$?'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is possible", "yes, it can"], ["no", "no, it is not possible", "no, it cannot"]]}
            answer: 'no'
            solution_sketch: 'For an interior ray the two parts must add up to the whole angle. Here $48^\circ + 61^\circ = 109^\circ$, which is not $100^\circ$, so these measures cannot all hold.'
        constraints: 'linear expressions; whole-degree answers; totals at most 180 degrees; an interior ray, a bisector, or a straight angle; real settings in context items'
    diagnostic_exemplar:
      problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, with $m\angle AOB = (3x + 4)^\circ$ and $m\angle AOC = (8x - 12)^\circ$. Find $m\angle AOC$.'
      answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
      answer: '68'
      solution_sketch: 'The bisector gives $2(3x + 4) = 8x - 12$, so $6x + 8 = 8x - 12$ and $x = 10$. Then $m\angle AOB = 34^\circ$ and $m\angle AOC = 68^\circ$.'
    anki_seeds:
      - front: "Segment addition postulate: if B is between A and C, then AB + BC = ..."
        back: "AC"
        type: basic
      - front: "The midpoint of a segment divides it into two segments that are..."
        back: "congruent (each half the original length)"
        type: basic

  - id: complementary-supplementary-angles
    name: Complementary and Supplementary Angles
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: measuring-segments-angles
        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Complements
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'What is the complement of a $37^\circ$ angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '53'
            solution_sketch: 'Complementary angles add up to $90^\circ$. So the complement of $37^\circ$ is $90^\circ - 37^\circ = 53^\circ$.'
          - problem: 'Two angles are complementary, and one of them measures $18^\circ$. What does the other angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '72'
            solution_sketch: 'The two measures add up to $90^\circ$. So the other angle measures $90^\circ - 18^\circ = 72^\circ$.'
          - problem: 'A ladder leans against a vertical wall and makes an angle of $64^\circ$ with the level ground. What angle does the ladder make with the wall?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '26'
            solution_sketch: 'The wall is vertical and the ground is level, so they meet in a right angle. The two angles that the ladder makes with them fill that right angle, so the angle with the wall is $90^\circ - 64^\circ = 26^\circ$.'
          - problem: 'A ray of sunlight makes an angle of $38^\circ$ with the level ground. A flagpole stands vertically on the ground. What angle does the ray make with the flagpole?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '52'
            solution_sketch: 'The pole is perpendicular to the ground, so the angle with the ground and the angle with the pole add up to $90^\circ$. The angle with the pole is $90^\circ - 38^\circ = 52^\circ$.'
          - problem: 'An angle measures $30^\circ$ more than its complement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '60'
            solution_sketch: 'Let the angle be $x^\circ$, so its complement is $(90 - x)^\circ$. Then $x = (90 - x) + 30$, so $2x = 120$ and $x = 60$.'
          - problem: 'Two complementary angles measure $(2x + 7)^\circ$ and $(3x - 2)^\circ$. What does the larger angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '49'
            solution_sketch: 'The measures add up to $90^\circ$, so $(2x + 7) + (3x - 2) = 90$. This gives $5x + 5 = 90$ and $x = 17$, so the angles are $41^\circ$ and $49^\circ$, and the larger is $49^\circ$.'
          - problem: 'Two angles measure $62^\circ$ and $38^\circ$. Are they complementary, supplementary, or neither?'
            answer_contract: {"kind": "label", "options": [["complementary", "they are complementary", "complementary angles"], ["supplementary", "they are supplementary", "supplementary angles"], ["neither", "they are neither", "neither complementary nor supplementary"]]}
            answer: 'neither'
            solution_sketch: 'The sum of the measures is $62^\circ + 38^\circ = 100^\circ$. That is not $90^\circ$ and not $180^\circ$, so the angles are neither complementary nor supplementary.'
        constraints: 'whole-degree acute angles; complements found directly, from a right-angle corner, or from a short linear equation; real settings with vertical and level lines'
      - id: kp2
        name: Supplements
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'What is the supplement of a $104^\circ$ angle?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '76'
            solution_sketch: 'Supplementary angles add up to $180^\circ$. So the supplement of $104^\circ$ is $180^\circ - 104^\circ = 76^\circ$.'
          - problem: 'A side road meets a straight highway and makes an angle of $58^\circ$ with the highway on one side. What angle does it make with the highway on the other side?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '122'
            solution_sketch: 'The two angles lie along the straight highway, so they fill a straight angle of $180^\circ$. The angle on the other side is $180^\circ - 58^\circ = 122^\circ$.'
          - problem: 'A brace is nailed to a straight beam at a point $P$, and it makes an angle of $32^\circ$ with one side of the beam. What angle does the brace make with the other side of the beam?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '148'
            solution_sketch: 'The two sides of the beam at $P$ form a straight line, so the two angles add up to $180^\circ$. The other angle is $180^\circ - 32^\circ = 148^\circ$.'
          - problem: 'An angle measures $24^\circ$ less than its supplement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '78'
            solution_sketch: 'Let the angle be $x^\circ$, so its supplement is $(180 - x)^\circ$. Then $x = (180 - x) - 24 = 156 - x$, so $2x = 156$ and $x = 78$.'
          - problem: 'Two supplementary angles measure $(4x + 5)^\circ$ and $(2x + 25)^\circ$. What does the smaller angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '75'
            solution_sketch: 'The measures add up to $180^\circ$, so $(4x + 5) + (2x + 25) = 180$. This gives $6x + 30 = 180$ and $x = 25$, so the angles are $105^\circ$ and $75^\circ$, and the smaller is $75^\circ$.'
          - problem: 'Two supplementary angles are in the ratio $2 : 7$. What does the larger angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '140'
            solution_sketch: 'The ratio gives $2$ parts and $7$ parts, which make $9$ parts for $180^\circ$. One part is $20^\circ$, so the larger angle is $7 \cdot 20^\circ = 140^\circ$.'
          - problem: 'Two angles measure $125^\circ$ and $55^\circ$. Are they complementary, supplementary, or neither?'
            answer_contract: {"kind": "label", "options": [["complementary", "they are complementary", "complementary angles"], ["supplementary", "they are supplementary", "supplementary angles"], ["neither", "they are neither", "neither complementary nor supplementary"]]}
            answer: 'supplementary'
            solution_sketch: 'The sum of the measures is $125^\circ + 55^\circ = 180^\circ$. Two angles that add up to $180^\circ$ are supplementary.'
        constraints: 'whole-degree angles between 1 and 179 degrees; supplements found directly, along a straight line, from a ratio, or from a short linear equation'
      - id: kp3
        name: Self-referential complements and supplements
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'An angle equals its own complement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '45'
            solution_sketch: 'Let the angle be $x^\circ$, so its complement is $(90 - x)^\circ$. Then $x = 90 - x$, so $2x = 90$ and $x = 45$.'
          - problem: 'An angle equals its own supplement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '90'
            solution_sketch: 'Let the angle be $x^\circ$, so its supplement is $(180 - x)^\circ$. Then $x = 180 - x$, so $2x = 180$ and $x = 90$.'
          - problem: 'A ladder leans against a vertical wall on level ground. The angle it makes with the ground is $14^\circ$ larger than the angle it makes with the wall. What angle does the ladder make with the ground?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '52'
            solution_sketch: 'The two angles are complementary, so the angle with the wall is $(90 - x)^\circ$ when the angle with the ground is $x^\circ$. Then $x = (90 - x) + 14$, so $2x = 104$ and $x = 52$.'
          - problem: 'An angle is twice its supplement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '120'
            solution_sketch: 'Let the angle be $x^\circ$, so its supplement is $(180 - x)^\circ$. Then $x = 2(180 - x)$, so $3x = 360$ and $x = 120$.'
          - problem: 'An angle is three times its complement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '67.5'
            solution_sketch: 'Let the angle be $x^\circ$, so its complement is $(90 - x)^\circ$. Then $x = 3(90 - x)$, so $4x = 270$ and $x = 67.5$.'
          - problem: 'The supplement of an angle is four times its complement. What does the angle measure?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '60'
            solution_sketch: 'Let the angle be $x^\circ$. Then $180 - x = 4(90 - x) = 360 - 4x$, so $3x = 180$ and $x = 60$. As a check, the supplement is $120^\circ$ and the complement is $30^\circ$, and $4 \cdot 30 = 120$.'
          - problem: 'The ray of the setting sun makes an angle with the level ground that is $16^\circ$ smaller than the angle it makes with a vertical pole. What angle does the ray make with the ground?'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
            answer: '37'
            solution_sketch: 'The two angles are complementary. With $x^\circ$ for the angle with the ground, $x = (90 - x) - 16$, so $2x = 74$ and $x = 37$.'
          - problem: 'Does an obtuse angle have a complement?'
            answer_contract: {"kind": "label", "options": [["no", "no, it does not", "no, an obtuse angle has no complement"], ["yes", "yes, it does", "yes, it has a complement"]]}
            answer: 'no'
            solution_sketch: 'An obtuse angle measures more than $90^\circ$, so a complement would measure $90^\circ$ minus more than $90^\circ$, which is a negative number. So an obtuse angle has no complement.'
        constraints: 'short linear equation setups in which the angle is compared with its own complement or supplement; collect x, then divide; some answers are half degrees'
    diagnostic_exemplar:
      problem: 'An angle is twice its complement. What does the supplement of that angle measure?'
      answer_contract: {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}
      answer: '120'
      solution_sketch: 'Let the angle be $x^\circ$. Then $x = 2(90 - x)$ gives $3x = 180$, so the angle is $60^\circ$, and its supplement is $180 - 60 = 120^\circ$.'
    anki_seeds:
      - front: "Complementary angles sum to..."
        back: "90 degrees"
        type: basic
      - front: "Supplementary angles sum to..."
        back: "180 degrees"
        type: basic

  - id: angle-relationships
    name: Angle Pair Relationships
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: proof
    expected_time_secs: 75
    prerequisites:
      - id: complementary-supplementary-angles
        weight: 0.7
        key: true
      - id: segment-angle-addition
        weight: 0.5
        key: false
      - id: two-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Vertical angles and linear pairs
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Two lines intersect. One of the four angles they form measures $118^\circ$. What is the measure of the angle opposite it?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '118'
            solution_sketch: 'The angle opposite a given angle at an intersection is its vertical angle. Vertical angles are congruent, so it also measures $118^\circ$.'
          - problem: 'Two angles form a linear pair and measure $(3x + 10)^\circ$ and $(2x + 20)^\circ$. Find $x$.'
            answer_contract: {"kind":"exact"}
