          - problem: 'Parallel lines are cut by a transversal. An angle $\angle 1$ measures $70^\circ$ and lies outside the lines. Its vertical angle $\angle 2$ lies between the lines. Find the angle between the lines on the same side of the transversal as $\angle 2$, at the other crossing.'
