            solution_sketch: 'With $AB \parallel DC$, side $BC$ is a transversal, and angles $ABC$ and $BCD$ are same-side interior angles. They are supplementary, so $m\angle BCD = 180 - 75 = 105^\circ$. The angle at $A$ is not needed here; it gives $m\angle ADC = 112^\circ$.'
