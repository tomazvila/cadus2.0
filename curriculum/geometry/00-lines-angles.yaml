            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '123'
            solution_sketch: 'The two angles lie along the straight bank, so they form a linear pair. Their sum is $180^\circ$, and $180 - 57 = 123$.'
          - problem: 'Two angles form a linear pair and measure $(4x + 15)^\circ$ and $(3x + 25)^\circ$. Find the larger of the two angles.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '95'
            solution_sketch: 'The sum is $7x + 40 = 180$, so $x = 20$. The angles are $4(20) + 15 = 95$ and $3(20) + 25 = 85$, so the larger angle is $95^\circ$.'
          - problem: 'Two straight steel beams cross at a bolt. One angle between the beams measures $(5x - 4)^\circ$, and the angle opposite it measures $(3x + 16)^\circ$. How large is each of these two angles?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '46'
            solution_sketch: 'The two angles are vertical angles, so they are equal: $5x - 4 = 3x + 16$ gives $x = 10$. The opposite angle is $3(10) + 16 = 46$, and $5(10) - 4 = 46$ agrees.'
          - problem: 'Lines $AB$ and $CD$ intersect at $O$. Which theorem justifies $m\angle AOC = m\angle BOD$?'
            answer_contract: {"kind":"label","options":[["vertical angles theorem","vertical angles","vertical angle theorem","vertical angle","vertical angles are congruent","vertical angles are equal","the vertical angles theorem","the vertical angle theorem"],["linear pair postulate","linear pair","linear pair theorem","the linear pair postulate","linear pair axiom","linear pair of angles"],["angle addition postulate","angle addition","the angle addition postulate"]]}
            answer: 'vertical angles theorem'
            solution_sketch: 'Angles $AOC$ and $BOD$ lie opposite each other at the crossing of two lines. Opposite angles are vertical angles, and the vertical angles theorem says they are congruent.'
          - problem: 'Lines $AB$ and $CD$ intersect at $O$, and the angles $AOC$ and $COB$ lie along the line $AB$. Which postulate justifies $m\angle AOC + m\angle COB = 180^\circ$?'
            answer_contract: {"kind":"label","options":[["linear pair postulate","linear pair","linear pair theorem","the linear pair postulate","linear pair axiom","linear pair of angles"],["vertical angles theorem","vertical angles","vertical angle theorem","vertical angle","vertical angles are congruent","vertical angles are equal","the vertical angles theorem","the vertical angle theorem"],["angle addition postulate","angle addition","the angle addition postulate"]]}
            answer: 'linear pair postulate'
            solution_sketch: 'The rays $OA$ and $OB$ form a straight line, and $\angle AOC$ and $\angle COB$ share the arm $OC$. Adjacent angles on a straight line form a linear pair, so their sum is $180^\circ$.'
          - problem: 'What is the measure of the angle next to a $64^\circ$ angle on a straight line?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '116'
            solution_sketch: 'Two adjacent angles on a straight line form a linear pair, so they add to $180^\circ$ and do not match. The angle is $180 - 64 = 116$.'
          - problem: 'Write the full proof that vertical angles are congruent: lines $AB$ and $CD$ intersect at $O$, with $A$, $O$, $B$ in a line and $C$, $O$, $D$ in a line. Prove $\angle AOC \cong \angle BOD$.'
            answer_contract: {"kind":"none"}
            answer: 'angle AOC = angle BOD'
            solution_sketch: '1. $m\angle AOC + m\angle COB = 180^\circ$ because $\angle AOC$ and $\angle COB$ form a linear pair. 2. $m\angle COB + m\angle BOD = 180^\circ$ because $\angle COB$ and $\angle BOD$ form a linear pair. 3. Hence $m\angle AOC + m\angle COB = m\angle COB + m\angle BOD$ by substitution. 4. Subtracting $m\angle COB$ from both sides gives $m\angle AOC = m\angle BOD$. 5. So $\angle AOC \cong \angle BOD$, and vertical angles are congruent.'
        constraints: 'vertical angles congruent; linear pairs sum to 180; integer solutions; justification of the theorem used; one written proof that vertical angles are congruent as the last exemplar'
      - id: kp2
        name: Equations from complement and supplement conditions
        key_prerequisites: [two-step-equations, complementary-supplementary-angles]
        exemplars:
          - problem: 'An angle measures $24^\circ$ more than its complement. Find the angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '57'
            solution_sketch: 'Let the angle be $x$, so its complement is $90 - x$. Then $x = (90 - x) + 24$, so $2x = 114$ and $x = 57$.'
          - problem: 'An angle is twice its supplement. Find the angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Let the angle be $x$, so its supplement is $180 - x$. Then $x = 2(180 - x)$ gives $3x = 360$ and $x = 120$.'
          - problem: 'A ladder leans against a vertical wall on level ground. The angle between the ladder and the ground is $18^\circ$ more than twice the angle between the ladder and the wall. What is the angle between the ladder and the ground?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The wall is vertical and the ground is level, so the two angles at the ladder are complementary. With wall angle $w$, the ground angle is $90 - w = 2w + 18$, so $3w = 72$ and $w = 24$. The ground angle is $90 - 24 = 66$.'
          - problem: 'An angle measures $18^\circ$ less than its supplement. Find the angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '81'
            solution_sketch: 'Write $x = (180 - x) - 18$. Then $2x = 162$, so $x = 81$, and the supplement $99$ is indeed $18$ more.'
          - problem: 'A branch track leaves a straight main track at a junction. On one side of the branch, the angle with the main track is $40^\circ$ more than three times the angle on the other side. What is the smaller of the two angles?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The two angles lie along the straight main track, so they add to $180^\circ$. With the smaller angle $a$, we get $a + (3a + 40) = 180$, so $4a = 140$ and $a = 35$. The other angle is $145^\circ$.'
          - problem: 'An angle is half its complement. Find the angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '30'
            solution_sketch: 'Write $x = \frac{1}{2}(90 - x)$, which gives $2x = 90 - x$. Then $3x = 90$ and $x = 30$.'
          - problem: 'An angle is five times its complement. Find the angle.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '75'
            solution_sketch: 'Write $x = 5(90 - x)$, so $x = 450 - 5x$ and $6x = 450$. Then $x = 75$, and its complement is $15$.'
          - problem: 'An angle is $20^\circ$ more than its complement. What is the angle?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'The angle $x$ is $20$ more than its complement $90 - x$. The equation is $x = (90 - x) + 20$, so $2x = 110$ and $x = 55$. The complement is $35$, and $55$ is $20$ more.'
        constraints: 'one linear condition relating an angle to its complement or supplement; integer answers; some conditions come from a ladder or a straight track'
      - id: kp3
        name: Vertical-angle equations and angles at a point
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Two vertical angles measure $(7x - 8)^\circ$ and $(5x + 16)^\circ$. Find the measure of each.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '76'
            solution_sketch: 'Vertical angles are equal, so $7x - 8 = 5x + 16$ and $x = 12$. Each angle measures $7(12) - 8 = 76$.'
          - problem: 'Four angles around a point measure $x^\circ$, $(2x)^\circ$, $(3x)^\circ$, and $(4x)^\circ$. Find the largest of them.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '144'
            solution_sketch: 'Angles around a point add to $360^\circ$, so $10x = 360$ and $x = 36$. The largest angle is $4x = 144$.'
          - problem: 'A circular flowerbed is divided by straight edging from its centre into three sectors. The angles at the centre are $(5x)^\circ$, $(6x)^\circ$, and $(7x)^\circ$. What is the angle of the largest sector?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '140'
            solution_sketch: 'The three angles fill the full turn around the centre, so $18x = 360$ and $x = 20$. The largest sector has angle $7x = 140$.'
          - problem: 'Two vertical angles measure $(8x - 3)^\circ$ and $(5x + 30)^\circ$. Find the measure of each.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '85'
            solution_sketch: 'Set $8x - 3 = 5x + 30$, which gives $3x = 33$ and $x = 11$. Each angle measures $8(11) - 3 = 85$.'
          - problem: 'Two straight roof beams cross. One angle between them is $(2x + 5)^\circ$ and the angle opposite it is $(x + 25)^\circ$. What is the measure of an angle adjacent to these two?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '135'
            solution_sketch: 'The given angles are vertical, so $2x + 5 = x + 25$ and $x = 20$. Each of them measures $45$, and an adjacent angle forms a linear pair with it, so it measures $180 - 45 = 135$.'
          - problem: 'A surveyor measures the four angles around a stake as $95^\circ$, $110^\circ$, $80^\circ$, and $70^\circ$. Can these measurements be correct?'
            answer_contract: {"kind":"label","options":[["no","they cannot","no, they cannot be correct","not correct","impossible","no, they cannot","they cannot be correct","not possible"],["yes","they can","yes, they can be correct","correct","possible","yes they can","yes, they can","they can be correct"]]}
            answer: 'no'
            solution_sketch: 'Four angles around a point must add to $360^\circ$. Here $95 + 110 + 80 + 70 = 355$, which is $5^\circ$ short, so the measurements cannot all be correct.'
          - problem: 'Which fact justifies writing $x + 2x + 3x + 4x = 360$ for four angles that meet at one point?'
            answer_contract: {"kind":"label","options":[["angles around a point","angles around a point sum to 360","the angles around a point add to 360 degrees","full turn","angles at a point","angles around a point add to 360","angle sum around a point"],["vertical angles theorem","vertical angles","vertical angle theorem","the vertical angles theorem"],["linear pair postulate","linear pair","the linear pair postulate"]]}
            answer: 'angles around a point'
            solution_sketch: 'Four angles that meet at a single point fill the whole turn around it. The angles around a point add to $360^\circ$, which gives the equation.'
          - problem: 'Five angles around a point measure $x^\circ$, $(x + 10)^\circ$, $(x + 20)^\circ$, $(x + 30)^\circ$, and $(x + 40)^\circ$. Find the smallest.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '52'
            solution_sketch: 'The sum is $5x + 100 = 360$, so $5x = 260$ and $x = 52$. The smallest angle is $52^\circ$.'
        constraints: 'angles at a point sum to 360; vertical pairs equal; integer solutions; verdict on measured angles; justification of the sum around a point'
    diagnostic_exemplar:
      problem: 'Two vertical angles measure $(5x - 12)^\circ$ and $(3x + 8)^\circ$. Find the measure of an angle that forms a linear pair with them, in degrees.'
      answer: '142'
      solution_sketch: 'Vertical angles are congruent: $5x - 12 = 3x + 8$ gives $x = 10$, so each measures $38^\circ$; the linear-pair partner is $180 - 38 = 142^\circ$.'
    anki_seeds:
      - front: "Vertical angles are always..."
        back: "congruent"
        type: basic
      - front: "A linear pair of angles is..."
        back: "supplementary (sums to 180 degrees)"
        type: basic
      - front: "The angles around a point sum to..."
        back: "360 degrees"
        type: basic

  - id: angle-bisectors
    name: Angle Bisectors
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: angle-relationships
        weight: 0.6
        key: true
      - id: segment-angle-addition
        weight: 0.5
        key: false
      - id: two-step-equations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: A bisector halves the angle
        key_prerequisites: [segment-angle-addition]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, and $m\angle AOC = 84^\circ$. Find $m\angle AOB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '42'
            solution_sketch: 'A bisector splits an angle into two equal angles. Each half is $84 / 2 = 42$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, and $m\angle AOB = 31^\circ$. Find $m\angle AOC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '62'
            solution_sketch: 'The bisector makes two equal halves, and $\angle AOB$ is one of them. The whole angle is $2 \cdot 31 = 62$.'
          - problem: 'A mitre saw cuts the two boards of a picture frame so that each cut is half of the corner angle. The corner of the frame is $140^\circ$. At what angle is each board cut?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The cut line bisects the corner, so each board is cut at half of the corner angle. Half of $140^\circ$ is $70^\circ$.'
          - problem: 'Ray $\overrightarrow{KT}$ bisects $\angle JKL$, and $m\angle JKT = 44^\circ$. Find $m\angle JKL$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '88'
            solution_sketch: 'The whole angle is twice one half. So $m\angle JKL = 2 \cdot 44 = 88$.'
          - problem: 'From a harbour $P$, the lines of sight to two lighthouses $A$ and $C$ make an angle of $78^\circ$. A buoy $B$ lies on the line from $P$ that bisects $\angle APC$. What angle does the line of sight $PB$ make with the line of sight $PA$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '39'
            solution_sketch: 'The line $PB$ bisects the $78^\circ$ angle, so it splits it into two equal angles. Each of them measures $78 / 2 = 39$.'
          - problem: 'A slice of cake has an angle of $52^\circ$ at its tip. A straight cut from the tip divides the slice into two equal slices. What is the angle at the tip of each new slice?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The straight cut bisects the angle at the tip. Each new slice has half of $52^\circ$, which is $26^\circ$.'
          - problem: 'Ray $\overrightarrow{OB}$ lies inside $\angle AOC$, with $m\angle AOB = 37^\circ$ and $m\angle BOC = 41^\circ$. Does $\overrightarrow{OB}$ bisect $\angle AOC$?'
            answer_contract: {"kind":"label","options":[["no","it does not","no, it does not bisect it","does not bisect","no it does not","no, it does not","it is not a bisector","not a bisector"],["yes","it does","yes, it bisects it","bisects","yes it does","yes, it does","it bisects it","it is a bisector"]]}
            answer: 'no'
            solution_sketch: 'A bisector makes two equal angles. Here $37^\circ$ and $41^\circ$ are not equal, so $\overrightarrow{OB}$ does not bisect $\angle AOC$.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Which definition justifies $m\angle AOB = m\angle BOC$?'
            answer_contract: {"kind":"label","options":[["definition of an angle bisector","angle bisector definition","an angle bisector makes two congruent angles","definition of angle bisector","definition of a bisector","bisector definition"],["vertical angles theorem","vertical angles","vertical angle theorem","the vertical angles theorem"],["linear pair postulate","linear pair","the linear pair postulate"]]}
            answer: 'definition of an angle bisector'
            solution_sketch: 'A bisector is by definition a ray that divides an angle into two congruent angles. So the angles $AOB$ and $BOC$ have equal measures.'
        constraints: 'angle measured in whole degrees, with the whole angle or one half given; lengths of turn, cuts and sightlines in real settings; one verdict on a ray inside an angle; one justification of the equal halves'
      - id: kp2
        name: Bisector equations with variables
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, with $m\angle AOB = (3x + 4)^\circ$ and $m\angle BOC = (5x - 12)^\circ$. Find $m\angle AOC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '56'
            solution_sketch: 'The halves are equal, so $3x + 4 = 5x - 12$ and $x = 8$. Each half is $3(8) + 4 = 28$, so $m\angle AOC = 56$.'
          - problem: 'Ray $\overrightarrow{QS}$ bisects $\angle PQR$, with $m\angle PQS = (2x + 7)^\circ$ and $m\angle PQR = (6x - 10)^\circ$. Find $m\angle PQR$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '62'
            solution_sketch: 'The whole angle is twice a half, so $2(2x + 7) = 6x - 10$. This gives $4x + 14 = 6x - 10$ and $x = 12$, so $m\angle PQR = 6(12) - 10 = 62$.'
          - problem: 'In a roof truss, a straight strut from the apex bisects the apex angle. The strut makes angles of $(4x + 6)^\circ$ and $(7x - 15)^\circ$ with the two rafters. What is the apex angle of the roof?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '68'
            solution_sketch: 'The strut bisects the apex angle, so $4x + 6 = 7x - 15$ and $x = 7$. Each half is $4(7) + 6 = 34$, so the apex angle is $2 \cdot 34 = 68$.'
          - problem: 'Ray $\overrightarrow{BD}$ bisects $\angle ABC$, with $m\angle ABD = (3x + 1)^\circ$ and $m\angle ABC = (8x - 14)^\circ$. Find $m\angle ABC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '50'
            solution_sketch: 'The whole angle is twice a half: $2(3x + 1) = 8x - 14$. Then $6x + 2 = 8x - 14$ gives $x = 8$, and $m\angle ABC = 8(8) - 14 = 50$.'
          - problem: 'A straight path in a park bisects the corner angle between two roads. The path makes an angle of $(5x - 8)^\circ$ with one road, and the corner angle between the roads is $(8x + 4)^\circ$. What angle does the path make with the road?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '42'
            solution_sketch: 'The corner angle is twice the angle between the path and a road, so $2(5x - 8) = 8x + 4$. Then $10x - 16 = 8x + 4$ gives $x = 10$, and the path makes $5(10) - 8 = 42$ with the road.'
          - problem: 'Ray $\overrightarrow{BD}$ bisects $\angle ABC$, with $m\angle ABD = (5x + 2)^\circ$ and $m\angle DBC = (7x - 10)^\circ$. Find $m\angle ABC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '64'
            solution_sketch: 'A bisector makes equal angles, so $5x + 2 = 7x - 10$. Then $12 = 2x$ and $x = 6$, and each half measures $5(6) + 2 = 32$, so $m\angle ABC = 64$.'
          - problem: 'Ray $\overrightarrow{OQ}$ lies inside $\angle MON$ with $m\angle MOQ = (3x + 2)^\circ$ and $m\angle QON = (5x - 10)^\circ$, and $m\angle MON = 72^\circ$. Does $\overrightarrow{OQ}$ bisect $\angle MON$?'
            answer_contract: {"kind":"label","options":[["no","it does not","no, it does not bisect it","does not bisect","no it does not","no, it does not","it is not a bisector","not a bisector"],["yes","it does","yes, it bisects it","bisects","yes it does","yes, it does","it bisects it","it is a bisector"]]}
            answer: 'no'
            solution_sketch: 'The two parts add up to $72$, so $8x - 8 = 72$ and $x = 10$. The parts are $32^\circ$ and $40^\circ$, which are not equal, so $\overrightarrow{OQ}$ is not a bisector.'
          - problem: 'Ray $\overrightarrow{OB}$ bisects $\angle AOC$, with $m\angle AOB = (3x + 9)^\circ$ and $m\angle AOC = (9x - 6)^\circ$. Find $m\angle AOC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The whole angle is twice a half, so $2(3x + 9) = 9x - 6$ and $6x + 18 = 9x - 6$. Then $x = 8$, and $m\angle AOC = 9(8) - 6 = 66$.'
        constraints: 'set the halves equal, or 2(half) = whole; integer solutions; one verdict on whether a ray is a bisector'
      - id: kp3
        name: Bisectors combined with other angle relationships
        key_prerequisites: [angle-relationships]
        exemplars:
          - problem: '$\angle AOC$ and $\angle COD$ form a linear pair, with $m\angle COD = 48^\circ$. Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Find $m\angle AOB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'The linear pair adds to $180^\circ$, so $m\angle AOC = 180 - 48 = 132$. The bisector halves it, so $m\angle AOB = 66$.'
          - problem: '$m\angle AOB = 88^\circ$. Ray $\overrightarrow{OC}$ bisects $\angle AOB$, and ray $\overrightarrow{OD}$ bisects $\angle AOC$. Find $m\angle AOD$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '22'
            solution_sketch: 'The first bisector gives $m\angle AOC = 88 / 2 = 44$. The second halves that angle again, so $m\angle AOD = 22$.'
          - problem: 'A straight sea wall runs through points $A$, $O$, and $D$. From $O$, a lighthouse $L$ is seen so that $m\angle AOL = 132^\circ$. A boat $B$ lies on the line from $O$ that bisects $\angle LOD$. What is $m\angle DOB$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '24'
            solution_sketch: 'The angles $AOL$ and $LOD$ lie along the straight wall, so $m\angle LOD = 180 - 132 = 48$. The boat is on the bisector, so $m\angle DOB = 48 / 2 = 24$.'
          - problem: '$\angle PQR$ and $\angle RQS$ form a linear pair, with $m\angle PQR = 112^\circ$. Ray $\overrightarrow{QT}$ bisects $\angle RQS$. Find $m\angle RQT$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '34'
            solution_sketch: 'The linear pair gives $m\angle RQS = 180 - 112 = 68$. Half of that is $m\angle RQT = 34$.'
          - problem: '$\angle AOC$ and $\angle COD$ form a linear pair, with $m\angle AOC = (5x + 10)^\circ$ and $m\angle COD = (3x + 10)^\circ$. Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Find $m\angle AOB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '55'
            solution_sketch: 'The linear pair gives $(5x + 10) + (3x + 10) = 180$, so $8x = 160$ and $x = 20$. Then $m\angle AOC = 110$ and its half is $m\angle AOB = 55$.'
          - problem: 'Two straight roads cross at a point $X$. One angle between them is $64^\circ$. A straight path starts at $X$ and bisects one of the two angles next to the $64^\circ$ angle. What angle does the path make with each road?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '58'
            solution_sketch: 'The next angle forms a linear pair with the $64^\circ$ angle, so it measures $180 - 64 = 116$. The path bisects it, so it makes $116 / 2 = 58$ with the road.'
          - problem: 'Lines $AB$ and $CD$ cross at $O$, and $m\angle AOC = 70^\circ$. Ray $\overrightarrow{OE}$ bisects $\angle BOD$. Find $m\angle BOE$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The angles $AOC$ and $BOD$ are vertical angles, so $m\angle BOD = 70$. The bisector halves it, so $m\angle BOE = 35$.'
          - problem: '$\angle AOC$ and $\angle COD$ form a linear pair with $m\angle COD = 50^\circ$, and ray $\overrightarrow{OB}$ bisects $\angle AOC$. What is $m\angle AOB$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'The bisected angle is $m\angle AOC = 180 - 50 = 130$, and its half is $65$. Half of the given $50^\circ$ angle would be the wrong angle.'
        constraints: 'at most two steps: one linear pair, vertical-angle or supplement step plus one or two halvings; one named-error item'
    diagnostic_exemplar:
      problem: '$\angle AOC$ and $\angle COD$ form a linear pair, with $m\angle AOC = (6x + 20)^\circ$ and $m\angle COD = (4x)^\circ$. Ray $\overrightarrow{OB}$ bisects $\angle AOC$. Find $m\angle AOB$, in degrees.'
      answer: '58'
      solution_sketch: '$(6x + 20) + 4x = 180$ gives $x = 16$, so $m\angle AOC = 116^\circ$ and the bisector halves it: $m\angle AOB = 58^\circ$.'
    anki_seeds:
      - front: "An angle bisector divides an angle into..."
        back: "two congruent angles"
        type: basic

