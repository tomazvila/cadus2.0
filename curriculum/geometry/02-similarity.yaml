unit: similarity
course: geometry
module: "Similarity"
topics:
  - id: scale-drawings
    name: Scale Drawings and Models
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: ratios-proportions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Drawing to actual
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A map uses the scale $1$ cm $: 5$ km. Two cities are $7$ cm apart on the map. Find the actual distance, in km.'
            answer: "35"
            solution_sketch: '$7 \cdot 5 = 35$ km.'
          - problem: 'A blueprint uses the scale $1$ cm $: 8$ m. A wall is $4.5$ cm long on the blueprint. Find its actual length, in meters.'
            answer: "36"
            solution_sketch: '$4.5 \cdot 8 = 36$ m.'
          - problem: 'A map uses the scale $1$ cm $: 12$ km. Two towns are $3.5$ cm apart on the map. Find the actual distance, in km.'
            answer: "42"
            solution_sketch: '$3.5 \cdot 12 = 42$ km.'
          - problem: 'A map uses the scale $1$ cm $: 6$ km. Two villages are $9$ cm apart on the map. Find the actual distance, in km.'
            answer: "54"
            solution_sketch: '$9 \cdot 6 = 54$ km.'
        constraints: "simple unit scales (1 cm : n km, 1 cm : n m); products come out whole or half"
      - id: kp2
        name: Actual to drawing
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A map uses the scale $1$ cm $: 20$ km. How long on the map is an actual distance of $120$ km, in cm?'
            answer: "6"
            solution_sketch: '$120 / 20 = 6$ cm.'
          - problem: 'A blueprint uses the scale $1$ cm $: 6$ m. How long on the blueprint is a $15$ m beam, in cm?'
            answer: "2.5"
            solution_sketch: '$15 / 6 = 2.5$ cm.'
          - problem: 'A blueprint uses the scale $1$ cm $: 9$ m. How long on the blueprint is a $27$ m pipe, in cm?'
            answer: "3"
            solution_sketch: '$27 / 9 = 3$ cm.'
          - problem: 'A map uses the scale $1$ cm $: 25$ km. How long on the map is an actual distance of $175$ km, in cm?'
            answer: "7"
            solution_sketch: '$175 / 25 = 7$ cm.'
        constraints: "divisions come out whole or to one decimal place"
      - id: kp3
        name: Find the scale
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A model is $8$ cm tall; the actual object is $2$ m tall. The scale is $1 : n$. Find $n$.'
            answer: "25"
            solution_sketch: '$2$ m $= 200$ cm; $8 : 200 = 1 : 25$.'
          - problem: 'A drawing shows a $12$ m wall as $3$ cm. The scale is $1$ cm $: n$ m. Find $n$.'
            answer: "4"
            solution_sketch: '$12 / 3 = 4$.'
          - problem: 'A drawing shows a $30$ m bridge as $6$ cm. The scale is $1$ cm $: n$ m. Find $n$.'
            answer: "5"
            solution_sketch: '$30 / 6 = 5$.'
          - problem: 'A drawing shows a $56$ m river as $8$ cm. The scale is $1$ cm $: n$ m. Find $n$.'
            answer: "7"
            solution_sketch: '$56 / 8 = 7$.'
        constraints: "convert to common units before reducing; scales reduce to 1 : n, and the item asks for n alone"
    diagnostic_exemplar:
      problem: 'A model is $6$ cm tall; the actual tower is $3$ m tall. The scale is $1 : n$. Find $n$.'
      answer: "50"
      solution_sketch: '$3$ m $= 300$ cm; $6 : 300 = 1 : 50$.'
    anki_seeds:
      - front: "A scale of 1 : n means every length on the drawing corresponds to ... actual length"
        back: "n times that"
        type: basic

  - id: dilations-scale-factors
    name: Dilations and Scale Factors
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: scale-drawings
        weight: 0.5
        key: false
      - id: ratios-proportions
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Scale lengths by a factor
        key_prerequisites: [ratios-proportions, scale-drawings]
        exemplars:
          - problem: 'A $4 \times 6$ rectangle is enlarged by scale factor $\frac{3}{2}$. Give the new dimensions.'
            answer: "6 by 9"
            solution_sketch: 'Multiply each dimension by $\frac{3}{2}$.'
          - problem: 'A segment of length $14$ is dilated with scale factor $\frac{1}{2}$. Find the image length.'
            answer: "7"
            solution_sketch: 'Multiply by the factor: $14 \cdot \frac{1}{2} = 7$.'
          - problem: 'A segment of length $15$ is dilated with scale factor $\frac{2}{3}$. Find the image length.'
            answer: "10"
            solution_sketch: '$15 \cdot \frac{2}{3} = 10$.'
          - problem: 'A side of length $9$ is dilated by scale factor $\frac{1}{3}$. Find the image length.'
            answer: "3"
            solution_sketch: '$9 \cdot \frac{1}{3} = 3$.'
          - problem: 'A side of length $12$ is dilated with scale factor $3$. Find the image length.'
            answer: "36"
            solution_sketch: '$12 \cdot 3 = 36$.'
        constraints: "scale factors are simple fractions or small integers; lengths chosen so images are whole or half-integers"
      - id: kp2
        name: Dilate coordinates about the origin
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A dilation centered at the origin has scale factor $3$. Find the image of $(2, -5)$.'
            answer: "(6, -15)"
            solution_sketch: 'Multiply both coordinates by $3$: $(3 \cdot 2,\ 3 \cdot (-5)) = (6, -15)$.'
          - problem: 'A dilation centered at the origin has scale factor $\frac{1}{2}$. Find the image of $(-4, 6)$.'
            answer: "(-2, 3)"
            solution_sketch: 'Multiply both coordinates by $\frac{1}{2}$.'
          - problem: 'A dilation centered at the origin has scale factor $2$. Find the image of $(-7, 3)$.'
            answer: "(-14, 6)"
            solution_sketch: 'Multiply both coordinates by $2$: $(-2 \cdot 7,\ 2 \cdot 3) = (-14, 6)$.'
          - problem: 'A dilation centered at the origin has scale factor $\frac{1}{4}$. Find the image of $(8, -12)$.'
            answer: "(2, -3)"
            solution_sketch: 'Multiply both coordinates by $\frac{1}{4}$: $(2, -3)$.'
        constraints: "center always the origin; integer image coordinates"
      - id: kp3
        name: Recover the scale factor; effect on perimeter
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A dilation maps a segment of length $8$ to a segment of length $20$. Find the scale factor.'
            answer: "5/2"
            solution_sketch: '$k = \frac{\text{image}}{\text{preimage}} = \frac{20}{8} = \frac{5}{2}$.'
          - problem: 'A triangle with perimeter $20$ is dilated by scale factor $\frac{3}{2}$. Find the perimeter of the image.'
            answer: "30"
            solution_sketch: 'Perimeter scales by the same factor $k$.'
          - problem: 'A dilation maps a segment of length $12$ to a segment of length $9$. Find the scale factor.'
            answer: "3/4"
            solution_sketch: '$k = \frac{\text{image}}{\text{preimage}} = \frac{9}{12} = \frac{3}{4}$, a reduction since $k < 1$.'
          - problem: 'A triangle with perimeter $15$ is dilated by scale factor $\frac{7}{3}$. Find the perimeter of the image.'
            answer: "35"
            solution_sketch: 'Perimeter scales by $k$: $15 \cdot \frac{7}{3} = 35$.'
        constraints: "scale factor as a reduced fraction; distinguish enlargement (k > 1) from reduction (k < 1)"
    diagnostic_exemplar:
      problem: 'A dilation centered at the origin maps $(-6, 4)$ to $(-9, 6)$. Find its scale factor, and find the perimeter of the image of a triangle whose perimeter is $20$ under this dilation.'
      answer: 'scale factor 3/2; image perimeter 30'
      answer_contract: {kind: none}
      solution_sketch: '$-9 / -6 = 6/4 = \frac{3}{2}$, so $k = \frac{3}{2} > 1$ (an enlargement); perimeter scales by $k$: $20 \cdot \frac{3}{2} = 30$.'
    anki_seeds:
      - front: "A dilation with scale factor k multiplies every distance by..."
        back: "k"
        type: basic
      - front: "Under a dilation with scale factor k, perimeter scales by k and area scales by..."
        back: "k squared"
        type: basic

  - id: similarity-transformations
    name: Similarity Transformations
    core: false                # terminal coordinate-transformation branch
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: dilations-scale-factors
        weight: 0.7
        key: true
      - id: rigid-motions-congruence
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Similarity via dilation plus rigid motion
        key_prerequisites: [dilations-scale-factors, rigid-motions-congruence]
        exemplars:
          - problem: 'A dilation with scale factor $3$ followed by a rotation maps segment $AB$ of length $5$ onto $A''B''$. Find $A''B''$.'
            answer: "15"
            solution_sketch: 'Only the dilation changes lengths: $5 \cdot 3 = 15$.'
          - problem: 'A dilation with scale factor $\frac{1}{2}$ followed by a reflection maps a segment of length $8$ onto its image. Find the image length.'
            answer: "4"
            solution_sketch: 'Rigid motions preserve length; the dilation scales it: $8 \cdot \frac{1}{2} = 4$.'
          - problem: "A dilation with scale factor 4 followed by a rotation maps figure A exactly onto figure B. State the relation between A and B, and give the scale factor."
            answer: "verdict = similar; scale = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["similar"], ["different"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "scale"}]}
            solution_sketch: "Step 1: A dilation with scale factor 4 changes lengths by 4, and a rotation is rigid, so the composition is a similarity transformation. Step 2: The relation is similar because shape is preserved. The wrong option different comes from ignoring that rigid motions keep shape. Step 3: The scale factor is the dilation factor, 4. The answer is verdict = similar; scale = 4."
          - problem: "A composition uses one dilation with scale factor 6 and one translation. State what the translation does to lengths, and give the image length of a segment of length 5."
            answer: "effect = preserves; length = 30"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["preserves"], ["changes"]]}, "name": "effect"}, {"contract": {"kind": "exact"}, "name": "length"}]}
            solution_sketch: "Step 1: A translation is a rigid motion, so it preserves all lengths. The wrong option changes comes from thinking a translation alters lengths. Step 2: The dilation with scale factor 6 multiplies the segment length 5 by 6. Step 3: The image length is 5*6 = 30. The answer is effect = preserves; length = 30."
          - problem: "A dilation with scale factor 1/2 followed by a translation maps figure A exactly onto figure B. State the relation between A and B, and give the scale factor."
            answer: "verdict = similar; scale = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["similar"], ["different"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "scale"}]}
            solution_sketch: "Step 1: A dilation with scale factor 1/2 changes lengths by 1/2, and a translation is rigid, so the composition is a similarity transformation. The wrong option different comes from ignoring that rigid motions keep shape. Step 2: Shape is preserved, so the relation is similar. Step 3: The scale factor is the dilation factor, 1/2. The answer is verdict = similar; scale = 1/2."
          - problem: "A dilation with scale factor 5 followed by a rotation maps figure A onto figure B. A dilation with scale factor 4 followed by a reflection maps figure B onto figure C. State the relation between A and C, and give the scale factor from A to C."
            answer: "verdict = similar; scale = 20"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["similar"], ["different"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "scale"}]}
            solution_sketch: "Step 1: Each composition is a dilation with a rigid motion, so each is a similarity transformation. The wrong option different comes from ignoring that similarity is transitive. Step 2: Similarity is transitive, so A and C are similar. Step 3: The scale factors multiply: 5*4 = 20. The answer is verdict = similar; scale = 20."
        constraints: "compositions of one dilation with one rigid motion; conceptual identification"
      - id: kp2
        name: Apply compositions to coordinates
        key_prerequisites: [dilations-scale-factors, rigid-motions-congruence]
        exemplars:
          - problem: 'Apply the dilation about the origin with $k = 2$, then the translation $(x, y) \mapsto (x + 1, y - 3)$, to the point $(3, 4)$. Give the final image.'
            answer: "(7, 5)"
            solution_sketch: '$(3,4) \mapsto (6,8) \mapsto (7,5)$.'
          - problem: 'Apply the reflection across the $x$-axis, then the dilation about the origin with $k = \frac{1}{2}$, to the point $(4, -6)$. Give the final image.'
            answer: "(2, 3)"
            solution_sketch: '$(4,-6) \mapsto (4,6) \mapsto (2,3)$.'
          - problem: 'Apply the translation $(x, y) \mapsto (x - 2, y + 5)$, then the dilation about the origin with $k = 3$, to the point $(1, -1)$. Give the final image.'
            answer: "(-3, 12)"
            solution_sketch: '$(1,-1) \mapsto (-1,4) \mapsto (-3,12)$.'
          - problem: 'Apply the dilation about the origin with $k = \frac{1}{2}$, then the translation $(x, y) \mapsto (x + 6, y - 1)$, to the point $(-4, 8)$. Give the final image.'
            answer: "(4, 3)"
            solution_sketch: '$(-4,8) \mapsto (-2,4) \mapsto (4,3)$.'
        constraints: "two-step compositions; origin-centered dilations, axis reflections, integer translations; integer images"
      - id: kp3
        name: Decide similarity and the scale factor from dimensions
        key_prerequisites: [dilations-scale-factors]
        exemplars:
          - problem: 'Is a $4 \times 6$ rectangle similar to a $6 \times 9$ rectangle? If so, give the scale factor from the smaller to the larger.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: '$\frac{6}{4} = \frac{9}{6} = \frac{3}{2}$: both dimension ratios match, so the rectangles are similar with scale factor $\frac{3}{2}$.'
          - problem: 'Is a $4 \times 6$ rectangle similar to an $8 \times 10$ rectangle?'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: '$\frac{8}{4} = 2$ but $\frac{10}{6} = \frac{5}{3}$: the ratios differ, so no.'
          - problem: 'A $6$ in by $10$ in photo is enlarged to a similar photo whose shorter side is $9$ in. How long is the longer side, in inches?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"length","unit":"in","allow_omitted":true}
            solution_sketch: 'The scale factor is $\frac{9}{6} = \frac{3}{2}$. The longer side is $10 \cdot \frac{3}{2} = 15$ in.'
          - problem: 'A $5 \times 8$ rectangle is similar to a $12.5 \times 20$ rectangle. What is the scale factor from the smaller to the larger?'
            answer: '5/2'
            answer_contract: {kind: exact}
            solution_sketch: 'Both dimension ratios agree: $\frac{12.5}{5} = \frac{20}{8} = \frac{5}{2}$. The scale factor is $\frac{5}{2}$.'
          - problem: 'Two similar triangles have corresponding sides of lengths $8$ and $12$. Find the scale factor from the smaller to the larger.'
            answer: "3/2"
            answer_contract: {kind: exact}
            solution_sketch: 'The scale factor is $\frac{12}{8} = \frac{3}{2}$. Each side of the smaller triangle is multiplied by $\frac{3}{2}$.'
          - problem: 'Two similar triangles have corresponding sides of lengths $4$ and $10$. Find the scale factor from the larger to the smaller.'
            answer: "2/5"
            answer_contract: {kind: exact}
            solution_sketch: 'Larger to smaller is $\frac{4}{10} = \frac{2}{5}$. The scale factor is less than $1$ because the figure shrinks.'
        constraints: "rectangles or triangles with two dimensions; compare ratios as reduced fractions"
    diagnostic_exemplar:
      problem: 'Apply the dilation about the origin with $k = 3$, then the reflection across the $y$-axis, to the point $(2, -1)$. Give the final image.'
      answer: "(-6, -3)"
      solution_sketch: '$(2,-1) \mapsto (6,-3) \mapsto (-6,-3)$.'
    anki_seeds:
      - front: "Two figures are similar exactly when one maps onto the other by a composition of..."
        back: "rigid motions and a dilation"
        type: basic

  - id: similar-polygons
    name: Similar Polygons
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: dilations-scale-factors
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Corresponding parts of similar polygons
        key_prerequisites: [dilations-scale-factors]
        exemplars:
          - problem: '$ABCD \sim EFGH$. Which angle of $EFGH$ corresponds to $\angle B$?'
            answer: 'angle F'
            answer_contract: {kind: label, options: [['angle E'], ['angle F'], ['angle G'], ['angle H']]}
            solution_sketch: 'Similarity statements list corresponding vertices in order.'
          - problem: '$ABCD \sim EFGH$ and $m\angle B = 75^\circ$. Find $m\angle F$, in degrees.'
            answer: "75"
            solution_sketch: 'Corresponding angles of similar polygons are congruent.'
          - problem: '$ABCD \sim EFGH$ and $m\angle E = 110^\circ$. Find $m\angle A$, in degrees.'
            answer: "110"
            solution_sketch: '$A$ corresponds to $E$ in the similarity statement, and corresponding angles are congruent.'
          - problem: '$ABCD \sim EFGH$ with $m\angle C = 40^\circ$ and $m\angle D = 95^\circ$. Find $m\angle G$, in degrees.'
            answer: "40"
            solution_sketch: 'In $ABCD \sim EFGH$, vertex $C$ corresponds to $G$, so $m\angle G = m\angle C = 40^\circ$.'
          - problem: '$ABCD \sim EFGH$ and $m\angle H = 128^\circ$. Find $m\angle D$, in degrees.'
            answer: "128"
            solution_sketch: 'Vertex $D$ corresponds to $H$; corresponding angles are congruent.'
        constraints: "read correspondence from the similarity statement; whole-degree angles"
      - id: kp2
        name: Solve for sides
        key_prerequisites: [dilations-scale-factors, ratios-proportions]
        exemplars:
          - problem: '$ABCD \sim EFGH$ with $AB = 6$, $EF = 9$, and $BC = 10$. Find $FG$.'
            answer: "15"
            solution_sketch: 'Scale factor $\frac{9}{6} = \frac{3}{2}$; $FG = 10 \cdot \frac{3}{2} = 15$.'
          - problem: 'Pentagon $ABCDE \sim$ pentagon $FGHIJ$ with $AB = 4$, $FG = 10$, and $CD = 8$. Find $HI$.'
            answer: "20"
            answer_contract: {kind: exact}
            solution_sketch: 'The scale factor from $ABCDE$ to $FGHIJ$ is $\frac{10}{4} = \frac{5}{2}$. Side $CD$ corresponds to $HI$, so $HI = 8 \cdot \frac{5}{2} = 20$.'
          - problem: '$ABCD \sim EFGH$ with $AB = 4$, $EF = 6$, and $DA = 8$. Find $HE$.'
            answer: "12"
            solution_sketch: 'Scale factor $\frac{6}{4} = \frac{3}{2}$; $HE = 8 \cdot \frac{3}{2} = 12$.'
          - problem: 'Pentagon $ABCDE \sim$ pentagon $FGHIJ$ with $AB = 10$, $FG = 6$, and $BC = 15$. Find $GH$.'
            answer: "9"
            solution_sketch: 'Scale factor $\frac{6}{10} = \frac{3}{5}$; $GH = 15 \cdot \frac{3}{5} = 9$.'
        constraints: "one unknown side per problem; integer answers"
      - id: kp3
        name: Perimeter and area ratios
        key_prerequisites: [dilations-scale-factors, ratios-proportions]
        exemplars:
          - problem: 'Two similar polygons have scale factor $2$ (small to large). The small one has perimeter $18$. Find the perimeter of the large one.'
            answer: "36"
            solution_sketch: 'Perimeters scale by $k$.'
          - problem: 'Two similar polygons have scale factor $3$ (small to large). The small one has area $5$. Find the area of the large one.'
            answer: "45"
            solution_sketch: 'Areas scale by $k^2 = 9$.'
          - problem: 'Two similar polygons have scale factor $4$ (small to large). The small one has perimeter $15$. Find the perimeter of the large one.'
            answer: "60"
            solution_sketch: 'Perimeters scale by $k = 4$: $15 \cdot 4 = 60$.'
          - problem: 'Two similar polygons have scale factor $2$ (small to large). The small one has area $7$. Find the area of the large one.'
            answer: "28"
            solution_sketch: 'Areas scale by $k^2 = 4$: $7 \cdot 4 = 28$.'
        constraints: "perimeter ratio k, area ratio k^2; integer answers"
    diagnostic_exemplar:
      problem: '$ABCD \sim WXYZ$ with $AB = 8$ and $WX = 12$. The area of $ABCD$ is $32$. Find the area of $WXYZ$.'
      answer: '72'
      solution_sketch: 'The scale factor is $\frac{12}{8} = \frac{3}{2}$, so areas scale by $k^2 = \frac{9}{4}$: $32 \cdot \frac{9}{4} = 72$.'
    anki_seeds:
      - front: "In similar polygons, corresponding angles are ... and corresponding sides are ..."
        back: "congruent; proportional"
        type: basic
      - front: "If similar figures have scale factor k, the ratio of their perimeters is..."
        back: "k"
        type: basic

  - id: triangle-similarity-criteria
    name: Triangle Similarity Criteria
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: similar-polygons
        weight: 0.6
        key: true
      - id: triangle-angle-sum
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: AA similarity
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: "Triangle 1 has angles 42 degrees and 67 degrees. Triangle 2 has angles 42 degrees and 71 degrees. State whether the triangles are similar and give the third angle of Triangle 1, in degrees."
            answer: "verdict = yes; angle = 71"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "angle"}]}
            solution_sketch: "Triangle 1 has angles 42, 67, and an unknown third angle. By the triangle angle sum, the third angle of Triangle 1 is 180 - 42 - 67 = 71 degrees. Triangle 2 has angles 42, 71, and its third angle is 180 - 42 - 71 = 67 degrees. The angle sets {42, 67, 71} are the same, so by AA similarity the triangles are similar. The option no is wrong because the angle sets match. The answer is verdict = yes; angle = 71."
          - problem: "Triangle 1 is a right triangle with an acute angle of 35 degrees. Triangle 2 is a right triangle with an acute angle of 35 degrees. State whether the triangles are similar and give the third angle of Triangle 1, in degrees."
            answer: "verdict = yes; angle = 55"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "angle"}]}
            solution_sketch: "Triangle 1 is a right triangle with angles 90, 35, and an unknown third angle. By the triangle angle sum, the third angle is 180 - 90 - 35 = 55 degrees. Triangle 2 also has angles 90, 35, and 55. Both triangles have the same angle set, so by AA similarity they are similar. The option no is wrong because both angle sets match. The answer is verdict = yes; angle = 55."
          - problem: "In triangle ABC, angle A is 48 degrees and angle B is 62 degrees. In triangle DEF, angle D is 48 degrees and angle E is 70 degrees. State whether the triangles are similar and give the third angle of triangle ABC, in degrees."
            answer: "verdict = yes; angle = 70"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "angle"}]}
            solution_sketch: "Triangle ABC has angles 48, 62, and an unknown third angle. By the triangle angle sum, the third angle of ABC is 180 - 48 - 62 = 70 degrees. Triangle DEF has angles 48, 70, and its third angle is 180 - 48 - 70 = 62 degrees. The angle sets {48, 62, 70} match, so by AA similarity the triangles are similar. The option no is wrong because the angle sets match. The answer is verdict = yes; angle = 70."
          - problem: 'Triangle 1 has angles $36^\circ$ and $71^\circ$; Triangle 2 has angles $36^\circ$ and $x^\circ$ and is similar to Triangle 1. Find $x$, in degrees.'
            answer: "73"
            solution_sketch: 'The third angle of Triangle 1 is $180 - 36 - 71 = 73$; similar triangles have matching angle sets, so $x = 73$.'
          - problem: "Triangle 1 has two angles measuring 47 degrees and 74 degrees. Triangle 2 has two angles measuring 47 degrees and 69 degrees. State whether the triangles are similar, and give the measure of the unknown third angle of Triangle 1, in degrees."
            answer: "verdict = no; angle = 59"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "angle"}]}
            solution_sketch: "Triangle 1 has angles 47, 74, and one unknown angle. By the triangle angle sum, the unknown angle of Triangle 1 is 180 - 47 - 74 = 59 degrees. Triangle 2 has angles 47, 69, and its third angle is 180 - 47 - 69 = 64 degrees. The angle sets {47, 59, 74} and {47, 64, 69} are different, so the triangles are not similar by AA. The option yes is wrong because the two angle sets do not match. The answer is verdict = no; angle = 59."
          - problem: "Triangle 1 has two angles measuring 34 degrees and 63 degrees. Triangle 2 is similar to Triangle 1 and has one angle measuring 63 degrees. Compute the measure of the largest angle of Triangle 2, in degrees."
            answer: "83"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Triangle 1 has angles 34, 63, and one unknown angle. By the triangle angle sum, the third angle of Triangle 1 is 180 - 34 - 63 = 83 degrees. Because Triangle 2 is similar to Triangle 1, its angles form the same set {34, 63, 83}; the single given angle of 63 degrees alone would not determine the others, so the similarity is needed. The largest angle of Triangle 2 is therefore 83 degrees. The answer is 83."
        constraints: "always resolvable via the third angle; whole-degree angles"
      - id: kp2
        name: SAS and SSS similarity
        key_prerequisites: [similar-polygons]
        exemplars:
          - problem: "Triangle 1 has sides 4, 6, 8. Triangle 2 has sides 6, 9, 12. Find the scale factor from Triangle 1 to Triangle 2 as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the side ratios in order: 6/4, 9/6, 12/8. Each ratio simplifies to 3/2, so SSS similarity holds with scale factor 3/2. The scale factor is 3/2."
          - problem: "Triangle 1 has sides 5 and 8 with a 40 degree included angle. Triangle 2 has sides 10 and 16 with a 40 degree included angle. Find the scale factor from Triangle 1 to Triangle 2."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For SAS similarity, check the two side ratios and the included angle. 10/5 = 2 and 16/8 = 2, and the included angles are both 40 degrees. The scale factor is 2."
          - problem: "Triangle 1 has sides 6, 8, 10. Triangle 2 has sides 9, 12, x and is similar to Triangle 1 by SSS. Find x."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use SSS similarity: all three side ratios must match. From 9/6 = 3/2 and 12/8 = 3/2, the scale factor is 3/2. Then x/10 = 3/2, so x = 15."
          - problem: "Triangle 1 has sides 4, 5, 6. Triangle 2 has sides 8, 10, x and is similar to Triangle 1 by SSS. Find x."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use SSS similarity: compare all three ratios. 8/4 = 2 and 10/5 = 2, so the scale factor is 2. Then x/6 = 2, so x = 12."
          - problem: "Triangle 1 has sides 3 and 5 with a 50 degree included angle. Triangle 2 has sides 9 and 15 with a 50 degree included angle. Find the scale factor from Triangle 1 to Triangle 2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For SAS similarity, the two side ratios must match and the included angles must be equal. 9/3 = 3 and 15/5 = 3, and both included angles are 50 degrees. The scale factor is 3."
          - problem: "Triangle 1 has sides 5 and 7 with a 40 degree included angle. Triangle 2 has sides 10 and 14. Find the included angle in degrees between the sides 10 and 14 that makes Triangle 2 similar to Triangle 1 by SAS."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For SAS similarity, the two side ratios must match and the included angle must be equal. The ratios are 10/5 = 2 and 14/7 = 2, so the triangles are similar only if the included angle is the same. The included angle is 40."
        constraints: "SSS: compare all three ratios; SAS: the equal angle must be included; ratios are simple fractions"
      - id: kp3
        name: Decide the criterion or rule out similarity
        key_prerequisites: [similar-polygons, triangle-angle-sum]
        exemplars:
          - problem: "Triangle 1 has sides 4, 6, 9; Triangle 2 has sides 8, 12, 18. Find the scale factor if the triangles are similar, or the failing ratio if they are not, as a fraction."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check SSS: compute the three ratios of corresponding sides, shortest to shortest and so on: 8/4 = 2, 12/6 = 2, and 18/9 = 2. All three ratios match, so the triangles are similar by SSS and the common ratio is the scale factor. The scale factor is 2."
          - problem: "Triangle 1 has sides 3, 4, 5; Triangle 2 has sides 6, 8, 9. Find the scale factor if the triangles are similar, or the failing ratio if they are not, as a fraction."
            answer: "9/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check SSS: the ratios of corresponding sides are 6/3 = 2, 8/4 = 2, and 9/5 = 9/5. Two ratios match but the third differs, so the triangles are not similar and the mismatch sits in exactly one ratio. The failing ratio is 9/5."
          - problem: 'Triangle 1 has sides $8$, $10$, $12$ and is similar to Triangle 2, whose corresponding shortest side is $4$. Find the scale factor from Triangle 1 to Triangle 2, as a fraction.'
            answer: "1/2"
            solution_sketch: 'Corresponding shortest sides: $4/8 = 1/2$.'
          - problem: "Triangle 1 has angles 45 and 65 degrees; Triangle 2 has angles 65 and 70 degrees. Which criterion proves the triangles similar, or does no criterion apply?"
            answer: "AA"
            answer_contract: {"kind": "label", "options": [["SSS"], ["SAS"], ["AA"], ["none"]]}
            solution_sketch: "Apply the triangle angle sum to get the third angles: 180 - 45 - 65 = 70 and 180 - 65 - 70 = 45. The angle sets 45, 65, 70 agree, so the triangles are similar by AA. SSS is wrong because no side lengths are given, SAS is wrong because no side is given, and none is wrong because the third angles resolve to the same set. The criterion is AA."
          - problem: "One triangle has angles 40 and 65 degrees; a second triangle has angles 40 and 40 degrees. Give the criterion that applies, if any, and the third angle of the second triangle."
            answer: "verdict = none; third = 100"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["SSS"], ["SAS"], ["AA"], ["none"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "third"}]}
            solution_sketch: "Use the triangle angle sum: the third angles are 180 - 40 - 65 = 75 and 180 - 40 - 40 = 100. Since 75 and 100 differ, the angle sets differ, so no similarity criterion applies. SSS and SAS are wrong because no side lengths are given, and AA is wrong because the third angles differ. The answer is verdict = none; third = 100."
          - problem: "Triangle P has sides of lengths 9 and 12 with an included angle of 30 degrees; Triangle Q has sides of lengths 6 and 8 with an included angle of 30 degrees. Give the criterion and the scale factor from Triangle P to Triangle Q."
            answer: "criterion = SAS; factor = 2/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["SSS"], ["SAS"], ["AA"]]}, "name": "criterion"}, {"contract": {"kind": "exact"}, "name": "factor"}]}
            solution_sketch: "Match the shorter side to the shorter side and compare ratios: 9/6 = 3/2 and 12/8 = 3/2, and the included angles are both 30 degrees. Two pairs of corresponding sides are proportional with equal included angles, so the triangles are similar by SAS. SSS is wrong because only two side pairs are known, and AA is wrong because only one angle is known. The scale factor from P to Q is 6/9 = 2/3, so the answer is criterion = SAS; factor = 2/3."
        constraints: "mismatches live in exactly one ratio or resolve via the third angle"
    diagnostic_exemplar:
      problem: 'Triangle 1 has sides $6$, $9$, $12$; Triangle 2 has sides $10$, $15$, $20$. Are they similar? If so, state the criterion.'
      answer: 'yes'
      answer_contract: {kind: label, options: [[yes], [no]]}
      solution_sketch: '$\frac{6}{10} = \frac{9}{15} = \frac{12}{20} = \frac{3}{5}$: all three ratios match, so yes by SSS similarity.'
    anki_seeds:
      - front: "AA similarity: two triangles are similar if..."
        back: "two pairs of corresponding angles are congruent"
        type: basic
      - front: "SAS similarity requires two pairs of sides in proportion and..."
        back: "congruent included angles"
        type: basic

  - id: similar-triangles
    name: Similar Triangles
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-similarity-criteria
        weight: 0.7
        key: true
      - id: dilations-scale-factors
        weight: 0.5
        key: false
      - id: ratios-proportions
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Solve for sides with the scale factor
        key_prerequisites: [dilations-scale-factors, ratios-proportions]
        exemplars:
          - problem: '$\triangle ABC \sim \triangle DEF$ with $AB = 6$, $DE = 9$, and $BC = 8$. Find $EF$.'
            answer: "12"
            solution_sketch: 'Scale factor $\frac{9}{6} = \frac{3}{2}$; $EF = 8 \cdot \frac{3}{2} = 12$.'
          - problem: '$\triangle PQR \sim \triangle XYZ$ with $PQ = 6$, $XY = 10$, and $QR = 9$. Find $YZ$.'
            answer: "15"
            solution_sketch: 'Scale factor $\frac{10}{6} = \frac{5}{3}$; $YZ = 9 \cdot \frac{5}{3} = 15$.'
          - problem: '$\triangle ABC \sim \triangle DEF$ with $AB = 4$, $DE = 10$, and $BC = 7$. Find $EF$.'
            answer: "17.5"
            solution_sketch: 'Scale factor $\frac{10}{4} = \frac{5}{2}$; $EF = 7 \cdot \frac{5}{2} = 17.5$.'
          - problem: '$\triangle PQR \sim \triangle XYZ$ with $PQ = 8$, $XY = 12$, and $QR = 14$. Find $YZ$.'
            answer: "21"
            answer_contract: {kind: exact}
            solution_sketch: 'The scale factor from $\triangle PQR$ to $\triangle XYZ$ is $\frac{12}{8} = \frac{3}{2}$. Side $QR$ corresponds to $YZ$, so $YZ = 14 \cdot \frac{3}{2} = 21$.'
        constraints: "proportions with one unknown; answers whole numbers or one decimal place"
      - id: kp2
        name: Nested similar triangles
        key_prerequisites: [triangle-similarity-criteria, ratios-proportions]
        exemplars:
          - problem: 'In $\triangle ABC$, $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$ with $\overline{DE} \parallel \overline{BC}$. If $AD = 4$, $DB = 6$, and $DE = 6$, find $BC$.'
            answer: "15"
            solution_sketch: '$\triangle ADE \sim \triangle ABC$ with ratio $\frac{AD}{AB} = \frac{4}{10}$, so $BC = 6 \cdot \frac{10}{4} = 15$.'
          - problem: '$\triangle ABC \sim \triangle AED$ share vertex $A$, with $AB = 12$, $AE = 4$, and $BC = 9$. Find $ED$.'
            answer: "3"
            solution_sketch: 'Ratio $\frac{AE}{AB} = \frac{1}{3}$, so $ED = 9 \cdot \frac{1}{3} = 3$.'
          - problem: 'In $\triangle ABC$, $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$ with $\overline{DE} \parallel \overline{BC}$. If $AD = 3$, $DB = 9$, and $DE = 5$, find $BC$.'
            answer: "20"
            solution_sketch: '$\triangle ADE \sim \triangle ABC$ with ratio $\frac{AD}{AB} = \frac{3}{12} = \frac{1}{4}$, so $BC = 5 \cdot 4 = 20$.'
          - problem: '$\triangle ABC \sim \triangle AED$ share vertex $A$, with $AB = 10$, $AE = 5$, and $BC = 8$. Find $ED$.'
            answer: "4"
            solution_sketch: 'Ratio $\frac{AE}{AB} = \frac{5}{10} = \frac{1}{2}$, so $ED = 8 \cdot \frac{1}{2} = 4$.'
        constraints: "ratio uses the whole side (AD + DB), the classic trap; clean integer answers"
      - id: kp3
        name: Perimeters of similar triangles
        key_prerequisites: [ratios-proportions, dilations-scale-factors]
        exemplars:
          - problem: '$\triangle ABC \sim \triangle DEF$ with scale factor $\frac{5}{3}$ from $\triangle ABC$ to $\triangle DEF$. The perimeter of $\triangle ABC$ is $30$. Find the perimeter of $\triangle DEF$.'
            answer: "50"
            solution_sketch: 'Perimeters scale by the same factor: $30 \cdot \frac{5}{3} = 50$.'
          - problem: 'Two similar triangles have perimeters in the ratio $3 : 4$. A side of the smaller measures $9$. Find the corresponding side of the larger.'
            answer: "12"
            solution_sketch: 'Sides share the perimeter ratio: $9 \cdot \frac{4}{3} = 12$.'
          - problem: '$\triangle ABC \sim \triangle DEF$ with scale factor $\frac{2}{5}$ from $\triangle ABC$ to $\triangle DEF$. The perimeter of $\triangle ABC$ is $20$. Find the perimeter of $\triangle DEF$.'
            answer: "8"
            solution_sketch: 'Perimeters scale by the same factor: $20 \cdot \frac{2}{5} = 8$.'
          - problem: 'Two similar triangles have perimeters in the ratio $5 : 7$. A side of the larger measures $21$. Find the corresponding side of the smaller.'
            answer: "15"
            solution_sketch: 'Sides share the perimeter ratio: $21 \cdot \frac{5}{7} = 15$.'
        constraints: "perimeter ratio equals the side ratio; integer answers"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$, $D$ lies on $\overline{AB}$ and $E$ on $\overline{AC}$ with $\overline{DE} \parallel \overline{BC}$. If $AD = 6$, $DB = 9$, and $DE = 8$, find $BC$.'
      answer: "20"
      solution_sketch: '$\triangle ADE \sim \triangle ABC$ with ratio $\frac{AD}{AB} = \frac{6}{15}$; $BC = 8 \cdot \frac{15}{6} = 20$.'
    anki_seeds:
      - front: "In similar triangles, corresponding sides are..."
        back: "proportional (all pairs share one scale factor)"
        type: basic
      - front: "If similar figures have scale factor k, the ratio of their areas is..."
        back: "k squared"
        type: basic
      - front: "In the nested DE ∥ BC configuration, the similarity ratio uses AD over..."
        back: "the whole side AB = AD + DB (not DB)"
        type: basic

  - id: proving-triangles-similar
    name: Proving Triangles Similar
    core: false                # proof-practice genre; terminal
    difficulty: 0.46
    drill: false
    answer_kind: numeric       # flipped from multi-step: exemplars are single-answer (labels with contracts / numerals), per the proven pattern
    expected_time_secs: 240
    prerequisites:
      - id: triangle-similarity-criteria
        weight: 0.6
        key: true
      - id: similar-triangles
        weight: 0.6
        key: true
      - id: congruence-proofs-cpctc
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: AA proofs from parallel lines and vertical angles
        key_prerequisites: [triangle-similarity-criteria]
        exemplars:
          - problem: 'In $\triangle ABC$, $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$ with $\overline{DE} \parallel \overline{BC}$. Which reason gives $\angle ADE \cong \angle ABC$: corresponding angles, vertical angles, the reflexive property, or the definition of midpoint?'
            answer: 'corresponding angles'
            answer_contract: {kind: label, options: [['corresponding angles'], ['vertical angles'], ['the reflexive property'], ['the definition of midpoint']]}
            solution_sketch: 'The transversal $\overline{AB}$ crosses the parallels $\overline{DE}$ and $\overline{BC}$, so the corresponding angles agree; with shared $\angle A$, AA follows.'
          - problem: 'Segments $\overline{AC}$ and $\overline{BD}$ intersect at $E$, with $\overline{AB} \parallel \overline{CD}$. Which reason gives $\angle BAE \cong \angle DCE$: alternate interior angles, corresponding angles, vertical angles, or the reflexive property?'
            answer: 'alternate interior angles'
            answer_contract: {kind: label, options: [['alternate interior angles'], ['corresponding angles'], ['vertical angles'], ['the reflexive property']]}
            solution_sketch: '$\overline{AC}$ is a transversal of the parallels $\overline{AB}$ and $\overline{CD}$, so the alternate interior angles agree; together with the vertical angles at $E$ this is AA.'
          - problem: 'In $\triangle ABC$, $D$ is on $\overline{AB}$ and $E$ is on $\overline{AC}$, with $\overline{DE} \parallel \overline{BC}$. Also $m\angle A = 65^\circ$ and $m\angle B = 52^\circ$. Find $m\angle AED$.'
            answer: '63'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'Corresponding angles give $\angle AED \cong \angle ACB$. In $\triangle ABC$, $m\angle C = 180 - 65 - 52 = 63$ degrees, so $m\angle AED = 63$ degrees.'
          - problem: 'Segments $\overline{AC}$ and $\overline{BD}$ intersect at $E$, with $\overline{AB} \parallel \overline{CD}$. Also $m\angle AEB = 70^\circ$ and $m\angle BAE = 50^\circ$. Find $m\angle CDE$.'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'In $\triangle ABE$, $m\angle ABE = 180 - 70 - 50 = 60$ degrees. Alternate interior angles give $\angle CDE \cong \angle ABE$, so $m\angle CDE = 60$ degrees.'
          - problem: 'In $\triangle ABC$, the point $D$ is on $\overline{AB}$ and $E$ is on $\overline{AC}$, with $\overline{DE} \parallel \overline{BC}$. Here $AD = 6$ cm, $AB = 9$ cm and $DE = 8$ cm. How long is $\overline{BC}$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The parallel lines give $\angle ADE \cong \angle ABC$, and $\angle A$ is shared, so $\triangle ADE \sim \triangle ABC$ by AA. Then $BC/DE = AB/AD = 9/6$, so $BC = 8 \cdot 9/6 = 12$ cm.'
          - problem: 'The segments $\overline{AC}$ and $\overline{BD}$ intersect at $E$, with $\overline{AB} \parallel \overline{CD}$. Here $AE = 4$ cm, $EC = 10$ cm and $AB = 6$ cm. How long is $\overline{CD}$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The alternate interior angles and the vertical angles at $E$ give $\triangle ABE \sim \triangle CDE$ by AA. Then $CD/AB = CE/AE = 10/4$, so $CD = 6 \cdot 10/4 = 15$ cm.'
        constraints: "AA via corresponding, alternate interior, or vertical angles; two cited angle pairs with reasons"
      - id: kp2
        name: AA proofs with right triangles and shared angles
        key_prerequisites: [triangle-similarity-criteria]
        exemplars:
          - problem: 'Right triangles $\triangle ABC$ and $\triangle ADE$ have right angles at $B$ and $D$ and share $\angle A$. Which criterion shows $\triangle ABC \sim \triangle ADE$: AA, SAS similarity, or SSS similarity?'
            answer: 'AA'
            answer_contract: {kind: label, options: [[AA, 'AA similarity'], [SAS, 'SAS similarity'], [SSS, 'SSS similarity']]}
            solution_sketch: 'The right angles agree and $\angle A$ is shared: two pairs of congruent angles, so AA.'
          - problem: '$\triangle ABC$ and $\triangle DBE$ share $\angle B$, and $\angle BAC \cong \angle BDE$. Here $AB = 12$ cm, $DB = 8$ cm and $BC = 15$ cm. How long is $\overline{BE}$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The shared $\angle B$ and the congruent pair give $\triangle ABC \sim \triangle DBE$ by AA, with $A$ matching $D$. Then $\frac{BE}{BC} = \frac{DB}{AB}$, so $BE = 15 \cdot \frac{8}{12} = 10$ cm.'
          - problem: 'Right triangles $\triangle PQR$ and $\triangle STU$ have right angles at $Q$ and $T$ and $m\angle P = 40^\circ$, $m\angle S = 40^\circ$. Are the triangles similar?'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'The right angles match and $\angle P \cong \angle S$; two angle pairs agree, so AA gives similarity.'
          - problem: 'Right triangles $\triangle ABC$ and $\triangle DEF$ have right angles at $B$ and $E$, and $\angle A \cong \angle D$. Also $m\angle C = 35^\circ$. Find $m\angle F$.'
            answer: '35'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'The right angles and $\angle A \cong \angle D$ give $\triangle ABC \sim \triangle DEF$ by AA. The third angles match, so $m\angle F = 35$ degrees.'
          - problem: 'A person $1.8$ m tall casts a shadow $2.4$ m long. At the same moment a tree casts a shadow $14.4$ m long. How tall is the tree, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '10.8'
            solution_sketch: 'The person and the tree stand at right angles to the ground and the sun makes the same angle with the ground, so the right triangles are similar by AA. Then $h/14.4 = 1.8/2.4$, so $h = 14.4 \cdot 0.75 = 10.8$ m.'
          - problem: 'Right triangles $\triangle ABC$ and $\triangle DEF$ have right angles at $B$ and $E$, and $\angle A \cong \angle D$. Here $AB = 9$ cm, $BC = 12$ cm and $DE = 6$ cm. How long is $\overline{EF}$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The right angles and the congruent angles at $A$ and $D$ give $\triangle ABC \sim \triangle DEF$ by AA. Then $EF/BC = DE/AB = 6/9$, so $EF = 12 \cdot 6/9 = 8$ cm.'
        constraints: "one shared or right-angle pair plus one given pair; AA only"
      - id: kp3
        name: SAS and SSS similarity proofs
        key_prerequisites: [triangle-similarity-criteria, similar-triangles]
        exemplars:
          - problem: 'In the configuration with $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$, $AD = 2$, $AB = 8$, $AE = 3$, $AC = 12$. What is the common value of $\frac{AD}{AB}$ and $\frac{AE}{AC}$ as a fraction?'
            answer: '1/4'
            solution_sketch: '$\frac{2}{8} = \frac{1}{4}$ and $\frac{3}{12} = \frac{1}{4}$, so the triangles are similar by SAS similarity (shared $\angle A$).'
          - problem: "In triangle ABC, point D lies on side AB and point E lies on side AC. You are given AD = 3, AB = 9, AE = x, and AC = 12. Angle A is the included angle between AD and AE in triangle ADE, and it is also the included angle between AB and AC in triangle ABC. Find x so that triangle ADE is similar to triangle ABC by SAS similarity."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute the side ratios. AD/AB = 3/9 = 1/3 and AE/AC = x/12. Step 2: apply the SAS similarity criterion, which uses the included angle A. Angle A is included between AD and AE in triangle ADE and between AB and AC in triangle ABC. Set the ratios equal: 1/3 = x/12. Step 3: solve for x: x = 4. The value of x is 4."
          - problem: "Triangle 1 has side lengths 6, 8, and 10. Triangle 2 has side lengths 9, 12, and 15. The sides correspond in the order given. Determine the scale factor from Triangle 1 to Triangle 2."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute each corresponding side ratio. 9/6 = 3/2, 12/8 = 3/2, and 15/10 = 3/2. Step 2: apply the SSS similarity criterion: because all three ratios are equal, the triangles are similar. Step 3: read the common scale factor from the ratios. The scale factor from Triangle 1 to Triangle 2 is 3/2."
          - problem: "Triangle RST has side lengths 5, 7, and 9. Triangle UVW is similar to triangle RST. The two shortest sides of triangle UVW are 10 and 14, corresponding to the two shortest sides of triangle RST. Find the length of the longest side of triangle UVW."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute the ratios of the given corresponding sides. 10/5 = 2 and 14/7 = 2. Step 2: apply the SSS similarity criterion: the equal ratios confirm the triangles are similar. Step 3: multiply the longest side of triangle RST by the scale factor. 9 * 2 = 18. The length of the longest side of triangle UVW is 18."
        constraints: "compute every ratio explicitly; the included angle must be identified for SAS"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$, $D$ lies on $\overline{AB}$ and $E$ on $\overline{AC}$ with $AD = 4$, $AB = 10$, $AE = 6$, and $AC = 15$. Which criterion shows $\triangle ADE \sim \triangle ABC$: AA, SAS similarity, or SSS similarity?'
      answer: 'SAS similarity'
      answer_contract: {kind: label, options: [[AA], ['SAS similarity'], ['SSS similarity']]}
      solution_sketch: 'Both ratios of the sides flanking $\angle A$ equal $\frac{2}{5}$ ($\frac{4}{10}$ and $\frac{6}{15}$), and the included angle is common to both triangles.'
    anki_seeds:
      - front: "The three triangle similarity criteria are..."
        back: "AA, SAS similarity, SSS similarity"
        type: basic
      - front: "In a similarity proof with DE ∥ BC, the angle pairs come from ... angles"
        back: "corresponding (or alternate interior) angles along the parallels"
        type: basic

