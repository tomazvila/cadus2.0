            answer: "7.2"
            solution_sketch: '$\frac{h}{9} = \frac{1.6}{2} = 0.8$, so $h = 7.2$ m.'
          - problem: 'A $1.2$ m tall child casts a $1.5$ m shadow; a nearby pole casts a $6$ m shadow at the same time. Find the height of the pole, in meters.'
            answer: "4.8"
            solution_sketch: '$\frac{h}{6} = \frac{1.2}{1.5} = 0.8$, so $h = 4.8$ m.'
        constraints: "same-time shadows give similar right triangles; answers whole or one decimal place"
      - id: kp2
        name: Mirror method
        key_prerequisites: [similar-triangles, ratios-proportions]
        exemplars:
          - problem: 'A mirror lies on the ground $3$ m from a person whose eyes are $1.5$ m high, and $12$ m from a tower. The person sees the tower''s top in the mirror. Find the tower''s height, in meters.'
            answer: "6"
            solution_sketch: 'Equal angles at the mirror give similar triangles: $\frac{h}{12} = \frac{1.5}{3}$, so $h = 6$ m.'
          - problem: 'A mirror lies $2$ m from a person (eye height $1.6$ m) and $15$ m from a building. The person sees the building''s top in the mirror. Find the building''s height, in meters.'
            answer: "12"
            solution_sketch: '$\frac{h}{15} = \frac{1.6}{2}$, so $h = 12$ m.'
          - problem: 'A mirror lies on the ground $4$ m from a person whose eyes are $1.7$ m high, and $20$ m from a flagpole. The person sees the flagpole''s top in the mirror. Find the flagpole''s height, in meters.'
            answer: "8.5"
            solution_sketch: 'Equal angles at the mirror give similar triangles: $\frac{h}{20} = \frac{1.7}{4}$, so $h = 8.5$ m.'
          - problem: 'A mirror lies $2.5$ m from a person (eye height $1.6$ m) and $10$ m from a statue. The person sees the statue''s top in the mirror. Find the statue''s height, in meters.'
            answer: "6.4"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The two right triangles are similar, so $\frac{h}{10} = \frac{1.6}{2.5} = 0.64$. Then $h = 6.4$ m.'
        constraints: "angle of incidence equals angle of reflection; clean proportions"
      - id: kp3
        name: Inaccessible distances
        key_prerequisites: [similar-triangles, ratios-proportions]
        exemplars:
          - problem: 'To find the width $AB$ of a river, surveyors mark $BC = 30$ m along the bank ($\angle ABC = 90^\circ$), extend to $D$ with $CD = 6$ m, and walk $DE = 8$ m perpendicular to the bank until $E$, $C$, $A$ are collinear. The right angles at $B$ and $D$ and the vertical angles at $C$ make $\triangle ABC \sim \triangle EDC$. Find $AB$, in meters.'
            answer: "40"
            solution_sketch: '$\frac{AB}{DE} = \frac{BC}{DC} \Rightarrow AB = 8 \cdot \frac{30}{6} = 40$ m.'
          - problem: 'A $2$-m stick held $5$ m from an observer''s eye exactly covers a cliff $80$ m away. Find the height of the cliff, in meters.'
            answer: "32"
            solution_sketch: 'Similar triangles from the eye: $\frac{h}{80} = \frac{2}{5}$, so $h = 32$ m.'
          - problem: 'To find the width $AB$ of a river, surveyors mark $BC = 45$ m along the bank ($\angle ABC = 90^\circ$), extend to $D$ with $CD = 9$ m, and walk $DE = 7$ m perpendicular to the bank until $E$, $C$, $A$ are collinear. The right angles at $B$ and $D$ and the vertical angles at $C$ make $\triangle ABC \sim \triangle EDC$. Find $AB$, in meters.'
            answer: "35"
            solution_sketch: '$\frac{AB}{DE} = \frac{BC}{DC} \Rightarrow AB = 7 \cdot \frac{45}{9} = 35$ m.'
          - problem: 'A $3$-m pole held $4$ m from an observer''s eye exactly covers a tower $120$ m away. Find the height of the tower, in meters.'
            answer: "90"
            solution_sketch: 'Similar triangles from the eye: $\frac{h}{120} = \frac{3}{4}$, so $h = 90$ m.'
        constraints: "the similar-triangle setup is described in the problem; one proportion solves it"
    diagnostic_exemplar:
      problem: 'A $1.8$ m tall person casts a $2.7$ m shadow; a tree casts a $24$ m shadow at the same time. Find the height of the tree, in meters.'
      answer: "16"
      solution_sketch: '$\frac{h}{24} = \frac{1.8}{2.7} = \frac{2}{3}$, so $h = 16$ m.'
    anki_seeds:
      - front: "Same-time shadow problems work because the sun's rays create..."
        back: "similar right triangles (equal sun angles)"
        type: basic
      - front: "In the mirror method, the triangles are similar because the angle of incidence equals..."
        back: "the angle of reflection"
        type: basic

  - id: triangle-proportionality-theorem
    name: Triangle Proportionality
    core: false                # terminal; feeds only the angle-bisector theorem
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: similar-triangles
        weight: 0.8
        key: true
      - id: equations-with-fractions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Side-splitter theorem
        key_prerequisites: [similar-triangles]
        exemplars:
          - problem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$ with $D$ on $\overline{AB}$, $E$ on $\overline{AC}$. If $AD = 6$, $DB = 4$, and $AE = 9$, find $EC$.'
            answer: "6"
            solution_sketch: '$\frac{AD}{DB} = \frac{AE}{EC} \Rightarrow \frac{6}{4} = \frac{9}{EC} \Rightarrow EC = 6$.'
          - problem: 'In $\triangle PQR$, $\overline{ST} \parallel \overline{QR}$ with $PS = 8$, $SQ = 12$, and $TR = 15$. Find $PT$.'
            answer: "10"
            answer_contract: {kind: exact}
            solution_sketch: 'A line parallel to $\overline{QR}$ divides the sides proportionally, so $\frac{PS}{SQ} = \frac{PT}{TR}$. Then $\frac{8}{12} = \frac{PT}{15}$ and $PT = 10$.'
          - problem: 'In $\triangle XYZ$, $\overline{MN} \parallel \overline{YZ}$ with $M$ on $\overline{XY}$, $N$ on $\overline{XZ}$, $XM = 10$, $MY = 5$, and $XN = 8$. Find $NZ$.'
            answer: "4"
            solution_sketch: '$\frac{XM}{MY} = \frac{XN}{NZ} \Rightarrow \frac{10}{5} = \frac{8}{NZ} \Rightarrow NZ = 4$.'
          - problem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$ with $AD = 9$, $AE = 12$, and $EC = 16$. Find $DB$.'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: 'A line parallel to $\overline{BC}$ divides the sides proportionally, so $\frac{AD}{DB} = \frac{AE}{EC}$. Then $\frac{9}{DB} = \frac{12}{16} = \frac{3}{4}$ and $DB = 12$.'
        constraints: "segment-to-segment ratios (not segment-to-whole); integer answers"
      - id: kp2
        name: Side-splitter with variables
        key_prerequisites: [similar-triangles, equations-with-fractions]
        exemplars:
          - problem: '$\overline{DE} \parallel \overline{BC}$ splits the sides of $\triangle ABC$ so that $AD = x$, $DB = x - 2$, $AE = 10$, $EC = 8$. Find $x$.'
            answer: "10"
            solution_sketch: '$\frac{x}{x-2} = \frac{10}{8} \Rightarrow 8x = 10x - 20 \Rightarrow x = 10$.'
          - problem: '$\overline{DE} \parallel \overline{BC}$ with $AD = 2x$, $DB = 6$, $AE = x + 4$, $EC = 4$. Find $AD$.'
            answer: "24"
            solution_sketch: '$\frac{2x}{6} = \frac{x+4}{4} \Rightarrow 8x = 6x + 24 \Rightarrow x = 12$, so $AD = 2x = 24$ (ratios $\frac{24}{6} = \frac{16}{4} = 4$).'
          - problem: '$\overline{DE} \parallel \overline{BC}$ with $AD = 3x$, $DB = x + 2$, $AE = 15$, and $EC = 7$. Find $x$.'
            answer: "5"
            solution_sketch: '$\frac{3x}{x+2} = \frac{15}{7} \Rightarrow 21x = 15x + 30 \Rightarrow 6x = 30 \Rightarrow x = 5$.'
          - problem: '$\overline{DE} \parallel \overline{BC}$ with $AD = x + 4$, $DB = x$, $AE = 9$, and $EC = 5$. Find $AD$.'
            answer: "9"
            solution_sketch: '$\frac{x+4}{x} = \frac{9}{5} \Rightarrow 5x + 20 = 9x \Rightarrow x = 5$, so $AD = 5 + 4 = 9$.'
        constraints: "cross-multiply to a linear equation; integer solutions"
      - id: kp3
        name: The converse and parallel-line transversal splits
        key_prerequisites: [similar-triangles]
        exemplars:
          - problem: "In triangle ABC, D is on AB and E is on AC with AD = 6, DB = 9, AE = 8, and EC = 12. State whether DE is parallel to BC, and give the common value of AD/DB and AE/EC as a fraction."
            answer: "verdict = yes; ratio = 2/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "ratio"}]}
            solution_sketch: "The converse of the triangle proportionality theorem compares the two side ratios. Compute AD/DB = 6/9 = 2/3 and AE/EC = 8/12 = 2/3. The ratios are equal, so DE is parallel to BC. The answer is verdict = yes; ratio = 2/3."
          - problem: "In triangle RST, P is on RS and Q is on RT with RP = 5, PS = 10, RQ = 4, and QT = 6. State whether PQ is parallel to ST, and give the value of RP/PS as a fraction."
            answer: "verdict = no; ratio = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "ratio"}]}
            solution_sketch: "The converse of the triangle proportionality theorem compares the two side ratios. Compute RP/PS = 5/10 = 1/2 and RQ/QT = 4/6 = 2/3. The ratios are not equal, so PQ is not parallel to ST. The answer is verdict = no; ratio = 1/2."
          - problem: 'Three parallel lines cut one transversal into segments of $5$ and $10$, and cut a second transversal with corresponding first segment $7$. Find the second segment.'
            answer: "14"
            solution_sketch: 'Parallel lines split transversals proportionally: $\frac{5}{10} = \frac{7}{x} \Rightarrow x = 14$.'
          - problem: 'Three parallel lines cut two transversals. One transversal is split into segments of $4$ and $6$; the other''s corresponding first segment is $6$. Find its second segment.'
            answer: "9"
            solution_sketch: 'Parallel lines split transversals proportionally: $\frac{4}{6} = \frac{6}{x} \Rightarrow x = 9$.'
        constraints: "converse checks compare two ratios and are answered yes or no; three-parallel-lines items use one proportion"
    diagnostic_exemplar:
      problem: '$\overline{DE} \parallel \overline{BC}$ splits the sides of $\triangle ABC$ so that $AD = x$, $DB = x - 3$, $AE = 12$, and $EC = 9$. Find $AD$.'
      answer: "12"
      solution_sketch: '$\frac{x}{x-3} = \frac{12}{9} = \frac{4}{3} \Rightarrow 3x = 4x - 12 \Rightarrow x = 12$; check $\frac{12}{9} = \frac{4}{3}$.'
    anki_seeds:
      - front: "Side-splitter theorem: a line parallel to one side of a triangle divides the other two sides..."
        back: "proportionally"
        type: basic
      - front: "Three parallel lines cut any two transversals into segments that are..."
        back: "proportional"
        type: basic

  - id: angle-bisector-theorem
    name: The Angle Bisector Theorem
    core: false                # named terminal triangle theorem
    difficulty: 0.48
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: triangle-proportionality-theorem
        weight: 0.7
        key: true
      - id: angle-bisectors
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: The bisector splits the opposite side in the ratio of the adjacent sides
        key_prerequisites: [triangle-proportionality-theorem]
        exemplars:
          - problem: 'In $\triangle ABC$, the bisector of $\angle A$ meets $\overline{BC}$ at $D$. If $AB = 8$, $AC = 12$, and $BC = 15$, find $BD$.'
            answer: "6"
            solution_sketch: '$\frac{BD}{DC} = \frac{AB}{AC} = \frac{2}{3}$, so $BD = 15 \cdot \frac{2}{5} = 6$.'
          - problem: 'The bisector of $\angle P$ in $\triangle PQR$ meets $\overline{QR}$ at $S$ with $QS = 4$, $SR = 6$, and $PQ = 10$. Find $PR$.'
            answer: "15"
            solution_sketch: '$\frac{PQ}{PR} = \frac{QS}{SR} = \frac{2}{3} \Rightarrow PR = 15$.'
          - problem: 'In $\triangle ABC$, the bisector of $\angle A$ meets $\overline{BC}$ at $D$. If $AB = 10$, $AC = 15$, and $BC = 20$, find $BD$.'
            answer: "8"
            solution_sketch: '$BD : DC = 10 : 15 = 2 : 3$; $BD = 20 \cdot \frac{2}{5} = 8$ (and $DC = 12$).'
          - problem: 'The bisector of $\angle P$ in $\triangle PQR$ meets $\overline{QR}$ at $S$. If $PQ = 6$, $PR = 10$, and $QR = 24$, find $QS$.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: 'The bisector splits $\overline{QR}$ in the ratio $\frac{QS}{SR} = \frac{PQ}{PR} = \frac{3}{5}$. So $QS$ is $\frac{3}{8}$ of $24$, and $QS = 9$.'
        constraints: "bisector from one vertex; totals split into integer parts"
      - id: kp2
        name: Bisector splits with variables
        key_prerequisites: [triangle-proportionality-theorem]
        exemplars:
          - problem: 'The bisector of $\angle A$ in $\triangle ABC$ meets $\overline{BC}$ at $D$ with $BD = x$, $DC = x + 3$, $AB = 8$, $AC = 12$. Find $BC$.'
            answer: "15"
            solution_sketch: '$\frac{x}{x+3} = \frac{8}{12} = \frac{2}{3} \Rightarrow 3x = 2x + 6 \Rightarrow x = 6$; $BC = 6 + 9 = 15$.'
          - problem: 'The bisector of $\angle A$ meets $\overline{BC}$ at $D$ with $BD = 2x$, $DC = x + 3$, $AB = 20$, $AC = 15$. Find $BD$.'
            answer: "12"
            solution_sketch: '$\frac{2x}{x+3} = \frac{20}{15} = \frac{4}{3} \Rightarrow 6x = 4x + 12 \Rightarrow x = 6$; $BD = 12$ (and $DC = 9$).'
          - problem: 'The bisector of $\angle A$ meets $\overline{BC}$ at $D$ with $BD = x$, $DC = x + 5$, $AB = 9$, $AC = 12$. Find $BC$.'
            answer: "35"
            solution_sketch: '$\frac{x}{x+5} = \frac{9}{12} = \frac{3}{4} \Rightarrow 4x = 3x + 15 \Rightarrow x = 15$; $BC = 15 + 20 = 35$.'
          - problem: 'The bisector of $\angle A$ meets $\overline{BC}$ at $D$ with $BD = x$, $DC = 2x + 1$, $AB = 6$, $AC = 14$. Find $DC$.'
            answer: "7"
            solution_sketch: '$\frac{x}{2x+1} = \frac{6}{14} = \frac{3}{7} \Rightarrow 7x = 3(2x+1) \Rightarrow x = 3$; $DC = 2(3) + 1 = 7$.'
        constraints: "cross-multiply to a linear equation; integer solutions; positive segment lengths"
      - id: kp3
        name: Recover a side or a split from the ratio
        key_prerequisites: [triangle-proportionality-theorem]
        exemplars:
          - problem: 'In $\triangle ABC$, $AB = 9$, $AC = 6$, and $BC = 10$. The bisector of $\angle A$ meets $\overline{BC}$ at $D$. Give the ordered pair $(BD, DC)$.'
            answer: "(6, 4)"
            solution_sketch: '$BD : DC = 9 : 6 = 3 : 2$; split $10$ as $6 + 4$.'
          - problem: 'The bisector of $\angle P$ in $\triangle PQR$ meets $\overline{QR}$ at $S$ with $QS = 9$, $SR = 15$, and $PR = 25$. Find $PQ$.'
            answer: "15"
            solution_sketch: '$\frac{PQ}{PR} = \frac{QS}{SR} = \frac{3}{5} \Rightarrow PQ = 25 \cdot \frac{3}{5} = 15$.'
          - problem: 'The bisector of $\angle P$ in $\triangle PQR$ meets $\overline{QR}$ at $S$ with $QS = 6$, $SR = 10$, and $PQ = 12$. Find $PR$.'
            answer: "20"
            solution_sketch: '$\frac{PQ}{PR} = \frac{QS}{SR} = \frac{3}{5} \Rightarrow PR = 12 \cdot \frac{5}{3} = 20$.'
          - problem: 'In $\triangle ABC$, $AB = 14$, $AC = 21$, and $BC = 15$. The bisector of $\angle A$ meets $\overline{BC}$ at $D$. Find $BD$.'
            answer: "6"
            solution_sketch: '$BD : DC = 14 : 21 = 2 : 3$; $BD = 15 \cdot \frac{2}{5} = 6$ (and $DC = 9$).'
        constraints: "ratios reduce to small integers; splits are whole numbers; two-part answers requested as an ordered pair"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$, the bisector of $\angle A$ meets $\overline{BC}$ at $D$. If $AB = 9$, $AC = 15$, and $BC = 16$, find $DC$.'
      answer: "10"
      solution_sketch: '$BD : DC = 9 : 15 = 3 : 5$; $DC = 16 \cdot \frac{5}{8} = 10$.'
    anki_seeds:
      - front: "Angle bisector theorem: the bisector of an angle of a triangle divides the opposite side in the ratio of..."
        back: "the adjacent sides"
        type: basic

  - id: triangle-midsegments
    name: Triangle Midsegments
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: similar-triangles
        weight: 0.6
        key: true
      - id: parallel-lines-transversals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Midsegment length
        key_prerequisites: [similar-triangles]
        exemplars:
          - problem: 'A midsegment of a triangle is parallel to a side of length $14$. Find the midsegment''s length.'
            answer: "7"
            solution_sketch: 'The midsegment is half the parallel side: $14 / 2 = 7$.'
          - problem: 'A midsegment of a triangle measures $9$. Find the length of the parallel side.'
            answer: "18"
            solution_sketch: 'The midsegment is half the parallel side, so the side is $2 \cdot 9$.'
          - problem: 'A midsegment of a triangle is parallel to a side of length $22$. Find the midsegment''s length.'
            answer: "11"
            solution_sketch: 'The midsegment is half the parallel side: $22 / 2 = 11$.'
          - problem: 'A midsegment of a triangle measures $15$. Find the length of the parallel side.'
            answer: "30"
            solution_sketch: 'The midsegment is half the parallel side, so the side is $2 \cdot 15 = 30$.'
        constraints: "even side lengths so halves are whole numbers"
      - id: kp2
        name: Midsegments with variables
        key_prerequisites: [similar-triangles]
        exemplars:
          - problem: 'Midsegment $\overline{MN}$ is parallel to side $\overline{BC}$, with $MN = 2x + 1$ and $BC = 5x - 4$. Find $MN$.'
            answer: "13"
            solution_sketch: '$2(2x + 1) = 5x - 4 \Rightarrow 4x + 2 = 5x - 4 \Rightarrow x = 6$; $MN = 13$ (and $BC = 26$).'
          - problem: 'Midsegment $\overline{DE}$ is parallel to side $\overline{QR}$, with $DE = x + 3$ and $QR = 3x - 8$. Find $QR$.'
            answer: "34"
            solution_sketch: '$2(x + 3) = 3x - 8 \Rightarrow x = 14$; $QR = 3(14) - 8 = 34$.'
          - problem: 'Midsegment $\overline{PQ}$ is parallel to side $\overline{RS}$, with $PQ = 3x - 1$ and $RS = 4x + 6$. Find $PQ$.'
            answer: "11"
            solution_sketch: '$2(3x - 1) = 4x + 6 \Rightarrow 6x - 2 = 4x + 6 \Rightarrow x = 4$; $PQ = 3(4) - 1 = 11$ (and $RS = 22$).'
          - problem: 'Midsegment $\overline{WX}$ is parallel to side $\overline{YZ}$, with $WX = 2x + 3$ and $YZ = 5x - 12$. Find $YZ$.'
            answer: "78"
            solution_sketch: '$2(2x + 3) = 5x - 12 \Rightarrow 4x + 6 = 5x - 12 \Rightarrow x = 18$; $YZ = 5(18) - 12 = 78$.'
        constraints: "the relation is 2(midsegment) = side; integer solutions"
      - id: kp3
        name: The midsegment triangle
        key_prerequisites: [similar-triangles]
        exemplars:
          - problem: 'A triangle has sides $8$, $10$, and $12$. Find the perimeter of the triangle formed by its three midsegments.'
            answer: "15"
            solution_sketch: 'Each midsegment is half a side: $4 + 5 + 6 = 15$.'
          - problem: 'The midsegment triangle of $\triangle ABC$ has perimeter $21$. Find the perimeter of $\triangle ABC$.'
            answer: "42"
            solution_sketch: 'Each midsegment is half a side, so the full perimeter is double: $2 \cdot 21 = 42$.'
          - problem: 'A triangle has sides $10$, $14$, and $18$. Find the perimeter of the triangle formed by its three midsegments.'
            answer: "21"
            solution_sketch: 'Each midsegment is half a side: $5 + 7 + 9 = 21$.'
          - problem: 'The midsegment triangle of a triangle has sides $6$, $8$, and $11$. Find the perimeter of the original triangle.'
            answer: "50"
            answer_contract: {kind: exact}
            solution_sketch: 'Each original side is double its midsegment. The original sides are $12$, $16$, and $22$, so the perimeter is $50$.'
        constraints: "even perimeters where needed; midsegment triangle has half the perimeter"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$, the midsegment $\overline{MN}$ is parallel to $\overline{BC}$ with $MN = 3x - 2$ and $BC = 4x + 8$, and the other two sides measure $AB = 18$ and $AC = 22$. Find the perimeter of the midsegment triangle of $\triangle ABC$.'
      answer: '36'
      solution_sketch: '$2(3x - 2) = 4x + 8$ gives $x = 6$, so $BC = 32$ and $\triangle ABC$ has perimeter $18 + 22 + 32 = 72$; the midsegment triangle has half that perimeter, $36$.'
    anki_seeds:
      - front: "A triangle midsegment is parallel to the third side and has length equal to..."
        back: "half the third side"
        type: basic
      - front: "A midsegment connects..."
        back: "the midpoints of two sides of a triangle"
        type: basic

  - id: geometric-mean-right-triangles
    name: Geometric Mean in Right Triangles
    core: false                # named terminal triangle theorem
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: similar-triangles
        weight: 0.7
        key: true
      - id: simplifying-radicals
        weight: 0.5
        key: false
      - id: pythagorean-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Geometric mean of two numbers
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Find the geometric mean of $4$ and $9$.'
            answer: "6"
            solution_sketch: '$\sqrt{4 \cdot 9} = \sqrt{36} = 6$.'
          - problem: 'Find the geometric mean of $2$ and $10$. Give an exact answer.'
            answer: "2*sqrt(5)"
            solution_sketch: '$\sqrt{20} = 2\sqrt{5}$.'
          - problem: 'Find the geometric mean of $3$ and $27$.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: 'The geometric mean of two numbers is the square root of their product. So $\sqrt{3 \cdot 27} = \sqrt{81} = 9$.'
          - problem: 'Find the geometric mean of $5$ and $15$. Give an exact answer.'
            answer: "5*sqrt(3)"
            solution_sketch: '$\sqrt{5 \cdot 15} = \sqrt{75} = 5\sqrt{3}$.'
        constraints: "products are perfect squares or simplify to a single radical written as k*sqrt(n)"
      - id: kp2
        name: The altitude rule
        key_prerequisites: [similar-triangles, simplifying-radicals]
        exemplars:
          - problem: 'The altitude to the hypotenuse of a right triangle divides the hypotenuse into segments of $4$ and $9$. Find the altitude.'
            answer: "6"
            solution_sketch: 'The altitude is the geometric mean of the segments: $\sqrt{4 \cdot 9} = 6$. (The altitude splits the triangle into two triangles similar to the original.)'
          - problem: 'The altitude to the hypotenuse measures $8$, and one hypotenuse segment measures $4$. Find the other segment.'
            answer: "16"
            solution_sketch: '$8^2 = 4 \cdot x \Rightarrow x = 16$.'
          - problem: 'The altitude to the hypotenuse of a right triangle divides the hypotenuse into segments of $3$ and $27$. Find the altitude.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: 'The altitude is the geometric mean of the segments. So $\sqrt{3 \cdot 27} = \sqrt{81} = 9$.'
          - problem: 'The altitude to the hypotenuse measures $10$, and one hypotenuse segment measures $5$. Find the other segment.'
            answer: "20"
            solution_sketch: '$10^2 = 5 \cdot x \Rightarrow x = 20$.'
        constraints: "altitude^2 = product of the hypotenuse segments; perfect-square products"
      - id: kp3
        name: The leg rule
        key_prerequisites: [similar-triangles, pythagorean-theorem]
        exemplars:
          - problem: 'In a right triangle, the altitude to the hypotenuse splits it so the segment adjacent to one leg measures $9$, and the whole hypotenuse measures $25$. Find that leg.'
            answer: "15"
            solution_sketch: 'Leg$^2 = $ hypotenuse $\cdot$ adjacent segment $= 25 \cdot 9 = 225$; leg $= 15$.'
          - problem: 'A leg of a right triangle measures $10$, and the hypotenuse segment adjacent to it measures $5$. Find the hypotenuse.'
            answer: "20"
            solution_sketch: '$10^2 = 5 \cdot c \Rightarrow c = 20$.'
          - problem: 'In a right triangle, the altitude to the hypotenuse splits it so the segment adjacent to one leg measures $4$, and the whole hypotenuse measures $36$. Find that leg.'
            answer: "12"
            solution_sketch: 'Leg$^2$ = hypotenuse $\cdot$ adjacent segment $= 36 \cdot 4 = 144$; leg $= 12$.'
          - problem: 'A leg of a right triangle measures $12$, and the hypotenuse segment adjacent to it measures $8$. Find the hypotenuse.'
            answer: "18"
            solution_sketch: '$12^2 = 8 \cdot c \Rightarrow 144 = 8c \Rightarrow c = 18$.'
        constraints: "leg^2 = hypotenuse times adjacent segment; integer answers"
