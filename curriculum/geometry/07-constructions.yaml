unit: constructions
course: geometry
module: "Constructions"
topics:
  - id: straightedge-compass-constructions
    name: Basic Straightedge and Compass Constructions
    core: false                # terminal construction craft; only prospective consumer is the supplemental abstract-algebra impossibility capstone
    difficulty: 0.42
    drill: false
    answer_kind: numeric       # flipped from multi-step: exemplars are single-answer (labels with contracts / numerals), per the proven pattern
    expected_time_secs: 150
    prerequisites:
      - id: triangle-congruence-criteria
        weight: 0.6
        key: true
      - id: perpendicular-bisectors
        weight: 0.5
        key: false
      - id: angle-bisectors
        weight: 0.4
        key: false
      - id: postulates-theorems-justifications
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Copy a segment and copy an angle
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'In the copy-an-angle construction, an arc through both sides of $\angle A$ is copied at $P$, and the arc-to-arc distance is transferred. The two arc triangles then have three pairs of congruent sides. Which congruence criterion proves the copied angle is congruent to $\angle A$: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'Equal compass radii give two pairs of congruent sides; the transferred arc-to-arc distance gives the third. SSS plus corresponding parts.'
          - problem: 'To copy a segment $\overline{AB}$ onto a ray with endpoint $P$, the compass is set to radius $AB$ and an arc is drawn with center $P$ meeting the ray at $Q$. Why is $\overline{PQ} \cong \overline{AB}$: both are radii of equal circles, both are diameters, they lie on parallel lines, or they share an endpoint?'
            answer: 'both are radii of equal circles'
            answer_contract: {kind: label, options: [['both are radii of equal circles'], ['both are diameters'], ['they lie on parallel lines'], ['they share an endpoint']]}
            solution_sketch: 'The compass was set to $AB$, so the arc centered at $P$ has radius $AB$; $PQ$ is that radius, hence $PQ = AB$.'
          - problem: 'In the copy-a-segment construction, how many arcs are drawn with the compass after it is set to radius $AB$: zero, one, two, or three?'
            answer: "1"
            solution_sketch: 'One arc with center $P$ marks the copy point $Q$ on the ray.'
          - problem: 'A copied angle at $P$ has measure $52^\circ$. What is the measure of the original angle, in degrees?'
            answer: "52"
            solution_sketch: 'The construction produces a congruent copy, so the angles are equal.'
        constraints: "steps must use only straightedge (line through two points) and compass (circle with chosen center and radius); every step names its center and radius; justification questions name a congruence criterion"
      - id: kp2
        name: Bisect a segment (perpendicular bisector)
        key_prerequisites: [perpendicular-bisectors, triangle-congruence-criteria]
        exemplars:
          - problem: 'In the perpendicular-bisector construction, the crossing points $X$ and $Y$ satisfy $XA = XB$ and $YA = YB$. Why is line $XY$ the perpendicular bisector of $\overline{AB}$: both points are equidistant from $A$ and $B$, the line is vertical, $XY = AB$, or the arcs are congruent?'
            answer: 'both points are equidistant from A and B'
            answer_contract: {kind: label, options: [['both points are equidistant from A and B'], ['the line is vertical'], ['XY = AB'], ['the arcs are congruent']]}
            solution_sketch: 'Points equidistant from $A$ and $B$ lie on the perpendicular bisector, so the line through $X$ and $Y$ is it.'
          - problem: 'Constructing the perpendicular bisector of $\overline{AB}$, a student uses arcs of radius $5$ from both endpoints, with $AB = 8$. How far from $A$ is each crossing point $X$ (in the same units)?'
            answer: "5"
            solution_sketch: '$X$ lies on the arc centered at $A$ of radius $5$, so $XA = 5$ (and $XB = 5$ as well).'
          - problem: 'When constructing a perpendicular bisector, the arc radius must be more than half the segment''s length. For $\overline{AB}$ with $AB = 10$, which radius works: $4$, $5$, $6$, or $0$?'
            answer: "6"
            answer_contract: {kind: label, options: [["4"], ["5"], ["6"], ["0"]]}
            solution_sketch: 'The radius must exceed $10/2 = 5$ for the arcs to cross; $6$ works (and $5$ itself barely fails, giving arcs that touch at one point).'
          - problem: 'The perpendicular bisector of $\overline{AB}$ with $AB = 14$ is constructed. What is the distance from the midpoint of $\overline{AB}$ to each endpoint?'
            answer: "7"
            solution_sketch: 'The perpendicular bisector passes through the midpoint, which is $14/2 = 7$ from each endpoint.'
        constraints: "equal radii from both endpoints, radius exceeding half the segment; justification cites the equidistance characterization of the perpendicular bisector"
      - id: kp3
        name: Bisect an angle; recognize invalid constructions
        key_prerequisites: [angle-bisectors, triangle-congruence-criteria]
        exemplars:
          - problem: 'In the angle-bisector construction, triangles $ABD$ and $ACD$ have $AB = AC$, $BD = CD$, and shared $\overline{AD}$. Which congruence criterion proves $\angle BAD \cong \angle CAD$: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'Three pairs of congruent sides (two from equal-radius arcs, one shared) give SSS, and CPCTC delivers the congruent angle halves.'
          - problem: "A student bisects a 96 degree angle by reading the angle's size from the markings of a ruler and drawing the middle ray by eye. The allowed straightedge-and-compass fix instead draws an arc centered at the vertex meeting the sides at B and C, then two arcs of equal radius centered at B and C meeting at D, then the ray from the vertex through D. State the verdict on the student's method, and give the degree measure of each half angle in the fix."
            answer: "verdict = invalid; angle = 48"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "angle"}]}
            solution_sketch: "Step 1 (allowed moves): the only straightedge-and-compass moves are drawing a line through two located points, drawing a circle centered at a located point through another, and marking intersections; a marked ruler and judging by eye use none of these, so the verdict on the method is invalid. Step 2 (fix by angle bisector): the arc centered at the vertex meets the sides at B and C with AB = AC, the two equal-radius arcs centered at B and C meet at D, and triangles ABD and ACD are congruent by SSS, so the ray AD bisects the 96 degree angle. Step 3 (halves): each half angle is 96/2, so the full result is verdict = invalid; angle = 48."
          - problem: 'The angle bisector of a $84^\circ$ angle splits it into two congruent angles. Find the measure of each, in degrees.'
            answer: "42"
            solution_sketch: '$84/2 = 42$.'
          - problem: "In the straightedge-and-compass construction that bisects an angle, the first arc is drawn with the compass point at the vertex A of angle BAC, and this one arc crosses side AB at P and side AC at Q. If AP = 11 centimeters, find the sum AP + AQ in centimeters, and give the number only."
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (construction): the first arc of the angle-bisector construction is one arc of a single circle drawn with the compass point at the vertex A, and it meets side AB at P and side AC at Q. Step 2 (radii of one circle): P and Q both lie on this same circle centered at A, so AP and AQ are two radii of that circle and AP = AQ. Step 3 (sum): with AP = 11, we also have AQ = 11, so the sum AP + AQ = 22."
        constraints: "invalid-construction items involve measuring with a marked ruler or judging by eye; the fix must restate the allowed straightedge and compass moves"
    diagnostic_exemplar:
      problem: 'Describe the straightedge-and-compass steps that bisect a given angle $\angle A$, and name the congruence criterion that proves the two resulting angles are congruent.'
      answer: 'Arc from center $A$ crossing both sides at $B$ and $C$; equal arcs from centers $B$ and $C$ meeting at $D$; draw $\overrightarrow{AD}$. By SSS ($AB = AC$, $BD = CD$, $AD$ shared), $\triangle ABD \cong \triangle ACD$, so $\angle BAD \cong \angle CAD$.'
      answer_contract: {kind: none}
      solution_sketch: 'One arc centred at the vertex cuts equal distances along both sides; two equal arcs from those points meet at a fourth. Those equal compass radii supply the three side pairs SSS needs, and CPCTC reads off the congruent halves.'
    anki_seeds:
      - front: "The two allowed construction moves are: straightedge draws ...; compass draws ..."
        back: "the line through two existing points; a circle with a chosen center through a chosen point"
        type: basic
      - front: "The copy-an-angle and angle-bisector constructions are justified by the congruence criterion..."
        back: "SSS"
        type: basic

  - id: perpendicular-parallel-constructions
    name: Perpendicular, Parallel, and Polygon Constructions
    core: false                # terminal construction craft; nothing downstream builds on it
    difficulty: 0.48
    drill: false
    answer_kind: numeric       # flipped from multi-step: exemplars are single-answer (labels with contracts / numerals), per the proven pattern
    expected_time_secs: 180
    prerequisites:
      - {id: isosceles-equilateral-triangles, weight: 0.3, key: false} # L1 #11: kp3's hexagon-side justification uses the isosceles base-angle theorem
      - id: straightedge-compass-constructions
        weight: 0.8
        key: true
      - id: proving-lines-parallel
        weight: 0.4
        key: false
      - id: central-angles-arcs
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Perpendicular through a point
        key_prerequisites: [straightedge-compass-constructions]
        exemplars:
          - problem: 'To construct the perpendicular to line $\ell$ through a point $P$ on $\ell$, arcs of equal radius from two points $A$ and $B$ on $\ell$ (with $P$ their midpoint) are drawn to meet at $Q$. Why is $PQ \perp \ell$: $P$ and $Q$ are equidistant from $A$ and $B$, $PQ = AB$, the arcs are congruent, or $Q$ is far away?'
            answer: 'P and Q are equidistant from A and B'
            answer_contract: {kind: label, options: [['P and Q are equidistant from A and B'], ['PQ = AB'], ['the arcs are congruent'], ['Q is far away']]}
            solution_sketch: 'Two points equidistant from $A$ and $B$ define the perpendicular bisector of $\overline{AB}$, which is perpendicular to $\ell$ at $P$.'
          - problem: 'In the perpendicular-through-$P$ construction ($P$ off the line), the first arc centered at $P$ crosses $\ell$ at $A$ and $B$. What kind of triangle is $PAB$: equilateral, isosceles, or scalene?'
            answer: 'isosceles'
            answer_contract: {kind: label, options: [[equilateral], [isosceles], [scalene]]}
            solution_sketch: '$PA = PB$ because both are radii of the same arc, so $\triangle PAB$ is isosceles.'
          - problem: 'The perpendicular to $\ell$ through $P$ is constructed, meeting $\ell$ at $90^\circ$. If a line makes a $35^\circ$ angle with $\ell$ at that point, how many degrees short of perpendicular is it (i.e. what is $90$ minus that angle)?'
            answer: "55"
            solution_sketch: '$90 - 35 = 55$; a perpendicular must make exactly $90^\circ$.'
          - problem: 'In the perpendicular construction, equal arcs from centers $A$ and $B$ meet at $Q$ on the far side of $\ell$. Which fact makes $QA = QB$: equal compass radii, the arcs are vertical, $Q$ lies on $\ell$, or the arcs share a center?'
            answer: 'equal compass radii'
            answer_contract: {kind: label, options: [['equal compass radii'], ['the arcs are vertical'], ['Q lies on l'], ['the arcs share a center']]}
            solution_sketch: 'Both arcs were drawn with the same radius, so $Q$ (on each arc) is equidistant from $A$ and $B$.'
        constraints: "both cases: point on the line and point off the line; single-answer items (numeric angle/length facts or label-contract justifications citing the perpendicular-bisector characterization)"
      - id: kp2
        name: Parallel through a point by copying an angle
        key_prerequisites: [straightedge-compass-constructions, proving-lines-parallel]
        exemplars:
          - problem: 'The parallel construction copies at $P$ the angle formed at $Q$, in corresponding position. Which theorem proves the constructed line is parallel to $\ell$: the converse of the corresponding angles postulate, the Pythagorean theorem, the triangle angle sum, or the definition of a bisector?'
            answer: 'the converse of the corresponding angles postulate'
            answer_contract: {kind: label, options: [['the converse of the corresponding angles postulate'], ['the Pythagorean theorem'], ['the triangle angle sum'], ['the definition of a bisector']]}
            solution_sketch: 'The copied angle equals the original (SSS on the copy construction), so corresponding angles are congruent and the converse applies.'
          - problem: 'A copied angle at $P$ makes congruent corresponding angles with a transversal crossing $\ell$ at $Q$. If the angle at $Q$ measures $48^\circ$, what is the measure of the copied angle at $P$, in degrees?'
            answer: "48"
            solution_sketch: 'The copy is congruent to the original by SSS, so both measure $48^\circ$.'
          - problem: 'To copy the angle at $Q$ onto point $P$, the first arc is centered at: $P$, $Q$, or the intersection of the two lines?'
            answer: 'Q'
            answer_contract: {kind: label, options: [[P], [Q], ['the intersection of the two lines']]}
            solution_sketch: 'The angle being copied lives at $Q$, so the arc cutting both of its sides is centered at $Q$.'
          - problem: 'After copying the angle at $P$ in corresponding position, the new line through $P$ is parallel to $\ell$. What postulate''s converse guarantees this: corresponding angles, vertical angles, or the linear pair postulate?'
            answer: 'corresponding angles'
            answer_contract: {kind: label, options: [['corresponding angles'], ['vertical angles'], ['the linear pair postulate']]}
            solution_sketch: 'Congruent corresponding angles force parallel lines — the converse of the corresponding angles postulate.'
        constraints: "the justification must name the converse used (corresponding angles, or alternate interior angles if the copy is placed in alternate position)"
      - id: kp3
        name: Equilateral triangle and regular hexagon
        key_prerequisites: [straightedge-compass-constructions, central-angles-arcs]
        exemplars:
          - problem: 'An equilateral triangle is constructed on $\overline{AB}$ by arcs of radius $AB$ centered at $A$ and $B$ meeting at $C$. Why are all three sides congruent: $AC$ and $BC$ are both radii equal to $AB$, the triangle is isosceles, $AB$ is the longest side, or $C$ is equidistant from the arcs?'
            answer: 'AC and BC are both radii equal to AB'
            answer_contract: {kind: label, options: [['AC and BC are both radii equal to AB'], ['the triangle is isosceles'], ['AB is the longest side'], ['C is equidistant from the arcs']]}
            solution_sketch: '$AC$ is a radius of the circle centered at $A$, $BC$ of the circle centered at $B$, and both circles have radius $AB$ — so all three sides equal $AB$.'
          - problem: 'A regular hexagon is inscribed in a circle of radius $r$ by stepping the compass around it. Its side length equals the radius. Answer with one word: radius or diameter?'
            answer: 'radius'
            answer_contract: {kind: label, options: [[radius], [diameter]]}
            solution_sketch: 'Each side subtends a central angle of $360^\circ/6 = 60^\circ$; the triangle formed by two radii and one side is isosceles with a $60^\circ$ apex, hence equilateral, so the side equals $r$.'
          - problem: 'How many times is the compass stepped around the circle to construct a regular hexagon?'
            answer: "6"
            solution_sketch: 'A hexagon has six sides, each cut off by stepping the radius around the circle six times.'
          - problem: 'In the hexagon construction, each side subtends a central angle of $60^\circ$. How many such angles fill the full circle, in degrees?'
            answer: "360"
            solution_sketch: 'Six arcs of $60^\circ$ each: $6 \cdot 60 = 360$.'
        constraints: "figures limited to equilateral triangle, inscribed regular hexagon, and inscribed square via perpendicular diameters; justification uses radii equality and central angles"
    diagnostic_exemplar:
      problem: 'To construct the line through $P$ parallel to $\ell$ ($P$ not on $\ell$), a transversal through $P$ meets $\ell$ at $Q$, and the angle the transversal makes at $Q$ is copied at $P$ in corresponding position (the copy is congruent by SSS). Which theorem proves the new line through $P$ is parallel to $\ell$: the converse of the corresponding angles postulate, the vertical angles theorem, the triangle angle sum, or the definition of a bisector?'
      answer: 'the converse of the corresponding angles postulate'
      answer_contract: {kind: label, options: [['the converse of the corresponding angles postulate'], ['the vertical angles theorem'], ['the triangle angle sum'], ['the definition of a bisector']]}
      solution_sketch: 'Copying the angle makes congruent corresponding angles with the transversal, and congruent corresponding angles force parallel lines — the converse of the corresponding angles postulate.'
    anki_seeds:
      - front: "The side of a regular hexagon inscribed in a circle of radius r has length..."
        back: "r"
        type: basic
      - front: "The parallel-through-a-point construction is proved by the converse of the ... postulate"
        back: "corresponding angles"
        type: basic
