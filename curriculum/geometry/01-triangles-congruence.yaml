unit: triangles-congruence
course: geometry
module: "Triangles & Congruence"
topics:
  - id: classifying-triangles
    name: Classifying Triangles
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.6
        key: true
      - id: measuring-segments-angles
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Classify by sides
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'A triangle has sides $7$, $7$, and $10$. Classify it by its sides as equilateral, isosceles, or scalene.'
            answer: 'isosceles'
            answer_contract: {kind: label, options: [[equilateral], [isosceles], [scalene]]}
            solution_sketch: 'Exactly two sides are congruent ($7 = 7$), so the triangle is isosceles.'
          - problem: 'A triangle has sides $6$, $6$, and $6$. Classify it by its sides as equilateral, isosceles, or scalene.'
            answer: 'equilateral'
            answer_contract: {kind: label, options: [[equilateral], [isosceles], [scalene]]}
            solution_sketch: 'All three sides are congruent, so the triangle is equilateral.'
          - problem: 'A triangle has sides $5$, $7$, and $9$. Classify it by its sides as equilateral, isosceles, or scalene.'
            answer: 'scalene'
            answer_contract: {kind: label, options: [[equilateral], [isosceles], [scalene]]}
            solution_sketch: 'No two sides are congruent, so the triangle is scalene.'
          - problem: 'A triangle has sides $9$, $9$, and $12$. Classify it by its sides as equilateral, isosceles, or scalene.'
            answer: 'isosceles'
            answer_contract: {kind: label, options: [[equilateral], [isosceles], [scalene]]}
            solution_sketch: 'Exactly two sides are congruent ($9 = 9$), so the triangle is isosceles.'
        constraints: "side names: scalene/isosceles/equilateral; integer sides that satisfy the triangle inequality"
      - id: kp2
        name: Classify by angles
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'A triangle has angles $20^\circ$, $30^\circ$, and $130^\circ$. Classify it by its angles as acute, right, obtuse, or straight.'
            answer: 'obtuse'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'One angle ($130^\circ$) is between $90^\circ$ and $180^\circ$, so the triangle is obtuse.'
          - problem: 'A triangle has angles $35^\circ$, $55^\circ$, and $90^\circ$. Classify it by its angles as acute, right, obtuse, or straight.'
            answer: 'right'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'One angle measures exactly $90^\circ$, so the triangle is right.'
          - problem: 'A triangle has angles $50^\circ$, $60^\circ$, and $70^\circ$. Classify it by its angles as acute, right, obtuse, or straight.'
            answer: 'acute'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'All three angles are under $90^\circ$, so the triangle is acute.'
          - problem: 'A triangle has angles $40^\circ$, $70^\circ$, and $70^\circ$. Classify it by its angles as acute, right, obtuse, or straight.'
            answer: 'acute'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'All three angles ($40^\circ$, $70^\circ$, $70^\circ$) are under $90^\circ$, so the triangle is acute.'
        constraints: "angle names: acute/right/obtuse; angle triples sum to 180"
      - id: kp3
        name: Classify after finding the missing angle
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Two angles of a triangle measure $42^\circ$ and $48^\circ$. Classify the triangle by its angles as acute, right, obtuse, or straight.'
            answer: 'right'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'Third angle $= 180 - 42 - 48 = 90^\circ$, so the triangle is right.'
          - problem: 'Two angles of a triangle measure $70^\circ$ and $55^\circ$. Classify the triangle by its angles as acute, right, obtuse, or straight.'
            answer: 'acute'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'Third angle $= 55^\circ$; all three are under $90^\circ$, so the triangle is acute.'
          - problem: 'Two angles of a triangle measure $35^\circ$ and $35^\circ$. Classify the triangle by its angles as acute, right, obtuse, or straight.'
            answer: 'obtuse'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'Third angle $= 180 - 35 - 35 = 110^\circ > 90^\circ$, so the triangle is obtuse.'
          - problem: 'Two angles of a triangle measure $52^\circ$ and $66^\circ$. Classify the triangle by its angles as acute, right, obtuse, or straight.'
            answer: 'acute'
            answer_contract: {kind: label, options: [[acute], [right], [obtuse], [straight]]}
            solution_sketch: 'Third angle $= 180 - 52 - 66 = 62^\circ$; all three are under $90^\circ$, so the triangle is acute.'
        constraints: "give two angles; the third decides the class"
    diagnostic_exemplar:
      problem: 'A triangle has exactly two congruent sides, and two of its angles measure $41^\circ$ each. Classify it by its sides and by its angles.'
      answer: 'isosceles and obtuse'
      answer_contract: {kind: label, options: [['isosceles and acute'], ['isosceles and right'], ['isosceles and obtuse'], ['scalene and acute'], ['scalene and right'], ['scalene and obtuse'], ['equilateral and acute']]}
      solution_sketch: 'Exactly two congruent sides make it isosceles (not equilateral); the third angle is $180 - 41 - 41 = 98^\circ > 90^\circ$, so it is obtuse.'
    anki_seeds:
      - front: "A triangle with exactly two congruent sides is..."
        back: "isosceles"
        type: basic
      - front: "A triangle with all angles under 90 degrees is..."
        back: "acute"
        type: basic

  - id: triangle-inequality-classification
    name: Triangle Inequality and Classification
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: classifying-triangles
        weight: 0.6
        key: true
      - id: triangle-angle-sum
        weight: 0.4
        key: false
      - id: linear-inequalities
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Can three lengths form a triangle?
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Can segments of length $4$, $5$, and $10$ form a triangle? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Each pair of sides must sum to more than the third; $4 + 5 = 9 < 10$ fails.'
          - problem: 'Can segments of length $6$, $8$, and $12$ form a triangle? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Check the tightest case: $6 + 8 = 14 > 12$, so every pair sums to more than the third.'
          - problem: 'Can segments of length $10$, $10$, and $21$ form a triangle? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'The tightest case fails: $10 + 10 = 20 < 21$.'
          - problem: 'Can segments of length $7$, $9$, and $12$ form a triangle? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'The tightest case holds: $7 + 9 = 16 > 12$, so every pair sums to more than the third.'
        constraints: "integer side lengths 1-30; only the smallest-two sum needs checking; answered yes or no"
      - id: kp2
        name: Range of the third side
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Two sides of a triangle measure $5$ and $9$. What values are possible for the third side $x$?'
            answer: '4 < x < 14'
            solution_sketch: '$|9 - 5| < x < 9 + 5$.'
          - problem: 'Two sides of a triangle measure $7$ and $7$. What values are possible for the third side $x$?'
            answer: '0 < x < 14'
          - problem: 'Two sides of a triangle measure $5$ and $9$. What is the greatest whole-number length possible for the third side?'
            answer: "13"
            solution_sketch: '$9 - 5 < x < 9 + 5$ gives $4 < x < 14$, so the greatest whole number is $13$.'
          - problem: 'Two sides of a triangle measure $8$ and $3$. What is the least whole-number length possible for the third side?'
            answer: "6"
            solution_sketch: '$8 - 3 < x < 8 + 3$ gives $5 < x < 11$, so the least whole number is $6$.'
          - problem: 'Two sides of a triangle measure $10$ and $6$. Can the third side have length $17$? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: '$10 - 6 < x < 10 + 6$ gives $4 < x < 16$, and $17$ falls outside that range.'
          - problem: 'Two sides of a triangle measure $12$ and $4$. What is the greatest whole-number length possible for the third side?'
            answer: "15"
            solution_sketch: '$12 - 4 < x < 12 + 4$ gives $8 < x < 16$, so the greatest whole number is $15$.'
        constraints: "range items answer as a strict double inequality difference < x < sum; whole-number-bound and yes-or-no range items answer with a single integer or yes/no"
      - id: kp3
        name: Order sides and angles
        key_prerequisites: [classifying-triangles]
        exemplars:
          - problem: 'In $\triangle ABC$, $AB = 7$, $BC = 9$, and $CA = 12$. Which angle is largest: $\angle A$, $\angle B$, or $\angle C$?'
            answer: 'B'
            answer_contract: {kind: label, options: [[A], [B], [C]]}
            solution_sketch: 'The largest angle sits opposite the longest side $CA = 12$, and the angle opposite $\overline{CA}$ is $\angle B$.'
          - problem: 'In $\triangle DEF$, $m\angle D = 50^\circ$, $m\angle E = 60^\circ$, and $m\angle F = 70^\circ$. Which side is longest: $\overline{DE}$, $\overline{EF}$, or $\overline{FD}$?'
            answer: 'DE'
            answer_contract: {kind: label, options: [[DE], [EF], [FD]]}
            solution_sketch: 'The longest side sits opposite the largest angle $\angle F$, which is $\overline{DE}$.'
          - problem: 'In $\triangle PQR$, $PQ = 6$, $QR = 11$, and $RP = 8$. Which angle is smallest: $\angle P$, $\angle Q$, or $\angle R$?'
            answer: 'R'
            answer_contract: {kind: label, options: [[P], [Q], [R]]}
            solution_sketch: 'The smallest angle sits opposite the shortest side $PQ = 6$, and the angle opposite $\overline{PQ}$ is $\angle R$.'
          - problem: 'In $\triangle XYZ$, $m\angle X = 40^\circ$, $m\angle Y = 95^\circ$, and $m\angle Z = 45^\circ$. Which side is shortest: $\overline{XY}$, $\overline{YZ}$, or $\overline{ZX}$?'
            answer: 'YZ'
            answer_contract: {kind: label, options: [[XY], [YZ], [ZX]]}
            solution_sketch: 'The shortest side sits opposite the smallest angle $\angle X = 40^\circ$, which is $\overline{YZ}$.'
        constraints: "distinct side lengths / angle measures; ask for largest or smallest only; the answer names the vertex letter or the two-letter segment"
    diagnostic_exemplar:
      problem: 'Two sides of a triangle measure $8$ and $3$. List all possible integer lengths for the third side.'
      answer: '6, 7, 8, 9, or 10'
      answer_contract: {kind: none}
      solution_sketch: '$8 - 3 < x < 8 + 3$, so $5 < x < 11$.'
    anki_seeds:
      - front: "Triangle inequality: the sum of any two sides of a triangle must be..."
        back: "greater than the third side"
        type: basic
      - front: "Given two sides a and b, the third side x satisfies..."
        back: "|a - b| < x < a + b"
        type: basic
      - front: "In a triangle, the largest angle is opposite the..."
        back: "longest side"
        type: basic

  - id: triangle-inequality-applications
    name: Triangle Inequality Applications
    core: false                # applications leaf topic
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-inequality-classification
        weight: 0.8
        key: true
      - id: linear-inequalities
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Count the integer possibilities
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'Two sides of a triangle measure $5$ and $12$. How many integer values are possible for the third side?'
            answer: "9"
            solution_sketch: '$7 < x < 17$ gives $x \in \{8, \dots, 16\}$: $9$ values.'
          - problem: 'Two sides of a triangle measure $4$ and $4$. How many integer values are possible for the third side?'
            answer: "7"
            solution_sketch: '$0 < x < 8$ gives $x \in \{1, \dots, 7\}$.'
          - problem: 'Two sides of a triangle measure $7$ and $3$. How many integer values are possible for the third side?'
            answer: "5"
            solution_sketch: '$4 < x < 10$ gives $x \in \{5, 6, 7, 8, 9\}$: $5$ values.'
          - problem: 'Two sides of a triangle measure $10$ and $6$. How many integer values are possible for the third side?'
            answer: "11"
            solution_sketch: '$4 < x < 16$ gives $x \in \{5, \dots, 15\}$: $11$ values.'
        constraints: "strict inequalities; count integers in the open interval"
      - id: kp2
        name: Bound the perimeter
        key_prerequisites: [triangle-inequality-classification, linear-inequalities]
        exemplars:
          - problem: 'Two sides of a triangle measure $6$ and $10$. Between what two values must the perimeter $p$ lie?'
            answer: '20 < p < 32'
            solution_sketch: 'Third side satisfies $4 < x < 16$; add $16$ to every part.'
          - problem: 'Two sides of a triangle measure $9$ and $9$. Between what two values must the perimeter $p$ lie?'
            answer: '18 < p < 36'
            solution_sketch: '$0 < x < 18$, so $18 < 18 + x < 36$.'
          - problem: 'Two sides of a triangle measure $6$ and $10$. What is the greatest possible whole-number perimeter of the triangle?'
            answer: "31"
            solution_sketch: 'The third side satisfies $4 < x < 16$, so the greatest whole-number value is $x = 15$; $p = 6 + 10 + 15 = 31$.'
          - problem: 'Two sides of a triangle measure $5$ and $8$. What is the least possible whole-number perimeter of the triangle?'
            answer: "17"
            solution_sketch: 'The third side satisfies $3 < x < 13$, so the least whole-number value is $x = 4$; $p = 5 + 8 + 4 = 17$.'
          - problem: 'Two sides of a triangle measure $9$ and $12$. How many distinct whole-number perimeters are possible?'
            answer: "17"
            solution_sketch: 'The third side satisfies $3 < x < 21$, so $x$ takes $17$ whole-number values ($4$ through $20$), each giving a distinct perimeter.'
          - problem: 'Two sides of a triangle measure $4$ and $11$. What is the greatest possible whole-number perimeter of the triangle?'
            answer: "29"
            solution_sketch: 'The third side satisfies $7 < x < 15$, so the greatest whole-number value is $x = 14$; $p = 4 + 11 + 14 = 29$.'
        constraints: "answer as a strict double inequality on the perimeter"
      - id: kp3
        name: Feasible isosceles side sets
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'Can an isosceles triangle have sides $4$, $4$, and $10$?'
            answer: 'No'
            answer_contract: {kind: label, options: [[Yes], [No]]}
            solution_sketch: 'The two legs would give $4 + 4 = 8 < 10$, violating the triangle inequality.'
          - problem: 'An isosceles triangle has perimeter $20$ and one side of length $8$. Find all possible side sets.'
            answer: '$\{8, 8, 4\}$ and $\{6, 6, 8\}$'
            answer_contract: {kind: none}
            solution_sketch: 'Legs $8$: base $20 - 16 = 4$ (valid, $8+4>8$). Base $8$: legs $6$ each (valid, $6+6>8$). Both pass the triangle inequality.'
          - problem: 'An isosceles triangle has perimeter $20$ and one side of length $8$. How many distinct side sets are possible?'
            answer: "2"
            solution_sketch: 'Legs $8$: base $20 - 16 = 4$ (valid, $8 + 4 > 8$). Base $8$: legs $6$ each (valid, $6 + 6 > 8$). Both work: $2$ sets.'
          - problem: 'An isosceles triangle has perimeter $20$ and one side of length $8$. If the side of length $8$ is a leg, what is the length of the base?'
            answer: "4"
            solution_sketch: 'Base $= 20 - 2 \cdot 8 = 4$, and it is valid since $8 + 4 > 8$.'
          - problem: 'An isosceles triangle has perimeter $26$ and one side of length $6$. How many distinct side sets are possible?'
            answer: "1"
            solution_sketch: 'Legs $6$: base $14$ fails ($6 + 6 < 14$). Base $6$: legs $10$ each works ($10 + 10 > 6$). Only $1$ set.'
        constraints: "check both the legs-given and base-given cases; verify each candidate with the triangle inequality"
    diagnostic_exemplar:
      problem: 'An isosceles triangle has perimeter $24$ and one side of length $10$. Find all possible side sets.'
      answer: '$\{10, 10, 4\}$ and $\{7, 7, 10\}$'
      answer_contract: {kind: none}
      solution_sketch: 'Legs $10$: base $24 - 20 = 4$ (valid, $10 + 4 > 10$). Base $10$: legs $7$ each (valid, $7 + 7 > 10$). Both pass the triangle inequality.'
    anki_seeds:
      - front: "The perimeter of a triangle with known sides a, b and unknown third side lies strictly between..."
        back: "a + b + |a - b| and 2(a + b)"
        type: basic

  - id: rigid-motions-congruence
    name: Rigid Motions and Congruence
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: segment-angle-addition
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Identify rigid motions
        key_prerequisites: []
        exemplars:
          - problem: 'Which of the following is NOT a rigid motion: translation, reflection, rotation, dilation?'
            answer: 'dilation'

            answer_contract: {kind: label, options: [[translation], [reflection], [rotation], [dilation]]}
            solution_sketch: 'A dilation with scale factor other than $1$ changes distances.'
          - problem: 'What two measurements does every rigid motion preserve?'
            answer: 'Distances (segment lengths) and angle measures.'
            answer_contract: {kind: none}
            solution_sketch: 'Rigid motions preserve segment lengths and angle measures; that is what makes the image congruent to the preimage.'
          - problem: 'Which rigid motion maps each point $(x, y)$ to $(x, -y)$: translation, reflection, rotation, or dilation?'
            answer: 'reflection'

            answer_contract: {kind: label, options: [[translation], [reflection], [rotation], [dilation]]}
            solution_sketch: 'Negating the $y$-coordinate is a reflection across the $x$-axis.'
          - problem: 'Which rigid motion maps each point $(x, y)$ to $(x + 4, y - 1)$: translation, reflection, rotation, or dilation?'
            answer: 'translation'

            answer_contract: {kind: label, options: [[translation], [reflection], [rotation], [dilation]]}
            solution_sketch: 'Adding a constant vector to every point is a translation.'
          - problem: 'Which rigid motion turns a figure about a fixed point: translation, reflection, rotation, or dilation?'
            answer: 'rotation'

            answer_contract: {kind: label, options: [[translation], [reflection], [rotation], [dilation]]}
            solution_sketch: 'A rotation spins the figure about a center through a given angle.'
        constraints: "the three rigid motions vs dilation; conceptual identification only"
      - id: kp2
        name: Apply rigid motions to coordinates
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'The translation $(x, y) \mapsto (x + 3, y - 2)$ maps $(4, 5)$ to which point?'
            answer: "(7, 3)"
            solution_sketch: 'Add $3$ to the $x$-coordinate and subtract $2$ from the $y$-coordinate: $(4 + 3, 5 - 2) = (7, 3)$.'
          - problem: 'Reflection across the $x$-axis maps $(3, -7)$ to which point?'
            answer: "(3, 7)"
            solution_sketch: 'Reflection across the $x$-axis negates the $y$-coordinate.'
          - problem: 'Reflection across the $y$-axis maps $(-2, 5)$ to which point?'
            answer: "(2, 5)"
            solution_sketch: 'Reflection across the $y$-axis negates the $x$-coordinate.'
          - problem: 'The translation $(x, y) \mapsto (x - 5, y + 6)$ maps $(2, -1)$ to which point?'
            answer: "(-3, 5)"
            solution_sketch: '$(2 - 5,\, -1 + 6) = (-3, 5)$.'
        constraints: "translations by integer vectors; reflections across the axes only; integer coordinates"
      - id: kp3
        name: Congruence via rigid motions
        key_prerequisites: [segment-angle-addition, coordinate-plane]
        exemplars:
          - problem: 'A rotation maps $\triangle ABC$ exactly onto $\triangle DEF$. Are the triangles congruent?'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'A rigid motion mapping one figure onto another is exactly what congruence means.'
          - problem: 'A translation maps $\triangle ABC$ to $\triangle DEF$ with $A \mapsto D$, $B \mapsto E$. If $AB = 9$, find $DE$.'
            answer: "9"
            solution_sketch: 'Rigid motions preserve lengths.'
          - problem: 'A reflection maps $\triangle ABC$ onto $\triangle DEF$. If $m\angle A = 52^\circ$, find $m\angle D$, in degrees.'
            answer: "52"
            solution_sketch: 'A reflection is a rigid motion, so corresponding angles are preserved: $m\angle D = m\angle A = 52^\circ$.'
          - problem: 'A rotation maps $\triangle ABC$ onto $\triangle JKL$. If $BC = 11$, find $KL$.'
            answer: "11"
            solution_sketch: 'Rotations preserve lengths, so $KL = BC = 11$.'
          - problem: 'A rigid motion maps $\overline{PQ}$ onto $\overline{XY}$. If $PQ = 7$, find $XY$.'
            answer: "7"
            solution_sketch: 'Rigid motions preserve segment lengths.'
          - problem: 'A translation maps $\triangle ABC$ exactly onto $\triangle DEF$. Are the triangles congruent? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'A translation is a rigid motion, and a rigid motion mapping one figure onto the other is exactly congruence.'
        constraints: "single rigid motion; read off preserved lengths or angles"
    diagnostic_exemplar:
      problem: 'A reflection across the $y$-axis maps $\triangle ABC$ onto $\triangle DEF$, with vertex $A(-6, 2)$ mapping to $D$. Give the coordinates of $D$, and state whether $\triangle ABC \cong \triangle DEF$ and why.'
      answer: 'D = (6, 2); yes, the triangles are congruent — a reflection is a rigid motion (it preserves distances and angles), and a rigid motion carrying one figure onto another is exactly what congruence means'
      answer_contract: {kind: none}
      solution_sketch: 'Reflection across the $y$-axis negates the $x$-coordinate; rigid motions preserve lengths and angle measures.'
    anki_seeds:
      - front: "The three rigid motions are..."
        back: "translations, reflections, and rotations"
        type: basic
      - front: "Two figures are congruent exactly when some ... maps one onto the other"
        back: "rigid motion (or composition of rigid motions)"
        type: basic

  - id: sss-sas-congruence
    name: SSS and SAS Congruence
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.6
        key: true
      - id: rigid-motions-congruence
        weight: 0.4
        key: false
      - id: triangle-inequality-classification
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize SSS
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'Two triangles have all three pairs of corresponding sides congruent. Which congruence criterion applies: SSS or SAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS]]}
            solution_sketch: 'Three congruent side pairs with no angle information: Side-Side-Side.'
          - problem: 'Given $\overline{AB} \cong \overline{DE}$, $\overline{BC} \cong \overline{EF}$, and $\overline{CA} \cong \overline{FD}$, which criterion shows $\triangle ABC \cong \triangle DEF$?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS]]}
            solution_sketch: 'All three corresponding side pairs are marked congruent, so the criterion is SSS.'
          - problem: 'Triangle 1 has side lengths $7$, $9$, and $12$; triangle 2 has side lengths $12$, $7$, and $9$. Which criterion shows them congruent: SSS or SAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS]]}
            solution_sketch: 'The three side lengths match pairwise ($7$--$7$, $9$--$9$, $12$--$12$) and no angle is used, so SSS applies.'
          - problem: 'Two triangles each have sides of lengths $6$, $8$, and $10$. Which criterion shows them congruent: SSS or SAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS]]}
            solution_sketch: 'Matching all three side lengths pins down the triangles completely, with no angle information: SSS.'
        constraints: "three side pairs marked; no angle information given"
      - id: kp2
        name: Recognize SAS and the included angle
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Two triangles have two pairs of congruent sides, and the angles between those sides are congruent. Which congruence criterion applies: SSS or SAS?'
            answer: 'SAS'
            answer_contract: {kind: label, options: [[SSS], [SAS]]}
            solution_sketch: 'Side-Angle-Side: the congruent angle is included between the two congruent sides.'
          - problem: 'In $\triangle ABC$, sides $\overline{AB}$ and $\overline{BC}$ are marked. Is $\angle A$ the included angle for these two sides?'
            answer: 'No'
            answer_contract: {kind: label, options: [[Yes], [No]]}
            solution_sketch: 'The included angle is $\angle B$, the angle between $\overline{AB}$ and $\overline{BC}$ at their common endpoint.'
          - problem: 'In $\triangle ABC$, sides $\overline{AB}$ and $\overline{AC}$ are marked. Which angle is included between these two sides: $\angle A$, $\angle B$, or $\angle C$?'
            answer: 'A'
            answer_contract: {kind: label, options: [[A], [B], [C]]}
            solution_sketch: 'The included angle sits at the common endpoint of the two marked sides, which is vertex $A$.'
          - problem: 'Two triangles have two pairs of congruent sides and one pair of congruent angles, but the congruent angle in each triangle is NOT between the marked sides. Do these markings prove the triangles congruent by SAS?'
            answer: 'No'
            answer_contract: {kind: label, options: [[Yes], [No]]}
            solution_sketch: 'SAS requires the congruent angle to be included between the two pairs of congruent sides; a non-included angle is not enough.'
        constraints: "the included/non-included distinction is the point; two sides and one angle marked"
      - id: kp3
        name: Solve for marked values under SSS or SAS
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: '$\triangle ABC \cong \triangle DEF$ by SAS with $AB = 3x - 4$ and $DE = 2x + 3$ ($\overline{AB}$ corresponds to $\overline{DE}$). Find $AB$.'
            answer: "17"
            solution_sketch: '$3x - 4 = 2x + 3 \Rightarrow x = 7$; $AB = 17$.'
          - problem: 'The included angles of an SAS pair measure $(2x + 16)^\circ$ and $(4x - 8)^\circ$. Find their common measure, in degrees.'
            answer: "40"
            solution_sketch: '$2x + 16 = 4x - 8 \Rightarrow x = 12$; each angle is $40^\circ$.'
          - problem: '$\triangle ABC \cong \triangle DEF$ by SSS with $AB = 5x - 2$ and $DE = 3x + 8$ ($\overline{AB}$ corresponds to $\overline{DE}$). Find $AB$.'
            answer: "23"
            solution_sketch: '$5x - 2 = 3x + 8 \Rightarrow 2x = 10 \Rightarrow x = 5$; $AB = 5(5) - 2 = 23$.'
          - problem: 'The included angles of an SAS pair measure $(3x + 10)^\circ$ and $(5x - 14)^\circ$. Find their common measure, in degrees.'
            answer: "46"
            solution_sketch: '$3x + 10 = 5x - 14 \Rightarrow 2x = 24 \Rightarrow x = 12$; each angle is $3(12) + 10 = 46^\circ$.'
        constraints: "corresponding parts equal; linear expressions with integer solutions"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$ and $\triangle XYZ$: $\overline{AB} \cong \overline{XY}$, $\overline{AC} \cong \overline{XZ}$, and $\angle A \cong \angle X$, where $m\angle A = (2x + 16)^\circ$ and $m\angle X = (4x - 8)^\circ$. Name the congruence criterion and find $m\angle A$, in degrees.'
      answer: 'SAS; m∠A = 40 degrees'
      answer_contract: {kind: none}
      solution_sketch: '$\angle A$ is included between $\overline{AB}$ and $\overline{AC}$, so the criterion is SAS; $2x + 16 = 4x - 8$ gives $x = 12$ and $m\angle A = 40^\circ$.'
    anki_seeds:
      - front: "SAS congruence requires the congruent angle to be ... the two congruent sides"
        back: "included between"
        type: basic
      - front: "SSS congruence uses ... pairs of congruent sides"
        back: "three"
        type: basic

  - id: asa-aas-congruence
    name: ASA and AAS Congruence
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.7
        key: true
      - id: triangle-angle-sum
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize ASA and the included side
        key_prerequisites: [sss-sas-congruence]
        exemplars:
          - problem: 'Two triangles have two pairs of congruent angles, and the sides between those angles are congruent. Which congruence criterion applies: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent sides lie between the congruent angle pairs, so it is Angle-Side-Angle.'
          - problem: 'Given $\angle A \cong \angle D$, $\overline{AB} \cong \overline{DE}$, and $\angle B \cong \angle E$, which criterion shows $\triangle ABC \cong \triangle DEF$: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side $\overline{AB}$ is included between the angles at $A$ and $B$.'
          - problem: 'In $\triangle PQR$ and $\triangle XYZ$, $\angle P \cong \angle X$, $\overline{PQ} \cong \overline{XY}$, and $\angle Q \cong \angle Y$. Which criterion shows the triangles congruent: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: '$\overline{PQ}$ lies between the congruent angles $\angle P$ and $\angle Q$, so the pattern is ASA.'
          - problem: 'In $\triangle GHI$ and $\triangle JKL$, $\angle G \cong \angle J$, $\angle I \cong \angle L$, and $\overline{GI} \cong \overline{JL}$. Which criterion shows the triangles congruent: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side $\overline{GI}$ is included between the congruent angles $\angle G$ and $\angle I$: ASA.'
        constraints: "the side lies between the two marked angles"
      - id: kp2
        name: Recognize AAS
        key_prerequisites: [sss-sas-congruence, triangle-angle-sum]
        exemplars:
          - problem: 'Given $\angle A \cong \angle D$, $\angle B \cong \angle E$, and $\overline{BC} \cong \overline{EF}$, which criterion shows $\triangle ABC \cong \triangle DEF$: SSS, SAS, ASA, or AAS?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: '$\overline{BC}$ is not between the angles at $A$ and $B$, so the pattern is Angle-Angle-Side.'
          - problem: 'Two triangles have two pairs of congruent angles and a pair of congruent non-included sides. Which congruence criterion applies: SSS, SAS, ASA, or AAS?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side is not between the two congruent angles, so it is Angle-Angle-Side.'
          - problem: 'In $\triangle MNP$ and $\triangle RST$, $\angle M \cong \angle R$, $\angle N \cong \angle S$, and $\overline{NP} \cong \overline{RT}$. Which criterion shows the triangles congruent: SSS, SAS, ASA, or AAS?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: '$\overline{NP}$ is not between $\angle M$ and $\angle N$, so the congruent side is non-included: AAS.'
          - problem: 'In $\triangle EFG$ and $\triangle HIJ$, $\angle E \cong \angle H$, $\angle F \cong \angle I$, and $\overline{FG} \cong \overline{IJ}$. Which criterion shows the triangles congruent: SSS, SAS, ASA, or AAS?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side $\overline{FG}$ touches only one of the two congruent angle pairs, so it is non-included: AAS.'
        constraints: "the side does not lie between the two marked angles"
      - id: kp3
        name: Why AAS works
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Given $\angle A \cong \angle D$ and $\angle B \cong \angle E$, what follows about $\angle C$ and $\angle F$, and why?'
            answer: '$\angle C \cong \angle F$; both equal $180^\circ$ minus the other two angles.'
            answer_contract: {kind: none}
            solution_sketch: 'Triangle angle sum forces the third pair, which is how AAS reduces to ASA.'
          - problem: 'Two angles of a triangle measure $40^\circ$ and $70^\circ$; the corresponding two angles of another triangle also measure $40^\circ$ and $70^\circ$. What is the third angle in each triangle, in degrees?'
            answer: "70"
            solution_sketch: '$180 - 40 - 70 = 70$ in both, so the third angle pair is congruent too.'
          - problem: 'AAS reduces to ASA because of which fact: the triangle angle sum, the reflexive property, the vertical angles theorem, or the definition of congruence?'
            answer: 'the triangle angle sum'
            answer_contract: {kind: label, options: [['the triangle angle sum'], ['the reflexive property'], ['the vertical angles theorem'], ['the definition of congruence']]}
            solution_sketch: 'Two congruent angle pairs force the third pair congruent (each is $180^\circ$ minus the other two), turning AAS into ASA.'
          - problem: 'Both triangles have $\angle A = 50^\circ$, $\angle B = 60^\circ$, and $AB = 8$. Which criterion shows $\triangle ABC \cong \triangle DEF$: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The third angle is $180 - 50 - 60 = 70^\circ$ in both, and the given side is included between the $50^\circ$ and $60^\circ$ angles: ASA.'
          - problem: 'If two angles of a triangle measure $45^\circ$ and $65^\circ$, what is the third angle, in degrees?'
            answer: "70"
            solution_sketch: '$180 - 45 - 65 = 70$. This third-angle fact is what lets AAS be rewritten as ASA.'
        constraints: "third-angle theorem reasoning; angle pairs summing under 180"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$ and $\triangle DEF$: $\angle A \cong \angle D$, $\angle B \cong \angle E$, and $\overline{BC} \cong \overline{EF}$. State the congruence criterion, and explain why the triangles are congruent even though the congruent sides are not between the marked angles.'
      answer: 'AAS; the third angles are congruent too (each is 180° minus the other two), so the given side becomes an included side and ASA applies'
      answer_contract: {kind: none}
      solution_sketch: 'Third-angle theorem: $\angle C \cong \angle F$, and $\overline{BC}$ lies between $\angle B$ and $\angle C$.'
    anki_seeds:
      - front: "ASA vs AAS: in ASA the congruent side is ... the two angles"
        back: "included between"
        type: basic
      - front: "AAS reduces to ASA because of the..."
        back: "third-angle theorem (triangle angle sum)"
        type: basic

  - id: hl-congruence
    name: Hypotenuse-Leg Congruence
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize HL
        key_prerequisites: [sss-sas-congruence]
        exemplars:
          - problem: 'Two right triangles have congruent hypotenuses and one pair of congruent legs. Which congruence criterion applies: SSS, SAS, HL, or ASA?'
            answer: 'HL'
            answer_contract: {kind: label, options: [[SSS], [SAS], [HL], [ASA]]}
            solution_sketch: 'Hypotenuse-Leg: the hypotenuse plus one leg in a right triangle is enough for congruence.'
          - problem: 'Right triangles $\triangle PQR$ (right angle at $Q$) and $\triangle XYZ$ (right angle at $Y$) have hypotenuses $\overline{PR} \cong \overline{XZ}$ and legs $\overline{PQ} \cong \overline{XY}$. Which criterion proves them congruent: SSS, SAS, HL, or ASA?'
            answer: 'HL'
            answer_contract: {kind: label, options: [[SSS], [SAS], [HL], [ASA]]}
            solution_sketch: '$\overline{PR}$ and $\overline{XZ}$ are the hypotenuses (opposite the right angles) and one leg pair matches: HL.'
          - problem: 'Right triangles have congruent hypotenuses and one congruent pair of legs. Is that enough to prove them congruent by the HL criterion? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'The Pythagorean theorem forces the other leg pair congruent too, so HL is really SSS for right triangles.'
          - problem: 'HL looks like SSA, which is not a valid criterion in general. Why is HL valid?'
            answer: 'The right angle fixes the remaining leg via the Pythagorean theorem, so HL is effectively SSS.'
            answer_contract: {kind: none}
            solution_sketch: 'In a right triangle the Pythagorean theorem determines the remaining leg from the hypotenuse and the given leg, so hypotenuse plus leg is really SSS.'
          - problem: 'A right triangle has legs $6$ and $8$, and hypotenuse $10$. A second right triangle has hypotenuse $10$ and one leg $8$. Are the triangles congruent by HL? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'By the Pythagorean theorem the second triangle also has a leg of $6$, so hypotenuse and a leg pair match: HL applies.'
        constraints: "right triangles only; hypotenuse plus one leg marked"
      - id: kp2
        name: Identify the hypotenuse
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'In right $\triangle ABC$ with the right angle at $C$, which side is the hypotenuse: $AB$, $BC$, or $AC$?'
            answer: 'AB'
            answer_contract: {kind: label, options: [[AB], [BC], [AC]]}
            solution_sketch: 'The hypotenuse is the side opposite the right angle.'
          - problem: 'A right triangle has legs $5$ and $12$. Find the hypotenuse.'
            answer: "13"
            solution_sketch: '$\sqrt{5^2 + 12^2} = \sqrt{169} = 13$.'
          - problem: 'A right triangle has legs $7$ and $24$. Find the hypotenuse.'
            answer: "25"
            solution_sketch: '$\sqrt{7^2 + 24^2} = \sqrt{625} = 25$.'
          - problem: 'A right triangle has legs $9$ and $12$. Find the hypotenuse.'
            answer: "15"
            solution_sketch: '$\sqrt{9^2 + 12^2} = \sqrt{225} = 15$.'
        constraints: "Pythagorean triples only; right angle named by vertex"
      - id: kp3
        name: HL with variables
        key_prerequisites: [sss-sas-congruence]
        exemplars:
          - problem: 'Right triangles are congruent by HL; their hypotenuses measure $5x - 3$ and $3x + 11$. Find the hypotenuse length.'
            answer: "32"
            solution_sketch: '$5x - 3 = 3x + 11 \Rightarrow x = 7$; hypotenuse $= 32$.'
          - problem: 'Right triangles are congruent by HL; the corresponding legs measure $2x + 7$ and $4x - 9$. Find the leg length.'
            answer: "23"
            solution_sketch: '$2x + 7 = 4x - 9 \Rightarrow x = 8$; leg $= 23$.'
          - problem: 'Right triangles are congruent by HL; their hypotenuses measure $4x + 1$ and $6x - 9$. Find the hypotenuse length.'
            answer: "21"
            solution_sketch: '$4x + 1 = 6x - 9 \Rightarrow x = 5$; hypotenuse $= 21$.'
          - problem: 'Right triangles are congruent by HL; the corresponding legs measure $7x - 6$ and $5x + 8$. Find the leg length.'
            answer: "43"
            solution_sketch: '$7x - 6 = 5x + 8 \Rightarrow x = 7$; leg $= 43$.'
        constraints: "corresponding parts equal; linear expressions with integer solutions"
    diagnostic_exemplar:
      problem: 'In right triangles $\triangle ABC$ (right angle at $C$) and $\triangle DEF$ (right angle at $F$), $\overline{AB} \cong \overline{DE}$ and $\overline{BC} \cong \overline{EF}$, with $AB = 5x - 3$ and $DE = 3x + 11$. Name the congruence criterion and find $AB$.'
      answer: 'HL; AB = 32'
      answer_contract: {kind: none}
      solution_sketch: '$\overline{AB}$ and $\overline{DE}$ are the hypotenuses (opposite the right angles) and $\overline{BC}$, $\overline{EF}$ are corresponding legs, so HL applies; $5x - 3 = 3x + 11$ gives $x = 7$ and $AB = 32$.'
    anki_seeds:
      - front: "HL congruence applies only to ... triangles"
        back: "right"
        type: basic
      - front: "HL requires congruent hypotenuses and..."
        back: "one pair of congruent corresponding legs"
        type: basic

  - id: triangle-congruence-criteria
    name: Triangle Congruence Criteria
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.7
        key: true
      - id: asa-aas-congruence
        weight: 0.7
        key: true
      - id: hl-congruence
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Choose the criterion from marked information
        key_prerequisites: [sss-sas-congruence, asa-aas-congruence, hl-congruence]
        exemplars:
          - problem: 'In quadrilateral $ABCD$, $\overline{AB} \cong \overline{CB}$ and $\overline{AD} \cong \overline{CD}$, and diagonal $\overline{BD}$ is drawn. Which of SSS, SAS, ASA, AAS, and HL proves $\triangle ABD \cong \triangle CBD$?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The shared diagonal gives $\overline{BD} \cong \overline{BD}$ (reflexive), so all three pairs of sides match: SSS.'
          - problem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle A \cong \angle D$, $\angle C \cong \angle F$, and $\overline{AB} \cong \overline{DE}$. Which of the five criteria applies: SSS, SAS, ASA, AAS, or HL?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The congruent side $\overline{AB}$ lies between $\angle A$ and $\angle B$, not between the two congruent angles $\angle A$ and $\angle C$, so it is non-included: AAS, not ASA.'
          - problem: 'In $\triangle ABC$ with $\overline{AB} \cong \overline{AC}$, the altitude $\overline{AD}$ is drawn to $\overline{BC}$. Which of the five criteria proves $\triangle ABD \cong \triangle ACD$: SSS, SAS, ASA, AAS, or HL?'
            answer: 'HL'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The altitude makes right angles at $D$; the hypotenuses $\overline{AB}$ and $\overline{AC}$ are congruent and the leg $\overline{AD}$ is shared, so HL applies.'
          - problem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle B \cong \angle E$, $\overline{BC} \cong \overline{EF}$, and $\angle C \cong \angle F$. Which of the five criteria applies: SSS, SAS, ASA, AAS, or HL?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The congruent side $\overline{BC}$ is included between the congruent angles at $B$ and $C$: ASA.'
        constraints: "criteria drawn from SSS, SAS, ASA, AAS, HL; each item needs one deduction first (a shared side, vertical angles, or the angle sum) before the criterion is named, and the choice ranges over all five"
      - id: kp2
        name: Recognize non-criteria
        key_prerequisites: [asa-aas-congruence]
        exemplars:
          - problem: 'Two triangles have all three pairs of corresponding angles congruent (AAA). Must the triangles be congruent?'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'AAA guarantees the same shape (similarity) but not the same size: two equilateral triangles with sides $1$ and $2$ have equal angles but are not congruent.'
          - problem: 'Two triangles agree in two sides and a non-included angle (SSA). Is SSA a valid congruence criterion?'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Keep two sides fixed and swing the non-included angle: it can land at two positions, giving different third sides.'
          - problem: 'Is AAA a valid triangle congruence criterion? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Equal angles only fix the shape; an equilateral triangle with side $1$ and one with side $2$ are both AAA but not congruent.'
          - problem: 'Is SSA a valid triangle congruence criterion? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'With two sides and the angle not between them, two different triangles can satisfy the same data (the ambiguous case).'
          - problem: 'Two triangles have all three pairs of corresponding angles congruent. What is certainly true of them: they are congruent, they are similar, they have equal perimeters, or they share a side?'
            answer: 'they are similar'
            answer_contract: {kind: label, options: [['they are congruent'], ['they are similar'], ['they have equal perimeters'], ['they share a side']]}
            solution_sketch: 'Equal angles force the same shape (similarity); the sizes can differ.'
          - problem: 'Which of the following is a valid triangle congruence criterion: SSA, AAA, SAS, or none of these?'
            answer: 'SAS'
            answer_contract: {kind: label, options: [[SSA], [AAA], [SAS], ['none of these']]}
            solution_sketch: 'Two sides and the included angle force the third side and both remaining angles, so SAS is valid; SSA and AAA are not.'
        constraints: "AAA and SSA only; ask for the reason, not just yes/no"
      - id: kp3
        name: Write the congruence statement with correct correspondence
        key_prerequisites: [sss-sas-congruence, asa-aas-congruence]
        exemplars:
          - problem: 'Given $\overline{AB} \cong \overline{DE}$, $\overline{BC} \cong \overline{EF}$, and $\overline{AC} \cong \overline{DF}$, the triangles are congruent with correspondence $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Which criterion gives the congruence: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'All three side pairs are congruent, so $\triangle ABC \cong \triangle DEF$ by SSS.'
          - problem: 'Given $\angle A \cong \angle D$, $\overline{AB} \cong \overline{DE}$, and $\angle B \cong \angle E$, the triangles are congruent with correspondence $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Which criterion gives the congruence: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side $\overline{AB}$ is included between the congruent angles, so $\triangle ABC \cong \triangle DEF$ by ASA.'
          - problem: '$\triangle ABC \cong \triangle DEF$. Which side corresponds to $\overline{AB}$: $DE$, $EF$, or $FD$?'
            answer: 'DE'
            answer_contract: {kind: label, options: [[DE], [EF], [FD]]}
            solution_sketch: 'The correspondence $A \leftrightarrow D$, $B \leftrightarrow E$ pairs $\overline{AB}$ with $\overline{DE}$.'
          - problem: '$\triangle PQR \cong \triangle STU$. Which angle corresponds to $\angle Q$: angle S, angle T, or angle U?'
            answer: 'angle T'
            answer_contract: {kind: label, options: [['angle S'], ['angle T'], ['angle U']]}
            solution_sketch: 'The second letter of each triangle name corresponds: $P \leftrightarrow S$, $Q \leftrightarrow T$, $R \leftrightarrow U$.'
        constraints: "vertex order in the statement must respect the correspondence; give the criterion"
    diagnostic_exemplar:
      problem: 'In quadrilateral $PQRS$, $\overline{PQ} \cong \overline{RQ}$ and $\overline{PS} \cong \overline{RS}$, and diagonal $\overline{QS}$ is drawn. State the triangle congruence this gives and its criterion.'
      answer: '$\triangle PQS \cong \triangle RQS$ by SSS'
      answer_contract: {kind: none}
      solution_sketch: 'The shared diagonal gives $\overline{QS} \cong \overline{QS}$ (reflexive), completing three side pairs; the vertex order follows the correspondence $P \leftrightarrow R$.'
    anki_seeds:
      - front: "The five valid triangle congruence criteria are..."
        back: "SSS, SAS, ASA, AAS, HL (right triangles)"
        type: basic
      - front: "Why is SSA not a congruence criterion?"
        back: "Two sides and a non-included angle can produce two different triangles (the ambiguous case)."
        type: basic
      - front: "AAA guarantees triangles are..."
        back: "similar, not necessarily congruent"
        type: basic

  - id: isosceles-equilateral-triangles
    name: Isosceles and Equilateral Triangles
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.7
        key: true
      - id: triangle-congruence-criteria
        weight: 0.4
        key: false
      - id: two-step-equations
        weight: 0.4
        key: false
