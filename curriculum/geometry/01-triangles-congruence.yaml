        back: "perpendicular bisectors of the sides"
        type: basic
      - front: "The incenter is the concurrency point of the ... and is equidistant from the sides"
        back: "angle bisectors"
        type: basic

  - id: congruence-proofs-cpctc
    name: Congruence Proofs and CPCTC
    core: false                # proof-practice genre; terminal
    difficulty: 0.45
    drill: false
    answer_kind: numeric       # flipped from multi-step: exemplars are single-answer (labels with contracts / numerals), per the proven pattern
    expected_time_secs: 240
    prerequisites:
      - id: triangle-congruence-criteria
        weight: 0.8
        key: true
      - id: writing-geometric-proofs
        weight: 0.7
        key: true
      - id: isosceles-equilateral-triangles
        weight: 0.4
        key: false
      - id: angle-relationships
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Prove triangles congruent using shared parts
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'Given $\overline{AB} \cong \overline{AD}$ and $\overline{CB} \cong \overline{CD}$, with diagonal $\overline{AC}$ drawn, which criterion proves $\triangle ABC \cong \triangle ADC$: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'Two given side pairs plus the shared side $\overline{AC} \cong \overline{AC}$ (reflexive) give all three side pairs: SSS.'
          - problem: '$M$ is the midpoint of $\overline{AC}$. If $AC = 16$, find $AM$.'
            answer: "8"
            solution_sketch: 'A midpoint splits the segment in half: $AM = 16/2 = 8$.'
          - problem: '$M$ is the midpoint of both $\overline{AC}$ and $\overline{BD}$. In proving $\triangle AMB \cong \triangle CMD$, which reason gives the angle pair $\angle AMB \cong \angle CMD$: vertical angles, corresponding angles, the reflexive property, or the definition of midpoint?'
            answer: 'vertical angles'
            answer_contract: {kind: label, options: [['vertical angles'], ['corresponding angles'], ['the reflexive property'], ['the definition of midpoint']]}
            solution_sketch: '$\overline{AC}$ and $\overline{BD}$ intersect at $M$, so $\angle AMB$ and $\angle CMD$ are vertical angles and congruent.'
          - problem: 'A proof that $\triangle ABD \cong \triangle CBD$ uses the step $\overline{BD} \cong \overline{BD}$. Which property justifies that step: the reflexive property, the symmetric property, the transitive property, or the distributive property?'
            answer: 'the reflexive property'
            answer_contract: {kind: label, options: [['the reflexive property'], ['the symmetric property'], ['the transitive property'], ['the distributive property']]}
            solution_sketch: 'A segment shared by both triangles is congruent to itself: the reflexive property.'
        constraints: "reasons limited to given, reflexive, midpoint/bisector definitions, vertical angles, then SSS/SAS/ASA/AAS"
      - id: kp2
        name: CPCTC conclusions
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: '$\triangle ABC \cong \triangle DEF$ with $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Which pair is congruent by CPCTC: $AB$ and $DF$, $BC$ and $EF$, $AC$ and $EF$, or angle A and angle E?'
            answer: 'BC and EF'
            answer_contract: {kind: label, options: [['AB and DF'], ['BC and EF'], ['AC and EF'], ['angle A and angle E']]}
            solution_sketch: 'Matching the correspondence $B \leftrightarrow E$ and $C \leftrightarrow F$, the corresponding side pair is $\overline{BC} \cong \overline{EF}$.'
          - problem: 'Must a triangle congruence be proved before CPCTC can give conclusions about parts? Answer yes or no.'
            answer: 'yes'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'CPCTC only applies to corresponding parts of triangles that are already known congruent.'
          - problem: '$\triangle PQR \cong \triangle STU$ with $Q \leftrightarrow T$ and $m\angle Q = 55^\circ$. Find $m\angle T$, in degrees.'
            answer: "55"
            solution_sketch: 'Corresponding angles of congruent triangles are congruent (CPCTC), so $m\angle T = 55$.'
          - problem: '$\triangle ABC \cong \triangle ADC$ has been proved, and CPCTC gives $\angle BAC \cong \angle DAC$. What does that make $\overline{AC}$ for $\angle BAD$: its bisector, its midpoint, a perpendicular to it, or none of these?'
            answer: 'its bisector'
            answer_contract: {kind: label, options: [['its bisector'], ['its midpoint'], ['a perpendicular to it'], ['none of these']]}
            solution_sketch: 'A ray that splits an angle into two congruent angles is the angle bisector.'
        constraints: "CPCTC only after a congruence is established; the conclusion must name corresponding parts"
      - id: kp3
        name: Two-stage proofs through an auxiliary congruence
        key_prerequisites: [triangle-congruence-criteria, isosceles-equilateral-triangles]
        exemplars:
          - problem: 'Isosceles $\triangle ABC$ has $\overline{AB} \cong \overline{AC}$ and $M$ the midpoint of $\overline{BC}$. Which criterion proves $\triangle ABM \cong \triangle ACM$: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: '$AB = AC$ (given), $BM = CM$ (midpoint), and $\overline{AM} \cong \overline{AM}$ (reflexive): SSS.'
          - problem: 'In that proof, CPCTC gives $\angle AMB \cong \angle AMC$, and the two angles form a linear pair. Find $m\angle AMB$, in degrees.'
            answer: "90"
            solution_sketch: 'Congruent angles that sum to $180^\circ$ are each $90^\circ$, so $\overline{AM} \perp \overline{BC}$.'
          - problem: 'Given $\overline{PQ} \parallel \overline{SR}$ and $\overline{PQ} \cong \overline{SR}$ with diagonal $\overline{QS}$ drawn: which reason gives $\angle PQS \cong \angle RSQ$: alternate interior angles, vertical angles, the reflexive property, or the definition of midpoint?'
            answer: 'alternate interior angles'
            answer_contract: {kind: label, options: [['alternate interior angles'], ['vertical angles'], ['the reflexive property'], ['the definition of midpoint']]}
            solution_sketch: 'The diagonal $\overline{QS}$ is a transversal of the parallels $\overline{PQ}$ and $\overline{SR}$, so the alternate interior angles are congruent.'
          - problem: '$\triangle PQS \cong \triangle RSQ$ has been proved, and $PQ = 7$. Find $RS$.'
            answer: "7"
            solution_sketch: 'In the correspondence $P \leftrightarrow R$, $Q \leftrightarrow S$, $S \leftrightarrow Q$, side $\overline{PQ}$ corresponds to $\overline{RS}$, so by CPCTC $RS = PQ = 7$.'
        constraints: "at most two stages; single-answer items: name the criterion or reason via a label contract, or give the numeric CPCTC conclusion"
    diagnostic_exemplar:
      problem: 'Given $\overline{AB} \parallel \overline{DC}$ and $\overline{AB} \cong \overline{DC}$, with diagonal $\overline{BD}$ drawn, which criterion proves $\triangle ABD \cong \triangle CDB$: SSS, SAS, ASA, or AAS?'
      answer: 'SAS'
      answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
      solution_sketch: 'Alternate interior angles give $\angle ABD \cong \angle CDB$ at the transversal $\overline{BD}$, the diagonal is reflexive, and $\overline{AB} \cong \overline{DC}$ is given: two sides and the included angle, SAS.'
    anki_seeds:
      - front: "CPCTC stands for..."
        back: "Corresponding Parts of Congruent Triangles are Congruent"
        type: basic
      - front: "In two-triangle proofs, a side shared by both triangles is congruent to itself by the..."
        back: "reflexive property"
        type: basic
