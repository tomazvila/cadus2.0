unit: triangles-congruence
course: geometry
module: "Triangles & Congruence"
topics:
  - id: classifying-triangles
    name: Classifying Triangles
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.6
        key: true
      - id: measuring-segments-angles
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Classify by sides
        key_prerequisites: [measuring-segments-angles]
        exemplars:
          - problem: 'The sides of triangle $ABC$ measure $AB = 7$ cm, $BC = 7$ cm and $CA = 10$ cm. Classify the triangle by its sides.'
            answer_contract: {"kind":"label","options":[["isosceles","an isosceles triangle","it is isosceles","isosceles triangle","it's isosceles"],["scalene","a scalene triangle","it is scalene","scalene triangle","it's scalene"],["equilateral","an equilateral triangle","it is equilateral","equilateral triangle","it's equilateral"]]}
            answer: 'isosceles'
            solution_sketch: 'Two sides, $AB$ and $BC$, have the same length $7$ cm, and the third side, $10$ cm, is different. A triangle with exactly two equal sides is isosceles.'
          - problem: 'A gardener marks out a triangular flower bed with sides of $5$ m, $7$ m and $9$ m. Classify the bed by its sides.'
            answer_contract: {"kind":"label","options":[["isosceles","an isosceles triangle","it is isosceles","isosceles triangle","it's isosceles"],["scalene","a scalene triangle","it is scalene","scalene triangle","it's scalene"],["equilateral","an equilateral triangle","it is equilateral","equilateral triangle","it's equilateral"]]}
            answer: 'scalene'
            solution_sketch: 'No two of the sides $5$ m, $7$ m and $9$ m are equal. A triangle with three different side lengths is scalene.'
          - problem: 'A warning sign is an equilateral triangle with a perimeter of $2.7$ m. How long is each side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '0.9'
            solution_sketch: 'An equilateral triangle has three equal sides, so each side is one third of the perimeter. Each side is $2.7 \div 3 = 0.9$ m long.'
          - problem: 'The two equal rafters of an isosceles roof truss are each $4.2$ m long, and the perimeter of the truss is $13$ m. How long is the third side, the tie beam, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4.6'
            solution_sketch: 'The two rafters together measure $2 \cdot 4.2 = 8.4$ m. The tie beam is the rest of the perimeter, $13 - 8.4 = 4.6$ m.'
          - problem: 'In triangle $PQR$, $PQ = (3x - 2)$ cm, $QR = (x + 8)$ cm and $PR = 9$ cm, and the triangle is isosceles with $PQ = QR$. What is its perimeter, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '35'
            solution_sketch: 'Set the equal sides equal: $3x - 2 = x + 8$, so $2x = 10$ and $x = 5$. Then $PQ = QR = 13$ cm, and the perimeter is $13 + 13 + 9 = 35$ cm.'
          - problem: 'A triangular flag has two sides of $24$ cm each and a perimeter of $72$ cm. How long is the third side, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '24'
            solution_sketch: 'The two known sides use $24 + 24 = 48$ cm of the perimeter. The third side is $72 - 48 = 24$ cm, so this flag has three equal sides.'
        constraints: 'side classification from the side lengths (isosceles, scalene, equilateral), at most two classification items; perimeter and missing-side items in garden, sign, truss and flag contexts; one algebraic equal-sides item'
      - id: kp2
        name: Classify by angles
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Triangle $ABC$ has angles of $35^\circ$, $55^\circ$ and $90^\circ$. Classify the triangle by its angles.'
            answer_contract: {"kind":"label","options":[["right","a right triangle","right triangle","it is right","right-angled","a right-angled triangle","right angled","right angled triangle"],["obtuse","an obtuse triangle","obtuse triangle","it is obtuse","it's obtuse"],["acute","an acute triangle","acute triangle","it is acute","it's acute"]]}
            answer: 'right'
            solution_sketch: 'One angle of the triangle is exactly $90^\circ$, and $35 + 55 + 90 = 180$ confirms that the three angles fit together. A triangle with one right angle is a right triangle.'
          - problem: 'A surveyor measures the three corners of a triangular lot and finds $28^\circ$, $41^\circ$ and $111^\circ$. Classify the lot by its angles.'
            answer_contract: {"kind":"label","options":[["right","a right triangle","right triangle","it is right","right-angled","a right-angled triangle","right angled","right angled triangle"],["obtuse","an obtuse triangle","obtuse triangle","it is obtuse","it's obtuse"],["acute","an acute triangle","acute triangle","it is acute","it's acute"]]}
            answer: 'obtuse'
            solution_sketch: 'The largest corner, $111^\circ$, is greater than $90^\circ$. A triangle with one angle greater than $90^\circ$ is obtuse, and the other two angles must then be acute.'
          - problem: 'In an obtuse triangle one angle measures $128^\circ$ and the other two angles are equal. How large is each of the other two angles, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The three angles add up to $180^\circ$, so the two equal angles share $180 - 128 = 52^\circ$. Each of them measures $52 \div 2 = 26^\circ$.'
          - problem: 'The angles of a triangle are in the ratio $1 : 2 : 3$. How large is the largest angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The ratio parts add up to $1 + 2 + 3 = 6$, so one part is $180 \div 6 = 30^\circ$. The largest angle is $3 \cdot 30 = 90^\circ$, so the triangle is a right triangle.'
          - problem: 'The angles of a triangle measure $(x + 10)^\circ$, $(2x - 20)^\circ$ and $(3x + 10)^\circ$. How large is the largest angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '100'
            solution_sketch: 'The angles add up to $180^\circ$, so $6x = 180$ and $x = 30$. The angles are $40^\circ$, $40^\circ$ and $100^\circ$, so the largest angle is $100^\circ$.'
          - problem: 'The gable end of a house is an isosceles triangle with an apex angle of $104^\circ$. How large is each base angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '38'
            solution_sketch: 'The base angles of an isosceles triangle are equal, and the three angles add up to $180^\circ$. Each base angle is $(180 - 104) \div 2 = 38^\circ$.'
          - problem: 'A kite has a triangular tail fin with two angles of $67^\circ$ each. How large is the third angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '46'
            solution_sketch: 'The two known angles add up to $67 + 67 = 134^\circ$. The third angle is $180 - 134 = 46^\circ$, so the fin is an acute triangle.'
        constraints: 'angle classification (right, obtuse, acute) from three given angles, at most two classification items; unknown-angle items from ratios, algebraic expressions and isosceles base angles; contexts on lots, gables and kite fins'
      - id: kp3
        name: Classify after finding the missing angle
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Two angles of triangle $DEF$ measure $42^\circ$ and $48^\circ$. Classify the triangle by its angles.'
            answer_contract: {"kind":"label","options":[["right","a right triangle","right triangle","it is right","right-angled","a right-angled triangle","right angled","right angled triangle"],["obtuse","an obtuse triangle","obtuse triangle","it is obtuse","it's obtuse"],["acute","an acute triangle","acute triangle","it is acute","it's acute"]]}
            answer: 'right'
            solution_sketch: 'The third angle is $180^\circ - 42^\circ - 48^\circ = 90^\circ$. A triangle with a $90^\circ$ angle is a right triangle.'
          - problem: 'A carpenter cuts a triangular shelf bracket. Two of its angles are $70^\circ$ and $55^\circ$. Classify the bracket by its angles.'
            answer_contract: {"kind":"label","options":[["right","a right triangle","right triangle","it is right","right-angled","a right-angled triangle","right angled","right angled triangle"],["obtuse","an obtuse triangle","obtuse triangle","it is obtuse","it's obtuse"],["acute","an acute triangle","acute triangle","it is acute","it's acute"]]}
            answer: 'acute'
            solution_sketch: 'The third angle is $180 - 70 - 55 = 55^\circ$. All three angles, $70^\circ$, $55^\circ$ and $55^\circ$, are less than $90^\circ$, so the bracket is an acute triangle.'
          - problem: 'A triangle has two angles of $35^\circ$ each. How large is its largest angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '110'
            solution_sketch: 'The two known angles add up to $70^\circ$, so the third angle is $180 - 70 = 110^\circ$. That is the largest angle, and the triangle is obtuse.'
          - problem: 'Two corners of a triangular sail measure $52^\circ$ and $66^\circ$. How large is the third corner, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '62'
            solution_sketch: 'The three corners add up to $180^\circ$. The third corner is $180 - 52 - 66 = 62^\circ$.'
          - problem: 'The angles of triangle $XYZ$ are $\angle X = (x + 40)^\circ$, $\angle Y = (2x - 10)^\circ$ and $\angle Z = (3x - 30)^\circ$. How large is the largest angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The angles add up to $180^\circ$, so $6x = 180$ and $x = 30$. The angles are $70^\circ$, $50^\circ$ and $60^\circ$, so the largest is $70^\circ$ and the triangle is acute.'
          - problem: 'One angle of a triangle is a right angle, and the other two angles measure $x^\circ$ and $(x + 20)^\circ$. How large is the smallest angle, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The two other angles add up to $180 - 90 = 90^\circ$, so $2x + 20 = 90$ and $x = 35$. The angles are $35^\circ$, $55^\circ$ and $90^\circ$, so the smallest is $35^\circ$.'
          - problem: 'Two corners of a triangular park measure $25^\circ$ and $40^\circ$. How large is the third corner, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '115'
            solution_sketch: 'The three corners add up to $180^\circ$. The third corner is $180 - 25 - 40 = 115^\circ$, so the park is an obtuse triangle.'
        constraints: 'two angles given, the third found from the angle sum before the class is read; at most two classification items, the rest ask for the missing or largest angle; algebraic angles and sail, bracket and park contexts'
    diagnostic_exemplar:
      problem: 'A triangle has exactly two congruent sides, and two of its angles measure $41^\circ$ each. Classify it by its sides and by its angles.'
      answer: 'isosceles and obtuse'
      answer_contract: {kind: label, options: [['isosceles and acute', 'acute isosceles', 'an acute isosceles triangle', 'isosceles, acute'], ['isosceles and right', 'right isosceles', 'an right isosceles triangle', 'isosceles, right'], ['isosceles and obtuse', 'obtuse isosceles', 'an obtuse isosceles triangle', 'isosceles, obtuse'], ['scalene and acute', 'acute scalene', 'an acute scalene triangle', 'scalene, acute'], ['scalene and right', 'right scalene', 'an right scalene triangle', 'scalene, right'], ['scalene and obtuse', 'obtuse scalene', 'an obtuse scalene triangle', 'scalene, obtuse'], ['equilateral and acute', 'acute equilateral', 'an acute equilateral triangle', 'equilateral, acute']]}
      solution_sketch: 'Exactly two congruent sides make it isosceles (not equilateral); the third angle is $180 - 41 - 41 = 98^\circ > 90^\circ$, so it is obtuse.'
    anki_seeds:
      - front: "A triangle with exactly two congruent sides is..."
        back: "isosceles"
        type: basic
      - front: "A triangle with all angles under 90 degrees is..."
        back: "acute"
        type: basic

  - id: triangle-inequality-classification
    name: Triangle Inequality and Classification
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: classifying-triangles
        weight: 0.6
        key: true
      - id: triangle-angle-sum
        weight: 0.4
        key: false
      - id: linear-inequalities
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Can three lengths form a triangle?
        key_prerequisites: [linear-inequalities]
        try_first:
          problem: 'Two sticks of $3$ cm and $4$ cm are joined at one end. A third stick of $8$ cm is to join their free ends. Is a triangle formed?'
          answer_contract: {"kind":"label","options":[["no","it is not possible","no, it is not possible","not possible","it cannot","no, it cannot","they cannot","it can't"],["yes","it is possible","yes, it is possible","possible","it can","yes, it can","they can","it's possible"]]}
          answer: 'no'
          reveal: 'The two short sticks together reach at most $3 + 4 = 7$ cm, so their free ends can never be $8$ cm apart. A straight segment is the shortest path between two points, so each side of a triangle must be shorter than the other two sides together.'
        exemplars:
          - problem: 'Can segments of $4$ cm, $5$ cm and $10$ cm form a triangle?'
            answer_contract: {"kind":"label","options":[["no","it is not possible","no, it is not possible","not possible","it cannot","no, it cannot","they cannot","it can't"],["yes","it is possible","yes, it is possible","possible","it can","yes, it can","they can","it's possible"]]}
            answer: 'no'
            solution_sketch: 'The two shorter segments add up to $4 + 5 = 9$ cm, which is less than the longest segment, $10$ cm. The two short segments cannot reach each other, so no triangle exists.'
          - problem: 'A park plan shows three straight paths of $7$ m, $9$ m and $12$ m that are to meet end to end in a triangular loop. Is that possible?'
            answer_contract: {"kind":"label","options":[["no","it is not possible","no, it is not possible","not possible","it cannot","no, it cannot","they cannot","it can't"],["yes","it is possible","yes, it is possible","possible","it can","yes, it can","they can","it's possible"]]}
            answer: 'yes'
            solution_sketch: 'The two shorter paths add up to $7 + 9 = 16$ m, which is more than the longest path, $12$ m. The other two sums are larger still, so the paths can form a triangle.'
          - problem: 'A craft box holds sticks of $3$ cm, $4$ cm, $6$ cm and $10$ cm. Which three of them can be the sides of a triangle?'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '3, 4, 6'
            solution_sketch: 'Any set that contains the $10$ cm stick needs the other two to add up to more than $10$, but $3 + 4 = 7$, $3 + 6 = 9$ and $4 + 6 = 10$ all fail. The sticks $3$, $4$ and $6$ work, since $3 + 4 = 7 > 6$.'
          - problem: 'A roofer has two beams of $8$ m and $13$ m for a triangular frame. The third beam is chosen from the lengths $4$ m, $5$ m, $12$ m, $17$ m, $21$ m and $22$ m. Which lengths can be used?'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '12, 17'
            solution_sketch: 'The third beam must be longer than $13 - 8 = 5$ m and shorter than $13 + 8 = 21$ m. Only $12$ m and $17$ m lie strictly between $5$ and $21$.'
          - problem: 'A triangle has sides of $3$ cm, $5$ cm and $(2x + 1)$ cm, where $x$ is a whole number. What is the greatest possible value of $x$?'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The third side must be greater than $5 - 3 = 2$ and less than $5 + 3 = 8$. So $2x + 1 < 8$, which gives $x < 3.5$, and the greatest whole number is $3$.'
          - problem: 'A loop of string $30$ cm long is pulled tight into a triangle. What is the greatest whole number of centimetres that the longest side can measure?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '14'
            solution_sketch: 'The longest side must be shorter than the other two sides together, so it is shorter than half the perimeter, $30 \div 2 = 15$ cm. The greatest whole number below $15$ is $14$, and the sides $14$, $8$ and $8$ do form a triangle.'
        constraints: 'three given lengths or one unknown length tested against the triangle inequality; at most two yes-or-no items (one of each), the others pick sets, solve for a parameter or bound the longest side; equality cases included; contexts with beams, paths, sticks and string'
      - id: kp2
        name: Range of the third side
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Two sides of a triangle measure $5$ cm and $9$ cm. What is the greatest whole-number length of the third side, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The third side must be longer than $9 - 5 = 4$ cm and shorter than $9 + 5 = 14$ cm. The greatest whole number below $14$ is $13$.'
          - problem: 'Two sides of a triangle each measure $7$ cm. What are the possible values of the third side $x$, in centimetres?'
            answer_contract: {"kind":"exact"}
            answer: '0 < x < 14'
            solution_sketch: 'The difference of the two sides is $7 - 7 = 0$ and their sum is $7 + 7 = 14$. So the third side satisfies $0 < x < 14$.'
          - problem: 'A hiker walks $8$ km in a straight line from camp to a lake, then $3$ km in a straight line from the lake to a hut. Camp, lake and hut do not lie on one straight line. What is the least whole number of kilometres in the straight-line distance from camp to hut?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The camp-to-hut distance is greater than $8 - 3 = 5$ km and less than $8 + 3 = 11$ km. The least whole number above $5$ is $6$.'
          - problem: 'Two sides of a triangular sail measure $4.5$ m and $2.5$ m, and the third side is a whole number of metres. What are the possible lengths of the third side, in metres?'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '3, 4, 5, 6'
            solution_sketch: 'The third side is longer than $4.5 - 2.5 = 2$ m and shorter than $4.5 + 2.5 = 7$ m. The whole numbers between $2$ and $7$ are $3$, $4$, $5$ and $6$.'
          - problem: 'A triangle has sides of $6$ cm, $10$ cm and $2x$ cm. What is the greatest whole-number value of $x$?'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The side $2x$ must be less than $6 + 10 = 16$, so $x < 8$. The greatest whole number below $8$ is $7$, and the sides $6$, $10$ and $14$ do form a triangle.'
          - problem: 'Tom says that a triangle with two sides of $6$ cm and $10$ cm can have a third side of $16$ cm. What is the greatest whole-number length of the third side, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'Tom used the sum $6 + 10 = 16$ as an allowed value, but the third side must be strictly less than the sum, since a side of $16$ cm would leave a flat triangle. The greatest whole number below $16$ is $15$.'
          - problem: 'A surveyor stands at a point $P$ on the shore of a lake. Across the water, the points $A$ and $B$ are $120$ m and $85$ m from $P$, and $A$, $P$ and $B$ do not lie on one line. What is the greatest whole number of metres that the distance $AB$ can measure?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '204'
            solution_sketch: 'The distance $AB$ is less than $120 + 85 = 205$ m, and more than $120 - 85 = 35$ m. The greatest whole number below $205$ is $204$.'
        constraints: 'two sides given, the third bounded by their difference and sum; answers are a double inequality, a list of whole-number lengths or a greatest or least whole number; one parametric side and one named-error item; contexts with hikes, sails and lake surveys'
      - id: kp3
        name: Order sides and angles
        key_prerequisites: [classifying-triangles]
        exemplars:
          - problem: 'In triangle $ABC$, $AB = 7$ cm, $BC = 9$ cm and $CA = 12$ cm. Which angle of the triangle is the largest?'
            answer_contract: {"kind":"label","options":[["angle B","B","∠B","angle ABC","it is angle B","the angle at B","angle at B"],["angle A","A","∠A","angle BAC","it is angle A","the angle at A","angle at A"],["angle C","C","∠C","angle ACB","it is angle C","the angle at C","angle at C"]]}
            answer: 'angle B'
            solution_sketch: 'The largest angle lies opposite the longest side. The longest side is $CA = 12$ cm, and the angle opposite $CA$ is the angle at $B$.'
          - problem: 'A triangular sail $DEF$ has corners with $\angle D = 50^\circ$, $\angle E = 60^\circ$ and $\angle F = 70^\circ$. Which side of the sail is the longest?'
            answer_contract: {"kind":"label","options":[["side DE","DE","ED","segment DE"],["side EF","EF","FE","segment EF"],["side DF","DF","FD","segment DF"]]}
            answer: 'side DE'
            solution_sketch: 'The longest side lies opposite the largest angle. The largest angle is $\angle F = 70^\circ$, and the side opposite $F$ is $DE$.'
          - problem: 'In triangle $PQR$, $PQ = 9$ m, $QR = 12$ m and $RP = 7$ m. List the angles of the triangle from smallest to largest.'
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            answer: 'Q, R, P'
            solution_sketch: 'Each angle lies opposite a side, and a longer side faces a larger angle. The sides $7$, $9$ and $12$ lie opposite the angles at $Q$, $R$ and $P$, so the angles in increasing size are $Q$, $R$, $P$.'
          - problem: 'A surveyor measures a triangular plot $ABC$ with $AB = 9$ m and $BC = 12$ m. The side $CA$ is a whole number of metres, and the largest angle of the plot is at $B$. What is the greatest possible length of $CA$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The largest angle is opposite the longest side, so $CA$, the side opposite $B$, is longer than $12$ m. By the triangle inequality $CA$ is less than $9 + 12 = 21$ m, so the greatest whole number is $20$.'
          - problem: 'In a roof truss $ABC$, $\angle A = 38^\circ$ and $\angle B = 38^\circ$, and the rafter $AC$ is $5.2$ m long. How long is the rafter $BC$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '5.2'
            solution_sketch: 'Equal angles lie opposite equal sides. The side $BC$ is opposite $\angle A$ and $AC$ is opposite $\angle B$, and these angles are equal, so $BC = AC = 5.2$ m.'
          - problem: 'Triangle $ABC$ has a perimeter of $40$ cm, with $AB = 2x$ cm, $BC = (x + 9)$ cm and $CA = (3x - 5)$ cm. List its angles from smallest to largest.'
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            answer: 'C, B, A'
            solution_sketch: 'The perimeter gives $6x + 4 = 40$, so $x = 6$ and the sides are $AB = 12$, $BC = 15$ and $CA = 13$ cm. The sides $12$, $13$ and $15$ face the angles at $C$, $B$ and $A$, so the angles in increasing size are $C$, $B$, $A$.'
        constraints: 'distinct side lengths or angle measures; larger side faces larger angle; at most two named-answer items (largest angle, longest side), the others list angles in order, bound a side or use equal angles; contexts with plots, sails and roof trusses'
    diagnostic_exemplar:
      problem: 'Two sides of a triangle measure $8$ and $3$. List all possible integer lengths for the third side.'
      answer: '6, 7, 8, 9, or 10'
      answer_contract: {kind: none}
      solution_sketch: '$8 - 3 < x < 8 + 3$, so $5 < x < 11$.'
    anki_seeds:
      - front: "Triangle inequality: the sum of any two sides of a triangle must be..."
        back: "greater than the third side"
        type: basic
      - front: "Given two sides a and b, the third side x satisfies..."
        back: "|a - b| < x < a + b"
        type: basic
      - front: "In a triangle, the largest angle is opposite the..."
        back: "longest side"
        type: basic

  - id: triangle-inequality-applications
    name: Triangle Inequality Applications
    core: false
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-inequality-classification
        weight: 0.8
        key: true
      - id: linear-inequalities
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Count the integer possibilities
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'Two sides of a triangle measure $4$ cm and $11$ cm. How many whole-number lengths, in centimetres, are possible for the third side?'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The third side is longer than $11 - 4 = 7$ cm and shorter than $11 + 4 = 15$ cm. The whole numbers $8, 9, 10, 11, 12, 13, 14$ give $7$ possible lengths.'
          - problem: 'The rafters of a triangular roof frame measure $6$ m and $6$ m. The tie beam is cut to a whole number of metres. How many different tie-beam lengths are possible?'
            answer_contract: {"kind":"exact"}
            answer: '11'
            solution_sketch: 'The beam is longer than $6 - 6 = 0$ m and shorter than $6 + 6 = 12$ m. The whole numbers from $1$ to $11$ give $11$ lengths.'
          - problem: 'A surveyor fences a triangular plot with two sides of $3$ m and $8$ m. The third side is a whole number of metres. How many different lengths are possible?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The third side is longer than $8 - 3 = 5$ m and shorter than $8 + 3 = 11$ m. The whole numbers $6$, $7$, $8$, $9$ and $10$ give $5$ lengths.'
          - problem: 'A triangle has sides of $12$ cm and $20$ cm. The third side is a multiple of $4$ cm. What are its possible lengths, in centimetres?'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '12, 16, 20, 24, 28'
            solution_sketch: 'The third side is longer than $20 - 12 = 8$ cm and shorter than $20 + 12 = 32$ cm. The multiples of $4$ between $8$ and $32$ are $12$, $16$, $20$, $24$ and $28$.'
          - problem: 'A triangle has sides of $9$ cm, $14$ cm and $x$ cm, where $x$ is a whole number and no side is longer than $14$ cm. How many values of $x$ are possible?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The triangle inequality gives $14 - 9 = 5 < x < 14 + 9 = 23$. The extra condition $x \le 14$ leaves the whole numbers $6$ to $14$, which are $9$ values.'
          - problem: 'A boat sails $16$ km in a straight line from harbor $H$ to an island $I$, then $7$ km in a straight line from $I$ to a buoy $B$, and $H$, $I$ and $B$ do not lie on one straight line. The distance $HB$ is a whole number of kilometres. How many different values are possible for $HB$?'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'The distance $HB$ is greater than $16 - 7 = 9$ km and less than $16 + 7 = 23$ km. The whole numbers from $10$ to $22$ give $13$ values.'
        constraints: 'two sides given; count or list the whole-number third sides strictly between the difference and the sum; one list with a divisibility condition and one with an extra bound on the longest side; contexts with roof frames, plots and sea routes'
      - id: kp2
        name: Bound the perimeter
        key_prerequisites: [triangle-inequality-classification, linear-inequalities]
        exemplars:
          - problem: 'Two sides of a triangle measure $7$ cm and $9$ cm. Between what two values must the perimeter $p$, in centimetres, lie?'
            answer_contract: {"kind":"exact"}
            answer: '18 < p < 32'
            solution_sketch: 'The third side is longer than $9 - 7 = 2$ cm and shorter than $9 + 7 = 16$ cm. Adding the known sides, $7 + 9 = 16$, gives $18 < p < 32$.'
          - problem: 'Two sides of a triangle measure $5$ cm and $8$ cm. What is the greatest whole-number perimeter of the triangle, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '25'
            solution_sketch: 'The third side is shorter than $5 + 8 = 13$ cm, so its greatest whole-number length is $12$ cm. The perimeter is $5 + 8 + 12 = 25$ cm.'
          - problem: 'A triangular garden has two sides of $7$ m and $11$ m, and the third side is a whole number of metres. What is the least length of fence that can go around the garden, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '23'
            solution_sketch: 'The third side is longer than $11 - 7 = 4$ m, so its least whole-number length is $5$ m. The least perimeter is $7 + 11 + 5 = 23$ m.'
          - problem: 'Two sides of a triangle measure $8$ cm and $11$ cm. How many different whole-number perimeters are possible?'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'The third side is a whole number from $4$ to $18$, since it lies strictly between $11 - 8 = 3$ and $11 + 8 = 19$. Each of these $15$ values gives a different perimeter.'
          - problem: 'Two sides of a triangular paddock are fenced with $18$ m and $25$ m of fence. The third side is a whole number of metres. What is the least total length of fence that the paddock needs, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '51'
            solution_sketch: 'The third side is longer than $25 - 18 = 7$ m, so its least whole-number length is $8$ m. The total is $18 + 25 + 8 = 51$ m.'
          - problem: 'A triangular loop of cable has a perimeter of $40$ m, and each side is a whole number of metres. What is the greatest possible length of one side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '19'
            solution_sketch: 'A side must be shorter than the other two sides together, so it is shorter than half the perimeter, $40 \div 2 = 20$ m. The greatest whole number below $20$ is $19$, and the sides $19$, $10$ and $11$ form a triangle.'
        constraints: 'two sides given; the perimeter bounded as a double inequality or as a greatest, least or counted whole-number value; one item runs the other way, from the perimeter to the longest side; contexts with gardens, paddocks and cables'
      - id: kp3
        name: Feasible isosceles side sets
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'An isosceles triangle has a perimeter of $25$ cm and one side of $7$ cm. What are the possible lengths of its base, in centimetres?'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '7, 11'
            solution_sketch: 'If the $7$ cm side is a leg, the base is $25 - 2 \cdot 7 = 11$ cm, and $7 + 7 > 11$ holds. If the $7$ cm side is the base, each leg is $(25 - 7) \div 2 = 9$ cm, and $9 + 9 > 7$ holds, so the base is $7$ cm or $11$ cm.'
          - problem: 'An isosceles pennant has a perimeter of $30$ cm and one side of $5$ cm. How long is each of the other two sides, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12.5'
            solution_sketch: 'If the $5$ cm side were a leg, the base would be $30 - 10 = 20$ cm, but $5 + 5 < 20$ breaks the triangle inequality. So $5$ cm is the base, and each leg is $(30 - 5) \div 2 = 12.5$ cm.'
          - problem: 'A craftsman bends an $18$ cm wire into an isosceles triangle with one side of $9$ cm. How many different triangles can he make?'
            answer_contract: {"kind":"exact"}
            answer: '0'
            solution_sketch: 'If the $9$ cm side is a leg, the base is $18 - 18 = 0$ cm, which is no side at all. If $9$ cm is the base, each leg is $(18 - 9) \div 2 = 4.5$ cm, and $4.5 + 4.5 = 9$ is not greater than $9$, so no triangle closes and the answer is $0$.'
          - problem: 'Two sides of an isosceles triangle measure $12$ cm and $5$ cm. What is the perimeter of the triangle, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '29'
            solution_sketch: 'If the legs were $5$ cm and $5$ cm with base $12$ cm, then $5 + 5 = 10$ is less than $12$, which is impossible. So the legs are $12$ cm each, and the perimeter is $12 + 12 + 5 = 29$ cm.'
          - problem: 'An isosceles sail has a perimeter of $24$ m, and its two equal sides are each a whole number of metres long. What is the greatest possible length of an equal side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '11'
            solution_sketch: 'Each equal side $L$ gives a base of $24 - 2L$ m, and the base must be positive and shorter than $2L$. So $6 < L < 12$, and the greatest whole number is $11$, with sides $11$, $11$ and $2$.'
          - problem: 'An isosceles triangle has a perimeter of $20$ cm, and its sides are whole numbers of centimetres. How many different triangles are possible?'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'With equal sides $L$ the base is $20 - 2L$, and the triangle inequality needs $5 < L < 10$. The values $L = 6, 7, 8, 9$ give the triangles $6, 6, 8$; $7, 7, 6$; $8, 8, 4$ and $9, 9, 2$, so there are $4$.'
        constraints: 'isosceles triangles with a perimeter and one given side, tested in both cases, leg or base, against the triangle inequality; answers are a list, a length, a perimeter or a count that can be zero; contexts with pennants, wire and sails'
    diagnostic_exemplar:
      problem: 'An isosceles triangle has perimeter $24$ and one side of length $10$. Find all possible side sets.'
      answer: '$\{10, 10, 4\}$ and $\{7, 7, 10\}$'
      answer_contract: {kind: none}
      solution_sketch: 'Legs $10$: base $24 - 20 = 4$ (valid, $10 + 4 > 10$). Base $10$: legs $7$ each (valid, $7 + 7 > 10$). Both pass the triangle inequality.'
    anki_seeds:
      - front: "The perimeter of a triangle with known sides a, b and unknown third side lies strictly between..."
        back: "a + b + |a - b| and 2(a + b)"
        type: basic

  - id: rigid-motions-congruence
    name: Rigid Motions and Congruence
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: segment-angle-addition
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Identify rigid motions
        key_prerequisites: []
        exemplars:
          - problem: 'Is a dilation with scale factor $2$ a rigid motion?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a rigid motion", "true", "yes, it is"], ["no", "it is not", "it is not a rigid motion", "false", "no, it is not", "no it is not", "not a rigid motion"]]}
            solution_sketch: 'A rigid motion keeps all distances and angles. A dilation with scale factor $2$ doubles every distance, so it is not a rigid motion and the answer is no.'
          - problem: 'Which rigid motion takes each point $(x, y)$ of the plane to the point $(x, -y)$?'
            answer_contract: {"kind":"label","options":[["reflection","a reflection","reflection in the x-axis","reflection across the x-axis","flip"],["translation","a translation","slide"],["rotation","a rotation","turn"]]}
            answer: 'reflection'
            solution_sketch: 'The $x$-coordinate stays and the sign of the $y$-coordinate changes, so each point goes to its mirror image in the $x$-axis. That is a reflection.'
          - problem: 'A triangular steel plate has a perimeter of $1.8$ m. A conveyor belt slides the plate $5$ m along the belt without turning it. What is the perimeter of the plate after the move, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.8'
            solution_sketch: 'Sliding the plate is a translation, and a translation is a rigid motion, so every side keeps its length. The perimeter is still $1.8$ m.'
          - problem: 'Segment $AB$ is $6$ cm long. A dilation with scale factor $2$ maps it to segment $CD$, and a rotation then maps $CD$ to segment $EF$. How long is $EF$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The dilation doubles lengths, so $CD = 2 \cdot 6 = 12$ cm. The rotation is a rigid motion and keeps lengths, so $EF = 12$ cm.'
          - problem: 'A photocopier enlarges a drawing so that every length is multiplied by $1.5$. A corner of the drawing measures $40^\circ$. How large is that corner on the copy, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '40'
            solution_sketch: 'The enlargement is a dilation. A dilation multiplies lengths but keeps angle measures, so the corner still measures $40^\circ$.'
          - problem: 'Triangle $ABC$ has vertices $A(1, 1)$, $B(4, 1)$ and $C(1, 5)$. It is rotated $90^\circ$ about the origin and then reflected in the $y$-axis. What is the length of the image of side $BC$, in units?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'Both the rotation and the reflection are rigid motions, so the image of $BC$ has the same length as $BC$. That length is $\sqrt{(4 - 1)^2 + (1 - 5)^2} = \sqrt{25} = 5$ units.'
        constraints: 'the three rigid motions against the dilation; at most two naming items, the others use what a motion keeps (lengths, perimeters, angles, distances) in conveyor, photocopier and coordinate settings'
      - id: kp2
        name: Apply rigid motions to coordinates
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'The translation $(x, y) \mapsto (x + 3, y - 2)$ is applied to the point $(4, 5)$. What are the coordinates of its image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 3)'
            solution_sketch: 'The translation adds $3$ to the $x$-coordinate and subtracts $2$ from the $y$-coordinate. The image is $(4 + 3, 5 - 2) = (7, 3)$.'
          - problem: 'What are the coordinates of the image of the point $(3, -7)$ after a reflection in the $x$-axis?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 7)'
            solution_sketch: 'A reflection in the $x$-axis keeps the $x$-coordinate and changes the sign of the $y$-coordinate. The image of $(3, -7)$ is $(3, 7)$.'
          - problem: 'A designer flips a floor plan about the $y$-axis so that the plan faces the other way. A door is at $(-2, 5)$ on the original plan. What are its coordinates on the flipped plan?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 5)'
            solution_sketch: 'A reflection in the $y$-axis changes the sign of the $x$-coordinate and keeps the $y$-coordinate. The door moves from $(-2, 5)$ to $(2, 5)$.'
          - problem: 'A translation takes the point $(2, -1)$ to the point $(-3, 5)$. What are the coordinates of the image of $(0, 4)$ under the same translation?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-5, 10)'
            solution_sketch: 'The translation changes $x$ by $-3 - 2 = -5$ and $y$ by $5 - (-1) = 6$. So $(0, 4)$ goes to $(0 - 5, 4 + 6) = (-5, 10)$.'
          - problem: 'A rotation of $180^\circ$ about the origin is applied to the point $(6, -2)$. What are the coordinates of its image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-6, 2)'
            solution_sketch: 'A half turn about the origin changes the sign of both coordinates. The image of $(6, -2)$ is $(-6, 2)$.'
          - problem: 'A game piece at $(5, 2)$ on a board grid is reflected in the $x$-axis and then moved $4$ units left and $3$ units up. At what coordinates does it end?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, 1)'
            solution_sketch: 'The reflection takes $(5, 2)$ to $(5, -2)$. Moving $4$ units left and $3$ units up gives $(5 - 4, -2 + 3) = (1, 1)$.'
          - problem: 'A drone hovers at the point $(12, 30)$, measured in metres east and north of its base. It flies $8$ m west and $15$ m south. What are its new coordinates?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 15)'
            solution_sketch: 'Flying west subtracts from the east coordinate and flying south subtracts from the north coordinate. The new position is $(12 - 8, 30 - 15) = (4, 15)$.'
          - problem: 'The point $(3, 4)$ is rotated $90^\circ$ counterclockwise about the origin. What are the coordinates of its image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-4, 3)'
            solution_sketch: 'A quarter turn counterclockwise about the origin takes $(x, y)$ to $(-y, x)$. The image of $(3, 4)$ is $(-4, 3)$.'
        constraints: 'translations by integer vectors, reflections in either axis, half turns and quarter turns about the origin, and one composition of two motions; integer coordinates; contexts on plans, boards and drone positions'
      - id: kp3
        name: Congruence via rigid motions
        key_prerequisites: [segment-angle-addition, coordinate-plane]
        exemplars:
          - problem: 'A rotation maps triangle $ABC$ exactly onto triangle $DEF$, with $A$ to $D$, $B$ to $E$ and $C$ to $F$. If $\angle A$ measures $37^\circ$, how large is $\angle D$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '37'
            solution_sketch: 'A rotation is a rigid motion, so it preserves angle measures. Since $A$ maps to $D$, $\angle D$ measures $37^\circ$ as well.'
          - problem: 'A sheet-metal template in the shape of triangle $ABC$, with $AB = 9$ cm, is slid along a bench without turning it, and a pencil traces the new position as triangle $DEF$, with $A$ to $D$ and $B$ to $E$. How long is $DE$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'Sliding the template is a translation, which is a rigid motion and keeps lengths. So $DE = AB = 9$ cm.'
          - problem: 'A reflection maps triangle $ABC$ onto triangle $DEF$. Which property of a reflection guarantees that $DE = AB$: that it preserves distances, that it preserves orientation, or that it preserves position?'
            answer_contract: {"kind":"label","options":[["it preserves distances","distances","preserves distance","distance","distances are preserved","preserves lengths","lengths","it keeps distances"],["it preserves orientation","orientation","preserves orientation"],["it preserves position","position","preserves position"]]}
            answer: 'it preserves distances'
            solution_sketch: 'A reflection turns the triangle over and moves every point, so neither orientation nor position is preserved. A reflection preserves distances, so the image of $AB$ has the same length, and $DE = AB$.'
          - problem: 'Triangle $ABC$ has vertices $A(1, 1)$ and $B(5, 4)$. A reflection in the $y$-axis maps $A$ to $D$ and $B$ to $E$. How long is $DE$, in units?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'A reflection preserves distances, so $DE = AB$. The length is $AB = \sqrt{(5 - 1)^2 + (4 - 1)^2} = \sqrt{25} = 5$ units.'
          - problem: 'In triangle $ABC$, $\angle A = 48^\circ$ and $\angle B = 67^\circ$. A rigid motion maps triangle $ABC$ onto triangle $PQR$ with $A$ to $P$, $B$ to $Q$ and $C$ to $R$. How large is $\angle R$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'In triangle $ABC$ the third angle is $\angle C = 180 - 48 - 67 = 65^\circ$. The rigid motion preserves angles, so $\angle R = \angle C = 65^\circ$.'
          - problem: 'A triangular sail $ABC$ has sides $AB = 6$ m, $BC = 8$ m and $CA = 11$ m. After the boat turns, the sail occupies triangle $DEF$, the image of $ABC$ under a rotation. What is the perimeter of triangle $DEF$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '25'
            solution_sketch: 'The rotation preserves lengths, so $DEF$ has the sides $6$, $8$ and $11$ m. Its perimeter is $6 + 8 + 11 = 25$ m.'
          - problem: 'A triangle $ABC$ with sides of $3$ cm, $4$ cm and $5$ cm is mapped by a dilation with scale factor $2$ onto triangle $DEF$. Are triangles $ABC$ and $DEF$ congruent?'
            answer_contract: {"kind":"label","options":[["no","they are not congruent","not congruent","no, they are not congruent"],["yes","they are congruent","congruent","yes, they are congruent"]]}
            answer: 'no'
            solution_sketch: 'The dilation doubles the sides to $6$ cm, $8$ cm and $10$ cm. No rigid motion changes lengths, so no rigid motion maps $ABC$ onto $DEF$, and the triangles are not congruent.'
          - problem: 'A translation maps triangle $ABC$ onto triangle $DEF$, with $A$ to $D$ and $B$ to $E$. If $AB = (3x + 2)$ cm and $DE = (5x - 8)$ cm, how long is $AB$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '17'
            solution_sketch: 'A translation preserves lengths, so $3x + 2 = 5x - 8$, which gives $x = 5$. Then $AB = 3 \cdot 5 + 2 = 17$ cm.'
        constraints: 'a single rigid motion or a rigid motion given by a reflection; read off preserved lengths and angles, justify with the property that is used, and one dilation counter-case; unknown lengths from algebra and coordinates; contexts with templates and sails'
    diagnostic_exemplar:
      problem: 'A reflection across the $y$-axis maps $\triangle ABC$ onto $\triangle DEF$, with vertex $A(-6, 2)$ mapping to $D$. Give the coordinates of $D$, and state whether $\triangle ABC \cong \triangle DEF$ and why.'
      answer: 'D = (6, 2); yes, the triangles are congruent — a reflection is a rigid motion (it preserves distances and angles), and a rigid motion carrying one figure onto another is exactly what congruence means'
      answer_contract: {kind: none}
      solution_sketch: 'Reflection across the $y$-axis negates the $x$-coordinate; rigid motions preserve lengths and angle measures.'
    anki_seeds:
      - front: "The three rigid motions are..."
        back: "translations, reflections, and rotations"
        type: basic
      - front: "Two figures are congruent exactly when some ... maps one onto the other"
        back: "rigid motion (or composition of rigid motions)"
        type: basic

  - id: sss-sas-congruence
    name: SSS and SAS Congruence
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.6
        key: true
      - id: rigid-motions-congruence
        weight: 0.4
        key: false
      - id: triangle-inequality-classification
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize SSS
        key_prerequisites: [triangle-inequality-classification]
        exemplars:
          - problem: 'Triangle $ABC$ has sides $AB = 5$ cm, $BC = 7$ cm and $CA = 9$ cm. Triangle $DEF$ has sides $DE = 5$ cm, $EF = 7$ cm and $FD = 9$ cm. No angle of either triangle has been measured. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"]]}
            answer: 'SSS congruence'
            solution_sketch: 'The three pairs of corresponding sides are congruent: $AB$ and $DE$, $BC$ and $EF$, and $CA$ and $FD$. No angle is known, so the criterion that uses three pairs of sides applies, and that criterion is SSS.'
          - problem: 'Triangle $PQR$ has sides $PQ = 6$ cm, $QR = 8$ cm and $RP = 10$ cm, and its angle at $Q$ is a right angle. Triangle $STU$ has sides $ST = 8$ cm, $TU = 10$ cm and $US = 6$ cm. How large is angle $S$ of triangle $STU$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The sides of triangle $STU$ are the sides of triangle $PQR$ in a different order: $US = PQ = 6$, $ST = QR = 8$ and $TU = RP = 10$. The triangles are congruent by SSS, and the vertex between the $6$ cm and $8$ cm sides is $Q$ in the first triangle and $S$ in the second. So angle $S$ is $90^\circ$.'
          - problem: 'A workshop cuts two triangular steel plates. Plate 1 has edges of $12$ cm, $16$ cm and $20$ cm, and its area is $96$ cm$^2$. Plate 2 has edges of $16$ cm, $20$ cm and $12$ cm. What is the area of plate 2?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '96'
            solution_sketch: 'The three edge lengths of plate 2 are the three edge lengths of plate 1, so the plates are congruent by SSS. Congruent triangles have equal areas, so the area of plate 2 is $96$ cm$^2$.'
          - problem: 'A kite frame $ABCD$ is made of four rods with $AB = AD = 0.8$ m and $CB = CD = 1.5$ m. A brace $\overline{AC}$ joins two opposite corners of the frame, and the angle $\angle ABC$ measures $100^\circ$. How large is $\angle ADC$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '100'
            solution_sketch: 'The brace $\overline{AC}$ is a side of both triangle $ABC$ and triangle $ADC$. With $AB = AD$ and $CB = CD$, the triangles are congruent by SSS, and $\angle ADC$ matches $\angle ABC$. So $\angle ADC$ measures $100^\circ$.'
          - problem: 'Triangle $XYZ$ has sides $XY = 8$ cm, $YZ = 10$ cm and $ZX = 13$ cm. Triangle $PQR$ has sides $PQ = 8$ cm, $QR = 10$ cm and $RP = 12$ cm. Are the two triangles congruent?'
            answer_contract: {"kind":"label","options":[["no","no, they are not congruent","they are not congruent","not congruent","no, not congruent","no, the triangles are not congruent"],["yes","yes, they are congruent","they are congruent","congruent","yes, congruent","yes, the triangles are congruent"]]}
            answer: 'no'
            solution_sketch: 'Two pairs of sides match, but $ZX = 13$ cm and $RP = 12$ cm differ. All three pairs of sides must match for SSS, so the triangles are not congruent.'
          - problem: 'In a coordinate plane, triangle $ABC$ has vertices $A(0, 0)$, $B(5, 0)$ and $C(0, 5)$. Triangle $DEF$ has vertices $D(2, 1)$, $E(5, 5)$ and $F(-2, 4)$. How large is angle $EDF$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'In triangle $ABC$, $AB = AC = 5$ and $BC = 5\sqrt{2}$. In triangle $DEF$, $DE = \sqrt{3^2 + 4^2} = 5$, $DF = \sqrt{4^2 + 3^2} = 5$ and $EF = \sqrt{7^2 + 1^2} = 5\sqrt{2}$. The triangles are congruent by SSS with $D$ matching $A$, so angle $EDF$ is the right angle of $90^\circ$.'
          - problem: 'Write the full proof: in triangle $ABC$, $AB = AC$ and $D$ is the midpoint of $\overline{BC}$. Prove that $\triangle ABD \cong \triangle ACD$.'
            answer_contract: {"kind":"none"}
            answer: 'triangle ABD ≅ triangle ACD by SSS'
            solution_sketch: '1. $AB = AC$ (given). 2. $BD = DC$ ($D$ is the midpoint of $\overline{BC}$, by the definition of a midpoint). 3. $AD = AD$ (reflexive property: $\overline{AD}$ is a side of both triangles). 4. $\triangle ABD \cong \triangle ACD$ (SSS, because the three pairs of sides in steps 1 to 3 are congruent).'
        constraints: "three side pairs marked and no angle information given, or the sides listed in a different order; items ask for a matching angle, a shared measure or a verdict; at most two verdicts or criterion names; one written proof last"
      - id: kp2
        name: Recognize SAS and the included angle
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'In triangles $ABC$ and $XYZ$, sides $AB$ and $BC$ are congruent to sides $XY$ and $YZ$. Which angle of triangle $ABC$ must also be congruent to the matching angle of triangle $XYZ$ for SAS to prove the triangles congruent?'
            answer_contract: {"kind":"label","options":[["angle B","∠B","B","the angle at B","angle ABC","angle CBA","∠ABC"],["angle A","∠A","A","the angle at A","angle BAC","angle CAB","∠BAC"],["angle C","∠C","C","the angle at C","angle BCA","angle ACB","∠BCA"]]}
            answer: 'angle B'
            solution_sketch: 'SAS needs the angle between the two congruent sides. The sides $AB$ and $BC$ meet at $B$, so angle $B$ is the included angle and must be congruent to angle $Y$.'
          - problem: 'In triangles $ABC$ and $XYZ$, $AB = XY = 9$ cm, $BC = YZ = 7$ cm and $\angle A = \angle X = 40^\circ$. Does this information prove the triangles congruent? If it does, by which criterion?'
            answer_contract: {"kind":"label","options":[["not enough information","no","no criterion applies","it does not prove congruence","not enough","insufficient information","cannot be determined","no, not enough information"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"]]}
            answer: 'not enough information'
            solution_sketch: 'The marked angle $A$ is not between the sides $AB$ and $BC$, because $BC$ does not touch $A$. Two sides and an angle that is not between them do not prove congruence, since the side $BC = 7$ cm can swing to two different positions. So the information is not enough.'
          - problem: 'To find the width of a pond between two trees $A$ and $B$ on opposite shores, a surveyor picks a point $O$ on land from which both trees are visible. She extends $\overline{AO}$ beyond $O$ to a point $C$ with $OC = OA$, and extends $\overline{BO}$ beyond $O$ to a point $D$ with $OD = OB$. She measures $CD = 87$ m. How wide is the pond, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '87'
            solution_sketch: 'Triangles $AOB$ and $COD$ have $OA = OC$ and $OB = OD$. The angles $\angle AOB$ and $\angle COD$ are vertical angles, so they are congruent and lie between the congruent sides. By SAS the triangles are congruent, so $AB = CD = 87$ m.'
          - problem: 'In quadrilateral $ABCD$, the sides $\overline{AB}$ and $\overline{DC}$ are parallel and equal in length, and the diagonal $\overline{AC}$ is drawn. The angle $\angle BAC$ measures $35^\circ$ and the angle $\angle ABC$ measures $105^\circ$. How large is $\angle CDA$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '105'
            solution_sketch: 'Because $\overline{AB} \parallel \overline{DC}$, the alternate interior angles $\angle BAC$ and $\angle DCA$ are congruent. With $AB = CD$ and the shared side $AC$, triangles $ABC$ and $CDA$ are congruent by SAS. So $\angle CDA$ matches $\angle ABC$ and measures $105^\circ$.'
          - problem: 'A folding step-ladder has two legs $PQ$ and $PR$, each $2.4$ m long, hinged at the top $P$. When the ladder is opened so that $\angle QPR = 38^\circ$, the spreader bar $QR$ is $1.56$ m long. A second ladder has legs of $2.4$ m each and is opened to the same angle of $38^\circ$. How long is its spreader bar, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.56'
            solution_sketch: 'Both ladders form a triangle with two legs of $2.4$ m and the angle of $38^\circ$ between them. The triangles are congruent by SAS, so the spreader bars have the same length of $1.56$ m.'
          - problem: 'Triangle $ABC$ has $AB = 7$ cm, $BC = 9$ cm and $\angle B = 40^\circ$. In triangle $DEF$, $DE = 7$ cm and $\angle E = 40^\circ$. How long must $EF$ be for SAS to show that $\triangle DEF \cong \triangle ABC$?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'In triangle $ABC$ the angle $B$ lies between $AB$ and $BC$. In triangle $DEF$ the angle $E$ lies between $DE$ and $EF$, so $EF$ must match $BC$. Therefore $EF = 9$ cm.'
          - problem: 'In triangles $ABC$ and $DEF$, $AB = DE$, $AC = DF$ and $\angle A = \angle D$. Angle $B$ measures $62^\circ$ and angle $C$ measures $47^\circ$. How large is angle $F$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '47'
            solution_sketch: 'The angles $A$ and $D$ lie between the congruent sides, so the triangles are congruent by SAS. Angle $F$ matches angle $C$ and measures $47^\circ$.'
        constraints: "the included versus non-included angle is the point; two sides and one angle marked; items ask for the missing angle to mark, a measure carried over by SAS, or a verdict; at most two criterion names or verdicts"
      - id: kp3
        name: Solve for marked values under SSS or SAS
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: '$\triangle ABC \cong \triangle DEF$ by SAS, with $AB = 3x - 4$ and $DE = 2x + 3$. Find $AB$.'
            answer_contract: {"kind":"exact"}
            answer: '17'
            solution_sketch: 'The sides $AB$ and $DE$ correspond, so $3x - 4 = 2x + 3$ and $x = 7$. Then $AB = 3 \cdot 7 - 4 = 17$.'
          - problem: 'The included angles of two triangles congruent by SAS measure $(2x + 16)^\circ$ and $(4x - 8)^\circ$. How large is each of these angles?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '40'
            solution_sketch: 'The angles are congruent, so $2x + 16 = 4x - 8$ and $x = 12$. Each angle measures $2 \cdot 12 + 16 = 40^\circ$.'
          - problem: 'Triangle $ABC$ is congruent to triangle $DEF$ by SSS, with $\overline{AB}$ matching $\overline{DE}$ and $\overline{BC}$ matching $\overline{EF}$. The sides measure $AB = (5x - 2)$ cm, $DE = (3x + 8)$ cm, $BC = (4y - 3)$ cm, $EF = (2y + 7)$ cm and $CA = 12$ cm. What is the perimeter of triangle $ABC$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '52'
            solution_sketch: 'From $5x - 2 = 3x + 8$ we get $x = 5$ and $AB = 23$. From $4y - 3 = 2y + 7$ we get $y = 5$ and $BC = 17$. The perimeter is $23 + 17 + 12 = 52$ cm.'
          - problem: 'A workshop cuts two braces. Brace 1 has edges of $(4x - 3)$ cm, $(2x + 5)$ cm and $15$ cm. Brace 2 has edges of $(2x + 9)$ cm, $(3x - 1)$ cm and $15$ cm. The braces are congruent by SSS, with the first edges matching and the second edges matching. How long is the longest edge of brace 1, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The first edges give $4x - 3 = 2x + 9$, so $x = 6$. Brace 1 then has edges of $21$ cm, $17$ cm and $15$ cm, and the longest edge is $21$ cm. The second edges agree: $2x + 5 = 17 = 3x - 1$.'
          - problem: 'Two roof trusses are isosceles triangles, each with two equal rafters meeting at the apex. The trusses are congruent by SAS, and their apex angles measure $(5x - 7)^\circ$ and $(3x + 19)^\circ$. What angle does each rafter make with the horizontal tie beam?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '61'
            solution_sketch: 'The apex angles are congruent, so $5x - 7 = 3x + 19$ and $x = 13$, which gives an apex angle of $58^\circ$. The two base angles of an isosceles triangle are equal and share the remaining $180 - 58 = 122$ degrees, so each is $61^\circ$.'
          - problem: 'Triangles $ABC$ and $DEF$ are congruent by SAS, with $\angle A$ matching $\angle D$ and $\angle B$ matching $\angle E$. Angle $A$ measures $50^\circ$, $m\angle B = (2x + 10)^\circ$ and $m\angle E = (4x - 30)^\circ$. How large is angle $C$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '80'
            solution_sketch: 'The matching angles $B$ and $E$ are congruent, so $2x + 10 = 4x - 30$ and $x = 20$. Then $m\angle B = 50^\circ$. The angle sum gives $m\angle C = 180 - 50 - 50 = 80^\circ$.'
          - problem: 'Triangle $ABC$ is congruent to triangle $FDE$ by SSS, with $A$ matching $F$, $B$ matching $D$ and $C$ matching $E$. The sides measure $BC = (2x + 7)$ cm and $DE = (5x - 8)$ cm. How long is $BC$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '17'
            solution_sketch: 'Vertex $B$ matches $D$ and vertex $C$ matches $E$, so $BC$ matches $DE$. Then $2x + 7 = 5x - 8$ gives $x = 5$, and $BC = 2 \cdot 5 + 7 = 17$ cm.'
        constraints: "corresponding parts equal; linear expressions with integer solutions; some items need a second step (a perimeter, a base angle, an angle sum) or a correspondence that does not follow the letter order"
    diagnostic_exemplar:
