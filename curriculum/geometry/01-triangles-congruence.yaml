  - id: asa-aas-congruence
    name: ASA and AAS Congruence
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.7
        key: true
      - id: triangle-angle-sum
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize ASA and the included side
        key_prerequisites: [sss-sas-congruence]
        exemplars:
          - problem: 'In triangles $ABC$ and $DEF$, $\angle A \cong \angle D$, $\overline{AB} \cong \overline{DE}$ and $\angle B \cong \angle E$. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"]]}
            answer: 'ASA congruence'
            solution_sketch: 'The side $AB$ joins the vertices $A$ and $B$, which carry the two congruent angles. So the side lies between the angles, and two angles with the included side give the ASA criterion.'
          - problem: 'A surveyor wants the width of a river between a point $A$ on her bank and a post $P$ on the far bank. She walks along the bank, at right angles to $\overline{AP}$, from $A$ to $B$ and places a stake $M$ halfway, so that $AM = MB$. At $B$ she turns and walks away from the river, at right angles to $\overline{AB}$, until she reaches the point $C$ where $M$ and $P$ line up with her. She measures $BC = 38$ m. How wide is the river between $A$ and $P$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '38'
            solution_sketch: 'In triangles $AMP$ and $BMC$, the angles at $A$ and $B$ are right angles and $AM = MB$. The angles at $M$ are vertical angles, so they are congruent. The side $AM$ lies between the congruent angles, so the triangles are congruent by ASA, and $AP = BC = 38$ m.'
          - problem: 'In triangle $ABC$, $\angle A = 48^\circ$, $AB = 9$ cm and $\angle C = 65^\circ$. In triangle $DEF$, $\angle D = 48^\circ$, $DE = 9$ cm and $\angle E = 67^\circ$. How large is angle $F$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'In triangle $ABC$ the angle sum gives $\angle B = 180 - 48 - 65 = 67^\circ$. Then both triangles have the angles $48^\circ$ and $67^\circ$ at the ends of a $9$ cm side, so they are congruent by ASA. Angle $F$ matches angle $C$ and measures $65^\circ$.'
          - problem: 'Two triangular gusset plates are cut for a shelf frame. Plate 1 has a $14$ cm edge $AB$ with angles of $30^\circ$ at $A$ and $60^\circ$ at $B$, and its edge opposite the $30^\circ$ angle is $7$ cm long. Plate 2 has a $14$ cm edge $PQ$ with angles of $30^\circ$ at $P$ and $60^\circ$ at $Q$. How long is the edge of plate 2 opposite its $30^\circ$ angle?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '7'
            solution_sketch: 'In both plates the $14$ cm edge lies between the angles of $30^\circ$ and $60^\circ$, so the plates are congruent by ASA. The edge opposite the $30^\circ$ angle in plate 2 matches the $7$ cm edge of plate 1, so it is $7$ cm long.'
          - problem: 'A garden trellis frame is a parallelogram $ABCD$ with a diagonal brace $\overline{AC}$. Side $AB$ is $0.9$ m long and side $AD$ is $1.2$ m long. How long is side $CD$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '0.9'
            solution_sketch: 'Because $\overline{AB} \parallel \overline{DC}$ and $\overline{AD} \parallel \overline{BC}$, the alternate interior angles at $A$ and $C$ are congruent in pairs. The brace $AC$ lies between those angles in both triangles, so $\triangle ABC \cong \triangle CDA$ by ASA. Then $CD = AB = 0.9$ m.'
          - problem: 'In triangles $ABC$ and $DEF$, $\angle A \cong \angle D$, $\angle B \cong \angle E$ and $\overline{AC} \cong \overline{DF}$. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"]]}
            answer: 'AAS congruence'
            solution_sketch: 'The side $AC$ touches the vertex $A$ but not the vertex $B$, so it does not lie between the two congruent angles. Two angles with a side that is not between them give the AAS criterion.'
          - problem: 'Triangle $ABC$ has $\angle A = 55^\circ$, $AB = 12$ cm and $\angle B = 72^\circ$. In triangle $DEF$, $\angle D = 55^\circ$ and $DE = 12$ cm. How large must angle $E$ be for ASA to prove that $\triangle DEF \cong \triangle ABC$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '72'
            solution_sketch: 'In triangle $ABC$ the side $AB$ lies between the angles $A$ and $B$. In triangle $DEF$ the side $DE$ lies between the angles $D$ and $E$, so angle $E$ must match angle $B$. Therefore $\angle E = 72^\circ$.'
        constraints: "the side lies between the two marked angles; items ask for a matching measure, a length carried over by ASA, or a criterion name; at most two criterion names"
      - id: kp2
        name: Recognize AAS
        key_prerequisites: [sss-sas-congruence, triangle-angle-sum]
        exemplars:
          - problem: 'In triangles $PQR$ and $XYZ$, $\angle P \cong \angle X$, $\angle Q \cong \angle Y$ and $\overline{QR} \cong \overline{YZ}$. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"]]}
            answer: 'AAS congruence'
            solution_sketch: 'The side $QR$ touches the vertex $Q$ but not the vertex $P$. It does not lie between the two congruent angles, so two angles with a side that is not between them give the AAS criterion.'
          - problem: 'Two roof gables are right triangles. Gable 1 has a right angle at $B$, an angle of $30^\circ$ at $A$, a sloping side $AC$ of $9$ m and a vertical post $BC$ of $4.5$ m. Gable 2 has a right angle at $E$, an angle of $30^\circ$ at $D$ and a sloping side $DF$ of $9$ m. How long is its vertical post $EF$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4.5'
            solution_sketch: 'The gables have right angles and angles of $30^\circ$ at $A$ and $D$. The sloping sides $AC$ and $DF$ are congruent and are not between the two known angles, so the gables are congruent by AAS. The post $EF$ matches the post $BC$, so it is $4.5$ m long.'
          - problem: 'In a roof truss, the horizontal chords $\overline{AB}$ and $\overline{CD}$ are parallel. The web members $\overline{AD}$ and $\overline{BC}$ cross at $O$, with $A$ and $C$ at the left ends and $B$ and $D$ at the right ends of the chords, and $O$ is the midpoint of $\overline{BC}$. The distance $AO$ is $2.7$ m. How long is $OD$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '2.7'
            solution_sketch: 'Because $\overline{AB} \parallel \overline{CD}$, the alternate interior angles $\angle OAB$ and $\angle ODC$ are congruent. The angles $\angle AOB$ and $\angle DOC$ are vertical angles, so they are congruent. The side $OB = OC$ touches $O$ but not $A$, so it is not between the two congruent angles, and triangles $AOB$ and $DOC$ are congruent by AAS. Then $OD = OA = 2.7$ m.'
          - problem: 'In triangles $ABC$ and $DEF$, $\angle B \cong \angle E$, $\angle C \cong \angle F$ and $\overline{BC} \cong \overline{EF}$. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"]]}
            answer: 'ASA congruence'
            solution_sketch: 'The side $BC$ joins the vertices $B$ and $C$, which carry the two congruent angles. So the side lies between the angles, and the criterion is ASA, not AAS.'
          - problem: 'Triangle $ABC$ has $\angle A = 63^\circ$, $\angle B = 44^\circ$ and $BC = 11.4$ cm. In triangle $DEF$, $\angle D = 63^\circ$ and $\angle E = 44^\circ$. How long must $EF$ be for AAS to show that $\triangle DEF \cong \triangle ABC$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '11.4'
            solution_sketch: 'In triangle $ABC$ the side $BC$ is opposite the angle $A$ and is not between the angles $A$ and $B$. In triangle $DEF$ the side $EF$ is opposite the angle $D$, so it must match $BC$. Therefore $EF = 11.4$ cm.'
          - problem: 'A glazier cuts two triangular window panes. In pane $ABC$, $\angle A = 52^\circ$ and $\angle B = 61^\circ$. In pane $DEF$, $\angle D = 52^\circ$ and $\angle F = 67^\circ$. The edges $\overline{BC}$ and $\overline{EF}$ are both $70$ cm long. How large is angle $E$ of pane $DEF$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '61'
            solution_sketch: 'In pane $ABC$ the angle sum gives $\angle C = 180 - 52 - 61 = 67^\circ$. Then $\angle A \cong \angle D$, $\angle C \cong \angle F$ and $BC \cong EF$, and $BC$ is not between $A$ and $C$, so the panes are congruent by AAS. Angle $E$ matches angle $B$ and measures $61^\circ$.'
        constraints: "the side does not lie between the two marked angles; items ask for a length or an angle carried over by AAS, or a criterion name that tells ASA from AAS; at most two criterion names"
      - id: kp3
        name: Why AAS works
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'In triangle $ABC$, $\angle A = 52^\circ$ and $\angle B = 61^\circ$. In triangle $DEF$, $\angle D = 52^\circ$ and $\angle E = 61^\circ$. How large is angle $F$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '67'
            solution_sketch: 'In triangle $DEF$ the angle sum gives $\angle F = 180 - 52 - 61 = 67^\circ$. Triangle $ABC$ has the same two angles, so its third angle $C$ is also $67^\circ$ and the third angles are congruent.'
          - problem: 'Two angles of triangle $ABC$ are congruent to two angles of triangle $DEF$. Which theorem guarantees that the third angles are congruent too?'
            answer_contract: {"kind":"label","options":[["triangle angle sum theorem","angle sum theorem","triangle sum theorem","third angle theorem","the angles of a triangle add up to 180","triangle angle sum","the triangle angle sum theorem","angle sum"],["vertical angles theorem","vertical angles","vertical angles are congruent"],["alternate interior angles theorem","alternate interior angles","alternate interior angles are congruent"],["isosceles triangle theorem","base angles theorem","base angles of an isosceles triangle"]]}
            answer: 'triangle angle sum theorem'
            solution_sketch: 'In each triangle the three angles add up to $180^\circ$. Subtracting the same two angle measures from $180^\circ$ leaves the same third angle measure, so the triangle angle sum theorem makes the third angles congruent.'
          - problem: 'In triangles $ABC$ and $DEF$, $\angle A \cong \angle D$, $\angle B \cong \angle E$ and $\overline{BC} \cong \overline{EF}$. Once the third angles are known to be congruent, the AAS case becomes a case of which other criterion?'
            answer_contract: {"kind":"label","options":[["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["HL congruence","HL","hypotenuse-leg","the HL criterion","by HL","HL criterion","hypotenuse leg","HL theorem"]]}
            answer: 'ASA congruence'
            solution_sketch: 'Once $\angle C \cong \angle F$ is known, the side $BC$ lies between the congruent angles $B$ and $C$, and $EF$ lies between $E$ and $F$. Two angles with the included side is the ASA criterion.'
          - problem: 'In triangles $ABC$ and $DEF$, $\angle A \cong \angle D$, $\angle B \cong \angle E$ and $\overline{BC} \cong \overline{EF}$. Also $m\angle A = (3x + 5)^\circ$, $m\angle D = (5x - 25)^\circ$ and $m\angle E = 60^\circ$. How large is angle $C$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The congruent angles give $3x + 5 = 5x - 25$, so $x = 15$ and $m\angle A = 50^\circ$. Since $\angle B \cong \angle E$, $m\angle B = 60^\circ$. The angle sum gives $m\angle C = 180 - 50 - 60 = 70^\circ$.'
          - problem: 'Two triangular pennants hang on a string. The first has corner angles of $55^\circ$ and $65^\circ$ at the two ends of its top edge. The second has the same two angles at the ends of its own top edge, which is as long as the first. How large is the lower corner of the second pennant?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The top edge lies between the two known angles in both pennants, so the pennants are congruent by ASA. The lower corner is $180 - 55 - 65 = 60^\circ$ in each pennant.'
          - problem: 'A kite maker cuts two triangular sails. In sail $ABC$, $\angle A = 34^\circ$ and $\angle B = 88^\circ$. In sail $DEF$, $\angle D = 34^\circ$ and $\angle F = 58^\circ$. The edges $\overline{BC}$ and $\overline{EF}$ are congruent. How large is angle $E$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '88'
            solution_sketch: 'In sail $ABC$ the angle sum gives $\angle C = 180 - 34 - 88 = 58^\circ$, so $\angle C \cong \angle F$. The congruent edges $BC$ and $EF$ then lie between congruent angles, so the sails are congruent and $\angle E = \angle B = 88^\circ$.'
          - problem: 'Write the full proof that triangle $ABC$ is congruent to triangle $DEF$, given $\angle A \cong \angle D$, $\angle B \cong \angle E$ and $\overline{BC} \cong \overline{EF}$.'
            answer_contract: {"kind":"none"}
            answer: 'triangle ABC ≅ triangle DEF by AAS'
            solution_sketch: '1. $\angle A \cong \angle D$ and $\angle B \cong \angle E$ (given). 2. $m\angle C = 180^\circ - m\angle A - m\angle B$ and $m\angle F = 180^\circ - m\angle D - m\angle E$ (triangle angle sum theorem). 3. $\angle C \cong \angle F$ (substitution: the same measures are subtracted from $180^\circ$). 4. $\overline{BC} \cong \overline{EF}$ (given). 5. $\overline{BC}$ lies between $\angle B$ and $\angle C$, and $\overline{EF}$ lies between $\angle E$ and $\angle F$ (definition of an included side). 6. $\triangle ABC \cong \triangle DEF$ (ASA, from steps 1, 3, 4 and 5; this is the AAS criterion).'
        constraints: "third-angle theorem reasoning; angle pairs summing under 180; one theorem name and one criterion name; one written proof last"
    diagnostic_exemplar:
      problem: 'In $\triangle ABC$ and $\triangle DEF$: $\angle A \cong \angle D$, $\angle B \cong \angle E$, and $\overline{BC} \cong \overline{EF}$. State the congruence criterion, and explain why the triangles are congruent even though the congruent sides are not between the marked angles.'
      answer: 'AAS; the third angles are congruent too (each is 180° minus the other two), so the given side becomes an included side and ASA applies'
      answer_contract: {kind: none}
      solution_sketch: 'Third-angle theorem: $\angle C \cong \angle F$, and $\overline{BC}$ lies between $\angle B$ and $\angle C$.'
    anki_seeds:
      - front: "ASA vs AAS: in ASA the congruent side is ... the two angles"
        back: "included between"
        type: basic
      - front: "AAS reduces to ASA because of the..."
        back: "third-angle theorem (triangle angle sum)"
        type: basic

  - id: hl-congruence
    name: Hypotenuse-Leg Congruence
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Recognize HL
        key_prerequisites: [sss-sas-congruence]
        try_first:
          problem: 'A right triangle has a hypotenuse of $13$ cm and one leg of $5$ cm. A second right triangle also has a hypotenuse of $13$ cm and a leg of $5$ cm. How long is the other leg of the second triangle, in centimetres?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'The Pythagorean theorem gives $\sqrt{13^2 - 5^2} = \sqrt{144} = 12$ cm for the second triangle, and the same calculation gives $12$ cm for the first. So a hypotenuse and one leg fix the third side in a right triangle, and the two triangles have the same three sides. This is why the HL criterion is valid for right triangles although SSA is not valid in general.'
        exemplars:
          - problem: 'Right triangle $ABC$ has its right angle at $B$, and right triangle $DEF$ has its right angle at $E$. Also $\overline{AC} \cong \overline{DF}$ and $\overline{AB} \cong \overline{DE}$. Which criterion shows that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["HL congruence","HL","hypotenuse-leg","the HL criterion","by HL","HL criterion","hypotenuse leg","HL theorem"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"]]}
            answer: 'HL congruence'
            solution_sketch: 'The sides $AC$ and $DF$ lie opposite the right angles, so they are the hypotenuses. The sides $AB$ and $DE$ are legs. A congruent hypotenuse and a congruent leg in two right triangles give the HL criterion.'
          - problem: 'Right triangles $PQR$ and $XYZ$ have their right angles at $Q$ and $Y$. The hypotenuses are $PR = XZ = 17$ cm and the legs are $PQ = XY = 8$ cm. How long is $YZ$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The triangles are congruent by HL, so $YZ = QR$. By the Pythagorean theorem $QR = \sqrt{17^2 - 8^2} = \sqrt{225} = 15$ cm, so $YZ = 15$ cm.'
          - problem: 'Two ladders, each $5.0$ m long, lean against a vertical wall on level ground. The first ladder reaches $4.8$ m up the wall and its foot is $1.4$ m from the wall. The second ladder reaches the same height on the wall. How far is the foot of the second ladder from the wall, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.4'
            solution_sketch: 'Each ladder, the wall and the ground form a right triangle, and the ladder is the hypotenuse. The ladders have equal hypotenuses of $5.0$ m and share the leg of $4.8$ m, so the triangles are congruent by HL. The second foot is $1.4$ m from the wall.'
          - problem: 'Triangle $ABC$ has a right angle at $C$, with $AB = 13$ cm and $BC = 5$ cm. Triangle $DEF$ has a right angle at $E$, with $DE = 13$ cm and $EF = 5$ cm. Are the triangles congruent?'
            answer_contract: {"kind":"label","options":[["no","no, they are not congruent","they are not congruent","not congruent","no, not congruent","no, the triangles are not congruent"],["yes","yes, they are congruent","they are congruent","congruent","yes, congruent","yes, the triangles are congruent"]]}
            answer: 'no'
            solution_sketch: 'In triangle $ABC$ the side $AB = 13$ cm is the hypotenuse, since it lies opposite the right angle at $C$. In triangle $DEF$ the right angle is at $E$, so $DE = 13$ cm is a leg and the hypotenuse is longer than $13$ cm. A hypotenuse cannot match a leg, so the triangles are not congruent.'
          - problem: 'Right triangles $ABC$ and $PQR$ have right angles at $C$ and $R$. Their hypotenuses are $AB = PQ = 26$ cm and their legs are $AC = PR = 10$ cm. What is the perimeter of triangle $PQR$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The triangles are congruent by HL, so the other leg is $QR = \sqrt{26^2 - 10^2} = \sqrt{576} = 24$ cm. The perimeter of triangle $PQR$ is $26 + 10 + 24 = 60$ cm.'
          - problem: 'A vertical mast stands on level ground. Two guy wires, each $20$ m long, run from the top of the mast to anchors on opposite sides of the mast. The east anchor is $12$ m from the foot of the mast. How far from the foot of the mast is the west anchor, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The mast is a leg shared by the two right triangles, and the wires are congruent hypotenuses of $20$ m. The triangles are congruent by HL, so the west anchor is also $12$ m from the foot of the mast.'
          - problem: 'Write the full proof: in triangle $ABC$, $AB = AC$ and $\overline{AD}$ is perpendicular to $\overline{BC}$ at $D$. Prove that $D$ is the midpoint of $\overline{BC}$.'
            answer_contract: {"kind":"none"}
            answer: 'BD = DC, so D is the midpoint of BC'
            solution_sketch: '1. $\overline{AD} \perp \overline{BC}$, so $\angle ADB$ and $\angle ADC$ are right angles, and $\triangle ABD$ and $\triangle ACD$ are right triangles (given and definition of perpendicular). 2. $AB = AC$ (given); these are the hypotenuses. 3. $AD = AD$ (reflexive property); this is a shared leg. 4. $\triangle ABD \cong \triangle ACD$ (HL, from steps 1 to 3). 5. $BD = DC$ (corresponding parts of congruent triangles). 6. $D$ is the midpoint of $\overline{BC}$ (definition of a midpoint).'
        constraints: "right triangles only; hypotenuse plus one leg marked; items name the criterion, find the third side, or decide congruence when the right angle sits at a different vertex; at most two criterion names or verdicts; one written proof last"
      - id: kp2
        name: Identify the hypotenuse
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'In right triangle $ABC$ the right angle is at $B$. Which side is the hypotenuse?'
            answer_contract: {"kind":"label","options":[["AC","side AC","segment AC","the side AC","CA","side CA"],["AB","side AB","segment AB","the side AB","BA","side BA"],["BC","side BC","segment BC","the side BC","CB","side CB"]]}
            answer: 'AC'
            solution_sketch: 'The hypotenuse lies opposite the right angle. The right angle is at $B$, and the side opposite vertex $B$ is $AC$.'
          - problem: 'A right triangle has legs of $5$ cm and $12$ cm. How long is its hypotenuse?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The squares of the legs add up to the square of the hypotenuse: $5^2 + 12^2 = 25 + 144 = 169$. The hypotenuse is $\sqrt{169} = 13$ cm.'
          - problem: 'A wheelchair ramp rises $0.9$ m over a horizontal run of $4.0$ m. How long is the sloping surface of the ramp, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4.1'
            solution_sketch: 'The rise and the run are the legs of a right triangle and the sloping surface is the hypotenuse. Its length is $\sqrt{0.9^2 + 4.0^2} = \sqrt{0.81 + 16} = \sqrt{16.81} = 4.1$ m.'
          - problem: 'A rectangular field is $24$ m long and $7$ m wide. How long is a path along its diagonal, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '25'
            solution_sketch: 'The diagonal is the hypotenuse of a right triangle with legs of $24$ m and $7$ m. Its length is $\sqrt{24^2 + 7^2} = \sqrt{576 + 49} = \sqrt{625} = 25$ m.'
          - problem: 'A $17$ m support cable runs from the top of a vertical pole to the ground $8$ m from the base of the pole. How tall is the pole, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The cable is the hypotenuse, because it lies opposite the right angle at the base of the pole. The pole is a leg, with height $\sqrt{17^2 - 8^2} = \sqrt{289 - 64} = \sqrt{225} = 15$ m.'
          - problem: 'In triangle $XYZ$ the angle at $Y$ is a right angle, $XY = 9$ cm and $XZ = 15$ cm. How long is $YZ$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'In triangle $XYZ$ the hypotenuse is $XZ = 15$ cm, because it lies opposite the right angle at $Y$. Then $YZ = \sqrt{15^2 - 9^2} = \sqrt{144} = 12$ cm.'
          - problem: 'In triangle $ABC$, $AB = 12$ m, $BC = 35$ m and $CA = 37$ m. How large is angle $B$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The longest side $CA = 37$ m would be the hypotenuse. Since $12^2 + 35^2 = 144 + 1225 = 1369 = 37^2$, the converse of the Pythagorean theorem gives a right angle opposite $CA$, which is angle $B$. So angle $B$ is $90^\circ$.'
        constraints: "Pythagorean triples and one decimal triple only; the right angle is named by its vertex or implied by a context; items ask for the hypotenuse, a leg, or the right angle"
      - id: kp3
        name: HL with variables
        key_prerequisites: [sss-sas-congruence]
        exemplars:
          - problem: 'Two right triangles are congruent by HL. Their hypotenuses measure $(5x - 3)$ cm and $(3x + 11)$ cm. How long is each hypotenuse, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '32'
            solution_sketch: 'The hypotenuses correspond, so $5x - 3 = 3x + 11$ and $x = 7$. Each hypotenuse is $5 \cdot 7 - 3 = 32$ cm.'
          - problem: 'Two right triangles are congruent by HL. A leg of the first measures $(2x + 7)$ cm and the matching leg of the second measures $(4x - 9)$ cm. How long are these legs, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '23'
            solution_sketch: 'The matching legs are equal, so $2x + 7 = 4x - 9$ and $x = 8$. Each leg is $2 \cdot 8 + 7 = 23$ cm.'
          - problem: 'Right triangles $ABC$ and $DEF$ are congruent by HL. Their hypotenuses measure $(2x + 3)$ cm and $(4x - 7)$ cm, and one leg of triangle $ABC$ is $5$ cm long. How long is the other leg of triangle $DEF$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The hypotenuses are equal, so $2x + 3 = 4x - 7$ and $x = 5$, which gives a hypotenuse of $13$ cm. The other leg is $\sqrt{13^2 - 5^2} = \sqrt{144} = 12$ cm in triangle $ABC$ and so in triangle $DEF$.'
          - problem: 'A carpenter cuts two identical right-angled corner braces, which are congruent by HL. The hypotenuses measure $(7x - 6)$ cm and $(5x + 8)$ cm. How long is the hypotenuse of each brace, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '43'
            solution_sketch: 'The hypotenuses are equal, so $7x - 6 = 5x + 8$ and $x = 7$. Each hypotenuse is $7 \cdot 7 - 6 = 43$ cm.'
          - problem: 'Right triangles $ABC$ and $DEF$ are congruent by HL, with right angles at $C$ and $F$ and with $A$ matching $D$. Angle $A$ measures $(4x + 6)^\circ$ and angle $D$ measures $(6x - 14)^\circ$. How large is angle $B$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '44'
            solution_sketch: 'The matching angles are congruent, so $4x + 6 = 6x - 14$ and $x = 10$, which gives $m\angle A = 46^\circ$. The acute angles of a right triangle add up to $90^\circ$, so $m\angle B = 90 - 46 = 44^\circ$.'
          - problem: 'Two steel gusset plates are right triangles $ABC$ (right angle at $C$) and $DEF$ (right angle at $F$), congruent by HL with $A$ matching $D$. The hypotenuses are $AB = (2x + 3)$ cm and $DE = (4x - 7)$ cm, and the legs are $AC = (3y - 1)$ cm and $DF = (y + 3)$ cm. What is the perimeter of plate $ABC$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '30'
            solution_sketch: 'The hypotenuses give $2x + 3 = 4x - 7$, so $x = 5$ and $AB = 13$ cm. The legs give $3y - 1 = y + 3$, so $y = 2$ and $AC = 5$ cm. Then $BC = \sqrt{13^2 - 5^2} = 12$ cm, and the perimeter is $13 + 5 + 12 = 30$ cm.'
          - problem: 'Triangle $ABC$ (right angle at $B$) and triangle $DEF$ (right angle at $D$) are congruent by HL, with $B$ matching $D$. The sides measure $AC = (3x + 5)$ cm and $EF = (5x - 9)$ cm. How long is $AC$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The side $AC$ lies opposite the right angle at $B$ and the side $EF$ lies opposite the right angle at $D$, so they are the matching hypotenuses. Then $3x + 5 = 5x - 9$ gives $x = 7$, and $AC = 3 \cdot 7 + 5 = 26$ cm.'
        constraints: "corresponding parts equal; linear expressions with integer solutions; some items need a second step (a leg from the Pythagorean theorem, an acute angle, a perimeter) or a correspondence that does not follow the letter order"
    diagnostic_exemplar:
      problem: 'In right triangles $\triangle ABC$ (right angle at $C$) and $\triangle DEF$ (right angle at $F$), $\overline{AB} \cong \overline{DE}$ and $\overline{BC} \cong \overline{EF}$, with $AB = 5x - 3$ and $DE = 3x + 11$. Name the congruence criterion and find $AB$.'
      answer: 'HL; AB = 32'
      answer_contract: {kind: none}
      solution_sketch: '$\overline{AB}$ and $\overline{DE}$ are the hypotenuses (opposite the right angles) and $\overline{BC}$, $\overline{EF}$ are corresponding legs, so HL applies; $5x - 3 = 3x + 11$ gives $x = 7$ and $AB = 32$.'
    anki_seeds:
      - front: "HL congruence applies only to ... triangles"
        back: "right"
        type: basic
      - front: "HL requires congruent hypotenuses and..."
        back: "one pair of congruent corresponding legs"
        type: basic

  - id: triangle-congruence-criteria
    name: Triangle Congruence Criteria
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: proof
    expected_time_secs: 150
    prerequisites:
      - id: sss-sas-congruence
        weight: 0.7
        key: true
      - id: asa-aas-congruence
        weight: 0.7
        key: true
      - id: hl-congruence
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Choose the criterion from marked information
        key_prerequisites: [sss-sas-congruence, asa-aas-congruence, hl-congruence]
        exemplars:
          - problem: 'In rhombus $ABCD$ the four sides are congruent, and the diagonal $\overline{AC}$ is drawn. Which criterion proves that $\triangle ABC \cong \triangle ADC$?'
            answer_contract: {"kind":"label","options":[["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"],["HL congruence","HL","hypotenuse-leg","the HL criterion","by HL","HL criterion","hypotenuse leg","HL theorem"]]}
            answer: 'SSS congruence'
            solution_sketch: 'The sides $AB$ and $AD$ are congruent, and so are $BC$ and $DC$. The diagonal $AC$ is a side of both triangles, so $AC \cong AC$ by the reflexive property. Three pairs of congruent sides give the SSS criterion.'
          - problem: 'In quadrilateral $ABCD$, the sides $\overline{AB}$ and $\overline{DC}$ are parallel and congruent, and the diagonal $\overline{AC}$ is drawn. Which criterion proves that $\triangle ABC \cong \triangle CDA$?'
            answer_contract: {"kind":"label","options":[["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"],["HL congruence","HL","hypotenuse-leg","the HL criterion","by HL","HL criterion","hypotenuse leg","HL theorem"]]}
            answer: 'SAS congruence'
            solution_sketch: 'The sides $AB$ and $CD$ are congruent (given). The alternate interior angles $\angle BAC$ and $\angle DCA$ are congruent because the sides $AB$ and $DC$ are parallel. The diagonal $AC$ is shared, so two sides and the angle between them are congruent, and the criterion is SAS.'
          - problem: 'In triangle $ABC$, $AB = AC = 13$ cm. The altitude $\overline{AD}$ is drawn to $\overline{BC}$. Which criterion proves that $\triangle ABD \cong \triangle ACD$?'
            answer_contract: {"kind":"label","options":[["HL congruence","HL","hypotenuse-leg","the HL criterion","by HL","HL criterion","hypotenuse leg","HL theorem"],["SSS congruence","SSS","side-side-side","the SSS criterion","by SSS","SSS criterion","side side side","SSS postulate"],["SAS congruence","SAS","side-angle-side","the SAS criterion","by SAS","SAS criterion","side angle side","SAS postulate"],["ASA congruence","ASA","angle-side-angle","the ASA criterion","by ASA","ASA criterion","angle side angle","ASA postulate"],["AAS congruence","AAS","angle-angle-side","the AAS criterion","by AAS","AAS criterion","angle angle side","AAS postulate"]]}
            answer: 'HL congruence'
            solution_sketch: 'The altitude is perpendicular to $BC$, so $\triangle ABD$ and $\triangle ACD$ are right triangles. Their hypotenuses $AB$ and $AC$ are congruent, and they share the leg $AD$. A congruent hypotenuse and a congruent leg give the HL criterion.'
          - problem: 'In a bridge truss, the vertical post $\overline{BD}$ stands on the bottom chord $\overline{AC}$ at a right angle. The diagonals $\overline{BA}$ and $\overline{BC}$ make equal angles of $41^\circ$ with the chord, and the chord $AC$ is $18.4$ m long. How long is $\overline{AD}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '9.2'
            solution_sketch: 'In triangles $ABD$ and $CBD$, $\angle BAD \cong \angle BCD$ ($41^\circ$ each) and $\angle BDA \cong \angle BDC$ (right angles). The post $BD$ is a shared side that is not between those two angles, so the triangles are congruent by AAS. Then $AD = DC$, and $AD = 18.4 \div 2 = 9.2$ m.'
          - problem: 'Two beams $\overline{AB}$ and $\overline{CD}$ of a lifting frame pivot about their common midpoint $O$. The upper ends $A$ and $C$ are $7.2$ m apart. How far apart are the lower ends $B$ and $D$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '7.2'
            solution_sketch: 'Because $O$ is the midpoint of both beams, $AO = BO$ and $CO = DO$. The angles $\angle AOC$ and $\angle BOD$ are vertical angles, so they are congruent. By SAS, $\triangle AOC \cong \triangle BOD$, and $BD = AC = 7.2$ m.'
          - problem: 'In triangles $ABC$ and $DEF$, $\angle B \cong \angle E$, $\angle C \cong \angle F$ and $\overline{BC} \cong \overline{EF}$. Side $AC$ is $11.5$ cm long. How long is side $DF$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '11.5'
            solution_sketch: 'The side $BC$ lies between the congruent angles $B$ and $C$, and $EF$ lies between $E$ and $F$, so the triangles are congruent by ASA. The side $DF$ matches $AC$, so $DF = 11.5$ cm.'
          - problem: 'In the roof trusses $ABC$ and $DEF$, $AB = DE = 3$ m, $BC = EF = 4$ m and $AC = DF = 5$ m. The angle $\angle C$ measures $37^\circ$. How large is $\angle F$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '37'
            solution_sketch: 'All three pairs of sides are congruent, so $\triangle ABC \cong \triangle DEF$ by the SSS criterion. The corresponding angles $\angle C$ and $\angle F$ are congruent, so $\angle F$ measures $37^\circ$.'
          - problem: 'Write the full proof: in quadrilateral $ABCD$, $AB = CD$ and $BC = DA$. Prove that $\angle B \cong \angle D$.'
            answer_contract: {"kind":"none"}
            answer: 'angle B ≅ angle D'
            solution_sketch: '1. Draw the diagonal $\overline{AC}$. 2. $AB = CD$ and $BC = DA$ (given). 3. $AC = CA$ (reflexive property: the diagonal is a side of both triangles). 4. $\triangle ABC \cong \triangle CDA$ (SSS, from steps 2 and 3). 5. $\angle B \cong \angle D$ (corresponding parts of congruent triangles are congruent, since $B$ matches $D$).'
        constraints: "criteria drawn from SSS, SAS, ASA, AAS and HL; each item needs one deduction first (a shared side, vertical angles, alternate interior angles or a right angle) before the criterion is used; at most three criterion names, and one written proof last"
      - id: kp2
        name: Recognize non-criteria
        key_prerequisites: [asa-aas-congruence]
        exemplars:
          - problem: 'Two triangles have all three pairs of corresponding angles congruent. What is certainly true of the two triangles?'
            answer_contract: {"kind":"label","options":[["similar","they are similar","similar triangles"],["congruent","they are congruent","congruent triangles"],["equal in area","they have equal areas","same area"]]}
            answer: 'similar'
            solution_sketch: 'Three pairs of congruent angles make the triangles similar, because one is an enlargement or a reduction of the other. The sides can still differ in length, so the triangles need not be congruent.'
          - problem: 'A small pennant is a triangle with sides of $3$ cm, $4$ cm and $5$ cm. A large pennant has the same three angles, and its longest side is $15$ cm. How long is the shortest side of the large pennant, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'Equal angles make the pennants similar, not congruent. The longest side grows from $5$ cm to $15$ cm, so every side is multiplied by $3$, and the shortest side is $3 \cdot 3 = 9$ cm.'
          - problem: 'Maria draws triangle $ABC$ with $AB = 8$ cm, $\angle A = 30^\circ$ and $BC = 5$ cm. A compass arc of radius $5$ cm centred at $B$ cuts the ray from $A$ at two points $C_1$ and $C_2$, and each point gives a triangle with the given data. How far apart are $C_1$ and $C_2$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The distance from $B$ to the ray is $8 \sin 30^\circ = 4$ cm. The chord of the arc cut by the ray has half-length $\sqrt{5^2 - 4^2} = 3$ cm, so $C_1C_2 = 6$ cm. The data fit two different triangles, so SSA does not prove congruence.'
          - problem: 'Triangles $ABC$ and $DEF$ have $AB = DE = 9$ cm, $BC = EF = 7$ cm and $\angle A = \angle D = 40^\circ$. Does this prove that the triangles are congruent?'
            answer_contract: {"kind":"label","options":[["no","no, it does not prove congruence","not necessarily","it does not prove it"],["yes","yes, the triangles are congruent","it proves congruence","they are congruent"]]}
            answer: 'no'
            solution_sketch: 'The angle $A$ is not between the sides $AB$ and $BC$, so this is the SSA pattern. Since $9 \sin 40^\circ \approx 5.8$ is less than $7$ and $7$ is less than $9$, two different triangles fit the data, and congruence is not proved.'
          - problem: 'A model of a triangular sail has sides of $12$ cm, $16$ cm and $20$ cm. The real sail has the same three angles as the model, and its shortest side is $3$ m. How long is the longest side of the real sail, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '5'
            solution_sketch: 'Equal angles make the sails similar. The shortest side grows from $12$ cm to $300$ cm, a factor of $25$, so the longest side is $20 \cdot 25 = 500$ cm, which is $5$ m.'
          - problem: 'A triangle has sides of $6$ cm, $8$ cm and $10$ cm. A second triangle has the same three angles and a perimeter of $60$ cm. How long is the shortest side of the second triangle, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'Equal angles make the triangles similar. The first perimeter is $24$ cm, so the scale factor is $60 \div 24 = 2.5$. The shortest side is $6 \cdot 2.5 = 15$ cm.'
        constraints: "AAA and SSA only; the reason matters more than the verdict; items use similar triangles, the two-position SSA construction, or a verdict; at most two verdicts or criterion names"
      - id: kp3
        name: Write the congruence statement with correct correspondence
        key_prerequisites: [sss-sas-congruence, asa-aas-congruence]
        exemplars:
          - problem: '$\triangle PQR \cong \triangle STU$. In triangle $PQR$, $\angle P = 40^\circ$ and $\angle Q = 60^\circ$. How large is angle $U$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '80'
            solution_sketch: 'Vertex $R$ is the third vertex in the first triangle, and $U$ is the third vertex in the second, so $\angle U \cong \angle R$. The angle sum gives $\angle R = 180 - 40 - 60 = 80^\circ$, so $\angle U = 80^\circ$.'
          - problem: '$\triangle ABC \cong \triangle DEF$. In triangle $ABC$, $AB = 5$ cm and $CA = 6$ cm, and the perimeter is $19$ cm. How long is $EF$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The third side of triangle $ABC$ is $BC = 19 - 5 - 6 = 8$ cm. The side $EF$ matches $BC$, because $E$ and $F$ are the second and third vertices, so $EF = 8$ cm.'
          - problem: '$\triangle ABC \cong \triangle QRP$ with $AB = 7$ cm, $BC = 9$ cm and $CA = 12$ cm. How long is $PQ$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'In the statement $A$ matches $Q$, $B$ matches $R$ and $C$ matches $P$. So $PQ$ matches $CA$, and $PQ = 12$ cm.'
          - problem: 'A tiler cuts two congruent triangular tiles $ABC$ and $PQR$ and records that $\triangle ABC \cong \triangle RQP$. Tile $ABC$ has $\angle A = 35^\circ$ and $\angle B = 85^\circ$. How large is angle $P$ of tile $PQR$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'In the statement $C$ is third and $P$ is third, so $\angle P \cong \angle C$. The angle sum gives $\angle C = 180 - 35 - 85 = 60^\circ$, so $\angle P = 60^\circ$.'
          - problem: 'Triangle $ABC$ is congruent to triangle $FDE$. Which angle of triangle $FDE$ is congruent to $\angle B$?'
            answer_contract: {"kind":"label","options":[["angle D","∠D","D","the angle at D","angle FDE","angle EDF","∠FDE"],["angle E","∠E","E","the angle at E","angle DEF","angle FED","∠DEF"],["angle F","∠F","F","the angle at F","angle EFD","angle DFE","∠EFD"]]}
            answer: 'angle D'
            solution_sketch: 'The vertex $B$ is second in $ABC$, and the second vertex of $FDE$ is $D$. So $\angle B$ is congruent to $\angle D$.'
          - problem: 'In triangles $PQR$ and $XYZ$, $\angle P \cong \angle Y$, $\overline{PQ} \cong \overline{YZ}$ and $\angle Q \cong \angle Z$. Which congruence statement is correct?'
            answer_contract: {"kind":"label","options":[["PQR ≅ YZX","triangle PQR ≅ triangle YZX","△PQR ≅ △YZX","PQR is congruent to YZX"],["PQR ≅ XYZ","triangle PQR ≅ triangle XYZ","△PQR ≅ △XYZ","PQR is congruent to XYZ"],["PQR ≅ ZXY","triangle PQR ≅ triangle ZXY","△PQR ≅ △ZXY","PQR is congruent to ZXY"]]}
            answer: 'PQR ≅ YZX'
            solution_sketch: 'The vertex $P$ matches $Y$ and the vertex $Q$ matches $Z$, so the remaining vertex $R$ matches $X$. Writing the vertices in matching order gives $\triangle PQR \cong \triangle YZX$.'
          - problem: 'A rectangular plot $ABCD$ is split by the diagonal $AC$ into two triangular beds with $\triangle ABC \cong \triangle CDA$. Side $AB$ is $9$ m long and side $BC$ is $12$ m long. What is the perimeter of bed $CDA$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '36'
            solution_sketch: 'The beds are congruent, so bed $CDA$ has the same perimeter as bed $ABC$. The diagonal is $\sqrt{9^2 + 12^2} = 15$ m, so the perimeter is $9 + 12 + 15 = 36$ m.'
        constraints: "vertex order in the statement must respect the correspondence; items ask for a matching side or angle, a perimeter, or the correct statement; at most two label items"
    diagnostic_exemplar:
      problem: 'In quadrilateral $PQRS$, $\overline{PQ} \cong \overline{RQ}$ and $\overline{PS} \cong \overline{RS}$, and diagonal $\overline{QS}$ is drawn. State the triangle congruence this gives and its criterion.'
      answer: '$\triangle PQS \cong \triangle RQS$ by SSS'
      answer_contract: {kind: none}
      solution_sketch: 'The shared diagonal gives $\overline{QS} \cong \overline{QS}$ (reflexive), completing three side pairs; the vertex order follows the correspondence $P \leftrightarrow R$.'
    anki_seeds:
      - front: "The five valid triangle congruence criteria are..."
        back: "SSS, SAS, ASA, AAS, HL (right triangles)"
        type: basic
      - front: "Why is SSA not a congruence criterion?"
        back: "Two sides and a non-included angle can produce two different triangles (the ambiguous case)."
        type: basic
      - front: "AAA guarantees triangles are..."
        back: "similar, not necessarily congruent"
        type: basic

  - id: isosceles-equilateral-triangles
    name: Isosceles and Equilateral Triangles
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.7
        key: true
      - id: triangle-congruence-criteria
        weight: 0.4
        key: false
      - id: two-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Base angles theorem
        key_prerequisites: [triangle-angle-sum]
        try_first:
          problem: 'A triangle has two equal sides, and the angle between them measures $44^\circ$. How large is each of the other two angles, in degrees?'
          answer_contract: {"kind":"exact"}
          answer: '68'
          reveal: 'Equal sides have equal angles opposite them, so the two other angles are equal. They share $180 - 44 = 136$ degrees, so each one measures $136 \div 2 = 68$ degrees. Equal sides always bring equal opposite angles, and the angle sum then fixes their size.'
        exemplars:
          - problem: 'Isosceles triangle $ABC$ has $AB = AC$ and $m\angle A = 40^\circ$. Find $m\angle B$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The sides $AB$ and $AC$ are equal, so the angles opposite them, $\angle C$ and $\angle B$, are equal. The three angles sum to $180^\circ$, so $m\angle B = (180 - 40) \div 2 = 70$.'
          - problem: 'The roof frame of a garden shed is an isosceles triangle. The two equal rafters meet at the ridge, where the angle between them is $110^\circ$. What angle does each rafter make with the horizontal tie beam?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The tie beam is the base, so the angles that the rafters make with it are the two equal base angles. Together they measure $180 - 110 = 70$ degrees, so each one measures $70 \div 2 = 35$ degrees.'
          - problem: 'In triangle $PQR$, $PQ = PR$ and $m\angle Q = 65^\circ$. Find $m\angle P$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '50'
            solution_sketch: 'Because $PQ = PR$, the angles $\angle Q$ and $\angle R$ are the base angles, so $m\angle R = 65$ as well. The angle at $P$ is $180 - 2 \cdot 65 = 50$ degrees.'
          - problem: 'In triangle $ABC$ the sides $AB$ and $AC$ are equal, and a student writes $\angle B \cong \angle C$. Which theorem justifies this step?'
            answer_contract: {"kind":"label","options":[["the base angles theorem","base angles theorem","the isosceles triangle theorem","isosceles triangle theorem","base angles"],["the converse of the base angles theorem","converse of the base angles theorem","the converse","converse"],["the triangle angle sum theorem","triangle angle sum theorem","angle sum theorem","triangle sum theorem"],["the vertical angles theorem","vertical angles theorem","vertical angles"]]}
            answer: 'the base angles theorem'
            solution_sketch: 'The equal sides $AB$ and $AC$ make triangle $ABC$ isosceles with its apex at $A$. The base angles theorem says that the angles opposite the equal sides, here $\angle C$ and $\angle B$, are congruent. The converse theorem runs the other way, from equal angles to equal sides.'
          - problem: 'Two surveyors stand at points $A$ and $B$ on a straight shoreline. A buoy $C$ floats exactly as far from $A$ as from $B$, and the angle $ACB$ at the buoy measures $48^\circ$. What angle does the sight line from $A$ to the buoy make with the shoreline?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '66'
            solution_sketch: 'Since $CA = CB$, triangle $ACB$ is isosceles with its apex at $C$, and the angle at $A$ is a base angle. So $m\angle CAB = (180 - 48) \div 2 = 66$ degrees.'
          - problem: 'The gable end of a shed is an isosceles triangle whose two base angles both measure $32^\circ$. How large is the angle at the peak?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '116'
            solution_sketch: 'The angles of a triangle sum to $180^\circ$, and the two base angles use $2 \cdot 32 = 64$ degrees. The angle at the peak is $180 - 64 = 116$ degrees.'
          - problem: 'Mara reasons that an isosceles triangle with a $50^\circ$ angle at its apex has base angles of $50^\circ$ too, because "the angles are equal". What is the correct measure of each base angle?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'Only the two base angles are equal; the apex angle can differ from them. The base angles share $180 - 50 = 130$ degrees, so each one measures $130 \div 2 = 65$ degrees.'
        constraints: 'whole-degree angles; vertex angle even so base angles are whole; apex and base angles asked in turn; roof and survey contexts; one theorem-name item; one named-error item'
      - id: kp2
        name: Equilateral and equiangular triangles
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'Two sides of an equilateral triangle measure $(3x - 2)$ cm and $(x + 10)$ cm. How long is each side of the triangle, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '16'
            solution_sketch: 'All three sides of an equilateral triangle are equal, so $3x - 2 = x + 10$ and $x = 6$. Each side is $3 \cdot 6 - 2 = 16$ cm long.'
          - problem: 'A triangular warning sign has three sides of equal length, and its perimeter is $2.1$ m. How long is one side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '0.7'
            solution_sketch: 'The three sides are equal, so one side is a third of the perimeter. $2.1 \div 3 = 0.7$ m.'
          - problem: 'A triangular frame is welded from three bars of equal length. What is the measure of each corner angle of the frame?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Three equal sides make three equal angles, and the angles sum to $180^\circ$. Each corner measures $180 \div 3 = 60$ degrees.'
          - problem: 'In triangle $PQR$, the angles at $P$, $Q$ and $R$ are all equal. Classify the triangle by its sides.'
            answer_contract: {"kind":"label","options":[["equilateral","an equilateral triangle","it is equilateral"],["isosceles, not equilateral","isosceles but not equilateral","isosceles"],["scalene (no equal sides)","scalene","a scalene triangle","it is scalene"]]}
            answer: 'equilateral'
            solution_sketch: 'Three equal angles make the triangle equiangular. By the converse of the base angles theorem, the sides opposite equal angles are equal, so all three sides are equal and the triangle is equilateral.'
          - problem: 'Triangle $DEF$ has three equal angles. The angles at $D$ and $E$ measure $(3x + 15)^\circ$ and $(5x - 15)^\circ$, and the side $DE$ is $(2x + 1)$ cm long. What is the perimeter of the triangle, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '93'
            solution_sketch: 'Equal angles give $3x + 15 = 5x - 15$, so $x = 15$. Then $DE = 2 \cdot 15 + 1 = 31$ cm, and an equiangular triangle has three equal sides, so the perimeter is $3 \cdot 31 = 93$ cm.'
          - problem: 'A triangle has sides of $7$ cm, $7$ cm and $9$ cm. Are all three of its angles equal?'
            answer_contract: {"kind":"label","options":[["no","no, they are not equal","not all equal"],["yes","yes, they are equal","all equal"]]}
            answer: 'no'
            solution_sketch: 'Two sides are equal, so the two angles opposite them are equal. The $9$ cm side is longer, so the angle opposite it is different, and the triangle is isosceles but not equilateral.'
        constraints: 'equilateral iff equiangular; linear side and angle expressions with integer solutions; one classification and one verdict item; sign and frame contexts'
      - id: kp3
        name: Converse of the base angles theorem
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'In triangle $ABC$ the angles at $B$ and $C$ are equal, $AB = (5x - 7)$ cm and $AC = (2x + 8)$ cm. How long is $AB$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '18'
            solution_sketch: 'Equal angles at $B$ and $C$ make the opposite sides $AC$ and $AB$ equal, so $5x - 7 = 2x + 8$ and $x = 5$. Then $AB = 5 \cdot 5 - 7 = 18$ cm.'
          - problem: 'A roof frame is the triangle $ABC$. A builder measures the angles at $B$ and $C$ and finds them equal. The rafter $AB$ is $4.2$ m long. How long is the rafter $AC$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4.2'
            solution_sketch: 'The sides opposite equal angles are equal, by the converse of the base angles theorem. The side opposite the angle at $B$ is $AC$ and the side opposite the angle at $C$ is $AB$, so $AC = AB = 4.2$ m.'
          - problem: 'In triangle $XYZ$ the angles at $X$ and $Y$ are equal, $XZ = (3x + 4)$ cm, $YZ = (5x - 6)$ cm and $XY = 14$ cm. What is the perimeter of the triangle, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '52'
            solution_sketch: 'The sides opposite the equal angles at $X$ and $Y$ are $YZ$ and $XZ$, so $3x + 4 = 5x - 6$ and $x = 5$. Then $XZ = YZ = 19$ cm, and the perimeter is $19 + 19 + 14 = 52$ cm.'
          - problem: 'In triangle $ABC$, $m\angle A = 50^\circ$ and $m\angle B = 80^\circ$. Which two sides are equal in length?'
            answer_contract: {"kind":"label","options":[["AB and BC","BC and AB","AB = BC","BC = AB","AB, BC","BC, AB","AB=BC","BC=AB"],["AB and AC","AC and AB","AB = AC","AC = AB","AB, AC","AC, AB","AB=AC","AC=AB"],["AC and BC","BC and AC","AC = BC","BC = AC","AC, BC","BC, AC","AC=BC","BC=AC"],["no two sides are equal","none","no two are equal","none of them"]]}
            answer: 'AB and BC'
            solution_sketch: 'The third angle is $180 - 50 - 80 = 50$ degrees, so $m\angle C = m\angle A = 50^\circ$. The sides opposite these equal angles are $BC$ and $AB$, so $AB = BC$.'
          - problem: 'In triangle $ABC$ the angles at $B$ and $C$ are equal, and a student concludes that $AB = AC$. Which theorem justifies this conclusion?'
            answer_contract: {"kind":"label","options":[["the base angles theorem","base angles theorem","the isosceles triangle theorem","isosceles triangle theorem","base angles"],["the converse of the base angles theorem","converse of the base angles theorem","the converse","converse"],["the triangle angle sum theorem","triangle angle sum theorem","angle sum theorem","triangle sum theorem"],["the vertical angles theorem","vertical angles theorem","vertical angles"]]}
            answer: 'the converse of the base angles theorem'
            solution_sketch: 'The student starts from equal angles and concludes that two sides are equal. That is the converse of the base angles theorem, which says that the sides opposite congruent angles are congruent. The base angles theorem itself starts from equal sides instead.'
          - problem: 'In triangle $PQR$, $PQ = PR$, $m\angle Q = (3x + 5)^\circ$ and $m\angle R = (5x - 19)^\circ$. Find $m\angle P$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '98'
            solution_sketch: 'Equal sides $PQ$ and $PR$ give equal base angles, so $3x + 5 = 5x - 19$ and $x = 12$. Each base angle is $41^\circ$, so $m\angle P = 180 - 2 \cdot 41 = 98$ degrees.'
        constraints: 'sides opposite congruent angles are congruent; integer solutions; a side or an angle asked; one pair-of-sides item and one theorem-name item'
    diagnostic_exemplar:
      problem: 'An isosceles triangle has vertex angle $(2x)^\circ$ and base angles $(3x + 10)^\circ$ each. Find the vertex angle, in degrees.'
      answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
      answer: '40'
      solution_sketch: 'The three angles sum to $180^\circ$, so $2x + 2(3x + 10) = 180$, which gives $8x + 20 = 180$ and $x = 20$. The vertex angle is $2 \cdot 20 = 40^\circ$.'
    anki_seeds:
      - front: "Base angles theorem: the angles opposite the congruent sides of an isosceles triangle are..."
        back: "congruent"
        type: basic
      - front: "Each angle of an equilateral triangle measures..."
        back: "60 degrees"
        type: basic

  - id: medians-centroids
    name: Medians and Centroids
    core: false
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: segment-angle-addition
        weight: 0.5
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: false
      - id: coordinate-plane
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Medians and midpoints
        key_prerequisites: [segment-angle-addition]
        exemplars:
          - problem: 'The segment $\overline{BD}$ is a median of $\triangle ABC$, where $D$ lies on $\overline{AC}$ and $AC = 18$ cm. How long is $\overline{AD}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'A median ends at the midpoint of the opposite side, so $D$ is the midpoint of $\overline{AC}$. Then $AD = 18 \div 2 = 9$ cm.'
          - problem: 'A triangular plot has corners $A$, $B$ and $C$. A fence runs from corner $B$ to the point $D$ on side $\overline{AC}$ that is exactly as far from $A$ as from $C$. The side $\overline{AC}$ is $46$ m long. How far is $D$ from $C$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '23'
            solution_sketch: 'The point $D$ is as far from $A$ as from $C$, so it is the midpoint of $\overline{AC}$ and the fence is a median. Then $DC = 46 \div 2 = 23$ m.'
          - problem: 'A segment joins a vertex of a triangle to the midpoint of the opposite side. What is such a segment called?'
            answer_contract: {"kind":"label","options":[["a median","median","the median"],["an altitude","altitude","the altitude","a height"],["an angle bisector","angle bisector","the angle bisector"],["a midsegment","midsegment","mid-segment"]]}
            answer: 'a median'
            solution_sketch: 'A segment from a vertex to the midpoint of the opposite side is a median. An altitude meets the opposite side at a right angle, an angle bisector splits the angle at the vertex, and a midsegment joins the midpoints of two sides.'
          - problem: 'In triangle $PQR$, the point $M$ lies on $\overline{QR}$ and $\overline{PM}$ is a median. $QM = (7x - 4)$ and $MR = (4x + 11)$. Find $QR$.'
            answer_contract: {"kind":"exact"}
            answer: '62'
            solution_sketch: 'A median meets the opposite side at its midpoint, so $QM = MR$ and $7x - 4 = 4x + 11$, which gives $x = 5$. Then $QM = 31$ and $QR = 2 \cdot 31 = 62$.'
          - problem: 'In triangle $ABC$, the vertices are $A = (2, 1)$ and $C = (10, 7)$. The median from $B$ meets $\overline{AC}$ at the point $D$. Find the coordinates of $D$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, 4)'
            solution_sketch: 'The median ends at the midpoint of $\overline{AC}$, so $D$ has the average coordinates of $A$ and $C$. That gives $D = \left(\frac{2 + 10}{2}, \frac{1 + 7}{2}\right) = (6, 4)$.'
          - problem: 'In triangle $ABC$, the median $\overline{AM}$ meets $\overline{BC}$ at $M$. $AB = 13$ cm, $AM = 12$ cm, and the perimeter of triangle $ABM$ is $30$ cm. How long is $\overline{BC}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The perimeter gives $BM = 30 - 13 - 12 = 5$ cm. Since $M$ is the midpoint of $\overline{BC}$, $BC = 2 \cdot 5 = 10$ cm.'
          - problem: 'Two towns $A$ and $C$ lie on a straight highway. A new road leaves a town $B$ and meets the highway at the junction $D$, which is exactly as far from $A$ as from $C$. Along the highway, $AD = (2x + 1)$ km and $DC = (5x - 8)$ km. How long is the highway section between $A$ and $C$, in km?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '14'
            solution_sketch: 'The junction is as far from $A$ as from $C$, so it is the midpoint of $\overline{AC}$ and $2x + 1 = 5x - 8$, which gives $x = 3$. Then $AD = 7$ km and $AC = 2 \cdot 7 = 14$ km.'
        constraints: 'even side lengths so midpoint splits are whole numbers; midpoint by length, by algebra and by coordinates; one naming item; plot context'
      - id: kp2
        name: The centroid divides each median 2:1
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'The medians of triangle $ABC$ meet at the centroid $G$. The median $\overline{AM}$ is $18$ cm long. How long is $\overline{AG}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The centroid lies $\frac{2}{3}$ of the way from the vertex along each median. So $AG = \frac{2}{3} \cdot 18 = 12$ cm.'
          - problem: 'The centroid $G$ of triangle $ABC$ lies on the median $\overline{AM}$, and $GM = 5$ cm. How long is the whole median $\overline{AM}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The piece from the vertex to the centroid is twice the piece from the centroid to the midpoint, so $AG = 2 \cdot 5 = 10$ cm. The whole median is $AG + GM = 10 + 5 = 15$ cm.'
          - problem: 'A triangular steel plate of even thickness balances on a pin at its centroid $G$. The pin is $9$ cm from the midpoint $M$ of side $BC$, measured along the median $\overline{AM}$. How far is the pin from corner $A$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '18'
            solution_sketch: 'The balance point is the centroid, which splits the median $2 : 1$ from the vertex. The distance $GM$ is $9$ cm, so $AG = 2 \cdot 9 = 18$ cm.'
          - problem: 'The centroid $G$ lies on the median $\overline{AM}$ of triangle $ABC$, and $AG = 14$. A student concludes that $GM = 7$. Which fact justifies this conclusion?'
            answer_contract: {"kind":"label","options":[["the 2 : 1 ratio","the centroid divides each median in the ratio 2 : 1","the centroid divides each median 2 : 1","2:1","2 : 1","the 2 to 1 ratio","centroid theorem","the centroid theorem"],["the midpoint definition","a midpoint divides a segment into two equal parts","the definition of a midpoint","midpoint","definition of midpoint","the definition of midpoint"],["the angle bisector theorem","angle bisector theorem","angle bisector"],["the Pythagorean theorem","Pythagorean theorem","Pythagoras"]]}
            answer: 'the 2 : 1 ratio'
            solution_sketch: 'The centroid divides each median in the ratio $2 : 1$ measured from the vertex, so $AG$ is twice $GM$. Therefore $GM = 14 \div 2 = 7$. The midpoint of the median is not the centroid, and neither the angle bisector theorem nor the Pythagorean theorem is involved.'
          - problem: 'A triangular banner has corners $A$, $B$ and $C$. A cord runs from corner $B$ to the midpoint $N$ of side $\overline{AC}$ and is $27$ cm long. The banner hangs from its centroid $G$, which lies on the cord. How far is the hanging point from $N$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'The centroid is the point where the medians meet, and it lies $\frac{1}{3}$ of the way from the midpoint to the vertex. So $GN = \frac{1}{3} \cdot 27 = 9$ cm.'
          - problem: 'The medians $\overline{AM}$ and $\overline{BN}$ of triangle $ABC$ meet at the centroid $G$. $AG = 10$ cm and $BG = 7$ cm. What is the sum $MG + NG$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '8.5'
            solution_sketch: 'On each median the piece next to the midpoint is half of the piece next to the vertex. So $MG = 10 \div 2 = 5$ cm and $NG = 7 \div 2 = 3.5$ cm, and $MG + NG = 5 + 3.5 = 8.5$ cm.'
          - problem: 'Kai says that the centroid is the midpoint of each median, so for a median $\overline{AM}$ of length $24$ cm he writes $AG = 12$ cm. What is the correct length of $\overline{AG}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '16'
            solution_sketch: 'The centroid is not the midpoint of a median; it divides the median $2 : 1$ from the vertex. So $AG = \frac{2}{3} \cdot 24 = 16$ cm, and $GM = 8$ cm.'
        constraints: 'median lengths divisible by 3 or halves of the pieces allowed; vertex-to-centroid is the long piece; lengths in cm; one justification item and one named-error item'
      - id: kp3
        name: Centroid computations with variables and coordinates
        key_prerequisites: [ratios-proportions, coordinate-plane]
        exemplars:
          - problem: 'A triangle has the vertices $A(0, 0)$, $B(6, 0)$ and $C(0, 9)$. Find its centroid.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 3)'
            solution_sketch: 'The centroid has the average of the vertex coordinates. So the centroid is $\left(\frac{0 + 6 + 0}{3}, \frac{0 + 0 + 9}{3}\right) = (2, 3)$.'
          - problem: 'The centroid $G$ of triangle $ABC$ lies on the median $\overline{AM}$, with $AG = (5x - 2)$ cm and $GM = (x + 5)$ cm. How long is the median $\overline{AM}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '27'
            solution_sketch: 'The centroid gives $AG = 2 \cdot GM$, so $5x - 2 = 2(x + 5)$ and $x = 4$. Then $AG = 18$ cm and $GM = 9$ cm, so $AM = 18 + 9 = 27$ cm.'
          - problem: 'The medians of triangle $ABC$ meet at the centroid $G$, which lies on the median $\overline{BN}$. $BG = (6x - 4)$ cm and $GN = (2x + 1)$ cm. How long is the median $\overline{BN}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The centroid gives $BG = 2 \cdot GN$, so $6x - 4 = 2(2x + 1)$ and $x = 3$. Then $BG = 14$ cm and $GN = 7$ cm, so $BN = 14 + 7 = 21$ cm.'
          - problem: 'A flat triangular metal sheet has its corners at $(1, 2)$, $(7, 2)$ and $(4, 11)$ on a grid in centimetres. The sheet balances on a pin placed at its centroid. Find the coordinates of the pin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 5)'
            solution_sketch: 'The balance point of the sheet is its centroid, the average of the three corners. That gives $\left(\frac{1 + 7 + 4}{3}, \frac{2 + 2 + 11}{3}\right) = (4, 5)$.'
          - problem: 'A triangle has the vertices $(1, 2)$, $(5, 7)$ and $(x, y)$, and its centroid is $(4, 5)$. Find the third vertex.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, 6)'
            solution_sketch: 'The coordinates of the centroid are the averages of the vertex coordinates. So $\frac{1 + 5 + x}{3} = 4$ gives $x = 6$, and $\frac{2 + 7 + y}{3} = 5$ gives $y = 6$.'
          - problem: 'On a site plan with coordinates in metres, three posts stand at $A(0, 0)$, $B(12, 0)$ and $C(3, 9)$. A lamp is to hang above the centroid of the triangle that the posts form. What are the coordinates of the lamp?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 3)'
            solution_sketch: 'Average the three post positions. The $x$-coordinate is $\frac{0 + 12 + 3}{3} = 5$ and the $y$-coordinate is $\frac{0 + 0 + 9}{3} = 3$, so the lamp hangs above $(5, 3)$.'
          - problem: 'In triangle $ABC$, the vertex $A$ is at the origin and the midpoint of $\overline{BC}$ is $M = (9, 6)$. Find the centroid of the triangle.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, 4)'
            solution_sketch: 'The centroid lies on the median $\overline{AM}$, $\frac{2}{3}$ of the way from $A$ to $M$. So it is at $\left(\frac{2}{3} \cdot 9, \frac{2}{3} \cdot 6\right) = (6, 4)$.'
          - problem: 'A student claims that the centroid of the triangle with vertices $(1, 1)$, $(7, 1)$ and $(4, 10)$ is the point $(4, 5)$. Is the student right?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is"],["no","no, it is not"]]}
            answer: 'no'
            solution_sketch: 'The centroid is the average of the vertices, which gives $\left(\frac{1 + 7 + 4}{3}, \frac{1 + 1 + 10}{3}\right) = (4, 4)$. The point $(4, 5)$ has the right $x$-coordinate but the wrong $y$-coordinate, so the student is wrong.'
        constraints: 'vertex coordinates chosen so the centroid is integral; linear expressions with integer solutions; centroid from vertices, from a missing vertex and from a vertex and a midpoint; one verdict item; site and metal-sheet contexts'
    diagnostic_exemplar:
      problem: 'The centroid $G$ of triangle $ABC$ lies on the median $\overline{AM}$, with $AG = 3x$ and $GM = x + 4$. Find $AM$.'
      answer_contract: {"kind":"exact"}
      answer: '36'
      solution_sketch: 'The centroid gives $AG = 2 \cdot GM$, so $3x = 2(x + 4)$ and $x = 8$. Then $AG = 24$ and $GM = 12$, so $AM = 24 + 12 = 36$.'
    anki_seeds:
      - front: "The centroid divides each median in the ratio ... measured from the vertex"
        back: "2 : 1"
        type: basic
      - front: "The centroid of a triangle with vertices A, B, C has coordinates..."
        back: "the average of the three vertices: ((x1+x2+x3)/3, (y1+y2+y3)/3)"
        type: basic

  - id: bisectors-in-triangles
    name: Bisectors in Triangles
    core: false
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: perpendicular-bisectors
        weight: 0.6
        key: true
      - id: angle-bisectors
        weight: 0.6
        key: true
      - id: triangle-congruence-criteria
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Circumcenter equidistant from the vertices
        key_prerequisites: [perpendicular-bisectors]
        exemplars:
          - problem: 'The perpendicular bisectors of the three sides of triangle $ABC$ meet at the point $P$. $PA = 13$ cm. How far is $P$ from $C$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The point $P$ is on the perpendicular bisector of every side, so it is equally far from all three vertices. Therefore $PC = PA = 13$ cm.'
          - problem: 'Three farms $A$, $B$ and $C$ form a triangle. A well is dug at the point where the perpendicular bisectors of the triangle''s sides meet. It is $5.2$ km from farm $A$. How far is it from farm $C$, in km?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '5.2'
            solution_sketch: 'The meeting point of the perpendicular bisectors is equally far from the three vertices. So the well is $5.2$ km from farm $C$, the same as from farm $A$.'
          - problem: 'The perpendicular bisectors of the three sides of a triangle meet at one point $P$. What is $P$ the same distance from?'
            answer_contract: {"kind":"label","options":[["the three vertices","the vertices","vertices","all three vertices","the corners","corners"],["the three sides","the sides","sides","all three sides"],["the midpoints of the sides","the midpoints","midpoints","the side midpoints"]]}
            answer: 'the three vertices'
            solution_sketch: 'Each point on the perpendicular bisector of a segment is equally far from the two endpoints of that segment. The point $P$ lies on all three bisectors, so it is equally far from all three vertices. Equal distances to the sides belong to the incenter instead.'
          - problem: 'A triangular courtyard $ABC$ has a side $AB = 24$ m. A lamp post $P$ stands at the same distance from all three corners, $13$ m from corner $A$. How far is the lamp post from the midpoint of $\overline{AB}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The post is on the perpendicular bisector of $\overline{AB}$, so the segment from $P$ to the midpoint $M$ is perpendicular to $\overline{AB}$. In the right triangle $PMA$, $MA = 12$ and $PA = 13$, so $PM = \sqrt{13^2 - 12^2} = 5$ m.'
          - problem: 'A triangle has the vertices $A(0, 0)$, $B(8, 0)$ and $C(0, 6)$. Find the point where the perpendicular bisectors of its sides meet.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 3)'
            solution_sketch: 'The perpendicular bisector of $\overline{AB}$ is the line $x = 4$, and that of $\overline{AC}$ is the line $y = 3$. They meet at $(4, 3)$, which is equally far from the three vertices.'
          - problem: 'A point $P$ is $9$ cm from $A$, $9$ cm from $B$ and $10$ cm from $C$. Could $P$ be the point where the perpendicular bisectors of triangle $ABC$ meet?'
            answer_contract: {"kind":"label","options":[["no","no, it could not","it could not"],["yes","yes, it could","it could"]]}
            answer: 'no'
            solution_sketch: 'The meeting point of the perpendicular bisectors is equally far from all three vertices. Here the distances $9$, $9$ and $10$ differ, so $P$ cannot be that point.'
        constraints: 'concurrency stated; equal distances to the vertices read off, one right-triangle step and one coordinate item; one concept item and one verdict item; farm and courtyard contexts'
      - id: kp2
        name: Incenter equidistant from the sides
        key_prerequisites: [angle-bisectors]
        exemplars:
          - problem: 'The angle bisectors of triangle $ABC$ meet at the point $I$. The perpendicular distance from $I$ to side $\overline{AB}$ is $4$ cm. What is the distance from $I$ to side $\overline{BC}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '4'
            solution_sketch: 'The point $I$ is on the bisector of angle $B$, so it is equally far from the sides $\overline{AB}$ and $\overline{BC}$. The distance to $\overline{BC}$ is also $4$ cm.'
          - problem: 'A round table top is to be cut from a triangular piece of plywood so that it touches all three edges. Its centre is the point where the three angle bisectors of the triangle meet, and this point is $35$ cm from the shortest edge. What is the diameter of the table top, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The meeting point of the angle bisectors is equally far from all three edges, so the radius of a circle touching all three edges is $35$ cm. The diameter is $2 \cdot 35 = 70$ cm.'
          - problem: 'The three angle bisectors of a triangle meet at one point $I$. What is $I$ the same distance from?'
            answer_contract: {"kind":"label","options":[["the three sides","the sides","sides","all three sides"],["the three vertices","the vertices","vertices","all three vertices","the corners","corners"],["the midpoints of the sides","the midpoints","midpoints","the side midpoints"]]}
            answer: 'the three sides'
            solution_sketch: 'Each point on the bisector of an angle is equally far from the two sides of that angle. The point $I$ lies on all three bisectors, so it is equally far from all three sides. Equal distances to the vertices belong to the circumcenter instead.'
          - problem: 'In triangle $ABC$, $m\angle A = 50^\circ$ and $m\angle C = 70^\circ$. The angle bisectors from $A$ and $C$ meet at the point $I$. Find $m\angle AIC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'The bisectors cut the angles at $A$ and $C$ in half, giving $25^\circ$ and $35^\circ$. In triangle $AIC$ the angle at $I$ is $180 - 25 - 35 = 120$ degrees.'
          - problem: 'Two straight roads meet at a junction $O$. A bus stop lies on the line that bisects the angle between the roads, and it is $85$ m from one road, measured straight to the road. How far is it from the other road, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '85'
            solution_sketch: 'Every point on the bisector of an angle is equally far from the two sides of the angle. The bus stop is therefore $85$ m from the other road as well.'
          - problem: 'A point $I$ is $3$ cm from side $AB$, $3$ cm from side $BC$ and $3.4$ cm from side $CA$ of triangle $ABC$, each distance measured perpendicular to the side. Is $I$ the point where the angle bisectors of the triangle meet?'
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not"],["yes","yes, it is","it is"]]}
            answer: 'no'
            solution_sketch: 'The meeting point of the angle bisectors is equally far from all three sides. The distances $3$, $3$ and $3.4$ are not all equal, so $I$ is not that point.'
        constraints: 'distances measured perpendicular to the sides; equal distances, a bisected angle and an angle at the incenter; one concept item and one verdict item; plywood and road contexts'
      - id: kp3
        name: Concurrency points with variables
        key_prerequisites: [perpendicular-bisectors, angle-bisectors]
        exemplars:
          - problem: 'The point $P$ is the circumcenter of triangle $ABC$, with $PA = (6x - 5)$ cm and $PB = (4x + 9)$ cm. How long is $PA$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '37'
            solution_sketch: 'The circumcenter is equally far from all vertices, so $6x - 5 = 4x + 9$ and $x = 7$. Then $PA = 6 \cdot 7 - 5 = 37$ cm.'
          - problem: 'The point $I$ is the incenter of triangle $DEF$. Its distances to the sides $\overline{DE}$ and $\overline{EF}$ are $(3x + 1)$ cm and $(5x - 11)$ cm. What is the common distance, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '19'
            solution_sketch: 'The incenter is equally far from all three sides, so $3x + 1 = 5x - 11$ and $x = 6$. The common distance is $3 \cdot 6 + 1 = 19$ cm.'
          - problem: 'A hospital is to be built at the point $H$ that is equally far from three towns $A$, $B$ and $C$. The distance from $H$ to $A$ is $(8x - 7)$ km and the distance from $H$ to $B$ is $(5x + 14)$ km. How far is the hospital from town $C$, in km?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '49'
            solution_sketch: 'The point $H$ is equally far from the three towns, so $8x - 7 = 5x + 14$ and $x = 7$. Each distance is $8 \cdot 7 - 7 = 49$ km, so the hospital is $49$ km from town $C$.'
          - problem: 'In triangle $ABC$ the angle bisectors meet at the point $I$. $m\angle IBC = (2x + 5)^\circ$ and $m\angle IBA = (4x - 19)^\circ$. Find $m\angle ABC$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '58'
            solution_sketch: 'The bisector $BI$ cuts $\angle ABC$ into two equal angles, so $2x + 5 = 4x - 19$ and $x = 12$. Each part measures $29^\circ$, so $m\angle ABC = 2 \cdot 29 = 58$ degrees.'
          - problem: 'The circumcenter $P$ of triangle $ABC$ has $PA = (3x + 2)$ cm and $PB = (5x - 10)$ cm, and $AB = 24$ cm. How far is $P$ from the midpoint of $\overline{AB}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '16'
            solution_sketch: 'Equal distances give $3x + 2 = 5x - 10$, so $x = 6$ and $PA = 20$ cm. The segment from $P$ to the midpoint of $\overline{AB}$ is perpendicular to $\overline{AB}$, so its length is $\sqrt{20^2 - 12^2} = 16$ cm.'
          - problem: 'A triangular lot has a round pond that touches all three sides and is centred at the incenter $I$ of the lot. The point $I$ is $(3x - 4)$ m from the north side and $(2x + 6)$ m from the east side. What is the radius of the pond, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '26'
            solution_sketch: 'The centre of the pond is equally far from all three sides, so $3x - 4 = 2x + 6$ and $x = 10$. The radius is that common distance, $3 \cdot 10 - 4 = 26$ m.'
          - problem: 'To solve a problem about the circumcenter $P$ of triangle $ABC$, a student writes $PA = PB$. Which fact justifies this step?'
            answer_contract: {"kind":"label","options":[["equidistance from vertices","the circumcenter is equidistant from the vertices","the circumcenter is equally far from the vertices","equidistant from the vertices","equidistant from vertices","perpendicular bisector theorem","the perpendicular bisector theorem"],["equidistance from sides","the incenter is equidistant from the sides","the incenter is equally far from the sides","equidistant from the sides","equidistant from sides","angle bisector theorem","the angle bisector theorem"],["the 2 : 1 ratio","the centroid divides each median 2 : 1","the centroid divides each median in the ratio 2 : 1","centroid theorem","the centroid theorem","2 : 1","2:1"],["the triangle inequality","triangle inequality"]]}
            answer: 'equidistance from vertices'
            solution_sketch: 'The circumcenter lies on the perpendicular bisector of every side, so it is equally far from the two ends of each side. Therefore $PA = PB$. The incenter statement is about sides and the centroid statement is about medians.'
        constraints: 'linear expressions with integer solutions; equidistance or a bisected angle supplies the equation; one right-triangle step; one theorem-name item; hospital and pond contexts'
    diagnostic_exemplar:
      problem: 'The point $G$ is the circumcenter of triangle $ABC$, with $GA = 7x - 9$ and $GB = 4x + 12$. Find $GA$.'
      answer_contract: {"kind":"exact"}
      answer: '40'
      solution_sketch: 'The circumcenter is equally far from the vertices, so $7x - 9 = 4x + 12$ and $x = 7$. Then $GA = 7 \cdot 7 - 9 = 40$.'
    anki_seeds:
      - front: "The circumcenter is the concurrency point of the ... and is equidistant from the vertices"
        back: "perpendicular bisectors of the sides"
        type: basic
      - front: "The incenter is the concurrency point of the ... and is equidistant from the sides"
        back: "angle bisectors"
        type: basic

  - id: congruence-proofs-cpctc
    name: Congruence Proofs and CPCTC
    core: false
    difficulty: 0.45
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: triangle-congruence-criteria
        weight: 0.8
        key: true
      - id: writing-geometric-proofs
        weight: 0.7
        key: true
      - id: isosceles-equilateral-triangles
        weight: 0.4
        key: false
      - id: angle-relationships
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Prove triangles congruent using shared parts
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'In quadrilateral $ABCD$ the sides $AB$ and $AD$ are equal, the sides $CB$ and $CD$ are equal, and the diagonal $\overline{AC}$ is drawn. Which criterion proves $\triangle ABC \cong \triangle ADC$?'
            answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side","SSS congruence"],["SAS","side-angle-side","side angle side","SAS congruence"],["ASA","angle-side-angle","angle side angle","ASA congruence"],["AAS","angle-angle-side","angle angle side","AAS congruence"]]}
            answer: 'SSS'
            solution_sketch: 'The two given pairs of equal sides, $AB = AD$ and $CB = CD$, are joined by the shared side $\overline{AC}$, which is congruent to itself by the reflexive property. Three pairs of equal sides prove the triangles congruent by SSS.'
          - problem: 'A window frame is a four-sided frame $ABCD$ with a brace $\overline{AC}$ fitted across it. The brace makes equal angles with the two bars at each end, so $\angle BAC \cong \angle DAC$ and $\angle BCA \cong \angle DCA$. Which criterion proves $\triangle ABC \cong \triangle ADC$?'
            answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side","SSS congruence"],["SAS","side-angle-side","side angle side","SAS congruence"],["ASA","angle-side-angle","angle side angle","ASA congruence"],["AAS","angle-angle-side","angle angle side","AAS congruence"]]}
            answer: 'ASA'
            solution_sketch: 'Two pairs of angles are congruent, at $A$ and at $C$. The brace $\overline{AC}$ lies between these angles in both triangles and is congruent to itself, so the triangles are congruent by ASA.'
          - problem: 'Two straight segments $\overline{AC}$ and $\overline{BD}$ cross at $M$, the midpoint of both. In a proof that $\triangle AMB \cong \triangle CMD$, which reason gives $\angle AMB \cong \angle CMD$?'
            answer_contract: {"kind":"label","options":[["vertical angles","vertical","the vertical angles theorem","vertical angles theorem","vertical angles are congruent"],["the reflexive property","reflexive property","reflexive"],["the definition of a midpoint","definition of a midpoint","definition of midpoint","midpoint"],["alternate interior angles","alternate interior","the alternate interior angles theorem","alternate interior angles theorem"]]}
            answer: 'vertical angles'
            solution_sketch: 'The segments $\overline{AC}$ and $\overline{BD}$ cross at $M$, so $\angle AMB$ and $\angle CMD$ lie opposite each other at the crossing. Opposite angles at an intersection are vertical angles, and vertical angles are congruent.'
          - problem: 'Two straight segments $\overline{AC}$ and $\overline{BD}$ cross at $M$, the midpoint of $\overline{AC}$. $AM = (2x + 3)$ cm and $MC = (5x - 9)$ cm. How long is $\overline{AC}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '22'
            solution_sketch: 'A midpoint gives two equal segments, so $2x + 3 = 5x - 9$ and $x = 4$. Then $AM = 11$ cm and $AC = 2 \cdot 11 = 22$ cm.'
          - problem: 'A kite frame $ABCD$ has a central spar $\overline{AC}$ and is symmetric, so $\triangle ABC \cong \triangle ADC$. The batten $\overline{BC}$ is $(4x - 3)$ cm long and the batten $\overline{DC}$ is $(2x + 9)$ cm long. How long is $\overline{BC}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '21'
            solution_sketch: 'The congruent triangles share the spar $\overline{AC}$, and the battens $\overline{BC}$ and $\overline{DC}$ are corresponding sides, so $4x - 3 = 2x + 9$ and $x = 6$. Then $BC = 4 \cdot 6 - 3 = 21$ cm.'
          - problem: 'The segments $\overline{AC}$ and $\overline{BD}$ cross at $M$, the midpoint of both, so $\triangle AMB \cong \triangle CMD$. Here $AB = (3x - 2)$ cm and $CD = (x + 8)$ cm. How long is $\overline{AB}$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The congruent triangles give $AB = CD$ by CPCTC, so $3x - 2 = x + 8$ and $x = 5$. Then $AB = 3(5) - 2 = 13$ cm.'
          - problem: 'In the kite $ABCD$, $AB = AD$ and $CB = CD$, and the diagonal $\overline{AC}$ is drawn. The angles measure $m\angle ABC = (5x + 4)^\circ$ and $m\angle ADC = (8x - 23)^\circ$. How large is $\angle ABC$, in degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '49'
            solution_sketch: 'The triangles $ABC$ and $ADC$ are congruent by SSS, since $\overline{AC}$ is shared. By CPCTC $\angle ABC \cong \angle ADC$, so $5x + 4 = 8x - 23$ and $x = 9$, which gives $m\angle ABC = 49^\circ$.'
          - problem: 'Write the full proof. The segments $\overline{AC}$ and $\overline{BD}$ cross at $M$, and $M$ is the midpoint of both. Prove that $\triangle AMB \cong \triangle CMD$.'
            answer_contract: {"kind":"none"}
            answer: 'AMB is congruent to CMD by SAS'
            solution_sketch: '1. $AM = CM$, because $M$ is the midpoint of $\overline{AC}$ (definition of a midpoint). 2. $\angle AMB \cong \angle CMD$, because they are vertical angles at the crossing of $\overline{AC}$ and $\overline{BD}$. 3. $BM = DM$, because $M$ is the midpoint of $\overline{BD}$ (definition of a midpoint). 4. $\triangle AMB \cong \triangle CMD$ by SAS, since $\angle AMB$ lies between the sides $AM$ and $BM$ and $\angle CMD$ lies between the sides $CM$ and $DM$.'
        constraints: 'reasons limited to given, reflexive, midpoint and angle-bisector definitions, vertical angles, then SSS/SAS/ASA/AAS; three criterion or reason items, two algebra items and one written proof (the last item)'
      - id: kp2
        name: CPCTC conclusions
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'Triangle $ABC$ is congruent to triangle $DEF$, with $A$ corresponding to $D$, $B$ to $E$ and $C$ to $F$. Which side of triangle $DEF$ is equal in length to the side $BC$?'
            answer_contract: {"kind":"label","options":[["EF","side EF","segment EF","FE"],["DF","side DF","segment DF","FD"],["DE","side DE","segment DE","ED"],["AB","side AB","segment AB","BA"]]}
            answer: 'EF'
            solution_sketch: 'Corresponding vertices are matched in pairs, $B$ with $E$ and $C$ with $F$. So the side $BC$ corresponds to the side $EF$, and the two sides are equal by CPCTC.'
          - problem: 'Triangle $PQR$ is congruent to triangle $STU$, with $P$ corresponding to $S$, $Q$ to $T$ and $R$ to $U$. In triangle $PQR$, $m\angle P = 48^\circ$, and in triangle $STU$, $m\angle T = 67^\circ$. Find $m\angle U$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '65'
            solution_sketch: 'The angle at $T$ corresponds to the angle at $Q$, so $m\angle Q = 67$ degrees by CPCTC. The angles of $\triangle PQR$ sum to $180^\circ$, so $m\angle R = 180 - 48 - 67 = 65$, and $m\angle U = 65$ degrees by CPCTC.'
          - problem: 'A surveyor wants the width of a river. A tree $T$ stands on the far bank, directly across from a stake $A$ on the near bank, so $\overline{TA}$ is perpendicular to the bank. She walks along the near bank from $A$ to a stake $B$, and then the same distance on to a stake $C$, so $AB = BC$. At $C$ she turns at a right angle to the bank and walks away from the river until she reaches the point $D$ from which the tree is seen exactly over the stake $B$, so $D$, $B$ and $T$ lie on one line. She measures $CD = 37$ m. How wide is the river, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '37'
            solution_sketch: 'The triangles $TAB$ and $DCB$ have right angles at $A$ and $C$, equal sides $AB = CB$, and equal vertical angles at $B$, so they are congruent by ASA. The river width $TA$ corresponds to $CD$, so $TA = CD = 37$ m by CPCTC.'
          - problem: 'A student knows that two sides of triangle $ABC$ are equal to two sides of triangle $DEF$, but knows nothing about the third sides or the angles. Can the student already use CPCTC to conclude that the remaining angles are equal?'
            answer_contract: {"kind":"label","options":[["no","no, not yet","not yet"],["yes","yes, it can","it can"]]}
            answer: 'no'
            solution_sketch: 'CPCTC applies only after the triangles have been proved congruent by a criterion such as SSS, SAS or ASA. Two pairs of equal sides prove nothing alone, so the student cannot yet draw conclusions about the angles.'
          - problem: 'Triangle $ABC$ is congruent to triangle $DEF$, with $A$ corresponding to $D$, $B$ to $E$ and $C$ to $F$. $AC = (5x - 3)$ cm, $DF = (3x + 7)$ cm and $EF = (3x + 4)$ cm. How long is $BC$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '19'
            solution_sketch: 'Corresponding sides are equal, so $AC = DF$ gives $5x - 3 = 3x + 7$ and $x = 5$. The side $BC$ corresponds to $EF$, so $BC = EF = 3 \cdot 5 + 4 = 19$ cm.'
          - problem: 'A pond lies between the points $A$ and $B$. On dry ground a surveyor picks a point $M$. She marks the point $C$ on the line from $A$ through $M$ so that $M$ is the midpoint of $\overline{AC}$, and the point $D$ on the line from $B$ through $M$ so that $M$ is the midpoint of $\overline{BD}$. She measures $CD = 62$ m. How long is $\overline{AB}$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '62'
            solution_sketch: 'The triangles $AMB$ and $CMD$ have $AM = CM$, $BM = DM$ and equal vertical angles at $M$, so they are congruent by SAS. The side $AB$ corresponds to $CD$, so $AB = CD = 62$ m by CPCTC.'
          - problem: 'Write the full proof. In quadrilateral $ABCD$, $AB = AD$ and $CB = CD$. Prove that the diagonal $\overline{AC}$ bisects $\angle BAD$.'
            answer_contract: {"kind":"none"}
            answer: 'angle BAC = angle DAC by CPCTC'
            solution_sketch: '1. $AB = AD$ and $CB = CD$ (given). 2. $AC = AC$ (reflexive property). 3. $\triangle ABC \cong \triangle ADC$ by SSS, from steps 1 and 2. 4. $\angle BAC \cong \angle DAC$ by CPCTC, because they are corresponding angles of the congruent triangles. 5. The ray $AC$ lies inside $\angle BAD$ and splits it into the two congruent angles $\angle BAC$ and $\angle DAC$, so $\overline{AC}$ bisects $\angle BAD$.'
        constraints: 'CPCTC only after a congruence is established; the conclusion names corresponding parts; correspondence by letter order; two surveying contexts; one verdict item and one written proof (the last item)'
      - id: kp3
        name: Two-stage proofs through an auxiliary congruence
        key_prerequisites: [triangle-congruence-criteria, isosceles-equilateral-triangles]
        exemplars:
          - problem: 'In triangle $ABC$, $AB = AC$, and the segment $\overline{AD}$ bisects $\angle BAC$, with $D$ on $\overline{BC}$. Which criterion proves $\triangle ABD \cong \triangle ACD$?'
            answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side","SSS congruence"],["SAS","side-angle-side","side angle side","SAS congruence"],["ASA","angle-side-angle","angle side angle","ASA congruence"],["AAS","angle-angle-side","angle angle side","AAS congruence"],["HL","hypotenuse-leg","hypotenuse leg","HL congruence"]]}
            answer: 'SAS'
            solution_sketch: 'The sides $AB$ and $AC$ are equal, the angles $\angle BAD$ and $\angle CAD$ are equal because $\overline{AD}$ bisects the angle, and $\overline{AD}$ is shared. The angle lies between the two sides in both triangles, so the criterion is SAS.'
          - problem: 'Triangle $ABC$ has $AB = AC$, and $D$ is the point of $\overline{BC}$ where the perpendicular from $A$ lands. The triangles $ABD$ and $ACD$ are congruent, and $m\angle BAC = 64^\circ$. Find $m\angle BAD$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '32'
            solution_sketch: 'By CPCTC the corresponding angles $\angle BAD$ and $\angle CAD$ are equal. Together they make $\angle BAC$, so $m\angle BAD = 64 \div 2 = 32$ degrees.'
          - problem: 'The roof of a shed is an isosceles triangle $ABC$ with equal rafters $AB = AC = 5$ m. A vertical post $\overline{AD}$ runs from the ridge $A$ down to the tie beam $\overline{BC}$ and meets it at a right angle at $D$. The beam is $8$ m long. How far is the foot of the post from the end $B$ of the beam, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4'
            solution_sketch: 'The right triangles $ABD$ and $ACD$ have equal hypotenuses $AB = AC$ and the shared leg $\overline{AD}$, so they are congruent by HL. By CPCTC $BD = CD$, so $BD = 8 \div 2 = 4$ m.'
          - problem: 'In quadrilateral $PQRS$, $\overline{PQ} \parallel \overline{SR}$ and $PQ = SR$, and the diagonal $\overline{QS}$ is drawn. In a proof that $\triangle PQS \cong \triangle RSQ$, which reason gives $\angle PQS \cong \angle RSQ$?'
            answer_contract: {"kind":"label","options":[["vertical angles","vertical","the vertical angles theorem","vertical angles theorem","vertical angles are congruent"],["the reflexive property","reflexive property","reflexive"],["the definition of a midpoint","definition of a midpoint","definition of midpoint","midpoint"],["alternate interior angles","alternate interior","the alternate interior angles theorem","alternate interior angles theorem"]]}
            answer: 'alternate interior angles'
            solution_sketch: 'The diagonal $\overline{QS}$ crosses the parallel lines $PQ$ and $SR$ as a transversal. The angles $\angle PQS$ and $\angle RSQ$ lie between the parallels on opposite sides of the transversal, so they are alternate interior angles and are congruent.'
          - problem: 'The triangles $PQS$ and $RSQ$ in a parallelogram $PQRS$ have been proved congruent, with $P$ corresponding to $R$, $Q$ to $S$ and $S$ to $Q$. $PS = (2x + 1)$ cm and $QR = (3x - 4)$ cm. How long is $\overline{PS}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '11'
            solution_sketch: 'The side $PS$ corresponds to the side $RQ$, so $PS = QR$ by CPCTC. Then $2x + 1 = 3x - 4$ and $x = 5$, so $PS = 2 \cdot 5 + 1 = 11$ cm.'
          - problem: 'A rectangular door frame $ABCD$ is checked by measuring its diagonals. The triangles $ABC$ and $DCB$ are congruent, so $AC = (2x + 3)$ cm equals $BD = (4x - 9)$ cm. How long is the diagonal $\overline{AC}$, in cm?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The diagonals $\overline{AC}$ and $\overline{DB}$ are corresponding sides of the congruent triangles, so $2x + 3 = 4x - 9$ and $x = 6$. Then $AC = 2 \cdot 6 + 3 = 15$ cm.'
          - problem: 'In triangle $ABC$, $AB = AC$ and $M$ is the midpoint of $\overline{BC}$. The triangles $ABM$ and $ACM$ are congruent by SSS, so $\angle AMB \cong \angle AMC$ by CPCTC. Find $m\angle AMB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The point $M$ lies on $\overline{BC}$, so $\angle AMB$ and $\angle AMC$ form a linear pair and sum to $180^\circ$. They are also congruent, so each one measures $180 \div 2 = 90$ degrees, and $\overline{AM}$ is perpendicular to $\overline{BC}$.'
          - problem: 'Write the full proof. In triangle $ABC$, $AB = AC$, and the bisector of $\angle BAC$ meets $\overline{BC}$ at $D$. Prove that $\angle B \cong \angle C$.'
            answer_contract: {"kind":"none"}
            answer: 'angle B = angle C by CPCTC'
            solution_sketch: '1. $AB = AC$ (given). 2. $\angle BAD \cong \angle CAD$, because $\overline{AD}$ bisects $\angle BAC$ (definition of an angle bisector). 3. $AD = AD$ (reflexive property). 4. $\triangle ABD \cong \triangle ACD$ by SAS, since the angle $\angle BAD$ lies between the sides $AB$, $AD$ and the angle $\angle CAD$ lies between the sides $AC$, $AD$. 5. $\angle B \cong \angle C$ by CPCTC, because they are corresponding angles of the congruent triangles.'
        constraints: 'at most two stages: a congruence by a criterion, then a CPCTC conclusion; criterion or reason items, numeric CPCTC conclusions in a shed and a door frame, and one written proof (the last item)'
    diagnostic_exemplar:
      problem: 'Given $\overline{AB} \parallel \overline{DC}$ and $\overline{AB} \cong \overline{DC}$, with the diagonal $\overline{BD}$ drawn, which criterion proves $\triangle ABD \cong \triangle CDB$?'
      answer_contract: {"kind":"label","options":[["SSS","side-side-side","side side side","SSS congruence"],["SAS","side-angle-side","side angle side","SAS congruence"],["ASA","angle-side-angle","angle side angle","ASA congruence"],["AAS","angle-angle-side","angle angle side","AAS congruence"]]}
      answer: 'SAS'
      solution_sketch: 'Alternate interior angles give $\angle ABD \cong \angle CDB$ at the transversal $\overline{BD}$, the diagonal is shared, and $\overline{AB} \cong \overline{DC}$ is given. Two sides and the included angle prove the triangles congruent by SAS.'
