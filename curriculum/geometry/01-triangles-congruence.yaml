  - id: congruence-proofs-cpctc
    name: Congruence Proofs and CPCTC
    core: false                # proof-practice genre; terminal
    difficulty: 0.45
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: triangle-congruence-criteria
        weight: 0.8
        key: true
      - id: writing-geometric-proofs
        weight: 0.7
        key: true
      - id: isosceles-equilateral-triangles
        weight: 0.4
        key: false
      - id: angle-relationships
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Prove triangles congruent using shared parts
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'Given $\overline{AB} \cong \overline{AD}$ and $\overline{CB} \cong \overline{CD}$, prove $\triangle ABC \cong \triangle ADC$.'
            answer: '$\overline{AC} \cong \overline{AC}$ (reflexive), so the triangles are congruent by SSS.'
            solution_sketch: 'Two given pairs of sides plus the shared side $\overline{AC}$ give SSS.'
          - problem: '$M$ is the midpoint of both $\overline{AC}$ and $\overline{BD}$. Prove $\triangle AMB \cong \triangle CMD$.'
            answer: '$\overline{AM} \cong \overline{CM}$ and $\overline{BM} \cong \overline{DM}$ (midpoints); $\angle AMB \cong \angle CMD$ (vertical angles); SAS.'
            solution_sketch: 'Midpoint gives both side pairs; the included angles are vertical angles.'
        constraints: "reasons limited to given, reflexive, midpoint/bisector definitions, vertical angles, then SSS/SAS/ASA/AAS"
      - id: kp2
        name: CPCTC conclusions
        key_prerequisites: [triangle-congruence-criteria]
        exemplars:
          - problem: 'From $\triangle AMB \cong \triangle CMD$ (with $A \leftrightarrow C$, $M \leftrightarrow M$, $B \leftrightarrow D$), what can you conclude about $\overline{AB}$ and $\overline{CD}$, and why?'
            answer: '$\overline{AB} \cong \overline{CD}$ by CPCTC.'
            solution_sketch: '$\overline{AB}$ and $\overline{CD}$ are corresponding parts of the congruent triangles.'
          - problem: 'Given $\overline{AB} \cong \overline{AD}$ and $\overline{CB} \cong \overline{CD}$, prove $\overline{AC}$ bisects $\angle BAD$.'
            answer: '$\triangle ABC \cong \triangle ADC$ by SSS (reflexive $\overline{AC}$); then $\angle BAC \cong \angle DAC$ by CPCTC, so $\overline{AC}$ bisects $\angle BAD$.'
            solution_sketch: 'Prove the triangles congruent first, then read off the corresponding angles.'
        constraints: "CPCTC only after a congruence is established; the conclusion must name corresponding parts"
      - id: kp3
        name: Two-stage proofs through an auxiliary congruence
        key_prerequisites: [triangle-congruence-criteria, isosceles-equilateral-triangles]
        exemplars:
          - problem: 'In isosceles $\triangle ABC$ with $\overline{AB} \cong \overline{AC}$, $M$ is the midpoint of $\overline{BC}$. Prove $\overline{AM} \perp \overline{BC}$.'
            answer: '$\triangle ABM \cong \triangle ACM$ by SSS (given, midpoint, reflexive); $\angle AMB \cong \angle AMC$ by CPCTC, and they form a linear pair, so each is $90^\circ$.'
            solution_sketch: 'Congruent linear-pair angles must each be right angles.'
          - problem: 'Given $\overline{PQ} \parallel \overline{SR}$ and $\overline{PQ} \cong \overline{SR}$, with diagonal $\overline{QS}$ drawn, prove $\overline{PS} \cong \overline{QR}$.'
            answer: '$\angle PQS \cong \angle RSQ$ (alternate interior angles), $\overline{QS} \cong \overline{QS}$; $\triangle PQS \cong \triangle RSQ$ by SAS; $\overline{PS} \cong \overline{QR}$ by CPCTC.'
            solution_sketch: 'Parallel segments give the included angle pair; the diagonal is the shared side.'
        constraints: "at most two stages; every statement carries a reason"
    diagnostic_exemplar:
      problem: 'Given $\overline{AB} \parallel \overline{DC}$ and $\overline{AB} \cong \overline{DC}$, with diagonal $\overline{BD}$ drawn, prove $\overline{AD} \cong \overline{CB}$.'
      answer: '$\angle ABD \cong \angle CDB$ (alternate interior angles from $\overline{AB} \parallel \overline{DC}$); $\overline{BD} \cong \overline{BD}$ (reflexive); so $\triangle ABD \cong \triangle CDB$ by SAS, and $\overline{AD} \cong \overline{CB}$ by CPCTC.'
      solution_sketch: 'The parallel segments give the included angle pair at the transversal $\overline{BD}$; the diagonal is the shared side; CPCTC reads off the conclusion.'
    anki_seeds:
      - front: "CPCTC stands for..."
        back: "Corresponding Parts of Congruent Triangles are Congruent"
        type: basic
      - front: "In two-triangle proofs, a side shared by both triangles is congruent to itself by the..."
        back: "reflexive property"
        type: basic
