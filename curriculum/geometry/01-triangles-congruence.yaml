            answer_contract: {kind: label, options: [['vertical angles'], ['corresponding angles'], ['the reflexive property'], ['the definition of midpoint']]}
            solution_sketch: '$\overline{AC}$ and $\overline{BD}$ intersect at $M$, so $\angle AMB$ and $\angle CMD$ are vertical angles and congruent.'
          - problem: 'A proof that $\triangle ABD \cong \triangle CBD$ uses the step $\overline{BD} \cong \overline{BD}$. Which property justifies that step: the reflexive property, the symmetric property, the transitive property, or the distributive property?'
            answer: 'the reflexive property'
            answer_contract: {kind: label, options: [['the reflexive property'], ['the symmetric property'], ['the transitive property'], ['the distributive property']]}
            solution_sketch: 'A segment shared by both triangles is congruent to itself: the reflexive property.'
