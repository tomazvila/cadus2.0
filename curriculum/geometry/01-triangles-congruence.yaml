          - problem: 'In quadrilateral $ABCD$, $\overline{AB} \cong \overline{CB}$ and $\overline{AD} \cong \overline{CD}$, and diagonal $\overline{BD}$ is drawn. Which of SSS, SAS, ASA, AAS, and HL proves $\triangle ABD \cong \triangle CBD$?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The shared diagonal gives $\overline{BD} \cong \overline{BD}$ (reflexive), so all three pairs of sides match: SSS.'
          - problem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle A \cong \angle D$, $\angle C \cong \angle F$, and $\overline{AB} \cong \overline{DE}$. Which of the five criteria applies: SSS, SAS, ASA, AAS, or HL?'
            answer: 'AAS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The congruent side $\overline{AB}$ lies between $\angle A$ and $\angle B$, not between the two congruent angles $\angle A$ and $\angle C$, so it is non-included: AAS, not ASA.'
          - problem: 'In $\triangle ABC$ with $\overline{AB} \cong \overline{AC}$, the altitude $\overline{AD}$ is drawn to $\overline{BC}$. Which of the five criteria proves $\triangle ABD \cong \triangle ACD$: SSS, SAS, ASA, AAS, or HL?'
            answer: 'HL'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The altitude makes right angles at $D$; the hypotenuses $\overline{AB}$ and $\overline{AC}$ are congruent and the leg $\overline{AD}$ is shared, so HL applies.'
          - problem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle B \cong \angle E$, $\overline{BC} \cong \overline{EF}$, and $\angle C \cong \angle F$. Which of the five criteria applies: SSS, SAS, ASA, AAS, or HL?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS], [HL]]}
            solution_sketch: 'The congruent side $\overline{BC}$ is included between the congruent angles at $B$ and $C$: ASA.'
        constraints: "criteria drawn from SSS, SAS, ASA, AAS, HL; each item needs one deduction first (a shared side, vertical angles, or the angle sum) before the criterion is named, and the choice ranges over all five"
      - id: kp2
        name: Recognize non-criteria
        key_prerequisites: [asa-aas-congruence]
        exemplars:
          - problem: 'Two triangles have all three pairs of corresponding angles congruent (AAA). Must the triangles be congruent?'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'AAA guarantees the same shape (similarity) but not the same size: two equilateral triangles with sides $1$ and $2$ have equal angles but are not congruent.'
          - problem: 'Two triangles agree in two sides and a non-included angle (SSA). Is SSA a valid congruence criterion?'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Keep two sides fixed and swing the non-included angle: it can land at two positions, giving different third sides.'
          - problem: 'Is AAA a valid triangle congruence criterion? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Equal angles only fix the shape; an equilateral triangle with side $1$ and one with side $2$ are both AAA but not congruent.'
          - problem: 'Is SSA a valid triangle congruence criterion? Answer yes or no.'
            answer: 'no'
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'With two sides and the angle not between them, two different triangles can satisfy the same data (the ambiguous case).'
          - problem: 'Two triangles have all three pairs of corresponding angles congruent. What is certainly true of them: they are congruent, they are similar, they have equal perimeters, or they share a side?'
            answer: 'they are similar'
            answer_contract: {kind: label, options: [['they are congruent'], ['they are similar'], ['they have equal perimeters'], ['they share a side']]}
            solution_sketch: 'Equal angles force the same shape (similarity); the sizes can differ.'
          - problem: 'Which of the following is a valid triangle congruence criterion: SSA, AAA, SAS, or none of these?'
            answer: 'SAS'
            answer_contract: {kind: label, options: [[SSA], [AAA], [SAS], ['none of these']]}
            solution_sketch: 'Two sides and the included angle force the third side and both remaining angles, so SAS is valid; SSA and AAA are not.'
        constraints: "AAA and SSA only; ask for the reason, not just yes/no"
      - id: kp3
        name: Write the congruence statement with correct correspondence
        key_prerequisites: [sss-sas-congruence, asa-aas-congruence]
        exemplars:
          - problem: 'Given $\overline{AB} \cong \overline{DE}$, $\overline{BC} \cong \overline{EF}$, and $\overline{AC} \cong \overline{DF}$, the triangles are congruent with correspondence $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Which criterion gives the congruence: SSS, SAS, ASA, or AAS?'
            answer: 'SSS'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'All three side pairs are congruent, so $\triangle ABC \cong \triangle DEF$ by SSS.'
          - problem: 'Given $\angle A \cong \angle D$, $\overline{AB} \cong \overline{DE}$, and $\angle B \cong \angle E$, the triangles are congruent with correspondence $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Which criterion gives the congruence: SSS, SAS, ASA, or AAS?'
            answer: 'ASA'
            answer_contract: {kind: label, options: [[SSS], [SAS], [ASA], [AAS]]}
            solution_sketch: 'The congruent side $\overline{AB}$ is included between the congruent angles, so $\triangle ABC \cong \triangle DEF$ by ASA.'
          - problem: "$\\triangle ABC \\cong \\triangle DEF$. In triangle $ABC$, $AB = 5$, $CA = 6$, and the perimeter of triangle $ABC$ is $19$. Find the length of $EF$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (correspondence from vertex order): the statement $\\triangle ABC \\cong \\triangle DEF$ pairs $A$ with $D$, $B$ with $E$, and $C$ with $F$, so side $EF$ corresponds to side $BC$. Step 2 (perimeter rule): $BC = 19 - 5 - 6 = 8$. Step 3 (corresponding parts of congruent triangles are equal): the length of $EF$ is 8."
          - problem: "$\\triangle PQR \\cong \\triangle STU$. In triangle $PQR$, angle $P$ measures $40^\\circ$, and angle $Q$ measures twice angle $P$. Find the measure of angle $T$."
            answer: "80"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (correspondence from vertex order): the statement $\\triangle PQR \\cong \\triangle STU$ pairs $P$ with $S$, $Q$ with $T$, and $R$ with $U$, so angle $T$ corresponds to angle $Q$. Step 2 (substitution): angle $Q$ measures twice angle $P$, so the measure of angle $Q$ is $2 \\cdot 40 = 80$ degrees. Step 3 (corresponding parts of congruent triangles are equal): the measure of angle $T$ is 80."
        constraints: "vertex order in the statement must respect the correspondence; give the criterion"
    diagnostic_exemplar:
      problem: 'In quadrilateral $PQRS$, $\overline{PQ} \cong \overline{RQ}$ and $\overline{PS} \cong \overline{RS}$, and diagonal $\overline{QS}$ is drawn. State the triangle congruence this gives and its criterion.'
      answer: '$\triangle PQS \cong \triangle RQS$ by SSS'
      answer_contract: {kind: none}
      solution_sketch: 'The shared diagonal gives $\overline{QS} \cong \overline{QS}$ (reflexive), completing three side pairs; the vertex order follows the correspondence $P \leftrightarrow R$.'
    anki_seeds:
      - front: "The five valid triangle congruence criteria are..."
        back: "SSS, SAS, ASA, AAS, HL (right triangles)"
        type: basic
      - front: "Why is SSA not a congruence criterion?"
        back: "Two sides and a non-included angle can produce two different triangles (the ambiguous case)."
        type: basic
      - front: "AAA guarantees triangles are..."
        back: "similar, not necessarily congruent"
        type: basic

  - id: isosceles-equilateral-triangles
    name: Isosceles and Equilateral Triangles
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: triangle-angle-sum
        weight: 0.7
        key: true
      - id: triangle-congruence-criteria
        weight: 0.4
        key: false
      - id: two-step-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Base angles theorem
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'An isosceles triangle has vertex angle $40^\circ$. Find each base angle, in degrees.'
            answer: "70"
            solution_sketch: 'Base angles are equal: $(180 - 40)/2 = 70$.'
          - problem: 'An isosceles triangle has a base angle of $65^\circ$. Find the vertex angle, in degrees.'
            answer: "50"
            solution_sketch: '$180 - 2 \cdot 65 = 50$.'
          - problem: 'An isosceles triangle has vertex angle $90^\circ$. Find each base angle, in degrees.'
            answer: "45"
            solution_sketch: 'The base angles are equal: $(180 - 90)/2 = 45$.'
          - problem: 'An isosceles triangle has a base angle of $72^\circ$. Find the vertex angle, in degrees.'
            answer: "36"
            solution_sketch: '$180 - 2 \cdot 72 = 36$.'
        constraints: "whole-degree angles; vertex angle even so base angles are whole"
      - id: kp2
        name: Equilateral and equiangular triangles
        key_prerequisites: [triangle-angle-sum]
        exemplars:
          - problem: 'What is the measure of each angle of an equilateral triangle, in degrees?'
            answer: "60"
            solution_sketch: 'Equilateral triangles are equiangular, and $180/3 = 60$.'
          - problem: 'An equilateral triangle has sides $3x - 2$ and $x + 10$. Find the side length.'
            answer: "16"
            solution_sketch: '$3x - 2 = x + 10 \Rightarrow x = 6$; side $= 3(6) - 2 = 16$.'
          - problem: 'An equilateral triangle has perimeter $27$. Find the side length.'
            answer: "9"
            solution_sketch: 'All three sides are equal: $27 / 3 = 9$.'
          - problem: 'An equiangular triangle has one side of length $11$. Find its perimeter.'
            answer: "33"
            solution_sketch: 'Equiangular implies equilateral, so all sides are $11$: perimeter $= 33$.'
        constraints: "equilateral iff equiangular; linear side expressions with integer solutions"
      - id: kp3
        name: Converse of the base angles theorem
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'In $\triangle ABC$, $\angle B \cong \angle C$, $AB = 5x - 7$, and $AC = 2x + 8$. Find $AB$.'
            answer: "18"
            solution_sketch: 'Congruent base angles force $AB = AC$: $5x - 7 = 2x + 8 \Rightarrow x = 5$, so $AB = 18$.'
          - problem: 'In $\triangle PQR$, $PQ = PR$ and $m\angle Q = (3x + 5)^\circ$, $m\angle R = (5x - 19)^\circ$. Find $m\angle Q$, in degrees.'
            answer: "41"
            solution_sketch: 'Base angles equal: $3x + 5 = 5x - 19 \Rightarrow x = 12$, so $m\angle Q = 41^\circ$.'
          - problem: 'In $\triangle ABC$, $\angle B \cong \angle C$, $AB = 4x + 3$, and $AC = 3x + 10$. Find $AB$.'
            answer: "31"
            solution_sketch: 'Congruent base angles force $AB = AC$: $4x + 3 = 3x + 10 \Rightarrow x = 7$, so $AB = 31$.'
          - problem: 'In $\triangle DEF$, $DE = DF$ and $m\angle E = (2x + 15)^\circ$, $m\angle F = (x + 35)^\circ$. Find $m\angle E$, in degrees.'
            answer: "55"
            solution_sketch: 'Base angles equal: $2x + 15 = x + 35 \Rightarrow x = 20$, so $m\angle E = 55^\circ$.'
        constraints: "sides opposite congruent angles are congruent; integer solutions"
    diagnostic_exemplar:
      problem: 'An isosceles triangle has vertex angle $(2x)^\circ$ and base angles $(3x + 10)^\circ$ each. Find the vertex angle, in degrees.'
      answer: "40"
      solution_sketch: '$2x + 2(3x + 10) = 180 \Rightarrow 8x + 20 = 180 \Rightarrow x = 20$; vertex $= 40^\circ$.'
    anki_seeds:
      - front: "Base angles theorem: the angles opposite the congruent sides of an isosceles triangle are..."
        back: "congruent"
        type: basic
      - front: "Each angle of an equilateral triangle measures..."
        back: "60 degrees"
        type: basic

  - id: medians-centroids
    name: Medians and Centroids
    core: false                # named terminal triangle theorem
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: segment-angle-addition
        weight: 0.5
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: false
      - id: coordinate-plane
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Medians and midpoints
        key_prerequisites: [segment-angle-addition]
        exemplars:
          - problem: '$\overline{BD}$ is a median of $\triangle ABC$ with $D$ on $\overline{AC}$. If $AC = 18$, find $AD$.'
            answer: "9"
            solution_sketch: 'A median ends at the midpoint of the opposite side.'
          - problem: 'How many medians does a triangle have?'
            answer: "3"
            solution_sketch: 'One median from each of the three vertices.'
          - problem: '$\overline{BD}$ is a median of $\triangle ABC$ with $D$ on $\overline{AC}$. If $AC = 26$, find $DC$.'
            answer: "13"
            solution_sketch: 'The median hits the midpoint: $DC = 26 / 2 = 13$.'
          - problem: '$\overline{AM}$ is a median of $\triangle ABC$ with $M$ on $\overline{BC}$. If $BM = 9$, find $BC$.'
            answer: "18"
            solution_sketch: '$M$ is the midpoint of $\overline{BC}$, so $BC = 2 \cdot 9 = 18$.'
        constraints: "even side lengths so midpoint splits are whole numbers"
      - id: kp2
        name: The centroid divides each median 2:1
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'Median $\overline{AM}$ of $\triangle ABC$ has length $18$, with centroid $G$. Find $AG$.'
            answer: "12"
            solution_sketch: 'The centroid sits $\frac{2}{3}$ of the way from the vertex: $\frac{2}{3} \cdot 18 = 12$.'
          - problem: 'The centroid $G$ lies on median $\overline{AM}$ with $GM = 5$. Give the ordered pair $(AG, AM)$.'
            answer: "(10, 15)"
            solution_sketch: '$AG = 2 \cdot GM = 10$; $AM = AG + GM = 15$.'
          - problem: 'Median $\overline{AM}$ of $\triangle ABC$ has length $24$, with centroid $G$. Find $GM$.'
            answer: "8"
            solution_sketch: '$GM = \frac{1}{3} \cdot AM = \frac{1}{3} \cdot 24 = 8$.'
          - problem: 'The centroid $G$ lies on median $\overline{AM}$ with $AG = 14$. Find $GM$.'
            answer: "7"
            solution_sketch: '$AG$ is twice $GM$: $GM = 14 / 2 = 7$.'
        constraints: "median lengths divisible by 3; vertex-to-centroid is the long piece; two-part answers requested as an ordered pair"
      - id: kp3
        name: Centroid computations with variables and coordinates
        key_prerequisites: [ratios-proportions, coordinate-plane]
        exemplars:
          - problem: 'A triangle has vertices $(0, 0)$, $(6, 0)$, and $(0, 9)$. Find its centroid.'
            answer: "(2, 3)"
            solution_sketch: 'The centroid averages the vertices: $\left(\frac{0+6+0}{3}, \frac{0+0+9}{3}\right)$.'
          - problem: 'On median $\overline{AM}$ with centroid $G$: $AG = 4x$ and $GM = x + 3$. Find $AM$.'
            answer: "18"
            solution_sketch: '$AG = 2 \cdot GM$: $4x = 2x + 6 \Rightarrow x = 3$; $AM = 12 + 6 = 18$.'
          - problem: 'A triangle has vertices $(0, 0)$, $(12, 0)$, and $(0, 6)$. Find its centroid.'
            answer: "(4, 2)"
            solution_sketch: 'Average the vertices: $\left(\frac{0+12+0}{3}, \frac{0+0+6}{3}\right) = (4, 2)$.'
          - problem: 'On median $\overline{AM}$ with centroid $G$: $AG = 3x - 2$ and $GM = x + 4$. Find $AG$.'
            answer: "28"
            solution_sketch: '$AG = 2 \cdot GM$: $3x - 2 = 2x + 8 \Rightarrow x = 10$; $AG = 28$.'
        constraints: "vertex coordinates chosen so the centroid is integral; linear expressions with integer solutions"
    diagnostic_exemplar:
      problem: 'On median $\overline{AM}$ of $\triangle ABC$ with centroid $G$: $AG = 3x$ and $GM = x + 4$. Find $AM$.'
      answer: "36"
      solution_sketch: '$AG = 2 \cdot GM$: $3x = 2x + 8 \Rightarrow x = 8$; $AG = 24$, $GM = 12$, so $AM = 36$.'
    anki_seeds:
      - front: "The centroid divides each median in the ratio ... measured from the vertex"
        back: "2 : 1"
        type: basic
      - front: "The centroid of a triangle with vertices A, B, C has coordinates..."
        back: "the average of the three vertices: ((x1+x2+x3)/3, (y1+y2+y3)/3)"
        type: basic

  - id: bisectors-in-triangles
    name: Bisectors in Triangles
    core: false                # named terminal triangle theorem
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: perpendicular-bisectors
        weight: 0.6
        key: true
      - id: angle-bisectors
        weight: 0.6
        key: true
      - id: triangle-congruence-criteria
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Circumcenter equidistant from the vertices
        key_prerequisites: [perpendicular-bisectors]
        exemplars:
          - problem: 'The perpendicular bisectors of the sides of $\triangle ABC$ meet at $P$ (the circumcenter). If $PA = 13$, find $PC$.'
            answer: "13"
            solution_sketch: 'The circumcenter is equidistant from all three vertices.'
          - problem: "The perpendicular bisectors of a triangle's three edges meet at one point P. Which triangle parts is P the same distance from?"
            answer: "vertices"
            answer_contract: {"kind": "label", "options": [["vertices"], ["sides"], ["angles"], ["midpoints"]]}
            solution_sketch: "Step 1: The perpendicular-bisector theorem says each point on a perpendicular bisector of a segment is equally far from the two endpoints of that segment. Step 2: The three perpendicular bisectors of a triangle are concurrent at the circumcenter, so P is equally far from all three vertices. Step 3: The option sides comes from wrongly replacing vertices with sides in the equidistance statement. The option angles comes from treating angles as points to measure equal distances to. The option midpoints comes from confusing the endpoints of the triangle with the midpoints of its edges. The correct answer is vertices."
          - problem: '$P$ is the circumcenter of $\triangle RST$ with $PR = 6.5$. Find $PS$.'
            answer: "6.5"
            solution_sketch: 'The circumcenter is equidistant from all three vertices, so $PS = PR = 6.5$.'
          - problem: '$Q$ is the circumcenter of $\triangle UVW$ with $QV = 10$. Find $QW$.'
            answer: "10"
            solution_sketch: 'Equidistant from the vertices: $QW = QV = 10$.'
        constraints: "concurrency stated; read off equidistance; conceptual items are answered with one word"
      - id: kp2
        name: Incenter equidistant from the sides
        key_prerequisites: [angle-bisectors]
        exemplars:
          - problem: 'The angle bisectors of $\triangle ABC$ meet at $I$ (the incenter). The distance from $I$ to side $\overline{AB}$ is $4$. Find the distance from $I$ to side $\overline{BC}$.'
            answer: "4"
            solution_sketch: 'The incenter is equidistant from all three sides.'
          - problem: '$I$ is the incenter of $\triangle DEF$. The distance from $I$ to side $\overline{DE}$ is $6$. Find the distance from $I$ to side $\overline{DF}$.'
            answer: "6"
            solution_sketch: 'The incenter is equidistant from all three sides.'
          - problem: '$I$ is the incenter of $\triangle JKL$. The distance from $I$ to side $\overline{JK}$ is $3.5$. Find the distance from $I$ to side $\overline{KL}$.'
            answer: "3.5"
            solution_sketch: 'Equidistant from the sides: the distance to $\overline{KL}$ is also $3.5$.'
          - problem: "The three angle bisectors of a triangle meet at one point I. Each distance from I is measured perpendicular to a line that bounds the triangle. What is I the same distance from?"
            answer: "sides"
            answer_contract: {"kind": "label", "options": [["sides"], ["vertices"], ["midpoints"], ["arcs"]]}
            solution_sketch: "Step 1: The three angle bisectors of a triangle concur at the incenter, so point I is the incenter of the triangle. Step 2: An angle bisector is the set of points at equal perpendicular distance from the two lines of the angle, so I has one common perpendicular distance to all three lines of the triangle. Step 3: Wrong choices: vertices is the circumcenter property, which is equidistant from the corners; midpoints confuses the angle bisectors with the medians; arcs is not a set of points tied to this concurrency. The answer is sides."
        constraints: "distances measured perpendicular to the sides; conceptual items are answered with one word"
      - id: kp3
        name: Concurrency points with variables
        key_prerequisites: [perpendicular-bisectors, angle-bisectors]
        exemplars:
          - problem: '$P$ is the circumcenter of $\triangle ABC$ with $PA = 5x - 8$ and $PB = 3x + 4$. Find $PA$.'
            answer: "22"
            solution_sketch: '$5x - 8 = 3x + 4 \Rightarrow x = 6$; $PA = 22$.'
          - problem: '$I$ is the incenter of $\triangle DEF$; its distances to sides $\overline{DE}$ and $\overline{EF}$ are $2x + 3$ and $4x - 9$. Find the common distance.'
            answer: "15"
            solution_sketch: '$2x + 3 = 4x - 9 \Rightarrow x = 6$; distance $= 15$.'
          - problem: '$P$ is the circumcenter of $\triangle ABC$ with $PA = 6x + 5$ and $PC = 4x + 15$. Find $PA$.'
            answer: "35"
            solution_sketch: '$6x + 5 = 4x + 15 \Rightarrow x = 5$; $PA = 35$.'
          - problem: '$I$ is the incenter of $\triangle RST$; its distances to sides $\overline{RS}$ and $\overline{ST}$ are $3x - 4$ and $2x + 6$. Find the common distance.'
            answer: "26"
            solution_sketch: '$3x - 4 = 2x + 6 \Rightarrow x = 10$; distance $= 26$.'
        constraints: "linear expressions with integer solutions; equidistance supplies the equation"
    diagnostic_exemplar:
      problem: '$G$ is the circumcenter of $\triangle ABC$ with $GA = 7x - 9$ and $GB = 4x + 12$. Find $GA$.'
      answer: "40"
      solution_sketch: '$7x - 9 = 4x + 12 \Rightarrow x = 7$; $GA = 40$.'
    anki_seeds:
      - front: "The circumcenter is the concurrency point of the ... and is equidistant from the vertices"
        back: "perpendicular bisectors of the sides"
        type: basic
      - front: "The incenter is the concurrency point of the ... and is equidistant from the sides"
        back: "angle bisectors"
        type: basic

