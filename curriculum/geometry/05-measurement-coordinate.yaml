        key_prerequisites: [triangle-area]
        exemplars:
          - problem: 'A triangular prism has a base triangle with base $6$ and height $4$, and the prism is $10$ long. Find its volume.'
            answer: "120"
            solution_sketch: 'Base area $= \frac{1}{2} \cdot 6 \cdot 4 = 12$; $V = Bh = 12 \cdot 10 = 120$.'
          - problem: 'A prism''s base is a right triangle with legs $3$ and $4$, and the prism is $7$ long. Find its volume.'
            answer: "42"
            solution_sketch: 'Base area $= 6$; $V = 6 \cdot 7 = 42$.'
        constraints: "triangle dimensions with even products; whole answers"
      - id: kp3
        name: Any prism is base area times height
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        exemplars:
          - problem: 'A prism has base area $22$ and height $5$. Find its volume.'
            answer: "110"
          - problem: 'A prism''s base is a trapezoid with bases $4$ and $8$ and height $3$, and the prism is $6$ long. Find its volume.'
            answer: "108"
            solution_sketch: 'Base area $= \frac{1}{2}(12)(3) = 18$; $V = 18 \cdot 6 = 108$.'
        constraints: "V = (base area) x height; whole numbers"
    diagnostic_exemplar:
      problem: 'A prism''s base is a trapezoid with bases $5$ and $9$ and height $4$, and the prism is $7$ long. Find its volume.'
      answer: "196"
      solution_sketch: 'Base area $= \frac{1}{2}(5 + 9) \cdot 4 = 28$; $V = 28 \cdot 7 = 196$.'
    anki_seeds:
      - front: "Volume of a rectangular prism:"
        back: "length x width x height"
        type: basic
      # Cross-sections as declarative recall (recorded decision): the visualisation skill
      # cannot be graded from typed answers, but the facts are worth retaining.
      - front: "A cross-section of a prism taken parallel to its base is..."
        back: "congruent to the base — the cross-section is uniform along the prism, which is why V = (base area) x height."
        type: basic

