  - id: composite-transformations
    name: Compositions of Transformations
    core: false                # terminal transformation destination; nothing downstream consumes compositions, and its reflection/rotation prerequisites are supplemental (rule 1)
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: rotations-coordinate-plane
        weight: 0.7
        key: true
      - id: reflections-coordinate-plane
        weight: 0.6
        key: true
      - id: translations-coordinate-plane
        weight: 0.5
        key: false
      - id: rigid-motions-congruence
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Apply a sequence of transformations
        key_prerequisites: [rotations-coordinate-plane, reflections-coordinate-plane, translations-coordinate-plane]
        exemplars:
          - problem: 'Reflect $(3, 1)$ over the y-axis, then apply the translation $(x, y) \to (x + 2, y - 1)$. Give the final image.'
            answer: "(-1, 0)"
            solution_sketch: 'Reflection: $(3, 1) \to (-3, 1)$. Translation: $(-3 + 2, 1 - 1) = (-1, 0)$.'
          - problem: 'Rotate $(2, -1)$ by $90^\circ$ counterclockwise about the origin, then reflect the result over the x-axis. Give the final image.'
            answer: "(1, -2)"
            solution_sketch: 'Rotation: $(x, y) \to (-y, x)$ gives $(1, 2)$. Reflection: $(1, 2) \to (1, -2)$.'
          - problem: 'Apply the translation $(x, y) \to (x - 1, y + 3)$ to $(4, -2)$, then rotate the result $180^\circ$ about the origin. Give the final image.'
            answer: "(-3, -1)"
            solution_sketch: 'Translation: $(3, 1)$. Rotation $180^\circ$: $(-3, -1)$.'
        constraints: "two steps from the single-motion menus (axis/y=x reflections, quarter-turn rotations about the origin, integer translations); apply strictly in the stated order — vary the order across problems since composition is not commutative; integer coordinates throughout"
      - id: kp2
        name: Find the single equivalent motion
        key_prerequisites: [rotations-coordinate-plane, reflections-coordinate-plane]
        exemplars:
          - problem: 'Reflecting over the x-axis and then over the y-axis is equivalent to a single rotation about the origin. Through how many degrees?'
            answer: "180"
            solution_sketch: '$(x, y) \to (x, -y) \to (-x, -y)$, which is the $180^\circ$ rotation.'
          - problem: 'The composition of reflections over the parallel lines $y = 1$ and then $y = 4$ is a vertical translation $(x, y) \to (x, y + k)$. Find $k$.'
            answer: "6"
            solution_sketch: 'First reflection: $y \to 2 - y$; second: $y \to 8 - (2 - y) = y + 6$. In general, twice the distance between the lines.'
          - problem: 'A $90^\circ$ counterclockwise rotation about the origin is followed by a $180^\circ$ rotation about the origin. The composition is a single counterclockwise rotation through how many degrees?'
            answer: "270"
            solution_sketch: 'Rotations about the same center compose by adding angles: $90 + 180 = 270$.'
        constraints: "compositions with clean classifications: two axis reflections (rotation by 180), reflections over two parallel horizontal or vertical lines (translation by twice the gap), two origin rotations (add the angles mod 360); the answer is a single number — degrees or the translation amount"
      - id: kp3
        name: Glide reflections
        key_prerequisites: [reflections-coordinate-plane, translations-coordinate-plane]
        exemplars:
          - problem: 'A glide reflection reflects over the x-axis, then translates by $(x, y) \to (x + 4, y)$. Find the image of $(2, 3)$.'
            answer: "(6, -3)"
            solution_sketch: 'Reflection: $(2, -3)$. Glide along the mirror: $(6, -3)$.'
          - problem: 'A glide reflection reflects over the y-axis, then translates by $(x, y) \to (x, y - 3)$. Find the image of $(-4, 2)$.'
            answer: "(4, -1)"
            solution_sketch: 'Reflection: $(4, 2)$. Translation: $(4, -1)$.'
          - problem: 'A segment of length $7$ undergoes a glide reflection. What is the length of its image?'
            answer: "7"
            solution_sketch: 'A glide reflection composes two rigid motions, so it is itself a rigid motion and preserves lengths.'
        constraints: "mirror is a coordinate axis and the translation is parallel to that axis (the defining condition); integer coordinates; include an invariance question — glide reflections are rigid motions"
    diagnostic_exemplar:
      problem: 'A glide reflection reflects over the $x$-axis and then translates by $(x, y) \to (x + 5, y)$. Find the image of $(-2, 4)$.'
      answer: '(3, -4)'
      solution_sketch: 'Reflect: $(-2, 4) \mapsto (-2, -4)$; then translate parallel to the mirror line: $(3, -4)$.'
    anki_seeds:
      - front: "A glide reflection is the composition of..."
        back: "a reflection and a translation parallel to the mirror line"
        type: basic
      - front: "Reflecting over two parallel lines a distance d apart is equivalent to..."
        back: "a translation of 2d perpendicular to the lines"
        type: basic
      - front: "Reflecting over two lines meeting at angle theta is equivalent to..."
        back: "a rotation of 2 x theta about their intersection point"
        type: basic

