unit: measurement-coordinate
course: geometry
module: "Measurement & Coordinate Geometry"
topics:
  - id: triangle-area
    name: Areas of Triangles and Rectangles
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Rectangle and triangle area formulas
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Find the area of a rectangle with sides $8$ and $5$.'
            answer: "40"
          - problem: 'Find the area of a triangle with base $10$ and height $7$.'
            answer: "35"
            solution_sketch: '$\frac{1}{2} \cdot 10 \cdot 7 = 35$.'
        constraints: "whole-number dimensions; even base-height products for triangles"
      - id: kp2
        name: Use the height, not a slant side
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A triangle has base $24$, sides $13$ and $13$, and the height to that base is $5$. Find its area.'
            answer: "60"
            solution_sketch: 'Only the base and its height matter: $\frac{1}{2} \cdot 24 \cdot 5 = 60$.'
          - problem: 'A right triangle has legs $9$ and $4$. Find its area.'
            answer: "18"
            solution_sketch: 'The legs are a base-height pair: $\frac{1}{2} \cdot 9 \cdot 4 = 18$.'
        constraints: "height given explicitly or as a leg; slant sides appear as distractors"
      - id: kp3
        name: Work backwards from an area
        key_prerequisites: [evaluating-expressions, multiplying-fractions]
        exemplars:
          - problem: 'A triangle has area $42$ and base $12$. Find its height.'
            answer: "7"
            solution_sketch: '$\frac{1}{2} \cdot 12 \cdot h = 42 \Rightarrow h = 7$.'
          - problem: 'A rectangle has area $72$ and one side of length $9$. Find the other side.'
            answer: "8"
        constraints: "divide out cleanly to whole numbers"
    diagnostic_exemplar:
      problem: 'A triangle has base $16$, sides $17$ and $17$, and the height to that base is $15$. Find its area.'
      answer: "120"
      solution_sketch: 'Only the base and its height matter: $\frac{1}{2} \cdot 16 \cdot 15 = 120$.'
    anki_seeds:
      - front: "Area of a triangle:"
        back: "(1/2) x base x height"
        type: basic
      - front: "The height in the triangle area formula must be ... to the base."
        back: "perpendicular"
        type: basic

  - id: parallelogram-trapezoid-area
    name: Areas of Parallelograms and Trapezoids
    core: true
    difficulty: 0.30
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: triangle-area
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Parallelogram area
        key_prerequisites: [triangle-area]
        exemplars:
          - problem: 'Find the area of a parallelogram with base $9$ and height $6$.'
            answer: "54"
          - problem: 'Find the area of a parallelogram with base $12$ and height $8$.'
            answer: "96"
            solution_sketch: '$A = bh = 96$.'
        constraints: "height given explicitly (never assume a slant side is the height)"
      - id: kp2
        name: Trapezoid area
        key_prerequisites: [triangle-area, multiplying-fractions]
        exemplars:
          - problem: 'Find the area of a trapezoid with bases $7$ and $13$ and height $6$.'
            answer: "60"
            solution_sketch: '$\frac{1}{2}(7 + 13) \cdot 6 = 60$.'
          - problem: 'Find the area of a trapezoid with bases $5$ and $11$ and height $4$.'
            answer: "32"
            solution_sketch: '$\frac{1}{2}(16) \cdot 4 = 32$.'
        constraints: "base sums even, so areas are whole"
      - id: kp3
        name: Rhombus and kite area from diagonals
        key_prerequisites: [triangle-area, multiplying-fractions]
        exemplars:
          - problem: 'Find the area of a rhombus with diagonals $10$ and $14$.'
            answer: "70"
            solution_sketch: '$\frac{1}{2} d_1 d_2 = \frac{1}{2} \cdot 10 \cdot 14 = 70$.'
          - problem: 'Find the area of a kite with diagonals $6$ and $9$.'
            answer: "27"
            solution_sketch: '$\frac{1}{2} \cdot 6 \cdot 9 = 27$.'
        constraints: "diagonal products even, so areas are whole"
    diagnostic_exemplar:
      problem: 'A trapezoid with bases $6$ and $10$ and height $5$ has the same area as a rhombus with diagonals $8$ and $d$. Find $d$.'
      answer: '10'
      solution_sketch: 'Trapezoid area $= \frac{1}{2}(6 + 10)(5) = 40$; rhombus area $= \frac{1}{2}(8)(d) = 40$ gives $d = 10$.'
    anki_seeds:
      - front: "Area of a trapezoid:"
        back: "(1/2)(b1 + b2) x height"
        type: basic
      - front: "Area of a rhombus (or kite) from its diagonals:"
        back: "(1/2) x d1 x d2"
        type: basic

  - id: area-triangles-quadrilaterals
    name: Areas of Triangles and Quadrilaterals
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: triangle-area
        weight: 0.8
        key: true
      - id: parallelogram-trapezoid-area
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Composite figures
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        exemplars:
          - problem: 'An L-shaped region is the union of an $8 \times 5$ rectangle and a non-overlapping $4 \times 3$ rectangle. Find its total area.'
            answer: "52"
            solution_sketch: '$40 + 12 = 52$.'
          - problem: 'A figure consists of a $10 \times 6$ rectangle topped by a triangle with base $10$ and height $4$. Find its total area.'
            answer: "80"
            solution_sketch: '$60 + \frac{1}{2} \cdot 10 \cdot 4 = 80$.'
        constraints: "composites decompose into two rectangles or a rectangle and triangle"
      - id: kp2
        name: Heights via the Pythagorean theorem
        key_prerequisites: [triangle-area, pythagorean-theorem]
        exemplars:
          - problem: 'A triangle has sides $5$, $5$, and base $6$. Find its area.'
            answer: "12"
            solution_sketch: 'The height to the base is $\sqrt{5^2 - 3^2} = 4$; area $= \frac{1}{2} \cdot 6 \cdot 4 = 12$.'
          - problem: 'An isosceles trapezoid has legs $5$ and bases $10$ and $16$. Find its area.'
            answer: "52"
            solution_sketch: 'Overhang $= \frac{16 - 10}{2} = 3$; height $= \sqrt{5^2 - 3^2} = 4$; area $= \frac{1}{2}(26)(4) = 52$.'
        constraints: "isosceles heights via Pythagorean triples on half the base or the overhang"
      - id: kp3
        name: Working backwards from areas
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        exemplars:
          - problem: 'A trapezoid has area $60$, with bases $7$ and $13$. Find its height.'
            answer: "6"
            solution_sketch: '$\frac{1}{2}(20)h = 60 \Rightarrow h = 6$.'
          - problem: 'A rhombus has area $96$ and one diagonal of length $12$. Find the other diagonal.'
            answer: "16"
            solution_sketch: '$\frac{1}{2} \cdot 12 \cdot d = 96 \Rightarrow d = 16$.'
          - problem: 'A parallelogram has area $91$ and base $13$. Find its height.'
            answer: "7"
        constraints: "divide out cleanly to whole numbers"
    diagnostic_exemplar:
      problem: 'A triangle has sides $10$, $10$, and base $12$. Find its area.'
      answer: "48"
      solution_sketch: 'Height $= \sqrt{10^2 - 6^2} = 8$; area $= \frac{1}{2} \cdot 12 \cdot 8 = 48$.'
    anki_seeds:
      - front: "Strategy for the area of a composite figure:"
        back: "split it into rectangles and triangles, then add (or subtract) the pieces"
        type: basic
      - front: "Height of an isosceles triangle with equal sides s and base b:"
        back: "sqrt(s^2 - (b/2)^2)"
        type: basic

  - id: composite-figure-areas
    name: Composite and Shaded Areas
    core: false                # applications leaf topic
    difficulty: 0.44
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.7
        key: true
      - id: circle-area-circumference
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Figures combining polygons and semicircles
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A figure is a $10 \times 4$ rectangle with a semicircle of diameter $4$ attached to one short side. Find its total area (exact).'
            answer: '$40 + 2\pi$'
            solution_sketch: 'Rectangle $40$ plus semicircle $\frac{1}{2}\pi \cdot 2^2 = 2\pi$.'
          - problem: 'A running track encloses a $100 \times 40$ rectangle with a semicircle of diameter $40$ on each end. Find the enclosed area (exact).'
            answer: '$4000 + 400\pi$'
            solution_sketch: 'Rectangle $4000$; the two semicircles form a circle of radius $20$: $400\pi$.'
        constraints: "semicircle diameters match a side; exact pi answers"
      - id: kp2
        name: Shaded regions by subtraction
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A circle of radius $5$ is inscribed in a square of side $10$. Find the area inside the square but outside the circle (exact).'
            answer: '$100 - 25\pi$'
            solution_sketch: 'Square minus circle: $100 - 25\pi$.'
          - problem: 'Find the area of the ring (annulus) between concentric circles of radii $5$ and $3$ (exact).'
            answer: '$16\pi$'
            solution_sketch: '$25\pi - 9\pi = 16\pi$.'
        constraints: "outer area minus inner area; exact answers"
      - id: kp3
        name: Multi-piece decompositions
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A square of side $8$ has a quarter circle of radius $8$ removed (centered at one corner). Find the remaining area (exact).'
            answer: '$64 - 16\pi$'
            solution_sketch: 'Quarter circle $= \frac{1}{4} \cdot 64\pi = 16\pi$; $64 - 16\pi$.'
          - problem: 'A trapezoid with bases $8$ and $12$ and height $6$ has a triangular notch of base $4$ and height $3$ removed. Find the remaining area.'
            answer: "54"
            solution_sketch: '$\frac{1}{2}(20)(6) - \frac{1}{2}(4)(3) = 60 - 6 = 54$.'
        constraints: "at most two pieces removed; results stay positive"
    diagnostic_exemplar:
      problem: 'A square of side $8$ has a semicircle of diameter $8$ removed from it (the semicircle lies inside the square with its diameter along one side). Find the remaining area (exact, in terms of $\pi$).'
      answer: '$64 - 8\pi$'
      solution_sketch: 'Square $64$; semicircle of radius $4$ has area $\frac{1}{2}\pi(16) = 8\pi$; subtract.'
    anki_seeds:
      - front: "Area of an annulus (ring) with outer radius R and inner radius r:"
        back: "pi (R^2 - r^2)"
        type: basic
      - front: "Shaded-region strategy when one figure sits inside another:"
        back: "outer area minus inner area"
        type: basic

  - id: area-regular-polygons
    name: Areas of Regular Polygons
    core: false                # applications leaf topic
    difficulty: 0.46
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.6
        key: true
      - id: special-right-triangles
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Area from apothem and perimeter
        key_prerequisites: [area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A regular polygon has perimeter $60$ and apothem $9$. Find its area.'
            answer: "270"
            solution_sketch: '$A = \frac{1}{2} a P = \frac{1}{2} \cdot 9 \cdot 60 = 270$.'
          - problem: 'A regular polygon has area $168$ and apothem $7$. Find its perimeter.'
            answer: "48"
            solution_sketch: '$\frac{1}{2} \cdot 7 \cdot P = 168 \Rightarrow P = 48$.'
        constraints: "give perimeter and apothem as numbers (no over-specified side counts); clean products"
      - id: kp2
        name: Regular hexagons and equilateral triangles
        key_prerequisites: [area-triangles-quadrilaterals, special-right-triangles]
        exemplars:
          - problem: 'Find the area of an equilateral triangle with side $6$ (exact).'
            answer: "9*sqrt(3)"
            solution_sketch: '$A = \frac{\sqrt{3}}{4} s^2 = \frac{\sqrt{3}}{4} \cdot 36 = 9\sqrt{3}$.'
          - problem: 'Find the area of a regular hexagon with side $4$ (exact).'
            answer: "24*sqrt(3)"
            solution_sketch: 'Six equilateral triangles: $6 \cdot \frac{\sqrt{3}}{4} \cdot 16 = 24\sqrt{3}$.'
          - problem: 'Find the area of a regular hexagon with side $6$ (exact).'
            answer: "54*sqrt(3)"
            solution_sketch: '$6 \cdot \frac{\sqrt{3}}{4} \cdot 36 = 54\sqrt{3}$.'
        constraints: "exact radical answers written as k*sqrt(n); hexagon = six equilateral triangles"
      - id: kp3
        name: Apothems via special right triangles
        key_prerequisites: [area-triangles-quadrilaterals, special-right-triangles]
        exemplars:
          - problem: 'Find the apothem of a regular hexagon with side $6$ (exact).'
            answer: "3*sqrt(3)"
            solution_sketch: 'The apothem is the height of an equilateral triangle of side $6$: $\frac{6\sqrt{3}}{2} = 3\sqrt{3}$.'
          - problem: 'A square has side $10$. Find its apothem.'
            answer: "5"
            solution_sketch: 'The apothem of a square is half its side.'
        constraints: "restrict to squares, equilateral triangles, and hexagons so 30-60-90 or 45-45-90 triangles suffice"
    diagnostic_exemplar:
      problem: 'Find the apothem of a regular hexagon with side $6$, then use it with the perimeter to find the area of the hexagon. Give the area (exact, in simplest radical form).'
      answer: '54*sqrt(3)'
      solution_sketch: 'The apothem is the height of an equilateral triangle of side $6$ split in half: $3\sqrt{3}$. Area $= \frac{1}{2}ap = \frac{1}{2}(3\sqrt{3})(36) = 54\sqrt{3}$.'
    anki_seeds:
      - front: "Area of a regular polygon with apothem a and perimeter P:"
        back: "(1/2) x a x P"
        type: basic
      - front: "A regular hexagon with side s decomposes into..."
        back: "six equilateral triangles of side s"
        type: basic

  - id: distance-midpoint-formulas
    name: Distance and Midpoint Formulas
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: square-roots
        weight: 0.4
        key: false
      - id: simplifying-radicals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Distance between two points
        key_prerequisites: [pythagorean-theorem, coordinate-plane]
        exemplars:
          - problem: 'Find the distance between $(1, 2)$ and $(4, 6)$.'
            answer: "5"
            solution_sketch: '$\sqrt{3^2 + 4^2} = 5$.'
          - problem: 'Find the distance between $(-2, 3)$ and $(3, -9)$.'
            answer: "13"
            solution_sketch: '$\sqrt{5^2 + 12^2} = 13$.'
        constraints: "coordinate differences form Pythagorean triples"
      - id: kp2
        name: Midpoint and missing endpoint
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Find the midpoint of the segment from $(2, -4)$ to $(8, 10)$.'
            answer: "(5, 3)"
            solution_sketch: 'Average each coordinate: $\left(\frac{2+8}{2}, \frac{-4+10}{2}\right)$.'
          - problem: '$M(1, 2)$ is the midpoint of $\overline{AB}$ with $A(-3, 6)$. Find $B$.'
            answer: "(5, -2)"
            solution_sketch: '$B = (2 \cdot 1 - (-3),\ 2 \cdot 2 - 6) = (5, -2)$.'
        constraints: "coordinate sums even so midpoints are integer points"
      - id: kp3
        name: Distances with radical answers
        key_prerequisites: [pythagorean-theorem, simplifying-radicals]
        exemplars:
          - problem: 'Find the distance between $(0, 0)$ and $(4, 6)$, in simplest radical form.'
            answer: "2*sqrt(13)"
            solution_sketch: '$\sqrt{16 + 36} = \sqrt{52} = 2\sqrt{13}$.'
          - problem: 'Find the distance between $(-1, 2)$ and $(3, 6)$, in simplest radical form.'
            answer: "4*sqrt(2)"
            solution_sketch: '$\sqrt{4^2 + 4^2} = \sqrt{32} = 4\sqrt{2}$.'
        constraints: "radicands with a perfect-square factor; answers in simplest radical form, written as k*sqrt(n)"
    diagnostic_exemplar:
      problem: 'Find the distance from the midpoint of the segment joining $(2, -4)$ and $(8, 10)$ to the point $(3, 7)$, in simplest radical form.'
      answer: '2*sqrt(5)'
      solution_sketch: 'Midpoint $= (5, 3)$; distance $= \sqrt{(5-3)^2 + (3-7)^2} = \sqrt{20} = 2\sqrt{5}$.'
    anki_seeds:
      - front: 'Distance formula between $(x_1, y_1)$ and $(x_2, y_2)$:'
        back: '$\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$'
        type: basic
      - front: 'Midpoint formula between $(x_1, y_1)$ and $(x_2, y_2)$:'
        back: '$\left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right)$'
        type: basic

  - id: partitioning-line-segments
    name: Partitioning Line Segments
    core: false                # midpoint generalization with no in-tree consumer; a coordinate-geometry destination, not machinery
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Partition points with integer coordinates
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P$ lies on the directed segment from $A(1, 2)$ to $B(7, 11)$ so that $AP : PB = 2 : 1$. Find $P$.'
            answer: "(5, 8)"
            solution_sketch: '$P = A + \frac{2}{3}(B - A) = (1 + \frac{2}{3} \cdot 6,\ 2 + \frac{2}{3} \cdot 9) = (5, 8)$.'
          - problem: 'Point $P$ lies on the directed segment from $A(-3, 2)$ to $B(5, -6)$ so that $AP : PB = 3 : 1$. Find $P$.'
            answer: "(3, -4)"
            solution_sketch: '$P = A + \frac{3}{4}(B - A) = (-3 + 6,\ 2 - 6)$.'
          - problem: 'Point $P$ lies on the directed segment from $A(0, 4)$ to $B(8, 0)$ so that $AP : PB = 1 : 3$. Find $P$.'
            answer: "(2, 3)"
            solution_sketch: '$P = A + \frac{1}{4}(B - A) = (0 + 2,\ 4 - 1)$.'
        constraints: "ratio m:n with m+n dividing both coordinate differences so P has integer coordinates; direction A to B stated explicitly; answer as an ordered pair"
      - id: kp2
        name: Partition points with fractional coordinates
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P$ lies on the directed segment from $A(1, 1)$ to $B(4, 3)$ so that $AP : PB = 1 : 2$. Find $P$ (exact coordinates).'
            answer: "(2, 5/3)"
            solution_sketch: '$P = A + \frac{1}{3}(B - A) = (1 + 1,\ 1 + \frac{2}{3}) = (2, \frac{5}{3})$.'
          - problem: 'Point $P$ lies on the directed segment from $A(-2, 3)$ to $B(3, -1)$ so that $AP : PB = 3 : 2$. Find $P$ (exact coordinates).'
            answer: "(1, 3/5)"
            solution_sketch: '$P = A + \frac{3}{5}(B - A) = (-2 + 3,\ 3 - \frac{12}{5}) = (1, \frac{3}{5})$.'
        constraints: "coordinates that do not divide evenly; answers as ordered pairs with exact fractions, never decimals"
      - id: kp3
        name: Recover the ratio or an endpoint
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P(3, 3)$ lies on the directed segment from $A(1, 2)$ to $B(7, 5)$. Find the ratio $AP/PB$ as a fraction.'
            answer: "1/2"
            solution_sketch: '$P - A = (2, 1) = \frac{1}{3}(B - A)$, so $AP : PB = 1 : 2$ and $AP/PB = \frac{1}{2}$.'
          - problem: 'Point $P(3, 1)$ divides the directed segment from $A(-1, -3)$ to $B$ so that $AP : PB = 2 : 3$. Find $B$.'
            answer: "(9, 7)"
            solution_sketch: '$P - A = (4, 4) = \frac{2}{5}(B - A)$, so $B - A = (10, 10)$ and $B = (9, 7)$.'
        constraints: "collinear points guaranteed; ratio answers as a single reduced fraction AP/PB, endpoint answers as ordered pairs; integer data"
    diagnostic_exemplar:
      problem: 'Point $P(1, 3)$ divides the directed segment from $A(-3, 1)$ to $B$ so that $AP : PB = 2 : 1$. Find $B$.'
      answer: "(3, 4)"
      solution_sketch: '$P - A = (4, 2) = \frac{2}{3}(B - A)$, so $B - A = (6, 3)$ and $B = (3, 4)$.'
    anki_seeds:
      - front: 'Point dividing the directed segment from A to B in the ratio m:n:'
        back: 'P = A + (m/(m+n))(B - A)'
        type: basic
      - front: "The midpoint is the partition-formula case m:n = ..."
        back: "1:1"
        type: basic

  - id: translations-coordinate-plane
    name: Translations in the Coordinate Plane
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Apply a translation rule
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Apply the translation $(x, y) \to (x + 3, y - 2)$ to the point $(1, 4)$.'
            answer: "(4, 2)"
          - problem: 'Translate $(-2, 5)$ four units right and three units down.'
            answer: "(2, 2)"
            solution_sketch: '$(-2 + 4, 5 - 3) = (2, 2)$.'
        constraints: "integer coordinates and shifts"
      - id: kp2
        name: Find the translation rule
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A translation maps $(3, 1)$ to $(7, -2)$. Its rule has the form $(x, y) \to (x + a, y + b)$. Give the ordered pair $(a, b)$.'
            answer: "(4, -3)"
            solution_sketch: '$a = 7 - 3 = 4$, $b = -2 - 1 = -3$.'
          - problem: 'The translation $(x, y) \to (x - 5, y + 1)$ maps some point to $(0, 3)$. Find the original point.'
            answer: "(5, 2)"
            solution_sketch: 'Reverse the shift: $(0 + 5, 3 - 1)$.'
        constraints: "subtract coordinates to find the shift; ask for the shift as an ordered pair; include reverse questions"
      - id: kp3
        name: Translations are rigid motions
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A segment of length $5$ is translated by $(x, y) \to (x + 7, y - 4)$. What is the length of its image?'
            answer: "5"
            solution_sketch: 'Translations preserve distance.'
          - problem: 'A triangle with area $12$ is translated $6$ units up. What is the area of its image?'
            answer: "12"
        constraints: "conceptual invariance questions; lengths, angles, and areas preserved"
    diagnostic_exemplar:
      problem: 'The translation $(x, y) \to (x + 4, y - 2)$ maps some point to $(1, 5)$. Find the original point.'
      answer: "(-3, 7)"
      solution_sketch: 'Reverse the shift: $(1 - 4, 5 + 2) = (-3, 7)$.'
    anki_seeds:
      - front: "The translation rule 'a right, b up' in coordinates:"
        back: "(x, y) -> (x + a, y + b)"
        type: basic
