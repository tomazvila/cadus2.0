unit: measurement-coordinate
course: geometry
module: "Measurement & Coordinate Geometry"
topics:
  - id: triangle-area
    name: Areas of Triangles and Rectangles
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Rectangle and triangle area formulas
        key_prerequisites: [evaluating-expressions]
        try_first:
          problem: 'A rectangle measures $6$ by $4$. A straight cut along one diagonal splits it into two identical triangles. What is the area of one of those triangles?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'The two triangles are identical and together fill the rectangle, so each has half of $6 \cdot 4 = 24$, which is $12$. The diagonal triangle has the rectangle''s side $6$ as its base and the side $4$ as its height. So a triangle with base $b$ and height $h$ has area $\frac{1}{2}bh$.'
        exemplars:
          - problem: 'A triangle has a base of $10$ cm, and its top corner is $7$ cm above the line of the base, measured at right angles. What is its area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '35'
            solution_sketch: 'The base is $10$ cm and the height is $7$ cm. The area is $\frac{1}{2} \cdot 10 \cdot 7 = 35$ cm$^2$.'
          - problem: 'A vegetable bed is a rectangle $8$ m long and $5$ m wide. What is its area, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '40'
            solution_sketch: 'The area of a rectangle is the length times the width. Here it is $8 \cdot 5 = 40$ m$^2$.'
          - problem: 'A triangular sail has a bottom edge of $4$ m, and its top corner is $9$ m above that edge, measured at right angles. How much cloth does the sail need, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '18'
            solution_sketch: 'The sail is a triangle with base $4$ m and height $9$ m. Its area is $\frac{1}{2} \cdot 4 \cdot 9 = 18$ m$^2$.'
          - problem: 'Find the area of a rectangle with sides $11$ and $6$.'
            answer_contract: {"kind":"exact"}
            answer: '66'
            solution_sketch: 'Multiply the two sides. The area is $11 \cdot 6 = 66$.'
          - problem: 'A triangle has a base of $12$ and a height of $9$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '54'
            solution_sketch: 'A triangle has half the area of the rectangle with the same base and height. So the area is $\frac{1}{2} \cdot 12 \cdot 9 = 54$.'
          - problem: 'A rectangular field has a perimeter of $30$ m, and one of its sides is $8$ m. What is the area of the field, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '56'
            solution_sketch: 'The two sides of $8$ m use $16$ m of the perimeter. The other two sides share $14$ m, so each is $7$ m, and the area is $8 \cdot 7 = 56$ m$^2$.'
          - problem: 'Lena finds the area of a triangle with base $14$ and height $6$ and writes $84$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '42'
            solution_sketch: 'Lena found the area of the rectangle $14 \cdot 6 = 84$ and forgot the factor $\frac{1}{2}$. The triangle has area $\frac{1}{2} \cdot 14 \cdot 6 = 42$.'
        constraints: "whole-number dimensions; even base-height products for triangles; rectangle and triangle areas in square units, cm or m, including a perimeter-first rectangle and a named-error item"
      - id: kp2
        name: Use the height, not a slant side
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A triangle has a base of $24$ cm and two equal sides of $13$ cm. The height to the base is $5$ cm. What is its area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Only the base and the height at right angles to it matter. The area is $\frac{1}{2} \cdot 24 \cdot 5 = 60$ cm$^2$.'
          - problem: 'A right triangle has legs of $9$ and $4$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'The two legs meet at a right angle, so one is a base and the other is the height. The area is $\frac{1}{2} \cdot 9 \cdot 4 = 18$.'
          - problem: 'A flower bed is a triangle with sides of $17$ m, $17$ m and $16$ m. The height from the corner between the two equal sides down to the $16$ m side is $15$ m. What is the area of the bed, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Use the $16$ m side as the base and $15$ m as its height. The area is $\frac{1}{2} \cdot 16 \cdot 15 = 120$ m$^2$.'
          - problem: 'The gable end of a roof is a triangle with sloping sides of $5$ m each and a bottom edge of $8$ m. The ridge is $3$ m above the bottom edge. How many square metres of cladding cover the gable?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The sloping sides are not heights. The base is $8$ m and the height is $3$ m, so the area is $\frac{1}{2} \cdot 8 \cdot 3 = 12$ m$^2$.'
          - problem: 'In triangle $ABC$, $AB = 10$ and $BC = 5$. The perpendicular from $A$ meets line $BC$ at a point $D$ beyond $C$, and $AD = 6$. Find the area of triangle $ABC$.'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'Take $BC = 5$ as the base. The height is the perpendicular $AD = 6$, even though $D$ lies outside the triangle. The area is $\frac{1}{2} \cdot 5 \cdot 6 = 15$.'
          - problem: 'A triangle has a base of $18$ and two equal sides of $15$. The height to the base is $12$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '108'
            solution_sketch: 'The equal sides are slant sides and do not enter the area. The area is $\frac{1}{2} \cdot 18 \cdot 12 = 108$.'
          - problem: 'Omar finds the area of a triangle with a base of $10$, sloping sides of $13$ and $13$, and a height of $12$. He writes $65$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '60'
            solution_sketch: 'Omar used the sloping side $13$ as the height, which gives $\frac{1}{2} \cdot 10 \cdot 13 = 65$. The height is $12$, so the area is $\frac{1}{2} \cdot 10 \cdot 12 = 60$.'
        constraints: "the height is given explicitly or as a leg; slant sides appear as distractors in realizable triangles; one obtuse triangle with the foot of the height outside the base"
      - id: kp3
        name: Work backwards from an area
        key_prerequisites: [evaluating-expressions, multiplying-fractions]
        exemplars:
          - problem: 'A triangle has an area of $42$ cm$^2$ and a base of $12$ cm. How tall is the triangle, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '7'
            solution_sketch: 'The area formula gives $\frac{1}{2} \cdot 12 \cdot h = 42$, so $6h = 42$. Then $h = 7$ cm.'
          - problem: 'A rectangular lawn has an area of $72$ m$^2$ and is $9$ m wide. How long is the lawn, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The area is the width times the length, so $9 \cdot \ell = 72$. Dividing by $9$ gives $\ell = 8$ m.'
          - problem: 'A triangle has an area of $30$ and a height of $10$. Find its base.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The formula gives $\frac{1}{2} \cdot b \cdot 10 = 30$, so $5b = 30$. Then $b = 6$.'
          - problem: 'A triangular warning sign has a base of $90$ cm and an area of $2700$ cm$^2$. How high is the sign, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The area formula gives $\frac{1}{2} \cdot 90 \cdot h = 2700$, so $45h = 2700$. Then $h = 60$ cm.'
          - problem: 'A rectangle and a triangle have the same base, $12$, and the same area. The rectangle is $5$ tall. How tall is the triangle?'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The rectangle has area $12 \cdot 5 = 60$. For the triangle, $\frac{1}{2} \cdot 12 \cdot h = 60$ gives $6h = 60$, so $h = 10$.'
          - problem: 'A triangle has an area of $54$ and a base of $9$. Find its height.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The formula gives $\frac{1}{2} \cdot 9 \cdot h = 54$, so $4.5h = 54$. Then $h = 12$.'
          - problem: 'Iris divides the area $48$ of a triangle by its base $8$ and says the height is $6$. What is the correct height?'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'Iris forgot that the area is half of the base times the height. The formula gives $\frac{1}{2} \cdot 8 \cdot h = 48$, so $4h = 48$ and $h = 12$.'
        constraints: "area and one dimension given; results are whole numbers; rectangles and triangles, in plain, measured and named-error items"
    diagnostic_exemplar:
      problem: 'A triangle has a base of $16$ and two equal sides of $17$. The height to the base is $15$. Find its area.'
      answer_contract: {"kind":"exact"}
      answer: '120'
      solution_sketch: 'Only the base and the height at right angles to it matter. The area is $\frac{1}{2} \cdot 16 \cdot 15 = 120$.'
    anki_seeds:
      - front: "Area of a triangle:"
        back: "(1/2) x base x height"
        type: basic
      - front: "The height in the triangle area formula must be ... to the base."
        back: "perpendicular"
        type: basic

  - id: parallelogram-trapezoid-area
    name: Areas of Parallelograms and Trapezoids
    core: true
    difficulty: 0.30
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: triangle-area
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Parallelogram area
        key_prerequisites: [triangle-area]
        try_first:
          problem: 'A parallelogram has a base of $8$ and a height of $5$. A right triangle is cut off one slanted end and moved to the other end, which forms a rectangle with the same base and the same height. What is the area of that rectangle?'
          answer_contract: {"kind":"exact"}
          answer: '40'
          reveal: 'Moving the triangle does not change the area, so the parallelogram has the same area as the rectangle, $8 \cdot 5 = 40$. The rectangle keeps the base $b$ and the height $h$ of the parallelogram. So a parallelogram has area $A = bh$.'
        exemplars:
          - problem: 'A parallelogram has a base of $9$ cm and a height of $6$ cm. What is its area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '54'
            solution_sketch: 'The area of a parallelogram is the base times the height. Here it is $9 \cdot 6 = 54$ cm$^2$.'
          - problem: 'A parallelogram has a base of $12$, a height of $8$ and slanted sides of $10$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '96'
            solution_sketch: 'The slanted side is not the height. The area is $bh = 12 \cdot 8 = 96$.'
          - problem: 'A paving slab is a parallelogram. Its two long edges are $60$ cm, the distance between them is $40$ cm, and its slanted edges are $50$ cm. What is the area of the slab, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '2400'
            solution_sketch: 'The long edge is the base and the distance between the long edges is the height. The area is $60 \cdot 40 = 2400$ cm$^2$.'
          - problem: 'A field is a parallelogram. The side along the road is $90$ m, the opposite side is $40$ m from the road at right angles, and the slanted sides are $41$ m. What is the area of the field, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '3600'
            solution_sketch: 'The base is $90$ m and the height is the perpendicular distance, $40$ m. The slanted side of $41$ m is not needed, so the area is $90 \cdot 40 = 3600$ m$^2$.'
          - problem: 'Parallelogram $ABCD$ has vertices $A = (0, 0)$, $B = (7, 0)$, $C = (10, 5)$ and $D = (3, 5)$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '35'
            solution_sketch: 'Side $AB$ lies on the $x$-axis and has length $7$. The vertices $C$ and $D$ are $5$ above it, so the height is $5$ and the area is $7 \cdot 5 = 35$.'
          - problem: 'A parallelogram has sides of $10$ and $15$. The height to the side of $15$ is $6$. What is the height to the side of $10$?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The area is $15 \cdot 6 = 90$. The area also equals $10 \cdot h$, so $h = 9$.'
          - problem: 'Tariq finds the area of a parallelogram with a base of $11$, a height of $7$ and a slanted side of $9$. He writes $99$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '77'
            solution_sketch: 'Tariq multiplied the base by the slanted side. The area uses the height, so it is $11 \cdot 7 = 77$.'
        constraints: "height given or read from coordinates; slanted sides appear as distractors and are always longer than the height; one item uses two base-height pairs"
      - id: kp2
        name: Trapezoid area
        key_prerequisites: [triangle-area, multiplying-fractions]
        try_first:
          problem: 'Two identical trapezoids have parallel sides of $4$ and $10$ and a height of $3$. One is turned upside down and joined to the other along a slanted leg, which forms a parallelogram. What is the area of that parallelogram?'
          answer_contract: {"kind":"exact"}
          answer: '42'
          reveal: 'The new base is $4 + 10 = 14$ and the height is still $3$, so the parallelogram has area $14 \cdot 3 = 42$. It is made of two equal trapezoids, so each has half of that, $21$. In general a trapezoid has area $\frac{1}{2}(b_1 + b_2)h$.'
        exemplars:
          - problem: 'A trapezoid has parallel sides of $7$ cm and $13$ cm. The distance between them is $6$ cm. What is its area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The area is half the sum of the parallel sides times the height. It is $\frac{1}{2}(7 + 13) \cdot 6 = 60$ cm$^2$.'
          - problem: 'Find the area of a trapezoid with parallel sides of $5$ and $11$ and a height of $4$.'
            answer_contract: {"kind":"exact"}
            answer: '32'
            solution_sketch: 'The sum of the parallel sides is $16$, and half of it is $8$. The area is $8 \cdot 4 = 32$.'
          - problem: 'A flower bed is a trapezoid. Two parallel edges are $3$ m and $9$ m long and are $5$ m apart. What is the area of the bed, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '30'
            solution_sketch: 'The parallel edges are the bases and the distance between them is the height. The area is $\frac{1}{2}(3 + 9) \cdot 5 = 30$ m$^2$.'
          - problem: 'The cross-section of a drainage channel is a trapezoid, $2$ m wide at the bottom, $6$ m wide at the top and $3$ m deep. What is the area of the cross-section, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The bottom and the top are the parallel sides, and the depth is the height. The area is $\frac{1}{2}(2 + 6) \cdot 3 = 12$ m$^2$.'
          - problem: 'A trapezoid has vertices $(0, 0)$, $(12, 0)$, $(9, 4)$ and $(3, 4)$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '36'
            solution_sketch: 'The sides on $y = 0$ and $y = 4$ are parallel. Their lengths are $12$ and $6$, and the height is $4$, so the area is $\frac{1}{2}(12 + 6) \cdot 4 = 36$.'
          - problem: 'The side wall of a shed is a trapezoid with two vertical edges of $2$ m and $5$ m. The sloping roof joins the tops of these edges, and the edges are $4$ m apart. What is the area of the wall, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '14'
            solution_sketch: 'The vertical edges are parallel, so they are the bases, and their distance of $4$ m is the height. The area is $\frac{1}{2}(2 + 5) \cdot 4 = 14$ m$^2$.'
          - problem: 'Maya multiplies the bases $6$ and $10$ of a trapezoid with the height $5$ and halves the result. She gets $150$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '40'
            solution_sketch: 'Maya multiplied the bases instead of adding them. The area is $\frac{1}{2}(6 + 10) \cdot 5 = 40$.'
        constraints: "base sums even or products give whole areas; parallel sides identified in context, in coordinates and by a right-trapezoid wall; one named-error item"
      - id: kp3
        name: Rhombus and kite area from diagonals
        key_prerequisites: [triangle-area, multiplying-fractions]
        exemplars:
          - problem: 'A rhombus has diagonals of $10$ cm and $14$ cm. What is its area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '70'
            solution_sketch: 'The area is half the product of the diagonals. It is $\frac{1}{2} \cdot 10 \cdot 14 = 70$ cm$^2$.'
          - problem: 'Find the area of a kite with diagonals of $6$ and $9$.'
            answer_contract: {"kind":"exact"}
            answer: '27'
            solution_sketch: 'The diagonals of a kite cross at right angles, so the area is $\frac{1}{2} \cdot 6 \cdot 9 = 27$.'
          - problem: 'A kite for flying is built on two straight spars that cross at right angles. They are $60$ cm and $90$ cm long and run from corner to corner. How much cloth covers the kite, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '2700'
            solution_sketch: 'The spars are the diagonals of the kite. The area is $\frac{1}{2} \cdot 60 \cdot 90 = 2700$ cm$^2$.'
          - problem: 'A floor pattern uses tiles shaped like rhombuses. The long diagonal of a tile is $40$ cm and the short one is $24$ cm. What is the area of one tile, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '480'
            solution_sketch: 'The area of a rhombus is half the product of its diagonals. The area is $\frac{1}{2} \cdot 40 \cdot 24 = 480$ cm$^2$.'
          - problem: 'A rhombus has a side of $13$ and one diagonal of $24$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '120'
            solution_sketch: 'The diagonals cross at right angles and bisect each other, so half of the other diagonal is $\sqrt{13^2 - 12^2} = 5$. The other diagonal is $10$, and the area is $\frac{1}{2} \cdot 24 \cdot 10 = 120$.'
          - problem: 'A kite has vertices $(0, 8)$, $(3, 0)$, $(0, -2)$ and $(-3, 0)$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'The diagonals lie on the axes and have lengths $8 + 2 = 10$ and $3 + 3 = 6$. The area is $\frac{1}{2} \cdot 10 \cdot 6 = 30$.'
          - problem: 'Pia finds the area of a rhombus with diagonals of $12$ and $8$ and writes $96$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '48'
            solution_sketch: 'Pia multiplied the diagonals and did not halve the product. The area is $\frac{1}{2} \cdot 12 \cdot 8 = 48$.'
        constraints: "diagonal products even, so areas are whole; kites and rhombuses in context, from coordinates and from a side with one diagonal; one named-error item"
    diagnostic_exemplar:
      problem: 'A trapezoid with parallel sides of $6$ and $10$ and a height of $5$ has the same area as a rhombus with diagonals $8$ and $d$. Find $d$.'
      answer_contract: {"kind":"exact"}
      answer: '10'
      solution_sketch: 'The trapezoid has area $\frac{1}{2}(6 + 10) \cdot 5 = 40$. The rhombus has area $\frac{1}{2} \cdot 8 \cdot d = 40$, which gives $d = 10$.'
    anki_seeds:
      - front: "Area of a trapezoid:"
        back: "(1/2)(b1 + b2) x height"
        type: basic
      - front: "Area of a rhombus (or kite) from its diagonals:"
        back: "(1/2) x d1 x d2"
        type: basic

  - id: area-triangles-quadrilaterals
    name: Areas of Triangles and Quadrilaterals
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: triangle-area
        weight: 0.8
        key: true
      - id: parallelogram-trapezoid-area
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Composite figures
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        try_first:
          problem: 'A hallway floor is a $10$ m by $2$ m rectangle. A second rectangular room, $3$ m by $4$ m, is attached along the middle of one long wall and does not overlap the hallway. How many square metres of floor are there in total?'
          answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
          answer: '32'
          reveal: 'The hallway is $10 \cdot 2 = 20$ m$^2$ and the room is $3 \cdot 4 = 12$ m$^2$. The two pieces share no floor, so their areas add: $20 + 12 = 32$ m$^2$. The same idea works for any figure that splits into pieces with known formulas.'
        exemplars:
          - problem: 'An L-shaped room is made of an $8$ m by $5$ m rectangle and a $4$ m by $3$ m rectangle that touches it along one wall without overlap. How many square metres of flooring cover the room?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '52'
            solution_sketch: 'The two rectangles share no floor, so their areas add. The total is $8 \cdot 5 + 4 \cdot 3 = 40 + 12 = 52$ m$^2$.'
          - problem: 'The front wall of a house is a rectangle $10$ m wide and $6$ m tall, topped by a triangular gable with the same $10$ m base and a height of $4$ m. What is the area of the wall, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '80'
            solution_sketch: 'The rectangle has area $10 \cdot 6 = 60$ m$^2$. The gable has area $\frac{1}{2} \cdot 10 \cdot 4 = 20$ m$^2$, so the wall has $60 + 20 = 80$ m$^2$.'
          - problem: 'A rectangular lawn is $20$ m by $14$ m. A square pond with a side of $4$ m lies inside it. What area of grass is left, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '264'
            solution_sketch: 'The lawn has area $20 \cdot 14 = 280$ m$^2$ and the pond has area $4 \cdot 4 = 16$ m$^2$. The grass is the difference, $280 - 16 = 264$ m$^2$.'
          - problem: 'A figure is a $12 \times 5$ rectangle with a triangle attached outside one of its $12$-long sides. The triangle has the same base $12$ and a height of $6$. Find the total area.'
            answer_contract: {"kind":"exact"}
            answer: '96'
            solution_sketch: 'The rectangle has area $60$ and the triangle has area $\frac{1}{2} \cdot 12 \cdot 6 = 36$. The total is $60 + 36 = 96$.'
          - problem: 'A polygon has vertices $(0, 0)$, $(6, 0)$, $(6, 4)$, $(3, 4)$, $(3, 7)$ and $(0, 7)$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '33'
            solution_sketch: 'The polygon is a $6$ by $7$ rectangle with a $3$ by $3$ square cut from the corner at $(6, 7)$. Its area is $42 - 9 = 33$.'
          - problem: 'A pennant is cut from a rectangle $50$ cm long and $30$ cm tall. A triangular notch is cut from one short end, with its base on the whole $30$ cm edge and a depth of $12$ cm. What is the area of the pennant, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '1320'
            solution_sketch: 'The rectangle has area $50 \cdot 30 = 1500$ cm$^2$. The notch has area $\frac{1}{2} \cdot 30 \cdot 12 = 180$ cm$^2$, so the pennant has $1500 - 180 = 1320$ cm$^2$.'
          - problem: 'Sam finds the area of a figure made of a $6 \times 4$ rectangle with a triangle of base $6$ and height $3$ on top. He adds $24 + 18$ and writes $42$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '33'
            solution_sketch: 'Sam used $6 \cdot 3 = 18$ for the triangle and forgot the factor $\frac{1}{2}$. The triangle has area $9$, so the total is $24 + 9 = 33$.'
        constraints: "figures split into rectangles and triangles, or are a rectangle with a piece removed; real dimensions in metres or centimetres; one polygon from coordinates; one named-error item"
      - id: kp2
        name: Heights via the Pythagorean theorem
        key_prerequisites: [triangle-area, pythagorean-theorem]
        exemplars:
          - problem: 'The end of a tent is a triangle with equal sloping sides of $5$ m and a floor width of $6$ m. What is the area of the end, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The height meets the floor at its midpoint, so the right triangle has hypotenuse $5$ and a leg of $3$. The height is $\sqrt{5^2 - 3^2} = 4$ m, and the area is $\frac{1}{2} \cdot 6 \cdot 4 = 12$ m$^2$.'
          - problem: 'An isosceles trapezoid has legs of $5$ and parallel sides of $10$ and $16$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '52'
            solution_sketch: 'Each end of the longer base sticks out by $\frac{16 - 10}{2} = 3$. The height is $\sqrt{5^2 - 3^2} = 4$, and the area is $\frac{1}{2}(10 + 16) \cdot 4 = 52$.'
          - problem: 'The cross-section of an embankment is an isosceles trapezoid. Its top is $8$ m wide, its base is $20$ m wide, and each sloping side is $10$ m long. What is the area of the cross-section, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '112'
            solution_sketch: 'Each slope covers a horizontal distance of $\frac{20 - 8}{2} = 6$ m. The height is $\sqrt{10^2 - 6^2} = 8$ m, so the area is $\frac{1}{2}(8 + 20) \cdot 8 = 112$ m$^2$.'
          - problem: 'A triangle has two equal sides of $13$ and a base of $10$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '60'
            solution_sketch: 'The height splits the base into two parts of $5$. It is $\sqrt{13^2 - 5^2} = 12$, so the area is $\frac{1}{2} \cdot 10 \cdot 12 = 60$.'
          - problem: 'A right trapezoid has parallel sides of $7$ and $16$. One of its other sides is perpendicular to the parallel sides, and the fourth side is $15$ long. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '138'
            solution_sketch: 'The perpendicular side is the height. The slanted side of $15$ covers a horizontal distance of $16 - 7 = 9$, so the height is $\sqrt{15^2 - 9^2} = 12$. The area is $\frac{1}{2}(7 + 16) \cdot 12 = 138$.'
          - problem: 'A triangular plot has sides of $17$ m, $17$ m and $30$ m. What is the area of the plot, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '120'
            solution_sketch: 'The height to the $30$ m side meets it at its midpoint, $15$ m from each end. It is $\sqrt{17^2 - 15^2} = 8$ m, so the area is $\frac{1}{2} \cdot 30 \cdot 8 = 120$ m$^2$.'
          - problem: 'A triangle has two equal sides of $25$ and a base of $14$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '168'
            solution_sketch: 'The height splits the base into two parts of $7$. It is $\sqrt{25^2 - 7^2} = 24$, so the area is $\frac{1}{2} \cdot 14 \cdot 24 = 168$.'
        constraints: "isosceles heights via Pythagorean triples on half the base or on the overhang; one right trapezoid; real dimensions in metres"
      - id: kp3
        name: Working backwards from areas
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        exemplars:
          - problem: 'A trapezoid has an area of $60$ cm$^2$ and parallel sides of $7$ cm and $13$ cm. How far apart are the parallel sides, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The area formula gives $\frac{1}{2}(7 + 13)h = 60$, so $10h = 60$. Then $h = 6$ cm.'
          - problem: 'A rhombus has an area of $96$ and one diagonal of $12$. Find the other diagonal.'
            answer_contract: {"kind":"exact"}
            answer: '16'
            solution_sketch: 'The area of a rhombus is half the product of its diagonals, so $\frac{1}{2} \cdot 12 \cdot d = 96$. Then $6d = 96$ and $d = 16$.'
          - problem: 'A plot of land is a parallelogram with an area of $2340$ m$^2$. The side along the road is $65$ m long. How far is the opposite side from the road, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '36'
            solution_sketch: 'The area is the base times the height, so $65h = 2340$. Then $h = 36$ m.'
          - problem: 'A triangular sail has an area of $11$ m$^2$ and a bottom edge of $5$ m. How tall is the sail above its bottom edge, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '4.4'
            solution_sketch: 'The area formula gives $\frac{1}{2} \cdot 5 \cdot h = 11$, so $2.5h = 11$. Then $h = 4.4$ m.'
          - problem: 'A trapezoid has a height of $8$, an area of $72$ and one parallel side of $6$. Find the other parallel side.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The area formula gives $\frac{1}{2}(6 + b) \cdot 8 = 72$, so $4(6 + b) = 72$. Then $6 + b = 18$ and $b = 12$.'
          - problem: 'A rectangle has a width of $5$ and a length of $12$. A parallelogram with a base of $8$ has the same area. What is the height of the parallelogram?'
            answer_contract: {"kind":"exact"}
            answer: '7.5'
            solution_sketch: 'The rectangle has area $5 \cdot 12 = 60$. For the parallelogram, $8h = 60$, so $h = 7.5$.'
          - problem: 'A kite-shaped decoration has an area of $750$ cm$^2$ and one diagonal of $50$ cm. How long is the other diagonal, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '30'
            solution_sketch: 'The area formula gives $\frac{1}{2} \cdot 50 \cdot d = 750$, so $25d = 750$. Then $d = 30$ cm.'
          - problem: 'Ben divides the area $30$ of a triangle by its base $10$ and says the height is $3$. What is the correct height?'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Ben forgot the factor $\frac{1}{2}$ in the area formula. The equation is $\frac{1}{2} \cdot 10 \cdot h = 30$, so $5h = 30$ and $h = 6$.'
        constraints: "area and one dimension given; triangles, trapezoids, parallelograms, rhombuses and kites; decimal results allowed; one named-error item"
    diagnostic_exemplar:
      problem: 'A triangle has two equal sides of $10$ and a base of $12$. Find its area.'
      answer_contract: {"kind":"exact"}
      answer: '48'
      solution_sketch: 'The height splits the base into two parts of $6$. It is $\sqrt{10^2 - 6^2} = 8$, so the area is $\frac{1}{2} \cdot 12 \cdot 8 = 48$.'
    anki_seeds:
      - front: "Strategy for the area of a composite figure:"
        back: "split it into rectangles and triangles, then add (or subtract) the pieces"
        type: basic
      - front: "Height of an isosceles triangle with equal sides s and base b:"
        back: "sqrt(s^2 - (b/2)^2)"
        type: basic

  - id: composite-figure-areas
    name: Composite and Shaded Areas
    core: false
    difficulty: 0.44
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.7
        key: true
      - id: circle-area-circumference
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Figures combining polygons and semicircles
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A figure is a $10 \times 4$ rectangle with a semicircle attached to one short side. The diameter of the semicircle is that side. What is the exact area of the figure?'
            answer_contract: {"kind":"exact"}
            answer: '40 + 2*pi'
            solution_sketch: 'The rectangle has area $40$. The semicircle has radius $2$ and area $\frac{1}{2}\pi \cdot 2^2 = 2\pi$, so the figure has area $40 + 2\pi$.'
          - problem: 'A running track encloses a $100$ m by $40$ m rectangle, with a semicircle of diameter $40$ m on each short end. What exact area does the track enclose, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '4000 + 400*pi'
            solution_sketch: 'The rectangle has area $100 \cdot 40 = 4000$ m$^2$. The two semicircles together form a circle of radius $20$ m with area $400\pi$ m$^2$, so the total is $4000 + 400\pi$ m$^2$.'
          - problem: 'A window is a rectangle $1.2$ m wide and $2$ m tall, topped by a semicircle whose diameter is the top edge of the rectangle. To the nearest hundredth of a square metre, what is the area of the glass?'
            answer_contract: {"kind":"approx","decimals":2}
            answer: '2.97'
            solution_sketch: 'The rectangle has area $1.2 \cdot 2 = 2.4$ m$^2$. The semicircle has radius $0.6$ m and area $\frac{1}{2}\pi(0.6)^2 = 0.18\pi \approx 0.57$ m$^2$. The total is about $2.97$ m$^2$.'
          - problem: 'A stage is a rectangle $12$ m by $8$ m with a semicircular extension on one of its $8$ m sides. The diameter of the extension is that side. To the nearest tenth of a square metre, what is the area of the stage?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '121.1'
            solution_sketch: 'The rectangle has area $12 \cdot 8 = 96$ m$^2$. The semicircle has radius $4$ m and area $\frac{1}{2}\pi \cdot 16 = 8\pi \approx 25.1$ m$^2$, so the total is about $121.1$ m$^2$.'
          - problem: 'A right triangle has legs of $6$ and $8$. A semicircle is drawn outward on the longest side of the triangle, with that side as its diameter. What is the exact area of the whole figure?'
            answer_contract: {"kind":"exact"}
            answer: '24 + 25*pi/2'
            solution_sketch: 'The triangle has area $\frac{1}{2} \cdot 6 \cdot 8 = 24$. Its longest side is $10$, so the semicircle has radius $5$ and area $\frac{1}{2}\pi \cdot 25 = \frac{25\pi}{2}$. The total is $24 + \frac{25\pi}{2}$.'
          - problem: 'A square has a side of $10$. A semicircle is drawn outward on each of its four sides, with that side as the diameter. What is the exact area of the whole figure?'
            answer_contract: {"kind":"exact"}
            answer: '100 + 50*pi'
            solution_sketch: 'The square has area $100$. Each semicircle has radius $5$ and area $\frac{25\pi}{2}$, and the four of them give $50\pi$. The total is $100 + 50\pi$.'
          - problem: 'A doorway is a rectangle $90$ cm wide and $200$ cm tall, topped by a semicircle whose diameter is the top edge of the rectangle. To the nearest square centimetre, what is the area of the doorway?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '21181'
            solution_sketch: 'The rectangle has area $90 \cdot 200 = 18000$ cm$^2$. The semicircle has radius $45$ cm and area $\frac{1}{2}\pi \cdot 2025 = 1012.5\pi \approx 3181$ cm$^2$. The total is about $21181$ cm$^2$.'
          - problem: 'Ravi finds the area of a $10 \times 6$ rectangle with a semicircle of diameter $6$ attached to one short side. He uses $6$ as the radius and writes $60 + 18\pi$. What is the correct exact area?'
            answer_contract: {"kind":"exact"}
            answer: '60 + 9*pi/2'
            solution_sketch: 'The diameter is $6$, so the radius is $3$. The semicircle has area $\frac{1}{2}\pi \cdot 3^2 = \frac{9\pi}{2}$, and the total is $60 + \frac{9\pi}{2}$.'
        constraints: "semicircle diameters match a side; exact answers in pi, or rounded measured answers with units; one named-error item"
      - id: kp2
        name: Shaded regions by subtraction
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A circle of radius $5$ is inscribed in a square of side $10$. What is the exact area inside the square but outside the circle?'
            answer_contract: {"kind":"exact"}
            answer: '100 - 25*pi'
            solution_sketch: 'The square has area $100$ and the circle has area $\pi \cdot 5^2 = 25\pi$. The region between them has area $100 - 25\pi$.'
          - problem: 'Two concentric circles have radii $7$ and $4$. What is the exact area of the ring between them?'
            answer_contract: {"kind":"exact"}
            answer: '33*pi'
            solution_sketch: 'The big circle has area $49\pi$ and the small one has area $16\pi$. The ring has area $49\pi - 16\pi = 33\pi$.'
          - problem: 'A square steel plate has a side of $20$ cm and a circular hole of radius $4$ cm in the middle. To the nearest tenth of a square centimetre, what is the area of the plate?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '349.7'
            solution_sketch: 'The square has area $400$ cm$^2$ and the hole has area $\pi \cdot 16 = 16\pi \approx 50.3$ cm$^2$. The plate has area $400 - 16\pi \approx 349.7$ cm$^2$.'
          - problem: 'A circular pond of radius $3$ m is surrounded by a path $2$ m wide. What exact area of ground does the path cover, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '16*pi'
            solution_sketch: 'The outer edge of the path is a circle of radius $3 + 2 = 5$ m. The path has area $25\pi - 9\pi = 16\pi$ m$^2$.'
          - problem: 'A disc has an outer radius of $6$ cm and a central hole of radius $0.75$ cm. To the nearest tenth of a square centimetre, what is the area of the disc?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '111.3'
            solution_sketch: 'The disc has area $\pi(6^2 - 0.75^2) = 35.4375\pi$ cm$^2$. This is about $111.3$ cm$^2$.'
          - problem: 'A square courtyard has a side of $12$ m. At each corner there is a quarter circle of grass with a radius of $6$ m, and the rest is paving. What exact area of paving is there, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '144 - 36*pi'
            solution_sketch: 'The courtyard has area $144$ m$^2$. The four quarter circles together make a circle of radius $6$ m with area $36\pi$ m$^2$, so the paving has area $144 - 36\pi$ m$^2$.'
          - problem: 'What is the exact area of a $12$ cm by $8$ cm rectangle that remains after the largest circle that fits inside it is removed?'
            answer_contract: {"kind":"exact"}
            answer: '96 - 16*pi'
            solution_sketch: 'The largest circle that fits has the width $8$ as its diameter, so its radius is $4$. The remaining area is $96 - 16\pi$.'
          - problem: 'Hana finds the area of the ring between circles of radii $6$ and $4$ and computes $\pi(6 - 4)^2 = 4\pi$. What is the correct exact area?'
            answer_contract: {"kind":"exact"}
            answer: '20*pi'
            solution_sketch: 'Hana subtracted the radii before squaring. The ring has area $\pi \cdot 6^2 - \pi \cdot 4^2 = 36\pi - 16\pi = 20\pi$.'
        constraints: "outer area minus inner area; exact answers in pi, or rounded measured answers with units; one named-error item"
      - id: kp3
        name: Multi-piece decompositions
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference]
        exemplars:
          - problem: 'A square of side $8$ has a quarter circle of radius $8$ removed, centered at one corner of the square. What is the exact remaining area?'
            answer_contract: {"kind":"exact"}
            answer: '64 - 16*pi'
            solution_sketch: 'The square has area $64$. The quarter circle has area $\frac{1}{4} \cdot 64\pi = 16\pi$, so the remaining area is $64 - 16\pi$.'
          - problem: 'A trapezoid with parallel sides of $8$ and $12$ and a height of $6$ has a triangular notch removed. The notch is a triangle with a base of $4$ on the longer parallel side and a height of $3$. What is the remaining area?'
            answer_contract: {"kind":"exact"}
            answer: '54'
            solution_sketch: 'The trapezoid has area $\frac{1}{2}(8 + 12) \cdot 6 = 60$. The notch has area $\frac{1}{2} \cdot 4 \cdot 3 = 6$, so $60 - 6 = 54$ remain.'
          - problem: 'A metal bracket starts as a $40$ cm by $30$ cm rectangle. A circular hole of diameter $10$ cm and a square hole with a side of $6$ cm are cut inside it, and they do not overlap. To the nearest square centimetre, what area of metal remains?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '1085'
            solution_sketch: 'The rectangle has area $1200$ cm$^2$. The round hole has area $\pi \cdot 5^2 = 25\pi \approx 78.5$ cm$^2$ and the square hole has area $36$ cm$^2$. The rest is $1200 - 25\pi - 36 \approx 1085$ cm$^2$.'
          - problem: 'A sheet of plywood is $1.2$ m by $0.6$ m. A right-triangular corner with legs of $0.4$ m and $0.6$ m is cut off. What area of plywood remains, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '0.6'
            solution_sketch: 'The sheet has area $1.2 \cdot 0.6 = 0.72$ m$^2$. The corner has area $\frac{1}{2} \cdot 0.4 \cdot 0.6 = 0.12$ m$^2$, so $0.72 - 0.12 = 0.6$ m$^2$ remain.'
          - problem: 'A figure is a $10 \times 6$ rectangle with a semicircle attached to one short side, with that side as its diameter. A square with a side of $2$ is removed from inside the rectangle. What is the exact area of the figure?'
            answer_contract: {"kind":"exact"}
            answer: '56 + 9*pi/2'
            solution_sketch: 'The rectangle has area $60$ and the semicircle has radius $3$ and area $\frac{9\pi}{2}$. The square removes $4$, so the area is $60 + \frac{9\pi}{2} - 4 = 56 + \frac{9\pi}{2}$.'
          - problem: 'A picture frame has an outer edge of $50$ cm by $40$ cm and an opening of $38$ cm by $28$ cm. What is the area of the wood in the frame, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '936'
            solution_sketch: 'The outer rectangle has area $50 \cdot 40 = 2000$ cm$^2$ and the opening has area $38 \cdot 28 = 1064$ cm$^2$. The frame has area $2000 - 1064 = 936$ cm$^2$.'
          - problem: 'Two semicircles share the same centre and the same straight edge. Their radii are $10$ and $6$. What is the exact area between the two arcs?'
            answer_contract: {"kind":"exact"}
            answer: '32*pi'
            solution_sketch: 'The large semicircle has area $\frac{1}{2}\pi \cdot 100 = 50\pi$ and the small one has area $\frac{1}{2}\pi \cdot 36 = 18\pi$. The region between them has area $50\pi - 18\pi = 32\pi$.'
        constraints: "at most two pieces removed or added; results stay positive; exact answers in pi, or rounded measured answers with units"
    diagnostic_exemplar:
      problem: 'A square of side $8$ has a semicircle of diameter $8$ removed from it. The semicircle lies inside the square with its diameter along one side. What is the exact remaining area?'
      answer_contract: {"kind":"exact"}
      answer: '64 - 8*pi'
      solution_sketch: 'The square has area $64$. The semicircle has radius $4$ and area $\frac{1}{2}\pi \cdot 16 = 8\pi$, so the remaining area is $64 - 8\pi$.'
    anki_seeds:
      - front: "Area of an annulus (ring) with outer radius R and inner radius r:"
        back: "pi (R^2 - r^2)"
        type: basic
      - front: "Shaded-region strategy when one figure sits inside another:"
        back: "outer area minus inner area"
        type: basic

  - id: area-regular-polygons
    name: Areas of Regular Polygons
    core: false
    difficulty: 0.46
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.6
        key: true
      - id: special-right-triangles
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'Area from apothem and perimeter'
        key_prerequisites: [area-triangles-quadrilaterals]
        try_first:
          problem: 'A regular hexagonal tile with sides of $10$ cm is cut from its centre into six identical triangles. Each triangle has a base of $10$ cm along an edge and a height of $8.66$ cm. What is the area of the tile, in square centimetres?'
          answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
          answer: '259.8'
          reveal: 'Each triangle has area $\frac{1}{2} \cdot 10 \cdot 8.66 = 43.3$, and six of them give $259.8$. The six bases add up to the perimeter $60$ and every height is the apothem $8.66$, so the total is $\frac{1}{2} \cdot 8.66 \cdot 60$. This is the formula $A = \frac{1}{2} a P$.'
        exemplars:
          - problem: 'A regular polygon has perimeter $60$ and apothem $9$. Find its area.'
            answer_contract: {"kind":"exact"}
            answer: '270'
            solution_sketch: 'The area of a regular polygon is $A = \frac{1}{2} a P$, where $a$ is the apothem and $P$ the perimeter. Here $A = \frac{1}{2} \cdot 9 \cdot 60 = 270$.'
          - problem: 'A tile is a regular pentagon with sides of $10$ cm. The distance from its centre to the middle of a side is $6.88$ cm. What is the area of the tile, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '172'
            solution_sketch: 'The perimeter of the tile is $5 \cdot 10 = 50$ cm, and the distance from the centre to the middle of a side is the apothem. So $A = \frac{1}{2} \cdot 6.88 \cdot 50 = 172$ cm$^2$.'
          - problem: 'A regular polygon has area $168$ and apothem $7$. Find its perimeter.'
            answer_contract: {"kind":"exact"}
            answer: '48'
            solution_sketch: 'From $A = \frac{1}{2} a P$ we get $168 = \frac{1}{2} \cdot 7 \cdot P$, so $168 = 3.5P$. Dividing by $3.5$ gives $P = 48$.'
          - problem: 'A garden bed is a regular hexagon with sides of $5$ m. Its apothem is $4.33$ m. What is the area of the bed, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '64.95'
            solution_sketch: 'The perimeter is $6 \cdot 5 = 30$ m. The area is $\frac{1}{2} \cdot 4.33 \cdot 30 = 64.95$ m$^2$.'
          - problem: 'A square fish pond has an apothem of $4$ m and an area of $64$ m$^2$. How long is the fence that goes once around the pond, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '32'
            solution_sketch: 'The fence follows the perimeter. From $A = \frac{1}{2} a P$ we get $64 = \frac{1}{2} \cdot 4 \cdot P = 2P$, so $P = 32$ m.'
          - problem: 'A regular octagonal stage has sides of $7$ m and an apothem of $8.45$ m. What is the area of the stage, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '236.6'
            solution_sketch: 'The perimeter is $8 \cdot 7 = 56$ m. The area is $\frac{1}{2} \cdot 8.45 \cdot 56 = 236.6$ m$^2$.'
          - problem: 'Omar finds the area of a regular polygon with perimeter $40$ and apothem $6$ and writes $240$. What is the correct area?'
            answer_contract: {"kind":"exact"}
            answer: '120'
            solution_sketch: 'Omar multiplied $a$ and $P$ and forgot the factor $\frac{1}{2}$ in the formula. The area is $\frac{1}{2} \cdot 6 \cdot 40 = 120$.'
        constraints: 'perimeter (or number of sides and side length) and apothem given; decimal measurements allowed for real polygons (tile, bed, stage); reverse items find the perimeter from the area'
      - id: kp2
        name: 'Regular hexagons and equilateral triangles'
        key_prerequisites: [area-triangles-quadrilaterals, special-right-triangles]
        exemplars:
          - problem: 'Find the exact area of an equilateral triangle with side $6$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '9*sqrt(3)'
            solution_sketch: 'The area of an equilateral triangle with side $s$ is $\frac{\sqrt{3}}{4} s^2$. With $s = 6$ this is $\frac{\sqrt{3}}{4} \cdot 36 = 9\sqrt{3}$.'
          - problem: 'A honeycomb cell is a regular hexagon with sides of $4$ cm. What is the exact area of the cell, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '24*sqrt(3)'
            solution_sketch: 'The hexagon splits into six equilateral triangles with side $4$ cm. The area is $6 \cdot \frac{\sqrt{3}}{4} \cdot 16 = 24\sqrt{3}$ cm$^2$.'
          - problem: 'A regular hexagonal gazebo has a floor with sides of $6$ m. What is the exact area of the floor, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '54*sqrt(3)'
            solution_sketch: 'The floor splits into six equilateral triangles with side $6$ m, each of area $\frac{\sqrt{3}}{4} \cdot 36 = 9\sqrt{3}$. Six of them give $54\sqrt{3}$ m$^2$.'
          - problem: 'A pennant is an equilateral triangle with sides of $10$ cm. What is its exact area, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '25*sqrt(3)'
            solution_sketch: 'The area is $\frac{\sqrt{3}}{4} s^2$ with $s = 10$. So $A = \frac{\sqrt{3}}{4} \cdot 100 = 25\sqrt{3}$ cm$^2$.'
          - problem: 'A regular hexagonal pond has an area of $150\sqrt{3}$ m$^2$. How long is each side of the pond, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The area of a regular hexagon with side $s$ is $6 \cdot \frac{\sqrt{3}}{4} s^2 = \frac{3\sqrt{3}}{2} s^2$. Setting this equal to $150\sqrt{3}$ gives $s^2 = 100$, so $s = 10$ m.'
          - problem: 'A regular hexagonal sheet of plywood with sides of $4$ m is cut along the line through two opposite corners into two equal pieces. What is the exact area of each piece, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '12*sqrt(3)'
            solution_sketch: 'The whole sheet splits into six equilateral triangles of side $4$ m, so its area is $6 \cdot \frac{\sqrt{3}}{4} \cdot 16 = 24\sqrt{3}$. Each piece is half of that, $12\sqrt{3}$ m$^2$.'
          - problem: 'A regular hexagonal dance floor has a longest diagonal of $6$ m. What is the exact area of the floor, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true,"form":"simplest_radical"}
            answer: '27*sqrt(3)/2'
            solution_sketch: 'The longest diagonal of a regular hexagon is twice its side, so the side is $3$ m. The area is $6 \cdot \frac{\sqrt{3}}{4} \cdot 9 = \frac{27\sqrt{3}}{2}$ m$^2$.'
          - problem: 'Mia finds the area of a regular hexagon with side $2$ by writing $\frac{\sqrt{3}}{4} \cdot 2^2 = \sqrt{3}$. What is the correct area?'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '6*sqrt(3)'
            solution_sketch: 'Mia found the area of one equilateral triangle with side $2$ and not of the hexagon. The hexagon has six such triangles, so its area is $6\sqrt{3}$.'
        constraints: 'exact radical areas (k*sqrt(n)) for equilateral triangles and regular hexagons, bare or in context with square units; a hexagon is six equilateral triangles; reverse items find the side from the area or the longest diagonal'
      - id: kp3
        name: 'Apothems via special right triangles'
        key_prerequisites: [area-triangles-quadrilaterals, special-right-triangles]
        exemplars:
          - problem: 'Find the exact apothem of a regular hexagon with side $6$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '3*sqrt(3)'
            solution_sketch: 'The apothem is the height of one of the six equilateral triangles of side $6$. That height is $\frac{6\sqrt{3}}{2} = 3\sqrt{3}$.'
          - problem: 'A square courtyard has sides of $10$ m. A lamp stands at its centre. How far is the lamp from the middle of each side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The distance from the centre of a square to the middle of a side is its apothem. It equals half of the side, $\frac{10}{2} = 5$ m.'
          - problem: 'Find the exact apothem of an equilateral triangle with side $12$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '2*sqrt(3)'
            solution_sketch: 'The height of the triangle is $\frac{12\sqrt{3}}{2} = 6\sqrt{3}$. The apothem is one third of the height, so it is $\frac{6\sqrt{3}}{3} = 2\sqrt{3}$.'
          - problem: 'A regular hexagonal gazebo has sides of $8$ m. A post stands at the centre of the floor. What is the exact distance from the post to the middle of each side, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            answer: '4*sqrt(3)'
            solution_sketch: 'This distance is the apothem, which is the height of an equilateral triangle with side $8$ m. It is $\frac{8\sqrt{3}}{2} = 4\sqrt{3}$ m.'
          - problem: 'A regular hexagon has sides of $10$. Find its exact area using its apothem and its perimeter.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '150*sqrt(3)'
            solution_sketch: 'The apothem is $\frac{10\sqrt{3}}{2} = 5\sqrt{3}$ and the perimeter is $6 \cdot 10 = 60$. So $A = \frac{1}{2} \cdot 5\sqrt{3} \cdot 60 = 150\sqrt{3}$.'
          - problem: 'A regular hexagonal floor tile has an apothem of $3\sqrt{3}$ cm. How long is each side of the tile, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The apothem is $\frac{s\sqrt{3}}{2}$ for side $s$. Setting $\frac{s\sqrt{3}}{2} = 3\sqrt{3}$ gives $s = 6$ cm.'
          - problem: 'The distance from the centre of a square mirror to the middle of each edge is $7$ cm. What is the area of the mirror, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '196'
            solution_sketch: 'This distance is the apothem, so the side of the square is $2 \cdot 7 = 14$ cm. The area is $14^2 = 196$ cm$^2$.'
          - problem: 'A circular disc of radius $5$ cm just fits inside an equilateral triangular plate and touches all three sides. How long is each side of the plate, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            answer: '10*sqrt(3)'
            solution_sketch: 'The radius of the disc is the apothem of the triangle, which is one third of its height. So the height is $15$ cm, and a side $s$ satisfies $\frac{s\sqrt{3}}{2} = 15$, which gives $s = 10\sqrt{3}$ cm.'
        constraints: 'squares, equilateral triangles and regular hexagons so that 30-60-90 or 45-45-90 triangles give the apothem; real settings with a centre point; reverse items find a side from an apothem'
    diagnostic_exemplar:
      problem: 'A regular hexagon has sides of $6$. Find the apothem, then use it with the perimeter to find the exact area of the hexagon.'
      answer_contract: {"kind":"required_simplest_radical"}
      answer: '54*sqrt(3)'
      solution_sketch: 'The apothem is the height of an equilateral triangle of side $6$, which is $3\sqrt{3}$. The area is $\frac{1}{2} \cdot 3\sqrt{3} \cdot 36 = 54\sqrt{3}$.'
    anki_seeds:
      - front: "Area of a regular polygon with apothem a and perimeter P:"
        back: "(1/2) x a x P"
        type: basic
      - front: "A regular hexagon with side s decomposes into..."
        back: "six equilateral triangles of side s"
        type: basic

  - id: distance-midpoint-formulas
    name: Distance and Midpoint Formulas
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: square-roots
        weight: 0.4
        key: false
      - id: simplifying-radicals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Distance between two points'
        key_prerequisites: [pythagorean-theorem, coordinate-plane]
        try_first:
          problem: 'Two villages lie at $(1, 2)$ and $(7, 10)$ on a map grid marked in kilometres, and a straight road joins them. How long is the road, in kilometres?'
          answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
          answer: '10'
          reveal: 'Draw a right triangle with the road as the longest side. Its legs are $7 - 1 = 6$ km across and $10 - 2 = 8$ km up, so the road is $\sqrt{6^2 + 8^2} = 10$ km. The same steps work for any two points, which gives the distance formula.'
        exemplars:
          - problem: 'Find the distance between $(1, 2)$ and $(4, 6)$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The horizontal difference is $4 - 1 = 3$ and the vertical difference is $6 - 2 = 4$. These are the legs of a right triangle, so the distance is $\sqrt{3^2 + 4^2} = 5$.'
          - problem: 'On a map grid marked in kilometres, a camp is at $(-2, 3)$ and a lookout is at $(3, -9)$. How far apart are the camp and the lookout, in kilometres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '13'
            solution_sketch: 'The differences are $3 - (-2) = 5$ and $-9 - 3 = -12$. The distance is $\sqrt{5^2 + 12^2} = \sqrt{169} = 13$ km.'
          - problem: 'Find the distance between $(-4, 3)$ and $(20, -4)$.'
            answer_contract: {"kind":"exact"}
            answer: '25'
            solution_sketch: 'The differences are $20 - (-4) = 24$ and $-4 - 3 = -7$. The distance is $\sqrt{24^2 + 7^2} = \sqrt{625} = 25$.'
          - problem: 'On a warehouse floor plan with coordinates in metres, a robot at the dock $(0, 0)$ drives in a straight line to a shelf at $(9, 12)$. How far does the robot drive, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The robot moves $9$ m across and $12$ m along the floor. The distance is $\sqrt{9^2 + 12^2} = \sqrt{225} = 15$ m.'
          - problem: 'Which theorem justifies the distance formula?'
            answer_contract: {"kind":"label","options":[["Pythagorean theorem","the Pythagorean theorem","Pythagorean","Pythagoras","Pythagoras theorem","Pythagoras' theorem"],["triangle inequality theorem","triangle inequality","the triangle inequality"],["midpoint theorem","the midpoint theorem","midpoint"],["law of sines","the law of sines","sine rule"]]}
            answer: 'Pythagorean theorem'
            solution_sketch: 'The two coordinate differences are the legs of a right triangle whose hypotenuse joins the two points. The Pythagorean theorem then gives the length of the hypotenuse as $\sqrt{a^2 + b^2}$.'
          - problem: 'A radio mast at $(2, 1)$ reaches every point within $12$ km of it, on a map grid marked in kilometres. Does the signal reach a village at $(-4, 9)$?'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","the signal reaches the village","reaches"],["no","no, it does not","it does not","the signal does not reach the village","does not reach"]]}
            answer: 'yes'
            solution_sketch: 'The distance from the mast to the village is $\sqrt{6^2 + 8^2} = \sqrt{100} = 10$ km. Since $10$ is less than $12$, the village is inside the range of the mast.'
          - problem: 'A triangular plot has corners at $A(0, 0)$, $B(5, 12)$ and $C(5, 0)$, with coordinates in metres. How much fencing goes around the plot, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '30'
            solution_sketch: 'Side $AC$ is $5$ m and side $BC$ is $12$ m, because they run along the axes. Side $AB$ is $\sqrt{5^2 + 12^2} = 13$ m, so the perimeter is $5 + 12 + 13 = 30$ m.'
          - problem: 'Find the distance between $(-1, -2)$ and $(7, 13)$.'
            answer_contract: {"kind":"exact"}
            answer: '17'
            solution_sketch: 'The differences are $7 - (-1) = 8$ and $13 - (-2) = 15$. The distance is $\sqrt{8^2 + 15^2} = \sqrt{289} = 17$.'
        constraints: 'coordinate differences that form Pythagorean triples; bare points and map, floor-plan or plot settings with units; one justification item (which theorem) and at most one yes/no range item'
      - id: kp2
        name: 'Midpoint and missing endpoint'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Find the midpoint of the segment from $(2, -4)$ to $(8, 10)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 3)'
            solution_sketch: 'The $x$-coordinate of the midpoint is $\frac{2 + 8}{2} = 5$. The $y$-coordinate is $\frac{-4 + 10}{2} = 3$.'
          - problem: 'Two lighthouses stand at $(-6, 4)$ and $(2, -8)$ on a map grid. A patrol boat waits exactly halfway between them. What are the coordinates of the boat?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, -2)'
            solution_sketch: 'The boat is at the midpoint of the segment joining the lighthouses. Its coordinates are $\left(\frac{-6 + 2}{2}, \frac{4 - 8}{2}\right) = (-2, -2)$.'
          - problem: '$M(1, 2)$ is the midpoint of $\overline{AB}$ and $A$ is $(-3, 6)$. Find the coordinates of $B$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, -2)'
            solution_sketch: 'Each coordinate of $M$ is the average of the matching coordinates of $A$ and $B$. So $\frac{-3 + x}{2} = 1$ gives $x = 5$, and $\frac{6 + y}{2} = 2$ gives $y = -2$.'
          - problem: 'On a floor plan with coordinates in metres, a straight pipe has one end at $A(-3, 1)$ and a brace at its midpoint $M(2, 4)$. What are the coordinates of the other end of the pipe?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 7)'
            solution_sketch: 'The midpoint is the average of the ends, so the other end is twice the midpoint minus $A$. That gives $(2 \cdot 2 - (-3),\ 2 \cdot 4 - 1) = (7, 7)$.'
          - problem: 'A circular pond has a diameter with endpoints $(-3, -5)$ and $(9, 7)$ on a plan with coordinates in metres. What are the coordinates of the centre of the pond?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 1)'
            solution_sketch: 'The centre of a circle is the midpoint of any diameter. Here it is $\left(\frac{-3 + 9}{2}, \frac{-5 + 7}{2}\right) = (3, 1)$.'
          - problem: 'Parallelogram $ABCD$ has vertices $A(0, 0)$, $B(6, 2)$ and $C(10, 7)$. Find the coordinates of $D$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 5)'
            solution_sketch: 'The diagonals of a parallelogram bisect each other, so $AC$ and $BD$ have the same midpoint. The midpoint of $AC$ is $(5, 3.5)$, so $D = (2 \cdot 5 - 6,\ 2 \cdot 3.5 - 2) = (4, 5)$.'
          - problem: 'A rope is stretched between posts at $(0, 0)$ and $(10, 6)$ on a grid with coordinates in metres. A knot is tied on the rope at $(6, 4)$. Is the knot exactly halfway along the rope?'
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not halfway","not halfway"],["yes","yes, it is","it is halfway","halfway"]]}
            answer: 'no'
            solution_sketch: 'The halfway point is the midpoint $\left(\frac{0 + 10}{2}, \frac{0 + 6}{2}\right) = (5, 3)$. The knot at $(6, 4)$ is not at that point, so it is not halfway.'
          - problem: 'Sam finds the midpoint of the segment from $(-4, 6)$ to $(8, -2)$ and writes $(2, 4)$. What is the correct midpoint?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 2)'
            solution_sketch: 'Sam added the $y$-coordinates, $6 + (-2) = 4$, and did not halve the sum. The correct midpoint has $x = \frac{-4 + 8}{2} = 2$ and $y = \frac{6 + (-2)}{2} = 2$.'
        constraints: 'coordinate sums even so the midpoints and endpoints are whole numbers; ends known and midpoint wanted, or one end and the midpoint known; circle centres, parallelograms and plans with units'
      - id: kp3
        name: 'Distances with radical answers'
        key_prerequisites: [pythagorean-theorem, simplifying-radicals]
        exemplars:
          - problem: 'Find the exact distance between $(0, 0)$ and $(4, 6)$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '2*sqrt(13)'
            solution_sketch: 'The differences are $4$ and $6$, so the distance is $\sqrt{16 + 36} = \sqrt{52}$. Since $52 = 4 \cdot 13$, this equals $2\sqrt{13}$.'
          - problem: 'Find the exact distance between $(-1, 2)$ and $(3, 6)$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '4*sqrt(2)'
            solution_sketch: 'The differences are $4$ and $4$, so the distance is $\sqrt{16 + 16} = \sqrt{32}$. Since $32 = 16 \cdot 2$, this equals $4\sqrt{2}$.'
          - problem: 'On a site plan with coordinates in metres, a drone takes off at $(2, -1)$ and flies in a straight line to the top of a tree at $(8, 5)$. What is the exact distance the drone flies, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            answer: '6*sqrt(2)'
            solution_sketch: 'The differences are $6$ and $6$, so the distance is $\sqrt{36 + 36} = \sqrt{72}$. Since $72 = 36 \cdot 2$, the drone flies $6\sqrt{2}$ m.'
          - problem: 'Find the exact distance between $(2, 3)$ and $(8, 5)$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '2*sqrt(10)'
            solution_sketch: 'The differences are $6$ and $2$, so the distance is $\sqrt{36 + 4} = \sqrt{40}$. Since $40 = 4 \cdot 10$, this equals $2\sqrt{10}$.'
          - problem: 'On a trail map with coordinates in kilometres, a ski lift runs in a straight line from the base station at $(0, 0)$ to the top station at $(6, 3)$. What is the exact length of the lift line, in kilometres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true,"form":"simplest_radical"}
            answer: '3*sqrt(5)'
            solution_sketch: 'The differences are $6$ and $3$, so the length is $\sqrt{36 + 9} = \sqrt{45}$. Since $45 = 9 \cdot 5$, the lift line is $3\sqrt{5}$ km long.'
          - problem: 'Find the exact perimeter of the triangle with vertices $A(0, 0)$, $B(4, 4)$ and $C(8, 0)$.'
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            answer: '8 + 8*sqrt(2)'
            solution_sketch: 'Sides $AB$ and $BC$ each have differences $4$ and $4$, so each is $\sqrt{32} = 4\sqrt{2}$. Side $AC$ is $8$, so the perimeter is $8 + 4\sqrt{2} + 4\sqrt{2} = 8 + 8\sqrt{2}$.'
          - problem: 'A garden bed has corners at $A(1, 2)$, $B(5, 4)$ and $C(3, 8)$ on a plan with coordinates in metres. Is the corner at $B$ a right angle?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is a right angle","right angle"],["no","no, it is not","it is not a right angle","not a right angle"]]}
            answer: 'yes'
            solution_sketch: 'Here $AB^2 = 4^2 + 2^2 = 20$, $BC^2 = 2^2 + 4^2 = 20$ and $AC^2 = 2^2 + 6^2 = 40$. Since $20 + 20 = 40$, the converse of the Pythagorean theorem shows that the angle at $B$ is a right angle.'
          - problem: 'Find the exact distance from the origin to the point $(-3, 7)$.'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: 'sqrt(58)'
            solution_sketch: 'The differences are $3$ and $7$, so the distance is $\sqrt{9 + 49} = \sqrt{58}$. Since $58 = 2 \cdot 29$ has no square factor, the radical is already in simplest form.'
        constraints: 'radicands with a perfect-square factor, asked for as exact distances; bare points and plans, maps and flights with units; perimeters as a sum of radicals; one right-angle verdict'
    diagnostic_exemplar:
      problem: 'Find the exact distance from the midpoint of the segment joining $(2, -4)$ and $(8, 10)$ to the point $(3, 7)$.'
      answer_contract: {"kind":"required_simplest_radical"}
      answer: '2*sqrt(5)'
      solution_sketch: 'The midpoint is $(5, 3)$. The distance from $(5, 3)$ to $(3, 7)$ is $\sqrt{2^2 + 4^2} = \sqrt{20} = 2\sqrt{5}$.'
    anki_seeds:
      - front: 'Distance formula between $(x_1, y_1)$ and $(x_2, y_2)$:'
        back: '$\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$'
        type: basic
      - front: 'Midpoint formula between $(x_1, y_1)$ and $(x_2, y_2)$:'
        back: '$\left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right)$'
        type: basic

  - id: partitioning-line-segments
    name: Partitioning Line Segments
    core: false
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Partition points with integer coordinates'
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P$ lies on the segment from $A(1, 2)$ to $B(7, 11)$ so that $AP : PB = 2 : 1$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 8)'
            solution_sketch: '$AP$ is $2$ of the $3$ equal parts of $AB$, so $P$ is $\frac{2}{3}$ of the way from $A$ to $B$. Then $P = (1 + \frac{2}{3} \cdot 6,\ 2 + \frac{2}{3} \cdot 9) = (5, 8)$.'
          - problem: 'A trail runs in a straight line from a trailhead $A(-3, 2)$ to a lake $B(5, -6)$ on a map with coordinates in kilometres. A rest stop $P$ is placed on the trail so that $AP : PB = 3 : 1$. What are the coordinates of $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, -4)'
            solution_sketch: 'The rest stop is $\frac{3}{4}$ of the way from $A$ to $B$, and $B - A = (8, -8)$. So $P = (-3 + 6,\ 2 - 6) = (3, -4)$.'
          - problem: 'Point $P$ lies on the segment from $A(0, 4)$ to $B(8, 0)$ so that $AP : PB = 1 : 3$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 3)'
            solution_sketch: '$P$ is $\frac{1}{4}$ of the way from $A$ to $B$, and $B - A = (8, -4)$. So $P = (0 + 2,\ 4 - 1) = (2, 3)$.'
          - problem: 'A fence rail runs from post $A(-2, -1)$ to post $B(4, 5)$ on a plan with coordinates in metres. A bracket $P$ is fixed on the rail so that $AP : PB = 1 : 2$. What are the coordinates of $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(0, 1)'
            solution_sketch: 'The bracket is $\frac{1}{3}$ of the way from $A$ to $B$, and $B - A = (6, 6)$. So $P = (-2 + 2,\ -1 + 2) = (0, 1)$.'
          - problem: 'A cable runs from $A(0, 30)$ to $B(40, 0)$ in a vertical plane with coordinates in metres, where $x$ runs along the ground and $y$ is the height. A clip $P$ is $\frac{3}{5}$ of the way from $A$ to $B$. What are the coordinates of the clip?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(24, 12)'
            solution_sketch: 'The vector from $A$ to $B$ is $(40, -30)$. The clip is at $A + \frac{3}{5}(40, -30) = (24, 30 - 18) = (24, 12)$.'
          - problem: 'Point $P$ lies on the segment from $A(1, 2)$ to $B(7, 11)$ so that $BP : PA = 2 : 1$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 5)'
            solution_sketch: 'Here $P$ is twice as far from $B$ as from $A$, so $P$ is $\frac{1}{3}$ of the way from $A$ to $B$. Then $P = (1 + 2,\ 2 + 3) = (3, 5)$.'
          - problem: 'The segment from $A(-4, 1)$ to $B(8, 10)$ is cut into three equal parts by two points. Find the coordinates of the point nearer to $B$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 7)'
            solution_sketch: 'The point nearer to $B$ is $\frac{2}{3}$ of the way from $A$ to $B$, and $B - A = (12, 9)$. So the point is $(-4 + 8,\ 1 + 6) = (4, 7)$.'
        constraints: 'ratio m:n or a fraction of the way, with m+n dividing both coordinate differences so P has whole-number coordinates; the direction (from A to B, or from B) is stated; trails, rails, cables and plans with units'
      - id: kp2
        name: 'Partition points with fractional coordinates'
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P$ lies on the segment from $A(-2, 3)$ to $B(3, -1)$ so that $AP : PB = 3 : 2$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, 3/5)'
            solution_sketch: '$P$ is $\frac{3}{5}$ of the way from $A$ to $B$, and $B - A = (5, -4)$. So $P = (-2 + 3,\ 3 - \frac{12}{5}) = (1, \frac{3}{5})$.'
          - problem: 'A water pipe runs from $A(0, 0)$ to $B(5, 2)$ on a plan with coordinates in metres. A valve $P$ sits on the pipe so that $AP : PB = 1 : 4$. What are the coordinates of the valve?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, 2/5)'
            solution_sketch: 'The valve is $\frac{1}{5}$ of the way from $A$ to $B$. So $P = \frac{1}{5}(5, 2) = (1, \frac{2}{5})$.'
          - problem: 'Point $P$ lies on the segment from $A(-1, 2)$ to $B(1, -2)$ so that $AP : PB = 1 : 3$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1/2, 1)'
            solution_sketch: '$P$ is $\frac{1}{4}$ of the way from $A$ to $B$, and $B - A = (2, -4)$. So $P = (-1 + \frac{1}{2},\ 2 - 1) = (-\frac{1}{2}, 1)$.'
          - problem: 'A zip line runs from platform $A(3, 8)$ to platform $B(9, 2)$ on a plan with coordinates in metres. A safety net is hung at the point $P$ of the line with $AP : PB = 3 : 5$. What are the coordinates of $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(21/4, 23/4)'
            solution_sketch: 'The net is $\frac{3}{8}$ of the way from $A$ to $B$, and $B - A = (6, -6)$. So $P = (3 + \frac{9}{4},\ 8 - \frac{9}{4}) = (\frac{21}{4}, \frac{23}{4})$.'
          - problem: 'A drone flies in a straight line from $A(1, -2)$ to $B(5, 4)$, with coordinates in kilometres. Where is the drone when it has covered $\frac{3}{8}$ of the way from $A$ to $B$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5/2, 1/4)'
            solution_sketch: 'The vector from $A$ to $B$ is $(4, 6)$. The drone is at $A + \frac{3}{8}(4, 6) = (1 + \frac{3}{2},\ -2 + \frac{9}{4}) = (\frac{5}{2}, \frac{1}{4})$.'
          - problem: 'Point $P$ lies on the segment from $A(1, 5)$ to $B(4, -2)$ so that $AP : PB = 3 : 1$. Find the coordinates of $P$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(13/4, -1/4)'
            solution_sketch: '$P$ is $\frac{3}{4}$ of the way from $A$ to $B$, and $B - A = (3, -7)$. So $P = (1 + \frac{9}{4},\ 5 - \frac{21}{4}) = (\frac{13}{4}, -\frac{1}{4})$.'
          - problem: 'Kai finds the point $P$ on the segment from $A(0, 0)$ to $B(6, 2)$ with $AP : PB = 1 : 3$ and writes $\left(\frac{1}{3} \cdot 6, \frac{1}{3} \cdot 2\right)$. What are the correct coordinates of $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3/2, 1/2)'
            solution_sketch: 'Kai used the fraction $\frac{1}{3}$, which is the ratio $1 : 3$ read as a fraction. The segment has $1 + 3 = 4$ equal parts, so $P = \frac{1}{4}(6, 2) = (\frac{3}{2}, \frac{1}{2})$.'
        constraints: 'coordinate differences that do not divide evenly by m+n, with denominators 2, 4, 5 or 8 so that decimals terminate; a ratio or a fraction of the way; answers are coordinate pairs; plans and flights with units'
      - id: kp3
        name: 'Recover the ratio or an endpoint'
        key_prerequisites: [distance-midpoint-formulas, ratios-proportions]
        exemplars:
          - problem: 'Point $P(3, 3)$ lies on the segment from $A(1, 2)$ to $B(7, 5)$. $AP$ is what fraction of $PB$?'
            answer_contract: {"kind":"exact"}
            answer: '1/2'
            solution_sketch: 'Here $P - A = (2, 1)$ and $B - A = (6, 3)$, so $P$ is $\frac{1}{3}$ of the way from $A$ to $B$. Then $AP : PB = 1 : 2$, so $AP$ is $\frac{1}{2}$ of $PB$.'
          - problem: 'Point $P(3, 1)$ lies on the segment from $A(-1, -3)$ to $B$ so that $AP : PB = 2 : 3$. Find the coordinates of $B$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(9, 7)'
            solution_sketch: 'Here $P - A = (4, 4)$, and this is $\frac{2}{5}$ of $B - A$. So $B - A = (10, 10)$ and $B = (9, 7)$.'
          - problem: 'A power line runs in a straight line from a substation $A(0, 0)$ to a farm $B$ on a map with coordinates in kilometres. A pylon $P(4, 6)$ stands on the line $\frac{2}{5}$ of the way from $A$ to $B$. What are the coordinates of the farm?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(10, 15)'
            solution_sketch: 'The vector from $A$ to $P$ is $(4, 6)$, and this is $\frac{2}{5}$ of the vector from $A$ to $B$. So $B - A = \frac{5}{2}(4, 6) = (10, 15)$ and $B = (10, 15)$.'
          - problem: 'A surveyor marks a peg $P(2, 2)$ on a straight boundary line from the corner $A(0, 0)$ to the corner $B(5, 5)$, with coordinates in metres. $AP$ is what fraction of $PB$?'
            answer_contract: {"kind":"exact"}
            answer: '2/3'
            solution_sketch: 'Here $P - A = (2, 2)$ and $B - A = (5, 5)$, so $P$ is $\frac{2}{5}$ of the way from $A$ to $B$. Then $AP : PB = 2 : 3$, so $AP$ is $\frac{2}{3}$ of $PB$.'
          - problem: 'A hose runs in a straight line from a tap $A(-5, 1)$ to a sprinkler $B(7, 10)$ on a plan with coordinates in metres. A joint $P(3, 7)$ lies on the hose. How many times as long as $PB$ is $AP$?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Here $P - A = (8, 6)$ and $B - A = (12, 9)$, so $P$ is $\frac{2}{3}$ of the way from $A$ to $B$. Then $AP : PB = 2 : 1$, so $AP$ is $2$ times as long as $PB$.'
          - problem: 'Point $P(1, 6)$ lies on the segment from $A$ to $B(7, 12)$ so that $AP : PB = 1 : 2$. Find the coordinates of $A$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, 3)'
            solution_sketch: 'The point $P$ is $\frac{1}{3}$ of the way from $A$ to $B$, so $P - A = \frac{1}{3}(B - A)$. Writing $A = (x, y)$ gives $1 - x = \frac{7 - x}{3}$ and $6 - y = \frac{12 - y}{3}$, so $x = -2$ and $y = 3$.'
          - problem: 'A ski lift cable runs from the bottom station $A(2, -2)$ to the top station $B(14, 10)$ on a plan with coordinates in metres. A support stands at $P(5, 1)$ on the cable. What fraction of the way from $A$ to $B$ is the support?'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'Here $P - A = (3, 3)$ and $B - A = (12, 12)$. Each coordinate of $P - A$ is $\frac{3}{12} = \frac{1}{4}$ of the matching coordinate of $B - A$, so the support is $\frac{1}{4}$ of the way.'
        constraints: 'P lies on the segment with whole-number data; the ratio is asked as AP compared with PB, or as a fraction of the way; a missing endpoint is found from P and the other end; plans and maps with units'
    diagnostic_exemplar:
      problem: 'Point $P(1, 3)$ lies on the segment from $A(-3, 1)$ to $B$ so that $AP : PB = 2 : 1$. Find the coordinates of $B$.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(3, 4)'
      solution_sketch: 'Here $P - A = (4, 2)$ and this is $\frac{2}{3}$ of $B - A$. So $B - A = (6, 3)$ and $B = (3, 4)$.'
    anki_seeds:
      - front: 'Point dividing the directed segment from A to B in the ratio m:n:'
        back: 'P = A + (m/(m+n))(B - A)'
        type: basic
      - front: "The midpoint is the partition-formula case m:n = ..."
        back: "1:1"
        type: basic

  - id: translations-coordinate-plane
    name: Translations in the Coordinate Plane
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: 'Apply a translation rule'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Apply the translation $(x, y) \to (x + 3, y - 2)$ to the point $(1, 4)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 2)'
            solution_sketch: 'The rule adds $3$ to the $x$-coordinate and subtracts $2$ from the $y$-coordinate. So the image is $(1 + 3, 4 - 2) = (4, 2)$.'
          - problem: 'On a game map where $x$ increases to the east and $y$ increases to the north, a character stands at $(-2, 5)$ and walks four units east and three units south. What are the new coordinates of the character?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 2)'
            solution_sketch: 'Walking east adds $4$ to $x$ and walking south subtracts $3$ from $y$. The new position is $(-2 + 4, 5 - 3) = (2, 2)$.'
          - problem: 'Apply the translation $(x, y) \to (x - 6, y + 3)$ to the point $(4, -5)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, -2)'
            solution_sketch: 'The rule subtracts $6$ from the $x$-coordinate and adds $3$ to the $y$-coordinate. So the image is $(4 - 6, -5 + 3) = (-2, -2)$.'
          - problem: 'Triangle $ABC$ has vertices $A(1, 1)$, $B(4, 1)$ and $C(2, 5)$. The triangle is translated $3$ units left and $2$ units up. Find the coordinates of the image of $C$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1, 7)'
            solution_sketch: 'Moving $3$ units left subtracts $3$ from $x$, and moving $2$ units up adds $2$ to $y$. So $C(2, 5)$ goes to $(2 - 3, 5 + 2) = (-1, 7)$.'
          - problem: 'A crane moves a steel beam along a rail, on a drawing with coordinates in metres where $x$ runs along the rail and $y$ is the height. One end of the beam is at $(12, 4)$. The crane moves the beam $5$ m back toward smaller $x$ and $3$ m up. What are the new coordinates of that end?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 7)'
            solution_sketch: 'Moving back $5$ m subtracts $5$ from $x$, and lifting $3$ m adds $3$ to $y$. The end of the beam is now at $(12 - 5, 4 + 3) = (7, 7)$.'
          - problem: 'The point $(1, 4)$ is translated by $(x, y) \to (x + 3, y - 2)$ and the image is then translated by $(x, y) \to (x - 5, y + 6)$. What are the coordinates of the final image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1, 8)'
            solution_sketch: 'The first translation takes $(1, 4)$ to $(4, 2)$. The second takes $(4, 2)$ to $(4 - 5, 2 + 6) = (-1, 8)$.'
          - problem: 'The segment with endpoints $(-1, 2)$ and $(3, 6)$ is translated by $(x, y) \to (x + 4, y - 5)$. Find the midpoint of the image of the segment.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, -1)'
            solution_sketch: 'The endpoints move to $(3, -3)$ and $(7, 1)$. The midpoint of the image is $\left(\frac{3 + 7}{2}, \frac{-3 + 1}{2}\right) = (5, -1)$.'
        constraints: 'integer coordinates and shifts, given as a rule or as words (left, right, up, down, east, south); images of vertices and of segments; two translations in a row; maps, cranes and plans with units'
      - id: kp2
        name: 'Find the translation rule'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'The translation $(x, y) \to (x + a, y + b)$ maps $(3, 1)$ to $(7, -2)$. Find $(a, b)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, -3)'
            solution_sketch: 'The shift in $x$ is $a = 7 - 3 = 4$. The shift in $y$ is $b = -2 - 1 = -3$.'
          - problem: 'The translation $(x, y) \to (x - 5, y + 1)$ maps some point to $(0, 3)$. Find the original point.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 2)'
            solution_sketch: 'To undo the translation, add $5$ to the $x$-coordinate and subtract $1$ from the $y$-coordinate. The original point is $(0 + 5, 3 - 1) = (5, 2)$.'
          - problem: 'On a floor plan with coordinates in metres, a piano is moved by one translation $(x, y) \to (x + a, y + b)$ so that a corner goes from $(-2, 6)$ to $(4, -1)$. Find $(a, b)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, -7)'
            solution_sketch: 'The shift in $x$ is $a = 4 - (-2) = 6$. The shift in $y$ is $b = -1 - 6 = -7$.'
          - problem: 'A translation maps $A(2, 3)$ to $A''(-1, 7)$. Where does the same translation map $B(5, -2)$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 2)'
            solution_sketch: 'The shift is $(-1 - 2, 7 - 3) = (-3, 4)$. So $B(5, -2)$ goes to $(5 - 3, -2 + 4) = (2, 2)$.'
          - problem: 'A pallet is moved $4$ m east and $6$ m south on a warehouse plan with coordinates in metres, and one corner ends at $(9, -3)$. What were the coordinates of that corner before the move?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 3)'
            solution_sketch: 'To undo the move, subtract $4$ from $x$ and add $6$ to $y$. The corner started at $(9 - 4, -3 + 6) = (5, 3)$.'
          - problem: 'Triangle $ABC$ has vertices $A(1, 2)$, $B(4, 2)$ and $C(1, 6)$. Triangle $DEF$ has vertices $D(5, -1)$, $E(8, -2)$ and $F(5, 3)$. Is $DEF$ the image of $ABC$ under a translation that takes $A$ to $D$, $B$ to $E$ and $C$ to $F$?'
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not a translation image","not a translation"],["yes","yes, it is","it is a translation image"]]}
            answer: 'no'
            solution_sketch: 'The shift from $A$ to $D$ is $(4, -3)$ and the shift from $C$ to $F$ is $(4, -3)$. The shift from $B$ to $E$ is $(4, -4)$, which differs, so no single translation does all three.'
          - problem: 'A sliding window has a pane drawn with one edge from $(1, 1)$ to $(4, 5)$ on a plan with coordinates in decimetres. After it slides, that edge runs from $(3, -2)$ to $(6, 2)$. Is the new edge the image of the old edge under a translation?'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is a translation image"],["no","no, it is not","it is not a translation image","not a translation"]]}
            answer: 'yes'
            solution_sketch: 'The shift from $(1, 1)$ to $(3, -2)$ is $(2, -3)$. The shift from $(4, 5)$ to $(6, 2)$ is also $(2, -3)$, so one translation does both.'
        constraints: 'subtract the original coordinates from the image coordinates to find the shift; reverse items find the original point; one point known to find the image of another; two verdict items on whether one figure is the translation image of another; plans with units'
      - id: kp3
        name: 'Translations are rigid motions'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A segment of length $5$ is translated by $(x, y) \to (x + 7, y - 4)$. What is the length of its image?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'A translation moves every point by the same shift, so it keeps all distances. The image of the segment has the same length, $5$.'
          - problem: 'A rectangular solar panel with an area of $20$ m$^2$ is moved to another place on a roof by a translation. What is the area of the panel in its new place, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '20'
            solution_sketch: 'A translation keeps the size and the shape of a figure. The panel still has an area of $20$ m$^2$ after the move.'
          - problem: 'Triangle $ABC$ has vertices $A(0, 0)$, $B(6, 0)$ and $C(0, 8)$. It is translated by $(x, y) \to (x + 3, y + 2)$ onto triangle $A''B''C''$. Find the length of $\overline{B''C''}$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The translation keeps lengths, so $B''C'' = BC$. By the distance formula, $BC = \sqrt{6^2 + 8^2} = 10$.'
          - problem: 'A triangular steel plate has corners at $(1, 1)$, $(7, 1)$ and $(4, 5)$ on a drawing with coordinates in centimetres. The plate is moved by $(x, y) \to (x - 3, y + 8)$. What is the area of the plate in its new place, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The base is $7 - 1 = 6$ cm and the height is $5 - 1 = 4$ cm, so the area is $\frac{1}{2} \cdot 6 \cdot 4 = 12$ cm$^2$. A translation keeps the area, so the area in the new place is also $12$ cm$^2$.'
          - problem: 'A translation maps a triangle with sides $5$ cm, $12$ cm and $13$ cm onto triangle $P''Q''R''$. Can $P''Q''R''$ have sides of $5$ cm, $11$ cm and $13$ cm?'
            answer_contract: {"kind":"label","options":[["no","no, it cannot","it cannot","not possible"],["yes","yes, it can","it can","possible"]]}
            answer: 'no'
            solution_sketch: 'A translation keeps every side length, so the image has the sides $5$ cm, $12$ cm and $13$ cm. A side of $11$ cm is not among them, so the answer is no.'
          - problem: 'In triangle $ABC$ the angle at $A$ measures $37^\circ$. The triangle is translated $4$ units right and $9$ units down. What is the measure of the angle at the image of $A$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '37'
            solution_sketch: 'A translation keeps all angle measures. The angle at the image of $A$ is still $37^\circ$.'
          - problem: 'The segment from $(1, 2)$ to $(5, 4)$ is translated by $(x, y) \to (x + 3, y - 6)$. What is the slope of the image of the segment?'
            answer_contract: {"kind":"exact"}
            answer: '1/2'
            solution_sketch: 'The image endpoints are $(4, -4)$ and $(8, -2)$. The slope is $\frac{-2 - (-4)}{8 - 4} = \frac{2}{4} = \frac{1}{2}$, the same as the slope of the original segment.'
        constraints: 'lengths, angles, areas and slopes preserved; some items need a computation (a distance, an area, a slope) after the move; one verdict on whether a set of image sides is possible; drawings and roofs with units'
    diagnostic_exemplar:
      problem: 'The translation $(x, y) \to (x + 4, y - 2)$ maps some point to $(1, 5)$. Find the original point.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(-3, 7)'
      solution_sketch: 'To undo the translation, subtract $4$ from the $x$-coordinate and add $2$ to the $y$-coordinate. The original point is $(1 - 4, 5 + 2) = (-3, 7)$.'
    anki_seeds:
      - front: "The translation rule 'a right, b up' in coordinates:"
        back: "(x, y) -> (x + a, y + b)"
        type: basic
      - front: "Rigid motions (translations, reflections, rotations) preserve..."
        back: "distances and angle measures"
        type: basic

  - id: reflections-coordinate-plane
    name: Reflections in the Coordinate Plane
    core: false
    difficulty: 0.28
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: translations-coordinate-plane
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Reflect over the axes
        key_prerequisites: [translations-coordinate-plane]
        exemplars:
          - problem: 'Reflect the point $(3, -2)$ over the x-axis.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 2)'
            solution_sketch: 'The mirror is the x-axis, so the point keeps its $x$-coordinate and its $y$-coordinate changes sign. The image is $(3, -(-2)) = (3, 2)$.'
          - problem: 'Reflect the point $(5, 7)$ over the y-axis.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-5, 7)'
            solution_sketch: 'The mirror is the y-axis, so the height stays the same and the $x$-coordinate changes sign. The image is $(-5, 7)$.'
          - problem: 'A park map uses the main gate as the origin, with the x-axis pointing east and the y-axis pointing north, in metres. A bench stands at $(40, -25)$. A second bench is placed as its mirror image over the x-axis. Where does the second bench stand?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(40, 25)'
            solution_sketch: 'A reflection over the x-axis keeps the $x$-coordinate and negates the $y$-coordinate. So the second bench stands at $(40, 25)$.'
          - problem: 'On a site plan where one unit is one metre, a tree stands at $P(-6, 9)$. Its mirror image over the x-axis is $P''$. How far is $P''$ from $P$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '18'
            solution_sketch: 'The image is $P'' = (-6, -9)$. The two points have the same $x$-coordinate, so the distance is the difference of the heights, $9 - (-9) = 18$ m.'
          - problem: 'A reflection over one of the coordinate axes maps $(4, -7)$ to $(-4, -7)$. Which axis is the mirror?'
            answer_contract: {"kind":"label","options":[["the y-axis","y-axis","the y axis","y axis"],["the x-axis","x-axis","the x axis","x axis"]]}
            answer: 'the y-axis'
            solution_sketch: 'The height $-7$ is unchanged and the $x$-coordinate changed sign from $4$ to $-4$. A reflection that negates only $x$ has the y-axis as its mirror.'
          - problem: 'Triangle $ABC$ has vertices $A(1, 2)$, $B(5, 2)$ and $C(3, 6)$. It is reflected over the y-axis. Where does the image of $C$ lie?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 6)'
            solution_sketch: 'Over the y-axis every point $(x, y)$ goes to $(-x, y)$. So $C(3, 6)$ goes to $(-3, 6)$.'
          - problem: 'A reflection over the x-axis maps point $A$ to $(-3, -8)$. Where is $A$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 8)'
            solution_sketch: 'A reflection over the x-axis is its own inverse, because negating $y$ twice restores it. So $A = (-3, 8)$.'
          - problem: 'Lena reflects the point $(2, -6)$ over the x-axis and writes $(-2, -6)$. What is the correct image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 6)'
            solution_sketch: 'Lena negated the $x$-coordinate, which is the rule for the y-axis. Over the x-axis the $x$-coordinate stays $2$ and the $y$-coordinate $-6$ becomes $6$.'
          - problem: 'A reflection over one of the coordinate axes maps $(4, -7)$ to $(4, 7)$. Which axis is the mirror?'
            answer_contract: {"kind":"label","options":[["the y-axis","y-axis","the y axis","y axis"],["the x-axis","x-axis","the x axis","x axis"]]}
            answer: 'the x-axis'
            solution_sketch: 'The $x$-coordinate $4$ is unchanged and the $y$-coordinate changed sign from $-7$ to $7$. A reflection that negates only $y$ has the x-axis as its mirror.'
        constraints: "integer points; the mirror is a coordinate axis; maps and site plans with units; identify the mirror from a point and its image"
      - id: kp2
        name: Reflect over the line y = x
        key_prerequisites: [translations-coordinate-plane]
        exemplars:
          - problem: 'Reflect the point $(5, -1)$ over the line $y = x$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1, 5)'
            solution_sketch: 'Over the line $y = x$ the two coordinates trade places and keep their signs. So $(5, -1)$ goes to $(-1, 5)$.'
          - problem: 'Reflect the point $(2, 7)$ over the line $y = x$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 2)'
            solution_sketch: 'The coordinates trade places. So $(2, 7)$ goes to $(7, 2)$.'
          - problem: 'A treasure map puts a landmark at $(4, 9)$, in kilometres from the harbour. The map is folded along the line $y = x$, and the landmark is copied to the mirror position on the other half. Where is the copy?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(9, 4)'
            solution_sketch: 'A fold along $y = x$ swaps the coordinates of every point. So the copy of $(4, 9)$ lies at $(9, 4)$.'
          - problem: 'A surveyor reflects the stake at $(-3, -3)$ over the line $y = x$. Where does the image stand?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, -3)'
            solution_sketch: 'The stake has equal coordinates, so it lies on the mirror line $y = x$. A point on the mirror stays where it is, and swapping $-3$ with $-3$ gives $(-3, -3)$.'
          - problem: 'A reflection maps $(3, 8)$ to $(8, 3)$. Which line is the mirror?'
            answer_contract: {"kind":"label","options":[["the line y = x","y = x","the line y=x","y=x","the diagonal"],["the x-axis","x-axis","the x axis","x axis"],["the y-axis","y-axis","the y axis","y axis"]]}
            answer: 'the line y = x'
            solution_sketch: 'Both coordinates changed place and neither sign changed. That is the reflection over the line $y = x$, not over an axis.'
          - problem: 'A sprite on a game screen with the origin at the centre stands at $(-6, 2)$. It is mirrored over the diagonal line $y = x$. Where does the mirror image appear?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, -6)'
            solution_sketch: 'Over the diagonal $y = x$ the coordinates trade places. So $(-6, 2)$ goes to $(2, -6)$.'
          - problem: 'A reflection over the line $y = x$ maps point $A$ to $(-5, 11)$. Where is $A$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(11, -5)'
            solution_sketch: 'Swapping coordinates twice restores the point, so the reflection is its own inverse. Swapping the coordinates of $(-5, 11)$ gives $A = (11, -5)$.'
          - problem: 'On a grid where each unit is $1$ cm, the segment $AB$ has $A(1, 4)$ and $B(6, 4)$. It is reflected over the line $y = x$. How long is the image segment $A''B''$, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The images are $A'' = (4, 1)$ and $B'' = (4, 6)$. They share the $x$-coordinate $4$, so the length is $6 - 1 = 5$ cm, the same as $AB$.'
        constraints: "integer points; the mirror is the line y = x; maps and screens with units; include a point on the mirror and identify the mirror from a point and its image"
      - id: kp3
        name: Reflect over vertical and horizontal lines
        key_prerequisites: [translations-coordinate-plane]
        try_first:
          problem: 'A long mirror stands along the vertical line $x = 6$. A candle burns at $(2, 1)$. How many units is the candle''s image from the mirror?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'The candle is $6 - 2 = 4$ units from the mirror, and its image lies the same distance behind the mirror, at $(10, 1)$. So a point at $x$ goes to $x'' = 2 \cdot 6 - x$ across the line $x = 6$, and in general $x'' = 2a - x$ across $x = a$.'
        exemplars:
          - problem: 'Reflect the point $(1, 3)$ over the vertical line $x = 4$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 3)'
            solution_sketch: 'The point is $3$ units left of the line, so its image is $3$ units right of it. That gives $x'' = 2 \cdot 4 - 1 = 7$, and the height stays $3$.'
          - problem: 'Reflect the point $(2, -5)$ over the horizontal line $y = 1$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 7)'
            solution_sketch: 'The point is $6$ units below the line, so its image is $6$ units above it. That gives $y'' = 2 \cdot 1 - (-5) = 7$, and $x$ stays $2$.'
          - problem: 'A straight fence runs north to south along the line $x = 10$ on a farm map where one unit is one metre. A well is at $(3, 14)$. A second well is dug at its mirror image across the fence. Where is the second well?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(17, 14)'
            solution_sketch: 'The first well is $10 - 3 = 7$ m west of the fence, so the second is $7$ m east of it. Then $x'' = 2 \cdot 10 - 3 = 17$ and the north coordinate stays $14$.'
          - problem: 'A lamp hangs at $(4, 5)$, in metres, above a long horizontal mirror lying along the line $y = -2$. The lamp''s image appears behind the mirror. Where is the image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, -9)'
            solution_sketch: 'The lamp is $5 - (-2) = 7$ m above the mirror, so the image is $7$ m below it. That gives $y'' = 2(-2) - 5 = -9$, and $x$ stays $4$.'
          - problem: 'A reflection over the vertical line $x = 3$ maps point $P$ to $(-2, 6)$. Where is $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(8, 6)'
            solution_sketch: 'The image is $5$ units left of the mirror, so $P$ is $5$ units right of it. Then $x = 2 \cdot 3 - (-2) = 8$, and the height stays $6$.'
          - problem: 'A reflection maps $(1, 3)$ to $(7, 3)$. Find the equation of the mirror line.'
            answer_contract: {"kind":"polynomial_relation"}
            answer: 'x = 4'
            solution_sketch: 'The height is unchanged, so the mirror is vertical. The mirror runs through the midpoint of the two points, and $(1 + 7)/2 = 4$, so the line is $x = 4$.'
          - problem: 'On a map where one unit is one metre, the point $(-2, 5)$ is reflected over the line $x = 3$. How far is the image from the original point, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The image is $(2 \cdot 3 - (-2), 5) = (8, 5)$. The two points have the same height, so the distance is $8 - (-2) = 10$ m.'
          - problem: 'Triangle $ABC$ has $A(0, 0)$, $B(4, 0)$ and $C(4, 3)$. It is reflected over the horizontal line $y = 5$. Find the image of $C$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 7)'
            solution_sketch: 'The vertex $C$ is $5 - 3 = 2$ units below the line, so its image is $2$ units above it. That gives $y'' = 2 \cdot 5 - 3 = 7$ and $x$ stays $4$.'
          - problem: 'Lena reflects $(6, 2)$ over the vertical line $x = 4$ and writes $(-6, 2)$. What is the correct image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 2)'
            solution_sketch: 'Lena reflected over the y-axis, which is the line $x = 0$, not over $x = 4$. The point is $2$ units right of the mirror, so the image is $2$ units left of it: $x'' = 2 \cdot 4 - 6 = 2$.'
        constraints: "image coordinate = 2(line value) - coordinate; integer results; mirror lines x = a or y = b; maps, fences and mirrors with units; find the mirror from a point and its image"
    diagnostic_exemplar:
      problem: 'Reflect the point $(3, -2)$ over the vertical line $x = 5$.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(7, -2)'
      solution_sketch: 'The point is $2$ units left of the line, so its image is $2$ units right of it. That gives $x'' = 2 \cdot 5 - 3 = 7$, and the $y$-coordinate stays $-2$.'

    anki_seeds:
      - front: "Reflection over the x-axis:"
        back: "(x, y) -> (x, -y)"
        type: basic
      - front: "Reflection over the y-axis:"
        back: "(x, y) -> (-x, y)"
        type: basic
      - front: "Reflection over the line y = x:"
        back: "(x, y) -> (y, x)"
        type: basic

  - id: rotations-coordinate-plane
    name: Rotations in the Coordinate Plane
    core: false
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: reflections-coordinate-plane
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Rotate 90 degrees counterclockwise about the origin
        key_prerequisites: [reflections-coordinate-plane]
        try_first:
          problem: 'The point $(5, 0)$ lies on the positive x-axis. It turns $90^\circ$ counterclockwise about the origin and lands on the y-axis. What is its y-coordinate?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'A quarter turn keeps the distance from the origin, so the point $(5, 0)$ lands at $(0, 5)$. In the same way $(0, 5)$ lands at $(-5, 0)$. Both results fit the rule $(x, y) \to (-y, x)$, which holds for every point.'
        exemplars:
          - problem: 'Rotate the point $(3, 1)$ by $90^\circ$ counterclockwise about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1, 3)'
            solution_sketch: 'A quarter turn counterclockwise sends $(x, y)$ to $(-y, x)$. So $(3, 1)$ goes to $(-1, 3)$.'
          - problem: 'Rotate the point $(2, -4)$ by $90^\circ$ counterclockwise about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, 2)'
            solution_sketch: 'The rule $(x, y) \to (-y, x)$ gives $(-(-4), 2) = (4, 2)$. Subtracting a negative number adds.'
          - problem: 'A robot vacuum sits at $(6, -2)$ on a floor plan in metres, with its charging dock at the origin. It swings around the dock through $90^\circ$ counterclockwise at a constant distance from the dock. Where does it stop?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2, 6)'
            solution_sketch: 'Swinging around the dock is a rotation about the origin. The rule $(x, y) \to (-y, x)$ gives $(-(-2), 6) = (2, 6)$.'
          - problem: 'A sprinkler arm pivots at the origin of a lawn plan in metres. Its tip points east at $(7, 0)$. After the arm turns $90^\circ$ counterclockwise, how far is the tip from where it started, to the nearest tenth of a metre?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '9.9'
            solution_sketch: 'The tip moves to $(0, 7)$. The distance between $(7, 0)$ and $(0, 7)$ is $\sqrt{49 + 49} = 7\sqrt{2} \approx 9.9$ m.'
          - problem: 'A $90^\circ$ counterclockwise rotation about the origin takes point $P$ to $(-3, 8)$. Where was $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(8, 3)'
            solution_sketch: 'If $P = (x, y)$, the rule gives $(-y, x) = (-3, 8)$. So $y = 3$ and $x = 8$, and $P = (8, 3)$.'
          - problem: 'Triangle $ABC$ has $A(0, 0)$, $B(4, 0)$ and $C(4, 3)$. It is rotated $90^\circ$ counterclockwise about the origin. Where does the image of $C$ lie?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 4)'
            solution_sketch: 'Each vertex $(x, y)$ goes to $(-y, x)$. So $C(4, 3)$ goes to $(-3, 4)$.'
          - problem: 'Lena rotates the point $(5, 2)$ by $90^\circ$ counterclockwise about the origin and writes $(2, -5)$. What is the correct image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, 5)'
            solution_sketch: 'Lena turned the point clockwise. For a counterclockwise quarter turn $(x, y)$ goes to $(-y, x)$, so $(5, 2)$ goes to $(-2, 5)$.'
          - problem: 'A pivot arm on a plan ends at $(0, -6)$, in metres from the pivot at the origin. The arm turns $90^\circ$ counterclockwise. Where is its end now?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, 0)'
            solution_sketch: 'The rule $(x, y) \to (-y, x)$ gives $(-(-6), 0) = (6, 0)$. The end of the arm now lies on the positive x-axis, $6$ m from the pivot.'
        constraints: "integer points; quarter turn counterclockwise about the origin; floor plans, lawns and arms with units; include the inverse and a distance moved"
      - id: kp2
        name: Rotate 180 degrees about the origin
        key_prerequisites: [reflections-coordinate-plane]
        exemplars:
          - problem: 'Rotate the point $(-5, 2)$ by $180^\circ$ about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, -2)'
            solution_sketch: 'A half turn about the origin sends $(x, y)$ to $(-x, -y)$. So $(-5, 2)$ goes to $(5, -2)$.'
          - problem: 'Rotate the point $(7, -3)$ by $180^\circ$ about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-7, 3)'
            solution_sketch: 'A half turn negates both coordinates. So $(7, -3)$ goes to $(-7, 3)$.'
          - problem: 'A surveyor puts the origin at a flagpole and marks a post at $(12, -5)$, in metres. A second post is placed on the opposite side of the pole, on the same line through it and at the same distance. Where is the second post?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-12, 5)'
            solution_sketch: 'Placing a point on the opposite side of the origin at the same distance is a half turn about the origin. So $(12, -5)$ goes to $(-12, 5)$.'
          - problem: 'A spinning platform in a game turns about the origin. A coin at $(-9, -4)$ is carried through a half turn. Where does the coin end up?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(9, 4)'
            solution_sketch: 'A half turn negates both coordinates. So $(-9, -4)$ goes to $(9, 4)$.'
          - problem: 'A $180^\circ$ rotation about the origin takes point $P$ to $(4, -11)$. Where was $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-4, 11)'
            solution_sketch: 'Two half turns restore a point, so the half turn is its own inverse. Negating both coordinates of $(4, -11)$ gives $P = (-4, 11)$.'
          - problem: 'On a grid where each unit is $1$ cm, the segment $AB$ has $A(2, 1)$ and $B(6, 4)$. It is rotated $180^\circ$ about the origin. How long is the image segment, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The image has endpoints $(-2, -1)$ and $(-6, -4)$, which differ by $4$ and $3$. The length is $\sqrt{16 + 9} = 5$ cm, the same as $AB$.'
          - problem: 'A half turn about the origin takes the point $(k, 3)$ to $(-2, -3)$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'A half turn sends $(k, 3)$ to $(-k, -3)$. So $-k = -2$ and $k = 2$.'
          - problem: 'Lena rotates the point $(4, -6)$ by $180^\circ$ about the origin and writes $(-4, -6)$. What is the correct image?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-4, 6)'
            solution_sketch: 'Lena negated only the $x$-coordinate, which is a reflection over the y-axis. A half turn negates both coordinates, so $(4, -6)$ goes to $(-4, 6)$.'
        constraints: "integer points; half turn about the origin; surveys, platforms and plans with units; include the inverse and a length that is preserved"
      - id: kp3
        name: Rotate 270 degrees and identify rotations
        key_prerequisites: [reflections-coordinate-plane]
        exemplars:
          - problem: 'Rotate the point $(1, 6)$ by $270^\circ$ counterclockwise about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, -1)'
            solution_sketch: 'A $270^\circ$ counterclockwise turn is the same as a $90^\circ$ clockwise turn, and it sends $(x, y)$ to $(y, -x)$. So $(1, 6)$ goes to $(6, -1)$.'
          - problem: 'A rotation about the origin maps $(4, 0)$ to $(0, -4)$. Through how many degrees counterclockwise does it turn the plane?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '270'
            solution_sketch: 'The point on the positive x-axis lands on the negative y-axis. Going counterclockwise from the positive x-axis, that takes three quarter turns, which is $270^\circ$.'
          - problem: 'A windmill hub is at the origin of a plan in metres. The tip of a blade is at $(-4, 6)$. The blade turns $90^\circ$ clockwise. Where is the tip now?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6, 4)'
            solution_sketch: 'A clockwise quarter turn is the same as $270^\circ$ counterclockwise, which sends $(x, y)$ to $(y, -x)$. So $(-4, 6)$ goes to $(6, 4)$.'
          - problem: 'A turntable rotates $270^\circ$ counterclockwise about its centre, the origin of a plan in centimetres. A figurine stands at $(5, -2)$. Where does it stand afterwards?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, -5)'
            solution_sketch: 'The rule for $270^\circ$ counterclockwise is $(x, y) \to (y, -x)$. So $(5, -2)$ goes to $(-2, -5)$.'
          - problem: 'A rotation about the origin maps $(2, 5)$ to $(-5, 2)$. Through how many degrees counterclockwise, less than a full turn, does it turn the plane?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The image $(-5, 2)$ equals $(-y, x)$ for the point $(2, 5)$. That is the rule for a quarter turn counterclockwise, which is $90^\circ$.'
          - problem: 'Rotate the point $(-3, 7)$ by $270^\circ$ counterclockwise about the origin.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(7, 3)'
            solution_sketch: 'The rule $(x, y) \to (y, -x)$ gives $(7, -(-3)) = (7, 3)$.'
          - problem: 'A $270^\circ$ counterclockwise rotation about the origin takes point $P$ to $(-2, -5)$. Where was $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, -2)'
            solution_sketch: 'If $P = (x, y)$, the rule gives $(y, -x) = (-2, -5)$. So $y = -2$ and $x = 5$, and $P = (5, -2)$.'
          - problem: 'Triangle $ABC$ has $A(2, 1)$, $B(5, 1)$ and $C(5, 4)$. It is rotated $270^\circ$ counterclockwise about the origin. Where does the image of $A$ lie?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, -2)'
            solution_sketch: 'The rule $(x, y) \to (y, -x)$ sends $A(2, 1)$ to $(1, -2)$.'
        constraints: "quarter-turn rules only; specify the direction (counterclockwise or clockwise); plans with units; identify the angle of a rotation from a point and its image"
    diagnostic_exemplar:
      problem: 'Rotate the point $(4, -3)$ by $270^\circ$ counterclockwise about the origin.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(-3, -4)'
      solution_sketch: 'The rule for $270^\circ$ counterclockwise is $(x, y) \to (y, -x)$. So $(4, -3)$ goes to $(-3, -4)$.'

    anki_seeds:
      - front: "Rotation 90 degrees counterclockwise about the origin:"
        back: "(x, y) -> (-y, x)"
        type: basic
      - front: "Rotation 180 degrees about the origin:"
        back: "(x, y) -> (-x, -y)"
        type: basic

  - id: line-rotational-symmetry
    name: Line and Rotational Symmetry
    core: false
    difficulty: 0.34
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: rotations-coordinate-plane
        weight: 0.6
        key: true
      - id: interior-angles-polygons
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Count lines of symmetry
        key_prerequisites: [reflections-coordinate-plane]
        exemplars:
          - problem: 'How many lines of symmetry does a regular pentagon have?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'A regular $n$-gon has $n$ lines of symmetry, one through each vertex and the midpoint of the opposite side. Here $n = 5$, so it has $5$ lines.'
          - problem: 'How many lines of symmetry does a rectangle that is not a square have?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'A rectangle that is not a square has one line through the midpoints of each pair of opposite sides. The diagonals are not lines of symmetry, so there are $2$ lines.'
          - problem: 'A "give way" road sign is an equilateral triangle. How many lines of symmetry does its outline have?'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'An equilateral triangle has one line of symmetry through each vertex and the midpoint of the opposite side. That makes $3$ lines.'
          - problem: 'A stop sign is a regular octagon. How many lines of symmetry does the outline of the sign have?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'A regular octagon has $4$ lines through opposite vertices and $4$ lines through midpoints of opposite sides. That makes $8$ lines in all.'
          - problem: 'A tile is cut as a parallelogram with unequal adjacent sides and no right angle. How many lines of symmetry does the tile have?'
            answer_contract: {"kind":"exact"}
            answer: '0'
            solution_sketch: 'A fold along a diagonal does not match the two halves, because the adjacent sides are unequal. A fold through midpoints of opposite sides does not match them either, because the angles are not right angles. So the tile has $0$ lines of symmetry.'
          - problem: 'A sail is cut as a kite. Two adjacent sides of $2$ m meet at the top corner, and two adjacent sides of $3$ m meet at the bottom corner. How many lines of symmetry does the sail have?'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'The line from the top corner to the bottom corner folds the two equal pairs of sides onto each other. No other line works, because the sides of $2$ m and $3$ m differ. So there is $1$ line.'
          - problem: 'A regular polygon has $7$ lines of symmetry. How many sides does it have?'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'A regular $n$-gon has $n$ lines of symmetry, so the number of sides equals the number of lines. The polygon has $7$ sides.'
          - problem: 'A carpenter has a rectangular board that is not a square. He folds a paper copy of it along a diagonal. Do the two halves match exactly?'
            answer_contract: {"kind":"label","options":[["no","no, they do not match","they do not match","the halves do not match"],["yes","yes, they match","they match","the halves match"]]}
            answer: 'no'
            solution_sketch: 'A fold along a diagonal matches the halves only if the two sides at each end of the diagonal are equal. In a rectangle that is not a square, adjacent sides differ, so the diagonal is not a line of symmetry and the halves do not match.'
        constraints: "familiar figures only: triangles by type, quadrilaterals by type, regular polygons up to 12 sides; the answer is a count as a plain integer, or a yes/no verdict about a fold"
      - id: kp2
        name: Order and smallest angle of rotational symmetry
        key_prerequisites: [rotations-coordinate-plane]
        try_first:
          problem: 'A square card is turned about its centre by $90^\circ$, by $180^\circ$, by $270^\circ$ and by $360^\circ$. For how many of these four turns does the card land exactly on its own outline?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'A square lands on its outline after each turn, because turning by one corner position carries every corner to the next corner. The number of such turns up to a full turn is the order of rotational symmetry, which is $4$ for a square. The smallest positive turn is $360^\circ / 4 = 90^\circ$.'
        exemplars:
          - problem: 'What is the smallest positive rotation, in degrees, that maps a regular hexagon onto itself?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The six vertices are equally spaced around the centre, so one turn moves each vertex to the next. The angle is $360^\circ / 6 = 60^\circ$.'
          - problem: 'What is the order of rotational symmetry of a rectangle that is not a square?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Only the half turn $180^\circ$ and the full turn $360^\circ$ map the rectangle onto itself. So there are $2$ rotations, and the order is $2$.'
          - problem: 'A ceiling fan has five identical blades equally spaced around the hub. What is the smallest positive angle, in degrees, through which the fan can turn so that the blades occupy the same positions?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '72'
            solution_sketch: 'The blades are equally spaced, so the fan matches itself after a turn from one blade to the next. That is $360^\circ / 5 = 72^\circ$.'
          - problem: 'A bicycle wheel has $36$ identical spokes equally spaced around the hub. What is the smallest positive angle, in degrees, through which the wheel can turn so that the spokes occupy the same positions?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The spokes are equally spaced, so one step from spoke to spoke is the smallest turn. That is $360^\circ / 36 = 10^\circ$.'
          - problem: 'What is the order of rotational symmetry of a parallelogram that is not a rectangle or a rhombus?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'A half turn about the intersection of the diagonals maps the parallelogram onto itself. No smaller positive turn does, so the order is $2$.'
          - problem: 'What is the order of rotational symmetry of a regular pentagon?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'A regular $n$-gon has rotational symmetry of order $n$. Here $n = 5$, so the order is $5$.'
          - problem: 'What is the order of rotational symmetry of an isosceles triangle that is not equilateral?'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'No turn smaller than a full turn maps the triangle onto itself. The only rotation that works is $360^\circ$, so the order is $1$.'
          - problem: 'A turntable logo has rotational symmetry of order $8$. What is the smallest positive angle, in degrees, through which the logo turns onto itself?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '45'
            solution_sketch: 'The $8$ matching turns are equally spaced within a full turn. The smallest is $360^\circ / 8 = 45^\circ$.'
          - problem: 'Does a regular hexagon map onto itself when it is turned through $120^\circ$ about its centre?'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","it maps onto itself"],["no","no, it does not","it does not","it does not map onto itself"]]}
            answer: 'yes'
            solution_sketch: 'The smallest turn that maps a regular hexagon onto itself is $60^\circ$. Every multiple of $60^\circ$ also works, and $120^\circ = 2 \cdot 60^\circ$, so the hexagon maps onto itself.'
        constraints: "the degree unit is named in the stem, never required in the answer; figures as in kp1 plus the parallelogram; objects with equally spaced parts (fans, wheels, logos); a yes/no verdict about a given turn"
      - id: kp3
        name: Symmetry of regular polygons
        key_prerequisites: [interior-angles-polygons, rotations-coordinate-plane]
        exemplars:
          - problem: 'A regular polygon has a smallest positive rotational symmetry of $24^\circ$. How many sides does it have?'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'The $n$ equal turns make one full turn, so $n \cdot 24 = 360$. Then $n = 360 / 24 = 15$.'
          - problem: 'How many lines of symmetry does a regular polygon with rotational symmetry of order $9$ have?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'A regular $n$-gon has both $n$ lines of symmetry and rotational symmetry of order $n$. Here the order is $9$, so there are $9$ lines.'
          - problem: 'A paving stone is a regular polygon. A tiler finds that the smallest positive turn about its centre that makes the stone fit its own outline is $30^\circ$. How many edges does the stone have?'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The turns that fit the outline are equally spaced, so the stone has $360 / 30 = 12$ of them in a full turn. The stone has $12$ edges.'
          - problem: 'A coaster is a regular polygon with $10$ lines of symmetry. What is the smallest positive angle, in degrees, through which the coaster turns onto its own outline?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '36'
            solution_sketch: 'The number of lines of symmetry equals the number of sides, so the coaster has $10$ sides. The smallest turn is $360^\circ / 10 = 36^\circ$.'
          - problem: 'Each interior angle of a regular polygon is $162^\circ$. What is the smallest positive angle, in degrees, through which the polygon turns onto itself?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '18'
            solution_sketch: 'Each exterior angle is $180^\circ - 162^\circ = 18^\circ$, and the exterior angles add up to $360^\circ$. So there are $360 / 18 = 20$ sides, and the smallest turn is $360^\circ / 20 = 18^\circ$.'
          - problem: 'A regular polygon has a smallest positive rotational symmetry of $45^\circ$. How many lines of symmetry does it have?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'The number of sides is $360 / 45 = 8$. A regular polygon has as many lines of symmetry as sides, so it has $8$ lines.'
          - problem: 'Can a regular polygon have a smallest positive rotational symmetry of $50^\circ$?'
            answer_contract: {"kind":"label","options":[["no","no, it cannot","it cannot","not possible"],["yes","yes, it can","it can","possible"]]}
            answer: 'no'
            solution_sketch: 'The number of sides would be $360 / 50 = 7.2$. A polygon cannot have a fractional number of sides, so no regular polygon has this smallest rotation.'
          - problem: 'Lena reasons that a regular polygon with a smallest positive rotational symmetry of $20^\circ$ has $20$ sides. How many sides does it have?'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'Lena used the angle as the number of sides. The number of sides is $360 / 20 = 18$.'
          - problem: 'Is there a regular polygon whose smallest positive rotational symmetry is $36^\circ$?'
            answer_contract: {"kind":"label","options":[["yes","yes, there is","there is","possible"],["no","no, there is not","there is not","not possible"]]}
            answer: 'yes'
            solution_sketch: 'The number of sides would be $360 / 36 = 10$, a whole number. So a regular decagon has this smallest rotation.'
        constraints: "n between 3 and 24 with 360/n a whole number of degrees (except in the yes/no items on a given angle); convert between side count, order, smallest rotation, interior angle and line count"
    diagnostic_exemplar:
      problem: 'A regular polygon maps onto itself under a rotation of $40^\circ$ and under no smaller positive rotation. How many lines of symmetry does it have?'
      answer_contract: {"kind":"exact"}
      answer: '9'
      solution_sketch: 'The polygon has $360 / 40 = 9$ sides. A regular $n$-gon has $n$ lines of symmetry, so it has $9$ lines.'

    anki_seeds:
      - front: "A regular n-gon has ... lines of symmetry and rotational symmetry of order ..."
        back: "n; n"
        type: basic
      - front: "Smallest positive rotation mapping a regular n-gon to itself:"
        back: "360/n degrees"
        type: basic

  - id: composite-transformations
    name: Compositions of Transformations
    core: false
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: rotations-coordinate-plane
        weight: 0.7
        key: true
      - id: reflections-coordinate-plane
        weight: 0.6
        key: true
      - id: translations-coordinate-plane
        weight: 0.5
        key: false
      - id: rigid-motions-congruence
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Apply a sequence of transformations
        key_prerequisites: [rotations-coordinate-plane, reflections-coordinate-plane, translations-coordinate-plane]
        exemplars:
          - problem: 'Reflect the point $(5, -2)$ over the y-axis, then apply the translation $(x, y) \to (x + 2, y + 3)$. Find the final image.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 1)'
            solution_sketch: 'The reflection sends $(5, -2)$ to $(-5, -2)$. The translation then gives $(-5 + 2, -2 + 3) = (-3, 1)$.'
          - problem: 'Rotate the point $(2, -1)$ by $90^\circ$ counterclockwise about the origin, then reflect the result over the x-axis. Find the final image.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, -2)'
            solution_sketch: 'The rotation sends $(x, y)$ to $(-y, x)$, which gives $(1, 2)$. The reflection over the x-axis then gives $(1, -2)$.'
          - problem: 'A robot starts at $(6, 2)$ on a warehouse plan in metres. It first moves to the mirror image of its position over the y-axis, then drives $4$ m east and $3$ m south. Where does it stop?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, -1)'
            solution_sketch: 'The mirror image of $(6, 2)$ over the y-axis is $(-6, 2)$. Driving $4$ m east and $3$ m south gives $(-6 + 4, 2 - 3) = (-2, -1)$.'
          - problem: 'Apply the translation $(x, y) \to (x - 1, y + 3)$ to the point $(4, -2)$, then rotate the result by $180^\circ$ about the origin. Find the final image.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, -1)'
            solution_sketch: 'The translation gives $(3, 1)$. The half turn about the origin then gives $(-3, -1)$.'
          - problem: 'A floor pattern copies a tile corner at $(2, 5)$, in metres, by a quarter turn counterclockwise about the origin and then a shift of $3$ m west. Where is the copied corner?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-8, 2)'
            solution_sketch: 'The quarter turn sends $(2, 5)$ to $(-5, 2)$. A shift of $3$ m west lowers the $x$-coordinate by $3$, which gives $(-8, 2)$.'
          - problem: 'Reflect the point $(2, 3)$ over the line $y = x$, then rotate the image by $90^\circ$ counterclockwise about the origin. Find the final image.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2, 3)'
            solution_sketch: 'The reflection swaps the coordinates and gives $(3, 2)$. The quarter turn sends $(x, y)$ to $(-y, x)$, so the final image is $(-2, 3)$.'
          - problem: 'The point $(3, 1)$ is rotated $90^\circ$ counterclockwise about the origin and then reflected over the x-axis. Another copy of $(3, 1)$ goes through the same two motions in the opposite order. Do the two copies end at the same point?'
            answer_contract: {"kind":"label","options":[["no","no, they do not","they end at different points","different points"],["yes","yes, they do","they end at the same point","same point"]]}
            answer: 'no'
            solution_sketch: 'Rotation first gives $(-1, 3)$ and then the reflection gives $(-1, -3)$. Reflection first gives $(3, -1)$ and then the rotation gives $(1, 3)$. The two final points differ, so the order matters.'
          - problem: 'A point is reflected over the x-axis and then translated by $(x, y) \to (x + 5, y - 2)$. The final image is $(1, 3)$. Where did the point start?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-4, -5)'
            solution_sketch: 'Undo the translation first: $(1 - 5, 3 + 2) = (-4, 5)$. Then undo the reflection by negating $y$, which gives $(-4, -5)$.'
          - problem: 'The point $(2, -3)$ is translated by $(x, y) \to (x + 1, y)$, then rotated $90^\circ$ counterclockwise about the origin, then reflected over the y-axis. Find the final image.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 3)'
            solution_sketch: 'The translation gives $(3, -3)$. The quarter turn gives $(3, 3)$. The reflection over the y-axis gives $(-3, 3)$.'
          - problem: 'The point $(3, 1)$ is reflected over the x-axis and then reflected over the y-axis. Another copy goes through the same two reflections in the opposite order. Do the two copies end at the same point?'
            answer_contract: {"kind":"label","options":[["yes","yes, they do","they end at the same point","same point"],["no","no, they do not","they end at different points","different points"]]}
            answer: 'yes'
            solution_sketch: 'The x-axis first gives $(3, -1)$ and then the y-axis gives $(-3, -1)$. The y-axis first gives $(-3, 1)$ and then the x-axis gives $(-3, -1)$. Both copies end at $(-3, -1)$.'
        constraints: "two or three steps from the single-motion menus (axis and y = x reflections, quarter-turn rotations about the origin, integer translations); apply strictly in the stated order and vary the order across problems since composition is not commutative; integer coordinates throughout; plans with units; include one undo-the-steps item and verdicts on whether the order matters"
      - id: kp2
        name: Find the single equivalent motion
        key_prerequisites: [rotations-coordinate-plane, reflections-coordinate-plane]
        try_first:
          problem: 'The point $(1, 0)$ is reflected over the y-axis and the image is then reflected over the vertical line $x = 5$. What is the x-coordinate of the final image?'
          answer_contract: {"kind":"exact"}
          answer: '11'
          reveal: 'The first reflection gives $(-1, 0)$. The second gives $x'' = 2 \cdot 5 - (-1) = 11$. The point moved $10$ units to the right, which is twice the gap of $5$ between the two mirrors, and every point would move by the same amount, so two parallel reflections make a translation.'
        exemplars:
          - problem: 'Reflecting over the parallel vertical lines $x = 3$ and then $x = 11$ is equivalent to a horizontal translation $(x, y) \to (x + k, y)$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '16'
            solution_sketch: 'The first reflection sends $x$ to $6 - x$. The second sends that to $22 - (6 - x) = x + 16$, so $k = 16$, twice the gap $11 - 3 = 8$.'
          - problem: 'Two parallel mirrors lie along the lines $y = 2$ and $y = 9$, with units in centimetres. A dot of light at $(5, 1)$ is reflected first in the mirror along $y = 2$ and then in the mirror along $y = 9$. How far is the final image from the original dot, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '14'
            solution_sketch: 'The first image is at $y = 2 \cdot 2 - 1 = 3$. The second image is at $y = 2 \cdot 9 - 3 = 15$. The dot moved $15 - 1 = 14$ cm, which is twice the gap $9 - 2 = 7$.'
          - problem: 'A lazy Susan on a table is turned $200^\circ$ counterclockwise about its centre and then $130^\circ$ counterclockwise about the same centre. A single counterclockwise turn through how many degrees, less than a full turn, gives the same position?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '330'
            solution_sketch: 'Rotations about the same centre compose by adding their angles. The sum is $200 + 130 = 330$, which is less than $360$, so the single turn is $330^\circ$.'
          - problem: 'Two straight mirrors meet along an edge at an angle of $35^\circ$. A figure is reflected in one mirror and then in the other. The two reflections are equivalent to a single rotation about the edge. Through how many degrees?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '70'
            solution_sketch: 'Two reflections over lines that meet at an angle make a rotation through twice that angle about the meeting point. So the rotation is $2 \cdot 35 = 70$ degrees.'
          - problem: 'Reflecting a figure over a line and then over a second line that is parallel to the first is equivalent to which single motion?'
            answer_contract: {"kind":"label","options":[["a translation","translation","a slide","slide"],["a rotation","rotation","a turn","turn"],["a reflection","reflection","a mirror image","mirror image"],["a glide reflection","glide reflection","glide"]]}
            answer: 'a translation'
            solution_sketch: 'Each mirror carries a point to the same distance on its other side, and the two crossings shift every point by the same amount in the same direction. A shift of the whole plane is a translation.'
          - problem: 'The composition of reflections over the parallel horizontal lines $y = 1$ and then $y = 4$ is a vertical translation $(x, y) \to (x, y + k)$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The first reflection sends $y$ to $2 - y$. The second sends that to $8 - (2 - y) = y + 6$, so $k = 6$, twice the gap $4 - 1 = 3$.'
          - problem: 'Reflecting over the x-axis and then over the y-axis is equivalent to which single motion?'
            answer_contract: {"kind":"label","options":[["a rotation","rotation","a half turn","half turn","a turn"],["a translation","translation","a slide","slide"],["a reflection","reflection","a mirror image","mirror image"],["a glide reflection","glide reflection","glide"]]}
            answer: 'a rotation'
            solution_sketch: 'The point $(x, y)$ goes to $(x, -y)$ and then to $(-x, -y)$. That is the rule for a half turn, so the composition is a rotation of $180^\circ$ about the origin.'
          - problem: 'The composition of reflections over the horizontal lines $y = 3$ and then $y = -1$ is a vertical translation $(x, y) \to (x, y + k)$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '-8'
            solution_sketch: 'The first reflection sends $y$ to $6 - y$. The second sends that to $-2 - (6 - y) = y - 8$, so $k = -8$. The shift is twice the gap $3 - (-1) = 4$, directed from the first mirror toward the second.'
          - problem: 'A $270^\circ$ counterclockwise rotation about the origin is followed by a $180^\circ$ counterclockwise rotation about the origin. The composition is a single counterclockwise rotation through how many degrees, less than a full turn?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'Rotations about the same centre compose by adding their angles. The sum is $270 + 180 = 450$, and removing one full turn leaves $450 - 360 = 90$ degrees.'
        constraints: "compositions with clean classifications: two axis reflections (rotation by 180), reflections over two parallel horizontal or vertical lines (translation by twice the gap, with sign), two reflections over lines meeting at a given angle (rotation by twice the angle), rotations about one centre (add the angles mod 360); the answer is a single number (degrees or the translation amount) or the name of the single motion"
      - id: kp3
        name: Glide reflections
        key_prerequisites: [reflections-coordinate-plane, translations-coordinate-plane]
        exemplars:
          - problem: 'A glide reflection reflects over the x-axis, then translates by $(x, y) \to (x + 6, y)$. Find the image of the point $(-1, 5)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, -5)'
            solution_sketch: 'The reflection over the x-axis sends $(-1, 5)$ to $(-1, -5)$. The glide along the mirror then gives $(-1 + 6, -5) = (5, -5)$.'
          - problem: 'A glide reflection reflects over the y-axis, then translates by $(x, y) \to (x, y - 3)$. Find the image of the point $(-4, 2)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4, -1)'
            solution_sketch: 'The reflection over the y-axis sends $(-4, 2)$ to $(4, 2)$. The glide along the mirror then gives $(4, 2 - 3) = (4, -1)$.'
          - problem: 'Footprints in wet sand follow the x-axis, in centimetres. A left heel print is at $(10, 12)$. The next print, from the right foot, is its glide reflection: a reflection over the x-axis followed by a slide of $60$ cm along it in the positive $x$ direction. Where is the right heel print?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(70, -12)'
            solution_sketch: 'The reflection over the x-axis sends $(10, 12)$ to $(10, -12)$. The slide of $60$ cm along the x-axis gives $(10 + 60, -12) = (70, -12)$.'
          - problem: 'A wall border repeats a motif by a glide reflection: a reflection over the x-axis followed by a slide of $25$ cm in the positive $x$ direction. A corner of the first motif is at $(3, 8)$. Where is the matching corner two repeats later, with units in centimetres?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(53, 8)'
            solution_sketch: 'The first repeat sends $(3, 8)$ to $(28, -8)$. The second sends $(28, -8)$ to $(53, 8)$. Two glide reflections cancel the reflection and leave a slide of $50$ cm.'
          - problem: 'A rope $AB$ with $A(1, 2)$ and $B(1, 9)$ is laid on a plan in metres. A glide reflection maps it to $A''B''$. How long is $A''B''$, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '7'
            solution_sketch: 'A glide reflection is a reflection followed by a translation, and both preserve lengths. So $A''B''$ has the same length as $AB$, which is $9 - 2 = 7$ m.'
          - problem: 'A glide reflection reflects over the y-axis, then translates by $(x, y) \to (x, y + 5)$. Find the image of the point $(-3, -2)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 3)'
            solution_sketch: 'The reflection over the y-axis sends $(-3, -2)$ to $(3, -2)$. The glide along the mirror then gives $(3, -2 + 5) = (3, 3)$.'
          - problem: 'A glide reflection reflects over the x-axis, then translates by $(x, y) \to (x + 4, y)$. It maps point $P$ to $(1, -6)$. Where is $P$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 6)'
            solution_sketch: 'Undo the translation first: $(1 - 4, -6) = (-3, -6)$. Then undo the reflection by negating $y$, which gives $P = (-3, 6)$.'
          - problem: 'A glide reflection reflects over the x-axis, then translates by $(x, y) \to (x - 2, y)$. Find the image of the point $(5, 0)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 0)'
            solution_sketch: 'The point $(5, 0)$ lies on the mirror, so the reflection leaves it at $(5, 0)$. The glide then gives $(5 - 2, 0) = (3, 0)$.'
          - problem: 'In triangle $PQR$ the angle at $Q$ is $52^\circ$. A glide reflection maps the triangle to $P''Q''R''$. What is the measure of the angle at $Q''$?'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '52'
            solution_sketch: 'A glide reflection is a reflection followed by a translation, and both preserve angle measures. So the angle at $Q''$ is $52^\circ$ too.'
        constraints: "the mirror is a coordinate axis and the translation is parallel to that axis (the defining condition); integer coordinates; ground and wall patterns with units; include an invariance question, since glide reflections are rigid motions"
    diagnostic_exemplar:
      problem: 'A glide reflection reflects over the $x$-axis and then translates by $(x, y) \to (x + 5, y)$. Find the image of the point $(-2, 4)$.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(3, -4)'
      solution_sketch: 'The reflection sends $(-2, 4)$ to $(-2, -4)$. The glide along the mirror then gives $(3, -4)$.'

    anki_seeds:
      - front: "A glide reflection is the composition of..."
        back: "a reflection and a translation parallel to the mirror line"
        type: basic
      - front: "Reflecting over two parallel lines a distance d apart is equivalent to..."
        back: "a translation of 2d perpendicular to the lines"
        type: basic
      - front: "Reflecting over two lines meeting at angle theta is equivalent to..."
        back: "a rotation of 2 x theta about their intersection point"
        type: basic

  - id: volume-prisms
    name: Volumes of Prisms
    core: true
    difficulty: 0.30
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: triangle-area
        weight: 0.7
        key: true
      - id: parallelogram-trapezoid-area
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Rectangular prisms and cubes
        key_prerequisites: [triangle-area]
        try_first:
          problem: 'A box is $4$ cm long, $3$ cm wide and $2$ cm high on the inside. How many cubes with edges of $1$ cm fit into it exactly, with no gaps?'
          answer_contract: {"kind":"exact"}
          answer: '24'
          reveal: 'One layer on the floor holds $4 \cdot 3 = 12$ cubes, and the box holds $2$ such layers, so $12 \cdot 2 = 24$ cubes. Each cube has volume $1$ cm$^3$, so the volume of a box is its length times its width times its height.'
        exemplars:
          - problem: 'A rectangular prism is $6$ cm long, $2$ cm wide and $5$ cm high. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The volume of a rectangular prism is length times width times height. Here $6 \cdot 2 \cdot 5 = 60$, so the volume is $60$ cm$^3$.'
          - problem: 'A cube has edges of length $5$ cm. What is its volume?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '125'
            solution_sketch: 'All three edges of a cube are equal, so the volume is the edge cubed. That gives $5^3 = 125$ cm$^3$.'
          - problem: 'A swimming pool is $25$ m long and $10$ m wide, and the water in it is $2$ m deep. How many cubic metres of water does the pool hold?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '500'
            solution_sketch: 'The water forms a rectangular prism $25$ m by $10$ m by $2$ m. Its volume is $25 \cdot 10 \cdot 2 = 500$ m$^3$.'
          - problem: 'A shipping crate is $1.2$ m long, $0.5$ m wide and $0.8$ m high. What is the volume of the crate, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '0.48'
            solution_sketch: 'The volume is length times width times height. Here $1.2 \cdot 0.5 = 0.6$, and $0.6 \cdot 0.8 = 0.48$ m$^3$.'
          - problem: 'A cube has a volume of $343$ cm$^3$. How long is each edge?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '7'
            solution_sketch: 'The volume of a cube is the edge cubed, so the edge is the number whose cube is $343$. Since $7 \cdot 7 \cdot 7 = 343$, each edge is $7$ cm long.'
          - problem: 'A builder pours a concrete slab for a shed floor. The slab is $4$ m long, $3$ m wide and $0.1$ m thick. How many cubic metres of concrete does it need?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '1.2'
            solution_sketch: 'The slab is a rectangular prism with a volume of $4 \cdot 3 \cdot 0.1$. That product is $1.2$ m$^3$.'
          - problem: 'A fish tank is $60$ cm long and $30$ cm wide. It is filled with water to a depth of $25$ cm. How many litres of water are in the tank? One litre is $1000$ cm$^3$.'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"l","allow_omitted":true}
            answer: '45'
            solution_sketch: 'The water has a volume of $60 \cdot 30 \cdot 25 = 45000$ cm$^3$. Dividing by $1000$ cm$^3$ per litre gives $45$ litres.'
          - problem: 'Lena finds the volume of a cube with edges of $6$ cm and writes $18$ cm$^3$. What is the correct volume?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '216'
            solution_sketch: 'Lena added the three edges instead of multiplying them. The volume of a cube is the edge cubed, so $6^3 = 216$ cm$^3$.'
        constraints: 'rectangular prisms and cubes with whole, decimal or metric edges; pools, crates, slabs and tanks; one named-error item; a litre conversion with the factor given'
      - id: kp2
        name: Triangular prisms
        key_prerequisites: [triangle-area]
        exemplars:
          - problem: 'A triangular prism has a triangular base with base $8$ cm and height $5$ cm. The prism is $12$ cm long. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '240'
            solution_sketch: 'The area of the triangular base is $\frac{1}{2} \cdot 8 \cdot 5 = 20$ cm$^2$. The volume is the base area times the length, $20 \cdot 12 = 240$ cm$^3$.'
          - problem: 'The triangular end of a tent has a base of $3$ m and a height of $2$ m, and the tent is $5$ m long. How many cubic metres of air does the tent enclose?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The tent is a triangular prism. Its end has area $\frac{1}{2} \cdot 3 \cdot 2 = 3$ m$^2$, so the volume is $3 \cdot 5 = 15$ m$^3$.'
          - problem: 'The base of a prism is a right triangle with legs of $5$ cm and $12$ cm. The prism is $9$ cm long. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '270'
            solution_sketch: 'The legs of a right triangle are its base and height, so the base area is $\frac{1}{2} \cdot 5 \cdot 12 = 30$ cm$^2$. The volume is $30 \cdot 9 = 270$ cm$^3$.'
          - problem: 'A doorstop is a wedge in the shape of a triangular prism. Its triangular face is a right triangle with legs of $9$ cm and $4$ cm, and the wedge is $6$ cm wide. What is the volume of the wedge?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '108'
            solution_sketch: 'The triangular face has area $\frac{1}{2} \cdot 9 \cdot 4 = 18$ cm$^2$. Multiplying by the width of $6$ cm gives $18 \cdot 6 = 108$ cm$^3$.'
          - problem: 'The base of a prism is a right triangle with a hypotenuse of $13$ cm and one leg of $5$ cm. The prism is $10$ cm long. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '300'
            solution_sketch: 'The other leg is $\sqrt{13^2 - 5^2} = \sqrt{144} = 12$ cm. The base area is $\frac{1}{2} \cdot 5 \cdot 12 = 30$ cm$^2$, so the volume is $30 \cdot 10 = 300$ cm$^3$.'
          - problem: 'The roof space of a barn is a triangular prism. Its triangular front is $8$ m wide and rises $3$ m from the loft floor to the ridge, and the barn is $15$ m long. How many cubic metres of space are under the roof?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '180'
            solution_sketch: 'The front of the roof space is a triangle with base $8$ m and height $3$ m, so its area is $12$ m$^2$. Over a length of $15$ m the space has a volume of $12 \cdot 15 = 180$ m$^3$.'
          - problem: 'A prism has an isosceles triangle as its base. The two equal sides are $13$ cm long and the third side is $10$ cm long. The prism is $20$ cm long. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '1200'
            solution_sketch: 'The height of the triangle on the $10$ cm side splits it into two right triangles with a hypotenuse of $13$ cm and a leg of $5$ cm, so the height is $12$ cm. The base area is $\frac{1}{2} \cdot 10 \cdot 12 = 60$ cm$^2$ and the volume is $60 \cdot 20 = 1200$ cm$^3$.'
          - problem: 'A water trough is a triangular prism. Its triangular end is $60$ cm wide at the top and $40$ cm deep, and the trough is $2$ m long. How many litres of water does the full trough hold? One litre is $1000$ cm$^3$.'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"l","allow_omitted":true}
            answer: '240'
            solution_sketch: 'The end of the trough has area $\frac{1}{2} \cdot 60 \cdot 40 = 1200$ cm$^2$. The length is $200$ cm, so the volume is $1200 \cdot 200 = 240000$ cm$^3$, which is $240$ litres.'
        constraints: 'triangular bases from base and height, right-triangle legs, a hypotenuse that needs a leg, and an isosceles base; tents, roofs, wedges and troughs'
      - id: kp3
        name: Any prism is base area times height
        key_prerequisites: [triangle-area, parallelogram-trapezoid-area]
        exemplars:
          - problem: 'A prism has a base with an area of $22$ cm$^2$ and a height of $5$ cm. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '110'
            solution_sketch: 'The volume of any prism is the base area times the height. Here $22 \cdot 5 = 110$ cm$^3$.'
          - problem: 'A swimming pool is $10$ m wide and $20$ m long. Its floor slopes steadily from a depth of $1$ m at the shallow end to a depth of $3$ m at the deep end. How many cubic metres of water fill the pool?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '400'
            solution_sketch: 'The side wall of the pool is a trapezoid with parallel sides $1$ m and $3$ m and a width of $20$ m, so its area is $\frac{1}{2}(1 + 3) \cdot 20 = 40$ m$^2$. The pool is a prism that is $10$ m wide, so the volume is $40 \cdot 10 = 400$ m$^3$.'
          - problem: 'The cross-section of a concrete kerb is a trapezoid with parallel sides of $20$ cm and $30$ cm and a distance of $15$ cm between them. The kerb is $2$ m long. How many cubic metres of concrete does it contain?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '0.075'
            solution_sketch: 'The cross-section has area $\frac{1}{2}(20 + 30) \cdot 15 = 375$ cm$^2$. The length is $200$ cm, so the volume is $375 \cdot 200 = 75000$ cm$^3$, which is $0.075$ m$^3$.'
          - problem: 'The base of a prism is a parallelogram with base $9$ cm and height $4$ cm. The prism is $5$ cm tall. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '180'
            solution_sketch: 'The base area of a parallelogram is base times height, $9 \cdot 4 = 36$ cm$^2$. The volume is $36 \cdot 5 = 180$ cm$^3$.'
          - problem: 'The base of a prism is an L-shaped hexagon. It is a $6$ cm by $4$ cm rectangle with a $2$ cm by $2$ cm square removed from one corner. The prism is $10$ cm tall. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '200'
            solution_sketch: 'The base area is the rectangle minus the square, $6 \cdot 4 - 2 \cdot 2 = 20$ cm$^2$. The volume is $20 \cdot 10 = 200$ cm$^3$.'
          - problem: 'A leaning prism has a rectangular base $4$ cm by $6$ cm. Its slanted edges are $12$ cm long, and the perpendicular distance between the top face and the base is $10$ cm. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '240'
            solution_sketch: 'The height of a prism is the perpendicular distance between its bases, not the length of a slanted edge. So the volume is $4 \cdot 6 \cdot 10 = 240$ cm$^3$.'
          - problem: 'A hexagonal pencil has a cross-section of area $0.4$ cm$^2$ and is $18$ cm long. What is the volume of the pencil?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '7.2'
            solution_sketch: 'The pencil is a prism whose base is the hexagonal cross-section. The volume is $0.4 \cdot 18 = 7.2$ cm$^3$.'
          - problem: 'Two stacks of $100$ identical coins have the same height. One stack is straight and the other leans to the side. Which principle explains why the two stacks have the same volume?'
            answer_contract: {"kind":"label","options":[["Cavalieri's principle", "Cavalieri", "the Cavalieri principle"], ["the Pythagorean theorem", "Pythagorean theorem", "Pythagoras"], ["the triangle inequality", "triangle inequality"], ["the distributive property", "distributive property"]]}
            answer: 'Cavalieri''s principle'
            solution_sketch: 'Each coin is a layer of the same area at the same height in both stacks. Cavalieri''s principle says that solids with equal cross-sections at every height have equal volumes.'
        constraints: 'V = (base area) x height for trapezoid, parallelogram and L-shaped bases, a sloping pool floor, a leaning prism, and one justification item'
    diagnostic_exemplar:
      problem: 'A prism has a trapezoid as its base, with parallel sides of $5$ cm and $9$ cm and a distance of $4$ cm between them. The prism is $7$ cm long. Find its volume.'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '196'
      solution_sketch: 'The base area is $\frac{1}{2}(5 + 9) \cdot 4 = 28$ cm$^2$. The volume is $28 \cdot 7 = 196$ cm$^3$.'
    anki_seeds:
      - front: "Volume of a rectangular prism:"
        back: "length x width x height"
        type: basic
      - front: "A cross-section of a prism taken parallel to its base is..."
        back: "congruent to the base — the cross-section is uniform along the prism, which is why V = (base area) x height."
        type: basic

  - id: volume-cylinders
    name: Volumes of Cylinders
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: circle-area-circumference
        weight: 0.7
        key: true
      - id: volume-prisms
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Cylinder volume from the radius
        key_prerequisites: [circle-area-circumference]
        exemplars:
          - problem: 'A cylinder has a radius of $3$ cm and a height of $7$ cm. Find its exact volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '63*pi'
            solution_sketch: 'The base is a circle of area $\pi \cdot 3^2 = 9\pi$ cm$^2$. Multiplying by the height $7$ gives $V = 63\pi$ cm$^3$.'
          - problem: 'A cylindrical drinking glass has an inside radius of $3.5$ cm. It is filled with water to a height of $10$ cm. To the nearest cubic centimetre, how much water is in the glass?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '385'
            solution_sketch: 'The water is a cylinder with $r = 3.5$ cm and $h = 10$ cm. Then $V = \pi \cdot 3.5^2 \cdot 10 = 122.5\pi \approx 384.8$, which is $385$ cm$^3$ to the nearest unit.'
          - problem: 'A concrete pillar is a cylinder with a radius of $0.3$ m and a height of $4$ m. What is the exact volume of the pillar, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '0.36*pi'
            solution_sketch: 'The base area is $\pi \cdot 0.3^2 = 0.09\pi$ m$^2$. Multiplying by the height $4$ m gives $0.36\pi$ m$^3$.'
          - problem: 'A cylinder has a radius of $2$ and a height of $9$. Find its exact volume.'
            answer_contract: {"kind":"exact"}
            answer: '36*pi'
            solution_sketch: 'The volume is $\pi r^2 h$. With $r = 2$ and $h = 9$ this is $\pi \cdot 4 \cdot 9 = 36\pi$.'
          - problem: 'A tin of soup has a radius of $3.6$ cm and a height of $11$ cm. To the nearest cubic centimetre, what volume does the tin hold?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '448'
            solution_sketch: 'The volume is $\pi \cdot 3.6^2 \cdot 11 = 142.56\pi \approx 447.9$. To the nearest unit this is $448$ cm$^3$.'
          - problem: 'A rain barrel is a cylinder with a radius of $40$ cm and a height of $90$ cm. To the nearest litre, how much water does the full barrel hold? One litre is $1000$ cm$^3$.'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '452'
            solution_sketch: 'The volume is $\pi \cdot 40^2 \cdot 90 = 144000\pi \approx 452389$ cm$^3$. Dividing by $1000$ gives $452$ litres to the nearest litre.'
          - problem: 'Lena finds the volume of a cylinder with a radius of $3$ cm and a height of $8$ cm. She writes $24\pi$ cm$^3$. What is the correct volume?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '72*pi'
            solution_sketch: 'Lena multiplied the radius by the height and forgot to square the radius. The volume is $\pi \cdot 3^2 \cdot 8 = 72\pi$ cm$^3$.'
        constraints: 'radius given as a whole or decimal number; exact answers in terms of pi or rounded with a named unit; glasses, tins, pillars and barrels; one named-error item'
      - id: kp2
        name: Cylinder volume from the diameter
        key_prerequisites: [circle-area-circumference]
        exemplars:
          - problem: 'A cylinder has a diameter of $10$ cm and a height of $4$ cm. Find its exact volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '100*pi'
            solution_sketch: 'The radius is half the diameter, $5$ cm. The volume is $\pi \cdot 5^2 \cdot 4 = 100\pi$ cm$^3$.'
          - problem: 'A cylindrical storage tank has a diameter of $6$ m and a height of $5$ m. What is the exact volume of the tank, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '45*pi'
            solution_sketch: 'The radius is $3$ m. The volume is $\pi \cdot 3^2 \cdot 5 = 45\pi$ m$^3$.'
          - problem: 'A can of paint has a diameter of $16$ cm and a height of $18$ cm. To the nearest cubic centimetre, what is the volume of the can?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '3619'
            solution_sketch: 'The radius is $8$ cm, so the volume is $\pi \cdot 8^2 \cdot 18 = 1152\pi$. This is about $3619.1$, which is $3619$ cm$^3$ to the nearest unit.'
          - problem: 'A drainpipe has an inside diameter of $20$ cm and a length of $3$ m. To three decimal places, how many cubic metres of water fill the pipe?'
            answer_contract: {"kind":"approx","decimals":3}
            answer: '0.094'
            solution_sketch: 'The inside radius is $10$ cm, which is $0.1$ m. The volume is $\pi \cdot 0.1^2 \cdot 3 = 0.03\pi \approx 0.0942$, so $0.094$ m$^3$ to three decimal places.'
          - problem: 'A round wheel of cheese has a diameter of $28$ cm and a height of $9$ cm. To the nearest cubic centimetre, what is its volume?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '5542'
            solution_sketch: 'The radius is $14$ cm. The volume is $\pi \cdot 14^2 \cdot 9 = 1764\pi \approx 5541.8$, which is $5542$ cm$^3$ to the nearest unit.'
          - problem: 'The diameter of a cylinder is $14$ and its height is $3$. Find its exact volume.'
            answer_contract: {"kind":"exact"}
            answer: '147*pi'
            solution_sketch: 'The radius is $7$. The volume is $\pi \cdot 7^2 \cdot 3 = 147\pi$.'
          - problem: 'A cylinder is $5$ cm tall. The circumference of its circular base is $12\pi$ cm. Find the exact volume of the cylinder.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '180*pi'
            solution_sketch: 'The circumference is $2\pi r = 12\pi$, so the radius is $6$ cm. The volume is $\pi \cdot 6^2 \cdot 5 = 180\pi$ cm$^3$.'
        constraints: 'diameter or circumference of the base given, so the radius is found first; tanks, cans, pipes and cheese'
      - id: kp3
        name: Applications and comparisons
        key_prerequisites: [circle-area-circumference, volume-prisms]
        exemplars:
          - problem: 'Tin A has a radius of $2$ cm and a height of $10$ cm. Tin B has a radius of $4$ cm and a height of $3$ cm. By exactly how many cubic centimetres does the larger tin hold more than the smaller one?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '8*pi'
            solution_sketch: 'Tin A holds $\pi \cdot 4 \cdot 10 = 40\pi$ cm$^3$ and tin B holds $\pi \cdot 16 \cdot 3 = 48\pi$ cm$^3$. Tin B is larger, by $48\pi - 40\pi = 8\pi$ cm$^3$.'
          - problem: 'A cylindrical water tank has a diameter of $12$ m and a height of $5$ m. What is the exact volume of the tank, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '180*pi'
            solution_sketch: 'The radius is $6$ m. The volume is $\pi \cdot 6^2 \cdot 5 = 180\pi$ m$^3$.'
          - problem: 'A stone pillar in a courtyard is a cylinder with a radius of $0.4$ m and a height of $3$ m. To one decimal place, what is its volume in cubic metres?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '1.5'
            solution_sketch: 'The volume is $\pi \cdot 0.4^2 \cdot 3 = 0.48\pi \approx 1.508$. To one decimal place this is $1.5$ m$^3$.'
          - problem: 'Does a tin with a radius of $3$ cm and a height of $8$ cm hold the same amount as a tin with a radius of $4$ cm and a height of $4.5$ cm?'
            answer_contract: {"kind":"label","options":[["yes", "yes, they hold the same", "they hold the same", "the same", "they are equal"], ["no", "no, they do not", "they differ", "different"]]}
            answer: 'yes'
            solution_sketch: 'The first tin holds $\pi \cdot 3^2 \cdot 8 = 72\pi$ cm$^3$. The second holds $\pi \cdot 4^2 \cdot 4.5 = 72\pi$ cm$^3$, so the amounts are equal.'
          - problem: 'A full jug is a cylinder with a radius of $6$ cm and a height of $20$ cm. All its water is poured into an empty cylindrical bowl with a radius of $10$ cm. How deep is the water in the bowl, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '7.2'
            solution_sketch: 'The jug holds $\pi \cdot 6^2 \cdot 20 = 720\pi$ cm$^3$. In the bowl $\pi \cdot 10^2 \cdot h = 720\pi$, so $h = 7.2$ cm.'
          - problem: 'A water pipe has an inside diameter of $4$ cm and is $5$ m long. To the nearest tenth of a litre, how much water does the pipe hold when it is full? One litre is $1000$ cm$^3$.'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '6.3'
            solution_sketch: 'The radius is $2$ cm and the length is $500$ cm. The volume is $\pi \cdot 2^2 \cdot 500 = 2000\pi \approx 6283$ cm$^3$, which is $6.3$ litres to the nearest tenth.'
          - problem: 'A stack of $25$ identical coins is a cylinder. Each coin has a radius of $1.2$ cm and a thickness of $0.2$ cm. To one decimal place, what is the volume of the stack in cubic centimetres?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '22.6'
            solution_sketch: 'The stack is $25 \cdot 0.2 = 5$ cm high. Its volume is $\pi \cdot 1.2^2 \cdot 5 = 7.2\pi \approx 22.62$, so $22.6$ cm$^3$ to one decimal place.'
        constraints: 'real containers, comparisons of two cylinders with a difference or a same-amount question, pouring between cylinders, pipes and coin stacks'
    diagnostic_exemplar:
      problem: 'A cylinder has a diameter of $10$ cm and a height of $3$ cm. Find its exact volume.'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '75*pi'
      solution_sketch: 'The radius is $5$ cm. The volume is $\pi \cdot 5^2 \cdot 3 = 75\pi$ cm$^3$.'
    anki_seeds:
      - front: "Volume of a cylinder with radius r and height h:"
        back: "pi r^2 h"
        type: basic

  - id: volume-prisms-cylinders
    name: Volumes of Prisms and Cylinders
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: volume-prisms
        weight: 0.8
        key: true
      - id: volume-cylinders
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Work backwards from a volume
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A rectangular prism has a base that measures $6$ cm by $5$ cm. Its volume is $150$ cm$^3$. How tall is it?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The base area is $6 \cdot 5 = 30$ cm$^2$. From $30h = 150$ the height is $h = 5$ cm.'
          - problem: 'A cylinder with a radius of $3$ cm has a volume of $54\pi$ cm$^3$. Find its height.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The base area is $9\pi$ cm$^2$, so $9\pi h = 54\pi$. Dividing both sides by $9\pi$ gives $h = 6$ cm.'
          - problem: 'A cylindrical can is $10$ cm tall and holds $90\pi$ cm$^3$ of soup when full. What is the radius of the can?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '3'
            solution_sketch: 'From $\pi r^2 \cdot 10 = 90\pi$ we get $r^2 = 9$. Since a radius is positive, $r = 3$ cm.'
          - problem: 'A swimming pool is $12$ m long and $5$ m wide. A pump adds $90$ m$^3$ of water to the empty pool. How deep is the water, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.5'
            solution_sketch: 'The floor of the pool has area $12 \cdot 5 = 60$ m$^2$. From $60h = 90$ the depth is $h = 1.5$ m.'
          - problem: 'A juice carton has a square base that is $10$ cm by $10$ cm. When it is full it holds exactly $2$ litres, and one litre is $1000$ cm$^3$. How tall is the carton, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The carton holds $2000$ cm$^3$ and the base area is $100$ cm$^2$. From $100h = 2000$ the height is $h = 20$ cm.'
          - problem: 'A cylindrical tank has a diameter of $4$ m and holds $50$ m$^3$ of water. To the nearest hundredth of a metre, how deep is the water?'
            answer_contract: {"kind":"approx","decimals":2}
            answer: '3.98'
            solution_sketch: 'The radius is $2$ m, so the base area is $4\pi$ m$^2$. From $4\pi h = 50$ the depth is $h = 50 / (4\pi) \approx 3.98$ m.'
          - problem: 'A cube has a volume of $729$ cm$^3$. How long is each edge?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '9'
            solution_sketch: 'The edge $e$ satisfies $e^3 = 729$. Since $9 \cdot 9 \cdot 9 = 729$, the edge is $9$ cm.'
          - problem: 'A cylinder is $12$ cm tall and has a volume of $300\pi$ cm$^3$. Find its diameter.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '10'
            solution_sketch: 'From $\pi r^2 \cdot 12 = 300\pi$ we get $r^2 = 25$, so $r = 5$ cm. The diameter is twice the radius, $10$ cm.'
        constraints: 'divide the volume by the base area, or solve for the radius or edge from a perfect square or cube; prisms, cylinders, tanks, cartons and pools'
      - id: kp2
        name: Composite solids
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A solid is made of a box and a half-cylinder. The box is $8$ cm long, $4$ cm wide and $3$ cm high. The half-cylinder has a radius of $2$ cm, lies on the top face of the box and runs its full $8$ cm length. Find the exact volume of the solid.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '96 + 16*pi'
            solution_sketch: 'The box has volume $8 \cdot 4 \cdot 3 = 96$ cm$^3$. The half-cylinder has volume $\frac{1}{2} \cdot \pi \cdot 2^2 \cdot 8 = 16\pi$ cm$^3$, so the total is $96 + 16\pi$ cm$^3$.'
          - problem: 'A cylindrical hole of radius $1$ cm is drilled straight through a block that measures $5$ cm by $4$ cm by $4$ cm. The hole runs along the $5$ cm length. To the nearest cubic centimetre, what is the volume of the block that remains?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '64'
            solution_sketch: 'The block has volume $5 \cdot 4 \cdot 4 = 80$ cm$^3$ and the hole removes $\pi \cdot 1^2 \cdot 5 = 5\pi \approx 15.7$ cm$^3$. The remaining volume is $80 - 15.7 = 64.3$, which is $64$ cm$^3$ to the nearest unit.'
          - problem: 'A railway tunnel is $200$ m long. Its cross-section is a rectangle $6$ m wide and $4$ m high with a semicircle of diameter $6$ m on top. To the nearest cubic metre, how much rock was removed to dig the tunnel?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '7627'
            solution_sketch: 'The cross-section has area $6 \cdot 4 + \frac{1}{2} \cdot \pi \cdot 3^2 = 24 + 4.5\pi \approx 38.14$ m$^2$. Over $200$ m the volume is $200 \cdot 38.14 \approx 7627$ m$^3$.'
          - problem: 'A concrete pipe section is $2$ m long. Its outer radius is $0.5$ m and its inner radius is $0.4$ m. What is the exact volume of the concrete, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '0.18*pi'
            solution_sketch: 'The concrete is the large cylinder minus the hollow cylinder. Its volume is $\pi \cdot 0.5^2 \cdot 2 - \pi \cdot 0.4^2 \cdot 2 = 0.5\pi - 0.32\pi = 0.18\pi$ m$^3$.'
          - problem: 'A trophy stand is made of two cylinders stacked on the same axis. The lower cylinder has a radius of $20$ cm and a height of $30$ cm. The upper cylinder has a radius of $10$ cm and a height of $40$ cm. Find the exact volume of the stand.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '16000*pi'
            solution_sketch: 'The lower cylinder has volume $\pi \cdot 20^2 \cdot 30 = 12000\pi$ cm$^3$. The upper one has $\pi \cdot 10^2 \cdot 40 = 4000\pi$ cm$^3$, so the total is $16000\pi$ cm$^3$.'
          - problem: 'A wooden planter has no lid. Outside it is $120$ cm long, $50$ cm wide and $40$ cm high. The walls and the floor are each $5$ cm thick. How many cubic centimetres of wood does the planter contain?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '86000'
            solution_sketch: 'The outer box has volume $120 \cdot 50 \cdot 40 = 240000$ cm$^3$. The hollow inside is $110$ cm by $40$ cm by $35$ cm, which is $154000$ cm$^3$, so the wood is $240000 - 154000 = 86000$ cm$^3$.'
          - problem: 'A steel disc has a radius of $5$ cm and a thickness of $2$ cm. A hole of diameter $4$ cm is drilled through its centre. Find the exact volume of steel that remains.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '42*pi'
            solution_sketch: 'The full disc has volume $\pi \cdot 5^2 \cdot 2 = 50\pi$ cm$^3$ and the hole has volume $\pi \cdot 2^2 \cdot 2 = 8\pi$ cm$^3$. The steel has volume $50\pi - 8\pi = 42\pi$ cm$^3$.'
        constraints: 'one prism, or two stacked cylinders, with one half-cylinder, hole or hollow added or removed; exact or rounded answers with units'
      - id: kp3
        name: Equal volumes and scaling
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A cylinder with a radius of $6$ cm and a height of $2$ cm has the same volume as a cylinder with a radius of $3$ cm and a height of $h$ cm. Find $h$.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The first cylinder has volume $\pi \cdot 36 \cdot 2 = 72\pi$ cm$^3$. Setting $9\pi h = 72\pi$ gives $h = 8$ cm.'
          - problem: 'A coffee shop changes its cup from a radius of $4$ cm to a radius of $6$ cm. The height stays the same. By what factor does the amount of coffee in a full cup increase?'
            answer_contract: {"kind":"exact"}
            answer: '9/4'
            solution_sketch: 'The volume is proportional to the square of the radius. So the factor is $(6/4)^2 = (3/2)^2 = 9/4$.'
          - problem: 'A full cylindrical tank has a radius of $2$ m, and the water in it is $4.5$ m deep. All the water is pumped into an empty cylindrical tank with a radius of $3$ m. How deep is the water in the second tank, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '2'
            solution_sketch: 'The water has volume $\pi \cdot 2^2 \cdot 4.5 = 18\pi$ m$^3$. In the second tank $9\pi h = 18\pi$, so $h = 2$ m.'
          - problem: 'A solid metal cylinder with a radius of $3$ cm and a height of $8$ cm is melted and recast as a cylinder with a radius of $2$ cm. How tall is the new cylinder, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '18'
            solution_sketch: 'The metal keeps its volume, $\pi \cdot 3^2 \cdot 8 = 72\pi$ cm$^3$. Then $4\pi h = 72\pi$ gives $h = 18$ cm.'
          - problem: 'The height of a cylinder is tripled and its radius is halved. By what factor is the volume multiplied?'
            answer_contract: {"kind":"exact"}
            answer: '3/4'
            solution_sketch: 'The height multiplies the volume by $3$. Halving the radius multiplies it by $(1/2)^2 = 1/4$, so the total factor is $3 \cdot \frac{1}{4} = \frac{3}{4}$.'
          - problem: 'Cylinder A has a radius of $5$ cm and a height of $4$ cm. Cylinder B has the same volume and a height of $1$ cm. What is the radius of cylinder B, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '10'
            solution_sketch: 'Cylinder A has volume $\pi \cdot 25 \cdot 4 = 100\pi$ cm$^3$. For B, $\pi r^2 \cdot 1 = 100\pi$, so $r^2 = 100$ and $r = 10$ cm.'
          - problem: 'Every edge of a rectangular box is doubled. By what factor does the volume of the box increase?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Length, width and height each double. So the volume is multiplied by $2 \cdot 2 \cdot 2 = 8$.'
        constraints: 'equal volumes of cylinders, recasting and pouring, and scaling factors for a radius, a height or all edges'
    diagnostic_exemplar:
      problem: 'A solid is a box $6$ cm long, $4$ cm wide and $3$ cm high with a half-cylinder of radius $2$ cm on top, running the full $6$ cm length of the box. Find the exact volume of the solid.'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '72 + 12*pi'
      solution_sketch: 'The box has volume $6 \cdot 4 \cdot 3 = 72$ cm$^3$. The half-cylinder has volume $\frac{1}{2} \cdot \pi \cdot 2^2 \cdot 6 = 12\pi$ cm$^3$, so the total is $72 + 12\pi$ cm$^3$.'
    anki_seeds:
      - front: "Volume of any prism or cylinder:"
        back: "V = B x h (base area times height)"
        type: basic
      - front: "Doubling a cylinder's radius (same height) multiplies its volume by..."
        back: "4"
        type: basic

  - id: volume-pyramids-cones-spheres
    name: Volumes of Pyramids, Cones, and Spheres
    core: true
    difficulty: 0.46
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: volume-prisms-cylinders
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Pyramid volumes
        key_prerequisites: [volume-prisms-cylinders]
        try_first:
          problem: 'A cube has edges of $6$ cm. It is cut into three identical pyramids. Each pyramid has the corner $A$ of the cube as its apex and one of the three faces that do not touch $A$ as its base. What is the volume of one pyramid, in cubic centimetres?'
          answer_contract: {"kind":"exact"}
          answer: '72'
          reveal: 'The three pyramids fill the cube exactly and are identical, so each has one third of the cube volume $6^3 = 216$, which is $72$ cm$^3$. Each pyramid has a $6$ by $6$ base and a height of $6$, so a pyramid is one third of the box with the same base and height: $V = \frac{1}{3}Bh$.'
        exemplars:
          - problem: 'A pyramid has a rectangular base $9$ cm by $5$ cm and a height of $6$ cm. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The base area is $9 \cdot 5 = 45$ cm$^2$. The volume of a pyramid is one third of base area times height, $\frac{1}{3} \cdot 45 \cdot 6 = 90$ cm$^3$.'
          - problem: 'A glass paperweight is a square pyramid with a base edge of $6$ cm and a height of $10$ cm. What is the volume of the glass?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '120'
            solution_sketch: 'The base area is $6 \cdot 6 = 36$ cm$^2$. The volume is $\frac{1}{3} \cdot 36 \cdot 10 = 120$ cm$^3$.'
          - problem: 'A square-based tent is a pyramid with a base edge of $3$ m and a height of $2.4$ m at the centre. How many cubic metres of air does the tent enclose?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '7.2'
            solution_sketch: 'The floor has area $3 \cdot 3 = 9$ m$^2$. The volume is $\frac{1}{3} \cdot 9 \cdot 2.4 = 7.2$ m$^3$.'
          - problem: 'A square pyramid has a base edge of $10$ cm. The distance from the apex to the midpoint of each base edge, measured along a triangular face, is $13$ cm. Find the volume of the pyramid.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '400'
            solution_sketch: 'The height, half of a base edge and the slant distance form a right triangle with legs $h$ and $5$ and hypotenuse $13$. So $h = \sqrt{13^2 - 5^2} = 12$ cm, and the volume is $\frac{1}{3} \cdot 100 \cdot 12 = 400$ cm$^3$.'
          - problem: 'The base of a pyramid is a right triangle with legs of $6$ cm and $8$ cm, and the height of the pyramid is $9$ cm. Find its volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '72'
            solution_sketch: 'The base area is $\frac{1}{2} \cdot 6 \cdot 8 = 24$ cm$^2$. The volume is $\frac{1}{3} \cdot 24 \cdot 9 = 72$ cm$^3$.'
          - problem: 'A pyramid and a prism have the same base and the same height. How does the volume of the pyramid compare with the volume of the prism?'
            answer_contract: {"kind":"label","options":[["one third of the prism's volume", "one third", "a third", "1/3", "one third as much"], ["one half of the prism's volume", "one half", "half", "1/2"], ["the same as the prism's volume", "the same", "equal"], ["two thirds of the prism's volume", "two thirds", "2/3"]]}
            answer: 'one third of the prism''s volume'
            solution_sketch: 'Three pyramids with the same base and height fit together to fill one prism with that base and height. So the volume of one pyramid is one third of the volume of the prism.'
          - problem: 'A square pyramid has a volume of $100$ cm$^3$ and a height of $12$ cm. How long is each edge of its square base?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'From $\frac{1}{3} \cdot B \cdot 12 = 100$ the base area is $B = 25$ cm$^2$. The base is a square, so each edge is $\sqrt{25} = 5$ cm.'
          - problem: 'A square pyramid has a base edge of $230$ m and a height of $146$ m. To the nearest cubic metre, what is its volume?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '2574467'
            solution_sketch: 'The base area is $230^2 = 52900$ m$^2$. The volume is $\frac{1}{3} \cdot 52900 \cdot 146 \approx 2574466.7$ m$^3$, which is $2574467$ m$^3$ to the nearest unit.'
        constraints: 'rectangular, square and triangular bases, a slant distance that needs a right triangle, a missing base edge, one justification item; tents, paperweights and monuments'
      - id: kp2
        name: Cone volumes
        key_prerequisites: [volume-prisms-cylinders, pythagorean-theorem]
        exemplars:
          - problem: 'A cone has a base radius of $6$ cm and a height of $4$ cm. Find its exact volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '48*pi'
            solution_sketch: 'The volume of a cone is one third of $\pi r^2 h$. Here $\frac{1}{3} \cdot \pi \cdot 36 \cdot 4 = 48\pi$ cm$^3$.'
          - problem: 'A cone has a base radius of $5$ cm and a slant height of $13$ cm, measured from the apex to a point on the edge of the base. Find its exact volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '100*pi'
            solution_sketch: 'The height, the radius and the slant height form a right triangle, so $h = \sqrt{13^2 - 5^2} = 12$ cm. The volume is $\frac{1}{3} \cdot \pi \cdot 25 \cdot 12 = 100\pi$ cm$^3$.'
          - problem: 'A conical pile of gravel is $3$ m high and has a base diameter of $4$ m. What is the exact volume of the pile, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '4*pi'
            solution_sketch: 'The radius is $2$ m. The volume is $\frac{1}{3} \cdot \pi \cdot 2^2 \cdot 3 = 4\pi$ m$^3$.'
          - problem: 'An ice-cream cone is $12$ cm deep and has an opening with a diameter of $6$ cm. To the nearest cubic centimetre, how much ice cream fills the cone level with the top?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '113'
            solution_sketch: 'The radius is $3$ cm. The volume is $\frac{1}{3} \cdot \pi \cdot 3^2 \cdot 12 = 36\pi \approx 113.1$, which is $113$ cm$^3$ to the nearest unit.'
          - problem: 'A cone and a cylinder both have a base radius of $5$ cm and a height of $9$ cm. By exactly how many cubic centimetres does the cylinder hold more than the cone?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '150*pi'
            solution_sketch: 'The cylinder holds $\pi \cdot 25 \cdot 9 = 225\pi$ cm$^3$ and the cone holds a third of that, $75\pi$ cm$^3$. The difference is $225\pi - 75\pi = 150\pi$ cm$^3$.'
          - problem: 'A laboratory funnel is a cone with a top radius of $8$ cm and a depth of $15$ cm. To the nearest millilitre, how much liquid does the funnel hold when it is full? One millilitre is $1$ cm$^3$.'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '1005'
            solution_sketch: 'The volume is $\frac{1}{3} \cdot \pi \cdot 8^2 \cdot 15 = 320\pi \approx 1005.3$ cm$^3$. That is $1005$ millilitres to the nearest unit.'
          - problem: 'A paper cup is a cone with a base radius of $6$ cm and a slant height of $10$ cm. To the nearest millilitre, how much water fills the cup to the brim? One millilitre is $1$ cm$^3$.'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '302'
            solution_sketch: 'The height is $\sqrt{10^2 - 6^2} = 8$ cm. The volume is $\frac{1}{3} \cdot \pi \cdot 36 \cdot 8 = 96\pi \approx 301.6$, which is $302$ millilitres.'
          - problem: 'A cone has a volume of $96\pi$ cm$^3$ and a base radius of $6$ cm. Find its height.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '8'
            solution_sketch: 'From $\frac{1}{3} \cdot \pi \cdot 36 \cdot h = 96\pi$ we get $12\pi h = 96\pi$. So $h = 8$ cm.'
        constraints: 'radius or diameter with height, or radius with slant height; piles, cones, funnels, cups and comparison with a cylinder; litre and millilitre conversions with the factor given'
      - id: kp3
        name: Sphere and hemisphere volumes
        key_prerequisites: [volume-prisms-cylinders]
        exemplars:
          - problem: 'A sphere has a radius of $3$ cm. Find its exact volume.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '36*pi'
            solution_sketch: 'The volume of a sphere is $\frac{4}{3}\pi r^3$. Here $\frac{4}{3} \cdot \pi \cdot 27 = 36\pi$ cm$^3$.'
          - problem: 'A basketball has a radius of $12$ cm. To the nearest cubic centimetre, what is its volume?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '7238'
            solution_sketch: 'The volume is $\frac{4}{3} \cdot \pi \cdot 12^3 = 2304\pi \approx 7238.2$. To the nearest unit this is $7238$ cm$^3$.'
          - problem: 'A spherical water tank has a diameter of $12$ m. What is the exact volume of the tank, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '288*pi'
            solution_sketch: 'The radius is $6$ m. The volume is $\frac{4}{3} \cdot \pi \cdot 6^3 = \frac{4}{3} \cdot 216\pi = 288\pi$ m$^3$.'
          - problem: 'A hemispherical bowl has an inside radius of $6$ cm. To the nearest millilitre, how much soup fills the bowl to the brim? One millilitre is $1$ cm$^3$.'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '452'
            solution_sketch: 'A hemisphere has half the volume of a sphere, $\frac{2}{3} \cdot \pi \cdot 6^3 = 144\pi \approx 452.4$. That is $452$ millilitres to the nearest unit.'
          - problem: 'The roof of an observatory is a hemisphere with a radius of $15$ m. What is the exact volume of the space under the dome, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '2250*pi'
            solution_sketch: 'The space under the dome is a hemisphere. Its volume is $\frac{2}{3} \cdot \pi \cdot 15^3 = \frac{2}{3} \cdot 3375\pi = 2250\pi$ m$^3$.'
          - problem: 'A solid is a cylinder with a radius of $3$ cm and a height of $8$ cm, with a hemisphere of radius $3$ cm joined to one end. Find the exact volume of the solid.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '90*pi'
            solution_sketch: 'The cylinder has volume $\pi \cdot 9 \cdot 8 = 72\pi$ cm$^3$. The hemisphere has $\frac{2}{3} \cdot \pi \cdot 27 = 18\pi$ cm$^3$, so the total is $90\pi$ cm$^3$.'
          - problem: 'A sphere has a volume of $288\pi$ cm$^3$. What is its radius?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'From $\frac{4}{3}\pi r^3 = 288\pi$ we get $r^3 = 216$. Since $6^3 = 216$, the radius is $6$ cm.'
          - problem: 'A sphere just fits inside a cylinder: it touches the curved side and both ends. The cylinder has a radius of $4$ cm and a height of $8$ cm. Find the exact volume of the empty space between the sphere and the cylinder.'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '128*pi/3'
            solution_sketch: 'The cylinder has volume $\pi \cdot 16 \cdot 8 = 128\pi$ cm$^3$ and the sphere has $\frac{4}{3} \cdot \pi \cdot 64 = \frac{256\pi}{3}$ cm$^3$. The empty space is $128\pi - \frac{256\pi}{3} = \frac{128\pi}{3}$ cm$^3$.'
        constraints: 'spheres and hemispheres from the radius or diameter, a missing radius, and solids joined to a cylinder; balls, tanks, bowls and domes'
    diagnostic_exemplar:
      problem: 'A cone has a base radius of $6$ cm and a slant height of $10$ cm. A hemisphere has a radius of $6$ cm. By exactly how many cubic centimetres does the hemisphere hold more than the cone?'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '48*pi'
      solution_sketch: 'The cone has height $\sqrt{100 - 36} = 8$ cm, so its volume is $\frac{1}{3} \cdot \pi \cdot 36 \cdot 8 = 96\pi$ cm$^3$. The hemisphere has $\frac{2}{3} \cdot \pi \cdot 216 = 144\pi$ cm$^3$, so it holds $144\pi - 96\pi = 48\pi$ cm$^3$ more.'
    anki_seeds:
      - front: "A pyramid or cone has ... the volume of the prism or cylinder with the same base and height."
        back: "one third"
        type: basic
      - front: "Volume of a sphere with radius r:"
        back: "(4/3) pi r^3"
        type: basic
      - front: "What shape is a cross-section of a sphere, or of a cone cut parallel to its base?"
        back: "A circle — for the sphere any plane cut; for the cone the circle shrinks toward the apex."
        type: basic

  - id: surface-area-solids
    name: Surface Areas of Solids
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.6
        key: true
      - id: circle-area-circumference
        weight: 0.5
        key: true
      - id: pythagorean-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Prism and cube surface area
        key_prerequisites: [area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A rectangular prism measures $3$ cm by $4$ cm by $5$ cm. What is its surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '94'
            solution_sketch: 'The six faces form three pairs of equal rectangles: $3 \cdot 4 = 12$, $3 \cdot 5 = 15$ and $4 \cdot 5 = 20$. The surface area is $2(12 + 15 + 20) = 94$ cm$^2$.'
          - problem: 'A closed cardboard box is $40$ cm long, $25$ cm wide and $15$ cm high. How much cardboard covers the whole box, in square centimetres, if nothing overlaps?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '3950'
            solution_sketch: 'The pairs of faces have areas $40 \cdot 25 = 1000$, $40 \cdot 15 = 600$ and $25 \cdot 15 = 375$. The cardboard area is $2(1000 + 600 + 375) = 3950$ cm$^2$.'
          - problem: 'A cube has an edge of $9$ cm. What is its surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '486'
            solution_sketch: 'All six faces are squares of area $9^2 = 81$ cm$^2$. The surface area is $6 \cdot 81 = 486$ cm$^2$.'
          - problem: 'A room is $5$ m long, $4$ m wide and $2.5$ m high. The four walls and the ceiling are painted, but not the floor. What area, in square metres, is painted?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '65'
            solution_sketch: 'The two long walls have area $5 \cdot 2.5 = 12.5$ each and the two short walls $4 \cdot 2.5 = 10$ each, so the walls total $2(12.5 + 10) = 45$. The ceiling adds $5 \cdot 4 = 20$, so $65$ m$^2$ is painted.'
          - problem: 'An open aquarium with no lid is $80$ cm long, $40$ cm wide and $50$ cm high. How many square centimetres of glass does it need?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '15200'
            solution_sketch: 'The base is $80 \cdot 40 = 3200$. The four sides are two of $80 \cdot 50 = 4000$ and two of $40 \cdot 50 = 2000$, which total $12000$. The glass area is $3200 + 12000 = 15200$ cm$^2$.'
          - problem: 'A cube has a surface area of $150$ cm$^2$. How long is one edge, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'A cube has six equal faces, so one face has area $150 / 6 = 25$ cm$^2$. The edge is $\sqrt{25} = 5$ cm.'
          - problem: 'A rectangular prism has a square base with side $4$ cm and a surface area of $112$ cm$^2$. How tall is it, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The two square ends have area $2 \cdot 16 = 32$ cm$^2$. The four side faces share the other $112 - 32 = 80$ cm$^2$, so each has area $20$. Each side face is $4$ cm wide, so the height is $20 / 4 = 5$ cm.'
          - problem: 'Tomas finds the surface area of a cube with an edge of $5$ cm and writes $5^3 = 125$ cm$^2$. What is the correct surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '150'
            solution_sketch: 'Tomas cubed the edge, which gives the volume. The surface area is the area of six square faces: $6 \cdot 5^2 = 150$ cm$^2$.'
        constraints: 'whole-number dimensions; closed and open boxes, painted rooms, and reversals that give the surface area and ask for an edge or a height'
      - id: kp2
        name: Cylinder surface area
        key_prerequisites: [circle-area-circumference]
        try_first:
          problem: 'A paper label wraps exactly once around the side of a tin of radius $4$ cm and height $7$ cm, with no overlap. The label is cut off and laid flat as a rectangle. How wide is that rectangle, in centimetres?'
          answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
          answer: '8*pi'
          reveal: 'The label wrapped once around the tin, so its width is the distance around the tin, the circumference $2\pi r = 8\pi$ cm. Its height is the height of the tin, $7$ cm. So the side of a cylinder has area $2\pi r \cdot h$, and the two circular ends add $2\pi r^2$.'
        exemplars:
          - problem: 'A cylinder has a radius of $4$ cm and a height of $6$ cm. What is its exact total surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '80*pi'
            solution_sketch: 'Each circular end has area $\pi r^2 = 16\pi$, so the two ends give $32\pi$. The side has area $2\pi r h = 2\pi(4)(6) = 48\pi$. The total is $32\pi + 48\pi = 80\pi$ cm$^2$.'
          - problem: 'A paper label covers the whole side of a tin with radius $5$ cm and height $9$ cm, with no overlap. What is the exact area of the label, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '90*pi'
            solution_sketch: 'The label is the side of the cylinder, so the two circular ends do not count. Its area is $2\pi r h = 2\pi(5)(9) = 90\pi$ cm$^2$.'
          - problem: 'An open-topped cylindrical bucket has a radius of $15$ cm and a height of $30$ cm. What is the exact area of sheet metal needed to make it, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '1125*pi'
            solution_sketch: 'The bucket has a base but no lid, so only one circular end is counted: $\pi(15)^2 = 225\pi$. The side adds $2\pi(15)(30) = 900\pi$. The area is $225\pi + 900\pi = 1125\pi$ cm$^2$.'
          - problem: 'A cylindrical water tower has a radius of $3$ m and a height of $5$ m. The whole outside, including the top and the base, is painted. To the nearest tenth of a square metre, what area is painted?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '150.8'
            solution_sketch: 'The two circular ends have area $2\pi(3)^2 = 18\pi$ and the side has area $2\pi(3)(5) = 30\pi$. The total is $48\pi \approx 150.80$, which is $150.8$ m$^2$ to the nearest tenth.'
          - problem: 'A cylinder has a radius of $4$ cm and a total surface area of $72\pi$ cm$^2$. How tall is it, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '5'
            solution_sketch: 'The two ends have area $2\pi(4)^2 = 32\pi$, so the side has area $72\pi - 32\pi = 40\pi$. The side area is $2\pi(4)h = 8\pi h$, so $h = 40\pi / 8\pi = 5$ cm.'
          - problem: 'A steel pipe is $2$ m long and has an outer radius of $5$ cm. The outside of the pipe is painted, but not its two open ends. What is the exact painted area, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '2000*pi'
            solution_sketch: 'A length of $2$ m is $200$ cm. The painted surface is the side of a cylinder: $2\pi r h = 2\pi(5)(200) = 2000\pi$ cm$^2$.'
          - problem: 'A garden roller is a cylinder with a radius of $25$ cm and a width of $60$ cm. In one full turn it flattens a strip of lawn as wide as the roller. To the nearest hundredth of a square metre, what area of lawn does one turn flatten?'
            answer_contract: {"kind":"approx","decimals":2}
            answer: '0.94'
            solution_sketch: 'One turn flattens the side of the cylinder: $2\pi(25)(60) = 3000\pi \approx 9424.8$ cm$^2$. Since $1$ m$^2$ is $10000$ cm$^2$, this is $0.94$ m$^2$ to the nearest hundredth.'
          - problem: 'Ana finds the total surface area of a cylinder with radius $3$ cm and height $5$ cm and writes $2\pi(3)(5) = 30\pi$ cm$^2$. What is the correct total surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '48*pi'
            solution_sketch: 'Ana found only the side of the cylinder. The two circular ends add $2\pi(3)^2 = 18\pi$, so the total is $30\pi + 18\pi = 48\pi$ cm$^2$.'
        constraints: 'exact answers in terms of pi, or rounded areas with units; total, lateral and open-topped cylinders; contexts such as tins, buckets, pipes and rollers; one reversal for the height'
      - id: kp3
        name: Pyramid, cone, and sphere surface area
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference, pythagorean-theorem]
        exemplars:
          - problem: 'A square pyramid has a base edge of $10$ cm and a slant height of $13$ cm. What is its total surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '360'
            solution_sketch: 'The base is a square of area $10^2 = 100$. Each of the four triangular faces has area $\frac{1}{2} \cdot 10 \cdot 13 = 65$, so the sides total $260$. The total is $100 + 260 = 360$ cm$^2$.'
          - problem: 'A cone has a radius of $3$ cm and a slant height of $5$ cm. What is its exact total surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '24*pi'
            solution_sketch: 'The circular base has area $\pi r^2 = 9\pi$. The curved side has area $\pi r \ell = \pi(3)(5) = 15\pi$. The total is $9\pi + 15\pi = 24\pi$ cm$^2$.'
          - problem: 'A basketball is a sphere with a radius of $12$ cm. To the nearest tenth of a square centimetre, how much leather covers its surface?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '1809.6'
            solution_sketch: 'The surface area of a sphere is $4\pi r^2 = 4\pi(12)^2 = 576\pi$. This is $1809.56$, so $1809.6$ cm$^2$ to the nearest tenth.'
          - problem: 'A tent is a square pyramid with a base edge of $6$ m and a height of $4$ m measured from the centre of the base to the top. The four sloping sides are made of canvas and there is no floor sheet. How many square metres of canvas are needed?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The slant height runs from the middle of a base edge to the top. It is the hypotenuse of a right triangle with legs $3$ (half the edge) and $4$ (the height), so it is $\sqrt{9 + 16} = 5$. The canvas area is $4 \cdot \frac{1}{2} \cdot 6 \cdot 5 = 60$ m$^2$.'
          - problem: 'A conical party hat has a base radius of $6$ cm and a height of $8$ cm. The hat has no bottom. What is the exact area of paper that makes it, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '60*pi'
            solution_sketch: 'The slant height is the hypotenuse of a right triangle with legs $6$ and $8$, so it is $\sqrt{36 + 64} = 10$. The curved side has area $\pi r \ell = \pi(6)(10) = 60\pi$ cm$^2$.'
          - problem: 'A solid hemisphere has a radius of $5$ cm. What is the exact total surface area, including its flat circular face?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '75*pi'
            solution_sketch: 'The curved part is half of a sphere: $\frac{1}{2} \cdot 4\pi(5)^2 = 50\pi$. The flat face is a circle of area $\pi(5)^2 = 25\pi$. The total is $75\pi$ cm$^2$.'
          - problem: 'A sphere has a surface area of $144\pi$ cm$^2$. What is its radius, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '6'
            solution_sketch: 'The surface area is $4\pi r^2 = 144\pi$, so $r^2 = 144 / 4 = 36$. The radius is $\sqrt{36} = 6$ cm.'
          - problem: 'A square pyramid has a base edge of $6$ cm and a slant height of $4$ cm. What is its total surface area?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '84'
            solution_sketch: 'The base has area $6^2 = 36$. The four triangular faces have total area $4 \cdot \frac{1}{2} \cdot 6 \cdot 4 = 48$. The total is $36 + 48 = 84$ cm$^2$.'
        constraints: 'slant heights given, or found from a right triangle with whole-number sides; exact answers in terms of pi or rounded areas with units; open and closed solids, a hemisphere, and one reversal for a radius'
    diagnostic_exemplar:
      problem: 'A square pyramid has a base edge of $12$ cm and a slant height of $10$ cm. What is its total surface area?'
      answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
      answer: '384'
      solution_sketch: 'The base has area $12^2 = 144$. The four triangular faces have total area $4 \cdot \frac{1}{2} \cdot 12 \cdot 10 = 240$. The total is $144 + 240 = 384$ cm$^2$.'
    anki_seeds:
      - front: "Total surface area of a cylinder:"
        back: "2 pi r^2 + 2 pi r h"
        type: basic
      - front: "Lateral surface area of a cone with radius r and slant height l:"
        back: "pi r l"
        type: basic
      - front: "Surface area of a sphere:"
        back: "4 pi r^2"
        type: basic
      - front: "What is a net of a solid, and what is it used for?"
        back: "The solid unfolded flat into its faces; the total area of the net IS the surface area."
        type: basic

  - id: similar-solids-scaling
    name: Similar Solids and Scaling
    core: false
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: volume-prisms-cylinders
        weight: 0.6
        key: true
      - id: dilations-scale-factors
        weight: 0.5
        key: true
      - id: surface-area-solids
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Length, area, and volume scale factors
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        try_first:
          problem: 'A solid cube has an edge of $1$ cm. A larger cube has an edge of $2$ cm. How many of the small cubes fit inside the larger cube?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'The larger cube is $2$ small cubes long, $2$ wide and $2$ high, so it holds $2 \cdot 2 \cdot 2 = 8$ small cubes. Doubling every length multiplies the volume by $2^3 = 8$, and in the same way it multiplies every area by $2^2 = 4$. For a scale factor $k$, lengths grow by $k$, areas by $k^2$ and volumes by $k^3$.'
        exemplars:
          - problem: 'A cube has an edge of $2$ cm and a larger cube has an edge of $6$ cm. How many times as large is the surface area of the larger cube?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The linear scale factor is $6 / 2 = 3$. Areas scale by $k^2 = 9$. Check: the surfaces are $6 \cdot 4 = 24$ and $6 \cdot 36 = 216$, and $216 / 24 = 9$.'
          - problem: 'Two similar prisms have corresponding edges in the ratio $2:5$. What is the ratio of their surface areas, smaller to larger?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '4:25'
            solution_sketch: 'Areas scale by the square of the length ratio. So the area ratio is $\left(\frac{2}{5}\right)^2 = \frac{4}{25}$.'
          - problem: 'A carpenter makes a larger copy of a wooden block, with every length $3$ times as long as in the original. How many times as much wood does the copy contain?'
            answer_contract: {"kind":"exact"}
            answer: '27'
            solution_sketch: 'Tripling the length, the width and the height multiplies the volume by $3^3 = 27$. The copy contains $27$ times as much wood.'
          - problem: 'Two similar prisms have corresponding edges in the ratio $3:4$. What is the ratio of their volumes, smaller to larger?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '27:64'
            solution_sketch: 'Volumes scale by the cube of the length ratio. So the volume ratio is $\left(\frac{3}{4}\right)^3 = \frac{27}{64}$.'
          - problem: 'A can has a radius of $3$ cm and a height of $5$ cm. A larger can has a radius of $6$ cm and a height of $10$ cm. Are the two cans similar?'
            answer_contract: {"kind":"label","options":[["similar","they are similar","yes","yes, similar","yes, they are similar"],["not similar","they are not similar","no","no, not similar","no, they are not similar","dissimilar"]]}
            answer: 'similar'
            solution_sketch: 'The radii are in the ratio $3:6 = 1:2$ and the heights are in the ratio $5:10 = 1:2$. Every length is doubled by the same factor, so the cans are similar.'
          - problem: 'Two similar water tanks have heights of $2$ m and $3$ m. How many times as much water does the larger tank hold as the smaller tank?'
            answer_contract: {"kind":"exact"}
            answer: '27/8'
            solution_sketch: 'The linear scale factor from the small tank to the large tank is $\frac{3}{2}$. Volumes scale by $k^3 = \frac{27}{8}$, so the larger tank holds $\frac{27}{8} = 3.375$ times as much.'
          - problem: 'A can has a radius of $4$ cm and a height of $12$ cm. A larger can has a radius of $6$ cm and a height of $15$ cm. Are the two cans similar?'
            answer_contract: {"kind":"label","options":[["similar","they are similar","yes","yes, similar","yes, they are similar"],["not similar","they are not similar","no","no, not similar","no, they are not similar","dissimilar"]]}
            answer: 'not similar'
            solution_sketch: 'The radii are in the ratio $4:6 = 2:3$, but the heights are in the ratio $12:15 = 4:5$. The two ratios differ, so one can is not a scaled copy of the other.'
          - problem: 'A toy maker makes a model of a lorry with every length $\frac{1}{20}$ of the real lorry. The real lorry has a side area of $40$ m$^2$ to be painted. What area, in square centimetres, is the same side on the model?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '1000'
            solution_sketch: 'Areas scale by $\left(\frac{1}{20}\right)^2 = \frac{1}{400}$, so the model side has area $40 / 400 = 0.1$ m$^2$. Since $1$ m$^2$ is $10000$ cm$^2$, this is $1000$ cm$^2$.'
        constraints: 'a linear factor or ratio given; ask for the factor or ratio of areas (k^2) or volumes (k^3); at most two similar-or-not verdicts that compare every pair of corresponding lengths; contexts such as tanks, models and blocks'
      - id: kp2
        name: Recover the linear ratio from areas or volumes
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        exemplars:
          - problem: 'Two similar solids have volumes in the ratio $8:27$. What is the ratio of their surface areas, first to second?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '4:9'
            solution_sketch: 'The linear ratio is $\sqrt[3]{8} : \sqrt[3]{27} = 2:3$. Areas scale by the square of the linear ratio, so the area ratio is $\frac{4}{9}$.'
          - problem: 'Two similar solids have volumes in the ratio $125:64$. What is the ratio of their corresponding lengths, first to second?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '5:4'
            solution_sketch: 'Lengths scale by the cube root of the volume factor. So the ratio of lengths is $\sqrt[3]{125} : \sqrt[3]{64} = 5:4$, which is $\frac{5}{4}$.'
          - problem: 'Two similar vases hold $250$ ml and $2$ litres. The smaller vase is $10$ cm tall. How tall is the larger vase, in centimetres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The larger vase holds $2000$ ml, so the volume ratio is $250:2000 = 1:8$. The linear ratio is $\sqrt[3]{1} : \sqrt[3]{8} = 1:2$. The larger vase is $2 \cdot 10 = 20$ cm tall.'
          - problem: 'Two similar solids have surface areas in the ratio $25:49$. What is the ratio of their volumes, first to second?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '125:343'
            solution_sketch: 'The linear ratio is $\sqrt{25} : \sqrt{49} = 5:7$. Volumes scale by the cube of the linear ratio, so the volume ratio is $\left(\frac{5}{7}\right)^3 = \frac{125}{343}$.'
          - problem: 'Two similar tins have side areas of $48$ cm$^2$ and $108$ cm$^2$. The smaller tin holds $200$ ml. How much does the larger tin hold, in millilitres?'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"ml","allow_omitted":true}
            answer: '675'
            solution_sketch: 'The area ratio is $48:108 = 4:9$, so the linear ratio is $\sqrt{4} : \sqrt{9} = 2:3$. Volumes scale by $\left(\frac{3}{2}\right)^3 = \frac{27}{8}$, so the larger tin holds $200 \cdot \frac{27}{8} = 675$ ml.'
          - problem: 'Two similar solids have surface areas in the ratio $4:9$. What is the ratio of their volumes, first to second?'
            answer_contract: {"kind":"reduced_ratio"}
            answer: '8:27'
            solution_sketch: 'The linear ratio is $\sqrt{4} : \sqrt{9} = 2:3$. The volume ratio is $\left(\frac{2}{3}\right)^3 = \frac{8}{27}$.'
          - problem: 'A model ship is built so that its volume is $\frac{1}{1000}$ of the volume of the real ship. The real ship is $120$ m long. How long is the model, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '12'
            solution_sketch: 'The volume factor $\frac{1}{1000}$ gives a length factor of $\sqrt[3]{\frac{1}{1000}} = \frac{1}{10}$. The model is $120 / 10 = 12$ m long.'
          - problem: 'A gardener fills a small pot with $0.5$ litres of soil. A larger pot of the same shape is $2$ times as wide. How many litres of soil does the larger pot hold?'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"l","allow_omitted":true}
            answer: '4'
            solution_sketch: 'Doubling every length multiplies the volume by $2^3 = 8$. The larger pot holds $0.5 \cdot 8 = 4$ litres.'
        constraints: 'perfect-square area ratios and perfect-cube volume ratios; ratios requested first to second; contexts with vases, tins, pots and models; a volume factor turned into a length'
      - id: kp3
        name: Compute scaled measurements
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        exemplars:
          - problem: 'Two similar cylinders have corresponding lengths in the ratio $1:2$. The smaller cylinder has a volume of $30\pi$ cm$^3$. What is the exact volume of the larger cylinder, in cubic centimetres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '240*pi'
            solution_sketch: 'Doubling every length multiplies the volume by $2^3 = 8$. The larger volume is $30\pi \cdot 8 = 240\pi$ cm$^3$.'
          - problem: 'A scale model of a monument is built with every length $\frac{1}{5}$ of the real length. The monument has a volume of $250$ m$^3$. What is the volume of the model, in cubic metres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            answer: '2'
            solution_sketch: 'Volumes scale by $\left(\frac{1}{5}\right)^3 = \frac{1}{125}$. The model volume is $250 / 125 = 2$ m$^3$.'
          - problem: 'Two similar solids have lengths in the ratio $1:3$. The smaller has a surface area of $40$ cm$^2$. What is the surface area of the larger, in square centimetres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '360'
            solution_sketch: 'Areas scale by $3^2 = 9$. The larger surface area is $40 \cdot 9 = 360$ cm$^2$.'
          - problem: 'A sculptor paints a maquette that is $\frac{1}{8}$ as tall as the finished statue, using $30$ ml of paint for one coat. How much paint does one coat on the statue need, in millilitres, if the statue has the same shape?'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"ml","allow_omitted":true}
            answer: '1920'
            solution_sketch: 'Paint covers a surface, so the amount scales with area. The statue is $8$ times as tall, so its area is $8^2 = 64$ times as large. One coat needs $30 \cdot 64 = 1920$ ml.'
          - problem: 'A model ship at scale $1:50$ has a deck area of $0.8$ m$^2$. What is the deck area of the real ship, in square metres?'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            answer: '2000'
            solution_sketch: 'Lengths on the real ship are $50$ times as long, so areas are $50^2 = 2500$ times as large. The real deck area is $0.8 \cdot 2500 = 2000$ m$^2$.'
          - problem: 'A solid has a surface area of $50$ cm$^2$ and a volume of $40$ cm$^3$. A larger copy has a surface area of $450$ cm$^2$. What is the volume of the larger copy, in cubic centimetres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '1080'
            solution_sketch: 'The area ratio is $450 / 50 = 9$, so the linear factor is $\sqrt{9} = 3$. Volumes scale by $3^3 = 27$, so the copy has volume $40 \cdot 27 = 1080$ cm$^3$.'
          - problem: 'A candle $10$ cm tall costs $4$ euro. The price depends only on the amount of wax. What should a candle of the same shape and $15$ cm height cost, in euro?'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            answer: '13.5'
            solution_sketch: 'The wax is a volume, and the linear factor is $15 / 10 = 1.5$. Volumes scale by $1.5^3 = 3.375$, so the price is $4 \cdot 3.375 = 13.5$ euro.'
          - problem: 'Two similar jars have heights of $12$ cm and $18$ cm. The smaller jar holds $400$ ml. How much does the larger jar hold, in millilitres?'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"ml","allow_omitted":true}
            answer: '1350'
            solution_sketch: 'The linear factor is $18 / 12 = \frac{3}{2}$. Volumes scale by $\frac{27}{8}$, so the larger jar holds $400 \cdot \frac{27}{8} = 1350$ ml.'
        constraints: 'volumes divisible by k^3 and areas by k^2; scale factor given directly, as a model scale, as a ratio of heights, or through an area ratio; contexts with models, paint, wax and containers'
    diagnostic_exemplar:
      problem: 'Two similar solids have lengths in the ratio $2:3$. The smaller solid has a volume of $40$ cm$^3$. What is the volume of the larger solid, in cubic centimetres?'
      answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
      answer: '135'
      solution_sketch: 'Volumes scale by the cube of the length ratio, so by $\left(\frac{3}{2}\right)^3 = \frac{27}{8}$. The larger volume is $40 \cdot \frac{27}{8} = 135$ cm$^3$.'
    anki_seeds:
      - front: "If similar figures have linear scale factor k, areas scale by..."
        back: "k^2"
        type: basic
      - front: "If similar solids have linear scale factor k, volumes scale by..."
        back: "k^3"
        type: basic

  - id: density-measurement-problems
    name: Density and Measurement Problems
    core: false
    difficulty: 0.44
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - {id: metric-unit-conversion, weight: 0.4, key: false}
      - id: volume-prisms-cylinders
        weight: 0.6
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Density from mass and volume
        key_prerequisites: [volume-prisms-cylinders, ratios-proportions]
        exemplars:
          - problem: 'A block of metal measures $5$ cm by $4$ cm by $2$ cm and has a mass of $312$ g. What is its density, in g/cm$^3$?'
            answer_contract: {"kind":"exact"}
            answer: '7.8'
            solution_sketch: 'The volume is $5 \cdot 4 \cdot 2 = 40$ cm$^3$. The density is mass over volume: $312 / 40 = 7.8$ g/cm$^3$.'
          - problem: 'A wooden cube has an edge of $5$ cm and a mass of $90$ g. What is its density, in g/cm$^3$?'
            answer_contract: {"kind":"exact"}
            answer: '0.72'
            solution_sketch: 'The volume is $5^3 = 125$ cm$^3$. The density is $90 / 125 = 0.72$ g/cm$^3$.'
          - problem: 'A solid brass cylinder has a radius of $2$ cm, a height of $10$ cm and a mass of $1055$ g. To the nearest tenth, what is its density, in g/cm$^3$?'
            answer_contract: {"kind":"approx","decimals":1}
            answer: '8.4'
            solution_sketch: 'The volume is $\pi r^2 h = \pi(2)^2(10) = 40\pi \approx 125.66$ cm$^3$. The density is $1055 / 125.66 \approx 8.40$, which is $8.4$ g/cm$^3$ to the nearest tenth.'
          - problem: 'A solid cube with an edge of $4$ cm has a mass of $48$ g. Water has a density of $1$ g/cm$^3$. Will the cube float in water?'
            answer_contract: {"kind":"label","options":[["it floats","floats","float","yes","yes, it floats","it will float","it floats in water","the cube floats"],["it sinks","sinks","sink","no","no, it sinks","it will sink","it sinks in water","the cube sinks"]]}
            answer: 'it floats'
            solution_sketch: 'The volume is $4^3 = 64$ cm$^3$, so the density is $48 / 64 = 0.75$ g/cm$^3$. This is less than the density of water, $1$ g/cm$^3$, so the cube floats.'
          - problem: 'A bottle holds $250$ ml of olive oil, and the oil has a mass of $230$ g. Since $1$ ml is $1$ cm$^3$, what is the density of the oil, in g/cm$^3$?'
            answer_contract: {"kind":"exact"}
            answer: '0.92'
            solution_sketch: 'The volume of the oil is $250$ cm$^3$. The density is $230 / 250 = 0.92$ g/cm$^3$.'
          - problem: 'Gold has a density of $19.3$ g/cm$^3$. A gold bar measures $10$ cm by $5$ cm by $2$ cm. What is the mass of the bar, in grams?'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            answer: '1930'
            solution_sketch: 'The volume is $10 \cdot 5 \cdot 2 = 100$ cm$^3$. Mass is density times volume: $19.3 \cdot 100 = 1930$ g.'
          - problem: 'A solid block measures $10$ cm by $6$ cm by $5$ cm and has a mass of $420$ g. Water has a density of $1$ g/cm$^3$. Will the block float in water?'
            answer_contract: {"kind":"label","options":[["it floats","floats","float","yes","yes, it floats","it will float","it floats in water","the block floats"],["it sinks","sinks","sink","no","no, it sinks","it will sink","it sinks in water","the block sinks"]]}
            answer: 'it sinks'
            solution_sketch: 'The volume is $10 \cdot 6 \cdot 5 = 300$ cm$^3$, so the density is $420 / 300 = 1.4$ g/cm$^3$. This is greater than the density of water, so the block sinks.'
          - problem: 'Aluminum has a density of $2.7$ g/cm$^3$. A piece of aluminium has a mass of $810$ g. What is its volume, in cubic centimetres?'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            answer: '300'
            solution_sketch: 'Density is mass over volume, so volume is mass over density. The volume is $810 / 2.7 = 300$ cm$^3$.'
        constraints: 'density = mass / volume; volumes from prisms and cylinders or given in ml; reversals that give the density and ask for the mass or the volume; float or sink verdicts against water at 1 g/cm^3'
      - id: kp2
        name: Population density
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A city of $30000$ people covers $12$ square kilometers. What is its population density, in people per square kilometer?'
            answer_contract: {"kind":"exact"}
            answer: '2500'
            solution_sketch: 'Population density is the number of people on each square kilometer. The density is the population divided by the area: $30000 / 12 = 2500$ people per square kilometer.'
          - problem: 'A town has $96000$ inhabitants and a population density of $8000$ people per square kilometer. What is the area of the town, in square kilometers?'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The density is population over area. So the area is population over density: $96000 / 8000 = 12$ square kilometers.'
          - problem: 'A rural district of $240$ square kilometers has $1800$ inhabitants. What is its population density, in people per square kilometer?'
            answer_contract: {"kind":"exact"}
            answer: '7.5'
            solution_sketch: 'The density is the population divided by the area. It is $1800 / 240 = 7.5$ people per square kilometer, a thinly settled district.'
          - problem: 'Town A has $18000$ people on $6$ square kilometers. Town B has $25000$ people on $10$ square kilometers. Which town is more densely populated?'
            answer_contract: {"kind":"label","options":[["Town A","A","it is Town A"],["Town B","B","it is Town B"]]}
            answer: 'Town A'
            solution_sketch: 'Town A has density $18000 / 6 = 3000$ people per square kilometer. Town B has density $25000 / 10 = 2500$ people per square kilometer. Town A has more people on each square kilometer, so it is denser, although Town B has more people in total.'
          - problem: 'A county has a population density of $250$ people per square kilometer and an area of $36$ square kilometers. How many people live in the county?'
            answer_contract: {"kind":"exact"}
            answer: '9000'
            solution_sketch: 'The density is population over area, so the population is density times area. It is $250 \cdot 36 = 9000$ people.'
          - problem: 'A rectangular suburb is $4$ km long and $2.5$ km wide and has $35000$ residents. What is its population density, in people per square kilometer?'
            answer_contract: {"kind":"exact"}
            answer: '3500'
            solution_sketch: 'The area is $4 \cdot 2.5 = 10$ square kilometers. The density is $35000 / 10 = 3500$ people per square kilometer.'
          - problem: 'The town of Marlow covers $8$ square kilometers and has a population density of $1500$ people per square kilometer. A new housing estate adds $3000$ residents. What is the new population density, in people per square kilometer?'
            answer_contract: {"kind":"exact"}
            answer: '1875'
            solution_sketch: 'The old population is $1500 \cdot 8 = 12000$. The new population is $12000 + 3000 = 15000$. The new density is $15000 / 8 = 1875$ people per square kilometer.'
          - problem: 'One district covers $12$ square kilometers and has $30000$ people. A second district covers $8$ square kilometers and has $18000$ people. What is the population density of the two districts taken together, in people per square kilometer?'
            answer_contract: {"kind":"exact"}
            answer: '2400'
            solution_sketch: 'Together the districts hold $30000 + 18000 = 48000$ people on $12 + 8 = 20$ square kilometers. The density is $48000 / 20 = 2400$ people per square kilometer. This is not the average of the two separate densities, $2500$ and $2250$.'
        constraints: 'quotients come out whole or with one decimal place; population, area or density asked; areas given directly or as a rectangle; combined regions weigh by area'
      - id: kp3
        name: Capacity and unit conversion
        key_prerequisites: [volume-prisms-cylinders, ratios-proportions]
        exemplars:
          - problem: 'A tank measures $50$ cm by $40$ cm by $30$ cm. How many liters does it hold? (One liter is $1000$ cm$^3$.)'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"l","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The volume is $50 \cdot 40 \cdot 30 = 60000$ cm$^3$. Dividing by $1000$ gives $60$ liters.'
          - problem: 'A tank measures $60$ cm by $50$ cm by $40$ cm. A tap fills it at $6$ liters per minute. How many minutes does it take to fill the empty tank?'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            answer: '20'
            solution_sketch: 'The volume is $60 \cdot 50 \cdot 40 = 120000$ cm$^3$, which is $120$ liters. At $6$ liters per minute the filling takes $120 / 6 = 20$ minutes.'
          - problem: 'A fish tank is $60$ cm long, $30$ cm wide and $40$ cm high. It is filled with water to $5$ cm below the top. How many liters of water does it hold?'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"l","allow_omitted":true}
            answer: '63'
            solution_sketch: 'The water is $40 - 5 = 35$ cm deep. Its volume is $60 \cdot 30 \cdot 35 = 63000$ cm$^3$, which is $63$ liters.'
          - problem: 'A cylindrical rain barrel has a radius of $30$ cm and a height of $90$ cm. To the nearest liter, how much water does the full barrel hold?'
            answer_contract: {"kind":"approx","decimals":0}
            answer: '254'
            solution_sketch: 'The volume is $\pi r^2 h = \pi(30)^2(90) = 81000\pi \approx 254469$ cm$^3$. Dividing by $1000$ gives $254.469$, which is $254$ liters to the nearest liter.'
          - problem: 'A paddling pool is $2$ m long and $1.5$ m wide. It holds $450$ liters of water. How deep is the water, in centimeters?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            answer: '15'
            solution_sketch: 'The volume is $450 \cdot 1000 = 450000$ cm$^3$. The floor measures $200$ cm by $150$ cm, which is $30000$ cm$^2$. The depth is $450000 / 30000 = 15$ cm.'
          - problem: 'A swimming pool is $10$ m long and $5$ m wide, and the water is $1.2$ m deep. A pump removes $200$ liters per minute. How many minutes does it take to empty the pool?'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            answer: '300'
            solution_sketch: 'The volume is $10 \cdot 5 \cdot 1.2 = 60$ m$^3$. Since $1$ m$^3$ is $1000$ liters, the pool holds $60000$ liters. The pump needs $60000 / 200 = 300$ minutes.'
          - problem: 'A cube-shaped container has an edge of $20$ cm and is full of water. One liter of water has a mass of $1$ kg. What is the mass of the water, in kilograms?'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            answer: '8'
            solution_sketch: 'The volume is $20^3 = 8000$ cm$^3$, which is $8$ liters. Each liter has a mass of $1$ kg, so the water has a mass of $8$ kg.'
        constraints: '1 L = 1000 cm^3 and 1 m^3 = 1000 L; whole-number results except for one rounded cylinder; filling and emptying times; a depth found from a capacity'
    diagnostic_exemplar:
      problem: 'A cube with an edge of $4$ cm has a mass of $320$ g. What is its density, in g/cm$^3$?'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'The volume is $4^3 = 64$ cm$^3$. The density is mass over volume: $320 / 64 = 5$ g/cm$^3$.'
    anki_seeds:
      - front: "Density ="
        back: "mass / volume"
        type: basic
      - front: "1 liter equals ... cubic centimeters."
        back: "1000"
        type: basic

  - id: coordinate-geometry-proofs
    name: Coordinate Geometry Proofs
    core: false
    difficulty: 0.52
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.8
        key: true
      - id: slope
        weight: 0.6
        key: true
      - id: special-parallelograms
        weight: 0.4
        key: false
      - id: writing-geometric-proofs
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Parallel and perpendicular via slope
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Line $\ell$ passes through $(0,0)$ and $(6,3)$. Line $m$ passes through $(1,5)$ and $(5,7)$. How are the two lines related?'
            answer_contract: {"kind":"label","options":[["parallel","they are parallel","parallel lines","the lines are parallel","they're parallel","parallel to each other"],["perpendicular","they are perpendicular","perpendicular lines","the lines are perpendicular","they're perpendicular","perpendicular to each other"],["neither","they are neither","neither parallel nor perpendicular","not parallel or perpendicular","neither parallel or perpendicular","they are neither parallel nor perpendicular"]]}
            answer: 'parallel'
            solution_sketch: 'The slope of $\ell$ is $\frac{3 - 0}{6 - 0} = \frac{1}{2}$. The slope of $m$ is $\frac{7 - 5}{5 - 1} = \frac{2}{4} = \frac{1}{2}$. The slopes are equal and the lines are different, so the lines are parallel.'
          - problem: 'On a map with units in kilometres, a road runs from the junction at $(0,0)$ to a village at $(8,6)$. A new road must cross the first road at a right angle. What slope should the new road have?'
            answer_contract: {"kind":"exact"}
            answer: '-4/3'
            solution_sketch: 'The first road has slope $\frac{6}{8} = \frac{3}{4}$. Perpendicular slopes multiply to $-1$, so the new road has slope $-\frac{4}{3}$, since $\frac{3}{4} \cdot \left(-\frac{4}{3}\right) = -1$.'
          - problem: 'A garden bed has an edge running from $(1,1)$ to $(4,3)$ on a plan in metres. A straight path runs from $(2,5)$ to $(0,8)$. How is the path related to the edge of the bed?'
            answer_contract: {"kind":"label","options":[["parallel","they are parallel","parallel lines","the lines are parallel","they're parallel","parallel to each other"],["perpendicular","they are perpendicular","perpendicular lines","the lines are perpendicular","they're perpendicular","perpendicular to each other"],["neither","they are neither","neither parallel nor perpendicular","not parallel or perpendicular","neither parallel or perpendicular","they are neither parallel nor perpendicular"]]}
            answer: 'perpendicular'
            solution_sketch: 'The edge has slope $\frac{3 - 1}{4 - 1} = \frac{2}{3}$. The path has slope $\frac{8 - 5}{0 - 2} = -\frac{3}{2}$. The product of the slopes is $\frac{2}{3} \cdot \left(-\frac{3}{2}\right) = -1$, so the path is perpendicular to the edge.'
          - problem: 'The line through $(1,2)$ and $(7,k)$ is perpendicular to the line through $(0,0)$ and $(4,6)$. What is $k$?'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'The second line has slope $\frac{6}{4} = \frac{3}{2}$, so the first line needs slope $-\frac{2}{3}$. The slope through $(1,2)$ and $(7,k)$ is $\frac{k - 2}{6}$, so $\frac{k - 2}{6} = -\frac{2}{3}$. This gives $k - 2 = -4$, so $k = -2$.'
          - problem: 'Line $p$ passes through $(0,0)$ and $(2,8)$. Line $r$ passes through $(1,1)$ and $(9,3)$. How are the two lines related?'
            answer_contract: {"kind":"label","options":[["parallel","they are parallel","parallel lines","the lines are parallel","they're parallel","parallel to each other"],["perpendicular","they are perpendicular","perpendicular lines","the lines are perpendicular","they're perpendicular","perpendicular to each other"],["neither","they are neither","neither parallel nor perpendicular","not parallel or perpendicular","neither parallel or perpendicular","they are neither parallel nor perpendicular"]]}
            answer: 'neither'
            solution_sketch: 'The slope of $p$ is $\frac{8}{2} = 4$. The slope of $r$ is $\frac{3 - 1}{9 - 1} = \frac{1}{4}$. The slopes are not equal, so the lines are not parallel. Their product is $4 \cdot \frac{1}{4} = 1$, not $-1$, so they are not perpendicular either.'
          - problem: 'A fence is to run parallel to a straight stream. On a map, the stream passes through $(2,7)$ and $(8,1)$. What is the slope of the fence?'
            answer_contract: {"kind":"exact"}
            answer: '-1'
            solution_sketch: 'Parallel lines have equal slopes. The slope of the stream is $\frac{1 - 7}{8 - 2} = \frac{-6}{6} = -1$, so the fence also has slope $-1$.'
          - problem: 'The line through $(1,3)$ and $(5,k)$ is parallel to the line through $(0,0)$ and $(2,3)$. What is $k$?'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Parallel lines have equal slopes. The slope of the second line is $3/2$, so $(k - 3)/4 = 3/2$, which gives $k - 3 = 6$ and $k = 9$.'
          - problem: 'Write the full proof that the quadrilateral $ABCD$ with $A(0,0)$, $B(6,3)$, $C(4,7)$ and $D(-2,4)$ is a rectangle, using slopes.'
            answer_contract: {"kind":"none"}
            answer: 'ABCD is a rectangle'
            solution_sketch: '1. Slope of $\overline{AB}$ is $\frac{3 - 0}{6 - 0} = \frac{1}{2}$ and slope of $\overline{DC}$ is $\frac{7 - 4}{4 - (-2)} = \frac{1}{2}$ (slope formula). 2. Slope of $\overline{BC}$ is $\frac{7 - 3}{4 - 6} = -2$ and slope of $\overline{AD}$ is $\frac{4 - 0}{-2 - 0} = -2$ (slope formula). 3. $\overline{AB} \parallel \overline{DC}$ and $\overline{BC} \parallel \overline{AD}$ (lines with equal slopes are parallel). 4. $ABCD$ is a parallelogram (both pairs of opposite sides are parallel). 5. $\frac{1}{2} \cdot (-2) = -1$, so $\overline{AB} \perp \overline{BC}$ (lines whose slopes multiply to $-1$ are perpendicular). 6. $\angle ABC$ is a right angle (definition of perpendicular lines). 7. $ABCD$ is a rectangle (a parallelogram with one right angle is a rectangle).'
        constraints: 'integer coordinates; slopes are the evidence for every verdict; parallel, perpendicular and neither outcomes are all used; one written proof that closes the knowledge point'
      - id: kp2
        name: Classify triangles with the distance formula
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'On a map with units in kilometres, a lighthouse stands at $(2,3)$ and a harbour at $(8,11)$. How far apart are they, in kilometres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            answer: '10'
            solution_sketch: 'The horizontal difference is $8 - 2 = 6$ and the vertical difference is $11 - 3 = 8$. The distance is $\sqrt{6^2 + 8^2} = \sqrt{100} = 10$ km.'
          - problem: 'The triangle $PQR$ has vertices $P(-2,1)$, $Q(1,5)$ and $R(-6,-2)$. Classify the triangle by its sides.'
            answer_contract: {"kind":"label","options":[["isosceles","an isosceles triangle","it is isosceles","isosceles triangle","it's isosceles"],["equilateral","an equilateral triangle","it is equilateral","equilateral triangle","it's equilateral"],["scalene","a scalene triangle","it is scalene","scalene triangle","it's scalene"]]}
            answer: 'isosceles'
            solution_sketch: 'The distance formula gives $PQ = \sqrt{3^2 + 4^2} = 5$, $PR = \sqrt{(-4)^2 + (-3)^2} = 5$ and $QR = \sqrt{(-7)^2 + (-7)^2} = 7\sqrt{2}$. Exactly two sides are equal, so the triangle is isosceles.'
          - problem: 'The triangle $ABC$ has vertices $A(0,0)$, $B(8,6)$ and $C(-3,4)$. Classify the triangle by its angles.'
            answer_contract: {"kind":"label","options":[["right","a right triangle","right triangle","it is right","it's right","right-angled","right-angled triangle","right angled triangle"],["acute","an acute triangle","acute triangle","it is acute","it's acute"],["obtuse","an obtuse triangle","obtuse triangle","it is obtuse","it's obtuse"]]}
            answer: 'right'
            solution_sketch: 'The sides are $AB = \sqrt{64 + 36} = 10$, $AC = \sqrt{9 + 16} = 5$ and $BC = \sqrt{121 + 4} = \sqrt{125}$. Since $5^2 + 10^2 = 125 = BC^2$, the converse of the Pythagorean theorem gives a right angle at $A$.'
          - problem: 'Three buoys mark a triangular sailing course on a plan with units in metres. They sit at $A(0,0)$, $B(14,0)$ and $C(5,12)$. Classify the course by its sides.'
            answer_contract: {"kind":"label","options":[["isosceles","an isosceles triangle","it is isosceles","isosceles triangle","it's isosceles"],["equilateral","an equilateral triangle","it is equilateral","equilateral triangle","it's equilateral"],["scalene","a scalene triangle","it is scalene","scalene triangle","it's scalene"]]}
            answer: 'scalene'
            solution_sketch: 'The sides are $AB = 14$, $AC = \sqrt{5^2 + 12^2} = 13$ and $BC = \sqrt{9^2 + 12^2} = 15$. All three lengths differ, so the course is scalene.'
          - problem: 'A triangular training area has its corners at $(0,0)$, $(60,0)$ and $(30,40)$ on a plan with units in metres. How much fencing is needed to go all the way around it, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '160'
            solution_sketch: 'The base is $60$ m. The other two sides are $\sqrt{30^2 + 40^2} = 50$ m each. The fence length is $60 + 50 + 50 = 160$ m.'
          - problem: 'What is the exact distance between the points $(1,2)$ and $(4,5)$?'
            answer_contract: {"kind":"required_simplest_radical"}
            answer: '3*sqrt(2)'
            solution_sketch: 'The distance is $\sqrt{(4 - 1)^2 + (5 - 2)^2} = \sqrt{9 + 9} = \sqrt{18}$. Since $18 = 9 \cdot 2$, this simplifies to $3\sqrt{2}$.'
          - problem: 'The point $(5,y)$ lies above the line $y = 2$, and its distance from $(1,2)$ is $5$. What is $y$?'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The distance formula gives $\sqrt{(5 - 1)^2 + (y - 2)^2} = 5$, so $16 + (y - 2)^2 = 25$. Then $(y - 2)^2 = 9$, so $y - 2 = 3$ for a point above the line, and $y = 5$.'
          - problem: 'Write the full proof that the triangle $PQR$ with $P(1,0)$, $Q(5,2)$ and $R(3,6)$ is an isosceles right triangle.'
            answer_contract: {"kind":"none"}
            answer: 'PQR is an isosceles right triangle'
            solution_sketch: '1. $PQ^2 = (5 - 1)^2 + (2 - 0)^2 = 20$ (distance formula). 2. $QR^2 = (3 - 5)^2 + (6 - 2)^2 = 20$ (distance formula). 3. $PQ = QR$ (statements 1 and 2), so the triangle is isosceles. 4. $PR^2 = (3 - 1)^2 + (6 - 0)^2 = 40$ (distance formula). 5. $PQ^2 + QR^2 = 20 + 20 = 40 = PR^2$ (statements 1, 2 and 4). 6. $\angle PQR$ is a right angle (converse of the Pythagorean theorem). 7. $PQR$ is an isosceles right triangle (statements 3 and 6).'
        constraints: 'distances land on whole numbers or clean radicals; every classification cites the computed lengths; sides, angles, perimeters and one unknown coordinate; one written proof that closes the knowledge point'
      - id: kp3
        name: Quadrilateral proofs via midpoints and diagonals
        key_prerequisites: [distance-midpoint-formulas, slope]
        exemplars:
          - problem: 'The quadrilateral $ABCD$ has vertices $A(0,0)$, $B(5,0)$, $C(7,3)$ and $D(2,3)$. What is the midpoint of diagonal $\overline{BD}$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3.5, 1.5)'
            solution_sketch: 'The midpoint of $\overline{BD}$ is $\left(\frac{5 + 2}{2}, \frac{0 + 3}{2}\right) = (3.5, 1.5)$. The midpoint of $\overline{AC}$ is $\left(\frac{0 + 7}{2}, \frac{0 + 3}{2}\right)$, the same point.'
          - problem: 'A rope is tied between two posts at $(-2,5)$ and $(8,1)$ on a plan with units in metres. A lantern hangs from the midpoint of the rope. At which point on the plan does it hang?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 3)'
            solution_sketch: 'The lantern hangs halfway along the rope, so it hangs at the midpoint of the two posts. The midpoint has coordinates $\left(\frac{-2 + 8}{2}, \frac{5 + 1}{2}\right) = (3, 3)$.'
          - problem: 'In the quadrilateral $ABCD$ with $A(0,0)$, $B(5,0)$, $C(7,3)$ and $D(2,3)$, both diagonals have the midpoint $(3.5, 1.5)$. Which property of quadrilaterals justifies the conclusion that $ABCD$ is a parallelogram?'
            answer_contract: {"kind":"label","options":[["diagonals bisect each other","the diagonals bisect each other","bisecting diagonals","bisecting diagonals test","diagonals bisect one another"],["opposite sides are congruent","opposite sides congruent","congruent opposite sides"],["opposite angles are congruent","opposite angles congruent","congruent opposite angles"],["diagonals are congruent","congruent diagonals","the diagonals are congruent"]]}
            answer: 'diagonals bisect each other'
            solution_sketch: 'Both diagonals have the same midpoint, so each diagonal is cut into two equal parts by the other. A quadrilateral whose diagonals bisect each other is a parallelogram. Nothing was found about side lengths, angles or the lengths of the diagonals.'
          - problem: 'Three vertices of the parallelogram $ABCD$ are $A(1,1)$, $B(6,2)$ and $C(8,6)$. What are the coordinates of $D$?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3, 5)'
            solution_sketch: 'The diagonals bisect each other. The midpoint of $\overline{AC}$ is $\left(\frac{9}{2}, \frac{7}{2}\right)$, and it is also the midpoint of $\overline{BD}$. So $D = (2 \cdot 4.5 - 6, 2 \cdot 3.5 - 2) = (3, 5)$. Check: $\overrightarrow{AB} = (5,1)$ and $\overrightarrow{DC} = (5,1)$.'
          - problem: 'The quadrilateral $ABCD$ has $A(0,0)$, $B(4,3)$, $C(-2,11)$ and $D(-6,8)$. Its diagonals bisect each other, and $AC = BD = \sqrt{125}$. Which special parallelogram is $ABCD$?'
            answer_contract: {"kind":"label","options":[["parallelogram","a parallelogram","just a parallelogram"],["rectangle","a rectangle","it is a rectangle"],["rhombus","a rhombus","it is a rhombus"],["square","a square","it is a square"]]}
            answer: 'rectangle'
            solution_sketch: 'Diagonals that bisect each other make $ABCD$ a parallelogram, and congruent diagonals make it a rectangle. It is not a rhombus, because $AB = 5$ and $BC = \sqrt{36 + 64} = 10$ differ.'
          - problem: 'A carpenter checks a rectangular door frame by measuring its diagonals. On a plan with units in metres the corners are $A(0,0)$, $B(2,0)$, $C(2,1.5)$ and $D(0,1.5)$. How long should each diagonal be, in metres?'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '2.5'
            solution_sketch: 'A rectangle has two congruent diagonals. The diagonal $\overline{BD}$ has length $\sqrt{(0 - 2)^2 + (1.5 - 0)^2} = \sqrt{4 + 2.25} = \sqrt{6.25} = 2.5$ m, and $\overline{AC}$ has the same length.'
          - problem: 'The quadrilateral $ABCD$ has $A(0,3)$, $B(4,0)$, $C(0,-3)$ and $D(-4,0)$. Its diagonals meet at the origin, and each diagonal is bisected there. What is the most specific name for $ABCD$?'
            answer_contract: {"kind":"label","options":[["parallelogram","a parallelogram","just a parallelogram"],["rectangle","a rectangle","it is a rectangle"],["rhombus","a rhombus","it is a rhombus"],["square","a square","it is a square"]]}
            answer: 'rhombus'
            solution_sketch: 'Diagonals that bisect each other make $ABCD$ a parallelogram. The diagonal $\overline{AC}$ lies on the y-axis and $\overline{BD}$ on the x-axis, so they are perpendicular, which makes the parallelogram a rhombus. The diagonals have lengths $6$ and $8$, which differ, so the rhombus is not a rectangle and not a square.'
          - problem: 'Four pegs mark the corners $A(0,0)$, $B(8,2)$, $C(10,8)$ and $D(2,6)$ of a plot, and $ABCD$ is a parallelogram. At which point do the diagonals of the plot cross?'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5, 4)'
            solution_sketch: 'The diagonals of a parallelogram bisect each other, so they cross at the midpoint of $\overline{AC}$. That midpoint is $\left(\frac{0 + 10}{2}, \frac{0 + 8}{2}\right) = (5, 4)$. The midpoint of $\overline{BD}$ is $\left(\frac{8 + 2}{2}, \frac{2 + 6}{2}\right) = (5, 4)$ as well.'
          - problem: 'Write the full proof that the quadrilateral $ABCD$ with $A(0,0)$, $B(3,4)$, $C(8,4)$ and $D(5,0)$ is a rhombus, using its diagonals.'
            answer_contract: {"kind":"none"}
            answer: 'ABCD is a rhombus'
            solution_sketch: '1. The midpoint of $\overline{AC}$ is $\left(\frac{0 + 8}{2}, \frac{0 + 4}{2}\right) = (4, 2)$ (midpoint formula). 2. The midpoint of $\overline{BD}$ is $\left(\frac{3 + 5}{2}, \frac{4 + 0}{2}\right) = (4, 2)$ (midpoint formula). 3. The diagonals bisect each other (statements 1 and 2). 4. $ABCD$ is a parallelogram (a quadrilateral whose diagonals bisect each other). 5. The slope of $\overline{AC}$ is $\frac{4 - 0}{8 - 0} = \frac{1}{2}$ and the slope of $\overline{BD}$ is $\frac{0 - 4}{5 - 3} = -2$ (slope formula). 6. $\frac{1}{2} \cdot (-2) = -1$, so $\overline{AC} \perp \overline{BD}$ (slopes that multiply to $-1$). 7. $ABCD$ is a rhombus (a parallelogram with perpendicular diagonals).'
        constraints: 'integer or half-integer coordinates; every conclusion names the property used (diagonals bisect each other, congruent diagonals, perpendicular diagonals); midpoints, a missing vertex, special-parallelogram names and one written proof that closes the knowledge point'
    diagnostic_exemplar:
      problem: 'Use the diagonals of quadrilateral $A(0,0)$, $B(4,2)$, $C(3,4)$, $D(-1,2)$ to prove that it is a rectangle.'
      answer_contract: {"kind":"none"}
      answer: 'Diagonals AC and BD have the same midpoint (3/2, 2), so they bisect each other and ABCD is a parallelogram; and AC = BD = 5, so this parallelogram has congruent diagonals and is therefore a rectangle'
      solution_sketch: 'Midpoint of $\overline{AC} = \left(\frac{3}{2}, 2\right)$ = midpoint of $\overline{BD}$; $AC = \sqrt{9 + 16} = 5$ and $BD = \sqrt{25 + 0} = 5$.'
    anki_seeds:
      - front: "Two nonvertical lines are perpendicular iff their slopes..."
        back: "multiply to -1 (are negative reciprocals)"
        type: basic
      - front: "Coordinate proof that a quadrilateral is a parallelogram (fastest test):"
        back: "the two diagonals share the same midpoint"
        type: basic
      - front: "A parallelogram with congruent diagonals is a..."
        back: "rectangle"
        type: basic
