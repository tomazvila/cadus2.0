    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: area-triangles-quadrilaterals
        weight: 0.6
        key: true
      - id: circle-area-circumference
        weight: 0.5
        key: true
      - id: pythagorean-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Prism and cube surface area
        key_prerequisites: [area-triangles-quadrilaterals]
        exemplars:
          - problem: 'Find the surface area of a $3 \times 4 \times 5$ rectangular prism.'
            answer: "94"
            solution_sketch: '$2(3 \cdot 4 + 3 \cdot 5 + 4 \cdot 5) = 2(12 + 15 + 20) = 94$.'
          - problem: 'Find the surface area of a cube with edge $6$.'
            answer: "216"
            solution_sketch: '$6 \cdot 6^2 = 216$.'
        constraints: "small integer dimensions; sum all six faces"
      - id: kp2
        name: Cylinder surface area
        key_prerequisites: [circle-area-circumference]
        exemplars:
          - problem: 'Find the surface area of a cylinder with radius $4$ and height $6$ (exact, in terms of $\pi$).'
            answer: '$80\pi$'
            solution_sketch: '$2\pi r^2 + 2\pi r h = 32\pi + 48\pi = 80\pi$.'
          - problem: 'Find the lateral (side-only) surface area of a cylinder with radius $5$ and height $9$ (exact).'
            answer: '$90\pi$'
            solution_sketch: 'Lateral area $= 2\pi r h = 90\pi$.'
        constraints: "distinguish total vs lateral area; exact pi answers"
      - id: kp3
        name: Pyramid, cone, and sphere surface area
        key_prerequisites: [area-triangles-quadrilaterals, circle-area-circumference, pythagorean-theorem]
        exemplars:
          - problem: 'A square pyramid has base edge $10$ and slant height $13$. Find its total surface area.'
            answer: "360"
            solution_sketch: 'Base $100$ plus $4 \cdot \frac{1}{2} \cdot 10 \cdot 13 = 260$; total $360$.'
          - problem: 'Find the total surface area of a cone with radius $3$ and slant height $5$ (exact).'
            answer: '$24\pi$'
            solution_sketch: '$\pi r^2 + \pi r \ell = 9\pi + 15\pi = 24\pi$.'
          - problem: 'Find the surface area of a sphere with radius $5$ (exact).'
            answer: '$100\pi$'
            solution_sketch: '$4\pi r^2 = 100\pi$.'
        constraints: "slant heights given or derivable from a Pythagorean triple"
    diagnostic_exemplar:
      problem: 'A square pyramid has base edge $12$ and slant height $10$. Find its total surface area.'
      answer: "384"
      solution_sketch: 'Base $144$ plus $4 \cdot \frac{1}{2} \cdot 12 \cdot 10 = 240$; total $384$.'
    anki_seeds:
      - front: "Total surface area of a cylinder:"
        back: "2 pi r^2 + 2 pi r h"
        type: basic
      - front: "Lateral surface area of a cone with radius r and slant height l:"
        back: "pi r l"
        type: basic
      - front: "Surface area of a sphere:"
        back: "4 pi r^2"
        type: basic
      # Nets are covered as declarative recall here rather than as a topic: the skill is
      # spatial visualisation of a diagram the tutor can neither show nor check, so a typed
      # version degenerates to fact recall (recorded decision, curriculum-hole-checklist.md).
      - front: "What is a net of a solid, and what is it used for?"
        back: "The solid unfolded flat into its faces; the total area of the net IS the surface area."
        type: basic

  - id: similar-solids-scaling
    name: Similar Solids and Scaling
    core: false                # applications leaf topic
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: volume-prisms-cylinders
        weight: 0.6
        key: true
      - id: dilations-scale-factors
        weight: 0.5
        key: true
      - id: surface-area-solids
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Length, area, and volume scale factors
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        exemplars:
          - problem: 'Two similar solids have linear scale factor $3$. By what factor do their surface areas differ?'
            answer: "9"
            solution_sketch: 'Areas scale by $k^2 = 9$.'
          - problem: 'Two similar prisms have edges in ratio $2:5$. Find the ratio of their surface areas, as a single fraction (smaller to larger).'
            answer: "4/25"
            solution_sketch: 'Areas scale by $k^2$: $\left(\frac{2}{5}\right)^2 = \frac{4}{25}$.'
          - problem: 'Two similar solids have linear scale factor $3$. By what factor do their volumes differ?'
            answer: "27"
            solution_sketch: 'Volumes scale by $k^3 = 27$.'
        constraints: "k a small integer or simple ratio; ask for area (k^2) or volume (k^3) factors; ratios requested as a single fraction"
      - id: kp2
        name: Recover the linear ratio from areas or volumes
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        exemplars:
          - problem: 'Two similar solids have volumes in ratio $8:27$. Find the ratio of their surface areas, as a single fraction (first to second).'
            answer: "4/9"
            solution_sketch: 'Linear ratio $= \sqrt[3]{8} : \sqrt[3]{27} = 2:3$; areas $\frac{4}{9}$.'
          - problem: 'Two similar solids have volumes in ratio $125:64$. Find their linear scale ratio, as a single fraction (first to second).'
            answer: "5/4"
            solution_sketch: 'Cube roots: $\frac{5}{4}$.'
        constraints: "perfect-cube volume ratios; ratios requested as a single fraction"
      - id: kp3
        name: Compute scaled measurements
        key_prerequisites: [dilations-scale-factors, volume-prisms-cylinders]
        exemplars:
          - problem: 'Two similar cylinders have scale factor $2$; the smaller has volume $30\pi$. Find the volume of the larger (exact).'
            answer: '$240\pi$'
            solution_sketch: '$30\pi \cdot 2^3 = 240\pi$.'
          - problem: 'A model is built at scale $1:3$ of a solid whose volume is $54$ cubic units. Find the model''s volume.'
            answer: "2"
            solution_sketch: '$54 / 27 = 2$.'
          - problem: 'Two similar solids have scale factor $3$; the smaller has surface area $40$. Find the larger''s surface area.'
            answer: "360"
            solution_sketch: '$40 \cdot 9 = 360$.'
        constraints: "volumes divisible by k^3; areas by k^2"
    diagnostic_exemplar:
      problem: 'Two similar solids have linear scale ratio $2:3$, and the smaller has volume $40$. Find the volume of the larger.'
      answer: "135"
      solution_sketch: '$40 \cdot \frac{27}{8} = 135$.'
    anki_seeds:
      - front: "If similar figures have linear scale factor k, areas scale by..."
        back: "k^2"
        type: basic
      - front: "If similar solids have linear scale factor k, volumes scale by..."
        back: "k^3"
        type: basic

  - id: density-measurement-problems
    name: Density and Measurement Problems
    core: false                # applications leaf topic
    difficulty: 0.44
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - {id: metric-unit-conversion, weight: 0.4, key: false}       # kp3 is 'Capacity and unit conversion'
      - id: volume-prisms-cylinders
        weight: 0.6
        key: true
      - id: ratios-proportions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Density from mass and volume
        key_prerequisites: [volume-prisms-cylinders, ratios-proportions]
        exemplars:
          - problem: 'A metal block measuring $5 \times 4 \times 2$ cm has mass $312$ g. Find its density in g/cm$^3$.'
            answer: "7.8"
            solution_sketch: 'Volume $= 40$ cm$^3$; density $= 312/40 = 7.8$ g/cm$^3$.'
          - problem: 'A sample has mass $500$ g and volume $25$ cm$^3$. Find its density in g/cm$^3$.'
            answer: "20"
        constraints: "density = mass / volume; volumes from simple prisms; one decimal place at most"
      - id: kp2
        name: Population density
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A city of $30000$ people covers $12$ square kilometers. Find its population density, in people per square kilometer.'
            answer: "2500"
            solution_sketch: '$30000 / 12 = 2500$.'
          - problem: 'A town has population density $8000$ people per square kilometer and population $96000$. Find its area, in square kilometers.'
            answer: "12"
            solution_sketch: '$96000 / 8000 = 12$.'
        constraints: "quotients come out whole"
      - id: kp3
        name: Capacity and unit conversion
        key_prerequisites: [volume-prisms-cylinders, ratios-proportions]
        exemplars:
          - problem: 'A tank measures $50 \times 40 \times 30$ cm. How many liters does it hold? ($1$ L $= 1000$ cm$^3$.)'
            answer: "60"
            solution_sketch: '$60000$ cm$^3 = 60$ L.'
          - problem: 'A $60$-liter tank is filled at $5$ liters per minute. How many minutes does filling take?'
            answer: "12"
            solution_sketch: '$60 / 5 = 12$.'
        constraints: "1 L = 1000 cm^3; whole-number results"
    diagnostic_exemplar:
      problem: 'A cube with edge $4$ cm has mass $320$ g. Find its density in g/cm$^3$.'
      answer: "5"
      solution_sketch: 'Volume $= 64$ cm$^3$; $320/64 = 5$.'
    anki_seeds:
      - front: "Density ="
        back: "mass / volume"
        type: basic
      - front: "1 liter equals ... cubic centimeters."
        back: "1000"
        type: basic

  - id: coordinate-geometry-proofs
    name: Coordinate Geometry Proofs
    core: false                # proof-practice genre; terminal
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: distance-midpoint-formulas
        weight: 0.8
        key: true
      - id: slope
        weight: 0.6
        key: true
      - id: special-parallelograms
        weight: 0.4
        key: false
      - id: writing-geometric-proofs
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: Parallel and perpendicular via slope
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Show that quadrilateral $A(0,0)$, $B(4,1)$, $C(6,5)$, $D(2,4)$ is a parallelogram.'
            answer: 'Slopes: $AB = DC = \frac{1}{4}$ and $BC = AD = 2$; both pairs of opposite sides are parallel, so $ABCD$ is a parallelogram.'
            solution_sketch: '$m_{AB} = \frac{1}{4}$, $m_{DC} = \frac{5-4}{6-2} = \frac{1}{4}$; $m_{BC} = \frac{5-1}{6-4} = 2$, $m_{AD} = \frac{4}{2} = 2$.'
          - problem: 'Are the segments through $(0,0),(3,2)$ and through $(1,5),(-3,11)$ perpendicular? Justify with slopes.'
            answer: 'Yes; slopes $\frac{2}{3}$ and $-\frac{3}{2}$ multiply to $-1$.'
            solution_sketch: 'Second slope $= \frac{11-5}{-3-1} = -\frac{3}{2}$; product with $\frac{2}{3}$ is $-1$.'
        constraints: "integer coordinates; slopes must be stated as the justification"
      - id: kp2
        name: Classify triangles with the distance formula
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'Classify the triangle $A(0,0)$, $B(6,0)$, $C(3,3)$ as precisely as possible.'
            answer: 'Isosceles right triangle: $AC = BC = 3\sqrt{2}$ and $AC^2 + BC^2 = 36 = AB^2$.'
            solution_sketch: '$AC = \sqrt{9+9} = 3\sqrt{2} = BC$; $18 + 18 = 36 = 6^2$, so the angle at $C$ is right.'
          - problem: 'Show that the triangle $P(1,1)$, $Q(4,5)$, $R(-3,4)$ is isosceles.'
            answer: '$PQ = PR = 5$, so two sides are congruent.'
            solution_sketch: '$PQ = \sqrt{3^2+4^2} = 5$; $PR = \sqrt{(-4)^2+3^2} = 5$.'
        constraints: "distances land on Pythagorean triples or clean radicals; classification must cite the computed lengths"
      - id: kp3
        name: Quadrilateral proofs via midpoints and diagonals
        key_prerequisites: [distance-midpoint-formulas, slope]
        exemplars:
          - problem: 'Show that the diagonals of quadrilateral $A(0,0)$, $B(5,0)$, $C(7,3)$, $D(2,3)$ bisect each other, and state what that proves.'
            answer: 'Midpoint of $\overline{AC}$ = midpoint of $\overline{BD}$ = $\left(\frac{7}{2}, \frac{3}{2}\right)$; the diagonals bisect each other, so $ABCD$ is a parallelogram.'
            solution_sketch: 'Midpoint of $AC$: $(3.5, 1.5)$; midpoint of $BD$: $(3.5, 1.5)$.'
          - problem: 'Quadrilateral $ABCD$ is known to be a parallelogram with $A(0,0)$, $B(6,3)$, $C(4,7)$, $D(-2,4)$. Use its diagonals to decide whether it is a rectangle.'
            answer: 'Yes: $AC = BD = \sqrt{65}$, and a parallelogram with congruent diagonals is a rectangle.'
            solution_sketch: '$AC = \sqrt{4^2 + 7^2} = \sqrt{65}$; $BD = \sqrt{(-8)^2 + 1^2} = \sqrt{65}$.'
        constraints: "each conclusion must name the theorem used (diagonal bisection, congruent diagonals, perpendicular diagonals)"
    diagnostic_exemplar:
      problem: 'Use the diagonals of quadrilateral $A(0,0)$, $B(4,2)$, $C(3,4)$, $D(-1,2)$ to prove that it is a rectangle.'
      answer: 'Diagonals AC and BD have the same midpoint (3/2, 2), so they bisect each other and ABCD is a parallelogram; and AC = BD = 5, so this parallelogram has congruent diagonals and is therefore a rectangle'
      solution_sketch: 'Midpoint of $\overline{AC} = \left(\frac{3}{2}, 2\right)$ = midpoint of $\overline{BD}$; $AC = \sqrt{9 + 16} = 5$ and $BD = \sqrt{25 + 0} = 5$.'
    anki_seeds:
      - front: "Two nonvertical lines are perpendicular iff their slopes..."
        back: "multiply to -1 (are negative reciprocals)"
        type: basic
      - front: "Coordinate proof that a quadrilateral is a parallelogram (fastest test):"
        back: "the two diagonals share the same midpoint"
        type: basic
      - front: "A parallelogram with congruent diagonals is a..."
        back: "rectangle"
        type: basic
