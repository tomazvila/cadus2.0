  - id: volume-prisms-cylinders
    name: Volumes of Prisms and Cylinders
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: volume-prisms
        weight: 0.8
        key: true
      - id: volume-cylinders
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Work backwards from a volume
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A cylinder with radius $3$ has volume $54\pi$. Find its height.'
            answer: "6"
            solution_sketch: '$9\pi h = 54\pi \Rightarrow h = 6$.'
          - problem: 'A rectangular prism with an $8 \times 5$ base has volume $240$. Find its height.'
            answer: "6"
            solution_sketch: '$40h = 240 \Rightarrow h = 6$.'
          - problem: 'A cylinder has volume $90\pi$ and height $10$. Find its radius.'
            answer: "3"
            solution_sketch: '$\pi r^2 \cdot 10 = 90\pi \Rightarrow r^2 = 9$.'
        constraints: "divide volume by base area (or solve for r via a perfect square); integer answers"
      - id: kp2
        name: Composite solids
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A solid is an $8 \times 4 \times 3$ box topped by a half-cylinder of radius $2$ running the full length $8$. Find its volume (exact).'
            answer: '$96 + 16\pi$'
            solution_sketch: 'Box $96$; half-cylinder $\frac{1}{2}\pi \cdot 4 \cdot 8 = 16\pi$.'
          - problem: 'A cylindrical hole of radius $1$ is drilled straight through a $5 \times 4 \times 4$ block along its length $5$. Find the remaining volume (exact).'
            answer: '$80 - 5\pi$'
            solution_sketch: '$80 - \pi \cdot 1^2 \cdot 5 = 80 - 5\pi$.'
        constraints: "one prism plus or minus one cylinder piece; exact pi answers"
      - id: kp3
        name: Equal volumes and scaling
        key_prerequisites: [volume-prisms, volume-cylinders]
        exemplars:
          - problem: 'A cylinder with radius $6$ and height $2$ has the same volume as a cylinder with radius $3$ and height $h$. Find $h$.'
            answer: "8"
            solution_sketch: '$72\pi = 9\pi h \Rightarrow h = 8$.'
          - problem: 'If a cylinder''s radius is doubled and its height is unchanged, its volume is multiplied by what factor?'
            answer: "4"
            solution_sketch: '$V \propto r^2$.'
        constraints: "clean ratios; factor questions ask for the multiplier"
    diagnostic_exemplar:
      problem: 'A solid is a $6 \times 4 \times 3$ box topped by a half-cylinder of radius $2$ running the full length $6$. Find its volume (exact, in terms of $\pi$).'
      answer: '$72 + 12\pi$'
      solution_sketch: 'Box $= 72$; half-cylinder $= \frac{1}{2}\pi \cdot 2^2 \cdot 6 = 12\pi$.'
    anki_seeds:
      - front: "Volume of any prism or cylinder:"
        back: "V = B x h (base area times height)"
        type: basic
      - front: "Doubling a cylinder's radius (same height) multiplies its volume by..."
        back: "4"
