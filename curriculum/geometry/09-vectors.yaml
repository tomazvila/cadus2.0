unit: vectors
course: geometry
module: "Vectors in the Plane"
topics:
  - id: vectors-geometric-rules
    lt_term: 'plokštumos vektoriai; trikampio ir lygiagretainio taisyklės'
    name: 'Plane Vectors: Triangle and Parallelogram Rules, Polygon Expressions'
    core: false
    difficulty: 0.45
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: translations-coordinate-plane
        weight: 0.6
        key: true
      - id: parallelogram-properties
        weight: 0.5
        key: false
      - id: medians-centroids
        weight: 0.4
        key: false
      - id: distance-midpoint-formulas
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Sum and difference by the triangle and parallelogram rules'
        key_prerequisites: [translations-coordinate-plane, parallelogram-properties]
        exemplars:
          - problem: 'In a triangle $ABC$, $\overrightarrow{AB}=(2,3)$ and $\overrightarrow{BC}=(4,-1)$. Find the coordinates of $\overrightarrow{AC}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6,2)'
            solution_sketch: 'The triangle rule gives $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}$. Add the coordinates: $(2+4,3-1)$. The answer is $(6,2)$.'
          - problem: 'In a triangle $ABC$, $\overrightarrow{AB}=(5,1)$ and $\overrightarrow{AC}=(2,4)$. Find the coordinates of $\overrightarrow{BC}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3,3)'
            solution_sketch: 'The triangle rule gives $\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}$. Subtract the coordinates: $(2-5,4-1)$. The answer is $(-3,3)$.'
          - problem: 'In a parallelogram $ABCD$, $\overrightarrow{AB}=(3,1)$ and $\overrightarrow{AD}=(1,4)$. Find the coordinates of $\overrightarrow{AC}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4,5)'
            solution_sketch: 'The parallelogram rule gives $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}$. Add the coordinates: $(3+1,1+4)$. The answer is $(4,5)$.'
          - problem: 'Points $A(1,1)$, $B(4,2)$ and $D(2,5)$ are three vertices of a parallelogram $ABCD$. Find the coordinates of $C$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5,6)'
            solution_sketch: 'The parallelogram rule gives $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}=(3,1)+(1,4)=(4,5)$. Add this vector to $A$: $(1+4,1+5)$. The answer is $(5,6)$.'
          - problem: 'In a pentagon $ABCDE$, $\overrightarrow{AB}=(1,2)$, $\overrightarrow{BC}=(3,-1)$, $\overrightarrow{CD}=(-2,4)$ and $\overrightarrow{DE}=(0,-3)$. Find the coordinates of $\overrightarrow{AE}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2,2)'
            solution_sketch: 'The polygon rule gives $\overrightarrow{AE}=\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CD}+\overrightarrow{DE}$. The first coordinates add to $1+3-2+0=2$. The second coordinates add to $2-1+4-3=2$. The answer is $(2,2)$.'
          - problem: 'In a parallelogram $ABCD$, $\overrightarrow{AC}=(6,2)$ and $\overrightarrow{BD}=(2,-4)$. Find the coordinates of $\overrightarrow{AB}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2,3)'
            solution_sketch: 'Put $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}$ and $\overrightarrow{BD}=\overrightarrow{AD}-\overrightarrow{AB}$. Subtract: $\overrightarrow{AC}-\overrightarrow{BD}=2\overrightarrow{AB}$. So $\overrightarrow{AB}=\frac12(4,6)$. The answer is $(2,3)$.'
        constraints: 'vectors given by coordinates in a triangle, a parallelogram or a polygon; the learner picks the rule and adds or subtracts; answers are coordinate pairs'
      - id: kp2
        name: 'Express a side, a diagonal or a median by two vectors'
        key_prerequisites: [medians-centroids, distance-midpoint-formulas, parallelogram-properties]
        exemplars:
          - problem: 'In a triangle $ABC$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AC}$. The point $M$ is the midpoint of $BC$. Write $\overrightarrow{AM}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1/2,1/2)'
            solution_sketch: 'The point $M$ is the midpoint of $BC$, so $\overrightarrow{AM}=\frac12(\overrightarrow{AB}+\overrightarrow{AC})$. This is $\frac12\vec a+\frac12\vec b$. The answer is $(\frac12,\frac12)$.'
          - problem: 'In a triangle $ABC$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AC}$. Write $\overrightarrow{BC}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1,1)'
            solution_sketch: 'By the triangle rule, $\overrightarrow{BC}=\overrightarrow{BA}+\overrightarrow{AC}=-\vec a+\vec b$. The answer is $(-1,1)$.'
          - problem: 'In a parallelogram $ABCD$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AD}$. The point $M$ is the midpoint of $CD$. Write $\overrightarrow{AM}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1/2,1)'
            solution_sketch: 'Use $\overrightarrow{AM}=\overrightarrow{AD}+\overrightarrow{DM}$. Here $\overrightarrow{DM}=\frac12\overrightarrow{DC}=\frac12\vec a$. So $\overrightarrow{AM}=\frac12\vec a+\vec b$. The answer is $(\frac12,1)$.'
          - problem: 'In a triangle $ABC$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AC}$. The point $N$ is the midpoint of $AC$. Write $\overrightarrow{BN}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1,1/2)'
            solution_sketch: 'Use $\overrightarrow{BN}=\overrightarrow{BA}+\overrightarrow{AN}$. Here $\overrightarrow{BA}=-\vec a$ and $\overrightarrow{AN}=\frac12\vec b$. The answer is $(-1,\frac12)$.'
          - problem: 'In a triangle $ABC$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AC}$. The point $K$ lies on $BC$ with $BK:KC=1:2$. Write $\overrightarrow{AK}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(2/3,1/3)'
            solution_sketch: 'Use $\overrightarrow{AK}=\overrightarrow{AB}+\overrightarrow{BK}$. Here $\overrightarrow{BK}=\frac13\overrightarrow{BC}=\frac13(\vec b-\vec a)$. So $\overrightarrow{AK}=\frac23\vec a+\frac13\vec b$. The answer is $(\frac23,\frac13)$.'
          - problem: 'In a triangle $ABC$, put $\vec a=\overrightarrow{AB}$ and $\vec b=\overrightarrow{AC}$. The point $G$ is the centroid. Write $\overrightarrow{AG}=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1/3,1/3)'
            solution_sketch: 'The centroid divides the median $AM$ in the ratio $2:1$ from $A$. So $\overrightarrow{AG}=\frac23\overrightarrow{AM}$. With $\overrightarrow{AM}=\frac12(\vec a+\vec b)$ this is $\frac13\vec a+\frac13\vec b$. The answer is $(\frac13,\frac13)$.'
        constraints: 'a vector of a triangle or parallelogram is written as p*a+q*b with a and b two side vectors from one vertex; midpoints, ratios and the centroid; answers are pairs of fractions'
      - id: kp3
        name: 'Laws of vector operations'
        key_prerequisites: [translations-coordinate-plane]
        exemplars:
          - problem: 'Write $3(\vec a+2\vec b)-2(\vec a-\vec b)$ as $p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1,8)'
            solution_sketch: 'Expand: $3\vec a+6\vec b-2\vec a+2\vec b$. Join like terms: $\vec a+8\vec b$. The answer is $(1,8)$.'
          - problem: 'Write $2(\vec a-3\vec b)+4(\vec b+\vec a)$ as $p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(6,-2)'
            solution_sketch: 'Expand: $2\vec a-6\vec b+4\vec b+4\vec a$. Join like terms: $6\vec a-2\vec b$. The answer is $(6,-2)$.'
          - problem: 'The vectors are $\vec a=(1,2)$ and $\vec b=(3,-1)$. Find the coordinates of $2(\vec a+\vec b)-3\vec a$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5,-4)'
            solution_sketch: 'Simplify first: $2\vec a+2\vec b-3\vec a=-\vec a+2\vec b$. Then $-(1,2)+2(3,-1)=(-1+6,-2-2)$. The answer is $(5,-4)$.'
          - problem: 'A vector $\vec x$ satisfies $2\vec x-\vec a=\vec x+3\vec b$. Write $\vec x=p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1,3)'
            solution_sketch: 'Move $\vec x$ to the left and $\vec a$ to the right: $2\vec x-\vec x=\vec a+3\vec b$. So $\vec x=\vec a+3\vec b$. The answer is $(1,3)$.'
          - problem: 'Write $\frac12(2\vec a+4\vec b)-(\vec a-\vec b)$ as $p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(0,3)'
            solution_sketch: 'Expand: $\vec a+2\vec b-\vec a+\vec b$. The terms in $\vec a$ cancel. The result is $3\vec b$. The answer is $(0,3)$.'
          - problem: 'Put $\vec x=2\vec a-\vec b$ and $\vec y=\vec a+3\vec b$. Write $3\vec x-2\vec y$ as $p\vec a+q\vec b$. Find $(p,q)$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4,-9)'
            solution_sketch: 'Substitute: $3(2\vec a-\vec b)-2(\vec a+3\vec b)=6\vec a-3\vec b-2\vec a-6\vec b$. Join like terms: $4\vec a-9\vec b$. The answer is $(4,-9)$.'
        constraints: 'the distributive, commutative and associative laws used to simplify an expression in a and b, solve a vector equation, or compute with coordinates; answers are coefficient pairs'
    diagnostic_exemplar:
      problem: 'In a triangle $ABC$, $\overrightarrow{AB}=(1,2)$ and $\overrightarrow{BC}=(3,4)$. Find the coordinates of $\overrightarrow{AC}$.'
      answer_contract: {"kind":"coordinates","arity":2}
      answer: '(4,6)'
      solution_sketch: 'The triangle rule gives $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}$. Add the coordinates. The answer is $(4,6)$.'
    anki_seeds:
      - front: "Triangle rule: $\\overrightarrow{AB}+\\overrightarrow{BC}=$ ... ."
        back: "$\\overrightarrow{AC}$"
        type: basic
      - front: "In a triangle, the median vector $\\overrightarrow{AM}$ to the midpoint $M$ of $BC$ equals ... $(\\overrightarrow{AB}+\\overrightarrow{AC})$."
        back: "1/2"
        type: basic
  - id: vectors-polygon-scalar-product
    lt_term: 'skaliarinė sandauga; vektoriaus kvadratas; kampas tarp vektorių'
    name: Scalar Product of Polygon Vectors
    core: false
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vectors-geometric-rules
        weight: 0.6
        key: true
      - id: law-of-cosines
        weight: 0.4
        key: false
      - id: pythagorean-theorem
        weight: 0.3
        key: false
      - id: distance-midpoint-formulas
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Scalar product of vectors written by two base vectors'
        key_prerequisites: [vectors-geometric-rules, law-of-cosines]
        exemplars:
          - problem: 'The vectors $\vec a$ and $\vec b$ have lengths $4$ and $3$. The angle between them is $60^\circ$. Find $\vec a\cdot\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Use $\vec a\cdot\vec b=|\vec a||\vec b|\cos\alpha$. This is $4\cdot3\cdot\frac12$. The answer is 6.'
          - problem: 'In a parallelogram $ABCD$, $AB=4$, $AD=3$ and $\angle DAB=120^\circ$. Find $\overrightarrow{AB}\cdot\overrightarrow{AD}$.'
            answer_contract: {"kind":"exact"}
            answer: '-6'
            solution_sketch: 'Both vectors start at $A$, so the angle between them is $120^\circ$. Then the product is $4\cdot3\cdot\cos120^\circ=12\cdot\left(-\frac12\right)$. The answer is $-6$.'
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=3$ and $\vec a\cdot\vec b=2$. Find $(2\vec a+\vec b)\cdot\vec a$.'
            answer_contract: {"kind":"exact"}
            answer: '20'
            solution_sketch: 'Expand: $2\vec a\cdot\vec a+\vec b\cdot\vec a$. Here $\vec a\cdot\vec a=9$. So the value is $18+2$. The answer is 20.'
          - problem: 'In a parallelogram $ABCD$, $AB=2$, $AD=3$ and $\angle DAB=60^\circ$. Find $\overrightarrow{AC}\cdot\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'Write $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}$. Then $\overrightarrow{AC}\cdot\overrightarrow{AB}=AB^2+\overrightarrow{AD}\cdot\overrightarrow{AB}=4+2\cdot3\cdot\frac12$. The answer is 7.'
          - problem: 'In an equilateral triangle $ABC$ with side 6, find $\overrightarrow{AB}\cdot\overrightarrow{BC}$.'
            answer_contract: {"kind":"exact"}
            answer: '-18'
            solution_sketch: 'Use $\overrightarrow{AB}\cdot\overrightarrow{BC}=-\overrightarrow{BA}\cdot\overrightarrow{BC}$. The angle at $B$ is $60^\circ$, so $\overrightarrow{BA}\cdot\overrightarrow{BC}=36\cdot\frac12=18$. The answer is $-18$.'
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=2$, $|\vec b|=1$ and an angle of $60^\circ$ between them. Find $(3\vec a-\vec b)\cdot(\vec a+2\vec b)$.'
            answer_contract: {"kind":"exact"}
            answer: '15'
            solution_sketch: 'Here $\vec a\cdot\vec b=2\cdot1\cdot\frac12=1$. Expand: $3\vec a\cdot\vec a+6\vec a\cdot\vec b-\vec b\cdot\vec a-2\vec b\cdot\vec b=12+6-1-2$. The answer is 15.'
        constraints: 'scalar product from two lengths and an angle, and from an expansion in two base vectors; the angle between two vectors is measured when both start at one point; answers are numbers'
      - id: kp2
        name: 'Square of a vector and the length of a diagonal or a median'
        key_prerequisites: [vectors-geometric-rules, pythagorean-theorem, distance-midpoint-formulas]
        exemplars:
          - problem: 'The vector $\overrightarrow{AB}$ has length 7. Find $\overrightarrow{AB}\cdot\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '49'
            solution_sketch: 'The scalar square of a vector equals the square of its length. So the value is $7^2$. The answer is 49.'
          - problem: 'The vectors $\vec a$ and $\vec b$ are perpendicular, $|\vec a|=3$ and $|\vec b|=4$. Find $|\vec a+\vec b|$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'Use $|\vec a+\vec b|^2=|\vec a|^2+2\vec a\cdot\vec b+|\vec b|^2$. Perpendicular vectors have $\vec a\cdot\vec b=0$. So the square is $9+16=25$. The answer is 5.'
          - problem: 'In a parallelogram $ABCD$, $AB=2$, $AD=3$ and $\angle DAB=60^\circ$. Find $AC$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(19)'
            solution_sketch: 'Write $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}$. Then $AC^2=4+9+2\cdot2\cdot3\cdot\frac12=19$. The answer is $\sqrt{19}$.'
          - problem: 'In a parallelogram $ABCD$, $AB=5$, $AD=3$ and $\angle DAB=120^\circ$. Find $BD$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'Write $\overrightarrow{BD}=\overrightarrow{AD}-\overrightarrow{AB}$. Then $BD^2=9+25-2\cdot3\cdot5\cdot\left(-\frac12\right)=49$. The answer is 7.'
          - problem: 'In a triangle $ABC$, $AB=6$, $AC=8$ and $\angle BAC=60^\circ$. The point $M$ is the midpoint of $BC$. Find $AM$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(37)'
            solution_sketch: 'Write $\overrightarrow{AM}=\frac12(\overrightarrow{AB}+\overrightarrow{AC})$. Then $|\overrightarrow{AB}+\overrightarrow{AC}|^2=36+64+2\cdot6\cdot8\cdot\frac12=148$. So $AM^2=\frac{148}{4}=37$. The answer is $\sqrt{37}$.'
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=2$, $|\vec b|=3$ and $|\vec a+\vec b|=4$. Find $\vec a\cdot\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '3/2'
            solution_sketch: 'Square both sides: $|\vec a+\vec b|^2=4+2\vec a\cdot\vec b+9=16$. Then $2\vec a\cdot\vec b=3$. The answer is $\frac32$.'
        constraints: 'scalar square, length of a diagonal or a median from side lengths and an angle, and the reverse step to the scalar product; answers are whole numbers, fractions or square roots'
      - id: kp3
        name: 'Angle between vectors from the side lengths'
        key_prerequisites: [law-of-cosines, vectors-geometric-rules]
        exemplars:
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=4$, $|\vec b|=3$ and $\vec a\cdot\vec b=6$. Find the angle between them in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'Use $\cos\alpha=\frac{\vec a\cdot\vec b}{|\vec a||\vec b|}=\frac{6}{12}=\frac12$. The angle is $60^\circ$.'
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=\sqrt3$, $|\vec b|=2$ and $\vec a\cdot\vec b=-3$. Find the angle between them in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '150'
            solution_sketch: 'Use $\cos\alpha=\frac{-3}{2\sqrt3}=-\frac{\sqrt3}{2}$. The angle is $150^\circ$.'
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a|=3$, $|\vec b|=5$ and $|\vec a-\vec b|=7$. Find the angle between them in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '120'
            solution_sketch: 'Square: $|\vec a-\vec b|^2=9-2\vec a\cdot\vec b+25=49$. So $\vec a\cdot\vec b=-\frac{15}{2}$. Then $\cos\alpha=-\frac{15/2}{15}=-\frac12$. The angle is $120^\circ$.'
          - problem: 'In a triangle $ABC$, $AB=4$, $AC=3\sqrt2$ and $BC=\sqrt{10}$. Find the angle between $\overrightarrow{AB}$ and $\overrightarrow{AC}$ in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '45'
            solution_sketch: 'Use the law of cosines: $10=16+18-2\cdot4\cdot3\sqrt2\cos A$. So $\cos A=\frac{24}{24\sqrt2}=\frac{\sqrt2}{2}$. The angle is $45^\circ$.'
          - problem: 'A triangle $ABC$ has a right angle at $C$ and $AC=BC$. Find the angle between $\overrightarrow{AB}$ and $\overrightarrow{BC}$ in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '135'
            solution_sketch: 'The angle at $B$ is $45^\circ$. The vector $\overrightarrow{AB}$ points into $B$, and $\overrightarrow{BC}$ points away from $B$. So the angle between the two vectors is $180^\circ-45^\circ=135^\circ$.'
          - problem: 'A triangle $ABC$ has $AB=3$, $BC=5$ and $AC=7$. Find the angle between $\overrightarrow{AB}$ and $\overrightarrow{BC}$ in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'The law of cosines gives $49=9+25-30\cos B$, so $\cos B=-\frac12$ and $\angle B=120^\circ$. The angle between $\overrightarrow{AB}$ and $\overrightarrow{BC}$ is $180^\circ-120^\circ=60^\circ$.'
        constraints: 'angle between two vectors from a dot product or from side lengths; the angle between AB and BC in a triangle is 180 degrees minus the angle at B; answers are angles in degrees'
    diagnostic_exemplar:
      problem: 'The vectors $\vec a$ and $\vec b$ have lengths 2 and 5. The angle between them is $60^\circ$. Find $\vec a\cdot\vec b$.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'Use $\vec a\cdot\vec b=|\vec a||\vec b|\cos60^\circ=2\cdot5\cdot\frac12$. The answer is 5.'
    anki_seeds:
      - front: "$\\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cdot$ ... of the angle between them."
        back: "cosine"
        type: basic
      - front: "$\\vec a\\cdot\\vec a=$ ... of $\\vec a$."
        back: "the square of the length"
        type: basic
