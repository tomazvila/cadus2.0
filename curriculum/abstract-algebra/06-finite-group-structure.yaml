unit: finite-group-structure
course: abstract-algebra
module: "Finite Group Structure"
topics:
  - id: class-equation
    name: "The Class Equation"
    core: true                 # Cauchy's and Sylow's theorems build directly on it — the cash-in of the group-actions machinery
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: orbit-stabilizer-theorem
        weight: 0.9
        key: true
      - id: subgroups-subgroup-tests
        weight: 0.4
        key: false
      - id: lagranges-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Conjugacy class sizes via centralizers"
        key_prerequisites: [orbit-stabilizer-theorem, subgroups-subgroup-tests]
        step_check:
          step: 'Use the formula $|\text{class}| = [G : C(x)]$ to find the size of the conjugacy class'
          question: 'Why does dividing $|G|$ by $|C(x)|$ give the number of conjugates of $x$?'
          options:
            - 'Each conjugate of $x$ has its own copy of $C(x)$, and these copies fill all of $G$'
            - 'The centralizer $C(x)$ is the set of conjugates of $x$, so we divide to count them'
            - 'Conjugating by $g$ or $h$ gives one result when they share a coset of $C(x)$'
            - 'Dividing by $|C(x)|$ removes the identity and leaves only the nontrivial conjugates'
          answer: 'Conjugating by $g$ or $h$ gives one result when they share a coset of $C(x)$'
          why: 'The conjugates of $x$ correspond to the cosets of $C(x)$, so their number is the index $[G : C(x)] = |G|/|C(x)|$.'
        try_first:
          problem: 'A group of order $12$ has an element with exactly $4$ conjugates. How many elements of the group commute with it?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'The number of conjugates is the index of the centralizer, so $4 = 12/|C(x)|$ and $|C(x)| = 3$. A conjugacy class is an orbit, and the centralizer is the stabilizer of the element.'
        exemplars:
          - problem: 'In $S_4$, how many conjugates does the 3-cycle $(1\,2\,3)$ have?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation in $S_4$ keeps the cycle type, so the conjugates of $(1\,2\,3)$ are all 3-cycles. There are $\frac{4 \cdot 3 \cdot 2}{3} = 8$ of them. Equivalently the centralizer has order $3$ and $24/3 = 8$.'
          - problem: 'In $S_4$, the 3-cycle $(1\,2\,3)$ has $8$ conjugates. What is the order of its centralizer?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of conjugates is the index of the centralizer, so $8 = 24/|C|$. This gives $|C| = 24/8 = 3$. The centralizer is the subgroup generated by $(1\,2\,3)$.'
          - problem: 'In the dihedral group $D_4$ of order $8$, how many elements commute with a rotation through $90$ degrees?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every power of the rotation $r$ commutes with $r$, and these are $4$ elements. A reflection does not commute with $r$, so the centralizer has exactly $4$ elements. This agrees with $8/4 = 2$ conjugates of $r$, namely $r$ and $r^{-1}$.'
          - problem: 'In the dihedral group $D_5$ of order $10$, how many conjugates does a reflection have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The centralizer of a reflection $s$ in $D_5$ is $\{e, s\}$, of order $2$. The number of conjugates is $10/2 = 5$. So all $5$ reflections are conjugate to $s$.'
          - problem: 'In $S_4$, the 4-cycle $(1\,2\,3\,4)$ has a centralizer of order $4$. How many conjugates does it have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of conjugates is the index of the centralizer, so it equals $|S_4|/4 = 24/4$. This is $6$, the number of 4-cycles in $S_4$. The count $6$ divides $24$, as it must.'
          - problem: 'An element $x$ of a group of order $60$ has a centralizer of order $12$. How many conjugates does $x$ have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of conjugates is the index of the centralizer. Here it is $60/12 = 5$. We divide because the conjugates correspond to the cosets of $C(x)$.'
          - problem: 'An element $x$ of a group $G$ has $7$ conjugates, and its centralizer has order $6$. What is $|G|$?'
            answer: '42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of conjugates equals $|G|/|C(x)|$, so $|G| = 7 \cdot 6$. This multiplication gives $42$. The group has $42$ elements.'
          - problem: 'An element of a group of order $48$ has exactly $6$ conjugates. What is the order of its centralizer?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of conjugates is $|G|/|C(x)|$, so $6 = 48/|C(x)|$. Then $|C(x)| = 48/6 = 8$. This division is needed because the centralizer is the unknown denominator.'
          - problem: 'Sam says that $(1\,2)(3\,4)$ has $12$ conjugates in $S_4$, because its centralizer has order $2$. How many conjugates does $(1\,2)(3\,4)$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation keeps the cycle type, so the conjugates of $(1\,2)(3\,4)$ are the double transpositions $(1\,2)(3\,4)$, $(1\,3)(2\,4)$ and $(1\,4)(2\,3)$. There are $3$ of them. Equivalently the centralizer has order $24/3 = 8$, not $2$.'
          - problem: 'Can a group of order $20$ have a conjugacy class with exactly $8$ elements?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can","possible"],["no","it cannot","not possible","impossible"]]}
            solution_sketch: 'The size of a conjugacy class is the index of a centralizer, so it must divide the group order. The number $8$ does not divide $20$, because $20/8 = 2.5$. So no class has $8$ elements.'
        constraints: "class sizes and centralizer orders in S_3, S_4, D_4, D_5 via |class| = [G : C(x)]; emphasize class sizes divide |G|"
      - id: kp2
        name: "Writing and verifying the class equation"
        key_prerequisites: [orbit-stabilizer-theorem, lagranges-theorem]
        step_check:
          step: '$\{e\}$ and $\{-e\}$ are singletons, so their sizes are 1'
          question: 'Why does a class of size $1$ count toward $|Z(Q_8)|$ and not toward the sum over the nontrivial classes?'
          options:
            - 'A class of size $1$ means the element commutes with everything, so it is central'
            - 'A class of size $1$ is too small to be a conjugacy class, so it is left out of the sum'
            - 'The sum runs over the classes with an even number of elements, and $1$ is odd'
            - 'The identity is the only element of its class, and the sum skips the identity only'
          answer: 'A class of size $1$ means the element commutes with everything, so it is central'
          why: 'A singleton class $\{x\}$ means $gxg^{-1} = x$ for all $g$, so $x$ lies in the center. Only the larger classes go into the sum.'
        exemplars:
          - problem: 'The conjugacy classes of a group $G$ of order $8$ have sizes $1, 1, 2, 2, 2$. How many elements does the center of $G$ have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center consists of the elements whose class has size $1$. Two classes have size $1$, so $|Z(G)| = 2$. This agrees with the class equation $8 = 2 + 2 + 2 + 2$.'
          - problem: 'The nontrivial conjugacy classes of $S_4$ have sizes $3, 6, 6$ and $8$. Use the class equation to find $|Z(S_4)|$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class equation says $24 = |Z(S_4)| + 3 + 6 + 6 + 8$. The nontrivial sizes add to $23$. So $|Z(S_4)| = 24 - 23 = 1$.'
          - problem: 'The center of $A_5$ is trivial, and its nontrivial conjugacy classes have sizes $12, 12, 15$ and $20$. Find $|A_5|$.'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class equation says $|A_5| = |Z(A_5)| + 12 + 12 + 15 + 20$. The center has $1$ element and the sizes add to $59$. So $|A_5| = 1 + 59 = 60$.'
          - problem: 'The dihedral group $D_6$ of order $12$ has conjugacy classes of sizes $1, 1, 2, 2, 3$ and $x$. Use the class equation to find $x$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class equation gives $12 = 1 + 1 + 2 + 2 + 3 + x$. The known sizes add to $9$. So $x = 12 - 9 = 3$.'
          - problem: 'The dihedral group $D_8$ of order $16$ has conjugacy classes of sizes $1, 1, 2, 2, 2, 4$ and $x$. Find $x$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class equation gives $16 = 1 + 1 + 2 + 2 + 2 + 4 + x$. The known sizes add to $12$. So $x = 16 - 12 = 4$.'
          - problem: 'The group $D_7$ of order $14$ has trivial center. Its non-identity rotations fall into classes of size $2$, and its $7$ reflections form one class. How many conjugacy classes does $D_7$ have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $6$ non-identity rotations fall into $6/2 = 3$ classes of size $2$. Together with the identity class and the class of reflections this gives $1 + 3 + 1 = 5$ classes. The class equation checks: $14 = 1 + 2 + 2 + 2 + 7$.'
          - problem: 'Sam computes $|Z(A_4)|$ from the nontrivial classes of sizes $3, 4, 4$ by adding them, and gets $11$. What is the correct value of $|Z(A_4)|$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sum $3 + 4 + 4 = 11$ is the number of non-central elements. The class equation gives $12 = |Z(A_4)| + 11$, so $|Z(A_4)| = 1$. Sam reported the wrong side of the equation.'
          - problem: 'Could the numbers $1, 1, 2, 3, 3$ be the conjugacy class sizes of a group of order $10$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","they could","possible"],["no","they could not","not possible","impossible"]]}
            solution_sketch: 'The sizes add to $10$, but each class size must divide the group order. The number $3$ does not divide $10$. So these cannot be the class sizes of a group of order $10$.'
        constraints: "verify |G| = |Z(G)| + sum of nontrivial class sizes for groups of order <= 24; one problem per set solves for a missing class size"
      - id: kp3
        name: "p-groups have nontrivial center"
        key_prerequisites: [orbit-stabilizer-theorem, lagranges-theorem]
        step_check:
          step: 'so each $[G : C(x_i)]$ is a positive power of $p$'
          question: 'Why is each nontrivial class size a positive power of $p$?'
          options:
            - 'The class sizes add up to $p^3$, so every single class size must equal $p^3$ itself'
            - 'The class size is at least $p$ because every nontrivial class contains a full copy of $\langle x \rangle$'
            - 'The class size equals $|G|/|Z(G)|$, and this quotient is always a power of $p$'
            - 'It divides $p^3$ so it is a power of $p$, and it is not $1$ because the class is nontrivial'
          answer: 'It divides $p^3$ so it is a power of $p$, and it is not $1$ because the class is nontrivial'
          why: 'The divisors of $p^3$ are $1, p, p^2, p^3$. A nontrivial class has more than one element, so its size is one of $p, p^2, p^3$.'
        try_first:
          problem: 'Every conjugacy class of a group of order $343$ has size $1$ or a multiple of $7$. What is the least number of elements the center can have?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'Reducing $343 = |Z(G)| + (\text{multiples of } 7)$ modulo $7$ shows that $7$ divides $|Z(G)|$, so the center has at least $7$ elements. The center of the Heisenberg group over $\mathbb{Z}_7$ has exactly $7$.'
        exemplars:
          - problem: 'Let $G$ be a group of order $81$. What is the smallest number of elements the center of $G$ can have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class equation modulo $3$ shows that $3$ divides $|Z(G)|$, because every nontrivial class size is a multiple of $3$ and $3$ divides $81$. So $|Z(G)|$ is at least $3$. A group of order $81$ with center of order $3$ exists, for example $\mathbb{Z}_3 \wr \mathbb{Z}_3$, so the smallest value is $3$.'
          - problem: 'Let $G$ be a group of order $25$. What is the only possible order of $Z(G)$?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center is nontrivial and its order divides $25$, so it is $5$ or $25$. If it were $5$, then $G/Z(G)$ would have order $5$, hence be cyclic, and that forces $G$ to be abelian. Then $Z(G) = G$, a contradiction. So $|Z(G)| = 25$.'
          - problem: 'A group $G$ of order $27$ has a center of order $3$, and every other conjugacy class of $G$ has $3$ elements. How many conjugacy classes does $G$ have?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center gives $3$ classes of size $1$. The other $27 - 3 = 24$ elements form classes of size $3$, so there are $24/3 = 8$ of them. In total $G$ has $3 + 8 = 11$ classes.'
          - problem: 'A group $G$ of order $32$ has a center of order $2$, and every other conjugacy class of $G$ has $2$ elements. How many conjugacy classes does $G$ have?'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center gives $2$ classes of size $1$. The other $32 - 2 = 30$ elements form classes of size $2$, so there are $30/2 = 15$ of them. In total $G$ has $2 + 15 = 17$ classes. Such a group exists: the extraspecial group of order $32$.'
          - problem: 'What is the least possible number of conjugacy classes of size $1$ in a group of order $125$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The classes of size $1$ are the elements of the center. Every other class size is a multiple of $5$, so $5$ divides $|Z(G)|$ and $|Z(G)| \ge 5$. The least number of classes of size $1$ is $5$.'
          - problem: 'A group $G$ of order $81$ has a center of order $9$, and every other conjugacy class of $G$ has $3$ elements. How many conjugacy classes of size $3$ does $G$ have?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center holds $9$ elements, so the other classes cover $81 - 9 = 72$ elements. Each of these classes has $3$ elements, so there are $72/3 = 24$ of them. We divide because the number of classes is the unknown.'
          - problem: 'Can a group of order $49$ have a trivial center?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can","possible"],["no","it cannot","not possible","impossible"]]}
            solution_sketch: 'Every nontrivial class size divides $49$ and is greater than $1$, so it is a multiple of $7$. The class equation then gives $49 \equiv |Z(G)| \pmod 7$, so $7$ divides $|Z(G)|$. The center has at least $7$ elements and is not trivial.'
          - problem: 'Sam writes the class equation of a group of order $8$ as $8 = 1 + 2 + 2 + 3$. Which of the class sizes in this equation is impossible?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A class size is the index of a centralizer, so it divides the group order $8$. The sizes $1$ and $2$ divide $8$, but $3$ does not. So $3$ is the impossible size.'
        constraints: "p in {2, 3, 5, 7}; the G/Z(G)-cyclic lemma is proved once, then may be cited"
    diagnostic_exemplar:
      problem: 'A group $G$ of order $8$ has conjugacy class sizes $1, 1, 2, 2, 2$. Find $|Z(G)|$, and explain why no group of order $8$ can have a trivial center.'
      answer: '$|Z(G)| = 2$ (two singleton classes). A group of order $8 = 2^3$ is a $2$-group, and the class equation forces $2 \mid |Z(G)|$, so $|Z(G)| \ge 2$.'
      answer_contract: {kind: none}
      solution_sketch: 'Central elements are exactly the singleton classes; the $p$-group center argument rules out $|Z| = 1$.'
    anki_seeds:
      - front: "The class equation?"
        back: "$|G| = |Z(G)| + \\sum_i [G : C(x_i)]$, summing over representatives of the nontrivial conjugacy classes."
        type: basic
      - front: "Size of the conjugacy class of $x$?"
        back: "$[G : C(x)]$ — the index of the centralizer (orbit-stabilizer for the conjugation action)."
        type: basic
      - front: "Center of a finite $p$-group?"
        back: "Nontrivial: $p$ divides $|Z(G)|$ (class equation mod $p$)."
        type: basic

  - id: cauchys-theorem
    name: "Cauchy's Theorem"
    core: true                 # Sylow's theorem and order-pq structure arguments build on it; canonical machinery
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: class-equation
        weight: 0.8
        key: true
      - id: order-of-an-element
        weight: 0.5
        key: true
      - id: lagranges-theorem
        weight: 0.5
        key: false
      - id: group-actions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Statement and scope"
        key_prerequisites: [order-of-an-element, lagranges-theorem]
        step_check:
          step: 'Cauchy''s theorem applies to each prime divisor of $|G|$'
          question: 'Why does the list of guaranteed element orders contain primes only?'
          options:
            - 'Composite numbers never occur as element orders in a finite group'
            - 'The theorem gives an element of order $p$ only when a prime $p$ divides $|G|$'
            - 'Elements of composite order exist but cannot be found without more information'
            - 'Only primes divide $|G|$, because $|G|$ has no composite divisors'
          answer: 'The theorem gives an element of order $p$ only when a prime $p$ divides $|G|$'
          why: 'Lagrange says orders divide $|G|$. Cauchy adds that for each prime $p$ dividing $|G|$ an element of order exactly $p$ exists, and it says nothing about composite orders.'
        exemplars:
          - problem: 'A group has order $42$. For which element orders does Cauchy''s theorem guarantee an element of that order?'
            answer: '2, 3, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $42 = 2 \cdot 3 \cdot 7$. Cauchy''s theorem gives an element of order $p$ for each prime $p$ dividing $42$. So the guaranteed orders are $2, 3, 7$.'
          - problem: 'A group $G$ has order $60$. For which prime orders does Cauchy''s theorem guarantee an element?'
            answer: '2, 3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $60 = 2^2 \cdot 3 \cdot 5$. The primes dividing $60$ are $2, 3, 5$. Cauchy''s theorem gives an element of each of these orders.'
          - problem: 'A group $G$ has order $84$. What is the largest element order that Cauchy''s theorem guarantees?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $84 = 2^2 \cdot 3 \cdot 7$. Cauchy''s theorem guarantees elements of orders $2, 3, 7$. The largest of these is $7$.'
          - problem: 'The Klein four-group has order $4$ and no element of order $4$. Which element order does Cauchy''s theorem guarantee in every group of order $4$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $4 = 2^2$, the only prime dividing $4$ is $2$. Cauchy''s theorem gives an element of order $2$ and does not give one of order $4$. The Klein four-group shows that order $4$ need not occur.'
          - problem: 'Sam says that Cauchy''s theorem gives an element of order $6$ in every group of order $6$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","he is right","right","correct"],["no","he is wrong","wrong","incorrect","not right"]]}
            solution_sketch: 'Cauchy''s theorem gives elements of prime orders $2$ and $3$ only. In $S_3$, which has order $6$, no element has order $6$, because the largest element order is $3$. So Sam is wrong.'
          - problem: 'The group $S_3$ has order $6$, and Cauchy''s theorem gives elements of orders $2$ and $3$ in it. What is the largest order of an element of $S_3$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The elements of $S_3$ are the identity, three transpositions of order $2$, and two 3-cycles of order $3$. So the largest element order is $3$. No element has order $6$, although $6$ is the order of the group.'
          - problem: 'A tiling pattern has exactly $28$ symmetries, and they form a group. For which prime numbers $k$ must some symmetry return the pattern to its start after exactly $k$ repeats and not before?'
            answer: '2, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $28 = 2^2 \cdot 7$, so the primes dividing $28$ are $2$ and $7$. Cauchy''s theorem gives a symmetry of order $p$ for each of them. So $k = 2$ and $k = 7$.'
          - problem: 'The shuffles used by a magician form a group of order $35$. Must there be a shuffle that returns the deck to its original order after exactly $5$ repeats and not before?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it must","there must be one"],["no","it need not","not necessarily"]]}
            solution_sketch: 'Since $5$ divides $35$, Cauchy''s theorem gives an element of order $5$ in the group. That shuffle returns the deck to its start after exactly $5$ repeats. So the answer is yes.'
        constraints: "statement and guaranteed-order questions, |G| <= 100; contrast with the failure of the full Lagrange converse (Klein group and order 4)"
      - id: kp2
        name: "First applications"
        key_prerequisites: [class-equation, order-of-an-element]
        step_check:
          step: 'Since $|g| = p$, the subgroup $\langle g \rangle$ has exactly $p$ distinct elements'
          question: 'Why does $\langle g \rangle$ have exactly $p$ elements?'
          options:
            - 'It contains $g$ and the identity, and Lagrange says a subgroup of a group of order $p$ has $p$ elements'
            - 'Each of the $p$ prime factors of $|G|$ adds one element to the subgroup'
            - 'The powers $g, g^2, \dots$ never repeat, so the subgroup is infinite unless it is cut off by $|G|$'
            - 'The powers $g, g^2, \dots, g^p = e$ are distinct, and after $g^p$ the list repeats'
          answer: 'The powers $g, g^2, \dots, g^p = e$ are distinct, and after $g^p$ the list repeats'
          why: 'The order of $g$ is the least $k$ with $g^k = e$. The powers $g^1, \dots, g^p$ are distinct, and $g^{p+1} = g$ starts the list over.'
        exemplars:
          - problem: 'A group $G$ has order $60$, and by Cauchy''s theorem it has a subgroup $H$ of order $5$. What is the index $[G : H]$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange''s theorem the index is the quotient of the group order by the subgroup order. So $[G : H] = 60/5 = 12$.'
          - problem: 'An abelian group $G$ has order $15$. By Cauchy''s theorem it has an element $a$ of order $3$ and an element $b$ of order $5$. What is the order of $ab$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In an abelian group, elements of coprime orders have a product whose order is the least common multiple of the orders. The least common multiple of $3$ and $5$ is $15$. So $ab$ has order $15$.'
          - problem: 'A group $G$ has order $42$ and contains an element $g$ of order $7$, by Cauchy''s theorem. What is the index of the cyclic subgroup generated by $g$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cyclic subgroup generated by $g$ has exactly $7$ elements. By Lagrange''s theorem its index is $42/7 = 6$.'
          - problem: 'An abelian group $G$ has order $55$, with an element $a$ of order $5$ and an element $b$ of order $11$ from Cauchy''s theorem. What is the order of $a^3 b$?'
            answer: '55'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The element $a^3$ has order $5$, because $3$ is coprime to $5$. The orders $5$ and $11$ are coprime and $G$ is abelian, so the order of $a^3 b$ is $5 \cdot 11 = 55$.'
          - problem: 'A group $G$ has order $50$ and an element $g$ of order $5$, given by Cauchy''s theorem. How many non-identity elements does $\langle g \rangle$ contain?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup $\langle g \rangle$ has $5$ elements, one of which is the identity. So it contains $5 - 1 = 4$ non-identity elements.'
          - problem: 'An abelian group $G$ has order $30$, with elements $a, b, c$ of orders $2, 3, 5$ from Cauchy''s theorem. What is the order of $abc$?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The orders $2, 3, 5$ are pairwise coprime and $G$ is abelian. So the order of $abc$ is the product $2 \cdot 3 \cdot 5 = 30$.'
          - problem: 'A group of $70$ symmetries has a subgroup of $7$ symmetries, given by Cauchy''s theorem. Into how many cosets does this subgroup split the group?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of cosets is the index, which is $70/7 = 10$. We divide because each coset has $7$ elements and the cosets fill the group.'
          - problem: 'A group $G$ has a subgroup $H$ of prime order $7$, and $H$ has $9$ left cosets in $G$. What is $|G|$?'
            answer: '63'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each coset has $7$ elements and there are $9$ cosets. So $|G| = 7 \cdot 9 = 63$, by multiplication.'
          - problem: 'Sam says that in an abelian group of order $12$ the product of an element of order $2$ and an element of order $3$ has order $2 + 3 = 5$. What is the correct order of the product?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Elements of coprime orders $2$ and $3$ in an abelian group give a product of order $2 \cdot 3 = 6$. The order of a product is the least common multiple, not the sum. Also $5$ does not divide $12$, so $5$ cannot be an element order.'
        constraints: "subgroup-existence deductions and coprime-order arguments; |G| <= 60 with 2-3 prime factors"
      - id: kp3
        name: "The counting proof (McKay's argument)"
        key_prerequisites: [class-equation, group-actions]
        step_check:
          step: 'The product condition $y_1 y_2 \cdots y_p = e$ uniquely determines $y_p$'
          question: 'Why is there only one choice of $y_p$ once $y_1, \dots, y_{p-1}$ are chosen?'
          options:
            - 'The last entry of a tuple must equal the first entry, so it is chosen already'
            - 'Every group has one special element that makes any product equal the identity'
            - 'The condition gives $y_p = (y_1 \cdots y_{p-1})^{-1}$, and an inverse is unique'
            - 'The entry $y_p$ must be the identity, because all the other entries come before it'
          answer: 'The condition gives $y_p = (y_1 \cdots y_{p-1})^{-1}$, and an inverse is unique'
          why: 'From $y_1 \cdots y_{p-1} y_p = e$ we get $y_p = (y_1 \cdots y_{p-1})^{-1}$. An element has exactly one inverse, so $y_p$ is forced.'
        try_first:
          problem: 'How many triples $(a, b, c)$ with $a, b, c \in \mathbb{Z}_{10}$ satisfy $a + b + c = 0$ in $\mathbb{Z}_{10}$?'
          answer_contract: {"kind":"exact"}
          answer: '100'
          reveal: 'The entries $a$ and $b$ are free, so there are $10 \cdot 10 = 100$ choices, and then $c = -(a + b)$ is forced. This is the idea behind McKay''s count of $|G|^{p-1}$ tuples.'
        exemplars:
          - problem: 'Let $G$ be a group of order $21$, and let $X$ be the set of triples $(x_1, x_2, x_3)$ of elements of $G$ with $x_1 x_2 x_3 = e$. How many triples does $X$ contain?'
            answer: '441'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entries $x_1$ and $x_2$ are free, so there are $21 \cdot 21 = 441$ choices. Then $x_3 = (x_1 x_2)^{-1}$ is forced. So $|X| = 441$.'
          - problem: 'In McKay''s proof for $G = \mathbb{Z}_7$ and $p = 7$, the cyclic group of order $7$ rotates the entries of $7$-tuples with sum $0$. A tuple is fixed by the rotation exactly when all its entries are equal. How many fixed tuples are there?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fixed tuple is $(x, x, \dots, x)$ with $7x = 0$ in $\mathbb{Z}_7$. This holds for every $x$, so there are $7$ fixed tuples. These are the solutions of $x^7 = e$ in the multiplicative notation.'
          - problem: 'In McKay''s proof with $p = 11$, the cyclic group of order $11$ rotates the entries of each tuple. A tuple whose entries are not all equal is moved by a nonzero rotation. What is the size of its orbit?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The orbit size divides the order $11$ of the rotation group, so it is $1$ or $11$. Since $11$ is prime and the tuple is moved, the orbit is not a single point. So the orbit has $11$ elements.'
          - problem: 'Let $p = 3$ and let $G$ be a finite group. McKay''s set $X$ of triples $(x_1, x_2, x_3)$ with $x_1 x_2 x_3 = e$ has $36$ elements. What is the order of $G$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'McKay''s count gives $|X| = |G|^2$, so $|G|^2 = 36$. A group order is positive, so $|G| = 6$.'
          - problem: 'Let $G = \mathbb{Z}_6$ and $p = 3$. McKay''s set $X$ consists of the triples from $\mathbb{Z}_6$ with sum $0$, and rotation of the entries fixes exactly the triples $(x, x, x)$ with $3x = 0$. How many triples of $X$ are not fixed?'
            answer: '33'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $|X| = 6^2 = 36$. The fixed triples $(x, x, x)$ need $3x = 0$ in $\mathbb{Z}_6$, so $x \in \{0, 2, 4\}$, which gives $3$ fixed triples. The number of triples that are not fixed is $36 - 3 = 33$.'
          - problem: 'Let $G$ be a finite group whose order is divisible by $5$. McKay''s argument shows that the number of solutions of $x^5 = e$ in $G$ is divisible by $5$. What is the least number of solutions that $G$ can have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The identity is a solution, so there is at least one solution. The count is a multiple of $5$, so it is at least $5$. The cyclic group of order $5$ has exactly $5$ solutions, so the least number is $5$.'
          - problem: 'Let $G = \mathbb{Z}_{10}$ and $p = 5$. The cyclic group of order $5$ rotates the $5$-tuples from $\mathbb{Z}_{10}$ with sum $0$. How many orbits of size $5$ does this action have?'
            answer: '1999'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $|X| = 10^4 = 10000$. The fixed tuples are $(x, x, x, x, x)$ with $5x = 0$ in $\mathbb{Z}_{10}$, which gives $5$ of them. The other $9995$ tuples fall into orbits of size $5$, so there are $9995/5 = 1999$ such orbits.'
        constraints: "the tuple-counting argument in guided steps; rotation-invariance of the product-e condition may be quoted"
    diagnostic_exemplar:
      problem: 'Let $G$ be an abelian group with $|G| = 21$. Use Cauchy''s theorem to prove that $G$ is cyclic.'
      answer: 'Since $21 = 3 \cdot 7$, Cauchy gives $a$ with $|a| = 3$ and $b$ with $|b| = 7$. As $G$ is abelian, $(ab)^{n} = a^{n}b^{n}$, so $(ab)^{21} = e$ and $|ab|$ divides $21$. If $|ab| = 3$ then $e = (ab)^3 = a^3b^3 = b^3$, forcing $7 \mid 3$ — impossible; if $|ab| = 7$ then $e = a^7b^7 = a^7 = a$, contradicting $|a| = 3$; and $|ab| = 1$ would give $a = b^{-1}$, whose order is both $3$ and $7$. Hence $|ab| = 21$ and $G = \langle ab \rangle$ is cyclic.'
      answer_contract: {kind: none}
      solution_sketch: 'Cauchy supplies elements of order $3$ and $7$; in an abelian group elements of coprime orders multiply to an element of order the product, which here exhausts $G$.'
    anki_seeds:
      - front: "Cauchy's theorem?"
        back: "If a prime $p$ divides $|G|$, then $G$ has an element (hence a subgroup) of order $p$."
        type: basic
      - front: "Size of McKay's tuple set $X = \\{(x_1, \\dots, x_p) : x_1 \\cdots x_p = e\\}$?"
        back: "$|G|^{p-1}$ — the first $p-1$ entries are free, the last is forced."
        type: basic
      - front: "Cauchy vs Lagrange in one line?"
        back: "Lagrange: element orders divide $|G|$. Cauchy: every prime divisor of $|G|$ occurs as an element order."
        type: basic

  - id: simple-groups
    name: "Simple Groups"
    core: false                # supplier only to the supplemental Sylow run: its sole consumer (sylow-theorems) is supplemental and nothing core builds on the notion
    difficulty: 0.74
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: normal-subgroups
        weight: 0.9
        key: true
      - id: lagranges-theorem
        weight: 0.6
        key: true
      - id: consequences-of-lagrange
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Definition and first examples"
        key_prerequisites: [normal-subgroups, lagranges-theorem]
        step_check:
          step: 'Since $\mathbb{Z}_4$ is abelian, every subgroup is normal'
          question: 'Why does being abelian make the subgroup $\{0, 2\}$ normal in $\mathbb{Z}_4$?'
          options:
            - 'A subgroup of order $2$ is always normal, whether or not the group is abelian'
            - 'Abelian groups have no proper subgroups, so $\{0, 2\}$ is normal by default'
            - 'The subgroup $\{0, 2\}$ contains the identity, and every such subgroup is normal'
            - 'Conjugating $h$ by $g$ gives $ghg^{-1} = h$ because $g$ and $h$ commute'
          answer: 'Conjugating $h$ by $g$ gives $ghg^{-1} = h$ because $g$ and $h$ commute'
          why: 'In an abelian group $ghg^{-1} = hgg^{-1} = h$, so conjugation moves nothing and every subgroup equals each of its conjugates.'
        exemplars:
          - problem: 'How many subgroups of $\mathbb{Z}_{13}$ are neither trivial nor the whole group?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange, the order of a subgroup of $\mathbb{Z}_{13}$ divides $13$. The only divisors of $13$ are $1$ and $13$, so every subgroup is trivial or the whole group. The number of other subgroups is $0$.'
          - problem: 'Is $\mathbb{Z}_{13}$ a simple group?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is simple","simple"],["no","it is not simple","not simple"]]}
            solution_sketch: 'The group $\mathbb{Z}_{13}$ is not trivial, and its only subgroups are $\{0\}$ and $\mathbb{Z}_{13}$, because $13$ is prime. So its only normal subgroups are these two. The group is simple.'
          - problem: 'In $\mathbb{Z}_{15}$, what is the order of the subgroup generated by $5$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup generated by $5$ is $\{0, 5, 10\}$. It has $3$ elements, so its order is $3$.'
          - problem: 'How many elements are in the subgroup of $\mathbb{Z}_{18}$ generated by $2$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup is $\{0, 2, 4, \dots, 16\}$, the even residues. Its order is $18/\gcd(18, 2) = 18/2 = 9$.'
          - problem: 'In $\mathbb{Z}_{12}$, the subgroup generated by $3$ is normal because $\mathbb{Z}_{12}$ is abelian. What is its order?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup generated by $3$ is $\{0, 3, 6, 9\}$. It has $4$ elements, and $1 < 4 < 12$. So it is a proper nontrivial normal subgroup of order $4$.'
          - problem: 'Is $\mathbb{Z}_{12}$ a simple group?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is simple","simple"],["no","it is not simple","not simple"]]}
            solution_sketch: 'The subgroup $\{0, 3, 6, 9\}$ has order $4$ and is normal because $\mathbb{Z}_{12}$ is abelian. It is neither trivial nor the whole group. So $\mathbb{Z}_{12}$ is not simple.'
          - problem: 'In $\mathbb{Z}_{20}$, the multiples of $4$ form a subgroup. What is its order?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup is $\{0, 4, 8, 12, 16\}$. Its order is $20/\gcd(20, 4) = 20/4 = 5$.'
          - problem: 'The rotations of a regular $18$-gon form a group isomorphic to $\mathbb{Z}_{18}$, with the rotation through $20$ degrees as generator. How many rotations are in the subgroup generated by the rotation through $60$ degrees?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rotation through $60$ degrees is $3$ times the generator, so it corresponds to the element $3$ of $\mathbb{Z}_{18}$. The subgroup it generates has order $18/\gcd(18, 3) = 6$. Indeed six rotations through $60$ degrees make a full turn.'
          - problem: 'The rotation group of a regular $20$-gon is cyclic of order $20$. Its subgroup of order $4$ is generated by a rotation through how many degrees?'
            answer: '90'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}
            solution_sketch: 'A rotation of order $4$ repeats after $4$ steps to give a full turn, so it turns through $360/4 = 90$ degrees. This rotation is $5$ steps of $18$ degrees, and $4 \cdot 90 = 360$.'
          - problem: 'Sam says that $\mathbb{Z}_6$ is simple, because the only divisors of $6$ are $1$ and $6$. Which divisors of $6$ did Sam leave out?'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divisors of $6$ are $1, 2, 3, 6$. Sam left out $2$ and $3$. The subgroups of orders $2$ and $3$ are normal because $\mathbb{Z}_6$ is abelian, so $\mathbb{Z}_6$ is not simple.'
          - problem: 'Write the full proof that $\mathbb{Z}_7$ is simple.'
            answer: 'Z_7 is simple'
            answer_contract: {"kind":"none"}
            solution_sketch: 'The group $\mathbb{Z}_7$ is not trivial. By Lagrange, a subgroup has order dividing $7$, so its order is $1$ or $7$. Hence the only subgroups, and so the only normal subgroups, are $\{0\}$ and $\mathbb{Z}_7$.'
        constraints: "definition unwinding and verdicts for Z_n (n <= 20); a verdict always names an explicit normal subgroup or rules all sizes out via Lagrange"
      - id: kp2
        name: "The abelian simple groups are exactly Z_p"
        key_prerequisites: [normal-subgroups, consequences-of-lagrange]
        step_check:
          step: 'so it is enough to exhibit a single proper nontrivial subgroup'
          question: 'Why is one proper nontrivial subgroup enough to show that $\mathbb{Z}_{15}$ is not simple?'
          options:
            - 'A group is simple when it has at most one proper subgroup of each order'
            - 'Subgroups of abelian groups are normal, so it is a proper nontrivial normal one'
            - 'Every group of composite order has exactly one proper nontrivial subgroup'
            - 'A proper subgroup of an abelian group is cyclic, and all cyclic groups are simple'
          answer: 'Subgroups of abelian groups are normal, so it is a proper nontrivial normal one'
          why: 'In an abelian group every subgroup is normal. A proper nontrivial normal subgroup is exactly what the definition of simple forbids.'
        exemplars:
          - problem: 'Let $g$ generate a cyclic group of order $15$. What is the order of $g^5$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In a cyclic group of order $n$, the element $g^k$ has order $n/\gcd(n, k)$. Here $\gcd(15, 5) = 5$, so $g^5$ has order $15/5 = 3$.'
          - problem: 'Is $\mathbb{Z}_{15}$ a simple group?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is simple","simple"],["no","it is not simple","not simple"]]}
            solution_sketch: 'The subgroup $\{0, 5, 10\}$ has order $3$ and is normal because $\mathbb{Z}_{15}$ is abelian. Since $1 < 3 < 15$, it is a proper nontrivial normal subgroup. So $\mathbb{Z}_{15}$ is not simple.'
          - problem: 'A finite abelian group is simple, and its order is between $90$ and $100$. What is its order?'
            answer: '97'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A finite abelian group is simple exactly when its order is prime. The only prime between $90$ and $100$ is $97$. So the order is $97$.'
          - problem: 'Let $g$ generate a cyclic group of order $35$. What is the order of $g^7$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $g^7$ is $35/\gcd(35, 7) = 35/7 = 5$. So $\langle g^7 \rangle$ is a proper nontrivial normal subgroup of order $5$.'
          - problem: 'A necklace has $12$ beads, and its rotations by whole beads form a group isomorphic to $\mathbb{Z}_{12}$. How many subgroups of this rotation group are neither trivial nor the whole group?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroups of $\mathbb{Z}_{12}$ correspond to the divisors of $12$, which are $1, 2, 3, 4, 6, 12$. Leaving out $1$ and $12$ gives $4$ subgroups, of orders $2, 3, 4, 6$.'
          - problem: 'Is $\mathbb{Z}_{17}$ a simple group?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is simple","simple"],["no","it is not simple","not simple"]]}
            solution_sketch: 'A cyclic group of prime order $17$ has only the trivial subgroup and itself, by Lagrange. So its only normal subgroups are these two. The group $\mathbb{Z}_{17}$ is simple.'
          - problem: 'A dial has $11$ positions, and its rotations by whole positions form a group isomorphic to $\mathbb{Z}_{11}$. How many subgroups of this group are neither trivial nor the whole group?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only divisors of $11$ are $1$ and $11$. So the rotation group has only the trivial subgroup and itself, and the number of other subgroups is $0$.'
          - problem: 'Sam says that $\mathbb{Z}_9$ is simple because $9$ is odd. How many elements does the subgroup of $\mathbb{Z}_9$ generated by $3$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup generated by $3$ is $\{0, 3, 6\}$, which has $3$ elements. It is normal because $\mathbb{Z}_9$ is abelian, and $1 < 3 < 9$. So $\mathbb{Z}_9$ is not simple, and being odd is not the test.'
          - problem: 'The subgroup $A_3$ of $S_3$ has order $3$. What is its index in $S_3$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The index is $|S_3|/|A_3| = 6/3 = 2$. A subgroup of index $2$ is normal, so $A_3$ is a proper nontrivial normal subgroup and $S_3$ is not simple.'
          - problem: 'Write the full proof that a finite abelian group is simple if and only if it is isomorphic to $\mathbb{Z}_p$ for some prime $p$.'
            answer: 'Simple abelian means Z_p, p prime'
            answer_contract: {"kind":"none"}
            solution_sketch: 'If the group is $\mathbb{Z}_p$, Lagrange leaves no proper nontrivial subgroup, so it is simple. Conversely, in a simple abelian group every subgroup is normal, so any $g \ne e$ gives $\langle g \rangle = G$ and $G$ is cyclic. If its order $n$ were composite with a divisor $d$, $1 < d < n$, then $\langle g^{n/d} \rangle$ would be a proper nontrivial normal subgroup. So $n$ is prime.'
        constraints: "the abelian classification proof in guided steps; non-abelian verdicts limited to S_3 and D_n via named normal subgroups"
      - id: kp3
        name: "Refuting simplicity by exhibiting a normal subgroup"
        key_prerequisites: [normal-subgroups, lagranges-theorem]
        step_check:
          step: 'Since $[S_3 : A_3] = 2$, $A_3$ is normal in $S_3$'
          question: 'Why is a subgroup of index $2$ always normal?'
          options:
            - 'The left cosets are $H$ and the rest, and so are the right ones, so $gH = Hg$'
            - 'A subgroup of index $2$ is always abelian, and every abelian subgroup is normal'
            - 'Both cosets have $|H|$ elements, and a subgroup whose cosets have equal size is normal'
            - 'By Lagrange its order is $|G|/2$, so it is cyclic, and every cyclic subgroup is normal'
          answer: 'The left cosets are $H$ and the rest, and so are the right ones, so $gH = Hg$'
          why: 'With index $2$ there are only two left cosets and two right cosets. Each has $H$ as one coset and the rest of $G$ as the other, so left and right cosets agree.'
        try_first:
          problem: 'A group $G$ has order $14$ and $H$ is a subgroup of order $7$. How many left cosets does $H$ have in $G$?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The number of left cosets is $14/7 = 2$. With only two cosets, the cosets other than $H$ itself are the rest of $G$ on both sides, which is why such a subgroup is normal.'
        exemplars:
          - problem: 'Let $R$ be the subgroup of rotations of the dihedral group $D_4$ of order $8$. $R$ has order $4$. What is the index of $R$ in $D_4$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange the index is $|D_4|/|R| = 8/4 = 2$. A subgroup of index $2$ is normal, and $1 < 4 < 8$, so $R$ is a proper nontrivial normal subgroup.'
          - problem: 'A group $G$ of order $10$ has a subgroup $H$ of index $2$. What is the order of $H$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The index is $|G|/|H|$, so $2 = 10/|H|$. This gives $|H| = 5$. Since the index is $2$, the subgroup $H$ is normal, and $1 < 5 < 10$.'
          - problem: 'In $A_4$, which has order $12$, the Klein four-subgroup $V$ of order $4$ is normal. What is the order of the quotient group $A_4/V$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient group has order $|A_4|/|V| = 12/4 = 3$. Since $V$ is normal, proper and nontrivial, $A_4$ is not simple.'
          - problem: 'A group $G$ of order $8$ has a center of order $2$, as in $D_4$ and in the quaternion group. What is the index of $Z(G)$ in $G$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange the index is $|G|/|Z(G)| = 8/2 = 4$. The center is always normal, and $1 < 2 < 8$, so $G$ is not simple.'
          - problem: 'The symmetries of a regular hexagon form the dihedral group $D_6$ of order $12$. The six rotations form a subgroup. Is $D_6$ a simple group?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is simple","simple"],["no","it is not simple","not simple"]]}
            solution_sketch: 'The rotation subgroup has order $6$ and index $12/6 = 2$. A subgroup of index $2$ is normal, and $1 < 6 < 12$. So $D_6$ has a proper nontrivial normal subgroup and is not simple.'
          - problem: 'Let $G = \mathbb{Z}_6$ and $H = \{0, 3\}$. What is the index of $H$ in $G$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup $H$ has order $2$, so its index is $6/2 = 3$. Since $\mathbb{Z}_6$ is abelian, $H$ is normal, and $1 < 2 < 6$.'
          - problem: 'A group $G$ has a normal subgroup $N$ of order $7$, and the quotient $G/N$ has $6$ elements. How many elements does $G$ have?'
            answer: '42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $G$ is $|N| \cdot |G/N| = 7 \cdot 6 = 42$. We multiply because the cosets of $N$ each have $7$ elements and there are $6$ of them. Since $1 < 7 < 42$ and $N$ is normal, $G$ is not simple.'
          - problem: 'Sam says that $A_4$ is simple, because its subgroups of order $3$ are not normal. What is the order of a proper nontrivial normal subgroup of $A_4$ that shows Sam is wrong?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Klein four-subgroup $V = \{e, (1\,2)(3\,4), (1\,3)(2\,4), (1\,4)(2\,3)\}$ is normal in $A_4$, because conjugation permutes the three double transpositions. It has order $4$, and $1 < 4 < 12$. So $A_4$ is not simple.'
          - problem: 'Write the full proof that $A_4$ is not simple.'
            answer: 'V of order 4 is normal in A_4'
            answer_contract: {"kind":"none"}
            solution_sketch: 'The Klein four-subgroup $V = \{e, (1\,2)(3\,4), (1\,3)(2\,4), (1\,4)(2\,3)\}$ has order $4$. Conjugation by any element of $A_4$ permutes the three double transpositions, so it maps $V$ to itself and $V$ is normal. Since $1 < 4 < 12$, $V$ is a proper nontrivial normal subgroup.'
        constraints: "refutations via index-2 subgroups, abelian subgroups, or named normal subgroups (A_n, rotation subgroup, center); groups of order <= 12; no Sylow counting (taught later)"
    diagnostic_exemplar:
      problem: 'Decide, with proof, whether each of $\mathbb{Z}_{11}$ and $D_6$ (the symmetries of a regular hexagon, order $12$) is simple.'
      answer: '$\mathbb{Z}_{11}$ is simple: it is nontrivial, and by Lagrange every subgroup has order dividing the prime $11$, so the only subgroups at all are $\{0\}$ and $\mathbb{Z}_{11}$. $D_6$ is not simple: the rotation subgroup $\langle r \rangle$ has order $6$, so its index is $12/6 = 2$; a subgroup of index $2$ is always normal, and $1 < 6 < 12$, so it is a proper nontrivial normal subgroup.'
      solution_sketch: 'For prime order, Lagrange leaves no room for proper nontrivial subgroups. For $D_6$, exhibit a normal subgroup — index $2$ forces normality.'
    anki_seeds:
      - front: "Simple group?"
        back: "A nontrivial group whose only normal subgroups are $\\{e\\}$ and the whole group."
        type: basic
      - front: "The abelian simple groups are exactly..."
        back: "$\\mathbb{Z}_p$, $p$ prime (every subgroup of an abelian group is normal)."
        type: basic
      - front: "Fastest way to show a group is NOT simple?"
        back: "Exhibit one proper nontrivial normal subgroup — e.g. any subgroup of index $2$, or any proper nontrivial subgroup of an abelian group."
        type: basic

