          options:
            - 'Sylow subgroups are always the smallest subgroup of prime power order, so they use $5$ once'
            - 'The order of a Sylow subgroup is the prime itself, and $25$ is a mistake from $175 = 7 \cdot 25$'
            - 'The order must divide $175$, and $25$ is the largest divisor of $175$ that is not $175$'
            - 'A Sylow $p$-subgroup takes the whole power $p^n$ of $p$ in $|G|$, and here $5^2$ divides $175$'
          answer: 'A Sylow $p$-subgroup takes the whole power $p^n$ of $p$ in $|G|$, and here $5^2$ divides $175$'
          why: 'Cauchy gives a subgroup of order $p$, but Sylow gives the largest one, of order $p^n$ where $p^n$ exactly divides $|G|$. Since $175 = 5^2 \cdot 7$, that order is $25$.'
        try_first:
          problem: 'A group has order $50$. What is the order of the largest subgroup of prime-power order that Sylow''s theorem guarantees?'
          answer_contract: {"kind":"exact"}
          answer: '25'
          reveal: 'Factor $50 = 2 \cdot 5^2$. Sylow''s theorem gives subgroups of order $2$ and of order $25$, and the larger is $25$. Cauchy''s theorem alone would give only order $5$.'
        exemplars:
          - problem: 'A finite group has order $60$. What is the order of a Sylow $2$-subgroup of this group?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $60 = 2^2 \cdot 3 \cdot 5$. A Sylow $2$-subgroup has order the full power of $2$ dividing $60$, which is $2^2 = 4$.'
          - problem: 'A group $G$ has order $45 = 3^2 \cdot 5$. Cauchy''s theorem gives a subgroup of order $3$. What is the order of a Sylow $3$-subgroup of $G$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A Sylow $3$-subgroup has order the full power of $3$ dividing $45$. Since $45 = 3^2 \cdot 5$, its order is $3^2 = 9$. This is larger than the order $3$ that Cauchy''s theorem gives.'
          - problem: 'A finite group has order $108$. What is the order of a Sylow $3$-subgroup?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $108 = 2^2 \cdot 3^3$. The full power of $3$ in $108$ is $3^3$. So a Sylow $3$-subgroup has order $27$.'
          - problem: 'In a group of order $200$, a Sylow $p$-subgroup has order $25$. What is the prime $p$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $200 = 2^3 \cdot 5^2$. A Sylow $p$-subgroup has order the full power of $p$ in $200$. The order $25 = 5^2$ is the full power of $5$, so $p = 5$.'
          - problem: 'A group $G$ has order $30 = 2 \cdot 3 \cdot 5$. A student claims that Sylow''s existence theorem guarantees a subgroup of order $9$ in $G$. Is the claim correct?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is correct","correct","right"],["no","it is not correct","incorrect","wrong"]]}
            solution_sketch: 'The $3$-part of $30$ is $3$, not $9$, since $9$ does not divide $30$. By Lagrange no subgroup of order $9$ exists in any group of order $30$. So the claim is wrong.'
          - problem: 'A group has order $72 = 2^3 \cdot 3^2$. By Sylow''s theorem it has a subgroup of order $8$. What is the index of this subgroup?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange the index is $72/8 = 9$. This index is also the order of a Sylow $3$-subgroup, because $72 = 8 \cdot 9$.'
          - problem: 'The symmetries of a certain molecule form a group of order $120$. What is the largest order of a subgroup of $2$-power order that Sylow''s theorem guarantees?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $120 = 2^3 \cdot 3 \cdot 5$. A Sylow $2$-subgroup has order $2^3 = 8$. So the largest guaranteed $2$-subgroup has order $8$.'
          - problem: 'What is the order of a Sylow $2$-subgroup of the symmetric group $S_4$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $S_4$ has order $24 = 2^3 \cdot 3$. The full power of $2$ is $2^3 = 8$, so a Sylow $2$-subgroup has order $8$. It is a copy of the dihedral group $D_4$.'
          - problem: 'A group has order $392 = 2^3 \cdot 7^2$. What is the order of a Sylow $7$-subgroup?'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The full power of $7$ in $392$ is $7^2$. So a Sylow $7$-subgroup has order $49$.'
          - problem: 'What is the order of a Sylow $3$-subgroup of a group of order $30$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $30 = 2 \cdot 3 \cdot 5$. The full power of $3$ dividing $30$ is $3^1 = 3$. So a Sylow $3$-subgroup has order $3$.'
        constraints: "read Sylow subgroup orders off factorizations, |G| <= 200; statement-level existence questions"
      - id: kp2
        name: "Counting Sylow subgroups: n_p | m and n_p = 1 mod p"
        key_prerequisites: [cauchys-theorem, lagranges-theorem]
        step_check:
          step: 'Identify the divisors of $4$'
          question: 'Why must $n_5$ divide $4$ in a group of order $20$ and not just divide $20$?'
          options:
            - 'Because $n_5$ must be smaller than the order $5$ of a Sylow $5$-subgroup of the group'
            - '$n_5$ is the index of a normalizer containing the Sylow subgroup, so it divides $20/5$'
            - 'Because $4$ is the only divisor of $20$ that is not divisible by the prime $5$ itself'
            - 'Because the Sylow subgroup has order $5$ and all other subgroups have order exactly $4$'
          answer: '$n_5$ is the index of a normalizer containing the Sylow subgroup, so it divides $20/5$'
          why: 'The number $n_5$ is the index of the normalizer of a Sylow $5$-subgroup $P$. The normalizer contains $P$, so its index divides $[G : P] = 20/5 = 4$.'
        exemplars:
          - problem: 'A group $G$ of order $12$ has a Sylow $3$-subgroup that is not normal. How many Sylow $3$-subgroups does $G$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $12 = 3 \cdot 4$, so $n_3$ divides $4$ and $n_3 \equiv 1 \pmod 3$. The candidates are $1$ and $4$. Since the Sylow $3$-subgroup is not normal, $n_3 \ne 1$, so $n_3 = 4$.'
          - problem: 'How many Sylow $5$-subgroups does a group of order $75$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $75 = 5^2 \cdot 3$, so $n_5$ divides $3$ and $n_5 \equiv 1 \pmod 5$. The divisors of $3$ are $1$ and $3$, and only $1$ is congruent to $1$ modulo $5$. So $n_5 = 1$.'
          - problem: 'What is the largest possible number of Sylow $7$-subgroups of a group of order $56$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $56 = 7 \cdot 8$, so $n_7$ divides $8$ and $n_7 \equiv 1 \pmod 7$. The divisors of $8$ are $1, 2, 4, 8$, and only $1$ and $8$ leave remainder $1$ modulo $7$. The largest is $8$.'
          - problem: 'What are the possible numbers of Sylow $2$-subgroups of a group of order $18$?'
            answer: '1, 3, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $18 = 2 \cdot 9$, so $n_2$ divides $9$ and $n_2 \equiv 1 \pmod 2$. The divisors of $9$ are $1, 3, 9$, and all are odd. So $n_2$ can be $1$, $3$ or $9$.'
          - problem: 'Must the Sylow $11$-subgroup of a group of order $99$ be normal?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it must be","it is normal"],["no","it need not be","not necessarily"]]}
            solution_sketch: 'We have $99 = 11 \cdot 9$, so $n_{11}$ divides $9$ and $n_{11} \equiv 1 \pmod{11}$. The divisors $1, 3, 9$ leave remainders $1, 3, 9$ modulo $11$, so $n_{11} = 1$. A unique Sylow subgroup is normal.'
          - problem: 'How many elements of order $7$ does a group of order $21$ have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $21 = 7 \cdot 3$, so $n_7$ divides $3$ and $n_7 \equiv 1 \pmod 7$, which forces $n_7 = 1$. The unique subgroup of order $7$ has $6$ non-identity elements, each of order $7$. Every element of order $7$ lies in it.'
          - problem: 'Sam says that a group of order $20$ can have $4$ Sylow $5$-subgroups, because $4$ divides $20$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","he is right","right","correct"],["no","he is wrong","wrong","incorrect","not right"]]}
            solution_sketch: 'We have $20 = 5 \cdot 4$, so $n_5$ divides $4$ and $n_5 \equiv 1 \pmod 5$. The number $4$ divides $20$ and $4$ is congruent to $4$ modulo $5$, not $1$. So $n_5 = 1$, and Sam is wrong.'
          - problem: 'A group of order $35$ has a unique subgroup of order $5$ and a unique subgroup of order $7$. How many elements of order $5$ or order $7$ does the group have?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup of order $5$ has $4$ elements of order $5$. The subgroup of order $7$ has $6$ elements of order $7$. These sets do not overlap, so there are $4 + 6 = 10$ elements.'
          - problem: 'How many elements of order $5$ does a group of order $20$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $20 = 5 \cdot 4$, so $n_5$ divides $4$ and $n_5 \equiv 1 \pmod 5$, which forces $n_5 = 1$. The one Sylow $5$-subgroup has $4$ elements of order $5$, and every element of order $5$ lies in it.'
        constraints: "apply n_p | m and n_p = 1 mod p for |G| <= 100; conclude normality whenever n_p = 1"
      - id: kp3
        name: "Structural conclusions from Sylow counting"
        key_prerequisites: [cauchys-theorem, normal-subgroups]
        step_check:
          step: '$n_5 \mid 3$ and $n_5 \equiv 1 \pmod 5$ force $n_5 = 1$'
          question: 'Why do these two conditions force $n_5 = 1$ in a group of order $15$?'
          options:
            - 'The group is small, so only one subgroup of order $5$ can fit inside it'
            - 'Any divisor of $3$ is congruent to $1$ modulo $5$, and $1$ is the smallest one'
            - 'The only divisor of $3$ that leaves remainder $1$ on division by $5$ is $1$'
            - 'A subgroup of order $5$ is normal whenever $5$ is the largest prime dividing the order'
          answer: 'The only divisor of $3$ that leaves remainder $1$ on division by $5$ is $1$'
          why: 'The divisors of $3$ are $1$ and $3$. We have $1 \equiv 1$ but $3 \equiv 3 \pmod 5$, so $1$ is the only number that satisfies both conditions.'
        exemplars:
          - problem: 'For which primes $p$ must the Sylow $p$-subgroup of a group of order $15$ be normal?'
            answer: '3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $p = 3$, $n_3$ divides $5$ and $n_3 \equiv 1 \pmod 3$, so $n_3 = 1$. For $p = 5$, $n_5$ divides $3$ and $n_5 \equiv 1 \pmod 5$, so $n_5 = 1$. Both Sylow subgroups are unique and hence normal, so the primes are $3$ and $5$.'
          - problem: 'For which primes $p$ must the Sylow $p$-subgroup of a group of order $33$ be normal?'
            answer: '3, 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $p = 11$, $n_{11}$ divides $3$ and $n_{11} \equiv 1 \pmod{11}$, so $n_{11} = 1$. For $p = 3$, $n_3$ divides $11$ and $n_3 \equiv 1 \pmod 3$, and $11 \equiv 2 \pmod 3$, so $n_3 = 1$. Both Sylow subgroups are normal, so the primes are $3$ and $11$.'
          - problem: 'A group of order $20$ has a Sylow subgroup that must be normal. What is its order?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $20 = 2^2 \cdot 5$, so $n_5$ divides $4$ and $n_5 \equiv 1 \pmod 5$, which gives $n_5 = 1$. The Sylow $5$-subgroup of order $5$ is normal. The dihedral group $D_{10}$ has $5$ Sylow $2$-subgroups, so those need not be normal.'
          - problem: 'For which primes $p$ must the Sylow $p$-subgroup of a group of order $55$ be normal?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $p = 11$, $n_{11}$ divides $5$ and $n_{11} \equiv 1 \pmod{11}$, so $n_{11} = 1$. For $p = 5$, $n_5$ divides $11$ and $n_5 \equiv 1 \pmod 5$, and both $1$ and $11$ qualify, because $11 \equiv 1 \pmod 5$. So only the Sylow $11$-subgroup is forced to be normal, and the prime is $11$.'
          - problem: 'A group of order $75$ has a Sylow subgroup that must be normal. What is its order?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $75 = 5^2 \cdot 3$, so $n_5$ divides $3$ and $n_5 \equiv 1 \pmod 5$, which gives $n_5 = 1$. The normal Sylow $5$-subgroup has order $25$. The count $n_3$ can be $1$ or $25$, so it is not forced.'
          - problem: 'For which prime $p$ must the Sylow $p$-subgroup of a group of order $28$ be normal?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $28 = 2^2 \cdot 7$, so $n_7$ divides $4$ and $n_7 \equiv 1 \pmod 7$, which forces $n_7 = 1$. The Sylow $7$-subgroup is normal. The group $D_{14}$ has $7$ Sylow $2$-subgroups, so those are not forced to be normal.'
          - problem: 'A cipher uses a group of order $15$. Up to isomorphism, how many groups of order $15$ are there?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both Sylow subgroups, of orders $3$ and $5$, are normal and meet only in the identity, so the group is their direct product. Hence $G \cong \mathbb{Z}_3 \times \mathbb{Z}_5 \cong \mathbb{Z}_{15}$. There is exactly $1$ such group.'
          - problem: 'A set of $35$ key permutations forms a group. Must the group be abelian?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it must be","it is abelian"],["no","it need not be","not necessarily"]]}
            solution_sketch: 'For $35 = 5 \cdot 7$, $n_5$ divides $7$ and $n_5 \equiv 1 \pmod 5$, so $n_5 = 1$. Also $n_7$ divides $5$ and $n_7 \equiv 1 \pmod 7$, so $n_7 = 1$. The group is the direct product of cyclic groups of orders $5$ and $7$, so it is abelian.'
          - problem: 'What are the possible numbers of Sylow $3$-subgroups of a group of order $21$?'
            answer: '1, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $21 = 3 \cdot 7$, so $n_3$ divides $7$ and $n_3 \equiv 1 \pmod 3$. Both $1$ and $7$ qualify. The non-abelian group of order $21$ has $n_3 = 7$, so both values occur.'
          - problem: 'Is every group of order $21$ cyclic?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","every one is"],["no","it is not","not every one"]]}
            solution_sketch: 'There are $n_3 = 1$ or $n_3 = 7$ Sylow $3$-subgroups, since $n_3$ divides $7$ and $n_3 \equiv 1 \pmod 3$. When $n_3 = 7$ the Sylow $3$-subgroup is not normal and the group is not abelian. Such a group of order $21$ exists, so not every group of order $21$ is cyclic.'
        constraints: "orders pq or p^2 q with p, q <= 11; the internal-direct-product recognition step may be quoted after one worked instance"
