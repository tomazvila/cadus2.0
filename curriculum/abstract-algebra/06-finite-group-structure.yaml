  - id: finite-abelian-groups-classification
    name: "The Fundamental Theorem of Finite Abelian Groups"
    core: false                # terminal classification destination; nothing downstream consumes it
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: direct-products
        weight: 0.8
        key: true
      - id: isomorphism-invariants
        weight: 0.5
        key: true
      - id: abelian-groups
        weight: 0.5
