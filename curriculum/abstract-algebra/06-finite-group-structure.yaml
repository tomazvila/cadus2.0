    knowledge_points:
      - id: kp1
        name: "Aut(G) is a group under composition"
        key_prerequisites: [group-isomorphisms]
        step_check:
          step: '$\varphi$ is surjective exactly when $a$ generates $\mathbb{Z}_6$'
          question: 'Why must an automorphism of $\mathbb{Z}_6$ send $1$ to a generator of $\mathbb{Z}_6$?'
          options:
            - 'A homomorphism must send a generator to another generator, whether or not it is onto'
            - 'An automorphism is onto, and the image of the group is generated by $\varphi(1)$'
            - 'The image of $1$ is the identity of $\mathbb{Z}_6$, which is a generator of the group'
            - 'Every nonzero element of $\mathbb{Z}_6$ is a generator, so any choice of $a$ works'
          answer: 'An automorphism is onto, and the image of the group is generated by $\varphi(1)$'
          why: 'Every $\varphi(x)$ is a multiple of $\varphi(1) = a$, so the image is $\langle a \rangle$. For $\varphi$ to be onto, $\langle a \rangle$ must be all of $\mathbb{Z}_6$, which means $\gcd(a, 6) = 1$.'
        exemplars:
          - problem: 'Let $\varphi$ be an automorphism of $\mathbb{Z}_7$ with $\varphi(1) = 3$. What is $\varphi(4)$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A homomorphism out of $\mathbb{Z}_7$ is determined by the image of $1$, so $\varphi(k) = 3k \bmod 7$. Then $\varphi(4) = 12 \bmod 7 = 5$.'
          - problem: 'Let $\varphi$ be an automorphism of $\mathbb{Z}_{12}$ with $\varphi(1) = 5$. What is $\varphi(7)$?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $1$ generates $\mathbb{Z}_{12}$, we have $\varphi(k) = 5k \bmod 12$. So $\varphi(7) = 35 \bmod 12 = 11$.'
          - problem: 'How many automorphisms does the group $\mathbb{Z}$ of integers under addition have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An automorphism is determined by the image of $1$, and that image must generate $\mathbb{Z}$. The only generators of $\mathbb{Z}$ are $1$ and $-1$. So there are $2$ automorphisms, the identity and negation.'
          - problem: 'Let $f$ and $g$ be automorphisms of $\mathbb{Z}_8$ with $f(1) = 3$ and $g(1) = 5$. What is $(f \circ g)(1)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $g(1) = 5$. Then $f(5) = 5 \cdot f(1) = 15 \bmod 8 = 7$. So $(f \circ g)(1) = 7$.'
          - problem: 'Let $\varphi$ be the automorphism of $\mathbb{Z}_7$ with $\varphi(1) = 2$. What is the smallest positive integer $k$ for which $\varphi^k$ is the identity?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\varphi^k(1) = 2^k \bmod 7$. The powers $2, 4, 1$ show that $2^3 \equiv 1$ first. So $\varphi^3$ is the identity and $k = 3$.'
          - problem: 'Let $g$ generate a cyclic group of order $5$. How many automorphisms does this group have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An automorphism sends $g$ to a generator, and every non-identity element of a group of order $5$ is a generator. That gives $4$ choices for the image of $g$. So the group has $4$ automorphisms.'
          - problem: 'The hours of a $12$-hour clock form the group $\mathbb{Z}_{12}$ under addition. Is the map $x \mapsto 5x$ an automorphism of this group?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is an automorphism"],["no","it is not","not an automorphism"]]}
            solution_sketch: 'The map $x \mapsto 5x$ preserves addition. It is a bijection because $\gcd(5, 12) = 1$, so $5$ generates $\mathbb{Z}_{12}$. So it is an automorphism.'
          - problem: 'The hours of a $12$-hour clock form the group $\mathbb{Z}_{12}$ under addition. Is the map $x \mapsto 4x$ an automorphism of this group?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is an automorphism"],["no","it is not","not an automorphism"]]}
            solution_sketch: 'The map $x \mapsto 4x$ preserves addition, but $\gcd(4, 12) = 4$, so $4$ does not generate $\mathbb{Z}_{12}$. The map sends $0$ and $3$ both to $0$, so it is not one-to-one.'
          - problem: 'Sam says that $x \mapsto 3x$ is an automorphism of $\mathbb{Z}_9$. How many elements of $\mathbb{Z}_9$ does this map send to $0$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $3x \equiv 0 \pmod 9$, which holds for $x = 0, 3, 6$. So the map sends $3$ elements to $0$. Since $0$ is the only element an automorphism sends to $0$, the map is not an automorphism.'
        constraints: "group-axiom verification for Aut(G); generator-image arguments for Aut of cyclic groups; groups of order <= 12"
      - id: kp2
        name: "Aut(Z_n) ≅ U(n); the primitive-root theorem for U(p)"
        key_prerequisites: [group-isomorphisms, units-in-modular-rings]
        step_check:
          step: 'since $U(10)$ has an element of order $4$ equal to its size, it is cyclic'
          question: 'Why does an element of order $4$ make a group of $4$ elements cyclic?'
          options:
            - 'Its powers are $4$ different elements, so they already fill the whole group'
            - 'An element of order $4$ commutes with the other elements, and a commutative group is cyclic'
            - 'The element of order $4$ is the identity of the group, and that makes the group cyclic'
            - 'A group of $4$ elements has no proper subgroups, and so must be cyclic'
          answer: 'Its powers are $4$ different elements, so they already fill the whole group'
          why: 'If $g$ has order $4$, then $e, g, g^2, g^3$ are $4$ different elements of $U(10)$. The group has only $4$ elements, so $\langle g \rangle$ is the whole group.'
        exemplars:
          - problem: 'How many automorphisms does $\mathbb{Z}_{12}$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The automorphisms of $\mathbb{Z}_n$ correspond to the units modulo $n$, so $\mathrm{Aut}(\mathbb{Z}_n) \cong U(n)$. The units modulo $12$ are $1, 5, 7, 11$. So $\mathbb{Z}_{12}$ has $4$ automorphisms.'
          - problem: 'What is the smallest generator of the group $U(11)$ of units modulo $11$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $U(11)$ is cyclic of order $10$. The powers of $2$ modulo $11$ are $2, 4, 8, 5, 10, 9, 7, 3, 6, 1$, which are all $10$ units. Since $1$ is not a generator, the smallest generator is $2$.'
          - problem: 'How many elements of order $2$ does $\mathrm{Aut}(\mathbb{Z}_{16})$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\mathrm{Aut}(\mathbb{Z}_{16}) \cong U(16)$, we count the units $a \ne 1$ with $a^2 \equiv 1 \pmod{16}$. These are $a = 7, 9, 15$. So there are $3$ elements of order $2$.'
          - problem: 'What is the order of the group $\mathrm{Aut}(\mathbb{Z}_{15})$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\mathrm{Aut}(\mathbb{Z}_{15}) \cong U(15)$, and its order is the number of units modulo $15$. The units are $1, 2, 4, 7, 8, 11, 13, 14$. So the order is $8$.'
          - problem: 'Which of $\mathbb{Z}_8$, $\mathbb{Z}_4 \times \mathbb{Z}_2$ and $\mathbb{Z}_2^3$ is isomorphic to the group $\mathrm{Aut}(\mathbb{Z}_{15})$?'
            answer: 'Z4xZ2'
            answer_contract: {"kind":"label","options":[["Z8","Z_8","Z_{8}","cyclic group of order 8","cyclic"],["Z4xZ2","Z_4 × Z_2","Z_4 x Z_2","Z4 × Z2","Z4 x Z2","Z_2 × Z_4","Z_4×Z_2","Z_4 \\times Z_2"],["Z2^3","Z2xZ2xZ2","Z_2^3","Z_2 × Z_2 × Z_2","Z_2 x Z_2 x Z_2","Z_2×Z_2×Z_2","Z_2 \\times Z_2 \\times Z_2"]]}
            solution_sketch: 'We have $\mathrm{Aut}(\mathbb{Z}_{15}) \cong U(15) = \{1, 2, 4, 7, 8, 11, 13, 14\}$, which has order $8$. No unit modulo $15$ has order $8$, since $2^4 \equiv 1$ and $7^4 \equiv 1$, so the group is not $\mathbb{Z}_8$. The unit $2$ has order $4$, so the group is not $\mathbb{Z}_2^3$, where every element has order at most $2$. So it is $\mathbb{Z}_4 \times \mathbb{Z}_2$.'
          - problem: 'In $\mathrm{Aut}(\mathbb{Z}_{16})$, the automorphism $\varphi_3$ sends each residue to $3$ times that residue modulo $16$. What is the order of $\varphi_3$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $\varphi_3$ equals the order of $3$ in $U(16)$. We have $3^2 = 9$ and $3^4 = 81 \equiv 1 \pmod{16}$, and no smaller power is $1$. So the order is $4$.'
          - problem: 'Is the group $\mathrm{Aut}(\mathbb{Z}_{10})$ cyclic?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is cyclic","cyclic"],["no","it is not","not cyclic"]]}
            solution_sketch: 'We have $\mathrm{Aut}(\mathbb{Z}_{10}) \cong U(10) = \{1, 3, 7, 9\}$, of order $4$. The element $3$ has order $4$, because $3^2 = 9$, $3^3 \equiv 7$, $3^4 \equiv 1$. So $U(10)$ is cyclic.'
          - problem: 'The marks of a dial form the group $\mathbb{Z}_{25}$ under addition. How many relabelings of the marks preserve addition?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A relabeling that preserves addition and uses every mark once is an automorphism of $\mathbb{Z}_{25}$. These correspond to the units modulo $25$, and there are $\varphi(25) = 20$ of them.'
          - problem: 'Sam says that $\mathrm{Aut}(\mathbb{Z}_8)$ has $4$ elements and is cyclic, generated by $3$. What is the order of $3$ in $U(8)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $3^2 = 9 \equiv 1 \pmod 8$, so $3$ has order $2$, not $4$. Every unit modulo $8$ has order at most $2$, so $\mathrm{Aut}(\mathbb{Z}_8)$ is not cyclic.'
        constraints: "the Aut(Z_n) = U(n) proof once, then identifications of Aut(Z_n) for n <= 16 by order and element orders; U(p) cyclic quoted as the primitive-root theorem, generators verified by listing powers, p <= 13"
      - id: kp3
        name: "Inner automorphisms and G/Z(G) ≅ Inn(G)"
        key_prerequisites: [first-isomorphism-theorem, quotient-groups, class-equation]
        step_check:
          step: 'Therefore $\ker \Phi = Z(G)$'
          question: 'Why does conjugation by $g$ act as the identity exactly when $g$ lies in the center?'
          options:
            - 'Conjugation by $g$ fixes $g$ itself, so it is the identity map only when $g$ is central'
            - 'The identity map is conjugation by the identity, and the center is the set of identities'
            - 'The condition $gxg^{-1} = x$ for all $x$ says that $g$ commutes with every element'
            - 'The kernel of any homomorphism out of $G$ is the center of $G$, by the first theorem'
          answer: 'The condition $gxg^{-1} = x$ for all $x$ says that $g$ commutes with every element'
          why: 'We have $c_g = \mathrm{id}$ when $gxg^{-1} = x$ for every $x$, which is $gx = xg$ for every $x$. These are exactly the elements of $Z(G)$.'
        exemplars:
          - problem: 'Let $G$ be a group with $|G| = 12$ and $|Z(G)| = 3$. How many inner automorphisms does $G$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $g \mapsto c_g$ has kernel $Z(G)$, so $\mathrm{Inn}(G) \cong G/Z(G)$. The number of inner automorphisms is $12/3 = 4$.'
          - problem: 'What is the isomorphism type of the inner automorphism group of the dihedral group $D_4$ of order $8$?'
            answer: 'Klein four group'
            answer_contract: {"kind":"label","options":[["Klein four group","Klein four-group","Klein group","Z_2 × Z_2","Z2xZ2","Z_2 x Z_2","V_4","V4"],["cyclic group of order 4","cyclic group","Z_4","Z4","C_4","C4","cyclic"],["dihedral group of order 8","dihedral group","D_4","D4"],["symmetric group S_3","symmetric group","S_3","S3"]]}
            solution_sketch: 'The center of $D_4$ has order $2$, so $\mathrm{Inn}(D_4) \cong D_4/Z(D_4)$ has order $4$. Every non-identity element of this quotient squares to the identity, so it has no element of order $4$. So it is the Klein four group, and it is neither $S_3$ nor $D_4$, which have orders $6$ and $8$.'
          - problem: 'How many inner automorphisms does the symmetric group $S_3$ have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center of $S_3$ is trivial, so $\mathrm{Inn}(S_3) \cong S_3/\{e\}$. So the number of inner automorphisms is $6/1 = 6$.'
          - problem: 'How many inner automorphisms does the dihedral group $D_5$ of order $10$ have?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The center of $D_5$ is trivial, so $|\mathrm{Inn}(D_5)| = 10/1 = 10$. Distinct elements give distinct conjugation maps.'
          - problem: 'Let $A$ be an abelian group of order $45$. How many inner automorphisms does $A$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In an abelian group $gxg^{-1} = x$ for all $g, x$, so every conjugation map is the identity. The only inner automorphism is the identity, so the number is $1$.'
