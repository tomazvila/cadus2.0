unit: cosets-quotients
course: abstract-algebra
module: "Cosets & Quotient Groups"
topics:
  - id: cosets
    name: "Cosets"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: subgroups-subgroup-tests
        weight: 0.9
        key: true
      - id: equivalence-classes-partitions
        weight: 0.6
        key: true
      - id: permutations-cycle-notation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing cosets in abelian groups"
        key_prerequisites: [subgroups-subgroup-tests, equivalence-classes-partitions]
        exemplars:
          - problem: "In Z_12, let H = {0, 4, 8}. The coset 7+H consists of 7+h reduced modulo 12 for each h in H. Find the smallest element of the coset 7+H."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a coset, 7+H = {7+0, 7+4, 7+8} reduced modulo 12. Reducing each element mod 12 gives 7, 11, 3, so the coset is {3, 7, 11}. The smallest element of 7+H is 3."
          - problem: "In (Z, +), the cosets of 5Z are the residue classes modulo 5. Find the least nonnegative representative of the coset 17+5Z."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cosets of 5Z in Z are the residue classes modulo 5, and an integer x lies in 17+5Z exactly when x is congruent to 17 mod 5. By the division algorithm, 17 = 3 times 5 plus 2. The least nonnegative representative of the coset 17+5Z is 2."
          - problem: "In Z_18, let H = {0, 6, 12}. The number of distinct cosets of H equals 18 divided by the size of H. How many distinct cosets of H are there?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The index formula counts cosets: the number of distinct cosets equals the order of the group divided by the order of the subgroup. Here Z_18 has 18 elements and H = {0, 6, 12} has 3 elements. The cosets are H, 1+H, 2+H, 3+H, 4+H, 5+H, and 18/3 = 6, so the count is 6."
          - problem: "In Z_12, let H = {0, 3, 6, 9}. Two elements lie in the same coset of H exactly when their difference belongs to H. Determine whether the elements 5 and 10 lie in the same coset of H, and give the smallest element of the coset 5+H."
            answer: "verdict = different; rep = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["same"], ["different"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "rep"}]}
            solution_sketch: "Coset equality criterion: a and b lie in the same coset of H exactly when a minus b is in H. Here 10 - 5 = 5, and 5 is not in H = {0, 3, 6, 9}, so the verdict is different. By the definition of a coset, 5+H = {5, 8, 11, 2}, and its smallest element is 2. So verdict = different; rep = 2."
          - problem: "In Z_6, let H = {0, 3}. The coset 1+H consists of 1+h reduced modulo 6 for each h in H. Find the sum of the elements in the coset 1+H."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a coset, add the representative 1 to each element of H = {0, 3}: 1+0 = 1 and 1+3 = 4, so 1+H = {1, 4}. Adding the elements of the coset gives 1+4 = 5. The sum of the elements in the coset 1+H is 5."
          - problem: "In Z_20, let H = {0, 5, 10, 15}. The coset 13+H consists of 13+h reduced modulo 20 for each h in H. Find the smallest element of the coset 13+H."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a coset, add the representative 13 to each element of H = {0, 5, 10, 15} and reduce mod 20: 13, 18, 3, 8. Thus 13+H = {3, 8, 13, 18}. The smallest element of the coset 13+H is 3."
        constraints: "subgroups of Z_n (n <= 24) or nZ in Z; answers as explicit sets or residue classes"
      - id: kp2
        name: "Left vs right cosets in non-abelian groups"
        key_prerequisites: [subgroups-subgroup-tests, permutations-cycle-notation]
        exemplars:
          - problem: "In S3, cycle notation, let H = {e, (1 2)}. Use composition right to left. How many elements lie in both the left coset (1 3)H and the right coset H(1 3)?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a left coset, (1 3)H = {(1 3)e, (1 3)(1 2)} = {(1 3), (1 2 3)} with right-to-left composition. By the definition of a right coset, H(1 3) = {e(1 3), (1 2)(1 3)} = {(1 3), (1 3 2)}. Comparing the two sets, the only common element is (1 3). The number of elements in both cosets is 1."
          - problem: "In S3, cycle notation, let H = {e, (1 2)}. Use composition right to left. How many elements a of S3 satisfy aH = H?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a left coset, aH = {ah : h in H}. The equality aH = H holds exactly when a is in H, since a = ae must be in aH = H and every a in H gives aH = H. The elements of H are e and (1 2). Hence the number of elements a with aH = H is 2."
          - problem: "In D4 with r^4 = e, s^2 = e and s r = r^3 s, use composition right to left. Let H = {e, s}. How many elements lie in rH or Hr?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of a left coset, rH = {r e, r s} = {r, r s}. By the definition of a right coset and the relation s r = r^3 s, Hr = {e r, s r} = {r, r^3 s}. The union is {r, r s, r^3 s}. The number of elements in the union is 3."
          - problem: "In D4 with r^4 = e, s^2 = e and s r = r^3 s, use composition right to left. Let H = {e, s}. How many elements a of D4 satisfy aH = Ha?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of left and right cosets, compute aH and Ha for all a. The equality holds for a = e, r^2, s, and r^2 s, because r^2 commutes with s and sH = Hs. For a = r and a = r^3, rH = {r, r s} differs from Hr = {r, r^3 s}; for a = r s and a = r^3 s the sets also differ. Hence the number of elements a with aH = Ha is 4."
          - problem: "In S3, cycle notation, let H = {e, (1 2 3), (1 3 2)}. Use composition right to left. How many left cosets aH have a different corresponding right coset Ha?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of coset, H = A3 is the set of even permutations. For any a in S3, aH and Ha are both the set of permutations with the same parity as a, because H is normal. For example, (1 2)H = {(1 2), (1 3), (2 3)} and H(1 2) is the same set. Therefore no left coset differs from its corresponding right coset, so the number is 0."
          - problem: "In S3, cycle notation, let H = {e, (1 2)}. Use composition right to left. What is the order of the permutation that lies in (1 3)H but not in H(1 3)?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of left coset, (1 3)H = {(1 3), (1 2 3)}. By the definition of right coset, H(1 3) = {(1 3), (1 3 2)}. The element that lies only in the left coset is (1 2 3). The order of a 3-cycle is 3, so the order is 3."
        constraints: "H of order 2 or 3 in S_3 or D_4; always state the composition convention"
      - id: kp3
        name: "Coset equality and the partition property"
        key_prerequisites: [equivalence-classes-partitions]
        exemplars:
          - problem: 'Prove: $aH = bH$ if and only if $a^{-1}b \in H$.'
            answer: 'If $aH = bH$ then $b = ah$ for some $h$, so $a^{-1}b = h \in H$; conversely $a^{-1}b = h$ gives $bH = ahH = aH$.'
            answer_contract: {kind: none}
            solution_sketch: 'Both directions unwind the definition; the relation $a \sim b \iff a^{-1}b \in H$ is an equivalence relation whose classes are the left cosets.'
          - problem: 'Two cosets $aH$ and $bH$ share an element. What can you conclude?'
            answer: '$aH = bH$ — distinct cosets are disjoint.'
            answer_contract: {kind: none}
            solution_sketch: 'Cosets are equivalence classes, so they are equal or disjoint.'
        constraints: "short proofs using the equivalence-class characterization"
    diagnostic_exemplar:
      problem: 'In $S_3$ (composing right to left) let $H = \{e, (2\,3)\}$. List all left cosets of $H$, and decide whether $(1\,2)H = H(1\,2)$.'
      answer: 'The left cosets are $H = \{e, (2\,3)\}$, $(1\,2)H = \{(1\,2), (1\,2\,3)\}$ and $(1\,3)H = \{(1\,3), (1\,3\,2)\}$: three cosets of size $2$ partitioning $S_3$. But $H(1\,2) = \{(1\,2), (1\,3\,2)\}$, so $(1\,2)H \ne H(1\,2)$ — left and right cosets of this subgroup differ.'
      answer_contract: {kind: none}
      solution_sketch: 'Multiply $H$ on the left by one representative from each block; the cosets partition $S_3$ into three blocks of size $2$. Then compute $H(1\,2)$ and compare — a non-normal subgroup of a non-abelian group has different left and right cosets.'
    anki_seeds:
      - front: "When are two left cosets equal: $aH = bH$ iff ...?"
        back: "$a^{-1}b \\in H$."
        type: basic
      - front: "How do the left cosets of $H$ relate to the group $G$ as a whole?"
        back: "They partition $G$ into disjoint blocks, each of size $|H|$."
        type: basic

  - id: lagranges-theorem
    name: "Lagrange's Theorem"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: cosets
        weight: 0.9
        key: true
      - id: order-of-an-element
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Statement, proof idea, and the index"
        key_prerequisites: [cosets]
        exemplars:
          - problem: 'A group $G$ has order $20$ and $H \le G$ has order $5$. Compute $[G : H]$.'
            answer: "4"
            solution_sketch: '$[G:H] = |G|/|H| = 20/5 = 4$.'
          - problem: "Let G be a finite group and H a subgroup of G. Select the equation that expresses Lagrange's theorem and the index [G : H]."
            answer: "|G| = [G:H]|H|"
            answer_contract: {"kind": "label", "options": [["|G| = [G:H]|H|"], ["|H| = [G:H]|G|"], ["[G:H] = |G|+|H|"], ["[G:H] = |H|/|G|"]]}
            solution_sketch: "Lagrange's theorem says the left cosets of H partition G, and each coset has |H| elements, so |G| = [G:H]|H|. The index [G:H] is the number of left cosets. The option |H| = [G:H]|G| solves for the wrong factor. The option [G:H] = |G|+|H| adds sizes instead of counting cosets. The option [G:H] = |H|/|G| inverts the correct ratio. The correct equation is |G| = [G:H]|H|."
          - problem: "A group G has order 48 and a subgroup H has order 8. Compute the index [G : H]."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange's theorem gives |G| = [G:H]|H|. Substitute the known values: 48 = [G:H] * 8. Solve by division: [G:H] = 48/8 = 6. The index is 6."
          - problem: "A group G has order 84 and a subgroup H has index 12. Find the order of H."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange's theorem gives |G| = [G:H]|H|. Substitute 84 = 12 * |H|. Solve by division: |H| = 84/12 = 7. The order of H is 7."
          - problem: "A subgroup H of a group G has 9 left cosets, and each left coset has 5 elements. Find the order of G."
            answer: "45"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left cosets of H partition G, and each coset has |H| = 5 elements by the coset bijection. The number of cosets is the index, so [G:H] = 9. Thus |G| = [G:H]|H| = 9 * 5 = 45. The order of G is 45."
          - problem: "A group G has order 100 and a subgroup H has order 20. How many left cosets of H are there in G?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number of left cosets is the index [G:H]. Lagrange's theorem gives |G| = [G:H]|H|. Substitute 100 = [G:H] * 20. Solve by division: [G:H] = 100/20 = 5. There are 5 left cosets."
        constraints: "index computations and the counting argument; |G| <= 100"
      - id: kp2
        name: "Ruling out subgroup orders"
        key_prerequisites: [cosets]
        exemplars:
          - problem: 'List all possible orders of subgroups of a group of order $21$.'
            answer: '$1, 3, 7, 21$'
            solution_sketch: 'Exactly the divisors of $21$ are candidates (Lagrange); which occur depends on the group, but no other order is possible.'
          - problem: "A group $G$ has order $20$. Can $G$ have a subgroup of order $8$? Give a verdict (possible or impossible) and give the remainder when $20$ is divided by $8$."
            answer: "verdict = impossible; r = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["possible"], ["impossible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "By Lagrange's theorem, the order of a subgroup must divide the order of the group. Apply the division algorithm to the full pair: 20 = 2*8 + 4, so 8 does not divide 20. The option possible is wrong because it ignores the divisibility test that Lagrange forces. Lagrange gives only necessity, so non-divisibility rules out the order in every group of order 20. So verdict = impossible; r = 4."
          - problem: "A group $G$ has order $30$. Lagrange's theorem restricts which integers can occur as the order of a subgroup of $G$. How many integers from $1$ to $30$ pass this restriction? Give the count."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By Lagrange's theorem, a subgroup order must divide 30. Apply the divisor test to the full range 1 to 30: the divisors of 30 are 1, 2, 3, 5, 6, 10, 15, and 30, so exactly 8 integers pass. Lagrange gives only necessity, so some of these candidate orders may fail to occur in a particular group of order 30. The count of integers that pass the restriction is 8."
          - problem: "Can a group $G$ of order $45$ contain a subgroup of order $6$? Give a verdict (possible or impossible) and give the remainder when $45$ is divided by $6$."
            answer: "verdict = impossible; r = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["possible"], ["impossible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Lagrange's theorem forces every subgroup order to divide the group order. Apply the division algorithm to the full pair: 45 = 7*6 + 3, so 6 does not divide 45 and the order 6 is ruled out. The option possible is wrong because it treats any size below 45 as allowed. So verdict = impossible; r = 3."
          - problem: "A group $G$ has order $36$. Find the largest integer that can be the order of a proper subgroup of $G$ according to Lagrange's theorem."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By Lagrange's theorem, the order of a proper subgroup of $G$ must divide 36 and be strictly less than 36. Apply the divisor test to the full number: the divisors of 36 are 1, 2, 3, 4, 6, 9, 12, 18, and 36, and the largest one below 36 is 18. Lagrange gives only necessity, so a subgroup of order 18 need not exist, but no larger proper subgroup is possible. The largest integer allowed by Lagrange's theorem is 18."
          - problem: "In a group $G$ of order $12$, how many integers $m$ with $1 \\le m \\le 11$ cannot be the order of a subgroup of $G$? Give the count."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By Lagrange's theorem, a subgroup order must divide 12. Apply the divisor test to the full range 1 to 11: the divisors of 12 in this range are 1, 2, 3, 4, and 6. The remaining integers 5, 7, 8, 9, 10, and 11 fail the test and are ruled out, and Lagrange gives only necessity, so nothing more can be said about the passing orders. The count of ruled-out integers is 6."
        constraints: "divisibility verdicts; |G| <= 100; emphasize Lagrange gives necessity only"
      - id: kp3
        name: "The converse fails"
        key_prerequisites: [cosets]
        exemplars:
          - problem: "The alternating group A_4 has order 12, and the numbers alone allow a subgroup of order 6. How many subgroups of order 6 does A_4 actually have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange's theorem): a subgroup of order 6 in A_4 would have index 2, hence would be normal. Step 2 (conjugacy classes): the class sizes in A_4 are 1, 3, 4, 4, and a normal subgroup is a union of classes that contains the identity. Step 3 (arithmetic): the possible class sums 1, 4, 5, 8, 9 and 12 never equal 6, so no such normal subgroup exists. The number of subgroups of order 6 in A_4 is 0."
          - problem: "The group U(8) consists of the units modulo 8, namely 1, 3, 5 and 7, under multiplication modulo 8. Find the order of the element 3."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): the order of 3 in U(8) is the least positive k with 3^k congruent to 1 modulo 8. Step 2 (compute powers): 3^1 = 3 and 3^2 = 9, which is 1 modulo 8. Step 3 (least k): no smaller positive exponent works, so the least such k is 2. The order of the element 3 in U(8) is 2."
          - problem: "The alternating group A_4 has 12 elements: the identity, three double transpositions, and eight 3-cycles. How many elements of A_4 have order 3?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (structure): each 3-cycle of A_4 has order 3, while the identity and the double transpositions have order 1 or 2. Step 2 (count the 3-cycles): choose the fixed point in 4 ways and then the direction of the cycle in 2 ways. Step 3 (multiply): 4 times 2 = 8 such cycles. The number of elements of order 3 in A_4 is 8."
          - problem: "The Klein four group has four elements and every non-identity element squares to the identity. How many elements of this group have order exactly 2?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (structure): write the Klein four group as e, a, b, ab with a^2 = b^2 = (ab)^2 = e. Step 2 (orders): the identity e has order 1, and each of a, b and ab has order 2. Step 3 (count): the elements of order 2 are a, b and ab. The number of elements of order 2 in the Klein four group is 3."
          - problem: "The group U(8) consists of the units modulo 8, namely 1, 3, 5 and 7, under multiplication modulo 8. Give the set of all orders of elements of U(8)."
            answer: "{1, 2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (individual orders): in U(8) the identity 1 has order 1. Step 2 (the other elements): 3^2 = 9 = 1, 5^2 = 25 = 1 and 7^2 = 49 = 1 modulo 8, so 3, 5 and 7 each have order 2 and none has order 4. Step 3 (collect): the orders that occur are 1 and 2. The set of all orders of elements of U(8) is {1, 2}."
          - problem: "In the alternating group A_4 every subgroup of order 3 is generated by a 3-cycle. How many subgroups of order 3 does A_4 have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (structure): a subgroup of order 3 in A_4 has the form {e, g, g^2} for a 3-cycle g. Step 2 (pair the cycles): the eight 3-cycles fall into four pairs of the form {g, g^2}, and each pair gives exactly one subgroup of order 3. Step 3 (count): four pairs give four subgroups. The number of subgroups of order 3 in A_4 is 4."
        constraints: "counterexample recall: A_4 (subgroups), U(8) or Klein four (element orders)"
    diagnostic_exemplar:
      problem: 'A group $G$ has order $12$ and a subgroup $H$ with $[G : H] = 3$. Find $|H|$, and decide whether every group of order $12$ must contain a subgroup of order $6$.'
      answer: '$|H| = |G|/[G:H] = 12/3 = 4$. No: the converse of Lagrange fails. $A_4$ has order $12$ but no subgroup of order $6$ — such a subgroup would have index $2$, hence be normal with quotient of order $2$, so it would contain $g^2$ for every $g$; every $3$-cycle is a square ($\sigma = (\sigma^2)^2$), giving all eight $3$-cycles inside a subgroup of size $6$, a contradiction.'
      answer_contract: {kind: none}
      solution_sketch: 'Lagrange gives $|G| = |H| \cdot [G:H]$. For the second part, divisibility is necessary but not sufficient: $A_4$ is the standard counterexample.'
    anki_seeds:
      - front: "Lagrange's theorem?"
        back: "In a finite group, the order of every subgroup divides the order of the group; $|G| = [G:H]\\,|H|$."
        type: basic
      - front: "Standard counterexample to the converse of Lagrange?"
        back: "$A_4$: order $12$, but no subgroup of order $6$."
        type: basic

  - id: consequences-of-lagrange
    name: "Consequences of Lagrange's Theorem"
    core: false                # corollary set feeding only the classification capstone
    difficulty: 0.70
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: lagranges-theorem
        weight: 0.9
        key: true
      - id: cyclic-groups-generators
        weight: 0.6
        key: true
      - id: proof-by-contradiction
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Element orders divide the group order"
        key_prerequisites: [lagranges-theorem, cyclic-groups-generators]
        exemplars:
          - problem: 'Prove that in a finite group $G$, the order of every element divides $|G|$.'
            answer: '$|g| = |\langle g \rangle|$, which divides $|G|$ by Lagrange.'
            solution_sketch: 'The cyclic subgroup generated by $g$ has exactly $|g|$ elements; apply Lagrange to it.'
          - problem: 'Deduce that $g^{|G|} = e$ for every $g$ in a finite group $G$.'
            answer: '$|G| = |g| \cdot k$ for some integer $k$, so $g^{|G|} = (g^{|g|})^k = e^k = e$.'
            solution_sketch: 'Write the exponent as a multiple of the element order.'
        constraints: "two-step deductions from Lagrange; cite |<g>| = |g|"
      - id: kp2
        name: "Groups of prime order"
        key_prerequisites: [lagranges-theorem, cyclic-groups-generators]
        exemplars:
          - problem: 'Prove that every group of prime order $p$ is cyclic.'
            answer: 'Take $g \neq e$; $|g|$ divides $p$ and is $> 1$, so $|g| = p$ and $\langle g \rangle = G$.'
            solution_sketch: 'A non-identity element must have order $p$, hence generates the whole group.'
          - problem: 'How many subgroups does a group of order $13$ have?'
            answer: "2"
            solution_sketch: 'Only orders $1$ and $13$ divide $13$: the trivial subgroup and the whole group.'
        constraints: "primes p <= 50; classification: unique group Z_p up to isomorphism"
      - id: kp3
        name: "Fermat's little theorem and Euler's theorem, group-theoretically"
        key_prerequisites: [lagranges-theorem]
        exemplars:
          - problem: "Use the group U(11) to compute 3^10 mod 11. Give the remainder."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First note that U(11) has order 10. By Lagrange's theorem, every element g of U(11) satisfies g^10 = 1 mod 11. Since 3 is coprime to 11, the class of 3 lies in U(11). Therefore 3^10 = 1 mod 11. The answer is 1."
          - problem: "Compute 3^100 mod 7 by reducing the exponent with the order of U(7). Give the remainder."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the group order: U(7) has 6 elements. By Fermat's little theorem, 3^6 = 1 mod 7. Divide the exponent: 100 = 6*16 + 4. Therefore 3^100 = 3^4 = 81 = 4 mod 7. The answer is 4."
          - problem: "Use the group U(10) to compute 7^22 mod 10. Give the remainder."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First note that U(10) has order 4. By Lagrange's theorem, every unit modulo 10 satisfies a^4 = 1 mod 10. Since 7 is a unit, reduce the exponent: 22 = 4*5 + 2. Then 7^22 = 7^2 = 49 = 9 mod 10. The answer is 9."
          - problem: "In the group U(20), find the order of the element 3."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First note that U(20) has order 8, so Lagrange's theorem says the order of 3 divides 8. Compute powers: 3^2 = 9, 3^3 = 27 = 7 mod 20, and 3^4 = 81 = 1 mod 20. No smaller positive power gives 1, so the order is 4. The answer is 4."
          - problem: "Claim: For every unit a modulo 7, a^6 = 1 mod 7. Step 1: U(7) has 6 elements. Step 2: By Lagrange's theorem, the order of a divides 6. Step 3: Therefore a^3 = 1 mod 7. Step 4: Hence a^6 = 1 mod 7. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because U(7) has 6 elements. Step 2 is valid by Lagrange's theorem: the order of a divides 6. Step 3 is false: an order that divides 6 need not divide 3; for a = 3 the order is 6. Step 4 would follow from Step 3 but is not the first invalid step. The answer is Step 3."
          - problem: "In the proof that a^(|U(n)|) = 1 mod n, let d be the order of a in U(n) and write |U(n)| = d·m for a positive integer m. The line a^(|U(n)|) = ? is missing. Select the line that is true and that uses the hypothesis a^d = 1 mod n."
            answer: "(a^d)^m"
            answer_contract: {"kind": "label", "options": [["(a^d)^m"], ["a^d + a^m"], ["(ad)^m"], ["a^(dm) - 1"]]}
            solution_sketch: "The order of a in U(n) is d, so a^d = 1 mod n. Write |U(n)| = d·m. Then a^(|U(n)|) = a^(d·m) = (a^d)^m = 1^m = 1 mod n. The option a^d + a^m confuses a product of exponents with a sum. The option (ad)^m multiplies the base by the order instead of raising a to the power d. The option a^(dm) - 1 is off by one. The answer is (a^d)^m."
          - problem: "Write the full proof: Let n be a positive integer and let a be an integer coprime to n. Prove a^(|U(n)|) = 1 mod n. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: U(n) is the set of residue classes modulo n that have inverses, and it is a group under multiplication modulo n. Step 2: The class of a lies in U(n) because gcd(a,n) = 1. Step 3: Let d be the order of this class in U(n). By Lagrange's theorem, d divides |U(n)|. Step 4: Write |U(n)| = d m for some positive integer m. Then a^(|U(n)|) = (a^d)^m = 1^m = 1 mod n. Therefore the claim holds."
        constraints: "modular exponentiation with moduli <= 30, reduced via g^{|U(n)|} = 1"
    diagnostic_exemplar:
      problem: 'Let $G$ be a group with $|G| = 35$ and $g \in G$ with $g \neq e$. What are the possible orders of $g$? Then compute $7^{222} \bmod 11$.'
      answer: 'Possible orders: $5, 7, 35$. And $7^{222} \equiv 5 \pmod{11}$.'
      solution_sketch: 'Orders divide $35$ and exceed $1$. Since $7^{10} \equiv 1 \pmod{11}$ and $222 = 10\cdot22 + 2$, $7^{222} \equiv 7^2 = 49 \equiv 5$.'
    anki_seeds:
      - front: "In a finite group $G$, $g^{|G|} = $ ?"
        back: "$e$, because $|g|$ divides $|G|$ (Lagrange)."
        type: basic
      - front: "Every group of prime order is..."
        back: "Cyclic (isomorphic to $\\mathbb{Z}_p$), generated by any non-identity element."
        type: basic
      - front: "Fermat's little theorem as a statement about $U(p)$?"
        back: "$|U(p)| = p-1$, so $a^{p-1} \\equiv 1 \\pmod p$ whenever $p \\nmid a$."
        type: basic

  - id: normal-subgroups
    name: "Normal Subgroups"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: cosets
        weight: 0.9
        key: true
      - id: even-odd-permutations
        weight: 0.4
        key: false
      - id: dihedral-groups
        weight: 0.3
        key: false
      # Phase C: kp1 proves every subgroup of an abelian group is normal — a direct
      # commutativity manipulation taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Definition and the conjugation test"
        key_prerequisites: [cosets]
        exemplars:
          - problem: "In the additive group $Z_{12}$, take the subgroup $N = \\{0, 6\\}$. The conjugation test says $N$ is normal in $Z_{12}$ exactly when $g + n - g$ lies in $N$ for every $g$ and $n$. For $g = 5$ and $n = 4$, compute $g + n - g$ in $Z_{12}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the full expression $g + n - g$ with $g = 5$ and $n = 4$. Step 2: in the additive group $Z_{12}$ addition is commutative, so the two copies of $g$ cancel: $5 + 4 - 5 = 4 + (5 - 5) = 4$. Step 3: the expression equals $n$ for every $g$, which is the abelian special case of the conjugation test, and $4$ is in $Z_{12}$. The value of $g + n - g$ is 4."
          - problem: "A subgroup of the additive group $Z_9$ is normal exactly when $g + n - g$ lies in the subgroup for every element $g$ of $Z_9$ and every $n$ of the subgroup. Take $N = \\{0, 3, 6\\}$ with $g = 2$ and $n = 6$. Compute $g + n - g$ in $Z_9$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the conjugation test in an additive group uses the expression $g + n - g$. Step 2: substitute $g = 2$ and $n = 6$ to get $2 + 6 - 2 = 6$. Step 3: reduce modulo $9$: the value is $6$, which lies in $N = \\{0, 3, 6\\}$, so this instance of the test passes. The computed value is 6."
          - problem: "In the dihedral group $D_4$, let $r$ be a quarter turn and $s$ a reflection, with the relation $s r s^{-1} = r^{-1}$. Write $s r^3 s^{-1}$ in the form $r^k$ with $0 \\le k \\le 3$. Give $k$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the full object is $s r^3 s^{-1}$, a conjugate of a power of the rotation. Step 2: conjugation respects powers, so $s r^3 s^{-1} = (s r s^{-1})^3 = (r^{-1})^3 = r^{-3}$. Step 3: reduce the exponent modulo $4$: $r^{-3} = r^{4-3} = r$, so $k = 1$. The exponent is k = 1."
          - problem: "In $S_3$, conjugate the transposition $(1\\,3)$ by $g = (1\\,2)$: the conjugate is the permutation $(1\\,2)(1\\,3)(1\\,2)$, composed right to left. Give the image of $2$ under this conjugate."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the full object is the permutation $(1\\,2)(1\\,3)(1\\,2)$, applied right to left. Step 2: track the element $2$: the rightmost $(1\\,2)$ sends $2$ to $1$, then $(1\\,3)$ sends $1$ to $3$, then the leftmost $(1\\,2)$ fixes $3$. Step 3: the conjugate sends $2$ to $3$, so it is $(2\\,3)$, which is not the original transposition; conjugation moves elements. The image of 2 is 3."
          - problem: "Claim: every subgroup $N$ of an abelian group $G$ is normal. Step 1: let $g$ be in $G$ and $n$ be in $N$. Step 2: since $G$ is abelian, $g n g^{-1} = n g g^{-1} = n$. Step 3: the element $n g$ lies in $N$ because $n$ is in $N$ and $G$ is abelian. Step 4: hence $g n g^{-1}$ is in $N$ for all $g$ and $n$, so $N$ is normal. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct setup. Step 2 is a valid computation: commutativity gives $n g g^{-1} = n$. Step 3 is false: the closure of the subgroup $N$ applies only to products of two elements of $N$, and $g$ is an arbitrary element of $G$ that need not lie in $N$, so $n g$ belongs to the coset $Ng$, not necessarily to $N$. Step 4 would follow from the corrected Step 3. The first invalid step is Step 3."
          - problem: "In the dihedral group $D_4$, let $r$ be a quarter turn and $s$ a reflection, with $s r s^{-1} = r^{-1}$. Let $N = \\{e, r^2\\}$. Compute $s r s^{-1}$ as $r^k$ with $0 \\le k \\le 3$, and decide whether $r^k$ lies in $N$. Give $k$ and the verdict."
            answer: "verdict = no; k = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Step 1: the full object is $s r s^{-1}$ with $N = \\{e, r^2\\}$. Step 2: the relation $s r s^{-1} = r^{-1}$ gives the conjugate directly. Step 3: reduce the exponent modulo $4$: $r^{-1} = r^3$, so $k = 3$. Step 4: check membership in $N$: $r^3$ is neither $e$ nor $r^2$, so the conjugate does not lie in $N$. So verdict = no; k = 3."
          - problem: "Write the full proof: a subgroup $N$ of $G$ satisfies $gN = Ng$ for every $g$ in $G$ exactly when $g n g^{-1}$ lies in $N$ for every $g$ in $G$ and $n$ in $N$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (forward): assume $gN = Ng$ for every $g$ in $G$. Take $n$ in $N$. Then $g n$ lies in $gN$, and since $gN = Ng$, there is $m$ in $N$ with $g n = m g$. Multiply on the right by $g^{-1}$: $g n g^{-1} = m$, which lies in $N$. Step 2 (reverse): assume $g n g^{-1}$ lies in $N$ for every $g$ in $G$ and $n$ in $N$. Take $x$ in $gN$, so $x = g n$ for some $n$ in $N$. Rewrite $x = (g n g^{-1}) g$. By the assumption the first factor lies in $N$, so $x$ lies in $Ng$; hence $gN$ is contained in $Ng$. Step 3 (symmetry): applying the same argument with $g^{-1}$ in place of $g$ gives $Ng$ contained in $gN$. Therefore $gN = Ng$ for every $g$ in $G$, which is exactly the definition of a normal subgroup. The proof is complete."
        constraints: "definition unwinding; conjugation test gng^{-1} in N"
      - id: kp2
        name: "Testing normality in S_3, D_4, A_n"
        key_prerequisites: [cosets, even-odd-permutations]
        exemplars:
          - problem: "In S3, let h be the transposition swapping 1 and 2, and let s be the transposition swapping 1 and 3. Compute s h s^(-1)."
            answer: "(2 3)"
            answer_contract: {"kind": "label", "options": [["(2 3)"], ["(1 2)"], ["(1 3)"], ["(1 2 3)"]]}
            solution_sketch: "Conjugation relabels the points moved by h by the permutation s. The transposition h swaps 1 and 2, so its conjugate swaps the images 3 and 2, giving (2 3). Option (1 2) leaves h unchanged, the error of ignoring the conjugation. Option (1 3) is just s, the error of using s in place of the conjugate. Option (1 2 3) is a 3-cycle, the error of composing as a product rather than a conjugate. The answer is (2 3)."
          - problem: "For every permutation s, the sign of s t s^(-1) equals the sign of t. If t is an even permutation, give the sign of its conjugate s t s^(-1) as 1 or -1."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sign is multiplicative, so sign(s t s^(-1)) = sign(s) sign(t) sign(s^(-1)). Since sign(s^(-1)) = sign(s), the outer factors cancel, leaving sign(t). An even t has sign 1, so the conjugate is even and its sign is 1. The answer is 1."
          - problem: "In D4, let r be rotation by 90 degrees and let s be a reflection, with the relation s r = r^(-1) s. Compute r s r^(-1) and write the result in the form r^k or r^k s."
            answer: "r^2 s"
            answer_contract: {"kind": "label", "options": [["r^2 s"], ["r^3 s"], ["r s"], ["r^2"]]}
            solution_sketch: "Use the relation to move r past s. Since s r = r^(-1) s, we have r s = s r^(-1). Then r s r^(-1) = s r^(-1) r^(-1) = s r^(-2) = s r^2. Because r^(-2) = r^2 in D4 and r^2 commutes with s, this is r^2 s. Option r^3 s uses r^(-1) in place of r^(-2), the error of conjugating by r only once. Option r s moves r past s without inverting it, the error of dropping the minus sign in the relation. Option r^2 omits the reflection s, the error of forgetting that r does not normalize s alone. The answer is r^2 s."
          - problem: "In S4, conjugate the 3-cycle moving 1 to 2 to 3 by the transposition swapping 1 and 4. Compute the resulting cycle."
            answer: "(2 3 4)"
            answer_contract: {"kind": "label", "options": [["(2 3 4)"], ["(1 2 3)"], ["(1 3 4)"], ["(1 2 4)"]]}
            solution_sketch: "Conjugation by a permutation relabels each entry of the cycle by that permutation. The transposition swaps 1 and 4, so 1 stays fixed in the relabeled cycle, 2 becomes 3, 3 becomes 4, and 4 becomes 2, giving (2 3 4). Option (1 2 3) ignores the conjugation, the error of returning the original cycle. Option (1 3 4) applies only part of the relabeling. Option (1 2 4) reverses the direction of the last two images. The answer is (2 3 4)."
          - problem: "In D4 with rotation r, give the order of the central element r^2."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element r^2 is a half-turn. Its square is r^4 = e, and r^2 is not e, so its order is 2. Because r^2 commutes with r and with every reflection, it lies in the center. The answer is 2."
          - problem: "In S3, how many elements are conjugate to the transposition swapping 1 and 2?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Conjugates of a transposition are transpositions: conjugation relabels the two moved points. In S3 there are exactly three transpositions, and all are conjugate to the one swapping 1 and 2. The answer is 3."
          - problem: "Write the full proof: A_n is normal in S_n. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let s be any permutation in S_n and let t be any element of A_n. Step 2: The sign is multiplicative, so sign(s t s^(-1)) = sign(s) sign(t) sign(s^(-1)). Step 3: Since sign(s^(-1)) = sign(s), the outer factors cancel, and sign(s t s^(-1)) = sign(t). Step 4: Because t is even, sign(t) = 1, so s t s^(-1) is also even and lies in A_n. Step 5: Thus s A_n s^(-1) is contained in A_n for every s. Step 6: Conjugation is a bijection on the finite set S_n, so the sets have the same size, and therefore s A_n s^(-1) = A_n. Hence A_n is normal in S_n."
        constraints: "concrete conjugation checks in S_3, D_4; standard normal examples A_n, rotation subgroup of D_n, Z(G)"
      - id: kp3
        name: "Index 2 forces normality"
        key_prerequisites: [cosets]
        exemplars:
          - problem: 'Prove: if $[G : H] = 2$ then $H \trianglelefteq G$.'
            answer: 'For $g \notin H$, both the left and right coset of $g$ equal $G \setminus H$, so $gH = Hg$ always.'
            solution_sketch: 'With only two cosets, the non-trivial left coset and right coset are each the complement of $H$.'
          - problem: 'Deduce that the rotation subgroup $\langle r \rangle$ is normal in $D_n$.'
            answer: '$|\langle r \rangle| = n$ and $|D_n| = 2n$, so the index is $2$; normal by the previous result.'
            solution_sketch: 'Index $[D_n : \langle r \rangle] = 2$.'
        constraints: "the index-2 lemma and immediate applications"
    diagnostic_exemplar:
      problem: 'Determine whether $N = \{e, (1\,2\,3), (1\,3\,2)\}$ is normal in $S_3$, and whether $K = \{e, (1\,3)\}$ is.'
      answer: '$N = A_3$ is normal (index $2$); $K$ is not: $(1\,2)(1\,3)(1\,2) = (2\,3) \notin K$.'
      solution_sketch: '$N$ has index $6/3 = 2$, hence is normal. For $K$, one conjugation lands outside.'
    anki_seeds:
      - front: "Conjugation test for normality?"
        back: "$N \\trianglelefteq G$ iff $gng^{-1} \\in N$ for all $g \\in G$, $n \\in N$."
        type: basic
      - front: "Any subgroup of index $2$ is..."
        back: "Normal."
        type: basic

  - id: quotient-groups
    name: "Quotient Groups"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: normal-subgroups
        weight: 0.9
        key: true
      - id: lagranges-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Well-defined coset multiplication"
        key_prerequisites: [normal-subgroups]
        exemplars:
          - problem: "In the quotient group G/N, cosets multiply by (aN)(bN) = abN. Which condition on the subgroup N makes this multiplication independent of the chosen representatives? Select the condition."
            answer: "normal"
            answer_contract: {"kind": "label", "options": [["normal"], ["abelian"], ["cyclic"], ["finite"]]}
            solution_sketch: "The full answer is the condition that N be normal. The normality criterion says coset multiplication is independent of representatives exactly when aN = Na for every a. The option abelian is a stronger condition than needed, since non-abelian groups with normal subgroups also give quotients. The option cyclic is wrong because a cyclic subgroup need not be normal in a non-abelian group. The option finite is wrong because finiteness does not imply normality. The correct option is normal."
          - problem: "In the quotient group G/N, what is the inverse of the coset aN? Select the coset."
            answer: "a^-1 N"
            answer_contract: {"kind": "label", "options": [["a^-1 N"], ["a N"], ["e N"], ["a^-1"]]}
            solution_sketch: "The full object is the inverse coset in G/N. The inverse of aN is a^-1 N because (aN)(a^-1 N) = aa^-1 N = N. The option a N is the original coset; e N is the identity coset; a^-1 is an element, not a coset. The correct option is a^-1 N."
          - problem: "In the symmetric group S3, a subgroup N gives a well-defined coset product on S3/N exactly when N is normal. How many subgroups N of S3 are normal?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set of normal subgroups of S3 is {e}, A3, and S3. By the normality criterion for well-defined coset multiplication, a subgroup N gives a valid quotient exactly when it is normal. Counting the normal subgroups gives three. The answer is 3."
          - problem: "In the cyclic group Z_10, how many subgroups N give a well-defined coset product on Z_10/N?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full list of subgroups of Z_10 is the subgroups of orders 1, 2, 5, and 10. Since Z_10 is cyclic, it is abelian, so every subgroup is normal and gives a well-defined coset product. Counting these subgroups gives four. The answer is 4."
          - problem: "A cyclic group has order 7. How many subgroups N of this group give a well-defined coset product on the quotient?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A cyclic group of order 7 has only the subgroup of order 1 and the whole group of order 7. Every subgroup of an abelian group is normal, so both give a well-defined coset product. Thus the number of such subgroups is two. The answer is 2."
          - problem: "In the cyclic group Z_18, how many subgroups N give a well-defined coset product on Z_18/N?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The subgroups of Z_18 correspond to the divisors 1, 2, 3, 6, 9, and 18. Since Z_18 is cyclic, it is abelian, so every subgroup is normal and gives a well-defined quotient. Counting these gives six. The answer is 6."
        constraints: "definition-level questions on the quotient construction"
      - id: kp2
        name: "Computing in Z_n/H and Z/nZ"
        key_prerequisites: [normal-subgroups, lagranges-theorem]
        exemplars:
          - problem: "In Z_12, let H be the subgroup {0,4,8}. Find the order of the quotient group Z_12/H and the order of the coset 2+H. Give the quotient order as q and the element order as o, in the form q = value; o = value."
            answer: "q = 4; o = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "q"}, {"contract": {"kind": "exact"}, "name": "o"}]}
            solution_sketch: "The full result is q = 4; o = 2. Step 1: use Lagrange's theorem; H has 3 elements, so |Z_12/H| = 12/3 = 4, hence q = 4. Step 2: use the coset-order rule; 1*(2+H)=2+H is not H, while 2*(2+H)=4+H=H because 4 is in H, so o = 2. The answer is q = 4; o = 2."
          - problem: "View Z/6Z as the quotient of Z by the subgroup 6Z. Which structure does Z/6Z have up to isomorphism?"
            answer: "cyclic of order 6"
            answer_contract: {"kind": "label", "options": [["cyclic of order 6"], ["cyclic of order 4"], ["cyclic of order 3"], ["cyclic of order 2"]]}
            solution_sketch: "Step 1: the cosets of 6Z are the residue classes modulo 6, and by the coset-addition rule they add as residues do, so the quotient is cyclic and generated by 1+6Z. Step 2: it has exactly 6 elements, one per residue class. The option cyclic of order 4 has four elements, cyclic of order 3 has three, and cyclic of order 2 has two, so each has the wrong size. The correct label is cyclic of order 6."
          - problem: "In Z_20, let H be the subgroup generated by 5. Find the order of the coset 4 + H in Z_20/H."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full element is the coset 4+H. Step 1: write H = {0,5,10,15}. Step 2: test the multiples of 4 modulo 20; 4, 8, 12, 16 are not in H, but 4*5 = 20 is 0, which is in H. Thus the smallest k with k(4) in H is 5. The answer is 5."
          - problem: "In Z_18, let H be the subgroup generated by 6. Find the order of the element 4 + H in Z_18/H."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full element is the coset 4+H. Step 1: write H = {0,6,12}. Step 2: test the multiples of 4 modulo 18; 4 and 8 are not in H, but 4*3 = 12 is in H. Thus the smallest k with k(4) in H is 3. The answer is 3."
          - problem: "In Z/12Z, find the order of the element 5 + 12Z."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full element is the coset 5+12Z. Step 1: the order is the smallest k>0 with 5k in 12Z, meaning 5k is a multiple of 12. Step 2: gcd(12,5)=1, so the smallest such k is 12. The answer is 12."
          - problem: "Let H be the subgroup generated by 8 inside Z_24. Find the order of the coset 3 + H in the quotient Z_24/H."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full element is the coset 3+H. Step 1: write H = {0,8,16}. Step 2: test the multiples of 3 modulo 24; 3,6,9,12,15,18,21 are not in H, but 3*8 = 24 is 0, which is in H. Thus the smallest k with k(3) in H is 8. The answer is 8."
        constraints: "quotients of Z_n (n <= 24) and Z; orders of quotient elements via smallest k with ka in H"
      - id: kp3
        name: "Quotients of non-abelian groups"
        key_prerequisites: [normal-subgroups]
        exemplars:
          - problem: "The alternating subgroup A3 is normal in the symmetric group S3. Select the group isomorphic to the quotient S3/A3."
            answer: "Z2"
            answer_contract: {"kind": "label", "options": [["Z2"], ["Z3"], ["S3"], ["Z6"]]}
            solution_sketch: "The quotient S3/A3 has order 6/3 = 2 by Lagrange's theorem. A group of order 2 is cyclic, so it is isomorphic to Z2. The option Z3 has order 3, the option S3 has order 6, and the option Z6 has order 6, so each fails the order test. The quotient S3/A3 is isomorphic to Z2."
          - problem: "In the dihedral group D8 of order 8, the center Z has order 2. How many elements of order 2 are there in the quotient D8/Z?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The quotient D8/Z has order 8/2 = 4 by Lagrange's theorem. Its nonidentity cosets are rZ, sZ, and rsZ. Each of these squares to Z, so each has order 2. Thus the quotient has 3 elements of order 2."
          - problem: "In the quaternion group Q8 of order 8, the center Z has order 2. Find the order of the quotient group Q8/Z."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The quaternion group Q8 has order 8, and its center Z has order 2. By Lagrange's theorem, the quotient Q8/Z has order 8/2 = 4. The order of the quotient group Q8/Z is 4."
          - problem: "In the dihedral group D12 of order 12, the center Z has order 2. How many elements of order 3 are there in the quotient D12/Z?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The quotient D12/Z has order 12/2 = 6 by Lagrange's theorem. Its cosets rZ and r^2Z have order 3 because r^3 lies in Z, while sZ, rsZ, and r^2sZ have order 2. Therefore the number of elements of order 3 is 2."
          - problem: "In the dihedral group D8 of order 8, the center Z has order 2. Select the group isomorphic to the quotient D8/Z."
            answer: "V4"
            answer_contract: {"kind": "label", "options": [["Z2"], ["Z4"], ["V4"], ["D8"]]}
            solution_sketch: "The quotient D8/Z has order 8/2 = 4 by Lagrange's theorem. Every nonidentity coset has order 2, so the quotient is the Klein four group V4. The option Z2 has order 2, the option Z4 is cyclic of order 4, and the option D8 has order 8, so each is wrong. The quotient D8/Z is isomorphic to V4."
          - problem: "In the alternating group A4, the Klein four subgroup V4 is normal. Find the order of the coset (123)V4 in the quotient A4/V4."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The quotient A4/V4 has order 12/4 = 3 by Lagrange's theorem. The coset (123)V4 is not the identity coset, so its order divides 3. Since (123)^3 is the identity, the coset has order 3. Thus the order of (123)V4 is 3."
        constraints: "quotient orders <= 8; identify small quotients by order and element orders"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_{12}/\langle 4 \rangle$, find the order of the coset $3 + \langle 4 \rangle$.'
      answer: "4"
      solution_sketch: '$\langle 4 \rangle = \{0,4,8\}$; the multiples $3, 6, 9$ are not in it, but $4\cdot 3 = 12 \equiv 0$ is. Smallest such $k$ is $4$.'
    anki_seeds:
      - front: "Coset multiplication in a quotient group $G/N$?"
        back: "$(aN)(bN) = abN$; well defined precisely because $N$ is normal."
        type: basic
      - front: "$|G/N| = $ ? (finite $G$)"
        back: "$[G : N] = |G|/|N|$."
        type: basic
      - front: "Quotient of a cyclic group is..."
        back: "Cyclic — generated by the image of a generator."
        type: basic

  - id: direct-products
    name: "Direct Products"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: cyclic-groups-generators
        weight: 0.7
        key: true
      - id: cartesian-products
        weight: 0.4
        key: false
      - id: order-of-an-element
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "The construction and componentwise operation"
        key_prerequisites: [cartesian-products, order-of-an-element]
        exemplars:
          - problem: 'In $\mathbb{Z}_4 \times \mathbb{Z}_6$, compute $(3, 5) + (2, 4)$.'
            answer: '$(1, 3)$'
            solution_sketch: 'Add componentwise: $3+2 = 5 \equiv 1 \pmod 4$ and $5+4 = 9 \equiv 3 \pmod 6$.'
          - problem: 'What is the order of the group $\mathbb{Z}_3 \times \mathbb{Z}_5 \times \mathbb{Z}_2$?'
            answer: "30"
            solution_sketch: '$|A \times B| = |A||B|$; $3 \cdot 5 \cdot 2 = 30$.'
          - problem: "In Z_7 x Z_9, compute (3, 5) - (6, 8). Give the answer as (a, b)."
            answer: "(4, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the componentwise operation in a direct product, the element (3, 5) - (6, 8) in Z_7 x Z_9 is computed componentwise. In the first component, 3 - 6 = -3, and -3 mod 7 = 4. In the second component, 5 - 8 = -3, and -3 mod 9 = 6. The difference is (4, 6)."
          - problem: "In Z_5 x Z_8, compute 3(4, 6). Give the answer as (a, b)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the componentwise operation in a direct product, 3(4, 6) in Z_5 x Z_8 means componentwise repeated addition. The first component is 3*4 = 12, and 12 mod 5 = 2. The second component is 3*6 = 18, and 18 mod 8 = 2. The result is (2, 2)."
          - problem: "In Z_3 x Z_4 x Z_5, compute (2, 3, 4) + (2, 3, 3). Give the answer as (a, b, c)."
            answer: "(1, 2, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "By the componentwise operation in a direct product, the element (2, 3, 4) + (2, 3, 3) in Z_3 x Z_4 x Z_5 is computed componentwise. First: 2+2=4, 4 mod 3 = 1. Second: 3+3=6, 6 mod 4 = 2. Third: 4+3=7, 7 mod 5 = 2. The sum is (1, 2, 2)."
          - problem: "In Z_7 x Z_11, find the additive inverse of (2, 3). Give the answer as (a, b)."
            answer: "(5, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the componentwise operation in a direct product, the element (2, 3) in Z_7 x Z_11 has an additive inverse found componentwise. First component: -2 mod 7 = 5. Second component: -3 mod 11 = 8. The inverse is (5, 8)."
        constraints: "2-3 factors, each Z_n with n <= 12; componentwise arithmetic"
      - id: kp2
        name: "Orders of elements: the lcm rule"
        key_prerequisites: [order-of-an-element]
        exemplars:
          - problem: 'Find the order of $(2, 3)$ in $\mathbb{Z}_4 \times \mathbb{Z}_6$.'
            answer: "2"
            solution_sketch: '$|2|$ in $\mathbb{Z}_4$ is $2$; $|3|$ in $\mathbb{Z}_6$ is $2$; the order of the pair is $\mathrm{lcm}(2,2) = 2$.'
          - problem: 'How many elements of order $12$ does $\mathbb{Z}_4 \times \mathbb{Z}_6$ contain?'
            answer: "8"
            solution_sketch: 'Need $\mathrm{lcm}(|a|, |b|) = 12$: $|a| = 4$ ($2$ choices) and $|b| \in \{3, 6\}$ ($2 + 2 = 4$ choices), giving $2 \cdot 4 = 8$.'
          - problem: "In the group Z_8 x Z_12, find the order of the element (1, 2)."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is (1, 2) in Z_8 x Z_12. In Z_8, the order of 1 is 8 by the component order formula. In Z_12, the order of 2 is 6 because gcd(2, 12) = 2. The lcm rule gives lcm(8, 6) = 24. The order is 24."
          - problem: "Find the order of (3, 4) in Z_6 x Z_8."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is (3, 4) in Z_6 x Z_8. In Z_6, the order of 3 is 2 because 3 + 3 = 0 and 3 is not 0. In Z_8, the order of 4 is 2 because 4 + 4 = 0 and 4 is not 0. The lcm rule gives lcm(2, 2) = 2. The order is 2."
          - problem: "Determine the number of elements of order 4 in Z_4 x Z_8."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group is Z_4 x Z_8. In Z_4, the counts by order are 1, 1, 2 for orders 1, 2, 4. In Z_8, the counts are 1, 1, 2, 4 for orders 1, 2, 4, 8. The lcm rule requires lcm(|a|, |b|) = 4. The valid pairs of component orders are (1,4), (2,4), (4,1), (4,2), and (4,4), giving 1*2 + 1*2 + 2*1 + 2*1 + 2*2 = 12. The number of elements is 12."
          - problem: "In Z_4 x Z_6, determine how many elements have order 2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group is Z_4 x Z_6. In Z_4, the elements with order dividing 2 are 0 and 2, two choices. In Z_6, the elements with order dividing 2 are 0 and 3, two choices. The lcm rule gives order 2 exactly when the two component orders are not both 1. Thus the count is 2 times 2 minus 1, which is 3. The number of elements is 3."
        constraints: "orders via lcm of component orders; counting elements of a given order in products of two cyclic groups"
      - id: kp3
        name: "When Z_m x Z_n is cyclic"
        key_prerequisites: [cyclic-groups-generators]
        exemplars:
          - problem: 'The product $\mathbb{Z}_2 \times \mathbb{Z}_3$ is cyclic, so it is isomorphic to $\mathbb{Z}_n$. Give $n$.'
            answer: "6"
            solution_sketch: '$\mathbb{Z}_m \times \mathbb{Z}_n$ is cyclic iff $\gcd(m,n) = 1$, and then it is $\mathbb{Z}_{mn}$: here $\gcd(2,3) = 1$, so the product is $\mathbb{Z}_6$. By contrast $\mathbb{Z}_4 \times \mathbb{Z}_6$ is not cyclic, since its maximum element order is $\mathrm{lcm}(4,6) = 12 < 24$.'
          - problem: 'What is the largest order of an element of $\mathbb{Z}_4 \times \mathbb{Z}_6$?'
            answer: "12"
            solution_sketch: '$\mathrm{lcm}$ of component orders is maximized at $\mathrm{lcm}(4, 6) = 12$, e.g. by $(1,1)$.'
          - problem: "The product Z_3 x Z_5 is cyclic, so it is isomorphic to Z_n. Give n."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the gcd criterion for direct products of cyclic groups. Since gcd(3,5) = 1, the product is cyclic. Step 2: a cyclic product of orders 3 and 5 is isomorphic to the cyclic group of order 3 times 5. The value of n is 15."
          - problem: "What is the largest order of an element of Z_8 x Z_12?"
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: in a direct product, the order of an element is the lcm of its component orders. Step 2: the largest component orders are 8 and 12, so the largest possible order is lcm(8,12). Step 3: lcm(8,12) = 24. The largest order is 24."
          - problem: "Find the least positive integer n such that Z_9 x Z_10 is isomorphic to Z_n."
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply the gcd criterion. Since gcd(9,10) = 1, the product is cyclic. Step 2: a cyclic product of orders 9 and 10 is isomorphic to the cyclic group of order 9 times 10. Step 3: 9 times 10 = 90, so n = 90."
          - problem: "Find the smallest integer m > 1 for which Z_m x Z_6 is cyclic."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the product Z_m x Z_6 is cyclic exactly when gcd(m,6) = 1. Step 2: test m > 1: m = 2 gives gcd 2, m = 3 gives gcd 3, m = 4 gives gcd 2, and m = 5 gives gcd 1. Step 3: the smallest such m is 5."
        constraints: "gcd criterion; m, n <= 15"
    diagnostic_exemplar:
      problem: 'What is the largest order of an element of $\mathbb{Z}_6 \times \mathbb{Z}_{10}$?'
      answer: '30'
      solution_sketch: 'The order of $(a,b)$ is $\mathrm{lcm}(|a|,|b|)$, and the largest orders available in the factors are $6$ and $10$, so the maximum is $\mathrm{lcm}(6,10) = 30$, attained by $(1,1)$. Since $30 < 60$, the group is not cyclic.'
    anki_seeds:
      - front: "Order of $(a, b)$ in $A \\times B$?"
        back: "$\\mathrm{lcm}(|a|, |b|)$."
        type: basic
      - front: "$\\mathbb{Z}_m \\times \\mathbb{Z}_n$ is cyclic iff..."
        back: "$\\gcd(m, n) = 1$ (and then it is $\\cong \\mathbb{Z}_{mn}$)."
        type: basic

  - id: internal-direct-products
    name: "Internal Direct Products"
    core: false                # recognition criterion consumed only by the supplemental structure run (sylow-theorems' order-pq arguments); nothing core builds on it
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - {id: group-isomorphisms, weight: 0.5, key: false}          # L1: kp2/kp3/diagnostic conclude 'G = H x K' -- isomorphism was untaught in closure
      - id: direct-products
        weight: 0.8
        key: true
      - id: normal-subgroups
        weight: 0.8
        key: true
      - id: lagranges-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "The product set HK and the counting formula |HK| = |H||K|/|H ∩ K|"
        key_prerequisites: [lagranges-theorem, normal-subgroups]
        exemplars:
          - problem: "In S_3, let H = < (1 2) > and K = < (1 3) >. State whether the product set HK is closed under the operation and closed under inverses, and compute |HK|."
            answer: "verdict = notsubgroup; order = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["subgroup"], ["notsubgroup"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "order"}]}
            solution_sketch: "First find the intersection: H has order 2 and K has order 2, and H ∩ K = {e}, so |H ∩ K| = 1. The counting formula gives |HK| = |H||K|/|H ∩ K| = 2*2/1 = 4. Lagrange's theorem says a subgroup of S_3 has order dividing 6, and 4 does not divide 6, so HK is not a subgroup. The option subgroup is wrong because it ignores this divisibility test. So verdict = notsubgroup; order = 4."
          - problem: "In Z_12, let H = <2> and K = <3>. Compute |H+K|."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the intersection: H = {0,2,4,6,8,10} and K = {0,3,6,9}, so H ∩ K = {0,6} = <6>, which has size 2. The orders are |H| = 6 and |K| = 4. The counting formula gives |H+K| = |H||K|/|H ∩ K| = 6*4/2 = 12. So |H+K| = 12."
          - problem: "In D_4, let r be a rotation by 90 degrees and s a reflection. Let H = <r> and K = <s>. Compute |HK|."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the intersection: H is the rotation subgroup of order 4 and K = {e, s} has order 2, and H ∩ K = {e}, so |H ∩ K| = 1. The counting formula gives |HK| = |H||K|/|H ∩ K| = 4*2/1 = 8. So |HK| = 8."
          - problem: "In Z_18, let H = <3> and K = <6>. Compute |H+K|."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the intersection: H = <3> has order 6 and K = <6> has order 3, and H ∩ K = <6> = {0,6,12}, which has size 3. The counting formula gives |H+K| = |H||K|/|H ∩ K| = 6*3/3 = 6. So |H+K| = 6."
          - problem: "In S_3, let H = < (1 2 3) > and K = < (1 2) >. Compute |HK|."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the intersection: H is the alternating subgroup of order 3 and K has order 2, and H ∩ K = {e}, so |H ∩ K| = 1. The counting formula gives |HK| = |H||K|/|H ∩ K| = 3*2/1 = 6. So |HK| = 6."
          - problem: "In Z_10, let H be the subgroup generated by 2 and K the subgroup generated by 5. Find |H+K|."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the intersection: H = <2> has order 5 and K = <5> has order 2, and H ∩ K = {0}, so |H ∩ K| = 1. The counting formula gives |H+K| = |H||K|/|H ∩ K| = 5*2/1 = 10. So |H+K| = 10."
        constraints: "|HK| computations in Z_n (n <= 24), S_3, D_4; each solution states H ∩ K explicitly; one problem per set draws a subgroup/non-subgroup conclusion via Lagrange"
      - id: kp2
        name: "The recognition criterion: G is an internal direct product"
        key_prerequisites: [normal-subgroups, direct-products]
        exemplars:
          - problem: "In the group Z_12, let H = <3> and K = <4>. These subgroups are normal and satisfy H ∩ K = {0} and H + K = Z_12. Find h + k - h - k for h = 3 and k = 4."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The commutator trick says that elements of H and K commute when H ∩ K is trivial. In the abelian group Z_12, h + k - h - k = 3 + 4 - 3 - 4 = 0. The answer is 0."
          - problem: "For G = Z_6, let H = <2> and K = <3>. Check all three recognition conditions: normality, trivial intersection, and product equal to G. Give d = |H ∩ K| and m = |HK|."
            answer: "d = 1; m = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "First list the subgroups: H = {0,2,4} and K = {0,3}. Normality: Z_6 is abelian, so every subgroup is normal. Intersection: H ∩ K = {0}, so d = 1. Product order: |HK| = |H||K|/|H ∩ K| = 3*2/1 = 6, so m = 6. The answer is d = 1; m = 6."
          - problem: "For G = Z_12, let H = <3> and K = <4>. Check all three recognition conditions: normality, trivial intersection, and product equal to G. Give d = |H ∩ K| and m = |HK|."
            answer: "d = 1; m = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "First list the subgroups: H = {0,3,6,9} and K = {0,4,8}. Normality: Z_12 is abelian, so all subgroups are normal. Intersection: H ∩ K = {0}, so d = 1. Product order: |HK| = |H||K|/|H ∩ K| = 4*3/1 = 12, so m = 12. The answer is d = 1; m = 12."
          - problem: "For G = Z_12, let H = <2> and K = <3>. Check the three recognition conditions: normality, size of the intersection, and size of the product. Give d = |H ∩ K| and m = |HK|."
            answer: "d = 2; m = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "First list the subgroups: H = {0,2,4,6,8,10} and K = {0,3,6,9}. Normality: Z_12 is abelian, so H and K are normal. Intersection: H ∩ K = {0,6}, so d = 2. Product order: |HK| = |H||K|/|H ∩ K| = 6*4/2 = 12, so m = 12. The answer is d = 2; m = 12."
          - problem: "In D_4 with rotation r and reflection s, let H = <r^2> and K = <r>. Check the three recognition conditions: normality, size of the intersection, and size of the product. Give d = |H ∩ K| and m = |HK|."
            answer: "d = 2; m = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "First list the subgroups: H = {e, r^2} and K = {e, r, r^2, r^3}. Normality: r^2 commutes with r and s, so H is normal; K has index 2, so K is normal. Intersection: H ∩ K = {e, r^2}, so d = 2. Product order: H is contained in K, so HK = K and m = 4. The answer is d = 2; m = 4."
          - problem: "In D_6 of order 12 with rotation r and reflection s, let H = <r^2, s> and K = <r^3>. Check the three recognition conditions: normality, size of the intersection, and size of the product. Give d = |H ∩ K| and m = |HK|."
            answer: "d = 1; m = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "First list the subgroups: H = {e, r^2, r^4, s, s r^2, s r^4} and K = {e, r^3}. Normality: H has index 2, so H is normal; r^3 is central, so K is normal. Intersection: H ∩ K = {e}, so d = 1. Product order: |HK| = |H||K|/|H ∩ K| = 6*2/1 = 12, so m = 12. The answer is d = 1; m = 12."
        constraints: "the commutator trick proved once then citable; verifications in Z_n (n <= 24) and D_n; every verification checks all three conditions explicitly"
      - id: kp3
        name: "Coprime-order applications"
        key_prerequisites: [lagranges-theorem, direct-products, normal-subgroups]
        exemplars:
          - problem: "A group G has order 15. Its normal subgroup H has order 3 and its normal subgroup K has order 5. Find the order of H ∩ K."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the intersection H ∩ K is a subgroup of H and of K. Step 2 (Lagrange): |H ∩ K| divides |H| = 3 and |K| = 5, so it divides gcd(3,5) = 1. The only positive divisor of 1 is 1, so the order of H ∩ K is 1."
          - problem: "A group G of order 20 contains normal subgroups P of order 4 and Q of order 5. Compute the order of PQ."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: P ∩ Q is a subgroup of both P and Q. Step 2 (Lagrange): |P ∩ Q| divides |P| = 4 and |Q| = 5, so it divides gcd(4,5) = 1, hence P ∩ Q is trivial. Step 3 (product formula): |PQ| = |P||Q|/|P ∩ Q| = 4*5/1 = 20. The order of PQ is 20."
          - problem: "Let G be a group of order 45 with a normal subgroup H of order 9 and a normal subgroup K of order 5. Determine the order of the product HK."
            answer: "45"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: H ∩ K is a subgroup of H and of K. Step 2 (Lagrange): |H ∩ K| divides |H| = 9 and |K| = 5, so it divides gcd(9,5) = 1, so H ∩ K is trivial. Step 3 (product formula): |HK| = |H||K|/|H ∩ K| = 9*5/1 = 45. The order of HK is 45."
          - problem: "The group G has order 21. It has normal subgroups H and K of orders 3 and 7. What is the order of HK?"
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the intersection H ∩ K is a subgroup of H and of K. Step 2 (Lagrange): |H ∩ K| divides |H| = 3 and |K| = 7, hence divides gcd(3,7) = 1 and is 1. Step 3 (product formula): |HK| = |H||K|/|H ∩ K| = 3*7/1 = 21. The order of HK is 21."
          - problem: "Let G have order 33, with normal subgroups H of order 3 and K of order 11. Find the order of HK."
            answer: "33"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: H ∩ K is a subgroup of H and of K. Step 2 (Lagrange): |H ∩ K| divides |H| = 3 and |K| = 11, so it divides gcd(3,11) = 1, hence H ∩ K is trivial. Step 3 (product formula): |HK| = |H||K|/|H ∩ K| = 3*11/1 = 33. The order of HK is 33."
          - problem: "A group G of order 77 has normal subgroups H of order 7 and K of order 11. Give the order of HK."
            answer: "77"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: H ∩ K is a subgroup of H and of K. Step 2 (Lagrange): |H ∩ K| divides |H| = 7 and |K| = 11, so it divides gcd(7,11) = 1, hence H ∩ K is trivial. Step 3 (product formula): |HK| = |H||K|/|H ∩ K| = 7*11/1 = 77. The order of HK is 77."
        constraints: "orders pq or p^2 q with p, q <= 11; the intersection-divides-gcd step justified by Lagrange every time"
    diagnostic_exemplar:
      problem: 'A group $G$ of order $35$ has normal subgroups $H \cong \mathbb{Z}_5$ and $K \cong \mathbb{Z}_7$. Show $H \cap K = \{e\}$, compute $|HK|$, and identify $G$ up to isomorphism.'
      answer: '$|H \cap K|$ divides $\gcd(5, 7) = 1$, so $H \cap K = \{e\}$; $|HK| = \frac{5 \cdot 7}{1} = 35$, so $HK = G$; the recognition criterion gives $G \cong \mathbb{Z}_5 \times \mathbb{Z}_7 \cong \mathbb{Z}_{35}$.'
      answer_contract: {kind: none}
      solution_sketch: 'Lagrange forces the trivial intersection, the counting formula forces $HK = G$, and coprime cyclic factors multiply to a cyclic group.'
    anki_seeds:
      - front: "Internal direct product recognition criterion?"
        back: "$H, K \\trianglelefteq G$, $H \\cap K = \\{e\\}$, $HK = G$ $\\implies$ $G \\cong H \\times K$ via $(h,k) \\mapsto hk$."
        type: basic
      - front: "$|HK| = $ ? (finite subgroups $H, K$)"
        back: "$\\dfrac{|H|\\,|K|}{|H \\cap K|}$."
        type: basic
      - front: "Why do $H$ and $K$ commute elementwise when both are normal with $H \\cap K = \\{e\\}$?"
        back: "The commutator $hkh^{-1}k^{-1}$ lies in both $H$ and $K$, hence equals $e$."
        type: basic

