        back: "Cyclic (isomorphic to $\\mathbb{Z}_p$), generated by any non-identity element."
        type: basic
      - front: "Fermat's little theorem as a statement about $U(p)$?"
        back: "$|U(p)| = p-1$, so $a^{p-1} \\equiv 1 \\pmod p$ whenever $p \\nmid a$."
        type: basic

  - id: normal-subgroups
    name: "Normal Subgroups"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: cosets
        weight: 0.9
        key: true
      - id: even-odd-permutations
        weight: 0.4
        key: false
      - id: dihedral-groups
        weight: 0.3
        key: false
      # Phase C: kp1 proves every subgroup of an abelian group is normal — a direct
      # commutativity manipulation taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Definition and the conjugation test"
        key_prerequisites: [cosets]
        step_check:
          step: '$gng^{-1}$ will also be a product of two disjoint transpositions'
          question: 'Why is $gng^{-1}$ again a product of two disjoint transpositions?'
          options:
            - 'Conjugation multiplies $n$ by $g$ on one side, and $g$ is also a double transposition'
            - 'Conjugation renames the points in the cycles of $n$, so the cycle type is kept'
            - 'Every permutation of $S_4$ is a product of two disjoint transpositions'
            - 'Conjugation always returns $n$ itself, so nothing about $n$ can change at all'
          answer: 'Conjugation renames the points in the cycles of $n$, so the cycle type is kept'
          why: 'Conjugating by $g$ replaces each point $x$ in the cycles of $n$ by $g(x)$. The cycle structure is unchanged, so two disjoint transpositions stay two disjoint transpositions.'
        exemplars:
          - problem: 'In $S_3$ (composing right to left) conjugate the transposition $(1\,3)$ by $g = (1\,2)$, that is, form $g(1\,3)g^{-1} = (1\,2)(1\,3)(1\,2)$. What is the image of $2$ under this permutation?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Apply the factors right to left to the point $2$. The rightmost $(1\,2)$ sends $2$ to $1$, then $(1\,3)$ sends $1$ to $3$, then the leftmost $(1\,2)$ fixes $3$. So the image of $2$ is $3$, and the conjugate is $(2\,3)$.'
          - problem: 'The symmetries of a square form the group $D_4$. Let $r$ be a quarter turn and $s$ a reflection, with $srs^{-1} = r^{-1}$. Write $sr^3s^{-1}$ in the form $r^k$ with $0 \le k \le 3$. What is $k$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation respects powers, so $sr^3s^{-1} = (srs^{-1})^3 = (r^{-1})^3 = r^{-3}$. Since $r^4 = e$, we have $r^{-3} = r^{4-3} = r$. So $k = 1$.'
          - problem: 'The symmetries of a square form the group $D_4$. Let $r$ be a quarter turn and $s$ a reflection, with $srs^{-1} = r^{-1}$, and let $N = \{e, r^2\}$. Write $sr^2s^{-1}$ in the form $r^k$ with $0 \le k \le 3$. What is $k$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $sr^2s^{-1} = (srs^{-1})^2 = (r^{-1})^2 = r^{-2}$. Since $r^4 = e$, we get $r^{-2} = r^2$. So $k = 2$, and the conjugate of $r^2$ lies in $N$.'
          - problem: 'In the additive group $\mathbb{Z}_{12}$ let $N = \{0, 6\}$. For $g = 5$ and $n = 6$, compute $g + n - g$ in $\mathbb{Z}_{12}$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In an additive group the conjugate of $n$ by $g$ is $g + n - g$. Addition in $\mathbb{Z}_{12}$ is commutative, so $5 + 6 - 5 = 6 + (5 - 5) = 6$. So the value is $6$, which lies in $N$.'
          - problem: 'The symmetries of a square form the group $D_4$ with quarter turn $r$ and reflection $s$, where $srs^{-1} = r^{-1}$. Is the subgroup $N = \{e, r^2\}$ normal in $D_4$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is normal","normal","it is"],["no","it is not normal","not normal","it is not"]]}
            solution_sketch: 'Every element of $D_4$ has the form $r^k$ or $r^k s$. Conjugating $r^2$ by $r^k$ gives $r^2$ again, and conjugating by $s$ gives $sr^2s^{-1} = r^{-2} = r^2$. Conjugation keeps $r^2$ inside $N$, and it keeps $e$, so $N$ is normal.'
          - problem: 'Sam argues: Claim: every subgroup $N$ of an abelian group $G$ is normal. Step 1: let $g$ be in $G$ and $n$ in $N$. Step 2: since $G$ is abelian, $gng^{-1} = ngg^{-1} = n$. Step 3: the element $ng$ lies in $N$ because $n$ is in $N$ and $G$ is abelian. Step 4: hence $gng^{-1}$ is in $N$ for all $g$ and $n$, so $N$ is normal. Which is the first step that is not valid?'
            answer: 'Step 3'
            answer_contract: {"kind":"label","options":[["Step 1","1","the first step"],["Step 2","2","the second step"],["Step 3","3","the third step"],["Step 4","4","the fourth step"]]}
            solution_sketch: 'Step 1 is a correct setup, and Step 2 is correct because commutativity gives $ngg^{-1} = n$. Step 3 is not valid: $g$ need not lie in $N$, so $ng$ lies in the coset $Ng$ and not necessarily in $N$. Step 4 only needs $gng^{-1} = n$, which is already in $N$. So the first invalid step is Step 3.'
          - problem: 'In the additive group $\mathbb{Z}_9$ let $N = \{0, 3, 6\}$. For $g = 7$ and $n = 3$, compute $g + n - g$ in $\mathbb{Z}_9$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate of $n$ by $g$ in an additive group is $g + n - g$. Here $7 + 3 - 7 = 3$, because the two copies of $7$ cancel. So the value is $3$, which lies in $N$.'
          - problem: 'Write the full proof: a subgroup $N$ of $G$ satisfies $gN = Ng$ for every $g$ in $G$ exactly when $gng^{-1}$ lies in $N$ for every $g$ in $G$ and $n$ in $N$. Then compare with the solution.'
            answer: 'gN = Ng for all g iff N is closed under conjugation.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Suppose $gN = Ng$ for all $g$ and take $n$ in $N$. Then $gn = mg$ for some $m$ in $N$, so $gng^{-1} = m$ lies in $N$. Conversely, suppose $gng^{-1}$ lies in $N$ for all $g$ and $n$. For $gn$ in $gN$ write $gn = (gng^{-1})g$, which lies in $Ng$, so $gN \subseteq Ng$. Applying this to $g^{-1}$ gives $Ng \subseteq gN$, hence $gN = Ng$.'
        constraints: 'definition unwinding; conjugation test gng^{-1} in N; answers are images, exponents or verdicts, never a permutation written in cycle notation; two or more symmetry-of-a-square items'
      - id: kp2
        name: "Testing normality in S_3, D_4, A_n"
        key_prerequisites: [cosets, even-odd-permutations]
        step_check:
          step: 'conjugating $(1\,3)$ by $(1\,2)$ relabels the moved points'
          question: 'Why does conjugating $(1\,3)$ by $(1\,2)$ give a transposition again?'
          options:
            - 'The conjugating element $(1\,2)$ is itself a transposition, so the result is one too'
            - 'Conjugation never changes which points a permutation moves, so $(1\,3)$ stays as it is'
            - 'Conjugation renames the two points that $(1\,3)$ swaps, so it still swaps two'
            - 'Conjugating by any element always returns the original permutation without change'
          answer: 'Conjugation renames the two points that $(1\,3)$ swaps, so it still swaps two'
          why: 'Conjugating by $g$ replaces each point $x$ in the cycles of the permutation by $g(x)$. A swap of two points becomes a swap of the two renamed points, here $(2\,3)$.'
        exemplars:
          - problem: 'Is the subgroup $H = \{e, (1\,3)\}$ normal in $S_3$? (Compose right to left.)'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is normal","normal","it is"],["no","it is not normal","not normal","it is not"]]}
            solution_sketch: 'Conjugate $(1\,3)$ by $g = (1\,2)$. The conjugate $(1\,2)(1\,3)(1\,2)$ is $(2\,3)$, which is neither $e$ nor $(1\,3)$. So $H$ is not closed under conjugation, and $H$ is not normal.'
          - problem: 'In $S_3$ (composing right to left) conjugate $h = (1\,2)$ by $s = (1\,3)$, that is, form $s h s^{-1} = (1\,3)(1\,2)(1\,3)$. What is the image of $2$ under this permutation?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation by $s$ renames the points of $h$ using $s$. The point $1$ becomes $3$ and the point $2$ stays $2$, so $(1\,2)$ becomes $(3\,2)$. Hence the image of $2$ is $3$.'
          - problem: 'In $S_4$ (composing right to left) conjugate the $3$-cycle $(1\,2\,3)$ by the transposition $(1\,4)$, that is, form $(1\,4)(1\,2\,3)(1\,4)$. What is the image of $4$ under this permutation?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation renames each entry of the cycle using $(1\,4)$: $1$ becomes $4$, while $2$ and $3$ stay. So the result is the cycle $(4\,2\,3)$, and it sends $4$ to $2$.'
          - problem: 'The symmetries of a square form the group $D_4$ with quarter turn $r$ and reflection $s$, where $srs^{-1} = r^{-1}$. How many symmetries have the form $gsg^{-1}$ for some $g$ in $D_4$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugating $s$ by $r^k$ gives $r^k s r^{-k} = r^{2k} s$, because $sr^{-k} = r^k s$. This takes only two values, $s$ and $r^2 s$, and conjugating by $r^k s$ gives the same two values. So there are $2$ conjugates of $s$.'
          - problem: 'In $S_3$, how many elements are conjugate to the transposition $(1\,2)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugating a transposition renames the two points it swaps, so the result is again a transposition. $S_3$ has exactly three transpositions $(1\,2)$, $(1\,3)$ and $(2\,3)$, and each is a conjugate of $(1\,2)$. So there are $3$ conjugates.'
          - problem: 'Three cards are numbered $1$, $2$, $3$. A shuffle $t$ swaps cards $1$ and $2$ and leaves card $3$ in place. Let $s$ be the shuffle that swaps cards $1$ and $3$, and compose right to left. The shuffle $sts^{-1}$ swaps two cards and leaves one in place. Which card does it leave in place?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation by $s$ renames the cards that $t$ swaps. Card $1$ becomes card $3$ and card $2$ stays card $2$, so $sts^{-1}$ swaps cards $3$ and $2$. The card it leaves in place is $1$.'
          - problem: 'The symmetries of a square permute its corners, numbered $1, 2, 3, 4$ in order round the square. Let $t$ be the reflection that swaps corners $2$ and $4$ and leaves corners $1$ and $3$ in place. Let $g$ be the quarter turn that sends corner $1$ to $2$, $2$ to $3$, $3$ to $4$ and $4$ to $1$. Compose right to left. The symmetry $gtg^{-1}$ is again a reflection in a diagonal. Which corners does it leave in place?'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation by $g$ renames the corners that $t$ swaps, using $g$. Corner $2$ becomes corner $3$ and corner $4$ becomes corner $1$, so $gtg^{-1}$ swaps corners $3$ and $1$. It leaves corners $2$ and $4$ in place.'
          - problem: 'In $S_4$, how many permutations are conjugate to the $3$-cycle $(1\,2\,3)$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Conjugation renames the points of the cycle, so every conjugate is a $3$-cycle. Conversely every $3$-cycle is a conjugate, because some permutation relabels $1, 2, 3$ as any chosen three points in a chosen order. $S_4$ has $4 \cdot 2 = 8$ three-cycles, so the answer is $8$.'
          - problem: 'Is the alternating group $A_4$ normal in $S_4$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is normal","normal","it is"],["no","it is not normal","not normal","it is not"]]}
            solution_sketch: 'The sign of a product is the product of the signs, so $\operatorname{sign}(gng^{-1}) = \operatorname{sign}(g)\operatorname{sign}(n)\operatorname{sign}(g)^{-1} = \operatorname{sign}(n)$. A conjugate of an even permutation is even. So $A_4$ is closed under conjugation and is normal in $S_4$.'
          - problem: 'Write the full proof: $A_n$ is normal in $S_n$. Then compare with the solution.'
            answer: 'The alternating group is normal in S_n.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $s$ be in $S_n$ and $t$ in $A_n$. The sign is multiplicative, so $\operatorname{sign}(sts^{-1}) = \operatorname{sign}(s)\operatorname{sign}(t)\operatorname{sign}(s)^{-1} = \operatorname{sign}(t) = 1$. So $sts^{-1}$ is even and lies in $A_n$. Hence $A_n$ is closed under conjugation, which is the definition of a normal subgroup.'
        constraints: 'concrete conjugation checks in S_3, S_4, D_4; standard normal examples A_n, rotation subgroup of D_n; answers are images of a point, counts or verdicts, never cycle notation'
      - id: kp3
        name: "Index 2 forces normality"
        key_prerequisites: [cosets]
        step_check:
          step: '$[S_3 : K] = \frac{6}{2} = 3$'
          question: 'Why is the index of $K$ in $S_3$ equal to $3$?'
          options:
            - 'The index equals the number of elements of $S_3$ that are not in $K$'
            - 'The index equals the order of $K$ plus one, because $K$ has two elements'
            - 'The index equals the number of subgroups of $S_3$ that contain $K$ itself'
            - 'The index is $|S_3|$ divided by $|K|$, the number of left cosets'
          answer: 'The index is $|S_3|$ divided by $|K|$, the number of left cosets'
          why: 'The left cosets of $K$ do not overlap and each has $|K| = 2$ elements, so their number is $6 \div 2 = 3$. The index counts cosets, not elements or subgroups.'
        exemplars:
          - problem: 'In the dihedral group $D_6$ of order $12$, the rotation subgroup $R = \langle r \rangle$ has order $6$. Find the index $[D_6 : R]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange''s theorem the index is the order of the group divided by the order of the subgroup. So $[D_6 : R] = 12 \div 6 = 2$.'
          - problem: 'Let $H$ be a subgroup of index $2$ in a group $G$, and let $g$ be an element of $G$ outside $H$. If $H$ has $7$ elements, how many elements does the coset $gH$ have?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $x \mapsto gx$ is a bijection from $H$ onto $gH$. So $gH$ has as many elements as $H$, which is $7$.'
          - problem: 'Sam argues: Claim: if $H$ has index $2$ in $G$, then $H$ is normal. Step 1: the left cosets of $H$ are $H$ and $gH$, where $g$ is outside $H$. Step 2: the right cosets are $H$ and $Hg$. Step 3: since $gH$ and $Hg$ have the same number of elements, $gH = Hg$. Step 4: so $gH = Hg$ for every $g$ in $G$, and $H$ is normal. Which is the first step that is not valid?'
            answer: 'Step 3'
            answer_contract: {"kind":"label","options":[["Step 1","1","the first step"],["Step 2","2","the second step"],["Step 3","3","the third step"],["Step 4","4","the fourth step"]]}
            solution_sketch: 'Step 1 and Step 2 are valid, because with two cosets the one containing $g$ is the other coset. Step 3 is not valid: two sets with the same size need not be equal. The correct reason is that both $gH$ and $Hg$ equal the complement of $H$ in $G$. So the first invalid step is Step 3.'
          - problem: 'A subgroup $H$ has index $2$ in a finite group $G$ with $26$ elements. How many elements of $G$ lie outside $H$?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Lagrange''s theorem $|H| = 26 \div 2 = 13$. The other left coset has the same size and consists of exactly the elements outside $H$. So $13$ elements lie outside $H$.'
          - problem: 'The $120$ rearrangements of five books form the group $S_5$. The rearrangements made of an even number of swaps form the subgroup $A_5$ of order $60$. How many rearrangements are made of an odd number of swaps?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subgroup $A_5$ has index $120 \div 60 = 2$, so there is one other left coset. It contains the rearrangements outside $A_5$, and it has the same size, $60$. So $60$ rearrangements use an odd number of swaps.'
          - problem: 'A group $G$ has $18$ elements and a subgroup $H$ has $9$ elements. Is $H$ normal in $G$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is normal","normal","it is"],["no","it is not normal","not normal","it is not"]]}
            solution_sketch: 'The index is $18 \div 9 = 2$. A subgroup of index $2$ has the same left and right cosets: for $g$ outside $H$, both $gH$ and $Hg$ are the complement of $H$. So $H$ is normal.'
          - problem: 'In the symmetric group $S_5$, the alternating group $A_5$ consists of the even permutations. Compute the index $[S_5 : A_5]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $S_5$ has $5! = 120$ elements and $A_5$ has $60$ elements. By Lagrange''s theorem the index is $120 \div 60 = 2$.'
          - problem: 'A regular octagon has $16$ symmetries: $8$ rotations and $8$ reflections. How many left cosets does the subgroup of rotations have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of left cosets is the order of the group divided by the order of the subgroup. So there are $16 \div 8 = 2$ left cosets: the rotations and the reflections.'
          - problem: 'Write the full proof: if $H$ is a subgroup of index $2$ in a group $G$, then $H$ is normal in $G$. Then compare with the solution.'
            answer: 'A subgroup of index 2 is normal.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'If $g$ lies in $H$, then $gH = H = Hg$. If $g$ lies outside $H$, then $gH \ne H$, so with index $2$ the left cosets are $H$ and $gH$, and $gH$ is the complement of $H$. The same argument on the right shows that $Hg$ is the complement of $H$. So $gH = Hg$ for every $g$, and $H$ is normal.'
        constraints: 'the index-2 lemma and immediate applications; contexts: books and symmetries of a polygon; one error-analysis item and one proof request'
    diagnostic_exemplar:
      problem: 'Determine whether $N = \{e, (1\,2\,3), (1\,3\,2)\}$ is normal in $S_3$, and whether $K = \{e, (1\,3)\}$ is.'
      answer: '$N = A_3$ is normal (index $2$); $K$ is not: $(1\,2)(1\,3)(1\,2) = (2\,3) \notin K$.'
      solution_sketch: '$N$ has index $6/3 = 2$, hence is normal. For $K$, one conjugation lands outside.'
    anki_seeds:
      - front: "Conjugation test for normality?"
        back: "$N \\trianglelefteq G$ iff $gng^{-1} \\in N$ for all $g \\in G$, $n \\in N$."
        type: basic
      - front: "Any subgroup of index $2$ is..."
        back: "Normal."
        type: basic

  - id: quotient-groups
    name: "Quotient Groups"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: normal-subgroups
        weight: 0.9
        key: true
      - id: lagranges-theorem
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Well-defined coset multiplication'
        key_prerequisites: [normal-subgroups]
        try_first:
          problem: 'In $\mathbb{Z}_6$ let $H=\{0,3\}$. Adding the representatives $1$ and $2$ of the cosets $1+H$ and $2+H$ gives $3$. Add the representatives $4$ and $5$ of the same two cosets instead. What is the sum, reduced modulo $6$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The sum is $9\equiv3$, and $3$ and $3$ differ by $0\in H$, so both choices give the same coset $3+H$. Coset addition is well defined here because $H$ is normal.'
        step_check:
          step: 'Since $N$ is normal, $b^{-1}n_1b \in N$'
          question: 'Why does the normality of $N$ show that $b^{-1}n_1b$ lies in $N$?'
          options:
            - 'Normality means that $b$ itself lies in $N$, so the product $b^{-1}n_1b$ stays in $N$'
            - 'Normality means every conjugate $g^{-1}ng$ with $n\in N$ and $g\in G$ stays in $N$'
            - 'Normality means that $N$ is abelian, so $b$ and $n_1$ commute and $b^{-1}n_1b=n_1$'
            - 'Normality means that $N$ is finite, so conjugates of $n_1$ can only repeat elements'
          answer: 'Normality means every conjugate $g^{-1}ng$ with $n\in N$ and $g\in G$ stays in $N$'
          why: 'Normal means closed under conjugation by every element of $G$, and this is exactly what moves $n_1$ past $b$ in the proof; $N$ need not be abelian, and $b$ need not lie in $N$.'
        exemplars:
          - problem: 'Let $N$ be a subgroup of a group $G$. The product of cosets $(aN)(bN)=abN$ is well defined, that is, it does not depend on the representatives $a$ and $b$ chosen, exactly when one condition on $N$ holds. Which condition is it: $N$ is normal, $N$ is abelian, $N$ is cyclic, or $N$ is finite?'
            answer: 'normal'
            answer_contract: {"kind": "label", "options": [["normal", "N is normal", "normal subgroup", "a normal subgroup", "normality"], ["abelian", "N is abelian", "an abelian subgroup"], ["cyclic", "N is cyclic", "a cyclic subgroup"], ["finite", "N is finite", "a finite subgroup"]]}
            solution_sketch: 'The product is well defined exactly when $aN=Na$ for every $a$ in $G$, and this is the definition of $N$ being normal. Being abelian or cyclic is not enough: $\langle(1\,2)\rangle$ in $S_3$ is both, yet the product fails for it. Being finite is not enough for the same reason. So the condition is that $N$ is normal.'
          - problem: 'In a quotient group $G/N$, which coset is the inverse of the coset $aN$: $a^{-1}N$, $aN$, $eN$, or the element $a^{-1}$?'
            answer: 'a^-1 N'
            answer_contract: {"kind": "label", "options": [["a^-1 N", "a^{-1}N", "a^-1N", "a^{-1} N", "(a^-1)N", "the coset a^-1 N"], ["a N", "aN", "the coset aN"], ["e N", "eN", "the identity coset"], ["a^-1", "a^{-1}", "the element a^-1"]]}
            solution_sketch: 'The inverse of $aN$ is the coset $bN$ with $(aN)(bN)=N$, the identity coset. Since $(aN)(a^{-1}N)=aa^{-1}N=N$, the inverse is $a^{-1}N$. The coset $aN$ is the given coset, $eN$ is the identity coset, and $a^{-1}$ is an element of $G$ and not a coset.'
          - problem: 'How many subgroups $N$ of the symmetric group $S_3$ have the property that the coset product $(aN)(bN)=abN$ is well defined?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is well defined exactly for normal subgroups. The subgroups of $S_3$ are $\{e\}$, three subgroups of order $2$, $A_3$ and $S_3$. The subgroups $\{e\}$, $A_3$ and $S_3$ are normal, but each subgroup of order $2$ has conjugates that differ from it. So $3$ subgroups work.'
          - problem: 'How many subgroups $N$ of the cyclic group $\mathbb{Z}_{18}$ have the property that the coset sum $(a+N)+(b+N)=a+b+N$ is well defined?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $\mathbb{Z}_{18}$ is abelian, so every subgroup is normal and the coset sum is well defined for all of them. A cyclic group has exactly one subgroup for each divisor of its order. The divisors of $18$ are $1, 2, 3, 6, 9, 18$, so there are $6$ subgroups.'
          - problem: 'In $S_3$ let $N=\{e,(1\,2)\}$ and $x=(1\,3)$. The cosets $eN$ and $(1\,2)N$ are equal, since both equal $N$. Compute $(eN)(xN)$ and $((1\,2)N)(xN)$ with the rule $(aN)(bN)=abN$. How many different cosets do these two products give?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first product is $xN=(1\,3)N$ and the second is $(1\,2)(1\,3)N$. These two cosets are equal only if $x^{-1}(1\,2)x$ lies in $N$, but $(1\,3)(1\,2)(1\,3)=(2\,3)$ is not in $N$. So the two products are $2$ different cosets, although the factors were equal cosets. Hence $N$ is not normal and the product is not well defined.'
          - problem: 'Weekdays are numbered $0$ to $6$, and a day count $n$ stands for the coset $n+7\mathbb{Z}$. Ana adds $16$ days to the day count $3$, and Ben adds $16$ days to the day count $10$. They land on the same weekday. Which weekday number is it?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counts $3$ and $10$ differ by $7$, so they lie in the same coset of $7\mathbb{Z}$. Ana gets $3+16=19=2\cdot7+5$ and Ben gets $10+16=26=3\cdot7+5$. Both land on weekday number $5$, as the well-defined coset sum predicts.'
          - problem: 'A $30$-day month is numbered by $\mathbb{Z}_{30}$. A calendar for a $5$-day working week treats two days as the same weekday when they differ by a multiple of $5$, that is, when they lie in the same coset of $H=\langle 5\rangle$. How many different weekdays does this calendar have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H=\langle5\rangle=\{0,5,10,15,20,25\}$ has $6$ elements. The number of cosets is the group order divided by the subgroup order, so $|\mathbb{Z}_{30}|/|H|=30/6=5$. The calendar has $5$ different weekdays.'
          - problem: 'How many subgroups $N$ of the cyclic group $\mathbb{Z}_7$ have the property that the coset sum $(a+N)+(b+N)=a+b+N$ is well defined?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every subgroup of the abelian group $\mathbb{Z}_7$ is normal, so the coset sum is well defined for all of them. Since $7$ is prime, the only divisors of $7$ are $1$ and $7$, so there are exactly $2$ subgroups: $\{0\}$ and $\mathbb{Z}_7$.'
        constraints: 'definition-level questions on the quotient construction; counts of normal subgroups of S_3 and cyclic groups; checks of representative independence in Z_n and S_3'
      - id: kp2
        name: 'Computing in Z_n/H and Z/nZ'
        key_prerequisites: [normal-subgroups, lagranges-theorem]
        step_check:
          step: 'Test successive multiples of $4$ and check membership in $H$'
          question: 'Why do we test whether the multiples of $4$ lie in $H$, instead of testing whether they equal $0$?'
          options:
            - 'The order of $4+H$ in the quotient equals the order of $4$ itself in the group $\mathbb{Z}_{18}$'
            - 'Only multiples of $4$ that are multiples of $3$ can lie in $H$, because $|H|=3$ in this case'
            - 'Because $4$ must first be shown to lie in $H$ before the coset $4+H$ is a coset at all'
            - 'The identity of $\mathbb{Z}_{18}/H$ is the coset $H$, and $k(4+H)=H$ exactly when $4k\in H$'
          answer: 'The identity of $\mathbb{Z}_{18}/H$ is the coset $H$, and $k(4+H)=H$ exactly when $4k\in H$'
          why: 'A coset equals the identity coset exactly when its representative lies in $H$, so the order counts multiples landing in $H$, not only those equal to $0$; here $12\in H$ already at $k=3$.'
        exemplars:
          - problem: 'In $\mathbb{Z}_{20}$ let $H=\langle5\rangle$. What is the order of the element $4+H$ of the quotient group $\mathbb{Z}_{20}/H$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,5,10,15\}$. The order of $4+H$ is the smallest $k>0$ with $4k\in H$. The multiples $4,8,12,16$ are not in $H$, but $4\cdot5=20=0$ is in $H$, so the order is $5$.'
          - problem: 'In $\mathbb{Z}_{12}$ let $H=\langle4\rangle$. What is the order of the coset $2+H$ in $\mathbb{Z}_{12}/H$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,4,8\}$. The coset $2+H$ is not the identity coset because $2\notin H$. But $2\cdot2=4$ lies in $H$, so $2(2+H)=H$ and the order is $2$.'
          - problem: 'In $\mathbb{Z}/12\mathbb{Z}$, what is the order of the element $8+12\mathbb{Z}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order is the smallest $k>0$ for which $8k$ is a multiple of $12$. Since $\gcd(8,12)=4$, this $k$ is $12/4=3$. Indeed $8\cdot3=24$ is a multiple of $12$, while $8$ and $16$ are not.'
          - problem: 'Which group is $\mathbb{Z}/6\mathbb{Z}$ isomorphic to: $\mathbb{Z}_6$, $S_3$, $\mathbb{Z}_3$, or $\mathbb{Z}_2$?'
            answer: 'Z6'
            answer_contract: {"kind": "label", "options": [["Z6", "Z_6", "Z/6", "cyclic of order 6", "the cyclic group of order 6", "C6"], ["S3", "S_3", "the symmetric group S3"], ["Z3", "Z_3", "cyclic of order 3", "the cyclic group of order 3"], ["Z2", "Z_2", "cyclic of order 2", "the cyclic group of order 2"]]}
            solution_sketch: 'The cosets of $6\mathbb{Z}$ are the $6$ residue classes $0+6\mathbb{Z},\dots,5+6\mathbb{Z}$, and they add as residues mod $6$ do. So the quotient is cyclic of order $6$, generated by $1+6\mathbb{Z}$. The group $S_3$ also has $6$ elements but is not abelian, and $\mathbb{Z}_3$ and $\mathbb{Z}_2$ have the wrong size.'
          - problem: 'A week has $7$ days, and a day count $n$ stands for the coset $n+7\mathbb{Z}$ in $\mathbb{Z}/7\mathbb{Z}$. A club meets every $5$ days, starting on a Monday. After how many meetings is the club first back on a Monday?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $k$ meetings the day count has grown by $5k$, and the club is back on a Monday when $5k$ is a multiple of $7$. Since $\gcd(5,7)=1$, the smallest such $k>0$ is $7$. So the order of $5+7\mathbb{Z}$ is $7$.'
          - problem: 'A day has $24$ hours, numbered by $\mathbb{Z}_{24}$, and a factory runs three shifts of $8$ hours, so two hours that differ by a multiple of $8$ hold the same place in their shifts. That is, hours count as equal when they lie in the same coset of $H=\langle8\rangle$. An alarm moves forward $3$ hours each time it rings. After how many rings is the alarm first at the same place in its shift as at the start?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,8,16\}$. After $k$ rings the alarm has moved $3k$ hours, and it is back at its starting place when $3k\in H$. The multiples $3,6,\dots,21$ are not in $H$, but $3\cdot8=24=0$ is, so the order of $3+H$ is $8$.'
          - problem: 'In $\mathbb{Z}_{12}$ the element $2$ has order $6$. Sam concludes that $2+H$ also has order $6$ in $\mathbb{Z}_{12}/H$, where $H=\langle3\rangle=\{0,3,6,9\}$. What is the correct order of $2+H$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In the quotient the identity is the coset $H$, so the order of $2+H$ is the smallest $k>0$ with $2k\in H$. We have $2\notin H$ and $4\notin H$, but $2\cdot3=6\in H$. So the order is $3$, smaller than the order $6$ of the element $2$ in $\mathbb{Z}_{12}$.'
          - problem: 'What is the order of the quotient group $\mathbb{Z}_{36}/\langle9\rangle$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $\langle9\rangle=\{0,9,18,27\}$ has $4$ elements. The quotient has $|\mathbb{Z}_{36}|/|\langle9\rangle|=36/4=9$ elements. Its order is $9$.'
        constraints: 'quotients of Z_n (n <= 36) and Z; orders of quotient elements via the smallest k with ka in H; quotient sizes by division'
      - id: kp3
        name: 'Quotients of non-abelian groups'
        key_prerequisites: [normal-subgroups]
        step_check:
          step: 'Since $\mathbb{Z}_4$ has an element of order $4$, the quotient cannot be $\mathbb{Z}_4$'
          question: 'Why does an element of order $4$ in $\mathbb{Z}_4$ show that the quotient is not $\mathbb{Z}_4$?'
          options:
            - 'Every group of order $4$ must contain an element of order $4$ to be a quotient of a dihedral group'
            - 'The quotient is a quotient of a non-abelian group, so it can never be a cyclic group'
            - 'The quotient has order $4$ but all its elements have order $1$ or $2$, so none generates it'
            - 'A quotient always has a smaller order than $4$, so it cannot be a group of order $4$'
          answer: 'The quotient has order $4$ but all its elements have order $1$ or $2$, so none generates it'
          why: 'A cyclic group of order $4$ needs a generator of order $4$, but the three non-identity cosets all have order $2$; a quotient of a non-abelian group can be cyclic, as $S_3/A_3\cong\mathbb{Z}_2$ shows.'
        exemplars:
          - problem: 'The subgroup $A_3$ of the symmetric group $S_3$ is normal. Which group is the quotient $S_3/A_3$ isomorphic to: $\mathbb{Z}_2$, $\mathbb{Z}_3$, $\mathbb{Z}_6$, or $S_3$?'
            answer: 'Z2'
            answer_contract: {"kind": "label", "options": [["Z2", "Z_2", "cyclic of order 2", "the cyclic group of order 2", "C2"], ["Z3", "Z_3", "cyclic of order 3", "the cyclic group of order 3"], ["Z6", "Z_6", "cyclic of order 6", "the cyclic group of order 6"], ["S3", "S_3", "the symmetric group S3"]]}
            solution_sketch: 'By Lagrange''s theorem the quotient has order $6/3=2$. The only group of order $2$ is the cyclic group $\mathbb{Z}_2$. The groups $\mathbb{Z}_3$, $\mathbb{Z}_6$ and $S_3$ have orders $3$, $6$ and $6$, so they cannot be the quotient.'
          - problem: 'In the dihedral group $D_4$ of order $8$, let $r$ be the rotation of order $4$. The center is $Z=\{e,r^2\}$. How many elements of order $2$ does the quotient group $D_4/Z$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient has order $8/2=4$, so it has $3$ non-identity cosets: $rZ$, $sZ$ and $rsZ$. Each of them squares to $Z$, since $r^2\in Z$, $s^2=e$ and $(rs)^2=e$. So all $3$ non-identity cosets have order $2$.'
          - problem: 'The quaternion group $Q_8=\{\pm1,\pm i,\pm j,\pm k\}$ has center $Z=\{1,-1\}$. What is the order of the quotient group $Q_8/Z$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $Q_8$ has $8$ elements and the center $Z$ has $2$ elements. By Lagrange''s theorem the number of cosets is $8/2=4$. So $Q_8/Z$ has order $4$.'
          - problem: 'In the dihedral group $D_6$ of order $12$, let $r$ be the rotation of order $6$. The center is $Z=\{e,r^3\}$. How many elements of order $3$ does the quotient group $D_6/Z$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient has order $12/2=6$. The cosets $rZ$ and $r^2Z$ have order $3$, because $r^3\in Z$ while $r$ and $r^2$ are not in $Z$. The three cosets $sZ$, $rsZ$ and $r^2sZ$ have order $2$, so exactly $2$ cosets have order $3$.'
          - problem: 'Which group is the quotient $D_4/Z$ isomorphic to, where $D_4$ is the dihedral group of order $8$ and $Z$ is its center: $\mathbb{Z}_2$, $\mathbb{Z}_4$, the Klein four-group $V_4$, or $D_4$?'
            answer: 'V4'
            answer_contract: {"kind": "label", "options": [["V4", "V_4", "Klein four-group", "the Klein four-group", "Klein four group", "Z2 x Z2", "Z_2 x Z_2", "Z2xZ2"], ["Z2", "Z_2", "cyclic of order 2", "the cyclic group of order 2"], ["Z4", "Z_4", "cyclic of order 4", "the cyclic group of order 4"], ["D4", "D_4", "the dihedral group D4"]]}
            solution_sketch: 'The quotient has order $8/2=4$, so it is $\mathbb{Z}_4$ or $V_4$. Every non-identity coset has order $2$, so no element has order $4$ and the quotient is not cyclic. Hence it is the Klein four-group $V_4$, and not $\mathbb{Z}_2$ or $D_4$, which have orders $2$ and $8$.'
          - problem: 'The Klein four-group $V=\{e,(1\,2)(3\,4),(1\,3)(2\,4),(1\,4)(2\,3)\}$ is normal in $A_4$. What is the order of the coset $(1\,2\,3)V$ in $A_4/V$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient $A_4/V$ has order $12/4=3$, so the order of any coset divides $3$. The $3$-cycle $(1\,2\,3)$ is not in $V$, so its coset is not the identity coset. Hence the order of $(1\,2\,3)V$ is $3$.'
          - problem: 'Sam finds the order of $S_4/V$ by subtracting: $24-4=20$, where $V$ is the normal Klein four-subgroup of $S_4$. What is the correct order of the quotient?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $S_4/V$ are cosets of $V$, and each coset has $4$ elements. The number of cosets is $24/4=6$, found by division and not by subtraction. So $S_4/V$ has order $6$.'
          - problem: 'The symmetries of a square form a group of order $8$. A designer treats two symmetries as the same when they differ by a half-turn, that is, when they lie in the same coset of the normal subgroup $Z=\{e,r^2\}$. How many different symmetry types does the designer have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each type is a coset of $Z$, and each coset has $2$ symmetries. So the number of types is $8/2=4$. The designer has $4$ symmetry types.'
          - problem: 'A regular hexagon has $12$ symmetries. A designer treats two symmetries as the same when they differ by a half-turn, that is, when they lie in the same coset of the normal subgroup of order $2$ generated by the half-turn. How many different symmetry types does the designer have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each type is a coset of the subgroup generated by the half-turn, and each coset has $2$ symmetries. So the number of types is $12/2=6$. The designer has $6$ symmetry types.'
        constraints: 'quotient orders <= 24; identify small quotients by order and element orders; quotients of D_4, D_6, Q_8, S_3, A_4, S_4'
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_{12}/\langle 4 \rangle$, find the order of the coset $3 + \langle 4 \rangle$.'
      answer: "4"
      solution_sketch: '$\langle 4 \rangle = \{0,4,8\}$; the multiples $3, 6, 9$ are not in it, but $4\cdot 3 = 12 \equiv 0$ is. Smallest such $k$ is $4$.'
    anki_seeds:
      - front: "Coset multiplication in a quotient group $G/N$?"
        back: "$(aN)(bN) = abN$; well defined precisely because $N$ is normal."
        type: basic
      - front: "$|G/N| = $ ? (finite $G$)"
        back: "$[G : N] = |G|/|N|$."
        type: basic
      - front: "Quotient of a cyclic group is..."
        back: "Cyclic — generated by the image of a generator."
        type: basic

  - id: direct-products
    name: "Direct Products"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: cyclic-groups-generators
        weight: 0.7
        key: true
      - id: cartesian-products
        weight: 0.4
        key: false
      - id: order-of-an-element
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'The construction and componentwise operation'
        key_prerequisites: [cartesian-products, order-of-an-element]
        step_check:
          step: 'so the first coordinate wraps at $5$ and the second wraps at $8$'
          question: 'Why does the first coordinate wrap at $5$ and the second at $8$?'
          options:
            - 'The smaller factor sets the modulus, so both coordinates wrap at the smaller number'
            - 'The group has order $40$, so both coordinates would wrap at the same number, $40$'
            - 'Each coordinate wraps at the size of the other factor, so the two moduli swap places'
            - 'Each coordinate lives in its own factor, so it is reduced modulo that factor''s size'
          answer: 'Each coordinate lives in its own factor, so it is reduced modulo that factor''s size'
          why: 'The operation is componentwise, so $\mathbb{Z}_5$ and $\mathbb{Z}_8$ each keep their own arithmetic; the two coordinates never interact.'
        exemplars:
          - problem: 'In $\mathbb{Z}_4\times\mathbb{Z}_6$, compute $(3,5)+(2,4)$.'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The operation of a direct product is componentwise, and each component is reduced modulo its own factor. In the first component $3+2=5\equiv1\pmod 4$. In the second component $5+4=9\equiv3\pmod 6$. So the sum is $(1,3)$.'
          - problem: 'What is the order of the group $\mathbb{Z}_3\times\mathbb{Z}_5\times\mathbb{Z}_2$?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements are the triples $(a,b,c)$ with $a\in\mathbb{Z}_3$, $b\in\mathbb{Z}_5$ and $c\in\mathbb{Z}_2$, with $3$, $5$ and $2$ choices independently. So the order is the product $|A\times B\times C|=3\cdot5\cdot2=30$.'
          - problem: 'In $\mathbb{Z}_7\times\mathbb{Z}_9$, compute $(3,5)-(6,8)$.'
            answer: '(4, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Subtract componentwise. In the first component $3-6=-3\equiv4\pmod 7$. In the second component $5-8=-3\equiv6\pmod 9$. So the difference is $(4,6)$.'
          - problem: 'In $\mathbb{Z}_5\times\mathbb{Z}_8$, compute $3\cdot(4,6)$, that is, $(4,6)+(4,6)+(4,6)$.'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Repeated addition in a direct product is componentwise. The first component is $3\cdot4=12\equiv2\pmod 5$ and the second component is $3\cdot6=18\equiv2\pmod 8$. So the result is $(2,2)$.'
          - problem: 'In $\mathbb{Z}_3\times\mathbb{Z}_4\times\mathbb{Z}_5$, compute $(2,3,4)+(2,3,3)$.'
            answer: '(1, 2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Add componentwise and reduce each component modulo its own factor. The first is $2+2=4\equiv1\pmod 3$, the second is $3+3=6\equiv2\pmod 4$, and the third is $4+3=7\equiv2\pmod 5$. So the sum is $(1,2,2)$.'
          - problem: 'In $\mathbb{Z}_7\times\mathbb{Z}_{11}$, find the additive inverse of $(2,3)$.'
            answer: '(5, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The inverse of a pair is found componentwise. In $\mathbb{Z}_7$ the inverse of $2$ is $7-2=5$, and in $\mathbb{Z}_{11}$ the inverse of $3$ is $11-3=8$. So the inverse is $(5,8)$.'
          - problem: 'A counter has two dials. The first dial shows the hour $0,1,\dots,11$ and the second shows the weekday number $0,1,\dots,6$, so its state is an element of $\mathbb{Z}_{12}\times\mathbb{Z}_7$. Each tick advances both dials by $1$. Starting at $(0,0)$, what is the state after $100$ ticks?'
            answer: '(4, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After $100$ ticks the state is $100\cdot(1,1)$, computed componentwise. The first dial shows $100\equiv4\pmod{12}$, since $100=8\cdot12+4$. The second dial shows $100\equiv2\pmod 7$, since $100=14\cdot7+2$. So the state is $(4,2)$.'
          - problem: 'A lock has two wheels. The first wheel has $12$ positions, and the lock has $84$ different states in all. How many positions does the second wheel have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The states of the lock are the pairs of positions, so the number of states is the product of the numbers of positions. Hence the second wheel has $84/12=7$ positions.'
          - problem: 'In $\mathbb{Z}_6\times\mathbb{Z}_8$ Sam computes $(5,7)+(4,6)$ and gets $(9,13)$. What is the correct sum?'
            answer: '(3, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam forgot to reduce each component modulo its own factor. The first component is $9\equiv3\pmod 6$ and the second is $13\equiv5\pmod 8$. So the correct sum is $(3,5)$.'
        constraints: '2-3 factors, each Z_n with n <= 12; componentwise arithmetic; group order as a product; dial and lock settings'
      - id: kp2
        name: 'Orders of elements: the lcm rule'
        key_prerequisites: [order-of-an-element]
        try_first:
          problem: 'In $\mathbb{Z}_2\times\mathbb{Z}_3$, what is the order of the element $(1,1)$?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'The multiples $(1,1),(0,2),(1,0),(0,1),(1,2),(0,0)$ show that the order is $6$. The first coordinate is back at $0$ every $2$ steps, the second every $3$ steps, so both are back together after $\mathrm{lcm}(2,3)=6$ steps.'
        step_check:
          step: 'Compute the lcm of the orders'
          question: 'Why is the order of $(a,b)$ the lcm of the two orders, and not their product?'
          options:
            - 'The lcm is always the smaller of the two orders, so it keeps the order of the pair as small as it can be'
            - '$(a,b)^k$ is the identity exactly when $k$ is a multiple of both orders, and the lcm is the least one'
            - 'The two coordinates are multiplied by different integers, so their orders add up instead of multiplying'
            - 'The product of the two orders counts the elements of the group, so the lcm gives the order instead'
          answer: '$(a,b)^k$ is the identity exactly when $k$ is a multiple of both orders, and the lcm is the least one'
          why: 'Both coordinates must return to the identity at the same time $k$, so $k$ is a common multiple of the orders; the product is a common multiple too, but not the least one unless the orders are coprime.'
        exemplars:
          - problem: 'What is the order of the element $(1,2)$ in $\mathbb{Z}_8\times\mathbb{Z}_{12}$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $(a,b)$ is the least common multiple of the orders of $a$ and $b$. The order of $1$ in $\mathbb{Z}_8$ is $8$, and the order of $2$ in $\mathbb{Z}_{12}$ is $12/\gcd(2,12)=6$. So the order of $(1,2)$ is $\mathrm{lcm}(8,6)=24$.'
          - problem: 'What is the order of $(2,3)$ in $\mathbb{Z}_4\times\mathbb{Z}_6$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $2$ in $\mathbb{Z}_4$ is $2$, and the order of $3$ in $\mathbb{Z}_6$ is $2$. The order of the pair is the least common multiple $\mathrm{lcm}(2,2)=2$, and not the product $4$.'
          - problem: 'How many elements of order $12$ does $\mathbb{Z}_4\times\mathbb{Z}_6$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $\mathrm{lcm}(|a|,|b|)=12$ with $|a|\in\{1,2,4\}$ and $|b|\in\{1,2,3,6\}$. This forces $|a|=4$ and $|b|\in\{3,6\}$. Now $\mathbb{Z}_4$ has $2$ elements of order $4$, and $\mathbb{Z}_6$ has $2$ elements of order $3$ and $2$ of order $6$, so the count is $2\cdot(2+2)=8$.'
          - problem: 'How many elements of order $4$ does $\mathbb{Z}_4\times\mathbb{Z}_8$ have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $(a,b)$ has order $4$ when $\mathrm{lcm}(|a|,|b|)=4$. In $\mathbb{Z}_4$ the numbers of elements of order $1,2,4$ are $1,1,2$, and in $\mathbb{Z}_8$ the numbers of elements of order $1,2,4$ are $1,1,2$. The pairs of orders with lcm $4$ are $(1,4),(2,4),(4,1),(4,2),(4,4)$, giving $2+2+2+2+4=12$.'
          - problem: 'How many elements of order $2$ does $\mathbb{Z}_4\times\mathbb{Z}_6$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element has order dividing $2$ exactly when both components do. In $\mathbb{Z}_4$ these are $0$ and $2$, and in $\mathbb{Z}_6$ these are $0$ and $3$, giving $2\cdot2=4$ pairs. One of them is the identity $(0,0)$, so $3$ elements have order $2$.'
          - problem: 'What is the order of $(3,5)$ in $\mathbb{Z}_{12}\times\mathbb{Z}_{15}$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $3$ in $\mathbb{Z}_{12}$ is $12/\gcd(3,12)=4$, and the order of $5$ in $\mathbb{Z}_{15}$ is $15/\gcd(5,15)=3$. The order of the pair is $\mathrm{lcm}(4,3)=12$.'
          - problem: 'Two lights flash together at time $0$. One light flashes every $4$ seconds and the other every $6$ seconds. After how many seconds do they next flash together?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The state of the lights is an element of $\mathbb{Z}_4\times\mathbb{Z}_6$, and each second adds $(1,1)$. The lights flash together again when the state returns to $(0,0)$, which takes $\mathrm{lcm}(4,6)=12$ seconds.'
          - problem: 'A wheel with $12$ notches turns $9$ notches at each tick, and a second wheel with $14$ notches turns $4$ notches at each tick. Both start at notch $0$. After how many ticks are both wheels first back at notch $0$ together?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first wheel returns to $0$ after $12/\gcd(9,12)=4$ ticks. The second wheel returns after $14/\gcd(4,14)=7$ ticks. Both are at $0$ together after $\mathrm{lcm}(4,7)=28$ ticks.'
          - problem: 'Sam says that $(2,3)$ has order $3\cdot3=9$ in $\mathbb{Z}_6\times\mathbb{Z}_9$, because $2$ has order $3$ in $\mathbb{Z}_6$ and $3$ has order $3$ in $\mathbb{Z}_9$. What is the correct order of $(2,3)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of a pair is the least common multiple of the component orders, not their product. Here $\mathrm{lcm}(3,3)=3$. Indeed $3\cdot(2,3)=(6,9)=(0,0)$, so the order is $3$.'
        constraints: 'orders via lcm of component orders; counting elements of a given order in products of two cyclic groups; periods of two cycles'
      - id: kp3
        name: 'When Z_m x Z_n is cyclic'
        key_prerequisites: [cyclic-groups-generators]
        step_check:
          step: 'since $\gcd(6,10) = 2 \neq 1$, the product $\mathbb{Z}_6 \times \mathbb{Z}_{10}$ is not cyclic'
          question: 'Why does $\gcd(6,10)=2$ mean that $\mathbb{Z}_6\times\mathbb{Z}_{10}$ is not cyclic?'
          options:
            - 'A gcd that is not $1$ means that one of the two factors $\mathbb{Z}_6$ and $\mathbb{Z}_{10}$ is not cyclic'
            - 'Elements of order $6$ and of order $10$ cannot both exist in the same product group'
            - 'Every element has order at most $\mathrm{lcm}(6,10)=30$, which is less than the group order $60$'
            - 'A product of cyclic groups is cyclic only when both factors have prime order here'
          answer: 'Every element has order at most $\mathrm{lcm}(6,10)=30$, which is less than the group order $60$'
          why: 'A cyclic group of order $60$ needs an element of order $60$, but orders in the product are at most $30$; both factors are cyclic, so the gcd test is about the product only.'
        exemplars:
          - problem: 'Is the group $\mathbb{Z}_8\times\mathbb{Z}_9$ cyclic?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is cyclic", "cyclic"], ["no", "it is not", "false", "incorrect", "not cyclic", "it is not cyclic"]]}
            solution_sketch: 'The product $\mathbb{Z}_m\times\mathbb{Z}_n$ is cyclic exactly when $\gcd(m,n)=1$. Here $\gcd(8,9)=1$, so $(1,1)$ has order $\mathrm{lcm}(8,9)=72$, which is the order of the whole group. So the group is cyclic, isomorphic to $\mathbb{Z}_{72}$.'
          - problem: 'Is the group $\mathbb{Z}_6\times\mathbb{Z}_{10}$ cyclic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is cyclic", "cyclic"], ["no", "it is not", "false", "incorrect", "not cyclic", "it is not cyclic"]]}
            solution_sketch: 'The product is cyclic only when $\gcd(6,10)=1$, but here the gcd is $2$. Every element has order dividing $\mathrm{lcm}(6,10)=30$, which is less than the group order $60$. So no element generates the group, and it is not cyclic.'
          - problem: 'The group $\mathbb{Z}_9\times\mathbb{Z}_{10}$ is isomorphic to $\mathbb{Z}_n$ for some $n$. Find $n$.'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\gcd(9,10)=1$, the product is cyclic. A cyclic group has the same order as the product, so it is isomorphic to $\mathbb{Z}_n$ with $n=9\cdot10=90$.'
          - problem: 'What is the largest order of an element of $\mathbb{Z}_8\times\mathbb{Z}_{12}$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $(a,b)$ is $\mathrm{lcm}(|a|,|b|)$, and the largest orders in the factors are $8$ and $12$. The pair $(1,1)$ reaches $\mathrm{lcm}(8,12)=24$, and no pair can exceed it. So the largest order is $24$, less than the group order $96$.'
          - problem: 'For which smallest integer $m>1$ is $\mathbb{Z}_m\times\mathbb{Z}_6$ cyclic?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is cyclic exactly when $\gcd(m,6)=1$. For $m=2$ the gcd is $2$, for $m=3$ it is $3$, for $m=4$ it is $2$, and for $m=5$ it is $1$. So the smallest such $m$ is $5$.'
          - problem: 'A machine has two dials with $8$ positions and $9$ positions. At each tick both dials move forward by one position, starting from the setting $(0,0)$. How many different settings does the machine show before it first repeats a setting?'
            answer: '72'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The settings are the multiples of $(1,1)$ in $\mathbb{Z}_8\times\mathbb{Z}_9$, so their number is the order of $(1,1)$. This order is $\mathrm{lcm}(8,9)=72$, which is all of the $72$ possible settings.'
          - problem: 'A machine has two dials with $6$ positions and $10$ positions. At each tick both dials move forward by one position, starting from the setting $(0,0)$. How many different settings does the machine show before it first repeats a setting?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The settings are the multiples of $(1,1)$ in $\mathbb{Z}_6\times\mathbb{Z}_{10}$, so their number is the order of $(1,1)$. This order is $\mathrm{lcm}(6,10)=30$, which is only half of the $60$ possible settings, because $\gcd(6,10)=2$.'
          - problem: 'Sam says that $\mathbb{Z}_4\times\mathbb{Z}_{10}$ is isomorphic to $\mathbb{Z}_{40}$ because the group has $40$ elements. What is the largest order of an element of $\mathbb{Z}_4\times\mathbb{Z}_{10}$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest order of an element is $\mathrm{lcm}(4,10)=20$, reached by $(1,1)$. This is less than $40$, so no element generates the group and it is not isomorphic to $\mathbb{Z}_{40}$.'
        constraints: 'gcd criterion; m, n <= 15; largest element order as lcm; dials as two cycles'
    diagnostic_exemplar:
      problem: 'What is the largest order of an element of $\mathbb{Z}_6 \times \mathbb{Z}_{10}$?'
      answer: '30'
      solution_sketch: 'The order of $(a,b)$ is $\mathrm{lcm}(|a|,|b|)$, and the largest orders available in the factors are $6$ and $10$, so the maximum is $\mathrm{lcm}(6,10) = 30$, attained by $(1,1)$. Since $30 < 60$, the group is not cyclic.'
    anki_seeds:
      - front: "Order of $(a, b)$ in $A \\times B$?"
        back: "$\\mathrm{lcm}(|a|, |b|)$."
        type: basic
      - front: "$\\mathbb{Z}_m \\times \\mathbb{Z}_n$ is cyclic iff..."
        back: "$\\gcd(m, n) = 1$ (and then it is $\\cong \\mathbb{Z}_{mn}$)."
        type: basic

  - id: internal-direct-products
    name: "Internal Direct Products"
    core: false                # recognition criterion consumed only by the supplemental structure run (sylow-theorems' order-pq arguments); nothing core builds on it
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - {id: group-isomorphisms, weight: 0.5, key: false}          # L1: kp2/kp3/diagnostic conclude 'G = H x K' -- isomorphism was untaught in closure
      - id: direct-products
        weight: 0.8
        key: true
      - id: normal-subgroups
        weight: 0.8
        key: true
      - id: lagranges-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'The product set HK and the counting formula |HK| = |H||K|/|H ∩ K|'
        key_prerequisites: [lagranges-theorem, normal-subgroups]
        step_check:
          step: 'identify $H \cap K$'
          question: 'Why must we find $H\cap K$ before the formula for $|HK|$ can be used?'
          options:
            - 'Only the elements of $H\cap K$ can belong to $HK$, so the intersection is the part of $HK$ to be counted'
            - 'The set $HK$ is a subgroup only when $H\cap K$ is non-empty, so this has to be checked before counting'
            - 'Pairs $(h,k)$ and $(hx,x^{-1}k)$ with $x\in H\cap K$ share a product, so we divide by $|H\cap K|$'
            - 'The intersection tells us whether $H$ and $K$ are normal, and the formula holds only for normal subgroups'
          answer: 'Pairs $(h,k)$ and $(hx,x^{-1}k)$ with $x\in H\cap K$ share a product, so we divide by $|H\cap K|$'
          why: 'Different pairs can give the same product $hk$, and exactly $|H\cap K|$ pairs give each product, so $|HK|=|H||K|/|H\cap K|$; the formula holds for any subgroups, normal or not.'
        exemplars:
          - problem: 'In $\mathbb{Z}_{12}$ let $H=\langle2\rangle$ and $K=\langle3\rangle$. How many elements does the set $H+K=\{h+k : h\in H,\ k\in K\}$ have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,2,4,6,8,10\}$ and $K=\{0,3,6,9\}$, so $H\cap K=\{0,6\}$ has $2$ elements. The counting formula gives $|H+K|=|H||K|/|H\cap K|=6\cdot4/2=12$. So $H+K$ is all of $\mathbb{Z}_{12}$.'
          - problem: 'In $S_3$ let $H=\langle(1\,2)\rangle$ and $K=\langle(1\,3)\rangle$. How many elements does the product set $HK=\{hk : h\in H,\ k\in K\}$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both subgroups have order $2$, and $H\cap K=\{e\}$ has $1$ element. The counting formula gives $|HK|=|H||K|/|H\cap K|=2\cdot2/1=4$. So $HK$ has $4$ elements.'
          - problem: 'In $S_3$ let $H=\langle(1\,2)\rangle$ and $K=\langle(1\,3)\rangle$. Is the product set $HK$ a subgroup of $S_3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is a subgroup", "a subgroup"], ["no", "it is not", "false", "incorrect", "not a subgroup", "it is not a subgroup"]]}
            solution_sketch: 'The counting formula gives $|HK|=2\cdot2/1=4$. By Lagrange''s theorem the order of a subgroup of $S_3$ divides $6$, and $4$ does not divide $6$. So $HK$ is not a subgroup.'
          - problem: 'In the dihedral group $D_4$ of order $8$, let $r$ be the rotation of order $4$ and $s$ a reflection. Let $H=\langle r\rangle$ and $K=\langle s\rangle$. How many elements does $HK$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has order $4$ and $K=\{e,s\}$ has order $2$. The reflection $s$ is not a rotation, so $H\cap K=\{e\}$ has $1$ element. Then $|HK|=4\cdot2/1=8$, and $HK$ is all of $D_4$.'
          - problem: 'In $\mathbb{Z}_{18}$ let $H=\langle3\rangle$ and $K=\langle6\rangle$. How many elements does $H+K$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\langle3\rangle$ has order $6$ and $K=\langle6\rangle=\{0,6,12\}$ has order $3$. Since $K$ lies inside $H$, the intersection is $K$ with $3$ elements. So $|H+K|=6\cdot3/3=6$, and indeed $H+K=H$.'
          - problem: 'In $S_3$ let $H=\langle(1\,2\,3)\rangle$ and $K=\langle(1\,2)\rangle$. How many elements does $HK$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has order $3$ and $K$ has order $2$, and $H\cap K=\{e\}$ has $1$ element. So $|HK|=3\cdot2/1=6$, and $HK$ is all of $S_3$.'
          - problem: 'In $\mathbb{Z}_{10}$ let $H$ be the subgroup generated by $2$ and $K$ the subgroup generated by $5$. How many elements does $H+K$ have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,2,4,6,8\}$ has $5$ elements and $K=\{0,5\}$ has $2$ elements. Their intersection is $\{0\}$, which has $1$ element. So $|H+K|=5\cdot2/1=10$.'
          - problem: 'Let $H$ and $K$ be subgroups of a finite group $G$ with $|H|=6$ and $|K|=10$. The set $HK$ has $30$ elements. How many elements does $H\cap K$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counting formula says $|HK|=|H||K|/|H\cap K|$. So $|H\cap K|=|H||K|/|HK|=6\cdot10/30=2$. The intersection has $2$ elements.'
          - problem: 'A day has $24$ hours, numbered by $\mathbb{Z}_{24}$. Alarm A rings at the hours $0,6,12,18$ and alarm B rings at the hours $0,8,16$. How many different hours of the day can be written as an A hour plus a B hour, modulo $24$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ring hours of A form $H=\langle6\rangle$ with $4$ elements, and those of B form $K=\langle8\rangle$ with $3$ elements. The only hour in both is $0$, so $|H\cap K|=1$. Then $|H+K|=4\cdot3/1=12$, and these are the even hours.'
          - problem: 'A round table has $30$ seats, and the rotations of the table form the group $\mathbb{Z}_{30}$. The rotations by a multiple of $6$ seats form a subgroup $H$ and the rotations by a multiple of $10$ seats form a subgroup $K$. How many different rotations can be written as a rotation in $H$ followed by a rotation in $K$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has $5$ rotations and $K$ has $3$ rotations. A rotation in both must be a multiple of $6$ and of $10$ seats, hence a multiple of $30$ seats, which is the identity. So $|H\cap K|=1$ and $|HK|=5\cdot3/1=15$.'
        constraints: '|HK| computations in Z_n (n <= 24), S_3, D_4; each solution states H ∩ K explicitly; one problem per set draws a subgroup/non-subgroup conclusion via Lagrange; one reverse use of the formula'
      - id: kp2
        name: 'The recognition criterion: G is an internal direct product'
        key_prerequisites: [normal-subgroups, direct-products]
        step_check:
          step: 'Since $|H + K| = 4$ and $|\mathbb{Z}_8| = 8$, $HK \neq G$'
          question: 'Why does $|H+K|=4$ show that $\mathbb{Z}_8$ is not the internal direct product of $H$ and $K$?'
          options:
            - 'Then $H+K$ is a proper subset of $\mathbb{Z}_8$, so some elements are not of the form $h+k$'
            - 'Then $H+K$ has the same size as $H$, which shows that $H$ is not a normal subgroup of $\mathbb{Z}_8$'
            - 'Then $H+K$ has fewer than $8$ elements, so it cannot be a subgroup of $\mathbb{Z}_8$ at all'
            - 'Then $|H||K|$ differs from $|H+K|$, which always means that $K$ is not a normal subgroup of $\mathbb{Z}_8$'
          answer: 'Then $H+K$ is a proper subset of $\mathbb{Z}_8$, so some elements are not of the form $h+k$'
          why: 'The third condition says $H+K$ must be the whole group; with only $4$ of the $8$ elements it fails, and the other two conditions cannot repair it.'
        exemplars:
          - problem: 'Is $\mathbb{Z}_6$ the internal direct product of its subgroups $H=\langle2\rangle$ and $K=\langle3\rangle$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is an internal direct product"], ["no", "it is not", "false", "incorrect", "it is not an internal direct product"]]}
            solution_sketch: 'We check the three conditions. Both subgroups are normal because $\mathbb{Z}_6$ is abelian. Next $H=\{0,2,4\}$ and $K=\{0,3\}$ meet only in $0$, and $|H+K|=3\cdot2/1=6=|\mathbb{Z}_6|$, so $H+K=\mathbb{Z}_6$. All three conditions hold, so the answer is yes.'
          - problem: 'In $\mathbb{Z}_{12}$ let $H=\langle2\rangle$ and $K=\langle3\rangle$. How many elements lie in both $H$ and $K$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,2,4,6,8,10\}$ and $K=\{0,3,6,9\}$. The elements in both are $0$ and $6$, so there are $2$ of them. This intersection is not trivial, so $\mathbb{Z}_{12}$ is not the internal direct product of $H$ and $K$.'
          - problem: 'In the dihedral group $D_4$ of order $8$, let $r$ be the rotation of order $4$, and let $H=\langle r^2\rangle$ and $K=\langle r\rangle$. Is $D_4$ the internal direct product of $H$ and $K$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is an internal direct product"], ["no", "it is not", "false", "incorrect", "it is not an internal direct product"]]}
            solution_sketch: 'Here $H=\{e,r^2\}$ lies inside $K=\{e,r,r^2,r^3\}$, so $H\cap K=H$ has $2$ elements and is not trivial. Also $HK=K$ has only $4$ elements, not $8$. So two of the three conditions fail, and the answer is no.'
          - problem: 'In the dihedral group $D_6$ of order $12$, let $r$ be the rotation of order $6$ and $s$ a reflection. Let $H=\langle r^2,s\rangle$ and $K=\langle r^3\rangle$. How many elements does $HK$ have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ consists of the rotations $e,r^2,r^4$ and three reflections, so it has order $6$, and $K=\{e,r^3\}$ has order $2$. The rotation $r^3$ is not in $H$, so $H\cap K=\{e\}$. Then $|HK|=6\cdot2/1=12=|D_6|$. Since $H$ has index $2$ it is normal, and $K$ is the center, so $D_6$ is the internal direct product of $H$ and $K$.'
          - problem: 'The group $\mathbb{Z}_{20}$ is the internal direct product of $H=\langle5\rangle$ and a subgroup $K$. How many elements does $K$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H=\langle5\rangle=\{0,5,10,15\}$ has $4$ elements. In an internal direct product $|G|=|H||K|$, so $|K|=20/4=5$. For example $K=\langle4\rangle$ has $5$ elements and meets $H$ only in $0$.'
          - problem: 'Sam argues that $\mathbb{Z}_{20}$ is the internal direct product of $H=\langle4\rangle$ and $K=\langle10\rangle$, because $H\cap K=\{0\}$. How many elements does $H+K$ have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $H=\{0,4,8,12,16\}$ and $K=\{0,10\}$, and they meet only in $0$, so $|H+K|=5\cdot2/1=10$. Since $H+K$ has only $10$ of the $20$ elements, it is not all of $\mathbb{Z}_{20}$. So the third condition fails, and Sam is wrong.'
          - problem: 'In the group $\mathbb{Z}_{12}$ let $H=\langle3\rangle$ and $K=\langle4\rangle$. These subgroups are normal, $H\cap K=\{0\}$ and $H+K=\mathbb{Z}_{12}$. For $h=3$ in $H$ and $k=4$ in $K$, compute $h+k-h-k$ in $\mathbb{Z}_{12}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $h+k-h-k=3+4-3-4=0$ in $\mathbb{Z}_{12}$, because the group is abelian. In any group, if $H$ and $K$ are normal with $H\cap K=\{e\}$, the commutator $hkh^{-1}k^{-1}$ lies in both $H$ and $K$, so it equals $e$. So elements of $H$ and $K$ commute, and the commutator is $0$.'
          - problem: 'Hours of a day are numbered $0$ to $23$. Schedule A lists the hours $0,8,16$, and schedule B lists the hours $0,3,6,\dots,21$. How many different hours can be written as an A hour plus a B hour, modulo $24$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The schedules are the subgroups $H=\langle8\rangle$ with $3$ elements and $K=\langle3\rangle$ with $8$ elements of $\mathbb{Z}_{24}$. They meet only in $0$, so $|H+K|=3\cdot8/1=24$. Every hour is an A hour plus a B hour in exactly one way.'
          - problem: 'A loop has $12$ stations numbered by $\mathbb{Z}_{12}$. A train moves $4$ stations at a time and a bus moves $6$ stations at a time. The stations the train can reach from station $0$ form $H$, and those the bus can reach form $K$. How many stations can be reached by first riding the train and then the bus, starting from station $0$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The train reaches $H=\{0,4,8\}$ and the bus reaches $K=\{0,6\}$, and they share only the station $0$. So $|H+K|=3\cdot2/1=6$. Only $6$ of the $12$ stations can be reached, so $\mathbb{Z}_{12}$ is not the internal direct product of $H$ and $K$.'
        constraints: 'the three recognition conditions checked in Z_n (n <= 24), D_4 and D_6; every verification states the intersection or the product size; a reverse use of |G| = |H||K|'
      - id: kp3
        name: 'Coprime-order applications'
        key_prerequisites: [lagranges-theorem, direct-products, normal-subgroups]
        step_check:
          step: '$|H \cap K|$ divides both $3$ and $7$ by Lagrange''s theorem'
          question: 'Why does Lagrange''s theorem make $|H\cap K|$ divide both $3$ and $7$?'
          options:
            - 'The orders $3$ and $7$ are prime, so every subgroup of the group $G$ has order exactly $3$ or $7$'
            - 'Lagrange''s theorem says that $|H\cap K|$ equals the product $|H||K|=21$ for normal subgroups of $G$'
            - 'Both $H$ and $K$ are normal subgroups, and normal subgroups always have orders that divide each other'
            - '$H\cap K$ is a subgroup of both $H$ and $K$, and a subgroup''s order divides the group''s order'
          answer: '$H\cap K$ is a subgroup of both $H$ and $K$, and a subgroup''s order divides the group''s order'
          why: 'The intersection sits inside $H$ and inside $K$ at once, so its order divides $|H|=3$ and $|K|=7$; the only common divisor is $1$.'
        exemplars:
          - problem: 'A group $G$ of order $15$ has a normal subgroup $H$ of order $3$ and a normal subgroup $K$ of order $5$. How many elements does $H\cap K$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intersection $H\cap K$ is a subgroup of both $H$ and $K$. By Lagrange''s theorem its order divides $3$ and $5$, so it divides $\gcd(3,5)=1$. So $H\cap K$ has exactly $1$ element, the identity.'
          - problem: 'A group of order $20$ contains normal subgroups $P$ of order $4$ and $Q$ of order $5$. What is the order of the product $PQ$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $P\cap Q$ divides $\gcd(4,5)=1$, so $P\cap Q$ is trivial. Then $|PQ|=|P||Q|/|P\cap Q|=4\cdot5/1=20$. So $PQ$ is the whole group.'
          - problem: 'Let $G$ be a group of order $45$ with a normal subgroup $H$ of order $9$ and a normal subgroup $K$ of order $5$. What is the order of $HK$?'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $H\cap K$ divides $\gcd(9,5)=1$, so $H\cap K$ is trivial. Then $|HK|=9\cdot5/1=45$, which is $|G|$. So $HK=G$.'
          - problem: 'A group $G$ of order $21$ has normal subgroups $H$ and $K$ of orders $3$ and $7$. Must $G$ be abelian?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "G is abelian", "it must be abelian", "abelian"], ["no", "it is not", "false", "incorrect", "not necessarily", "G need not be abelian", "not abelian"]]}
            solution_sketch: 'The order of $H\cap K$ divides $\gcd(3,7)=1$, so the intersection is trivial. Then $|HK|=3\cdot7/1=21$, so $HK=G$ and $G$ is the internal direct product of $H$ and $K$. Both are cyclic of prime order, so $G\cong\mathbb{Z}_3\times\mathbb{Z}_7$ is abelian.'
          - problem: 'A group $G$ of order $35$ has normal subgroups of orders $5$ and $7$. Then $G$ is isomorphic to the cyclic group $\mathbb{Z}_n$ for some $n$. Find $n$.'
            answer: '35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two normal subgroups meet trivially because the order of their intersection divides $\gcd(5,7)=1$. Their product has order $5\cdot7=35$, so $G\cong\mathbb{Z}_5\times\mathbb{Z}_7$. Since $\gcd(5,7)=1$ this is cyclic, so $G\cong\mathbb{Z}_{35}$.'
          - problem: 'A group $G$ of order $12$ has a normal subgroup $H$ of order $4$ and a normal subgroup $K$ of order $6$. How many elements does $H\cap K$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $H\cap K$ divides $\gcd(4,6)=2$, so it is $1$ or $2$. The set $HK$ has $4\cdot6/|H\cap K|=24/|H\cap K|$ elements, and this cannot exceed $|G|=12$. With $|H\cap K|=1$ we would get $24$, so $|H\cap K|=2$.'
          - problem: 'A group $G$ of order $91$ has a normal subgroup $H$ of order $7$ and a normal subgroup $K$ with $H\cap K=\{e\}$ and $HK=G$. What is the order of $K$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $H\cap K$ trivial the counting formula gives $|HK|=|H||K|$. Since $HK=G$, we have $91=7\cdot|K|$. So $|K|=91/7=13$.'
          - problem: 'A group $G$ of order $77$ has normal subgroups of orders $7$ and $11$. Then $G$ is cyclic. How many elements of $G$ generate $G$?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two normal subgroups meet trivially because $\gcd(7,11)=1$, so $G\cong\mathbb{Z}_7\times\mathbb{Z}_{11}\cong\mathbb{Z}_{77}$. An element of $\mathbb{Z}_{77}$ generates the group when it is coprime to $77$. There are $\varphi(77)=6\cdot10=60$ such elements.'
          - problem: 'A round table has $35$ seats, and the rotations of the table form the group $\mathbb{Z}_{35}$. The rotations by a multiple of $5$ seats form a subgroup $H$ and the rotations by a multiple of $7$ seats form a subgroup $K$. How many different rotations can be written as a rotation in $H$ followed by a rotation in $K$?'
            answer: '35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has $7$ rotations and $K$ has $5$ rotations. Their orders are coprime, so they meet only in the identity. Then $|HK|=7\cdot5/1=35$, and every rotation of the table is obtained.'
          - problem: 'A round table has $12$ seats, and the rotations of the table form the group $\mathbb{Z}_{12}$. The rotations by a multiple of $4$ seats form a subgroup $H$ and the rotations by a multiple of $6$ seats form a subgroup $K$. How many different rotations can be written as a rotation in $H$ followed by a rotation in $K$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H=\{0,4,8\}$ has $3$ rotations and $K=\{0,6\}$ has $2$ rotations. Their orders are coprime, so they meet only in the identity. Then $|HK|=3\cdot2/1=6$, which is only half of the $12$ rotations.'
        constraints: 'orders pq or p^2 q with p, q <= 11, plus orders 12 and 91; the intersection-divides-gcd step justified by Lagrange every time'
    diagnostic_exemplar:
      problem: 'A group $G$ of order $35$ has normal subgroups $H \cong \mathbb{Z}_5$ and $K \cong \mathbb{Z}_7$. Show $H \cap K = \{e\}$, compute $|HK|$, and identify $G$ up to isomorphism.'
      answer: '$|H \cap K|$ divides $\gcd(5, 7) = 1$, so $H \cap K = \{e\}$; $|HK| = \frac{5 \cdot 7}{1} = 35$, so $HK = G$; the recognition criterion gives $G \cong \mathbb{Z}_5 \times \mathbb{Z}_7 \cong \mathbb{Z}_{35}$.'
      answer_contract: {kind: none}
      solution_sketch: 'Lagrange forces the trivial intersection, the counting formula forces $HK = G$, and coprime cyclic factors multiply to a cyclic group.'
    anki_seeds:
      - front: "Internal direct product recognition criterion?"
        back: "$H, K \\trianglelefteq G$, $H \\cap K = \\{e\\}$, $HK = G$ $\\implies$ $G \\cong H \\times K$ via $(h,k) \\mapsto hk$."
        type: basic
      - front: "$|HK| = $ ? (finite subgroups $H, K$)"
        back: "$\\dfrac{|H|\\,|K|}{|H \\cap K|}$."
        type: basic
      - front: "Why do $H$ and $K$ commute elementwise when both are normal with $H \\cap K = \\{e\\}$?"
        back: "The commutator $hkh^{-1}k^{-1}$ lies in both $H$ and $K$, hence equals $e$."
        type: basic

  - id: commutator-subgroup
    name: "The Commutator Subgroup and Abelianization"
    core: true                 # category-theory builds on abelianization G/[G,G] (natural-transformations, adjunctions); machinery, not a destination
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - {id: direct-products, weight: 0.4, key: false}             # L1: kp3/diagnostic identify D_4/[D_4,D_4] as Z_2 x Z_2
      - {id: group-isomorphisms, weight: 0.4, key: false}          # L1: the abelianization identifications are stated up to isomorphism
      - id: quotient-groups
        weight: 0.8
        key: true
      - id: abelian-groups
        weight: 0.6
        key: true
      - id: normal-subgroups
        weight: 0.4
        key: false
      - id: permutations-cycle-notation
        weight: 0.4
        key: false
      - id: dihedral-groups
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Commutators measure failure to commute'
        key_prerequisites: [abelian-groups, permutations-cycle-notation]
        try_first:
          problem: 'In $S_3$, compose the transpositions $(1\,2)$ and $(1\,3)$ in both orders. Do the two results agree?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "they agree", "they are equal", "equal"], ["no", "it is not", "false", "incorrect", "they differ", "they are different", "different"]]}
          answer: 'no'
          reveal: 'The two products are different $3$-cycles, so $(1\,2)$ and $(1\,3)$ do not commute. The commutator $a^{-1}b^{-1}ab$ measures this: it equals $e$ exactly when $ab=ba$.'
        step_check:
          step: 'Also, $r^{-1} = r^3$ and $s^{-1} = s$'
          question: 'Why is $s^{-1}=s$ for a reflection $s$ in $D_4$?'
          options:
            - 'Every element of $D_4$ is its own inverse, because $D_4$ has order $8$ and is a power of $2$'
            - 'A reflection done twice returns every point, so $s^2=e$ and $s$ is its own inverse'
            - 'The reflection $s$ has order $4$, so its inverse $s^3$ is the same element as $s$ itself'
            - 'A reflection commutes with every rotation, and commuting elements are always their own inverses'
          answer: 'A reflection done twice returns every point, so $s^2=e$ and $s$ is its own inverse'
          why: 'Reflecting twice restores the square, so $s^2=e$ and $s^{-1}=s$; rotations differ, since $r$ has order $4$ and $r^{-1}=r^3$.'
        exemplars:
          - problem: 'In $S_3$, with permutations composed from right to left, the commutator of $a$ and $b$ is $[a,b]=a^{-1}b^{-1}ab$. Where does the commutator $[(1\,2),(1\,3)]$ send the point $1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transpositions are their own inverses, so $[(1\,2),(1\,3)]=(1\,2)(1\,3)(1\,2)(1\,3)$. Following the point $1$ from the right: $(1\,3)$ sends $1$ to $3$, $(1\,2)$ fixes $3$, $(1\,3)$ sends $3$ to $1$, and $(1\,2)$ sends $1$ to $2$. So the commutator, which is the $3$-cycle $(1\,2\,3)$, sends $1$ to $2$.'
          - problem: 'In the dihedral group $D_4$ let $r^4=e$, $s^2=e$ and $srs=r^{-1}$. Do $r$ and $s$ commute?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "they commute", "rs = sr"], ["no", "it is not", "false", "incorrect", "they do not commute", "they don't commute", "rs is not sr"]]}
            solution_sketch: 'If $rs=sr$, then $srs=r\,s\,s=r$, so the relation $srs=r^{-1}$ would give $r=r^{-1}$, that is $r^2=e$. But $r$ has order $4$, so $r^2\ne e$. Hence $r$ and $s$ do not commute.'
          - problem: 'In the dihedral group $D_4$ let $r^4=e$, $s^2=e$ and $srs=r^{-1}$, and write $[a,b]=a^{-1}b^{-1}ab$. What is the order of the commutator $[r,s]$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $s^{-1}=s$, we get $[r,s]=r^{-1}s\,r\,s=r^{-1}(srs)=r^{-1}r^{-1}=r^{-2}=r^2$. The element $r^2$ is not $e$, but $(r^2)^2=r^4=e$. So $[r,s]$ has order $2$.'
          - problem: 'In the dihedral group $D_4$ let $r^4=e$, $s^2=e$ and $srs=r^{-1}$, and write $[a,b]=a^{-1}b^{-1}ab$. What is the order of the commutator $[r^2,s]$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $[r^2,s]=r^{-2}s\,r^2\,s=r^2(sr^2s)$, using $r^{-2}=r^2$. The relation $srs=r^{-1}$ gives $sr^2s=r^{-2}$, so $[r^2,s]=r^2r^{-2}=e$. The identity has order $1$, so $r^2$ and $s$ commute.'
          - problem: 'In $S_3$, with permutations composed from right to left, let $[a,b]=a^{-1}b^{-1}ab$. What is the order of the commutator $[(1\,2\,3),(1\,2)]$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a=(1\,2\,3)$ has $a^{-1}=(1\,3\,2)$, and $b=(1\,2)$ has $b^{-1}=b$, so $[a,b]=(1\,3\,2)(1\,2)(1\,2\,3)(1\,2)$. Following each point from the right gives $1\to2$, $2\to3$ and $3\to1$. So the commutator is a $3$-cycle, and it has order $3$.'
          - problem: 'With the commutator $[a,b]=a^{-1}b^{-1}ab$ and permutations composed from right to left, how many different elements of $S_3$ are of the form $[a,b]$ with $a,b\in S_3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $a$ and $b$ commute, for example when $a=b$ or when one of them is $e$, then $[a,b]=e$. A pair of distinct transpositions gives a $3$-cycle, such as $[(1\,2),(1\,3)]=(1\,2\,3)$, and swapping the two gives the inverse $(1\,3\,2)$. So the commutators are $e$, $(1\,2\,3)$ and $(1\,3\,2)$, which is $3$ elements.'
          - problem: 'A group $G$ has $[a,b]=a^{-1}b^{-1}ab=e$ for every pair of elements $a,b\in G$. What kind of group is $G$: abelian, cyclic, trivial, or simple?'
            answer: 'abelian'
            answer_contract: {"kind": "label", "options": [["abelian", "G is abelian", "commutative"], ["cyclic", "G is cyclic"], ["trivial", "G is trivial"], ["simple", "G is simple"]]}
            solution_sketch: 'From $a^{-1}b^{-1}ab=e$ we get $b^{-1}ab=a$, so $ab=ba$, and this holds for every pair. So $G$ is abelian. It need not be cyclic, for example the Klein four-group, and it need not be trivial, for example $\mathbb{Z}_2$. Simplicity is unrelated to commutativity.'
          - problem: 'In $S_3$ Sam argues that $[(1\,2),(1\,3)]=e$, because transpositions are their own inverses. What is the order of $[(1\,2),(1\,3)]$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Being their own inverses only gives $[(1\,2),(1\,3)]=(1\,2)(1\,3)(1\,2)(1\,3)$, and this product is not $e$ because $(1\,2)$ and $(1\,3)$ do not commute. Tracing the points gives $1\to2$, $2\to3$, $3\to1$, a $3$-cycle. So the order is $3$.'
          - problem: 'Three cards lie in a row in the positions $1,2,3$. A magician swaps the cards in the positions $1$ and $2$, then the cards in the positions $1$ and $3$, then the cards in the positions $1$ and $2$ again, and finally the cards in the positions $1$ and $3$ again. In which position does the card that started in position $1$ end?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Follow the card. The first swap moves it from position $1$ to position $2$. The second swap, of positions $1$ and $3$, leaves it in position $2$, the third swap moves it back to position $1$, and the fourth swap moves it to position $3$. So it ends in position $3$, which shows that the swaps do not commute.'
          - problem: 'A square tile is turned a quarter turn clockwise, then flipped about its vertical axis, then turned a quarter turn counterclockwise, then flipped about its vertical axis again. The result is a single rotation of the tile from its starting position. By how many degrees is the tile rotated?'
            answer: '180'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degrees", "allow_omitted": true}
            solution_sketch: 'In terms of $r$ and $s$ the four moves multiply to $s\,r^{-1}\,s\,r$, read from the right. Since $sr^{-1}s=r$, this equals $r\cdot r=r^2$. The element $r^2$ is a half-turn, so the tile is rotated by $180$ degrees.'
        constraints: 'state the convention [a,b] = a^{-1}b^{-1}ab in every problem; concrete computations in S_3 and D_4 asked through orders, images of a point and counts; move sequences as contexts'
      - id: kp2
        name: 'The commutator subgroup [G, G]'
        key_prerequisites: [normal-subgroups, abelian-groups]
        step_check:
          step: 'so $[D_4, D_4] = \{e, r^2\}$'
          question: 'Why do the commutators $e$ and $r^2$ alone give $[D_4,D_4]=\{e,r^2\}$?'
          options:
            - 'Each commutator is $e$ or $r^2$, and a subgroup generated by two elements must have two elements'
            - 'Every element of $D_4$ commutes with $r^2$, so every commutator of $D_4$ must be equal to $r^2$'
            - 'The commutator subgroup is defined as the center of $D_4$, which is spanned by $e$ and $r^2$'
            - '$\{e,r^2\}$ is a subgroup that contains every commutator, so it is the subgroup they generate'
          answer: '$\{e,r^2\}$ is a subgroup that contains every commutator, so it is the subgroup they generate'
          why: '$[G,G]$ is the smallest subgroup containing all commutators; $\{e,r^2\}$ is closed under products and inverses, so nothing more is needed (the center happens to be the same set here, but it is a different notion).'
        exemplars:
          - problem: 'The commutator subgroup $[G,G]$ is the subgroup generated by all commutators $[x,y]=x^{-1}y^{-1}xy$. How many elements does $[G,G]$ have when $G=\mathbb{Z}_{12}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $\mathbb{Z}_{12}$ is abelian, so $xy=yx$ and every commutator $[x,y]$ equals $e$. The subgroup generated by $e$ alone is $\{e\}$. So $[G,G]$ has $1$ element.'
          - problem: 'How many elements does the commutator subgroup $[S_3,S_3]$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every commutator in $S_3$ is an even permutation, because the sign of $a^{-1}b^{-1}ab$ is $+1$, so $[S_3,S_3]$ lies inside $A_3$. It contains $[(1\,2),(1\,3)]=(1\,2\,3)$, a $3$-cycle, which generates $A_3$. So $[S_3,S_3]=A_3$ has $3$ elements.'
          - problem: 'In the dihedral group $D_4$ of order $8$ let $r^4=e$, $s^2=e$ and $srs=r^{-1}$. How many elements does $[D_4,D_4]$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $[s,r]=s\,r^{-1}s\,r=r\cdot r=r^2$, using $sr^{-1}s=r$. Every other commutator is $e$ or a power of $r^2$, because the quotient by $\langle r^2\rangle$ is abelian. So $[D_4,D_4]=\{e,r^2\}$ has $2$ elements.'
          - problem: 'Let $a$, $b$ and $g$ be elements of a group $G$, and let $[a,b]=aba^{-1}b^{-1}$. The conjugate $g[a,b]g^{-1}$ is the commutator of which two elements: $gag^{-1}$ and $gbg^{-1}$, $gag^{-1}$ and $b$, $a$ and $gbg^{-1}$, or $gbg^{-1}$ and $gag^{-1}$?'
            answer: 'gag^-1 and gbg^-1'
            answer_contract: {"kind": "label", "options": [["gag^-1 and gbg^-1", "gag^-1, gbg^-1", "gag^{-1} and gbg^{-1}", "gag^(-1) and gbg^(-1)", "g a g^-1 and g b g^-1", "[gag^-1, gbg^-1]", "the first one"], ["gag^-1 and b", "gag^-1, b", "gag^{-1} and b"], ["a and gbg^-1", "a, gbg^-1", "a and gbg^{-1}"], ["gbg^-1 and gag^-1", "gbg^-1, gag^-1", "gbg^{-1} and gag^{-1}", "[gbg^-1, gag^-1]"]]}
            solution_sketch: 'Insert $g^{-1}g$ between the factors: $g(aba^{-1}b^{-1})g^{-1}=(gag^{-1})(gbg^{-1})(ga^{-1}g^{-1})(gb^{-1}g^{-1})$. This is the commutator of $gag^{-1}$ and $gbg^{-1}$, in this order. The other options conjugate only one entry or swap the entries, and swapping gives the inverse commutator. So conjugation sends commutators to commutators, and $[G,G]$ is normal.'
          - problem: 'The commutator subgroup of a direct product satisfies $[G_1\times G_2,\,G_1\times G_2]=[G_1,G_1]\times[G_2,G_2]$. How many elements does the commutator subgroup of $S_3\times S_3$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Commutators in a direct product are computed componentwise, so the commutator subgroup is $[S_3,S_3]\times[S_3,S_3]$. Each factor is $A_3$ with $3$ elements. So the order is $3\cdot3=9$.'
          - problem: 'The quaternion group $Q_8=\{\pm1,\pm i,\pm j,\pm k\}$ satisfies $i^2=j^2=k^2=-1$ and $ij=k=-ji$. How many elements does $[Q_8,Q_8]$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $ij=-ji$, we get $[i,j]=i^{-1}j^{-1}ij=(-i)(-j)(ij)=ij\cdot ij=k^2=-1$. The other pairs give $1$ or $-1$ in the same way, and $-1$ is central. So $[Q_8,Q_8]=\{1,-1\}$ has $2$ elements.'
          - problem: 'Is every commutator of the symmetric group $S_3$ an even permutation?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "they are all even", "every commutator is even", "even"], ["no", "it is not", "false", "incorrect", "not always", "some are odd", "odd"]]}
            solution_sketch: 'The sign of a permutation is multiplicative, and $\mathrm{sign}(a^{-1}b^{-1}ab)=\mathrm{sign}(a)\,\mathrm{sign}(b)\,\mathrm{sign}(a)\,\mathrm{sign}(b)=+1$, because each sign is $\pm1$. So every commutator is even, and $[S_3,S_3]$ lies inside $A_3$.'
          - problem: 'Three cards lie in a row, and a move is any rearrangement of the three cards. A commutator move is made by doing a move $a$, then a move $b$, then undoing $a$, then undoing $b$. Using commutator moves of all kinds as often as we like, how many different arrangements of the cards can we reach from the starting order?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrangements reached are the elements of the subgroup generated by the commutators of $S_3$, which is $[S_3,S_3]=A_3$. It consists of the starting order and the two cyclic shifts of the row. So $3$ arrangements can be reached.'
          - problem: 'A square tile has $8$ symmetries, the turns and flips that map it onto itself. A commutator move is made by doing a symmetry $a$, then a symmetry $b$, then undoing $a$, then undoing $b$. Using commutator moves of all kinds as often as we like, in how many different positions can we put the tile?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The positions reached are the elements of $[D_4,D_4]$. This subgroup is $\{e,r^2\}$, which consists of the starting position and the half-turn. So the tile can be put in $2$ different positions.'
        constraints: 'identify [G,G] for abelian groups ({e}), S_3 (A_3), D_4 ({e, r^2}), Q_8 ({1, -1}) and direct products; the conjugation-of-commutators normality fact; commutator moves as contexts'
      - id: kp3
        name: 'Abelianization G/[G,G]'
        key_prerequisites: [quotient-groups, abelian-groups]
        step_check:
          step: 'so $a^{-1}b^{-1}ab \in N$'
          question: 'Why does $abN=baN$ give $a^{-1}b^{-1}ab\in N$?'
          options:
            - 'Since $N$ contains $a$ and $b$, it contains every product of them, including $a^{-1}b^{-1}ab$ here'
            - 'Cancelling $N$ from both sides of $abN=baN$ gives $ab=ba$, so the commutator is $e$ and lies in $N$'
            - 'Cosets $xN$ and $yN$ are equal exactly when $y^{-1}x\in N$, and $(ba)^{-1}(ab)=a^{-1}b^{-1}ab$'
            - 'Every normal subgroup contains all products $xy$ with $x,y\in G$, so it contains this one as well'
          answer: 'Cosets $xN$ and $yN$ are equal exactly when $y^{-1}x\in N$, and $(ba)^{-1}(ab)=a^{-1}b^{-1}ab$'
          why: 'Two cosets are the same exactly when the quotient of their representatives lies in $N$; this is what turns equality of cosets into membership of the commutator in $N$.'
        exemplars:
          - problem: 'What is the order of the abelianization $S_3/[S_3,S_3]$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The commutator subgroup $[S_3,S_3]$ is $A_3$, which has $3$ elements. So the abelianization has order $|S_3|/|A_3|=6/3=2$. It is isomorphic to $\mathbb{Z}_2$.'
          - problem: 'In the dihedral group $D_4$ of order $8$ let $r^4=e$, $s^2=e$ and $srs=r^{-1}$. What is the order of the abelianization $D_4/[D_4,D_4]$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $srs=r^{-1}$ we get $[s,r]=s\,r^{-1}s\,r=r^2$, and the commutator subgroup is $[D_4,D_4]=\{e,r^2\}$ with $2$ elements. So the abelianization has order $8/2=4$.'
          - problem: 'The commutator subgroup of the dihedral group $D_4$ of order $8$ is $\{e,r^2\}$. How many elements of order $2$ does the abelianization $D_4/[D_4,D_4]$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The abelianization has order $8/2=4$. Its elements are the cosets of $\{e,r^2\}$, and each non-identity coset squares to the identity coset: $r^2\in\{e,r^2\}$, $s^2=e$ and $(rs)^2=e$. So all $3$ non-identity elements have order $2$, and the quotient is $\mathbb{Z}_2\times\mathbb{Z}_2$.'
          - problem: 'In the dihedral group $D_6$ of order $12$ let $r$ be the rotation of order $6$ and $s$ a reflection with $srs=r^{-1}$. Let $N=\{e,r^3\}$ be the subgroup of order $2$ generated by the half-turn. Is the quotient $D_6/N$ abelian?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is abelian", "abelian"], ["no", "it is not", "false", "incorrect", "it is not abelian", "not abelian", "nonabelian", "non-abelian"]]}
            solution_sketch: 'A quotient $G/N$ is abelian exactly when $[G,G]\subseteq N$. Here $[s,r]=s\,r^{-1}s\,r=r^2$, which is neither $e$ nor $r^3$, so $[D_6,D_6]$ is not inside $N$. So $D_6/N$ is not abelian.'
          - problem: 'In the dihedral group $D_6$ of order $12$ let $r$ be the rotation of order $6$ and $s$ a reflection with $srs=r^{-1}$. What is the order of the commutator $[s,r]=s^{-1}r^{-1}sr$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $srs=r^{-1}$ we get $sr^{-1}s=r$, so $[s,r]=s\,r^{-1}s\,r=r\cdot r=r^2$. The rotation $r$ has order $6$, so $r^2$ has order $6/\gcd(2,6)=3$. So $[s,r]$ has order $3$.'
          - problem: 'Let $G=S_3\times\mathbb{Z}_4$, a direct product of order $24$. What is the order of the abelianization $G/[G,G]$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Commutators in a direct product are computed componentwise, so $[G,G]=[S_3,S_3]\times[\mathbb{Z}_4,\mathbb{Z}_4]=A_3\times\{0\}$, which has $3$ elements. So the abelianization has order $24/3=8$.'
          - problem: 'The quaternion group $Q_8=\{\pm1,\pm i,\pm j,\pm k\}$ has commutator subgroup $\{1,-1\}$. Is the quotient $Q_8/\{1,-1\}$ abelian?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "correct", "it is abelian", "abelian"], ["no", "it is not", "false", "incorrect", "it is not abelian", "not abelian", "nonabelian", "non-abelian"]]}
            solution_sketch: 'A quotient $G/N$ is abelian exactly when $[G,G]\subseteq N$. Here $[Q_8,Q_8]=\{1,-1\}$ is the same as $N$, so the condition holds. So $Q_8/\{1,-1\}$ is abelian; it has order $8/2=4$.'
          - problem: 'The moves of a puzzle form a group $G$ with $120$ elements, and the commutator moves generate a subgroup $[G,G]$ with $60$ elements. Two moves are called equivalent when they lie in the same coset of $[G,G]$. How many classes of equivalent moves are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes are the cosets of $[G,G]$, and they are the elements of the abelianization $G/[G,G]$. Each coset has $60$ moves, so the number of classes is $120/60=2$.'
          - problem: 'Two symmetries of a square tile are called equivalent when one is obtained from the other by following it with commutator moves, that is, when they lie in the same coset of $[D_4,D_4]=\{e,r^2\}$. How many classes of equivalent symmetries are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
