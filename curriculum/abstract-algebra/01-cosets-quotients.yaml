            answer: '$(1\,2\,3)$'
            solution_sketch: 'Transpositions are self-inverse, so the product is $(1\,2)(1\,3)(1\,2)(1\,3)$; tracing $1 \to 2$, $2 \to 3$, $3 \to 1$ gives the 3-cycle $(1\,2\,3)$.'
          - problem: "In $D_4$, let $r$ satisfy $r^4 = e$ and let $s$ be a reflection with $s r s = r^{-1}$; the commutator is $[a, b] = a^{-1} b^{-1} a b$. Take $a = r$ and $b = s$. Determine whether $ab = ba$, and give the order of the commutator $[a, b]$."
            answer: "verdict = differ; m = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["equal"], ["differ"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "Substitute $a = r$, $b = s$ into the definition: $[r, s] = r^{-1} s^{-1} r s = r^{-1} s r s$ since $s^{-1} = s$. Apply the relation $s r s = r^{-1}$: $r^{-1} (s r s) = r^{-1} r^{-1} = r^{-2} = r^2$. Compare the products: $ab = rs$ but $ba = sr = r^{-1} s$, and $rs \\neq r^{-1} s$ (else $r = r^{-1}$), so the products differ. The element $r^2$ satisfies $(r^2)^2 = r^4 = e$ and $r^2 \\neq e$, so its order is 2. The answer is verdict = differ; m = 2."
          - problem: "In $D_4$ with $r^4 = e$, $s^2 = e$, and $s r s = r^{-1}$, use the convention $[a, b] = a^{-1} b^{-1} a b$. Compute $[r^2, s]$. Give the integer $k$ with $0 \\le k \\le 3$ such that $[r^2, s] = r^k$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute into the convention: $[r^2, s] = (r^2)^{-1} s^{-1} r^2 s = r^2 s r^2 s$, using $r^{-2} = r^2$ and $s^{-1} = s$. Regroup: $r^2 (s r^2 s)$, and the relation $s r s = r^{-1}$ gives $s r^2 s = r^{-2}$. So $[r^2, s] = r^2 r^{-2} = e$, which is $r^0$. The answer is $k = 0$."
          - problem: "In $S_3$ with composition right to left, the commutator of $a$ and $b$ is $[a, b] = a^{-1} b^{-1} a b$. Compute $[(1\\,2\\,3), (1\\,2)]$. Give the answer as (x, y, z), where x, y, z are the images of 1, 2, 3 under this commutator."
            answer: "(2,3,1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is $a^{-1} b^{-1} a b$ with $a = (1\\,2\\,3)$, $b = (1\\,2)$, so $a^{-1} = (1\\,3\\,2)$ and $b^{-1} = (1\\,2)$, giving $(1\\,3\\,2)(1\\,2)(1\\,2\\,3)(1\\,2)$. Composing right to left and tracking each point: 1 goes to 2, 2 goes to 3, 3 goes to 1, so the commutator is the 3-cycle $(1\\,2\\,3)$. Its images of 1, 2, 3 are (2,3,1)."
          - problem: "In a group $G$ the commutator of $a$ and $b$ is $[a, b] = a^{-1} b^{-1} a b$, and $[a, b] = e$ holds exactly when $ab = ba$. Suppose $[a, b] = e$ for every choice of $a, b \\in G$. Select the property that $G$ must have."
            answer: "abelian"
            answer_contract: {"kind": "label", "options": [["abelian"], ["cyclic"], ["trivial"], ["simple"]]}
            solution_sketch: "Unwind the definition: $a^{-1} b^{-1} a b = e$ implies $b^{-1} a b = a$, and canceling gives $ab = ba$; holding for every pair means every two elements commute. Wrong option cyclic: an abelian group need not be generated by one element, for example the Klein four-group. Wrong option trivial: any nontrivial abelian group such as C_2 satisfies the hypothesis. Wrong option simple: simplicity concerns normal subgroups and is independent of commutativity. The property G must have is abelian."
          - problem: "In $S_3$, use the convention $[a, b] = a^{-1} b^{-1} a b$ with composition right to left. Evaluate $[a, b]$ for representative pairs of elements of $S_3$. How many distinct elements of $S_3$ occur as commutators $[a, b]$ with $a, b \\in S_3$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute representatives: $[(1\\,2), (1\\,3)] = (1\\,2)(1\\,3)(1\\,2)(1\\,3) = (1\\,2\\,3)$ and $[(1\\,3), (1\\,2)] = (1\\,3\\,2)$ by tracking images. Pairs where the elements commute, such as $a = b$ or a 3-cycle with its square, give $[a, b] = e$. Any pair of distinct transpositions sharing a point gives one of the two 3-cycles, and pairs involving $e$ give $e$. The distinct commutators are $e$, $(1\\,2\\,3)$, $(1\\,3\\,2)$, so the count is 3."
        constraints: "state the convention [a,b] = a^{-1}b^{-1}ab in every problem; concrete computations in S_3 and D_4, abstract cancellation proofs"
      - id: kp2
        name: "The commutator subgroup [G, G]"
        key_prerequisites: [normal-subgroups, abelian-groups]
        exemplars:
          - problem: "The group G = Z12 is abelian, so xy = yx for all elements x and y. Recall that [G, G] is generated by all commutators [x, y] = xyx^(-1)y^(-1). Find the order |[G, G]|."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (commutators in an abelian group): since xy = yx, every commutator [x, y] = xyx^(-1)y^(-1) collapses to e, so the generating set is just {e}. Step 2 (subgroup generated): the subgroup generated by the identity alone is {e}, which has exactly 1 element. The last step gives the answer: |[G, G]| = 1."
          - problem: "In S3, the commutator subgroup [S3, S3] is generated by all commutators [a, b] = a^(-1)b^(-1)ab with a, b in S3. Find the order |[S3, S3]|."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (parity check): the permutation sign of [a, b] = a^(-1)b^(-1)ab is sign(a)^(-1)sign(b)^(-1)sign(a)sign(b) = +1, so every commutator is even and [S3, S3] is contained in A3. Step 2 (exhibit a generator): [(1 2), (1 3)] = (1 2)(1 3)(1 2)(1 3) = (1 2 3), a nontrivial 3-cycle, so [S3, S3] contains a subgroup of order 3. Step 3 (conclude): [S3, S3] is a subgroup of A3 of order at least 3, and A3 has order 3, so |[S3, S3]| = 3."
          - problem: "In D4, let r satisfy r^4 = e, and let s be a reflection with s^2 = e and srs = r^(-1). Use the convention [a, b] = a^(-1)b^(-1)ab. Find the order of the commutator [s, r]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (apply the convention): [s, r] = s^(-1)r^(-1)sr = sr^(-1)sr, using s^(-1) = s. Step 2 (conjugation relation): sr^(-1)s = r because srs = r^(-1), so [s, r] = r · r = r^2. Step 3 (order of the element): r^2 is not e and (r^2)^2 = r^4 = e, so the order of [s, r] is 2."
          - problem: "In D4 with r^4 = e and srs = r^(-1), the commutator subgroup [D4, D4] is generated by the single commutator [s, r]. Give the smallest positive exponent k such that r^k is a non-identity element of [D4, D4], and give n = |[D4, D4]|."
            answer: "k = 2; n = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "k"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "Step 1 (compute the generator): [s, r] = s^(-1)r^(-1)sr = sr^(-1)sr, and sr^(-1)s = r, so [s, r] = r · r = r^2. Step 2 (identify the subgroup): the commutator subgroup [D4, D4] = {e, r^2}, so the smallest positive k with r^k a non-identity element is k = 2, and n = |[D4, D4]| = 2. The answers are k = 2; n = 2."
          - problem: "Let G be a group and let [a, b] = aba^(-1)b^(-1) denote the commutator of a and b. Write a' = gag^(-1) and b' = gbg^(-1). The fact that conjugation sends each commutator to a single commutator is the key step in proving that [G, G] is normal in G. Which expression equals g[a, b]g^(-1)?"
            answer: "[a', b']"
            answer_contract: {"kind": "label", "options": [["[a', b']"], ["[a', b]"], ["[a, b']"], ["[b', a']"]]}
            solution_sketch: "Step 1 (expand the conjugate): g(aba^(-1)b^(-1))g^(-1) = (gag^(-1))(gbg^(-1))(ga^(-1)g^(-1))(gb^(-1)g^(-1)) = [a', b'] by the definition of the commutator, so conjugation maps commutators to commutators and preserves the subgroup they generate. Step 2 (name each wrong option): the option [a', b] forgets to conjugate b by g; the option [a, b'] forgets to conjugate a by g; the option [b', a'] swaps the two entries and equals the inverse [a', b']^(-1), which is not the conjugate in general. The last step states the answer: [a', b']."
          - problem: "For direct products one has [G1 x G2, G1 x G2] = [G1, G1] x [G2, G2]. Let G = S3 x S3, where |[S3, S3]| = 3. Find the order |[G, G]|."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (commutators in a direct product): a commutator in S3 x S3 has the form ([x1, y1], [x2, y2]), so [S3 x S3, S3 x S3] = [S3, S3] x [S3, S3]. Step 2 (multiply the orders): each factor [S3, S3] has order 3, so |[G, G]| = 3 · 3. The last step states the answer: |[G, G]| = 9."
        constraints: "identify [G,G] for abelian groups ({e}), S_3 (A_3), D_4 ({e, r^2}); the conjugation-of-commutators normality argument"
      - id: kp3
        name: "Abelianization G/[G,G]"
        key_prerequisites: [quotient-groups, abelian-groups]
        exemplars:
          - problem: 'Prove that the quotient $G/[G, G]$ is abelian.'
            answer: 'Writing $N = [G,G]$: $(aN)^{-1}(bN)^{-1}(aN)(bN) = [a,b]N = N$, so any two cosets commute.'
            answer_contract: {kind: none}
            solution_sketch: 'The commutator of two cosets is the coset of the commutator, which lies in $N$ by definition.'
          - problem: 'Prove: for $N \trianglelefteq G$, the quotient $G/N$ is abelian if and only if $[G, G] \subseteq N$.'
            answer: '$aN \cdot bN = bN \cdot aN \iff [a,b] \in N$ for all $a, b$; that holds for all pairs iff $N$ contains every commutator, i.e. $[G,G] \subseteq N$.'
            answer_contract: {kind: none}
            solution_sketch: '$[G,G]$ is the smallest normal subgroup with abelian quotient — the universal property of abelianization.'
        constraints: "the two structural proofs, plus computing abelianizations of S_3 (Z_2) and D_4 (Z_2 x Z_2) by order and element-order counts"
    diagnostic_exemplar:
      problem: 'In $D_4$ (with $r$ of order $4$, $s$ a reflection), compute $[s, r] = s^{-1}r^{-1}sr$, state $[D_4, D_4]$, and identify the abelianization $D_4/[D_4, D_4]$.'
