unit: actions
course: abstract-algebra
module: "Group Actions"
topics:
  - id: group-actions
    name: "Group Actions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: permutations-cycle-notation
        weight: 0.8
        key: true
      - id: elementary-group-properties
        weight: 0.5
        key: false
      - id: dihedral-groups
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Definition and verifying the axioms"
        key_prerequisites: [elementary-group-properties, permutations-cycle-notation]
        try_first:
          problem: 'A dial has the positions $0,1,\dots,11$. Turning it $7$ steps clockwise and then $8$ more steps clockwise moves it from position $0$ to which position?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'Two turns act as one turn by $7+8 = 15 \equiv 3$ steps, so the dial stops at position $3$. This is the second axiom of an action: acting by $h$ and then by $g$ equals acting once by the product.'
        step_check:
          step: 'Check the compatibility axiom'
          question: 'Why does this step compute $g\cdot(h\cdot x)$ and compare it with $(gh)\cdot x$?'
          options:
            - 'The axiom says that $g\cdot(h\cdot x)$ must equal $g\cdot x$ for every element $h$ of the group'
            - 'The axiom says that acting by $h$ and then by $g$ equals acting once by the product $gh$'
            - 'The axiom says that $g\cdot(h\cdot x)$ must equal $h\cdot(g\cdot x)$ for all $g$ and $h$'
            - 'The axiom says that $g\cdot x = x$ must hold for every element $g$ of the group'
          answer: 'The axiom says that acting by $h$ and then by $g$ equals acting once by the product $gh$'
          why: 'The second axiom says that acting by $h$ and then by $g$ is the same as acting once by $gh$; it does not make the group commute, and it does not ask $g$ to fix points.'
        exemplars:
          - problem: 'The group $\mathbb{Z}_6$ with addition modulo $6$ acts on the set $X=\mathbb{Z}_6$ by $g\cdot x = x+g \bmod 6$. Does this rule define an action of the group on $X$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is an action", "it is a group action", "it defines an action", "valid"], ["no", "it is not an action", "not an action", "it does not define an action", "invalid"]]}
            solution_sketch: 'The identity $0$ gives $0\cdot x = x+0 = x$, so the first axiom holds. For the second, $g\cdot(h\cdot x) = (x+h)+g = x+(g+h) = (g+h)\cdot x$ modulo $6$, and the result stays in $\mathbb{Z}_6$, so the rule is an action.'
          - problem: 'The group $\mathbb{Z}_5$ acts on $X=\mathbb{Z}_5$ by $g\cdot x = x+3g \bmod 5$. Compute $3\cdot(4\cdot 2)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First compute the inner action: $4\cdot 2 = 2+3\cdot 4 = 14 \equiv 4 \pmod 5$. Then $3\cdot 4 = 4+3\cdot 3 = 13 \equiv 3 \pmod 5$, so the value is $3$. As a check, $(3\cdot 4)\cdot 2 = 2\cdot 2 = 2+6 = 8 \equiv 3$, the same value.'
          - problem: 'The dial of a safe has the positions $0,1,\dots,11$. Turning the dial $g$ steps clockwise gives an action of $\mathbb{Z}_{12}$ on the positions. The dial starts at position $5$, is turned $7$ steps and is then turned $8$ steps. At which position does it stop?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Turning the dial is an action of $\mathbb{Z}_{12}$ on the positions, so two turns together act as one turn by the sum. The turns of $7$ and $8$ steps equal one turn of $15 \equiv 3$ steps, and $5+3 = 8$. The dial stops at position $8$.'
          - problem: 'Sam says that the rule $g\cdot x = xg$ defines an action of the group $S_3$ on the set $S_3$, because $e\cdot x = x$ holds. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Sam is right", "it is an action", "it is a group action"], ["no", "Sam is wrong", "Sam is not right", "it is not an action", "not an action", "it does not define an action"]]}
            solution_sketch: 'The rule gives $g\cdot(h\cdot x) = (xh)g = xhg$, while $(gh)\cdot x = x(gh) = xgh$. In the non-abelian group $S_3$ these differ for some $g$ and $h$, so the second axiom fails even though $e\cdot x = x$ holds. Sam is wrong; the rule $g\cdot x = xg^{-1}$ repairs it.'
          - problem: 'Products of permutations are composed from right to left. Sam''s rule $g\cdot x = xg$ acts on the set $S_3$. Take $g=(1\,2)$, $h=(1\,3)$ and $x=e$. What is the image of $1$ under the permutation $g\cdot(h\cdot x)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x=e$ the rule gives $h\cdot e = h$ and then $g\cdot h = hg$. Composing from right to left, $(hg)(1) = h(g(1)) = h(2) = 2$, so the image of $1$ is $2$. The other side $(gh)\cdot e = gh$ sends $1$ to $g(h(1)) = g(3) = 3$, so the two sides differ.'
          - problem: 'Sam''s rule $g\cdot x = xg$ acts on the set $S_3$. For how many ordered pairs $(g,h)$ of elements of $S_3$ does $g\cdot(h\cdot e)$ differ from $(gh)\cdot e$?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $g\cdot(h\cdot e) = hg$ and $(gh)\cdot e = gh$, and these differ exactly when $g$ and $h$ do not commute. The identity commutes with all $6$ elements, each $3$-cycle with $3$, and each transposition with $2$, so $6+6+6 = 18$ of the $36$ ordered pairs commute and $18$ do not.'
          - problem: 'For which value of $k$ in $\mathbb{Z}_7$ does the rule $g\cdot x = x+g+k \bmod 7$ define an action of $\mathbb{Z}_7$ on $\mathbb{Z}_7$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first axiom needs $0\cdot x = x$, and the rule gives $0\cdot x = x+0+k = x+k$. This equals $x$ for every $x$ only when $k\equiv 0 \pmod 7$. For $k=0$ the second axiom also holds, so $k = 0$.'
          - problem: 'The dial of a safe has the positions $0,1,\dots,11$, and turning it $g$ steps clockwise gives an action of $\mathbb{Z}_{12}$ on the positions. A single turn moves the dial from position $5$ to position $2$. What is the smallest number of steps by which it could have been turned?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Turning by $g$ steps moves position $5$ to $5+g$, so we need $5+g\equiv 2 \pmod{12}$. Subtract $5$ to get $g\equiv -3\equiv 9 \pmod{12}$. A single turn of $9$ steps does the job.'
        constraints: 'verify or refute proposed actions; include failing examples (right multiplication without the inverse, a shifted rule); compute composites of actions in context'
      - id: kp2
        name: "Standard examples: rotation, permutation, conjugation, left multiplication"
        key_prerequisites: [permutations-cycle-notation, dihedral-groups]
        step_check:
          step: 'leaving 3 unchanged'
          question: 'Why does the step say that $(1\,2)$ leaves $3$ unchanged?'
          options:
            - 'A transposition always fixes the largest point of the set it acts on'
            - 'The point $3$ is odd while $1$ and $2$ are not, so it cannot move'
            - 'Every permutation of $\{1,2,3\}$ fixes exactly one point of the set'
            - 'A cycle moves only the points it lists, so $3$ stays where it is'
          answer: 'A cycle moves only the points it lists, so $3$ stays where it is'
          why: 'A permutation written as cycles sends each listed point to the next one in its cycle, and every point not listed is sent to itself.'
        exemplars:
          - problem: 'The dihedral group $D_4$ acts on the vertices $1,2,3,4$ of a square, labelled counterclockwise. The rotation $r$ turns the square by $90^\circ$ counterclockwise and sends vertex $1$ to vertex $2$. To which vertex does $r^2$ send vertex $1$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The action of $r$ on the vertices sends $1\to2\to3\to4\to1$, and $r^2$ is this move done twice. So $r^2$ sends $1$ to $2$ and then to $3$. The answer is vertex $3$.'
          - problem: 'A group $G$ acts on itself by conjugation, $g\cdot x = gxg^{-1}$. What name is given to the orbits of this action?'
            answer: 'conjugacy classes'
            answer_contract: {"kind": "label", "options": [["conjugacy classes", "conjugacy class", "the conjugacy classes", "classes of conjugate elements"], ["cosets", "left cosets", "the cosets"], ["stabilizers", "stabilizer", "the stabilizers"], ["centralizers", "centralizer", "the centralizers"]]}
            solution_sketch: 'The orbit of $x$ under conjugation is $\{gxg^{-1} : g\in G\}$, the set of all elements conjugate to $x$. These sets are the conjugacy classes of $G$. Cosets are orbits of the left multiplication action, and stabilizers and centralizers are subgroups, not orbits.'
          - problem: 'The symmetric group $S_3$ acts on itself by conjugation, $g\cdot x = gxg^{-1}$. How many elements are in the orbit of the transposition $(1\,2)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Conjugation keeps the cycle type, so every conjugate of $(1\,2)$ is a transposition. Conjugating by suitable elements reaches all three transpositions $(1\,2)$, $(1\,3)$ and $(2\,3)$, so the orbit has $3$ elements.'
          - problem: 'The symmetric group $S_4$ acts on the set $\{1,2,3,4\}$ by permuting the points, and the cyclic subgroup generated by $(1\,2\,3\,4)$ acts on the same set. How many points are in the orbit of $1$ under this subgroup?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The generator sends $1\to2\to3\to4\to1$, so the powers of $(1\,2\,3\,4)$ send $1$ to each of the four points. The orbit of $1$ is $\{1,2,3,4\}$, so its size is $4$.'
          - problem: 'The dihedral group $D_4$ acts on itself by left multiplication, $g\cdot x = gx$. How many elements are in the orbit of the rotation $r$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left multiplication by $g$ sends $r$ to $gr$, and every $y$ in $D_4$ equals $(yr^{-1})r$, so every element is reached. The orbit is all of $D_4$, which has $8$ elements.'
          - problem: 'The group $\mathbb{Z}_6$, written additively, acts on itself by conjugation, $g\cdot x = g+x-g$. How many elements are in the orbit of $3$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is abelian, so conjugation gives $g+3-g = 3$ for every $g$. The orbit of $3$ is just $\{3\}$, which has $1$ element.'
          - problem: 'A round table has $10$ seats numbered $0,1,\dots,9$. Turning the table by $g$ seats moves a guest from seat $x$ to seat $x+g$ modulo $10$, which is an action of $\mathbb{Z}_{10}$. A guest who sat in seat $7$ now sits in seat $2$. What is the smallest number of seats by which the table could have been turned?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Turning the table by $g$ seats moves a guest from seat $7$ to seat $7+g$ modulo $10$. We need $7+g\equiv 2$, so $g\equiv -5\equiv 5 \pmod{10}$. The table was turned by $5$ seats.'
          - problem: 'A round table has $8$ seats numbered $0,1,\dots,7$. Turning the table by $g$ seats moves a guest from seat $x$ to seat $x+g$ modulo $8$. A guest sits in seat $6$ and the table is turned by $5$ seats. In which seat is the guest now?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A turn of $5$ seats moves seat $6$ to seat $6+5 = 11$, and $11\equiv 3 \pmod 8$ because the table has $8$ seats. The guest is now in seat $3$.'
          - problem: 'The group $S_4$ acts on $\{1,2,3,4\}$ by $\sigma\cdot i = \sigma(i)$. Let $g=(1\,2)(3\,4)$ and $h=(1\,3)$. What is $g\cdot(h\cdot 2)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $h=(1\,3)$ fixes $2$, so $h\cdot 2 = 2$. Then $g=(1\,2)(3\,4)$ sends $2$ to $1$, so $g\cdot(h\cdot 2) = 1$.'
        constraints: 'the four canonical actions; images of points and orbit sizes rather than cycle-notation answers; round-table and dial contexts'
      - id: kp3
        name: "Actions as homomorphisms to symmetric groups"
        key_prerequisites: [permutations-cycle-notation]
        step_check:
          step: 'The permutations $\sigma_e$, $\sigma_a$, and $\sigma_{a^2}$ are all distinct'
          question: 'Why do three distinct permutations show that the homomorphism is injective?'
          options:
            - 'Different elements have different images, so the kernel is trivial'
            - 'Three images fill all of $S_3$, and every map onto a group is injective'
            - 'Distinct permutations always form a cyclic subgroup of the group $S_X$'
            - 'Each permutation has order $3$, and that equals the order of the group'
          answer: 'Different elements have different images, so the kernel is trivial'
          why: 'A homomorphism is injective exactly when its kernel is trivial, which happens when different elements always have different images.'
        exemplars:
          - problem: 'The group $\mathbb{Z}_5$ acts on the set $\{0,1,2,3,4\}$ by $g\cdot x = x+g \bmod 5$. Each element $g$ gives a permutation $\sigma_g$ of the set, and $g\mapsto\sigma_g$ is a homomorphism from $\mathbb{Z}_5$ to $S_5$. Find $\sigma_3(4)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $\sigma_3$ adds $3$ to each point modulo $5$. So $\sigma_3(4) = 4+3 = 7 \equiv 2 \pmod 5$, and the image of $4$ is $2$.'
          - problem: 'The dihedral group $D_4$ acts on the vertices $1,2,3,4$ of a square, giving a homomorphism $\varphi: D_4 \to S_4$. A symmetry that fixes all four vertices must be the identity. What is the order of the image $\varphi(D_4)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A symmetry that fixes all four vertices is the identity, so the kernel of $\varphi$ is trivial and $\varphi$ is injective. An injective map keeps the number of elements, so the image has $8$ elements.'
          - problem: 'The dihedral group $D_4$ acts on the two diagonals of a square, the one joining vertices $1$ and $3$ and the one joining vertices $2$ and $4$. The quarter turn $r$ swaps the two diagonals, and the action gives a homomorphism $D_4\to S_2$. What is the order of its kernel?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements acting trivially on the diagonals are $e$, the half-turn $r^2$ and the two reflections in the diagonals, since each of these keeps both diagonals in place. These form the kernel, and it has $4$ elements. The quarter turns and the two midline reflections swap the diagonals, so they lie outside the kernel.'
          - problem: 'The group $\mathbb{Z}_4=\{0,1,2,3\}$ acts on the set $\{1,2\}$ so that the element $1$ acts as the swap of $1$ and $2$ and the element $0$ acts as the identity. This gives a homomorphism $\mathbb{Z}_4\to S_2$. How many elements of $\mathbb{Z}_4$ act as the identity permutation?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The generator $1$ acts as the swap, so $k$ acts as the swap when $k$ is odd and as the identity when $k$ is even. The elements $0$ and $2$ act as the identity, so there are $2$ of them.'
          - problem: 'The group $V=\mathbb{Z}_2\times\mathbb{Z}_2$ acts on itself by translation, $g\cdot x = g+x$, where addition is done coordinate by coordinate modulo $2$. Each $g$ gives a permutation $\sigma_g$ of the four elements of $V$. Find $\sigma_{(1,0)}(0,1)$.'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The element $(1,0)$ acts by adding $(1,0)$ coordinate by coordinate modulo $2$. So $\sigma_{(1,0)}(0,1) = (0+1,\ 1+0) = (1,1)$.'
          - problem: 'The group $\mathbb{Z}_6$ acts on the set $\{0,1,2\}$ by $g\cdot x = x+g \bmod 3$. An action is faithful when different group elements give different permutations. Is this action faithful?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is faithful", "faithful"], ["no", "it is not faithful", "not faithful", "unfaithful"]]}
            solution_sketch: 'The element $3$ acts as $x\mapsto x+3\equiv x \pmod 3$, which is the identity on $\{0,1,2\}$, yet $3\neq 0$ in $\mathbb{Z}_6$. So two different group elements give the same permutation, the kernel is not trivial, and the action is not faithful.'
          - problem: 'The group $\mathbb{Z}_6$ acts on the set $\{0,1,2\}$ by $g\cdot x = x+g \bmod 3$, which gives a homomorphism $\mathbb{Z}_6\to S_3$. What is the order of its kernel?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element $g$ acts as the identity exactly when $g\equiv 0 \pmod 3$. In $\mathbb{Z}_6$ this gives $g=0$ and $g=3$, so the kernel has $2$ elements.'
          - problem: 'A group $G$ of order $12$ acts on a set of $5$ objects. Moving the objects around by the elements of $G$ gives a homomorphism $G\to S_5$ whose kernel has order $3$. How many different rearrangements of the objects do the $12$ elements of $G$ produce?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two elements of $G$ give the same rearrangement exactly when they lie in the same coset of the kernel. The kernel has $3$ elements, so the number of different rearrangements is $12/3 = 4$.'
          - problem: 'A group of order $30$ acts on a set of toy blocks. Together its elements produce exactly $6$ different rearrangements of the blocks. How many elements of the group leave every block in place?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The different rearrangements correspond to the cosets of the kernel, so $30 = 6\cdot|\text{kernel}|$. The kernel is the set of elements that leave every block in place, and it has $30/6 = 5$ elements.'
        constraints: 'translate actions to permutation representations; images of points, orders of images and kernels; faithfulness checks on small examples'
    diagnostic_exemplar:
      problem: 'Does $g \cdot x = x g$ (right multiplication used as a left action) define an action of a non-abelian $G$ on itself? Check the composition axiom.'
      answer: 'No: $g \cdot (h \cdot x) = xhg$ but $(gh) \cdot x = xgh$, and $xhg \neq xgh$ in general.'
      answer_contract: {kind: none}
      solution_sketch: 'The order of factors comes out reversed; the fix is $g \cdot x = xg^{-1}$, which does satisfy the axioms.'
    anki_seeds:
      - front: "Two axioms of a group action?"
        back: "$e \\cdot x = x$ and $g \\cdot (h \\cdot x) = (gh) \\cdot x$."
        type: basic
      - front: "A group action of $G$ on $X$ is equivalently a homomorphism into..."
        back: "$S_X$, the symmetric group on $X$ ($g \\mapsto (x \\mapsto g \\cdot x)$)."
        type: basic
      - front: "Orbits of the conjugation action of $G$ on itself?"
        back: "Conjugacy classes."
        type: basic

  - id: orbits-stabilizers
    name: "Orbits and Stabilizers"
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: group-actions
        weight: 0.9
        key: true
      - id: equivalence-classes-partitions
        weight: 0.5
        key: false
      - id: subgroups-subgroup-tests
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing orbits"
        key_prerequisites: [group-actions, equivalence-classes-partitions]
        step_check:
          step: 'Apply the generator repeatedly to each element'
          question: 'Why does the worked example apply the generator again and again to each starting point?'
          options:
            - 'Each new application of the generator creates a new orbit that must be listed on its own'
            - 'Repeating the generator tests whether the action satisfies the two axioms of an action'
            - 'The orbit holds all images under powers of the generator, so we repeat until it closes'
            - 'The first image of a point is enough, because every orbit of this group has two points'
          answer: 'The orbit holds all images under powers of the generator, so we repeat until it closes'
          why: 'Every element of a cyclic group is a power of its generator, so the orbit of a point is the list of its images under these powers, which closes up when a point repeats.'
        exemplars:
          - problem: 'The cyclic subgroup $\langle (1\,3)(2\,4)\rangle$ of $S_4$ acts on the set $\{1,2,3,4\}$. What is the orbit of $1$?'
            answer: '1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group has two elements, the identity and $g=(1\,3)(2\,4)$, because $g^2=e$. Applying $g$ to $1$ gives $3$, so the orbit of $1$ is $\{1,3\}$.'
          - problem: 'The subgroup $\langle (1\,2),\,(3\,4)\rangle$ of $S_4$ acts on the set $\{1,2,3,4\}$. How many orbits does this action have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every product of the two commuting swaps moves points only inside $\{1,2\}$ or only inside $\{3,4\}$. So the orbits are $\{1,2\}$ and $\{3,4\}$, and there are $2$ orbits.'
          - problem: 'The cyclic subgroup $\langle (1\,2\,3)(4\,5)\rangle$ of $S_5$ acts on the set $\{1,2,3,4,5\}$. What is the orbit of $1$?'
            answer: '1, 2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers of $g=(1\,2\,3)(4\,5)$ send $1$ to $2$, then to $3$, then back to $1$, while the swap $(4\,5)$ never touches these points. The orbit of $1$ is $\{1,2,3\}$.'
          - problem: 'The subgroup $\langle (1\,2\,3),\,(3\,4\,5)\rangle$ of $S_6$ acts on the set $\{1,2,3,4,5,6\}$. What is the orbit of $4$?'
            answer: '1, 2, 3, 4, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit of $4$ is the smallest set containing $4$ that both generators map into itself. The generator $(3\,4\,5)$ takes $4$ to $5$ and to $3$, and then $(1\,2\,3)$ takes $3$ to $1$ and $2$. No generator moves $6$, so the orbit is $\{1,2,3,4,5\}$.'
          - problem: 'The cyclic subgroup $\langle (1\,2\,6)(3\,4)\rangle$ of $S_6$ acts on the set $\{1,2,3,4,5,6\}$. How many orbits does this action have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbits of a cyclic group are the cycles of its generator, including the fixed points. The generator $(1\,2\,6)(3\,4)$ has the cycles $\{1,2,6\}$ and $\{3,4\}$, and it fixes $5$. So there are $3$ orbits.'
          - problem: 'The subgroup $\langle (1\,2)(4\,5),\,(2\,3)(5\,6)\rangle$ of $S_6$ acts on the set $\{1,2,3,4,5,6\}$. What is the orbit of $5$?'
            answer: '4, 5, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The generator $(1\,2)(4\,5)$ sends $5$ to $4$, and $(2\,3)(5\,6)$ sends $5$ to $6$. Neither generator moves any of $4,5,6$ into $1,2,3$, so the orbit of $5$ is $\{4,5,6\}$.'
          - problem: 'A dial has the positions $0,1,\dots,11$. A mechanic is allowed to turn it only by multiples of $4$ steps, which gives an action of the subgroup $\{0,4,8\}$ of $\mathbb{Z}_{12}$ on the positions. Which positions can the dial reach from position $3$?'
            answer: '3, 7, 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The allowed turns are $0$, $4$ and $8$ steps modulo $12$. From position $3$ they reach positions $3$, $7$ and $11$, so these are the positions the dial can reach.'
          - problem: 'A dial has $15$ positions numbered $0,1,\dots,14$, and it may be turned only by multiples of $6$ steps. These turns act on the positions through the subgroup of $\mathbb{Z}_{15}$ generated by $6$. Into how many orbits do the $15$ positions split?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiples of $6$ modulo $15$ are the same as the multiples of $\gcd(6,15)=3$, so each orbit has $5$ positions. The $15$ positions therefore split into $15/5 = 3$ orbits.'
        constraints: 'subgroups of S_n (n <= 6) acting on points, and turns of a dial; orbits as comma lists of points or as counts'
      - id: kp2
        name: "Computing stabilizers"
        key_prerequisites: [group-actions, subgroups-subgroup-tests]
        step_check:
          step: 'so $2$ is pinned and cannot move'
          question: 'Why is the condition $\sigma(2)=2$ all that is needed for $\sigma$ to lie in $\mathrm{Stab}(2)$?'
          options:
            - 'The stabilizer is the set of permutations that fix every point of the set'
            - 'The stabilizer is the set of permutations that send $2$ to every other point'
            - 'The stabilizer is the set of permutations that send $2$ into its own orbit'
            - 'The stabilizer is the set of elements that send the point $2$ to itself'
          answer: 'The stabilizer is the set of elements that send the point $2$ to itself'
          why: 'By definition $\mathrm{Stab}(x)=\{g : g\cdot x = x\}$, so only the image of the single point $x$ matters; the other points may move.'
        exemplars:
          - problem: 'The symmetric group $S_4$ acts on the set $\{1,2,3,4\}$ by permuting the points. How many permutations are in the stabilizer of $1$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation in the stabilizer of $1$ must satisfy $\sigma(1)=1$. It can permute the other three points $2,3,4$ freely, so there are $3! = 6$ of them.'
          - problem: 'The dihedral group $D_5$ of symmetries of a regular pentagon acts on its five vertices, labelled $1$ to $5$ counterclockwise. How many elements of $D_5$ are in the stabilizer of vertex $3$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes every vertex. A nontrivial rotation moves every vertex, and of the five reflections only the one whose axis passes through vertex $3$ fixes it, so the stabilizer has $2$ elements.'
          - problem: 'The symmetric group $S_3$ acts on the three two-element subsets of $\{1,2,3\}$. How many permutations are in the stabilizer of the subset $\{1,2\}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation fixes the subset $\{1,2\}$ when it sends the pair to itself. Only $e$ and $(1\,2)$ do this, so the stabilizer has $2$ elements. The orbit has $3$ pairs, and $6 = 3\cdot 2$.'
          - problem: 'The symmetric group $S_4$ permutes the vertices $1,2,3,4$ of the complete graph on four vertices, and so acts on its six edges. How many permutations are in the stabilizer of the edge joining $1$ and $2$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'To fix the edge $\{1,2\}$ a permutation must send the pair $\{1,2\}$ to itself, which can happen in $2$ ways. The points $3$ and $4$ can then be permuted in $2$ ways, so the stabilizer has $2\cdot 2 = 4$ elements.'
          - problem: 'The group $\mathbb{Z}_{12}$ acts on the set $\mathbb{Z}_4$ by $g\cdot x = x+g \bmod 4$. What is the stabilizer of the point $0$?'
            answer: '0, 4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element $g$ fixes the point $0$ when $0+g\equiv 0 \pmod 4$, that is, when $g$ is a multiple of $4$. In $\mathbb{Z}_{12}$ these elements are $0, 4, 8$, and they form a subgroup.'
          - problem: 'The symmetric group $S_5$ acts on the ten two-element subsets of $\{1,2,3,4,5\}$. How many permutations are in the stabilizer of the subset $\{1,2\}$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation fixes the subset $\{1,2\}$ if it fixes both $1$ and $2$ or swaps them, which is $2$ choices. The other three points can be permuted in $3! = 6$ ways, so the stabilizer has $2\cdot 6 = 12$ elements.'
          - problem: 'Sam says that in the action of $S_3$ on $\{1,2,3\}$ the stabilizer of $1$ has $3$ elements, because the set has $3$ points. How many elements does the stabilizer of $1$ really have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation fixes the point $1$ only if $\sigma(1)=1$, and then it permutes the other two points freely. That gives $2! = 2$ elements, namely $e$ and $(2\,3)$, so Sam is wrong.'
          - problem: 'Five students sit at five desks. The group $S_5$ of all $120$ rearrangements acts on the students. How many of the rearrangements leave the student who sits at desk $1$ at that desk?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Leaving the student at desk $1$ in place leaves the other $4$ students to be rearranged freely among the other $4$ desks. That gives $4! = 24$ rearrangements.'
          - problem: 'The $12$ symmetries of a regular hexagon act on the six positions of a bracelet at its corners. How many of the symmetries keep one chosen corner where it is?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group has $12$ symmetries and acts transitively on the $6$ corners, so the stabilizer of a corner has $12/6 = 2$ elements. They are the identity and the reflection through that corner.'
        constraints: 'stabilizer sizes in S_n and D_n actions, stabilizers as sets of integers for Z_n actions; always subgroups'
      - id: kp3
        name: "Fixed points and transitive actions"
        key_prerequisites: [group-actions]
        step_check:
          step: 'so $x$ is in the center of $S_3$'
          question: 'Why does a fixed point of the conjugation action have to lie in the center?'
          options:
            - 'Fixing $x$ means $gxg^{-1}=e$ for every $g$, so $x$ has to be the identity'
            - 'Fixing $x$ means $gxg^{-1}=x$, so $x$ commutes with every $g$'
            - 'Conjugation by $g$ fixes $x$ exactly when $g$ itself lies in the center'
            - 'Every element commutes with its own conjugates, so every $x$ is central'
          answer: 'Fixing $x$ means $gxg^{-1}=x$, so $x$ commutes with every $g$'
          why: 'Multiplying $gxg^{-1}=x$ on the right by $g$ gives $gx = xg$, so $x$ commutes with every element, which is the definition of the center.'
        exemplars:
          - problem: 'The dihedral group $D_4$ acts on the four vertices of a square by its symmetries. Is the action transitive?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is transitive", "transitive", "the action is transitive"], ["no", "it is not transitive", "not transitive", "intransitive"]]}
            solution_sketch: 'The rotation $r$ sends vertex $1$ to $2$, then $3$, then $4$, so the orbit of vertex $1$ is all four vertices. A single orbit means any vertex can be moved to any other, so the action is transitive.'
          - problem: 'The group $S_3$ acts on itself by conjugation, $g\cdot x = gxg^{-1}$. How many fixed points does this action have, that is, how many elements $x$ satisfy $gxg^{-1}=x$ for every $g$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A fixed point $x$ of conjugation satisfies $gxg^{-1}=x$ for all $g$, so $x$ is in the center of $S_3$. The transposition $(1\,2)$ is moved to $(1\,3)$ by $(2\,3)$, and $(1\,2\,3)$ is moved to its inverse by $(1\,2)$, so only $e$ is fixed. There is $1$ fixed point.'
          - problem: 'The group $D_4=\{e,r,r^2,r^3,s,rs,r^2s,r^3s\}$ acts on itself by conjugation. How many elements $x$ satisfy $gxg^{-1}=x$ for every $g$ in $D_4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fixed points of conjugation form the center of $D_4$. The half-turn $r^2$ commutes with every rotation and every reflection, since $sr^2s = r^{-2} = r^2$, while $r$ does not commute with $s$. The center is $\{e, r^2\}$, so there are $2$ fixed points.'
          - problem: 'The group $S_3$ acts on itself by conjugation. How many orbits does this action have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbits of conjugation are the conjugacy classes. In $S_3$ these are $\{e\}$, the three transpositions and the two $3$-cycles, so there are $3$ orbits.'
          - problem: 'Does the group $S_3$ act transitively on itself by conjugation?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is transitive", "transitive"], ["no", "it does not", "it is not transitive", "not transitive", "intransitive"]]}
            solution_sketch: 'The orbit of $e$ under conjugation is $\{e\}$, which is not all of $S_3$. So there is more than one orbit and the action is not transitive; there are $3$ orbits in total.'
          - problem: 'The dihedral group $D_4$ acts on the four vertices of a square. How many vertices are fixed by every element of $D_4$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A vertex fixed by all of $D_4$ would have to be fixed by the quarter turn $r$. But $r$ sends vertex $1$ to $2$ and moves every vertex, so no vertex is fixed by all of $D_4$. There are $0$ fixed points.'
          - problem: 'The cyclic group $\langle (1\,2\,3)\rangle$ acts on the set $\{1,2,3,4,5\}$. How many points are fixed by every element of the group?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group generated by $(1\,2\,3)$ moves $1$, $2$ and $3$ but fixes $4$ and $5$. A point fixed by every element must be fixed by the generator, so exactly $2$ points are fixed.'
          - problem: 'A carousel has $12$ horses in a ring, numbered $0$ to $11$. A rider may move every horse forward only by a multiple of $4$ places. These moves act on the horses through the subgroup $\{0,4,8\}$ of $\mathbb{Z}_{12}$. Into how many orbits do the horses split?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The allowed moves are $0$, $4$ and $8$ places, so each orbit has $3$ horses. The $12$ horses split into $12/3 = 4$ orbits, one for each set of horses whose numbers differ by multiples of $4$.'
          - problem: 'Six dancers stand at the positions $1,\dots,6$. At a signal the dancer at position $1$ moves to $2$, the one at $2$ moves to $3$, the one at $3$ moves to $1$, and the dancers at $4$ and $5$ swap places, which is the permutation $(1\,2\,3)(4\,5)$. How many dancers end at the position where they started?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $(1\,2\,3)(4\,5)$ moves the positions $1,2,3,4,5$ and leaves position $6$ alone. Exactly $1$ dancer stays in place.'
        constraints: 'transitivity verdicts paired with the number of orbits; fixed points of conjugation = center'
    diagnostic_exemplar:
      problem: '$D_4$ acts on the four vertices $1, 2, 3, 4$ of a square (labelled counterclockwise). Find the orbit and the stabilizer of vertex $1$, and say whether the action is transitive.'
      answer: 'The rotation $r$ acts as the $4$-cycle $(1\,2\,3\,4)$, so the orbit of $1$ is all of $\{1,2,3,4\}$ and the action is transitive (a single orbit). The stabilizer is $\mathrm{Stab}(1) = \{e, d\}$, where $d$ is the reflection in the diagonal through vertices $1$ and $3$ — the only nonidentity symmetry fixing vertex $1$. Note $|D_4| = 8 = 4 \cdot 2 = |\mathrm{Orb}(1)| \cdot |\mathrm{Stab}(1)|$.'
      answer_contract: {kind: none}
      solution_sketch: 'Rotations carry vertex $1$ to every vertex, so there is one orbit; only the identity and the diagonal reflection through vertex $1$ fix it.'
