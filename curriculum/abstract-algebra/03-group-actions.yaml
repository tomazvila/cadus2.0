unit: actions
course: abstract-algebra
module: "Group Actions"
topics:
  - id: group-actions
    name: "Group Actions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: permutations-cycle-notation
        weight: 0.8
        key: true
      - id: elementary-group-properties
        weight: 0.5
        key: false
      - id: dihedral-groups
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Definition and verifying the axioms"
        key_prerequisites: [elementary-group-properties, permutations-cycle-notation]
        exemplars:
          - problem: "Let G = Z/6 with addition mod 6 act on X = Z/6 by g.x = x + g mod 6. State which outcome applies, and give 0 if it is an action or the smallest positive g that breaks the second rule if it is not."
            answer: "verdict = valid; n = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["identity"], ["compose"], ["closure"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The full object is the operation g.x = x + g mod 6 on Z/6. Identity step: 0.x = x + 0 = x, so identity holds and the identity option is wrong. Compose step: g.(h.x) = (x+h)+g = x+h+g and (g+h).x = x+(g+h) = x+g+h, so the two sides are equal and the compose option is wrong. Closure step: x+g is still in Z/6, so the closure option is wrong. The answer is verdict = valid; n = 0."
          - problem: "In the dihedral group D3, label the elements 0=e, 1=r, 2=r^2, 3=s, 4=rs, 5=r^2 s. Define a proposed operation on X=D3 by g.x = xg. State which outcome applies, and give 0 if it is an action or the smallest positive label g that breaks the second rule if it is not."
            answer: "verdict = compose; n = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["identity"], ["compose"], ["closure"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The full object is the operation g.x = xg on D3. Identity step: 0.x = x0 = x, so identity holds and the identity option is wrong. Compose step: for g=1 and h=3 with x=0, g.(h.x) = 1.(3.0) = 1.3 = s r = 5, while (gh).x = (1*3).0 = rs = 4, so the compose option is correct. Closure step: every product stays in D3, so the closure option is wrong. The valid option is wrong because the compose failure shows the operation is not an action. The answer is verdict = compose; n = 1."
          - problem: "In the dihedral group D3, label the elements 0=e, 1=r, 2=r^2, 3=s, 4=rs, 5=r^2 s. The operation g.x = x g^(-1) is an action on X=D3. Compute the label of 4.(1.3)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 4.(1.3) for the action g.x = x g^(-1). Step 1: compute the inner action 1.3 = 3*1^(-1) = s*r^2 = rs = 4. Step 2: apply g=4=rs to the result 4, giving 4.4 = 4*4^(-1) = rs*(rs)^(-1) = e = 0. The answer is 0."
          - problem: "In the dihedral group D3, label the elements 0=e, 1=r, 2=r^2, 3=s, 4=rs, 5=r^2 s. Define a proposed operation on X=D3 by g.x = xg. How many ordered pairs (g,h) in D3xD3 make g.(h.0) different from (gh).0?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set of ordered pairs (g,h) where g.(h.0) is not (gh).0 for g.x = xg. Step 1: with x=0, g.(h.0) = h g and (gh).0 = g h, so the condition is h g not equal to g h. Step 2: count commuting pairs in D3. The centralizer sizes are 6 for e, 3 for r, 3 for r^2, and 2 for each of s, rs, r^2 s, giving 6+3+3+2+2+2 = 18 commuting pairs. Step 3: total ordered pairs are 36, so the failing pairs are 36-18 = 18. The answer is 18."
          - problem: "Let G = Z/4 and X = Z/4, with addition mod 4. Define g.x = x + g + 1 mod 4. State which outcome applies, and give the value of 0.0."
            answer: "verdict = identity; n = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["identity"], ["compose"], ["closure"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The full object is the operation g.x = x + g + 1 mod 4 on Z/4. Identity step: 0.0 = 0+0+1 = 1, which is not 0, so the identity option is correct. Compose step: the operation is not even identity-compatible, so the compose option is wrong as the first failure. Closure step: x+g+1 is still in Z/4, so the closure option is wrong. The valid option is wrong because the identity rule fails. The answer is verdict = identity; n = 1."
          - problem: "Let G = Z/5 with addition mod 5 act on X = Z/5 by g.x = x + 3g mod 5. Compute the value of 3.(4.2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 3.(4.2) for the action g.x = x + 3g mod 5. Step 1: compute the inner action 4.2 = 2 + 3*4 = 14 mod 5 = 4. Step 2: apply g=3 to 4, giving 3.4 = 4 + 3*3 = 13 mod 5 = 3. The answer is 3."
        constraints: "verify or refute proposed actions; include one failing example (e.g. g.x = xg^{-1} variants with wrong order)"
      - id: kp2
        name: "Standard examples: rotation, permutation, conjugation, left multiplication"
        key_prerequisites: [permutations-cycle-notation, dihedral-groups]
        exemplars:
          - problem: '$D_4$ acts on the $4$ vertices of a square. Describe how the counterclockwise rotation $r$ (by $90^\circ$) acts, as a permutation in cycle notation (vertices labeled $1,2,3,4$ counterclockwise).'
            answer: '$(1\,2\,3\,4)$'
            solution_sketch: 'A quarter-turn sends each vertex to the next one counterclockwise.'
          - problem: "A group $G$ acts on itself by conjugation: $g \\cdot x = g x g^{-1}$. The orbits of this action are called what?"
            answer: "Conjugacy classes"
            answer_contract: {"kind": "label", "options": [["Conjugacy classes"], ["Cosets"], ["Stabilizers"], ["Centralizers"]]}
            solution_sketch: "The conjugation action sends $x$ to $gxg^{-1}$, so an orbit collects all elements conjugate to $x$. Step 1 (conjugation action): the orbit of $x$ is $\\{gxg^{-1} : g \\in G\\}$. Step 2 (naming): such orbits are the conjugacy classes of $G$. Wrong option Cosets: cosets are the orbits of the left multiplication action, not of conjugation. Wrong option Stabilizers: a stabilizer is the set of group elements fixing one point, not an orbit. Wrong option Centralizers: the centralizer of $x$ is its stabilizer under conjugation, not the orbit. The orbits of the conjugation action are the Conjugacy classes."
          - problem: "$D_4$ acts on the four vertices of a square, labeled $1,2,3,4$ counterclockwise. The rotation $r$ turns the square $90^\\circ$ counterclockwise. The action of $r^2$ as a permutation in cycle notation is what?"
            answer: "(1 3)(2 4)"
            answer_contract: {"kind": "label", "options": [["(1 3)(2 4)"], ["(1 2 3 4)"], ["(1 4)(2 3)"], ["(1 2)(3 4)"]]}
            solution_sketch: "Step 1 (rotation action): the quarter-turn $r$ sends each vertex to the next one, so $r = (1\\,2\\,3\\,4)$. Step 2 (compose the action): $r^2$ applies $r$ twice, so $1$ goes to $3$ and $2$ goes to $4$, giving $(1\\,3)(2\\,4)$. Wrong option (1 2 3 4): that is the quarter-turn $r$ itself, not the half-turn $r^2$. Wrong option (1 4)(2 3): that is the reflection across a diagonal, not a rotation. Wrong option (1 2)(3 4): that is the reflection across a midline, not a rotation. Hence the action of $r^2$ is (1 3)(2 4)."
          - problem: "The symmetric group $S_3$ acts on itself by conjugation: $g \\cdot x = g x g^{-1}$. The orbit size of the transposition $(1\\,2)$ is what?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (conjugation action): the orbit of $x$ is the set of all conjugates $gxg^{-1}$. Step 2 (classify by cycle type): in $S_3$ conjugacy classes are cycle types, and the class of a transposition consists of all transpositions. Step 3 (count): $S_3$ has exactly three transpositions, $(1\\,2)$, $(1\\,3)$, $(2\\,3)$. Thus the orbit size is 3."
          - problem: "The symmetric group $S_4$ acts on the set $\\{1,2,3,4\\}$ by permutation. The cyclic subgroup generated by $(1\\,2\\,3\\,4)$ acts on the same set. The orbit size of $1$ under this subgroup is what?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (permutation action): the orbit of $1$ is the set of images of $1$ under the powers of $(1\\,2\\,3\\,4)$. Step 2 (iterate): applying the generator repeatedly sends $1$ to $2$, then $3$, then $4$, then back to $1$. Step 3 (count): the orbit is $\\{1,2,3,4\\}$, so its size is 4."
          - problem: "The group $D_4$ acts on itself by left multiplication: $g \\cdot x = gx$. The orbit size of the element $r$ under this action is what?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (left multiplication action): the orbit of $x$ is $Gx$. Step 2 (transitivity): for any $y \\in G$, write $y = (yx^{-1})x$, so every element lies in the orbit of $r$. Step 3 (count): the orbit is all of $D_4$, and $|D_4| = 8$, so the orbit size is 8."
        constraints: "the four canonical actions; concrete cycle-notation answers where applicable"
      - id: kp3
        name: "Actions as homomorphisms to symmetric groups"
        key_prerequisites: [permutations-cycle-notation]
        exemplars:
          - problem: "The cyclic group $C_3 = \\{e, a, a^2\\}$ acts on the set $X = \\{e, a, a^2\\}$ by left translation, $g \\cdot x = gx$, so the action gives a homomorphism from $C_3$ to $S_3$. Give the one-line notation of the permutation $\\sigma_a$ induced by $a$ on the ordered set $(e, a, a^2)$, as a list of three numbers."
            answer: "2, 3, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (homomorphism step): the left-translation action gives a homomorphism from $C_3$ to $S_3$, sending each group element to the permutation it induces on $X$. Step 2 (compute images): left multiplication by $a$ sends $e$ to $a$, $a$ to $a^2$, and $a^2$ to $e$. Step 3 (one-line notation): in the ordered set $(e, a, a^2)$ these images are the 2nd, 3rd, and 1st elements. The one-line notation of $\\sigma_a$ is 2, 3, 1."
          - problem: "The dihedral group $D_4$ acts on the vertices $1, 2, 3, 4$ of a square, labeled in cyclic order, giving a homomorphism $\\varphi: D_4 \\to S_4$. A symmetry that fixes all four vertices must be the identity, so $\\varphi$ is injective. Find the order of the image $\\varphi(D_4)$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism step): the vertex action gives the homomorphism $\\varphi: D_4 \\to S_4$. Step 2 (faithfulness): an element of the kernel fixes every vertex, hence is the identity symmetry, so $\\varphi$ is injective. Step 3 (order of the image): an injective homomorphism makes the image the same size as the group, and the dihedral group of the square has order 8. The order of $\\varphi(D_4)$ is 8."
          - problem: "The dihedral group $D_4$ acts on the two diagonals of a square: $X$ has two elements, the diagonal joining vertices 1 and 3, and the diagonal joining vertices 2 and 4. The quarter turn $r$ swaps the two diagonals, and the action gives a homomorphism $D_4 \\to S_2$. Find the order of the kernel of this homomorphism."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism step): the diagonal action gives a homomorphism $\\varphi: D_4 \\to S_2$. Step 2 (track the diagonals): the quarter turn $r$ and the two edge-midpoint reflections swap the diagonals, while $e$, the half turn $r^2$, and the two diagonal reflections fix both diagonals. Step 3 (kernel): the elements acting trivially are $e$, $r^2$, and the two diagonal reflections, a subgroup of order 4. The order of the kernel is 4."
          - problem: "The Klein four group $V = \\{e, a, b, c\\}$, with $a^2 = b^2 = c^2 = e$ and $ab = c$, acts on itself by left translation $g \\cdot x = gx$, giving a homomorphism $V \\to S_4$. Give the one-line notation of the permutation $\\sigma_a$ on the ordered set $(e, a, b, c)$, as a list of four numbers."
            answer: "2, 1, 4, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (homomorphism step): left translation gives a homomorphism from $V$ to $S_4$ acting on the ordered set $(e, a, b, c)$. Step 2 (compute images): since $a^2 = e$, left multiplication by $a$ swaps $e$ and $a$; since $ab = c$, it sends $b$ to $c$ and $c$ to $b$. Step 3 (one-line notation): the images are the 2nd, 1st, 4th, and 3rd elements. The one-line notation of $\\sigma_a$ is 2, 1, 4, 3."
          - problem: "Let $\\mathbb{Z}_4 = \\{0, 1, 2, 3\\}$ act on the set $\\{1, 2\\}$ so that the element 1 acts as the swap exchanging 1 and 2 and the element 0 acts as the identity map; this gives a homomorphism $\\mathbb{Z}_4 \\to S_2$. How many elements of $\\mathbb{Z}_4$ act as the identity permutation?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism step): the action gives a homomorphism $\\varphi: \\mathbb{Z}_4 \\to S_2$ with $\\varphi(1)$ the swap of 1 and 2. Step 2 (order of the image): the swap has order 2, so $\\varphi(k)$ is the identity exactly when $k$ is even. Step 3 (kernel): the kernel is $\\{0, 2\\}$, so 2 elements of $\\mathbb{Z}_4$ act as the identity permutation."
          - problem: "In the dihedral group $D_4$, the rotation $r$ acts on the vertices $1, 2, 3, 4$ of a square, labeled in cyclic order, by sending 1 to 2, 2 to 3, 3 to 4, and 4 to 1. Give the one-line notation of the permutation induced by $r^2$ on the ordered vertices $(1, 2, 3, 4)$, as a list of four numbers."
            answer: "3, 4, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (homomorphism step): the vertex action gives a homomorphism, so the permutation of $r^2$ is the permutation of $r$ applied twice. Step 2 (compute images): applying the four-cycle twice sends 1 to 3, 2 to 4, 3 to 1, and 4 to 2. Step 3 (one-line notation): reading these images in the order $(1, 2, 3, 4)$ gives the one-line notation 3, 4, 1, 2."
        constraints: "translate actions to permutation representations; faithfulness checks on small examples"
    diagnostic_exemplar:
      problem: 'Does $g \cdot x = x g$ (right multiplication used as a left action) define an action of a non-abelian $G$ on itself? Check the composition axiom.'
      answer: 'No: $g \cdot (h \cdot x) = xhg$ but $(gh) \cdot x = xgh$, and $xhg \neq xgh$ in general.'
      answer_contract: {kind: none}
      solution_sketch: 'The order of factors comes out reversed; the fix is $g \cdot x = xg^{-1}$, which does satisfy the axioms.'
    anki_seeds:
      - front: "Two axioms of a group action?"
        back: "$e \\cdot x = x$ and $g \\cdot (h \\cdot x) = (gh) \\cdot x$."
        type: basic
      - front: "A group action of $G$ on $X$ is equivalently a homomorphism into..."
        back: "$S_X$, the symmetric group on $X$ ($g \\mapsto (x \\mapsto g \\cdot x)$)."
        type: basic
      - front: "Orbits of the conjugation action of $G$ on itself?"
        back: "Conjugacy classes."
        type: basic

  - id: orbits-stabilizers
    name: "Orbits and Stabilizers"
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: group-actions
        weight: 0.9
        key: true
      - id: equivalence-classes-partitions
        weight: 0.5
        key: false
      - id: subgroups-subgroup-tests
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing orbits"
        key_prerequisites: [group-actions, equivalence-classes-partitions]
        exemplars:
          - problem: "The cyclic group $\\langle (1\\,3)(2\\,4) \\rangle \\le S_4$ acts on $\\{1,2,3,4\\}$. Give the orbit of $1$ as a set."
            answer: "{1, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "First write the full group: the powers of $g = (1\\,3)(2\\,4)$ are $g$ and the identity, since $g^2 = e$. Rule: the orbit of $x$ is $\\{h \\cdot x : h \\in G\\}$. Applying $g$ to $1$ gives $3$, and applying $g$ to $3$ gives $1$, so the block $\\{1,3\\}$ never meets $\\{2,4\\}$. The orbit of $1$ is {1, 3}."
          - problem: "The subgroup $\\langle (1\\,2), (3\\,4) \\rangle$ of $S_4$ acts on $\\{1,2,3,4\\}$. Orbits of a group action partition the set. How many orbits does this action have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full group consists of products of the two commuting swaps $(1\\,2)$ and $(3\\,4)$. Rule: orbits are the equivalence classes of the relation $x \\sim y$ iff some group element sends $x$ to $y$, and these classes partition the set. Every product of the generators swaps only within $\\{1,2\\}$ and within $\\{3,4\\}$, so the classes are $\\{1,2\\}$ and $\\{3,4\\}$. Counting the classes of the partition, the action has 2 orbits."
          - problem: "The cyclic group $\\langle (1\\,2\\,3)(4\\,5) \\rangle \\le S_5$ acts on $\\{1,2,3,4,5\\}$. Give the orbit of $1$ as a set."
            answer: "{1, 2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Write the full generator $g = (1\\,2\\,3)(4\\,5)$; its powers $g$, $g^2$, $g^3 = e$ form the group. Rule: the orbit of $x$ is the set of images of $x$ under all powers of $g$. The powers send $1$ to $2$ and then to $3$ and back to $1$, while the swap part never touches $1,2,3$. The orbit of 1 is {1, 2, 3}."
          - problem: "The subgroup $\\langle (1\\,2\\,3), (3\\,4\\,5) \\rangle$ of $S_6$ acts on $\\{1,2,3,4,5,6\\}$. Give the orbit of $4$ as a set."
            answer: "{1, 2, 3, 4, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full group is generated by $a = (1\\,2\\,3)$ and $b = (3\\,4\\,5)$. Rule: the orbit of $x$ is the smallest set containing $x$ that is closed under both generators. From $4$, the generator $b$ gives $5$ and $3$; from $3$, the generator $a$ gives $1$ and $2$, and $b$ sends $3$ back to $4$ and $5$. Point $6$ is fixed by both generators. The orbit of 4 is {1, 2, 3, 4, 5}."
          - problem: "The cyclic group $\\langle (1\\,2\\,6)(3\\,4) \\rangle \\le S_6$ acts on $\\{1,2,3,4,5,6\\}$. How many orbits does this action have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full generator $g = (1\\,2\\,6)(3\\,4)$; its powers form the acting group. Rule: the orbits of a cyclic action come from the cycles of the generator, and they partition the set. The 3-cycle gives the orbit $\\{1,2,6\\}$, the swap gives the orbit $\\{3,4\\}$, and the point $5$ is fixed, giving the orbit $\\{5\\}$. Counting the three blocks of this partition, the action has 3 orbits."
          - problem: "The subgroup $\\langle (1\\,2)(4\\,5), (2\\,3)(5\\,6) \\rangle$ of $S_6$ acts on $\\{1,2,3,4,5,6\\}$. Give the orbit of $5$ as a set."
            answer: "{4, 5, 6}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Write the full generators $a = (1\\,2)(4\\,5)$ and $b = (2\\,3)(5\\,6)$. Rule: the orbit of $x$ is the closure of $\\{x\\}$ under both generators, since every group element is a product of them. From $5$, $a$ gives $4$ and $b$ gives $6$; from $4$ only $a$ leads back to $5$, from $6$ only $b$ leads back to $5$, and no generator sends $4$, $5$, or $6$ into $1$, $2$, $3$. The orbit of 5 is {4, 5, 6}."
        constraints: "subgroups of S_n (n <= 6) acting on points; orbits as explicit sets"
      - id: kp2
        name: "Computing stabilizers"
        key_prerequisites: [group-actions, subgroups-subgroup-tests]
        exemplars:
          - problem: '$S_3$ acts on $\{1,2,3\}$. Find the stabilizer of $1$.'
            answer: '$\{e, (2\,3)\}$'
            solution_sketch: 'The permutations fixing $1$ may only permute $\{2,3\}$.'
          - problem: "The symmetric group S3 acts on the set {1, 2, 3} by permuting the elements. Which subset of S3 is the stabilizer of the element 2?"
            answer: "e and (1 3)"
            answer_contract: {"kind": "label", "options": [["e and (1 3)"], ["e, (1 2)"], ["e, (1 3), (1 2 3)"], ["e only"]]}
            solution_sketch: "Step 1: an element of the stabilizer must satisfy g·2 = 2, and the stabilizer is automatically a subgroup. Step 2: e fixes 2, and the transposition (1 3) fixes 2, so the stabilizer is exactly e and (1 3). The option e, (1 2) is the stabilizer of 3, the wrong point; the option e, (1 3), (1 2 3) wrongly adds a 3-cycle that sends 2 to 3; the option e only forgets the transposition of the other two letters. The stabilizer of 2 is e and (1 3)."
          - problem: "The symmetric group S4 acts on the set {1, 2, 3, 4} by permuting the elements. How many permutations are in the stabilizer of 1?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the stabilizer of 1 contains exactly the permutations with sigma(1) = 1. Step 2: such a permutation permutes {2, 3, 4} freely, giving 3! = 6 elements, a subgroup isomorphic to S3. The stabilizer of 1 has 6 elements."
          - problem: "The dihedral group D5 of the symmetries of a regular pentagon acts on its five vertices 1 to 5, labelled counterclockwise. How many elements of D5 are in the stabilizer of vertex 3?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the identity fixes every vertex, so e lies in the stabilizer of vertex 3. Step 2: every nontrivial rotation moves vertex 3, and among the reflections only the one whose axis passes through vertex 3 and the midpoint of the opposite side fixes it; the other reflections fix other vertices. The stabilizer of vertex 3 has 2 elements."
          - problem: "The symmetric group S3 acts on the set of the three two-element subsets of {1, 2, 3}. Determine the size of the orbit of {1, 2} and the size of the stabilizer of {1, 2}. Give the orbit size and the stabilizer size."
            answer: "orbit = 3; stab = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "orbit"}, {"contract": {"kind": "exact"}, "name": "stab"}]}
            solution_sketch: "Step 1: acting on the pair {1, 2}: e fixes it, (2 3) sends it to {1, 3}, and (1 3) sends it to {2, 3}, so the orbit is all three pairs and has size 3. Step 2: a permutation stabilizing {1, 2} must map the pair onto itself, and only e and (1 2) do so, so the stabilizer has size 2. The orbit of {1, 2} has 3 elements and its stabilizer has 2 elements."
          - problem: "The symmetric group S4 permutes the vertices 1, 2, 3, 4 of the complete graph on four vertices, and so acts on its six edges. Determine the number of permutations in the stabilizer of the edge joining 1 and 2."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: to stabilize the edge {1, 2} a permutation must send the pair {1, 2} to itself, so it either fixes both 1 and 2 or swaps them: 2 options. Step 2: the remaining vertices 3 and 4 may be permuted in 2! = 2 ways. Step 3: multiply: 2 · 2 = 4; the stabilizer is the subgroup {e, (1 2), (3 4), (1 2)(3 4)}. The stabilizer of the edge has 4 elements."
        constraints: "stabilizers in S_n and D_n actions; always subgroups"
      - id: kp3
        name: "Fixed points and transitive actions"
        key_prerequisites: [group-actions]
        exemplars:
          - problem: "The dihedral group $D_4$ acts on the 4 vertices of a square by its natural symmetry action. Determine whether the action has a single orbit, and give the verdict and the number of orbits."
            answer: "verdict = transitive; orbits = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["transitive"], ["intransitive"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "orbits"}]}
            solution_sketch: "Use the orbit rule: compute the orbit of one point. A quarter-turn rotation sends vertex 1 to 2 to 3 to 4, so the orbit of any vertex is all 4 vertices. There is exactly one orbit, so the action is transitive and the number of orbits is 1. The answer is verdict = transitive; orbits = 1."
          - problem: "For the conjugation action of $S_3$ on itself, count the fixed points, that is, the elements $x$ with $g x g^{-1} = x$ for every $g$ in $S_3$. Give the number of fixed points."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the fixed-point rule: a fixed point of conjugation is exactly a central element. Check each type in $S_3$: $e$ commutes with all; the transposition $(12)$ conjugated by $(23)$ gives $(13)$, so it moves; conjugating $(123)$ by $(12)$ gives its inverse $(132)$, so it moves. Only $e$ is central, so the number of fixed points is 1."
          - problem: "Consider the conjugation action of $D_4$ on itself, where $D_4 = \\{e, r, r^2, r^3, s, rs, r^2s, r^3s\\}$. Count the elements $x$ with $g x g^{-1} = x$ for every $g$ in $D_4$. Give the number of fixed points."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the fixed-point rule: the fixed points of conjugation form the center of the group. In $D_4$, the half-turn $r^2$ commutes with every rotation and with every reflection since $s r^2 s = r^{-2} = r^2$, while $r$ does not commute with $s$. The center is $\\{e, r^2\\}$, so the number of fixed points is 2."
          - problem: "The group $S_3$ acts on itself by conjugation. Decide whether this action has a single orbit, and give the verdict and the number of orbits."
            answer: "verdict = intransitive; orbits = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["transitive"], ["intransitive"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "orbits"}]}
            solution_sketch: "Use the orbit rule: the orbits of the conjugation action are the conjugacy classes. The classes in $S_3$ are $\\{e\\}$, the three transpositions, and the two 3-cycles, so there are 3 orbits. Since more than one orbit exists, the verdict is intransitive; the answer is verdict = intransitive; orbits = 3."
          - problem: "Let $H = \\{e, (123), (132)\\}$, a cyclic subgroup of $S_3$, act on the set $\\{1, 2, 3\\}$. State whether the action has a single orbit, and give the verdict and the number of orbits."
            answer: "verdict = transitive; orbits = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["transitive"], ["intransitive"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "orbits"}]}
            solution_sketch: "Use the orbit rule: compute the orbit of a point. The element $(123)$ sends 1 to 2 and $(132)$ sends 1 to 3, so the orbit of 1 is $\\{1, 2, 3\\}$, the whole set. A single orbit means the action is transitive; the answer is verdict = transitive; orbits = 1."
          - problem: "$D_4$ acts on the 4 vertices of a square. Count the fixed points of the action, that is, the vertices $v$ with $g v = v$ for every $g$ in $D_4$. Give the number of fixed points."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the fixed-point rule: a fixed point of the action must be fixed by every group element, in particular by the quarter-turn $r$. The rotation $r$ sends vertex 1 to vertex 2, so no vertex is fixed by $r$. Hence no vertex is fixed by all of $D_4$; the number of fixed points is 0."
        constraints: "transitivity verdicts; fixed points of conjugation = center"
    diagnostic_exemplar:
      problem: '$D_4$ acts on the four vertices $1, 2, 3, 4$ of a square (labelled counterclockwise). Find the orbit and the stabilizer of vertex $1$, and say whether the action is transitive.'
      answer: 'The rotation $r$ acts as the $4$-cycle $(1\,2\,3\,4)$, so the orbit of $1$ is all of $\{1,2,3,4\}$ and the action is transitive (a single orbit). The stabilizer is $\mathrm{Stab}(1) = \{e, d\}$, where $d$ is the reflection in the diagonal through vertices $1$ and $3$ — the only nonidentity symmetry fixing vertex $1$. Note $|D_4| = 8 = 4 \cdot 2 = |\mathrm{Orb}(1)| \cdot |\mathrm{Stab}(1)|$.'
      answer_contract: {kind: none}
      solution_sketch: 'Rotations carry vertex $1$ to every vertex, so there is one orbit; only the identity and the diagonal reflection through vertex $1$ fix it.'
    anki_seeds:
      - front: "Definition of the orbit of $x$ under an action of $G$?"
        back: "$\\mathrm{Orb}(x) = \\{g \\cdot x : g \\in G\\}$; orbits partition the set."
        type: basic
      - front: "The stabilizer of a point is always a..."
        back: "Subgroup of $G$ (not necessarily normal)."
        type: basic

  - id: orbit-stabilizer-theorem
    name: "The Orbit-Stabilizer Theorem"
    # W8 made this supplemental as "stated theorem whose only use here is Burnside
    # counting". That rationale dissolved in Phase C: the class equation (and through
    # it Cauchy's and Sylow's theorems) now builds directly on it. Flipped back to core.
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: orbits-stabilizers
        weight: 0.9
        key: true
      - id: lagranges-theorem
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Statement and the coset bijection"
        key_prerequisites: [orbits-stabilizers, lagranges-theorem]
        exemplars:
          - problem: "For a finite group G acting on a set X, which equation is the orbit-stabilizer theorem? Select the correct equation."
            answer: "|G| = |Orb(x)| * |Stab(x)|"
            answer_contract: {"kind": "label", "options": [["|G| = |Orb(x)| * |Stab(x)|"], ["|Orb(x)| = |G| * |Stab(x)|"], ["|Stab(x)| = |G| * |Orb(x)|"], ["|G| = |Orb(x)| + |Stab(x)|"]]}
            solution_sketch: "The full theorem says that for every x in X, the group order factors as |G| = |Orb(x)| * |Stab(x)|. The option |Orb(x)| = |G| * |Stab(x)| is wrong because it multiplies instead of dividing by |Stab(x)|; the option |Stab(x)| = |G| * |Orb(x)| is wrong because it multiplies instead of dividing by |Orb(x)|; the option |G| = |Orb(x)| + |Stab(x)| is wrong because the theorem uses a product, not a sum. Therefore the correct equation is |G| = |Orb(x)| * |Stab(x)|."
          - problem: "Let G act on a set X, let x be in X, and let h be in Stab(x). Which equality shows that the cosets g Stab(x) and gh Stab(x) map to the same orbit point? Select the correct equality."
            answer: "(gh).x = g.x"
            answer_contract: {"kind": "label", "options": [["(gh).x = g.x"], ["g.x = h.x"], ["(gh).x = h.x"], ["g.x = x"]]}
            solution_sketch: "The full computation uses the action axiom: (gh).x = g.(h.x). Because h lies in Stab(x), h.x = x, so g.(h.x) = g.x; the option g.x = h.x is wrong because h fixes x and does not generally equal g; the option (gh).x = h.x is wrong because g still acts after h; the option g.x = x is wrong because g need not fix x. Thus the equality is (gh).x = g.x."
          - problem: "A finite group G of order 24 acts on a set X. For a point x, the stabilizer has order 6. Find the size of the orbit of x."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a finite group G of order 24 acting on X with |Stab(x)| = 6. By the orbit-stabilizer theorem, |G| = |Orb(x)| * |Stab(x)|. Substitute: 24 = |Orb(x)| * 6. Divide both sides by 6, so |Orb(x)| = 4."
          - problem: "A finite group G of order 30 acts on a set X. The orbit of a point x has size 5. Find the order of the stabilizer of x."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a finite group G of order 30 acting on X with |Orb(x)| = 5. By the orbit-stabilizer theorem, |G| = |Orb(x)| * |Stab(x)|. Substitute: 30 = 5 * |Stab(x)|. Divide both sides by 5, so |Stab(x)| = 6."
          - problem: "A finite group G of order 45 acts on a set X. The stabilizer of a point x has order 5. Find the number of cosets of the stabilizer of x."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the coset space G/Stab(x) for a group of order 45 with |Stab(x)| = 5. The coset bijection identifies G/Stab(x) with Orb(x), so the number of cosets is |G|/|Stab(x)|. Substitute: 45/5 = 9. Thus the number of cosets is 9."
          - problem: "A finite group G of order 40 acts on a set X. The stabilizer of a point x has order 5. Determine how many elements lie in the orbit of x."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a finite group G of order 40 acting on X with |Stab(x)| = 5. The orbit-stabilizer theorem states |G| = |Orb(x)| * |Stab(x)|. Substitute: 40 = |Orb(x)| * 5. Divide both sides by 5, so |Orb(x)| = 8."
        constraints: "statement plus one step of the bijection proof"
      - id: kp2
        name: "Numerical applications"
        key_prerequisites: [orbits-stabilizers, lagranges-theorem]
        exemplars:
          - problem: '$D_4$ (order $8$) acts transitively on the $4$ vertices of a square. What is the order of the stabilizer of a vertex?'
            answer: "2"
            solution_sketch: '$|\mathrm{Stab}| = |G|/|\mathrm{Orb}| = 8/4 = 2$: the identity and the diagonal reflection through that vertex.'
          - problem: 'The rotation group of the cube acts transitively on its $6$ faces, and the stabilizer of a face has order $4$. Find the order of the rotation group.'
            answer: "24"
            solution_sketch: '$|G| = 6 \cdot 4 = 24$.'
          - problem: "The full symmetry group of a regular pentagon has order $10$ and acts on its $5$ vertices. What is the order of the stabilizer of a vertex?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The action is transitive, so the orbit of a vertex is all $5$ vertices. Orbit-stabilizer gives $|\\mathrm{Stab}| = |G|/|\\mathrm{Orb}| = 10/5$. The stabilizer consists of the identity and the reflection through that vertex, so the order is 2."
          - problem: "The full symmetry group of the cube, including reflections, acts transitively on the $6$ faces, and the stabilizer of a face has order $8$. Find the order of the full symmetry group."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Orbit-stabilizer states $|G| = |\\mathrm{Orb}| \\cdot |\\mathrm{Stab}|$ for any point of the action. Here the orbit of a face has $6$ points and the stabilizer has order $8$. Multiplying gives $6 \\cdot 8 = 48$, so the order of the group is 48."
          - problem: "The rotation group of the cube has order $24$ and acts on the $8$ vertices, and the stabilizer of a vertex has order $3$. Find the size of the orbit of a vertex."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Orbit-stabilizer gives $|\\mathrm{Orb}| = |G|/|\\mathrm{Stab}|$. With $|G| = 24$ and stabilizer order $3$, the orbit size is $24/3$. Each rotation sending a vertex to a target vertex is counted, so the orbit has 8 vertices."
          - problem: "The full symmetry group of a regular polygon has order $20$ and acts on its vertices, and the stabilizer of a vertex has order $2$. How many vertices does the polygon have?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The action on vertices of a regular polygon is transitive, so the orbit is the full vertex set. Orbit-stabilizer gives the number of vertices as $|\\mathrm{Orb}| = |G|/|\\mathrm{Stab}| = 20/2$. Hence the polygon has 10 vertices."
        constraints: "solve for the missing one of |G|, orbit size, stabilizer size; geometric actions (polygons, cube)"
      - id: kp3
        name: "Conjugacy classes and centralizers"
        key_prerequisites: [orbits-stabilizers]
        exemplars:
          - problem: 'Under conjugation, the orbit of $x$ is its conjugacy class and the stabilizer is the centralizer $C(x)$. In $S_3$, the conjugacy class of $(1\,2)$ has size $3$. Find $|C((1\,2))|$.'
            answer: "2"
            solution_sketch: '$|S_3| = 6 = 3 \cdot |C((1\,2))|$, so the centralizer is $\{e, (1\,2)\}$.'
          - problem: "In $S_3$, which has order 6, the centralizer of the 3-cycle $(1\\,2\\,3)$ has order 3. For the conjugation action of $S_3$ on itself, find the number of elements in the conjugacy class of $(1\\,2\\,3)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the conjugation action of $S_3$ on itself, the orbit of an element is its conjugacy class and the stabilizer is its centralizer, so the orbit-stabilizer theorem gives class size $= |S_3| / |C((1\\,2\\,3))|$. Substituting, class size $= 6/3$. The conjugacy class of $(1\\,2\\,3)$ has 2 elements."
          - problem: "In the dihedral group $D_4$ of order 8, the conjugacy class of the half-turn rotation $r^2$ is the singleton $\\{r^2\\}$. Find the order of the centralizer $C(r^2)$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under the conjugation action of $D_4$ on itself, the orbit of $r^2$ is its conjugacy class $\\{r^2\\}$, of size 1, and the stabilizer is the centralizer $C(r^2)$. By the orbit-stabilizer theorem, $|\\text{class}| \\cdot |C(r^2)| = |D_4| = 8$. Hence $|C(r^2)| = 8/1 = 8$."
          - problem: "In the dihedral group $D_4$ of order 8, the conjugacy class of the quarter-turn rotation $r$ is $\\{r, r^3\\}$. Find the order $|C(r)|$ of the centralizer of $r$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under the conjugation action of $D_4$ on itself, the orbit of $r$ is the class $\\{r, r^3\\}$, which has size 2. By the orbit-stabilizer theorem, $|\\text{class}| \\cdot |C(r)| = |D_4| = 8$. Hence $|C(r)| = 8/2 = 4$."
          - problem: "The group $S_4$ has order 24. Under conjugation, the conjugacy class of the double transposition $(1\\,2)(3\\,4)$ contains 3 elements. Find $|C((1\\,2)(3\\,4))|$, the order of its centralizer."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the conjugation action of $S_4$ on itself, the orbit of $x$ is its conjugacy class and the stabilizer is its centralizer $C(x)$. By the orbit-stabilizer theorem, $|\\text{class}| \\cdot |C(x)| = |S_4| = 24$. The class of $(1\\,2)(3\\,4)$ has 3 elements, so $|C((1\\,2)(3\\,4))| = 24/3 = 8$."
          - problem: "In $S_4$, the centralizer of the 3-cycle $(1\\,2\\,3)$ has order 4. Use the orbit-stabilizer theorem for the conjugation action of $S_4$ on itself to find the size of the conjugacy class of $(1\\,2\\,3)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the conjugation action, the stabilizer of $(1\\,2\\,3)$ is its centralizer, so the orbit-stabilizer theorem gives class size $= |S_4| / |C((1\\,2\\,3))|$. With $|S_4| = 24$ and $|C((1\\,2\\,3))| = 4$, the class size is $24/4 = 6$. The conjugacy class of $(1\\,2\\,3)$ has 6 elements."
        constraints: "class sizes and centralizer orders in S_3, S_4, D_4"
    diagnostic_exemplar:
      problem: 'In $S_4$ the conjugacy class of $(1\,2)$ has $6$ elements. Using the orbit-stabilizer theorem for the conjugation action of $S_4$ on itself, find $|C((1\,2))|$ and list the elements of that centralizer.'
      answer: 'Under conjugation the orbit of $(1\,2)$ is its conjugacy class and the stabilizer is the centralizer, so $|S_4| = |\mathrm{class}| \cdot |C((1\,2))|$ gives $|C((1\,2))| = 24/6 = 4$. The four elements are $e$, $(1\,2)$, $(3\,4)$ and $(1\,2)(3\,4)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Apply orbit-stabilizer to the conjugation action: class size times centralizer order is $|G|$. Then identify the permutations commuting with $(1\,2)$ — those preserving $\{1,2\}$ and $\{3,4\}$ setwise.'
    anki_seeds:
      - front: "Orbit-stabilizer theorem?"
        back: "$|G| = |\\mathrm{Orb}(x)| \\cdot |\\mathrm{Stab}(x)|$ (finite $G$)."
        type: basic
      - front: "Under conjugation, orbit and stabilizer of $x$ are called..."
        back: "The conjugacy class of $x$ and the centralizer $C(x)$."
        type: basic

  - id: burnside-counting
    name: "Burnside Counting"
    core: false                # enumeration curiosity; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: orbit-stabilizer-theorem
        weight: 0.9
        key: true
      - id: permutations-cycle-notation
        weight: 0.6
        key: false
      - id: multiplication-principle
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Burnside's lemma and fixed-point counts"
        key_prerequisites: [orbit-stabilizer-theorem]
        exemplars:
          - problem: 'A group $G$ of order $8$ acts on a set of colorings, and the fixed-point counts $|\mathrm{Fix}(g)|$ over its eight elements sum to $56$. How many orbits are there?'
            answer: "7"
            solution_sketch: 'Burnside''s lemma: the number of orbits is the average number of fixed points, $\frac{1}{|G|}\sum_{g \in G}|\mathrm{Fix}(g)| = 56/8 = 7$.'
          - problem: 'A rotation by $90^\circ$ acts on $2$-colorings of the $4$ beads of a necklace. How many colorings does it fix?'
            answer: "2"
            solution_sketch: 'A fixed coloring must be constant on the single 4-cycle of beads: $2$ choices.'
          - problem: "A rotation by 120 degrees permutes the 6 beads of a bracelet in two cycles of length 3 and acts on its 3-colorings. How many colorings does this rotation fix?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First count the cycles of the permutation on the beads: the rotation splits the 6 beads into 2 cycles of length 3. A coloring fixed by the rotation must be constant on each cycle, by the fixed-coloring rule, giving 3 choices per cycle. The number of fixed colorings is 3^2 = 9."
          - problem: "A permutation acts on the 3-colorings of a row of 12 tiles and fixes exactly 81 of them. Find the number of cycles in the cycle decomposition of this permutation."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed-coloring rule says a permutation with c cycles fixes 3^c colorings when there are 3 colors. Set 3^c = 81 and solve: since 3^4 = 81, the permutation has 4 cycles."
          - problem: "A group of order 10 acts on a set of colorings. Four of its elements fix 8 colorings each, and the remaining six elements fix 3 colorings each. Find the number of orbits."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Burnside's lemma: the number of orbits is the average of the fixed-point counts over all group elements. The sum is 4 times 8 plus 6 times 3, which is 32 + 18 = 50. Divide by the group order: 50/10 = 5, so the answer is 5."
          - problem: "A group of order 4 acts on the 2-colorings of the 4 corners of a square. The fixed-point counts of its four elements are 16, 2, 4 and 2. Find the number of orbits."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Burnside's lemma divides the sum of the fixed-point counts by the group order. The full list of counts is 16, 2, 4, 2, and their sum is 16 + 2 + 4 + 2 = 24. The average is 24/4 = 6, so the action has 6 orbits."
        constraints: "fixed colorings of a single group element: 2 or 3 colors, k^(number of cycles)"
      - id: kp2
        name: "Necklaces under rotation"
        key_prerequisites: [orbit-stabilizer-theorem, permutations-cycle-notation]
        exemplars:
          - problem: 'Count the distinct necklaces of $4$ beads in $2$ colors, up to rotation only.'
            answer: "6"
            solution_sketch: 'Fix counts for rotations by $0^\circ, 90^\circ, 180^\circ, 270^\circ$: $16, 2, 4, 2$. Average: $24/4 = 6$.'
          - problem: 'Count necklaces of $3$ beads in $3$ colors, up to rotation.'
            answer: "11"
            solution_sketch: '$(3^3 + 3 + 3)/3 = 33/3 = 11$.'
          - problem: "A bracelet has 5 beads in a circle, and each bead is one of 2 colors. Two colorings are the same when a rotation turns one into the other. Find the number of distinct colorings."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cycle structure): the identity rotation has 5 cycles, so it fixes 2^5 = 32 colorings; each of the four nontrivial rotations has gcd(r, 5) = 1 cycle, so each fixes 2^1 = 2 colorings. Step 2 (Burnside's lemma): average the fixed counts, (32 + 2 + 2 + 2 + 2)/5 = 40/5 = 8. The number of distinct colorings is 8."
          - problem: "Six beads are placed evenly on a ring and each is colored with one of 2 colors. Two colorings are considered the same if a rotation carries one to the other. Determine the number of distinct colorings."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cycle structure): the rotations by 0 through 5 positions have gcd(r, 6) = 6, 1, 2, 3, 2, 1 cycles, so the fixed counts are 2^6, 2, 2^2, 2^3, 2^2, 2. Step 2 (Burnside's lemma): the average is (64 + 2 + 4 + 8 + 4 + 2)/6 = 84/6 = 14. The number of distinct colorings is 14."
          - problem: "A necklace has 6 beads and 3 colors are available. The rotation by 180 degrees sends each bead to the bead 3 positions away, so the 6 bead positions form 3 cycles of length 2. How many colorings are fixed by this rotation?"
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cycle structure): the rotation by 3 positions has gcd(3, 6) = 3 cycles, each of length 2. Step 2 (fixed colorings): a coloring is fixed exactly when each cycle is monochrome, so there are 3^3 = 27 choices. The number of fixed colorings is 27."
          - problem: "A ring has 5 beads and each bead is colored with one of 3 colors. Rotations of the ring are allowed. Using Burnside's lemma, find the number of distinct colorings."
            answer: "51"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cycle structure): the identity has 5 cycles and fixes 3^5 = 243 colorings; each of the four nontrivial rotations has gcd(r, 5) = 1 cycle and fixes 3^1 = 3 colorings. Step 2 (Burnside's lemma): the average is (243 + 3 + 3 + 3 + 3)/5 = 255/5 = 51. The number of distinct colorings is 51."
        constraints: "n beads (n <= 6), k colors (k <= 3), cyclic group only; fixed colorings = k^{gcd(r, n)}"
      - id: kp3
        name: "Adding reflections: dihedral symmetry"
        key_prerequisites: [orbit-stabilizer-theorem, permutations-cycle-notation]
        exemplars:
          - problem: 'Count the colorings of the $4$ corners of a square with $3$ colors, up to all $8$ symmetries of the square.'
            answer: "21"
            solution_sketch: 'Fix counts: identity $81$; rotations $90^\circ/270^\circ$: $3$ each; $180^\circ$: $9$; two diagonal reflections: $27$ each; two edge reflections: $9$ each. Total $168/8 = 21$.'
          - problem: 'Count $2$-colorings of the square''s corners up to $D_4$.'
            answer: "6"
            solution_sketch: '$(16 + 2 + 4 + 2 + 8 + 8 + 4 + 4)/8 = 48/8 = 6$.'
          - problem: "An equilateral triangle has one of three colours at each vertex. Two colourings are identified when a symmetry of the triangle maps one to the other. How many distinct colourings are there?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group D3 has six symmetries: the identity, two rotations by 120 and 240 degrees, and three reflections. The identity fixes all 3^3 = 27 colourings. Each nontrivial rotation is a 3-cycle, so it fixes 3 colourings. Each reflection fixes one vertex and swaps two, so it fixes 3^2 = 9 colourings. Burnside's lemma gives (27 + 3 + 3 + 9 + 9 + 9)/6 = 60/6 = 10. The number of distinct colourings is 10."
          - problem: "A square has four colours available for its four corners, one colour per corner. Two corner colourings are the same when a rotation or reflection of the square sends one to the other. How many distinct corner colourings are there?"
            answer: "55"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group D4 has eight symmetries: the identity, rotations by 90, 180 and 270 degrees, two diagonal reflections, and two edge reflections. The identity fixes 4^4 = 256 colourings. Each 90 or 270 degree rotation is a 4-cycle and fixes 4 colourings, giving 8 total. The 180 degree rotation is two 2-cycles and fixes 4^2 = 16. Each diagonal reflection fixes two corners and swaps two, fixing 4^3 = 64, giving 128. Each edge reflection is two 2-cycles and fixes 4^2 = 16, giving 32. Burnside's lemma gives (256 + 8 + 16 + 128 + 32)/8 = 440/8 = 55. The number of distinct colourings is 55."
          - problem: "For an equilateral triangle, the number of colourings of its three vertices up to the six symmetries of D3 is 20. How many colours were available?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let m be the number of available colours. For D3, Burnside's lemma gives (m^3 + 3m^2 + 2m)/6: identity contributes m^3, two rotations contribute m each, and three reflections contribute m^2 each. Setting this equal to 20 gives m^3 + 3m^2 + 2m = 120, or m^3 + 3m^2 + 2m - 120 = 0. Testing m = 4 gives 64 + 48 + 8 = 120, and the remaining quadratic factor has no positive integer root. The number of colours is 4."
          - problem: "Each corner of a square is painted one of six colours. Colourings that a rotation or a reflection of the square sends to each other count as one. How many different colourings of the corners are there?"
            answer: "231"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Enumerate the cycle structure of each of the eight symmetries in D4. The identity is four 1-cycles and fixes 6^4 = 1296 colourings. Each 90 and 270 degree rotation is one 4-cycle and fixes 6 colourings, giving 12. The 180 degree rotation is two 2-cycles and fixes 6^2 = 36. Each diagonal reflection fixes two corners and swaps two, fixing 6^3 = 216, so the two give 432. Each edge reflection is two 2-cycles and fixes 36, so the two give 72. Burnside's lemma gives (1296 + 12 + 36 + 432 + 72)/8 = 1848/8 = 231. The number of different colourings is 231."
        constraints: "square or triangle only; enumerate cycle structures of all group elements"
    diagnostic_exemplar:
      problem: 'How many distinct necklaces of $5$ beads in $2$ colours are there, counting two as the same when one is a rotation or a reflection of the other?'
      answer: '8'
      solution_sketch: 'Burnside over $D_5$ (order $10$): the identity fixes $2^{5} = 32$ colourings; each of the four nontrivial rotations fixes only the $2$ monochrome ones; each of the five reflections has one fixed bead and two swapped pairs, fixing $2^{3} = 8$. Total $32 + 4 \cdot 2 + 5 \cdot 8 = 80$, and $80/10 = 8$ orbits.'
    anki_seeds:
      - front: "Burnside's lemma?"
        back: "Number of orbits $= \\frac{1}{|G|} \\sum_{g} |\\mathrm{Fix}(g)|$ — the average number of fixed points."
        type: basic
      - front: "How many colorings (k colors) does a permutation with $c$ cycles on the positions fix?"
        back: "$k^c$ — the coloring must be constant on each cycle."
        type: basic

  - id: cayleys-theorem
    name: "Cayley's Theorem"
    core: false                # stated embedding theorem; nothing builds on it
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: group-actions
        weight: 0.8
