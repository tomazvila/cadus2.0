        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Left multiplication is a permutation"
        key_prerequisites: [group-actions]
        exemplars:
          - problem: "In the additive group $G = \\mathbb{Z}_6$, let $\\lambda_2(x) = 2 + x$. The inverse map of $\\lambda_2$ is $\\lambda_h$ for exactly one element $h$ of $G$. Find $h$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full map is $\\lambda_2: x \\mapsto 2 + x$ on $\\mathbb{Z}_6$. To invert it, compose with $\\lambda_h$ by the inverse-map rule: $\\lambda_h(\\lambda_2(x)) = h + (2 + x) = (h + 2) + x$, which equals $x$ for all $x$ exactly when $h + 2 \\equiv 0$ mod $6$, so $h = 4$. Indeed $\\lambda_4(\\lambda_2(x)) = 4 + 2 + x = 6 + x = x$. The answer is 4."
          - problem: "In $G = \\mathbb{Z}_5$, let $\\lambda_3(x) = 3 + x$. Determine how many elements $x$ of $G$ satisfy $\\lambda_3(x) = x$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full equation is $3 + x = x$ in $\\mathbb{Z}_5$. By the cancellation rule, subtracting $x$ from both sides gives $3 = 0$ in $\\mathbb{Z}_5$, which is false since $3$ and $0$ are distinct residues. So no element satisfies the equation and $\\lambda_3$ fixes nothing. The answer is 0."
          - problem: "In $G = \\mathbb{Z}_7$, let $\\lambda_3(x) = 3 + x$, and the maps satisfy $\\lambda_a \\circ \\lambda_b = \\lambda_{a+b}$. Determine the order of the permutation $\\lambda_3$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full map is $\\lambda_3: x \\mapsto 3 + x$ on $\\mathbb{Z}_7$. By the composition rule $\\lambda_a \\circ \\lambda_b = \\lambda_{a+b}$, the $k$-fold composition $\\lambda_3^k$ equals $\\lambda_{3k}$. The identity map is $\\lambda_0$, so we need the smallest $k \\ge 1$ with $3k \\equiv 0$ mod $7$; since $7$ is prime and $3 \\cdot 7 = 21$, this is $k = 7$. The answer is 7."
          - problem: "Let $g, x, y$ be elements of a group $G$ with $gx = gy$. To prove that the map $\\lambda_g$ is injective one must derive $x = y$. Select the valid next step."
            answer: "cancel g on the left"
            answer_contract: {"kind": "label", "options": [["cancel g on the left"], ["cancel x on the right"], ["multiply by g on the right"], ["conclude g = e"]]}
            solution_sketch: "From the full equation $gx = gy$ one multiplies both sides on the left by $g^{-1}$, which cancels $g$ and gives $x = y$. The option 'cancel x on the right' cancels the wrong element and quietly assumes the goal. The option 'multiply by g on the right' produces $gxg = gyg$, which proves nothing. The option 'conclude g = e' confuses injectivity of $\\lambda_g$ with the fixed-point argument. The answer is cancel g on the left."
          - problem: "Claim: for $g \\neq e$ in $G$, the map $\\lambda_g$ has no fixed point. Step 1: suppose $gx = x$ for some $x \\in G$. Step 2: multiply both sides of $gx = x$ on the right by $x^{-1}$. Step 3: this gives $g = x^{-1}$. Step 4: hence $g = e$, contradicting $g \\neq e$. Step 5: therefore $\\lambda_g$ has no fixed point. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a valid supposition for a contradiction argument. Step 2 is a legal move, multiplying on the right by $x^{-1}$. Step 3 is false: from $gx = x$, right multiplication by $x^{-1}$ gives $gxx^{-1} = xx^{-1}$, hence $g = e$ directly, not $g = x^{-1}$. Step 4 would follow only after Step 3 is corrected. Step 5 is the final claim of the argument. The answer is Step 3."
          - problem: "In $G = \\mathbb{Z}_9$, let $\\lambda_5(x) = 5 + x$. The map $\\lambda_5$ is a bijection, so the equation $\\lambda_5(x) = 2$ has exactly one solution. Solve $\\lambda_5(x) = 2$ in $\\mathbb{Z}_9$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full equation is $5 + x = 2$ in $\\mathbb{Z}_9$. By the cancellation rule, subtract $5$ from both sides: $x \\equiv 2 - 5 \\equiv -3$ mod $9$. Since $-3 + 9 = 6$, the unique solution is $x = 6$, confirming that $\\lambda_5$ is onto. The answer is 6."
          - problem: "Write the full proof: for a fixed element $g$ of a group $G$, the map $\\lambda_g : G \\to G$ with $\\lambda_g(x) = gx$ is a bijection. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: fix $g \\in G$ and consider $\\lambda_g: G \\to G$, $\\lambda_g(x) = gx$. Step 1, injectivity: suppose $\\lambda_g(x) = \\lambda_g(y)$, that is $gx = gy$. Multiply on the left by $g^{-1}$: $g^{-1}(gx) = g^{-1}(gy)$, so by associativity $(g^{-1}g)x = (g^{-1}g)y$, hence $ey = ey$ gives $x = y$. So $\\lambda_g$ is injective. Step 2, surjectivity: take any $y \\in G$ and set $x = g^{-1}y$. Then $\\lambda_g(x) = g(g^{-1}y) = (gg^{-1})y = ey = y$, so every $y$ has a preimage and $\\lambda_g$ is surjective. Step 3, conclusion: $\\lambda_g$ is both injective and surjective, hence a bijection; equivalently, $\\lambda_{g^{-1}}$ is a two-sided inverse since $\\lambda_{g^{-1}} \\circ \\lambda_g = \\lambda_{g^{-1}g} = \\lambda_e$ is the identity map. This bijection property is exactly what Cayley's theorem uses to view each element $g$ as a permutation of the set $G$."
        constraints: "properties of the left-regular maps lambda_g"
      - id: kp2
        name: "The theorem and its proof"
        key_prerequisites: [group-actions, group-isomorphisms]
        exemplars:
          - problem: "Cayley's proof uses the left-regular action of $G = \\mathbb{Z}_8$ on itself, given by $\\lambda_g(x) = g + x$, with identity element $0$. To test whether $g$ lies in the kernel of the map $g \\mapsto \\lambda_g$, one evaluates $\\lambda_g$ at the identity. Give $\\lambda_5(0)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The kernel test evaluates the permutation at the identity element of the group. In the left-regular action of $\\mathbb{Z}_8$, the rule is $\\lambda_g(x) = g + x$, so $\\lambda_5(0) = 5 + 0 = 5$. If $\\lambda_g$ were the identity permutation, then $\\lambda_g(0) = 0$ would force $g = 0$, so $g = 5$ is not in the kernel. The value is 5."
          - problem: "Cayley's theorem states that every group of order $n$ is isomorphic to a subgroup of the symmetric group $S_n$. Apply the theorem to a group of order $7$. Give the degree $n$ of the symmetric group and the order $s$ of $S_n$."
            answer: "n = 7; s = 5040"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "s"}]}
            solution_sketch: "By Cayley's theorem, the regular action embeds a group of order $n$ into the symmetric group on its own underlying set, so the degree equals the group order. For a group of order $7$ the target is $S_7$. The symmetric group $S_7$ has $7! = 5040$ elements. The answer is n = 7; s = 5040."
          - problem: "In the proof of Cayley's theorem, the map $\\varphi: G \\to S_G$ sends each $g$ to the permutation $\\lambda_g$ defined by $\\lambda_g(x) = gx$. The kernel consists of those $g$ for which $\\lambda_g$ is the identity permutation. Evaluating $\\lambda_g$ at the identity element gives $\\lambda_g(e) = ge = g$. For $G = \\mathbb{Z}_5$, how many elements are in the kernel of $\\varphi$?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The kernel consists of the elements $g$ with $\\lambda_g$ equal to the identity permutation. Evaluating $\\lambda_g$ at $e$ gives $\\lambda_g(e) = ge = g$, so $\\lambda_g = \\mathrm{id}$ forces $g = e$. Hence only the identity element lies in the kernel. The kernel of the map has exactly 1 element."
          - problem: "The homomorphism property used in Cayley's proof says $\\lambda_g \\circ \\lambda_h = \\lambda_{g+h}$ for the left-regular action of $\\mathbb{Z}_{12}$, where $\\lambda_g(x) = g + x$. Compute $(\\lambda_7 \\circ \\lambda_5)(0)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The homomorphism property is verified by evaluating both sides at the identity element $0$. By definition of composition, $(\\lambda_7 \\circ \\lambda_5)(0) = \\lambda_7(\\lambda_5(0)) = 7 + (5 + 0) = 12$, and $12 \\equiv 0$ in $\\mathbb{Z}_{12}$. This matches $\\lambda_{12}(0) = \\lambda_0(0) = 0$. The value is 0."
          - problem: "In the left-regular action of $\\mathbb{Z}_9$, the permutation $\\lambda_3$ satisfies $\\lambda_3^k(x) = 3k + x$, so $\\lambda_3^k$ is the identity permutation exactly when $3k$ is a multiple of $9$. Give the order of the permutation $\\lambda_3$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The powers of the permutation satisfy $\\lambda_3^k(x) = 3k + x$ by the homomorphism property of the action. So $\\lambda_3^k$ is the identity exactly when $3k \\equiv 0$ modulo $9$. The smallest positive such $k$ is $3$, since $3 \\cdot 3 = 9$. The order of $\\lambda_3$ is 3."
          - problem: "In the proof that the map sending each group element to its left translation is a homomorphism, one checks $\\lambda_g \\lambda_h = \\lambda_{gh}$ for the left-regular action $\\lambda_g(x) = gx$. Take $G = \\mathbb{Z}_{20}$ with $g = 13$ and $h = 17$, so that the composite $\\lambda_{13} \\lambda_{17}$ equals $\\lambda_c$. Give $c$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The homomorphism property is checked by evaluating the composite at an arbitrary element $x$ and comparing it with the right-hand side. Since $\\lambda_{13}\\lambda_{17}(x) = 13 + (17 + x) = 30 + x$, associativity of addition in $\\mathbb{Z}_{20}$ shows this equals $(13 + 17) + x$. Reducing the index modulo $20$ gives $30 + x = 10 + x = \\lambda_{10}(x)$, so the composite is $\\lambda_{10}$ and the index is $c = 10$. The answer is 10."
          - problem: "Write the full proof: every group $G$ is isomorphic to a subgroup of the symmetric group $S_G$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the action): let $G$ act on its underlying set by left multiplication, $\\lambda_g(x) = gx$. Each $\\lambda_g$ is a bijection of $G$ because it has inverse $\\lambda_{g^{-1}}$, so $\\lambda_g$ belongs to $S_G$. Step 2 (homomorphism): for all $x$, $\\lambda_g \\lambda_h(x) = g(hx) = (gh)x = \\lambda_{gh}(x)$, so the map $\\varphi: g \\mapsto \\lambda_g$ is a homomorphism from $G$ into $S_G$. Step 3 (kernel triviality): suppose $\\lambda_g = \\mathrm{id}$; then $\\lambda_g(e) = e$, but $\\lambda_g(e) = ge = g$, hence $g = e$, so the kernel of $\\varphi$ is $\\{e\\}$. Step 4 (isomorphism): the image $\\varphi(G)$ is a subgroup of $S_G$, and since the kernel is trivial the map is injective, so $G \\cong \\varphi(G) \\le S_G$. Conclusion: every group is isomorphic to a subgroup of a symmetric group, and a group of order $n$ embeds as a subgroup of $S_n$."
        constraints: "full proof or key steps; the kernel-triviality argument is required"
      - id: kp3
        name: "Computing regular representations"
        key_prerequisites: [group-actions]
        exemplars:
          - problem: "In the left-regular representation of the cyclic group $\\mathbb{Z}_3$, the element $1$ acts on the residues $\\{0, 1, 2\\}$ by adding $1$ modulo $3$. Give the image of $1$ as a permutation in one-line notation, that is, as (f(0), f(1), f(2))."
            answer: "(1,2,0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (left-regular representation): the image of $1$ adds $1$ modulo $3$, so it sends $0 \\mapsto 1$, $1 \\mapsto 2$, and $2 \\mapsto 0$; in cycle notation this is a single three-cycle. Step 2 (one-line notation): listing the images of $0$, $1$, and $2$ in order gives the tuple of values. The answer is (1,2,0)."
          - problem: "In the left-regular representation of $\\mathbb{Z}_4$, the element $2$ acts on the residues $\\{0, 1, 2, 3\\}$ by adding $2$ modulo $4$. Give $k$, the number of disjoint cycles in the image of $2$, and $m$, the length of each of those cycles."
            answer: "k = 2; m = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "k"}, {"contract": {"kind": "exact"}, "name": "m"}]}
            solution_sketch: "Step 1 (left-regular representation): adding $2$ modulo $4$ sends $0 \\mapsto 2$, $2 \\mapsto 0$, $1 \\mapsto 3$, and $3 \\mapsto 1$, so the image is the product of the disjoint transpositions $(0\\,2)(1\\,3)$. Step 2 (cycle structure): the image splits into $k = 2$ disjoint cycles, and each cycle has length $m = 2$. The answer is k = 2; m = 2."
          - problem: "In the left-regular representation of $\\mathbb{Z}_6$, the element $2$ acts on the residues $\\{0, 1, 2, 3, 4, 5\\}$ by adding $2$ modulo $6$. Find the order of the image of $2$ in the symmetric group on these six points."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (orbits of the action): adding $2$ modulo $6$ sends $0 \\to 2 \\to 4 \\to 0$ and $1 \\to 3 \\to 5 \\to 1$, so the image is the permutation $(0,2,4)(1,3,5)$. Step 2 (order of a product of disjoint cycles): the order is the least common multiple of the cycle lengths, which is $3$. The order of the image of $2$ is 3."
          - problem: "A student asserts that for every $n$ with $2 \\le n \\le 6$, the image of each element of $\\mathbb{Z}_n$ other than $0$ under the left-regular representation has order $n$. Find the smallest $n$ for which the assertion is false."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (check the smallest groups): in $\\mathbb{Z}_2$ and $\\mathbb{Z}_3$ every nonzero element generates the whole group, so its image is an $n$-cycle of order $n$; the assertion holds for $n = 2$ and $n = 3$. Step 2 (test $\\mathbb{Z}_4$): the image of $2$ adds $2$ modulo $4$ and is the permutation $(0,2)(1,3)$, which has order $2$, not $4$. Step 3 (smallest counterexample): the smallest $n$ for which the assertion fails is $4$. The answer is 4."
          - problem: "In the left-regular representation of $\\mathbb{Z}_5$, the element $3$ acts on the residues $\\{0, 1, 2, 3, 4\\}$ by adding $3$ modulo $5$. Find the order of the image of $3$ in the symmetric group on these five points."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (orbits of the action): adding $3$ modulo $5$ sends $0 \\to 3 \\to 1 \\to 4 \\to 2 \\to 0$, so the image is the five-cycle $(0,3,1,4,2)$. Step 2 (order of a cycle): a cycle of length $5$ has order $5$, and no smaller positive power returns every point to itself. The order of the image of $3$ is 5."
          - problem: "Take the Klein four-group $V = \\{e, a, b, c\\}$, in which the elements $a$, $b$, $c$ are self-inverse and $ab = c$, $ac = b$, $bc = a$. In the left-regular representation the element $b$ acts by $x \\mapsto bx$. How many elements of $V$ does the image of $b$ fix?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (left multiplication by $b$): the element $b$ sends $e \\mapsto b$, $a \\mapsto ba = c$, $b \\mapsto e$, and $c \\mapsto bc = a$. Step 2 (fixed points and cycle notation): a fixed element would satisfy $bx = x$, which forces $b = e$ after cancelling, so no element is fixed; the image $(e,b)(a,c)$ moves all four elements. The answer is 0."
          - problem: "Write the full proof: the left-regular representation of a group $G$ is an injective homomorphism from $G$ into the symmetric group on the set $G$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the images are permutations): for each element $a$ of $G$, let $\\lambda_a$ be the map $x \\mapsto ax$ on the set $G$. The map $x \\mapsto a^{-1}x$ undoes it on both sides, so $\\lambda_a$ is a bijection of $G$ and belongs to the symmetric group on $G$. Step 2 (homomorphism): for elements $a$ and $b$ and any $x$ in $G$, the map $\\lambda_{ab}$ sends $x$ to $(ab)x = a(bx)$, which is $\\lambda_a$ applied to $\\lambda_b(x)$; hence $\\lambda_{ab} = \\lambda_a \\lambda_b$, so the assignment respects products and is a group homomorphism. Step 3 (injectivity): if $\\lambda_a$ is the identity permutation, then evaluating at the identity element $e$ gives $a = ae = \\lambda_a(e) = e$, so the kernel is trivial, and a homomorphism with trivial kernel is injective. Step 4 (conclusion): $G$ embeds as a subgroup of the symmetric group on the set $G$, and for a finite group of order $n$ this is an embedding into the symmetric group on $n$ points, which is Cayley's theorem."
        constraints: "regular representations of Z_n (n <= 6) and the Klein group; cycle-notation answers"
    diagnostic_exemplar:
      problem: 'Cayley''s theorem embeds $(\mathbb{Z}_6, +)$ into a symmetric group $S_n$. Give $n$, write the permutation representing the element $3$ in cycle notation, and explain why the embedding is injective.'
      answer: '$n = 6$: the group acts on its own six elements by left translation. The element $3$ gives $\lambda_3(x) = x + 3$, i.e. $0 \mapsto 3,\ 1 \mapsto 4,\ 2 \mapsto 5,\ 3 \mapsto 0,\ 4 \mapsto 1,\ 5 \mapsto 2$, which in cycle notation is $(0\,3)(1\,4)(2\,5)$. The map $g \mapsto \lambda_g$ is injective because $\lambda_g = \mathrm{id}$ forces $g = \lambda_g(0) = 0$.'
      solution_sketch: 'The regular representation sends $g$ to translation by $g$ on the group itself; translation by $3$ in $\mathbb{Z}_6$ is an involution with three $2$-cycles. Injectivity follows by evaluating at the identity.'
