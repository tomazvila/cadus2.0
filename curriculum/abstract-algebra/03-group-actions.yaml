  - id: orbit-stabilizer-theorem
    name: "The Orbit-Stabilizer Theorem"
    # W8 made this supplemental as "stated theorem whose only use here is Burnside
    # counting". That rationale dissolved in Phase C: the class equation (and through
    # it Cauchy's and Sylow's theorems) now builds directly on it. Flipped back to core.
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: orbits-stabilizers
        weight: 0.9
        key: true
      - id: lagranges-theorem
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Statement and the coset bijection"
        key_prerequisites: [orbits-stabilizers, lagranges-theorem]
        try_first:
          problem: 'A square tile has $8$ symmetries. A dot is painted at one corner, and moving the tile through all $8$ symmetries puts the dot at $4$ different corners. How many of the $8$ symmetries leave the dot at its own corner?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The $8$ symmetries split into $4$ equal groups, one for each corner the dot can reach, so each group has $8/4 = 2$ symmetries. The group that keeps the dot in place is the stabilizer, and this is the orbit-stabilizer theorem $|G| = |\mathrm{Orb}|\cdot|\mathrm{Stab}|$.'
        step_check:
          step: 'The map $\phi$ is a bijection, proving the Orbit-Stabilizer Theorem'
          question: 'Why does a bijection between $G/\mathrm{Stab}(x)$ and $\mathrm{Orb}(x)$ prove that $|G| = |\mathrm{Orb}(x)|\cdot|\mathrm{Stab}(x)|$?'
          options:
            - 'The bijection makes the orbit a subgroup of $G$, so Lagrange''s theorem gives the product'
            - 'Each coset has $|\mathrm{Orb}(x)|$ elements, and there are $|\mathrm{Stab}(x)|$ such cosets'
            - 'There are $|\mathrm{Orb}(x)|$ cosets, and each has $|\mathrm{Stab}(x)|$ elements'
            - 'The bijection shows that the stabilizer is normal, so the quotient group is the orbit'
          answer: 'There are $|\mathrm{Orb}(x)|$ cosets, and each has $|\mathrm{Stab}(x)|$ elements'
          why: 'The group splits into cosets of $\mathrm{Stab}(x)$, all of the same size $|\mathrm{Stab}(x)|$, and the bijection says the number of cosets is $|\mathrm{Orb}(x)|$; the orbit itself need not be a subgroup.'
        exemplars:
          - problem: 'A finite group $G$ of order $56$ acts on a set $X$, and the stabilizer of a point $x$ has order $8$. How many points are in the orbit of $x$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem, $|G| = |\mathrm{Orb}(x)|\cdot|\mathrm{Stab}(x)|$. So $56 = |\mathrm{Orb}(x)|\cdot 8$, and dividing by $8$ gives an orbit of $7$ points.'
          - problem: 'A finite group $G$ of order $30$ acts on a set $X$, and the orbit of a point $x$ has $5$ points. What is the order of the stabilizer of $x$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit-stabilizer theorem gives $30 = 5\cdot|\mathrm{Stab}(x)|$ for the point $x$. Dividing both sides by $5$ shows that the stabilizer has order $6$.'
          - problem: 'A finite group $G$ of order $45$ acts on a set $X$, and the stabilizer of a point $x$ has order $5$. How many cosets does the stabilizer of $x$ have in $G$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cosets of $\mathrm{Stab}(x)$ correspond one to one with the points of the orbit, so their number is $|G|/|\mathrm{Stab}(x)|$. Here that is $45/5 = 9$ cosets.'
          - problem: 'A group $G$ of order $40$ acts on a set $X$, and the orbit of a point $x$ has $8$ points. Dana says that the stabilizer of $x$ has order $40-8 = 32$. Is Dana right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Dana is right", "yes, Dana is right"], ["no", "Dana is wrong", "Dana is not right", "no, Dana is wrong"]]}
            solution_sketch: 'The theorem is a product formula, $|G| = |\mathrm{Orb}(x)|\cdot|\mathrm{Stab}(x)|$, not a sum. So $40 = 8\cdot|\mathrm{Stab}(x)|$ and the stabilizer has order $5$, not $40-8=32$. Dana is wrong.'
          - problem: 'A group $G$ of order $36$ acts on a set $X$, and the orbit of a point $x$ has $9$ points. What is the order of the stabilizer of $x$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem, $36 = 9\cdot|\mathrm{Stab}(x)|$. So the stabilizer has order $36/9 = 4$.'
          - problem: 'The group $\mathbb{Z}_{12}$ acts on $\mathbb{Z}_4$ by $g\cdot x = x+g \bmod 4$, and the stabilizer of $0$ is $\{0,4,8\}$. All elements of the coset $5+\{0,4,8\} = \{1,5,9\}$ send $0$ to the same point. Which point is it?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $h$ is in the stabilizer, then $(g+h)\cdot 0 = g\cdot(h\cdot 0) = g\cdot 0$, so every element of a coset sends $0$ to the same point. For the coset $5+\mathrm{Stab}(0)$ this point is $5\cdot 0 = 5 \equiv 1 \pmod 4$, and indeed $1\cdot 0 = 1$ and $9\cdot 0 = 9\equiv 1$.'
          - problem: 'A finite group $G$ of order $40$ acts on a set $X$, and the stabilizer of a point $x$ has order $5$. How many elements does the orbit of $x$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit-stabilizer theorem gives $40 = |\mathrm{Orb}(x)|\cdot 5$. Dividing by $5$, the orbit of $x$ has $8$ elements.'
          - problem: 'The rotation group of a regular tetrahedron acts transitively on its $4$ vertices, and the stabilizer of a vertex has order $3$. What is the order of the rotation group?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group acts transitively on the $4$ vertices, so the orbit has $4$ points. By the theorem, $|G| = 4\cdot 3 = 12$, so the group has $12$ rotations.'
          - problem: 'The group of all $48$ symmetries of a cube acts transitively on its $8$ corners. How many of the symmetries keep one chosen corner fixed?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group acts transitively on the $8$ corners, so $48 = 8\cdot|\mathrm{Stab}|$. Dividing by $8$, exactly $6$ symmetries keep a given corner in place.'
        constraints: 'statement plus one step of the bijection proof; solve for the missing one of |G|, orbit size, stabilizer order, number of cosets'
      - id: kp2
        name: "Numerical applications"
        key_prerequisites: [orbits-stabilizers, lagranges-theorem]
        step_check:
          step: 'Apply the Orbit-Stabilizer Theorem'
          question: 'Why does the example multiply $|\mathrm{Orb}(x)|$ by $|\mathrm{Stab}(x)|$ to obtain $|G|$ and not add them?'
          options:
            - 'The orbit and the stabilizer are two disjoint parts that together make up the whole group'
            - 'Each orbit point is reached by one group element, and the stabilizer then doubles that count'
            - 'Multiplying is the only operation that keeps the result a divisor of the order of the group'
            - 'The group splits into $|\mathrm{Orb}(x)|$ cosets, each of size $|\mathrm{Stab}(x)|$'
          answer: 'The group splits into $|\mathrm{Orb}(x)|$ cosets, each of size $|\mathrm{Stab}(x)|$'
          why: 'Counting cosets: there are $|\mathrm{Orb}(x)|$ of them and each has $|\mathrm{Stab}(x)|$ elements, so the group order is a product.'
        exemplars:
          - problem: 'The dihedral group $D_4$ of order $8$ acts transitively on the $4$ vertices of a square. What is the order of the stabilizer of a vertex?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The action is transitive, so the orbit of a vertex is all $4$ vertices. By the orbit-stabilizer theorem $|\mathrm{Stab}| = 8/4 = 2$, namely the identity and the reflection through that vertex.'
          - problem: 'The rotation group of a cube acts transitively on its $6$ faces, and the stabilizer of a face has order $4$. What is the order of the rotation group?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit of a face is all $6$ faces and its stabilizer has order $4$. By the orbit-stabilizer theorem $|G| = 6\cdot 4 = 24$.'
          - problem: 'The rotation group of a cube has order $24$ and acts on the $8$ corners of the cube. The stabilizer of a corner has order $3$. How many corners are in the orbit of a corner?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem $|\mathrm{Orb}| = |G|/|\mathrm{Stab}| = 24/3 = 8$. So a corner can be carried to any of the $8$ corners of the cube.'
          - problem: 'The symmetry group of a regular polygon has order $20$ and acts on the vertices of the polygon. The stabilizer of a vertex has order $2$. How many vertices does the polygon have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The action on the vertices is transitive, so the number of vertices equals the size of the orbit. By the theorem $|\mathrm{Orb}| = 20/2 = 10$, so the polygon has $10$ vertices.'
          - problem: 'The group of all symmetries of a cube, including reflections, acts transitively on the $6$ faces, and the stabilizer of a face has order $8$. What is the order of this group?'
            answer: '48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit of a face has $6$ points and the stabilizer has order $8$. Multiplying gives $|G| = 6\cdot 8 = 48$.'
          - problem: 'The group of all $24$ symmetries of a regular tetrahedron acts transitively on its $6$ edges. What is the order of the stabilizer of an edge?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group acts transitively on the $6$ edges, so $24 = 6\cdot|\mathrm{Stab}|$. The stabilizer of an edge has order $24/6 = 4$.'
          - problem: 'The rotation group of a regular dodecahedron has order $60$ and acts transitively on its $20$ corners. What is the order of the stabilizer of a corner?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group acts transitively on the $20$ corners, so $60 = 20\cdot|\mathrm{Stab}|$. The stabilizer of a corner has order $60/20 = 3$.'
          - problem: 'The rotation group of a regular tetrahedron has order $12$ and acts transitively on its $4$ vertices. Sam says that the stabilizer of a vertex has order $12-4 = 8$. What is the correct order of the stabilizer?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group acts transitively on the $4$ vertices, so $12 = 4\cdot|\mathrm{Stab}|$ and the stabilizer has order $12/4 = 3$, not $12-4=8$. The theorem is a product, so we divide.'
          - problem: 'The full symmetry group of a regular pentagon has order $10$ and acts on its $5$ vertices. What is the order of the stabilizer of a vertex?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The action on the $5$ vertices is transitive, so $|\mathrm{Stab}| = 10/5 = 2$. The stabilizer is the identity and the reflection through that vertex.'
        constraints: 'solve for the missing one of |G|, orbit size, stabilizer size; geometric actions (polygons, cube, tetrahedron, dodecahedron)'
      - id: kp3
        name: "Conjugacy classes and centralizers"
        key_prerequisites: [orbits-stabilizers]
        step_check:
          step: 'Identify the given values'
          question: 'Why can the orbit-stabilizer theorem be applied to a class size and the order $|C(r)|$?'
          options:
            - 'The orbit of an element is its class, and its stabilizer is its centralizer'
            - 'Under conjugation every element has the same orbit, which is the center of the group'
            - 'The centralizer is the set of elements that carry $r$ to the other elements of its class'
            - 'Conjugation is the only action of a group on itself, so the theorem always applies'
          answer: 'The orbit of an element is its class, and its stabilizer is its centralizer'
          why: 'For the action $g\cdot x = gxg^{-1}$ the orbit of $x$ is $\{gxg^{-1}\}$, its class, and $\mathrm{Stab}(x)=\{g : gxg^{-1}=x\}=C(x)$, so the theorem reads $|G| = |\text{class}|\cdot|C(x)|$.'
        exemplars:
          - problem: 'Under conjugation, the orbit of an element $x$ is its conjugacy class and the stabilizer of $x$ is its centralizer $C(x)$. In $S_3$ the conjugacy class of $(1\,2)$ has $3$ elements. What is the order of $C((1\,2))$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem for conjugation, $|S_3| = |\text{class}|\cdot|C(x)|$, so $6 = 3\cdot|C((1\,2))|$. Hence $|C((1\,2))| = 2$, and the centralizer is $\{e,(1\,2)\}$.'
          - problem: 'In the dihedral group $D_4$ of order $8$, the conjugacy class of the half-turn $r^2$ is the single element $\{r^2\}$. What is the order of the centralizer $C(r^2)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $r^2$ has size $1$, so $|C(r^2)| = |D_4|/1 = 8$. Thus $r^2$ commutes with every element, which means it lies in the center.'
          - problem: 'In the dihedral group $D_4$ of order $8$, the conjugacy class of the quarter turn $r$ is $\{r, r^3\}$. What is the order of its centralizer $C(r)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class $\{r, r^3\}$ has size $2$, so $|C(r)| = 8/2 = 4$. The centralizer is the cyclic group of rotations $\{e,r,r^2,r^3\}$.'
          - problem: 'Five cards are rearranged by a shuffle $\sigma$ that moves all five cards around one loop, and the rearrangements that commute with $\sigma$ are exactly its $5$ powers. Among the $120$ rearrangements of five cards, how many are conjugate to $\sigma$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Under conjugation the class of $\sigma$ has $|S_5|/|C(\sigma)| = 120/5 = 24$ elements, because the centralizer is the group of the $5$ powers of $\sigma$. So $24$ rearrangements are conjugate to $\sigma$.'
          - problem: 'In $S_3$, which has order $6$, the centralizer of the $3$-cycle $(1\,2\,3)$ has order $3$. How many elements are in the conjugacy class of $(1\,2\,3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The orbit-stabilizer theorem for conjugation gives class size $|S_3|/|C((1\,2\,3))| = 6/3 = 2$. The class of $(1\,2\,3)$ is $\{(1\,2\,3),(1\,3\,2)\}$.'
          - problem: 'The group $S_4$ has order $24$, and the conjugacy class of the double transposition $(1\,2)(3\,4)$ has $3$ elements. What is the order of its centralizer?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem, $|S_4| = |\text{class}|\cdot|C(x)|$. So $|C((1\,2)(3\,4))| = 24/3 = 8$.'
          - problem: 'In $S_4$ the centralizer of the $3$-cycle $(1\,2\,3)$ has order $3$. How many elements are in the conjugacy class of $(1\,2\,3)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the orbit-stabilizer theorem the class of $(1\,2\,3)$ has $|S_4|/|C((1\,2\,3))| = 24/3 = 8$ elements. These are the eight $3$-cycles of $S_4$.'
          - problem: 'Six guests sit around a table and $\sigma$ moves every guest one seat to the right. The rearrangements of the $6$ guests that commute with $\sigma$ are exactly its $6$ powers. Among the $720$ rearrangements of six guests, how many are conjugate to $\sigma$?'
            answer: '120'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $\sigma$ has $|S_6|/|C(\sigma)| = 720/6 = 120$ elements, because the centralizer is the group of the $6$ powers of $\sigma$. So $120$ rearrangements are conjugate to $\sigma$.'
          - problem: 'Sam finds that the conjugacy class of $(1\,2)$ in $S_4$ has $6$ elements and concludes that its centralizer has order $6$. What is the correct order of the centralizer of $(1\,2)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The theorem gives $24 = 6\cdot|C((1\,2))|$, so $|C((1\,2))| = 4$; Sam confused the class size with the centralizer order. The centralizer is $\{e,(1\,2),(3\,4),(1\,2)(3\,4)\}$.'
          - problem: 'A group of order $21$ contains an element $x$ whose centralizer has order $3$. How many conjugates does $x$ have, counting $x$ itself?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of conjugates is the size of the class, $|G|/|C(x)| = 21/3 = 7$. So $x$ has $7$ conjugates.'
        constraints: 'class sizes and centralizer orders in S_3, S_4, S_5, S_6, D_4 and small abstract groups'
    diagnostic_exemplar:
      problem: 'In $S_4$ the conjugacy class of $(1\,2)$ has $6$ elements. Using the orbit-stabilizer theorem for the conjugation action of $S_4$ on itself, find $|C((1\,2))|$ and list the elements of that centralizer.'
      answer: 'Under conjugation the orbit of $(1\,2)$ is its conjugacy class and the stabilizer is the centralizer, so $|S_4| = |\mathrm{class}| \cdot |C((1\,2))|$ gives $|C((1\,2))| = 24/6 = 4$. The four elements are $e$, $(1\,2)$, $(3\,4)$ and $(1\,2)(3\,4)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Apply orbit-stabilizer to the conjugation action: class size times centralizer order is $|G|$. Then identify the permutations commuting with $(1\,2)$ — those preserving $\{1,2\}$ and $\{3,4\}$ setwise.'
    anki_seeds:
      - front: "Orbit-stabilizer theorem?"
        back: "$|G| = |\\mathrm{Orb}(x)| \\cdot |\\mathrm{Stab}(x)|$ (finite $G$)."
        type: basic
      - front: "Under conjugation, orbit and stabilizer of $x$ are called..."
        back: "The conjugacy class of $x$ and the centralizer $C(x)$."
        type: basic

  - id: burnside-counting
    name: "Burnside Counting"
    core: false                # enumeration curiosity; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: orbit-stabilizer-theorem
        weight: 0.9
        key: true
      - id: permutations-cycle-notation
        weight: 0.6
        key: false
      - id: multiplication-principle
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Burnside's lemma and fixed-point counts"
        key_prerequisites: [orbit-stabilizer-theorem]
        try_first:
          problem: 'Two beads on a ring are each black or white, and a half turn of the ring swaps the two beads. Two colorings count as the same when a rotation turns one into the other. How many different colorings are there?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The colorings are two black beads, two white beads, and one of each, which gives $3$. Burnside''s lemma gives the same by $(4+2)/2 = 3$: the identity fixes all $4$ colorings and the half turn fixes $2$.'
        step_check:
          step: 'Apply Burnside''s lemma'
          question: 'Why does Burnside''s lemma divide the total of the fixed-point counts by $|G|$?'
          options:
            - 'The division turns the total into the fixed-point count of one single element'
            - 'Each orbit is counted $|G|$ times in the total, once for every group element'
            - 'The division removes the identity element, which fixes every one of the points'
            - 'Dividing by $|G|$ makes the result a whole number for every group and action'
          answer: 'Each orbit is counted $|G|$ times in the total, once for every group element'
          why: 'The total counts the pairs $(g,x)$ with $g\cdot x = x$, which is $\sum_x|\mathrm{Stab}(x)|$; by orbit-stabilizer each orbit contributes $|G|$, so dividing by $|G|$ leaves one for each orbit.'
        exemplars:
          - problem: 'A group $G$ of order $8$ acts on a set of colorings, and the numbers $|\mathrm{Fix}(g)|$ of colorings fixed by the eight elements of $G$ add up to $56$. How many orbits are there?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Burnside''s lemma says that the number of orbits is the average of the fixed-point counts. Here the average is $56/8 = 7$, so there are $7$ orbits.'
          - problem: 'A rotation by $90^\circ$ acts on the $2$-colorings of the $4$ beads of a necklace. How many colorings does it fix?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A coloring fixed by the rotation has every bead the same color as the next bead. So all four beads share one color, which gives $2$ fixed colorings.'
          - problem: 'A rotation by $120^\circ$ permutes the $6$ beads of a bracelet in two cycles of length $3$, and it acts on the $3$-colorings of the bracelet. How many colorings does this rotation fix?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotation splits the $6$ beads into $2$ cycles of length $3$. A fixed coloring is constant on each cycle, so there are $3$ choices per cycle and $3^2 = 9$ fixed colorings.'
          - problem: 'A permutation of a row of $12$ tiles acts on the $3$-colorings of the row and fixes exactly $81$ of them. How many cycles does the permutation have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation with $c$ cycles fixes $3^c$ colorings, because a fixed coloring is constant on each cycle. Since $3^4 = 81$, the permutation has $4$ cycles.'
          - problem: 'A group of order $10$ acts on a set of colorings. Four of its elements fix $8$ colorings each, and the other six elements fix $3$ colorings each. How many orbits are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By Burnside''s lemma the number of orbits is the average of the fixed-point counts. The sum is $4\cdot 8 + 6\cdot 3 = 32+18 = 50$, and $50/10 = 5$ orbits.'
          - problem: 'A group of order $6$ acts on a set of colorings, and its six elements fix $36$, $3$, $3$, $6$, $6$ and $6$ colorings. How many orbits are there?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Burnside''s lemma divides the sum of the counts by the group order. The sum is $36+3+3+6+6+6 = 60$, so there are $60/6 = 10$ orbits.'
          - problem: 'A group of order $4$ acts on the $2$-colorings of the corners of a square, and its four elements fix $16$, $2$, $4$ and $2$ colorings. Sam adds the four numbers and says that there are $24$ orbits. How many orbits are there?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam added the counts but forgot to divide by the order of the group. The sum is $16+2+4+2 = 24$, and Burnside''s lemma gives $24/4 = 6$ orbits.'
          - problem: 'Ten lamps stand in a ring and each is either on or off. Moving every lamp $4$ places around the ring is a rotation of the ring. How many of the $2^{10}$ on-off settings does this rotation leave unchanged?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotation by $4$ positions splits the $10$ lamps into $\gcd(4,10)=2$ cycles. A setting is unchanged exactly when each cycle is all on or all off, so there are $2^2 = 4$ such settings.'
          - problem: 'A row of $8$ tiles is painted with $3$ colors, one color per tile. Reversing the row, so that the first tile swaps places with the last, the second with the seventh and so on, is a permutation of the tiles. How many colorings does the reversal leave unchanged?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The reversal swaps tile $1$ with tile $8$, tile $2$ with tile $7$, and so on, which gives $4$ cycles of length $2$. A fixed coloring is constant on each cycle, so there are $3^4 = 81$ of them.'
        constraints: 'averaging given fixed-point counts; fixed colorings of a single permutation: k^(number of cycles); rings, rows and reversals in context'
      - id: kp2
        name: "Necklaces under rotation"
        key_prerequisites: [orbit-stabilizer-theorem, permutations-cycle-notation]
        step_check:
          step: 'Calculate the number of fixed colorings for each rotation'
          question: 'Why is the number of colorings fixed by a rotation equal to $k^{\gcd(r,n)}$?'
          options:
            - 'The rotation fixes $\gcd(r,n)$ beads, and the remaining beads can take any of the $k$ colors'
            - 'Each of the $\gcd(r,n)$ colors must be used on exactly one bead of the ring'
            - 'The beads form $\gcd(r,n)$ cycles, and a fixed coloring has one color per cycle'
            - 'The rotation by $r$ positions fixes $k$ colorings for every divisor of $n$ that it meets'
          answer: 'The beads form $\gcd(r,n)$ cycles, and a fixed coloring has one color per cycle'
          why: 'A fixed coloring must give all beads of one cycle the same color, so the colors of the $\gcd(r,n)$ cycles can be chosen freely, which gives $k^{\gcd(r,n)}$ choices.'
        exemplars:
          - problem: 'How many distinct necklaces can be made from $4$ beads in $2$ colors if rotating a necklace does not change it?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotations by $0$, $1$, $2$ and $3$ positions fix $16$, $2$, $4$ and $2$ colorings. By Burnside''s lemma the number of necklaces is $(16+2+4+2)/4 = 24/4 = 6$.'
          - problem: 'How many distinct necklaces of $3$ beads can be made with $3$ available colors, if two necklaces that differ by a rotation count as the same?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $3^3 = 27$ colorings, and each of the two nontrivial rotations is a single $3$-cycle fixing $3$ colorings. So the number of necklaces is $(27+3+3)/3 = 33/3 = 11$.'
          - problem: 'A bracelet has $5$ beads in a circle, and each bead is one of $2$ colors. Two colorings are the same when a rotation turns one into the other. How many distinct colorings are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $2^5 = 32$ colorings, and each of the four nontrivial rotations is one $5$-cycle fixing $2$ colorings. The average is $(32+2+2+2+2)/5 = 40/5 = 8$.'
          - problem: 'Six beads are placed evenly on a ring and each is colored with one of $2$ colors. Two colorings are considered the same if a rotation carries one to the other. How many distinct colorings are there?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotations by $0$ to $5$ positions have $\gcd(r,6) = 6,1,2,3,2,1$ cycles, so they fix $2^6, 2, 2^2, 2^3, 2^2, 2$ colorings. The average is $(64+2+4+8+4+2)/6 = 84/6 = 14$.'
          - problem: 'A necklace has $6$ beads and $3$ colors are available. The rotation by $180^\circ$ sends each bead to the bead $3$ positions away, so the $6$ positions form $3$ cycles of length $2$. How many colorings are fixed by this rotation?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotation by $3$ positions has $\gcd(3,6)=3$ cycles, each of length $2$, and a fixed coloring is constant on each cycle. So the number of fixed colorings is $3^3 = 27$.'
          - problem: 'How many distinct colorings does a ring of $5$ beads have when each bead has one of $3$ colors and rotations of the ring do not count as different?'
            answer: '51'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $3^5 = 243$ colorings and each of the four nontrivial rotations fixes $3$ colorings. By Burnside''s lemma the average is $(243+3+3+3+3)/5 = 255/5 = 51$.'
          - problem: 'A jeweller makes designs by threading $4$ beads on a ring from $3$ available colors. A design that is only a rotated copy of another is not counted as new. How many different designs are there?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotations by $0$ to $3$ positions fix $3^4=81$, $3$, $3^2=9$ and $3$ colorings. By Burnside''s lemma there are $(81+3+9+3)/4 = 96/4 = 24$ different designs.'
          - problem: 'A jeweller makes bracelets from $7$ beads in a circle, each bead black or white, and treats rotated copies as the same bracelet. How many different bracelets are possible?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $2^7 = 128$ colorings and each of the six nontrivial rotations is a single $7$-cycle fixing $2$ colorings. So there are $(128+6\cdot 2)/7 = 140/7 = 20$ different bracelets.'
        constraints: 'n beads (n <= 7), k colors (k <= 3), cyclic group only; fixed colorings = k^{gcd(r, n)}'
      - id: kp3
        name: "Adding reflections: dihedral symmetry"
        key_prerequisites: [orbit-stabilizer-theorem, permutations-cycle-notation]
        step_check:
          step: 'colorings symmetric across the axis are fixed'
          question: 'Why does each reflection of the triangle fix $2^2 = 4$ of the $2$-colorings?'
          options:
            - 'It has two cycles, so a fixed coloring picks one of two colors for each'
            - 'It fixes all three vertices, but only half of the colorings survive the flip'
            - 'It swaps two vertices and fixes one, so the swapped vertices cannot be colored'
            - 'Each reflection fixes the same four colorings that the identity fixes'
          answer: 'It has two cycles, so a fixed coloring picks one of two colors for each'
          why: 'The reflection has one fixed vertex and one swapped pair, which is two cycles; a fixed coloring is constant on each cycle, so it has $2\cdot 2 = 4$ choices.'
        exemplars:
          - problem: 'How many distinct ways are there to color the four corners of a square with $3$ colors, when colorings that differ by a rotation or a reflection of the square count as the same?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group has $8$ symmetries. The identity fixes $3^4 = 81$ colorings, the two quarter turns fix $3$ each, the half turn fixes $3^2=9$, the two diagonal reflections fix $3^3 = 27$ each, and the two edge reflections fix $3^2 = 9$ each. The total is $81+3+3+9+27+27+9+9 = 168$, and $168/8 = 21$.'
          - problem: 'Each corner of a square tile is painted red or blue. Two tiles are the same when one can be rotated or flipped over to look like the other. How many different tiles are there?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $8$ symmetries fix $16$ colorings (identity), $2$ and $2$ (quarter turns), $4$ (half turn), $8$ and $8$ (diagonal reflections), and $4$ and $4$ (edge reflections). The average is $48/8 = 6$.'
          - problem: 'An equilateral triangle has one of three colors at each vertex. Two colorings are the same when a symmetry of the triangle maps one to the other. How many distinct colorings are there?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $D_3$ has six symmetries. The identity fixes $3^3 = 27$ colorings, each of the two rotations fixes $3$, and each of the three reflections fixes $3^2 = 9$. Burnside''s lemma gives $(27+3+3+9+9+9)/6 = 60/6 = 10$.'
          - problem: 'A square has four colors available for its corners, one color per corner. Two colorings are the same when a rotation or a reflection of the square sends one to the other. How many distinct colorings are there?'
            answer: '55'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $4^4 = 256$ colorings, the two quarter turns fix $4$ each, the half turn fixes $4^2=16$, the two diagonal reflections fix $4^3=64$ each, and the two edge reflections fix $4^2 = 16$ each. Burnside''s lemma gives $(256+8+16+128+32)/8 = 440/8 = 55$.'
          - problem: 'The corners of an equilateral triangle are colored from a set of $m$ colors, and colorings that a rotation or a reflection of the triangle sends to each other count as one. There are exactly $20$ different colorings. What is $m$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of colorings is $(m^3+3m^2+2m)/6$: the identity fixes $m^3$, the two rotations fix $m$ each, and the three reflections fix $m^2$ each. Setting this equal to $20$ gives $m^3+3m^2+2m = 120$, and $m=4$ works since $64+48+8=120$. The left side increases with $m$, so $m=4$ is the only solution.'
          - problem: 'Each corner of a square is painted one of six colors. Colorings that a rotation or a reflection sends to each other count as one. How many different colorings are there?'
            answer: '231'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity fixes $6^4 = 1296$ colorings, the two quarter turns fix $6$ each, the half turn fixes $6^2=36$, the two diagonal reflections fix $6^3 = 216$ each, and the two edge reflections fix $36$ each. Burnside''s lemma gives $(1296+12+36+432+72)/8 = 1848/8 = 231$.'
          - problem: 'A bracelet has $5$ beads in a circle, each one of $3$ colors, and the bracelet may be turned over as well as rotated. How many different bracelets are there?'
            answer: '39'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $D_5$ has $10$ elements. The identity fixes $3^5 = 243$ colorings, each of the four nontrivial rotations fixes $3$, and each of the five reflections fixes $3^3 = 27$. So there are $(243+12+135)/10 = 390/10 = 39$ bracelets.'
          - problem: 'A flat hexagonal medal has a gem at each of its $6$ corners, and each gem is red or green. Medals that can be rotated or flipped over to match are the same. How many different medals are there?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $12$ symmetries of the hexagon fix $2^6=64$ colorings (identity), $2$ each (rotations by $60^\circ$ and $300^\circ$), $4$ each (rotations by $120^\circ$ and $240^\circ$), $8$ (half turn), $2^4=16$ each (three corner reflections) and $2^3 = 8$ each (three edge reflections). The average is $(64+4+8+8+48+24)/12 = 156/12 = 13$.'
        constraints: 'triangle, square, pentagon bracelet and hexagon medal; enumerate cycle structures of all group elements'
    diagnostic_exemplar:
      problem: 'How many distinct necklaces of $5$ beads in $2$ colours are there, counting two as the same when one is a rotation or a reflection of the other?'
      answer: '8'
      solution_sketch: 'Burnside over $D_5$ (order $10$): the identity fixes $2^{5} = 32$ colourings; each of the four nontrivial rotations fixes only the $2$ monochrome ones; each of the five reflections has one fixed bead and two swapped pairs, fixing $2^{3} = 8$. Total $32 + 4 \cdot 2 + 5 \cdot 8 = 80$, and $80/10 = 8$ orbits.'
    anki_seeds:
      - front: "Burnside's lemma?"
        back: "Number of orbits $= \\frac{1}{|G|} \\sum_{g} |\\mathrm{Fix}(g)|$ — the average number of fixed points."
        type: basic
      - front: "How many colorings (k colors) does a permutation with $c$ cycles on the positions fix?"
        back: "$k^c$ — the coloring must be constant on each cycle."
        type: basic

  - id: cayleys-theorem
    name: "Cayley's Theorem"
    core: false                # stated embedding theorem; nothing builds on it
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: group-actions
        weight: 0.8
        key: true
      - id: group-isomorphisms
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Left multiplication is a permutation"
        key_prerequisites: [group-actions]
        step_check:
          step: 'Multiply on the right by $x^{-1}$'
          question: 'Why is multiplying on the right by $x^{-1}$ the right move to remove $x$ from $ix = x$?'
          options:
            - 'Multiplying on the left would change the group element, but on the right it does not'
            - 'The factor $x$ stands at the right end of both sides, so $x^{-1}$ cancels it there'
            - 'Right multiplication is the only operation under which a group is closed'
            - 'The inverse $x^{-1}$ must go last so that the product $ix$ stays equal to $x$'
          answer: 'The factor $x$ stands at the right end of both sides, so $x^{-1}$ cancels it there'
          why: 'Multiplying $ix = x$ on the right by $x^{-1}$ turns $xx^{-1}$ into $e$ on both sides, leaving $i = e$; multiplying on the left would not cancel $x$.'
        exemplars:
          - problem: 'In the additive group $G=\mathbb{Z}_6$ let $\lambda_2(x) = 2+x$. The inverse map of $\lambda_2$ is $\lambda_h$ for exactly one element $h$ of $G$. Find $h$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $\lambda_h(\lambda_2(x)) = h+2+x$ equals $x$ for all $x$ exactly when $h+2\equiv 0 \pmod 6$. So $h = 4$, and indeed $\lambda_4(\lambda_2(x)) = 6+x = x$.'
          - problem: 'In the group $G=\mathbb{Z}_5$ let $\lambda_3(x) = 3+x$. How many elements $x$ of $G$ satisfy $\lambda_3(x) = x$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation $3+x = x$ in $\mathbb{Z}_5$ gives $3 = 0$ after subtracting $x$, which is false. So no element satisfies it and $\lambda_3$ has $0$ fixed points.'
          - problem: 'In the group $G=\mathbb{Z}_7$ let $\lambda_3(x) = 3+x$, and recall that $\lambda_a\circ\lambda_b = \lambda_{a+b}$. What is the order of the permutation $\lambda_3$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\lambda_a\circ\lambda_b = \lambda_{a+b}$, the $k$-fold composite $\lambda_3^k$ equals $\lambda_{3k}$. It is the identity exactly when $3k\equiv 0 \pmod 7$, and because $7$ is prime the smallest such $k$ is $7$.'
          - problem: 'Let $g$, $x$, $y$ be elements of a group $G$ with $gx = gy$. To show that $x=y$, and so that the map $\lambda_g$ is injective, one multiplies both sides on the left by a single element of $G$. Which element is it?'
            answer: 'g^(-1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiplying $gx = gy$ on the left by $g^{-1}$ gives $(g^{-1}g)x = (g^{-1}g)y$, which is $x = y$. So $\lambda_g$ is injective, and the element used is $g^{-1}$.'
          - problem: 'In the group $G=\mathbb{Z}_9$ let $\lambda_5(x) = 5+x$. Solve $\lambda_5(x) = 2$ for $x$ in $\mathbb{Z}_9$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $5+x\equiv 2 \pmod 9$. Subtracting $5$ gives $x\equiv -3\equiv 6 \pmod 9$, so the unique solution is $x = 6$, which shows that $\lambda_5$ is onto.'
          - problem: 'A carousel has $9$ horses in a ring, and a ride moves every horse $5$ places forward, which is the permutation $\lambda_5$ of $\mathbb{Z}_9$. What is the smallest number of places by which the carousel must then be turned forward to undo the ride?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Turning forward by $5$ places and then by $h$ places is a turn by $5+h$ places modulo $9$. This is a turn of $0$ exactly when $h = 4$, since $5+4 = 9$.'
          - problem: 'A carousel has $12$ horses in a ring, and every ride moves each horse $8$ places forward, which is the permutation $\lambda_8$ of $\mathbb{Z}_{12}$. After how many rides are all the horses first back at their starting places?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $k$-fold ride is a turn of $8k$ places, and it brings every horse back when $8k\equiv 0 \pmod{12}$. The smallest positive $k$ is $3$, since $8\cdot 3 = 24 = 2\cdot 12$.'
          - problem: 'Write the full proof that for each element $g$ of a group $G$ the map $\lambda_g: G\to G$ defined by $\lambda_g(x) = gx$ is a bijection.'
            answer: 'Each map x -> gx is a bijection of G.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'First, $\lambda_g$ is injective: if $gx = gy$, multiplying on the left by $g^{-1}$ gives $x = y$. Second, $\lambda_g$ is surjective: for any $y$ in $G$ the element $x = g^{-1}y$ satisfies $\lambda_g(x) = g(g^{-1}y) = y$. An injective and surjective map is a bijection; equivalently, $\lambda_{g^{-1}}$ is a two-sided inverse of $\lambda_g$. This is why each element $g$ can be viewed as a permutation of the set $G$.'
        constraints: 'properties of the left-regular maps lambda_g; one proof request'
      - id: kp2
        name: "The theorem and its proof"
        key_prerequisites: [group-actions, group-isomorphisms]
        step_check:
          step: 'In particular, $\lambda_g(e) = ge = e$'
          question: 'Why does the proof evaluate $\lambda_g$ at the identity element $e$?'
          options:
            - 'The identity element is the only point at which $\lambda_g$ can be evaluated'
            - 'Evaluating at $e$ shows directly that $\lambda_g$ is a bijection of the group'
            - 'Every permutation of $G$ fixes $e$, so the value $g$ tells us nothing'
            - 'The identity permutation fixes $e$, and $\lambda_g(e)$ equals $g$'
          answer: 'The identity permutation fixes $e$, and $\lambda_g(e)$ equals $g$'
          why: 'A permutation that is the identity fixes every point, in particular $e$; since $\lambda_g(e) = ge = g$, this forces $g = e$ and the kernel is trivial.'
        exemplars:
          - problem: 'Cayley''s theorem embeds a group of order $7$ in a symmetric group by letting the group act on its own elements. How many elements does that symmetric group have?'
            answer: '5040'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cayley''s theorem lets a group of order $n$ act on its own $n$ elements, so a group of order $7$ embeds in $S_7$. The group $S_7$ has $7! = 5040$ elements.'
          - problem: 'In the proof of Cayley''s theorem the map $\varphi$ sends each element $g$ of $G$ to the permutation $\lambda_g$, where $\lambda_g(x) = g+x$. For $G=\mathbb{Z}_5$, how many elements $g$ give the identity permutation $\lambda_g$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $\lambda_g$ is the identity only if $\lambda_g(0) = g+0 = g$ equals $0$, that is $g=0$. So only $0$ gives the identity permutation, and the kernel has $1$ element.'
          - problem: 'Cayley''s proof uses the left-regular action of $G=\mathbb{Z}_8$ on itself, $\lambda_g(x) = g+x$. What is $\lambda_5(0)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In the left-regular action of $\mathbb{Z}_8$ the rule is $\lambda_g(x) = g+x$. So $\lambda_5(0) = 5+0 = 5$, and since $5\neq 0$ the element $5$ is not in the kernel.'
          - problem: 'For the left-regular action of $\mathbb{Z}_{12}$, where $\lambda_g(x) = g+x$, the map $g\mapsto\lambda_g$ is a homomorphism: $\lambda_g\circ\lambda_h = \lambda_{g+h}$. What is $(\lambda_7\circ\lambda_5)(0)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(\lambda_7\circ\lambda_5)(0) = 7+(5+0) = 12$, and $12\equiv 0$ in $\mathbb{Z}_{12}$. This agrees with $\lambda_{7+5}(0) = \lambda_0(0) = 0$, as the homomorphism property predicts.'
          - problem: 'In the left-regular action of $\mathbb{Z}_9$ the permutation $\lambda_3$ satisfies $\lambda_3^k(x) = 3k+x$. What is the order of $\lambda_3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers satisfy $\lambda_3^k(x) = 3k+x$, so $\lambda_3^k$ is the identity exactly when $3k\equiv 0 \pmod 9$. The smallest positive such $k$ is $3$, since $3\cdot 3 = 9$.'
          - problem: 'The dial of a lock has $20$ positions, and turning it $g$ steps forward is the permutation $\lambda_g$ of $\mathbb{Z}_{20}$. Turning the dial $17$ steps and then $13$ steps gives the same result as a single turn. What is the smallest number of steps in such a single turn?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two turns are the composite $\lambda_{13}\circ\lambda_{17}$, which equals $\lambda_{13+17}$ by the homomorphism property. Since $30\equiv 10 \pmod{20}$, one turn of $10$ steps gives the same result.'
          - problem: 'A turntable has $15$ positions, and turning it $g$ positions forward is the permutation $\lambda_g$ of $\mathbb{Z}_{15}$. The table is turned $11$ positions and then $9$ positions. What is the smallest number of positions in a single turn that has the same effect?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two turns give $\lambda_{9+11} = \lambda_{20}$, and $20\equiv 5 \pmod{15}$. So a single turn of $5$ positions has the same effect.'
          - problem: 'Write the full proof of Cayley''s theorem: every group $G$ is isomorphic to a subgroup of the symmetric group $S_G$.'
            answer: 'G embeds in S_G by g -> lambda_g.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $G$ act on the set $G$ by left multiplication, $\lambda_g(x) = gx$. Each $\lambda_g$ is a bijection with inverse $\lambda_{g^{-1}}$, so it lies in $S_G$. For all $x$ we have $\lambda_g\lambda_h(x) = g(hx) = (gh)x = \lambda_{gh}(x)$, so $\varphi: g\mapsto\lambda_g$ is a homomorphism into $S_G$. If $\lambda_g$ is the identity permutation, then $g = ge = \lambda_g(e) = e$, so the kernel is trivial and $\varphi$ is injective. Hence $G$ is isomorphic to the subgroup $\varphi(G)$ of $S_G$, and a group of order $n$ embeds in $S_n$.'
        constraints: 'the kernel-triviality argument and the homomorphism property; one proof request of the full theorem'
      - id: kp3
        name: "Computing regular representations"
        key_prerequisites: [group-actions]
        step_check:
          step: 'Close the cycle'
          question: 'Why does the example stop applying the map once it returns to $0$?'
          options:
            - 'Every cycle of a permutation of $\mathbb{Z}_5$ has to contain the point $0$'
            - 'The map has order $2$, so it can be applied only twice in a row'
            - 'The map is a bijection, so after $0$ the points repeat in the same order'
            - 'Once $0$ is reached, the remaining points are fixed by the permutation'
          answer: 'The map is a bijection, so after $0$ the points repeat in the same order'
          why: 'A bijection that returns to its starting point repeats the same points in the same order, so the cycle is complete; here it already contains all five points.'
        exemplars:
          - problem: 'In the left-regular representation of $\mathbb{Z}_3$ the element $1$ acts on the residues $\{0,1,2\}$ by adding $1$ modulo $3$. To which residue does this permutation send $2$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $1$ adds $1$ modulo $3$, so it sends $0\to1$, $1\to2$ and $2\to0$. The residue $2$ goes to $0$.'
          - problem: 'In the left-regular representation of $\mathbb{Z}_4$ the element $2$ acts on the residues $\{0,1,2,3\}$ by adding $2$ modulo $4$. Into how many disjoint cycles does this permutation split the four residues?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $2$ modulo $4$ sends $0\to2\to0$ and $1\to3\to1$. So the permutation $(0\,2)(1\,3)$ splits the residues into $2$ disjoint cycles.'
          - problem: 'In the left-regular representation of $\mathbb{Z}_6$ the element $2$ acts on the residues $\{0,1,2,3,4,5\}$ by adding $2$ modulo $6$. What is the order of the image of $2$ in the symmetric group on these six points?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $2$ modulo $6$ sends $0\to2\to4\to0$ and $1\to3\to5\to1$, so the image of $2$ is a product of two disjoint $3$-cycles. The order of a product of disjoint cycles is the least common multiple of the lengths, which is $3$.'
          - problem: 'Sam asserts that for every $n$ with $2\le n\le 6$ the image of each nonzero element of $\mathbb{Z}_n$ under the left-regular representation has order $n$. What is the smallest $n$ for which Sam is wrong?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $\mathbb{Z}_2$ and $\mathbb{Z}_3$ every nonzero element generates the group, so its image is an $n$-cycle of order $n$. In $\mathbb{Z}_4$ the image of $2$ is $(0\,2)(1\,3)$, which has order $2$, not $4$, so the smallest counterexample is $n=4$.'
          - problem: 'In the left-regular representation of $\mathbb{Z}_5$ the element $3$ acts on the residues $\{0,1,2,3,4\}$ by adding $3$ modulo $5$. What is the order of the image of $3$ in the symmetric group on these five points?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $3$ modulo $5$ sends $0\to3\to1\to4\to2\to0$, which is a single $5$-cycle. A cycle of length $5$ has order $5$, so the image of $3$ has order $5$.'
          - problem: 'Take the Klein four-group $V=\mathbb{Z}_2\times\mathbb{Z}_2$, with addition coordinate by coordinate modulo $2$. In the left-regular representation the element $b=(0,1)$ acts by $x\mapsto b+x$. How many elements of $V$ does the image of $b$ fix?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left translation by $b$ sends $x$ to $b+x$, and $b+x = x$ would force $b = (0,0)$ after cancelling $x$. Since $b\neq(0,0)$, no element is fixed, so the image of $b$ fixes $0$ elements; it is the product of two swaps.'
          - problem: 'Ten guests sit at a round table with $10$ seats numbered $0$ to $9$. At each signal every guest moves $4$ seats to the right, which is the image of $4$ in the left-regular representation of $\mathbb{Z}_{10}$. Into how many separate loops of seats do the guests move?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Shifting by $4$ seats modulo $10$ gives $\gcd(4,10)=2$ cycles, each of length $5$. So the guests move around $2$ separate loops.'
          - problem: 'A conveyor belt has $14$ trays numbered $0$ to $13$, and at each step every tray moves $6$ places forward around the belt, which is the image of $6$ in the left-regular representation of $\mathbb{Z}_{14}$. After how many steps are all trays first back at their starting places?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Shifting by $6$ trays modulo $14$ splits the trays into $\gcd(6,14)=2$ loops of length $7$. All trays are back after $7$ steps, and no smaller number works.'
          - problem: 'Write the full proof that the left-regular representation $g\mapsto\lambda_g$ of a group $G$, where $\lambda_g(x) = gx$, is an injective homomorphism from $G$ into the symmetric group on the set $G$.'
            answer: 'The map g -> lambda_g is an embedding.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Each $\lambda_a$ is a bijection of $G$, because $x\mapsto a^{-1}x$ undoes it on both sides, so $\lambda_a$ lies in the symmetric group on $G$. For $a$, $b$ and any $x$ in $G$, $\lambda_{ab}(x) = (ab)x = a(bx) = \lambda_a(\lambda_b(x))$, so $\lambda_{ab} = \lambda_a\lambda_b$ and the assignment is a homomorphism. If $\lambda_a$ is the identity permutation, then $a = ae = \lambda_a(e) = e$, so the kernel is trivial and the homomorphism is injective. Hence $G$ embeds as a subgroup of the symmetric group on the set $G$, which for a finite group of order $n$ is an embedding into $S_n$.'
        constraints: 'regular representations of Z_n and the Klein group; images of points, cycle counts and orders; one proof request'
