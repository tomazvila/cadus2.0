unit: group-fundamentals
course: abstract-algebra
module: "Group Fundamentals"
topics:
  - id: group-examples-cayley-tables
    name: "Concrete Groups and Cayley Tables"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: groups-intro
        weight: 0.9
        key: true
      - id: modular-arithmetic
        weight: 0.6
        key: true
      - id: binary-operations
        weight: 0.4
        key: false
      - id: gcf-lcm
        weight: 0.3
        key: false
      # Phase C: "abelian" is now taught (proofs/abelian-groups); kp3 asks
      # abelian-or-not verdicts about concrete groups.
      - id: abelian-groups
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The standard zoo: Z_n, U(n), symmetries'
        key_prerequisites: [groups-intro, modular-arithmetic]
        step_check:
          step: 'Take the remainder when divided by $10$'
          question: 'Why do we replace the sum $15$ by $5$ in $\mathbb{Z}_{10}$?'
          options:
            - 'The sum of two elements of $\mathbb{Z}_{10}$ is always the smaller of the two numbers'
            - 'The result must be one of $0, 1, \dots, 9$, and $15 \equiv 5 \pmod{10}$'
            - 'The remainder is the identity element, so it replaces every sum in the group'
            - 'Numbers larger than $10$ are not allowed as inputs to addition in the group'
          answer: 'The result must be one of $0, 1, \dots, 9$, and $15 \equiv 5 \pmod{10}$'
          why: 'The group $\mathbb{Z}_{10}$ has only the elements $0$ to $9$, so the sum $15$ is replaced by the element $5$ that equals it modulo $10$.'
        exemplars:
          - problem: 'List the elements of $U(8)$, the group of units modulo $8$ under multiplication.'
            answer: '1, 3, 5, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: '$U(n)$ consists of the residues from $1$ to $n-1$ that are coprime to $n$. The residues coprime to $8$ are the odd ones, so the elements are $1, 3, 5, 7$.'
          - problem: 'A clock face is marked $0, 1, 2, \dots, 11$. The hour hand points to $9$. Where does it point $7$ hours later?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Moving the hand $7$ hours adds $7$ in $\mathbb{Z}_{12}$. Since $9 + 7 = 16 = 12 + 4$, the hand points to $4$.'
          - problem: 'The rotations of a regular hexagon that map the hexagon onto itself form a group under composition. How many elements does this group have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A rotation that maps the hexagon onto itself turns it by a multiple of $60$ degrees. The turns $0, 60, 120, 180, 240, 300$ give $6$ distinct rotations, so the group has $6$ elements.'
          - problem: 'A clock face is marked $0, 1, 2, \dots, 11$. The hour hand points to $9$. What is the smallest number of hours that must pass before it points to $4$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $9 + x \equiv 4 \pmod{12}$, so $x \equiv 4 - 9 = -5 \equiv 7$. Check: $9 + 7 = 16$, which is $4$ on the clock face.'
          - problem: 'The days of a week are numbered $0, 1, \dots, 6$, and today is day $5$. Which day number is it $100$ days from today?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding days is addition in $\mathbb{Z}_7$. Since $5 + 100 = 105 = 15 \cdot 7$, the sum is $0$ in $\mathbb{Z}_7$.'
          - problem: 'List the elements of $U(14)$, the group of units modulo $14$.'
            answer: '1, 3, 5, 9, 11, 13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The elements of $U(14)$ are the residues from $1$ to $13$ that are coprime to $14$. Remove the even numbers and $7$, which share a factor with $14$, and the elements are $1, 3, 5, 9, 11, 13$.'
          - problem: 'A combination dial has the positions $0, 1, \dots, 39$. The pointer is at $25$ and is turned $30$ steps forward. Which position does it reach?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Turning the dial adds steps in $\mathbb{Z}_{40}$. Since $25 + 30 = 55 = 40 + 15$, the pointer reaches position $15$.'
          - problem: 'Under multiplication modulo $4$, the set $\{1, 2, 3\}$ is not a group. Which of its elements has no inverse?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $1 \cdot 1 = 1$ and $3 \cdot 3 = 9 \equiv 1$, so $1$ and $3$ have inverses. For $2$ the products with $1, 2, 3$ are $2, 0, 2$ modulo $4$, and none equals $1$, so $2$ has no inverse.'
        constraints: 'groups drawn from Z_n (n <= 40), U(n) (n <= 15), and symmetry descriptions; clock, dial and calendar contexts; no abstract axioms yet'
      - id: kp2
        name: 'Reading and completing Cayley tables'
        key_prerequisites: [groups-intro, binary-operations]
        step_check:
          step: 'Reduce modulo $10$'
          question: 'Why must the table entry be $3$ and not $63$?'
          options:
            - 'The table shows only the last digit of each product, whatever the group is'
            - 'Products larger than $10$ are not defined for the elements of a group'
            - 'Each entry is an element of $U(10)$, and $63$ is not one of them'
            - 'The product of two units is always smaller than the modulus $10$'
          answer: 'Each entry is an element of $U(10)$, and $63$ is not one of them'
          why: 'Every entry of the Cayley table of $U(10)$ is an element of $U(10)$, so the product $63$ is replaced by $63 - 60 = 3$.'
        try_first:
          problem: 'In the Cayley table of $\mathbb{Z}_4$ under addition, the row of $2$ reads $2, 3, 0, \ast$. What is the missing entry $\ast$?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'The missing entry is $1$, because the elements $0, 2, 3$ are already used in the row. Each element of a group appears exactly once in every row and every column of its Cayley table.'
        exemplars:
          - problem: 'In the Cayley table of $U(8) = \{1, 3, 5, 7\}$ under multiplication modulo $8$, what entry sits in row $3$, column $5$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry in row $a$, column $b$ is the product $a \cdot b$ reduced modulo $8$. Here $3 \cdot 5 = 15 = 8 + 7$, so the entry is $7$.'
          - problem: 'In the Cayley table of $\mathbb{Z}_5$ under addition, the row of $3$ reads $3, 4, 0, 1, \ast$. What is the missing entry $\ast$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each element of $\mathbb{Z}_5$ appears exactly once in every row. The row already contains $3, 4, 0, 1$, so the missing entry is $2$. Check: $3 + 4 = 7 \equiv 2$.'
          - problem: 'A rotary switch has four positions $0, 1, 2, 3$. Turning it $3$ steps and then $2$ steps has the same effect as a single turn of how many steps, from $0$ to $3$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The turns of the switch form $\mathbb{Z}_4$, and doing one turn after another adds the step counts. The entry in row $3$, column $2$ is $3 + 2 = 5 \equiv 1$, so the effect is a turn of $1$ step.'
          - problem: 'In the Cayley table of $U(8) = \{1, 3, 5, 7\}$ under multiplication modulo $8$, which column of the row $3$ contains the entry $5$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row $3$ lists the products $3 \cdot 1, 3 \cdot 3, 3 \cdot 5, 3 \cdot 7$, which are $3, 1, 7, 5$ modulo $8$. The entry $5$ is the fourth one, so it lies in column $7$.'
          - problem: 'In the Cayley table of $U(7) = \{1, 2, 3, 4, 5, 6\}$ under multiplication modulo $7$, the row of $2$ reads $2, 4, 6, 1, 3, \ast$. What is the missing entry?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each element of $U(7)$ appears exactly once in the row of $2$. The entries $2, 4, 6, 1, 3$ are present, so the missing entry is $5$. Check: $2 \cdot 6 = 12 \equiv 5 \pmod 7$.'
          - problem: 'A group has $6$ elements. How many entries does its Cayley table have?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table has one row and one column for each of the $6$ elements. So it has $6 \cdot 6 = 36$ entries.'
          - problem: 'Sam fills in the row of $3$ in the Cayley table of $U(8) = \{1, 3, 5, 7\}$ as $3, 1, 7, 7$. What should the last entry be?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A row of a Cayley table contains each element once, but Sam wrote $7$ twice. The last entry is $3 \cdot 7 = 21 = 2 \cdot 8 + 5$, so it is $5$.'
          - problem: 'A rotary switch has six positions $0, 1, \dots, 5$. Turning it $4$ steps and then $x$ more steps has the same effect as a turn of $1$ step. What is $x$, where $0 \le x \le 5$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $4 + x \equiv 1 \pmod 6$, which means $x \equiv 1 - 4 = -3 \equiv 3$. Check: $4 + 3 = 7 \equiv 1 \pmod 6$.'
          - problem: 'How many times does the identity element appear in one row of the Cayley table of a group with $6$ elements?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each element of a group appears exactly once in every row. If $ax = ay$, multiplying by $a^{-1}$ gives $x = y$, so the identity cannot appear twice. So it appears $1$ time.'
        constraints: 'tables of order at most 6 drawn in full, larger tables read one row or column at a time; use the once-per-row-and-column property'
      - id: kp3
        name: 'Abelian or not; checking inverses in context'
        key_prerequisites: [groups-intro, modular-arithmetic]
        step_check:
          step: 'We need to find $x$ such that $7 + x \equiv 0 \pmod{15}$'
          question: 'Why must $x$ satisfy $7 + x \equiv 0$ rather than $7 \cdot x \equiv 1$?'
          options:
            - 'Both equations always have the same solution in $\mathbb{Z}_{15}$'
            - 'The product $7 \cdot x$ is not defined for elements of $\mathbb{Z}_{15}$'
            - 'An inverse must be smaller than the element, and $1$ is not smaller than $7$'
            - 'The operation of $\mathbb{Z}_{15}$ is addition, and its identity is $0$'
          answer: 'The operation of $\mathbb{Z}_{15}$ is addition, and its identity is $0$'
          why: 'An inverse of $a$ is an element that gives the identity of the group. In the additive group $\mathbb{Z}_{15}$ the operation is addition and the identity is $0$.'
        exemplars:
          - problem: 'Find the inverse of $5$ in the additive group $\mathbb{Z}_{12}$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $5 + x \equiv 0 \pmod{12}$, so $x = 12 - 5 = 7$. Check: $5 + 7 = 12 \equiv 0$.'
          - problem: 'Find the inverse of $3$ in $U(8)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $3x \equiv 1 \pmod 8$. Since $3 \cdot 3 = 9 \equiv 1 \pmod 8$, the element $3$ is its own inverse.'
          - problem: 'A dial has $18$ positions numbered $0$ to $17$. The pointer has been turned $13$ steps forward from $0$. How many more steps forward bring it back to $0$ for the first time?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $13 + x \equiv 0 \pmod{18}$, which means $x$ is the additive inverse of $13$ in $\mathbb{Z}_{18}$. So $x = 18 - 13 = 5$.'
          - problem: 'A cipher scrambles each number of $U(16)$ by multiplying it by $5$ modulo $16$. By which number must a scrambled value be multiplied, modulo $16$, to recover the original?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undoing the multiplication by $5$ means multiplying by the inverse of $5$ in $U(16)$. Since $5 \cdot 13 = 65 = 4 \cdot 16 + 1$, that inverse is $13$.'
          - problem: 'Find all elements $x$ of $\mathbb{Z}_{16}$ with $x + x = 0$.'
            answer: '0, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $x + x = 0$ means that $2x$ is a multiple of $16$, so $x$ is a multiple of $8$. The multiples of $8$ in $\mathbb{Z}_{16}$ are $0$ and $8$, and indeed $8 + 8 = 16 \equiv 0$.'
          - problem: 'Sam says the inverse of $4$ in $U(9)$ is $5$, because $4 + 5 = 9$. What is the correct inverse?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The operation of $U(9)$ is multiplication, so the inverse of $4$ satisfies $4x \equiv 1 \pmod 9$. Since $4 \cdot 7 = 28 = 3 \cdot 9 + 1$, the inverse is $7$, while $4 \cdot 5 = 20 \equiv 2$.'
          - problem: 'Is the group $U(9)$ abelian?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is abelian","abelian","it is commutative","commutative","it's abelian","the group is abelian","yes it is"],["no","it is not abelian","not abelian","nonabelian","non-abelian","it is not commutative","it's not abelian","not commutative"]]}
            solution_sketch: 'The operation of $U(9)$ is multiplication of integers modulo $9$, and $ab = ba$ for all integers. So the order of the factors never matters, and the group is abelian.'
          - problem: 'In the group of invertible $2 \times 2$ matrices under matrix multiplication, let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$. Compute $BA$.'
            answer: '[[1,1],[1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Multiply row by column: the first row of $B$ is $(1, 0)$, which gives $(1, 1)$, and the second row $(1, 1)$ gives $(1, 2)$. So $BA$ has rows $(1, 1)$ and $(1, 2)$.'
          - problem: 'Is the group of invertible $2 \times 2$ matrices under matrix multiplication abelian?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is abelian","abelian","it is commutative","commutative","it's abelian","the group is abelian","yes it is"],["no","it is not abelian","not abelian","nonabelian","non-abelian","it is not commutative","it's not abelian","not commutative"]]}
            solution_sketch: 'Take $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$, which are invertible. Then $AB$ has rows $(2, 1)$ and $(1, 1)$, while $BA$ has rows $(1, 1)$ and $(1, 2)$. Since $AB \neq BA$, the group is not abelian.'
        constraints: 'inverses in Z_n (additive, n <= 40) and U(n) (multiplicative, n <= 20); abelian verdicts for Z_n, U(n) and 2x2 invertible matrices'
    diagnostic_exemplar:
      problem: 'Give the inverse of $7$ in $U(10)$, the group of units modulo $10$.'
      answer: "3"
      solution_sketch: 'Residues coprime to $10$ are $1,3,7,9$. Since $7 \cdot 3 = 21 \equiv 1 \pmod{10}$, $7^{-1} = 3$.'
    anki_seeds:
      - front: "What are the elements of $U(n)$?"
        back: "The residues in $\\{1, \\dots, n-1\\}$ that are coprime to $n$, under multiplication mod $n$."
        type: basic
      - front: "In a Cayley table of a group, how often does each element appear in a given row?"
        back: "Exactly once (rows and columns are permutations of the group)."
        type: basic

  - id: elementary-group-properties
    name: "Elementary Group Properties"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: groups-intro
        weight: 0.9
        key: true
      - id: direct-proof
        weight: 0.5
        key: true
      - id: group-examples-cayley-tables
        weight: 0.4
        key: false
      # Phase C: kp3 proves groups abelian (g^2 = e => abelian); the definition and
      # first abelian arguments live in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Uniqueness of identity and inverses'
        key_prerequisites: [groups-intro, direct-proof]
        step_check:
          step: 'Regroup by associativity'
          question: 'Why may the parentheses move from $u(xv)$ to $(ux)v$?'
          options:
            - 'Every group operation is commutative, so the factors can be written in any order'
            - 'Associativity says the grouping of three factors does not change the product'
            - 'The element $x$ has an inverse, so it cancels out of the product'
            - 'Both $u$ and $v$ equal the identity element at this point of the proof'
          answer: 'Associativity says the grouping of three factors does not change the product'
          why: 'The group operation is associative, so $u(xv) = (ux)v$. The proof needs this step because the inverse property of $u$ applies to $ux$, not to $xv$.'
        exemplars:
          - problem: 'Find the identity element of the group $\mathbb{Z}_2 \times \mathbb{Z}_3$ under componentwise addition.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The identity $e = (a, b)$ must satisfy $e + (x, y) = (x, y)$ for every element. So $a + x = x$ in $\mathbb{Z}_2$ and $b + y = y$ in $\mathbb{Z}_3$, which forces $a = 0$ and $b = 0$. Hence $e = (0, 0)$.'
          - problem: 'Find the inverse of $4$ in the group of units modulo $11$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $u$ with $4u \equiv 1 \pmod{11}$. Since $4 \cdot 3 = 12 \equiv 1$, the inverse is $3$, and no other unit works because an inverse is unique.'
          - problem: 'Find the inverse of $5/7$ in the additive group of the rational numbers.'
            answer: '-5/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inverse $x$ must satisfy $5/7 + x = 0$, so $x = -5/7$. It is the only such number, because an inverse in a group is unique.'
          - problem: 'Alex finds that $3 \cdot 7 = 21$ leaves remainder $1$ when divided by $20$. Using only this fact, what is the inverse of $7$ in $U(20)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $3 \cdot 7 \equiv 1 \pmod{20}$ says that $3$ is an inverse of $7$. An element has only one inverse, so the inverse of $7$ is $3$ and no further calculation is needed.'
          - problem: 'Sam claims that every element of $U(15)$ is its own inverse. What is the smallest element $a > 1$ of $U(15)$ that is not its own inverse?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The units of $15$ are $1, 2, 4, 7, 8, 11, 13, 14$. We have $2 \cdot 2 = 4$, which is not $1$ modulo $15$, so $2$ is not its own inverse and Sam is wrong.'
          - problem: 'A rotating platform has $9$ stops numbered $0$ to $8$. A move of $4$ stops forward can be undone by exactly one move forward. How many stops forward is that move?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Moves add in $\mathbb{Z}_9$, and the undoing move is the inverse of $4$. It is the element $x$ with $4 + x \equiv 0 \pmod 9$, so $x = 9 - 4 = 5$, and no other element works.'
          - problem: 'Find the inverse of $(1, 3)$ in the group $\mathbb{Z}_4 \times \mathbb{Z}_6$ under componentwise addition.'
            answer: '(3, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The inverse of $(1, 3)$ is found in each component. In $\mathbb{Z}_4$ we need $1 + x \equiv 0$, so $x = 3$, and in $\mathbb{Z}_6$ we need $3 + y \equiv 0$, so $y = 3$. The inverse is $(3, 3)$.'
          - problem: 'A shift cipher numbers the letters $0$ to $25$ and adds $11$ to each letter number, modulo $26$. By how many places must a letter be shifted to undo this cipher?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shifts form the group $\mathbb{Z}_{26}$ under addition, and undoing a shift means adding its inverse. We need $11 + x \equiv 0 \pmod{26}$, so $x = 26 - 11 = 15$, and no other shift works.'
          - problem: 'Write the full proof: in a group $G$ the identity element is unique, and every element of $G$ has exactly one inverse. Then compare with the solution.'
            answer: 'Identity and inverses are unique.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Suppose $e$ and $e''$ are both identities. Then $e = ee'' = e''$, so the identity is unique. Suppose $b$ and $c$ both invert $a$. Then $b = be = b(ac) = (ba)c = ec = c$, where the third step uses associativity, so the inverse is unique.'
        constraints: 'uniqueness arguments with associativity cited; concrete groups Z_n, U(n), direct products and Q'
      - id: kp2
        name: 'Cancellation and solving equations in groups'
        key_prerequisites: [groups-intro]
        step_check:
          step: 'Left-multiply both sides by $g^{-1}$'
          question: 'Why must $g^{-1}$ multiply on the left of both sides, and not on the right?'
          options:
            - 'Multiplying on the left changes the equation, but multiplying on the right does not'
            - '$g^{-1}$ on the right would also cancel $g$, because the order of factors never matters'
            - 'The element $g$ stands to the left of $x$, so only a left factor $g^{-1}$ can meet it'
            - 'The right factor $h$ must be removed first, so the left side is used for $g$ only by habit'
          answer: 'The element $g$ stands to the left of $x$, so only a left factor $g^{-1}$ can meet it'
          why: 'Only the product $g^{-1}g$ equals $e$. In a group that need not be abelian, $g^{-1}$ must stand next to $g$, which is on the left of $x$.'
        try_first:
          problem: 'In $\mathbb{Z}_{12}$, solve $5 + x = 2$ for $x$, where $0 \le x \le 11$.'
          answer_contract: {"kind":"exact"}
          answer: '9'
          reveal: 'Add the inverse of $5$, which is $7$, to both sides: $x = 7 + 2 = 9$. Solving an equation in a group means combining both sides with an inverse, on the correct side.'
        exemplars:
          - problem: 'In the group $U(11)$, solve $3x = 5$ for $x$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by the inverse of $3$. In $U(11)$ we have $3 \cdot 4 = 12 \equiv 1$, so $3^{-1} = 4$ and $x = 4 \cdot 5 = 20 \equiv 9$. Check: $3 \cdot 9 = 27 \equiv 5$.'
          - problem: 'A dial has $40$ positions numbered $0$ to $39$. After the pointer is turned $17$ steps forward it points to $9$. At which position did it start?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'If the start is $s$, then $s + 17 \equiv 9 \pmod{40}$, so $s \equiv 9 - 17 = -8 \equiv 32$. Check: $32 + 17 = 49 = 40 + 9$.'
          - problem: 'In a group $G$, solve $axb = c$ for $x$. Which one is correct: (A) $x = a^{-1}cb^{-1}$, (B) $x = ca^{-1}b^{-1}$, (C) $x = a^{-1}b^{-1}c$, or (D) $x = b^{-1}ca^{-1}$?'
            answer: 'a^(-1) c b^(-1)'
            answer_contract: {"kind":"label","options":[["a^(-1) c b^(-1)","a^-1 c b^-1","a^-1cb^-1","a^(-1)cb^(-1)","a^{-1}cb^{-1}","x = a^(-1) c b^(-1)","x = a^{-1}cb^{-1}","A"],["c a^(-1) b^(-1)","c a^-1 b^-1","ca^-1b^-1","ca^(-1)b^(-1)","ca^{-1}b^{-1}","x = c a^(-1) b^(-1)","x = ca^{-1}b^{-1}","B"],["a^(-1) b^(-1) c","a^-1 b^-1 c","a^-1b^-1c","a^(-1)b^(-1)c","a^{-1}b^{-1}c","x = a^(-1) b^(-1) c","x = a^{-1}b^{-1}c","C"],["b^(-1) c a^(-1)","b^-1 c a^-1","b^-1ca^-1","b^(-1)ca^(-1)","b^{-1}ca^{-1}","x = b^(-1) c a^(-1)","x = b^{-1}ca^{-1}","D"]]}
            solution_sketch: 'Multiply on the left by $a^{-1}$ and on the right by $b^{-1}$, which gives $a^{-1}(axb)b^{-1} = x$. So $x = a^{-1}cb^{-1}$, which is option A. The other options move $a^{-1}$ or $b^{-1}$ to the wrong side of $c$, and a group need not be abelian.'
          - problem: 'In the group of invertible $2 \times 2$ matrices, let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}2&3\\1&2\end{pmatrix}$. Solve $AX = B$ for the matrix $X$.'
            answer: '[[1,1],[1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Multiply on the left by $A^{-1}$, which gives $X = A^{-1}B$. Here $A^{-1}$ has rows $(1, -1)$ and $(0, 1)$, so $X$ has rows $(2 - 1, 3 - 2) = (1, 1)$ and $(1, 2)$.'
          - problem: 'A cipher scrambles each number of $U(16)$ by multiplying it by $5$ modulo $16$. A scrambled value is $3$. What was the original number?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The original number $x$ satisfies $5x \equiv 3 \pmod{16}$. The inverse of $5$ is $13$, so $x \equiv 13 \cdot 3 = 39 \equiv 7$. Check: $5 \cdot 7 = 35 = 2 \cdot 16 + 3$.'
          - problem: 'Sam solves $7 + x = 3$ in $\mathbb{Z}_{12}$ by writing $x = 7 - 3 = 4$. What is the correct solution?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the inverse of $7$ to both sides, which gives $x = 3 - 7 = -4 \equiv 8$. Check: $7 + 8 = 15 \equiv 3 \pmod{12}$, while $7 + 4 = 11$ is not $3$.'
          - problem: 'In the integers modulo $12$ under multiplication, $3 \cdot 4 \equiv 3 \cdot 8$. Can we cancel the factor $3$ and conclude that $4 \equiv 8$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, we can cancel","we can cancel","we can","cancellation works"],["no","no, we cannot cancel","we cannot cancel","we cannot","cancellation fails","cannot","no, we can't","we can't"]]}
            solution_sketch: 'Both products equal $12 \equiv 0$, but $4 \not\equiv 8 \pmod{12}$, so the cancellation is false. Cancelling $3$ needs an inverse of $3$, and $3$ has no inverse modulo $12$ because $\gcd(3, 12) = 3$.'
          - problem: 'A group has $12$ elements, and $a$ and $b$ are two of them. How many elements $x$ satisfy $ax = b$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying both sides by $a^{-1}$ gives $x = a^{-1}b$, so there is exactly one solution. In the Cayley table it is the one place where $b$ appears in the row of $a$, and that is $1$ place.'
          - problem: 'Write the full proof of the left cancellation law: in a group $G$, if $ax = ay$, then $x = y$. Then compare with the solution.'
            answer: 'Left-multiply both sides by a^(-1).'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Multiply both sides of $ax = ay$ on the left by $a^{-1}$. By associativity $a^{-1}(ax) = (a^{-1}a)x = x$ and likewise $a^{-1}(ay) = y$, so $x = y$.'
        constraints: 'abstract elements and concrete groups; answers must respect non-commutativity (no reordering); solving linear equations in Z_n, U(n) and 2x2 matrices'
      - id: kp3
        name: 'Socks-shoes and power rules'
        key_prerequisites: [groups-intro, direct-proof]
        step_check:
          step: 'Since $(xy)(y^{-1}x^{-1}) = e$, by uniqueness of inverses'
          question: 'Why does $(xy)(y^{-1}x^{-1}) = e$ show that $(xy)^{-1} = y^{-1}x^{-1}$?'
          options:
            - 'Every product of two elements and their inverses equals $e$ in a group'
            - 'The product is $e$ only when $x$ and $y$ commute, so the order does not matter'
            - 'Reversing the order of the factors always produces the identity element'
            - 'A product with $xy$ equal to $e$ gives the inverse of $xy$, which is unique'
          answer: 'A product with $xy$ equal to $e$ gives the inverse of $xy$, which is unique'
          why: 'If a product with $xy$ equals $e$, the second factor is an inverse of $xy$. An inverse is unique, so $y^{-1}x^{-1}$ is the inverse of $xy$.'
        exemplars:
          - problem: 'In any group, which of these equals $(ab)^{-1}$: (A) $a^{-1}b^{-1}$, (B) $b^{-1}a^{-1}$, (C) $ba^{-1}$, or (D) $b^{-1}a$?'
            answer: 'b^(-1)a^(-1)'
            answer_contract: {"kind":"label","options":[["a^(-1)b^(-1)","a^-1b^-1","a^-1 b^-1","a^{-1}b^{-1}","A"],["b^(-1)a^(-1)","b^-1a^-1","b^-1 a^-1","b^{-1}a^{-1}","B"],["b a^(-1)","b a^-1","ba^{-1}","ba^(-1)","C"],["b^(-1)a","b^-1a","b^-1 a","b^{-1}a","D"]]}
            solution_sketch: 'The inverse of a product reverses the order and inverts each factor, so $(ab)^{-1} = b^{-1}a^{-1}$. Check: $(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aa^{-1} = e$. This is option B.'
          - problem: 'In $U(15)$, find the inverse of the product $2 \cdot 4$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product is $2 \cdot 4 = 8$, and $8 \cdot 2 = 16 \equiv 1$, so the inverse is $2$. The socks-shoes rule agrees: $4^{-1} \cdot 2^{-1} = 4 \cdot 8 = 32 \equiv 2$.'
          - problem: 'Let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$ be invertible matrices. Find $(AB)^{-1}$.'
            answer: '[[1,-1],[-1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The product $AB$ has rows $(2, 1)$ and $(1, 1)$ and determinant $1$. So its inverse has rows $(1, -1)$ and $(-1, 2)$, and it equals $B^{-1}A^{-1}$, not $A^{-1}B^{-1}$.'
          - problem: 'An element $a$ of a group has order $6$. What is the order of $a^4$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $a^k$ is $|a|/\gcd(|a|, k)$. Here $\gcd(6, 4) = 2$, so the order of $a^4$ is $6/2 = 3$. Check: $(a^4)^3 = a^{12} = e$.'
          - problem: 'A robot arm performs move $a$ and then move $b$. To undo both moves, which sequence should it perform: (A) undo $b$, then undo $a$, or (B) undo $a$, then undo $b$?'
            answer: 'undo b, then undo a'
            answer_contract: {"kind":"label","options":[["undo b, then undo a","undo b then undo a","undo b first","A","undo b then a","undo b, then a","b then a"],["undo a, then undo b","undo a then undo b","undo a first","B","undo a then b","undo a, then b","a then b"]]}
            solution_sketch: 'The inverse of the combined move $ab$ is $b^{-1}a^{-1}$, so the last move must be undone first. The arm performs the inverse of $b$ and then the inverse of $a$, like taking off shoes before socks.'
          - problem: 'A text is shifted $5$ places and then shifted $12$ places, with the letters numbered $0$ to $25$. By how many places must the result be shifted to undo both shifts together?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two shifts together add $5 + 12 = 17$ in $\mathbb{Z}_{26}$. The inverse of this combined shift is $26 - 17 = 9$, which equals the inverses $-12$ and $-5$ added in either order, since $\mathbb{Z}_{26}$ is abelian.'
          - problem: 'In $U(17)$, find the inverse of the product $3 \cdot 5$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product is $3 \cdot 5 = 15$. By the socks-shoes rule its inverse is $5^{-1} \cdot 3^{-1} = 7 \cdot 6 = 42 \equiv 8$. Check: $15 \cdot 8 = 120 = 7 \cdot 17 + 1$.'
          - problem: 'Let $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\3&1\end{pmatrix}$ be invertible matrices. Find $(AB)^{-1}$.'
            answer: '[[1,-2],[-3,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The product $AB$ has rows $(7, 2)$ and $(3, 1)$ and determinant $1$, so its inverse has rows $(1, -2)$ and $(-3, 7)$. This equals $B^{-1}A^{-1}$ with rows $(1, -2)$ and $(-3, 7)$, not $A^{-1}B^{-1}$.'
          - problem: 'An element $a$ of a group has order $10$. What is the order of $a^5$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $a^k$ is $|a|/\gcd(|a|, k)$. Here $\gcd(10, 5) = 5$, so the order of $a^5$ is $10/5 = 2$. Check: $(a^5)^2 = a^{10} = e$.'
          - problem: 'In any group, simplify $(a^{-1})^{-1}$.'
            answer: 'a'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $a^{-1}a = e$ and $aa^{-1} = e$, the element $a$ is an inverse of $a^{-1}$. An inverse is unique, so $(a^{-1})^{-1} = a$.'
          - problem: 'Write the full proof: in every group $(ab)^{-1} = b^{-1}a^{-1}$ and $(a^{-1})^{-1} = a$. Then compare with the solution.'
            answer: 'Both identities hold in every group.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Compute $(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aa^{-1} = e$ and $(b^{-1}a^{-1})(ab) = e$ in the same way, so $b^{-1}a^{-1}$ inverts $ab$. Also $a^{-1}a = e = aa^{-1}$ shows that $a$ inverts $a^{-1}$, and inverses are unique.'
        constraints: 'socks-shoes in abstract groups, Z_n, U(n) and 2x2 matrices; power rule |g^k| = |g|/gcd(k,|g|); orders <= 30'
    diagnostic_exemplar:
      problem: 'Let $G$ be a group in which $(ab)^2 = a^2 b^2$ for all $a, b \in G$. Prove that $G$ is abelian.'
      answer: 'Expanding, $(ab)^2 = abab$ and $a^2b^2 = aabb$, so $abab = aabb$. Multiply on the left by $a^{-1}$ and on the right by $b^{-1}$ (equivalently, cancel $a$ on the left and $b$ on the right): $ba = ab$. Since $a, b$ were arbitrary, $G$ is abelian.'
      solution_sketch: 'Write out both squares, then use the left and right cancellation laws, which follow from the existence of inverses.'
    anki_seeds:
      - front: "Socks-shoes property: $(ab)^{-1} = $ ?"
        back: "$b^{-1}a^{-1}$ (inverses reverse the order)."
        type: basic
      - front: "If $g^2 = e$ for all $g$ in a group $G$, what can you conclude?"
        back: "$G$ is abelian."
        type: basic

  - id: order-of-an-element
    name: "Order of an Element"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: group-examples-cayley-tables
        weight: 0.8
        key: true
      - id: modular-arithmetic
        weight: 0.5
        key: false
      - id: gcf-lcm
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Computing orders by direct powering'
        key_prerequisites: [group-examples-cayley-tables]
        step_check:
          step: 'Since $5^2 \equiv 1 \pmod{12}$ and $5^1 \not\equiv 1 \pmod{12}$'
          question: 'Why do we also need $5^1 \not\equiv 1$ before we say that the order of $5$ is $2$?'
          options:
            - 'The order is the largest $k$ with $5^k \equiv 1$, so $k = 1$ is checked last'
            - 'The condition $5^1 \not\equiv 1$ only shows that $5$ is not the identity of $U(12)$'
            - 'The order is the smallest positive $k$ with $5^k \equiv 1$, so $k = 1$ must fail'
            - 'If $5^1$ were $1$, the element $5$ would have no order in the group'
          answer: 'The order is the smallest positive $k$ with $5^k \equiv 1$, so $k = 1$ must fail'
          why: 'The order is the smallest positive exponent $k$ with $5^k \equiv 1$. Since $k = 1$ fails and $k = 2$ works, the order is $2$.'
        exemplars:
          - problem: 'Find the order of $3$ in $U(7)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $3$ modulo $7$ are $3, 2, 6, 4, 5, 1$. The first power equal to $1$ is $3^6$, so the order of $3$ is $6$.'
          - problem: 'Find the order of $9$ in $U(10)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $9 \not\equiv 1$ and $9^2 = 81 \equiv 1 \pmod{10}$. So the smallest positive exponent that gives $1$ is $2$, and the order is $2$.'
          - problem: 'Find the order of $3$ in the group $U(11)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $3$ modulo $11$ are $3, 9, 5, 4, 1$. None of the first four equals $1$, and $3^5 \equiv 1$, so the order is $5$.'
          - problem: 'A machine shows the number $1$. Each time its button is pressed, the shown number is multiplied by $8$ and replaced by its remainder on division by $13$. How many presses return the display to $1$ for the first time?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The display shows the powers of $8$ modulo $13$, which are $8, 12, 5, 1$. The first press count that gives $1$ is $4$, which is the order of $8$ in $U(13)$.'
          - problem: 'What is the smallest positive integer $k$ for which $2^k$ leaves remainder $1$ when divided by $9$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $2$ modulo $9$ are $2, 4, 8, 7, 5, 1$. None of the first five equals $1$, and $2^6 = 64 = 7 \cdot 9 + 1$, so $k = 6$.'
          - problem: 'A counter starts at $1$. At each step the counter is doubled and then replaced by its remainder on division by $7$. After how many steps is the counter first back at $1$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The counter shows $2, 4, 1$ after the first three steps, which are the powers of $2$ modulo $7$. It is first back at $1$ after $3$ steps.'
          - problem: 'Sam says the order of $2$ in $U(15)$ is $8$, because $U(15)$ has $8$ elements. What is the order of $2$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of an element is the smallest positive exponent $k$ with $2^k \equiv 1$, not the size of the group. The powers of $2$ modulo $15$ are $2, 4, 8, 1$, so the order is $4$.'
          - problem: 'What is the largest order of an element of $U(8)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The elements of $U(8)$ are $1, 3, 5, 7$. The element $1$ has order $1$, and $3^2 = 9$, $5^2 = 25$, $7^2 = 49$ are all $\equiv 1 \pmod 8$, so the other three have order $2$. The largest order is $2$.'
          - problem: 'What is the order of $9$ in $U(13)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $9$ modulo $13$ are $9, 3, 1$. The first power equal to $1$ is $9^3 = 729 = 56 \cdot 13 + 1$, so the order is $3$.'
        constraints: 'multiplicative orders in U(n), n <= 15; answer is the smallest positive exponent giving 1'
      - id: kp2
        name: 'Additive orders via n/gcd(a, n)'
        key_prerequisites: [group-examples-cayley-tables, modular-arithmetic, gcf-lcm]
        step_check:
          step: 'Apply the shortcut'
          question: 'Why does dividing $24$ by $\gcd(9, 24)$ give the smallest $k$ with $9k \equiv 0 \pmod{24}$?'
          options:
            - 'The gcd counts how many times $9$ must be added, and $24$ is only an upper bound'
            - 'The multiples $9k$ are multiples of $24$ exactly when $k$ is a multiple of $24/\gcd(9, 24)$'
            - 'The gcd is the order of $9$ in the group, and dividing $24$ by it corrects for size'
            - 'Every element of $\mathbb{Z}_{24}$ has an order that divides $24$, so the gcd is the divisor'
          answer: 'The multiples $9k$ are multiples of $24$ exactly when $k$ is a multiple of $24/\gcd(9, 24)$'
          why: 'A multiple $9k$ is divisible by $24$ exactly when $k$ is divisible by $24/\gcd(9, 24) = 8$. The smallest such positive $k$ is $8$.'
        exemplars:
          - problem: 'Find the order of $8$ in the additive group $\mathbb{Z}_{12}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $a$ in $\mathbb{Z}_n$ is $n/\gcd(a, n)$. Here $12/\gcd(8, 12) = 12/4 = 3$. Check: $8 + 8 + 8 = 24 \equiv 0$.'
          - problem: 'Find the order of $10$ in $\mathbb{Z}_{25}$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order is $25/\gcd(10, 25) = 25/5 = 5$. Check: $5 \cdot 10 = 50 \equiv 0 \pmod{25}$.'
          - problem: 'A dial has $30$ positions numbered $0$ to $29$. Each turn advances the pointer $9$ positions. After how many turns does the pointer first return to the position where it started?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of turns is the order of $9$ in $\mathbb{Z}_{30}$, which is $30/\gcd(9, 30) = 30/3 = 10$. Check: $10 \cdot 9 = 90 = 3 \cdot 30$.'
          - problem: 'A wheel has $60$ marks numbered $0$ to $59$. A bead is moved $21$ marks forward at each step. After how many steps is the bead first back at its starting mark?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of steps is the order of $21$ in $\mathbb{Z}_{60}$. It is $60/\gcd(21, 60) = 60/3 = 20$, and $20 \cdot 21 = 420 = 7 \cdot 60$.'
          - problem: 'What is the order of the element $40$ in the additive group $\mathbb{Z}_{56}$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\gcd(40, 56) = 8$, so the order is $56/8 = 7$. Check: $7 \cdot 40 = 280 = 5 \cdot 56$.'
          - problem: 'What is the order of $25$ in $\mathbb{Z}_{45}$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\gcd(25, 45) = 5$, so the order is $45/5 = 9$. Check: $9 \cdot 25 = 225 = 5 \cdot 45$.'
          - problem: 'Sam says the order of $6$ in $\mathbb{Z}_{15}$ is $3$, because $15/6 = 2.5$ rounds to $3$. What is the correct order?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $6$ is $15/\gcd(6, 15) = 15/3 = 5$, not a rounded quotient. Check: $5 \cdot 6 = 30 = 2 \cdot 15$, while $3 \cdot 6 = 18 \equiv 3$ is not $0$.'
          - problem: 'Which elements of $\mathbb{Z}_{12}$ have order $4$?'
            answer: '3, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An element $a$ has order $4$ when $12/\gcd(a, 12) = 4$, which means $\gcd(a, 12) = 3$. The elements $3$ and $9$ have this property, and no other element of $\mathbb{Z}_{12}$ does.'
          - problem: 'How many elements of $\mathbb{Z}_{12}$ have order $12$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An element $a$ has order $12$ exactly when $\gcd(a, 12) = 1$. The elements $1, 5, 7, 11$ have this property, so there are $4$ of them.'
        constraints: 'additive groups Z_n, n <= 60; expect the n/gcd(a,n) shortcut; contexts of dials and wheels that ask for a number of steps'
      - id: kp3
        name: 'Order facts: powers, inverses, finiteness'
        key_prerequisites: [group-examples-cayley-tables, gcf-lcm]
        step_check:
          step: 'Compute the greatest common divisor of $k$ and $|g|$'
          question: 'Why does the order of $g^6$ involve $\gcd(6, 15)$ instead of just $6$?'
          options:
            - 'The order of $g^6$ must divide $6$, and the gcd picks out a divisor of $6$'
            - 'The order of $g^6$ is the order of $g$ minus $6$, and the gcd corrects it'
            - 'The gcd removes the part of $g$ that does not lie in $g^6$ from the order'
            - '$(g^6)^j = e$ exactly when $15$ divides $6j$; the gcd gives the least $j$'
          answer: '$(g^6)^j = e$ exactly when $15$ divides $6j$; the gcd gives the least $j$'
          why: 'The power $(g^6)^j = g^{6j}$ equals $e$ exactly when $15$ divides $6j$. The smallest such $j$ is $15/\gcd(6, 15)$.'
        exemplars:
          - problem: 'An element $g$ of a group has order $12$. What is the order of $g^8$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $g^k$ is $|g|/\gcd(|g|, k)$. Here $\gcd(12, 8) = 4$, so the order of $g^8$ is $12/4 = 3$.'
          - problem: 'An element $g$ of a group has order $n$. What is the order of $g^{-1}$?'
            answer: 'n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $(g^{-1})^k = (g^k)^{-1}$, which equals $e$ exactly when $g^k = e$. So $g$ and $g^{-1}$ have the same order, which is $n$.'
          - problem: 'An element $g$ of a group has order $18$. What is the order of $g^{15}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\gcd(18, 15) = 3$, so the order of $g^{15}$ is $18/3 = 6$. Check: $(g^{15})^6 = g^{90} = (g^{18})^5 = e$.'
          - problem: 'A rotation $r$ of a regular polygon with $20$ sides turns it by $18$ degrees, so $r$ has order $20$. What is the order of $r^6$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $r^6$ is $20/\gcd(20, 6) = 20/2 = 10$. Check: $r^6$ turns the polygon by $108$ degrees, and $10 \cdot 108 = 1080 = 3 \cdot 360$ is the first multiple of $108$ that is a multiple of $360$.'
          - problem: 'A gear advances by an element $g$ of order $30$ at each step. A move consists of $4$ steps at once, which is the element $g^4$. How many such moves return the gear to the start for the first time?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of moves is the order of $g^4$, which is $30/\gcd(30, 4) = 30/2 = 15$. Check: $15$ moves make $60$ steps, which is $2$ full turns of order $30$.'
          - problem: 'In $U(13)$ the element $2$ has order $12$. What is the order of $2^9$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $2^9$ is $12/\gcd(12, 9) = 12/3 = 4$. Check: $2^9 = 512 = 39 \cdot 13 + 5$, and the powers $5, 12, 8, 1$ show that $5$ has order $4$.'
          - problem: 'An element $g$ of a group has order $12$. What is the smallest positive integer $k$ for which $g^k$ has order $4$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $12/\gcd(12, k) = 4$, so $\gcd(12, k) = 3$. The smallest positive $k$ with this property is $3$, because $k = 1$ and $k = 2$ give gcd $1$ and $2$.'
          - problem: 'Sam says that if $g$ has order $10$ then $g^4$ has order $10 - 4 = 6$. What is the correct order of $g^4$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order of $g^4$ is $10/\gcd(10, 4) = 10/2 = 5$. Check: $(g^4)^5 = g^{20} = e$, but $(g^4)^2 = g^8 \neq e$.'
          - problem: 'An element $g$ of a group has order $12$. How many of the elements $g, g^2, \dots, g^{12}$ have order $12$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The element $g^k$ has order $12$ exactly when $\gcd(12, k) = 1$. The numbers $1, 5, 7, 11$ from $1$ to $12$ have this property, so $4$ of the elements have order $12$.'
        constraints: 'use |g^k| = |g|/gcd(k,|g|); orders <= 30; direct questions, contexts of rotations and gears, and error analysis'
    diagnostic_exemplar:
      problem: 'In $U(13)$ the element $2$ has order $12$. Find the order of $2^{8}$ in $U(13)$.'
      answer: '3'
      solution_sketch: 'If $|g| = n$ then $|g^{k}| = n/\gcd(n,k)$, so the order is $12/\gcd(12,8) = 12/4 = 3$. Check directly: $2^{8} = 256 \equiv 9 \pmod{13}$ and $9^{3} = 729 = 56 \cdot 13 + 1 \equiv 1$.'
    anki_seeds:
      - front: "Order of $a$ in the additive group $\\mathbb{Z}_n$?"
        back: "$n/\\gcd(a, n)$."
        type: basic
      - front: "If $|g| = n$, then $|g^k| = $ ?"
        back: "$n/\\gcd(k, n)$."
        type: basic
      - front: "The order of an element $g$ is defined as..."
        back: "The smallest positive integer $n$ with $g^n = e$ (infinite if no such $n$ exists)."
        type: basic

  - id: subgroups-subgroup-tests
    name: "Subgroups and Subgroup Tests"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: elementary-group-properties
        weight: 0.8
        key: true
      - id: set-operations
        weight: 0.3
        key: false
