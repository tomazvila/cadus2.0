        key_prerequisites: [cyclic-groups-generators, kernels-images]
        exemplars:
          - problem: 'A homomorphism $\varphi : \mathbb{Z}_{10} \to \mathbb{Z}_4$ is determined by $\varphi(1)$, which must satisfy $10\,\varphi(1) = 0$. How many elements of $\mathbb{Z}_4$ satisfy that condition?'
            answer: "2"
            solution_sketch: 'Every element of $\mathbb{Z}_m$ is a multiple of $1$, so $\varphi(k) = k\,\varphi(1)$; well-definedness needs the relation $m \cdot 1 = 0$ to map to the identity, i.e. $|\varphi(1)|$ divides $m$. Here $10h \equiv 2h \equiv 0 \pmod 4$ holds for $h = 0, 2$.'
          - problem: 'How many homomorphisms $\mathbb{Z} \to \mathbb{Z}_5$ are there?'
            answer: "5"
            solution_sketch: '$\mathbb{Z}$ is free on one generator: any choice of $\varphi(1) \in \mathbb{Z}_5$ works.'
          - problem: "A homomorphism $\\varphi : \\mathbb{Z}_{12} \\to \\mathbb{Z}_8$ is determined by the single value $\\varphi(1)$, and it is well defined exactly when $12\\,\\varphi(1) = 0$ in $\\mathbb{Z}_8$. How many choices of $\\varphi(1)$ give a valid homomorphism?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (determination by the generator): every element of $\\mathbb{Z}_{12}$ is a multiple of $1$, so $\\varphi(k) = k\\,\\varphi(1)$ and only $h = \\varphi(1)$ must be chosen. Step 2 (well-definedness relation): the relation $12 \\cdot 1 = 0$ must map to $0$, so we need $12h \\equiv 0 \\pmod 8$. Step 3 (solve the congruence): $12h \\equiv 4h \\pmod 8$, so we need $8 \\mid 4h$, i.e. $h$ even: $h = 0, 2, 4, 6$ work. The number of valid choices of $\\varphi(1)$ is 4."
          - problem: "A homomorphism $\\varphi : \\mathbb{Z}_{9} \\to \\mathbb{Z}_6$ is determined by $\\varphi(1)$, which must satisfy $9\\,\\varphi(1) = 0$ in $\\mathbb{Z}_6$. How many homomorphisms $\\mathbb{Z}_9 \\to \\mathbb{Z}_6$ are there?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (determination): since $1$ generates $\\mathbb{Z}_9$, any homomorphism sends $k$ to $k\\,\\varphi(1)$, so the count equals the number of valid $h = \\varphi(1)$. Step 2 (well-definedness relation): we need $9h \\equiv 0 \\pmod 6$, that is $6 \\mid 9h$. Step 3 (solve): $6 \\mid 9h$ reduces to $2 \\mid 3h$, i.e. $h$ even, giving $h = 0, 2, 4$ in $\\mathbb{Z}_6$. There are 3 homomorphisms $\\mathbb{Z}_9 \\to \\mathbb{Z}_6$."
          - problem: "Consider homomorphisms $\\varphi : \\mathbb{Z}_{8} \\to \\mathbb{Z}_{12}$. A value $h = \\varphi(1)$ is admissible exactly when $8h \\equiv 0 \\pmod{12}$. Determine the set of all admissible values of $\\varphi(1)$ in $\\mathbb{Z}_{12}$; give the answer as a set."
            answer: "{0, 3, 6, 9}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (well-definedness relation): admissible $h$ satisfy $8h \\equiv 0 \\pmod{12}$, i.e. $12 \\mid 8h$. Step 2 (reduce): dividing by the gcd $4$, this becomes $3 \\mid 2h$, hence $3 \\mid h$ since $\\gcd(2,3)=1$. Step 3 (enumerate): the multiples of $3$ in $\\mathbb{Z}_{12}$ are $0, 3, 6, 9$, and each satisfies $8h \\equiv 0$. The set of admissible values is {0, 3, 6, 9}."
          - problem: "Now take the target to be the infinite cyclic group $\\mathbb{Z}$ under addition, and let $\\varphi : \\mathbb{Z}_{7} \\to \\mathbb{Z}$ be a homomorphism. The element $\\varphi(1)$ must satisfy $7\\,\\varphi(1) = 0$ in $\\mathbb{Z}$. How many homomorphisms $\\mathbb{Z}_{7} \\to \\mathbb{Z}$ exist?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (well-definedness relation): since $7 \\cdot 1 = 0$ in $\\mathbb{Z}_7$, the image $\\varphi(1)$ must satisfy $7\\,\\varphi(1) = 0$ in $\\mathbb{Z}$. Step 2 (solve in the integers): the only integer $a$ with $7a = 0$ is $a = 0$, because $\\mathbb{Z}$ has no nonzero torsion elements. Step 3 (conclude): $\\varphi(1) = 0$ forces the trivial homomorphism, which is the only one. The number of homomorphisms $\\mathbb{Z}_7 \\to \\mathbb{Z}$ is 1."
        constraints: "determination-by-generator arguments; targets of order <= 12"
      - id: kp2
        name: "The gcd count for Z_m -> Z_n"
        key_prerequisites: [cyclic-groups-generators, euclidean-algorithm]
        exemplars:
          - problem: 'How many homomorphisms are there from $\mathbb{Z}_{12}$ to $\mathbb{Z}_{18}$?'
            answer: "6"
            solution_sketch: 'Need $12 \cdot \varphi(1) \equiv 0 \pmod{18}$; solutions form the subgroup of order $\gcd(12,18) = 6$, namely the multiples of $3$.'
          - problem: 'How many homomorphisms are there from $\mathbb{Z}_8$ to $\mathbb{Z}_6$?'
            answer: "2"
            solution_sketch: '$\gcd(8, 6) = 2$: send $1 \mapsto 0$ or $1 \mapsto 3$.'
          - problem: "Determine the number of group homomorphisms from $\\mathbb{Z}_{20}$ to $\\mathbb{Z}_{30}$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A homomorphism from Z_20 to Z_30 is fixed by the image a of 1, and the gcd count rule says the legal images are the elements with 20a congruent to 0 mod 30. Run the Euclidean algorithm: 30 = 1*20 + 10 and 20 = 2*10 + 0, so gcd(20, 30) = 10. The number of homomorphisms is 10."
          - problem: "Find the size of the set of all homomorphisms from $\\mathbb{Z}_{16}$ to $\\mathbb{Z}_{12}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The gcd count rule gives that the number of homomorphisms from Z_16 to Z_12 is gcd(16, 12). The Euclidean algorithm gives 16 = 1*12 + 4 and 12 = 3*4 + 0, hence gcd(16, 12) = 4. The set of homomorphisms has size 4."
          - problem: "For a homomorphism $f$ from $\\mathbb{Z}_{21}$ to $\\mathbb{Z}_{14}$, how many elements of $\\mathbb{Z}_{14}$ can equal $f(1)$?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An element a of Z_14 can be f(1) exactly when 21a is congruent to 0 mod 14, and by the gcd count rule the number of such elements is gcd(21, 14). The Euclidean algorithm gives 21 = 1*14 + 7 and 14 = 2*7 + 0, so gcd(21, 14) = 7. There are 7 possible values of f(1)."
          - problem: "Suppose $1 \\le m \\le 30$ and the number of homomorphisms from $\\mathbb{Z}_m$ to $\\mathbb{Z}_{16}$ is $8$. Find the largest such $m$."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the gcd count rule the number of homomorphisms from Z_m to Z_16 equals gcd(m, 16), so the condition is gcd(m, 16) = 8. Then m must be a multiple of 8 but not of 16, so m = 8k with k odd, and m at most 30 allows m = 8 or m = 24. The largest such m is 24."
        constraints: "m, n <= 30; the count is gcd(m, n)"
      - id: kp3
        name: "Surjective and injective homomorphism counts"
        key_prerequisites: [cyclic-groups-generators, kernels-images]
        exemplars:
          - problem: 'How many surjective homomorphisms $\mathbb{Z}_{12} \to \mathbb{Z}_4$ are there?'
            answer: "2"
            solution_sketch: 'Every choice of $\varphi(1) \in \mathbb{Z}_4$ satisfies $12\,\varphi(1) \equiv 0$; surjectivity requires $\varphi(1)$ to generate $\mathbb{Z}_4$, giving the $\varphi(4) = 2$ choices $1$ and $3$.'
          - problem: 'How many injective homomorphisms $\mathbb{Z}_4 \to \mathbb{Z}_8$ are there?'
            answer: "2"
            solution_sketch: 'Injective iff $|\varphi(1)| = 4$; the elements of order $4$ in $\mathbb{Z}_8$ are $2$ and $6$.'
          - problem: "How many surjective homomorphisms $\\mathbb{Z}_{24} \\to \\mathbb{Z}_8$ are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (determination by phi(1)): a homomorphism $\\mathbb{Z}_{24} \\to \\mathbb{Z}_8$ is fixed by $\\varphi(1) \\in \\mathbb{Z}_8$, and $24\\,\\varphi(1) \\equiv 0 \\pmod 8$ holds for every choice. Step 2 (surjectivity test): the image is generated by $\\varphi(1)$, so surjectivity requires $\\varphi(1)$ to be a generator of $\\mathbb{Z}_8$. Step 3 (count): since $8$ divides $24$, the number of such maps is $\\varphi(8) = 4$, namely $\\varphi(1) \\in \\{1, 3, 5, 7\\}$. The answer is 4."
          - problem: "How many injective homomorphisms $\\mathbb{Z}_{9} \\to \\mathbb{Z}_{45}$ are there?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (injectivity criterion): a homomorphism from the cyclic group $\\mathbb{Z}_9$ is injective exactly when $\\varphi(1)$ has order $9$, since then the image has $9$ elements. Step 2 (count elements of order 9): $9$ divides $45$, and the number of elements of order $9$ in $\\mathbb{Z}_{45}$ is $\\varphi(9) = 6$; they are the multiples of $5$ coprime to $9$, namely $5, 10, 20, 25, 35, 40$. The answer is 6."
          - problem: "How many injective homomorphisms $\\mathbb{Z}_{6} \\to \\mathbb{Z}_{9}$ are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (injectivity criterion): an injective homomorphism $\\mathbb{Z}_6 \\to \\mathbb{Z}_9$ would send $1$ to an element of order $6$ in $\\mathbb{Z}_9$. Step 2 (order check): the order of every element of $\\mathbb{Z}_9$ divides $9$, and $6$ does not divide $9$, so no element of order $6$ exists. Step 3 (count): there are no admissible images of $1$, hence no injective homomorphisms. The answer is 0."
          - problem: "Consider homomorphisms $\\mathbb{Z}_{12} \\to \\mathbb{Z}_{6}$. Give the number of injective homomorphisms and the number of surjective homomorphisms, in that order, as inj = value; surj = value."
            answer: "inj = 0; surj = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "inj"}, {"contract": {"kind": "exact"}, "name": "surj"}]}
            solution_sketch: "The full object is the pair of counts (injective count, surjective count) for maps $\\mathbb{Z}_{12} \\to \\mathbb{Z}_6$. Step 1 (admissible images): a homomorphism is fixed by $\\varphi(1) \\in \\mathbb{Z}_6$, and $12\\,\\varphi(1) \\equiv 0 \\pmod 6$ holds for every $\\varphi(1)$. Step 2 (injective count, kernel-image criterion): injectivity needs an element of order $12$ in $\\mathbb{Z}_6$; every order in $\\mathbb{Z}_6$ divides $6$, so inj = 0. Step 3 (surjective count, Euler phi): surjectivity needs a generator of $\\mathbb{Z}_6$, and $6$ divides $12$, so the count is $\\varphi(6) = 2$, giving surj = 2. The answer is inj = 0; surj = 2."
        constraints: "surjective count phi(n) when n | m; injective count = # elements of order m in target"
    diagnostic_exemplar:
      problem: 'How many surjective homomorphisms are there from $\mathbb{Z}_{20}$ to $\mathbb{Z}_{10}$?'
      answer: '4'
      solution_sketch: 'A homomorphism is determined by $a = \varphi(1)$, subject to $20a \equiv 0 \pmod{10}$ — true for every $a$, so there are $\gcd(20,10) = 10$ homomorphisms in all. It is onto exactly when $a$ generates $\mathbb{Z}_{10}$, i.e. $\gcd(a,10) = 1$: $\varphi(10) = 4$ choices, namely $a = 1, 3, 7, 9$.'
    anki_seeds:
      - front: "Number of group homomorphisms $\\mathbb{Z}_m \\to \\mathbb{Z}_n$?"
        back: "$\\gcd(m, n)$."
        type: basic
      - front: "A homomorphism out of a cyclic group is completely determined by..."
        back: "The image of one generator."
        type: basic

  - id: classifying-small-groups
    name: "Classifying Small Groups"
    core: false                # classification capstone; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: isomorphism-invariants
        weight: 0.8
        key: true
      - id: consequences-of-lagrange
        weight: 0.7
        key: true
      - id: direct-products
        weight: 0.6
        key: false
    knowledge_points:
      - id: kp1
        name: "Orders 1-5: only cyclic and Klein"
        key_prerequisites: [consequences-of-lagrange, isomorphism-invariants]
        exemplars:
          - problem: "Groups of order 4 can have elements of order 1, 2, or 4. By case analysis on these element orders, determine how many groups of order 4 exist up to isomorphism."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange): every element order divides 4, so orders are 1, 2, or 4. Step 2 (case analysis): if some element has order 4, the group is cyclic of order 4; otherwise every nonidentity element has order 2, which forces the Klein group Z2 x Z2. No other pattern occurs, so there are exactly 2 groups of order 4 up to isomorphism."
          - problem: "A group G has order 4 and contains an element a of order 4. Determine which of the two groups of order 4 G is, and give the number of elements of order 4 in G."
            answer: "verdict = cyclic; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["klein"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1 (case analysis on element orders): a has order 4, so the subgroup generated by a already has 4 elements and equals G, making G the cyclic group of order 4. Step 2 (count): the powers a, a^2, a^3, e have orders 4, 2, 4, 1, so exactly 2 elements have order 4. The case analysis gives verdict = cyclic; count = 2."
          - problem: "A group G has order 4 and satisfies x^2 = e for every element x, where e is the identity. Determine which of the two groups of order 4 G is, and give the number of elements of order 2 in G."
            answer: "verdict = klein; count = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["klein"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1 (case analysis): x^2 = e for all x means every nonidentity element has order 2, so G has no element of order 4 and is not cyclic. Step 2 (count): the unique group of order 4 with this property is the Klein group, whose 3 nonidentity elements all have order 2. The case analysis gives verdict = klein; count = 3."
          - problem: "Let G be a group of order 5. Using Lagrange's theorem and case analysis on the possible element orders, determine how many groups of order 5 exist up to isomorphism."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange): an element order divides 5, so every nonidentity element has order 5. Step 2 (cyclicity): such an element generates the whole group, so every group of order 5 is cyclic. Step 3: all cyclic groups of a fixed order are isomorphic, so there is exactly 1 group of order 5 up to isomorphism."
          - problem: "A group G has order 4 and exactly one element of order 2. Find the number of elements of order 4 in G."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange): element orders divide 4, so nonidentity elements have order 2 or 4. Step 2 (case analysis): since G has exactly one element of order 2, the other two nonidentity elements cannot have order 1 or 2, so each has order 4. Hence G has 2 elements of order 4, and it is the cyclic group of order 4."
          - problem: "Run the case analysis on element orders for every group of order 1, 2, 3, 4, or 5. All the resulting groups turn out to be abelian. Determine how many nonabelian groups of order at most 5 exist up to isomorphism."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange and prime orders): a group of order 1 is trivial, and each prime order 2, 3, 5 forces a cyclic group, all abelian. Step 2 (order 4 case analysis): the two groups of order 4 are the cyclic group Z4 and the Klein group Z2 x Z2, and both are abelian. Step 3: since every group of order at most 5 is abelian, the count of nonabelian groups of order at most 5 up to isomorphism is 0."
        constraints: "orders <= 5; case analysis on element orders"
      - id: kp2
        name: "Order 6 and order 2p"
        key_prerequisites: [consequences-of-lagrange, isomorphism-invariants]
        exemplars:
          - problem: "A group G of order 6 is abelian. State its isomorphism type and give the number of elements of order 2 in G."
            answer: "verdict = cyclic; k = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["dihedral"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "By the order 6 dichotomy, an abelian group of order 6 is cyclic, so G is isomorphic to Z6. In Z6 the element 3 has order 2 and no other element does, so k = 1. The option dihedral would be wrong because it would make G non-abelian. The key is verdict = cyclic; k = 1."
          - problem: "A group G of order 10 is non-abelian. State its isomorphism type and give the number of elements of order 2 in G."
            answer: "verdict = dihedral; k = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["dihedral"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "By the order 2p dichotomy with p = 5, a non-abelian group of order 10 is dihedral, so G is isomorphic to D5. In D5 the five reflections each have order 2, so k = 5. The option cyclic would be wrong because it would make G abelian. The key is verdict = dihedral; k = 5."
          - problem: "A group G of order 6 is not abelian. State its isomorphism type and give the number of elements of order 2 in G."
            answer: "verdict = dihedral; k = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["dihedral"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "By the order 6 dichotomy, a non-abelian group of order 6 is dihedral, so G is isomorphic to S3 or D3. In D3 the three reflections have order 2, so k = 3. The option cyclic would be wrong because it would make G abelian. The key is verdict = dihedral; k = 3."
          - problem: "A group G of order 14 is non-abelian. State its isomorphism type and give the number of elements of order 2 in G."
            answer: "verdict = dihedral; k = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["dihedral"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "By the order 2p dichotomy with p = 7, a non-abelian group of order 14 is dihedral, so G is isomorphic to D7. The seven reflections of D7 have order 2, so k = 7. The option cyclic would be wrong because it would make G abelian. The key is verdict = dihedral; k = 7."
          - problem: "A group G of order 10 has more than one element of order 2. Find the number of elements of order 2 in G."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the order 2p dichotomy with p = 5, a group of order 10 with more than one element of order 2 cannot be cyclic, so it is D5. In D5 the five reflections each have order 2, so the count is 5. The number is 5."
          - problem: "A group G of order 14 has no element of order 14. Find the number of elements of order 2 in G."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the order 2p dichotomy with p = 7, a group of order 14 with no element of order 14 is not cyclic, so it is D7. The seven reflections in D7 have order 2, so the count is 7. The number is 7."
        constraints: "orders 6, 10, 14: cyclic vs dihedral dichotomy (may be quoted)"
      - id: kp3
        name: "Recognizing a given group in the catalog"
        key_prerequisites: [isomorphism-invariants]
        exemplars:
          - problem: "The unit group U(12) = {1, 5, 7, 11} under multiplication mod 12 has four elements. Which group from the catalog of small groups is U(12) isomorphic to?"
            answer: "Klein Z2 x Z2"
            answer_contract: {"kind": "label", "options": [["cyclic Z4"], ["Klein Z2 x Z2"], ["symmetric S3"], ["dihedral D4"], ["dihedral D5"]]}
            solution_sketch: "Step 1 (order by Lagrange): U(12) has order phi(12) = 4, so only the catalog groups of order 4, cyclic Z4 and Klein Z2 x Z2, are candidates; symmetric S3, dihedral D4 and dihedral D5 have orders 6, 8 and 10. Step 2 (element orders): 5^2 = 25 = 1, 7^2 = 49 = 1 and 11^2 = 121 = 1 mod 12, so no nonidentity element has order 4. Step 3 (invariant decision): a group of order 4 with no element of order 4 is the Klein group, while cyclic Z4 has an element of order 4 and S3, D4, D5 fail by order. The catalog group is Klein Z2 x Z2."
          - problem: "The unit group U(10) = {1, 3, 7, 9} under multiplication mod 10 has order 4. To which catalog group of small order is U(10) isomorphic?"
            answer: "cyclic Z4"
            answer_contract: {"kind": "label", "options": [["cyclic Z4"], ["Klein Z2 x Z2"], ["symmetric S3"], ["dihedral D4"]]}
            solution_sketch: "Step 1 (order by Lagrange): U(10) has order phi(10) = 4, so only cyclic Z4 and Klein Z2 x Z2 are candidates; symmetric S3 and dihedral D4 have orders 6 and 8. Step 2 (element orders): 3^2 = 9 and 3^4 = 81 = 1 mod 10, so the element 3 has order 4. Step 3 (invariant decision): a group of order 4 with an element of order 4 is cyclic, so U(10) is cyclic Z4; Klein Z2 x Z2 fails since it has no element of order 4, and S3 and D4 fail by order. The answer is cyclic Z4."
          - problem: "The unit group U(8) = {1, 3, 5, 7} under multiplication mod 8 has order 4, so it is cyclic Z4 or the Klein four-group according to whether it has an element of order 4. How many elements of order 4 does U(8) have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (element orders): in U(8) = {1, 3, 5, 7} mod 8 we have 3^2 = 9 = 1, 5^2 = 25 = 1 and 7^2 = 49 = 1, so every nonidentity element has order 2. Step 2 (catalog decision): U(8) has no element of order 4, so it matches the Klein four-group and not cyclic Z4. Step 3 (count): the elements of order 4 in U(8) number 0. The answer is 0."
          - problem: "The unit group U(14) = {1, 3, 5, 9, 11, 13} has order 6, and the two catalog groups of order 6, cyclic Z6 and symmetric S3, differ in their largest element order. Find the order of the element 3 in U(14)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (catalog match): U(14) has order 6; cyclic Z6 has an element of order 6 and symmetric S3 does not, so the largest element order decides the isomorphism type. Step 2 (compute the order of 3): the powers of 3 mod 14 are 3, 9, 13, 11, 5, 1, so 3 has order 6. Step 3: an element of order 6 in a group of order 6 makes the group cyclic, so U(14) is cyclic Z6. The order of 3 in U(14) is 6."
          - problem: "In the dihedral group D4 of order 8, the center is {1, r^2} and the quotient D4/Z(D4) has order 4, so it is cyclic Z4 or the Klein four-group depending on its number of elements of order 2. How many elements of order 2 does D4/Z(D4) have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (quotient construction): the cosets of Z(D4) = {1, r^2} are {1, r^2}, {r, r^3}, {s, r^2 s} and {rs, r^3 s}, four cosets each of size 2. Step 2 (element orders in the quotient): each nontrivial coset squared is the coset {1, r^2}, so all three nontrivial elements of the quotient have order 2. Step 3 (catalog decision): a group of order 4 with three elements of order 2 is the Klein four-group, not cyclic Z4. The number of elements of order 2 in D4/Z(D4) is 3."
          - problem: "The direct product Z3 x Z4 has order 12, and it is isomorphic to the catalog group Z12 exactly when it contains an element of order 12. Find the order of the element (1, 1) in Z3 x Z4."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (order formula for products): the order of a pair (a, b) in a direct product is the least common multiple of the orders of a and b. Step 2 (compute): in Z3 x Z4 the element 1 has order 3 in the first factor and order 4 in the second, so (1, 1) has order lcm(3, 4) = 12. Step 3 (catalog decision): an element of order 12 in a group of order 12 makes the group cyclic, so Z3 x Z4 matches Z12 in the catalog. The order of (1, 1) is 12."
        constraints: "U(n) for n <= 16, small quotients and products; match against Z_n, Klein, S_3, D_4, D_5"
    diagnostic_exemplar:
      problem: 'The group $U(18)$ has order $6$. Decide which of the two groups of order $6$ it is, and name the invariant that settles it.'
      answer: 'Up to isomorphism the groups of order $6$ are $\mathbb{Z}_6$ and $S_3 \cong D_3$, separated by commutativity (equivalently, by having an element of order $6$). $U(18) = \{1,5,7,11,13,17\}$ is abelian, since multiplication mod $18$ is commutative, so $U(18) \cong \mathbb{Z}_6$. Concretely $5$ has order $6$: $5,\ 25 \equiv 7,\ 35 \equiv 17,\ 85 \equiv 13,\ 65 \equiv 11,\ 55 \equiv 1$, so $U(18) = \langle 5 \rangle$.'
      answer_contract: {kind: none}
      solution_sketch: 'Recall the order-$6$ catalogue, then test the separating invariant on $U(18)$ — abelian-ness, confirmed by exhibiting a generator.'
    anki_seeds:
      - front: "The two groups of order 4 up to isomorphism?"
        back: "$\\mathbb{Z}_4$ and the Klein four-group $\\mathbb{Z}_2 \\times \\mathbb{Z}_2$."
        type: basic
      - front: "The two groups of order 6 up to isomorphism?"
        back: "$\\mathbb{Z}_6$ and $S_3$ (the smallest non-abelian group)."
        type: basic
      - front: "Groups of order $2p$ ($p$ odd prime)?"
        back: "$\\mathbb{Z}_{2p}$ and $D_p$."
        type: basic

