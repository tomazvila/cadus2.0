unit: morphisms
course: abstract-algebra
module: "Isomorphisms & the Isomorphism Theorems"
topics:
  - id: group-isomorphisms
    name: "Group Isomorphisms"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: homomorphisms-intro
        weight: 0.9
        key: true
      - id: functions-injective-surjective
        weight: 0.6
        key: true
      - id: cyclic-groups-generators
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Definition and verifying isomorphisms"
        key_prerequisites: [homomorphisms-intro, functions-injective-surjective]
        exemplars:
          - problem: "Consider phi: (R, +) -> (R+, .), phi(x) = 3^x. To verify the homomorphism law, one checks that phi(a+b) = phi(a)phi(b). Give the value of phi(1)phi(2) as an integer."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism law): an isomorphism candidate must satisfy phi(a+b) = phi(a)phi(b). Step 2 (evaluate): phi(1) = 3^1 = 3 and phi(2) = 3^2 = 9. Step 3 (multiply): the check value is 3 times 9 = 27, which equals phi(3), confirming the law. The answer is 27."
          - problem: "The map phi: Z4 -> U(5), phi(k) = 2^k mod 5, is well defined because the order of 2 divides 4. Give the order of 2 in U(5), that is, the smallest positive m with 2^m = 1 mod 5."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of order): the order of 2 in U(5) is the smallest m with 2^m = 1 mod 5. Step 2 (compute powers): 2^1 = 2, 2^2 = 4, 2^3 = 8 = 3, 2^4 = 16 = 1 mod 5. Step 3 (conclude): the order is 4, so phi(k+4) = 2^(k+4) = 2^k mod 5 and phi is well defined; the four values 1, 2, 3, 4 are distinct, so phi is bijective. The answer is 4."
          - problem: "A student claims that phi: Z6 -> Z6, phi(k) = 2k mod 6, is an isomorphism. Give the smallest positive k with phi(k) = 0, the value that refutes the claim."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (kernel condition): phi(k) = 0 means 2k = 0 mod 6, that is, 6 divides 2k. Step 2 (solve): this holds exactly when 3 divides k, giving k = 3, 6, 9, and so on. Step 3 (conclude): the smallest positive such k is 3; a nonzero kernel element means phi is not injective, so the claim fails. The answer is 3."
          - problem: "The map phi: Z7 -> Z7, phi(k) = 3k mod 7, is an isomorphism, so its inverse has the form psi(m) = a m mod 7. Find the multiplier a."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism check): phi(j+k) = 3(j+k) = 3j + 3k = phi(j) + phi(k) mod 7. Step 2 (inverse condition): psi(phi(k)) = a(3k) must equal k mod 7, so 3a = 1 mod 7. Step 3 (solve): 3 times 5 = 15 = 2 times 7 + 1, so a = 5 and psi(m) = 5m mod 7 inverts phi. The answer is 5."
          - problem: "Claim: phi: Z5 -> Z5, phi(k) = k^2 mod 5, is an isomorphism. Step 1: phi(a+b) = (a+b)^2 mod 5. Step 2: phi(a) + phi(b) = a^2 + b^2 mod 5. Step 3: since (a+b)^2 = a^2 + b^2 for all a, b in Z5, phi is a homomorphism. Step 4: phi is injective, hence an isomorphism. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct evaluation of phi at a+b. Step 2 is a correct evaluation of phi(a) + phi(b). Step 3 is false: (a+b)^2 = a^2 + 2ab + b^2, and 2ab is not always 0 mod 5 (a = b = 1 gives 4 versus 2), so phi is not a homomorphism. Step 4 would also fail, since phi(1) = phi(4) = 1, but it depends on the false Step 3. The answer is Step 3."
          - problem: "To prove that phi: Z8 -> Z8, phi(k) = 3k mod 8, is injective, suppose 3j and 3k give the same remainder on division by 8. Then 8 divides 3(j-k), and the proof continues: since gcd(3, 8) = 1, ___, so j = k in Z8. Select the missing line."
            answer: "8 divides j-k"
            answer_contract: {"kind": "label", "options": [["8 divides j-k"], ["8 divides j+k"], ["3 divides j-k"], ["3 divides 8"]]}
            solution_sketch: "From 3j = 3k mod 8 we get 8 divides 3(j-k). Because gcd(3, 8) = 1, the factor 3 contributes nothing, so 8 divides j-k and j = k in Z8; this is the missing line. The option 8 divides j+k is a sign error. The option 3 divides j-k cancels with the wrong modulus. The option 3 divides 8 is a false divisibility claim. The answer is 8 divides j-k."
          - problem: "Write the full proof: the map phi: (R, +) -> (R+, .), phi(x) = 5^x, is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (homomorphism): for all real x, y, phi(x+y) = 5^(x+y) = 5^x times 5^y = phi(x)phi(y), so phi preserves the group operation. Step 2 (injective): if phi(x) = phi(y), then 5^x = 5^y; taking the natural logarithm gives x ln 5 = y ln 5, and since ln 5 is not zero, x = y. Step 3 (surjective): for any y > 0, set x = ln(y)/ln(5), which is a real number, and phi(x) = 5^x = e^(ln y) = y. Step 4 (conclusion): phi is a bijective homomorphism, with two-sided inverse psi(y) = ln(y)/ln(5), hence phi is an isomorphism. This completes the full verification of the homomorphism law, injectivity, and surjectivity."
        constraints: "explicit maps between groups of order <= 8 or classic infinite examples (exp/log); full verification expected"
      - id: kp2
        name: "Properties preserved by isomorphisms"
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: "Let phi: Z_6 -> Z_2 x Z_3 be the isomorphism given by phi(k) = (k mod 2, k mod 3). Give phi(0) as (x, y)."
            answer: "(0, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the identity preservation lemma, an isomorphism sends the identity of Z_6 to the identity of Z_2 x Z_3. The identity of Z_2 x Z_3 is (0, 0). The answer is (0, 0)."
          - problem: "Let phi: Z_6 -> Z_2 x Z_3 be the isomorphism phi(k) = (k mod 2, k mod 3). Find the order of phi(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of phi, phi(2) = (2 mod 2, 2 mod 3) = (0, 2). In Z_2 x Z_3, the first coordinate has order 1 and the second has order 3, so the pair has order 3. The answer is 3."
          - problem: "Let phi: Z_6 -> Z_2 x Z_3 be the isomorphism phi(k) = (k mod 2, k mod 3). Suppose a = 4 in Z_6. Give phi(-a) as (x, y)."
            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By inverse preservation, phi(-a) is the inverse of phi(a). Compute phi(4) = (4 mod 2, 4 mod 3) = (0, 1). The inverse of (0, 1) in Z_2 x Z_3 is (0, 2). The answer is (0, 2)."
          - problem: "Let phi: Z_6 -> Z_2 x Z_3 be the isomorphism phi(k) = (k mod 2, k mod 3). The element 1 generates Z_6. Give a generator of Z_2 x Z_3 that equals phi(1) as (x, y)."
            answer: "(1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By cyclicity preservation, the image of a generator is a generator. Compute phi(1) = (1 mod 2, 1 mod 3) = (1, 1). In Z_2 x Z_3, (1, 1) has order 6, so it generates the product. The answer is (1, 1)."
          - problem: "In the proof that an isomorphism phi: G -> H sends inverses to inverses, after phi(a * a^-1) = phi(e_G), the next line is missing. Select the line that completes the proof that phi(a^-1) = phi(a)^-1."
            answer: "phi(a) * phi(a^-1) = e_H"
            answer_contract: {"kind": "label", "options": [["phi(a) * phi(a^-1) = e_H"], ["phi(a) + phi(a^-1) = e_H"], ["phi(a^-1) * phi(a) = phi(e_G)"], ["phi(a) * phi(a^-1) = phi(a)"]]}
            solution_sketch: "Start with the group identity a * a^-1 = e_G. Apply phi to both sides: phi(a * a^-1) = phi(e_G). By the homomorphism law, phi(a) * phi(a^-1) = phi(e_G). By identity preservation, phi(e_G) = e_H, so phi(a) * phi(a^-1) = e_H. The option phi(a) + phi(a^-1) = e_H uses addition in a group. The option phi(a^-1) * phi(a) = phi(e_G) stops before using identity preservation. The option phi(a) * phi(a^-1) = phi(a) has the wrong right side. The answer is phi(a) * phi(a^-1) = e_H."
          - problem: "Claim: if phi: G -> H is an isomorphism and G is abelian, then H is abelian. Step 1: let x, y be in H. Step 2: since phi is onto, choose a, b in G with phi(a)=x and phi(b)=y. Step 3: since G is abelian, ab=ba. Step 4: apply phi to get phi(a)+phi(b)=phi(b)+phi(a). Step 5: therefore xy=yx, so H is abelian. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is the setup and Step 2 uses that phi is onto, both valid. Step 3 uses that G is abelian, valid. Step 4 is invalid: phi is a homomorphism, so it preserves the group operation as multiplication, giving phi(a)phi(b)=phi(b)phi(a), not a sum. Step 5 would follow from the corrected Step 4. The answer is Step 4."
          - problem: "Write the full proof: if phi: G -> H is an isomorphism and G is cyclic, then H is cyclic. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let G be cyclic with generator g, so every element of G is g^n for some integer n. Let h be any element of H. Since phi is onto, h = phi(x) for some x in G. Write x = g^n. By the homomorphism law, phi(g^n) = phi(g)^n. Thus h = phi(g)^n, so every element of H is a power of phi(g). Therefore H is cyclic with generator phi(g). This proves that isomorphisms preserve cyclicity."
        constraints: "standard preservation lemmas: identity, inverses, orders, abelian-ness, cyclicity"
      - id: kp3
        name: "Isomorphism as an equivalence; automorphisms"
        key_prerequisites: [homomorphisms-intro, functions-injective-surjective]
        exemplars:
          - problem: "Let phi be the isomorphism phi(x) = 3x mod 10 from Z_10 to itself. To prove that the inverse map is an isomorphism, first find its formula: phi inverse sends y to c y mod 10, where c is the number that this step of the proof produces. Give c as a residue modulo 10."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (inverse-map rule): the inverse condition is phi(c y) = y for every y, that is 3c = 1 modulo 10. Step 2 (modular inverse): since 3 times 7 = 21 = 1 modulo 10, the coefficient is c = 7, so phi inverse is y -> 7y mod 10. Step 3 (closure under inverse): phi inverse is bijective as the inverse of a bijection and it is a homomorphism, so it is an isomorphism. The answer is 7."
          - problem: "For the additive group Z, any automorphism must send 1 to a generator of Z, and that one value determines the whole map. How many automorphisms does the additive group Z have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (homomorphism rule): a homomorphism f of Z satisfies f(n) = n f(1), so f is determined by f(1). Step 2 (cyclic-generator rule): surjectivity forces f(1) to generate Z, and the only generators of Z are 1 and -1. Step 3 (bijection check): n -> n is the identity and n -> -n is the negation map, and both are bijective homomorphisms. The answer is 2."
          - problem: "Let phi(x) = 2x mod 11 and psi(x) = 3x mod 11 be automorphisms of the additive group Z_11, and let rho be the composition psi after phi, which sends x to c x mod 11 for the coefficient c that this proof step produces. Give the order of rho in the group of automorphisms."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (composition rule): rho(x) = psi(phi(x)) = 3(2x) = 6x mod 11, so the coefficient this step produces is c = 6. Step 2 (closure under composition): 6 is a unit modulo 11, so rho is again an automorphism. Step 3 (element-order rule): the k-th power of rho is multiplication by 6^k, and the least positive k with 6^k = 1 modulo 11 is 10, since the powers 6, 3, 7, 9, 10, 5, 8, 4, 2, 1 stay distinct until the tenth. The answer is 10."
          - problem: "The map phi(x) = 5x mod 12 is an automorphism of the additive group Z_12. To prove that phi has finite order in the automorphism group, compute the powers of 5 modulo 12 until you reach 1. Give the order of phi."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (element-order rule): the order of phi is the least positive k with phi applied k times equal to the identity, that is 5^k = 1 modulo 12. Step 2 (modular arithmetic): 5^1 = 5 and 5^2 = 25 = 1 modulo 12. Step 3: the least such k is 2, so the order of phi is 2. The answer is 2."
          - problem: "A student claims that for every positive integer k, the map x -> kx mod 9 is an automorphism of the additive group Z_9. Give the smallest k for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (automorphism rule for Z_n): the map x -> kx mod 9 is an automorphism exactly when k is a unit modulo 9, that is gcd(k, 9) = 1. Step 2 (test small cases): k = 1 and k = 2 are units, but gcd(3, 9) = 3, and 3 times 3 = 0 equals 3 times 0, so the map is not injective. Step 3 (smallest counterexample): the smallest failing k is 3. The answer is 3."
          - problem: "Claim: if phi: G -> H is an isomorphism, then the inverse map phi inverse: H -> G is an isomorphism. Step 1: phi is bijective, so the inverse function phi inverse exists. Step 2: take h1 and h2 in H; since phi is surjective, h1 = phi(g1) and h2 = phi(g2) for some g1, g2 in G. Step 3: h1 h2 = phi(g1 g2), so phi inverse(h1 h2) = g1 g2 = phi inverse(h1) phi inverse(h2). Step 4: therefore phi inverse(h1 h2) = phi inverse(h2) phi inverse(h1), which equals phi inverse(h1) phi inverse(h2) in every group. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: an isomorphism is bijective, so the inverse function exists, and this option has no error. Step 2 is valid: surjectivity of phi produces preimages g1 and g2, so this option has no error. Step 3 is valid: the homomorphism property gives phi(g1) phi(g2) = phi(g1 g2), and applying phi inverse gives g1 g2, so this option has no error. Step 4 is the error: it claims phi inverse(h2) phi inverse(h1) equals phi inverse(h1) phi inverse(h2) in every group, which fails when G is nonabelian; the correct line is phi inverse(h1 h2) = phi inverse(h1) phi inverse(h2). The answer is Step 4."
          - problem: "Write the full proof: the set of automorphisms of a group G forms a group under composition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (closure): let phi and psi be automorphisms of G. The composite sends ab to psi(phi(ab)) = psi(phi(a) phi(b)) = psi(phi(a)) psi(phi(b)), so the composite is a homomorphism, and a composition of bijections is bijective, so the composite is an automorphism. Step 2 (associativity): composition of functions is associative, so this holds for automorphisms in particular. Step 3 (identity): the identity map id(x) = x is a bijective homomorphism, hence an automorphism, and id after phi = phi after id = phi for every automorphism phi. Step 4 (inverses): each automorphism phi is bijective, so it has an inverse function phi inverse; for h1 = phi(g1) and h2 = phi(g2) we get phi inverse(h1 h2) = phi inverse(phi(g1 g2)) = g1 g2 = phi inverse(h1) phi inverse(h2), so phi inverse is a homomorphism, and being bijective it is an automorphism with phi after phi inverse = phi inverse after phi = id. Conclusion: closure, associativity, identity, and inverses all hold, so the automorphisms of G form a group under composition."
        constraints: "closure of isomorphisms under inverse and composition; simple automorphisms of Z, Z_n"
    diagnostic_exemplar:
      problem: 'Exhibit an isomorphism $U(10) \to \mathbb{Z}_4$ and justify briefly.'
      answer: '$U(10) = \langle 3 \rangle$ with $3^1=3, 3^2=9, 3^3=7, 3^4=1$; send $3^k \mapsto k$. A generator-to-generator map of cyclic groups of equal order is an isomorphism.'
      solution_sketch: 'Both groups are cyclic of order $4$; matching generators gives $\varphi(3^k) = k \bmod 4$, which converts multiplication into addition of exponents.'
    anki_seeds:
      - front: "What is a group isomorphism?"
        back: "A bijective homomorphism; its inverse is automatically a homomorphism too."
        type: basic
      - front: "Name four properties preserved by isomorphism."
        back: "Group order, element orders, being abelian, being cyclic (any structural property)."
        type: basic

  - id: isomorphism-invariants
    name: "Proving Groups Non-Isomorphic"
    core: false                # technique feeding only the classification capstone
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: group-isomorphisms
        weight: 0.9
        key: true
      - id: direct-products
        weight: 0.5
        key: false
      - id: order-of-an-element
        weight: 0.5
        key: false
      # Phase C: kp2's named invariant is abelian-ness; verifying/refuting it is the
      # skill taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Order profiles as invariants"
        key_prerequisites: [group-isomorphisms, order-of-an-element]
        exemplars:
          - problem: "The group U(8) = {1, 3, 5, 7} has every element x satisfying x^2 = 1, while Z_4 has an element of order 4. How many elements of order 2 does U(8) have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: In U(8) every element x satisfies x^2 = 1, so by the order-of-an-element rule each nonidentity element has order exactly 2. Step 2: The identity 1 has order 1, so the elements 3, 5, 7 are precisely the elements of order 2. Counting them gives 3."
          - problem: "The groups Z_4 and Z_2 x Z_2 both have order 4. Count the elements of order 2 in each group. Give z4, the number of elements of order 2 in Z_4, and klein, the number of elements of order 2 in Z_2 x Z_2."
            answer: "z4 = 1; klein = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "z4"}, {"contract": {"kind": "exact"}, "name": "klein"}]}
            solution_sketch: "Step 1: In Z_4 the element 2 has order 2, while 1 and 3 have order 4, so the count of elements of order 2 is 1. Step 2: In Z_2 x Z_2 every nonidentity element satisfies (a,b)^2 = (0,0), so all three nonidentity elements have order 2, giving 3. Step 3: Counts of elements of a fixed order are isomorphism invariants, so the two groups are not isomorphic. The answer is z4 = 1; klein = 3."
          - problem: "In the direct product Z_3 x Z_3, every element g satisfies 3g = 0. How many elements of order 3 does Z_3 x Z_3 have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Since 3g = 0 for every element, the order of each element divides 3 by the order-of-an-element rule, so every nonidentity element has order exactly 3. Step 2: The group has 3 times 3 = 9 elements; removing the identity leaves 8. The number of elements of order 3 is 8."
          - problem: "The groups Z_6 and S_3 both have order 6. Count the elements of order 2 in each group and use these counts to decide whether an isomorphism can exist. Give verdict and o2, the number of elements of order 2 in S_3."
            answer: "verdict = nonisomorphic; o2 = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["isomorphic"], ["nonisomorphic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "o2"}]}
            solution_sketch: "Step 1: In the cyclic group Z_6 the unique element of order 2 is 3, so the count there is 1. Step 2: In S_3 the three transpositions each have order 2, so o2 = 3. Step 3: An isomorphism preserves the number of elements of each order; since 1 and 3 differ, no isomorphism can exist. The answer is verdict = nonisomorphic; o2 = 3."
          - problem: "Each group in the options has order at most 12. Count the elements of order 2 in each one. Which of these groups has exactly 3 elements of order 2?"
            answer: "the group Z_4 x Z_2"
            answer_contract: {"kind": "label", "options": [["the cyclic group Z_8"], ["the group Z_4 x Z_2"], ["the group Z_2 x Z_2 x Z_2"], ["the cyclic group Z_12"]]}
            solution_sketch: "Step 1: Compute the count for each option. In the cyclic group Z_8, only the element 4 has order 2, giving 1; choosing the cyclic group Z_8 is the error of assuming every even-order group has several involutions. In the cyclic group Z_12, only the element 6 has order 2, giving 1; choosing the cyclic group Z_12 repeats that same error. In the group Z_2 x Z_2 x Z_2 every nonidentity element has order 2, giving 7; choosing the group Z_2 x Z_2 x Z_2 confuses all-nontrivial-elements with exactly 3. Step 2: In the group Z_4 x Z_2 the elements (2,0), (0,1), (2,1) have order 2, while the remaining nonidentity elements have order 4, giving 3. The correct option is the group Z_4 x Z_2."
          - problem: "The group Z_6 x Z_2 has order 12. Count its elements of order 2 and its elements of order 6. Give o2 and o6."
            answer: "o2 = 3; o6 = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "o2"}, {"contract": {"kind": "exact"}, "name": "o6"}]}
            solution_sketch: "Step 1: Elements whose order divides 2 have first coordinate in {0, 3} and second coordinate in {0, 1}, giving 4 elements; subtracting the identity gives o2 = 3. Step 2: Elements whose order divides 3 have first coordinate in {0, 2, 4} and second coordinate 0, giving 3 elements; subtracting the identity gives 2 elements of order 3. Step 3: Every remaining element has order 6, and 12 - 1 - 3 - 2 = 6. The answer is o2 = 3; o6 = 6."
        constraints: "groups of order <= 12; distinguish via element-order counts"
      - id: kp2
        name: "Abelian-ness, cyclicity, and other structural invariants"
        key_prerequisites: [group-isomorphisms]
        exemplars:
          - problem: "A student must prove that $S_3$ and $\\mathbb{Z}_6$ are not isomorphic. Both groups have order $6$, and each has exactly two elements of order $3$. Which invariant separates the two groups?"
            answer: "abelian-ness"
            answer_contract: {"kind": "label", "options": [["abelian-ness"], ["group-order"], ["order-3-elements"], ["identity"]]}
            solution_sketch: "Step 1 (compute the invariant on each group): Z6 is abelian, while S3 is not, because (1 2)(1 3) and (1 3)(1 2) differ. Step 2 (rule out each wrong option): group-order fails because both groups have order 6; order-3-elements fails because each group has exactly two elements of order 3; identity fails because every group has an identity, so it never separates two groups. Abelian-ness transfers across isomorphisms, so it is the invariant that proves the groups non-isomorphic. The answer is abelian-ness."
          - problem: "The groups $\\mathbb{Z}_4$ and $\\mathbb{Z}_2 \\times \\mathbb{Z}_2$ have the same order and are both abelian, so a subtler invariant is needed. Counting the elements of order 2 is such an invariant. How many elements of order 2 does $\\mathbb{Z}_2 \\times \\mathbb{Z}_2$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (state the full object): the group Z2 x Z2 has elements (0,0), (1,0), (0,1), (1,1) under componentwise addition mod 2. Step 2 (apply the order rule): each of the three non-identity elements satisfies 2g = (0,0) and is nonzero, so each has order 2. Step 3 (count and compare): the count is 3, while Z4 has only the element 2 of order 2, so the invariant separates the two groups. The answer is 3."
          - problem: "To test $\\mathbb{Z}_{12}$ against $\\mathbb{Z}_6 \\times \\mathbb{Z}_2$, use the invariant that counts the elements which generate the whole group. How many elements of $\\mathbb{Z}_{12}$ generate the whole group?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (state the full object): in Z12 an element generates the whole group exactly when its order is 12. Step 2 (apply the order rule): the order of a is 12 divided by the largest common factor of a and 12, which is 12 exactly for a equal to 1, 5, 7, 11. Step 3 (count and compare): the count is 4, while every element of Z6 x Z2 has order at most 6, so its count is 0, and the two counts separate the groups. The answer is 4."
          - problem: "In $\\mathbb{Z}_9$, exactly two elements have order 3. To test $\\mathbb{Z}_9$ against $\\mathbb{Z}_3 \\times \\mathbb{Z}_3$, count the elements of order 3 in $\\mathbb{Z}_3 \\times \\mathbb{Z}_3$. How many such elements does $\\mathbb{Z}_3 \\times \\mathbb{Z}_3$ have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (state the full object): Z3 x Z3 has 9 elements under componentwise addition mod 3. Step 2 (apply the order rule): every element except (0,0) satisfies 3g = (0,0) and is nonzero, so every one of the 8 non-identity elements has order 3. Step 3 (count and compare): the count is 8, while Z9 has exactly 2 elements of order 3, so the counts differ and the groups are not isomorphic. The answer is 8."
          - problem: "A commuting count is an invariant: in $\\mathbb{Z}_6$, all six elements commute with any fixed element. In $S_3$, an element $g$ commutes with $(1\\,3)$ exactly when $g(1\\,3) = (1\\,3)g$. What is the count of elements of $S_3$ with this property?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (state the full object): S3 has the six elements e, (1 2), (1 3), (2 3), (1 2 3), (1 3 2). Step 2 (apply the commutativity check): g(1 3) = (1 3)g holds for g = e and g = (1 3) only, since each of the four remaining elements conjugates (1 3) to a different transposition. Step 3 (count and compare): the count is 2, while in Z6 the count is 6, so the counts separate the groups. The answer is 2."
          - problem: "Work in the additive group $(\\mathbb{Q},+)$ of rational numbers, an infinite group. The first answer says whether some single element of this group generates the entire group; the second counts the elements that generate the entire group. Give the verdict and the value of $k$."
            answer: "verdict = not-cyclic; k = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["not-cyclic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Step 1 (state the generator test for the full object (Q,+)): the group is generated by one element q exactly when every rational number is an integer multiple of q. Step 2 (run the test): for any nonzero rational q, the number q/2 is not an integer multiple of q, and q = 0 generates only the one-element group, so no element generates the group. Step 3 (count): the number of generating elements is 0 and the single-generator test fails, so the group is not cyclic while Z is cyclic. The answer is verdict = not-cyclic; k = 0."
        constraints: "one clean invariant per problem; include one infinite-group example per set"
      - id: kp3
        name: "Full comparisons of small groups"
        key_prerequisites: [group-isomorphisms, direct-products]
        exemplars:
          - problem: 'Decide: $\mathbb{Z}_{12} \cong \mathbb{Z}_4 \times \mathbb{Z}_3$?'
            answer: 'Yes: $\gcd(4,3) = 1$, so the product is cyclic of order $12$.'
            answer_contract: {kind: none}
            solution_sketch: '$(1,1)$ has order $\mathrm{lcm}(4,3) = 12$; a cyclic group of order $12$ is unique up to isomorphism.'
          - problem: 'Decide: $D_6$ (order $12$) $\cong A_4$?'
            answer: 'No: $D_6$ has an element of order $6$ (the rotation $r$); $A_4$ has elements of orders $1, 2, 3$ only.'
            answer_contract: {kind: none}
            solution_sketch: 'Compare element orders — $A_4$''s elements are the identity, double transpositions, and 3-cycles.'
        constraints: "yes/no with proof, orders <= 12; use the gcd criterion and order profiles"
    diagnostic_exemplar:
      problem: 'Are $\mathbb{Z}_8$, $\mathbb{Z}_4 \times \mathbb{Z}_2$, and $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_2$ pairwise non-isomorphic? Prove it.'
      answer: 'Yes: their maximal element orders are $8$, $4$, and $2$ respectively, and maximal order is an isomorphism invariant.'
      answer_contract: {kind: none}
      solution_sketch: 'Compute the largest order in each (generator; $(1,0)$ of order $4$; all non-identity elements order $2$).'
    anki_seeds:
      - front: "Fastest way to show two finite groups are NOT isomorphic?"
        back: "Find an invariant that differs: order, abelian-ness, cyclicity, or the count of elements of some order."
        type: basic
      - front: "Element orders occurring in $A_4$?"
        back: "$1, 2, 3$ — in particular no element of order $6$ or $12$."
        type: basic

  - id: kernels-images
    name: "Kernels and Images"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: homomorphisms-intro
        weight: 0.8
        key: true
      - id: normal-subgroups
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Computing kernels and images"
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: "Let $\\varphi : \\mathbb{Z}_{12} \\to \\mathbb{Z}_{12}$ be given by $\\varphi(x) = 8x \\bmod 12$. Find $\\ker \\varphi$ and $\\mathrm{im}\\,\\varphi$, giving each as an explicit set."
            answer: "ker = {0, 3, 6, 9}; im = {0, 4, 8}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "ker"}, {"contract": {"kind": "set"}, "name": "im"}]}
            solution_sketch: "Kernel step (kernel test): solve 8x ≡ 0 mod 12, which reduces to 2x ≡ 0 mod 3, so x ≡ 0 mod 3, giving ker φ = {0, 3, 6, 9}. Image step (image of a multiply map): the values 8x mod 12 are exactly the multiples of gcd(8, 12) = 4, giving im φ = {0, 4, 8}. The answer is ker = {0, 3, 6, 9}; im = {0, 4, 8}."
          - problem: "The sign homomorphism sends each permutation of four letters to +1 when the permutation is even and to -1 when it is odd. Which subgroup of $S_4$ is the kernel of the sign map?"
            answer: "A4"
            answer_contract: {"kind": "label", "options": [["A4"], ["D4"], ["V4"], ["Z4"]]}
            solution_sketch: "Kernel step (kernel as preimage of the identity): the kernel collects exactly the permutations sent to +1, that is the even permutations, which form the alternating group A4. D4 is the error of taking the eight symmetries of a square inside S4, V4 is the error of keeping only the three double transpositions, and Z4 is the error of taking the cyclic group generated by a 4-cycle. The kernel is A4."
          - problem: "Let $\\varphi : \\mathbb{Z}_{10} \\to \\mathbb{Z}_{10}$, $\\varphi(x) = 4x \\bmod 10$. Find $\\ker \\varphi$, giving it as an explicit set."
            answer: "{0, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Kernel step (kernel test): 4x ≡ 0 mod 10 is equivalent to 2x ≡ 0 mod 5, hence x ≡ 0 mod 5. Check step: testing the residues of Z_10 leaves only x = 0 and x = 5, since 4·5 = 20 ≡ 0 mod 10. The kernel is {0, 5}."
          - problem: "Let $\\varphi : \\mathbb{Z} \\to \\mathbb{Z}_6$ be the reduction map $\\varphi(x) = x \\bmod 6$. Find $\\mathrm{im}\\,\\varphi$, giving it as an explicit set."
            answer: "{0, 1, 2, 3, 4, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Image step (image of a reduction map): each residue r of Z_6 is hit by the integer x = r, so no residue is missed. The image is the whole codomain, not a proper subgroup. The image is {0, 1, 2, 3, 4, 5}."
          - problem: "Consider the sign homomorphism $\\mathrm{sgn} : S_3 \\to \\{\\pm 1\\}$. How many elements are in $\\ker \\mathrm{sgn}$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Kernel step (kernel as preimage of the identity): the kernel is the set of permutations of S3 with sign +1, that is the even permutations. Count step: the even permutations are the identity and the two 3-cycles, forming A3. So ker sgn has 3 elements."
          - problem: "The map $\\varphi : \\mathbb{Z}_{10} \\to \\mathbb{Z}_{10}$ with $\\varphi(x) = ax \\bmod 10$ has kernel $\\{0, 5\\}$. Find the smallest positive value of $a$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Condition step (kernel test read backwards): x = 5 must satisfy 5a ≡ 0 mod 10, so a is even. Exclusion step: x = 2 must fail, so 2a is not divisible by 10, meaning a is not a multiple of 5, and the admissible values are a = 2, 4, 6, 8. The smallest positive value of a is 2."
        constraints: "maps k -> ak on Z_n, sign map, reduction maps Z -> Z_n; answers as explicit sets or named subgroups"
      - id: kp2
        name: "Kernels are normal; injectivity criterion"
        key_prerequisites: [homomorphisms-intro, normal-subgroups]
        exemplars:
          - problem: "Let $\\varphi: S_3 \\to \\mathbb{Z}_2$ be the sign homomorphism, sending even permutations to $0$ and odd permutations to $1$. Take $k = (1\\,2\\,3)$ and $g = (1\\,3)$. Compute $\\varphi(g k g^{-1})$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The homomorphism law gives $\\varphi(g k g^{-1}) = \\varphi(g) \\varphi(k) \\varphi(g)^{-1}$. Since $k$ is a 3-cycle, it is even, so $\\varphi(k) = 0$. Thus the product is $\\varphi(g) \\cdot 0 \\cdot \\varphi(g)^{-1} = 0$. Step 2: Direct check: $g k g^{-1} = (1\\,3)(1\\,2\\,3)(1\\,3) = (1\\,3\\,2)$, an even permutation, so its sign is $0$. The computed value is $0$."
          - problem: "Let $\\varphi: \\mathbb{Z}_{10} \\to \\mathbb{Z}_{10}$ be defined by $\\varphi(x) = 3x \\bmod 10$. Apply the injectivity criterion to decide whether $\\varphi$ is injective, and find the size of $\\ker \\varphi$. State the verdict and the kernel size."
            answer: "verdict = injective; ksize = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["injective"], ["noninjective"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "ksize"}]}
            solution_sketch: "Step 1: State the injectivity criterion: $\\varphi$ is injective if and only if $\\ker \\varphi = \\{0\\}$. Step 2: Compute the kernel: solve $3x \\equiv 0 \\pmod{10}$. Since $\\gcd(3,10)=1$, multiply by the inverse $7$ to get $x \\equiv 0 \\pmod{10}$. Thus $\\ker \\varphi = \\{0\\}$, which has size $1$. Step 3: Because the kernel is trivial, $\\varphi$ is injective. Answer: verdict = injective; ksize = 1."
          - problem: "Let $\\varphi: \\mathbb{Z}_8 \\to \\mathbb{Z}_8$ be defined by $\\varphi(x) = 2x \\bmod 8$. Determine whether $\\varphi$ is injective from the kernel, and give the number of elements in $\\ker \\varphi$. State the verdict and the kernel size."
            answer: "verdict = noninjective; ksize = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["injective"], ["noninjective"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "ksize"}]}
            solution_sketch: "Step 1: Compute the kernel: $2x \\equiv 0 \\pmod{8}$ means $8$ divides $2x$, so $4$ divides $x$. The solutions in $\\mathbb{Z}_8$ are $x = 0$ and $x = 4$, so $\\ker \\varphi = \\{0,4\\}$. Step 2: Apply the injectivity criterion: since the kernel is not $\\{0\\}$, $\\varphi$ is not injective. The kernel has $2$ elements. Answer: verdict = noninjective; ksize = 2."
          - problem: "Let $\\varphi: \\mathbb{Z}_{15} \\to \\mathbb{Z}_{15}$ be defined by $\\varphi(x) = 5x \\bmod 15$. Find the number of elements in $\\ker \\varphi$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The kernel condition is $5x \\equiv 0 \\pmod{15}$, so $15$ divides $5x$. Dividing by $5$ gives $3$ divides $x$. Step 2: In $\\mathbb{Z}_{15}$, the multiples of $3$ are $0, 3, 6, 9, 12$. There are $5$ such elements. The number of elements in the kernel is $5$."
          - problem: "For a group homomorphism $\\varphi: G \\to H$, which condition on the kernel is equivalent to $\\varphi$ being injective? Select the correct condition."
            answer: "kernel is trivial"
            answer_contract: {"kind": "label", "options": [["kernel is trivial"], ["kernel is whole G"], ["kernel is normal"], ["kernel has size 2"]]}
            solution_sketch: "Step 1: The injectivity criterion states that $\\varphi$ is injective if and only if its kernel contains only the identity element, which is the trivial condition. Step 2: The option 'kernel is whole G' would mean every element maps to the identity, so $\\varphi$ is constant and not injective unless $G$ is trivial. Step 3: The option 'kernel is normal' is true for every homomorphism, so it does not characterize injectivity. Step 4: The option 'kernel has size 2' describes a nontrivial kernel, which makes $\\varphi$ noninjective. The correct condition is kernel is trivial."
          - problem: "Let $\\varphi: \\mathbb{Z}_{12} \\to \\mathbb{Z}_{12}$ be defined by $\\varphi(x) = 8x \\bmod 12$. Find the number of elements in $\\ker \\varphi$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The kernel condition is $8x \\equiv 0 \\pmod{12}$, so $12$ divides $8x$. Dividing by $4$ gives $3$ divides $2x$, so $3$ divides $x$. Step 2: In $\\mathbb{Z}_{12}$, the multiples of $3$ are $0, 3, 6, 9$. There are $4$ elements. The number of elements in the kernel is $4$."
        constraints: "the two standard lemmas, proved from the definitions"
      - id: kp3
        name: "Counting with |G| = |ker||im|"
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: 'A homomorphism $\varphi : G \to H$ has $|G| = 24$ and $|\ker \varphi| = 4$. How many elements does the image have?'
            answer: "6"
            solution_sketch: 'Cosets of the kernel biject with image points: $|\mathrm{im}\,\varphi| = |G|/|\ker\varphi| = 24/4 = 6$.'
          - problem: "A homomorphism $\\varphi : G \\to H$ has $|G| = 40$, and the image of $\\varphi$ contains $8$ elements. How many elements of $G$ map to each single element of the image?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the map with |G| = 40 and |im| = 8. Fibers of a homomorphism are cosets of the kernel, so every fiber has the same size. Counting gives |G| = |im| times the fiber size, so the fiber size is 40/8. Each element of the image has exactly 5 preimages. Answer: 5."
          - problem: "A homomorphism $\\varphi : G \\to H$ has $|G| = 48$ and $|\\ker \\varphi| = 6$. Find the number of elements in $\\operatorname{im} \\varphi$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The counting formula for the full map gives |G| = |ker| times |im|. Substitute |G| = 48 and |ker| = 6, so |im| = 48/6. Dividing gives the image size. The image has 8 elements. Answer: 8."
          - problem: "A homomorphism $\\varphi : G \\to H$ is defined on a group of order $42$, and its image has $6$ elements. Find $|\\ker \\varphi|$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The counting formula |G| = |ker| times |im| rearranges to |ker| = |G| / |im|. With |G| = 42 and |im| = 6 this gives 42/6. The kernel has 7 elements. Answer: 7."
          - problem: "Let $\\varphi : \\mathbb{Z}_{60} \\to \\mathbb{Z}_{60}$ be the map $\\varphi(x) = 8x \\bmod 60$. Find $|\\ker \\varphi|$ and $|\\operatorname{im} \\varphi|$, and give them in the form ker = a; im = b."
            answer: "ker = 4; im = 15"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "ker"}, {"contract": {"kind": "exact"}, "name": "im"}]}
            solution_sketch: "Full result: ker = 4; im = 15. The image of the map x -> 8x mod 60 on Z_60 is the subgroup generated by gcd(8, 60) = 4, so it has 60/4 = 15 elements. The kernel is the set of x with 60 dividing 8x, which is {0, 15, 30, 45}, so |ker| = 4. Check with the counting formula: 4 times 15 = 60 = |Z_60|, so ker = 4; im = 15."
          - problem: "A group $G$ has order $27$, and $\\varphi : G \\to H$ is a homomorphism that is not injective. What is the smallest possible value of $|\\ker \\varphi|$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The counting formula |G| = |ker| times |im| shows that |ker| divides |G| = 27. If |ker| = 1 the map is injective, which is excluded here. The smallest divisor of 27 greater than 1 is 3, and a map with image of order 9 achieves it. The smallest possible value of |ker| is 3. Answer: 3."
        constraints: "fiber/counting problems with |G| <= 60"
    diagnostic_exemplar:
      problem: 'For $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$, $\varphi(x) = 4x \bmod 12$: compute $\ker \varphi$ and $\mathrm{im}\,\varphi$, check that $|\ker \varphi| \cdot |\mathrm{im}\,\varphi| = 12$, and say whether $\varphi$ is injective.'
      answer: '$\ker \varphi = \{0, 3, 6, 9\}$ and $\mathrm{im}\,\varphi = \{0, 4, 8\}$, so $4 \cdot 3 = 12$. $\varphi$ is not injective: the kernel is bigger than $\{0\}$ (for instance $\varphi(3) = \varphi(0) = 0$), and a homomorphism is injective exactly when its kernel is trivial.'
      answer_contract: {kind: none}
      solution_sketch: '$4x \equiv 0 \pmod{12}$ iff $3 \mid x$; the image consists of the multiples of $\gcd(4,12) = 4$. Then apply the kernel criterion for injectivity.'
    anki_seeds:
      - front: "$\\ker \\varphi$ for a group homomorphism is always a ______ of the domain."
        back: "Normal subgroup."
        type: basic
      - front: "Injectivity criterion for a group homomorphism?"
        back: "$\\varphi$ is injective iff $\\ker \\varphi = \\{e\\}$."
        type: basic
      - front: "Size relation among domain, kernel, image of a homomorphism (finite)?"
        back: "$|G| = |\\ker \\varphi| \\cdot |\\mathrm{im}\\, \\varphi|$."
        type: basic

  - id: first-isomorphism-theorem
    name: "The First Isomorphism Theorem"
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: kernels-images
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: "Statement and the induced map"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: "Let phi from Z_18 to Z_18 be given by phi(x) = 6x. The first isomorphism theorem identifies the quotient of Z_18 by ker phi with im phi via the induced map. Compute the number of elements of ker phi."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (kernel definition): ker phi is the set of x in Z_18 with 6x = 0 in Z_18, that is, 18 divides 6x. Step 2 (solve the congruence): this holds exactly when 3 divides x, so ker phi is the set 0, 3, 6, 9, 12, 15, of order gcd(6, 18) = 6. The answer is 6."
          - problem: "Let phi from Z_15 to Z_15 be given by phi(x) = 5x, so ker phi is the set 0, 3, 6, 9, 12. The induced map on cosets must give the same value for any two representatives of one coset. Take a and b = a + 3, which lie in the same coset of ker phi. Compute phi(b) minus phi(a) in Z_15."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (coset representatives): a and b = a + 3 lie in the same coset of ker phi, since 3 lies in ker phi. Step 2 (difference of values): phi(b) - phi(a) = 5(a + 3) - 5a = 15, which is 0 in Z_15. Representatives of one coset give equal values, which is exactly the well-definedness of the induced map. The answer is 0."
          - problem: "Let phi from Z_10 to Z_10 be given by phi(x) = 2x. The kernel of phi is the set of elements sent to 0. A homomorphism is one-to-one exactly when its kernel holds only the identity. Give the verdict on whether phi is one-to-one and the number of elements of ker phi."
            answer: "verdict = noninjective; order = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["injective"], ["noninjective"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "order"}]}
            solution_sketch: "Step 1 (kernel computation): ker phi is the set of x in Z_10 with 2x = 0 in Z_10, that is the set 0 and 5, so its order is 2. Step 2 (one-to-one criterion): a homomorphism is one-to-one exactly when its kernel holds only the identity, and 5 is a nonidentity kernel element, so phi is not one-to-one. The option injective is the error of ignoring the kernel element 5. The answer is verdict = noninjective; order = 2."
          - problem: "Let phi from Z_9 to Z_9 be given by phi(x) = 3x, so ker phi is the set 0, 3, 6. Surjectivity of the induced map onto im phi means every element of im phi is the image of a whole coset. The element 6 lies in im phi. Give the smallest x in Z_9 such that the coset x plus ker phi maps to 6 under the induced map."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the induced map): the coset x plus ker phi is sent to phi(x) = 3x in Z_9. Step 2 (solve): 3x = 6 in Z_9 gives x = 2, 5 or 8, which form the single coset 2 plus ker phi. Step 3 (surjectivity): the image of this coset is 6, and every element of im phi, namely the set 0, 3, 6, arises in this way. The answer is 2."
          - problem: "Claim: the map phi bar from G over K to im phi, given by phi bar of gK = phi(g), where K = ker phi, is well defined. Step 1: suppose gK = hK. Step 2: then g = h. Step 3: hence phi(g) = phi(h), so the value does not depend on the chosen representative. Step 4: the map phi bar is well defined. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup: two representatives of one coset are taken. Step 2 is the first error: from gK = hK one gets h inverse g in K, and g = h follows only when the kernel is trivial, which is not assumed. Step 3 would be correct if the missing line placed the difference in the kernel. Step 4 merely restates the claim. The answer is Step 2."
          - problem: "To prove that phi bar is well defined, one assumes gK = hK for two representatives g and h of one coset. The next line of the proof is missing, and from it one derives phi(g) = phi(h), so the value is independent of the representative. Select the missing line."
            answer: "h inverse g lies in K"
            answer_contract: {"kind": "label", "options": [["h inverse g lies in K"], ["g and h are equal"], ["K is a normal subgroup"], ["phi is injective"]]}
            solution_sketch: "Step 1 (coset equality): gK = hK means exactly that the quotient h inverse g of the representatives lies in the kernel K. Step 2 (apply phi): then phi(h) inverse phi(g) = phi of h inverse g is the identity, so phi(g) = phi(h), which is the needed independence of the representative. The wrong option g and h are equal confuses coset equality with equality of representatives, true only for a trivial kernel. The wrong option K is a normal subgroup is true but is not the computational line used here. The wrong option phi is injective is a property of a different map and is not assumed. The answer is h inverse g lies in K."
          - problem: "Write the full proof: for a group homomorphism phi from G to H with kernel K, the induced map phi bar from G/K to im phi, given by phi bar of gK = phi(g), is a well-defined isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (well defined): if gK = hK, then h inverse g lies in K, so phi(h) inverse phi(g) = phi(h inverse g) = e, hence phi(g) = phi(h); the value does not depend on the representative. Step 2 (homomorphism): phi bar of (gK)(hK) = phi bar of ghK = phi(gh) = phi(g)phi(h), since phi is a homomorphism and the product of cosets is the coset of the product. Step 3 (injective): if phi bar of gK = phi bar of hK, then phi(g) = phi(h), so phi(h inverse g) = e, so h inverse g lies in K, so gK = hK. Step 4 (surjective onto im phi): every element of im phi has the form phi(g) for some g in G, and it equals phi bar of gK. Step 5 (conclusion): phi bar is a bijective homomorphism, hence an isomorphism from G/K onto im phi, which is the first isomorphism theorem."
        constraints: "statement, well-definedness, injectivity, surjectivity — one step at a time"
      - id: kp2
        name: "Identifying quotients via a good homomorphism"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: "Let f be the reduction map from Z to Z_9, given by f(x) = x mod 9. By the first isomorphism theorem, Z/ker f is isomorphic to Z_9. Give the smallest positive integer in ker f."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduction mod 9 preserves addition, so it is a homomorphism (homomorphism check). Its kernel is 9Z, the multiples of 9 (kernel computation). The first isomorphism theorem then gives Z/9Z isomorphic to Z_9 (first isomorphism theorem). The smallest positive integer in ker f is 9."
          - problem: "Let sgn be the sign homomorphism from S_4 to {1, -1}; it is onto, and its kernel is A_4. By the first isomorphism theorem, S_4/A_4 is isomorphic to Z_k for some k. Give k."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sign map is a homomorphism since sgn of a product is the product of the signs (homomorphism check). It is onto, because sgn of the identity is 1 and sgn of a transposition is -1 (surjectivity). Its kernel is A_4, so the first isomorphism theorem identifies S_4/A_4 with the two-element group {1, -1}, which is Z_2 (first isomorphism theorem). Hence k is 2."
          - problem: "Let f: Z_12 → Z_12 be f(x) = 4x; this is a homomorphism with kernel {0, 3, 6, 9}. By the first isomorphism theorem, the quotient Z_12/{0, 3, 6, 9} is isomorphic to the image of f. Give the number of elements of this quotient group."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The power map f(x) = 4x sends x to 4x mod 12 and preserves addition, so it is a homomorphism (homomorphism check). The first isomorphism theorem identifies Z_12/{0, 3, 6, 9} with the image of f (first isomorphism theorem). The image is {0, 4, 8}, which has 3 elements (image computation). The quotient group has 3 elements."
          - problem: "Let f: Z_10 → Z_10 be f(x) = 2x; this is a homomorphism with kernel {0, 5}. By the first isomorphism theorem, Z_10/{0, 5} is isomorphic to Z_m for some m. Give m."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map f(x) = 2x preserves addition mod 10, so it is a homomorphism (homomorphism check). Its kernel is {0, 5} (kernel computation). By the first isomorphism theorem, Z_10/{0, 5} is isomorphic to the image of f, which is {0, 2, 4, 6, 8}, a cyclic group of order 5 (first isomorphism theorem). Thus m is 5."
          - problem: "Claim: Z_6/{0, 3} is isomorphic to Z_3. Step 1: f(x) = 2x is a homomorphism of Z_6. Step 2: ker f = {0, 3}. Step 3: the image of f is {0, 2, 4, 6}. Step 4: the image is cyclic of order 3, so by the first isomorphism theorem Z_6/{0, 3} is isomorphic to Z_3. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: f(x) = 2x preserves addition mod 6 (homomorphism check). Step 2 is valid: 2x = 0 mod 6 forces x = 0 or 3, so ker f = {0, 3} (kernel computation). Step 3 is the first invalid step: the residues mod 6 are 0 to 5, and f takes only the values 0, 2, 4, so the image is {0, 2, 4}, not {0, 2, 4, 6}; the value 6 is not a residue mod 6 (image computation error). Step 4 is wrong only because it builds on Step 3. The answer is Step 3."
          - problem: "We work in Z_6 with addition modulo 6. To identify the quotient Z_6/{0, 2, 4} by the first isomorphism theorem, we need a homomorphism f from Z_6 to itself whose kernel is {0, 2, 4}. Which choice of f works?"
            answer: "f(x) = 3x"
            answer_contract: {"kind": "label", "options": [["f(x) = 3x"], ["f(x) = 2x"], ["f(x) = 4x"], ["f(x) = 5x"]]}
            solution_sketch: "Test each candidate by solving f(x) = 0 mod 6 (kernel computation). The map f(x) = 2x has kernel {0, 3}, the error of halving the modulus by the wrong factor. The map f(x) = 4x also has kernel {0, 3}, the error of using a multiplier that is not the subgroup generator. The map f(x) = 5x has kernel {0}, the error of using a unit invertible mod 6. For f(x) = 3x, the equation 3x = 0 mod 6 holds exactly when x is even, giving kernel {0, 2, 4}. The answer is f(x) = 3x."
          - problem: "Write the full proof: the quotient of D_4 by its rotation subgroup is isomorphic to Z_2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (choose the map): let ψ: D_4 → Z_2 send each rotation r^k to 0 and each reflection r^k s to 1. Step 2 (homomorphism check): a product of two rotations is a rotation, a product of a rotation and a reflection is a reflection, and a product of two reflections is a rotation; this matches addition mod 2, so ψ(gh) = ψ(g) + ψ(h) for all g, h. Step 3 (onto): ψ(r) = 0 and ψ(s) = 1, so the image is all of Z_2. Step 4 (kernel): the kernel is exactly the rotation subgroup {e, r, r^2, r^3}. Step 5 (first isomorphism theorem): D_4 with the rotation subgroup factored out is isomorphic to Z_2, so the quotient is cyclic of order 2."
        constraints: "quotients of Z, Z_n, S_n, D_n realized by reduction, sign, or power maps"
      - id: kp3
        name: "Existence and counting consequences"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: "Let $\\varphi: G \\to H$ be a surjective homomorphism, where $G$ is a finite group of order $24$ and $\\ker\\varphi$ has order $6$. By the first isomorphism theorem, what is the order of $H$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (first isomorphism theorem): since $\\varphi$ is surjective, $H \\cong G/\\ker\\varphi$, so $|H| = |G|/|\\ker\\varphi|$. Step 2 (substitution): $|H| = 24/6$. The order of $H$ is 4."
          - problem: "Is there a surjective homomorphism from $\\mathbb{Z}_9$ to $\\mathbb{Z}_4$? Decide, and give the order that the image of such a homomorphism would have."
            answer: "verdict = impossible; order = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["possible"], ["impossible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "order"}]}
            solution_sketch: "Step 1 (image order): a surjection $\\mathbb{Z}_9 \\to \\mathbb{Z}_4$ would have image of order $|\\mathbb{Z}_4| = 4$. Step 2 (counting consequence): by the first isomorphism theorem the image is isomorphic to a quotient of $\\mathbb{Z}_9$, so its order divides $9$. Step 3 (divisibility check): $4$ does not divide $9$, so no such surjection exists. So verdict = impossible; order = 4."
          - problem: "Let $\\varphi: \\mathbb{Z}_{30} \\to \\mathbb{Z}_5$ be a surjective homomorphism. By the first isomorphism theorem, how many elements does $\\ker\\varphi$ have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (first isomorphism theorem): $\\mathbb{Z}_5 \\cong \\mathbb{Z}_{30}/\\ker\\varphi$, so $|\\ker\\varphi| = |\\mathbb{Z}_{30}|/|\\mathbb{Z}_5| = 30/5$. Step 2 (division): $|\\ker\\varphi| = 6$. The kernel has 6 elements."
          - problem: "Does a surjective homomorphism from $\\mathbb{Z}_{12}$ onto $\\mathbb{Z}_6$ exist? Decide, and give the order of the kernel of such a homomorphism."
            answer: "verdict = possible; kernel = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["possible"], ["impossible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "kernel"}]}
            solution_sketch: "Step 1 (necessary order): a surjection $\\mathbb{Z}_{12} \\to \\mathbb{Z}_6$ would need $|\\ker\\varphi| = 12/6 = 2$. Step 2 (construction): the subgroup $\\{0, 6\\}$ of $\\mathbb{Z}_{12}$ has order $2$, and the quotient $\\mathbb{Z}_{12}/\\{0,6\\}$ is cyclic of order $6$, so the natural projection is a surjection with that kernel. So verdict = possible; kernel = 2."
          - problem: "An attempted proof claims that a surjective homomorphism $\\mathbb{Z}_{10} \\to \\mathbb{Z}_4$ exists. Step 1: by the first isomorphism theorem the image is isomorphic to a quotient of $\\mathbb{Z}_{10}$, and the image would have order $4$. Step 2: the kernel would then have order $10/4$. Step 3: an order need not be a whole number, so this is no obstruction. Step 4: therefore the surjection exists. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 restates the first isomorphism theorem and is valid. Step 2 performs the division $10/4$ correctly and is valid arithmetic. Step 3 is the first invalid step: the order of a kernel is always a whole number, so a kernel of order $10/4$ is impossible, and the right conclusion is that no surjection exists. Step 4 is only a conclusion drawn from the false claim of Step 3. The answer is Step 3."
          - problem: "A proof that no surjective homomorphism $\\mathbb{Z}_{12} \\to \\mathbb{Z}_5$ exists is nearly complete. The image of a surjection onto $\\mathbb{Z}_5$ has order $5$, and by the first isomorphism theorem this order divides the order of $\\mathbb{Z}_{12}$. One line is still missing to reach the contradiction. Select the line that completes the proof."
            answer: "5 does not divide 12"
            answer_contract: {"kind": "label", "options": [["5 does not divide 12"], ["12 does not divide 5"], ["5 divides 12"], ["the kernel has order 12"]]}
            solution_sketch: "The image has order $5$ and divides $|\\mathbb{Z}_{12}| = 12$; the missing line is the contradiction: 5 does not divide 12. Option '12 does not divide 5' reverses which order divides which. Option '5 divides 12' asserts the false divisibility instead of refuting it. Option 'the kernel has order 12' misidentifies the kernel, whose order would be $12/5$, not $12$. The answer is: 5 does not divide 12."
          - problem: "Write the full proof: if $m$ and $n$ are positive integers such that $n$ does not divide $m$, then there is no surjective homomorphism from $\\mathbb{Z}_m$ to $\\mathbb{Z}_n$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): suppose, for contradiction, that $\\varphi: \\mathbb{Z}_m \\to \\mathbb{Z}_n$ is a surjective homomorphism. Step 2 (first isomorphism theorem): $\\mathbb{Z}_n \\cong \\mathbb{Z}_m/\\ker\\varphi$, so $n = |\\mathbb{Z}_n| = |\\mathbb{Z}_m|/|\\ker\\varphi| = m/|\\ker\\varphi|$. Step 3 (kernel is a subgroup): $\\ker\\varphi$ is a subgroup of $\\mathbb{Z}_m$ of order $m/n$. Step 4 (Lagrange): the order of a subgroup divides the order of the group, so $|\\ker\\varphi| = m/n$ divides $m$, which forces $n$ to divide $m$. Step 5 (conclusion): this contradicts the hypothesis that $n$ does not divide $m$; hence no surjective homomorphism from $\\mathbb{Z}_m$ to $\\mathbb{Z}_n$ exists."
        constraints: "existence/non-existence of surjections between groups of order <= 30"
    diagnostic_exemplar:
      problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$, $\varphi(x) = 3x$. Apply the first isomorphism theorem: what is $\mathbb{Z}_{12}/\{0,4,8\}$ isomorphic to?'
      answer: '$\mathbb{Z}_4$ (the image $\{0,3,6,9\}$ is cyclic of order $4$).'
      solution_sketch: '$\ker\varphi = \{0,4,8\}$ and $\mathrm{im}\,\varphi = \langle 3 \rangle \cong \mathbb{Z}_4$, so the quotient is $\mathbb{Z}_4$.'
    anki_seeds:
      - front: "First isomorphism theorem?"
        back: "$G/\\ker\\varphi \\cong \\mathrm{im}\\,\\varphi$ via $g\\ker\\varphi \\mapsto \\varphi(g)$."
        type: basic
      - front: "Strategy to identify a quotient $G/N$?"
        back: "Find a surjective homomorphism out of $G$ whose kernel is exactly $N$; the image is the quotient."
        type: basic

  - id: isomorphism-theorems-2-3
    name: "The Second and Third Isomorphism Theorems"
    core: false                # terminal theorem toolkit: nothing downstream assumes them (prime-maximal-ideals routes via quotient characterizations, verified in the re-audit)
    difficulty: 0.80
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: first-isomorphism-theorem
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.6
        key: true
      # kp3 (re-audit R-55) states the ring version of the first isomorphism theorem,
      # closing the untaught citation in quotient-rings' solution sketches.
      - id: quotient-rings
        weight: 0.5
        key: true
      - id: complex-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "The second (diamond) isomorphism theorem"
        key_prerequisites: [first-isomorphism-theorem, quotient-groups]
        exemplars:
          - problem: "In S_3 take H = the subgroup generated by the transposition (12) and N = A_3. The diamond has the four groups H, N, H intersect N, and HN. In the restrict-the-quotient-map proof, the quotient map from G to G/N is restricted to H, and the step that computes the image produces the group HN/N. Compute the order of HN/N."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Restrict the quotient map from G to G/N to H. Its image is HN/N and its kernel is H intersect N. Here H has order 2, N has order 3, and H intersect N is trivial, so HN has order 2*3/1 = 6, that is, HN = S_3. The quotient HN/N has order 6/3 = 2. The answer is 2."
          - problem: "In (Z, +) take H = 8Z and N = 12Z. The diamond has the four groups H, N, H intersect N, and HN. In the restrict-the-quotient-map proof, the map phi from H to HN/N sends h to hN, and the step that computes the kernel produces the group ker(phi) = H intersect N. Give the positive generator of ker(phi)."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The kernel of phi consists of the h in H with hN = N, that is, h in N, so ker(phi) = H intersect N. In Z, an intersection 8Z intersect 12Z consists of the common multiples of 8 and 12, generated by lcm(8,12) = 24. The other diamond group HN is generated by gcd(8,12) = 4. The answer is 24."
          - problem: "In (Z, +) take H = 9Z and N = 12Z. The diamond has the four groups H, N, H intersect N, and HN. In the restrict-the-quotient-map proof, the step that computes the image produces the group HN, the subgroup H + N generated by H and N together. Give the positive generator of HN."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The image of the restricted quotient map is HN/N, with numerator HN = H + N. In Z, the subgroup generated by 9Z and 12Z consists of all integer combinations of 9 and 12, which is generated by gcd(9,12) = 3. So HN = 3Z. The answer is 3."
          - problem: "In S_3 take H = the subgroup {e, (13)} and N = A_3. The diamond has the four groups H, N, H intersect N, and HN. In the restrict-the-quotient-map proof, the map phi from H to HN/N sends h to hN, and the step that evaluates phi at the transposition (13) produces the coset (13)N. Compute the order of the element phi((13)) in HN/N."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The kernel of phi is H intersect N, which is trivial since (13) is odd and A_3 contains only even permutations. Hence phi is injective on H, and the order of phi((13)) equals the order of (13), which is 2. Equivalently, HN = S_3 and G/N has order 2. The answer is 2."
          - problem: "Claim: in (Z, +) with H = 4Z and N = 6Z, the second isomorphism theorem gives 2Z/6Z isomorphic to 4Z/12Z. Step 1: HN = H + N, the subgroup generated by 4Z and 6Z, so HN = 2Z. Step 2: H intersect N consists of the common multiples of 4 and 6. Step 3: the least common multiple of 4 and 6 is 24, so H intersect N = 24Z. Step 4: therefore 2Z/6Z is isomorphic to 4Z/24Z, and both quotients have order 3. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: the sum 4Z + 6Z is generated by gcd(4,6) = 2, so HN = 2Z. Step 2 is the correct description of the intersection. Step 3 is the first invalid step: the least common multiple of 4 and 6 is 12, not 24, so H intersect N = 12Z. Step 4 inherits the error: 2Z/6Z and 4Z/12Z both have order 3, while 4Z/24Z would have order 6. The answer is Step 3."
          - problem: "In (Z, +) take H = 12Z and N = 20Z. The diamond has the four groups H, N, H intersect N, and HN. In the restrict-the-quotient-map proof, the final step applies the first isomorphism theorem and produces the isomorphism HN/N isomorphic to H/(H intersect N). Compute the order of H/(H intersect N), that is, the index of H intersect N in H."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the second isomorphism theorem, H/(H intersect N) has the same order as HN/N. In Z, H intersect N = 12Z intersect 20Z is generated by lcm(12,20) = 60, and HN is generated by gcd(12,20) = 4. The index of 60Z in 12Z is 60/12 = 5, matching the order of 4Z/20Z. The answer is 5."
          - problem: "Write the full proof: state and prove the second isomorphism theorem for groups. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: Let H be a subgroup of G and N a normal subgroup of G. Then HN is a subgroup of G, H intersect N is normal in H, and HN/N is isomorphic to H/(H intersect N). Step 1: HN is a subgroup, since N is normal: h1n1 h2n2 = h1h2 (h2^{-1} n1 h2) n2 lies in HN, and inverses hn)^{-1} = h^{-1}(h n^{-1} h^{-1}) lie in HN. Step 2: define phi from H to HN/N by phi(h) = hN. It is well defined, and phi(h1h2) = h1h2N = (h1N)(h2N), so phi is a homomorphism. Step 3: phi is onto, since every coset in HN/N has the form hnN = hN = phi(h). Step 4: the kernel is H intersect N, because phi(h) = N exactly when h lies in N, that is, h lies in H and in N. Step 5: H intersect N is normal in H as the kernel of a homomorphism. The first isomorphism theorem now gives HN/N isomorphic to H/(H intersect N), which completes the proof."
        constraints: "statement + the restrict-the-quotient-map proof; concrete instances in Z (gcd/lcm) and S_3 (H a transposition subgroup, N = A_3); every instance names all four groups in the diamond"
      - id: kp2
        name: "The third isomorphism theorem and the correspondence theorem"
        key_prerequisites: [quotient-groups, first-isomorphism-theorem]
        exemplars:
          - problem: 'State the third isomorphism theorem, and use it to identify $(\mathbb{Z}/12\mathbb{Z})\,/\,(4\mathbb{Z}/12\mathbb{Z})$.'
            answer: 'For $N \le K$ both normal in $G$: $(G/N)/(K/N) \cong G/K$ — the common $N$ cancels. Here $G = \mathbb{Z}$, $N = 12\mathbb{Z}$, $K = 4\mathbb{Z}$: the quotient is $\mathbb{Z}/4\mathbb{Z} \cong \mathbb{Z}_4$.'
            solution_sketch: 'Apply the cancellation statement directly; no element computation needed.'
          - problem: 'State the correspondence theorem for $G/N$, and use it to count the subgroups of $\mathbb{Z}_{12} = \mathbb{Z}/12\mathbb{Z}$.'
            answer: 'Subgroups of $G/N$ correspond bijectively to subgroups of $G$ containing $N$ (via $H \mapsto H/N$), and the correspondence preserves normality, indices, and containment. Subgroups of $\mathbb{Z}$ containing $12\mathbb{Z}$ are the $d\mathbb{Z}$ with $d \mid 12$: $d \in \{1, 2, 3, 4, 6, 12\}$, so $\mathbb{Z}_{12}$ has $6$ subgroups.'
            solution_sketch: 'Every subgroup of $\mathbb{Z}$ is $d\mathbb{Z}$; containing $12\mathbb{Z}$ means $d \mid 12$; count divisors.'
        constraints: "third-theorem identifications in Z and Z_n (n <= 24); correspondence used to count or list subgroups of Z_n via divisors; statements expected verbatim before use"
      - id: kp3
        name: "The first isomorphism theorem for rings"
        key_prerequisites: [quotient-rings, first-isomorphism-theorem]
        exemplars:
          - problem: "For the evaluation map phi: Z[x] -> Z with phi(p) = p(0), the kernel is an ideal generated by one polynomial of degree 1. Give that polynomial."
            answer: "x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map is phi: Z[x] -> Z, phi(p) = p(0). By the first isomorphism theorem for rings, the kernel is an ideal. Divide with remainder: p(x) = q(x)x + r with r in Z. Then p(0) = r, so p is in the kernel exactly when r = 0, which means x divides p. The kernel is generated by x."
          - problem: "For phi: R[x] -> C with phi(p) = p(i), divide p(x) = x^3 + 2x + 1 by x^2 + 1. Give the remainder."
            answer: "x+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map is phi: R[x] -> C, phi(p) = p(i). Divide p(x) = x^3 + 2x + 1 by x^2 + 1: p(x) = x(x^2 + 1) + (x + 1). The remainder is x + 1. Since i + 1 is not zero, p is not in the kernel; the kernel is generated by x^2 + 1."
          - problem: "For the reduction map phi: Z -> Z_12 with phi(a) = a mod 12, give the smallest positive integer in ker phi."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map is phi: Z -> Z_12, phi(a) = a mod 12. The kernel consists of integers a with a congruent to 0 mod 12, that is, the multiples of 12. The smallest positive multiple is 12. By the first isomorphism theorem, Z/12Z is isomorphic to Z_12."
          - problem: "For phi: Z[x] -> Z with phi(p) = p(2), the kernel is generated by one monic polynomial. Give that polynomial."
            answer: "x-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map is phi: Z[x] -> Z, phi(p) = p(2). Divide p by x - 2: p(x) = (x - 2)q(x) + r with r = p(2). The kernel is the set of p with p(2) = 0, so x - 2 divides p. The monic generator of the kernel is x - 2."
          - problem: "For phi: R[x] -> C with phi(p) = p(i), divide p(x) = x^4 + 1 by x^2 + 1. Give the remainder."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map is phi: R[x] -> C, phi(p) = p(i). Divide p(x) = x^4 + 1 by x^2 + 1: p(x) = (x^2 - 1)(x^2 + 1) + 2. The remainder is 2. Since p(i) = 2, p is not in the kernel."
          - problem: "Let phi: R[x] -> C be phi(p) = p(i). Divide p(x) = 2x^3 + x^2 + 4x + 5 by x^2 + 1 and write p(x) = (x^2 + 1)q(x) + (cx + d). Give c and d."
            answer: "c = 2; d = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Divide with remainder: 2x(x^2 + 1) = 2x^3 + 2x, and subtracting leaves x^2 + 2x + 5; then adding one copy of x^2 + 1 leaves the full remainder 2x + 4. So c = 2 and d = 4, and p(i) = 4 + 2i is not zero, so p is not in the kernel. The answer is c = 2; d = 4."
          - problem: "Write the full proof: the first isomorphism theorem for rings and its application to the evaluation map R[x] -> C at i. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let phi: R -> S be a ring homomorphism. Define ker phi = {r in R : phi(r) = 0}. If a, b are in ker phi, then phi(a - b) = phi(a) - phi(b) = 0 and phi(ra) = phi(r)phi(a) = 0, so ker phi is an ideal. Step 2: Define psi: R/ker phi -> im phi by psi(r + ker phi) = phi(r). It is well-defined because if r' - r is in ker phi, then phi(r') = phi(r). Step 3: It is a ring homomorphism: psi((r + I) + (s + I)) = psi(r + s + I) = phi(r) + phi(s), and similarly for multiplication. Step 4: It is injective because if phi(r) = 0, then r is in I, so r + I is the zero coset. It is surjective onto im phi by definition. Step 5: For phi: R[x] -> C, phi(p) = p(i), every a + bi is phi(a + bx), so phi is onto. Divide p by x^2 + 1: p = (x^2 + 1)q + (cx + d). If p(i) = 0, then ci + d = 0, so c = d = 0, hence p is in the ideal generated by x^2 + 1; conversely x^2 + 1 maps to 0. Thus ker phi is generated by x^2 + 1, and R[x]/<x^2 + 1> is isomorphic to C."
        constraints: "statement + applications via evaluation and reduction maps: Z[x] -> Z, Z -> Z_n, R[x] -> C; the kernel identified by a division-with-remainder argument, not asserted"
    diagnostic_exemplar:
      problem: 'In $(\mathbb{Z}, +)$ take $H = 6\mathbb{Z}$ and $N = 10\mathbb{Z}$. Use the second isomorphism theorem to identify $6\mathbb{Z}/30\mathbb{Z}$, then use the third isomorphism theorem to identify $(\mathbb{Z}/30\mathbb{Z})\,/\,(6\mathbb{Z}/30\mathbb{Z})$.'
      answer: '$H + N = 2\mathbb{Z}$ (integer combinations of $6$ and $10$ are the multiples of $\gcd(6,10) = 2$) and $H \cap N = 30\mathbb{Z}$ (common multiples, $\mathrm{lcm}(6,10) = 30$). The second isomorphism theorem gives $(H+N)/N \cong H/(H \cap N)$, i.e. $2\mathbb{Z}/10\mathbb{Z} \cong 6\mathbb{Z}/30\mathbb{Z}$; both are cyclic of order $5$, so $6\mathbb{Z}/30\mathbb{Z} \cong \mathbb{Z}_5$. Since $30\mathbb{Z} \subseteq 6\mathbb{Z}$, the third isomorphism theorem cancels the common $30\mathbb{Z}$: $(\mathbb{Z}/30\mathbb{Z})/(6\mathbb{Z}/30\mathbb{Z}) \cong \mathbb{Z}/6\mathbb{Z} \cong \mathbb{Z}_6$.'
      solution_sketch: 'In $\mathbb{Z}$, the sum of two subgroups is generated by the gcd and the intersection by the lcm. Apply the diamond theorem, then cancel $30\mathbb{Z}$ with the third theorem.'
    anki_seeds:
      - front: "Second (diamond) isomorphism theorem?"
        back: "$H \\le G$, $N \\trianglelefteq G$: $\\ HN/N \\cong H/(H \\cap N)$."
        type: basic
      - front: "Third isomorphism theorem?"
        back: "$N \\le K$ both normal in $G$: $\\ (G/N)/(K/N) \\cong G/K$ — cancel the common $N$."
        type: basic
      - front: "First isomorphism theorem for rings?"
        back: "$R/\\ker\\varphi \\cong \\mathrm{im}\\,\\varphi$ as rings; the kernel of a ring homomorphism is an ideal."
        type: basic

