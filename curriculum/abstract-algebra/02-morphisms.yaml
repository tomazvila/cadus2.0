      - id: kp1
        name: "Free groups and reduced words"
        key_prerequisites: [group-isomorphisms, cyclic-groups-generators]
        exemplars:
          - problem: 'In the free group $F(\{a, b\})$, reduce the word $a\,b\,b^{-1}\,a^{-1}\,b\,a$.'
            answer: '$ba$'
            solution_sketch: 'Cancel adjacent inverse pairs: $a(bb^{-1})a^{-1}ba = (aa^{-1})ba = ba$; no further cancellation is possible.'
          - problem: 'Identify the free group on one generator, $F(\{a\})$, up to isomorphism.'
            answer: '$(\mathbb{Z}, +)$'
            answer_contract: {kind: none}
            solution_sketch: 'Reduced words are exactly the powers $a^n$ ($n \in \mathbb{Z}$), and $a^m a^n = a^{m+n}$: the map $a^n \mapsto n$ is an isomorphism.'
        constraints: "words of length <= 8 on at most 2 generators; note F on >= 2 generators is nonabelian (ab and ba are distinct reduced words)"
      - id: kp2
        name: "The universal property: generators map freely"
        key_prerequisites: [group-isomorphisms]
        exemplars:
          - problem: 'How many homomorphisms are there from $F(\{a, b\})$ to $\mathbb{Z}_5$?'
            answer: "25"
            solution_sketch: 'Each of $a, b$ may map to any of the $5$ elements independently: $5^2 = 25$.'
          - problem: "How many homomorphisms are there from the free group $F(\\{a\\})$ to the group $\\mathbb{Z}_2 \\times \\mathbb{Z}_4$?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (universal property): a homomorphism out of the free group on one generator a is fixed freely by the image of a, and no relation restricts that image. Step 2 (count): the group Z_2 x Z_4 has 8 elements, so a has 8 possible images, and each choice extends to exactly one homomorphism. The number of homomorphisms is 8."
          - problem: "How many homomorphisms are there from the free group $F(\\{a, b, c\\})$ to $\\mathbb{Z}_3$?"
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (universal property): each of the three generators a, b, c maps freely to any element of Z_3, since a free group imposes no relation on the images. Step 2 (count): that gives 3 choices for each generator, so 3 times 3 times 3 = 27 homomorphisms. The answer is 27."
          - problem: "Let $F$ be the free group on $\\{a, b\\}$. Determine the number of homomorphisms from $F$ to $\\mathbb{Z}_8$."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (universal property): the images of the generators a and b may be chosen independently among the 8 elements of Z_8, because the free group has no relations to respect. Step 2 (count): 8 choices for a times 8 choices for b gives 8 times 8 = 64 homomorphisms. The number of homomorphisms is 64."
          - problem: "Unlike a free group, the cyclic group $\\mathbb{Z}_6$ has the relation $6 \\cdot 1 = 0$, which its generator's image must respect. How many group homomorphisms are there from $\\mathbb{Z}_6$ to $\\mathbb{Z}_4$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (constrained image): a homomorphism sends the generator 1 of Z_6 to an element x of Z_4 that must satisfy 6x = 0 in Z_4, that is 2x = 0 mod 4. Step 2 (solve): the solutions are x = 0 and x = 2, so only 2 of the 4 elements of Z_4 are legal images, in contrast with the free case where all 4 work. The number of homomorphisms is 2."
          - problem: "Determine the number of homomorphisms from $\\mathbb{Z}_5$ to $\\mathbb{Z}_8$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (constrained image): a homomorphism from Z_5 to Z_8 sends the generator 1 to an element x of Z_8 with 5x = 0 mod 8. Step 2 (solve): since gcd(5, 8) = 1, the only solution is x = 0, so only the trivial map exists; this contrasts sharply with the 8 free choices a homomorphism out of the free group on one generator would have into a group of order 8. The number of homomorphisms is 1."
        constraints: "hom counts |G|^(number of generators) with |G| <= 8; contrast with the constrained counts for Z_m -> Z_n"
      - id: kp3
        name: "Presentations by generators and relations"
        key_prerequisites: [dihedral-groups, quotient-groups]
        exemplars:
          - problem: "A group is given by the presentation <a | a^9 = e>. Which familiar group is it isomorphic to?"
            answer: "Z_9"
            answer_contract: {"kind": "label", "options": [["Z_9"], ["Z_3"], ["Z_18"], ["D_9"]]}
            solution_sketch: "Step 1 (quotient of a free group): the presentation <a | a^9 = e> is the free group on one letter modulo the normal closure of a^9, so every word reduces to a power a^i with 0 <= i < 9. Step 2 (cyclic recognition): one generator whose single relation caps its order at 9 gives the cyclic group of order 9. The distractor Z_3 misreads the exponent 9 as the order 3, Z_18 doubles that exponent, and D_9 attaches a reflection to a presentation that has only one generator. The presentation gives Z_9."
          - problem: "A group is given by <r, s | r^5 = s^2 = e, srs = r^(-1)>, where the last relation says that s turns r into its inverse. Which familiar group is it?"
            answer: "D_5"
            answer_contract: {"kind": "label", "options": [["D_5"], ["Z_10"], ["Z_5"], ["D_6"]]}
            solution_sketch: "Step 1 (relations cap the order): in <r, s | r^5 = s^2 = e, srs = r^(-1)> every word reduces to r^i s^j with 0 <= i < 5 and j in {0, 1}, so the group has at most 10 elements. Step 2 (dihedral recognition): a rotation of order 5 together with a reflection that inverts it is exactly the dihedral relation set, and the group is non-abelian. The distractor Z_10 assumes s commutes with r, Z_5 drops the reflection generator entirely, and D_6 misreads the rotation order as 6. The presentation gives D_5."
          - problem: "The presentation <a, b | a^2 = b^5 = e, ab = ba> has two commuting generators. Compute the order of the group it presents."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (normal forms): with ab = ba, a^2 = e and b^5 = e, every word reduces to a^i b^j with 0 <= i < 2 and 0 <= j < 5, so the relations cap the order at 2 times 5. Step 2 (direct product recognition): two commuting generators of exact orders 2 and 5 give the direct product Z_2 x Z_5, which has 2 times 5 elements. The order of the group is 10."
          - problem: "A group is given by <r, s | r^3 = s^2 = e, srs = r^(-1)>. How many elements does this group have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (relations cap the order): the relation srs = r^(-1) lets every word reduce to r^i s^j with 0 <= i < 3 and j in {0, 1}, so the group has at most 3 times 2 = 6 elements. Step 2 (dihedral recognition): a rotation of order 3 inverted by a reflection is exactly the symmetry group of the equilateral triangle, D_3, and all 6 normal forms are distinct, so the bound is attained. The group has 6 elements."
          - problem: "In the group given by <a, b | a^3 = b^4 = e, ab = ba>, the two generators commute and have exact orders 3 and 4. Compute the order of the element ab."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (direct product form): the commuting relations present the group as Z_3 x Z_4, with a matching (1, 0) and b matching (0, 1), so ab matches the pair (1, 1). Step 2 (order of a pair): the order of (1, 1) is the least common multiple of the coordinate orders, lcm(3, 4), and since 3 and 4 are coprime this is 12, so ab generates the whole group of order 12. The order of the element ab is 12."
          - problem: "In the group given by <r, s | r^4 = s^2 = e, srs = r^(-1)>, every element reduces to r^i s^j with 0 <= i < 4 and j = 0 or 1. How many elements of order 2 does this group have?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identify the group): the relations reduce every element to r^i s^j with 0 <= i < 4 and j in {0, 1}, which is the dihedral group D_4 of order 8. Step 2 (count the involutions): among the rotations only r^2 has order 2, since r and r^3 have order 4, while each of the four reflections s, rs, r^2 s, r^3 s has order 2. That gives 1 rotation plus 4 reflections of order 2. The group has 5 elements of order 2."
        constraints: "match presentations to Z_n, D_n (n <= 6), and Z_m x Z_n (via commuting generators); target orders <= 12; that the relations cap the order may be quoted"
    diagnostic_exemplar:
      problem: 'How many homomorphisms are there from the free group $F(\{a, b\})$ to $\mathbb{Z}_3$, and which group does the presentation $\langle x \mid x^5 = e \rangle$ define?'
      answer: '$3^2 = 9$ homomorphisms; the presentation defines $\mathbb{Z}_5$.'
      answer_contract: {kind: none}
      solution_sketch: 'Generators of a free group map freely; a single generator with $x^5 = e$ gives the cyclic group of order $5$.'
    anki_seeds:
      - front: "What is the free group $F(S)$?"
        back: "Reduced words in the generators $S$ and their inverses, multiplied by concatenation-then-cancellation; no relations hold except the forced ones."
        type: basic
      - front: "Free group on one generator?"
        back: "$F(\\{a\\}) \\cong (\\mathbb{Z}, +)$."
        type: basic
      - front: "Presentation of the dihedral group $D_n$?"
        back: "$\\langle r, s \\mid r^n = s^2 = e,\\ srs = r^{-1} \\rangle$."
        type: basic
