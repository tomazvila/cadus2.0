unit: morphisms
course: abstract-algebra
module: "Isomorphisms & the Isomorphism Theorems"
topics:
  - id: group-isomorphisms
    name: "Group Isomorphisms"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: homomorphisms-intro
        weight: 0.9
        key: true
      - id: functions-injective-surjective
        weight: 0.6
        key: true
      - id: cyclic-groups-generators
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Definition and verifying isomorphisms"
        key_prerequisites: [homomorphisms-intro, functions-injective-surjective]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z}_4 \to U(5)$ be given by $\varphi(k) = 2^k \bmod 5$, where $U(5) = \{1, 2, 3, 4\}$ is the group of units modulo $5$ under multiplication. Is $\varphi$ an isomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is an isomorphism", "isomorphism"], ["no", "it is not an isomorphism", "not an isomorphism"]]}
            solution_sketch: 'The powers $2^0, 2^1, 2^2, 2^3$ are $1, 2, 4, 3$ modulo $5$, so $\varphi$ takes four different values and is a bijection onto $U(5)$. Also $\varphi(j+k) = 2^{j+k} = 2^j \cdot 2^k = \varphi(j)\varphi(k)$, and $2^4 = 16 = 1$ modulo $5$ shows that $\varphi$ is well defined on $\mathbb{Z}_4$. A bijective homomorphism is an isomorphism, so the answer is yes.'
          - problem: 'The map $\varphi : \mathbb{Z}_n \to U(7)$, $\varphi(k) = 3^k \bmod 7$, is a well-defined bijective homomorphism for exactly one value of $n$. Find $n$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $k \mapsto 3^k$ is well defined on $\mathbb{Z}_n$ only if $3^n = 1$ modulo $7$, and it is injective only if no smaller power of $3$ equals $1$. So $n$ is the order of $3$ in $U(7)$. The powers $3, 2, 6, 4, 5, 1$ show that the first power equal to $1$ is $3^6$, and $U(7)$ has $6$ elements, so $n = 6$.'
          - problem: 'The map $\varphi : \mathbb{Z}_7 \to \mathbb{Z}_7$, $\varphi(k) = 3k \bmod 7$, is an isomorphism of the additive group $\mathbb{Z}_7$. Its inverse has the form $\psi(m) = am \bmod 7$ with $0 < a < 7$. Find $a$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse must satisfy $\psi(\varphi(k)) = a \cdot 3k = k$ modulo $7$ for every $k$, so $3a = 1$ modulo $7$. Since $3 \cdot 5 = 15 = 2 \cdot 7 + 1$, the multiplier is $a = 5$.'
          - problem: 'The map $\varphi : \mathbb{Z}_6 \to \mathbb{Z}_6$, $\varphi(k) = 2k \bmod 6$, is a homomorphism of the additive group $\mathbb{Z}_6$. How many elements of $\mathbb{Z}_6$ does $\varphi$ send to $0$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element $k$ goes to $0$ when $6$ divides $2k$, which happens exactly when $3$ divides $k$. In $\mathbb{Z}_6$ these elements are $0$ and $3$, so $\varphi$ sends $2$ elements to $0$. Since $\varphi(3) = \varphi(0)$, the map is not injective and so it is not an isomorphism.'
          - problem: 'A slide rule multiplies numbers by adding lengths. This works because $\varphi(x) = \log_{10} x$ is an isomorphism from $(\mathbb{R}_{>0}, \cdot)$ to $(\mathbb{R}, +)$. Two positive numbers $a$ and $b$ have $\varphi(a) = 3$ and $\varphi(b) = -2$. What is $\varphi(ab)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism turns a product into a sum, so $\varphi(ab) = \varphi(a) + \varphi(b)$. Here this is $3 + (-2) = 1$, which agrees with $a = 1000$ and $b = 0.01$ giving $ab = 10$ and $\log_{10} 10 = 1$.'
          - problem: 'On a slide rule, $\varphi(x) = \log_{10} x$ is an isomorphism from $(\mathbb{R}_{>0}, \cdot)$ to $(\mathbb{R}, +)$. Two positive numbers $a$ and $b$ have $\varphi(a) = 3$ and $\varphi(b) = -2$. What is $\varphi(a/b)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Division by $b$ is multiplication by $b^{-1}$, and an isomorphism sends inverses to inverses, so $\varphi(a/b) = \varphi(a) - \varphi(b)$. Here this is $3 - (-2) = 5$, so the quotient $a/b$ has logarithm $5$.'
          - problem: 'Let $\varphi : \mathbb{Z}_5 \to \mathbb{Z}_5$ be given by $\varphi(k) = k^2 \bmod 5$ on the additive group $\mathbb{Z}_5$. For $a = b = 1$, find $\varphi(a+b) - (\varphi(a) + \varphi(b))$ in $\mathbb{Z}_5$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\varphi(1+1) = \varphi(2) = 4$ and $\varphi(1) + \varphi(1) = 1 + 1 = 2$. So the difference is $4 - 2 = 2$, which is not $0$. Hence $\varphi$ is not a homomorphism, because $(a+b)^2 = a^2 + 2ab + b^2$.'
          - problem: 'Write the full proof that the map $\varphi : (\mathbb{R}, +) \to (\mathbb{R}_{>0}, \cdot)$, $\varphi(x) = 5^x$, is an isomorphism.'
            answer: 'The map is a bijective homomorphism.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For all real $x, y$ we have $\varphi(x+y) = 5^{x+y} = 5^x \cdot 5^y = \varphi(x)\varphi(y)$, so $\varphi$ is a homomorphism. If $5^x = 5^y$, then taking natural logarithms gives $x \ln 5 = y \ln 5$, and $\ln 5 \neq 0$, so $x = y$ and $\varphi$ is injective. For any $y > 0$ the number $x = \ln y / \ln 5$ satisfies $5^x = y$, so $\varphi$ is surjective. A bijective homomorphism is an isomorphism, and its inverse is $y \mapsto \ln y / \ln 5$.'
        constraints: "explicit maps between groups of order <= 8 or classic infinite examples (exp/log); full verification expected"
      - id: kp2
        name: "Properties preserved by isomorphisms"
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z}_6 \to \mathbb{Z}_2 \times \mathbb{Z}_3$ be the isomorphism $\varphi(k) = (k \bmod 2,\; k \bmod 3)$. What is the order of $\varphi(2)$ in $\mathbb{Z}_2 \times \mathbb{Z}_3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the definition of $\varphi$, $\varphi(2) = (0, 2)$. In $\mathbb{Z}_2 \times \mathbb{Z}_3$ the first coordinate $0$ has order $1$ and the second coordinate $2$ has order $3$, so the pair has order $\mathrm{lcm}(1, 3) = 3$. This agrees with the order of $2$ in $\mathbb{Z}_6$, because an isomorphism preserves orders.'
          - problem: 'Let $\varphi : \mathbb{Z}_6 \to \mathbb{Z}_2 \times \mathbb{Z}_3$ be the isomorphism $\varphi(k) = (k \bmod 2,\; k \bmod 3)$. What is $\varphi(0)$?'
            answer: '(0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'An isomorphism sends the identity of $\mathbb{Z}_6$ to the identity of $\mathbb{Z}_2 \times \mathbb{Z}_3$. The identity of the product is $(0, 0)$, which is also what the formula gives for $k = 0$.'
          - problem: 'Let $\varphi : \mathbb{Z}_6 \to \mathbb{Z}_2 \times \mathbb{Z}_3$ be the isomorphism $\varphi(k) = (k \bmod 2,\; k \bmod 3)$. What is $\varphi(-4)$?'
            answer: '(0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Since $-4 = 2$ in $\mathbb{Z}_6$, the formula gives $\varphi(-4) = (0, 2)$. The same answer follows from inverse preservation: $\varphi(4) = (0, 1)$, and the inverse of $(0, 1)$ in $\mathbb{Z}_2 \times \mathbb{Z}_3$ is $(0, 2)$.'
          - problem: 'The group $\mathbb{Z}_6$ is cyclic, and $\mathbb{Z}_2 \times \mathbb{Z}_3$ is isomorphic to it. How many elements of $\mathbb{Z}_2 \times \mathbb{Z}_3$ generate the whole group?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism sends generators to generators and its inverse does the same, so the two groups have the same number of generators. The generators of $\mathbb{Z}_6$ are $1$ and $5$, so $\mathbb{Z}_2 \times \mathbb{Z}_3$ has $2$ generators, namely $(1, 1)$ and $(1, 2)$.'
          - problem: 'The rotations of a regular $12$-gon form a group that is isomorphic to $\mathbb{Z}_{12}$, where the rotation by $30k$ degrees corresponds to $k$. A rotation by $120$ degrees is repeated until the polygon first returns to its starting position. How many rotations are made?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rotation by $120$ degrees corresponds to $k = 4$ in $\mathbb{Z}_{12}$, and an isomorphism preserves orders. The order of $4$ in $\mathbb{Z}_{12}$ is $12/\gcd(4, 12) = 3$, so $3$ rotations bring the polygon back, which matches $3 \cdot 120 = 360$ degrees.'
          - problem: 'The shifts of a $26$-letter alphabet form a group isomorphic to $\mathbb{Z}_{26}$, where a shift by $k$ letters corresponds to $k$. A shift by $10$ letters is applied again and again. How many shifts are needed before every letter is first back in its original place?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shift by $10$ letters corresponds to $10$ in $\mathbb{Z}_{26}$, and an isomorphism preserves orders. The order of $10$ in $\mathbb{Z}_{26}$ is $26/\gcd(10, 26) = 26/2 = 13$, so $13$ shifts are needed, and $13 \cdot 10 = 130 = 5 \cdot 26$.'
          - problem: 'The groups $G$ and $H$ are isomorphic, and $G$ has exactly $6$ elements of order $4$. How many elements of $H$ have order $4$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism $\varphi : G \to H$ keeps the order of every element, so it sends the $6$ elements of order $4$ of $G$ to elements of order $4$ of $H$. Because $\varphi$ is a bijection, no other element of $H$ has order $4$, so $H$ has exactly $6$ such elements.'
          - problem: 'The groups $G$ and $H$ are isomorphic and $G$ is abelian. Must $H$ be abelian?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, H is abelian", "it must be abelian", "H is abelian", "H must be abelian", "must be abelian", "yes, it must be abelian"], ["no", "no, H need not be abelian", "not necessarily", "H need not be abelian", "no, not necessarily"]]}
            solution_sketch: 'Let $\varphi : G \to H$ be an isomorphism and take $x, y \in H$. Because $\varphi$ is onto, $x = \varphi(a)$ and $y = \varphi(b)$ for some $a, b \in G$, and $xy = \varphi(ab) = \varphi(ba) = yx$ since $G$ is abelian. So $H$ is abelian, and the answer is yes.'
          - problem: 'A proof that $H$ is abelian when $\varphi : G \to H$ is an injective homomorphism and $G$ is abelian writes every $x$ in $H$ as $\varphi(a)$. Let $G = \mathbb{Z}_2$ and let $H = S_3$, which has $6$ elements, with $\varphi$ injective. How many elements of $H$ are not of the form $\varphi(a)$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $\mathbb{Z}_2$ has $2$ elements and $\varphi$ is injective, so the image has $2$ elements. The other $6 - 2 = 4$ elements of $S_3$ are not of the form $\varphi(a)$. So that proof fails, because it needs $\varphi$ to be onto.'
          - problem: 'Write the full proof that if $\varphi : G \to H$ is an isomorphism and $G$ is cyclic, then $H$ is cyclic.'
            answer: 'A generator maps to a generator.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $g$ generate $G$, and let $h \in H$. Since $\varphi$ is onto, $h = \varphi(x)$ for some $x \in G$, and $x = g^n$ for some integer $n$. By the homomorphism law, $h = \varphi(g^n) = \varphi(g)^n$. So every element of $H$ is a power of $\varphi(g)$, and $H$ is cyclic with generator $\varphi(g)$.'
        constraints: "standard preservation lemmas: identity, inverses, orders, abelian-ness, cyclicity"
      - id: kp3
        name: "Isomorphism as an equivalence; automorphisms"
        key_prerequisites: [homomorphisms-intro, functions-injective-surjective]
        exemplars:
          - problem: 'The map $\varphi(x) = 3x \bmod 10$ is an automorphism of the additive group $\mathbb{Z}_{10}$. Its inverse has the form $\varphi^{-1}(y) = cy \bmod 10$ with $0 < c < 10$. Find $c$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse must satisfy $\varphi(cy) = 3cy = y$ modulo $10$ for every $y$, so $3c = 1$ modulo $10$. Since $3 \cdot 7 = 21 = 1$ modulo $10$, the multiplier is $c = 7$.'
          - problem: 'How many automorphisms does the additive group $\mathbb{Z}$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An automorphism $f$ of $\mathbb{Z}$ satisfies $f(n) = n f(1)$, so it is determined by $f(1)$. To be onto, $f(1)$ must generate $\mathbb{Z}$, and the only generators are $1$ and $-1$. Both $n \mapsto n$ and $n \mapsto -n$ are bijective homomorphisms, so there are $2$ automorphisms.'
          - problem: 'The maps $\varphi(x) = 2x \bmod 11$ and $\psi(x) = 3x \bmod 11$ are automorphisms of $\mathbb{Z}_{11}$. Find the order of $\psi \circ \varphi$ in the group of automorphisms of $\mathbb{Z}_{11}$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is $\psi(\varphi(x)) = 3(2x) = 6x$ modulo $11$. Its $k$-th power is multiplication by $6^k$, so the order is the least $k$ with $6^k = 1$ modulo $11$. The powers $6, 3, 7, 9, 10, 5, 8, 4, 2, 1$ show that $k = 10$.'
          - problem: 'A combination dial has $15$ positions numbered $0$ to $14$, and turns add modulo $15$. The positions are relabeled by sending position $x$ to $kx \bmod 15$. The relabeling keeps the way turns add and gives every position its own new label exactly when $x \mapsto kx$ is an automorphism of $\mathbb{Z}_{15}$. For how many values of $k$ with $0 \le k \le 14$ does this happen?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $x \mapsto kx$ always keeps addition, so it is an automorphism exactly when it is a bijection. It is a bijection exactly when $\gcd(k, 15) = 1$. The values of $k$ are $1, 2, 4, 7, 8, 11, 13, 14$, so there are $8$ of them.'
          - problem: 'A dial has $10$ positions, and turns add modulo $10$. A technician relabels position $x$ as $3x \bmod 10$ and then relabels the result $y$ as $7y \bmod 10$. One single relabeling $x \mapsto cx \bmod 10$ with $0 \le c < 10$ does the same job. Find $c$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite sends $x$ to $7(3x) = 21x$, and $21 = 1$ modulo $10$. So the two relabelings together send $x$ to $x$, the single relabeling is the identity, and $c = 1$.'
          - problem: 'The map $\varphi(x) = 5x \bmod 12$ is an automorphism of the additive group $\mathbb{Z}_{12}$. Find the order of $\varphi$ in the group of automorphisms of $\mathbb{Z}_{12}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Applying $\varphi$ a total of $k$ times is multiplication by $5^k$, so the order is the least $k$ with $5^k = 1$ modulo $12$. Here $5^1 = 5$ and $5^2 = 25 = 1$ modulo $12$, so the order of $\varphi$ is $2$.'
          - problem: 'Find the smallest positive integer $k$ for which the map $x \mapsto kx \bmod 9$ is not an automorphism of the additive group $\mathbb{Z}_9$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $x \mapsto kx$ is a homomorphism for every $k$, and it is an automorphism exactly when $\gcd(k, 9) = 1$. The values $k = 1$ and $k = 2$ are coprime to $9$, but $\gcd(3, 9) = 3$ and $3 \cdot 3 = 0 = 3 \cdot 0$, so the map is not injective. The smallest failing value is $k = 3$.'
          - problem: 'The attempt below to show that the inverse of an isomorphism $\varphi : G \to H$ is an isomorphism has an error. Step 1: $\varphi$ is bijective, so the inverse function $\varphi^{-1}$ exists. Step 2: for $h_1, h_2 \in H$ write $h_1 = \varphi(g_1)$ and $h_2 = \varphi(g_2)$. Step 3: $h_1 h_2 = \varphi(g_1 g_2)$, so $\varphi^{-1}(h_1 h_2) = g_1 g_2 = \varphi^{-1}(h_1)\varphi^{-1}(h_2)$. Step 4: also $\varphi^{-1}(h_1 h_2) = \varphi^{-1}(h_2)\varphi^{-1}(h_1)$, which equals $\varphi^{-1}(h_1)\varphi^{-1}(h_2)$ in every group. Which is the first step that is not valid, and why?'
            answer: 'Step 4: the products with the factors in the two orders are different in a nonabelian group, so they are not equal in every group.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Steps 1, 2 and 3 are valid: the inverse function exists, preimages exist because $\varphi$ is onto, and the homomorphism law gives $\varphi^{-1}(h_1 h_2) = g_1 g_2$. Step 4 is false, because the two products $\varphi^{-1}(h_2)\varphi^{-1}(h_1)$ and $\varphi^{-1}(h_1)\varphi^{-1}(h_2)$ are different in a nonabelian group. The conclusion of Step 3 already finishes the proof.'
          - problem: 'Write the full proof that the automorphisms of a group $G$ form a group under composition.'
            answer: 'Automorphisms form a group.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'If $\varphi$ and $\psi$ are automorphisms, then $\psi(\varphi(ab)) = \psi(\varphi(a)\varphi(b)) = \psi(\varphi(a))\psi(\varphi(b))$, and a composite of bijections is a bijection, so $\psi \circ \varphi$ is an automorphism. Composition of functions is associative, and the identity map is an automorphism that acts as the identity element. For an automorphism $\varphi$ the inverse function is a bijection, and for $h_1 = \varphi(g_1)$ and $h_2 = \varphi(g_2)$ we get $\varphi^{-1}(h_1 h_2) = g_1 g_2 = \varphi^{-1}(h_1)\varphi^{-1}(h_2)$, so $\varphi^{-1}$ is an automorphism.'
        constraints: "closure of isomorphisms under inverse and composition; simple automorphisms of Z, Z_n"
    diagnostic_exemplar:
      problem: 'Exhibit an isomorphism $U(10) \to \mathbb{Z}_4$ and justify briefly.'
      answer: '$U(10) = \langle 3 \rangle$ with $3^1=3, 3^2=9, 3^3=7, 3^4=1$; send $3^k \mapsto k$. A generator-to-generator map of cyclic groups of equal order is an isomorphism.'
      solution_sketch: 'Both groups are cyclic of order $4$; matching generators gives $\varphi(3^k) = k \bmod 4$, which converts multiplication into addition of exponents.'
    anki_seeds:
      - front: "What is a group isomorphism?"
        back: "A bijective homomorphism; its inverse is automatically a homomorphism too."
        type: basic
      - front: "Name four properties preserved by isomorphism."
        back: "Group order, element orders, being abelian, being cyclic (any structural property)."
        type: basic

  - id: isomorphism-invariants
    name: "Proving Groups Non-Isomorphic"
    core: false                # technique feeding only the classification capstone
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: group-isomorphisms
        weight: 0.9
        key: true
      - id: direct-products
        weight: 0.5
        key: false
      - id: order-of-an-element
        weight: 0.5
        key: false
      # Phase C: kp2's named invariant is abelian-ness; verifying/refuting it is the
      # skill taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Order profiles as invariants"
        key_prerequisites: [group-isomorphisms, order-of-an-element]
        try_first:
          problem: 'How many elements of order $2$ does the cyclic group $\mathbb{Z}_8$ have?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Counting the elements of a given order is how two groups of the same size are told apart, because an isomorphism must match these counts exactly.'
        exemplars:
          - problem: 'The group $U(8) = \{1, 3, 5, 7\}$ has multiplication modulo $8$ as its operation. How many elements of order $2$ does $U(8)$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $1$ has order $1$. The squares are $3^2 = 9 = 1$, $5^2 = 25 = 1$ and $7^2 = 49 = 1$ modulo $8$, so each of $3, 5, 7$ has order $2$, and $U(8)$ has $3$ elements of order $2$.'
          - problem: 'How many elements of order $3$ does the group $\mathbb{Z}_3 \times \mathbb{Z}_3$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every element $(a, b)$ satisfies $3(a, b) = (0, 0)$, so its order is $1$ or $3$. Only $(0, 0)$ has order $1$, so the other $8$ elements all have order $3$.'
          - problem: 'The groups $\mathbb{Z}_6$ and $S_3$ both have order $6$. Are they isomorphic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic"]]}
            solution_sketch: 'An isomorphism keeps the number of elements of each order. In $\mathbb{Z}_6$ only the element $3$ has order $2$, while $S_3$ has three elements of order $2$, namely its three transpositions. The counts $1$ and $3$ differ, so the groups are not isomorphic.'
          - problem: 'How many elements of order $2$ does the symmetric group $S_3$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $S_3$ are the identity, two $3$-cycles and three transpositions. The transpositions have order $2$ and the $3$-cycles have order $3$, so $S_3$ has $3$ elements of order $2$.'
          - problem: 'Among the groups $\mathbb{Z}_8$, $\mathbb{Z}_4 \times \mathbb{Z}_2$, $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_2$ and $\mathbb{Z}_{12}$, which one has exactly $3$ elements of order $2$?'
            answer: 'the group Z_4 x Z_2'
            answer_contract: {"kind": "label", "options": [["the cyclic group Z_8", "Z_8", "Z8", "the group Z_8"], ["the group Z_4 x Z_2", "Z_4 x Z_2", "Z4 x Z2", "Z_4 × Z_2", "Z_4×Z_2", "Z4×Z2", "Z_4 \\times Z_2", "\\mathbb{Z}_4 \\times \\mathbb{Z}_2"], ["the group Z_2 x Z_2 x Z_2", "Z_2 x Z_2 x Z_2", "Z_2^3", "Z2^3", "Z2×Z2×Z2", "Z_2×Z_2×Z_2", "Z_2 \\times Z_2 \\times Z_2"], ["the cyclic group Z_12", "Z_12", "Z12"]]}
            solution_sketch: 'A cyclic group has at most one element of order $2$, so $\mathbb{Z}_8$ and $\mathbb{Z}_{12}$ each have exactly $1$. In $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_2$ every non-identity element has order $2$, giving $7$. In $\mathbb{Z}_4 \times \mathbb{Z}_2$ the elements $(2, 0)$, $(0, 1)$ and $(2, 1)$ have order $2$, so the answer is $\mathbb{Z}_4 \times \mathbb{Z}_2$ with $3$ such elements.'
          - problem: 'How many elements of order $6$ does the group $\mathbb{Z}_6 \times \mathbb{Z}_2$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $(a, b)$ is the least common multiple of the orders of $a$ in $\mathbb{Z}_6$ and $b$ in $\mathbb{Z}_2$. It equals $6$ when $a$ has order $3$ (two choices) and $b = 1$, giving $2$ elements, or when $a$ has order $6$ (two choices) and $b$ is either element, giving $4$ elements. In all there are $6$ elements of order $6$.'
          - problem: 'A dial has $12$ positions, and each press turns it by a fixed number of positions. The turn sizes form the group $\mathbb{Z}_{12}$. For how many turn sizes $k$ does the dial first return to its starting position after exactly $4$ presses?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A turn size $k$ returns the dial first after $4$ presses exactly when $k$ has order $4$ in $\mathbb{Z}_{12}$. These are the elements $3$ and $9$, since $4 \cdot 3 = 12$ and $4 \cdot 9 = 36 = 3 \cdot 12$, while smaller multiples are not multiples of $12$. So there are $2$ such turn sizes.'
          - problem: 'The symmetries of a rectangle that is not a square are the identity, the half-turn about its center, and the reflections in its two midlines. Besides the identity, how many of these symmetries return the rectangle to its starting position when applied twice?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The half-turn applied twice is a full turn, and each reflection applied twice is the identity, so all $3$ non-identity symmetries have this property. The four symmetries form a group of order $4$ with $3$ elements of order $2$. A rotation group of a square has just one element of order $2$, so the two groups differ.'
        constraints: "groups of order <= 12; distinguish via element-order counts"
      - id: kp2
        name: "Abelian-ness, cyclicity, and other structural invariants"
        key_prerequisites: [group-isomorphisms]
        exemplars:
          - problem: 'The groups $\mathbb{Z}_6$ and $S_3$ both have order $6$, and each has exactly two elements of order $3$. Which property of the groups shows that they are not isomorphic?'
            answer: 'being abelian'
            answer_contract: {"kind": "label", "options": [["being abelian", "abelian", "commutativity"], ["the group order", "order of the group", "size"], ["the number of elements of order 3", "number of elements of order 3"], ["the identity element", "identity"]]}
            solution_sketch: 'Isomorphic groups have the same order, and here both orders are $6$, so the order does not help. Both groups have exactly $2$ elements of order $3$, so counting those does not help either. The group $\mathbb{Z}_6$ is abelian but $S_3$ is not, because $(1\,2)(1\,3) \neq (1\,3)(1\,2)$, and being abelian is kept by isomorphisms.'
          - problem: 'The groups $\mathbb{Z}_8$ and $\mathbb{Z}_4 \times \mathbb{Z}_2$ are both abelian of order $8$. What is the largest order of an element of $\mathbb{Z}_4 \times \mathbb{Z}_2$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of $(a, b)$ is $\mathrm{lcm}$ of the orders of $a$ in $\mathbb{Z}_4$ and $b$ in $\mathbb{Z}_2$, which is at most $\mathrm{lcm}(4, 2) = 4$. The element $(1, 0)$ has order $4$, so the largest order is $4$. Since $\mathbb{Z}_8$ has an element of order $8$, the two groups are not isomorphic.'
          - problem: 'The groups $\mathbb{Z}_9$ and $\mathbb{Z}_3 \times \mathbb{Z}_3$ are both abelian of order $9$. What is the largest order of an element of $\mathbb{Z}_3 \times \mathbb{Z}_3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every element $(a, b)$ of $\mathbb{Z}_3 \times \mathbb{Z}_3$ satisfies $3(a, b) = (0, 0)$, so its order divides $3$. The element $(1, 0)$ has order $3$, so the largest order is $3$. The group $\mathbb{Z}_9$ has an element of order $9$, so the two groups are not isomorphic.'
          - problem: 'How many elements of the symmetric group $S_3$ commute with the transposition $(1\,3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A permutation $g$ commutes with $(1\,3)$ when $g(1\,3) = (1\,3)g$. The identity and $(1\,3)$ itself commute with it, and a check of the other four elements shows that none of them does. So exactly $2$ elements commute with $(1\,3)$, whereas in $\mathbb{Z}_6$ all $6$ elements commute with every element.'
          - problem: 'Is the additive group $\mathbb{Q}$ of rational numbers cyclic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is cyclic", "cyclic"], ["no", "it is not cyclic", "not cyclic"]]}
            solution_sketch: 'Suppose $\mathbb{Q}$ were generated by a rational number $g$, and $g \neq 0$ because $\{0\}$ is not all of $\mathbb{Q}$. Then $g/2$ would equal $ng$ for some integer $n$, which gives $n = 1/2$, and this is impossible. So no single element generates $\mathbb{Q}$, and the answer is no.'
          - problem: 'The rotations of a regular $12$-gon form a cyclic group of order $12$. How many different rotations of the $12$-gon, repeated again and again, bring the $12$-gon to every one of its $12$ rotated positions?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A rotation reaches every position exactly when it generates the group of $12$ rotations. In $\mathbb{Z}_{12}$ the generators are the elements coprime to $12$, namely $1, 5, 7, 11$. So $4$ rotations, those by $30$, $150$, $210$ and $330$ degrees, have this property.'
          - problem: 'The four symmetries of a rectangle that is not a square are the identity, the half-turn and two reflections. For each symmetry, count how many times it must be applied in a row before the rectangle is first back in its starting position. What is the largest of these four counts?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The half-turn and each reflection return the rectangle to its start after $2$ applications, and the identity after $1$. A cyclic group of order $4$ would need a symmetry that needs $4$ applications. The largest number is $2$, so the group of symmetries is not cyclic.'
        constraints: "one clean invariant per problem; include one infinite-group example per set"
      - id: kp3
        name: "Full comparisons of small groups"
        key_prerequisites: [group-isomorphisms, direct-products]
        exemplars:
          - problem: 'Is the group $\mathbb{Z}_6$ isomorphic to $\mathbb{Z}_2 \times \mathbb{Z}_3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic"]]}
            solution_sketch: 'The element $(1, 1)$ of $\mathbb{Z}_2 \times \mathbb{Z}_3$ has order $\mathrm{lcm}(2, 3) = 6$, which is the order of the whole group, so $\mathbb{Z}_2 \times \mathbb{Z}_3$ is cyclic of order $6$. Because $\gcd(2, 3) = 1$, this is the usual case, and every cyclic group of order $6$ is isomorphic to $\mathbb{Z}_6$. The answer is yes.'
          - problem: 'The alternating group $A_4$ and the group $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_3$ both have order $12$. What is the largest order of an element of $A_4$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $A_4$ are the identity, three double transpositions of order $2$, and eight $3$-cycles of order $3$. So the largest order of an element is $3$. The group $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_3$ has the element $(1, 0, 1)$ of order $6$, so the two groups are not isomorphic.'
          - problem: 'The groups $\mathbb{Z}_9$ and $\mathbb{Z}_3 \times \mathbb{Z}_3$ both have order $9$. How many elements of $\mathbb{Z}_9$ have order $9$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element $k$ of $\mathbb{Z}_9$ has order $9$ exactly when $\gcd(k, 9) = 1$. These elements are $1, 2, 4, 5, 7, 8$, so there are $6$ of them. The group $\mathbb{Z}_3 \times \mathbb{Z}_3$ has none, so the groups are not isomorphic.'
          - problem: 'Which of the groups $\mathbb{Z}_2 \times \mathbb{Z}_6$, $\mathbb{Z}_3 \times \mathbb{Z}_4$ and $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_3$ is isomorphic to $\mathbb{Z}_{12}$?'
            answer: 'Z_3 x Z_4'
            answer_contract: {"kind": "label", "options": [["Z_2 x Z_6", "Z2 x Z6", "Z_2 × Z_6", "Z2×Z6", "Z_6 x Z_2", "Z_2 \\times Z_6"], ["Z_3 x Z_4", "Z3 x Z4", "Z_3 × Z_4", "Z3×Z4", "Z_3×Z_4", "Z_4 x Z_3", "Z_3 \\times Z_4", "\\mathbb{Z}_3 \\times \\mathbb{Z}_4"], ["Z_2 x Z_2 x Z_3", "Z2 x Z2 x Z3", "Z_2 × Z_2 × Z_3", "Z2×Z2×Z3", "Z_2 \\times Z_2 \\times Z_3"]]}
            solution_sketch: 'A group of order $12$ is isomorphic to $\mathbb{Z}_{12}$ exactly when it has an element of order $12$. In $\mathbb{Z}_3 \times \mathbb{Z}_4$ the element $(1, 1)$ has order $\mathrm{lcm}(3, 4) = 12$ because $\gcd(3, 4) = 1$. In $\mathbb{Z}_2 \times \mathbb{Z}_6$ the largest order is $6$ and in $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_3$ it is $6$, so the answer is $\mathbb{Z}_3 \times \mathbb{Z}_4$.'
          - problem: 'Up to isomorphism, how many abelian groups of order $8$ are there?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An abelian group of order $8 = 2^3$ is a product of cyclic groups of $2$-power orders whose exponents add up to $3$. The possibilities are $\mathbb{Z}_8$, $\mathbb{Z}_4 \times \mathbb{Z}_2$ and $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_2$, which correspond to the partitions $3$, $2 + 1$ and $1 + 1 + 1$. So there are $3$ such groups.'
          - problem: 'A catalog lists every abelian group of order $16$ once, with groups that are isomorphic counted as the same entry. How many entries does the catalog have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $16 = 2^4$, the entries correspond to the partitions of $4$, which are $4$, $3 + 1$, $2 + 2$, $2 + 1 + 1$ and $1 + 1 + 1 + 1$. So the catalog has $5$ entries, namely $\mathbb{Z}_{16}$, $\mathbb{Z}_8 \times \mathbb{Z}_2$, $\mathbb{Z}_4 \times \mathbb{Z}_4$, $\mathbb{Z}_4 \times \mathbb{Z}_2 \times \mathbb{Z}_2$ and $\mathbb{Z}_2^4$.'
          - problem: 'Up to isomorphism, how many abelian groups of order $36$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $36 = 2^2 \cdot 3^2$. Each prime part can be $\mathbb{Z}_{p^2}$ or $\mathbb{Z}_p \times \mathbb{Z}_p$, which gives $2$ choices for the prime $2$ and $2$ choices for the prime $3$. So there are $2 \cdot 2 = 4$ abelian groups of order $36$.'
          - problem: 'A lock has two dials, one with $4$ positions and one with $6$ positions. Every press turns each dial forward by one position. After how many presses do both dials first show their starting positions together?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pair of dial positions is an element of $\mathbb{Z}_4 \times \mathbb{Z}_6$, and each press adds $(1, 1)$. The order of $(1, 1)$ is $\mathrm{lcm}(4, 6) = 12$, so both dials are first back at the start after $12$ presses. Since this is less than $24 = 4 \cdot 6$, the group $\mathbb{Z}_4 \times \mathbb{Z}_6$ has no element of order $24$ and is not cyclic.'
          - problem: 'A lock has two dials, one with $3$ positions and one with $5$ positions. Every press turns each dial forward by one position. After how many presses do both dials first show their starting positions together?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pair of dial positions is an element of $\mathbb{Z}_3 \times \mathbb{Z}_5$, and each press adds $(1, 1)$. The order of $(1, 1)$ is $\mathrm{lcm}(3, 5) = 15$, which equals the order of the whole group, so $\mathbb{Z}_3 \times \mathbb{Z}_5$ is cyclic and isomorphic to $\mathbb{Z}_{15}$. Both dials return together after $15$ presses.'
        constraints: "yes/no with proof, orders <= 12; use the gcd criterion and order profiles"
    diagnostic_exemplar:
      problem: 'Are $\mathbb{Z}_8$, $\mathbb{Z}_4 \times \mathbb{Z}_2$, and $\mathbb{Z}_2 \times \mathbb{Z}_2 \times \mathbb{Z}_2$ pairwise non-isomorphic? Prove it.'
      answer: 'Yes: their maximal element orders are $8$, $4$, and $2$ respectively, and maximal order is an isomorphism invariant.'
      answer_contract: {kind: none}
      solution_sketch: 'Compute the largest order in each (generator; $(1,0)$ of order $4$; all non-identity elements order $2$).'
    anki_seeds:
      - front: "Fastest way to show two finite groups are NOT isomorphic?"
        back: "Find an invariant that differs: order, abelian-ness, cyclicity, or the count of elements of some order."
        type: basic
      - front: "Element orders occurring in $A_4$?"
        back: "$1, 2, 3$ — in particular no element of order $6$ or $12$."
        type: basic

  - id: kernels-images
    name: "Kernels and Images"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: homomorphisms-intro
        weight: 0.8
        key: true
      - id: normal-subgroups
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Computing kernels and images"
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$ be given by $\varphi(x) = 8x \bmod 12$. Find the kernel of $\varphi$.'
            answer: '0, 3, 6, 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The kernel consists of the $x$ with $8x = 0$ modulo $12$, that is, with $12$ dividing $8x$. Dividing by $4$ gives that $3$ divides $2x$, so $3$ divides $x$. The elements of $\mathbb{Z}_{12}$ that are multiples of $3$ are $0, 3, 6, 9$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$ be given by $\varphi(x) = 8x \bmod 12$. Find the image of $\varphi$.'
            answer: '0, 4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image consists of the values $8x \bmod 12$. The multiples of $8$ modulo $12$ are $0, 8, 4, 0, \dots$, because $8 \cdot 2 = 16 = 4$ and $8 \cdot 3 = 24 = 0$. So the image is $\{0, 4, 8\}$, the multiples of $\gcd(8, 12) = 4$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{10} \to \mathbb{Z}_{10}$ be given by $\varphi(x) = 4x \bmod 10$. Find the kernel of $\varphi$.'
            answer: '0, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $4x = 0$ modulo $10$ means that $10$ divides $4x$, which means that $5$ divides $2x$ and so $5$ divides $x$. The multiples of $5$ in $\mathbb{Z}_{10}$ are $0$ and $5$, so the kernel is $\{0, 5\}$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{15} \to \mathbb{Z}_{15}$ be given by $\varphi(x) = 6x \bmod 15$. Find the image of $\varphi$.'
            answer: '0, 3, 6, 9, 12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $6x \bmod 15$ are $0, 6, 12, 3, 9$ for $x = 0, 1, 2, 3, 4$, and they repeat after that. Written in order, the image is $\{0, 3, 6, 9, 12\}$, the multiples of $\gcd(6, 15) = 3$.'
          - problem: 'The sign homomorphism sends each permutation in $S_4$ to $+1$ if it is even and to $-1$ if it is odd. Which subgroup of $S_4$ is its kernel?'
            answer: 'A_4'
            answer_contract: {"kind": "label", "options": [["A_4", "A4", "the alternating group", "alternating group A_4", "the alternating group A_4", "A_{4}", "\\mathbb{A}_4"], ["D_4", "D4", "the dihedral group"], ["V_4", "V4", "the Klein four-group"], ["Z_4", "Z4", "the cyclic group of order 4"]]}
            solution_sketch: 'The kernel of a homomorphism into $\{\pm 1\}$ is the set of elements sent to the identity $+1$, and these are exactly the even permutations. The even permutations of $S_4$ form the alternating group $A_4$, which has $12$ elements. So the kernel is $A_4$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{10} \to \mathbb{Z}_{10}$, $\varphi(x) = ax \bmod 10$ with $0 < a < 10$, have kernel $\{0, 5\}$. What is the smallest possible value of $a$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $a = 1$ the kernel is $\{0\}$, and for $a = 2$ the condition $2x = 0$ modulo $10$ holds exactly for $x = 0$ and $x = 5$. So $a = 2$ gives the kernel $\{0, 5\}$, and it is the smallest value that does.'
          - problem: 'A $12$-hour clock hand is moved by a gadget so that, when asked to advance $x$ hours, it advances $8x$ hours. For how many requests $x$ with $0 \le x \le 11$ does the hand end at its starting position?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The hand ends at the start when $12$ divides $8x$, which means that $3$ divides $x$. The requests $0, 3, 6, 9$ work, so there are $4$ of them, which is the size of the kernel of $x \mapsto 8x$ on $\mathbb{Z}_{12}$.'
          - problem: 'A $12$-hour clock hand is moved by a gadget so that, when asked to advance $x$ hours, it advances $8x$ hours. How many different positions can the hand end at?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The positions reached are the values $8x \bmod 12$, which are $0$, $8$ and $4$. So the hand can end at $3$ different positions, and this agrees with $|\mathrm{im}\,\varphi| = 12/|\ker\varphi| = 12/4 = 3$.'
          - problem: 'Let $\varphi : \mathbb{Z} \to \mathbb{Z}_6$ be the reduction map $\varphi(x) = x \bmod 6$. Find the image of $\varphi$.'
            answer: '0, 1, 2, 3, 4, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every integer has a remainder between $0$ and $5$ on division by $6$. Each of the remainders $0, 1, 2, 3, 4, 5$ is hit, for example by the integers $0$ through $5$ themselves, so the image is all of $\mathbb{Z}_6$.'
        constraints: "maps k -> ak on Z_n, sign map, reduction maps Z -> Z_n; answers as explicit sets or named subgroups"
      - id: kp2
        name: "Kernels are normal; injectivity criterion"
        key_prerequisites: [homomorphisms-intro, normal-subgroups]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z}_{10} \to \mathbb{Z}_{10}$ be the homomorphism $\varphi(x) = 3x \bmod 10$. Is $\varphi$ injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective"], ["no", "it is not injective", "not injective"]]}
            solution_sketch: 'A homomorphism is injective exactly when its kernel is trivial. Here $3x = 0$ modulo $10$ means that $10$ divides $3x$, and since $\gcd(3, 10) = 1$ this forces $10$ to divide $x$, so $x = 0$. The kernel has $1$ element, so $\varphi$ is injective and the answer is yes.'
          - problem: 'Let $\varphi : \mathbb{Z}_8 \to \mathbb{Z}_8$ be defined by $\varphi(x) = 2x \bmod 8$. How many elements does the kernel of $\varphi$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $2x = 0$ modulo $8$ means that $8$ divides $2x$, which means that $4$ divides $x$. The elements $0$ and $4$ satisfy this, so the kernel has $2$ elements. Since the kernel is larger than $\{0\}$, the map $\varphi$ is not injective.'
          - problem: 'Let $\varphi : \mathbb{Z}_{15} \to \mathbb{Z}_{15}$ be defined by $\varphi(x) = 5x \bmod 15$. How many elements does the kernel of $\varphi$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $5x = 0$ modulo $15$ means that $15$ divides $5x$, which means that $3$ divides $x$. The multiples of $3$ in $\mathbb{Z}_{15}$ are $0, 3, 6, 9, 12$, so the kernel has $5$ elements.'
          - problem: 'Let $\varphi : S_3 \to \mathbb{Z}_2$ be the sign homomorphism, which sends even permutations to $0$ and odd permutations to $1$. Let $k = (1\,2\,3)$ and $g = (1\,3)$. What is $\varphi(g k g^{-1})$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $k$ is even, so it lies in the kernel. By the homomorphism law, $\varphi(gkg^{-1}) = \varphi(g) + \varphi(k) + \varphi(g^{-1}) = \varphi(g) + 0 - \varphi(g) = 0$, so the conjugate $gkg^{-1}$ is again in the kernel. This is why a kernel is a normal subgroup.'
          - problem: 'How many elements does the kernel of the sign homomorphism $S_3 \to \mathbb{Z}_2$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The kernel is the set of even permutations of $S_3$, which are the identity and the two $3$-cycles. So it has $3$ elements. A homomorphism is injective only when the kernel contains nothing but the identity, so the sign homomorphism is not injective.'
          - problem: 'A cipher on a $26$-letter alphabet numbered $0$ to $25$ replaces the letter $x$ by $13x \bmod 26$. How many letters are replaced by the letter $0$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A letter $x$ is replaced by $0$ when $26$ divides $13x$, which means that $2$ divides $x$. The even numbers from $0$ to $24$ give $13$ letters. So the kernel has $13$ elements, and the cipher is far from injective.'
          - problem: 'A cipher on a $26$-letter alphabet numbered $0$ to $25$ replaces the letter $x$ by $9x \bmod 26$. How many letters are replaced by the letter $0$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A letter $x$ is replaced by $0$ when $26$ divides $9x$. Since $\gcd(9, 26) = 1$, this forces $26$ to divide $x$, so $x = 0$ is the only letter. The kernel has $1$ element, so no two letters share an encryption.'
          - problem: 'Let $\varphi : \mathbb{Z}_{18} \to \mathbb{Z}_{18}$ be defined by $\varphi(x) = 12x \bmod 18$. How many elements does the kernel of $\varphi$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $12x = 0$ modulo $18$ means that $18$ divides $12x$, which means that $3$ divides $2x$ and so $3$ divides $x$. The multiples of $3$ in $\mathbb{Z}_{18}$ are $0, 3, 6, 9, 12, 15$, so the kernel has $6$ elements.'
          - problem: 'For a homomorphism $\varphi : G \to H$, which condition on the kernel is equivalent to $\varphi$ being injective?'
            answer: 'the kernel is trivial'
            answer_contract: {"kind": "label", "options": [["the kernel is trivial", "trivial kernel", "kernel is {e}", "kernel is trivial", "trivial", "kernel = {e}", "ker = {e}", "the kernel is the trivial subgroup"], ["the kernel is all of G", "kernel is G"], ["the kernel is normal", "normal kernel"], ["the kernel has size 2", "kernel has 2 elements"]]}
            solution_sketch: 'If $\varphi(a) = \varphi(b)$, then $\varphi(ab^{-1}) = e$, so $ab^{-1}$ lies in the kernel. When the kernel contains only the identity, this gives $a = b$, so $\varphi$ is injective, and conversely an injective $\varphi$ sends only $e_G$ to $e_H$. Every kernel is normal, so that option cannot decide injectivity.'
        constraints: "the two standard lemmas, proved from the definitions"
      - id: kp3
        name: "Counting with |G| = |ker||im|"
        key_prerequisites: [homomorphisms-intro]
        try_first:
          problem: 'A homomorphism $\varphi : G \to H$ has $|G| = 36$ and $|\ker\varphi| = 6$. How many elements does the image have?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'Elements of $G$ with the same image form a coset of the kernel, so $G$ splits into $|\ker\varphi|$-sized blocks and $|\mathrm{im}\,\varphi| = |G|/|\ker\varphi|$.'
        exemplars:
          - problem: 'A homomorphism $\varphi : G \to H$ has $|G| = 24$ and $|\ker \varphi| = 4$. How many elements does the image of $\varphi$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $G$ fall into the cosets of the kernel, and each coset has $4$ elements and maps to one element of the image. So $|\mathrm{im}\,\varphi| = |G|/|\ker\varphi| = 24/4 = 6$.'
          - problem: 'A decoder is a homomorphism from a lock with $72$ settings onto a display with $9$ different readings. Every reading is produced by the same number of settings. How many settings produce each reading?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The settings that produce one reading form a coset of the kernel, so each reading has $|\ker\varphi|$ settings. Since $72 = |\ker\varphi| \cdot 9$, we get $|\ker\varphi| = 72/9 = 8$ settings for each reading.'
          - problem: 'A homomorphism from a group $G$ has an image with $9$ elements, and every element of the image is the image of exactly $7$ elements of $G$. How many elements does $G$ have?'
            answer: '63'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $G$ are split into the fibers over the $9$ elements of the image, and each fiber has $7$ elements. So $|G| = |\ker\varphi| \cdot |\mathrm{im}\,\varphi| = 7 \cdot 9 = 63$.'
          - problem: 'A homomorphism $\varphi$ is defined on a group $G$ of order $42$, and its image has $6$ elements. How many elements does $\ker \varphi$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The size relation $|G| = |\ker\varphi| \cdot |\mathrm{im}\,\varphi|$ gives $42 = |\ker\varphi| \cdot 6$. So $|\ker\varphi| = 42/6 = 7$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{60} \to \mathbb{Z}_{60}$ be the map $\varphi(x) = 8x \bmod 60$. How many elements does the image of $\varphi$ have?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $8x = 0$ modulo $60$ means that $60$ divides $8x$, which means that $15$ divides $2x$ and so $15$ divides $x$. The kernel is therefore $\{0, 15, 30, 45\}$, with $4$ elements. Then $|\mathrm{im}\,\varphi| = 60/4 = 15$.'
          - problem: 'A dial has $60$ positions, and a gear train turns the dial position $x$ into the output position $8x \bmod 60$. Every output position that can occur is reached from the same number of dial positions. How many dial positions lead to each such output?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dial positions that lead to one output form a coset of the kernel, so each output is reached from $|\ker\varphi|$ positions. The kernel consists of the $x$ with $60$ dividing $8x$, which are $0, 15, 30, 45$, so there are $4$ positions for each output.'
          - problem: 'A group $G$ has order $27$, and $\varphi : G \to H$ is a homomorphism that is not injective. What is the smallest possible number of elements of $\ker \varphi$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The kernel is a subgroup of $G$ with more than $1$ element, and its order divides $27$ by Lagrange''s theorem. The divisors of $27$ are $1, 3, 9, 27$, so the smallest possible order is $3$.'
        constraints: "fiber/counting problems with |G| <= 60"
    diagnostic_exemplar:
      problem: 'For $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$, $\varphi(x) = 4x \bmod 12$: compute $\ker \varphi$ and $\mathrm{im}\,\varphi$, check that $|\ker \varphi| \cdot |\mathrm{im}\,\varphi| = 12$, and say whether $\varphi$ is injective.'
      answer: '$\ker \varphi = \{0, 3, 6, 9\}$ and $\mathrm{im}\,\varphi = \{0, 4, 8\}$, so $4 \cdot 3 = 12$. $\varphi$ is not injective: the kernel is bigger than $\{0\}$ (for instance $\varphi(3) = \varphi(0) = 0$), and a homomorphism is injective exactly when its kernel is trivial.'
      answer_contract: {kind: none}
      solution_sketch: '$4x \equiv 0 \pmod{12}$ iff $3 \mid x$; the image consists of the multiples of $\gcd(4,12) = 4$. Then apply the kernel criterion for injectivity.'
    anki_seeds:
      - front: "$\\ker \\varphi$ for a group homomorphism is always a ______ of the domain."
        back: "Normal subgroup."
        type: basic
      - front: "Injectivity criterion for a group homomorphism?"
        back: "$\\varphi$ is injective iff $\\ker \\varphi = \\{e\\}$."
        type: basic
      - front: "Size relation among domain, kernel, image of a homomorphism (finite)?"
        back: "$|G| = |\\ker \\varphi| \\cdot |\\mathrm{im}\\, \\varphi|$."
        type: basic

  - id: first-isomorphism-theorem
    name: "The First Isomorphism Theorem"
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: kernels-images
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: "Statement and the induced map"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z}_{18} \to \mathbb{Z}_{18}$ be given by $\varphi(x) = 6x \bmod 18$. By the first isomorphism theorem, $\mathbb{Z}_{18}/\ker\varphi$ is isomorphic to $\mathrm{im}\,\varphi$. How many elements does $\mathbb{Z}_{18}/\ker\varphi$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The kernel is the set of $x$ with $18$ dividing $6x$, which is $\{0, 3, 6, 9, 12, 15\}$ and has $6$ elements. The quotient has $18/6 = 3$ elements. This agrees with the image $\{0, 6, 12\}$, which also has $3$ elements.'
          - problem: 'Let $\varphi : \mathbb{Z}_{15} \to \mathbb{Z}_{15}$ be given by $\varphi(x) = 5x \bmod 15$. The elements $4$ and $7$ lie in the same coset of $\ker\varphi$. What is $\varphi(7) - \varphi(4)$ in $\mathbb{Z}_{15}$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Elements of one coset of the kernel have the same image, which is why the induced map is well defined. Directly, $\varphi(7) = 35 = 5$ and $\varphi(4) = 20 = 5$ modulo $15$, so the difference is $0$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{10} \to \mathbb{Z}_{10}$ be given by $\varphi(x) = 2x \bmod 10$. Is $\varphi$ one-to-one?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is one-to-one", "one-to-one", "injective"], ["no", "it is not one-to-one", "not one-to-one", "not injective"]]}
            solution_sketch: 'A homomorphism is one-to-one exactly when its kernel contains only the identity. Here $\varphi(5) = 10 = 0 = \varphi(0)$, so the kernel contains $5$ as well as $0$. The kernel is not trivial, so $\varphi$ is not one-to-one.'
          - problem: 'Let $\varphi : \mathbb{Z}_{20} \to \mathbb{Z}_{20}$ be given by $\varphi(x) = 8x \bmod 20$. How many elements does $\ker\varphi$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $8x = 0$ modulo $20$ means that $20$ divides $8x$, which means that $5$ divides $2x$ and so $5$ divides $x$. The kernel is $\{0, 5, 10, 15\}$, which has $4$ elements.'
          - problem: 'Let $\varphi : \mathbb{Z}_9 \to \mathbb{Z}_9$ be given by $\varphi(x) = 3x \bmod 9$. The induced map on $\mathbb{Z}_9/\ker\varphi$ is onto $\mathrm{im}\,\varphi$, so the element $6$ of the image comes from some coset $x + \ker\varphi$. What is the smallest $x$ in $\mathbb{Z}_9$ in such a coset?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $3x = 6$ modulo $9$, which means that $x = 2$ modulo $3$. The elements of $\mathbb{Z}_9$ with this property are $2, 5, 8$, and they form one coset of $\ker\varphi = \{0, 3, 6\}$. The smallest is $x = 2$.'
          - problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_4$ be $\varphi(x) = x \bmod 4$, with kernel $K = \{0, 4, 8\}$. Find the smallest $h$ greater than $1$ with $h + K = 1 + K$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coset $1 + K$ is $\{1, 5, 9\}$. The smallest element greater than $1$ is $5$, so $5 + K = 1 + K$ although $5 \ne 1$. So $gK = hK$ means only that $h^{-1}g$ lies in $K$.'
          - problem: 'A counter has $60$ states $0, 1, \dots, 59$, and a display shows the remainder of the state on division by $12$. This display is a homomorphism $\varphi : \mathbb{Z}_{60} \to \mathbb{Z}_{12}$, and the states that look the same on the display form one coset of $\ker\varphi$. How many states look the same as state $0$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The states that look like $0$ are the kernel, the multiples of $12$ in $\mathbb{Z}_{60}$, namely $0, 12, 24, 36, 48$. So $5$ states look the same as state $0$, in agreement with $|\ker\varphi| = 60/12 = 5$.'
          - problem: 'A machine turns each of $36$ possible inputs into one of $9$ outputs by a surjective homomorphism, and the inputs with one output form one coset of the kernel. How many inputs belong to each coset?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, the $9$ outputs correspond to the $9$ cosets of the kernel. All cosets have the same size, so each coset has $36/9 = 4$ inputs.'
          - problem: 'Write the full proof that for a group homomorphism $\varphi : G \to H$ with kernel $K$, the induced map $\bar\varphi : G/K \to \mathrm{im}\,\varphi$, $\bar\varphi(gK) = \varphi(g)$, is a well-defined isomorphism.'
            answer: 'The induced map is an isomorphism.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Well defined: if $gK = hK$ then $h^{-1}g \in K$, so $\varphi(g) = \varphi(h)\varphi(h^{-1}g) = \varphi(h)$. Homomorphism: $\bar\varphi(gK \cdot hK) = \bar\varphi(ghK) = \varphi(gh) = \varphi(g)\varphi(h) = \bar\varphi(gK)\bar\varphi(hK)$. Injective: if $\bar\varphi(gK) = e$ then $g \in K$, so $gK = K$ is the identity coset. Surjective: every element of $\mathrm{im}\,\varphi$ has the form $\varphi(g) = \bar\varphi(gK)$. A bijective homomorphism is an isomorphism.'
        constraints: "statement, well-definedness, injectivity, surjectivity — one step at a time"
      - id: kp2
        name: "Identifying quotients via a good homomorphism"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: 'The quotient $\mathbb{Z}_{18}/\langle 6 \rangle$ is isomorphic to $\mathbb{Z}_k$ for exactly one $k$. Find $k$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The reduction map $\varphi : \mathbb{Z}_{18} \to \mathbb{Z}_6$, $\varphi(a) = a \bmod 6$, is onto, and its kernel is $\{0, 6, 12\} = \langle 6 \rangle$. By the first isomorphism theorem, $\mathbb{Z}_{18}/\langle 6 \rangle \cong \mathbb{Z}_6$, so $k = 6$.'
          - problem: 'The sign homomorphism $S_4 \to \{1, -1\}$ is onto and has kernel $A_4$. By the first isomorphism theorem, $S_4/A_4$ is isomorphic to a cyclic group $\mathbb{Z}_k$. Find $k$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $\{1, -1\}$ under multiplication is cyclic of order $2$, so it is isomorphic to $\mathbb{Z}_2$. The first isomorphism theorem gives $S_4/A_4 \cong \{1, -1\} \cong \mathbb{Z}_2$, so $k = 2$. This agrees with $|S_4|/|A_4| = 24/12 = 2$.'
          - problem: 'The map $f : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$, $f(x) = 4x$, is a homomorphism with kernel $\{0, 3, 6, 9\}$. How many elements does the quotient group $\mathbb{Z}_{12}/\{0, 3, 6, 9\}$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, the quotient is isomorphic to the image of $f$. The image is $\{0, 4, 8\}$, which has $3$ elements, and this agrees with $12/4 = 3$ for a kernel with $4$ elements.'
          - problem: 'The map $f : \mathbb{Z}_{10} \to \mathbb{Z}_{10}$, $f(x) = 2x$, is a homomorphism with kernel $\{0, 5\}$. The quotient $\mathbb{Z}_{10}/\{0, 5\}$ is isomorphic to $\mathbb{Z}_m$ for exactly one $m$. Find $m$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $f$ is $\{0, 2, 4, 6, 8\}$, which is cyclic of order $5$ and generated by $2$. By the first isomorphism theorem, $\mathbb{Z}_{10}/\{0, 5\} \cong \mathbb{Z}_5$, so $m = 5$.'
          - problem: 'The map $f(x) = 2x$ on $\mathbb{Z}_6$ has kernel $\{0, 3\}$. How many different elements does the image of $f$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In $\mathbb{Z}_6$ the value $6$ equals $0$, so the image is $\{0, 2, 4\}$. It has $3$ elements, which agrees with $6/|\ker f| = 6/2 = 3$. So the quotient is isomorphic to $\mathbb{Z}_3$.'
          - problem: 'In $\mathbb{Z}_6$ let $f(x) = cx \bmod 6$ with $0 < c < 6$. To identify $\mathbb{Z}_6/\{0, 2, 4\}$ with the first isomorphism theorem, we need $f$ to have kernel $\{0, 2, 4\}$. Find $c$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $c = 3$ we get $3x = 0$ modulo $6$ exactly when $x$ is even, so the kernel is $\{0, 2, 4\}$. For $c = 1, 2, 4, 5$ the kernel is $\{0\}$ or $\{0, 3\}$, so $c = 3$ is the only choice. Its image is $\{0, 3\}$, so $\mathbb{Z}_6/\{0, 2, 4\} \cong \mathbb{Z}_2$.'
          - problem: 'The day numbers $0, 1, \dots, 83$ of a twelve-week term form the group $\mathbb{Z}_{84}$, and the weekday of day $x$ is $x \bmod 7$. This is a homomorphism $\mathbb{Z}_{84} \to \mathbb{Z}_7$, and $\mathbb{Z}_{84}/\ker \cong \mathbb{Z}_7$. How many of the $84$ days fall on the same weekday as day $0$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The days on the same weekday as day $0$ form the kernel, the multiples of $7$ in $\mathbb{Z}_{84}$. By the first isomorphism theorem the quotient has $7$ elements, so the kernel has $84/7 = 12$ elements, which are the days $0, 7, 14, \dots, 77$.'
          - problem: 'A $24$-hour clock shows the hour $x$ in $\mathbb{Z}_{24}$. A worker''s shift is determined by $x \bmod 8$, which defines a surjective homomorphism $\mathbb{Z}_{24} \to \mathbb{Z}_8$ with kernel $\langle 8 \rangle$. The quotient $\mathbb{Z}_{24}/\langle 8 \rangle$ is isomorphic to $\mathbb{Z}_k$. Find $k$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, the quotient is isomorphic to the image, which is all of $\mathbb{Z}_8$. So $k = 8$. This agrees with $24/|\langle 8 \rangle| = 24/3 = 8$, because $\langle 8 \rangle = \{0, 8, 16\}$.'
          - problem: 'Write the full proof that the quotient of $D_4$ by its subgroup of rotations is isomorphic to $\mathbb{Z}_2$.'
            answer: 'Map rotations to 0 and reflections to 1.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Define $f : D_4 \to \mathbb{Z}_2$ by $f(g) = 0$ if $g$ is a rotation and $f(g) = 1$ if $g$ is a reflection. A product of two rotations or two reflections is a rotation, and a product of a rotation and a reflection is a reflection, so $f(gh) = f(g) + f(h)$ and $f$ is a homomorphism. It is onto, and its kernel is the subgroup of rotations. By the first isomorphism theorem, $D_4/\{\text{rotations}\} \cong \mathbb{Z}_2$.'
        constraints: "quotients of Z, Z_n, S_n, D_n realized by reduction, sign, or power maps"
      - id: kp3
        name: "Existence and counting consequences"
        key_prerequisites: [kernels-images, quotient-groups]
        exemplars:
          - problem: 'Let $\varphi : G \to H$ be a surjective homomorphism, where $G$ has order $24$ and $\ker\varphi$ has order $6$. What is the order of $H$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, $H = \mathrm{im}\,\varphi \cong G/\ker\varphi$. So $|H| = |G|/|\ker\varphi| = 24/6 = 4$.'
          - problem: 'Is there a surjective homomorphism from $\mathbb{Z}_9$ onto $\mathbb{Z}_4$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, there is", "there is"], ["no", "no, there is not", "there is not"]]}
            solution_sketch: 'If such a homomorphism existed, the first isomorphism theorem would give $\mathbb{Z}_9/\ker\varphi \cong \mathbb{Z}_4$, so $4$ would divide $9$. But $9 = 2 \cdot 4 + 1$, so $4$ does not divide $9$. Hence no surjective homomorphism exists, and the answer is no.'
          - problem: 'A dial has $30$ positions and drives a display with $5$ positions through a surjective homomorphism $\mathbb{Z}_{30} \to \mathbb{Z}_5$. The dial positions that show the same display position form one coset of the kernel. How many dial positions show each display position?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, the $5$ display positions correspond to the $5$ cosets of the kernel. The cosets have equal size, so each one has $30/5 = 6$ dial positions.'
          - problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_6$ be a surjective homomorphism. How many elements does $\ker\varphi$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first isomorphism theorem gives $\mathbb{Z}_{12}/\ker\varphi \cong \mathbb{Z}_6$, so $|\ker\varphi| = 12/6 = 2$. Such a map exists, for example the reduction map $x \mapsto x \bmod 6$.'
          - problem: 'Find the largest $n$ with $n \le 4$ for which a surjective homomorphism $\mathbb{Z}_{10} \to \mathbb{Z}_n$ exists.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A surjective homomorphism $\mathbb{Z}_{10} \to \mathbb{Z}_n$ has a kernel of order $10/n$, so $n$ must divide $10$. Among $1, 2, 3, 4$ only $1$ and $2$ divide $10$, so the largest is $2$. The value $n = 4$ fails because $10/4 = 2.5$ is not a whole number.'
          - problem: 'What is the largest possible number of elements of the image of a homomorphism from $\mathbb{Z}_9$ to $\mathbb{Z}_4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image has $|\mathrm{im}\,\varphi| = 9/|\ker\varphi|$ elements, which divides $9$, and it is a subgroup of $\mathbb{Z}_4$, so its order divides $4$. The only common divisor of $9$ and $4$ is $1$, so the image has $1$ element, and the largest possible size is $1$.'
          - problem: 'A $12$-position dial is wired to an $8$-position display by a homomorphism $\mathbb{Z}_{12} \to \mathbb{Z}_8$. At most how many different display positions can ever light up?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set of lit positions is the image, whose order divides both $12$ and $8$ by the first isomorphism theorem and Lagrange''s theorem. The greatest common divisor is $\gcd(12, 8) = 4$, and the map $x \mapsto 2x \bmod 8$ achieves $4$ positions. So at most $4$ positions can light up.'
          - problem: 'A homomorphism from a group $G$ onto a group with $7$ elements has a kernel with $4$ elements. How many elements does $G$ have?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the first isomorphism theorem, $G/\ker\varphi$ is isomorphic to the group with $7$ elements, so $|G| = |\ker\varphi| \cdot 7$. This gives $|G| = 4 \cdot 7 = 28$.'
          - problem: 'Write the full proof that if $m$ and $n$ are positive integers and $n$ does not divide $m$, then there is no surjective homomorphism from $\mathbb{Z}_m$ onto $\mathbb{Z}_n$.'
            answer: 'A surjection would force n to divide m.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose $\varphi : \mathbb{Z}_m \to \mathbb{Z}_n$ is a surjective homomorphism. By the first isomorphism theorem, $\mathbb{Z}_m/\ker\varphi \cong \mathrm{im}\,\varphi = \mathbb{Z}_n$, so $n = m/|\ker\varphi|$. Then $m = n \cdot |\ker\varphi|$, so $n$ divides $m$, which contradicts the assumption.'
        constraints: "existence/non-existence of surjections between groups of order <= 30"
    diagnostic_exemplar:
      problem: 'Let $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_{12}$, $\varphi(x) = 3x$. Apply the first isomorphism theorem: what is $\mathbb{Z}_{12}/\{0,4,8\}$ isomorphic to?'
      answer: '$\mathbb{Z}_4$ (the image $\{0,3,6,9\}$ is cyclic of order $4$).'
      solution_sketch: '$\ker\varphi = \{0,4,8\}$ and $\mathrm{im}\,\varphi = \langle 3 \rangle \cong \mathbb{Z}_4$, so the quotient is $\mathbb{Z}_4$.'
    anki_seeds:
      - front: "First isomorphism theorem?"
        back: "$G/\\ker\\varphi \\cong \\mathrm{im}\\,\\varphi$ via $g\\ker\\varphi \\mapsto \\varphi(g)$."
        type: basic
      - front: "Strategy to identify a quotient $G/N$?"
        back: "Find a surjective homomorphism out of $G$ whose kernel is exactly $N$; the image is the quotient."
        type: basic

  - id: isomorphism-theorems-2-3
    name: "The Second and Third Isomorphism Theorems"
    core: false                # terminal theorem toolkit: nothing downstream assumes them (prime-maximal-ideals routes via quotient characterizations, verified in the re-audit)
    difficulty: 0.80
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: first-isomorphism-theorem
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.6
        key: true
      # kp3 (re-audit R-55) states the ring version of the first isomorphism theorem,
      # closing the untaught citation in quotient-rings' solution sketches.
      - id: quotient-rings
        weight: 0.5
        key: true
      - id: complex-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "The second (diamond) isomorphism theorem"
        key_prerequisites: [first-isomorphism-theorem, quotient-groups]
        exemplars:
          - problem: 'Let $G = S_3$, $H = \langle (1\,2) \rangle$ and $N = A_3$. What is the order of the quotient group $HN/N$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $H$ has order $2$, and $H \cap N$ is trivial because $(1\,2)$ is an odd permutation and $A_3$ contains only even ones. The second isomorphism theorem gives $HN/N \cong H/(H \cap N) \cong H$, so $HN/N$ has order $2$.'
          - problem: 'Let $H = 8\mathbb{Z}$ and $N = 12\mathbb{Z}$ be subgroups of $(\mathbb{Z}, +)$. The intersection $H \cap N$ equals $d\mathbb{Z}$ for one positive integer $d$. Find $d$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An integer lies in $H \cap N$ exactly when it is a multiple of both $8$ and $12$. The common multiples of $8$ and $12$ are the multiples of $\operatorname{lcm}(8,12) = 24$, so $d = 24$.'
          - problem: 'In $(\mathbb{Z}, +)$ let $H = 9\mathbb{Z}$ and $N = 12\mathbb{Z}$. The subgroup $HN = H + N$ equals $d\mathbb{Z}$ for one positive integer $d$. Find $d$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every element of $HN$ is a sum $9a + 12b$ with $a, b \in \mathbb{Z}$. These sums are exactly the multiples of $\gcd(9,12) = 3$, so $HN = 3\mathbb{Z}$ and $d = 3$.'
          - problem: 'For $H = 4\mathbb{Z}$ and $N = 6\mathbb{Z}$ in $(\mathbb{Z}, +)$, what is the positive generator of the intersection $H \cap N$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element of $H \cap N$ is a common multiple of $4$ and $6$, so the generator is $\operatorname{lcm}(4,6) = 12$ and not the product. The product $24$ is too large because $\gcd(4,6) \cdot \operatorname{lcm}(4,6) = 2 \cdot 12 = 24$ counts the common factor $2$ twice.'
          - problem: 'The $72$ positions of a rotating display form the group $\mathbb{Z}_{72}$, where a turn by $k$ positions is the element $k$. Let $H$ be the subgroup of turns generated by a turn of $8$ positions, and $N$ the subgroup generated by a turn of $12$ positions. How many elements does the quotient $HN/N$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has $72/8 = 9$ elements, and $N$ has $72/12 = 6$ elements. The intersection $H \cap N$ is generated by $\operatorname{lcm}(8,12) = 24$, so it has $72/24 = 3$ elements. By the second isomorphism theorem $|HN/N| = |H|/|H \cap N| = 9/3 = 3$.'
          - problem: 'The hand of a clock turns by whole hours, so its turns form $\mathbb{Z}_{12}$. Let $H$ be the subgroup of turns by multiples of $3$ hours, and $N$ the subgroup of turns by multiples of $4$ hours. How many elements does the quotient $HN/N$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroup $H$ has $12/3 = 4$ elements, and $N$ has $12/4 = 3$ elements. A turn in both is a multiple of $3$ and of $4$ hours, so $H \cap N$ contains only the zero turn. Hence $|HN/N| = |H|/|H \cap N| = 4/1 = 4$.'
          - problem: 'In $(\mathbb{Z}, +)$ let $H = 12\mathbb{Z}$ and $N = 20\mathbb{Z}$. How many elements does the quotient group $H/(H \cap N)$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intersection $H \cap N$ is $\operatorname{lcm}(12,20)\mathbb{Z} = 60\mathbb{Z}$. Its index in $H = 12\mathbb{Z}$ is $60/12 = 5$, so $H/(H \cap N)$ has $5$ elements. This agrees with $HN/N = 4\mathbb{Z}/20\mathbb{Z}$, which also has $5$ elements.'
          - problem: 'Let $N$ be a normal subgroup of a finite group $G$, and let $H$ be a subgroup with $|H| = 12$, $|N| = 18$ and $|H \cap N| = 6$. What is $|HN|$?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $N$ is normal, $HN$ is a subgroup and $HN/N \cong H/(H \cap N)$ has $12/6 = 2$ elements. Then $|HN| = |HN/N| \cdot |N| = 2 \cdot 18 = 36$.'
          - problem: 'Let $H = \langle (1\,2) \rangle$ and $N = \langle (1\,3) \rangle$ be subgroups of $S_3$. Is $HN$ a subgroup of $S_3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subgroup", "it is"], ["no", "it is not a subgroup", "it is not", "not a subgroup"]]}
            solution_sketch: 'The set $HN = \{e, (1\,2), (1\,3), (1\,2)(1\,3)\}$ has $4$ elements. The order of a subgroup of $S_3$ divides $6$ by Lagrange''s theorem, and $4$ does not divide $6$, so $HN$ is not a subgroup. The cause is that $N$ is not normal in $S_3$.'
          - problem: 'Write the full proof of the second isomorphism theorem: if $H$ is a subgroup and $N$ is a normal subgroup of a group $G$, then $HN$ is a subgroup of $G$, $H \cap N$ is normal in $H$, and $HN/N \cong H/(H \cap N)$.'
            answer: 'HN/N is isomorphic to H/(H∩N)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'First show that $HN$ is a subgroup: since $N$ is normal, $h_1 n_1 h_2 n_2 = h_1 h_2 (h_2^{-1} n_1 h_2) n_2$ lies in $HN$, and $(hn)^{-1} = h^{-1}(h n^{-1} h^{-1})$ lies in $HN$ as well. Next define $\varphi : H \to HN/N$ by $\varphi(h) = hN$. It is a homomorphism because $(h_1 h_2)N = (h_1 N)(h_2 N)$, and it is onto because every coset $hnN$ equals $hN$. Its kernel consists of the $h \in H$ with $hN = N$, that is, $h \in H \cap N$, so $H \cap N$ is normal in $H$ as a kernel. The first isomorphism theorem now gives $HN/N \cong H/(H \cap N)$.'
        constraints: 'statement and the proof; instances in Z (gcd and lcm), in Z_n (n <= 72), and in S_3 (H a transposition subgroup, N = A_3); every instance names the groups H, N, H intersect N and HN'
      - id: kp2
        name: "The third isomorphism theorem and the correspondence theorem"
        key_prerequisites: [quotient-groups, first-isomorphism-theorem]
        try_first:
          problem: 'How many subgroups does the group $\mathbb{Z}_{12}$ have?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'Each subgroup of $\mathbb{Z}_{12}$ comes from a subgroup $d\mathbb{Z}$ of $\mathbb{Z}$ that contains $12\mathbb{Z}$, and that happens exactly when $d$ divides $12$. The divisors $1, 2, 3, 4, 6, 12$ give six subgroups; this is the correspondence theorem.'
        exemplars:
          - problem: 'The group $(\mathbb{Z}/16\mathbb{Z})\,/\,(4\mathbb{Z}/16\mathbb{Z})$ is isomorphic to $\mathbb{Z}_m$ for one integer $m$. Find $m$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroups $16\mathbb{Z} \subseteq 4\mathbb{Z}$ are normal in $\mathbb{Z}$, so the third isomorphism theorem cancels $16\mathbb{Z}$ from the quotient. What remains is $\mathbb{Z}/4\mathbb{Z} \cong \mathbb{Z}_4$, so $m = 4$.'
          - problem: 'Every subgroup of $\mathbb{Z}$ has the form $d\mathbb{Z}$ for one positive integer $d$. For which $d$ does $d\mathbb{Z}$ contain $18\mathbb{Z}$?'
            answer: '1, 2, 3, 6, 9, 18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $18\mathbb{Z} \subseteq d\mathbb{Z}$ exactly when $18$ is a multiple of $d$. So $d$ must divide $18$, and the divisors of $18$ are $1, 2, 3, 6, 9, 18$.'
          - problem: 'How many subgroups does the group $\mathbb{Z}_{20}$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the correspondence theorem the subgroups of $\mathbb{Z}/20\mathbb{Z}$ correspond to the subgroups $d\mathbb{Z}$ of $\mathbb{Z}$ that contain $20\mathbb{Z}$. This happens exactly when $d$ divides $20$. The divisors of $20$ are $1, 2, 4, 5, 10, 20$, so there are $6$ subgroups.'
          - problem: 'A dial has $60$ marks numbered $0$ to $59$, and a turn by $k$ marks is the element $k$ of $\mathbb{Z}_{60}$. A set of turns is closed if it contains the zero turn and stays inside the set when two of its turns are combined or one of its turns is undone. How many closed sets of turns are there?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A closed set of turns is a subgroup of $\mathbb{Z}_{60}$. By the correspondence theorem these subgroups match the divisors $d$ of $60$, because $d\mathbb{Z}$ must contain $60\mathbb{Z}$. The divisors of $60$ are $1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60$, so there are $12$ closed sets.'
          - problem: 'A dial has $60$ marks, and its turns form the group $\mathbb{Z}_{60}$. Two turns are regarded as the same when they differ by a turn in the subgroup $15\mathbb{Z}/60\mathbb{Z}$, that is, by a multiple of $15$ marks. How many different turns remain after this identification?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identification forms the quotient $(\mathbb{Z}/60\mathbb{Z})/(15\mathbb{Z}/60\mathbb{Z})$. The subgroup $15\mathbb{Z}/60\mathbb{Z}$ has $4$ elements, so the quotient has $60/4 = 15$ elements. This agrees with the third isomorphism theorem, which gives $\mathbb{Z}/15\mathbb{Z}$.'
          - problem: 'In $\mathbb{Z}_{24}$ the subgroup $8\mathbb{Z}/24\mathbb{Z}$ consists of the elements $0$, $8$ and $16$. How many subgroups of $\mathbb{Z}_{24}$ contain $8\mathbb{Z}/24\mathbb{Z}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subgroups of $\mathbb{Z}_{24}$ that contain $8\mathbb{Z}/24\mathbb{Z}$ correspond to the subgroups $d\mathbb{Z}$ of $\mathbb{Z}$ that contain $8\mathbb{Z}$. This happens exactly when $d$ divides $8$. The divisors of $8$ are $1, 2, 4, 8$, so $4$ subgroups qualify.'
          - problem: 'The group $5\mathbb{Z}/20\mathbb{Z}$ has $4$ elements. For which $m$ is the quotient $(\mathbb{Z}/20\mathbb{Z})/(5\mathbb{Z}/20\mathbb{Z})$ isomorphic to $\mathbb{Z}_m$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third isomorphism theorem cancels $20\mathbb{Z}$ and gives $(\mathbb{Z}/20\mathbb{Z})/(5\mathbb{Z}/20\mathbb{Z}) \cong \mathbb{Z}/5\mathbb{Z} \cong \mathbb{Z}_5$, so $m = 5$. The order of the quotient is $20/4 = 5$.'
          - problem: 'Let $N$ and $K$ be normal subgroups of a group $G$ with $N \subseteq K$. Suppose that $|G| = 60$, $|N| = 4$ and $|K| = 12$. How many elements does the group $(G/N)/(K/N)$ have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the third isomorphism theorem, $(G/N)/(K/N) \cong G/K$. So the order is $|G|/|K| = 60/12 = 5$. Check: $G/N$ has $15$ elements and $K/N$ has $3$, and $15/3 = 5$.'
          - problem: 'Write the full proof of the third isomorphism theorem: if $N$ and $K$ are normal subgroups of $G$ with $N \subseteq K$, then $K/N$ is normal in $G/N$ and $(G/N)/(K/N) \cong G/K$.'
            answer: '(G/N)/(K/N) is isomorphic to G/K'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Define $\varphi : G/N \to G/K$ by $\varphi(gN) = gK$. It is well defined because $gN = hN$ gives $h^{-1}g \in N \subseteq K$, hence $gK = hK$. It is a homomorphism because $\varphi(gN \cdot hN) = ghK = gK \cdot hK$, and it is onto because every coset $gK$ equals $\varphi(gN)$. Its kernel is $\{gN : g \in K\} = K/N$, so $K/N$ is normal in $G/N$. The first isomorphism theorem gives $(G/N)/(K/N) \cong G/K$.'
        constraints: 'third-theorem identifications in Z and Z_n (n <= 60); correspondence used to count or list subgroups of Z_n via divisors; the statement of the theorem is expected before use'
      - id: kp3
        name: "The first isomorphism theorem for rings"
        key_prerequisites: [quotient-rings, first-isomorphism-theorem]
        exemplars:
          - problem: 'The evaluation map $\varphi : \mathbb{Z}[x] \to \mathbb{Z}$ given by $\varphi(p) = p(3)$ is a ring homomorphism. Its kernel is the ideal generated by one monic polynomial $f$. Find $f$.'
            answer: 'x - 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide a polynomial $p$ by $x - 3$ to get $p(x) = (x-3)q(x) + r$ with $r$ an integer. Evaluating at $3$ gives $\varphi(p) = r$, so $p$ is in the kernel exactly when $r = 0$. Hence the kernel is generated by $f = x - 3$.'
          - problem: 'The evaluation map $\varphi : \mathbb{Z}[x] \to \mathbb{Z}$ given by $\varphi(p) = p(-2)$ is a ring homomorphism. Its kernel is the ideal generated by one monic polynomial $f$. Find $f$.'
            answer: 'x + 2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'A polynomial $p$ lies in the kernel exactly when $p(-2) = 0$, that is, when $x - (-2) = x + 2$ divides $p$. Division by $x + 2$ leaves the remainder $p(-2)$, which is $0$ for such $p$. So the kernel is generated by $f = x + 2$.'
          - problem: 'The reduction map $\varphi : \mathbb{Z} \to \mathbb{Z}_{12}$ sends each integer to its remainder on division by $12$. The kernel of $\varphi$ is $d\mathbb{Z}$ for one positive integer $d$. Find $d$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An integer is in the kernel exactly when its remainder on division by $12$ is $0$. These integers are the multiples of $12$, so the kernel is $12\mathbb{Z}$ and $d = 12$. The first isomorphism theorem then gives $\mathbb{Z}/12\mathbb{Z} \cong \mathbb{Z}_{12}$.'
          - problem: 'Let $\varphi : \mathbb{R}[x] \to \mathbb{C}$ be the evaluation map $\varphi(p) = p(i)$. What is the remainder when $x^3 + 2x + 1$ is divided by $x^2 + 1$?'
            answer: 'x + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'We have $x^3 + 2x + 1 = x(x^2 + 1) + (x + 1)$, so the remainder is $x + 1$. Its image $\varphi(x+1) = i + 1$ is not zero, so $x^3 + 2x + 1$ is not in the kernel.'
          - problem: 'Let $\varphi : \mathbb{R}[x] \to \mathbb{C}$ be the evaluation map $\varphi(p) = p(i)$. What is the remainder when $x^4 + 1$ is divided by $x^2 + 1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $x^4 + 1 = (x^2 - 1)(x^2 + 1) + 2$, so the remainder is $2$. This agrees with $\varphi(x^4 + 1) = i^4 + 1 = 2$, which is not zero.'
          - problem: 'Let $\varphi : \mathbb{R}[x] \to \mathbb{C}$ be the evaluation map $\varphi(p) = p(i)$. What is the remainder when $2x^3 + x^2 + 4x + 5$ is divided by $x^2 + 1$?'
            answer: '2x + 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'We have $2x^3 + x^2 + 4x + 5 = (2x + 1)(x^2 + 1) + (2x + 4)$, so the remainder is $2x + 4$. Then $\varphi(p) = 2i + 4$ is not zero, so $p$ is not in the kernel.'
          - problem: 'A computer algebra system stores each element of $\mathbb{R}[x]/\langle x^2 + 1 \rangle$ by its remainder on division by $x^2 + 1$. Which remainder does it store for $x^7 + 3$?'
            answer: '-x + 3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Modulo $x^2 + 1$ we have $x^2 \equiv -1$, so $x^7 = x \cdot (x^2)^3 \equiv x \cdot (-1)^3 = -x$. Hence $x^7 + 3 \equiv -x + 3$. This agrees with $\varphi(x^7 + 3) = i^7 + 3 = 3 - i = \varphi(-x + 3)$.'
          - problem: 'A checksum assigns to each polynomial $p$ in $\mathbb{Z}[x]$ the integer $p(2)$. Write $p(x) = x^3 + 5x + 1$ as $(x-2)q(x) + r$ with $r$ an integer. Find $r$.'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Evaluating $p(x) = (x-2)q(x) + r$ at $x = 2$ gives $p(2) = r$. Here $p(2) = 8 + 10 + 1 = 19$, so $r = 19$. Indeed $x^3 + 5x + 1 = (x - 2)(x^2 + 2x + 9) + 19$.'
          - problem: 'Does $x^3 + x$ belong to the kernel of the evaluation map $\varphi : \mathbb{R}[x] \to \mathbb{C}$, $\varphi(p) = p(i)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is in the kernel"], ["no", "it does not", "it is not in the kernel"]]}
            solution_sketch: 'We compute $\varphi(x^3 + x) = i^3 + i = -i + i = 0$, so the polynomial is in the kernel. This agrees with $x^3 + x = x(x^2 + 1)$, a multiple of the generator $x^2 + 1$ of the kernel.'
          - problem: 'Write the full proof of the first isomorphism theorem for rings, and use it to show that $\mathbb{R}[x]/\langle x^2 + 1 \rangle \cong \mathbb{C}$.'
            answer: 'R[x]/<x^2+1> is isomorphic to C'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $\varphi : R \to S$ be a ring homomorphism. Its kernel is an ideal, since $\varphi(a - b) = 0$ and $\varphi(ra) = \varphi(r)\varphi(a) = 0$ for $a, b$ in the kernel. The map $r + \ker\varphi \mapsto \varphi(r)$ is well defined, respects sums and products, is injective because $\varphi(r) = 0$ means $r \in \ker\varphi$, and is onto the image. For $\varphi(p) = p(i)$ on $\mathbb{R}[x]$ the image is all of $\mathbb{C}$, since $\varphi(a + bx) = a + bi$. If $p = (x^2+1)q + (cx + d)$ and $p(i) = 0$, then $ci + d = 0$ forces $c = d = 0$, so the kernel is generated by $x^2 + 1$, and $\mathbb{R}[x]/\langle x^2+1 \rangle \cong \mathbb{C}$.'
        constraints: 'statement of the theorem and applications by evaluation and reduction maps: Z[x] -> Z, Z -> Z_n, R[x] -> C; the kernel is found by a division-with-remainder argument, and remainders are asked for directly'
    diagnostic_exemplar:
      problem: 'In $(\mathbb{Z}, +)$ take $H = 6\mathbb{Z}$ and $N = 10\mathbb{Z}$. Use the second isomorphism theorem to identify $6\mathbb{Z}/30\mathbb{Z}$, then use the third isomorphism theorem to identify $(\mathbb{Z}/30\mathbb{Z})\,/\,(6\mathbb{Z}/30\mathbb{Z})$.'
      answer: '$H + N = 2\mathbb{Z}$ (integer combinations of $6$ and $10$ are the multiples of $\gcd(6,10) = 2$) and $H \cap N = 30\mathbb{Z}$ (common multiples, $\mathrm{lcm}(6,10) = 30$). The second isomorphism theorem gives $(H+N)/N \cong H/(H \cap N)$, i.e. $2\mathbb{Z}/10\mathbb{Z} \cong 6\mathbb{Z}/30\mathbb{Z}$; both are cyclic of order $5$, so $6\mathbb{Z}/30\mathbb{Z} \cong \mathbb{Z}_5$. Since $30\mathbb{Z} \subseteq 6\mathbb{Z}$, the third isomorphism theorem cancels the common $30\mathbb{Z}$: $(\mathbb{Z}/30\mathbb{Z})/(6\mathbb{Z}/30\mathbb{Z}) \cong \mathbb{Z}/6\mathbb{Z} \cong \mathbb{Z}_6$.'
      solution_sketch: 'In $\mathbb{Z}$, the sum of two subgroups is generated by the gcd and the intersection by the lcm. Apply the diamond theorem, then cancel $30\mathbb{Z}$ with the third theorem.'
    anki_seeds:
      - front: "Second (diamond) isomorphism theorem?"
        back: "$H \\le G$, $N \\trianglelefteq G$: $\\ HN/N \\cong H/(H \\cap N)$."
        type: basic
      - front: "Third isomorphism theorem?"
        back: "$N \\le K$ both normal in $G$: $\\ (G/N)/(K/N) \\cong G/K$ — cancel the common $N$."
        type: basic
      - front: "First isomorphism theorem for rings?"
        back: "$R/\\ker\\varphi \\cong \\mathrm{im}\\,\\varphi$ as rings; the kernel of a ring homomorphism is an ideal."
        type: basic

  - id: counting-homomorphisms
    name: "Counting Homomorphisms Between Cyclic Groups"
    core: false                # enumeration exercise; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: kernels-images
        weight: 0.7
        key: true
      - id: cyclic-groups-generators
        weight: 0.8
        key: true
      - id: euclidean-algorithm
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "A homomorphism from Z_m is determined by phi(1)"
        key_prerequisites: [cyclic-groups-generators, kernels-images]
        try_first:
          problem: 'How many homomorphisms $\mathbb{Z}_3 \to \mathbb{Z}_2$ are there?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'A homomorphism is fixed by the image $h$ of $1$, and the relation $3 \cdot 1 = 0$ forces $3h = 0$ in $\mathbb{Z}_2$. This leaves only $h = 0$, so the trivial map is the only homomorphism.'
        exemplars:
          - problem: 'How many homomorphisms $\varphi : \mathbb{Z}_9 \to \mathbb{Z}_6$ are there?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of $\mathbb{Z}_9$ is determined by $h = \varphi(1)$, and the relation $9 \cdot 1 = 0$ requires $9h \equiv 0 \pmod 6$. This holds exactly when $h$ is even, so $h \in \{0, 2, 4\}$ and there are $3$ homomorphisms.'
          - problem: 'How many homomorphisms $\mathbb{Z} \to \mathbb{Z}_5$ are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $\mathbb{Z}$ is generated by $1$ and has no relation, so any choice of $\varphi(1) \in \mathbb{Z}_5$ gives a homomorphism. There are $5$ choices, hence $5$ homomorphisms.'
          - problem: 'How many homomorphisms $\varphi : \mathbb{Z}_{12} \to \mathbb{Z}_8$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism is fixed by $h = \varphi(1)$, and the relation $12 \cdot 1 = 0$ requires $12h \equiv 0 \pmod 8$. This simplifies to $4h \equiv 0 \pmod 8$, so $h$ is even and $h \in \{0, 2, 4, 6\}$. There are $4$ homomorphisms.'
          - problem: 'A homomorphism $\varphi : \mathbb{Z}_8 \to \mathbb{Z}_{12}$ is determined by the value $\varphi(1)$. Which elements of $\mathbb{Z}_{12}$ can be the value $\varphi(1)$?'
            answer: '0, 3, 6, 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relation $8 \cdot 1 = 0$ requires $8h \equiv 0 \pmod{12}$. Dividing by $4$ gives $2h \equiv 0 \pmod 3$, so $3$ divides $h$. The multiples of $3$ in $\mathbb{Z}_{12}$ are $0, 3, 6, 9$.'
          - problem: 'How many homomorphisms are there from $\mathbb{Z}_7$ to the group $(\mathbb{Z}, +)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image $a = \varphi(1)$ must satisfy $7a = 0$ in $\mathbb{Z}$, and the only integer with $7a = 0$ is $a = 0$, since $\mathbb{Z}$ has no nonzero element of finite order. So only the trivial homomorphism exists, and the count is $1$.'
          - problem: 'A dial with $12$ clicks is wired to a switch with $18$ positions so that turning the dial by $k$ clicks turns the switch by $ks$ positions, where $s$ is a fixed whole number with $0 \le s \le 17$. After $12$ clicks the dial is back at its start, so the switch must be back at its start as well. How many values of $s$ are possible?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'This is a homomorphism $\mathbb{Z}_{12} \to \mathbb{Z}_{18}$ sending $1$ to $s$, and the return to the start requires $12s \equiv 0 \pmod{18}$. Dividing by $6$ gives $2s \equiv 0 \pmod 3$, so $3$ divides $s$. The values $0, 3, 6, 9, 12, 15$ work, which makes $6$ values.'
          - problem: 'A work cycle of $5$ days is matched to a calendar cycle of $10$ days so that shifting the work cycle by $k$ days shifts the calendar by $kt$ days, for a fixed $t$ in $\mathbb{Z}_{10}$. After $5$ days the work cycle is back at its start, so the calendar must be back at its start too. How many values of $t$ are possible?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matching is a homomorphism $\mathbb{Z}_5 \to \mathbb{Z}_{10}$ with $1 \mapsto t$, and the relation $5 \cdot 1 = 0$ requires $5t \equiv 0 \pmod{10}$. This holds exactly when $t$ is even, so $t \in \{0, 2, 4, 6, 8\}$ and there are $5$ values.'
          - problem: 'How many homomorphisms $\mathbb{Z}_6 \to \mathbb{Z}_4$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image $h$ of $1$ must satisfy $6h \equiv 0 \pmod 4$, which means $2h \equiv 0 \pmod 4$ and so $h$ is even. Thus $h \in \{0, 2\}$ and there are $2$ homomorphisms. The relation $6 \cdot 1 = 0$ rules out $h = 1$ and $h = 3$.'
          - problem: 'Does $1 \mapsto 5$ define a homomorphism from $\mathbb{Z}_8$ to $\mathbb{Z}_{12}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is a homomorphism"], ["no", "it does not", "it is not a homomorphism", "not a homomorphism"]]}
            solution_sketch: 'The rule is well defined only if $8 \cdot 5 = 0$ in $\mathbb{Z}_{12}$. But $8 \cdot 5 = 40 \equiv 4 \pmod{12}$, which is not $0$, so the rule is not a homomorphism.'
        constraints: 'determination-by-generator arguments; targets of order <= 18; relations and contexts stated without the count formula'
      - id: kp2
        name: "The gcd count for Z_m -> Z_n"
        key_prerequisites: [cyclic-groups-generators, euclidean-algorithm]
        exemplars:
          - problem: 'How many homomorphisms are there from $\mathbb{Z}_{12}$ to $\mathbb{Z}_{18}$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism is fixed by $a = \varphi(1)$ with $12a \equiv 0 \pmod{18}$. This means $2a \equiv 0 \pmod 3$, so $a$ is a multiple of $3$. The $6$ values $0, 3, 6, 9, 12, 15$ agree with $\gcd(12,18) = 6$.'
          - problem: 'Count the group homomorphisms $\mathbb{Z}_8 \to \mathbb{Z}_6$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of homomorphisms from $\mathbb{Z}_m$ to $\mathbb{Z}_n$ is $\gcd(m, n)$, because the solutions of $ma \equiv 0 \pmod n$ form a subgroup of order $\gcd(m,n)$. Here $\gcd(8, 6) = 2$, with $1 \mapsto 0$ or $1 \mapsto 3$.'
          - problem: 'Determine the number of group homomorphisms from $\mathbb{Z}_{20}$ to $\mathbb{Z}_{30}$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism is fixed by the image $a$ of $1$, which must satisfy $20a \equiv 0 \pmod{30}$. The Euclidean algorithm gives $30 = 1 \cdot 20 + 10$ and $20 = 2 \cdot 10$, so $\gcd(20,30) = 10$. There are $10$ homomorphisms.'
          - problem: 'Find the number of homomorphisms from $\mathbb{Z}_{16}$ into $\mathbb{Z}_{12}$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The count equals $\gcd(16, 12)$. The Euclidean algorithm gives $16 = 1 \cdot 12 + 4$ and $12 = 3 \cdot 4$, so $\gcd(16,12) = 4$ and there are $4$ homomorphisms.'
          - problem: 'For a homomorphism $f : \mathbb{Z}_{21} \to \mathbb{Z}_{14}$, how many elements of $\mathbb{Z}_{14}$ can be the value $f(1)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element $a$ can be $f(1)$ exactly when $21a \equiv 0 \pmod{14}$, and the number of such $a$ is $\gcd(21, 14)$. The Euclidean algorithm gives $21 = 1 \cdot 14 + 7$ and $14 = 2 \cdot 7$, so $\gcd(21,14) = 7$. There are $7$ possible values.'
          - problem: 'Suppose that $1 \le m \le 30$ and that there are exactly $8$ homomorphisms from $\mathbb{Z}_m$ to $\mathbb{Z}_{16}$. Find the largest possible $m$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of homomorphisms equals $\gcd(m, 16)$, so we need $\gcd(m, 16) = 8$. Then $m$ is a multiple of $8$ but not of $16$, so $m = 8k$ with $k$ odd. With $m \le 30$ this allows $m = 8$ and $m = 24$, and the largest is $24$.'
          - problem: 'A machine repeats a program of $28$ steps, and a counter repeats a cycle of $42$ steps. A consistent translation sends program step $k$ to counter step $ka$ for a fixed $a$ in $\mathbb{Z}_{42}$, so that $28$ program steps give $0$ on the counter. How many such translations exist?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A translation is a homomorphism $\mathbb{Z}_{28} \to \mathbb{Z}_{42}$ with $1 \mapsto a$, and it needs $28a \equiv 0 \pmod{42}$. The number of solutions $a$ is $\gcd(28, 42) = 14$, so there are $14$ translations.'
          - problem: 'A wheel has $24$ positions and a second wheel has $36$ positions. A link rule sends position $k$ of the first wheel to position $ka$ of the second, for a fixed $a$, and a full turn of the first wheel must give a full turn of the second. How many link rules are there?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A link rule is a homomorphism $\mathbb{Z}_{24} \to \mathbb{Z}_{36}$ with $1 \mapsto a$, so $24a \equiv 0 \pmod{36}$. The number of valid $a$ is $\gcd(24, 36) = 12$. There are $12$ link rules.'
          - problem: 'How many homomorphisms $\mathbb{Z}_{10} \to \mathbb{Z}_{25}$ are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correct count is $\gcd(10, 25) = 5$, not the least common multiple. Directly, $10a \equiv 0 \pmod{25}$ means $2a \equiv 0 \pmod 5$, so $a$ is a multiple of $5$ and $a \in \{0, 5, 10, 15, 20\}$. That gives $5$ homomorphisms, and $50$ is larger than $|\mathbb{Z}_{25}|$.'
          - problem: 'Is there a homomorphism from $\mathbb{Z}_{15}$ to $\mathbb{Z}_{28}$ other than the zero map?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is"], ["no", "there is not", "there is no such homomorphism", "no such homomorphism", "there is none", "none"]]}
            solution_sketch: 'The number of homomorphisms from $\mathbb{Z}_{15}$ to $\mathbb{Z}_{28}$ is $\gcd(15, 28) = 1$. So only the zero map exists, and no other homomorphism does.'
        constraints: 'm, n <= 42; the count is gcd(m, n); contexts translate a cycle of m steps into a cycle of n steps'
      - id: kp3
        name: "Surjective and injective homomorphism counts"
        key_prerequisites: [cyclic-groups-generators, kernels-images]
        exemplars:
          - problem: 'How many surjective homomorphisms $\mathbb{Z}_{12} \to \mathbb{Z}_4$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $4$ divides $12$, every choice of $\varphi(1) \in \mathbb{Z}_4$ gives a homomorphism. The map is onto exactly when $\varphi(1)$ generates $\mathbb{Z}_4$, which happens for the $\varphi(4) = 2$ elements $1$ and $3$.'
          - problem: 'How many injective homomorphisms $\mathbb{Z}_4 \to \mathbb{Z}_8$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of $\mathbb{Z}_4$ is injective exactly when $\varphi(1)$ has order $4$. The elements of order $4$ in $\mathbb{Z}_8$ are $2$ and $6$, so there are $2$ injective homomorphisms.'
          - problem: 'How many surjective homomorphisms $\mathbb{Z}_{24} \to \mathbb{Z}_8$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism $\mathbb{Z}_{24} \to \mathbb{Z}_8$ is fixed by $\varphi(1) \in \mathbb{Z}_8$, and every choice works because $8$ divides $24$. The map is onto exactly when $\varphi(1)$ generates $\mathbb{Z}_8$, so $\varphi(1) \in \{1, 3, 5, 7\}$ and there are $4$ such maps.'
          - problem: 'Count the injective homomorphisms from $\mathbb{Z}_9$ to $\mathbb{Z}_{45}$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism from $\mathbb{Z}_9$ is injective exactly when $\varphi(1)$ has order $9$. Since $9$ divides $45$, the elements of order $9$ in $\mathbb{Z}_{45}$ are the multiples $5j$ with $\gcd(j, 9) = 1$, namely $5, 10, 20, 25, 35, 40$. There are $6$ of them.'
          - problem: 'How many one-to-one homomorphisms $\mathbb{Z}_6 \to \mathbb{Z}_9$ exist?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A one-to-one homomorphism out of $\mathbb{Z}_6$ needs an element of order $6$ in $\mathbb{Z}_9$. The order of every element of $\mathbb{Z}_9$ divides $9$, and $6$ does not divide $9$. So there are $0$ such elements and $0$ such homomorphisms.'
          - problem: 'A dial with $18$ positions is connected to an indicator with $9$ lamps in a cycle, so that turning the dial by $k$ positions advances the indicator by $ks$ lamps for a fixed whole number $s$ with $0 \le s \le 8$. The indicator must be able to reach every lamp. How many values of $s$ work?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The connection is a homomorphism $\mathbb{Z}_{18} \to \mathbb{Z}_9$ with $1 \mapsto s$, and every $s$ is allowed because $9$ divides $18$. Every lamp is reached exactly when $s$ generates $\mathbb{Z}_9$, that is $\gcd(s, 9) = 1$. This gives $s \in \{1, 2, 4, 5, 7, 8\}$, so $6$ values.'
          - problem: 'A rota of $6$ days is placed into a calendar cycle of $30$ days: turning the rota by $k$ days moves the calendar by $ka$ days for a fixed $a$ in $\mathbb{Z}_{30}$, and different rota days must land on different calendar days. How many values of $a$ work?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The placement is a homomorphism $\mathbb{Z}_6 \to \mathbb{Z}_{30}$, and different days land on different days exactly when it is injective. That requires $a$ to have order $6$, which means $\gcd(a, 30) = 5$. The values are $a = 5$ and $a = 25$, so there are $2$.'
          - problem: 'How many surjective homomorphisms $\mathbb{Z}_{24} \to \mathbb{Z}_{12}$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'All $12$ choices give homomorphisms, but the map is onto only when the image of $1$ generates $\mathbb{Z}_{12}$. The generators are the elements coprime to $12$, namely $1, 5, 7, 11$, so there are $\varphi(12) = 4$ surjective homomorphisms.'
          - problem: 'Is there an injective homomorphism from $\mathbb{Z}_{10}$ to $\mathbb{Z}_{25}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is"], ["no", "there is not", "there is no such homomorphism", "no such homomorphism", "there is none", "none"]]}
            solution_sketch: 'An injective homomorphism out of $\mathbb{Z}_{10}$ needs an element of order $10$ in $\mathbb{Z}_{25}$. Every element order in $\mathbb{Z}_{25}$ divides $25$, and $10$ does not divide $25$, so there is none.'
          - problem: 'Is there an injective homomorphism from $\mathbb{Z}_5$ to $\mathbb{Z}_{20}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is"], ["no", "there is not", "there is no such homomorphism", "no such homomorphism", "there is none", "none"]]}
            solution_sketch: 'The group $\mathbb{Z}_{20}$ has elements of order $5$, because $5$ divides $20$. For example $1 \mapsto 4$ is injective, since $4$ has order $5$ in $\mathbb{Z}_{20}$. In fact there are $4$ such homomorphisms.'
        constraints: 'surjective count phi(n) when n | m, otherwise 0; injective count = number of elements of order m in the target; moduli <= 45'
    diagnostic_exemplar:
      problem: 'How many surjective homomorphisms are there from $\mathbb{Z}_{20}$ to $\mathbb{Z}_{10}$?'
      answer: '4'
      solution_sketch: 'A homomorphism is determined by $a = \varphi(1)$, subject to $20a \equiv 0 \pmod{10}$ — true for every $a$, so there are $\gcd(20,10) = 10$ homomorphisms in all. It is onto exactly when $a$ generates $\mathbb{Z}_{10}$, i.e. $\gcd(a,10) = 1$: $\varphi(10) = 4$ choices, namely $a = 1, 3, 7, 9$.'
    anki_seeds:
      - front: "Number of group homomorphisms $\\mathbb{Z}_m \\to \\mathbb{Z}_n$?"
        back: "$\\gcd(m, n)$."
        type: basic
      - front: "A homomorphism out of a cyclic group is completely determined by..."
        back: "The image of one generator."
        type: basic

  - id: classifying-small-groups
    name: "Classifying Small Groups"
    core: false                # classification capstone; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: isomorphism-invariants
        weight: 0.8
        key: true
      - id: consequences-of-lagrange
        weight: 0.7
        key: true
      - id: direct-products
        weight: 0.6
        key: false
    knowledge_points:
      - id: kp1
        name: "Orders 1-5: only cyclic and Klein"
        key_prerequisites: [consequences-of-lagrange, isomorphism-invariants]
        exemplars:
          - problem: 'Up to isomorphism, how many groups of order $4$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By Lagrange''s theorem every element of a group of order $4$ has order $1$, $2$ or $4$. If some element has order $4$, the group is cyclic and isomorphic to $\mathbb{Z}_4$. Otherwise every non-identity element has order $2$, which gives the Klein four-group $\mathbb{Z}_2 \times \mathbb{Z}_2$. These two groups are not isomorphic, so there are $2$.'
          - problem: 'A group $G$ of order $4$ contains an element of order $4$. To which group is $G$ isomorphic?'
            answer: 'Z_4'
            answer_contract: {"kind": "label", "options": [["Z_4", "Z4", "C_4", "Z/4Z", "cyclic", "cyclic group", "the cyclic group of order 4", "the cyclic group Z_4"], ["Z_2 × Z_2", "Z_2 x Z_2", "Z2 x Z2", "Z2×Z2", "Z2xZ2", "Z_2×Z_2", "Klein four-group", "Klein"]]}
            solution_sketch: 'An element of order $4$ generates a subgroup with $4$ elements, which is all of $G$. So $G$ is cyclic, isomorphic to $\mathbb{Z}_4$. The Klein four-group $\mathbb{Z}_2 \times \mathbb{Z}_2$ has no element of order $4$, so it is not $G$.'
          - problem: 'A group $G$ of order $4$ satisfies $x^2 = e$ for every $x \in G$. How many elements of order $2$ does $G$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every non-identity element $x$ satisfies $x^2 = e$, so it has order $2$. The group has $4$ elements and exactly one is the identity, so $3$ elements have order $2$. This is the Klein four-group.'
          - problem: 'Up to isomorphism, how many groups of order $5$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By Lagrange''s theorem every non-identity element of a group of order $5$ has order $5$. Such an element generates the whole group, so the group is cyclic. All cyclic groups of order $5$ are isomorphic, so there is exactly $1$ group.'
          - problem: 'A group of order $4$ has exactly one element of order $2$. How many of its elements have order $4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of a group of order $4$ have order $1$, $2$ or $4$. One element is the identity and exactly one has order $2$, so the other two have order $4$. The group is $\mathbb{Z}_4$, whose elements of order $4$ are $1$ and $3$.'
          - problem: 'Up to isomorphism, how many non-abelian groups of order at most $5$ are there?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A group of order $1$ is trivial, and each prime order $2$, $3$ or $5$ gives a cyclic group, which is abelian. The two groups of order $4$ are $\mathbb{Z}_4$ and $\mathbb{Z}_2 \times \mathbb{Z}_2$, and both are abelian. So there are $0$ non-abelian groups of order at most $5$.'
          - problem: 'The symmetries of a rectangle that is not a square are the identity, the half-turn, and the reflections in the two midlines. They form a group of order $4$. How many symmetries in this group have order $2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The half-turn and each of the two reflections undo themselves when applied twice, so each has order $2$. Only the identity has order $1$, and no symmetry has order $4$, so there are $3$ symmetries of order $2$. The group is the Klein four-group.'
          - problem: 'A dial can be turned by a set $G$ of exactly $5$ turns that is closed under combining two turns and under undoing a turn. How many turns in $G$ return the dial to its start only after $5$ repetitions and not sooner?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $G$ is a group of order $5$. By Lagrange''s theorem the order of a turn divides $5$, so each turn other than the identity has order $5$. There are $5 - 1 = 4$ such turns, and each of them generates $G$.'
        constraints: 'orders <= 5; case analysis on element orders; contexts: symmetry groups of order 4 and dials with 5 turns'
      - id: kp2
        name: "Order 6 and order 2p"
        key_prerequisites: [consequences-of-lagrange, isomorphism-invariants]
        exemplars:
          - problem: 'A group $G$ of order $6$ is abelian. To which group is $G$ isomorphic?'
            answer: 'Z_6'
            answer_contract: {"kind": "label", "options": [["Z_6", "Z6", "C_6", "Z/6Z", "cyclic", "cyclic group", "the cyclic group of order 6", "the cyclic group Z_6"], ["S_3", "S3", "D_3", "symmetric group", "the symmetric group S_3", "dihedral", "the dihedral group of order 6"]]}
            solution_sketch: 'Up to isomorphism the groups of order $6$ are $\mathbb{Z}_6$ and $S_3$. The group $S_3$ is not abelian, since $(1\,2)(1\,3) \neq (1\,3)(1\,2)$. So an abelian group of order $6$ is isomorphic to $\mathbb{Z}_6$.'
          - problem: 'A group $G$ of order $6$ is not abelian. How many elements of order $2$ does $G$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A non-abelian group of order $6$ is isomorphic to $S_3 \cong D_3$. Its elements of order $2$ are the three reflections, namely the transpositions $(1\,2)$, $(1\,3)$ and $(2\,3)$. So there are $3$ elements of order $2$.'
          - problem: 'The rotations and reflections that map a regular pentagon onto itself form a non-abelian group of order $10$. How many symmetries in this group have order $2$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A non-abelian group of order $10$ is dihedral, so this group is $D_5$. Its $5$ rotations other than the identity have order $5$, and its $5$ reflections each have order $2$. So there are $5$ symmetries of order $2$.'
          - problem: 'A group of order $10$ has exactly one element of order $2$. How many elements of order $10$ does it have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dihedral group $D_5$ has $5$ elements of order $2$, so a group of order $10$ with exactly one such element is cyclic, isomorphic to $\mathbb{Z}_{10}$. The elements of order $10$ in $\mathbb{Z}_{10}$ are the generators $1, 3, 7, 9$, so there are $4$.'
          - problem: 'A regular heptagon has $14$ symmetries, the rotations and the reflections, and these form a non-abelian group. How many symmetries in this group have order $7$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The symmetry group is $D_7$. The $7$ reflections have order $2$, and the rotations by multiples of $360/7$ degrees other than the identity have order $7$. There are $7 - 1 = 6$ such rotations, so $6$ symmetries have order $7$.'
          - problem: 'A group of order $14$ has no element of order $14$. How many elements of order $2$ does it have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the order $2p$ classification a group of order $14$ is $\mathbb{Z}_{14}$ or $D_7$. Without an element of order $14$ it is not cyclic, so it is $D_7$. The $7$ reflections of $D_7$ have order $2$, so there are $7$ elements of order $2$.'
          - problem: 'Up to isomorphism, how many groups of order $10$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A group of order $10 = 2 \cdot 5$ is either cyclic, isomorphic to $\mathbb{Z}_{10}$, or non-abelian, isomorphic to the dihedral group $D_5$. These two are not isomorphic, since one is abelian and the other is not. So there are $2$.'
          - problem: 'A group of order $6$ has an element of order $6$. How many elements of order $3$ does it have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A group of order $6$ with an element of order $6$ is cyclic, isomorphic to $\mathbb{Z}_6$. The elements of order $3$ in $\mathbb{Z}_6$ are $2$ and $4$. So there are $2$ elements of order $3$.'
        constraints: 'orders 6, 10, 14: the cyclic versus dihedral dichotomy may be quoted; contexts are symmetry groups of regular polygons'
      - id: kp3
        name: "Recognizing a given group in the catalog"
        key_prerequisites: [isomorphism-invariants]
        exemplars:
          - problem: 'The set $U(12) = \{1, 5, 7, 11\}$ of units modulo $12$ is a group under multiplication modulo $12$. Which familiar group is it isomorphic to?'
            answer: 'Z_2 × Z_2'
            answer_contract: {"kind": "label", "options": [["Z_4", "Z4", "C_4", "Z/4Z", "cyclic", "cyclic group", "the cyclic group of order 4", "the cyclic group Z_4"], ["Z_2 × Z_2", "Z_2 x Z_2", "Z2 x Z2", "Z2×Z2", "Z2xZ2", "Z_2×Z_2", "Klein four-group", "Klein"], ["S_3", "S3", "symmetric group"], ["D_4", "D4", "dihedral group of order 8"], ["D_5", "D5", "dihedral group of order 10"]]}
            solution_sketch: 'The group $U(12)$ has order $\varphi(12) = 4$, so it is $\mathbb{Z}_4$ or $\mathbb{Z}_2 \times \mathbb{Z}_2$, since $S_3$, $D_4$ and $D_5$ have orders $6$, $8$ and $10$. Here $5^2 = 25 \equiv 1$, $7^2 = 49 \equiv 1$ and $11^2 = 121 \equiv 1 \pmod{12}$, so no element has order $4$. Hence $U(12) \cong \mathbb{Z}_2 \times \mathbb{Z}_2$.'
          - problem: 'How many elements of order $4$ does the group $U(8) = \{1, 3, 5, 7\}$ of units modulo $8$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $3^2 = 9 \equiv 1$, $5^2 = 25 \equiv 1$ and $7^2 = 49 \equiv 1 \pmod 8$, so every non-identity element has order $2$. Thus $U(8)$ has $0$ elements of order $4$, and it is the Klein four-group.'
          - problem: 'What is the order of the element $3$ in the group $U(14)$ of units modulo $14$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers of $3$ modulo $14$ are $3, 9, 13, 11, 5, 1$, so $3$ has order $6$. Since $U(14)$ has order $\varphi(14) = 6$, the element $3$ generates the group, which is therefore cyclic and isomorphic to $\mathbb{Z}_6$.'
          - problem: 'A rotor has $16$ positions, and a step of size $k$ moves it $k$ positions forward. The step sizes that reach every position are the units modulo $16$, and they form the group $U(16)$ under multiplication modulo $16$. How many step sizes other than $1$ are their own inverse?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A step size $k$ is its own inverse when $k^2 \equiv 1 \pmod{16}$, that is, when $k$ has order $2$. In $U(16) = \{1, 3, 5, 7, 9, 11, 13, 15\}$ the solutions other than $1$ are $7$, $9$ and $15$, since $49 \equiv 81 \equiv 225 \equiv 1 \pmod{16}$. So there are $3$.'
          - problem: 'The dihedral group $D_4$ of order $8$ has centre $Z(D_4) = \{e, r^2\}$, so the quotient group $D_4/Z(D_4)$ has order $4$. How many elements of order $2$ does $D_4/Z(D_4)$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four cosets of $Z(D_4)$ are $\{e, r^2\}$, $\{r, r^3\}$, $\{s, r^2 s\}$ and $\{rs, r^3 s\}$. Squaring any coset other than the first gives the coset $\{e, r^2\}$, so each of the $3$ non-trivial cosets has order $2$. The quotient is the Klein four-group.'
          - problem: 'The group $\mathbb{Z}_3 \times \mathbb{Z}_4$ has order $12$. What is the order of its element $(1, 1)$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order of a pair in a direct product is the least common multiple of the orders of its entries. Here $1$ has order $3$ in $\mathbb{Z}_3$ and order $4$ in $\mathbb{Z}_4$, so $(1,1)$ has order $\operatorname{lcm}(3,4) = 12$. Hence $\mathbb{Z}_3 \times \mathbb{Z}_4$ is cyclic, isomorphic to $\mathbb{Z}_{12}$.'
          - problem: 'The set $U(10) = \{1, 3, 7, 9\}$ of units modulo $10$ is a group under multiplication modulo $10$. Which familiar group is it isomorphic to?'
            answer: 'Z_4'
            answer_contract: {"kind": "label", "options": [["Z_4", "Z4", "C_4", "Z/4Z", "cyclic", "cyclic group", "the cyclic group of order 4", "the cyclic group Z_4"], ["Z_2 × Z_2", "Z_2 x Z_2", "Z2 x Z2", "Z2×Z2", "Z2xZ2", "Z_2×Z_2", "Klein four-group", "Klein"], ["S_3", "S3", "symmetric group"], ["D_4", "D4", "dihedral group of order 8"]]}
            solution_sketch: 'The group $U(10)$ has order $\varphi(10) = 4$, so only $\mathbb{Z}_4$ and $\mathbb{Z}_2 \times \mathbb{Z}_2$ are possible, as $S_3$ and $D_4$ have orders $6$ and $8$. The powers of $3$ are $3, 9, 7, 1$, so $3$ has order $4$ and generates the group. Hence $U(10) \cong \mathbb{Z}_4$.'
          - problem: 'A rotor has $11$ positions, and a step of size $k$ with $1 \le k \le 10$ moves it $k$ positions forward. The step sizes form the group $U(11)$ under multiplication modulo $11$. What is the order of the step size $2$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers of $2$ modulo $11$ are $2, 4, 8, 5, 10, 9, 7, 3, 6, 1$, so $1$ appears first at the tenth power. Hence $2$ has order $10$ and generates $U(11)$, which is therefore cyclic.'
          - problem: 'The group $U(15)$ has $8$ elements. What is the largest order of an element of $U(15)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group $U(15) = \{1, 2, 4, 7, 8, 11, 13, 14\}$ has order $8$, but a group of order $8$ is cyclic only if some element has order $8$. The powers of $2$ are $2, 4, 8, 1$, and the other elements have order at most $4$ as well, so the largest order is $4$. Hence $U(15)$ is not cyclic.'
        constraints: 'U(n) for n <= 16, small quotients and products; match against Z_n, Klein, S_3, D_4, D_5'
    diagnostic_exemplar:
      problem: 'The group $U(18)$ has order $6$. Decide which of the two groups of order $6$ it is, and name the invariant that settles it.'
      answer: 'Up to isomorphism the groups of order $6$ are $\mathbb{Z}_6$ and $S_3 \cong D_3$, separated by commutativity (equivalently, by having an element of order $6$). $U(18) = \{1,5,7,11,13,17\}$ is abelian, since multiplication mod $18$ is commutative, so $U(18) \cong \mathbb{Z}_6$. Concretely $5$ has order $6$: $5,\ 25 \equiv 7,\ 35 \equiv 17,\ 85 \equiv 13,\ 65 \equiv 11,\ 55 \equiv 1$, so $U(18) = \langle 5 \rangle$.'
      answer_contract: {kind: none}
      solution_sketch: 'Recall the order-$6$ catalogue, then test the separating invariant on $U(18)$ — abelian-ness, confirmed by exhibiting a generator.'
    anki_seeds:
      - front: "The two groups of order 4 up to isomorphism?"
        back: "$\\mathbb{Z}_4$ and the Klein four-group $\\mathbb{Z}_2 \\times \\mathbb{Z}_2$."
        type: basic
      - front: "The two groups of order 6 up to isomorphism?"
        back: "$\\mathbb{Z}_6$ and $S_3$ (the smallest non-abelian group)."
        type: basic
      - front: "Groups of order $2p$ ($p$ odd prime)?"
        back: "$\\mathbb{Z}_{2p}$ and $D_p$."
        type: basic

  - id: free-groups-presentations
    name: "Free Groups and Presentations"
    core: true                 # category-theory builds on the free group (free-forgetful adjunction, "the free group on one generator is Z"); machinery
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - {id: direct-products, weight: 0.3, key: false}            # L1 #9: kp3 constraints match presentations to Z_m x Z_n via commuting generators
      - id: group-isomorphisms
        weight: 0.6
        key: true
      - id: dihedral-groups
        weight: 0.6
        key: true
      - id: quotient-groups
        weight: 0.5
        key: false
      - id: cyclic-groups-generators
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Free groups and reduced words"
        key_prerequisites: [group-isomorphisms, cyclic-groups-generators]
        exemplars:
          - problem: 'In the free group $F(\{a, b\})$, reduce the word $b^{-1}\,a\,a^{-1}\,b\,a^{3}$.'
            answer: 'a^3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cancel the adjacent pair $a\,a^{-1}$ to get $b^{-1}\,b\,a^3$. Then cancel $b^{-1}\,b$ to get $a^3$. No adjacent inverse pair remains, so the reduced word is $a^3$.'
          - problem: 'In the free group $F(\{a\})$ the product $a^{7}\,a^{-12}\,a^{2}$ equals $a^n$ for one integer $n$. Find $n$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a free group on one generator the exponents add, because $a^m a^n = a^{m+n}$. So $n = 7 - 12 + 2 = -3$.'
          - problem: 'To which familiar group is the free group $F(\{a\})$ on one generator isomorphic?'
            answer: 'Z'
            answer_contract: {"kind": "label", "options": [["Z", "(Z,+)", "the integers", "integers", "the group Z", "infinite cyclic", "infinite cyclic group", "infinite"], ["Z_n", "a finite cyclic group", "finite cyclic", "a finite one"], ["Z^2", "Z × Z", "Z x Z", "Z×Z"]]}
            solution_sketch: 'The reduced words of $F(\{a\})$ are the powers $a^n$ with $n \in \mathbb{Z}$, and these are all different. The map $a^n \mapsto n$ is an isomorphism onto $(\mathbb{Z}, +)$, so the group is infinite cyclic and is not a finite cyclic group.'
          - problem: 'In the free group $F(\{a, b\})$, what is the length of the reduced form of $a\,b\,b^{-1}\,a^{-1}\,b\,a$? (The length of an element is the number of letters in its reduced word.)'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cancel $b\,b^{-1}$ to get $a\,a^{-1}\,b\,a$, then cancel $a\,a^{-1}$ to get $b\,a$. The word $b\,a$ has no adjacent inverse pair, so the reduced form has length $2$.'
          - problem: 'Do $ab$ and $ba$ represent the same element of the free group $F(\{a, b\})$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they do", "they are equal"], ["no", "they do not", "they are not equal", "not equal"]]}
            solution_sketch: 'Both $ab$ and $ba$ are reduced words, and different reduced words represent different elements of a free group. So $ab \neq ba$, and $F(\{a,b\})$ is not abelian.'
          - problem: 'A machine has two reversible instructions $a$ and $b$, and $x^{-1}$ means undoing the instruction $x$. Two instructions cancel only when one is immediately followed by its undo, and no other relation holds. The program $a\,b^{-1}\,b\,a\,a^{-1}\,a\,b$ is run. What is the least number of instructions in an equivalent program?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cancel $b^{-1}\,b$ to get $a\,a\,a^{-1}\,a\,b$. Cancel $a\,a^{-1}$ to get $a\,a\,b$. No adjacent pair cancels now, so the shortest equivalent program has $3$ instructions.'
          - problem: 'In a cipher, the step $w = x\,y\,x^{-1}$ is applied twice in a row and then the step $u = x\,y^{-1}\,x^{-1}$, where $x$ and $y$ are free generators. What is the length of the reduced word for the combined message $w\,w\,u$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $x\,y\,x^{-1}\,x\,y\,x^{-1}\,x\,y^{-1}\,x^{-1}$. Cancelling $x^{-1}\,x$ twice gives $x\,y\,y\,y^{-1}\,x^{-1}$, and cancelling $y\,y^{-1}$ gives $x\,y\,x^{-1}$. This word is reduced and has length $3$.'
          - problem: 'In $F(\{a, b\})$, what is the length of the reduced word of $a\,b\,a^{-1}\,b^{-1}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only an inverse pair that sits side by side can cancel. In $a\,b\,a^{-1}\,b^{-1}$ no letter stands next to its own inverse, so the word is already reduced and has length $4$. Letters that are not adjacent cancel only if $ab = ba$.'
        constraints: 'words of length <= 10 on at most 2 generators; the answer is a power of one generator, a length, or a verdict, because a word in two generators is not graded; F on 2 generators is non-abelian (ab and ba are distinct reduced words)'
      - id: kp2
        name: "The universal property: generators map freely"
        key_prerequisites: [group-isomorphisms]
        exemplars:
          - problem: 'How many homomorphisms are there from the free group $F(\{a, b\})$ to $\mathbb{Z}_5$?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism from a free group is determined by the images of $a$ and $b$, and any images are allowed. There are $5$ choices for each, so $5 \cdot 5 = 25$ homomorphisms.'
          - problem: 'How many homomorphisms are there from $F(\{a\})$ to $\mathbb{Z}_2 \times \mathbb{Z}_4$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The generator $a$ may be sent to any element, since a free group imposes no relation. The group $\mathbb{Z}_2 \times \mathbb{Z}_4$ has $2 \cdot 4 = 8$ elements, so there are $8$ homomorphisms.'
          - problem: 'How many homomorphisms exist from the free group on three generators $a$, $b$, $c$ to $\mathbb{Z}_3$?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the three generators may be sent to any of the $3$ elements of $\mathbb{Z}_3$, independently of the others. That gives $3 \cdot 3 \cdot 3 = 27$ homomorphisms.'
          - problem: 'Let $F$ be the free group on $\{a, b\}$. How many homomorphisms $F \to S_3$ are there?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The images of $a$ and $b$ may be any elements of $S_3$, which has $6$ elements. So there are $6 \cdot 6 = 36$ homomorphisms.'
          - problem: 'Unlike a free group, the cyclic group $\mathbb{Z}_6$ satisfies $6 \cdot 1 = 0$. How many group homomorphisms are there from $\mathbb{Z}_6$ to $\mathbb{Z}_4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism sends $1$ to an element $x$ of $\mathbb{Z}_4$ with $6x \equiv 0 \pmod 4$, which means $2x \equiv 0 \pmod 4$. So $x \in \{0, 2\}$, and only $2$ of the $4$ elements are allowed, unlike the free case where all $4$ work.'
          - problem: 'Determine the number of homomorphisms from $\mathbb{Z}_5$ to $\mathbb{Z}_8$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism sends $1$ to an element $x$ of $\mathbb{Z}_8$ with $5x \equiv 0 \pmod 8$. Since $\gcd(5, 8) = 1$, the only solution is $x = 0$, so the trivial map is the only one. A free group on one generator would have $8$ homomorphisms to $\mathbb{Z}_8$.'
          - problem: 'A robot understands two instructions $a$ and $b$ and their undos, and its programs are arbitrary words in these four symbols with no other rules. An interpretation of each instruction as a turn of a dial with $5$ positions, so that programs combine as turns do, is a homomorphism from $F(\{a, b\})$ to $\mathbb{Z}_5$. How many interpretations are there?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interpretation is fixed by the turn assigned to $a$ and the turn assigned to $b$, and every pair of turns works because there are no rules. That gives $5 \cdot 5 = 25$ interpretations.'
          - problem: 'A control panel has $4$ independent switches. Each switch is assigned a position of a dial with $6$ positions, and the switches act as free generators. How many assignments define a homomorphism from the free group on $4$ generators to $\mathbb{Z}_6$?'
            answer: '1296'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the $4$ generators may be sent to any of the $6$ elements of $\mathbb{Z}_6$, independently. So there are $6^4 = 6 \cdot 6 \cdot 6 \cdot 6 = 1296$ assignments.'
          - problem: 'The free group on $k$ generators has exactly $4096$ homomorphisms to $\mathbb{Z}_4$. How many generators does it have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $4^k$ homomorphisms from the free group on $k$ generators to $\mathbb{Z}_4$. We need $4^k = 4096$, and $4^6 = 4096$, so $k = 6$.'
          - problem: 'How many homomorphisms from $F(\{a, b\})$ to $\mathbb{Z}_3$ are there?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The images of $a$ and $b$ are chosen independently, and each can be any of the $3$ elements of $\mathbb{Z}_3$. So the number is the product $3 \cdot 3 = 9$, not the sum.'
        constraints: 'hom counts |G|^(number of generators) with |G| <= 8 and up to 4 generators; contrast with the constrained counts for Z_m -> Z_n'
      - id: kp3
        name: "Presentations by generators and relations"
        key_prerequisites: [dihedral-groups, quotient-groups]
        try_first:
          problem: 'How many elements does the group $\langle a \mid a^{7} = e \rangle$ have?'
          answer_contract: {"kind": "exact"}
          answer: '7'
          reveal: 'Every element is a power $a^i$, and the relation $a^7 = e$ makes $a^7$ the same as the identity, so only $a^0, a^1, \dots, a^6$ remain. The relation caps the order of the group at $7$.'
        exemplars:
          - problem: 'Which familiar group is presented by $\langle a \mid a^{9} = e \rangle$?'
            answer: 'Z_9'
            answer_contract: {"kind": "label", "options": [["Z_9", "Z9", "C_9", "the cyclic group of order 9", "cyclic of order 9", "Z/9Z", "the cyclic group Z_9"], ["Z_3", "Z3", "the cyclic group of order 3"], ["Z_18", "Z18", "the cyclic group of order 18"], ["D_9", "D9", "the dihedral group of order 18"]]}
            solution_sketch: 'The group is generated by one element $a$ whose only relation is $a^9 = e$. Every element is a power $a^i$ with $0 \le i < 9$, and these $9$ powers are different. So the group is cyclic of order $9$, isomorphic to $\mathbb{Z}_9$.'
          - problem: 'Which familiar group is presented by $\langle r, s \mid r^5 = s^2 = e,\ srs = r^{-1} \rangle$?'
            answer: 'D_5'
            answer_contract: {"kind": "label", "options": [["D_5", "D5", "the dihedral group of order 10", "dihedral group of order 10", "dihedral", "the dihedral group D_5", "dihedral group D_5"], ["Z_10", "Z10", "the cyclic group of order 10"], ["Z_5", "Z5", "the cyclic group of order 5"], ["D_6", "D6", "the dihedral group of order 12"]]}
            solution_sketch: 'Every word reduces to $r^i s^j$ with $0 \le i < 5$ and $j \in \{0, 1\}$, so the group has at most $10$ elements. A rotation $r$ of order $5$ that a reflection $s$ turns into its inverse is the defining pattern of the dihedral group, so the group is $D_5$ of order $10$.'
          - problem: 'How many elements does the group $\langle a, b \mid a^2 = b^5 = e,\ ab = ba \rangle$ have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $ab = ba$, every word reduces to $a^i b^j$ with $0 \le i < 2$ and $0 \le j < 5$. This gives at most $2 \cdot 5$ elements. The group is the direct product $\mathbb{Z}_2 \times \mathbb{Z}_5$, which has exactly $10$ elements.'
          - problem: 'How many elements does the group $\langle r, s \mid r^3 = s^2 = e,\ srs = r^{-1} \rangle$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relation $srs = r^{-1}$ lets every word reduce to $r^i s^j$ with $0 \le i < 3$ and $j \in \{0, 1\}$, so there are at most $3 \cdot 2 = 6$ elements. The group is the symmetry group $D_3$ of an equilateral triangle, and its $6$ normal forms are distinct.'
          - problem: 'In the group $\langle a, b \mid a^3 = b^4 = e,\ ab = ba \rangle$, what is the order of the element $ab$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relations present the direct product $\mathbb{Z}_3 \times \mathbb{Z}_4$, in which $ab$ corresponds to the pair $(1, 1)$. The order of $(1,1)$ is $\operatorname{lcm}(3, 4) = 12$, so $ab$ generates the whole group of order $12$.'
          - problem: 'How many elements of order $2$ does the group $\langle r, s \mid r^4 = s^2 = e,\ srs = r^{-1} \rangle$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relations give the dihedral group $D_4$ of order $8$, whose elements are $r^i s^j$ with $0 \le i < 4$ and $j \in \{0, 1\}$. Among the rotations only $r^2$ has order $2$, and each of the $4$ reflections $s, rs, r^2 s, r^3 s$ has order $2$. That gives $1 + 4 = 5$ elements of order $2$.'
          - problem: 'A rotary dial has $12$ positions, and one click is the generator $a$ of the group $\langle a \mid a^{12} = e \rangle$. Turning the dial by $8$ clicks repeatedly returns it to its start after how many turns, that is, what is the order of $a^8$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is cyclic of order $12$, so $a^8$ has order $12/\gcd(8, 12) = 12/4 = 3$. Indeed $a^8$, $a^{16} = a^4$ and $a^{24} = e$ show the dial back at its start after $3$ turns.'
          - problem: 'The symmetries of a regular hexagonal tile are generated by a rotation $r$ through $60$ degrees and a reflection $s$, with $r^6 = s^2 = e$ and $srs = r^{-1}$. How many symmetries does the tile have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every symmetry is $r^i s^j$ with $0 \le i < 6$ and $j \in \{0, 1\}$, so there are at most $6 \cdot 2 = 12$ symmetries. The group is the dihedral group $D_6$, in which all $12$ forms are distinct, so the tile has $12$ symmetries.'
        constraints: 'match presentations to Z_n, D_n (n <= 6) and Z_m x Z_n (via commuting generators); the answer is an order, an element order, an element count or a familiar-group label; the fact that the relations cap the order may be quoted'
    diagnostic_exemplar:
      problem: 'How many homomorphisms are there from the free group $F(\{a, b\})$ to $\mathbb{Z}_3$, and which group does the presentation $\langle x \mid x^5 = e \rangle$ define?'
      answer: '$3^2 = 9$ homomorphisms; the presentation defines $\mathbb{Z}_5$.'
      answer_contract: {kind: none}
      solution_sketch: 'Generators of a free group map freely; a single generator with $x^5 = e$ gives the cyclic group of order $5$.'
    anki_seeds:
      - front: "What is the free group $F(S)$?"
        back: "Reduced words in the generators $S$ and their inverses, multiplied by concatenation-then-cancellation; no relations hold except the forced ones."
        type: basic
      - front: "Free group on one generator?"
        back: "$F(\\{a\\}) \\cong (\\mathbb{Z}, +)$."
        type: basic
      - front: "Presentation of the dihedral group $D_n$?"
        back: "$\\langle r, s \\mid r^n = s^2 = e,\\ srs = r^{-1} \\rangle$."
        type: basic
