    expected_time_secs: 210
    prerequisites:
      - id: irreducibility-factorization
        weight: 0.8
        key: true
      - id: fields-characteristic
        weight: 0.4
        key: false
      - id: simplifying-radicals
        weight: 0.5
        key: true
      # kp2 and the diagnostic solve (x-1)^2 = 2; the quadratic-formula retarget
      # removed this technique from the closure. Restored directly.
      - id: square-root-property
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Algebraic vs transcendental'
        key_prerequisites: [irreducibility-factorization, simplifying-radicals]
        exemplars:
          - problem: 'A number is algebraic over $\mathbb{Q}$ when it is a root of a nonzero polynomial with rational coefficients. Find the monic quadratic with rational coefficients that has $\sqrt3 + 2$ as a root.'
            answer: 'x^2 - 4x + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt3 + 2$, so $x - 2 = \sqrt3$. Squaring gives $(x - 2)^2 = 3$, which is $x^2 - 4x + 4 = 3$, that is $x^2 - 4x + 1 = 0$. So the polynomial is $x^2 - 4x + 1$.'
          - problem: 'Find the monic quadratic with rational coefficients that has $\sqrt5 - 3$ as a root.'
            answer: 'x^2 + 6x + 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt5 - 3$, so $x + 3 = \sqrt5$. Squaring gives $(x + 3)^2 = 5$, which is $x^2 + 6x + 9 = 5$, that is $x^2 + 6x + 4 = 0$. So the polynomial is $x^2 + 6x + 4$.'
          - problem: 'Find the monic cubic with rational coefficients that has $\sqrt[3]{5} - 2$ as a root.'
            answer: 'x^3 + 6x^2 + 12x + 3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt[3]{5} - 2$, so $x + 2 = \sqrt[3]{5}$. Cubing gives $(x + 2)^3 = 5$, which is $x^3 + 6x^2 + 12x + 8 = 5$, that is $x^3 + 6x^2 + 12x + 3 = 0$.'
          - problem: 'Which of the numbers $\sqrt2$, $1 + \sqrt3$, $\frac57$ and $\pi$ is transcendental over $\mathbb{Q}$?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt2$ is a root of $x^2 - 2$, the number $1 + \sqrt3$ is a root of $x^2 - 2x - 2$, and $\frac57$ is a root of $7x - 5$. By Lindemann''s theorem no nonzero polynomial with rational coefficients has $\pi$ as a root, so $\pi$ is the transcendental number.'
          - problem: 'Find the monic polynomial of degree $4$ with rational coefficients that has $\sqrt2 + \sqrt3$ as a root.'
            answer: 'x^4 - 10x^2 + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt2 + \sqrt3$. Squaring gives $x^2 = 5 + 2\sqrt6$, so $x^2 - 5 = 2\sqrt6$. Squaring again gives $(x^2 - 5)^2 = 24$, which is $x^4 - 10x^2 + 25 = 24$, that is $x^4 - 10x^2 + 1 = 0$.'
          - problem: 'Is $\sqrt2 + \sqrt3$ algebraic over $\mathbb{Q}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is algebraic", "algebraic", "it is"], ["no", "it is not algebraic", "not algebraic", "it is transcendental", "transcendental", "it is not"]]}
            solution_sketch: 'The number $\sqrt2 + \sqrt3$ is a root of the nonzero polynomial $x^4 - 10x^2 + 1$, which has rational coefficients. A number that is a root of such a polynomial is algebraic, so the answer is yes.'
          - problem: 'Find the monic quadratic with rational coefficients that has $2\sqrt3 + 1$ as a root.'
            answer: 'x^2 - 2x - 11'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = 2\sqrt3 + 1$, so $x - 1 = 2\sqrt3$. Squaring gives $(x - 1)^2 = 12$, which is $x^2 - 2x + 1 = 12$, that is $x^2 - 2x - 11 = 0$.'
          - problem: 'A square plot has area $10$ square metres, and a path $1$ metre wide is added along one side. The total length of the plot and the path is $s = \sqrt{10} + 1$ metres. Find the monic quadratic with rational coefficients that has $s$ as a root.'
            answer: 'x^2 - 2x - 9'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'From $x = \sqrt{10} + 1$ we get $x - 1 = \sqrt{10}$. Squaring gives $(x - 1)^2 = 10$, which is $x^2 - 2x + 1 = 10$, that is $x^2 - 2x - 9 = 0$.'
          - problem: 'A cube has volume $2$ cubic metres, so its edge is $e = \sqrt[3]{2}$ metres. A frame uses one edge and one more metre, so its length is $e + 1$ metres. Find the monic cubic with rational coefficients that has $e + 1$ as a root.'
            answer: 'x^3 - 3x^2 + 3x - 3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'From $x = e + 1$ we get $x - 1 = e$, and $e^3 = 2$. So $(x - 1)^3 = 2$, which is $x^3 - 3x^2 + 3x - 1 = 2$, that is $x^3 - 3x^2 + 3x - 3 = 0$.'
          - problem: 'Find the monic quadratic with rational coefficients that has $\sqrt2 + 1$ as a root.'
            answer: 'x^2 - 2x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Squaring $\sqrt2 + 1$ gives $2 + 2\sqrt2 + 1$, not $2 + 1$, because of the middle term. Isolate the radical first: $x - 1 = \sqrt2$. Then $(x - 1)^2 = 2$, which is $x^2 - 2x + 1 = 2$, that is $x^2 - 2x - 1 = 0$.'
        constraints: 'find explicit annihilating polynomials of prescribed degree by isolating radicals and squaring or cubing; algebraic versus transcendental by name; square and cube roots as contexts'
      - id: kp2
        name: 'Finding minimal polynomials'
        key_prerequisites: [irreducibility-factorization]
        exemplars:
          - problem: 'Find the minimal polynomial of $2 + \sqrt3$ over $\mathbb{Q}$.'
            answer: 'x^2 - 4x + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = 2 + \sqrt3$, so $(x - 2)^2 = 3$, which gives $x^2 - 4x + 1 = 0$. The only possible rational roots are $\pm 1$, and $1 - 4 + 1 = -2$ and $1 + 4 + 1 = 6$ are nonzero. So the quadratic is irreducible over $\mathbb{Q}$ and is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $1 + \sqrt2$ over $\mathbb{Q}$.'
            answer: 'x^2 - 2x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = 1 + \sqrt2$, so $(x - 1)^2 = 2$, which gives $x^2 - 2x - 1 = 0$. Its roots $1 \pm \sqrt2$ are irrational, so it has no rational root and is irreducible. So it is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $\sqrt5 - 2$ over $\mathbb{Q}$.'
            answer: 'x^2 + 4x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt5 - 2$, so $(x + 2)^2 = 5$, which gives $x^2 + 4x - 1 = 0$. Its roots $-2 \pm \sqrt5$ are irrational, so it is irreducible over $\mathbb{Q}$. So it is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $\sqrt[3]{2}$ over $\mathbb{Q}$.'
            answer: 'x^3 - 2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The number $\sqrt[3]{2}$ is a root of $x^3 - 2$. By Eisenstein''s criterion at $p = 2$ this polynomial is irreducible over $\mathbb{Q}$. A monic irreducible polynomial with the number as a root is the minimal polynomial.'
          - problem: 'A rectangle is golden when its long side divided by its short side equals $\varphi = \frac{1 + \sqrt5}{2}$. Find the minimal polynomial of $\varphi$ over $\mathbb{Q}$.'
            answer: 'x^2 - x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'From $2x - 1 = \sqrt5$ we get $(2x - 1)^2 = 5$, which is $4x^2 - 4x - 4 = 0$, that is $x^2 - x - 1 = 0$ after dividing by $4$. Its roots $\frac{1 \pm \sqrt5}{2}$ are irrational, so it is irreducible and monic. So it is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $1 + i$ over $\mathbb{Q}$.'
            answer: 'x^2 - 2x + 2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = 1 + i$, so $(x - 1)^2 = i^2 = -1$, which gives $x^2 - 2x + 2 = 0$. Its roots $1 \pm i$ are not real, so it has no rational root and is irreducible. So it is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $\sqrt2 + \sqrt8$ over $\mathbb{Q}$.'
            answer: 'x^2 - 18'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Since $\sqrt8 = 2\sqrt2$, the number is $3\sqrt2$, and its square is $18$. So $x^2 - 18$ has it as a root. The roots $\pm 3\sqrt2$ are irrational, so $x^2 - 18$ is irreducible, and the minimal polynomial has degree $2$, not $4$.'
          - problem: 'A cube has volume $3$ cubic metres, and a beam $2$ metres long is added to one edge, so the total length is $L = 2 + \sqrt[3]{3}$ metres. Find the minimal polynomial of $L$ over $\mathbb{Q}$.'
            answer: 'x^3 - 6x^2 + 12x - 11'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Since $(x - 2)^3 = 3$, the number $L$ is a root of $x^3 - 6x^2 + 12x - 8 - 3 = x^3 - 6x^2 + 12x - 11$. Substituting $x = y + 2$ turns this into $y^3 - 3$, which is irreducible by Eisenstein''s criterion at $3$. So the cubic is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $\sqrt2 + \sqrt5$ over $\mathbb{Q}$.'
            answer: 'x^4 - 14x^2 + 9'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Write $x = \sqrt2 + \sqrt5$, so $x^2 = 7 + 2\sqrt{10}$ and $(x^2 - 7)^2 = 40$. This gives $x^4 - 14x^2 + 9 = 0$. This quartic has no rational root and no factorization into two rational quadratics, so it is irreducible and is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $1 + \sqrt3$ over $\mathbb{Q}$. Start from $(x - 1)^2 = 3$.'
            answer: 'x^2 - 2x - 2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding $(x - 1)^2 = 3$ gives $x^2 - 2x + 1 = 3$, that is $x^2 - 2x - 2 = 0$. The roots $1 \pm \sqrt3$ are irrational, so $x^2 - 2x - 2$ is irreducible and is the minimal polynomial.'
          - problem: 'Find the minimal polynomial of $\frac73$ over $\mathbb{Q}$.'
            answer: 'x - 7/3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'A rational number $r$ is a root of $x - r$. This polynomial is monic of degree $1$, so it is irreducible. The minimal polynomial of $\frac73$ is $x - \frac73$.'
        constraints: 'elements of the form a + b sqrt(d), cube roots, i, sums of two square roots; verify irreducibility explicitly; cube and golden-rectangle contexts'
      - id: kp3
        name: 'Degree of an algebraic element'
        key_prerequisites: [irreducibility-factorization]
        exemplars:
          - problem: 'What is the degree of $\sqrt5$ over $\mathbb{Q}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt5$ is a root of $x^2 - 5$, which is irreducible over $\mathbb{Q}$ because $\sqrt5$ is irrational. So the minimal polynomial is $x^2 - 5$ and the degree is $2$.'
          - problem: 'What is the degree of $\sqrt[3]{7}$ over $\mathbb{Q}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt[3]{7}$ is a root of $x^3 - 7$, which is irreducible over $\mathbb{Q}$ by Eisenstein''s criterion at $7$. So the minimal polynomial has degree $3$.'
          - problem: 'What is the degree of $\sqrt[4]{2}$ over $\mathbb{Q}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt[4]{2}$ is a root of $x^4 - 2$, which is irreducible by Eisenstein''s criterion at $2$. So the minimal polynomial is $x^4 - 2$ and the degree is $4$.'
          - problem: 'What is the degree of $\sqrt2$ over the field $\mathbb{Q}(\sqrt2)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt2$ lies in the base field $\mathbb{Q}(\sqrt2)$. So it is a root of $x - \sqrt2$, which has coefficients in that field and degree $1$. The degree is $1$.'
          - problem: 'What is the degree of $\sqrt2 + \sqrt7$ over $\mathbb{Q}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $x = \sqrt2 + \sqrt7$, so $x^2 = 9 + 2\sqrt{14}$ and $(x^2 - 9)^2 = 56$. This gives $x^4 - 18x^2 + 25 = 0$. This quartic is irreducible over $\mathbb{Q}$, so the degree is $4$.'
          - problem: 'What is the degree of $1 + \sqrt[3]{2}$ over $\mathbb{Q}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $x = 1 + \sqrt[3]{2}$, so $(x - 1)^3 = 2$, which is $x^3 - 3x^2 + 3x - 3 = 0$. This cubic is irreducible by Eisenstein''s criterion at $3$. So the degree is $3$.'
          - problem: 'What is the degree of $\sqrt{2 + \sqrt2}$ over $\mathbb{Q}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $x = \sqrt{2 + \sqrt2}$, so $x^2 = 2 + \sqrt2$ and $(x^2 - 2)^2 = 2$. This gives $x^4 - 4x^2 + 2 = 0$, which is irreducible by Eisenstein''s criterion at $2$. So the degree is $4$.'
          - problem: 'What is the degree of $\sqrt3$ over the field $\mathbb{Q}(\sqrt2)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The polynomial $x^2 - 3$ has $\sqrt3$ as a root. It is irreducible over $\mathbb{Q}(\sqrt2)$, because $\sqrt3$ is not of the form $a + b\sqrt2$ with $a, b$ rational. So the degree is $2$.'
          - problem: 'To double the volume of a cube of edge $1$ one needs a cube of edge $e = \sqrt[3]{2}$. What is the degree of $e$ over $\mathbb{Q}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $e$ is a root of $x^3 - 2$, which is irreducible over $\mathbb{Q}$. So the degree is $3$. Since $3$ is not a power of $2$, this edge cannot be constructed with straightedge and compass.'
          - problem: 'A square has area $12$ square metres. What is the degree of its side length over $\mathbb{Q}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The side length is $s = \sqrt{12} = 2\sqrt3$, a root of $x^2 - 12$. This polynomial is irreducible over $\mathbb{Q}$ because $12$ is not a perfect square. So the degree is $2$.'
          - problem: 'We have $(\sqrt[4]{2})^2 = \sqrt2$, and $\sqrt2$ has degree $2$ over $\mathbb{Q}$. What is the degree of $\sqrt[4]{2}$ over $\mathbb{Q}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt[4]{2}$ is a root of $x^2 - \sqrt2$, but this polynomial does not have rational coefficients. Over $\mathbb{Q}$ the minimal polynomial is $x^4 - 2$, which is irreducible by Eisenstein''s criterion at $2$. So the degree is $4$.'
        constraints: 'degrees 1-4; base field always stated; towers of square roots and cube roots; geometry contexts'
    diagnostic_exemplar:
      problem: 'Find the minimal polynomial of $\sqrt{3} - 1$ over $\mathbb{Q}$.'
      answer: '$x^2 + 2x - 2$'
      solution_sketch: '$(x + 1)^2 = 3$ expands to $x^2 + 2x - 2 = 0$; it is irreducible (its roots $-1 \pm \sqrt3$ are irrational), so it is the minimal polynomial, of degree $2$.'
    anki_seeds:
      - front: "Minimal polynomial of an algebraic element $\\alpha$ over $F$?"
        back: "The monic polynomial of least degree in $F[x]$ with root $\\alpha$; it is irreducible and divides every annihilator."
        type: basic
      - front: "Degree of $\\alpha$ over $F$ means..."
        back: "The degree of its minimal polynomial over $F$."
        type: basic

  - id: field-extensions-degree
    name: "Field Extensions and Degree"
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: minimal-polynomials
        weight: 0.9
        key: true
      - id: quotient-rings
        weight: 0.5
        key: false
      - id: rationalizing-denominators
        weight: 0.5
        key: true
      - id: basis-dimension
        weight: 0.4
        key: false
      # Phase C (critical gap C-4): kp1/kp2 are exactly bases and dimension over Q
      # (and C over R) — now taught in linear-algebra's basis-dimension-general-field,
      # which works Q(sqrt 2) with basis {1, sqrt 2} and dim_R C = 2.
      - id: basis-dimension-general-field
        weight: 0.5
        key: true
      # kp2 works in C = R(i); conceptual familiarity with i suffices here.
      - id: complex-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Extensions F(alpha) and basis representations"
        key_prerequisites: [minimal-polynomials, rationalizing-denominators]
        exemplars:
          - problem: 'Every element of $\mathbb{Q}(\sqrt{2})$ can be written uniquely as $a + b\sqrt2$ with $a, b \in \mathbb{Q}$. Express $\frac{1}{1 + \sqrt{2}}$ in this form.'
            answer: '-1 + sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the numerator and the denominator by the conjugate $\sqrt2 - 1$. The denominator becomes $2 - 1 = 1$, so the quotient is $-1 + \sqrt2$.'
          - problem: 'In $\mathbb{Q}(\sqrt2)$, express $\frac{1}{3 + 2\sqrt2}$ in the form $a + b\sqrt2$.'
            answer: '3 - 2sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the numerator and the denominator by the conjugate $3 - 2\sqrt2$. The denominator becomes $9 - 8 = 1$, so the quotient is $3 - 2\sqrt2$.'
          - problem: 'A rectangle has area $1$ square metre, and one side has length $2+\sqrt5$ metres. Write the other side in the form $a+b\sqrt5$ with $a,b\in\mathbb{Q}$.'
            answer: '-2 + sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The other side is the area divided by the known side, so it is $\frac{1}{2+\sqrt5}$. The conjugate $2-\sqrt5$ gives denominator $4-5=-1$, so the side is $-(2-\sqrt5)=-2+\sqrt5$.'
          - problem: 'Let $\alpha = \sqrt[3]{2}$. Every element of $\mathbb{Q}(\alpha)$ can be written uniquely as $a + b\alpha + c\alpha^2$ with $a,b,c\in\mathbb{Q}$. Express $\alpha^4 - \alpha^2$ in this form.'
            answer: '2alpha - alpha^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\alpha^3 = 2$, we get $\alpha^4 = \alpha\cdot\alpha^3 = 2\alpha$. So $\alpha^4 - \alpha^2 = 2\alpha - \alpha^2$.'
          - problem: 'Let $\alpha = \sqrt[3]{2}$. Which powers of $\alpha$ form the standard basis of $\mathbb{Q}(\alpha)$ over $\mathbb{Q}$?'
            answer: '1, alpha, alpha^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The minimal polynomial $x^3-2$ of $\alpha$ has degree $3$, so the basis has $3$ elements. The powers $1,\alpha,\alpha^2$ span, because $\alpha^3=2$ reduces every higher power.'
          - problem: 'What is $\frac{1}{3+\sqrt2}$ in $\mathbb{Q}(\sqrt2)$, written in the form $a+b\sqrt2$?'
            answer: '3/7 - sqrt(2)/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the numerator and the denominator by $3-\sqrt2$. The denominator becomes $9-2=7$, not $1$, so the quotient is $\frac{3-\sqrt2}{7}$. The quotient needs the division by $7$.'
          - problem: 'In $\mathbb{Q}(i)$, express $\frac{3 + i}{1 - i}$ in the form $a + bi$.'
            answer: '1 + 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the numerator and the denominator by the conjugate $1+i$. The numerator is $(3+i)(1+i) = 2+4i$ and the denominator is $2$, so the quotient is $1+2i$.'
          - problem: 'In $\mathbb{Q}(\sqrt5)$, reduce $(\sqrt5)^3 - 2\sqrt5 + 4$ to the form $a + b\sqrt5$.'
            answer: '4 + 3sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $(\sqrt5)^2=5$, we get $(\sqrt5)^3 = 5\sqrt5$. So the sum is $5\sqrt5 - 2\sqrt5 + 4 = 4 + 3\sqrt5$.'
          - problem: 'A rectangle has sides of length $2+\sqrt3$ metres and $3-\sqrt3$ metres. Write its area in square metres in the form $a+b\sqrt3$.'
            answer: '3 + sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the product of the sides, $(2+\sqrt3)(3-\sqrt3) = 6 - 2\sqrt3 + 3\sqrt3 - 3$. Since $(\sqrt3)^2 = 3$, this equals $3 + \sqrt3$.'
          - problem: 'Let $\alpha = \sqrt[3]{2}$. Write $\frac{1}{1+\alpha}$ in the form $a + b\alpha + c\alpha^2$ with $a,b,c\in\mathbb{Q}$.'
            answer: '1/3 - alpha/3 + alpha^2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $(1+\alpha)(1-\alpha+\alpha^2) = 1+\alpha^3 = 3$, the inverse of $1+\alpha$ is $\frac{1-\alpha+\alpha^2}{3}$. So the coefficients are $\frac13$, $-\frac13$ and $\frac13$.'
        constraints: 'quadratic and cubic extensions of Q; rationalize denominators, reduce powers'
      - id: kp2
        name: "Degree of an extension; [F(alpha):F] = deg of min poly"
        key_prerequisites: [minimal-polynomials]
        exemplars:
          - problem: 'Find $[\mathbb{Q}(\sqrt{5}):\mathbb{Q}]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt5$ is a root of $x^2-5$, which is irreducible over $\mathbb{Q}$ by Eisenstein at $5$. So the degree is $2$.'
          - problem: 'Find $[\mathbb{Q}(\sqrt[3]{11}):\mathbb{Q}]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt[3]{11}$ is a root of $x^3-11$, which is irreducible by Eisenstein at $11$. So the degree is $3$.'
          - problem: 'A real number $\alpha$ is a root of $x^5 - 6x + 3$. Eisenstein''s criterion at the prime $3$ shows that this polynomial is irreducible over $\mathbb{Q}$. Find $[\mathbb{Q}(\alpha):\mathbb{Q}]$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An irreducible monic polynomial with root $\alpha$ is the minimal polynomial of $\alpha$. Its degree is $5$, so $[\mathbb{Q}(\alpha):\mathbb{Q}]=5$.'
          - problem: 'Find $[\mathbb{Q}(\sqrt[4]{2}):\mathbb{Q}]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt[4]{2}$ is a root of $x^4-2$, which is irreducible by Eisenstein at $2$. So the degree is $4$.'
          - problem: 'What is the degree $[\mathbb{Q}(\sqrt{12}):\mathbb{Q}]$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt{12}=2\sqrt3$ is a root of $x^2-12$, which has degree $2$. The degree does not depend on the size of the number under the root sign, so it is $2$.'
          - problem: 'Find $[\mathbb{Q}(\sqrt3+\sqrt7):\mathbb{Q}]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Squaring twice gives the polynomial $x^4-20x^2+16$ with root $\sqrt3+\sqrt7$. This polynomial is irreducible over $\mathbb{Q}$, so the degree is $4$.'
          - problem: 'Adjoin a real root $\beta$ of the polynomial $x^3-3x+1$ to $\mathbb{Q}$. This polynomial has no rational root, so it is irreducible. What is the dimension of $\mathbb{Q}(\beta)$ as a vector space over $\mathbb{Q}$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A cubic with no rational root is irreducible, so it is the minimal polynomial of $\beta$. The dimension is its degree, $3$, with basis $1,\beta,\beta^2$.'
          - problem: 'Find $[\mathbb{C}:\mathbb{R}]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every complex number is $a+bi$ with $a,b\in\mathbb{R}$. So $\{1,i\}$ is a basis of $\mathbb{C}$ over $\mathbb{R}$, and the degree is $2$.'
          - problem: 'Find $[\mathbb{Q}(\sqrt[6]{2}):\mathbb{Q}]$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt[6]{2}$ is a root of $x^6-2$, which is irreducible by Eisenstein at $2$. So the degree is $6$.'
        constraints: 'simple extensions; degrees 2-6'
      - id: kp3
        name: "The tower law"
        key_prerequisites: [minimal-polynomials]
        try_first:
          problem: 'Fields satisfy $F\subseteq E\subseteq K$ with $[E:F]=2$ and $[K:E]=3$. Find $[K:F]$.'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The degree of the whole tower is the product $2\cdot3=6$, not the sum $5$. A basis of $K$ over $F$ is made of the products of basis vectors from the two steps.'
        exemplars:
          - problem: 'Let $K = \mathbb{Q}(\sqrt2, \sqrt3)$ and $E = \mathbb{Q}(\sqrt2)$. Given $[K:E] = 2$, find $[K:\mathbb{Q}]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tower is $\mathbb{Q}\subseteq E\subseteq K$ and $[E:\mathbb{Q}]=2$. By the tower law, $[K:\mathbb{Q}] = 2\cdot 2 = 4$.'
          - problem: 'Fields satisfy $F\subseteq E\subseteq K$ with $[E:F] = 4$ and $[K:E] = 5$. Find $[K:F]$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the tower law, $[K:F]=[K:E]\cdot[E:F]=5\cdot4=20$.'
          - problem: 'Fields satisfy $F\subseteq E\subseteq K$ with $[K:F] = 24$ and $[E:F] = 4$. Find $[K:E]$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the tower law, $24 = [K:E]\cdot 4$. So $[K:E] = 24/4 = 6$.'
          - problem: 'Does the field $\mathbb{Q}(\sqrt[3]{2})$ contain $\sqrt2$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","contains"],["no","it does not","does not contain"]]}
            solution_sketch: 'If $\sqrt2\in\mathbb{Q}(\sqrt[3]{2})$, then $\mathbb{Q}(\sqrt2)$ is an intermediate field of degree $2$. By the tower law $2$ divides $[\mathbb{Q}(\sqrt[3]{2}):\mathbb{Q}]=3$, which is false. So the field does not contain $\sqrt2$.'
          - problem: 'Fields satisfy $F\subseteq E\subseteq K$ with $[K:F] = 45$ and $[K:E] = 5$. Find $[E:F]$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the tower law, $45 = 5\cdot[E:F]$. So $[E:F]=45/5=9$.'
          - problem: 'Fields satisfy $F\subseteq E\subseteq K$ with $[K:F] = 30$. Can $[E:F]$ equal $6$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it can","can"],["no","it cannot","it can not","cannot"]]}
            solution_sketch: 'By the tower law, $[E:F]$ divides $[K:F]=30$. Since $30 = 6\cdot 5$, the value $6$ is possible, with $[K:E] = 5$.'
          - problem: 'Adjoin $\alpha=\sqrt[3]{2}$ to $\mathbb{Q}$ and then adjoin $\omega=e^{2\pi i/3}$ to $\mathbb{Q}(\alpha)$. We have $[\mathbb{Q}(\alpha):\mathbb{Q}]=3$ and $[\mathbb{Q}(\alpha,\omega):\mathbb{Q}(\alpha)]=2$. Find $[\mathbb{Q}(\alpha,\omega):\mathbb{Q}]$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two steps form a tower. By the tower law, the total degree is $3\cdot 2 = 6$.'
          - problem: 'Find $[\mathbb{Q}(\sqrt{5}, \sqrt[3]{2}) : \mathbb{Q}]$, given that $\sqrt5 \notin \mathbb{Q}(\sqrt[3]{2})$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The field $\mathbb{Q}(\sqrt[3]{2})$ has degree $3$. Since $\sqrt5$ is not in it, $x^2-5$ stays irreducible there, so the next step has degree $2$ and the total is $3\cdot2=6$.'
          - problem: 'A field $K$ has dimension $36$ as a vector space over $F$. A subfield $E$ has dimension $9$ over $F$. What is the dimension of $K$ as a vector space over $E$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dimensions of the steps multiply: $36=[K:E]\cdot 9$. So the dimension of $K$ over $E$ is $36/9=4$.'
          - problem: 'Let $K=\mathbb{Q}(\sqrt2,\sqrt3,\sqrt5)$. Given $[\mathbb{Q}(\sqrt2,\sqrt3):\mathbb{Q}]=4$ and $[K:\mathbb{Q}(\sqrt2,\sqrt3)]=2$, find $[K:\mathbb{Q}]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the tower law, $[K:\mathbb{Q}]=2\cdot4=8$.'
        constraints: 'towers of height 2 or 3; divisibility arguments from the tower law'
    diagnostic_exemplar:
      problem: 'Compute $[\mathbb{Q}(\sqrt[3]{2}, \sqrt{5}) : \mathbb{Q}]$, given that $\sqrt5 \notin \mathbb{Q}(\sqrt[3]2)$.'
      answer: "6"
      solution_sketch: 'Tower through $\mathbb{Q}(\sqrt[3]2)$: degree $3$, then adjoining $\sqrt5$ gives degree $2$ more; $3 \cdot 2 = 6$.'
    anki_seeds:
      - front: "$[F(\\alpha) : F]$ equals..."
        back: "The degree of the minimal polynomial of $\\alpha$ over $F$."
        type: basic
      - front: "Tower law?"
        back: "$[K : F] = [K : E]\\,[E : F]$ for fields $F \\subseteq E \\subseteq K$."
        type: basic
      - front: "Standard basis of $\\mathbb{Q}(\\sqrt2)$ over $\\mathbb{Q}$?"
        back: "$\\{1, \\sqrt2\\}$: every element is uniquely $a + b\\sqrt2$."
        type: basic

  - id: straightedge-compass-impossibility
    name: "Straightedge-Compass Impossibility"
    core: false                # supplemental applications capstone
    difficulty: 0.85
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: field-extensions-degree
        weight: 0.9
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: false
      - id: trig-ratios-definition
        weight: 0.2
        key: false
      # Phase C: the learner proving doubling-the-cube impossible has now actually
      # performed constructions (geometry's straightedge-compass-constructions).
      - id: straightedge-compass-constructions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Constructible numbers form a field of degree-2^k elements"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: 'A construction from $\mathbb{Q}$ gives fields $\mathbb{Q}=F_0\subset F_1\subset F_2\subset F_3$, where each $F_{k+1}$ has degree $2$ over $F_k$. Find $[F_3:\mathbb{Q}]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the tower law, the degrees of the three steps multiply. So $[F_3:\mathbb{Q}]=2\cdot2\cdot2=8$.'
          - problem: 'The length $\alpha=\sqrt[4]{3}$ is obtained by adjoining $\sqrt3$ to $\mathbb{Q}$ and then adjoining a square root of $\sqrt3$. The polynomial $x^4-3$ is irreducible over $\mathbb{Q}$ by Eisenstein at the prime $3$. Find $[\mathbb{Q}(\alpha):\mathbb{Q}]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\alpha$ is a root of the irreducible polynomial $x^4-3$. So the degree is $4=2\cdot2$, a power of $2$, as the two square-root steps predict.'
          - problem: 'The real number $\alpha = \sqrt[3]{3}$ has minimal polynomial $x^3 - 3$ over $\mathbb{Q}$. Is $\alpha$ constructible with straightedge and compass?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is constructible","constructible","possible"],["no","it is not constructible","not constructible","impossible","not possible","it cannot be constructed","cannot be constructed"]]}
            solution_sketch: 'The degree $[\mathbb{Q}(\alpha):\mathbb{Q}]$ is $3$. A constructible number has degree a power of $2$ over $\mathbb{Q}$, and $3$ is not a power of $2$. So $\alpha$ is not constructible.'
          - problem: 'What is the smallest degree over $\mathbb{Q}$ of a constructible number whose degree is not $1$, $2$, $4$ or $8$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Powers of $2$ continue past $8$ with $16$. A tower of four square-root steps, such as $\mathbb{Q}(\sqrt[16]{2})$ with $x^{16}-2$ irreducible, gives a constructible number of degree $16$.'
          - problem: 'A construction places five points one after another. The coordinates of each new point lie in a field of degree at most $2$ over the field generated by the earlier points. What is the largest possible degree over $\mathbb{Q}$ of the field that contains the coordinates of all five points?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step multiplies the degree by at most $2$. After five steps the largest possible degree is $2^5=32$.'
          - problem: 'The degree $3 = 2 + 1$ is a sum of powers of $2$. List the powers of $2$ that lie between $1$ and $10$.'
            answer: '1, 2, 4, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $2$ are $1, 2, 4, 8, 16, \dots$, so those between $1$ and $10$ are $1, 2, 4, 8$. The number $3$ is not in this list, so the degree $3$ is not a power of $2$. Hence $\sqrt[3]{2}$ is not constructible.'
          - problem: 'Starting from a segment of length $1$, a construction draws the diagonal of a unit square, which has length $\sqrt2$. It then draws the diagonal of a rectangle with sides $1$ and $\sqrt2$, then the diagonal of a rectangle with sides $\sqrt2$ and $\sqrt3$. Find the degree over $\mathbb{Q}$ of the smallest field that contains all three constructed lengths.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lengths are $\sqrt2$, $\sqrt3$ and $\sqrt5$. Each is not in the field before it, so each step has degree $2$. The tower law gives $2\cdot2\cdot2=8$.'
          - problem: 'The real number $\sqrt[3]{3}$ has minimal polynomial $x^3-3$ over $\mathbb{Q}$. Find $[\mathbb{Q}(\sqrt[3]{3}):\mathbb{Q}]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degree of the extension equals the degree of the minimal polynomial. The minimal polynomial is $x^3-3$, so the degree is $3$.'
          - problem: 'Write the full proof that if a length $\alpha$ is constructible by straightedge and compass, then $[\mathbb{Q}(\alpha):\mathbb{Q}]$ is a power of $2$.'
            answer: '[Q(alpha):Q] is a power of 2'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Each construction step lies in a field of degree $1$ or $2$ over the field before it. By the tower law, the field at the end of the construction has degree $2^k$ for some $k$. Since $\mathbb{Q}(\alpha)$ lies inside it, $[\mathbb{Q}(\alpha):\mathbb{Q}]$ divides $2^k$, so it is a power of $2$.'
        constraints: 'the criterion as a usable tool; degree-2 tower intuition, no analytic geometry details'
      - id: kp2
        name: "Doubling the cube and trisecting the angle"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: 'A cube has edge $1$. A cube of twice the volume has edge $\sqrt[3]{2}$. Find $[\mathbb{Q}(\sqrt[3]{2}):\mathbb{Q}]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt[3]{2}$ is a root of $x^3-2$, which is irreducible by Eisenstein at $2$. So the degree is $3$. This is not a power of $2$, so the cube cannot be doubled.'
          - problem: 'Let $c=\cos20^\circ$. The triple-angle identity $\cos3t=4\cos^3t-3\cos t$ with $t=20^\circ$ gives $4c^3-3c=\frac12$. Put $y=2c$ and write the monic polynomial in $y$ with integer coefficients that $y$ satisfies.'
            answer: 'y^3 - 3y - 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Replace $c$ by $y/2$ to get $\frac{y^3}{2}-\frac{3y}{2}=\frac12$. Multiply by $2$ and collect terms: $y^3-3y-1=0$.'
          - problem: 'The cubic $y^3-3y-1$ has no rational root. Find $[\mathbb{Q}(2\cos20^\circ):\mathbb{Q}]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only possible rational roots are $1$ and $-1$, and neither is a root. A cubic with no rational root is irreducible, so it is the minimal polynomial of $2\cos20^\circ$. The degree is $3$.'
          - problem: 'Can an angle of $60^\circ$ be trisected with straightedge and compass?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can","possible","it can be trisected"],["no","it cannot","it can not","impossible","not possible","it cannot be trisected","cannot be trisected"]]}
            solution_sketch: 'A trisection constructs $\cos20^\circ$, which has degree $3$ over $\mathbb{Q}$. The degree $3$ is not a power of $2$, so the angle cannot be trisected.'
          - problem: 'The argument below claims that $60^\circ$ can be trisected. Step 1: $\cos20^\circ$ is a root of $8x^3-6x-1$, which is irreducible over $\mathbb{Q}$. Step 2: so $[\mathbb{Q}(\cos20^\circ):\mathbb{Q}]=3$. Step 3: a constructible number has degree a power of $2$ over $\mathbb{Q}$. Step 4: since $3$ is not a power of $2$, $\cos20^\circ$ is constructible. Which step is wrong, and why?'
            answer: 'Step 4: a degree that is not a power of 2 shows that cos 20 degrees is not constructible, so the conclusion is reversed.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Steps 1 to 3 are correct. A constructible number has degree a power of $2$, so a degree of $3$ shows that $\cos20^\circ$ is not constructible. The conclusion of Step 4 is reversed, and the angle $60^\circ$ cannot be trisected.'
          - problem: 'The length $\sqrt5$ is constructible. Find $[\mathbb{Q}(\sqrt5):\mathbb{Q}]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\sqrt5$ is a root of $x^2-5$, which is irreducible by Eisenstein at $5$. The degree $2$ is a power of $2$, which fits the criterion.'
          - problem: 'A sculptor has a cube of edge $3$ metres and wants a cube of twice the volume. The new edge is $3\sqrt[3]{2}$ metres. Find the degree of $\mathbb{Q}(3\sqrt[3]{2})$ over $\mathbb{Q}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $3$ is rational, $\mathbb{Q}(3\sqrt[3]{2})=\mathbb{Q}(\sqrt[3]{2})$. This field has degree $3$ over $\mathbb{Q}$.'
          - problem: 'A square has side $3$. A square of twice the area has side $s$. Find $[\mathbb{Q}(s):\mathbb{Q}]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new area is $18$, so $s=\sqrt{18}=3\sqrt2$. Then $\mathbb{Q}(s)=\mathbb{Q}(\sqrt2)$, which has degree $2$. So doubling a square is possible.'
          - problem: 'Write the full proof that an angle of $60^\circ$ cannot be trisected with straightedge and compass.'
            answer: 'cos(20 degrees) has degree 3 over Q'
            answer_contract: {"kind":"none"}
            solution_sketch: 'A trisection of $60^\circ$ would construct $\cos20^\circ$. The number $2\cos20^\circ$ is a root of the irreducible polynomial $y^3-3y-1$, so $\cos20^\circ$ has degree $3$ over $\mathbb{Q}$. The degree $3$ is not a power of $2$, so no construction exists.'
        constraints: 'cite the criterion plus one irreducibility fact; the cubic 8x^3 - 6x - 1 may be given as irreducible'
      - id: kp3
        name: "Squaring the circle; what remains constructible"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: 'A circle has radius $1$. Find the side length of a square with the same area.'
            answer: 'sqrt(pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The circle has area $\pi\cdot1^2=\pi$. A square of side $s$ has area $s^2$, so $s^2=\pi$ and $s=\sqrt\pi$.'
          - problem: 'The regular pentagon is constructible. Its construction uses $\cos72^\circ=\frac{\sqrt5-1}{4}$. Find $[\mathbb{Q}(\cos72^\circ):\mathbb{Q}]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The field $\mathbb{Q}(\cos72^\circ)$ equals $\mathbb{Q}(\sqrt5)$, because the other terms are rational. The number $\sqrt5$ has degree $2$, a power of $2$.'
          - problem: 'A tile maker wants a regular heptagonal tile and has only straightedge and compass. The minimal polynomial of $\cos(2\pi/7)$ over $\mathbb{Q}$ is $8x^3+4x^2-4x-1$. Find $[\mathbb{Q}(\cos(2\pi/7)):\mathbb{Q}]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degree of the extension equals the degree of the minimal polynomial. This degree is $3$, which is not a power of $2$, so the tile maker cannot construct the heptagon.'
          - problem: 'Is it possible to square the circle with straightedge and compass?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is possible","possible"],["no","it is not possible","not possible","impossible"]]}
            solution_sketch: 'A square with the area of the unit circle needs the length $\sqrt\pi$. The number $\pi$ is transcendental, so $\sqrt\pi$ is not algebraic and has no degree. A constructible number is algebraic, so it is impossible.'
          - problem: 'A designer wants to draw a regular $15$-gon. The number $\cos(2\pi/15)$ has degree $\varphi(15)/2$ over $\mathbb{Q}$, and $\varphi(15)=8$. Find $[\mathbb{Q}(\cos(2\pi/15)):\mathbb{Q}]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degree is $\varphi(15)/2=8/2=4$. Since $4$ is a power of $2$, the regular $15$-gon is constructible.'
          - problem: 'The side $s$ of a square with the area of the unit circle satisfies $s^2 = \pi$. The polynomial $x^2 - c$ has the root $s$. Find $c$.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $s^2 = \pi$ we get $s^2 - \pi = 0$, so $c = \pi$. This polynomial has a coefficient that is not rational, because $\pi$ is transcendental. So $s$ has no degree over $\mathbb{Q}$, so the claim of degree $2$ is wrong.'
          - problem: 'The number $\cos(2\pi/17)$ has degree $\varphi(17)/2$ over $\mathbb{Q}$. Find $[\mathbb{Q}(\cos(2\pi/17)):\mathbb{Q}]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $17$ is prime, $\varphi(17)=16$. The degree is $16/2=8$, a power of $2$, so the regular $17$-gon is constructible.'
          - problem: 'A regular $n$-gon is constructible exactly when $\varphi(n)$ is a power of $2$. Find the smallest odd $n\ge7$ for which the regular $n$-gon is constructible.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $\varphi(n)$ for odd $n$: $\varphi(7)=6$, $\varphi(9)=6$, $\varphi(11)=10$, $\varphi(13)=12$, none a power of $2$. Then $\varphi(15)=8$, a power of $2$, so $n=15$.'
          - problem: 'Write the full proof that the regular heptagon is not constructible with straightedge and compass.'
            answer: 'cos(2pi/7) has degree 3 over Q'
            answer_contract: {"kind":"none"}
            solution_sketch: 'A constructible heptagon needs the constructible number $\cos(2\pi/7)$. Its minimal polynomial over $\mathbb{Q}$ is $8x^3+4x^2-4x-1$, so its degree is $3$. The degree $3$ is not a power of $2$, which contradicts the criterion.'
        constraints: 'quotable transcendence of pi; positive examples (pentagon, 15-gon, 17-gon) vs impossible ones (heptagon: degree 3)'
    diagnostic_exemplar:
      problem: 'Using the constructibility criterion, decide which are constructible: (a) $\sqrt[3]{5}$, (b) $\sqrt{7}$, (c) a $60^\circ$ angle trisector (i.e. $\cos 20^\circ$).'
      answer: '(a) No — degree $3$. (b) Yes — degree $2$. (c) No — degree $3$.'
      solution_sketch: 'Minimal polynomials: $x^3 - 5$ (Eisenstein at 5), $x^2 - 7$, and $8x^3 - 6x - 1$; only powers of $2$ pass.'
    anki_seeds:
      - front: "Necessary condition for a number to be straightedge-compass constructible?"
        back: "It is algebraic and $[\\mathbb{Q}(\\alpha) : \\mathbb{Q}]$ is a power of $2$."
        type: basic
      - front: "Why is doubling the cube impossible?"
        back: "It needs $\\sqrt[3]{2}$, of degree $3$ over $\\mathbb{Q}$ — not a power of $2$."
        type: basic
      - front: "Why is squaring the circle impossible?"
        back: "It needs $\\sqrt{\\pi}$, and $\\pi$ is transcendental (Lindemann), so not even algebraic."
        type: basic

  - id: splitting-fields
    name: "Splitting Fields"
    core: false                # terminal field-theory destination; its consumer (Galois theory) is not in the tree
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - {id: prime-maximal-ideals, weight: 0.5, key: false}        # L1: kp1's Kronecker step is 'irreducible => maximal => quotient is a field'
      - {id: complex-polar-form-de-moivre, weight: 0.3, key: false} # L1: kp2/kp3/diagnostic need roots of unity (omega) to list all roots
      - id: field-extensions-degree
        weight: 0.9
        key: true
      - id: irreducibility-factorization
        weight: 0.5
        key: true
      - id: quotient-rings
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Adjoining a root: Kronecker's construction"
        key_prerequisites: [quotient-rings, irreducibility-factorization]
        exemplars:
          - problem: 'The polynomial $x^2+1$ has no root in $\mathbb{Z}_3$, so it is irreducible. How many elements does the field $\mathbb{Z}_3[x]/\langle x^2+1\rangle$ have?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every coset has a unique representative $a+bx$ with $a,b\in\mathbb{Z}_3$. There are $3$ choices for each of $a$ and $b$, so the field has $3^2=9$ elements.'
          - problem: 'Let $f(x)=x^3+x+1$ over $\mathbb{Z}_2$. Since $f(0)=f(1)=1$, a cubic with no root is irreducible. Find $[\mathbb{Z}_2[x]/\langle f\rangle:\mathbb{Z}_2]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degree of the quotient field over $\mathbb{Z}_2$ equals the degree of the irreducible polynomial $f$. So the degree is $3$.'
          - problem: 'Let $\alpha$ be the coset of $x$ in $\mathbb{Q}[x]/\langle x^2-2\rangle$. Find the value of $\alpha^4$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In the quotient, $\alpha^2-2=0$, so $\alpha^2=2$. Then $\alpha^4=(\alpha^2)^2=2^2=4$.'
          - problem: 'Find the roots of $x^2+1$ in $\mathbb{Z}_5$.'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test the elements of $\mathbb{Z}_5$: $2^2+1=5\equiv0$ and $3^2+1=10\equiv0$, while $0$, $1$ and $4$ give $1$, $2$ and $2$. The roots are $2$ and $3$.'
          - problem: 'Is $\mathbb{Z}_5[x]/\langle x^2+1\rangle$ a field?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a field","field"],["no","it is not a field","not a field"]]}
            solution_sketch: 'The polynomial $x^2+1$ has the root $2$ in $\mathbb{Z}_5$, so it factors as $(x-2)(x-3)$. It is not irreducible, so the ideal is not maximal and the quotient is not a field.'
          - problem: 'A finite field with $16$ elements is built as $\mathbb{Z}_2[x]/\langle f\rangle$ with $f$ irreducible. What is the degree of $f$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient has $2^{\deg f}$ elements. The equation $2^{\deg f}=16$ gives $\deg f=4$.'
          - problem: 'Let $f(x)=x^3+2x+1$ over $\mathbb{Z}_3$. Since $f$ has no root in $\mathbb{Z}_3$, it is irreducible. How many elements does $\mathbb{Z}_3[x]/\langle f\rangle$ have?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every coset has a unique representative $a+bx+cx^2$ with $a,b,c\in\mathbb{Z}_3$. So the field has $3^3=27$ elements.'
          - problem: 'Find the roots of $x^2+1$ in $\mathbb{Z}_2$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test the elements of $\mathbb{Z}_2$: $0^2+1=1$ and $1^2+1=2\equiv0$. So $1$ is a root and $x^2+1=(x+1)^2$ is reducible, even though it has no real root.'
          - problem: 'A coding engineer needs a field with $125$ elements and builds it as $\mathbb{Z}_5[x]/\langle f\rangle$ with $f$ irreducible. What is the degree of $f$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient has $5^{\deg f}$ elements. Since $125=5^3$, the degree of $f$ is $3$.'
          - problem: 'Let $\alpha$ be the coset of $x$ in $\mathbb{Q}[x]/\langle x^3-2\rangle$. Find the value of $\alpha^3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In the quotient, $\alpha^3-2=0$. So $\alpha^3=2$.'
        constraints: 'Kronecker constructions over Z_2, Z_3, Z_5, Q with degree-2 or degree-3 polynomials; irreducibility checked by root tests'
      - id: kp2
        name: "Splitting fields over Q"
        key_prerequisites: [field-extensions-degree, complex-numbers]
        exemplars:
          - problem: 'The polynomial $p(x) = x^3 - 2$ has roots $\sqrt[3]{2}$, $\sqrt[3]{2}\,\omega$ and $\sqrt[3]{2}\,\omega^2$, where $\omega$ is a primitive cube root of unity. Find the degree over $\mathbb{Q}$ of the splitting field of $p(x)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The splitting field is $\mathbb{Q}(\sqrt[3]{2},\omega)$. The first step has degree $3$. The field $\mathbb{Q}(\sqrt[3]{2})$ is real, so $\omega$ adds degree $2$, and the total is $3\cdot2=6$.'
          - problem: 'The polynomial $p(x) = x^4 - 1$ has roots $1$, $-1$, $i$ and $-i$. Find the degree over $\mathbb{Q}$ of the splitting field of $p(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots $1$ and $-1$ are rational, so the splitting field is $\mathbb{Q}(i)$. The number $i$ is a root of $x^2+1$, so the degree is $2$.'
          - problem: 'The polynomial $p(x) = x^4 - 5x^2 + 6$ has roots $\sqrt{2}$, $-\sqrt{2}$, $\sqrt{3}$ and $-\sqrt{3}$. Find the degree over $\mathbb{Q}$ of the splitting field of $p(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The splitting field is $\mathbb{Q}(\sqrt2,\sqrt3)$. Since $\sqrt3\notin\mathbb{Q}(\sqrt2)$, the total degree is $2\cdot2=4$.'
          - problem: 'The polynomial $p(x) = x^4 - 3$ has roots $\sqrt[4]{3}$, $-\sqrt[4]{3}$, $i\sqrt[4]{3}$ and $-i\sqrt[4]{3}$. Find the degree over $\mathbb{Q}$ of the splitting field of $p(x)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The polynomial $x^4-3$ is irreducible by Eisenstein at $3$, so $\mathbb{Q}(\sqrt[4]{3})$ has degree $4$. This field is real, so adjoining $i$ adds degree $2$, and the total is $8$.'
          - problem: 'The polynomial $p(x) = x^4 - 5x^2 + 4$ has roots $1$, $-1$, $2$ and $-2$. Find the degree over $\mathbb{Q}$ of the splitting field of $p(x)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'All four roots are rational, so the splitting field is $\mathbb{Q}$ itself. Its degree over $\mathbb{Q}$ is $1$.'
          - problem: 'The solutions of $z^6=1$ in the complex numbers are $\pm1$ and $\pm\frac{1}{2}\pm\frac{\sqrt3}{2}i$. Find the degree over $\mathbb{Q}$ of the smallest field that contains all of them.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The solutions lie in $\mathbb{Q}(\sqrt3\,i)=\mathbb{Q}(\sqrt{-3})$. The number $\sqrt{-3}$ is a root of $x^2+3$, so the field has degree $2$.'
          - problem: 'The field $\mathbb{Q}(\sqrt[3]{2})$ has degree $3$ over $\mathbb{Q}$. What is the degree of the splitting field of $x^3-2$ over $\mathbb{Q}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The field $\mathbb{Q}(\sqrt[3]{2})$ is real, so it misses the roots $\sqrt[3]{2}\,\omega$ and $\sqrt[3]{2}\,\omega^2$. Adjoining $\omega$ adds degree $2$, so the degree is $3\cdot2=6$.'
          - problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $x^3-5$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots are $\sqrt[3]{5}$ times the cube roots of unity. The field $\mathbb{Q}(\sqrt[3]{5})$ has degree $3$ and is real, so $\omega$ adds degree $2$, and the total is $6$.'
          - problem: 'Consider all solutions of $z^8=1$ in the complex numbers. Find the degree over $\mathbb{Q}$ of the smallest field that contains all of them.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The solutions are the powers of $\zeta=e^{2\pi i/8}=\frac{\sqrt2}{2}(1+i)$. The smallest field containing them is $\mathbb{Q}(\sqrt2,i)$, of degree $2\cdot2=4$.'
        constraints: 'polynomials of degree <= 6 over Q with radical or root-of-unity roots; most problems exhibit the full root list'
      - id: kp3
        name: "Degrees of splitting fields"
        key_prerequisites: [field-extensions-degree, irreducibility-factorization]
        exemplars:
          - problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $(x^2 - 2)(x^2 - 3)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots are $\pm\sqrt2$ and $\pm\sqrt3$, so the splitting field is $\mathbb{Q}(\sqrt2,\sqrt3)$. Since $\sqrt3\notin\mathbb{Q}(\sqrt2)$, the degree is $2\cdot2=4$.'
          - problem: 'Let $E$ be the splitting field over $\mathbb{Q}$ of a cubic polynomial. What is the largest possible value of $[E:\mathbb{Q}]$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adjoin the roots one at a time. The first root gives degree at most $3$, the second at most $2$, and the third degree $1$. So $[E:\mathbb{Q}]\le3\cdot2\cdot1=6$. The polynomial $x^3-2$ reaches this bound, so the largest possible value is $6$.'
          - problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $x^4 + x^2 + 1$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The polynomial factors as $(x^2+x+1)(x^2-x+1)$. Both factors have roots $\pm\omega$ and $\pm\omega^2$ in $\mathbb{Q}(\omega)$, which has degree $2$.'
          - problem: 'Let $E$ be the splitting field over $\mathbb{Q}$ of $(x^3 - 2)(x^2 - 2)$. Given that $\sqrt{2}\notin\mathbb{Q}(\sqrt[3]{2},\omega)$, where $\omega$ is a primitive cube root of unity, find $[E:\mathbb{Q}]$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The splitting field of $x^3-2$ is $\mathbb{Q}(\sqrt[3]{2},\omega)$, of degree $6$. Since $\sqrt2$ is not in it, $x^2-2$ adds degree $2$, and $[E:\mathbb{Q}]=6\cdot2=12$.'
          - problem: 'The polynomial $x^3-3x+1$ is irreducible over $\mathbb{Q}$. If $\alpha$ is a root, then so are $\alpha^2-2$ and $(\alpha^2-2)^2-2$. Find the degree over $\mathbb{Q}$ of the splitting field of $x^3-3x+1$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The three roots are all polynomials in $\alpha$, so they lie in $\mathbb{Q}(\alpha)$. This field has degree $3$, so the splitting field equals $\mathbb{Q}(\alpha)$ and has degree $3$, not $6$.'
          - problem: 'Let $E$ be the splitting field of $x^4 - 2$ over $\mathbb{Q}$. Find $[E : \mathbb{Q}]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots are $i^k\sqrt[4]{2}$ for $k=0,1,2,3$. The field $\mathbb{Q}(\sqrt[4]{2})$ is real of degree $4$, and $i$ adds degree $2$. So $[E:\mathbb{Q}]=4\cdot2=8$.'
          - problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $(x^2-2)(x^2-3)(x^2-5)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The splitting field is $\mathbb{Q}(\sqrt2,\sqrt3,\sqrt5)$. Each new square root is not in the field before it, so each step has degree $2$. The total is $2\cdot2\cdot2=8$.'
          - problem: 'Each of the factors $x^2-2$ and $x^2-8$ has degree $2$. What is the degree over $\mathbb{Q}$ of the splitting field of $(x^2-2)(x^2-8)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots of $x^2-8$ are $\pm2\sqrt2$, and they lie in $\mathbb{Q}(\sqrt2)$. So the second factor adds nothing, and the splitting field is $\mathbb{Q}(\sqrt2)$ of degree $2$.'
          - problem: 'An engineer needs all four solutions of $x^4-10x^2+1=0$, which are $\pm\sqrt2\pm\sqrt3$. Find the degree over $\mathbb{Q}$ of the smallest field that contains all of them.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'All four solutions lie in $\mathbb{Q}(\sqrt2,\sqrt3)$. Conversely $\sqrt2+\sqrt3$ and $\sqrt3-\sqrt2$ give $\sqrt3$ and $\sqrt2$ by sums and differences. So the field has degree $4$.'
          - problem: 'Consider all solutions of $x^6=8$ in the complex numbers. They are $\sqrt2$ times the sixth roots of unity. Find the degree over $\mathbb{Q}$ of the smallest field that contains all of them.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The field contains $\sqrt2$ and, by division, the sixth roots of unity, which need $\sqrt{-3}$. Since $\sqrt{-3}\notin\mathbb{Q}(\sqrt2)$, the degree is $2\cdot2=4$.'
        constraints: 'tower-law computations of height <= 3; the n! bound may be quoted; non-membership facts like sqrt(3) not in Q(sqrt(2)) may be given'
    diagnostic_exemplar:
      problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $x^3 - 5$.'
      answer: "6"
      solution_sketch: 'Roots $\sqrt[3]5, \sqrt[3]5\,\omega, \sqrt[3]5\,\omega^2$: the splitting field is $\mathbb{Q}(\sqrt[3]5, \omega)$, and the tower gives $3 \cdot 2 = 6$.'
