unit: fields
course: abstract-algebra
module: "Fields"
topics:
  - id: fields-characteristic
    name: "Fields and Characteristic"
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integral-domains-zero-divisors
        weight: 0.9
        key: true
      - id: units-in-modular-rings
        weight: 0.6
        key: true
      - id: binomial-expansion
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Field axioms; fields vs domains"
        key_prerequisites: [integral-domains-zero-divisors, units-in-modular-rings]
        exemplars:
          - problem: 'What must be added to the axioms of a commutative ring with unity ($1 \neq 0$) to get a field?'
            answer: 'Every nonzero element has a multiplicative inverse.'
            answer_contract: {kind: none}
            solution_sketch: 'Fields are commutative division rings; units are everything nonzero.'
          - problem: 'Every field is an integral domain. Prove it.'
            answer: 'If $ab = 0$ and $a \neq 0$, multiply by $a^{-1}$: $b = a^{-1}ab = a^{-1}0 = 0$.'
            answer_contract: {kind: none}
            solution_sketch: 'Invertibility kills zero divisors.'
        constraints: "axiom-level questions; classify Q, R, Z, Z_n, Z[x] as field / domain / neither"
      - id: kp2
        name: "Characteristic of a ring"
        key_prerequisites: [units-in-modular-rings]
        exemplars:
          - problem: 'Find the characteristic of $\mathbb{Z}_{12}$, of $\mathbb{Q}$, and of $\mathbb{Z}_7$.'
            answer: '$12$; $0$; $7$'
            answer_contract: {kind: none}
            solution_sketch: 'The characteristic is the additive order of $1$ (or $0$ if infinite).'
          - problem: 'Prove that the characteristic of a field is $0$ or prime.'
            answer: 'If $\mathrm{char} = mn$ with $1 < m, n < mn$, then $(m\cdot 1)(n \cdot 1) = mn \cdot 1 = 0$ gives zero divisors — impossible in a field.'
            answer_contract: {kind: none}
            solution_sketch: 'A composite characteristic factors into two nonzero elements multiplying to zero.'
        constraints: "characteristics of Z_n, Q, products; the primality proof"
      - id: kp3
        name: "The Frobenius endomorphism in characteristic p"
        key_prerequisites: [units-in-modular-rings]
        exemplars:
          - problem: 'In a commutative ring of characteristic $3$, expand $(a + b)^3$.'
            answer: '$a^3 + b^3$'
            solution_sketch: 'Binomial coefficients $\binom{3}{1} = \binom{3}{2} = 3 \equiv 0$; only the end terms survive.'
          - problem: 'In $\mathbb{Z}_5$, compute $(2 + 3)^5$ and $2^5 + 3^5$, and compare.'
            answer: 'Both are $0$: $(5)^5 \equiv 0$ and $32 + 243 = 275 \equiv 0 \pmod 5$.'
            answer_contract: {kind: none}
            solution_sketch: 'The Frobenius identity $(a+b)^p = a^p + b^p$ holds in characteristic $p$.'
        constraints: "p in {2, 3, 5}; expansions verified with small numbers"
    diagnostic_exemplar:
      problem: 'In a commutative ring of characteristic $5$, expand $(a + b)^5$ in simplest form and justify which terms vanish. Then give the characteristic of a field with $25$ elements.'
      answer: '$(a+b)^5 = a^5 + b^5$: by the binomial theorem the middle coefficients are $\binom{5}{1} = 5$, $\binom{5}{2} = 10$, $\binom{5}{3} = 10$, $\binom{5}{4} = 5$, each divisible by $5$, so those terms are $0$ in characteristic $5$. A field with $25 = 5^2$ elements has characteristic $5$: its prime subfield is $\mathbb{Z}_5$, and a finite field of order $p^{n}$ has characteristic the prime $p$.'
      answer_contract: {kind: none}
      solution_sketch: 'Only the two end terms of the binomial expansion survive — this is the Frobenius map $x \mapsto x^{p}$. A finite field has prime-power order and characteristic that prime.'
    anki_seeds:
      - front: "Characteristic of a ring with unity?"
        back: "The additive order of $1$ (or $0$ if $1$ has infinite order)."
        type: basic
      - front: "The characteristic of a field is always..."
        back: "$0$ or a prime $p$."
        type: basic
      - front: "Frobenius endomorphism: in characteristic $p$, $(a+b)^p = $ ?"
        back: "$a^p + b^p$ (interior binomial coefficients vanish mod $p$)."
        type: basic

  - id: field-of-fractions
    name: "The Field of Fractions"
    core: false                # terminal construction with no in-tree consumer (re-audit: zero references to fraction fields anywhere downstream)
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: integral-domains-zero-divisors
        weight: 0.9
        key: true
      - id: fields-characteristic
        weight: 0.7
        key: true
      - id: equivalence-classes-partitions
        weight: 0.5
        key: true
      - id: polynomial-rings
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "The construction: fractions as equivalence classes"
        key_prerequisites: [integral-domains-zero-divisors, equivalence-classes-partitions]
        exemplars:
          - problem: 'Let $D$ be an integral domain. On $D \times (D \setminus \{0\})$ define $(a, b) \sim (c, d) \iff ad = bc$. Prove that $\sim$ is transitive, and point out where you use that $D$ is a domain.'
            answer: 'Suppose $(a,b) \sim (c,d)$ and $(c,d) \sim (e,f)$: $ad = bc$ and $cf = de$. Then $adf = bcf = bde$, so $d(af - be) = 0$. Since $d \neq 0$ and $D$ has no zero divisors, $af = be$, i.e. $(a,b) \sim (e,f)$. The cancellation of $d$ is exactly where the domain property is used.'
            answer_contract: {kind: none}
            solution_sketch: 'Multiply the two defining equations to a common expression and cancel $d$ — legal only without zero divisors.'
          - problem: 'Fractions are added by $\frac{a}{b} + \frac{c}{d} = \frac{ad + bc}{bd}$. Why does the denominator $bd$ stay legal, and where does that fail in a ring with zero divisors?'
            answer: 'Denominators must be nonzero: $b, d \neq 0$ gives $bd \neq 0$ precisely because a domain has no zero divisors. In $\mathbb{Z}_6$, $b = 2$ and $d = 3$ are nonzero yet $bd = 0$, so the sum would have a zero denominator — the construction breaks.'
            answer_contract: {kind: none}
            solution_sketch: 'Closure of $D \setminus \{0\}$ under multiplication is equivalent to having no zero divisors.'
        constraints: "the transitivity and denominator-closure arguments, each localizing exactly where the domain hypothesis is used; well-definedness of + or x checked on one representative change"
      - id: kp2
        name: "Recognizing fields of fractions: Q, F(x), Q(√2)"
        key_prerequisites: [integral-domains-zero-divisors, polynomial-rings, fields-characteristic]
        exemplars:
          - problem: 'Identify the field of fractions of $\mathbb{Z}$ and of $\mathbb{Q}[x]$.'
            answer: '$\mathrm{Frac}(\mathbb{Z}) = \mathbb{Q}$; $\mathrm{Frac}(\mathbb{Q}[x]) = \mathbb{Q}(x)$, the field of rational functions $p/q$ with $p, q \in \mathbb{Q}[x]$, $q \neq 0$.'
            answer_contract: {kind: none}
            solution_sketch: 'The construction applied to $\mathbb{Z}$ produces exactly the rationals; applied to a polynomial ring over a field it produces the rational-function field.'
          - problem: 'What is the field of fractions of a field $F$? Justify.'
            answer: '$F$ itself (up to isomorphism): every fraction $a/b$ equals $ab^{-1}/1$, since $b$ is already invertible in $F$, so the embedding $a \mapsto a/1$ is onto.'
            answer_contract: {kind: none}
            solution_sketch: 'Invertible denominators collapse every fraction to an element of $F$.'
        constraints: "identifications for Z, F[x] (F in {Q, Z_p}), Z[sqrt(2)] (giving Q(sqrt(2)) = {a + b sqrt(2), a, b rational}), and fields; each identification says what the elements look like"
      - id: kp3
        name: "The embedding: every domain sits inside its smallest field"
        key_prerequisites: [integral-domains-zero-divisors, fields-characteristic]
        exemplars:
          - problem: 'Prove that $\iota : D \to \mathrm{Frac}(D)$, $\iota(a) = \frac{a}{1}$, is an injective ring homomorphism.'
            answer: '$\iota(a + b) = \frac{a+b}{1} = \frac{a}{1} + \frac{b}{1}$ and $\iota(ab) = \frac{ab}{1} = \frac{a}{1} \cdot \frac{b}{1}$ by the fraction operations with denominator $1$. Injective: $\frac{a}{1} = \frac{b}{1}$ means $a \cdot 1 = 1 \cdot b$, i.e. $a = b$.'
            answer_contract: {kind: none}
            solution_sketch: 'Denominator-1 fractions add and multiply like $D$ itself; equality of such fractions unwinds to equality in $D$.'
          - problem: 'Show that any field $K$ containing an integral domain $D$ (as a subring) contains a subfield isomorphic to $\mathrm{Frac}(D)$. What does this say about $\mathbb{Q}$ and $\mathbb{Z}$?'
            answer: 'Map $\frac{a}{b} \mapsto ab^{-1} \in K$ (defined since $b \neq 0$ is invertible in $K$); it is well defined ($ad = bc \implies ab^{-1} = cd^{-1}$), a ring homomorphism, and injective since a nonzero fraction maps to a nonzero element — its image is a subfield isomorphic to $\mathrm{Frac}(D)$. Hence $\mathbb{Q}$ is (up to isomorphism) the smallest field containing $\mathbb{Z}$.'
            answer_contract: {kind: none}
            solution_sketch: 'The universal property, lite: fractions have nowhere to go but $ab^{-1}$, so $\mathrm{Frac}(D)$ embeds in every field around $D$.'
        constraints: "the embedding and minimality proofs in guided steps; conclude 'every integral domain embeds in a field' explicitly once per set"
    diagnostic_exemplar:
      problem: 'Identify the field of fractions of the integral domain $\mathbb{Z}[\sqrt{2}] = \{a + b\sqrt{2} : a, b \in \mathbb{Z}\}$ as an explicit subfield of $\mathbb{R}$, and justify your answer.'
      answer: 'It is $\mathbb{Q}(\sqrt{2}) = \{p + q\sqrt{2} : p, q \in \mathbb{Q}\}$. Every quotient of elements of $\mathbb{Z}[\sqrt2]$ lies there: for $c + d\sqrt2 \ne 0$, $\frac{a+b\sqrt2}{c+d\sqrt2} = \frac{(a+b\sqrt2)(c-d\sqrt2)}{c^2 - 2d^2}$, and $c^2 - 2d^2 \ne 0$ because $\sqrt2$ is irrational; the result has the form $p + q\sqrt2$ with $p, q \in \mathbb{Q}$. Conversely $\mathbb{Q}(\sqrt2)$ is a field containing $\mathbb{Z}[\sqrt2]$, and any field containing a domain $D$ contains a copy of $\mathrm{Frac}(D)$ via $a/b \mapsto ab^{-1}$; since each $p + q\sqrt2$ is such a quotient, $\mathrm{Frac}(\mathbb{Z}[\sqrt2]) = \mathbb{Q}(\sqrt2)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Rationalise the denominator with the conjugate; the norm $c^2 - 2d^2$ is nonzero by irrationality of $\sqrt2$. Then use that $\mathrm{Frac}(D)$ embeds in every field containing $D$, so it is the smallest such field.'
    anki_seeds:
      - front: "Field of fractions of an integral domain $D$?"
        back: "Classes of pairs $\\frac{a}{b}$ ($b \\neq 0$) with $\\frac{a}{b} = \\frac{c}{d} \\iff ad = bc$; the smallest field containing $D$ (via $a \\mapsto \\frac{a}{1}$)."
        type: basic
      - front: "$\\mathrm{Frac}(F[x]) = $ ? ($F$ a field)"
        back: "$F(x)$ — the field of rational functions $p/q$, $q \\neq 0$."
        type: basic
      - front: "Every integral domain embeds in a ______."
        back: "Field — its field of fractions, which embeds in every field containing the domain."
        type: basic

  - id: finite-fields-zp
    name: "ℤₚ and Finite Fields"                 # Unicode: names are plain text, so `Z_p` showed a literal underscore
    core: false                # terminal construction; the curriculum stops here
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: fields-characteristic
        weight: 0.9
        key: true
      - id: quotient-rings
        weight: 0.6
        key: false
      - id: euclidean-algorithm
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Arithmetic in Z_p: inverses and linear equations"
        key_prerequisites: [fields-characteristic, euclidean-algorithm]
        exemplars:
          - problem: 'Solve $3x + 5 = 1$ in $\mathbb{Z}_7$.'
            answer: '$x = 1$'
            solution_sketch: '$3x = -4 = 3$, and multiplying by $3^{-1} = 5$ gives $x = 15 = 1$. Check: $3 + 5 = 8 \equiv 1$.'
          - problem: "Find the larger solution of x^2 = 2 in Z_7."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: solve a quadratic in Z_7 by testing each residue. Step 1: compute squares modulo 7: 1^2=1, 2^2=4, 3^2=2, 4^2=2, 5^2=4, 6^2=1. Step 2: the roots are 3 and 4, so the larger root is 4. The larger solution is 4."
          - problem: "Find the inverse of 8 in Z_13."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is 8 in Z_13. Rule: an inverse x satisfies 8x = 1 modulo 13. Step 1: test x = 5: 8*5 = 40 = 3*13 + 1, so 8*5 = 1 in Z_13. Step 2: because x = 5 gives 1, it is the inverse. The inverse is 5."
          - problem: "Solve 5x + 2 = 9 in Z_11. Give the integer representative x between 0 and 10."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation is 5x + 2 = 9 in Z_11. Rule: isolate x by field arithmetic. Step 1: subtract 2 from both sides: 5x = 7 in Z_11. Step 2: the inverse of 5 modulo 11 is 9, because 5*9 = 45 = 1 in Z_11. Step 3: multiply by 9: x = 7*9 = 63 = 8 in Z_11. The solution is 8."
          - problem: "Solve x^2 + 3x + 2 = 0 in Z_7. Give the larger solution."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation is x^2 + 3x + 2 = 0 in Z_7. Rule: factor the quadratic over Z_7. Step 1: x^2 + 3x + 2 = (x+1)(x+2) = (x+6)(x+5). Step 2: set each factor to zero: x = 6 and x = 5. Step 3: the larger integer representative is 6. The larger solution is 6."
          - problem: "Find the inverse of 6 in Z_13."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is 6 in Z_13. Rule: an inverse x satisfies 6x = 1 modulo 13. Step 1: test x = 11: 6*11 = 66 = 5*13 + 1, so 6*11 = 1 in Z_13. Step 2: because x = 11 gives 1, it is the inverse. The inverse is 11."
        constraints: "p <= 13; linear and quadratic equations solved by field arithmetic"
      - id: kp2
        name: "Why Z_p is a field; Fermat inverses"
        key_prerequisites: [fields-characteristic, euclidean-algorithm]
        exemplars:
          - problem: "In Z_7, the integers 3 and 7 are coprime. Use the extended Euclidean algorithm to find the least positive integer x with 3x = 1 (mod 7)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence is 3x = 1 (mod 7). Step 1: the Euclidean algorithm gives 7 = 2*3 + 1, so 1 = 7 - 2*3. Step 2: Bezout's identity gives 3*(-2) + 7*1 = 1. Step 3: reduce -2 modulo 7 to get 5, and 3*5 = 15 = 1 (mod 7). The inverse is 5."
          - problem: "Use Fermat's little theorem to compute the inverse of 5 in Z_11. Give the residue as an integer from 0 to 10."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fermat's little theorem gives 5^10 = 1 (mod 11), so the inverse of 5 is 5^9. Compute 5^2 = 3, 5^4 = 9, 5^8 = 4 mod 11, so 5^9 = 5^8*5 = 4*5 = 20 = 9 (mod 11). The inverse is 9."
          - problem: "Use Fermat's little theorem to find 2^{-1} in Z_5. Give the answer as a residue from 0 to 4."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Since 5 is prime, Fermat's little theorem gives 2^4 = 1 (mod 5), so 2^{-1} = 2^3. Compute 2^3 = 8 = 3 (mod 5). Check 2*3 = 6 = 1 (mod 5). The inverse is 3."
          - problem: "Solve 7x = 1 (mod 11) for the residue x using Fermat's little theorem. Give x from 0 to 10."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence 7x = 1 (mod 11) has a solution because 11 is prime. Fermat's little theorem gives 7^10 = 1, so 7^{-1} = 7^9. Compute 7^2 = 5, 7^4 = 3, 7^8 = 9 mod 11, so 7^9 = 9*7 = 63 = 8 (mod 11). The residue is x = 8."
          - problem: "In Z_7, decide whether 2 is invertible. If it is, use Fermat's little theorem to find its inverse. State the verdict and the inverse residue."
            answer: "verdict = invertible; inv = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["noninvertible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "inv"}]}
            solution_sketch: "Fermat's little theorem applies because 7 is prime, so 2^6 = 1 (mod 7) and 2^{-1} = 2^5 = 32 = 4 (mod 7). Check 2*4 = 8 = 1 (mod 7). The option noninvertible is wrong because a nonzero residue modulo a prime always has an inverse. The result is verdict = invertible; inv = 4."
          - problem: "What is the multiplicative inverse of 10 modulo 11? Use Fermat's little theorem to find it and give the answer as a residue from 0 to 10."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The residue 10 is -1 modulo 11, and 11 is prime, so Fermat's little theorem gives 10^10 = 1. Thus 10^{-1} = 10^9 = (-1)^9 = -1 = 10 (mod 11). Check 10*10 = 100 = 1 (mod 11). The inverse is 10."
        constraints: "the Bezout proof; Fermat-inverse computations with p <= 11"
      - id: kp3
        name: "Finite fields beyond Z_p: order p^n"
        key_prerequisites: [fields-characteristic]
        exemplars:
          - problem: 'Is there a field with exactly $6$ elements?'
            answer: 'No: every finite field has prime-power order, and $6 = 2 \cdot 3$ is not a prime power.'
            answer_contract: {kind: none}
            solution_sketch: 'A finite field is a vector space over its prime subfield $\mathbb{Z}_p$, so its size is $p^n$.'
          - problem: 'Describe a field with $4$ elements.'
            answer: '$\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle = \{0, 1, \alpha, \alpha + 1\}$ with $\alpha^2 = \alpha + 1$.'
            answer_contract: {kind: none}
            solution_sketch: 'Quotient by an irreducible quadratic over $\mathbb{Z}_2$; the four remainders form a field.'
        constraints: "existence/size questions for orders <= 27; construction via irreducible polynomials may be quoted"
    diagnostic_exemplar:
      problem: 'Describe a field with exactly $9$ elements, justifying that it is a field, and compute the inverse of $\alpha$, the root of the polynomial you adjoin.'
      answer: 'Take $F = \mathbb{Z}_3[x]/\langle x^2 + 1\rangle$. The polynomial $x^2 + 1$ has no root in $\mathbb{Z}_3$ ($0, 1, 2$ give $1, 2, 2$), so being of degree $2$ it is irreducible; hence $\langle x^2+1\rangle$ is maximal and the quotient is a field. Its elements are $a + b\alpha$ with $a, b \in \mathbb{Z}_3$ and $\alpha$ the class of $x$, so $|F| = 3^2 = 9$. Since $\alpha^2 = -1 = 2$, we get $\alpha \cdot 2\alpha = 2\alpha^2 = 2 \cdot 2 = 4 = 1$, so $\alpha^{-1} = 2\alpha$.'
      answer_contract: {kind: none}
      solution_sketch: 'Adjoin a root of an irreducible quadratic over $\mathbb{Z}_3$ (Kronecker) to get $3^2$ elements, then invert $\alpha$ using $\alpha^2 = 2$.'
    anki_seeds:
      - front: "$\\mathbb{Z}_n$ is a field iff..."
        back: "$n$ is prime."
        type: basic
      - front: "Possible orders of finite fields?"
        back: "Exactly the prime powers $p^n$ (one field of each order, up to isomorphism)."
        type: basic
      - front: "Fermat inverse formula in $\\mathbb{Z}_p$?"
        back: "$a^{-1} = a^{p-2}$ for $a \\not\\equiv 0$."
        type: basic

  - id: minimal-polynomials
    name: "Algebraic Numbers and Minimal Polynomials"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: irreducibility-factorization
        weight: 0.8
        key: true
      - id: fields-characteristic
        weight: 0.4
        key: false
      - id: simplifying-radicals
        weight: 0.5
        key: true
      # kp2 and the diagnostic solve (x-1)^2 = 2; the quadratic-formula retarget
      # removed this technique from the closure. Restored directly.
      - id: square-root-property
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Algebraic vs transcendental"
        key_prerequisites: [irreducibility-factorization, simplifying-radicals]
        exemplars:
          - problem: 'An element $\alpha \in \mathbb{R}$ is algebraic over $\mathbb{Q}$ when some nonzero $f \in \mathbb{Q}[x]$ has $f(\alpha) = 0$. Give such an $f$ for $\alpha = \sqrt{3} + 2$.'
            answer: '$x^2 - 4x + 1$'
            solution_sketch: 'Isolate the radical and square: $(x - 2)^2 = 3$, i.e. $x^2 - 4x + 1 = 0$, a nonzero rational polynomial killing $\sqrt3 + 2$.'
          - problem: 'Name a transcendental number.'
            answer: '$\pi$'
            solution_sketch: 'Lindemann proved $\pi$ transcendental (transcendence may be quoted, not proved): no nonzero polynomial with rational coefficients kills it. $e$ is another valid answer.'
        constraints: "find explicit annihilating polynomials by isolating radicals and squaring"
      - id: kp2
        name: "Finding minimal polynomials"
        key_prerequisites: [irreducibility-factorization]
        exemplars:
          - problem: 'Find the minimal polynomial of $\sqrt[3]{2}$ over $\mathbb{Q}$.'
            answer: '$x^3 - 2$'
            solution_sketch: 'It annihilates $\sqrt[3]2$ and is irreducible by Eisenstein at $p = 2$; minimal polynomials are the monic irreducible annihilators.'
          - problem: 'Find the minimal polynomial of $1 + \sqrt{2}$ over $\mathbb{Q}$.'
            answer: '$x^2 - 2x - 1$'
            solution_sketch: '$(x - 1)^2 = 2$ gives the quadratic; it is irreducible since its roots $1 \pm \sqrt2$ are irrational.'
          - problem: "Find the minimal polynomial over Q of 3 + sqrt(2)."
            answer: "x^2 - 6x + 7"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The candidate polynomial is x^2 - 6x + 7. Step 1: let alpha = 3 + sqrt(2), so alpha - 3 = sqrt(2); squaring gives (x - 3)^2 = 2, which expands to x^2 - 6x + 7 = 0. Step 2: the rational root test allows only 1, -1, 7, and -7, and none is a root, so the quadratic is irreducible over Q. Step 3: a minimal polynomial is the monic irreducible annihilator, so the minimal polynomial is x^2 - 6x + 7."
          - problem: "Find the minimal polynomial over Q of sqrt(5) - 2."
            answer: "x^2 + 4x - 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The candidate polynomial is x^2 + 4x - 1. Step 1: set alpha = sqrt(5) - 2, so alpha + 2 = sqrt(5); squaring gives (x + 2)^2 = 5 and x^2 + 4x - 1 = 0. Step 2: its roots are -2 plus or minus sqrt(5), which are irrational, so it has no rational root and is irreducible over Q. Step 3: the monic irreducible annihilator is the minimal polynomial, so the answer is x^2 + 4x - 1."
          - problem: "Find the minimal polynomial over Q of the real cube root of 5."
            answer: "x^3 - 5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The candidate polynomial is x^3 - 5. Step 1: let alpha be the real cube root of 5, so alpha^3 = 5 and x^3 - 5 annihilates it. Step 2: Eisenstein at p = 5 applies because 5 divides -5, 25 does not divide -5, and 5 does not divide the leading coefficient 1, so x^3 - 5 is irreducible over Q. Step 3: hence the minimal polynomial is x^3 - 5."
          - problem: "Find the minimal polynomial over Q of 2 plus the real cube root of 3."
            answer: "x^3 - 6x^2 + 12x - 11"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The candidate polynomial is x^3 - 6x^2 + 12x - 11. Step 1: let alpha = 2 plus the real cube root of 3, so alpha - 2 has cube 3; cubing x - 2 gives (x - 2)^3 = 3, which expands to x^3 - 6x^2 + 12x - 11. Step 2: substitute x = y + 2; the polynomial becomes y^3 - 3, and Eisenstein at p = 3 shows y^3 - 3 is irreducible, so the original cubic is irreducible over Q. Step 3: therefore the minimal polynomial is x^3 - 6x^2 + 12x - 11."
        constraints: "elements of the form a + b sqrt(d), cube roots; verify irreducibility explicitly"
      - id: kp3
        name: "Degree of an algebraic element"
        key_prerequisites: [irreducibility-factorization]
        exemplars:
          - problem: 'What is the degree of $\sqrt{5}$ over $\mathbb{Q}$?'
            answer: "2"
            solution_sketch: 'The degree is that of the minimal polynomial $x^2 - 5$, so $2$. (Over $\mathbb{R}$ it would drop to $1$, with min poly $x - \sqrt5$: degree depends on the base field.)'
          - problem: 'Find the degree of $\sqrt[3]{7}$ over $\mathbb{Q}$.'
            answer: "3"
            solution_sketch: '$x^3 - 7$ is irreducible by Eisenstein at $7$.'
          - problem: "Let $\\alpha = \\sqrt[4]{2}$. Find the degree of $\\alpha$ over $\\mathbb{Q}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let alpha = $\\sqrt[4]{2}$. First, alpha satisfies $x^4 - 2 = 0$, so $x^4 - 2$ is a candidate minimal polynomial. Second, Eisenstein at 2 shows $x^4 - 2$ is irreducible over $\\mathbb{Q}$. The minimal polynomial has degree 4, so the degree is 4."
          - problem: "Let $\\alpha = \\sqrt{2}$ and let the base field be $\\mathbb{Q}(\\sqrt{2})$. Find the degree of $\\alpha$ over this base field."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let alpha = $\\sqrt{2}$. The base field is $\\mathbb{Q}(\\sqrt{2})$, and alpha already lies in this field. Its minimal polynomial over the base field is $x - \\sqrt{2}$, which has degree 1. Therefore the degree is 1."
          - problem: "Let $\\alpha = \\sqrt{3} + \\sqrt{2}$. Find the degree of $\\alpha$ over $\\mathbb{Q}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let alpha = $\\sqrt{3} + \\sqrt{2}$. Squaring gives $alpha^2 = 5 + 2\\sqrt{6}$, so $(alpha^2 - 5)^2 = 24$. This gives the polynomial $x^4 - 10x^2 + 1 = 0$. The rational root test and a check of quadratic factorizations show it is irreducible over $\\mathbb{Q}$. Hence the minimal polynomial has degree 4, so the degree is 4."
          - problem: "Let $\\alpha = 1 + \\sqrt[3]{2}$. Find the degree of $\\alpha$ over $\\mathbb{Q}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let alpha = $1 + \\sqrt[3]{2}$. Then $alpha - 1 = \\sqrt[3]{2}$, so $(alpha - 1)^3 = 2$. Expanding gives $alpha^3 - 3alpha^2 + 3alpha - 3 = 0$. The polynomial $x^3 - 3x^2 + 3x - 3$ is irreducible by Eisenstein at 3. Hence the minimal polynomial has degree 3, so the degree is 3."
        constraints: "degrees 1-4; base field always stated"
    diagnostic_exemplar:
      problem: 'Find the minimal polynomial of $\sqrt{3} - 1$ over $\mathbb{Q}$.'
      answer: '$x^2 + 2x - 2$'
      solution_sketch: '$(x + 1)^2 = 3$ expands to $x^2 + 2x - 2 = 0$; it is irreducible (its roots $-1 \pm \sqrt3$ are irrational), so it is the minimal polynomial, of degree $2$.'
    anki_seeds:
      - front: "Minimal polynomial of an algebraic element $\\alpha$ over $F$?"
        back: "The monic polynomial of least degree in $F[x]$ with root $\\alpha$; it is irreducible and divides every annihilator."
        type: basic
      - front: "Degree of $\\alpha$ over $F$ means..."
        back: "The degree of its minimal polynomial over $F$."
        type: basic

  - id: field-extensions-degree
    name: "Field Extensions and Degree"
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: minimal-polynomials
        weight: 0.9
        key: true
      - id: quotient-rings
        weight: 0.5
        key: false
      - id: rationalizing-denominators
        weight: 0.5
        key: true
      - id: basis-dimension
        weight: 0.4
        key: false
      # Phase C (critical gap C-4): kp1/kp2 are exactly bases and dimension over Q
      # (and C over R) — now taught in linear-algebra's basis-dimension-general-field,
      # which works Q(sqrt 2) with basis {1, sqrt 2} and dim_R C = 2.
      - id: basis-dimension-general-field
        weight: 0.5
        key: true
      # kp2 works in C = R(i); conceptual familiarity with i suffices here.
      - id: complex-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Extensions F(alpha) and basis representations"
        key_prerequisites: [minimal-polynomials, rationalizing-denominators]
        exemplars:
          - problem: 'Every element of $\mathbb{Q}(\sqrt{2})$ can be written uniquely as $a + b\sqrt2$ with $a, b \in \mathbb{Q}$. Express $\frac{1}{1 + \sqrt{2}}$ in this form.'
            answer: '$-1 + \sqrt{2}$'
            solution_sketch: 'Rationalize: $\frac{1}{1+\sqrt2}\cdot\frac{\sqrt2 - 1}{\sqrt2 - 1} = \frac{\sqrt2 - 1}{2 - 1} = \sqrt2 - 1$.'
          - problem: 'In $\mathbb{Q}(\sqrt[3]{2})$, which powers of $\alpha = \sqrt[3]{2}$ form the standard basis over $\mathbb{Q}$?'
            answer: '$1, \alpha, \alpha^2$'
            solution_sketch: 'The degree is $3$, so $\{1, \alpha, \alpha^2\}$ spans; higher powers reduce via $\alpha^3 = 2$.'
          - problem: "In $\\mathbb{Q}(\\sqrt2)$, every element can be written as $a + b\\sqrt2$ with rational $a$ and $b$. Express $\\frac{1}{3 + 2\\sqrt2}$ in this form. Find the expression in the form a + b sqrt2."
            answer: "3 - 2sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is $\\frac{1}{3 + 2\\sqrt2}$. Step 1: rationalize with the conjugate $3 - 2\\sqrt2$: multiply numerator and denominator to get $\\frac{3 - 2\\sqrt2}{(3)^2 - (2\\sqrt2)^2}$. Step 2: simplify the denominator to $9 - 8 = 1$. The answer is 3 - 2sqrt(2)."
          - problem: "Let $\\alpha = \\sqrt[3]{2}$. Every element of $\\mathbb{Q}(\\alpha)$ can be written as $a + b\\alpha + c\\alpha^2$. Express $\\alpha^4 - \\alpha^2$ in this basis. Give the answer as a function of $\\alpha$."
            answer: "2alpha - alpha^2"
            answer_contract: {"kind": "function", "vars": ["alpha"]}
            solution_sketch: "The element is $\\alpha^4 - \\alpha^2$ with $\\alpha = \\sqrt[3]{2}$. Step 1: reduce the fourth power using $\\alpha^3 = 2$, so $\\alpha^4 = \\alpha \\cdot \\alpha^3 = 2\\alpha$. Step 2: subtract $\\alpha^2$ from $2\\alpha$. The answer is 2alpha - alpha^2."
          - problem: "In $\\mathbb{Q}(\\sqrt5)$, reduce $(\\sqrt5)^3 - 2\\sqrt5 + 4$ to the form $a + b\\sqrt5$. Find the expression in the form a + b sqrt5."
            answer: "4 + 3sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is $(\\sqrt5)^3 - 2\\sqrt5 + 4$. Step 1: reduce the cube using $(\\sqrt5)^2 = 5$, so $(\\sqrt5)^3 = 5\\sqrt5$. Step 2: combine like radicals: $5\\sqrt5 - 2\\sqrt5 = 3\\sqrt5$, and keep the constant 4. The answer is 4 + 3sqrt(5)."
          - problem: "In $\\mathbb{Q}(i)$, express $\\frac{3 + i}{1 - i}$ in the form $a + bi$. Give the answer in the form a + bi."
            answer: "1 + 2i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The element is $\\frac{3 + i}{1 - i}$. Step 1: rationalize by multiplying numerator and denominator by $1 + i$. Step 2: compute $\\frac{(3 + i)(1 + i)}{(1 - i)(1 + i)} = \\frac{2 + 4i}{2}$. Step 3: divide each term by 2. The answer is 1 + 2i."
        constraints: "quadratic and cubic extensions of Q; rationalize denominators, reduce powers"
      - id: kp2
        name: "Degree of an extension; [F(alpha):F] = deg of min poly"
        key_prerequisites: [minimal-polynomials]
        exemplars:
          - problem: 'What is $[\mathbb{C} : \mathbb{R}]$?'
            answer: "2"
            solution_sketch: '$\mathbb{C} = \mathbb{R}(i)$ and the minimal polynomial of $i$ over $\mathbb{R}$ is $x^2 + 1$.'
          - problem: "Find [Q(sqrt2):Q] and [Q(cbrt2):Q], and give the answer as (d1, d2)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The extension Q(sqrt2) is generated by sqrt2, whose minimal polynomial over Q is x^2 - 2, of degree 2. The extension Q(cbrt2) is generated by cbrt2, whose minimal polynomial is x^3 - 2, irreducible by Eisenstein, of degree 3. By the degree formula [F(alpha):F] = deg(min poly), the degrees are 2 and 3, so the answer is (2, 3)."
          - problem: "Find [Q(sqrt3):Q]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The extension Q(sqrt3) is generated by sqrt3, whose minimal polynomial over Q is x^2 - 3. This polynomial has degree 2, so by the degree formula [F(alpha):F] = deg(min poly) the degree is 2."
          - problem: "Find [Q(sqrt[4]{2}):Q]."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The extension Q(sqrt[4]{2}) is generated by sqrt[4]{2}, whose minimal polynomial over Q is x^4 - 2. This polynomial is irreducible by Eisenstein at 2 and has degree 4, so by the degree formula the degree is 4."
          - problem: "Find [Q(sqrt3+sqrt7):Q]."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let alpha = sqrt3 + sqrt7. Then alpha^2 = 10 + 2sqrt21, so (alpha^2 - 10)^2 = 84, giving alpha^4 - 20 alpha^2 + 16 = 0. The polynomial x^4 - 20x^2 + 16 has no rational roots and does not factor into quadratics over Q, so it is the minimal polynomial of alpha. Its degree is 4, so by the degree formula [Q(alpha):Q] = 4."
          - problem: "Find [Q(cbrt11):Q]."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The extension Q(cbrt11) is generated by cbrt11, whose minimal polynomial over Q is x^3 - 11. This polynomial is irreducible by Eisenstein at 11 and has degree 3, so by the degree formula the degree is 3."
        constraints: "simple extensions; degrees 2-4"
      - id: kp3
        name: "The tower law"
        key_prerequisites: [minimal-polynomials]
        exemplars:
          - problem: "Let K = Q(sqrt2, sqrt3) and E = Q(sqrt2). Given [K:E] = 2, find [K:Q]."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the minimal polynomial x^2 - 2 gives [E:Q] = 2. Step 2: the tower law gives [K:Q] = [K:E][E:Q] = 2 times 2. Thus [K:Q] = 4."
          - problem: "Let K = Q(cuberoot2). Can K contain sqrt2? State whether it can and give [K:Q]."
            answer: "verdict = no; degree = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "degree"}]}
            solution_sketch: "Step 1: x^3 - 2 is irreducible over Q, so [K:Q] = 3. Step 2: if K contained sqrt2, then Q(sqrt2) would be an intermediate field of degree 2 over Q. Step 3: the tower law would force 2 to divide 3, which is false. Thus verdict = no; degree = 3."
          - problem: "Let F contained in E contained in K be a tower of fields with [E:F] = 4 and [K:E] = 5. Find [K:F]."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the tower law states [K:F] = [K:E][E:F]. Step 2: substitute the given degrees to get [K:F] = 5 times 4. Thus [K:F] = 20."
          - problem: "Let F contained in E contained in K with [K:F] = 24 and [E:F] = 4. Determine [K:E]."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the tower law gives [K:F] = [K:E][E:F]. Step 2: substitute 24 = [K:E] times 4 and solve. Thus [K:E] = 6."
          - problem: "Let F contained in E contained in K with [K:F] = 45 and [K:E] = 5. Find [E:F]."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by the tower law, [K:F] = [K:E][E:F]. Step 2: divide 45 by 5 to get [E:F]. Thus [E:F] = 9."
          - problem: "Let F contained in E contained in K. Suppose [K:F] = 30 and [E:F] = 6. Can [K:E] be 4? State whether it can and give [K:E]."
            answer: "verdict = no; index = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "index"}]}
            solution_sketch: "Step 1: the tower law gives [K:F] = [K:E][E:F]. Step 2: substitute 30 = [K:E] times 6, so [K:E] = 5. Step 3: since 5 is not 4, the proposed value is impossible. Thus verdict = no; index = 5."
        constraints: "towers of height 2; divisibility arguments from the tower law"
    diagnostic_exemplar:
      problem: 'Compute $[\mathbb{Q}(\sqrt[3]{2}, \sqrt{5}) : \mathbb{Q}]$, given that $\sqrt5 \notin \mathbb{Q}(\sqrt[3]2)$.'
      answer: "6"
      solution_sketch: 'Tower through $\mathbb{Q}(\sqrt[3]2)$: degree $3$, then adjoining $\sqrt5$ gives degree $2$ more; $3 \cdot 2 = 6$.'
    anki_seeds:
      - front: "$[F(\\alpha) : F]$ equals..."
        back: "The degree of the minimal polynomial of $\\alpha$ over $F$."
        type: basic
      - front: "Tower law?"
        back: "$[K : F] = [K : E]\\,[E : F]$ for fields $F \\subseteq E \\subseteq K$."
        type: basic
      - front: "Standard basis of $\\mathbb{Q}(\\sqrt2)$ over $\\mathbb{Q}$?"
        back: "$\\{1, \\sqrt2\\}$: every element is uniquely $a + b\\sqrt2$."
        type: basic

  - id: straightedge-compass-impossibility
    name: "Straightedge-Compass Impossibility"
    core: false                # supplemental applications capstone
    difficulty: 0.85
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: field-extensions-degree
        weight: 0.9
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: false
      - id: trig-ratios-definition
        weight: 0.2
        key: false
      # Phase C: the learner proving doubling-the-cube impossible has now actually
      # performed constructions (geometry's straightedge-compass-constructions).
      - id: straightedge-compass-constructions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Constructible numbers form a field of degree-2^k elements"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: "Starting from $\\mathbb{Q}$, a constructible length $\\alpha$ is reached by a tower of three extensions, each of degree $2$ over the previous field. Compute $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the tower $\\mathbb{Q} = F_0 \\subset F_1 \\subset F_2 \\subset F_3$ reaching $\\alpha$, with every step of degree $2$. Tower law: the degree multiplies along the tower, so $[\\mathbb{Q}(\\alpha):\\mathbb{Q}] = 2 \\cdot 2 \\cdot 2 = 8$. This multiplication along a degree-2 tower is exactly what forces constructible degrees to be powers of $2$. The answer is 8."
          - problem: "A length $\\alpha > 0$ satisfies $\\alpha^4 = 3$, and it is obtained by adjoining $\\sqrt{3}$ to $\\mathbb{Q}$ and then a square root of that result. Compute $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $\\alpha = \\sqrt{\\sqrt{3}}$, the positive number with $\\alpha^4 = 3$. Step 1 (degree of a square root): $\\sqrt{3}$ has degree $2$ over $\\mathbb{Q}$. Step 2: $\\sqrt{\\sqrt{3}}$ has degree $2$ over $\\mathbb{Q}(\\sqrt{3})$, since $\\sqrt{3}$ is not a square in that field. Tower law: $2 \\cdot 2 = 4$. The answer is 4."
          - problem: "The real number $\\alpha = \\sqrt[3]{3}$ has minimal polynomial $x^3 - 3$ over $\\mathbb{Q}$. Determine whether $\\alpha$ is constructible and give $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$. Give the verdict as yes or no and the degree as a number."
            answer: "verdict = no; degree = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "degree"}]}
            solution_sketch: "Full object: $\\alpha = \\sqrt[3]{3}$ with minimal polynomial $x^3 - 3$ over $\\mathbb{Q}$. Degree: the minimal polynomial has degree $3$, so $[\\mathbb{Q}(\\alpha):\\mathbb{Q}] = 3$. Criterion: a constructible length has degree a power of $2$ over $\\mathbb{Q}$, and $3$ is not a power of $2$, so $\\alpha$ is not constructible. The answer is verdict = no; degree = 3."
          - problem: "A student claims that every constructible number has degree $1$, $2$, $4$, or $8$ over $\\mathbb{Q}$. Give the smallest degree of a constructible number that contradicts this claim."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the claim that constructible degrees are only $1, 2, 4, 8$. Constructible example: $\\alpha = \\sqrt{\\sqrt{\\sqrt{\\sqrt{2}}}}$ is built by four successive square-root steps, each of degree $2$, so by the tower law its degree is $2 \\cdot 2 \\cdot 2 \\cdot 2 = 16$. Every power of $2$ below $16$ is already on the student's list, so $16$ is the smallest contradicting degree. The answer is 16."
          - problem: "A student argues that $\\sqrt[3]{2}$ is constructible. Step 1: $\\sqrt[3]{2}$ satisfies $x^3 - 2 = 0$. Step 2: $x^3 - 2$ has no rational root, so $[\\mathbb{Q}(\\sqrt[3]{2}):\\mathbb{Q}] = 3$. Step 3: $3 = 2 + 1$ is a sum of powers of $2$, hence a power of $2$. Step 4: by the criterion, $\\sqrt[3]{2}$ is constructible. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true: cubing $\\sqrt[3]{2}$ gives $2$. Step 2 is true: $x^3 - 2$ has no rational root, so it is the minimal polynomial and the degree is $3$. Step 3 is the first false step: a sum of powers of $2$ need not be a power of $2$, and $3$ is not equal to $2^k$ for any $k$. Step 4 is also wrong, since the criterion is only one-directional, but the failure there comes later. The answer is Step 3."
          - problem: "In the proof that a constructible length $\\alpha$ satisfies $[\\mathbb{Q}(\\alpha):\\mathbb{Q}] = 2^k$ for some $k$, one has a tower $\\mathbb{Q} = F_0 \\subset F_1 \\subset \\cdots \\subset F_n$ containing $\\alpha$, where each extension has degree $1$ or $2$. The final line, which computes $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$ from these extensions, is missing. Select the line that is true and completes the proof."
            answer: "the product of the step degrees, which is 2^k"
            answer_contract: {"kind": "label", "options": [["the product of the step degrees, which is 2^k"], ["the sum of the step degrees"], ["2 to the power n, with n the number of steps"], ["twice the degree of the largest step"]]}
            solution_sketch: "Full object: a tower $\\mathbb{Q} = F_0 \\subset F_1 \\subset \\cdots \\subset F_n$ containing $\\alpha$, each extension of degree $1$ or $2$. Tower law: $[F_n:\\mathbb{Q}]$ is the product of the extension degrees, hence $2^k$ where $k$ counts the steps of degree $2$. The option 'the sum of the step degrees' confuses the tower law with addition; the option '2 to the power n, with n the number of steps' ignores the steps of degree $1$; the option 'twice the degree of the largest step' is not any valid rule. The answer is the product of the step degrees, which is 2^k."
          - problem: "Write the full proof: if a length $\\alpha$ is constructible by straightedge and compass, then $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$ is a power of $2$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Field closure: sums, differences, products and quotients of constructible numbers are constructible, since each is obtained by the basic straightedge and compass constructions, so the constructible numbers form a field containing $\\mathbb{Q}$. Degree of one step: each construction step produces an intersection of two lines, of a line and a circle, or of two circles; solving for its coordinates uses at worst a quadratic equation over the field built so far, so adjoining it gives an extension of degree $1$ or $2$. Tower: after $n$ steps there is a chain $\\mathbb{Q} = F_0 \\subset F_1 \\subset \\cdots \\subset F_n$ with $\\alpha \\in F_n$ and each $[F_{i+1}:F_i]$ equal to $1$ or $2$. Tower law: $[F_n:\\mathbb{Q}]$ is the product of the step degrees, so $[F_n:\\mathbb{Q}] = 2^k$, where $k$ is the number of steps of degree $2$. Conclusion: $[\\mathbb{Q}(\\alpha):\\mathbb{Q}]$ divides $2^k$ by the tower law applied to $\\mathbb{Q} \\subset \\mathbb{Q}(\\alpha) \\subset F_n$, and a divisor of $2^k$ is itself a power of $2$. Hence every constructible length has degree $2^k$ over $\\mathbb{Q}$."
        constraints: "the criterion as a usable tool; degree-2 tower intuition, no analytic geometry details"
      - id: kp2
        name: "Doubling the cube and trisecting the angle"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: "The doubling-the-cube proof uses the criterion that a real number constructible from Q has degree a power of 2 over Q. The cube root of 2 has minimal polynomial x^3 - 2 over Q, which is irreducible by Eisenstein's criterion at the prime 2. Find the degree of Q(cube root of 2) over Q."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the cube root of 2 with minimal polynomial x^3 - 2. Step 1 (Eisenstein's criterion): x^3 - 2 is irreducible at the prime 2, so the minimal polynomial has degree 3 and the field Q(cube root of 2) has degree 3 over Q. Step 2 (constructibility criterion): a constructible real number must have degree a power of 2 over Q, and 3 is not a power of 2. The degree is 3."
          - problem: "In the trisection problem the number cos 20 degrees satisfies 8x^3 - 6x - 1 = 0, and this cubic is given as irreducible over Q. The constructibility criterion requires the degree of the field over Q to be a power of 2. State the degree of Q(cos 20 degrees) over Q."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is cos 20 degrees, a root of the cubic 8x^3 - 6x - 1. Step 1 (given irreducibility fact): this cubic is irreducible over Q, so it is the minimal polynomial and the field Q(cos 20 degrees) has degree 3 over Q. Step 2 (constructibility criterion): the required degree must be a power of 2, and 3 is not such a power. The degree is 3."
          - problem: "With x = cos 20 degrees the triple-angle identity cos 3t = 4x^3 - 3x gives 4x^3 - 3x = 1/2, and the resulting cubic is irreducible over Q, while the constructibility criterion needs a degree that is a power of 2. Clearing the fraction and collecting all terms on one side writes this cubic as A x^3 - 6x - 1 = 0. Find A."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the equation 4x^3 - 3x = 1/2 for x = cos 20 degrees. Step 1 (clear the denominator): multiply both sides by 2, giving 8x^3 - 6x = 1. Step 2 (collect on one side): subtract 1 from both sides, giving 8x^3 - 6x - 1 = 0, so the coefficient A is 8. The value of A is 8."
          - problem: "The length sqrt(5) is constructible, and the criterion says a constructible number has degree a power of 2 over Q. The minimal polynomial of sqrt(5) over Q is x^2 - 5, which is irreducible by Eisenstein's criterion at the prime 5. Find the degree of Q(sqrt(5)) over Q."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is sqrt(5) with minimal polynomial x^2 - 5. Step 1 (Eisenstein's criterion): x^2 - 5 is irreducible at the prime 5, so the minimal polynomial has degree 2 and the field Q(sqrt(5)) has degree 2 over Q. Step 2 (constructibility criterion): 2 is a power of 2, so this degree is consistent with a straightedge-compass construction. The degree is 2."
          - problem: "Claim: the 60 degree angle can be trisected. Step 1: cos 20 degrees satisfies the cubic 8x^3 - 6x - 1 = 0, which is irreducible over Q. Step 2: so the degree of Q(cos 20 degrees) over Q is 3. Step 3: the constructibility criterion says a constructible number has degree a power of 2 over Q. Step 4: since 3 is not a power of 2, cos 20 degrees is constructible, and the angle can be trisected. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The object is the numbered argument about the 60 degree angle. Step 1 correctly gives the irreducible cubic for cos 20 degrees. Step 2 correctly reads off the degree 3 from that irreducible cubic. Step 3 correctly states the constructibility criterion. Step 4 is not valid: it reverses the criterion, because degree 3 is not a power of 2, so cos 20 degrees is not constructible. The answer is Step 4."
          - problem: "The number 2^(1/4) is a constructible length, and the criterion requires its degree over Q to be a power of 2. Its minimal polynomial over Q is x^4 - 2, which is irreducible by Eisenstein's criterion at the prime 2. Find the degree of Q(2^(1/4)) over Q."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is 2^(1/4) with minimal polynomial x^4 - 2. Step 1 (Eisenstein's criterion): x^4 - 2 is irreducible at the prime 2, so the minimal polynomial has degree 4 and the field Q(2^(1/4)) has degree 4 over Q. Step 2 (constructibility criterion): 4 is a power of 2, so this degree allows a construction. The degree is 4."
          - problem: "Write the full proof: no straightedge and compass construction trisects the 60 degree angle. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (triple-angle identity): with x = cos 20 degrees, the identity cos 3t = 4x^3 - 3x at t = 20 degrees, together with cos 60 degrees = 1/2, gives 4x^3 - 3x = 1/2, that is 8x^3 - 6x - 1 = 0. Step 2 (irreducibility fact): the cubic 8x^3 - 6x - 1 is irreducible over Q, so it is the minimal polynomial of x and the field Q(cos 20 degrees) has degree 3 over Q. Step 3 (constructibility criterion): every real number constructible from Q lies in a field extension whose degree over Q is a power of 2. Since 3 is not a power of 2, cos 20 degrees is not constructible. Conclusion: a 60 degree angle cannot be trisected by straightedge and compass."
        constraints: "cite the criterion plus one irreducibility fact; the cubic 8x^3 - 6x - 1 may be given as irreducible"
      - id: kp3
        name: "Squaring the circle; what remains constructible"
        key_prerequisites: [field-extensions-degree]
        exemplars:
          - problem: 'Why is squaring the circle impossible?'
            answer: 'It requires constructing $\sqrt{\pi}$; but $\pi$ is transcendental (Lindemann), so $\sqrt\pi$ is not even algebraic, let alone of degree $2^k$.'
            solution_sketch: 'Constructible numbers are algebraic; transcendence of $\pi$ (quoted) ends the argument.'
          - problem: 'The regular pentagon is constructible. What degree fact makes this consistent with the criterion?'
            answer: '$\cos 72^\circ = \frac{\sqrt5 - 1}{4}$ has degree $2$ over $\mathbb{Q}$ — a power of $2$.'
            solution_sketch: 'The pentagon needs only square roots; its cosine lies in a quadratic extension.'
        constraints: "quotable transcendence of pi; positive examples (pentagon, 15-gon) vs impossible ones (heptagon: degree 3)"
    diagnostic_exemplar:
      problem: 'Using the constructibility criterion, decide which are constructible: (a) $\sqrt[3]{5}$, (b) $\sqrt{7}$, (c) a $60^\circ$ angle trisector (i.e. $\cos 20^\circ$).'
      answer: '(a) No — degree $3$. (b) Yes — degree $2$. (c) No — degree $3$.'
      solution_sketch: 'Minimal polynomials: $x^3 - 5$ (Eisenstein at 5), $x^2 - 7$, and $8x^3 - 6x - 1$; only powers of $2$ pass.'
    anki_seeds:
      - front: "Necessary condition for a number to be straightedge-compass constructible?"
        back: "It is algebraic and $[\\mathbb{Q}(\\alpha) : \\mathbb{Q}]$ is a power of $2$."
        type: basic
      - front: "Why is doubling the cube impossible?"
        back: "It needs $\\sqrt[3]{2}$, of degree $3$ over $\\mathbb{Q}$ — not a power of $2$."
        type: basic
      - front: "Why is squaring the circle impossible?"
        back: "It needs $\\sqrt{\\pi}$, and $\\pi$ is transcendental (Lindemann), so not even algebraic."
        type: basic

  - id: splitting-fields
    name: "Splitting Fields"
    core: false                # terminal field-theory destination; its consumer (Galois theory) is not in the tree
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - {id: prime-maximal-ideals, weight: 0.5, key: false}        # L1: kp1's Kronecker step is 'irreducible => maximal => quotient is a field'
      - {id: complex-polar-form-de-moivre, weight: 0.3, key: false} # L1: kp2/kp3/diagnostic need roots of unity (omega) to list all roots
      - id: field-extensions-degree
        weight: 0.9
        key: true
      - id: irreducibility-factorization
        weight: 0.5
        key: true
      - id: quotient-rings
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Adjoining a root: Kronecker's construction"
        key_prerequisites: [quotient-rings, irreducibility-factorization]
        exemplars:
          - problem: "The polynomial x^2 + 1 over Z_3 has no root, so it is irreducible. Find the number of elements in the field Z_3[x]/<x^2 + 1>."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The polynomial x^2+1 over Z_3 has values 1,2,2 at 0,1,2, so it has no root and is irreducible by the root test. A quotient by a maximal ideal is a field, and <x^2+1> is maximal because x^2+1 is irreducible. The field Z_3[x]/<x^2+1> has degree 2 over Z_3, so it has 3^2 = 9 elements. The answer is 9."
          - problem: "Let f(x) = x^3 + x + 1 over Z_2. Use a root test to see that f is irreducible. Find the degree [Z_2[x]/<f> : Z_2]."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^3+x+1 over Z_2, f(0)=1 and f(1)=1, so f has no root. A degree-3 polynomial with no root is irreducible, so <f> is maximal. The quotient Z_2[x]/<f> is a field extension of degree equal to deg f = 3. The degree is 3."
          - problem: "Let alpha be the coset of x in Q[x]/<x^2 - 2>. The construction makes alpha a root of x^2 - 2. Find the value of alpha^2."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Q[x]/<x^2-2>, let alpha be the coset of x. The relation x^2 - 2 = 0 in the quotient gives alpha^2 - 2 = 0, so alpha^2 = 2. The answer is 2."
          - problem: "Let f(x) = x^2 + x + 1 over Z_2. A root test shows f has no root in Z_2, so f is irreducible. Find the number of elements in Z_2[x]/<f>."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^2+x+1 over Z_2, f(0)=1 and f(1)=1, so f has no root and is irreducible. The quotient Z_2[x]/<f> is a field of degree 2 over Z_2. It has 2^2 = 4 elements. The answer is 4."
          - problem: "Let f(x) = x^3 + 2x + 1 over Z_3. Check that f has no root in Z_3, so f is irreducible. Find the number of elements in Z_3[x]/<f>."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x)=x^3+2x+1 over Z_3, f(0)=1, f(1)=1, f(2)=1, so f has no root. A degree-3 polynomial with no root is irreducible, so <f> is maximal. The quotient is a field of degree 3 over Z_3, so it has 3^3 = 27 elements. The answer is 27."
          - problem: "Let alpha be the coset of x in Q[x]/<x^3 - 2>. The quotient construction makes alpha a root of x^3 - 2. Find the value of alpha^3."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Q[x]/<x^3-2>, let alpha be the coset of x. The relation x^3 - 2 = 0 in the quotient gives alpha^3 - 2 = 0, so alpha^3 = 2. The answer is 2."
        constraints: "Kronecker constructions over Z_2, Z_3, Q with degree-2 or degree-3 polynomials; irreducibility checked by root tests"
      - id: kp2
        name: "Splitting fields over Q"
        key_prerequisites: [field-extensions-degree, complex-numbers]
        exemplars:
          - problem: "The polynomial p(x) = x^4 - 1 has roots 1, -1, i, -i. Find the degree over Q of the splitting field of p(x)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is 1, -1, i, -i. The rational roots 1 and -1 already lie in Q, and adjoining i also gives -i, so the splitting field is Q(i). By the degree formula, [Q(i):Q] = 2 because x^2 + 1 is irreducible over Q. The degree is 2."
          - problem: "The polynomial p(x) = x^3 - 2 has roots 2^(1/3), 2^(1/3)*omega, and 2^(1/3)*omega^2, where omega is a primitive cube root of unity. Find the degree over Q of the splitting field of p(x)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is 2^(1/3), 2^(1/3)*omega, 2^(1/3)*omega^2. Adjoining 2^(1/3) gives a degree 3 extension. The primitive cube root omega is a root of x^2 + x + 1, which stays irreducible over the real field Q(2^(1/3)), so adjoining omega adds degree 2. By the tower law, the splitting field Q(2^(1/3), omega) has degree 3*2 = 6. The degree is 6."
          - problem: "The polynomial p(x) = x^4 - 5x^2 + 6 has roots sqrt(2), -sqrt(2), sqrt(3), and -sqrt(3). Find the degree over Q of the splitting field of p(x)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is sqrt(2), -sqrt(2), sqrt(3), -sqrt(3). The splitting field is Q(sqrt(2), sqrt(3)). Adjoining sqrt(2) gives degree 2 over Q. Since sqrt(3) is not in Q(sqrt(2)), its minimal polynomial x^2 - 3 is irreducible there, so adjoining it adds degree 2. By the tower law the degree is 2*2 = 4. The degree is 4."
          - problem: "The polynomial p(x) = x^4 - 2 has roots 2^(1/4), -2^(1/4), i*2^(1/4), and -i*2^(1/4). Find the degree over Q of the splitting field of p(x)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is 2^(1/4), -2^(1/4), i*2^(1/4), -i*2^(1/4). The splitting field is Q(2^(1/4), i). Adjoining 2^(1/4) gives degree 4 over Q by x^4 - 2. The field Q(2^(1/4)) is real, so i is not in it and x^2 + 1 is irreducible there, adding degree 2. By the tower law the degree is 4*2 = 8. The degree is 8."
          - problem: "Consider p(x) = x^3 - 3. Its roots are 3^(1/3), 3^(1/3)*omega, and 3^(1/3)*omega^2, where omega is a primitive cube root of unity. Find the degree over Q of the splitting field of p(x)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is 3^(1/3), 3^(1/3)*omega, 3^(1/3)*omega^2. The splitting field is Q(3^(1/3), omega). Adjoining 3^(1/3) gives degree 3 over Q by x^3 - 3. The primitive cube root omega satisfies x^2 + x + 1, which is irreducible over the real field Q(3^(1/3)), so adjoining omega adds degree 2. By the tower law the degree is 3*2 = 6. The degree is 6."
          - problem: "The polynomial p(x) = x^4 - 5x^2 + 4 has roots 1, -1, 2, and -2. Find the degree over Q of the splitting field of p(x)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full root list is 1, -1, 2, -2. Every root already lies in Q, so the splitting field is Q itself. By the definition of degree, [Q:Q] = 1. The degree is 1."
        constraints: "polynomials of degree <= 4 over Q with radical or root-of-unity roots; every problem exhibits the full root list"
      - id: kp3
        name: "Degrees of splitting fields"
        key_prerequisites: [field-extensions-degree, irreducibility-factorization]
        exemplars:
          - problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $(x^2 - 2)(x^2 - 3)$.'
            answer: "4"
            solution_sketch: 'The splitting field is $\mathbb{Q}(\sqrt2, \sqrt3)$. Tower: $[\mathbb{Q}(\sqrt2) : \mathbb{Q}] = 2$, and $\sqrt3 \notin \mathbb{Q}(\sqrt2)$ keeps $x^2 - 3$ irreducible there, so another factor of $2$: total $4$.'
          - problem: "Let E be the splitting field over Q of a cubic polynomial. By the n! bound, what is the largest possible value of [E : Q]?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a cubic, E is a splitting field over Q and [E : Q] divides 3! = 6. The bound is attained by x^3 - 2, so the largest possible value is 6."
          - problem: "Let E be the splitting field of x^4 - 2 over Q. Find [E : Q]."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The splitting field is E = Q(2^(1/4), i). Eisenstein at 2 shows x^4 - 2 is irreducible, so [Q(2^(1/4)) : Q] = 4. Since i is not in the real field Q(2^(1/4)), [E : Q(2^(1/4))] = 2. The tower law gives [E : Q] = 4 * 2 = 8."
          - problem: "Find the degree over Q of the splitting field of x^4 + x^2 + 1."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The splitting field of x^4 + x^2 + 1 is Q(sqrt(-3)). Factor x^4 + x^2 + 1 = (x^2 + x + 1)(x^2 - x + 1). The roots of both quadratics lie in Q(sqrt(-3)). Since [Q(sqrt(-3)) : Q] = 2, the splitting field has degree 2."
          - problem: "Let E be the splitting field over Q of (x^3 - 2)(x^2 - 2). Given that sqrt(2) is not in Q(2^(1/3), omega), where omega is a primitive cube root of unity, find [E : Q]."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The splitting field is E = Q(2^(1/3), omega, sqrt(2)). The splitting field of x^3 - 2 is Q(2^(1/3), omega), of degree 6 over Q. The given non-membership makes x^2 - 2 irreducible over that field, adding degree 2. By the tower law, [E : Q] = 6 * 2 = 12."
          - problem: "For a quartic polynomial over Q, the n! bound limits the degree of its splitting field. Find the largest possible degree over Q of such a splitting field."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A quartic has n = 4, so its splitting field degree is bounded by 4! = 24. The bound is sharp, so the largest possible degree is 24."
        constraints: "tower-law computations of height <= 2; the n! bound may be quoted; non-membership facts like sqrt(3) not in Q(sqrt(2)) may be given"
    diagnostic_exemplar:
      problem: 'Find the degree over $\mathbb{Q}$ of the splitting field of $x^3 - 5$.'
      answer: "6"
      solution_sketch: 'Roots $\sqrt[3]5, \sqrt[3]5\,\omega, \sqrt[3]5\,\omega^2$: the splitting field is $\mathbb{Q}(\sqrt[3]5, \omega)$, and the tower gives $3 \cdot 2 = 6$.'
    anki_seeds:
      - front: "Splitting field of $f$ over $F$?"
        back: "The smallest extension of $F$ in which $f$ factors completely into linear factors (contains ALL roots of $f$)."
        type: basic
      - front: "Kronecker's construction of a root of irreducible $f \\in F[x]$?"
        back: "$F[x]/\\langle f \\rangle$ — a field of degree $\\deg f$ over $F$ in which the coset of $x$ is a root."
        type: basic
      - front: "Splitting field of $x^3 - 2$ over $\\mathbb{Q}$, and its degree?"
        back: "$\\mathbb{Q}(\\sqrt[3]{2}, \\omega)$, degree $6$ (not $\\mathbb{Q}(\\sqrt[3]{2})$, which misses the complex roots)."
        type: basic
