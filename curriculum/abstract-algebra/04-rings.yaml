unit: rings
course: abstract-algebra
module: "Rings"
topics:
  - id: ring-axioms-examples
    name: "Ring Axioms and Examples"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: elementary-group-properties
        weight: 0.7
        key: true
      - id: modular-arithmetic
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.3
        key: false
      # Phase C: the ring axioms cite "abelian group under +" as a definition; the
      # concept is taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The axioms; rings vs non-rings"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: 'List the ring axioms: what structure do $(R, +)$ and $(R, \cdot)$ carry, and what links them?'
            answer: '$(R,+)$ is an abelian group, multiplication is associative, and the two distributive laws $a(b+c) = ab+ac$, $(a+b)c = ac+bc$ hold.'
            solution_sketch: 'Commutative multiplication and unity are extra properties, not part of the bare definition.'
          - problem: 'Is the set of odd integers a ring under the usual operations?'
            answer: 'No: it is not closed under addition ($1 + 1 = 2$ is even), so $(R,+)$ is not a group.'
            solution_sketch: 'Check additive closure first.'
        constraints: "verify/refute ring structure for subsets of Z, Q, Z_n; identify which axiom fails"
      - id: kp2
        name: "The standard examples: Z, Z_n, 2Z, Z[x], Z[sqrt(2)]"
        key_prerequisites: [modular-arithmetic]
        exemplars:
          - problem: 'Does the ring $2\mathbb{Z}$ of even integers have a multiplicative identity?'
            answer: 'No: $2n \cdot u = 2n$ for all $n$ would force $u = 1 \notin 2\mathbb{Z}$.'
            solution_sketch: 'A ring need not have unity; $2\mathbb{Z}$ is the standard example.'
          - problem: 'In $\mathbb{Z}[\sqrt{2}] = \{a + b\sqrt{2} : a, b \in \mathbb{Z}\}$, compute $(1 + 2\sqrt{2})(3 - \sqrt{2})$.'
            answer: '$-1 + 5\sqrt{2}$'
            solution_sketch: 'Expand: $3 - \sqrt2 + 6\sqrt2 - 2\cdot 2 = (3 - 4) + 5\sqrt2$.'
        constraints: "arithmetic in Z_n, 2Z, Z[sqrt(2)]; note which have unity and which are commutative"
      - id: kp3
        name: "Basic consequences: 0-multiplication, negatives"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: 'Prove that $a \cdot 0 = 0$ in any ring.'
            answer: '$a\cdot 0 = a(0+0) = a\cdot 0 + a\cdot 0$; subtract $a \cdot 0$ from both sides.'
            solution_sketch: 'Distribute over $0 = 0 + 0$ and cancel in the additive group.'
          - problem: 'Prove that $(-a)b = -(ab)$.'
            answer: '$ab + (-a)b = (a + (-a))b = 0\cdot b = 0$, so $(-a)b$ is the additive inverse of $ab$.'
            solution_sketch: 'Distribute $(a + (-a))b$ and use uniqueness of additive inverses.'
        constraints: "two-line consequences of distributivity; cite each axiom used"
    diagnostic_exemplar:
      problem: 'Prove that $(-a)b = -(ab)$ in any ring $R$, naming the axioms you use, and illustrate the identity in $\mathbb{Z}_{10}$ with $a = 3$, $b = 7$.'
      answer: 'By distributivity, $ab + (-a)b = (a + (-a))b = 0 \cdot b$, and $0 \cdot b = 0$ (from $0b = (0+0)b = 0b + 0b$ and cancellation in the abelian group $(R,+)$). So $(-a)b$ is an additive inverse of $ab$, and additive inverses are unique, hence $(-a)b = -(ab)$. In $\mathbb{Z}_{10}$: $-3 = 7$, so $(-3) \cdot 7 = 49 \equiv 9$, while $3 \cdot 7 = 21 \equiv 1$ and $-1 = 9$ — both sides equal $9$.'
      solution_sketch: 'Use distributivity to show $ab + (-a)b = 0$, together with $0 \cdot b = 0$ and uniqueness of additive inverses; then check both sides numerically mod $10$.'
    anki_seeds:
      - front: "Ring axioms in one line?"
        back: "Abelian group under $+$, associative multiplication, and both distributive laws."
        type: basic
      - front: "Standard example of a ring without unity?"
        back: "$2\\mathbb{Z}$, the even integers."
        type: basic
      - front: "In any ring, $a \\cdot 0 = $ ?"
        back: "$0$ (proved from distributivity over $0 = 0 + 0$)."
        type: basic

  - id: integral-domains-zero-divisors
    name: "Integral Domains and Zero Divisors"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.9
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding zero divisors and units in Z_n"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'List the zero divisors of $\mathbb{Z}_6$.'
            answer: '$2, 3, 4$'
            solution_sketch: '$2\cdot3 = 0$, $3\cdot4 = 12 = 0$; the elements sharing a factor with $6$ are the zero divisors.'
          - problem: 'List the units of $\mathbb{Z}_6$.'
            answer: '$1, 5$'
            solution_sketch: 'Units are the residues coprime to $6$; every nonzero element of $\mathbb{Z}_n$ is a unit or a zero divisor.'
        constraints: "Z_n for n <= 20; zero divisor iff gcd(a, n) > 1 (a nonzero)"
      - id: kp2
        name: "Integral domains and cancellation"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'For which $n > 1$ is $\mathbb{Z}_n$ an integral domain?'
            answer: 'Exactly the primes.'
            solution_sketch: 'Composite $n = ab$ gives zero divisors $a, b$; prime $p$ has none since $p \mid ab \implies p \mid a$ or $p \mid b$.'
          - problem: 'Prove that cancellation holds in an integral domain: $ab = ac, a \neq 0 \implies b = c$.'
            answer: '$a(b - c) = 0$ and $a \neq 0$ force $b - c = 0$.'
            solution_sketch: 'Factor and use the no-zero-divisors property.'
        constraints: "domain verdicts for Z_n, Z, Z[x], products like Z x Z; cancellation proofs"
      - id: kp3
        name: "Solving equations in the presence of zero divisors"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'Find all solutions of $2x = 0$ in $\mathbb{Z}_6$.'
            answer: '$x = 0$ and $x = 3$'
            solution_sketch: 'Zero divisors break the "only trivial solution" rule: $2 \cdot 3 = 6 = 0$.'
          - problem: 'Find all idempotents of $\mathbb{Z}_6$ (elements with $x^2 = x$).'
            answer: '$0, 1, 3, 4$'
            solution_sketch: 'Test all six: $3^2 = 9 = 3$, $4^2 = 16 = 4$; the others fail.'
        constraints: "equations x^2 = x, ax = 0, x^2 = 1 in Z_n, n <= 12; expect multiple roots"
    diagnostic_exemplar:
      problem: 'Find all solutions of $x^2 = x$ in $\mathbb{Z}_{12}$, and use one of them to decide whether $\mathbb{Z}_{12}$ is an integral domain.'
      answer: '$x^2 = x$ means $x(x-1) \equiv 0 \pmod{12}$; checking the residues gives $x = 0, 1, 4, 9$ (indeed $4^2 = 16 \equiv 4$ and $9^2 = 81 \equiv 9$). The solution $x = 4$ exhibits zero divisors: $4 \cdot 3 = 12 \equiv 0$ with $4 \ne 0$ and $3 \ne 0$. So $\mathbb{Z}_{12}$ is not an integral domain.'
      solution_sketch: 'Solve $x(x-1) \equiv 0 \pmod{12}$ over the residues; the nontrivial idempotents $4$ and $9$ exist precisely because $12$ splits into coprime factors, and each one hands you a zero divisor.'
    anki_seeds:
      - front: "$\\mathbb{Z}_n$ is an integral domain iff..."
        back: "$n$ is prime."
        type: basic
      - front: "In $\\mathbb{Z}_n$, every nonzero element is either a ______ or a ______."
        back: "Unit (if coprime to $n$) or zero divisor (if not)."
        type: basic

  - id: units-in-modular-rings
    name: "Units, Euler's Phi, and Modular Inverses"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: euclidean-algorithm
        weight: 0.8
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: fermat-euler-theorems
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Counting units: Euler's phi function"
        key_prerequisites: [integral-domains-zero-divisors, prime-factorization]
        exemplars:
          - problem: 'Compute $\varphi(20)$, the number of units of $\mathbb{Z}_{20}$.'
            answer: "8"
            solution_sketch: '$\varphi(20) = \varphi(4)\varphi(5) = 2 \cdot 4 = 8$.'
          - problem: 'Compute $\varphi(36)$.'
            answer: "12"
            solution_sketch: '$\varphi(36) = 36(1 - 1/2)(1 - 1/3) = 36 \cdot \tfrac12 \cdot \tfrac23 = 12$.'
        constraints: "n <= 100 with 2-3 prime factors; product formula expected"
      - id: kp2
        name: "Inverses via the extended Euclidean algorithm"
        key_prerequisites: [euclidean-algorithm]
        exemplars:
          - problem: 'Find the inverse of $7$ in $\mathbb{Z}_{26}$.'
            answer: "15"
            solution_sketch: 'Extended Euclid on $(26, 7)$: $26 = 3\cdot7 + 5$, $7 = 5 + 2$, $5 = 2\cdot2 + 1$; back-substitute to get $1 = 15\cdot7 - 4\cdot26$, so $7^{-1} \equiv 15$.'
          - problem: 'Find the inverse of $4$ in $\mathbb{Z}_7$.'
            answer: "2"
            solution_sketch: '$4 \cdot 2 = 8 \equiv 1 \pmod 7$.'
        constraints: "moduli <= 40; gcd(a, n) = 1 guaranteed; answer as least positive residue"
      - id: kp3
        name: "The unit group U(n) and Euler's theorem"
        key_prerequisites: [integral-domains-zero-divisors, euclidean-algorithm, fermat-euler-theorems]
        exemplars:
          - problem: 'Use Euler''s theorem to compute $3^8 \bmod 20$.'
            answer: "1"
            solution_sketch: '$\varphi(20) = 8$ and $\gcd(3,20) = 1$, so $3^{\varphi(20)} \equiv 1$.'
          - problem: 'The group $U(9)$ is cyclic. Name a generator.'
            answer: "2"
            solution_sketch: '$|U(9)| = \varphi(9) = 6$, and the powers of $2$ mod $9$ are $2, 4, 8, 7, 5, 1$ — order $6$, so $2$ generates.'
        constraints: "Euler reductions with n <= 40; cyclicity checks of U(n) for n <= 12"
    diagnostic_exemplar:
      problem: 'Compute $\varphi(15)$, then use Euler''s theorem in the form $a^{-1} = a^{\varphi(n)-1}$ to find the inverse of $7$ in $\mathbb{Z}_{15}$.'
      answer: '13'
      solution_sketch: '$\varphi(15) = \varphi(3)\varphi(5) = 2 \cdot 4 = 8$, so $7^{-1} = 7^{7} \bmod 15$. From $7^2 = 49 \equiv 4$ and $7^4 \equiv 4^2 = 16 \equiv 1$, we get $7^{7} = 7^{4} \cdot 7^{2} \cdot 7 \equiv 1 \cdot 4 \cdot 7 = 28 \equiv 13$. Check: $7 \cdot 13 = 91 = 6 \cdot 15 + 1$.'
    anki_seeds:
      - front: "$a$ is a unit of $\\mathbb{Z}_n$ iff..."
        back: "$\\gcd(a, n) = 1$; there are $\\varphi(n)$ units."
        type: basic
      - front: "Euler's theorem?"
        back: "If $\\gcd(a, n) = 1$ then $a^{\\varphi(n)} \\equiv 1 \\pmod n$."
        type: basic
      - front: "Tool for computing $a^{-1} \\bmod n$?"
        back: "Extended Euclidean algorithm: write $1 = ax + ny$; then $a^{-1} \\equiv x$."
        type: basic

  - id: ring-homomorphisms-ideals
    name: "Ring Homomorphisms and Ideals"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.8
        key: true
      - id: kernels-images
        weight: 0.7
        key: true
      # the principal-ideal exemplars invoke Bezout by name; inherited gcd gives
      # the gcd but not the representation ax + by = gcd.
      - id: euclidean-algorithm
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Ring homomorphisms and their kernels"
        key_prerequisites: [ring-axioms-examples, kernels-images]
        exemplars:
          - problem: 'Verify that reduction mod $n$, $\varphi : \mathbb{Z} \to \mathbb{Z}_n$, is a ring homomorphism, and find its kernel.'
            answer: 'It preserves $+$ and $\cdot$ by the rules of modular arithmetic; $\ker \varphi = n\mathbb{Z}$.'
            solution_sketch: '$(a + b) \bmod n = (a \bmod n + b \bmod n) \bmod n$ and similarly for products; the kernel is the multiples of $n$.'
          - problem: 'Is $\varphi : \mathbb{Z} \to \mathbb{Z}$, $\varphi(x) = 2x$, a ring homomorphism?'
            answer: 'No: $\varphi(1 \cdot 1) = 2$ but $\varphi(1)\varphi(1) = 4$.'
            solution_sketch: 'Additivity holds but multiplicativity fails.'
        constraints: "verify both operations; evaluation and reduction maps; one failing example per set"
      - id: kp2
        name: "Ideals and the absorption property"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'Prove that $n\mathbb{Z}$ is an ideal of $\mathbb{Z}$.'
            answer: 'It is an additive subgroup, and $r \cdot nk = n(rk) \in n\mathbb{Z}$ for any $r \in \mathbb{Z}$ — absorption holds.'
            solution_sketch: 'Subgroup test plus the absorption check $rI \subseteq I$.'
          - problem: 'Is $\mathbb{Z}$ an ideal of $\mathbb{Q}$?'
            answer: 'No: $\tfrac12 \cdot 1 = \tfrac12 \notin \mathbb{Z}$, so absorption fails (it is only a subring).'
            solution_sketch: 'Ideals must absorb multiplication by every ring element, including fractions.'
        constraints: "subring vs ideal distinctions; absorption checks in Z, Q, Z[x]"
      - id: kp3
        name: "Principal and generated ideals"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'In $\mathbb{Z}$, identify the ideal generated by $4$ and $6$.'
            answer: '$\langle 4, 6 \rangle = 2\mathbb{Z}$'
            solution_sketch: 'Integer combinations $4x + 6y$ are exactly the multiples of $\gcd(4,6) = 2$ (Bezout).'
          - problem: 'Every ideal of $\mathbb{Z}$ is principal. Sketch the proof.'
            answer: 'A nonzero ideal contains a least positive element $d$; division with remainder shows every element is a multiple of $d$, so $I = d\mathbb{Z}$.'
            solution_sketch: 'Well-ordering gives $d$; if $a \in I$ then $a = qd + r$ with $0 \le r < d$ and $r = a - qd \in I$ forces $r = 0$.'
        constraints: "ideals of Z via gcd; the division-algorithm argument"
    diagnostic_exemplar:
      problem: 'Let $\varphi : \mathbb{Z}[x] \to \mathbb{Z}_3$ send $p$ to $p(0) \bmod 3$. Show that $\varphi$ is a ring homomorphism and identify $\ker \varphi$ as an ideal generated by two elements.'
      answer: '$\varphi$ is the composite of evaluation at $0$ (which preserves sums and products, since $(p+q)(0) = p(0)+q(0)$ and $(pq)(0) = p(0)q(0)$) with reduction mod $3$, itself a ring homomorphism; so $\varphi$ preserves $+$ and $\cdot$. Its kernel is $\{p : 3 \mid p(0)\}$. Writing $p(x) = p(0) + x\,q(x)$, any such $p$ is $3k + x q(x) \in \langle 3, x\rangle$; conversely every element of $\langle 3, x \rangle$ has constant term divisible by $3$. Hence $\ker \varphi = \langle 3, x \rangle$, an ideal by absorption.'
      solution_sketch: 'Composite of two ring homomorphisms. For the kernel, split $p$ into its constant term and a multiple of $x$, then prove both inclusions.'
    anki_seeds:
      - front: "Extra condition an ideal satisfies beyond being a subring?"
        back: "Absorption: $ra \\in I$ for every $r$ in the ring and $a \\in I$."
        type: basic
      - front: "Every ideal of $\\mathbb{Z}$ has the form..."
        back: "$n\\mathbb{Z}$ for some $n \\ge 0$ ($\\mathbb{Z}$ is a principal ideal ring)."
        type: basic
      - front: "Kernel of a ring homomorphism is always a(n)..."
        back: "Ideal of the domain."
        type: basic

  - id: quotient-rings
    name: "Quotient Rings"
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: multi-step
    expected_time_secs: 210
    prerequisites:
      - id: ring-homomorphisms-ideals
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.7
        key: true
      - id: polynomial-rings
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The construction R/I"
        key_prerequisites: [ring-homomorphisms-ideals, quotient-groups]
        exemplars:
          - problem: 'Describe the elements and operations of $\mathbb{Z}/6\mathbb{Z}$ and identify the ring.'
            answer: 'Cosets $k + 6\mathbb{Z}$ for $k = 0,\dots,5$, added and multiplied via representatives; it is $\mathbb{Z}_6$.'
            solution_sketch: 'The ideal $6\mathbb{Z}$ collapses multiples of $6$ to zero; coset arithmetic is mod-$6$ arithmetic.'
          - problem: 'Why must $I$ be an ideal (not just a subring) for multiplication on $R/I$ to be well defined?'
            answer: 'Changing representatives $a \to a + i$ changes $ab$ by $ib$, which must lie in $I$ — that is absorption.'
            solution_sketch: '$(a+i)(b+j) = ab + (ib + aj + ij)$; the bracket lies in $I$ exactly when $I$ absorbs products.'
        constraints: "construction-level reasoning; Z/nZ examples"
      - id: kp2
        name: "Computing in Z_p[x]/(f): small quotient rings"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'How many elements does $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ have? List them.'
            answer: '$4$: the cosets of $0, 1, x, x+1$.'
            solution_sketch: 'Every polynomial reduces mod $x^2+x+1$ to a remainder of degree $< 2$ with coefficients in $\mathbb{Z}_2$: $2^2 = 4$ remainders.'
          - problem: 'In $\mathbb{Z}_2[x]/\langle x^2+x+1 \rangle$, writing $\alpha$ for the coset of $x$, compute $\alpha^2$.'
            answer: '$\alpha + 1$'
            solution_sketch: '$x^2 \equiv -(x + 1) = x + 1$ in characteristic $2$.'
        constraints: "Z_2 or Z_3 coefficients, quotient by degree-2 polynomials; count = p^deg"
      - id: kp3
        name: "Reduction computations in Z[x]/(f)"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, compute $(1 + x)(2 + x)$ in reduced form.'
            answer: '$1 + 3x$'
            solution_sketch: '$(1+x)(2+x) = 2 + 3x + x^2 \equiv 2 + 3x - 1 = 1 + 3x$ using $x^2 \equiv -1$.'
          - problem: 'Identify the ring $\mathbb{Z}[x]/\langle x \rangle$.'
            answer: '$\mathbb{Z}$'
            solution_sketch: 'Evaluation at $0$ is onto $\mathbb{Z}$ with kernel $\langle x \rangle$; apply the first isomorphism theorem for rings.'
        constraints: "reduce products/powers modulo x^2 + c; identify quotients via evaluation maps"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ with $\alpha$ the coset of $x$, compute $(\alpha + 1)^2$ in reduced form.'
      answer: '$\alpha$'
      solution_sketch: '$(\alpha+1)^2 = \alpha^2 + 1$ (char $2$) $= (\alpha + 1) + 1 = \alpha$.'
    anki_seeds:
      - front: "Number of elements of $\\mathbb{Z}_p[x]/\\langle f \\rangle$, $\\deg f = d$?"
        back: "$p^d$ — one coset per remainder of degree $< d$."
        type: basic
      - front: "Why must $I$ be an ideal for $R/I$ to be a ring?"
        back: "Absorption makes coset multiplication well defined: representative changes shift $ab$ by elements of $I$."
        type: basic

  - id: polynomial-rings
    name: "Polynomial Rings"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.7
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.6
        key: true
      - id: polynomial-division
        weight: 0.6
        key: true
      - id: remainder-factor-theorems
        weight: 0.5
        key: true
      - id: synthetic-division
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Degrees and coefficient arithmetic over Z_n"
        key_prerequisites: [ring-axioms-examples, integral-domains-zero-divisors]
        exemplars:
          - problem: 'In $\mathbb{Z}_6[x]$, compute $(2x + 1)(3x + 4)$ and note the degree.'
            answer: '$6x^2 + 11x + 4 = 5x + 4$ — degree $1$, not $2$.'
            solution_sketch: '$6 \equiv 0$ and $11 \equiv 5$ mod $6$: zero divisors in the coefficients can kill the leading term.'
          - problem: 'If $D$ is an integral domain and $f, g \neq 0$ in $D[x]$, what is $\deg(fg)$?'
            answer: '$\deg f + \deg g$'
            solution_sketch: 'Leading coefficients multiply to something nonzero in a domain.'
        constraints: "products in Z_n[x] (n <= 8, degrees <= 2); the degree formula and when it fails"
      - id: kp2
        name: "The division algorithm for polynomials"
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'In $\mathbb{Z}_3[x]$, divide $x^3 + 2x + 1$ by $x + 1$: give quotient and remainder.'
            answer: 'Quotient $x^2 + 2x$, remainder $1$.'
            solution_sketch: 'Long division mod 3: $x^3 + 2x + 1 = (x+1)(x^2 + 2x) + 1$; check: $(x+1)(x^2+2x) = x^3 + 3x^2 + 2x = x^3 + 2x$.'
          - problem: 'Divide $x^4 + 3x^3 + x + 2$ by $x^2 + 1$ in $\mathbb{Q}[x]$.'
            answer: 'Quotient $x^2 + 3x - 1$, remainder $-2x + 3$.'
            solution_sketch: 'Standard long division; verify $(x^2+1)(x^2+3x-1) + (-2x+3) = x^4+3x^3+x+2$.'
        constraints: "divisors monic of degree <= 2; coefficients in Q, Z_3, or Z_5; verify by multiplying back"
      - id: kp3
        name: "Roots, factors, and the remainder theorem"
        key_prerequisites: [polynomial-division, integral-domains-zero-divisors, remainder-factor-theorems]
        exemplars:
          - problem: 'State the factor theorem for a commutative ring with unity, and use it: is $x - 2$ a factor of $f(x) = x^3 - 3x + 2$ in $\mathbb{Q}[x]$?'
            answer: '$x - a$ divides $f$ iff $f(a) = 0$; here $f(2) = 8 - 6 + 2 = 4 \neq 0$, so no.'
            solution_sketch: 'Divide with remainder $f(x) = (x-a)q(x) + f(a)$; evaluate at $2$.'
          - problem: 'How many roots does $x^2 - 1$ have in $\mathbb{Z}_8$?'
            answer: '$4$: $x = 1, 3, 5, 7$.'
            solution_sketch: 'Test the odd residues: each squares to $1$ mod $8$. Over a non-domain, a degree-$n$ polynomial can exceed $n$ roots.'
        constraints: "root counting in Z_n vs fields; remainder theorem evaluations"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_5[x]$, divide $x^3 + 4x^2 + 2$ by $x + 2$ and give quotient and remainder.'
      answer: 'Quotient $x^2 + 2x + 1$, remainder $0$ — so $x + 2$ divides it.'
      solution_sketch: 'Synthetic division at $x = -2 \equiv 3$: coefficients $1, 4, 0, 2$ reduce to quotient $1, 2, 1$ with remainder $0$. Check: $(x+2)(x^2+2x+1) = x^3 + 4x^2 + 5x + 2 \equiv x^3 + 4x^2 + 2$ in $\mathbb{Z}_5$.'
    anki_seeds:
      - front: "Degree formula $\\deg(fg) = \\deg f + \\deg g$ requires the coefficient ring to be..."
        back: "An integral domain (no zero divisors)."
        type: basic
      - front: "Factor theorem?"
        back: "$x - a$ divides $f(x)$ iff $f(a) = 0$."
        type: basic
      - front: "Over a field, a nonzero polynomial of degree $n$ has at most ______ roots."
        back: "$n$ (can fail over rings with zero divisors, e.g. $x^2-1$ has 4 roots in $\\mathbb{Z}_8$)."
        type: basic

