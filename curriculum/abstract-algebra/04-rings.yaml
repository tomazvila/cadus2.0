    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: polynomial-rings
        weight: 0.9
        key: true
      - id: factoring-trinomials
        weight: 0.4
        key: false
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: rational-root-theorem
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Root tests for degrees 2 and 3"
        key_prerequisites: [polynomial-rings]
        exemplars:
          - problem: 'Is $x^2 + x + 1$ irreducible over $\mathbb{Z}_2$?'
            answer: 'Yes: $f(0) = 1, f(1) = 1$ — no roots, and degree $\le 3$ without roots means irreducible.'
            solution_sketch: 'For degree 2 or 3, reducibility forces a linear factor, hence a root.'
          - problem: 'Factor $x^2 + 1$ over $\mathbb{Z}_5$.'
            answer: '$(x + 2)(x + 3)$ — equivalently $(x-2)(x-3)$.'
            solution_sketch: '$2^2 = 4 \equiv -1$ and $3^2 = 9 \equiv -1$, so $\pm 2$ are roots; check $(x+2)(x+3) = x^2 + 5x + 6 = x^2 + 1$.'
        constraints: "degree 2-3 over Z_2, Z_3, Z_5; the no-root criterion applies only up to degree 3"
      - id: kp2
        name: "Rational root theorem and factoring over Q"
        key_prerequisites: [polynomial-rings, factoring-trinomials, rational-root-theorem]
        exemplars:
          - problem: 'Using the rational root theorem, factor $2x^3 + x^2 - 7x - 6$ over $\mathbb{Q}$ completely.'
            answer: '$(x - 2)(x + 1)(2x + 3)$'
            solution_sketch: 'Candidates $\pm1, \pm2, \pm3, \pm6, \pm\tfrac12, \pm\tfrac32$; $x = 2$ works, divide to get $2x^2 + 5x + 3 = (x+1)(2x+3)$.'
          - problem: 'Show $x^3 - x + 1$ is irreducible over $\mathbb{Q}$.'
            answer: 'Possible rational roots $\pm 1$ give $1$ and $1$; no roots and degree 3 means irreducible.'
            solution_sketch: 'Rational roots must be $\pm 1$ (divisors of constant over divisors of leading); both fail.'
        constraints: "cubics with integer coefficients, |coefficients| <= 10; complete factorizations verified by expansion"
      - id: kp3
        name: "Eisenstein's criterion and mod-p reduction"
        key_prerequisites: [polynomial-rings, prime-factorization]
        exemplars:
          - problem: 'Prove $x^5 + 6x + 3$ is irreducible over $\mathbb{Q}$.'
            answer: 'Eisenstein at $p = 3$: $3 \mid 6, 3$; $3 \nmid 1$; $9 \nmid 3$.'
            solution_sketch: 'Check the three Eisenstein conditions on $p = 3$.'
          - problem: 'Show $x^3 + x + 1$ is irreducible over $\mathbb{Q}$ by reducing mod $2$.'
            answer: 'Mod $2$ it has no roots ($f(0)=f(1)=1$), so it is irreducible in $\mathbb{Z}_2[x]$; irreducibility mod a prime (degree preserved) lifts to $\mathbb{Q}$.'
            solution_sketch: 'The mod-$p$ test: if the reduction (same degree) is irreducible over $\mathbb{Z}_p$, the original is irreducible over $\mathbb{Q}$.'
        constraints: "Eisenstein with p in {2, 3, 5}; mod-p test with p = 2, 3; degree <= 5"
    diagnostic_exemplar:
      problem: 'Decide whether each is irreducible over $\mathbb{Q}$: (a) $x^4 + 10x + 5$, (b) $x^2 - 9$.'
      answer: '(a) Irreducible by Eisenstein at $p = 5$ ($5 \mid 10, 5$; $5 \nmid 1$; $25 \nmid 5$). (b) Reducible: $(x-3)(x+3)$.'
      solution_sketch: 'Eisenstein handles (a); (b) is a difference of squares.'
    anki_seeds:
      - front: "Eisenstein's criterion at prime $p$?"
        back: "$p$ divides every coefficient except the leading one, and $p^2$ does not divide the constant term $\\Rightarrow$ irreducible over $\\mathbb{Q}$."
        type: basic
      - front: "When does 'no roots' prove irreducibility over a field?"
        back: "Only for degree 2 or 3 (higher degrees can factor into two quadratics)."
        type: basic

  - id: prime-maximal-ideals
    name: "Prime and Maximal Ideals"
    core: false                # terminal ideal classification; the curriculum stops here
    difficulty: 0.80
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: quotient-rings
        weight: 0.9
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: irreducibility-factorization
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Definitions and the quotient characterizations"
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'State the quotient characterizations of prime and maximal ideals in a commutative ring with unity.'
            answer: '$P$ prime $\iff R/P$ is an integral domain; $M$ maximal $\iff R/M$ is a field.'
            solution_sketch: '$ab \in P \Rightarrow a \in P$ or $b \in P$ translates to no zero divisors in $R/P$; maximality translates to no proper nonzero ideals in $R/M$, i.e. every nonzero coset invertible.'
          - problem: 'Every maximal ideal is prime. Why?'
            answer: 'Fields are integral domains, so $R/M$ a field forces $R/M$ a domain.'
            solution_sketch: 'Chain the two characterizations.'
        constraints: "statements and one-line derivations; commutative rings with unity"
      - id: kp2
        name: "Classifying prime/maximal ideals of Z and Z_n"
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'Which ideals $n\mathbb{Z}$ of $\mathbb{Z}$ are prime? Which are maximal?'
            answer: 'Prime: $\{0\}$ and $p\mathbb{Z}$ for $p$ prime. Maximal: exactly $p\mathbb{Z}$, $p$ prime.'
            solution_sketch: '$\mathbb{Z}/n\mathbb{Z}$ is a domain iff $n = 0$ or $n$ prime, and a field iff $n$ prime.'
          - problem: 'Find all maximal ideals of $\mathbb{Z}_{12}$.'
            answer: '$\langle 2 \rangle = \{0,2,4,6,8,10\}$ and $\langle 3 \rangle = \{0,3,6,9\}$.'
            solution_sketch: 'Ideals of $\mathbb{Z}_{12}$ are $\langle d \rangle$ for $d \mid 12$; quotients $\mathbb{Z}_{12}/\langle d \rangle \cong \mathbb{Z}_d$ are fields exactly for $d = 2, 3$.'
        constraints: "Z and Z_n (n <= 24); justify via the quotient"
      - id: kp3
        name: "Prime but not maximal; polynomial examples"
        key_prerequisites: [quotient-rings]
        exemplars:
          - problem: 'Show that $\langle x \rangle$ is prime but not maximal in $\mathbb{Z}[x]$.'
            answer: '$\mathbb{Z}[x]/\langle x \rangle \cong \mathbb{Z}$: an integral domain but not a field.'
            solution_sketch: 'Evaluation at 0 identifies the quotient with $\mathbb{Z}$; conclude via the characterizations.'
          - problem: 'Is $\langle x^2 + x + 1 \rangle$ maximal in $\mathbb{Z}_2[x]$?'
            answer: 'Yes: the quotient is a field with $4$ elements (the polynomial is irreducible over $\mathbb{Z}_2$).'
            solution_sketch: 'For $F[x]$ with $F$ a field, $\langle f \rangle$ is maximal iff $f$ is irreducible.'
        constraints: "quotient identifications in Z[x] and F[x]; irreducible <-> maximal in F[x]"
    diagnostic_exemplar:
      problem: 'Decide whether $\langle 5 \rangle$ is a prime ideal of $\mathbb{Z}[x]$, and whether it is maximal. Justify both answers by identifying the quotient.'
      answer: 'Reducing coefficients mod $5$ gives $\mathbb{Z}[x]/\langle 5 \rangle \cong \mathbb{Z}_5[x]$. Since $\mathbb{Z}_5$ is a field, $\mathbb{Z}_5[x]$ is an integral domain, so $\langle 5 \rangle$ is prime. It is not maximal: $\mathbb{Z}_5[x]$ is not a field, because $x$ has no inverse (degrees add under multiplication). Equivalently $\langle 5 \rangle \subsetneq \langle 5, x \rangle \subsetneq \mathbb{Z}[x]$, so $\langle 5 \rangle$ is prime but not maximal.'
      solution_sketch: 'Use the quotient characterisations — prime iff the quotient is a domain, maximal iff it is a field — after identifying the quotient as $\mathbb{Z}_5[x]$.'
    anki_seeds:
      - front: "$P$ prime iff $R/P$ is a(n) ______; $M$ maximal iff $R/M$ is a(n) ______."
        back: "Integral domain; field."
        type: basic
      - front: "In $F[x]$ ($F$ a field), $\\langle f \\rangle$ is maximal iff..."
        back: "$f$ is irreducible over $F$."
        type: basic
      - front: "Example of a prime ideal that is not maximal?"
        back: "$\\langle x \\rangle$ in $\\mathbb{Z}[x]$ (quotient $\\mathbb{Z}$: domain, not field); also $\\{0\\}$ in $\\mathbb{Z}$."
        type: basic

  - id: euclidean-domains-pids
    name: "Euclidean Domains and Principal Ideal Domains"
    core: false                # terminal factorization-theory branch; nothing downstream consumes it (splitting fields rest on irreducibility-factorization, not PID theory)
    difficulty: 0.78
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: ring-homomorphisms-ideals
        weight: 0.8
        key: true
      - id: polynomial-rings
        weight: 0.6
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.5
        key: false
      - id: euclidean-algorithm
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Euclidean norms; division in Z[i]"
        key_prerequisites: [integral-domains-zero-divisors, complex-numbers]
        exemplars:
          - problem: 'A Euclidean domain carries a norm allowing division with smaller remainder. In the Gaussian integers $\mathbb{Z}[i]$ with $N(a + bi) = a^2 + b^2$, compute $N(3 + 2i)$.'
            answer: "13"
            solution_sketch: '$N(3 + 2i) = 3^2 + 2^2 = 13$. ($N$ is multiplicative: $N(zw) = N(z)N(w)$.)'
          - problem: 'Divide $7 + 2i$ by $2 - i$ in $\mathbb{Z}[i]$: find $q, r$ with $7 + 2i = (2 - i)q + r$ and $N(r) < N(2 - i)$.'
            answer: '$q = 2 + 2i$, $r = 1$'
            solution_sketch: 'Exact quotient: $\frac{7+2i}{2-i} = \frac{(7+2i)(2+i)}{5} = \frac{12 + 11i}{5} = 2.4 + 2.2i$; round to the nearest Gaussian integer $q = 2 + 2i$. Then $r = 7 + 2i - (2-i)(2+2i) = 7 + 2i - (6 + 2i) = 1$, and $N(1) = 1 < 5 = N(2 - i)$.'
        constraints: "norms and one-step divisions in Z[i] with parts |a|, |b| <= 8; the degree norm on F[x] cited from polynomial-rings; Z with absolute value as the base example"
      - id: kp2
        name: "Every Euclidean domain is a PID"
        key_prerequisites: [ring-homomorphisms-ideals, euclidean-algorithm]
        exemplars:
          - problem: 'Prove that every Euclidean domain is a principal ideal domain.'
            answer: 'In a nonzero ideal $I$, pick $d \neq 0$ of minimal norm. For any $a \in I$, write $a = qd + r$ with $r = 0$ or $N(r) < N(d)$; since $r = a - qd \in I$, minimality forces $r = 0$. So $I = \langle d \rangle$.'
            solution_sketch: 'Well-ordering supplies a minimal-norm element; division with remainder shows it generates — the same argument that made every ideal of $\mathbb{Z}$ principal.'
          - problem: 'Find a single generator of the ideal $\langle x^2 - 1,\ x^2 - 3x + 2 \rangle$ in $\mathbb{Q}[x]$.'
            answer: '$x - 1$'
            solution_sketch: '$x^2 - 1 = (x-1)(x+1)$ and $x^2 - 3x + 2 = (x-1)(x-2)$; the ideal is generated by their gcd $x - 1$ (obtained by the Euclidean algorithm in $\mathbb{Q}[x]$).'
        constraints: "the minimal-norm proof; generators of two-element ideals in Q[x] via polynomial gcd, degrees <= 3"
      - id: kp3
        name: "PIDs vs non-PIDs: the ideal <2, x>"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'Show that $\langle 2, x \rangle$ is not principal in $\mathbb{Z}[x]$, so $\mathbb{Z}[x]$ is not a PID.'
            answer: 'A generator $f$ would divide $2$, so $f = \pm 1$ or $\pm 2$. But $\pm 2 \nmid x$ in $\mathbb{Z}[x]$, and $f = \pm 1$ would make the ideal all of $\mathbb{Z}[x]$ — yet $\langle 2, x \rangle$ is exactly the polynomials with even constant term, a proper ideal. Contradiction.'
            solution_sketch: 'Constrain the candidate generator through divisibility of $2$, then rule each candidate out.'
          - problem: 'Which of these rings are PIDs: $\mathbb{Z}$, $\ \mathbb{Q}[x]$, $\ \mathbb{Z}[x]$?'
            answer: '$\mathbb{Z}$ and $\mathbb{Q}[x]$ are PIDs (both Euclidean); $\mathbb{Z}[x]$ is not (witness $\langle 2, x \rangle$).'
            solution_sketch: 'Euclidean $\implies$ PID covers the first two; the previous exemplar refutes the third.'
        constraints: "classify Z, F[x], Z[x], fields; the <2, x> argument reproduced, not just quoted"
    diagnostic_exemplar:
      problem: 'Show that the ideal $\langle 3, x \rangle$ of $\mathbb{Z}[x]$ is not principal, and explain why no ideal of $\mathbb{Q}[x]$ can fail in this way.'
      answer: 'First, $\langle 3, x \rangle = \{p \in \mathbb{Z}[x] : 3 \mid p(0)\}$, a proper ideal since $1 \notin$ it. Suppose $\langle 3, x\rangle = \langle f \rangle$. Then $f \mid 3$, so $f$ is a constant $\pm 1$ or $\pm 3$. If $f = \pm 1$ the ideal would be all of $\mathbb{Z}[x]$, contradicting properness; if $f = \pm 3$ then $f \nmid x$ (that would need $3$ to divide the coefficient $1$), contradicting $x \in \langle f \rangle$. So no single generator exists. In $\mathbb{Q}[x]$ this cannot happen: division with remainder by degree makes $\mathbb{Q}[x]$ a Euclidean domain, and in a Euclidean domain a nonzero element of least norm in an ideal generates it — every Euclidean domain is a PID.'
      solution_sketch: 'Describe the ideal concretely, then rule out both candidate generators. The contrast: $\mathbb{Q}[x]$ has a degree norm with division, so a least-degree element of any ideal generates it.'
    anki_seeds:
      - front: "Euclidean domain?"
        back: "An integral domain with a norm allowing division with remainder: $a = qb + r$ with $r = 0$ or $N(r) < N(b)$."
        type: basic
      - front: "Euclidean domain $\\Rightarrow$ PID — proof idea?"
        back: "A minimal-norm element of an ideal generates it (division leaves a smaller remainder inside the ideal, which must be 0)."
        type: basic
      - front: "Standard example of a non-principal ideal?"
        back: "$\\langle 2, x \\rangle$ in $\\mathbb{Z}[x]$ — the polynomials with even constant term."
        type: basic

  - id: unique-factorization-domains
    name: "Unique Factorization Domains"
    core: false                # terminal factorization-theory branch; nothing downstream consumes it
    difficulty: 0.80
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: euclidean-domains-pids
        weight: 0.8
        key: true
      - id: irreducibility-factorization
        weight: 0.6
        key: true
      - id: prime-factorization
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Irreducible vs prime elements"
        key_prerequisites: [irreducibility-factorization, euclidean-domains-pids]
        exemplars:
          - problem: 'Define irreducible and prime elements of an integral domain, and prove that every prime element is irreducible.'
            answer: '$p$ (nonzero, non-unit) is prime if $p \mid ab \implies p \mid a$ or $p \mid b$; irreducible if $p = ab \implies a$ or $b$ is a unit. If $p = ab$, then $p \mid ab$, say $p \mid a$: $a = pc$ gives $p = pcb$, so $cb = 1$ (cancellation) and $b$ is a unit.'
            solution_sketch: 'Apply the prime property to the factorization itself, then cancel $p$ in the domain.'
          - problem: 'In $\mathbb{Z}[\sqrt{-5}]$ with $N(a + b\sqrt{-5}) = a^2 + 5b^2$, show that $2$ is irreducible.'
            answer: 'If $2 = xy$ with $x, y$ non-units, then $N(x)N(y) = N(2) = 4$ with $N(x) = N(y) = 2$; but $a^2 + 5b^2 = 2$ has no integer solutions. So no such factorization exists.'
            solution_sketch: 'Norms are multiplicative and units have norm $1$; rule out the middle norm value.'
        constraints: "norm arguments in Z[sqrt(-5)] and Z[i], norms <= 30; the prime => irreducible proof with cancellation cited"
      - id: kp2
        name: "UFDs and factoring in Z[i]"
        key_prerequisites: [euclidean-domains-pids, prime-factorization]
        exemplars:
          - problem: 'State the UFD property and the chain of implications relating Euclidean domains, PIDs, and UFDs.'
            answer: 'A UFD is a domain where every nonzero non-unit factors into irreducibles, uniquely up to order and unit factors. Euclidean $\Rightarrow$ PID $\Rightarrow$ UFD (each implication strict).'
            solution_sketch: 'The chain may be quoted; $\mathbb{Z}$, $F[x]$, $\mathbb{Z}[i]$ are the working examples, $\mathbb{Z}[x]$ a UFD that is not a PID.'
          - problem: 'Factor $5$ into irreducibles in $\mathbb{Z}[i]$.'
            answer: '$5 = (2 + i)(2 - i)$'
            solution_sketch: 'Both factors have norm $5$, and a norm-$5$ element is irreducible (a proper factor would need norm $\sqrt5$-impossible: norms multiply and $5$ is prime in $\mathbb{Z}$).'
        constraints: "factorizations in Z[i] with norms <= 25; irreducibility certified by prime norms; the implication chain quoted, not proved"
      - id: kp3
        name: "Failure of unique factorization: Z[sqrt(-5)]"
        key_prerequisites: [irreducibility-factorization, euclidean-domains-pids]
        exemplars:
          - problem: 'Show that $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ gives two essentially different factorizations into irreducibles in $\mathbb{Z}[\sqrt{-5}]$.'
            answer: 'Norms: $N(2) = 4$, $N(3) = 9$, $N(1 \pm \sqrt{-5}) = 6$. Each factor is irreducible: a proper splitting would need a factor of norm $2$ or $3$, and $a^2 + 5b^2$ never equals $2$ or $3$. The units are $\pm 1$ (norm $1$), and no factor of one factorization is a unit multiple of a factor of the other (their norms differ). So factorization is not unique.'
            solution_sketch: 'Certify all four factors irreducible by ruling out norms 2 and 3; compare norms to rule out associates.'
          - problem: 'Deduce that $2$ is not prime in $\mathbb{Z}[\sqrt{-5}]$, and explain why this proves $\mathbb{Z}[\sqrt{-5}]$ is not a UFD.'
            answer: '$2 \mid (1+\sqrt{-5})(1-\sqrt{-5}) = 6$, but $2$ divides neither factor ($N(2) = 4 \nmid 6$). So $2$ is irreducible but not prime — impossible in a UFD, where irreducible and prime coincide.'
            solution_sketch: 'Use the norm to refute both divisibilities; in a UFD every irreducible is prime.'
        constraints: "the classic Z[sqrt(-5)] computation; every irreducibility claim justified by a norm argument"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}[\sqrt{-5}]$ with norm $N(a + b\sqrt{-5}) = a^2 + 5b^2$, show that $3$ is irreducible but not prime, and state what this proves about $\mathbb{Z}[\sqrt{-5}]$.'
      answer: 'Irreducible: if $3 = xy$ with $x, y$ non-units then $N(x)N(y) = N(3) = 9$ with $N(x) = N(y) = 3$ (the units are exactly the elements of norm $1$); but $a^2 + 5b^2 = 3$ has no integer solution, since $b = 0$ would force $a^2 = 3$ and $|b| \ge 1$ makes the norm at least $5$. Not prime: $3 \mid 6 = (1 + \sqrt{-5})(1 - \sqrt{-5})$, yet $3$ divides neither factor, because $N(3) = 9$ does not divide $N(1 \pm \sqrt{-5}) = 6$. In a UFD irreducible and prime elements coincide, so $\mathbb{Z}[\sqrt{-5}]$ is not a UFD.'
      solution_sketch: 'Norms are multiplicative and units are exactly the norm-$1$ elements. Rule out a factor of norm $3$, then exhibit a product that $3$ divides without dividing either factor.'
    anki_seeds:
      - front: "Chain: Euclidean, PID, UFD?"
        back: "Euclidean $\\Rightarrow$ PID $\\Rightarrow$ UFD; both implications are strict ($\\mathbb{Z}[x]$: UFD, not PID)."
        type: basic
      - front: "Prime vs irreducible in a general domain?"
        back: "Prime $\\Rightarrow$ irreducible always; the converse holds in UFDs but fails in e.g. $\\mathbb{Z}[\\sqrt{-5}]$."
        type: basic
      - front: "Classic witness that $\\mathbb{Z}[\\sqrt{-5}]$ is not a UFD?"
        back: "$6 = 2 \\cdot 3 = (1+\\sqrt{-5})(1-\\sqrt{-5})$, all factors irreducible, none associate."
        type: basic
