unit: rings
course: abstract-algebra
module: "Rings"
topics:
  - id: ring-axioms-examples
    name: "Ring Axioms and Examples"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: elementary-group-properties
        weight: 0.7
        key: true
      - id: modular-arithmetic
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.3
        key: false
      # Phase C: the ring axioms cite "abelian group under +" as a definition; the
      # concept is taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The axioms; rings vs non-rings"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: 'Consider the set $\{0, 1, 2, 3, \dots\}$ of nonnegative integers with the usual addition and multiplication. Which ring axiom fails for this set?'
            answer: 'additive inverses'
            answer_contract: {"kind": "label", "options": [["additive inverses", "additive inverse", "inverses", "no additive inverses", "existence of additive inverses", "the additive inverse axiom", "additive inverse axiom", "it has no additive inverses"], ["associativity", "associative"], ["distributivity", "distributive law"], ["closure"]]}
            solution_sketch: 'The nonnegative integers are closed under addition and multiplication, and both operations stay associative and distributive because they are so in $\mathbb{Z}$. Zero is present, but $1$ has no partner $b$ in the set with $1+b=0$, since $b=-1$ is not nonnegative. So the axiom that fails is the existence of additive inverses.'
          - problem: 'A dial has positions $0, 1, 2, 3, 4, 5$, and turning it adds to the position modulo $6$. A technician allows only the positions in $S = \{0, 1, 2, 3\}$. Find the least positive integer that is a sum of two elements of $S$ modulo $6$ but is not an element of $S$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sums $2+2=4$ and $1+3=4$ both give $4$, and $4$ is not in $S$. The positive integers $1$, $2$ and $3$ lie in $S$, so no smaller one qualifies. Because $S$ is not closed under addition, it is not a ring.'
          - problem: 'Let $S$ be the set of rational numbers $m/2$ with $m$ an integer, with the usual addition and multiplication. Find the least positive product of two elements of $S$ that is not in $S$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A product of two elements of $S$ has the form $\frac{m}{2}\cdot\frac{n}{2}=\frac{mn}{4}$. It lies in $S$ only when $mn$ is even, so odd values of $mn$ leave $S$. The least positive one comes from $m=n=1$ and equals $\frac{1}{4}$.'
          - problem: 'The subset $T = \{0, 2, 4\}$ of $\mathbb{Z}_6$ is closed under addition and multiplication modulo $6$, so it is a ring. Find the element $e$ of $T$ with $ex = x$ for every $x$ in $T$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Test each element of $T$ against $x=2$ and $x=4$. Since $4\cdot2=8\equiv2$, $4\cdot4=16\equiv4$ and $4\cdot0=0$, the element $4$ acts as a multiplicative identity in $T$. The element $2$ fails because $2\cdot2=4\neq2$, so $T$ has unity $4$ even though $1\notin T$.'
          - problem: 'Sam says that the odd integers, with the usual addition and multiplication, form a ring because the product of two odd integers is odd. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "sam is right", "sam is correct", "it is a ring", "ring"], ["no", "sam is wrong", "sam is not right", "sam is incorrect", "sam is mistaken", "it is not a ring", "not a ring", "the odd integers are not a ring"]]}
            solution_sketch: 'A ring must be closed under addition as well as multiplication. Taking $3+5=8$ shows that a sum of two odd integers is even, so the sum leaves the set. The odd integers do not form a ring, and Sam checked only one of the two operations.'
          - problem: 'The subset $\{0, 5\}$ of $\mathbb{Z}_{10}$ is a ring under addition and multiplication modulo $10$. Find its multiplicative identity.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $5\cdot5=25\equiv5$ and $5\cdot0=0$, the element $5$ leaves every element of the subset unchanged under multiplication. The element $0$ cannot be the identity because $0\cdot5=0\neq5$. So the identity is $5$, not the $1$ of $\mathbb{Z}_{10}$.'
          - problem: 'Lengths on a plan are recorded as multiples of one third of a unit, so the recorded lengths form the set $S = \{m/3 : m \in \mathbb{Z}\}$. An area is the product of two lengths. Find the least positive area made from two recorded lengths that is not itself a recorded length.'
            answer: '1/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two recorded lengths multiply to $\frac{m}{3}\cdot\frac{n}{3}=\frac{mn}{9}$. This is a recorded length only when $3$ divides $mn$. The least positive area outside $S$ comes from $m=n=1$ and is $\frac{1}{9}$ of a square unit.'
        constraints: "verify/refute ring structure for subsets of Z, Q, Z_n; identify which axiom fails"
      - id: kp2
        name: "The standard examples: Z, Z_n, 2Z, Z[x], Z[sqrt(2)]"
        key_prerequisites: [modular-arithmetic]
        exemplars:
          - problem: 'In $\mathbb{Z}[\sqrt{2}] = \{a + b\sqrt{2} : a, b \in \mathbb{Z}\}$, compute $(1 + 2\sqrt{2})(3 - \sqrt{2})$.'
            answer: '-1 + 5sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand to get $3-\sqrt{2}+6\sqrt{2}-2(\sqrt{2})^2$. Since $(\sqrt{2})^2=2$, the last term is $-4$, and the integer part is $3-4=-1$. The $\sqrt{2}$ part is $-1+6=5$, so the product is $-1+5\sqrt{2}$.'
          - problem: 'Work in the ring $\mathbb{Z}_{12} = \{0, 1, \dots, 11\}$ with addition and multiplication modulo $12$. Compute $(7 + 8)(5 + 4)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $7+8=15\equiv3$ and $5+4=9$ in $\mathbb{Z}_{12}$. Then $3\cdot9=27\equiv3$. The same value results from $15\cdot9=135=11\cdot12+3$.'
          - problem: 'The set $2\mathbb{Z} = \{\dots, -4, -2, 0, 2, 4, \dots\}$ of even integers is a ring under ordinary addition and multiplication. Does $2\mathbb{Z}$ have a multiplicative identity?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it has a unity", "has a multiplicative identity", "it has a multiplicative identity", "it does have a unity", "unity"], ["no", "it has no unity", "no unity", "it does not", "no multiplicative identity", "it has no multiplicative identity", "it does not have a multiplicative identity", "no identity"]]}
            solution_sketch: 'An identity $e\in2\mathbb{Z}$ would need $e\cdot2=2$, which forces $e=1$. But $1$ is odd, so it is not an element of $2\mathbb{Z}$. Hence $2\mathbb{Z}$ is a ring with no unity.'
          - problem: 'The set $\mathbb{Z}[x]$ of polynomials with integer coefficients is a ring under ordinary addition and multiplication of polynomials. Compute $(2x + 1)(x + 3)$ in $\mathbb{Z}[x]$.'
            answer: '2x^2 + 7x + 3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Distribute each term: $2x\cdot x=2x^2$, $2x\cdot3=6x$, $1\cdot x=x$ and $1\cdot3=3$. Collecting the like terms gives $6x+x=7x$. So the product is $2x^2+7x+3$.'
          - problem: 'In the ring $\mathbb{Z}[\sqrt{2}]$, find the multiplicative inverse of $1 + \sqrt{2}$.'
            answer: '-1 + sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Look for $c+d\sqrt{2}$ with $(1+\sqrt{2})(c+d\sqrt{2})=1$. Expanding gives $(c+2d)+(c+d)\sqrt{2}=1$, so $c+d=0$ and $c+2d=1$. Then $d=1$ and $c=-1$, and indeed $(1+\sqrt{2})(-1+\sqrt{2})=-1+2=1$.'
          - problem: 'An 8-bit counter wraps around after $255$, so its readings are the elements of $\mathbb{Z}_{256}$. The counter reads $200$ and then $100$ is added. What does it read?'
            answer: '44'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $200+100=300$, and the counter works modulo $256$. Since $300-256=44$, the reading after the wrap is $44$.'
          - problem: 'A pointer on a dial with $12$ marks moves $8$ marks at every step, so after $k$ steps it has moved $8k$ marks modulo $12$. After how many steps does it first return to its starting mark?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pointer is back at the start when $8k$ is a multiple of $12$. Since $\gcd(8,12)=4$, the least positive $k$ is $12/4=3$. Check: $8\cdot3=24=2\cdot12$.'
          - problem: 'Sam multiplies $(2 + 3\sqrt{2})(4 - \sqrt{2})$ in $\mathbb{Z}[\sqrt{2}]$ and gets $14 + 10\sqrt{2}$. What is the correct product?'
            answer: '2 + 10sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expanding gives $8-2\sqrt{2}+12\sqrt{2}-3(\sqrt{2})^2$. The last term is $-3\cdot2=-6$, not $+6$, which is where Sam went wrong. So the integer part is $8-6=2$ and the product is $2+10\sqrt{2}$.'
          - problem: 'Days of the week are numbered $0$ to $6$, with $0$ for Sunday, and numbers are added modulo $7$. Today is day $5$. Which number is the day $100$ days from now?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The day number is $5+100=105$ modulo $7$. Since $105=15\cdot7$, the remainder is $0$. So the day is Sunday, number $0$.'
        constraints: "arithmetic in Z_n, 2Z, Z[sqrt(2)]; note which have unity and which are commutative"
      - id: kp3
        name: "Basic consequences: 0-multiplication, negatives"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: 'In the ring $\mathbb{Z}_{12} = \{0, 1, \dots, 11\}$, find the element $(-5) \cdot 8$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In any ring $(-a)b=-(ab)$, so $(-5)\cdot8=-(5\cdot8)=-40$. In $\mathbb{Z}_{12}$ we have $-40=-40+48=8$. So the element is $8$.'
          - problem: 'In the ring $\mathbb{Z}_9$, find the element $6 \cdot 0 + 6 \cdot 4$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In any ring $a\cdot0=0$, so $6\cdot0=0$ and the sum is $6\cdot4=24$. Reducing, $24=2\cdot9+6$. So the element is $6$.'
          - problem: 'In $\mathbb{Z}_{11}$ the elements $a$ and $b$ satisfy $ab = 4$. Find $(-a) \cdot b$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the rule $(-a)b=-(ab)$, the product is $-4$. In $\mathbb{Z}_{11}$ this is $-4+11=7$. So $(-a)\cdot b=7$.'
          - problem: 'Sam computes $(-3)(-4)$ in $\mathbb{Z}_7$ as $-12$, which is $2$ in $\mathbb{Z}_7$. What is the correct value?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In any ring $(-a)(-b)=ab$, so the product is $3\cdot4=12$, not $-12$. Reducing, $12=7+5$. So the correct value is $5$.'
          - problem: 'In $\mathbb{Z}_{10}$ the elements $a$, $b$ and $c$ satisfy $ab = 6$ and $ac = 3$. Find $a(b - c)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By distributivity $a(b-c)=ab+a(-c)$, and in any ring $a(-c)=-(ac)$. So $a(b-c)=ab-ac=6-3=3$ in $\mathbb{Z}_{10}$. For example $a=3$, $b=2$, $c=1$ gives $3\cdot1=3$.'
          - problem: 'The proof that $(-a)b = -(ab)$ contains the line $ab + (-a)b = (a + (-a))b$. Which ring axiom justifies this line?'
            answer: 'distributive property'
            answer_contract: {"kind": "label", "options": [["distributive property", "distributivity", "the distributive law", "distributive law", "the distributive property", "distributive", "right distributive law", "distributive axiom"], ["associativity of multiplication", "associativity", "associative law"], ["commutativity of addition", "commutativity", "commutative law"], ["existence of additive inverses", "additive inverses", "additive inverse"]]}
            solution_sketch: 'The left side has the common factor $b$ on the right of both terms. Pulling it out, $ab+(-a)b=(a+(-a))b$, is exactly the right distributive law. No rearranging of the order of terms or of brackets is used in this line, so the axiom is the distributive property.'
          - problem: 'A meter counts backwards on a dial that wraps around at $100$, so its readings are the elements of $\mathbb{Z}_{100}$. It reads $20$ and then loses $7$ every hour for $6$ hours. What does it read afterwards?'
            answer: '78'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total change is $(-7)\cdot6=-(7\cdot6)=-42$. The reading is $20-42=-22$, and $-22+100=78$ in $\mathbb{Z}_{100}$. So the meter reads $78$.'
          - problem: 'A 24-hour clock shows the elements of $\mathbb{Z}_{24}$. A schedule moves a shift by $5$ hours earlier each day for $4$ days, and the shift starts at hour $3$. At which hour does it start on day $4$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving earlier by $5$ hours for $4$ days changes the hour by $(-5)\cdot4=-20$. The new hour is $3-20=-17$, and $-17+24=7$. So the shift starts at hour $7$.'
        constraints: "two-line consequences of distributivity; cite each axiom used"
    diagnostic_exemplar:
      problem: 'Prove that $(-a)b = -(ab)$ in any ring $R$, naming the axioms you use, and illustrate the identity in $\mathbb{Z}_{10}$ with $a = 3$, $b = 7$.'
      answer: 'By distributivity, $ab + (-a)b = (a + (-a))b = 0 \cdot b$, and $0 \cdot b = 0$ (from $0b = (0+0)b = 0b + 0b$ and cancellation in the abelian group $(R,+)$). So $(-a)b$ is an additive inverse of $ab$, and additive inverses are unique, hence $(-a)b = -(ab)$. In $\mathbb{Z}_{10}$: $-3 = 7$, so $(-3) \cdot 7 = 49 \equiv 9$, while $3 \cdot 7 = 21 \equiv 1$ and $-1 = 9$ — both sides equal $9$.'
      answer_contract: {kind: none}
      solution_sketch: 'Use distributivity to show $ab + (-a)b = 0$, together with $0 \cdot b = 0$ and uniqueness of additive inverses; then check both sides numerically mod $10$.'
    anki_seeds:
      - front: "Ring axioms in one line?"
        back: "Abelian group under $+$, associative multiplication, and both distributive laws."
        type: basic
      - front: "Standard example of a ring without unity?"
        back: "$2\\mathbb{Z}$, the even integers."
        type: basic
      - front: "In any ring, $a \\cdot 0 = $ ?"
        back: "$0$ (proved from distributivity over $0 = 0 + 0$)."
        type: basic

  - id: integral-domains-zero-divisors
    name: "Integral Domains and Zero Divisors"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.9
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding zero divisors and units in Z_n"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'List the zero divisors of $\mathbb{Z}_6$.'
            answer: '2, 3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A nonzero element is a zero divisor when it multiplies some nonzero element to $0$. In $\mathbb{Z}_6$ we have $2\cdot3=0$ and $3\cdot4=12=0$, so $2$, $3$ and $4$ qualify. The elements $1$ and $5$ are units, so the zero divisors are $2, 3, 4$.'
          - problem: 'List the units of $\mathbb{Z}_6$.'
            answer: '1, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A unit has a multiplicative inverse. In $\mathbb{Z}_6$ we have $1\cdot1=1$ and $5\cdot5=25=1$, so $1$ and $5$ are units. The other nonzero elements $2$, $3$, $4$ are zero divisors, so the units are $1, 5$.'
          - problem: 'Find all zero divisors of $\mathbb{Z}_{10}$.'
            answer: '2, 4, 5, 6, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A nonzero element $a$ is a zero divisor exactly when it shares a factor with $10$, that is, when $\gcd(a,10)>1$. The even elements $2, 4, 6, 8$ share the factor $2$, and $5$ shares the factor $5$. So the zero divisors are $2, 4, 5, 6, 8$.'
          - problem: 'Find all units of $\mathbb{Z}_9$.'
            answer: '1, 2, 4, 5, 7, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element is a unit exactly when it is coprime to $9$, so it must not be a multiple of $3$. The multiples of $3$ are $3$ and $6$, which are zero divisors. Every other nonzero element is a unit: $1, 2, 4, 5, 7, 8$.'
          - problem: 'How many zero divisors does $\mathbb{Z}_{18}$ have?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every nonzero element of $\mathbb{Z}_{18}$ is a unit or a zero divisor. There are $17$ nonzero elements and $\varphi(18)=6$ of them are units. So there are $17-6=11$ zero divisors.'
          - problem: 'How many nonzero elements $b$ of $\mathbb{Z}_{20}$ satisfy $5b = 0$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $5b$ is $0$ in $\mathbb{Z}_{20}$ exactly when $20$ divides $5b$, that is, when $4$ divides $b$. The multiples of $4$ below $20$ are $0, 4, 8, 12, 16$. Removing $0$ leaves $4$ nonzero elements.'
          - problem: 'In $\mathbb{Z}_{15}$, is the element $6$ a unit, a zero divisor, or neither?'
            answer: 'zero divisor'
            answer_contract: {"kind": "label", "options": [["unit", "a unit", "it is a unit", "6 is a unit"], ["zero divisor", "a zero divisor", "it is a zero divisor", "zero-divisor", "a zero-divisor", "6 is a zero divisor", "6 is a zero-divisor"], ["neither", "neither a unit nor a zero divisor", "it is neither", "6 is neither"]]}
            solution_sketch: 'Compute $\gcd(6,15)=3$, which is larger than $1$, so $6$ has no inverse in $\mathbb{Z}_{15}$. Indeed $6\cdot5=30=2\cdot15=0$ with $5\neq0$. So $6$ is a zero divisor.'
          - problem: 'A pointer on a dial with $15$ marks moves $6$ marks at every step, so after $k$ steps it has moved $6k$ marks modulo $15$. After how many steps does it first return to its starting mark?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pointer returns to the start when $15$ divides $6k$. Since $\gcd(6,15)=3$, the least positive $k$ is $15/3=5$. Check: $6\cdot5=30=2\cdot15$, which also shows that $6$ is a zero divisor of $\mathbb{Z}_{15}$.'
          - problem: 'A machine multiplies its register value by $9$ and keeps the remainder after division by $12$. What is the least positive register value that the machine sends to $0$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A value $v$ is sent to $0$ when $12$ divides $9v$. Since $\gcd(9,12)=3$, this means $4$ divides $v$, so the least positive value is $4$. Check: $9\cdot4=36=3\cdot12$.'
        constraints: "Z_n for n <= 20; zero divisor iff gcd(a, n) > 1 (a nonzero)"
      - id: kp2
        name: "Integral domains and cancellation"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'In the integral domain $\mathbb{Z}_{11}$ the element $x$ satisfies $7x = 7 \cdot 4 + 7 \cdot 5$. Cancel the common nonzero factor and find $x$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor the right side: $7\cdot4+7\cdot5=7(4+5)=7\cdot9$. The equation is $7x=7\cdot9$ and $\mathbb{Z}_{11}$ is an integral domain, so the nonzero factor $7$ cancels. Hence $x=9$.'
          - problem: 'Is $\mathbb{Z}_{15}$ an integral domain?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is an integral domain", "an integral domain", "it is a domain"], ["no", "it is not", "not an integral domain", "it is not an integral domain", "not a domain", "it is not a domain", "Z_15 is not an integral domain"]]}
            solution_sketch: 'An integral domain has no nonzero zero divisors. In $\mathbb{Z}_{15}$ we have $3\cdot5=15=0$ with $3\neq0$ and $5\neq0$. So $\mathbb{Z}_{15}$ is not an integral domain.'
          - problem: 'Exactly one of the rings $\mathbb{Z}_7$, $\mathbb{Z}[x]$, $\mathbb{Z} \times \mathbb{Z}$ and $\mathbb{Z}_{11}$ is not an integral domain. Which one is it?'
            answer: 'Z x Z'
            answer_contract: {"kind": "label", "options": [["Z_7", "Z7", "integers modulo 7"], ["Z[x]", "polynomials with integer coefficients", "the polynomial ring"], ["Z x Z", "Z × Z", "Z times Z", "the direct product", "Z×Z", "ZxZ", "Z \\times Z", "\\mathbb{Z} \\times \\mathbb{Z}"], ["Z_11", "Z11", "integers modulo 11"]]}
            solution_sketch: 'In $\mathbb{Z}\times\mathbb{Z}$ the product $(1,0)(0,1)=(0,0)$ has two nonzero factors, so it has zero divisors. The rings $\mathbb{Z}_7$ and $\mathbb{Z}_{11}$ are domains because $7$ and $11$ are prime, and a product of nonzero polynomials in $\mathbb{Z}[x]$ is nonzero. So the answer is $\mathbb{Z}\times\mathbb{Z}$.'
          - problem: 'How many nonzero elements of $\mathbb{Z}_{21}$ are zero divisors?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $20$ nonzero elements in $\mathbb{Z}_{21}$, and every one is a unit or a zero divisor. The units are the $\varphi(21)=2\cdot6=12$ elements coprime to $21$. So $20-12=8$ elements are zero divisors.'
          - problem: 'In $\mathbb{Z}_{12}$ cancellation does not always work: $ab = ac$ does not force $b = c$. Find the least positive $a$ for which some $b \neq c$ satisfy $ab = ac$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $a=1$ the equation $b=c$ is forced, so $1$ fails. For $a=2$ we have $2\cdot0=0=2\cdot6$ with $0\neq6$. So the least such $a$ is $2$.'
          - problem: 'A checksum multiplies a value $x$ by $8$ modulo $13$ and obtains the same result as $8 \cdot 6 + 8 \cdot 9$. Find the value $x$ in $\mathbb{Z}_{13}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factoring, $8\cdot6+8\cdot9=8\cdot15$, so $8x=8\cdot15$. Since $13$ is prime, $\mathbb{Z}_{13}$ is an integral domain and the nonzero factor $8$ cancels, giving $x=15$. In $\mathbb{Z}_{13}$ this is $15-13=2$.'
          - problem: 'A register keeps values modulo $12$ and multiplies its input by $3$. How many different inputs $x$ from $0$ to $11$ give the same output as the input $7$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input $7$ gives $3\cdot7=21=9$. An input $x$ gives $9$ when $3x\equiv9$, that is, when $x\equiv3\pmod4$. The inputs are $3, 7, 11$, so there are $3$ of them, because $3$ is a zero divisor and cannot be cancelled.'
          - problem: 'How many nonzero elements of $\mathbb{Z}_{14}$ are zero divisors?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $13$ nonzero elements in $\mathbb{Z}_{14}$. The units are the $\varphi(14)=6$ elements coprime to $14$. So $13-6=7$ elements are zero divisors, namely $2, 4, 6, 7, 8, 10, 12$.'
        constraints: "domain verdicts for Z_n, Z, Z[x], products like Z x Z; cancellation proofs"
      - id: kp3
        name: "Solving equations in the presence of zero divisors"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'Solve $2x = 0$ in $\mathbb{Z}_6$.'
            answer: '0, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $2x$ is $0$ in $\mathbb{Z}_6$ when $6$ divides $2x$, that is, when $3$ divides $x$. The residues from $0$ to $5$ with this property are $0$ and $3$. So the solutions are $0, 3$.'
          - problem: 'Find all solutions of $x^2 = x$ in $\mathbb{Z}_6$.'
            answer: '0, 1, 3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Test the residues $0$ to $5$: $0^2=0$, $1^2=1$, $2^2=4$, $3^2=9=3$, $4^2=16=4$ and $5^2=25=1$. The values that equal their own square are $0, 1, 3, 4$. The extra solutions $3$ and $4$ appear because $x(x-1)=0$ can hold with both factors nonzero.'
          - problem: 'Find all solutions of $x^2 = x$ in $\mathbb{Z}_{10}$.'
            answer: '0, 1, 5, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation says $x(x-1)\equiv0\pmod{10}$. Testing the residues gives $5^2=25=5$ and $6^2=36=6$ in addition to $0$ and $1$. So the solutions are $0, 1, 5, 6$.'
          - problem: 'Sam solves $x^2 = 1$ in $\mathbb{Z}_8$ as in the integers and finds only $x = 1$ and $x = 7$. Find all solutions.'
            answer: '1, 3, 5, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Square each residue modulo $8$: $3^2=9=1$ and $5^2=25=1$ as well as $1^2=1$ and $7^2=49=1$. The residues $0, 2, 4, 6$ give $0$ or $4$. So the solutions are $1, 3, 5, 7$, and Sam missed two because $x^2-1=(x-1)(x+1)$ can be $0$ with both factors nonzero.'
          - problem: 'Solve $4x = 0$ in $\mathbb{Z}_{12}$.'
            answer: '0, 3, 6, 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $4x$ is $0$ in $\mathbb{Z}_{12}$ when $12$ divides $4x$, that is, when $3$ divides $x$. The residues from $0$ to $11$ that are multiples of $3$ are $0, 3, 6, 9$. These are the solutions.'
          - problem: 'Find all solutions of $x^2 = 1$ in $\mathbb{Z}_{12}$.'
            answer: '1, 5, 7, 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Square the residues modulo $12$: $1^2=1$, $5^2=25=1$, $7^2=49=1$ and $11^2=121=1$. The other residues give $0$, $4$ or $9$. So the solutions are $1, 5, 7, 11$.'
          - problem: 'A register with $15$ positions multiplies its value by $6$ and keeps the remainder after division by $15$. Which values from $0$ to $14$ does it send to $0$?'
            answer: '0, 5, 10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A value $x$ is sent to $0$ when $15$ divides $6x$. Since $\gcd(6,15)=3$, this means $5$ divides $x$. The values from $0$ to $14$ are $0, 5, 10$.'
          - problem: 'A dial has $12$ marks. Turning it $x$ times by $4$ marks moves the pointer from mark $0$ to mark $8$. Which values of $x$ from $0$ to $11$ do this?'
            answer: '2, 5, 8, 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pointer is at mark $4x$ modulo $12$, so we need $4x\equiv8$. Dividing the congruence by $4$ gives $x\equiv2\pmod3$, because $\gcd(4,12)=4$ divides $8$. The values from $0$ to $11$ are $2, 5, 8, 11$.'
        constraints: "equations x^2 = x, ax = 0, x^2 = 1 in Z_n, n <= 12; expect multiple roots"
    diagnostic_exemplar:
      problem: 'Find all solutions of $x^2 = x$ in $\mathbb{Z}_{12}$, and use one of them to decide whether $\mathbb{Z}_{12}$ is an integral domain.'
      answer: '$x^2 = x$ means $x(x-1) \equiv 0 \pmod{12}$; checking the residues gives $x = 0, 1, 4, 9$ (indeed $4^2 = 16 \equiv 4$ and $9^2 = 81 \equiv 9$). The solution $x = 4$ exhibits zero divisors: $4 \cdot 3 = 12 \equiv 0$ with $4 \ne 0$ and $3 \ne 0$. So $\mathbb{Z}_{12}$ is not an integral domain.'
      answer_contract: {kind: none}
      solution_sketch: 'Solve $x(x-1) \equiv 0 \pmod{12}$ over the residues; the nontrivial idempotents $4$ and $9$ exist precisely because $12$ splits into coprime factors, and each one hands you a zero divisor.'
    anki_seeds:
      - front: "$\\mathbb{Z}_n$ is an integral domain iff..."
        back: "$n$ is prime."
        type: basic
      - front: "In $\\mathbb{Z}_n$, every nonzero element is either a ______ or a ______."
        back: "Unit (if coprime to $n$) or zero divisor (if not)."
        type: basic

  - id: units-in-modular-rings
    name: "Units, Euler's Phi, and Modular Inverses"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: euclidean-algorithm
        weight: 0.8
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: fermat-euler-theorems
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Counting units: Euler's phi function"
        key_prerequisites: [integral-domains-zero-divisors, prime-factorization]
        try_first:
          problem: 'List the numbers from $1$ to $9$ that have no common factor with $9$ other than $1$. How many are there?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'The numbers are $1, 2, 4, 5, 7, 8$. Only the multiples of $3$ are removed, one third of the numbers, so $9\left(1-\frac13\right)=6$ remain, and the product formula of this lesson counts the remaining numbers this way for any $n$.'
        exemplars:
          - problem: 'Compute $\varphi(20)$, the number of units of $\mathbb{Z}_{20}$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $20=2^2\cdot5$, so the distinct primes are $2$ and $5$. Then $\varphi(20)=20\cdot\frac12\cdot\frac45=8$. The units are $1, 3, 7, 9, 11, 13, 17, 19$.'
          - problem: 'Compute $\varphi(36)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $36=2^2\cdot3^2$, so the distinct primes are $2$ and $3$. Then $\varphi(36)=36\cdot\frac12\cdot\frac23=12$.'
          - problem: 'Compute $\varphi(60)$, the number of units of the ring of integers modulo $60$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $60=2^2\cdot3\cdot5$, so the distinct primes are $2$, $3$ and $5$. Then $\varphi(60)=60\cdot\frac12\cdot\frac23\cdot\frac45=16$.'
          - problem: 'Find the number of units of the ring of integers modulo $72$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $72=2^3\cdot3^2$, so the distinct primes are $2$ and $3$. Then $\varphi(72)=72\cdot\frac12\cdot\frac23=24$.'
          - problem: 'A small RSA modulus is $77 = 7 \cdot 11$. How many residue classes modulo $77$ are invertible?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Invertible classes are those coprime to $77$, so their number is $\varphi(77)$. For distinct primes, $\varphi(77)=(7-1)(11-1)=6\cdot10=60$. So $60$ classes are invertible.'
          - problem: 'How many residue classes modulo $50$ are units?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $50=2\cdot5^2$, so the distinct primes are $2$ and $5$. Then $\varphi(50)=50\cdot\frac12\cdot\frac45=20$. So $20$ classes are units.'
          - problem: 'A lock dial has $105$ marks. A pointer moves $s$ marks at every step, and it visits every mark exactly when $\gcd(s, 105) = 1$. How many step sizes $s$ from $1$ to $105$ make the pointer visit every mark?'
            answer: '48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The step sizes that work are the units of $\mathbb{Z}_{105}$, so the number is $\varphi(105)$. Factor $105=3\cdot5\cdot7$, then $\varphi(105)=2\cdot4\cdot6=48$. The step $s=105$ is not counted because $\gcd(105,105)=105$.'
          - problem: 'How many elements of $\mathbb{Z}_{90}$ are not units?'
            answer: '66'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ring has $90$ elements and the units are the $\varphi(90)$ classes coprime to $90$. Since $90=2\cdot3^2\cdot5$, we get $\varphi(90)=90\cdot\frac12\cdot\frac23\cdot\frac45=24$. So $90-24=66$ elements are not units, and this count includes $0$.'
        constraints: "n <= 100 with 2-3 prime factors; product formula expected"
      - id: kp2
        name: "Inverses via the extended Euclidean algorithm"
        key_prerequisites: [euclidean-algorithm]
        exemplars:
          - problem: 'Find the inverse of $7$ in $\mathbb{Z}_{26}$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Run the Euclidean algorithm: $26=3\cdot7+5$, $7=1\cdot5+2$, $5=2\cdot2+1$. Back-substituting gives $1=3\cdot26-11\cdot7$, so the inverse is $-11\equiv15$. Check: $7\cdot15=105=4\cdot26+1$.'
          - problem: 'Find the inverse of $4$ in $\mathbb{Z}_7$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $4s\equiv1\pmod7$. Since $4\cdot2=8=7+1$, the inverse is $2$.'
          - problem: 'Find the multiplicative inverse of $5$ in the ring $\mathbb{Z}_{12}$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euclid gives $12=2\cdot5+2$ and $5=2\cdot2+1$, so $1=5-2\cdot2=5\cdot5-2\cdot12$. The coefficient of $5$ is $5$, so the inverse is $5$. Check: $5\cdot5=25=2\cdot12+1$.'
          - problem: 'Find the least positive integer $a$ with $9a \equiv 1 \pmod{26}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euclid gives $26=2\cdot9+8$ and $9=8+1$, so $1=9-8=9-(26-2\cdot9)=3\cdot9-26$. The coefficient of $9$ is $3$. Check: $9\cdot3=27=26+1$.'
          - problem: 'Find the least positive solution of the congruence $10x \equiv 1 \pmod{27}$.'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euclid gives $27=2\cdot10+7$, $10=7+3$, $7=2\cdot3+1$. Back-substituting gives $1=3\cdot27-8\cdot10$, so $x\equiv-8\equiv19$. Check: $10\cdot19=190=7\cdot27+1$.'
          - problem: 'A number $a$ satisfies $23a \equiv 1 \pmod{40}$. Find $a$ in $\mathbb{Z}_{40}$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euclid gives $40=23+17$, $23=17+6$, $17=2\cdot6+5$, $6=5+1$. Back-substituting gives $1=7\cdot23-4\cdot40$, so $a=7$. Check: $23\cdot7=161=4\cdot40+1$.'
          - problem: 'An affine cipher on $26$ letters, numbered $0$ to $25$, encrypts the letter number $x$ as $y = 9x + 4 \pmod{26}$. A ciphertext letter has number $17$. Find the plaintext letter number $x$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $9x+4\equiv17$, so $9x\equiv13\pmod{26}$. The inverse of $9$ modulo $26$ is $3$, so $x\equiv3\cdot13=39\equiv13$. Check: $9\cdot13+4=121=4\cdot26+17$.'
          - problem: 'A dial has $35$ marks, numbered $0$ to $34$. Each turn of a crank moves the pointer $12$ marks forward. After how many turns does the pointer first stand at mark $1$, counting from mark $0$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $k$ turns the pointer is at $12k$ modulo $35$, so we need $12k\equiv1$. Euclid gives $35=2\cdot12+11$ and $12=11+1$, so $1=3\cdot12-35$. Hence $k=3$, and indeed $12\cdot3=36=35+1$.'
        constraints: "moduli <= 40; gcd(a, n) = 1 guaranteed; answer as least positive residue"
      - id: kp3
        name: "The unit group U(n) and Euler's theorem"
        key_prerequisites: [integral-domains-zero-divisors, euclidean-algorithm, fermat-euler-theorems]
        exemplars:
          - problem: 'Use Euler''s theorem to compute $3^8 \bmod 20$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\gcd(3,20)=1$ and $\varphi(20)=8$, Euler''s theorem gives $3^8\equiv1\pmod{20}$. So the remainder is $1$.'
          - problem: 'What is the order of $2$ in the unit group $U(9)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers of $2$ modulo $9$ are $2, 4, 8, 7, 5, 1$. The first power equal to $1$ is $2^6=64=7\cdot9+1$, so the order is $6$. This equals $|U(9)|=6$, so $2$ generates $U(9)$.'
          - problem: 'Compute $3^{22} \bmod 25$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\gcd(3,25)=1$ and $\varphi(25)=20$, we have $3^{20}\equiv1\pmod{25}$. Then $3^{22}=3^{20}\cdot3^2\equiv9$.'
          - problem: 'Use Euler''s theorem to find the inverse of $3$ in $\mathbb{Z}_{16}$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\varphi(16)=8$, we have $3^8\equiv1$, so $3^{-1}=3^7$. Now $3^2=9$, $3^4=81\equiv1$, hence $3^7=3^4\cdot3^2\cdot3\equiv9\cdot3=27\equiv11$. Check: $3\cdot11=33=2\cdot16+1$.'
          - problem: 'Find the order of $3$ in the unit group $U(10)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers of $3$ modulo $10$ are $3, 9, 7, 1$. The first power equal to $1$ is $3^4=81$, so the order is $4$. Since $|U(10)|=4$, the element $3$ generates $U(10)$.'
          - problem: 'Is the group $U(8)$ of units of $\mathbb{Z}_8$ cyclic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is cyclic", "cyclic", "it is a cyclic group"], ["no", "it is not cyclic", "not cyclic", "noncyclic", "non-cyclic", "non cyclic", "it is not a cyclic group", "not a cyclic group"]]}
            solution_sketch: 'The group $U(8)=\{1,3,5,7\}$ has $4$ elements, so it is cyclic only if some element has order $4$. But $3^2=9\equiv1$, $5^2=25\equiv1$ and $7^2=49\equiv1$, so every element has order at most $2$. So $U(8)$ is not cyclic.'
          - problem: 'A checksum raises a reading $a$ to the power $101$ and keeps the remainder after division by $35$. What is the checksum of $a = 3$?'
            answer: '33'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\gcd(3,35)=1$ and $\varphi(35)=4\cdot6=24$, we have $3^{24}\equiv1\pmod{35}$. Now $101=4\cdot24+5$, so $3^{101}\equiv3^5=243$. Then $243=6\cdot35+33$, so the checksum is $33$.'
          - problem: 'A register starts at $1$. At each tick its value is multiplied by $3$ and the remainder after division by $11$ is kept. After how many ticks does the register first show $1$ again?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The register shows $3^k$ modulo $11$, so we need the order of $3$ in $U(11)$. The values are $3, 9, 5, 4, 1$, and $3^5=243=22\cdot11+1$. So the register shows $1$ again after $5$ ticks.'
          - problem: 'What is the largest order of an element of $U(8)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elements of $U(8)$ are $1, 3, 5, 7$. The element $1$ has order $1$, and each of $3, 5, 7$ squares to $1$ modulo $8$, so it has order $2$. So the largest order is $2$.'
        constraints: "Euler reductions with n <= 40; cyclicity checks of U(n) for n <= 12"
    diagnostic_exemplar:
      problem: 'Compute $\varphi(15)$, then use Euler''s theorem in the form $a^{-1} = a^{\varphi(n)-1}$ to find the inverse of $7$ in $\mathbb{Z}_{15}$.'
      answer: '13'
      solution_sketch: '$\varphi(15) = \varphi(3)\varphi(5) = 2 \cdot 4 = 8$, so $7^{-1} = 7^{7} \bmod 15$. From $7^2 = 49 \equiv 4$ and $7^4 \equiv 4^2 = 16 \equiv 1$, we get $7^{7} = 7^{4} \cdot 7^{2} \cdot 7 \equiv 1 \cdot 4 \cdot 7 = 28 \equiv 13$. Check: $7 \cdot 13 = 91 = 6 \cdot 15 + 1$.'
    anki_seeds:
      - front: "$a$ is a unit of $\\mathbb{Z}_n$ iff..."
        back: "$\\gcd(a, n) = 1$; there are $\\varphi(n)$ units."
        type: basic
      - front: "Euler's theorem?"
        back: "If $\\gcd(a, n) = 1$ then $a^{\\varphi(n)} \\equiv 1 \\pmod n$."
        type: basic
      - front: "Tool for computing $a^{-1} \\bmod n$?"
        back: "Extended Euclidean algorithm: write $1 = ax + ny$; then $a^{-1} \\equiv x$."
        type: basic

  - id: ring-homomorphisms-ideals
    name: "Ring Homomorphisms and Ideals"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.8
        key: true
      - id: kernels-images
        weight: 0.7
        key: true
      # the principal-ideal exemplars invoke Bezout by name; inherited gcd gives
      # the gcd but not the representation ax + by = gcd.
      - id: euclidean-algorithm
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Ring homomorphisms and their kernels"
        key_prerequisites: [ring-axioms-examples, kernels-images]
        exemplars:
          - problem: 'Let $\varphi : \mathbb{Z} \to \mathbb{Z}_5$ send each integer to its remainder on division by $5$. Find $\varphi(14) + \varphi(3)$ in $\mathbb{Z}_5$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainders are $\varphi(14)=4$ and $\varphi(3)=3$, so the sum is $4+3=7\equiv2$ in $\mathbb{Z}_5$. This agrees with $\varphi(14+3)=\varphi(17)=2$, because $\varphi$ preserves addition.'
          - problem: 'Let $\varphi : \mathbb{Z}_6 \to \mathbb{Z}_6$ be given by $\varphi(x) = 2x$, with both operations read modulo $6$. Is $\varphi$ a ring homomorphism?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a ring homomorphism", "it is", "homomorphism", "it is a homomorphism", "a ring homomorphism"], ["no", "it is not a ring homomorphism", "it is not", "not a ring homomorphism", "not a homomorphism", "it is not a homomorphism", "not a ring hom", "it is not a ring hom"]]}
            solution_sketch: 'The map preserves addition, since $2(a+b)=2a+2b$. But $\varphi(1\cdot1)=\varphi(1)=2$, while $\varphi(1)\varphi(1)=2\cdot2=4$, and $2\neq4$ in $\mathbb{Z}_6$. So multiplication is not preserved and $\varphi$ is not a ring homomorphism.'
          - problem: 'Let $\varphi : \mathbb{Z}[x] \to \mathbb{Z}$ send a polynomial $p$ to $p(2)$. Find $\varphi(3x^2 - x + 1)$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x=2$: $3\cdot2^2-2+1=12-2+1=11$. So $\varphi(3x^2-x+1)=11$.'
          - problem: 'Let $\varphi : \mathbb{Z} \to \mathbb{Z}_{12}$ be reduction modulo $12$. What is the least positive integer in $\ker \varphi$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The kernel consists of the integers sent to $0$, that is, the integers with remainder $0$ on division by $12$. These are the multiples of $12$, so $\ker\varphi=12\mathbb{Z}$. The least positive one is $12$.'
          - problem: 'Sam claims that $\varphi : \mathbb{Z} \to \mathbb{Z}$ with $\varphi(x) = 2x$ is a ring homomorphism, because $\varphi(a+b) = 2a + 2b = \varphi(a) + \varphi(b)$. What is $\varphi(3 \cdot 4) - \varphi(3)\,\varphi(4)$?'
            answer: '-24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\varphi(3\cdot4)=\varphi(12)=24$ and $\varphi(3)\varphi(4)=6\cdot8=48$. The difference is $24-48=-24$, which is not $0$. So $\varphi$ preserves sums but not products, and Sam checked only addition.'
          - problem: 'Let $\varphi : \mathbb{Z}[x] \to \mathbb{Z}_5$ send a polynomial $p$ to $p(0) \bmod 5$. Find the least positive integer $c$ for which $x^2 + 3x + c$ lies in $\ker \varphi$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A polynomial is in $\ker\varphi$ when $p(0)\equiv0\pmod5$. Here $p(0)=c$, so $c$ must be a multiple of $5$. The least positive such $c$ is $5$.'
          - problem: 'A map $\varphi : \mathbb{Z} \to \mathbb{Z}_{12}$ gives the clock reading of an elapsed time in hours, that is, the remainder on division by $12$. Two shifts last $50$ hours and $70$ hours. What is $\varphi$ of the total time?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\varphi$ preserves sums, $\varphi(50+70)=\varphi(50)+\varphi(70)=2+10=12\equiv0$. Directly, $50+70=120=10\cdot12$, which has remainder $0$.'
          - problem: 'Two cost polynomials in the number $x$ of items are $f(x) = x^2 + 2$ and $g(x) = x - 1$. Find the value of the product polynomial $fg$ at $x = 3$.'
            answer: '22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Evaluation at $3$ preserves products, so $(fg)(3)=f(3)\,g(3)$. Here $f(3)=9+2=11$ and $g(3)=3-1=2$, so the value is $11\cdot2=22$.'
          - problem: 'Write the full proof that the map $\varphi : \mathbb{Z} \to \mathbb{Z}_7$ given by reduction modulo $7$ is a ring homomorphism with $\ker \varphi = 7\mathbb{Z}$.'
            answer: 'Reduction mod 7 is a hom with kernel 7Z'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Write $n=7q+a$ and $m=7p+b$ with $0\le a,b<7$, so $\varphi(n)=a$ and $\varphi(m)=b$. Then $n+m=7(q+p)+(a+b)$ and $nm=7(7qp+qb+pa)+ab$, so $\varphi(n+m)=a+b$ and $\varphi(nm)=ab$ modulo $7$, and $\varphi(1)=1$. The kernel is the set of $n$ with remainder $0$, that is, the multiples of $7$, so $\ker\varphi=7\mathbb{Z}$.'
        constraints: "verify both operations; evaluation and reduction maps; one failing example per set"
      - id: kp2
        name: "Ideals and the absorption property"
        key_prerequisites: [ring-axioms-examples]
        try_first:
          problem: 'Pick any even integer, and multiply it by any integer whatsoever, odd or even. Is the product always even?'
          answer_contract: {"kind": "label", "options": [["yes", "it is always even", "always even"], ["no", "it is not always even", "not always even"]]}
          answer: 'yes'
          reveal: 'Writing the even integer as $2k$, the product $r\cdot2k=2(rk)$ is even for every integer $r$. This absorbing behavior, a product with any ring element staying inside the set, is exactly what an ideal requires.'
        exemplars:
          - problem: 'Is $6\mathbb{Z}$ an ideal of $\mathbb{Z}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is an ideal", "it is", "an ideal", "it is an ideal of Z", "6Z is an ideal", "an ideal of Z"], ["no", "it is not an ideal", "it is not", "not an ideal", "it is not an ideal of Q", "Z is not an ideal of Q", "not an ideal of Q"]]}
            solution_sketch: 'The set $6\mathbb{Z}$ is a subring, and for any integer $r$ and any $6k$ in it, $r\cdot6k=6(rk)$ is again a multiple of $6$. So $6\mathbb{Z}$ absorbs multiplication by every element of $\mathbb{Z}$. Therefore $6\mathbb{Z}$ is an ideal of $\mathbb{Z}$.'
          - problem: 'Is $\mathbb{Z}$ an ideal of $\mathbb{Q}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an ideal", "it is", "an ideal", "it is an ideal of Z", "6Z is an ideal", "an ideal of Z"], ["no", "it is not an ideal", "it is not", "not an ideal", "it is not an ideal of Q", "Z is not an ideal of Q", "not an ideal of Q"]]}
            solution_sketch: 'The set $\mathbb{Z}$ is a subring of $\mathbb{Q}$, but it must also absorb multiplication by every rational number. Taking $r=\frac12$ and $z=1$ gives $rz=\frac12$, which is not an integer. So $\mathbb{Z}$ is not an ideal of $\mathbb{Q}$.'
          - problem: 'Take $r = \tfrac13$ in $\mathbb{Q}$. Find the least positive integer $z$ for which $rz$ is an integer.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $\frac13z$ is an integer exactly when $3$ divides $z$. So the least positive $z$ is $3$, and for $z=1$ and $z=2$ the product leaves $\mathbb{Z}$, which shows that $\mathbb{Z}$ does not absorb multiplication by $\frac13$.'
          - problem: 'In $\mathbb{Z}$ let $x = 36$ lie in the ideal $12\mathbb{Z}$, and let $r = 5$. Write $rx = 12q$ with $q \in \mathbb{Z}$. Find $q$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $rx=5\cdot36=180$. Since $180=12\cdot15$, we have $q=15$. Equivalently $36=12\cdot3$, so $rx=12\cdot(5\cdot3)=12\cdot15$.'
          - problem: 'Let $I$ be the ideal of $\mathbb{Z}[x]$ consisting of the polynomials with even constant term. Take $f(x) = x^2 + 3x + 4$ in $I$ and $g(x) = x + 1$ in $\mathbb{Z}[x]$. Find the constant term of $fg$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant term of a product is the product of the constant terms, so it is $4\cdot1=4$. This is even, so $fg$ stays in $I$, as absorption requires.'
          - problem: 'A bakery packs rolls in boxes of $12$, so every order is a multiple of $12$ rolls. A restaurant chain repeats an order of $48$ rolls $7$ times. How many boxes does it need in total?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total number of rolls is $7\cdot48=336$. Since each box holds $12$ rolls, the number of boxes is $336/12=28$. This is also $7\cdot4$, because $48=12\cdot4$, so the total is again a multiple of $12$.'
          - problem: 'A warehouse stocks parts only in lots of $15$. A shipment of $90$ parts goes to each of $8$ stores. How many lots of $15$ does the warehouse send out altogether?'
            answer: '48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The warehouse sends $8\cdot90=720$ parts in total. Dividing by the lot size, $720/15=48$ lots. The total is a multiple of $15$ because $90$ is, which is the absorption property of the ideal $15\mathbb{Z}$.'
          - problem: 'Sam claims that the constant polynomials form an ideal of $\mathbb{Z}[x]$, because a sum or product of constants is constant. Find the degree of the product of the constant $3$ with the polynomial $x$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $3\cdot x=3x$, which has degree $1$ and is not a constant. So multiplying a constant by an element of $\mathbb{Z}[x]$ can leave the set, and the constants are a subring but not an ideal.'
          - problem: 'Write the full proof that the set of polynomials in $\mathbb{Z}[x]$ with even constant term is an ideal of $\mathbb{Z}[x]$.'
            answer: 'Even constant terms form an ideal'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The constant term of a sum is the sum of the constant terms, and the constant term of a product is the product of the constant terms. So the set contains $0$ and is closed under sums and negatives. If $f$ has even constant term and $g$ is any polynomial, then $(fg)(0)=f(0)g(0)$ is an even number times an integer, hence even, so $fg$ lies in the set and the set is an ideal.'
        constraints: "subring vs ideal distinctions; absorption checks in Z, Q, Z[x]"
      - id: kp3
        name: "Principal and generated ideals"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'In $\mathbb{Z}$, the ideal generated by $4$ and $6$ equals $d\mathbb{Z}$ for one positive integer $d$. Find $d$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every element $4x+6y$ is even, and $2=6-4$ lies in the ideal. So the ideal is $2\mathbb{Z}$, that is, $d=\gcd(4,6)=2$.'
          - problem: 'Let $I$ be the ideal of $\mathbb{Z}$ generated by $10$ and $15$. Find the least positive element of $I$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By Bezout, $5=15-10$ lies in $I$, and every element $10x+15y$ is a multiple of $5$. So no positive element is smaller than $5$, and $I=5\mathbb{Z}$.'
          - problem: 'In $\mathbb{Z}$, consider the ideal $I = 14\mathbb{Z} + 21\mathbb{Z}$. Write $I = d\mathbb{Z}$ with $d$ positive. Find $d$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ideal $14\mathbb{Z}+21\mathbb{Z}$ is generated by $\gcd(14,21)=7$, since $7=21-14$. So $I=7\mathbb{Z}$ and $d=7$.'
          - problem: 'In $\mathbb{Z}$, the ideal generated by $18$, $30$ and $45$ equals $d\mathbb{Z}$ for one positive integer $d$. Find $d$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The generator is the gcd of all three numbers. First $\gcd(18,30)=6$, and then $\gcd(6,45)=3$. So the ideal is $3\mathbb{Z}$ and $d=3$.'
          - problem: 'Find the largest positive integer $b$ for which both $36$ and $60$ lie in the ideal $b\mathbb{Z}$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both numbers lie in $b\mathbb{Z}$ exactly when $b$ divides both of them. The largest such $b$ is $\gcd(36,60)=12$.'
          - problem: 'Does the ideal of $\mathbb{Z}$ generated by $6$ and $8$ contain $9$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it contains 9", "contains", "9 is in the ideal", "9 belongs to the ideal"], ["no", "it does not", "it does not contain 9", "not contained", "does not contain 9", "9 is not in the ideal", "9 is not an element of the ideal", "9 does not belong to the ideal"]]}
            solution_sketch: 'The ideal generated by $6$ and $8$ is $\gcd(6,8)\mathbb{Z}=2\mathbb{Z}$, since every combination $6x+8y$ is even. The number $9$ is odd, so it is not in the ideal.'
          - problem: 'A shop has only $6$-cent and $10$-cent coins, and it may pay change in either coin. What is the smallest positive amount, in cents, that a customer can pay exactly?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The amounts that can be paid are the combinations $6x+10y$ with integers $x$ and $y$, where negative numbers mean change. They form the ideal generated by $6$ and $10$, which is $2\mathbb{Z}$. So the smallest positive amount is $2$ cents, for example $2=2\cdot10-3\cdot6$.'
          - problem: 'A crane moves along a rail in steps of $28$ m forward or $42$ m backward, in any number of steps. What is the smallest positive distance from its start at which it can stop?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The reachable positions are the combinations $28x+42y$, which form the ideal generated by $28$ and $42$. This ideal is $\gcd(28,42)\mathbb{Z}=14\mathbb{Z}$, so the smallest positive position is $14$ m, for example $14=2\cdot28-1\cdot42$.'
          - problem: 'Sam says that the ideal of $\mathbb{Z}$ generated by $8$ and $12$ is $20\mathbb{Z}$, because $8 + 12 = 20$. For which positive integer $d$ is the ideal equal to $d\mathbb{Z}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ideal contains every combination $8x+12y$, not only the sum, and $12-8=4$ is in it. Since $8x+12y=4(2x+3y)$, the ideal is $4\mathbb{Z}$. So $d=\gcd(8,12)=4$, and $20$ is only one element of it.'
          - problem: 'To show that every element of the ideal $\langle 8, 12 \rangle$ of $\mathbb{Z}$ is a multiple of $4$, a proof needs one factoring line. Which equation holds for all integers $x$ and $y$: $8x + 12y = 4(2x + 3y)$, $8x + 12y = 4(2x + 3y) + 4$, $8x + 12y = 4(2x + 3y) - 4$, or $8x + 12y = 4(2x + 3y) + 8$?'
            answer: '8x + 12y = 4(2x + 3y)'
            answer_contract: {"kind": "label", "options": [["8x + 12y = 4(2x + 3y)", "8x+12y=4(2x+3y)", "8x + 12y = 4(2x+3y)", "8x+12y = 4(2x+3y)", "the first equation", "the first one", "first"], ["8x + 12y = 4(2x + 3y) + 4"], ["8x + 12y = 4(2x + 3y) - 4"], ["8x + 12y = 4(2x + 3y) + 8"]]}
            solution_sketch: 'Expanding the right side gives $4(2x+3y)=8x+12y$, so the first equation is an identity. Each of the other three equations adds the nonzero constant $4$, $-4$ or $8$ to the right side, so it fails for $x=y=0$. The true line shows that $8x+12y$ is $4$ times the integer $2x+3y$.'
          - problem: 'Write the full proof that every ideal of $\mathbb{Z}$ is principal.'
            answer: 'Every ideal of Z equals dZ for some d'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $I$ be an ideal. If $I=\{0\}$ then $I=0\mathbb{Z}$. Otherwise $I$ contains a least positive element $d$, and $d\mathbb{Z}\subseteq I$ because $I$ absorbs multiplication. For $a\in I$ the division algorithm gives $a=qd+r$ with $0\le r<d$, and $r=a-qd$ lies in $I$, so minimality of $d$ forces $r=0$ and $a\in d\mathbb{Z}$; hence $I=d\mathbb{Z}$.'
        constraints: "ideals of Z via gcd; the division-algorithm argument"
    diagnostic_exemplar:
      problem: 'Let $\varphi : \mathbb{Z}[x] \to \mathbb{Z}_3$ send $p$ to $p(0) \bmod 3$. Show that $\varphi$ is a ring homomorphism and identify $\ker \varphi$ as an ideal generated by two elements.'
      answer: '$\varphi$ is the composite of evaluation at $0$ (which preserves sums and products, since $(p+q)(0) = p(0)+q(0)$ and $(pq)(0) = p(0)q(0)$) with reduction mod $3$, itself a ring homomorphism; so $\varphi$ preserves $+$ and $\cdot$. Its kernel is $\{p : 3 \mid p(0)\}$. Writing $p(x) = p(0) + x\,q(x)$, any such $p$ is $3k + x q(x) \in \langle 3, x\rangle$; conversely every element of $\langle 3, x \rangle$ has constant term divisible by $3$. Hence $\ker \varphi = \langle 3, x \rangle$, an ideal by absorption.'
      solution_sketch: 'Composite of two ring homomorphisms. For the kernel, split $p$ into its constant term and a multiple of $x$, then prove both inclusions.'
    anki_seeds:
      - front: "Extra condition an ideal satisfies beyond being a subring?"
        back: "Absorption: $ra \\in I$ for every $r$ in the ring and $a \\in I$."
        type: basic
      - front: "Every ideal of $\\mathbb{Z}$ has the form..."
        back: "$n\\mathbb{Z}$ for some $n \\ge 0$ ($\\mathbb{Z}$ is a principal ideal ring)."
        type: basic
      - front: "Kernel of a ring homomorphism is always a(n)..."
        back: "Ideal of the domain."
        type: basic

  - id: quotient-rings
    name: "Quotient Rings"
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: ring-homomorphisms-ideals
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.7
        key: true
      - id: polynomial-rings
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The construction R/I"
        key_prerequisites: [ring-homomorphisms-ideals, quotient-groups]
        exemplars:
          - problem: 'In the quotient ring $\mathbb{Z}/6\mathbb{Z}$ the sum $(4 + 6\mathbb{Z}) + (5 + 6\mathbb{Z})$ is the coset $k + 6\mathbb{Z}$ for exactly one integer $k$ with $0 \le k < 6$. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cosets are added through their representatives, so the sum is $(4+5)+6\mathbb{Z}=9+6\mathbb{Z}$. Since $9=6+3$, this is the coset $3+6\mathbb{Z}$, so $k=3$.'
          - problem: 'In a quotient ring $R/I$ the product of cosets is defined by $(a + I)(b + I) = ab + I$. Which property of the ideal $I$ makes this product independent of the chosen representatives?'
            answer: 'absorption'
            answer_contract: {"kind": "label", "options": [["absorption", "absorbing", "the absorption property", "absorbs multiplication", "absorbs products", "absorption property", "absorbing property", "I absorbs multiplication by elements of R"], ["closure", "closed under addition", "being closed"], ["identity", "containing the identity", "contains 1"], ["commutativity", "commuting", "commutative"]]}
            solution_sketch: 'Replace $a$ by $a+i$ and $b$ by $b+j$ with $i,j\in I$. Then $(a+i)(b+j)=ab+aj+ib+ij$, and the extra terms lie in $I$ only because $I$ absorbs multiplication by elements of $R$. So the property is absorption.'
          - problem: 'Find the least positive integer $k$ for which $k + 12\mathbb{Z}$ is a zero divisor of $\mathbb{Z}/12\mathbb{Z}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coset $1+12\mathbb{Z}$ is the identity, so it is not a zero divisor. For $k=2$ we have $(2+12\mathbb{Z})(6+12\mathbb{Z})=12+12\mathbb{Z}=0+12\mathbb{Z}$ with $6+12\mathbb{Z}\neq0$. So the least $k$ is $2$.'
          - problem: 'In the quotient ring $\mathbb{Z}/10\mathbb{Z}$, the inverse of $7 + 10\mathbb{Z}$ is the coset $k + 10\mathbb{Z}$ with $0 < k < 10$. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $(7+10\mathbb{Z})(k+10\mathbb{Z})=1+10\mathbb{Z}$, that is, $7k\equiv1\pmod{10}$. Since $7\cdot3=21=2\cdot10+1$, we get $k=3$.'
          - problem: 'In the quotient ring $\mathbb{Z}/14\mathbb{Z}$, how many of the $14$ cosets are units?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A coset $k+14\mathbb{Z}$ is a unit exactly when $k$ is coprime to $14$. The residues are $1, 3, 5, 9, 11, 13$, so there are $\varphi(14)=14\cdot\frac12\cdot\frac67=6$ units.'
          - problem: 'Find the additive order of the coset $6 + 15\mathbb{Z}$ in $\mathbb{Z}/15\mathbb{Z}$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The order is the least positive $n$ with $6n\in15\mathbb{Z}$. Since $\gcd(6,15)=3$, this is $n=15/3=5$. Check: $6\cdot5=30=2\cdot15$.'
          - problem: 'Times of day are the cosets of $\mathbb{Z}/24\mathbb{Z}$. A train leaves at hour $22$ and the journey takes $9$ hours. The arrival time is the coset $k + 24\mathbb{Z}$ with $0 \le k < 24$. Find $k$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrival time is $(22+24\mathbb{Z})+(9+24\mathbb{Z})=31+24\mathbb{Z}$. Since $31=24+7$, the coset is $7+24\mathbb{Z}$, so $k=7$.'
          - problem: 'A dial has $16$ marks, so its positions are the cosets of $\mathbb{Z}/16\mathbb{Z}$. At every ring the pointer advances $6$ marks, starting from mark $0$. After how many rings does the pointer first stand at mark $0$ again?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ rings the pointer is at $6n+16\mathbb{Z}$, so we need $16$ to divide $6n$. Since $\gcd(6,16)=2$, the least positive $n$ is $16/2=8$. Check: $6\cdot8=48=3\cdot16$.'
        constraints: "construction-level reasoning; Z/nZ examples"
      - id: kp2
        name: "Computing in Z_p[x]/(f): small quotient rings"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        try_first:
          problem: 'Suppose a number $t$ satisfies $t^2 = -1$. What is $t^4$?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Replacing $t^2$ by $-1$ twice gives $t^4=(t^2)^2=(-1)^2=1$. A quotient ring uses its defining relation in just this way to shrink every power back to a low degree.'
        exemplars:
          - problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$, write $\alpha$ for the coset of $x$. Compute $\alpha^2$.'
            answer: 'alpha + 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In the quotient $x^2+x+1$ is zero, so $\alpha^2+\alpha+1=0$. Hence $\alpha^2=-\alpha-1=\alpha+1$, because $-1=1$ in $\mathbb{Z}_2$.'
          - problem: 'How many elements does the quotient ring $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every coset has a unique representative $a+bx$ of degree less than $2$ with $a,b\in\mathbb{Z}_2$. There are $2$ choices for each of $a$ and $b$, so the ring has $2^2=4$ elements.'
          - problem: 'How many elements does the quotient ring $\mathbb{Z}_3[x]/\langle x^2 + 1 \rangle$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every coset has a unique representative $a+bx$ with $a,b\in\mathbb{Z}_3$. There are $3$ choices for each coefficient, so the ring has $3^2=9$ elements.'
          - problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$, let $\alpha$ be the coset of $x$. Compute $\alpha^3$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $\alpha^2=\alpha+1$ we get $\alpha^3=\alpha\cdot\alpha^2=\alpha(\alpha+1)=\alpha^2+\alpha=(\alpha+1)+\alpha=2\alpha+1$. Since $2=0$ in $\mathbb{Z}_2$, this is $1$.'
          - problem: 'In $\mathbb{Z}_3[x]/\langle x^2 + 2 \rangle$, compute the product $x(x + 1)$ as a polynomial of degree less than $2$.'
            answer: 'x + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Since $x^2+2=0$, we have $x^2=-2=1$ in $\mathbb{Z}_3$. Then $x(x+1)=x^2+x=1+x$.'
          - problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$, compute $x^4$ as a polynomial of degree less than $2$.'
            answer: 'x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $x^2=x+1$ in $\mathbb{Z}_2$. Then $x^3=x\cdot x^2=x^2+x=(x+1)+x=1$, and $x^4=x\cdot x^3=x$.'
          - problem: 'A code uses the four symbols $0$, $1$, $\alpha$ and $\alpha + 1$ of the ring $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$, where $\alpha$ is the coset of $x$. An encoder multiplies the symbol $\alpha + 1$ by itself. Which symbol results?'
            answer: 'alpha'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expanding, $(\alpha+1)^2=\alpha^2+2\alpha+1=\alpha^2+1$, since $2=0$ in $\mathbb{Z}_2$. With $\alpha^2=\alpha+1$ this is $\alpha+2=\alpha$. So the encoder outputs the symbol $\alpha$.'
          - problem: 'A checksum treats a block of three bits as a polynomial $a_2x^2 + a_1x + a_0$ over $\mathbb{Z}_2$ and computes in $\mathbb{Z}_2[x]/\langle x^3 + x + 1 \rangle$. How many different blocks are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each coset has a unique representative of degree less than $3$, so the blocks correspond to the triples $(a_2,a_1,a_0)$ of bits. There are $2$ choices for each of $3$ coefficients, so $2^3=8$ blocks.'
        constraints: "Z_2 or Z_3 coefficients, quotient by degree-2 polynomials; count = p^deg"
      - id: kp3
        name: "Reduction computations in Z[x]/(f)"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, express the product $(1 + x)(2 + x)$ as a polynomial of degree less than $2$.'
            answer: '3x + 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding gives $2+3x+x^2$. Since $x^2+1=0$ in the quotient, $x^2=-1$, so the product is $2+3x-1=1+3x$.'
          - problem: 'In $\mathbb{Z}[x]/\langle x \rangle$, the coset of $(3 + 4x)(5 + x)$ equals the coset of one integer $n$. Find $n$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In this quotient $x=0$, so the evaluation map at $0$ identifies the ring with $\mathbb{Z}$. Then $(3+4x)(5+x)$ becomes $3\cdot5=15$. So $n=15$.'
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, express $(3 + 2x)(4 - x)$ as a polynomial of degree less than $2$.'
            answer: '5x + 14'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding gives $12-3x+8x-2x^2=12+5x-2x^2$. Since $x^2=-1$, the last term is $+2$, so the result is $14+5x$.'
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, express $(1 + x)^3$ as a polynomial of degree less than $2$.'
            answer: '2x - 2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding gives $1+3x+3x^2+x^3$. With $x^2=-1$ and $x^3=x\cdot x^2=-x$, this becomes $1+3x-3-x=-2+2x$.'
          - problem: 'In $\mathbb{Z}[x]/\langle x - 3 \rangle$, the coset of $(x^2 + 1)(x + 2)$ equals the coset of one integer $n$. Find $n$.'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In this quotient $x=3$, so the evaluation map at $3$ identifies the ring with $\mathbb{Z}$. Then $(x^2+1)(x+2)$ becomes $(9+1)(3+2)=10\cdot5=50$.'
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 2 \rangle$, express $(3 + x)(2 + x)$ as a polynomial of degree less than $2$.'
            answer: '5x + 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding gives $6+5x+x^2$. Since $x^2+2=0$, we have $x^2=-2$, so the result is $6+5x-2=4+5x$.'
          - problem: 'In a graphics routine the point $(a, b)$ of the plane is stored as the element $a + bx$ of $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, and a rotation by $90$ degrees multiplies by $x$. Which element represents the rotated image of the point $(3, 4)$?'
            answer: '3x - 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The point $(3,4)$ is the element $3+4x$. Multiplying by $x$ gives $3x+4x^2$, and $x^2=-1$ turns this into $3x-4$, which is the point $(-4,3)$.'
          - problem: 'In the same graphics routine, a point stored as $2 + 3x$ is scaled and rotated by multiplying it by $1 + x$. Which element represents the result?'
            answer: '5x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Expanding $(2+3x)(1+x)$ gives $2+5x+3x^2$. Since $x^2=-1$, the last term is $-3$, so the result is $-1+5x$, the point $(-1,5)$.'
        constraints: "reduce products/powers modulo x^2 + c; identify quotients via evaluation maps"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ with $\alpha$ the coset of $x$, compute $(\alpha + 1)^2$ in reduced form.'
      answer: '$\alpha$'
      solution_sketch: '$(\alpha+1)^2 = \alpha^2 + 1$ (char $2$) $= (\alpha + 1) + 1 = \alpha$.'
    anki_seeds:
      - front: "Number of elements of $\\mathbb{Z}_p[x]/\\langle f \\rangle$, $\\deg f = d$?"
        back: "$p^d$ — one coset per remainder of degree $< d$."
        type: basic
      - front: "Why must $I$ be an ideal for $R/I$ to be a ring?"
        back: "Absorption makes coset multiplication well defined: representative changes shift $ab$ by elements of $I$."
        type: basic

