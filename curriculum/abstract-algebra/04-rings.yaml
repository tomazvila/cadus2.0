unit: rings
course: abstract-algebra
module: "Rings"
topics:
  - id: ring-axioms-examples
    name: "Ring Axioms and Examples"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: elementary-group-properties
        weight: 0.7
        key: true
      - id: modular-arithmetic
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.3
        key: false
      # Phase C: the ring axioms cite "abelian group under +" as a definition; the
      # concept is taught in proofs/abelian-groups.
      - id: abelian-groups
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The axioms; rings vs non-rings"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: 'List the ring axioms: what structure do $(R, +)$ and $(R, \cdot)$ carry, and what links them?'
            answer: '$(R,+)$ is an abelian group, multiplication is associative, and the two distributive laws $a(b+c) = ab+ac$, $(a+b)c = ac+bc$ hold.'
            answer_contract: {kind: none}
            solution_sketch: 'Commutative multiplication and unity are extra properties, not part of the bare definition.'
          - problem: 'Is the set of odd integers a ring under the usual operations?'
            answer: 'No: it is not closed under addition ($1 + 1 = 2$ is even), so $(R,+)$ is not a group.'
            answer_contract: {kind: none}
            solution_sketch: 'Check additive closure first.'
        constraints: "verify/refute ring structure for subsets of Z, Q, Z_n; identify which axiom fails"
      - id: kp2
        name: "The standard examples: Z, Z_n, 2Z, Z[x], Z[sqrt(2)]"
        key_prerequisites: [modular-arithmetic]
        exemplars:
          - problem: 'In $\mathbb{Z}[\sqrt{2}] = \{a + b\sqrt{2} : a, b \in \mathbb{Z}\}$, compute $(1 + 2\sqrt{2})(3 - \sqrt{2})$.'
            answer: '$-1 + 5\sqrt{2}$'
            solution_sketch: 'Expand: $3 - \sqrt2 + 6\sqrt2 - 2\cdot 2 = (3 - 4) + 5\sqrt2$.'
          - problem: "The set $2\\mathbb{Z} = \\{\\dots, -4, -2, 0, 2, 4, \\dots\\}$ is a ring under ordinary addition and multiplication of integers. Which statement about a multiplicative identity of $2\\mathbb{Z}$ is correct?"
            answer: "no unity"
            answer_contract: {"kind": "label", "options": [["no unity"], ["unity 1"], ["unity 2"], ["unity -2"]]}
            solution_sketch: "An identity $u$ must lie in $2\\mathbb{Z}$ and satisfy $u \\cdot 4 = 4$, which forces $u = 1$. But $1$ is odd, so $1$ is not an element of $2\\mathbb{Z}$. The option 'unity 1' forgets that the identity must belong to the ring; 'unity 2' mistakes the generator for an identity since $2 \\cdot 4 = 8 \\neq 4$; 'unity -2' fails since $-2 \\cdot 4 = -8 \\neq 4$. Therefore the ring $2\\mathbb{Z}$ has no unity."
          - problem: "Work in the ring $\\mathbb{Z}_{12} = \\{0, 1, \\dots, 11\\}$ with addition and multiplication modulo 12. Compute $(7 + 8)(5 + 4)$ in $\\mathbb{Z}_{12}$ and give the least nonnegative representative."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduce each factor modulo 12 first: $7 + 8 = 15 = 3$ and $5 + 4 = 9$ in $\\mathbb{Z}_{12}$. Multiply: $3 \\cdot 9 = 27 = 24 + 3$, so the representative is $3$. Equivalently, $15 \\cdot 9 = 135$ and $135 \\bmod 12 = 3$. The product in $\\mathbb{Z}_{12}$ is 3."
          - problem: "In the ring $\\mathbb{Z}[\\sqrt{2}] = \\{a + b\\sqrt{2} : a, b \\in \\mathbb{Z}\\}$, compute $(2 + 3\\sqrt{2})(4 - \\sqrt{2})$. Give the result in the form $a + b\\sqrt{2}$."
            answer: "2 + 10sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand by the distributive law: $2 \\cdot 4 = 8$, $2 \\cdot (-\\sqrt{2}) = -2\\sqrt{2}$, $3\\sqrt{2} \\cdot 4 = 12\\sqrt{2}$, and $3\\sqrt{2} \\cdot (-\\sqrt{2}) = -3 \\cdot 2 = -6$. Collect the rational parts $8 - 6 = 2$ and the radical parts $-2 + 12 = 10\\sqrt{2}$. The product is 2 + 10sqrt(2)."
          - problem: "The set $\\mathbb{Z}[x]$ of polynomials with integer coefficients is a ring under ordinary addition and multiplication of polynomials. Compute the product $(x + 2)(x + 3)$ in $\\mathbb{Z}[x]$ and give the expanded polynomial in $x$."
            answer: "x^2 + 5x + 6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the distributive law twice: $x \\cdot x = x^2$, $x \\cdot 3 = 3x$, $2 \\cdot x = 2x$, and $2 \\cdot 3 = 6$. Collect like terms: $3x + 2x = 5x$. The expanded product in the polynomial ring is x^2 + 5x + 6."
          - problem: "In the ring $\\mathbb{Z}[\\sqrt{2}]$, find integers $c$ and $d$ with $(1 + \\sqrt{2})(c + d\\sqrt{2}) = 1$. Give the answer as (c, d)."
            answer: "(-1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Expand the left side with the distributive law and $\\sqrt{2} \\cdot \\sqrt{2} = 2$: $(1 + \\sqrt{2})(c + d\\sqrt{2}) = (c + 2d) + (c + d)\\sqrt{2}$. Equate coefficients with $1 + 0\\sqrt{2}$: $c + 2d = 1$ and $c + d = 0$. Subtracting the second equation from the first gives $d = 1$, and then $c = -1$. The answer is (-1, 1)."
        constraints: "arithmetic in Z_n, 2Z, Z[sqrt(2)]; note which have unity and which are commutative"
      - id: kp3
        name: "Basic consequences: 0-multiplication, negatives"
        key_prerequisites: [elementary-group-properties, distributive-property]
        exemplars:
          - problem: "In the ring $\\mathbb{Z}_{12}$, use the identity $(-a)\\cdot b = -(a\\cdot b)$ to compute $(-5)\\cdot 8$ as the least nonnegative residue. What is $(-5)\\cdot 8$ in $\\mathbb{Z}_{12}$?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute $5\\cdot 8 = 40$ and reduce: $40 \\equiv 4$ in $\\mathbb{Z}_{12}$. The negative rule $(-a)b = -(ab)$ gives $(-5)\\cdot 8 = -(40) \\equiv -4$. Adding the modulus, $-4 + 12 = 8$. The answer is 8."
          - problem: "In the ring $\\mathbb{Z}_{9}$, use $a\\cdot 0 = 0$ and the distributive property to simplify $6\\cdot 0 + 6\\cdot 4$ to its least nonnegative residue. What is $6\\cdot 0 + 6\\cdot 4$ in $\\mathbb{Z}_{9}$?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero product rule $a\\cdot 0 = 0$ gives $6\\cdot 0 = 0$. The distributive property then combines the terms: $6\\cdot 0 + 6\\cdot 4 = 6(0 + 4) = 24$, and $24 \\equiv 6$ in $\\mathbb{Z}_{9}$. The answer is 6."
          - problem: "In $\\mathbb{Z}_{11}$ suppose $a\\cdot b = 4$. Use the identity $(-a)\\cdot b = -(a\\cdot b)$ to find $(-a)\\cdot b$ as the least nonnegative residue. Find $(-a)\\cdot b$ in $\\mathbb{Z}_{11}$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The negative rule gives $(-a)\\cdot b = -(a\\cdot b) = -4$. The least nonnegative residue of $-4$ in $\\mathbb{Z}_{11}$ is $-4 + 11 = 7$. The answer is 7."
          - problem: "In $\\mathbb{Z}_{7}$, use the two-line consequence $(-a)(-b) = -(a(-b)) = a\\cdot b$ to compute $(-3)(-4)$ as the least nonnegative residue. What is $(-3)(-4)$ in $\\mathbb{Z}_{7}$?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the negative rule twice: $(-3)(-4) = -(3\\cdot(-4)) = -(-(3\\cdot 4))$, so the value equals $3\\cdot 4$. Then $3\\cdot 4 = 12 \\equiv 5$ in $\\mathbb{Z}_{7}$. The answer is 5."
          - problem: "In $\\mathbb{Z}_{10}$ with $a = 4$ and $b = 7$, check the identity $a\\cdot(-b) = -(a\\cdot b)$ by computing each side as its least nonnegative residue. Give both residues as (left side, right side)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Left side: $4\\cdot(-7) = -(4\\cdot 7) = -(28)$ by $a(-b) = -(ab)$; since $28 \\equiv 8$ in $\\mathbb{Z}_{10}$, this is $-8 \\equiv 2$. Right side: $4\\cdot 7 = 28 \\equiv 8$, so $-(4\\cdot 7) \\equiv 2$. Both sides agree, giving the pair (2, 2). The answer is (2, 2)."
          - problem: "The proof that $(-a)\\cdot b = -(a\\cdot b)$ contains the line $a\\cdot b + (-a)\\cdot b = (a + (-a))\\cdot b$. Which axiom of a ring justifies this line?"
            answer: "distributive property"
            answer_contract: {"kind": "label", "options": [["distributive property"], ["associativity of multiplication"], ["commutativity of addition"], ["existence of additive inverses"]]}
            solution_sketch: "Factoring $b$ out of $a\\cdot b + (-a)\\cdot b$ is the distributive property read right to left. The option 'associativity of multiplication' is wrong because no factors are regrouped in this step. The option 'commutativity of addition' is wrong because the two terms are not swapped here. The option 'existence of additive inverses' is wrong because inverses are used only in the next step, where $a + (-a) = 0$. The axiom is the distributive property."
        constraints: "two-line consequences of distributivity; cite each axiom used"
    diagnostic_exemplar:
      problem: 'Prove that $(-a)b = -(ab)$ in any ring $R$, naming the axioms you use, and illustrate the identity in $\mathbb{Z}_{10}$ with $a = 3$, $b = 7$.'
      answer: 'By distributivity, $ab + (-a)b = (a + (-a))b = 0 \cdot b$, and $0 \cdot b = 0$ (from $0b = (0+0)b = 0b + 0b$ and cancellation in the abelian group $(R,+)$). So $(-a)b$ is an additive inverse of $ab$, and additive inverses are unique, hence $(-a)b = -(ab)$. In $\mathbb{Z}_{10}$: $-3 = 7$, so $(-3) \cdot 7 = 49 \equiv 9$, while $3 \cdot 7 = 21 \equiv 1$ and $-1 = 9$ — both sides equal $9$.'
      answer_contract: {kind: none}
      solution_sketch: 'Use distributivity to show $ab + (-a)b = 0$, together with $0 \cdot b = 0$ and uniqueness of additive inverses; then check both sides numerically mod $10$.'
    anki_seeds:
      - front: "Ring axioms in one line?"
        back: "Abelian group under $+$, associative multiplication, and both distributive laws."
        type: basic
      - front: "Standard example of a ring without unity?"
        back: "$2\\mathbb{Z}$, the even integers."
        type: basic
      - front: "In any ring, $a \\cdot 0 = $ ?"
        back: "$0$ (proved from distributivity over $0 = 0 + 0$)."
        type: basic

  - id: integral-domains-zero-divisors
    name: "Integral Domains and Zero Divisors"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.9
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding zero divisors and units in Z_n"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'List the zero divisors of $\mathbb{Z}_6$.'
            answer: '$2, 3, 4$'
            solution_sketch: '$2\cdot3 = 0$, $3\cdot4 = 12 = 0$; the elements sharing a factor with $6$ are the zero divisors.'
          - problem: 'List the units of $\mathbb{Z}_6$.'
            answer: '$1, 5$'
            solution_sketch: 'Units are the residues coprime to $6$; every nonzero element of $\mathbb{Z}_n$ is a unit or a zero divisor.'
          - problem: "In $\\mathbb{Z}_{10}$, a nonzero element $a$ is a zero divisor exactly when $\\gcd(a,10) > 1$. Find all zero divisors of $\\mathbb{Z}_{10}$ and give the answer as a set."
            answer: "{2, 4, 5, 6, 8}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (zero-divisor criterion): a nonzero residue a in Z_10 is a zero divisor exactly when gcd(a,10) > 1. Step 2 (test residues): checking a = 1 to 9, the numbers sharing a factor with 10 are 2, 4, 5, 6, 8. For example, 2*5 = 10 = 0 and 4*5 = 20 = 0 in Z_10. Step 3 (collect): the zero divisors of Z_10 are {2, 4, 5, 6, 8}."
          - problem: "In $\\mathbb{Z}_9$, an element $a$ is a unit exactly when $\\gcd(a, 9) = 1$, so every nonzero element is a unit or a zero divisor. Find all units of $\\mathbb{Z}_9$ and give the answer as a set."
            answer: "{1, 2, 4, 5, 7, 8}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (unit criterion): a residue $a$ of $\\mathbb{Z}_9$ is a unit exactly when $\\gcd(a, 9) = 1$. Step 2 (test residues): checking $a = 1$ to $8$, the values coprime to 9 are 1, 2, 4, 5, 7, 8; for instance $2 \\cdot 5 = 10 = 1$ in $\\mathbb{Z}_9$, confirming 2 and 5 are units. Step 3 (collect): the excluded residues 3 and 6 have $\\gcd > 1$ with 9. The units of $\\mathbb{Z}_9$ are {1, 2, 4, 5, 7, 8}."
          - problem: "In $\\mathbb{Z}_{18}$, a nonzero element $a$ is a zero divisor exactly when $\\gcd(a, 18) > 1$, and every nonzero element is a unit or a zero divisor. How many zero divisors does $\\mathbb{Z}_{18}$ have?"
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (criterion): count the nonzero residues of $\\mathbb{Z}_{18}$ that share a factor with 18, since a nonzero $a$ is a zero divisor iff $\\gcd(a, 18) > 1$. Step 2 (list): these are 2, 3, 4, 6, 8, 9, 10, 12, 14, 15, 16, and each pair such as $2 \\cdot 9 = 18 = 0$ confirms the criterion. Step 3 (count): the list has 11 elements. $\\mathbb{Z}_{18}$ has 11 zero divisors."
          - problem: "Work in $\\mathbb{Z}_{20}$, where a nonzero element $b$ is a zero divisor exactly when $\\gcd(b, 20) > 1$. How many nonzero elements $b$ of $\\mathbb{Z}_{20}$ satisfy $5 \\cdot b = 0$ in $\\mathbb{Z}_{20}$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (translate the equation): $5 \\cdot b = 0$ in $\\mathbb{Z}_{20}$ means 20 divides $5b$, which holds exactly when 4 divides $b$. Step 2 (list the residues): the nonzero such residues are 4, 8, 12, 16, and each indeed has $\\gcd(b, 20) > 1$, matching the zero-divisor criterion. Step 3 (count): there are 4 elements. The equation $5 \\cdot b = 0$ has 4 nonzero solutions in $\\mathbb{Z}_{20}$."
        constraints: "Z_n for n <= 20; zero divisor iff gcd(a, n) > 1 (a nonzero)"
      - id: kp2
        name: "Integral domains and cancellation"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'For which $n > 1$ is $\mathbb{Z}_n$ an integral domain?'
            answer: 'Exactly the primes.'
            answer_contract: {kind: none}
            solution_sketch: 'Composite $n = ab$ gives zero divisors $a, b$; prime $p$ has none since $p \mid ab \implies p \mid a$ or $p \mid b$.'
          - problem: 'Prove that cancellation holds in an integral domain: $ab = ac, a \neq 0 \implies b = c$.'
            answer: '$a(b - c) = 0$ and $a \neq 0$ force $b - c = 0$.'
            answer_contract: {kind: none}
            solution_sketch: 'Factor and use the no-zero-divisors property.'
        constraints: "domain verdicts for Z_n, Z, Z[x], products like Z x Z; cancellation proofs"
      - id: kp3
        name: "Solving equations in the presence of zero divisors"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: "In Z_6, solve the equation 2x = 0. Give the answer as a list of residues in increasing order."
            answer: "0, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the modular multiplication rule in Z_6, 2x = 0 means 6 divides 2x. This happens exactly when x is a multiple of 3, so the residues 0 and 3 work. The solution list is 0, 3."
          - problem: 'Find all idempotents of $\mathbb{Z}_6$ (elements with $x^2 = x$).'
            answer: '$0, 1, 3, 4$'
            solution_sketch: 'Test all six: $3^2 = 9 = 3$, $4^2 = 16 = 4$; the others fail.'
          - problem: "In Z_10, solve x^2 = x. Give the answer as a list of residues in increasing order."
            answer: "0, 1, 5, 6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the zero-divisor test in Z_10, rewrite x^2 = x as x(x - 1) = 0 mod 10. Checking residues shows 0 and 1 are trivial, while 5^2 = 25 = 5 and 6^2 = 36 = 6 also satisfy the equation. The solution list is 0, 1, 5, 6."
          - problem: "In Z_8, solve x^2 = 1. Give the answer as a list of residues in increasing order."
            answer: "1, 3, 5, 7"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the modular square rule in Z_8, compute x^2 for each residue. The odd residues give 1^2 = 1, 3^2 = 9 = 1, 5^2 = 25 = 1, and 7^2 = 49 = 1; every even residue fails. The solution list is 1, 3, 5, 7."
          - problem: "In Z_12, solve 4x = 0. Give the answer as a list of residues in increasing order."
            answer: "0, 3, 6, 9"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the modular multiplication rule in Z_12, 4x = 0 means 12 divides 4x. Dividing the common factor 4 gives 3 divides x, so the residues 0, 3, 6, and 9 are exactly the solutions. The solution list is 0, 3, 6, 9."
          - problem: "In Z_12, solve x^2 = 1. Give the answer as a list of residues in increasing order."
            answer: "1, 5, 7, 11"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the modular square rule in Z_12, compute x^2 for each residue. The residues 1, 5, 7, and 11 give 1^2 = 1, 5^2 = 25 = 1, 7^2 = 49 = 1, and 11^2 = 121 = 1; every other residue fails. The solution list is 1, 5, 7, 11."
        constraints: "equations x^2 = x, ax = 0, x^2 = 1 in Z_n, n <= 12; expect multiple roots"
    diagnostic_exemplar:
      problem: 'Find all solutions of $x^2 = x$ in $\mathbb{Z}_{12}$, and use one of them to decide whether $\mathbb{Z}_{12}$ is an integral domain.'
      answer: '$x^2 = x$ means $x(x-1) \equiv 0 \pmod{12}$; checking the residues gives $x = 0, 1, 4, 9$ (indeed $4^2 = 16 \equiv 4$ and $9^2 = 81 \equiv 9$). The solution $x = 4$ exhibits zero divisors: $4 \cdot 3 = 12 \equiv 0$ with $4 \ne 0$ and $3 \ne 0$. So $\mathbb{Z}_{12}$ is not an integral domain.'
      answer_contract: {kind: none}
      solution_sketch: 'Solve $x(x-1) \equiv 0 \pmod{12}$ over the residues; the nontrivial idempotents $4$ and $9$ exist precisely because $12$ splits into coprime factors, and each one hands you a zero divisor.'
    anki_seeds:
      - front: "$\\mathbb{Z}_n$ is an integral domain iff..."
        back: "$n$ is prime."
        type: basic
      - front: "In $\\mathbb{Z}_n$, every nonzero element is either a ______ or a ______."
        back: "Unit (if coprime to $n$) or zero divisor (if not)."
        type: basic

  - id: units-in-modular-rings
    name: "Units, Euler's Phi, and Modular Inverses"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: euclidean-algorithm
        weight: 0.8
        key: true
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: fermat-euler-theorems
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Counting units: Euler's phi function"
        key_prerequisites: [integral-domains-zero-divisors, prime-factorization]
        exemplars:
          - problem: 'Compute $\varphi(20)$, the number of units of $\mathbb{Z}_{20}$.'
            answer: "8"
            solution_sketch: '$\varphi(20) = \varphi(4)\varphi(5) = 2 \cdot 4 = 8$.'
          - problem: 'Compute $\varphi(36)$.'
            answer: "12"
            solution_sketch: '$\varphi(36) = 36(1 - 1/2)(1 - 1/3) = 36 \cdot \tfrac12 \cdot \tfrac23 = 12$.'
          - problem: "Compute phi(60), the number of units of the ring of integers modulo 60."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is phi(60), the count of units modulo 60. Step 1: factor 60 as 2^2 * 3 * 5. Step 2: apply Euler's product formula, phi(60) = 60(1 - 1/2)(1 - 1/3)(1 - 1/5). This simplifies to 60 * 1/2 * 2/3 * 4/5, which equals 16."
          - problem: "Find the number of units of the ring of integers modulo 72."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is phi(72), the number of units modulo 72. Factor 72 as 2^3 * 3^2. Euler's product formula gives phi(72) = 72(1 - 1/2)(1 - 1/3) = 72 * 1/2 * 2/3. This equals 24."
          - problem: "A small RSA modulus is 77 = 7 * 11. Find the number of invertible residue classes modulo 77."
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is phi(77), because invertible residue classes are the units. Factor 77 as 7 * 11. Since 7 and 11 are coprime, the product formula gives phi(77) = phi(7) * phi(11) = 6 * 10. This equals 60."
          - problem: "How many residue classes modulo 50 are units?"
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is phi(50), the number of unit residue classes modulo 50. Factor 50 as 2 * 5^2. Euler's product formula gives phi(50) = 50(1 - 1/2)(1 - 1/5) = 50 * 1/2 * 4/5. This equals 20."
        constraints: "n <= 100 with 2-3 prime factors; product formula expected"
      - id: kp2
        name: "Inverses via the extended Euclidean algorithm"
        key_prerequisites: [euclidean-algorithm]
        exemplars:
          - problem: 'Find the inverse of $7$ in $\mathbb{Z}_{26}$.'
            answer: "15"
            solution_sketch: 'Extended Euclid on $(26, 7)$: $26 = 3\cdot7 + 5$, $7 = 5 + 2$, $5 = 2\cdot2 + 1$; back-substitute to get $1 = 15\cdot7 - 4\cdot26$, so $7^{-1} \equiv 15$.'
          - problem: 'Find the inverse of $4$ in $\mathbb{Z}_7$.'
            answer: "2"
            solution_sketch: '$4 \cdot 2 = 8 \equiv 1 \pmod 7$.'
          - problem: "In the ring Z_12, find the multiplicative inverse of 5. Give the least positive residue."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inverse of 5 modulo 12 is the number b with 5b = 1 mod 12. Apply the extended Euclidean algorithm to 12 and 5: 12 = 2*5 + 2 and 5 = 2*2 + 1. Back-substitution gives 1 = 5 - 2*2 = 5 - 2*(12 - 2*5) = 5*5 - 2*12. Thus the coefficient of 5 is 5, so the least positive inverse is 5."
          - problem: "Compute the inverse of 9 modulo 26. Give the least positive residue."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inverse of 9 modulo 26 is the number b with 9b = 1 mod 26. Apply the extended Euclidean algorithm to 26 and 9: 26 = 2*9 + 8 and 9 = 1*8 + 1. Back-substitution gives 1 = 9 - 8 = 9 - (26 - 2*9) = 3*9 - 26. Thus the coefficient of 9 is 3, so the least positive inverse is 3."
          - problem: "Solve the congruence 10x = 1 (mod 27). Give the least positive value of x."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence 10x = 1 mod 27 asks for the inverse of 10 modulo 27. Apply the extended Euclidean algorithm to 27 and 10: 27 = 2*10 + 7, 10 = 1*7 + 3, and 7 = 2*3 + 1. Back-substitution gives 1 = 7 - 2*3 = 3*7 - 2*10 = 3*(27 - 2*10) - 2*10 = 3*27 - 8*10. The coefficient -8 gives 10*(-8) = 1 mod 27, so the least positive value is 27 - 8 = 19."
          - problem: "A number a satisfies 23a = 1 (mod 40). Find the least positive a."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation 23a = 1 mod 40 asks for the inverse of 23 modulo 40. Apply the extended Euclidean algorithm to 40 and 23: 40 = 1*23 + 17, 23 = 1*17 + 6, 17 = 2*6 + 5, and 6 = 1*5 + 1. Back-substitution gives 1 = 6 - 5 = 3*6 - 17 = 3*23 - 4*17 = 7*23 - 4*40. The coefficient 7 gives 23*7 = 1 mod 40, so the least positive a is 7."
        constraints: "moduli <= 40; gcd(a, n) = 1 guaranteed; answer as least positive residue"
      - id: kp3
        name: "The unit group U(n) and Euler's theorem"
        key_prerequisites: [integral-domains-zero-divisors, euclidean-algorithm, fermat-euler-theorems]
        exemplars:
          - problem: 'Use Euler''s theorem to compute $3^8 \bmod 20$.'
            answer: "1"
            solution_sketch: '$\varphi(20) = 8$ and $\gcd(3,20) = 1$, so $3^{\varphi(20)} \equiv 1$.'
          - problem: 'The group $U(9)$ is cyclic. Name a generator.'
            answer: "2"
            solution_sketch: '$|U(9)| = \varphi(9) = 6$, and the powers of $2$ mod $9$ are $2, 4, 8, 7, 5, 1$ — order $6$, so $2$ generates.'
          - problem: "Euler's theorem says that a^phi(n) = 1 mod n when gcd(a,n)=1. Use it to compute 3^22 mod 25."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's theorem: gcd(3,25)=1 and phi(25)=20, so 3^20 = 1 mod 25. Reduce the exponent: 22 = 20 + 2, so 3^22 = 3^2 mod 25. Compute 3^2 = 9, so the residue is 9. The answer is 9."
          - problem: "Euler's theorem in the form a^(phi(n)-1) gives the inverse of a modulo n when gcd(a,n)=1. Find the inverse of 3 in Z_16."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's theorem in inverse form: phi(16)=8 and gcd(3,16)=1, so 3^7 is the inverse of 3 modulo 16. Compute 3^2=9 and 3^4=9^2=81=1 mod 16, so 3^7=3^4*3^2*3=1*9*3=27=11 mod 16. The inverse is 11."
          - problem: "The group U(10) has four elements. Find a generator of U(10)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The unit group U(10) is {1,3,7,9}, with phi(10)=4 elements. Compute the powers of 3: 3^1=3, 3^2=9, 3^3=27=7, and 3^4=81=1 modulo 10. These four powers are all the elements, so 3 has order 4 and generates U(10). The answer is 3."
          - problem: "The group U(8) has four elements. State whether U(8) is generated by one element, and give the order of 3 in U(8)."
            answer: "verdict = noncyclic; order = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cyclic"], ["noncyclic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "order"}]}
            solution_sketch: "The unit group U(8) is {1,3,5,7}, and every nonidentity element squares to 1 modulo 8. In particular 3^2=9=1 modulo 8, so 3 has order 2. The option cyclic is wrong because no element of U(8) has order 4, so no single element generates the group. The answer is verdict = noncyclic; order = 2."
        constraints: "Euler reductions with n <= 40; cyclicity checks of U(n) for n <= 12"
    diagnostic_exemplar:
      problem: 'Compute $\varphi(15)$, then use Euler''s theorem in the form $a^{-1} = a^{\varphi(n)-1}$ to find the inverse of $7$ in $\mathbb{Z}_{15}$.'
      answer: '13'
      solution_sketch: '$\varphi(15) = \varphi(3)\varphi(5) = 2 \cdot 4 = 8$, so $7^{-1} = 7^{7} \bmod 15$. From $7^2 = 49 \equiv 4$ and $7^4 \equiv 4^2 = 16 \equiv 1$, we get $7^{7} = 7^{4} \cdot 7^{2} \cdot 7 \equiv 1 \cdot 4 \cdot 7 = 28 \equiv 13$. Check: $7 \cdot 13 = 91 = 6 \cdot 15 + 1$.'
    anki_seeds:
      - front: "$a$ is a unit of $\\mathbb{Z}_n$ iff..."
        back: "$\\gcd(a, n) = 1$; there are $\\varphi(n)$ units."
        type: basic
      - front: "Euler's theorem?"
        back: "If $\\gcd(a, n) = 1$ then $a^{\\varphi(n)} \\equiv 1 \\pmod n$."
        type: basic
      - front: "Tool for computing $a^{-1} \\bmod n$?"
        back: "Extended Euclidean algorithm: write $1 = ax + ny$; then $a^{-1} \\equiv x$."
        type: basic

  - id: ring-homomorphisms-ideals
    name: "Ring Homomorphisms and Ideals"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: ring-axioms-examples
        weight: 0.8
        key: true
      - id: kernels-images
        weight: 0.7
        key: true
      # the principal-ideal exemplars invoke Bezout by name; inherited gcd gives
      # the gcd but not the representation ax + by = gcd.
      - id: euclidean-algorithm
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Ring homomorphisms and their kernels"
        key_prerequisites: [ring-axioms-examples, kernels-images]
        exemplars:
          - problem: "Let $\\varphi : \\mathbb{Z} \\to \\mathbb{Z}_5$ send each integer to its remainder mod 5. Compute $\\varphi(14) + \\varphi(3)$ as an element of $\\mathbb{Z}_5$, giving the least nonnegative residue."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of modular arithmetic: residues add mod 5, so the map preserves addition. Compute $\\varphi(14) = 4$ and $\\varphi(3) = 3$. Then $4 + 3 = 7$, and $7 \\bmod 5 = 2$; this equals $\\varphi(17)$, confirming additivity. The value is 2."
          - problem: "Let $\\varphi : \\mathbb{Z}_6 \\to \\mathbb{Z}_6$ be given by $\\varphi(x) = 2x$, with both operations read mod 6. Additivity holds, but the map may fail to preserve multiplication. Compute $\\varphi(1) \\cdot \\varphi(1)$ as an element of $\\mathbb{Z}_6$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: read every value mod 6. The full object is $\\varphi(x) = 2x$ on $\\mathbb{Z}_6$. Then $\\varphi(1) = 2$, so $\\varphi(1) \\cdot \\varphi(1) = 2 \\cdot 2 = 4$ in $\\mathbb{Z}_6$. But $\\varphi(1 \\cdot 1) = \\varphi(1) = 2$, and $2 \\neq 4$, so multiplication is not preserved. The computed value is 4."
          - problem: "Let $\\varphi : \\mathbb{Z}[x] \\to \\mathbb{Z}$ send a polynomial $p$ to $p(2)$; evaluation maps preserve both ring operations. Compute $\\varphi(3x^2 - x + 1)$."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: substitute the point into the polynomial (evaluation homomorphism). The full object is $p(x) = 3x^2 - x + 1$. Then $p(2) = 3 \\cdot 4 - 2 + 1 = 12 - 2 + 1 = 11$. The answer is 11."
          - problem: "Let $\\varphi : \\mathbb{Z} \\to \\mathbb{Z}_{12}$ be reduction mod 12, so $\\ker \\varphi$ is the set of all multiples of 12. Give the smallest positive integer that lies in $\\ker \\varphi$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: $\\varphi(a) = 0$ exactly when 12 divides $a$, so the kernel is $12\\mathbb{Z}$. The positive multiples of 12 are 12, 24, 36, and so on. The smallest of these is 12. The answer is 12."
          - problem: "Claim: $\\varphi : \\mathbb{Z} \\to \\mathbb{Z}$ with $\\varphi(x) = 2x$ is a ring homomorphism. Step 1: $\\varphi(a+b) = 2(a+b) = 2a + 2b$. Step 2: $\\varphi(a) + \\varphi(b) = 2a + 2b$. Step 3: therefore $\\varphi(a+b) = \\varphi(a) + \\varphi(b)$, so additivity holds. Step 4: $\\varphi(ab) = 2ab = \\varphi(a)\\varphi(b)$, so multiplicativity holds. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct expansion of $2(a+b)$. Step 2 computes $\\varphi(a) + \\varphi(b)$ correctly. Step 3 is a valid conclusion from Steps 1 and 2. Step 4 is the first invalid step: $\\varphi(a)\\varphi(b) = 2a \\cdot 2b = 4ab$, which differs from $2ab$ in general, for example $a = b = 1$ gives 4 versus 2. The options Step 1, Step 2 and Step 3 are each true statements, so choosing them skips the failure. The answer is Step 4."
          - problem: "Let $\\varphi : \\mathbb{Z}[x] \\to \\mathbb{Z}_5$ send a polynomial $p$ to $p(0) \\bmod 5$. Select the description that equals $\\ker \\varphi$."
            answer: "all polynomials whose constant term is a multiple of 5"
            answer_contract: {"kind": "label", "options": [["all polynomials whose constant term is a multiple of 5"], ["all constant polynomials"], ["all polynomials with p(5) = 0"], ["all polynomials of even degree"]]}
            solution_sketch: "Rule: $p \\in \\ker \\varphi$ exactly when $p(0) \\bmod 5 = 0$, that is, the constant term is divisible by 5. Wrong options: 'all constant polynomials' forgets nonconstant polynomials with constant term 0, such as $x$; 'all polynomials with p(5) = 0' confuses evaluation at 5 with reduction mod 5; 'all polynomials of even degree' imposes a condition unrelated to the map. The answer is all polynomials whose constant term is a multiple of 5."
          - problem: "Write the full proof: the map $\\varphi : \\mathbb{Z} \\to \\mathbb{Z}_7$ given by reduction mod 7 is a ring homomorphism with $\\ker \\varphi = 7\\mathbb{Z}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (well-defined): each integer $a$ has a unique remainder $a \\bmod 7$ in $\\{0,1,\\dots,6\\}$, so $\\varphi(a)$ is a single element of $\\mathbb{Z}_7$. Step 2 (addition): write $a = 7q + r$ and $b = 7s + t$ with $0 \\le r, t < 7$; then $a + b = 7(q+s) + (r+t)$, and since only $r + t$ can reach 7, $(a+b) \\bmod 7 = (r + t) \\bmod 7 = (a \\bmod 7 + b \\bmod 7) \\bmod 7$, hence $\\varphi(a+b) = \\varphi(a) + \\varphi(b)$. Step 3 (multiplication): $(7q+r)(7s+t) = 7(7qs + qt + rs) + rt$, so $(ab) \\bmod 7 = rt \\bmod 7 = ((a \\bmod 7)(b \\bmod 7)) \\bmod 7$, hence $\\varphi(ab) = \\varphi(a)\\varphi(b)$. Both operations are preserved, so $\\varphi$ is a ring homomorphism. Step 4 (kernel): $\\varphi(a) = 0$ in $\\mathbb{Z}_7$ exactly when 7 divides $a$, so $\\ker \\varphi = \\{a \\in \\mathbb{Z} : 7 \\mid a\\} = 7\\mathbb{Z}$, which is an ideal of $\\mathbb{Z}$."
        constraints: "verify both operations; evaluation and reduction maps; one failing example per set"
      - id: kp2
        name: "Ideals and the absorption property"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: "Let I = 6Z in Z. For r = 4 and x = 18, compute the product r x that the absorption test checks. Give the product as an integer."
            answer: "72"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The absorption test for an ideal requires r x in I for every r in Z and x in I. Step 2: Here x = 18 = 6 times 3, so x is in 6Z. Step 3: Multiply r = 4 and x = 18 to get 72. The answer is 72."
          - problem: "In Q, take I = Z, r = 1/2, and z = 1. Compute the product r z that tests absorption. Give the value as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Z is a subring of Q, but absorption needs r z in Z for every r in Q and z in Z. Step 2: Take r = 1/2 and z = 1. The product is 1/2. Step 3: Since 1/2 is not an integer, it is not in Z, so absorption fails. The answer is 1/2."
          - problem: "In Z, let I = 12Z, and take r = 5 with x = 36, so x lies in I. The absorption check rewrites the product r x as 12 times an integer q. Give the integer q."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: An element of 12Z has the form 12k, so x = 36 = 12 times 3 is in I. Step 2: The absorption product is r x = 5 times 36, which equals 180. Step 3: Write 180 as 12 times q: q = 180/12 = 15, an integer, so absorption holds here. The answer is 15."
          - problem: "In Z[x], let I be the set of polynomials whose constant term is even. For f(x) = x^2 + 3x + 4 and g(x) = x + 1, compute the constant term of f(x) g(x). Give the constant term as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The constant term of a product is the product of the constant terms. Step 2: f has constant term 4 and g has constant term 1. Step 3: Their product is 4 times 1, which equals 4. The answer is 4."
          - problem: "In Q, let I = Z, r = 1/3, and z = 1. Determine whether I absorbs r z, and give the product r z."
            answer: "verdict = absent; value = 1/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["present"], ["absent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: Absorption for I = Z in Q requires r z in Z for every r in Q and z in Z. Step 2: Here r z = 1/3 times 1 = 1/3. Step 3: Since 1/3 is not an integer, it is not in Z, so absorption fails. The option present is wrong because it would require 1/3 to be in Z. The answer is verdict = absent; value = 1/3."
          - problem: "Claim: Z is an ideal of Q. Step 1: Z is a subring of Q. Step 2: Z is closed under multiplication of its own elements. Step 3: For every r in Q and z in Z, the product r z is in Z, so Z absorbs multiplication. Step 4: Therefore Z is an ideal of Q. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true because Z is a subring of Q. Step 2 is true but only concerns products inside Z. Step 3 is false: with r = 1/2 and z = 1, the product r z = 1/2 is not in Z. Step 4 would follow only if Step 3 were true. The answer is Step 3."
          - problem: "Write the full proof: the set of polynomials in Z[x] with even constant term is an ideal of Z[x]. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: I = the set of polynomials in Z[x] with even constant term is an ideal of Z[x]. Step 1: I is nonempty because 0 has even constant term. Step 2: If f and g are in I, their constant terms are even, so the constant term of f - g is even; hence f - g is in I. Step 3: If f is in I and r is in Z[x], let c be the constant term of f and d the constant term of r. The constant term of r f is c d. Since c is even, c d is even, so r f is in I. Step 4: By Steps 1 to 3, I is an additive subgroup and absorbs multiplication by every ring element, so I is an ideal of Z[x]."
        constraints: "subring vs ideal distinctions; absorption checks in Z, Q, Z[x]"
      - id: kp3
        name: "Principal and generated ideals"
        key_prerequisites: [ring-axioms-examples]
        exemplars:
          - problem: 'In $\mathbb{Z}$, identify the ideal generated by $4$ and $6$.'
            answer: '$\langle 4, 6 \rangle = 2\mathbb{Z}$'
            solution_sketch: 'Integer combinations $4x + 6y$ are exactly the multiples of $\gcd(4,6) = 2$ (Bezout).'
          - problem: 'Every ideal of $\mathbb{Z}$ is principal. Sketch the proof.'
            answer: 'A nonzero ideal contains a least positive element $d$; division with remainder shows every element is a multiple of $d$, so $I = d\mathbb{Z}$.'
            solution_sketch: 'Well-ordering gives $d$; if $a \in I$ then $a = qd + r$ with $0 \le r < d$ and $r = a - qd \in I$ forces $r = 0$.'
        constraints: "ideals of Z via gcd; the division-algorithm argument"
    diagnostic_exemplar:
      problem: 'Let $\varphi : \mathbb{Z}[x] \to \mathbb{Z}_3$ send $p$ to $p(0) \bmod 3$. Show that $\varphi$ is a ring homomorphism and identify $\ker \varphi$ as an ideal generated by two elements.'
      answer: '$\varphi$ is the composite of evaluation at $0$ (which preserves sums and products, since $(p+q)(0) = p(0)+q(0)$ and $(pq)(0) = p(0)q(0)$) with reduction mod $3$, itself a ring homomorphism; so $\varphi$ preserves $+$ and $\cdot$. Its kernel is $\{p : 3 \mid p(0)\}$. Writing $p(x) = p(0) + x\,q(x)$, any such $p$ is $3k + x q(x) \in \langle 3, x\rangle$; conversely every element of $\langle 3, x \rangle$ has constant term divisible by $3$. Hence $\ker \varphi = \langle 3, x \rangle$, an ideal by absorption.'
      solution_sketch: 'Composite of two ring homomorphisms. For the kernel, split $p$ into its constant term and a multiple of $x$, then prove both inclusions.'
    anki_seeds:
      - front: "Extra condition an ideal satisfies beyond being a subring?"
        back: "Absorption: $ra \\in I$ for every $r$ in the ring and $a \\in I$."
        type: basic
      - front: "Every ideal of $\\mathbb{Z}$ has the form..."
        back: "$n\\mathbb{Z}$ for some $n \\ge 0$ ($\\mathbb{Z}$ is a principal ideal ring)."
        type: basic
      - front: "Kernel of a ring homomorphism is always a(n)..."
        back: "Ideal of the domain."
        type: basic

  - id: quotient-rings
    name: "Quotient Rings"
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: ring-homomorphisms-ideals
        weight: 0.9
        key: true
      - id: quotient-groups
        weight: 0.7
        key: true
      - id: polynomial-rings
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The construction R/I"
        key_prerequisites: [ring-homomorphisms-ideals, quotient-groups]
        exemplars:
          - problem: "In the quotient ring Z/6Z, the elements are cosets k+6Z for k = 0,1,2,3,4,5. Add the cosets 4+6Z and 5+6Z. Give the least nonnegative representative k of the sum coset k+6Z."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sum of the two cosets (4+6Z) + (5+6Z). Step 1 (coset addition) adds representatives: 4+5 = 9. Step 2 (reduction modulo 6) writes 9 = 6+3, so the sum coset is 3+6Z. The least nonnegative representative is 3."
          - problem: "In the quotient ring R/I, multiplication of cosets must be independent of the chosen representatives. Which property of the ideal I makes this independence true?"
            answer: "absorbing"
            answer_contract: {"kind": "label", "options": [["absorbing"], ["closed"], ["identity"], ["commuting"]]}
            solution_sketch: "The full condition is that I is absorbing: for every i in I and every r in R, the products r i and i r lie in I. Step 1 (absorption check): this makes (a+i)(b+j) = ab + (i b + a j + i j), and the extra terms stay in I. Step 2 (error analysis): the option closed only keeps sums in I, the option identity would force 1 in I and collapse R/I to the zero ring, and the option commuting says elements of I commute but does not absorb outside products. The required property is absorbing."
          - problem: "In the quotient ring Z/12Z, an element k+12Z is a zero divisor when some nonzero coset m+12Z satisfies (k+12Z)(m+12Z) = 0+12Z. Find the least positive integer k for which k+12Z is a zero divisor."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the coset k+12Z in Z/12Z. Step 1 (unit test): k=1 is a unit because 1*1 = 1, so it is not a zero divisor. Step 2 (zero divisor test): k=2 gives (2+12Z)(6+12Z) = 12+12Z = 0+12Z, and both 2+12Z and 6+12Z are nonzero. The least positive integer is 2."
          - problem: "In the quotient ring Z/10Z, find the least positive representative k of the multiplicative inverse of the coset 7+10Z."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the coset 7+10Z in Z/10Z. Step 1 (inverse equation): seek k with (7+10Z)(k+10Z) = 1+10Z, so 7k = 1 mod 10. Step 2 (solve congruence): k=3 gives 7*3 = 21 = 1 mod 10, and no smaller positive k works. The least positive representative is 3."
          - problem: "In the quotient ring Z/14Z, the elements are cosets k+14Z. Find how many of these cosets are units."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set of cosets k+14Z in Z/14Z. Step 1 (unit criterion): k+14Z is a unit exactly when k and 14 are coprime. Step 2 (count residues): the residues coprime to 14 among 0,...,13 are 1,3,5,9,11,13, so there are 6. The number of unit cosets is 6."
          - problem: "In the quotient ring Z/15Z, find the additive order of the coset 5+15Z."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the coset 5+15Z in Z/15Z. Step 1 (additive order): find the least positive n with n(5+15Z) = 0+15Z. Step 2 (test multiples): n=1 gives 5, n=2 gives 10, and n=3 gives 15 = 0 mod 15. The additive order is 3."
        constraints: "construction-level reasoning; Z/nZ examples"
      - id: kp2
        name: "Computing in Z_p[x]/(f): small quotient rings"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'How many elements does $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ have? List them.'
            answer: '$4$: the cosets of $0, 1, x, x+1$.'
            answer_contract: {kind: none}
            solution_sketch: 'Every polynomial reduces mod $x^2+x+1$ to a remainder of degree $< 2$ with coefficients in $\mathbb{Z}_2$: $2^2 = 4$ remainders.'
          - problem: 'In $\mathbb{Z}_2[x]/\langle x^2+x+1 \rangle$, writing $\alpha$ for the coset of $x$, compute $\alpha^2$.'
            answer: '$\alpha + 1$'
            solution_sketch: '$x^2 \equiv -(x + 1) = x + 1$ in characteristic $2$.'
        constraints: "Z_2 or Z_3 coefficients, quotient by degree-2 polynomials; count = p^deg"
      - id: kp3
        name: "Reduction computations in Z[x]/(f)"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: 'In $\mathbb{Z}[x]/\langle x^2 + 1 \rangle$, compute $(1 + x)(2 + x)$ in reduced form.'
            answer: '$1 + 3x$'
            solution_sketch: '$(1+x)(2+x) = 2 + 3x + x^2 \equiv 2 + 3x - 1 = 1 + 3x$ using $x^2 \equiv -1$.'
          - problem: "In Z[x]/<x>, the evaluation map at 0 identifies the quotient with Z. Compute the integer representative of the coset (3 + 4x)(5 + x)."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply in Z[x]: (3 + 4x)(5 + x) = 15 + 3x + 20x + 4x^2 = 15 + 23x + 4x^2. Reduce modulo <x>, so x = 0 and x^2 = 0. The coset is the constant 15. The answer is 15."
          - problem: "In Z[x]/<x^2 + 1>, reduce the product (3 + 2x)(4 - x) to the form a + b x. Give the answer as (a, b)."
            answer: "(14, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Expand the product: (3 + 2x)(4 - x) = 12 - 3x + 8x - 2x^2 = 12 + 5x - 2x^2. Reduce using x^2 = -1: 12 + 5x - 2(-1) = 14 + 5x. So a = 14 and b = 5. The answer is (14, 5)."
          - problem: "In Z[x]/<x^2 + 1>, reduce the power (1 + x)^3 to the form a + b x. Give the answer as (a, b)."
            answer: "(-2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "First square: (1 + x)^2 = 1 + 2x + x^2 = 2x using x^2 = -1. Multiply by (1 + x): 2x(1 + x) = 2x + 2x^2 = 2x - 2 = -2 + 2x. So a = -2 and b = 2. The answer is (-2, 2)."
          - problem: "In Z[x]/<x - 3>, the evaluation map at 3 identifies the quotient with Z. Compute the integer representative of the coset (x^2 + 1)(x + 2)."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evaluate the polynomial product at x = 3. First x^2 + 1 becomes 9 + 1 = 10. Next x + 2 becomes 3 + 2 = 5. Multiply: 10 * 5 = 50. The answer is 50."
          - problem: "In Z[x]/<x^2 + 2>, reduce the product (3 + x)(2 + x) to the form a + b x. Give the answer as (a, b)."
            answer: "(4, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Expand the product: (3 + x)(2 + x) = 6 + 3x + 2x + x^2 = 6 + 5x + x^2. Reduce using x^2 = -2: 6 + 5x - 2 = 4 + 5x. So a = 4 and b = 5. The answer is (4, 5)."
        constraints: "reduce products/powers modulo x^2 + c; identify quotients via evaluation maps"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_2[x]/\langle x^2 + x + 1 \rangle$ with $\alpha$ the coset of $x$, compute $(\alpha + 1)^2$ in reduced form.'
      answer: '$\alpha$'
      solution_sketch: '$(\alpha+1)^2 = \alpha^2 + 1$ (char $2$) $= (\alpha + 1) + 1 = \alpha$.'
    anki_seeds:
      - front: "Number of elements of $\\mathbb{Z}_p[x]/\\langle f \\rangle$, $\\deg f = d$?"
        back: "$p^d$ — one coset per remainder of degree $< d$."
        type: basic
      - front: "Why must $I$ be an ideal for $R/I$ to be a ring?"
        back: "Absorption makes coset multiplication well defined: representative changes shift $ab$ by elements of $I$."
        type: basic

