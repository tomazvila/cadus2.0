            answer: '5x + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Over the integers the product is $6x^2+11x+4$. Reducing modulo $6$ turns $6$ into $0$ and $11$ into $5$, so the $x^2$ term vanishes and the product is $5x+4$.'
          - problem: 'In $\mathbb{Z}_{7}[x]$, let $f=2x^2+1$ and $g=4x+2$. What is the degree of $fg$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading coefficients multiply to $2\cdot 4=8\equiv 1$ modulo $7$, which is not zero. Since $\mathbb{Z}_7$ is a field, degrees add: $2+1=3$.'
          - problem: 'Compute the product $(3x+1)(4x+1)$ in $\mathbb{Z}_{5}[x]$.'
            answer: '2x^2 + 2x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Over the integers $(3x+1)(4x+1)=12x^2+7x+1$. Modulo $5$ we have $12\equiv 2$ and $7\equiv 2$, so the product is $2x^2+2x+1$.'
          - problem: 'Let $f=3x^2+3$ and $g=4x^2+1$ in $\mathbb{Z}_{6}[x]$. Find the degree of $fg$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading terms give $3\cdot 4=12\equiv 0$ modulo $6$, so the $x^4$ term vanishes. The $x^2$ coefficient is $3+12=15\equiv 3$, which is not zero, so the degree is $2$.'
          - problem: 'Find $(4x+1)(2x+5)$ in $\mathbb{Z}_{8}[x]$.'
            answer: '6x + 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Over the integers the product is $8x^2+22x+5$. Modulo $8$ the coefficient $8$ becomes $0$ and $22$ becomes $6$, which leaves $6x+5$.'
          - problem: 'Sam multiplies $(2x+1)(3x+2)$ in $\mathbb{Z}_{6}[x]$ and says the product has degree $2$, because the degrees $1$ and $1$ add. What is the degree of the product?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over the integers the product is $6x^2+7x+2$. Modulo $6$ the $x^2$ term vanishes because $2\cdot 3\equiv 0$, which leaves $x+2$ of degree $1$.'
          - problem: 'A binary message $1011$ is stored as the polynomial $x^3+x+1$ over $\mathbb{Z}_{2}$. Multiplying the message by $x+1$ gives a new polynomial. What is it?'
            answer: 'x^4 + x^3 + x^2 + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Over the integers $(x^3+x+1)(x+1)=x^4+x^3+x^2+2x+1$. Modulo $2$ the middle term $2x$ vanishes, which leaves $x^4+x^3+x^2+1$.'
          - problem: 'How many polynomials of degree exactly $2$ are there in $\mathbb{Z}_{3}[x]$?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A polynomial $ax^2+bx+c$ has degree $2$ when $a\neq 0$. There are $2$ choices for $a$ and $3$ choices each for $b$ and $c$, so $2\cdot 3\cdot 3=18$.'
          - problem: 'What is the degree of $(2x+1)(2x+3)$ in $\mathbb{Z}_{4}[x]$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over the integers the product is $4x^2+8x+3$. Modulo $4$ both $4$ and $8$ become $0$, so only the constant $3$ remains and the degree is $0$.'
          - problem: 'A transmitter squares the message polynomial $x^2+x+1$ over $\mathbb{Z}_{2}$. What polynomial does it send?'
            answer: 'x^4 + x^2 + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Over the integers $(x^2+x+1)^2=x^4+2x^3+3x^2+2x+1$. Modulo $2$ the terms $2x^3$ and $2x$ vanish and $3\equiv 1$, which leaves $x^4+x^2+1$.'
        constraints: 'products in Z_n[x] (n <= 12, degrees <= 2); the degree formula and when it fails'
      - id: kp2
        name: 'The division algorithm for polynomials'
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'In $\mathbb{Z}_{3}[x]$, divide $x^3+2x+1$ by $x+1$. What is the quotient?'
            answer: 'x^2 + 2x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Divide the leading terms: $x^3/x=x^2$, and subtracting $x^2(x+1)$ leaves $-x^2+2x+1\equiv 2x^2+2x+1$ modulo $3$. Next $2x^2/x=2x$, and subtracting $2x(x+1)$ leaves $1$, so the quotient is $x^2+2x$ with remainder $1$.'
          - problem: 'In $\mathbb{Z}_{5}[x]$, dividing $x^3+4x^2+3x+1$ by $x+3$ leaves a remainder. What is it?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Division gives quotient $x^2+x$ and remainder $1$, since $(x+3)(x^2+x)=x^3+4x^2+3x$ modulo $5$. The remainder equals the value of the polynomial at $-3\equiv 2$, which is $8+16+6+1=31\equiv 1$.'
          - problem: 'Divide $x^4+3x^3+x+2$ by $x^2+1$ in $\mathbb{Q}[x]$. What is the remainder?'
            answer: '-2x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Divide the leading terms: $x^4/x^2=x^2$, which leaves $3x^3-x^2+x+2$, and then $3x^3/x^2=3x$ leaves $-x^2-2x+2$. Next $-x^2/x^2=-1$ leaves the remainder $-2x+3$, whose degree is below $2$, so the quotient is $x^2+3x-1$.'
          - problem: 'In $\mathbb{Z}_{2}[x]$, divide $x^4+x^3+1$ by $x^2+x+1$. What is the quotient?'
            answer: 'x^2 + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Divide $x^4$ by $x^2$ to get $x^2$ and subtract $x^2(x^2+x+1)=x^4+x^3+x^2$, which leaves $x^2+1$ modulo $2$. Then $x^2/x^2=1$ and subtracting $x^2+x+1$ leaves the remainder $x$, so the quotient is $x^2+1$.'
          - problem: 'A message is stored as the polynomial $x^6+x^3+1$ over $\mathbb{Z}_{2}$. The checksum is its remainder on division by $x^3+x+1$. What is the checksum?'
            answer: 'x^2 + x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Long division over $\mathbb{Z}_2$ gives quotient $x^3+x$ and remainder $x^2+x+1$. As a check, $(x^3+x+1)(x^3+x)\equiv x^6+x^3+x^2+x$ modulo $2$, and adding $x^2+x+1$ gives $x^6+x^3+1$ again.'
          - problem: 'Lena divides $x^3+x+1$ by $x+1$ in $\mathbb{Z}_{2}[x]$ and reports the remainder $x$. What is the correct remainder?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The remainder on division by $x+1$ is the polynomial evaluated at $-1\equiv 1$. Since $1+1+1=3\equiv 1$ modulo $2$, the remainder is the constant $1$, never a multiple of $x$, because it must have degree below $1$.'
          - problem: 'In $\mathbb{Q}[x]$, a polynomial of degree $5$ is divided by a polynomial of degree $2$. What is the degree of the quotient?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In $f=dq+r$ the remainder has degree below $\deg d=2$, so $\deg(dq)=\deg f=5$. Hence $\deg q=5-2=3$.'
          - problem: 'In $\mathbb{Q}[x]$, a polynomial is divided by one of degree $3$. What is the largest possible degree of the remainder?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The remainder must have degree less than $3$, and a nonzero polynomial of degree $2$ can occur, for example $x^2$ divided by $x^3$. So the largest possible degree is $2$.'
          - problem: 'In $\mathbb{Z}_{5}[x]$, divide $x^3+2x^2+2x+4$ by $x^2+1$. What is the remainder?'
            answer: 'x + 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Divide $x^3$ by $x^2$ to get $x$ and subtract $x^3+x$, which leaves $2x^2+x+4$. Then $2x^2/x^2=2$ and subtracting $2x^2+2$ leaves $x+2$, whose degree is below $2$.'
          - problem: 'A rectangular garden has area $x^3+x^2+x-3$ square metres and width $x-1$ metres. What polynomial gives its length in metres?'
            answer: 'x^2 + 2x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The length is the area divided by the width, so divide $x^3+x^2+x-3$ by $x-1$. The quotient is $x^2+2x+3$ with remainder $0$, because $(x-1)(x^2+2x+3)=x^3+x^2+x-3$.'
        constraints: 'divisors monic of degree <= 3; coefficients in Q, Z_2, Z_3, or Z_5; verify by multiplying back'
      - id: kp3
        name: 'Roots, factors, and the remainder theorem'
        key_prerequisites: [polynomial-division, integral-domains-zero-divisors, remainder-factor-theorems]
        exemplars:
          - problem: 'In $\mathbb{Q}[x]$, find the remainder when $x^4-3x^3+2x-6$ is divided by $x-2$.'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the remainder theorem the remainder of division by $x-2$ is the value of the polynomial at $2$. The terms are $2^4=16$, $-3\cdot 2^3=-24$, $2\cdot 2=4$ and $-6$, and $16-24+4-6=-10$.'
          - problem: 'Find all roots of $x^2-1$ in $\mathbb{Z}_{12}$.'
            answer: '1, 5, 7, 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each residue: $1^2=1$, $5^2=25\equiv 1$, $7^2=49\equiv 1$ and $11^2=121\equiv 1$ modulo $12$, while the other nonzero residues give $4, 9, 4, 0, 4, 9, 4$ and $0$ gives $-1$. So the polynomial $x^2-1$ has four roots in $\mathbb{Z}_{12}$, more than its degree because $\mathbb{Z}_{12}$ has zero divisors.'
          - problem: 'In $\mathbb{Z}_{7}[x]$, dividing $g=x^3+3x^2+6x+4$ by $x-2$ leaves a remainder. What is it?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the remainder theorem the remainder is the value $g(2)=8+12+12+4=36$. Modulo $7$ this is $36=5\cdot 7+1$, so the remainder is the constant $1$.'
          - problem: 'How many roots does $x^2+2$ have in $\mathbb{Z}_{7}$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A root needs $x^2\equiv 5$ modulo $7$. The squares modulo $7$ are $0, 1, 4, 2$, so $5$ is not a square and there are $0$ roots.'
          - problem: 'Is $x-2$ a factor of $x^3-4x^2+3x+4$ in $\mathbb{Q}[x]$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a factor","x-2 is a factor"],["no","it is not a factor","not a factor","x-2 is not a factor"]]}
            solution_sketch: 'By the factor theorem $x-2$ is a factor exactly when the value at $2$ is zero. Here $8-16+6+4=2$, which is not zero, so $x-2$ is not a factor.'
          - problem: 'In $\mathbb{Q}[x]$, find the remainder when $x^3-4x^2+2x-5$ is divided by $x-3$.'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the remainder theorem the remainder is the value at $3$. The terms are $27$, $-4\cdot 9=-36$, $2\cdot 3=6$ and $-5$, and $27-36+6-5=-8$.'
          - problem: 'Ben says $x^2+x$ has degree $2$, so it has at most two roots in $\mathbb{Z}_{6}$. Find all of its roots in $\mathbb{Z}_{6}$.'
            answer: '0, 2, 3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each residue: $0\cdot 1=0$, $2\cdot 3=6\equiv 0$, $3\cdot 4=12\equiv 0$ and $5\cdot 6=30\equiv 0$, while $1\cdot 2=2$ and $4\cdot 5=20\equiv 2$. So there are four roots, because $\mathbb{Z}_6$ has zero divisors.'
          - problem: 'Find all roots of $x^2+x+1$ in $\mathbb{Z}_{7}$.'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each residue: $2^2+2+1=7\equiv 0$ and $4^2+4+1=21\equiv 0$, while the other values are $1, 3, 6, 3, 1$ and none is zero. So the roots are $2$ and $4$.'
          - problem: 'Find $c$ in $\mathbb{Z}_{7}$ such that $x-3$ divides $x^2+x+c$ in $\mathbb{Z}_{7}[x]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the factor theorem the value at $3$ must be zero: $9+3+c=12+c\equiv 0$ modulo $7$. Since $12\equiv 5$, we need $c=2$.'
          - problem: 'A polynomial of degree $3$ over the field $\mathbb{Z}_{5}$ has at most how many roots?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over a field each root gives a linear factor, and distinct linear factors multiply to degree at most $3$. So there are at most $3$ roots.'
          - problem: 'Is $x+1$ a factor of $x^5+1$ in $\mathbb{Q}[x]$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a factor","x+1 is a factor"],["no","it is not a factor","not a factor","x+1 is not a factor"]]}
            solution_sketch: 'The factor $x+1$ has root $-1$, and $(-1)^5+1=0$. By the factor theorem $x+1$ divides $x^5+1$.'
        constraints: 'root counting in Z_n vs fields; remainder theorem evaluations; factor theorem verdicts'
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_5[x]$, divide $x^3 + 4x^2 + 2$ by $x + 2$ and give quotient and remainder.'
      answer: 'Quotient $x^2 + 2x + 1$, remainder $0$ — so $x + 2$ divides it.'
      answer_contract: {kind: none}
      solution_sketch: 'Synthetic division at $x = -2 \equiv 3$: coefficients $1, 4, 0, 2$ reduce to quotient $1, 2, 1$ with remainder $0$. Check: $(x+2)(x^2+2x+1) = x^3 + 4x^2 + 5x + 2 \equiv x^3 + 4x^2 + 2$ in $\mathbb{Z}_5$.'
    anki_seeds:
      - front: "Degree formula $\\deg(fg) = \\deg f + \\deg g$ requires the coefficient ring to be..."
        back: "An integral domain (no zero divisors)."
        type: basic
      - front: "Factor theorem?"
        back: "$x - a$ divides $f(x)$ iff $f(a) = 0$."
        type: basic
      - front: "Over a field, a nonzero polynomial of degree $n$ has at most ______ roots."
        back: "$n$ (can fail over rings with zero divisors, e.g. $x^2-1$ has 4 roots in $\\mathbb{Z}_8$)."
        type: basic

  - id: irreducibility-factorization
    name: "Irreducibility and Factorization"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polynomial-rings
        weight: 0.9
        key: true
      - id: factoring-trinomials
        weight: 0.4
        key: false
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: rational-root-theorem
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Root tests for degrees 2 and 3'
        key_prerequisites: [polynomial-rings]
        try_first:
          problem: 'How many roots does $x^2+x+1$ have in $\mathbb{Z}_{2}$?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'Both elements fail: the values at $0$ and $1$ are $1$ and $3\equiv 1$. A quadratic or cubic over a field with no root has no linear factor, so it is irreducible.'
        exemplars:
          - problem: 'Factor $x^3+x+2$ over $\mathbb{Z}_{3}$, with coefficients in $\{0,1,2\}$.'
            answer: '(x + 1)(x^2 + 2x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'A root test comes first: $f(0)=2$, $f(1)=4\equiv 1$ and $f(2)=12\equiv 0$, so $x=2$ is a root and $x-2\equiv x+1$ is a factor. Dividing gives the quotient $x^2+2x+2$, which has no root in $\mathbb{Z}_3$ and is therefore irreducible.'
          - problem: 'Find all roots of $x^2+1$ in $\mathbb{Z}_{5}$.'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each residue: $0, 1, 2, 3, 4$ give $1, 2, 5, 10, 17$ and modulo $5$ these are $1, 2, 0, 0, 2$. So the roots are $2$ and $3$.'
          - problem: 'Tara tests only $0$ and $1$ in $\mathbb{Z}_{5}$ and concludes that $x^2+1$ is irreducible over $\mathbb{Z}_{5}$. Is Tara right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","she is wrong","tara is wrong","it is reducible","reducible"],["yes","she is right","tara is right","it is irreducible","irreducible"]]}
            solution_sketch: 'A root test must try every element of $\mathbb{Z}_5$, not only $0$ and $1$. The value at $2$ is $2^2+1=5\equiv 0$, so $x^2+1$ has a root and is reducible.'
          - problem: 'Factor $x^2+1$ over $\mathbb{Z}_{5}$, with coefficients in $\{0,1,2,3,4\}$.'
            answer: '(x + 2)(x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The roots are $2$ and $3$, because $2^2+1=5\equiv 0$ and $3^2+1=10\equiv 0$. Each root gives a linear factor, and $(x-2)(x-3)=x^2-5x+6\equiv x^2+1$, which is $(x+3)(x+2)$.'
          - problem: 'Is $x^3+2x+1$ irreducible over $\mathbb{Z}_{3}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is irreducible","irreducible"],["no","it is reducible","reducible"]]}
            solution_sketch: 'A cubic over a field is reducible exactly when it has a root. The values at $0, 1, 2$ are $1, 4, 13$, which are $1, 1, 1$ modulo $3$, so there is no root and the cubic is irreducible.'
          - problem: 'The polynomial $x^4+x^2+1$ has no root in $\mathbb{Z}_{2}$. Factor it over $\mathbb{Z}_{2}$.'
            answer: '(x^2 + x + 1)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The values at $0$ and $1$ are $1$ and $3\equiv 1$, so there is no root, yet a quartic can still split into two quadratics. Here $(x^2+x+1)^2=x^4+2x^3+3x^2+2x+1\equiv x^4+x^2+1$ modulo $2$.'
          - problem: 'How many monic irreducible polynomials of degree $2$ are there over $\mathbb{Z}_{3}$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A monic quadratic over $\mathbb{Z}_3$ is irreducible exactly when it has no root. Of the $9$ monic quadratics, $x^2+1$, $x^2+x+2$ and $x^2+2x+2$ have no root, and the other $6$ do, so the count is $3$.'
          - problem: 'A code designer needs a polynomial $x^3+ax^2+bx+c$ over $\mathbb{Z}_{2}$ with no linear factor. How many such polynomials are there?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With no linear factor the cubic has no root, so $c=1$ and the value at $1$ must be nonzero, which needs $1+a+b+1\equiv 1$. This leaves $x^3+x+1$ and $x^3+x^2+1$, so there are $2$.'
          - problem: 'Factor $x^3-x$ over $\mathbb{Z}_{5}$, with coefficients in $\{0,1,2,3,4\}$.'
            answer: 'x(x + 1)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The values at $0, 1, 2, 3, 4$ are $0, 0, 6, 24, 60$, which are $0, 0, 1, 4, 0$ modulo $5$. The roots $0, 1, 4$ give the factors $x$, $x-1\equiv x+4$ and $x-4\equiv x+1$.'
          - problem: 'Factor $x^3-3x^2+3x-1$ over $\mathbb{Z}_{5}$, with coefficients in $\{0,1,2,3,4\}$.'
            answer: '(x + 4)^3'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Only $x=1$ is a root modulo $5$, and $x^3-3x^2+3x-1=(x-1)^3$. Since $-1\equiv 4$, the factorization is $(x+4)^3$, one linear factor repeated three times.'
        constraints: 'degree 2-4 over Z_2, Z_3, Z_5; the no-root criterion applies only up to degree 3; factorizations written with coefficients in 0..p-1'
      - id: kp2
        name: 'Rational root theorem and factoring over Q'
        key_prerequisites: [polynomial-rings, factoring-trinomials, rational-root-theorem]
        exemplars:
          - problem: 'Factor $2x^3+x^2-7x-6$ over $\mathbb{Q}$.'
            answer: '(x - 2)(x + 1)(2x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The candidates for a rational root are $\pm 1, \pm 2, \pm 3, \pm 6, \pm\tfrac12, \pm\tfrac32$. The value at $2$ is $16+4-14-6=0$, so $x-2$ is a factor, and dividing leaves $2x^2+5x+3=(x+1)(2x+3)$.'
          - problem: 'Factor $x^3-2x^2-5x+6$ over $\mathbb{Q}$.'
            answer: '(x - 3)(x - 1)(x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The candidates are the divisors of $6$. The value at $1$ is $1-2-5+6=0$, so $x-1$ is a factor, and dividing leaves $x^2-x-6=(x-3)(x+2)$.'
          - problem: 'Factor $2x^3-3x^2-8x+12$ over $\mathbb{Q}$.'
            answer: '(x - 2)(x + 2)(2x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The candidates are the divisors of $12$ divided by $1$ or $2$. The value at $2$ is $16-12-16+12=0$, so $x-2$ is a factor, and dividing leaves $2x^2+x-6=(2x-3)(x+2)$.'
          - problem: 'What is the smallest rational root of $x^3-4x^2+x+6$?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The candidates are the divisors of $6$. The value at $-1$ is $-1-4-1+6=0$, and dividing leaves $x^2-5x+6=(x-2)(x-3)$, so the rational roots are $-1, 2, 3$ and the smallest is $-1$.'
          - problem: 'Is $x^3-x+1$ irreducible over $\mathbb{Q}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is irreducible","irreducible"],["no","it is reducible","reducible"]]}
            solution_sketch: 'A rational root must be $1$ or $-1$, since both the constant term and the leading coefficient are $1$. The values are $1-1+1=1$ and $-1+1+1=1$, so there is no rational root, and a cubic with no rational root is irreducible over $\mathbb{Q}$.'
          - problem: 'Kim lists only the divisors of $6$ as candidates for rational roots of $2x^3+x^2-7x-6$, and she finds the integer roots $2$ and $-1$. Find the third root.'
            answer: '-3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading coefficient $2$ allows candidates with denominator $2$, which Kim left out. Dividing out $(x-2)(x+1)=x^2-x-2$ leaves $2x+3$, so the third root is $-\tfrac32$.'
          - problem: 'The volume of a box is $2x^3+x^2-7x-6$ cubic centimetres and its height is $x+1$ centimetres. What polynomial gives the area of its base in square centimetres?'
            answer: '2x^2 - x - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The base area is the volume divided by the height. Dividing $2x^3+x^2-7x-6$ by $x+1$ gives $2x^2-x-6$, since $(x+1)(2x^2-x-6)=2x^3+x^2-7x-6$.'
          - problem: 'Is $x^3+3x^2-4$ irreducible over $\mathbb{Q}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is reducible","reducible"],["yes","it is irreducible","irreducible"]]}
            solution_sketch: 'A rational root must divide $4$. The value at $1$ is $1+3-4=0$, so $x-1$ is a factor and the cubic is reducible over $\mathbb{Q}$.'
          - problem: 'Find all rational roots of $x^3+3x^2-4$.'
            answer: '-2, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value at $1$ is $0$, and dividing by $x-1$ leaves $x^2+4x+4=(x+2)^2$. So the only rational roots are $1$ and the double root $-2$.'
          - problem: 'The edges of a box are $x$, $x+1$ and $x+2$ centimetres long and its volume is $120$ cubic centimetres. How long is the shortest edge?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The volume gives $x(x+1)(x+2)=120$, so $x^3+3x^2+2x-120=0$. The rational root theorem allows divisors of $120$, and $x=4$ gives $64+48+8-120=0$, so the shortest edge is $4$ cm.'
          - problem: 'Find all rational roots of $x^3-3x^2-x+3$.'
            answer: '-1, 1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The candidates are $\pm 1$ and $\pm 3$. Grouping gives $x^2(x-3)-(x-3)=(x-3)(x-1)(x+1)$, so the roots are $-1, 1, 3$.'
        constraints: 'cubics with integer coefficients, |coefficients| <= 12; complete factorizations verified by expansion'
      - id: kp3
        name: 'Eisenstein''s criterion and mod-p reduction'
        key_prerequisites: [polynomial-rings, prime-factorization]
        exemplars:
          - problem: 'Find a prime $p$ for which Eisenstein''s criterion applies to $x^4+3x^2+6x+3$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The prime must divide every coefficient except the leading one: $0, 3, 6, 3$. Only $3$ does, and $3$ does not divide the leading coefficient $1$, while $9$ does not divide the constant term $3$.'
          - problem: 'Is $x^4+3x^2+6x+3$ irreducible over $\mathbb{Q}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is irreducible","irreducible"],["no","it is reducible","reducible"]]}
            solution_sketch: 'Take $p=3$: it divides $0, 3, 6$ and $3$, it does not divide the leading coefficient $1$, and $9$ does not divide the constant term $3$. So Eisenstein''s criterion applies and proves that the polynomial is irreducible over $\mathbb{Q}$.'
          - problem: 'Find a prime $p$ for which Eisenstein''s criterion applies to $x^4+2x^3+4x+6$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficients other than the leading one are $2, 0, 4, 6$, and only $2$ divides all of them. The prime $2$ does not divide $1$, and $4$ does not divide the constant term $6$.'
          - problem: 'Find a prime $p$ for which Eisenstein''s criterion applies to $x^3+5x^2+10x+5$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficients $5, 10, 5$ are all divisible by $5$ and by no other prime. The prime $5$ does not divide the leading coefficient $1$, and $25$ does not divide the constant term $5$.'
          - problem: 'Reducing $x^3+2x^2+3x+5$ modulo $2$ gives a polynomial $g$. What is $g$?'
            answer: 'x^3 + x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Reduce each coefficient modulo $2$: $1$ stays $1$, $2$ becomes $0$, $3$ becomes $1$ and $5$ becomes $1$. So $g=x^3+x+1$.'
          - problem: 'How many roots does $x^3+x+1$ have in $\mathbb{Z}_{2}$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value at $0$ is $1$ and the value at $1$ is $3\equiv 1$ modulo $2$. Neither is $0$, so there are $0$ roots, and the cubic is irreducible over $\mathbb{Z}_2$.'
          - problem: 'Sam reduces $x^3+2x^2+2$ modulo $3$, finds the root $2$, and concludes that $x^3+2x^2+2$ is reducible over $\mathbb{Q}$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","he is wrong","sam is wrong","it is irreducible","irreducible"],["yes","he is right","sam is right","it is reducible","reducible"]]}
            solution_sketch: 'A factorization over $\mathbb{Q}$ would give a rational root among $\pm 1, \pm 2$. The values are $5, 3, 18, 2$, none is zero, so the cubic is irreducible over $\mathbb{Q}$ even though its reduction modulo $3$ has the root $2$.'
          - problem: 'Expand $(x+1)^4+1$.'
            answer: 'x^4 + 4x^3 + 6x^2 + 4x + 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The binomial theorem gives $(x+1)^4=x^4+4x^3+6x^2+4x+1$ with coefficients $1, 4, 6, 4, 1$. Adding $1$ to the constant term gives $x^4+4x^3+6x^2+4x+2$.'
          - problem: 'Find a prime $p$ for which Eisenstein''s criterion applies to $x^4+4x^3+6x^2+4x+2$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficients $4, 6, 4, 2$ are all even, and $2$ does not divide the leading coefficient $1$. Also $4$ does not divide the constant term $2$, so $p=2$ works.'
          - problem: 'How many roots does $x^2+1$ have in $\mathbb{Z}_{3}$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values at $0, 1, 2$ are $1, 2, 5$, which are $1, 2, 2$ modulo $3$. None is $0$, so there are $0$ roots.'
          - problem: 'The real number $\alpha=\sqrt[3]{2}$ satisfies $\alpha^3=2$. What is the smallest degree of a nonzero polynomial with rational coefficients that has $\alpha$ as a root?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $\alpha$ is a root of $x^3-2$. Eisenstein''s criterion at $p=2$ shows that $x^3-2$ is irreducible over $\mathbb{Q}$, because $2$ divides $0, 0, 2$ and $4$ does not divide $2$, so no polynomial of degree $1$ or $2$ has $\alpha$ as a root and the smallest degree is $3$.'
        constraints: 'Eisenstein with one prime p; the mod-p test with p = 2, 3; degree <= 5'
    diagnostic_exemplar:
      problem: 'Decide whether each is irreducible over $\mathbb{Q}$: (a) $x^4 + 10x + 5$, (b) $x^2 - 9$.'
      answer: '(a) Irreducible by Eisenstein at $p = 5$ ($5 \mid 10, 5$; $5 \nmid 1$; $25 \nmid 5$). (b) Reducible: $(x-3)(x+3)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Eisenstein handles (a); (b) is a difference of squares.'
    anki_seeds:
      - front: "Eisenstein's criterion at prime $p$?"
        back: "$p$ divides every coefficient except the leading one, and $p^2$ does not divide the constant term $\\Rightarrow$ irreducible over $\\mathbb{Q}$."
        type: basic
      - front: "When does 'no roots' prove irreducibility over a field?"
        back: "Only for degree 2 or 3 (higher degrees can factor into two quadratics)."
        type: basic

  - id: prime-maximal-ideals
    name: "Prime and Maximal Ideals"
    core: false                # terminal ideal classification; the curriculum stops here
    difficulty: 0.80
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: quotient-rings
        weight: 0.9
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: irreducibility-factorization
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Definitions and the quotient characterizations'
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'Let $M$ be a maximal ideal of a commutative ring $R$ with unity, and suppose $R/M$ has exactly $7$ elements. How many units does $R/M$ have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $M$ is maximal, $R/M$ is a field. In a field every nonzero element is a unit, so a field with $7$ elements has $7-1=6$ units.'
          - problem: 'Let $P$ be a prime ideal of a commutative ring $R$ with unity, and suppose $R/P$ has exactly $5$ elements. How many units does $R/P$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $P$ is prime, $R/P$ is an integral domain, and a finite integral domain is a field. So every nonzero element of $R/P$ is a unit, which gives $5-1=4$ units.'
          - problem: 'Let $I$ be a proper ideal of a commutative ring $R$ with unity, and suppose $R/I$ is an integral domain with exactly $9$ elements. Is $I$ a maximal ideal?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is maximal","maximal"],["no","it is not maximal","not maximal"]]}
            solution_sketch: 'A finite integral domain is a field: multiplication by a nonzero element is injective, hence onto, so it hits $1$. Since $R/I$ is a field, $I$ is maximal.'
          - problem: 'Sam claims that every prime ideal of a commutative ring with unity is maximal, because every integral domain is a field. In the integral domain $\mathbb{Z}$, find the smallest integer $n$ with $n > 1$ that has no multiplicative inverse in $\mathbb{Z}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A multiplicative inverse of $n$ in $\mathbb{Z}$ is an integer $m$ with $nm = 1$. For $n = 2$ this needs $m = 1/2$, which is not an integer, so $2$ has no inverse. Hence $\mathbb{Z}$ is an integral domain that is not a field, and $\langle 0 \rangle$ is prime but not maximal.'
          - problem: 'Let $M$ be a maximal ideal of a commutative ring $R$ with unity, and suppose $R/M$ has exactly $4$ elements. How many solutions does the equation $y^2=0$ have in $R/M$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $M$ is maximal, $R/M$ is a field, and a field has no nonzero zero divisors. So $y^2=0$ forces $y=0$, and there is exactly $1$ solution.'
          - problem: 'The ideal $13\mathbb{Z}$ is maximal in $\mathbb{Z}$. How many units does the quotient ring $\mathbb{Z}/13\mathbb{Z}$ have?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient $\mathbb{Z}/13\mathbb{Z}$ is the field $\mathbb{Z}_{13}$ with $13$ elements. Every nonzero residue is a unit, so there are $13-1=12$ units.'
          - problem: 'How many units does the quotient ring $\mathbb{Z}/12\mathbb{Z}$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A residue $a$ is a unit in $\mathbb{Z}_{12}$ exactly when $\gcd(a,12)=1$, which gives $1, 5, 7, 11$. There are $4$ units among the $11$ nonzero residues, so $12\mathbb{Z}$ is not maximal.'
          - problem: 'Sam says that $6\mathbb{Z}$ is a prime ideal of $\mathbb{Z}$. Find the integer $a$ with $0<a<6$ for which $4a$ lies in $6\mathbb{Z}$; the pair $4$ and $a$ then shows that Sam is wrong.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $4a$ to be a multiple of $6$, and among $1,\dots,5$ only $a=3$ works, since $4\cdot 3=12$. Neither $4$ nor $3$ is in $6\mathbb{Z}$ although their product is, so $6\mathbb{Z}$ is not prime.'
          - problem: 'Write the full proof that in a commutative ring $R$ with unity, a proper ideal $I$ is prime if and only if the quotient ring $R/I$ is an integral domain.'
            answer: 'I is prime iff R/I is a domain'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Suppose $I$ is prime and $(a+I)(b+I)=I$. Then $ab\in I$, so $a\in I$ or $b\in I$, which means $a+I=I$ or $b+I=I$; hence $R/I$ has no zero divisors. Conversely, if $R/I$ is an integral domain and $ab\in I$, then $(a+I)(b+I)=I$ forces $a+I=I$ or $b+I=I$, so $a\in I$ or $b\in I$.'
        constraints: 'statements and one-line derivations; commutative rings with unity'
      - id: kp2
        name: 'Classifying prime/maximal ideals of Z and Z_n'
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'How many maximal ideals does the ring $\mathbb{Z}_{12}$ have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every ideal of $\mathbb{Z}_{12}$ is $\langle d\rangle$ for a divisor $d$ of $12$, and $\mathbb{Z}_{12}/\langle d\rangle\cong\mathbb{Z}_d$. This is a field exactly when $d$ is prime, so the maximal ideals are $\langle 2\rangle$ and $\langle 3\rangle$, which makes $2$.'
          - problem: 'For which integers $n$ with $10\le n\le 24$ is $n\mathbb{Z}$ a maximal ideal of $\mathbb{Z}$?'
            answer: '11, 13, 17, 19, 23'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient $\mathbb{Z}/n\mathbb{Z}\cong\mathbb{Z}_n$ is a field exactly when $n$ is prime. The primes from $10$ to $24$ are $11, 13, 17, 19, 23$.'
          - problem: 'How many elements does the quotient ring $\mathbb{Z}_{15}/\langle 5\rangle$ have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ideal $\langle 5\rangle=\{0,5,10\}$ has $3$ elements. Each coset has $3$ elements, so the quotient has $15/3=5$ elements and is $\mathbb{Z}_5$.'
          - problem: 'Sam says that $\langle 4\rangle$ is a maximal ideal of $\mathbb{Z}_{12}$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","he is wrong","sam is wrong","not maximal"],["yes","he is right","sam is right","maximal"]]}
            solution_sketch: 'The quotient $\mathbb{Z}_{12}/\langle 4\rangle$ is $\mathbb{Z}_4$, which is not a field because $2\cdot 2=0$. So $\langle 4\rangle$ is not maximal; the ideal $\langle 2\rangle$ lies strictly between it and the whole ring.'
          - problem: 'Find a nonzero zero divisor in the quotient ring $\mathbb{Z}_{12}/\langle 4\rangle$, writing its class as a residue between $0$ and $3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\mathbb{Z}_4$ with elements $0,1,2,3$. Only $2$ is a nonzero zero divisor, because $2\cdot 2=4\equiv 0$.'
          - problem: 'How many prime ideals does the ring $\mathbb{Z}_8$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ideals of $\mathbb{Z}_8$ are $\langle d\rangle$ for $d=1,2,4,8$, with quotients $\mathbb{Z}_d$. A quotient is an integral domain exactly when $d$ is prime, and the only prime divisor of $8$ is $2$, so there is $1$ prime ideal.'
          - problem: 'Is $\langle 7\rangle$ a maximal ideal of $\mathbb{Z}_{21}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is maximal","maximal"],["no","it is not maximal","not maximal"]]}
            solution_sketch: 'The ideal $\langle 7\rangle$ has $3$ elements, so $\mathbb{Z}_{21}/\langle 7\rangle$ has $7$ elements and is $\mathbb{Z}_7$. Since $7$ is prime, this quotient is a field and $\langle 7\rangle$ is maximal.'
          - problem: 'How many maximal ideals does the ring $\mathbb{Z}_{360}$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The maximal ideals of $\mathbb{Z}_n$ correspond to the distinct primes dividing $n$. Since $360=2^3\cdot 3^2\cdot 5$, the primes are $2, 3, 5$, so there are $3$ maximal ideals.'
          - problem: 'On a $24$-hour clock, two hours are treated as the same when they differ by a multiple of $6$. How many different classes of hours are there?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'This is the quotient $\mathbb{Z}_{24}/\langle 6\rangle$. The ideal $\langle 6\rangle=\{0,6,12,18\}$ has $4$ elements, so there are $24/4=6$ classes, and the quotient is $\mathbb{Z}_6$.'
          - problem: 'For which divisors $d$ of $20$ with $1<d<20$ is $\langle d\rangle$ a maximal ideal of $\mathbb{Z}_{20}$?'
            answer: '2, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient $\mathbb{Z}_{20}/\langle d\rangle\cong\mathbb{Z}_d$ is a field exactly when $d$ is prime. The divisors of $20$ between $1$ and $20$ are $2, 4, 5, 10$, and the primes among them are $2$ and $5$.'
          - problem: 'Write the full proof that the maximal ideals of $\mathbb{Z}_{12}$ are exactly $\langle 2\rangle$ and $\langle 3\rangle$.'
            answer: 'Maximal ideals of Z_12: <2> and <3>'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Every ideal of $\mathbb{Z}_{12}$ is $\langle d\rangle$ for a divisor $d$ of $12$, and $\mathbb{Z}_{12}/\langle d\rangle\cong\mathbb{Z}_d$. An ideal is maximal exactly when this quotient is a field, which happens exactly when $d$ is prime, so $d=2$ or $d=3$. The other quotients are $\mathbb{Z}_1$, $\mathbb{Z}_4$, $\mathbb{Z}_6$ and $\mathbb{Z}_{12}$, none of which is a field.'
        constraints: 'Z and Z_n (n <= 360); justify via the quotient'
      - id: kp3
        name: 'Prime but not maximal; polynomial examples'
        key_prerequisites: [quotient-rings]
        try_first:
          problem: 'How many elements of $\mathbb{Z}$ have a multiplicative inverse in $\mathbb{Z}$?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'Only $1$ and $-1$ are invertible, so $\mathbb{Z}$ is an integral domain but not a field. This is why an ideal with quotient $\mathbb{Z}$ is prime but not maximal.'
        exemplars:
          - problem: 'Evaluation at $0$ gives a ring isomorphism $\mathbb{Z}[x]/\langle x\rangle\cong\mathbb{Z}$. Which integer corresponds to the class of $x^2+3x+7$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The isomorphism sends the class of a polynomial $f$ to $f(0)$. For $x^2+3x+7$ this is $0+0+7=7$.'
          - problem: 'How many elements does $\mathbb{F}_2[x]/\langle x^2+x+1\rangle$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every class has a unique representative $a+bx$ of degree at most $1$, with $a,b\in\mathbb{F}_2$. That gives $2\cdot 2=4$ elements.'
          - problem: 'Is $\langle x^2+1\rangle$ a maximal ideal of $\mathbb{F}_3[x]$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is maximal","maximal"],["no","it is not maximal","not maximal"]]}
            solution_sketch: 'In $\mathbb{F}_3[x]$ the ideal $\langle f\rangle$ is maximal exactly when $f$ is irreducible. The values of $x^2+1$ at $0,1,2$ are $1, 2, 2$ modulo $3$, so there is no root, and a quadratic without a root is irreducible.'
          - problem: 'How many elements does $\mathbb{F}_5[x]/\langle x^2+2\rangle$ have?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every class has a unique representative $a+bx$ with $a,b\in\mathbb{F}_5$. That gives $5\cdot 5=25$ elements.'
          - problem: 'Is $\langle x\rangle$ a maximal ideal of $\mathbb{Z}[x]$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is not maximal","not maximal"],["yes","it is maximal","maximal"]]}
            solution_sketch: 'The quotient $\mathbb{Z}[x]/\langle x\rangle$ is isomorphic to $\mathbb{Z}$, which is an integral domain but not a field. So $\langle x\rangle$ is prime but not maximal; for instance $\langle x\rangle\subsetneq\langle 2,x\rangle$.'
          - problem: 'What is the inverse of the class of $x$ in $\mathbb{F}_2[x]/\langle x^2+x+1\rangle$? Write it as a polynomial of degree at most $1$.'
            answer: 'x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'In the quotient $x^2+x+1=0$, so $x^2+x=1$ modulo $2$. Hence $x(x+1)=1$, and the inverse of $x$ is $x+1$.'
          - problem: 'Ana says that $\langle x^2+1\rangle$ is maximal in $\mathbb{Z}[x]$ because $x^2+1$ is irreducible. The ideal $\langle 3, x^2+1\rangle$ contains it. How many elements does $\mathbb{Z}[x]/\langle 3, x^2+1\rangle$ have?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Modulo $3$ the quotient is $\mathbb{F}_3[x]/\langle x^2+1\rangle$, whose classes are $a+bx$ with $a,b\in\mathbb{F}_3$. That gives $3\cdot 3=9$ elements and a field, so $\langle 3,x^2+1\rangle$ is maximal and lies strictly above $\langle x^2+1\rangle$.'
          - problem: 'What is the inverse of the class of $x+1$ in $\mathbb{F}_3[x]/\langle x^2+1\rangle$? Write it as a polynomial of degree at most $1$.'
            answer: 'x + 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'In the quotient $x^2+1=0$. Then $(x+1)(x+2)=x^2+3x+2\equiv x^2+2\equiv 1$ modulo $3$, because $x^2\equiv -1\equiv 2$ and $2+2=4\equiv 1$. So the inverse is $x+2$.'
          - problem: 'A field with $125$ elements is built as $\mathbb{F}_5[x]/\langle f\rangle$ for an irreducible polynomial $f$. What is the degree of $f$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient has $5^n$ elements when $\deg f=n$, since each class is $a_0+a_1x+\dots+a_{n-1}x^{n-1}$. Because $125=5^3$, the degree is $3$.'
          - problem: 'Write the full proof that for a field $F$ and a nonconstant polynomial $f\in F[x]$, the ideal $\langle f\rangle$ is maximal if and only if $f$ is irreducible over $F$.'
            answer: '<f> is maximal iff f is irreducible'
            answer_contract: {"kind":"none"}
            solution_sketch: 'If $f=gh$ with both factors of smaller degree, then $\langle f\rangle\subsetneq\langle g\rangle\subsetneq F[x]$, so $\langle f\rangle$ is not maximal. Conversely, if $f$ is irreducible and $\langle f\rangle\subseteq\langle g\rangle$, then $g$ divides $f$, so $g$ is a unit or an associate of $f$, giving $\langle g\rangle=F[x]$ or $\langle g\rangle=\langle f\rangle$.'
        constraints: 'quotient identifications in Z[x] and F[x]; irreducible <-> maximal in F[x]; inverses in quotient fields of order <= 25'
    diagnostic_exemplar:
      problem: 'Decide whether $\langle 5 \rangle$ is a prime ideal of $\mathbb{Z}[x]$, and whether it is maximal. Justify both answers by identifying the quotient.'
      answer: 'Reducing coefficients mod $5$ gives $\mathbb{Z}[x]/\langle 5 \rangle \cong \mathbb{Z}_5[x]$. Since $\mathbb{Z}_5$ is a field, $\mathbb{Z}_5[x]$ is an integral domain, so $\langle 5 \rangle$ is prime. It is not maximal: $\mathbb{Z}_5[x]$ is not a field, because $x$ has no inverse (degrees add under multiplication). Equivalently $\langle 5 \rangle \subsetneq \langle 5, x \rangle \subsetneq \mathbb{Z}[x]$, so $\langle 5 \rangle$ is prime but not maximal.'
      solution_sketch: 'Use the quotient characterisations — prime iff the quotient is a domain, maximal iff it is a field — after identifying the quotient as $\mathbb{Z}_5[x]$.'
    anki_seeds:
      - front: "$P$ prime iff $R/P$ is a(n) ______; $M$ maximal iff $R/M$ is a(n) ______."
        back: "Integral domain; field."
        type: basic
      - front: "In $F[x]$ ($F$ a field), $\\langle f \\rangle$ is maximal iff..."
        back: "$f$ is irreducible over $F$."
        type: basic
      - front: "Example of a prime ideal that is not maximal?"
        back: "$\\langle x \\rangle$ in $\\mathbb{Z}[x]$ (quotient $\\mathbb{Z}$: domain, not field); also $\\{0\\}$ in $\\mathbb{Z}$."
        type: basic

