        key_prerequisites: [ring-axioms-examples, integral-domains-zero-divisors]
        exemplars:
          - problem: "In Z_6[x], multiply (2x + 1)(3x + 4) and reduce every coefficient modulo 6. Give the product as a polynomial in x."
            answer: "5x + 4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Expand over the integers: (2x + 1)(3x + 4) = 6x^2 + 11x + 4. Reduce each coefficient modulo 6: 6 becomes 0 and 11 becomes 5, so the x^2 term vanishes because 2 and 3 are zero divisors in Z_6. The surviving terms give 5x + 4. The product is 5x + 4."
          - problem: "In Z_7[x], let f = 2x^2 + 1 and g = 4x + 2. Find the degree of the product fg."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leading coefficient of f is 2 and the leading coefficient of g is 4. In Z_7, 2 times 4 is 8, which is 1 mod 7, nonzero. The degree formula for an integral domain gives deg(fg) = deg f + deg g = 2 + 1 = 3. The degree is 3."
          - problem: "In Z_5[x], multiply (3x + 1)(4x + 1). Give the coefficient of x^2 in the product."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply the leading terms: 3x times 4x gives 12x^2. Reduce the coefficient modulo 5: 12 is 2. The x^2 coefficient is therefore 2. The coefficient of x^2 is 2."
          - problem: "In Z_6[x], let f = 3x^2 + 3 and g = 4x^2 + 1. Find the degree of the product fg."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leading terms multiply as 3x^2 times 4x^2 = 12x^4. In Z_6, 12 is 0, so the x^4 term vanishes. The remaining highest term is (3x^2)(1) + (3)(4x^2) = 3x^2 + 12x^2 = 15x^2, and 15 is 3 mod 6, which is nonzero. Thus the product has degree 2. The degree is 2."
          - problem: "In Z_8[x], multiply (4x + 1)(2x + 5). Give the coefficient of x in the product."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the product: (4x + 1)(2x + 5) = 8x^2 + 20x + 2x + 5 = 8x^2 + 22x + 5. Reduce modulo 8: 8 is 0 and 22 is 6. The x coefficient is 6. The coefficient of x is 6."
          - problem: "In Z_4[x], multiply (2x + 1)(2x + 3). Give the coefficient of x^2 in the product."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The x^2 term comes from 2x times 2x, which is 4x^2. Reduce the coefficient modulo 4: 4 is 0. Therefore the x^2 coefficient is 0. The coefficient of x^2 is 0."
        constraints: "products in Z_n[x] (n <= 8, degrees <= 2); the degree formula and when it fails"
      - id: kp2
        name: "The division algorithm for polynomials"
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'In $\mathbb{Z}_3[x]$, divide $x^3 + 2x + 1$ by $x + 1$: give quotient and remainder.'
            answer: 'Quotient $x^2 + 2x$, remainder $1$.'
            answer_contract: {kind: none}
            solution_sketch: 'Long division mod 3: $x^3 + 2x + 1 = (x+1)(x^2 + 2x) + 1$; check: $(x+1)(x^2+2x) = x^3 + 3x^2 + 2x = x^3 + 2x$.'
          - problem: 'Divide $x^4 + 3x^3 + x + 2$ by $x^2 + 1$ in $\mathbb{Q}[x]$.'
            answer: 'Quotient $x^2 + 3x - 1$, remainder $-2x + 3$.'
            answer_contract: {kind: none}
            solution_sketch: 'Standard long division; verify $(x^2+1)(x^2+3x-1) + (-2x+3) = x^4+3x^3+x+2$.'
        constraints: "divisors monic of degree <= 2; coefficients in Q, Z_3, or Z_5; verify by multiplying back"
      - id: kp3
        name: "Roots, factors, and the remainder theorem"
        key_prerequisites: [polynomial-division, integral-domains-zero-divisors, remainder-factor-theorems]
        exemplars:
          - problem: 'State the factor theorem for a commutative ring with unity, and use it: is $x - 2$ a factor of $f(x) = x^3 - 3x + 2$ in $\mathbb{Q}[x]$?'
            answer: '$x - a$ divides $f$ iff $f(a) = 0$; here $f(2) = 8 - 6 + 2 = 4 \neq 0$, so no.'
            answer_contract: {kind: none}
            solution_sketch: 'Divide with remainder $f(x) = (x-a)q(x) + f(a)$; evaluate at $2$.'
          - problem: 'How many roots does $x^2 - 1$ have in $\mathbb{Z}_8$?'
            answer: '$4$: $x = 1, 3, 5, 7$.'
            answer_contract: {kind: none}
            solution_sketch: 'Test the odd residues: each squares to $1$ mod $8$. Over a non-domain, a degree-$n$ polynomial can exceed $n$ roots.'
        constraints: "root counting in Z_n vs fields; remainder theorem evaluations"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}_5[x]$, divide $x^3 + 4x^2 + 2$ by $x + 2$ and give quotient and remainder.'
      answer: 'Quotient $x^2 + 2x + 1$, remainder $0$ — so $x + 2$ divides it.'
      answer_contract: {kind: none}
      solution_sketch: 'Synthetic division at $x = -2 \equiv 3$: coefficients $1, 4, 0, 2$ reduce to quotient $1, 2, 1$ with remainder $0$. Check: $(x+2)(x^2+2x+1) = x^3 + 4x^2 + 5x + 2 \equiv x^3 + 4x^2 + 2$ in $\mathbb{Z}_5$.'
    anki_seeds:
      - front: "Degree formula $\\deg(fg) = \\deg f + \\deg g$ requires the coefficient ring to be..."
        back: "An integral domain (no zero divisors)."
        type: basic
      - front: "Factor theorem?"
        back: "$x - a$ divides $f(x)$ iff $f(a) = 0$."
        type: basic
      - front: "Over a field, a nonzero polynomial of degree $n$ has at most ______ roots."
        back: "$n$ (can fail over rings with zero divisors, e.g. $x^2-1$ has 4 roots in $\\mathbb{Z}_8$)."
        type: basic

  - id: irreducibility-factorization
    name: "Irreducibility and Factorization"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polynomial-rings
        weight: 0.9
        key: true
      - id: factoring-trinomials
        weight: 0.4
        key: false
      - id: prime-factorization
        weight: 0.4
        key: false
      - id: rational-root-theorem
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Root tests for degrees 2 and 3"
        key_prerequisites: [polynomial-rings]
        exemplars:
          - problem: 'Is $x^2 + x + 1$ irreducible over $\mathbb{Z}_2$?'
            answer: 'Yes: $f(0) = 1, f(1) = 1$ — no roots, and degree $\le 3$ without roots means irreducible.'
            answer_contract: {kind: none}
            solution_sketch: 'For degree 2 or 3, reducibility forces a linear factor, hence a root.'
          - problem: 'Factor $x^2 + 1$ over $\mathbb{Z}_5$.'
            answer: '$(x + 2)(x + 3)$ — equivalently $(x-2)(x-3)$.'
            answer_contract: {kind: none}
            solution_sketch: '$2^2 = 4 \equiv -1$ and $3^2 = 9 \equiv -1$, so $\pm 2$ are roots; check $(x+2)(x+3) = x^2 + 5x + 6 = x^2 + 1$.'
        constraints: "degree 2-3 over Z_2, Z_3, Z_5; the no-root criterion applies only up to degree 3"
      - id: kp2
        name: "Rational root theorem and factoring over Q"
        key_prerequisites: [polynomial-rings, factoring-trinomials, rational-root-theorem]
        exemplars:
          - problem: 'Using the rational root theorem, factor $2x^3 + x^2 - 7x - 6$ over $\mathbb{Q}$ completely.'
            answer: '$(x - 2)(x + 1)(2x + 3)$'
            solution_sketch: 'Candidates $\pm1, \pm2, \pm3, \pm6, \pm\tfrac12, \pm\tfrac32$; $x = 2$ works, divide to get $2x^2 + 5x + 3 = (x+1)(2x+3)$.'
          - problem: "State the factor type of x^3 - x + 1 over Q and give its number of rational roots."
            answer: "verdict = irreducible; roots = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["irreducible"], ["reducible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "roots"}]}
            solution_sketch: "Rational root theorem: any rational root of x^3 - x + 1 must be a divisor of 1 divided by a divisor of 1, so the candidates are 1 and -1. Evaluate at 1: 1 - 1 + 1 = 1, not zero. Evaluate at -1: -1 + 1 + 1 = 1, not zero. No candidate is a root, so the cubic has no rational roots. A cubic over Q with no rational root is irreducible, so the factor type is irreducible and the number of rational roots is 0. The option reducible is wrong because a reducible cubic over Q would have a rational root. The answer is verdict = irreducible; roots = 0."
          - problem: "Using the rational root theorem, factor x^3 - 2x^2 - 5x + 6 over Q completely. Give the factorization."
            answer: "(x-1)(x-3)(x+2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Rational root theorem: candidates for x^3 - 2x^2 - 5x + 6 are the divisors of 6 over the divisors of 1, so 1, -1, 2, -2, 3, -3, 6, -6. Test x = 1: 1 - 2 - 5 + 6 = 0, so x - 1 is a factor. Divide x^3 - 2x^2 - 5x + 6 by x - 1 to get x^2 - x - 6. Factor the quadratic by inspection: x^2 - x - 6 = (x - 3)(x + 2). The complete factorization is (x-1)(x-3)(x+2)."
          - problem: "Using the rational root theorem, factor 2x^3 - 3x^2 - 8x + 12 over Q completely. Give the factorization."
            answer: "(x-2)(2x-3)(x+2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Rational root theorem: candidates for 2x^3 - 3x^2 - 8x + 12 are divisors of 12 over divisors of 2, including 1, -1, 2, -2, 3, -3, 4, -4, 6, -6, 12, -12, 1/2, -1/2, 3/2, -3/2. Test x = 2: 16 - 12 - 16 + 12 = 0, so x - 2 is a factor. Divide 2x^3 - 3x^2 - 8x + 12 by x - 2 to get 2x^2 + x - 6. Factor the quadratic: 2x^2 + x - 6 = (2x - 3)(x + 2). The complete factorization is (x-2)(2x-3)(x+2)."
          - problem: "Using the rational root theorem, find the smallest rational root of x^3 - 4x^2 + x + 6."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rational root theorem: candidates for x^3 - 4x^2 + x + 6 are divisors of 6, so 1, -1, 2, -2, 3, -3, 6, -6. Test x = -1: -1 - 4 - 1 + 6 = 0, so -1 is a root. Divide to get x^2 - 5x + 6 = (x - 2)(x - 3), so the rational roots are -1, 2, and 3. The smallest rational root is -1."
          - problem: "Find how many rational roots the cubic x^3 + 2x + 1 has."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rational root theorem: candidates for x^3 + 2x + 1 are divisors of 1, so 1 and -1. Test x = 1: 1 + 2 + 1 = 4, not zero. Test x = -1: -1 - 2 + 1 = -2, not zero. No rational root exists, so the number of rational roots is 0."
        constraints: "cubics with integer coefficients, |coefficients| <= 10; complete factorizations verified by expansion"
      - id: kp3
        name: "Eisenstein's criterion and mod-p reduction"
        key_prerequisites: [polynomial-rings, prime-factorization]
        exemplars:
          - problem: 'Prove $x^5 + 6x + 3$ is irreducible over $\mathbb{Q}$.'
            answer: 'Eisenstein at $p = 3$: $3 \mid 6, 3$; $3 \nmid 1$; $9 \nmid 3$.'
            answer_contract: {kind: none}
            solution_sketch: 'Check the three Eisenstein conditions on $p = 3$.'
          - problem: 'Show $x^3 + x + 1$ is irreducible over $\mathbb{Q}$ by reducing mod $2$.'
            answer: 'Mod $2$ it has no roots ($f(0)=f(1)=1$), so it is irreducible in $\mathbb{Z}_2[x]$; irreducibility mod a prime (degree preserved) lifts to $\mathbb{Q}$.'
            answer_contract: {kind: none}
            solution_sketch: 'The mod-$p$ test: if the reduction (same degree) is irreducible over $\mathbb{Z}_p$, the original is irreducible over $\mathbb{Q}$.'
        constraints: "Eisenstein with p in {2, 3, 5}; mod-p test with p = 2, 3; degree <= 5"
    diagnostic_exemplar:
      problem: 'Decide whether each is irreducible over $\mathbb{Q}$: (a) $x^4 + 10x + 5$, (b) $x^2 - 9$.'
      answer: '(a) Irreducible by Eisenstein at $p = 5$ ($5 \mid 10, 5$; $5 \nmid 1$; $25 \nmid 5$). (b) Reducible: $(x-3)(x+3)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Eisenstein handles (a); (b) is a difference of squares.'
    anki_seeds:
      - front: "Eisenstein's criterion at prime $p$?"
        back: "$p$ divides every coefficient except the leading one, and $p^2$ does not divide the constant term $\\Rightarrow$ irreducible over $\\mathbb{Q}$."
        type: basic
      - front: "When does 'no roots' prove irreducibility over a field?"
        back: "Only for degree 2 or 3 (higher degrees can factor into two quadratics)."
        type: basic

  - id: prime-maximal-ideals
    name: "Prime and Maximal Ideals"
    core: false                # terminal ideal classification; the curriculum stops here
    difficulty: 0.80
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: quotient-rings
        weight: 0.9
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.7
        key: true
      - id: irreducibility-factorization
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Definitions and the quotient characterizations"
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'State the quotient characterizations of prime and maximal ideals in a commutative ring with unity.'
            answer: '$P$ prime $\iff R/P$ is an integral domain; $M$ maximal $\iff R/M$ is a field.'
            solution_sketch: '$ab \in P \Rightarrow a \in P$ or $b \in P$ translates to no zero divisors in $R/P$; maximality translates to no proper nonzero ideals in $R/M$, i.e. every nonzero coset invertible.'
          - problem: 'Every maximal ideal is prime. Why?'
            answer: 'Fields are integral domains, so $R/M$ a field forces $R/M$ a domain.'
            solution_sketch: 'Chain the two characterizations.'
        constraints: "statements and one-line derivations; commutative rings with unity"
      - id: kp2
        name: "Classifying prime/maximal ideals of Z and Z_n"
        key_prerequisites: [quotient-rings, integral-domains-zero-divisors]
        exemplars:
          - problem: 'Which ideals $n\mathbb{Z}$ of $\mathbb{Z}$ are prime? Which are maximal?'
            answer: 'Prime: $\{0\}$ and $p\mathbb{Z}$ for $p$ prime. Maximal: exactly $p\mathbb{Z}$, $p$ prime.'
            solution_sketch: '$\mathbb{Z}/n\mathbb{Z}$ is a domain iff $n = 0$ or $n$ prime, and a field iff $n$ prime.'
          - problem: 'Find all maximal ideals of $\mathbb{Z}_{12}$.'
            answer: '$\langle 2 \rangle = \{0,2,4,6,8,10\}$ and $\langle 3 \rangle = \{0,3,6,9\}$.'
            solution_sketch: 'Ideals of $\mathbb{Z}_{12}$ are $\langle d \rangle$ for $d \mid 12$; quotients $\mathbb{Z}_{12}/\langle d \rangle \cong \mathbb{Z}_d$ are fields exactly for $d = 2, 3$.'
        constraints: "Z and Z_n (n <= 24); justify via the quotient"
      - id: kp3
        name: "Prime but not maximal; polynomial examples"
        key_prerequisites: [quotient-rings]
        exemplars:
          - problem: "In Z[x]/<x>, the class of x^2+3x+7 corresponds to an integer under evaluation at 0. Give that integer."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evaluate at 0. The quotient map sends the class of x to 0. The class of x^2+3x+7 maps to 0^2+3*0+7 = 7. The answer is 7."
          - problem: "The polynomial x^2+x+1 is irreducible over F_2. Give the number of elements of F_2[x]/<x^2+x+1>."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Since x^2+x+1 is irreducible over F_2, the quotient ring is a field. A basis over F_2 is {1, x}, so each element has the form a + bx with a and b in F_2. There are 2 times 2 = 4 choices, so the field has 4 elements. The answer is 4."
          - problem: "How many roots does x^2+1 have in F_3?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test each element of F_3. For 0, 0^2+1=1; for 1, 1^2+1=2; for 2, 2^2+1=5=2. None gives 0, so the number of roots is 0. The answer is 0."
          - problem: "In F_5[x], the polynomial x^2+2 is irreducible. Give the number of elements of the quotient field F_5[x]/<x^2+2>."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check roots in F_5. Values 0 through 4 give 2, 3, 1, 1, 3, none zero. So x^2+2 is irreducible over F_5. The quotient field has 5^2=25 elements. The answer is 25."
          - problem: "Claim: <x> is maximal in Z[x]. Step 1: Z[x]/<x> is isomorphic to Z. Step 2: Z is an integral domain, so <x> is prime. Step 3: Z is a field, so <x> is maximal. Step 4: hence <x> is maximal. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because evaluation at 0 gives Z[x]/<x> isomorphic to Z. Step 2 is valid because Z is an integral domain, so <x> is prime. Step 3 is invalid because Z is not a field, so <x> is not maximal. Option Step 1 is wrong because it is a valid step; option Step 2 is wrong because it is a valid step; option Step 4 is wrong because it depends on the invalid Step 3. The answer is Step 3."
          - problem: "In F_2[x]/<x^2+x+1>, give the inverse of the class of x as a polynomial of degree at most 1."
            answer: "x+1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Work in F_2[x]/<x^2+x+1>. The class of x satisfies x^2+x+1=0, so x^2+x=1. Multiply x by x+1: x(x+1)=x^2+x=1. Thus x+1 is the inverse of the class of x. The answer is x+1."
          - problem: "Write the full proof: for a field F, a nonconstant polynomial f in F[x] gives a maximal ideal <f> if and only if f is irreducible; and <x> is prime but not maximal in Z[x]. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let F be a field and f a nonconstant polynomial. First, if <f> is maximal, then F[x]/<f> is a field, hence an integral domain, so <f> is prime. In F[x], a prime ideal is generated by an irreducible polynomial, so f is irreducible. Conversely, if f is irreducible, then F[x]/<f> is an integral domain. Since F[x] is a principal ideal domain, a nonzero prime ideal is maximal, or directly any ideal properly containing <f> is generated by a proper divisor of f, which must be a unit. Thus <f> is maximal. For Z[x], evaluate at 0 to get Z[x]/<x> isomorphic to Z. This quotient is an integral domain but not a field, so <x> is prime but not maximal."
        constraints: "quotient identifications in Z[x] and F[x]; irreducible <-> maximal in F[x]"
    diagnostic_exemplar:
      problem: 'Decide whether $\langle 5 \rangle$ is a prime ideal of $\mathbb{Z}[x]$, and whether it is maximal. Justify both answers by identifying the quotient.'
      answer: 'Reducing coefficients mod $5$ gives $\mathbb{Z}[x]/\langle 5 \rangle \cong \mathbb{Z}_5[x]$. Since $\mathbb{Z}_5$ is a field, $\mathbb{Z}_5[x]$ is an integral domain, so $\langle 5 \rangle$ is prime. It is not maximal: $\mathbb{Z}_5[x]$ is not a field, because $x$ has no inverse (degrees add under multiplication). Equivalently $\langle 5 \rangle \subsetneq \langle 5, x \rangle \subsetneq \mathbb{Z}[x]$, so $\langle 5 \rangle$ is prime but not maximal.'
      solution_sketch: 'Use the quotient characterisations — prime iff the quotient is a domain, maximal iff it is a field — after identifying the quotient as $\mathbb{Z}_5[x]$.'
    anki_seeds:
      - front: "$P$ prime iff $R/P$ is a(n) ______; $M$ maximal iff $R/M$ is a(n) ______."
        back: "Integral domain; field."
        type: basic
      - front: "In $F[x]$ ($F$ a field), $\\langle f \\rangle$ is maximal iff..."
        back: "$f$ is irreducible over $F$."
        type: basic
      - front: "Example of a prime ideal that is not maximal?"
        back: "$\\langle x \\rangle$ in $\\mathbb{Z}[x]$ (quotient $\\mathbb{Z}$: domain, not field); also $\\{0\\}$ in $\\mathbb{Z}$."
        type: basic

  - id: euclidean-domains-pids
    name: "Euclidean Domains and Principal Ideal Domains"
    core: false                # terminal factorization-theory branch; nothing downstream consumes it (splitting fields rest on irreducibility-factorization, not PID theory)
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: ring-homomorphisms-ideals
        weight: 0.8
        key: true
      - id: polynomial-rings
        weight: 0.6
        key: true
      - id: integral-domains-zero-divisors
        weight: 0.5
        key: false
      - id: euclidean-algorithm
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Euclidean norms; division in Z[i]"
        key_prerequisites: [integral-domains-zero-divisors, complex-numbers]
        exemplars:
          - problem: 'A Euclidean domain carries a norm allowing division with smaller remainder. In the Gaussian integers $\mathbb{Z}[i]$ with $N(a + bi) = a^2 + b^2$, compute $N(3 + 2i)$.'
            answer: "13"
            solution_sketch: '$N(3 + 2i) = 3^2 + 2^2 = 13$. ($N$ is multiplicative: $N(zw) = N(z)N(w)$.)'
          - problem: "In the Gaussian integers Z[i] with norm N(a+bi)=a^2+b^2, let z = (5+2i)(1+4i). Compute N(z)."
            answer: "493"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (norm multiplicativity): N(zw) = N(z)N(w), so N(z) = N(5+2i)N(1+4i). Step 2 (compute each norm): N(5+2i) = 25+4 = 29 and N(1+4i) = 1+16 = 17. Step 3 (multiply): 29*17 = 493. The answer is 493."
          - problem: "In the Gaussian integers Z[i] with norm N(a+bi)=a^2+b^2, write 8+7i = (3+i)q + r with N(r) < N(3+i). Find q and r."
            answer: "q = 3+i; r = i"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "q"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Step 1 (exact quotient): (8+7i)/(3+i) = (8+7i)(3-i)/10 = (31+13i)/10 = 3.1+1.3i. Step 2 (round to the nearest Gaussian integer): q = 3+i. Step 3 (remainder): r = 8+7i - (3+i)(3+i) = 8+7i - (8+6i) = i, and N(i) = 1 < 10 = N(3+i). The answer is q = 3+i; r = i."
          - problem: "In Q[x] with the degree norm, divide x^3+3x^2+5 by x+2. Find the remainder r(x)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (remainder theorem): the remainder of f(x) upon division by x+2 is f(-2). Step 2 (evaluate): f(-2) = (-2)^3 + 3(-2)^2 + 5 = -8 + 12 + 5 = 9. Step 3 (check the norm): deg(9) = 0 < 1 = deg(x+2), so the division is valid. The answer is 9."
          - problem: "In Z with the norm N(a) = abs(a), write -13 = 4q + r with abs(r) < 4. Find q and r."
            answer: "q = -4; r = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "q"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Step 1 (choose the quotient): we need -13 = 4q + r with abs(r) < 4, so pick the nearest multiple of 4: q = -4. Step 2 (compute the remainder): r = -13 - 4(-4) = -13 + 16 = 3. Step 3 (check the norm condition): abs(3) = 3 < 4 = abs(4). The answer is q = -4; r = 3."
          - problem: "In the Gaussian integers Z[i] with norm N(a+bi)=a^2+b^2, write 6+5i = (2+3i)q + r with N(r) < N(2+3i). Find q and r."
            answer: "q = 2-i; r = -1+i"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "q"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Step 1 (exact quotient): (6+5i)/(2+3i) = (6+5i)(2-3i)/13 = (27-8i)/13, which is about 2.08 - 0.62i. Step 2 (round each coordinate): q = 2 - i. Step 3 (remainder): r = 6+5i - (2+3i)(2-i) = 6+5i - (7+4i) = -1+i, and N(-1+i) = 2 < 13 = N(2+3i). The answer is q = 2-i; r = -1+i."
        constraints: "norms and one-step divisions in Z[i] with parts |a|, |b| <= 8; the degree norm on F[x] cited from polynomial-rings; Z with absolute value as the base example"
      - id: kp2
        name: "Every Euclidean domain is a PID"
        key_prerequisites: [ring-homomorphisms-ideals, euclidean-algorithm]
        exemplars:
          - problem: 'Find a single generator of the ideal $\langle x^2 - 1,\ x^2 - 3x + 2 \rangle$ in $\mathbb{Q}[x]$.'
            answer: '$x - 1$'
            solution_sketch: '$x^2 - 1 = (x-1)(x+1)$ and $x^2 - 3x + 2 = (x-1)(x-2)$; the ideal is generated by their gcd $x - 1$ (obtained by the Euclidean algorithm in $\mathbb{Q}[x]$).'
          - problem: "Find a single generator of the ideal generated by x^2 - x - 2 and x^2 + x - 6 in Q[x]."
            answer: "x - 2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The ideal is generated by x^2 - x - 2 and x^2 + x - 6 in Q[x]. Step 1: factor both, giving (x - 2)(x + 1) and (x - 2)(x + 3). Step 2: the common factor is x - 2, so the polynomial gcd is x - 2. Therefore a single generator is x - 2."
          - problem: "Find a single generator of the ideal generated by x^2 + 3x - 4 and x^2 + 6x + 8 in Q[x]."
            answer: "x + 4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The ideal is generated by x^2 + 3x - 4 and x^2 + 6x + 8 in Q[x]. Step 1: factor both, giving (x + 4)(x - 1) and (x + 4)(x + 2). Step 2: the common factor is x + 4, so the polynomial gcd is x + 4. Therefore a single generator is x + 4."
          - problem: "Find a single generator of the ideal generated by x^3 + x^2 + x + 1 and x^3 - 2x^2 + x - 2 in Q[x]."
            answer: "x^2 + 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The ideal is generated by x^3 + x^2 + x + 1 and x^3 - 2x^2 + x - 2 in Q[x]. Step 1: factor the first as (x + 1)(x^2 + 1) and the second as (x - 2)(x^2 + 1). Step 2: the common factor is x^2 + 1, so the polynomial gcd is x^2 + 1. Therefore a single generator is x^2 + 1."
          - problem: "Find a single generator of the ideal generated by x^2 - 25 and x^2 - 3x - 10 in Q[x]."
            answer: "x - 5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The ideal is generated by x^2 - 25 and x^2 - 3x - 10 in Q[x]. Step 1: factor both, giving (x - 5)(x + 5) and (x - 5)(x + 2). Step 2: the common factor is x - 5, so the polynomial gcd is x - 5. Therefore a single generator is x - 5."
          - problem: "In the proof that a Euclidean domain is a PID, an ideal I has a nonzero element d of minimal norm. For the ideal generated by x^3 - x and x^2 - 1 in Q[x], with norm equal to degree, what is the degree of such a d?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ideal is generated by x^3 - x and x^2 - 1 in Q[x]. Step 1: factor x^3 - x as x(x - 1)(x + 1) and x^2 - 1 as (x - 1)(x + 1). Step 2: the polynomial gcd is x^2 - 1, so a generator of minimal degree is x^2 - 1. Step 3: the degree of that generator is 2. The degree is 2."
        constraints: "the minimal-norm proof; generators of two-element ideals in Q[x] via polynomial gcd, degrees <= 3"
      - id: kp3
        name: "PIDs vs non-PIDs: the ideal <2, x>"
        key_prerequisites: [ring-homomorphisms-ideals, polynomial-rings]
        exemplars:
          - problem: "In Z[x], suppose the ideal <2,x> is principal with generator f. Then f must divide both 2 and x. How many common divisors of 2 and x are there in Z[x]?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (generator property): a generator f of <2,x> must divide 2 and x. Step 2 (divisibility in Z[x]): a common divisor of the constant 2 must be one of the constants 1, -1, 2, -2. Step 3 (test x): the constants 2 and -2 do not divide x, since 2g = x would force g = x/2, which is not in Z[x]. Only 1 and -1 remain. The answer is 2."
          - problem: "Consider the four rings listed in the options. Which of them fails to be a principal ideal domain?"
            answer: "Z[x]"
            answer_contract: {"kind": "label", "options": [["Z[x]"], ["Q[x]"], ["R[x]"], ["C[x]"]]}
            solution_sketch: "Step 1 (Euclidean implies PID): Q[x], R[x] and C[x] are polynomial rings over fields, Euclidean with the degree as size, so each is a PID. Step 2 (classify Z[x]): in Z[x] the ideal <2,x> of polynomials with even constant term has no single generator, so it is not principal. Wrong options: choosing Q[x], R[x] or C[x] overlooks that a field coefficient ring makes the polynomial ring Euclidean, while only the integer coefficient ring breaks this. The answer is Z[x]."
          - problem: "In Z[x], suppose a polynomial f generates the ideal <2,x>. Since f must divide 2, f can only be a divisor of the constant polynomial 2. How many divisors of 2 are there in Z[x]?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (generator property): a generator of <2,x> must divide the constant 2. Step 2 (divisor bound): any divisor of 2 has degree at most 0, so it is a constant; the constant divisors in Z[x] are 1, -1, 2, -2. Step 3 (count): this gives four divisors total. The answer is 4."
          - problem: "In the quotient ring Z[x]/<2,x>, imposing the relations 2 = 0 and x = 0 leaves only the constant term, taken mod 2. Which of the constants 0 and 1 is the class of 9 + 4x + 6x^2 equal to?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (ideal structure): <2,x> is exactly the ideal of polynomials with even constant term, so the quotient identifies a polynomial with its constant term mod 2. Step 2 (reduce): the constant term of 9 + 4x + 6x^2 is 9, and 9 mod 2 = 1. The answer is 1."
          - problem: "Work in Z[x] with the ideal <3,x>. State whether <3,x> is principal, and give the number of elements of the quotient ring Z[x]/<3,x>."
            answer: "verdict = nonprincipal; size = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["principal"], ["nonprincipal"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "size"}]}
            solution_sketch: "Step 1 (candidate generator): if <3,x> were principal with generator f, then f would divide both 3 and x, so f would be one of 1, -1 (the constants 3 and -3 fail to divide x). Step 2 (contradiction): a unit generator makes the ideal the whole ring, but <3,x> is proper since every element has constant term divisible by 3; hence the ideal is nonprincipal. Step 3 (quotient): the evaluation map Z[x] to Z/3Z sending x to 0 has kernel exactly <3,x>, so the quotient has 3 elements. The answer is verdict = nonprincipal; size = 3."
          - problem: "In Z[x], consider the ideal <2,x>. Find the smallest number of elements needed to generate <2,x> as an ideal."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (upper bound): the two elements 2 and x generate <2,x> by definition, so two generators suffice. Step 2 (no single generator): a generator f would divide 2, forcing f in {1, -1, 2, -2}; the constants 2 and -2 do not divide x, and the units 1 and -1 would generate the whole ring, while <2,x> is proper since all its elements have even constant term. Step 3 (conclusion): no one-element generating set exists, so the minimum is 2. The answer is 2."
        constraints: "classify Z, F[x], Z[x], fields; the <2, x> argument reproduced, not just quoted"
    diagnostic_exemplar:
      problem: 'Show that the ideal $\langle 3, x \rangle$ of $\mathbb{Z}[x]$ is not principal, and explain why no ideal of $\mathbb{Q}[x]$ can fail in this way.'
      answer: 'First, $\langle 3, x \rangle = \{p \in \mathbb{Z}[x] : 3 \mid p(0)\}$, a proper ideal since $1 \notin$ it. Suppose $\langle 3, x\rangle = \langle f \rangle$. Then $f \mid 3$, so $f$ is a constant $\pm 1$ or $\pm 3$. If $f = \pm 1$ the ideal would be all of $\mathbb{Z}[x]$, contradicting properness; if $f = \pm 3$ then $f \nmid x$ (that would need $3$ to divide the coefficient $1$), contradicting $x \in \langle f \rangle$. So no single generator exists. In $\mathbb{Q}[x]$ this cannot happen: division with remainder by degree makes $\mathbb{Q}[x]$ a Euclidean domain, and in a Euclidean domain a nonzero element of least norm in an ideal generates it — every Euclidean domain is a PID.'
      answer_contract: {kind: none}
      solution_sketch: 'Describe the ideal concretely, then rule out both candidate generators. The contrast: $\mathbb{Q}[x]$ has a degree norm with division, so a least-degree element of any ideal generates it.'
    anki_seeds:
      - front: "Euclidean domain?"
        back: "An integral domain with a norm allowing division with remainder: $a = qb + r$ with $r = 0$ or $N(r) < N(b)$."
        type: basic
      - front: "Euclidean domain $\\Rightarrow$ PID — proof idea?"
        back: "A minimal-norm element of an ideal generates it (division leaves a smaller remainder inside the ideal, which must be 0)."
        type: basic
      - front: "Standard example of a non-principal ideal?"
        back: "$\\langle 2, x \\rangle$ in $\\mathbb{Z}[x]$ — the polynomials with even constant term."
        type: basic

  - id: unique-factorization-domains
    name: "Unique Factorization Domains"
    core: false                # terminal factorization-theory branch; nothing downstream consumes it
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: euclidean-domains-pids
        weight: 0.8
        key: true
      - id: irreducibility-factorization
        weight: 0.6
        key: true
      - id: prime-factorization
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Irreducible vs prime elements"
        key_prerequisites: [irreducibility-factorization, euclidean-domains-pids]
        exemplars:
          - problem: 'Define irreducible and prime elements of an integral domain, and prove that every prime element is irreducible.'
            answer: '$p$ (nonzero, non-unit) is prime if $p \mid ab \implies p \mid a$ or $p \mid b$; irreducible if $p = ab \implies a$ or $b$ is a unit. If $p = ab$, then $p \mid ab$, say $p \mid a$: $a = pc$ gives $p = pcb$, so $cb = 1$ (cancellation) and $b$ is a unit.'
            answer_contract: {kind: none}
            solution_sketch: 'Apply the prime property to the factorization itself, then cancel $p$ in the domain.'
          - problem: 'In $\mathbb{Z}[\sqrt{-5}]$ with $N(a + b\sqrt{-5}) = a^2 + 5b^2$, show that $2$ is irreducible.'
            answer: 'If $2 = xy$ with $x, y$ non-units, then $N(x)N(y) = N(2) = 4$ with $N(x) = N(y) = 2$; but $a^2 + 5b^2 = 2$ has no integer solutions. So no such factorization exists.'
            answer_contract: {kind: none}
            solution_sketch: 'Norms are multiplicative and units have norm $1$; rule out the middle norm value.'
        constraints: "norm arguments in Z[sqrt(-5)] and Z[i], norms <= 30; the prime => irreducible proof with cancellation cited"
      - id: kp2
        name: "UFDs and factoring in Z[i]"
        key_prerequisites: [euclidean-domains-pids, prime-factorization]
        exemplars:
          - problem: 'State the UFD property and the chain of implications relating Euclidean domains, PIDs, and UFDs.'
            answer: 'A UFD is a domain where every nonzero non-unit factors into irreducibles, uniquely up to order and unit factors. Euclidean $\Rightarrow$ PID $\Rightarrow$ UFD (each implication strict).'
            answer_contract: {kind: none}
            solution_sketch: 'The chain may be quoted; $\mathbb{Z}$, $F[x]$, $\mathbb{Z}[i]$ are the working examples, $\mathbb{Z}[x]$ a UFD that is not a PID.'
          - problem: 'Factor $5$ into irreducibles in $\mathbb{Z}[i]$.'
            answer: '$5 = (2 + i)(2 - i)$'
            answer_contract: {kind: none}
            solution_sketch: 'Both factors have norm $5$, and a norm-$5$ element is irreducible (a proper factor would need norm $\sqrt5$-impossible: norms multiply and $5$ is prime in $\mathbb{Z}$).'
        constraints: "factorizations in Z[i] with norms <= 25; irreducibility certified by prime norms; the implication chain quoted, not proved"
      - id: kp3
        name: "Failure of unique factorization: Z[sqrt(-5)]"
        key_prerequisites: [irreducibility-factorization, euclidean-domains-pids]
        exemplars:
          - problem: "In Z[sqrt(-5)], use the norm N(a + b sqrt(-5)) = a^2 + 5b^2. Decide whether the element 2 can be written as a product of two nonunits, and give its norm. Give the answer as verdict and N, with the verdict first."
            answer: "verdict = irreducible; N = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["irreducible"], ["reducible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "N"}]}
            solution_sketch: "Step 1 (norm formula): In Z[sqrt(-5)], take the element 2, whose norm is N(2) = 2^2 + 5*0^2 = 4. Step 2 (norm multiplicativity): If 2 = xy with x and y nonunits, then N(x)N(y) = N(2) = 4. Step 3 (rule out norm 2 factors): Nonunits have norm greater than 1, so both factors would need norm 2, but a^2 + 5b^2 = 2 has no integer solution. Step 4 (conclusion): Therefore 2 has no proper factorization into nonunits, so the verdict is irreducible and N = 4. The wrong option reducible would require a norm 2 factor, which is impossible. The answer is verdict = irreducible; N = 4."
          - problem: "In Z[sqrt(-5)], use the norm N(a + b sqrt(-5)) = a^2 + 5b^2. The element 2 divides (1 + sqrt(-5))(1 - sqrt(-5)) but divides neither factor. Decide what this says about 2 as a divisor, and give the norm of 2. Give the answer as verdict and N, with the verdict first."
            answer: "verdict = nonprime; N = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["prime"], ["nonprime"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "N"}]}
            solution_sketch: "Step 1 (norm formula): N(2) = 4 and N(1 + sqrt(-5)) = N(1 - sqrt(-5)) = 6. Step 2 (divisibility test): If 2 divided 1 + sqrt(-5), then 4 would divide 6 by norm multiplicativity, which is false; the same holds for 1 - sqrt(-5). Step 3 (product divisibility): Yet 2*3 = 6 = (1 + sqrt(-5))(1 - sqrt(-5)), so 2 divides the product without dividing either factor. Step 4 (conclusion): This is exactly the failure of the prime property, so the verdict is nonprime and N = 4. The wrong option prime would require 2 to divide one of the factors. The answer is verdict = nonprime; N = 4."
          - problem: "In Z[sqrt(-5)], use the norm N(a + b sqrt(-5)) = a^2 + 5b^2. What is the norm of 3 + 2 sqrt(-5)?"
            answer: "29"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (norm formula): For an element a + b sqrt(-5), the norm is N(a + b sqrt(-5)) = a^2 + 5b^2. Step 2 (substitution): Here a = 3 and b = 2, so N(3 + 2 sqrt(-5)) = 3^2 + 5*2^2. Step 3 (arithmetic): This equals 9 + 20 = 29. The answer is 29."
          - problem: "In Z[sqrt(-5)], use the norm N(a + b sqrt(-5)) = a^2 + 5b^2. Compute the norms of 2, 3, 1 + sqrt(-5), and 1 - sqrt(-5). Give the answer as a comma-separated list in that order."
            answer: "4, 9, 6, 6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (norm formula): Compute each norm using N(a + b sqrt(-5)) = a^2 + 5b^2. Step 2 (individual norms): N(2) = 4, N(3) = 9, N(1 + sqrt(-5)) = 1^2 + 5*1^2 = 6, and N(1 - sqrt(-5)) = 6. Step 3 (order): In the order 2, 3, 1 + sqrt(-5), 1 - sqrt(-5), the list is 4, 9, 6, 6. The answer is 4, 9, 6, 6."
          - problem: "In Z[sqrt(-5)], use the norm N(a + b sqrt(-5)) = a^2 + 5b^2. How many elements of the form a + b sqrt(-5) have norm 6?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (norm equation): Elements of norm 6 satisfy a^2 + 5b^2 = 6 with a and b integers. Step 2 (cases): If b = 0, then a^2 = 6, impossible; if b = 1 or b = -1, then a^2 = 1, so a = 1 or a = -1. Step 3 (count): This gives four elements: 1 + sqrt(-5), 1 - sqrt(-5), -1 + sqrt(-5), and -1 - sqrt(-5). The answer is 4."
          - problem: "In Z[sqrt(-5)], the element 6 has the two factorizations 2*3 and (1 + sqrt(-5))(1 - sqrt(-5)). Decide whether these two factorizations make 6 have a unique factorization, and give the norm of 2. Give the answer as verdict and N, with the verdict first."
            answer: "verdict = non-UFD; N = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["UFD"], ["non-UFD"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "N"}]}
            solution_sketch: "Step 1 (norms of the factors): N(2) = 4, N(3) = 9, and N(1 + sqrt(-5)) = N(1 - sqrt(-5)) = 6. Step 2 (irreducibility): A proper factor would need norm 2 or 3, but a^2 + 5b^2 never equals 2 or 3, so all four factors are irreducible. Step 3 (non-associates): Units are ±1; associates have equal norm, and the norms 4, 9, 6, 6 rule out unit multiples across the two factorizations. Step 4 (conclusion): Thus 6 has two essentially different irreducible factorizations, so the verdict is non-UFD and N = 4. The wrong option UFD would require these factorizations to match up to units, which the norms forbid. The answer is verdict = non-UFD; N = 4."
        constraints: "the classic Z[sqrt(-5)] computation; every irreducibility claim justified by a norm argument"
    diagnostic_exemplar:
      problem: 'In $\mathbb{Z}[\sqrt{-5}]$ with norm $N(a + b\sqrt{-5}) = a^2 + 5b^2$, show that $3$ is irreducible but not prime, and state what this proves about $\mathbb{Z}[\sqrt{-5}]$.'
      answer: 'Irreducible: if $3 = xy$ with $x, y$ non-units then $N(x)N(y) = N(3) = 9$ with $N(x) = N(y) = 3$ (the units are exactly the elements of norm $1$); but $a^2 + 5b^2 = 3$ has no integer solution, since $b = 0$ would force $a^2 = 3$ and $|b| \ge 1$ makes the norm at least $5$. Not prime: $3 \mid 6 = (1 + \sqrt{-5})(1 - \sqrt{-5})$, yet $3$ divides neither factor, because $N(3) = 9$ does not divide $N(1 \pm \sqrt{-5}) = 6$. In a UFD irreducible and prime elements coincide, so $\mathbb{Z}[\sqrt{-5}]$ is not a UFD.'
      answer_contract: {kind: none}
      solution_sketch: 'Norms are multiplicative and units are exactly the norm-$1$ elements. Rule out a factor of norm $3$, then exhibit a product that $3$ divides without dividing either factor.'
    anki_seeds:
      - front: "Chain: Euclidean, PID, UFD?"
        back: "Euclidean $\\Rightarrow$ PID $\\Rightarrow$ UFD; both implications are strict ($\\mathbb{Z}[x]$: UFD, not PID)."
        type: basic
      - front: "Prime vs irreducible in a general domain?"
        back: "Prime $\\Rightarrow$ irreducible always; the converse holds in UFDs but fails in e.g. $\\mathbb{Z}[\\sqrt{-5}]$."
        type: basic
      - front: "Classic witness that $\\mathbb{Z}[\\sqrt{-5}]$ is not a UFD?"
        back: "$6 = 2 \\cdot 3 = (1+\\sqrt{-5})(1-\\sqrt{-5})$, all factors irreducible, none associate."
        type: basic
